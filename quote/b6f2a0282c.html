</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-52baa4154a" data-kw="">
<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law. 3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty. 4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things. 5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie. 6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one. 7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know: 1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such. 2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause. 3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechizing of Families... (London, 1683), ch. 42, ‘Of the 9th Commandment’</cite>, pp. 361-62</span></figcaption>

<blockquote><p>Seventhly, are any of the Reformed Churches or any Churches or persons of the whole world so injurious to magistrates as their principles [that of the New England Independents, such as John Cotton] force them to be, who spoil Christian kings and parliaments of their whole legislative power? They will have us to believe, as good divinity, that it is not only unlawful for Church-assemblies to make ecclesiastic canons, but that it is alike unlawful for any prince or State to make a civil law, that the placing of a legislative power in kings or parliaments, is to usurp the property and prerogative of God. These principles cannot be very favorable to the State, which at one stroke annihilate all the acts of Parliament that now are in force, either in this or any other kingdom, and make it impossible (if they were believed) to have any more in any place of the earth, to the world’s end. Look back upon what I have cited from the chief of the Brownists’ writings. I grant the New English polishers of Brownism do not express their tenets in terms so hugely gross; yet see how near they come to them in substance, when they tell us that no magistrate may make any Laws about the bodies, lands, goods, liberties of the subject, which are not according to the laws and rules of Scripture, Scripture being given to men for a perfect rule, as well in matters of civil justice, as of devotion and holiness; and if so, then they must make it as unlawful and contrary to the Scripture’s perfection, for any man to make laws in matters of righteousness and of the State, as in matters of holiness and of the Church. That beside things in themselves good or evil, which Scripture determines by its laws expressly, things of an indifferent nature, whereupon the most of civil laws are made, must be regulated according to the Scripture rules of piety, charity, and conscience, so far that the expediency and reason of the law must ever carry and convince the conscience of the subject: that no man is obliged to the obedience of a civil Law in a thing never so indifferent by the authority of the lawgiver, but every man whose conscience is not convinced of the piety and charity of that Law, is free from all obedience and subjection thereto: Thus far Mr. Cotton.¹ ¹ Cotton’s Model of Power in The Bloody Tenet, p. 140. “The magistrate in making laws about civil and indifferent things in the commonwealth; First, he has no power given him of God to make what laws he pleases, either in restraining from or constraining to the use of indifferent things; because that which is indifferent in its nature, may sometimes be inexpedient in its use, and consequently unlawful: it is a prerogative proper to God to require obedience of the sons of men, because of his authority and will. It is an evil speech in some, that in some things the will of the law, not the reason of it, must be the rule of conscience to walk by: and that princes may forbid men to seek any other reason but their authority, yea when they command men frivola &amp; dura; and therefore it is the duty of the magistrate in all laws about indifferent things, to show the reasons, not only the will; to show the expediency as well as the indifferency of things of that nature; and because the judgement of expedient and inexpedient things, is often difficult and diverse, it is meet that such laws should not proceed without due consideration of the rules of expediency set down in the Word, which are these three: First, the rule of piety, that they may make for the glory of God, 1 Cor. 10:31. Secondly, the rule of charity, that no scandal come thereby to any weak brother, 1 Cor. 8:13. Thirdly, the rule of charity, that no man be forced to submit against his conscience, Rom. 14:14,23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (London: 1645)</cite>, pp. 127-28</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Seventhly, are any of the Reformed Churches or any Churches or persons of the whole world so injurious to magistrates as their principles [that of the New England Independents, such as John Cotton] force them to be, who spoil Christian kings and parliaments of their whole legislative power? They will have us to believe, as good divinity, that it is not only unlawful for Church-assemblies to make ecclesiastic canons, but that it is alike unlawful for any prince or State to make a civil law, that the placing of a legislative power in kings or parliaments, is to usurp the property and prerogative of God. These principles cannot be very favorable to the State, which at one stroke annihilate all the acts of Parliament that now are in force, either in this or any other kingdom, and make it impossible (if they were believed) to have any more in any place of the earth, to the world’s end. Look back upon what I have cited from the chief of the Brownists’ writings. I grant the New English polishers of Brownism do not express their tenets in terms so hugely gross; yet see how near they come to them in substance, when they tell us that no magistrate may make any Laws about the bodies, lands, goods, liberties of the subject, which are not according to the laws and rules of Scripture, Scripture being given to men for a perfect rule, as well in matters of civil justice, as of devotion and holiness; and if so, then they must make it as unlawful and contrary to the Scripture’s perfection, for any man to make laws in matters of righteousness and of the State, as in matters of holiness and of the Church. That beside things in themselves good or evil, which Scripture determines by its laws expressly, things of an indifferent nature, whereupon the most of civil laws are made, must be regulated according to the Scripture rules of piety, charity, and conscience, so far that the expediency and reason of the law must ever carry and convince the conscience of the subject: that no man is obliged to the obedience of a civil Law in a thing never so indifferent by the authority of the lawgiver, but every man whose conscience is not convinced of the piety and charity of that Law, is free from all obedience and subjection thereto: Thus far Mr. Cotton.¹ ¹ Cotton’s Model of Power in The Bloody Tenet, p. 140. “The magistrate in making laws about civil and indifferent things in the commonwealth; First, he has no power given him of God to make what laws he pleases, either in restraining from or constraining to the use of indifferent things; because that which is indifferent in its nature, may sometimes be inexpedient in its use, and consequently unlawful: it is a prerogative proper to God to require obedience of the sons of men, because of his authority and will. It is an evil speech in some, that in some things the will of the law, not the reason of it, must be the rule of conscience to walk by: and that princes may forbid men to seek any other reason but their authority, yea when they command men frivola &amp; dura; and therefore it is the duty of the magistrate in all laws about indifferent things, to show the reasons, not only the will; to show the expediency as well as the indifferency of things of that nature; and because the judgement of expedient and inexpedient things, is often difficult and diverse, it is meet that such laws should not proceed without due consideration of the rules of expediency set down in the Word, which are these three: First, the rule of piety, that they may make for the glory of God, 1 Cor. 10:31. Secondly, the rule of charity, that no scandal come thereby to any weak brother, 1 Cor. 8:13. Thirdly, the rule of charity, that no man be forced to submit against his conscience, Rom. 14:14,23.”

— Robert Baillie, A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (London: 1645), pp. 127-28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSeventhly%2C+are+any+of+the+Reformed+Churches+or+any+Churches+or+persons+of+the+whole+world+so+injurious+to+magistrates+as+their+principles+%5Bthat+of+the+New+England+Independents%2C+such+as+John+Cotton%5D+force+them+to+be%2C+who+spoil+Christian+kings+and+parliaments+of+their+whole+legislative+power%3F+They+will+have+us+to+believe%2C+as+good+divinity%2C+that+it+is+not+only+unlawful+for+Church-assemblies+to+make+ecclesiastic+canons%2C+but+that+it+is+alike+unlawful+for+any+prince+or+State+to+make+a+civil+law%2C+that+the+placing+of+a+legislative+power+in+kings+or+parliaments%2C+is+to+usurp+the+property+and+prerogative+of+God.+These+principles+cannot+be+very+favorable+to+the+State%2C+which+at+one+stroke+annihilate+all+the+acts+of+Parliament+that+now+are+in+force%2C+either+in+this+or+any+other+kingdom%2C+and+make+it+impossible+%28if+they+were+believed%29+to+have+any+more+in+any+place+of+the+earth%2C+to+the+world%E2%80%99s+end.+Look+back+upon+what+I+have+cited+from+the+chief+of+the+Brownists%E2%80%99+writings.+I+grant+the+New+English+polishers+of+Brownism+do+not+express+their+tenets+in+terms+so+hugely+gross%3B+yet+see+how+near+they+come+to+them+in+substance%2C+when+they+tell+us+that+no+magistrate+may+make+any+Laws+about+the+bodies%2C+lands%2C+goods%2C+liberties+of+the+subject%2C+which+are+not+according+to+the+laws+and+rules+of+Scripture%2C+Scripture+being+given+to+men+for+a+perfect+rule%2C+as+well+in+matters+of+civil+justice%2C+as+of+devotion+and+holiness%3B+and+if+so%2C+then+they+must+make+it+as+unlawful+and+contrary+to+the+Scripture%E2%80%99s+perfection%2C+for+any+man+to+make+laws+in+matters+of+righteousness+and+of+the+State%2C+as+in+matters+of+holiness+and+of+the+Church.+That+beside+things+in+themselves+good+or+evil%2C+which+Scripture+determines+by+its+laws+expressly%2C+things+of+an+indifferent+nature%2C+whereupon+the+most+of+civil+laws+are+made%2C+must+be+regulated+according+to+the+Scripture+rules+of+piety%2C+charity%2C+and+conscience%2C+so+far+that+the+expediency+and+reason+of+the+law+must+ever+carry+and+convince+the+conscience+of+the+subject%3A+that+no+man+is+obliged+to+the+obedience+of+a+civil+Law+in+a+thing+never+so+indifferent+by+the+authority+of+the+lawgiver%2C+but+every+man+whose+conscience+is+not+convinced+of+the+piety+and+charity+of+that+Law%2C+is+free+from+all+obedience+and+subjection+thereto%3A+Thus+far+Mr.+Cotton.%C2%B9+%C2%B9+Cotton%E2%80%99s+Model+of+Power+in+The+Bloody+Tenet%2C+p.+140.+%E2%80%9CThe+magistrate+in+making+laws+about+civil+and+indifferent+things+in+the+commonwealth%3B+First%2C+he+has+no+power+given+him+of+God+to+make+what+laws+he+pleases%2C+either+in+restraining+from+or+constraining+to+the+use+of+indifferent+things%3B+because+that+which+is+indifferent+in+its+nature%2C+may+sometimes+be+inexpedient+in+its+use%2C+and+consequently+unlawful%3A+it+is+a+prerogative+proper+to+God+to+require+obedience+of+the+sons+of+men%2C+because+of+his+authority+and+will.+It+is+an+evil+speech+in+some%2C+that+in+some+things+the+will+of+the+law%2C+not+the+reason+of+it%2C+must+be+the+rule+of+conscience+to+walk+by%3A+and+that+princes+may+forbid+men+to+seek+any+other+reason+but+their+authority%2C+yea+when+they+command+men+frivola+%26+dura%3B+and+therefore+it+is+the+duty+of+the+magistrate+in+all+laws+about+indifferent+things%2C+to+show+the+reasons%2C+not+only+the+will%3B+to+show+the+expediency+as+well+as+the+indifferency+of+things+of+that+nature%3B+and+because+the+judgement+of+expedient+and+inexpedient+things%2C+is+often+difficult+and+diverse%2C+it+is+meet+that+such+laws+should+not+proceed+without+due+consideration+of+the+rules+of+expediency+set+down+in+the+Word%2C+which+are+these+three%3A+First%2C+the+rule+of+piety%2C+that+they+may+make+for+the+glory+of+God%2C+1+Cor.+10%3A31.+Secondly%2C+the+rule+of+charity%2C+that+no+scandal+come+thereby+to+any+weak+brother%2C+1+Cor.+8%3A13.+Thirdly%2C+the+rule+of+charity%2C+that+no+man+be+forced+to+submit+against+his+conscience%2C+Rom.+14%3A14%2C23.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+A+Dissuasive+from+the+Errors+of+the+Time%2C+wherein+the+Tenets+of+the+Principal+Sects%2C+Especially+of+the+Independents%2C+are+Drawn+Together+in+One+Map+%28London%3A+1645%29%2C+pp.+127-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4cd6764ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e4cd6764ff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=Seventhly%2C%20are%20any%20of%20the%20Reformed,submit%20against%20his%20conscience%2C%20Rom.%2014%3A14%2C23." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

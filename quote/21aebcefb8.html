<blockquote><p>2. From the nature of the promises. The promises of gospel grace and the remission of sins, through the reconciliation of Christ, are to be so believed by us as to afford firm and solid consolation: but unless I in particular believe that I am reconciled, and that I am absolved from sins, they cannot yield this consolation. The former is evident, because the very end of gospel grace and of the divine promises is, that we may have strong consolation, Heb. vi. 18.

But that general faith of the Papists, that every one who believes truly and lives piously, hath remission of sins; or that conditional faith, I, if I am faithful, am in the grace of God, does not yield strong consolation, because it may consist with despair. It is necessary, says Bernard, to believe that you cannot have forgiveness, unless by the mercy of God; but at the same time believe this, that your own sins are forgiven you through him. Bernard, De annunt. Serm. 2.

And the reason is because promises of God do not take effect until they have been accepted by us; although, therefore, remission of sins, upon condition of faith, be offered to all, yet it must of necessity be accepted by men individually and singly, that it may be useful and salutary to each one. Promises are not accepted by those who do not, but by those who do know, and understand, and feel, that they apprehend and accept them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c735149c1" data-kw="">
<blockquote><p>How can a man have affiance in CHRIST, and rest upon him for salvation, who is not by Faith persuaded, and in some measure assured, that he is his Saviour? How can he hope and wait for the performance of the promises, that doth not believe that they belong unto him? Faith being the substance of things hoped for. How can a man have true peace of conscience, who is not persuaded, that God is reconciled to him? How can a man rejoice in God, who is not assured of Gods favour towards him? How can a man trust in God, that is not persuaded of Gods goodness towards him? How can a man be thankful unto God, who is not persuaded of Gods love and bounty towards him?

How shall they fear God as sons, that is, fearing to offend so merciful a Father, who are not persuaded that he is their Father in CHRIST? or when they have sinned, how shall they be encouraged to return unto him, if they be not persuaded of his fatherly respect to them? how shall they perform voluntary and cheerful obedience, who are not persuaded that their endeavours are accepted of him? How shall they pray, who doe not believe they shall be heard? Or as the Apostle speaketh, how shall they call upon him in whom they have not believed? Rom. 10.14. How shall they patiently and comfortably bear afflictions, who are not persuaded they be fatherly chastisements or trials proceeding from Gods love, and tending to their good? Finally, with what heart can men worship God, who are not persuaded, that their service is accepted of him? …

For the more a man is persuaded of Gods love and favour towards him in CHRIST, (that is, by how much the greater is a mans special Faith) so much the more he loveth God, and his neighbour for God’s sake; so much the more is he inflamed with the zeal of God: so much the more confidently doth he rest upon CHRIST for salvation: so much the more he hopeth for, and expecteth the good things promised: so much the more he rejoiceth, and glorieth in God: so much the more he is thankful to God for his goodness: so much the more he trusteth in GOD, so much the more he feareth to offend so gracious a GOD, and so merciful a Father: or having offended, he will so much the sooner return unto GOD: so much the more patiently and comfortably he beareth afflictions, saying with Job: though he kill me, yet will I put my trust in him: so much the more willingly and cheerfully will he obey and serve the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 79-81.</span></figcaption>

</figure><figure class="quote" id="q-54b84f2d43" data-kw="">
<blockquote><p>It would spirit our faith, when we shall see his blood confirming an everlasting covenant, wherein God promises to be gracious. All the promises centred in the cross, received their life from his death, and are from thence reflected on us. Where can faith find a vigour but in the royalties of mercy, displayed in the satisfaction of justice? Where can it find a life, but in the views of its proper object?

When we behold a Christ crucified, how can we distrust God, that hath in that, as a plain tablet, writ this language, that he will spare nothing for us, since he hath not spared the best he had. What greater assurance can he give? Where is there anything in heaven or earth that can be a greater pledge of his affection?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 505.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

<blockquote><p>Be certain therefore and sure of pardon of thy sins: be certain and sure of everlasting life. Do not now say in thy heart, who shall descend into the deep? that is, doubt not of pardon of thy sins, for that is to fetch up Christ again: neither say thou, who shall ascend up in to heaven? that is, doubt not of eternal bliss, for that is to put Christ out of heaven. But mark what the lord saith unto thee: the word is nigh thee, even in thy mouth and in thy heart, and this is the word of faith which we preach: If thou confess with thy mouth that Jesus Christ is the lord, &amp; believe with thy heart that God raised him up from the dead, thou shalt be safe. If thou believe that Jesus Christ died and rose again, even so shalt thou be assured (saith the Lord God) that dying with Christ, I will bring thee again with him.

Thus dear brother, I thought good to write to thee in the name of the Lord, that thou fearing death for nothing else but because of thy sins, mightest be assured of pardon of them, &amp; so embrace death as a dear friend, &amp; insult against his terror, sting, &amp; power, saying: death where is thy sting? hell where is thy victory? Nothing in all the world so displeaseth the Lord as to doubt of his mercy. In the mouth of two or three witnesses, we should be content. Therefore in that thou hast heard so many witnesses, how that in deed, desiring mercy with the Lord, thou art not sente empty a way: give credit thereto, and say with the good Virgin Mary, behold thy servant (Oh Lord) be it unto me according to thy word.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Be certain therefore and sure of pardon of thy sins: be certain and sure of everlasting life. Do not now say in thy heart, who shall descend into the deep? that is, doubt not of pardon of thy sins, for that is to fetch up Christ again: neither say thou, who shall ascend up in to heaven? that is, doubt not of eternal bliss, for that is to put Christ out of heaven. But mark what the lord saith unto thee: the word is nigh thee, even in thy mouth and in thy heart, and this is the word of faith which we preach: If thou confess with thy mouth that Jesus Christ is the lord, &amp; believe with thy heart that God raised him up from the dead, thou shalt be safe. If thou believe that Jesus Christ died and rose again, even so shalt thou be assured (saith the Lord God) that dying with Christ, I will bring thee again with him.

Thus dear brother, I thought good to write to thee in the name of the Lord, that thou fearing death for nothing else but because of thy sins, mightest be assured of pardon of them, &amp; so embrace death as a dear friend, &amp; insult against his terror, sting, &amp; power, saying: death where is thy sting? hell where is thy victory? Nothing in all the world so displeaseth the Lord as to doubt of his mercy. In the mouth of two or three witnesses, we should be content. Therefore in that thou hast heard so many witnesses, how that in deed, desiring mercy with the Lord, thou art not sente empty a way: give credit thereto, and say with the good Virgin Mary, behold thy servant (Oh Lord) be it unto me according to thy word.”

— John Bradford, A fruitful treatise and full of heavenly consolation against the fear of death. Whereunto are annexed certain sweet meditations of the kingdom of Christ, of life everlasting, and of the blessed state &amp; felicity of the same, (London: William Powell, 1564), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBe+certain+therefore+and+sure+of+pardon+of+thy+sins%3A+be+certain+and+sure+of+everlasting+life.+Do+not+now+say+in+thy+heart%2C+who+shall+descend+into+the+deep%3F+that+is%2C+doubt+not+of+pardon+of+thy+sins%2C+for+that+is+to+fetch+up+Christ+again%3A+neither+say+thou%2C+who+shall+ascend+up+in+to+heaven%3F+that+is%2C+doubt+not+of+eternal+bliss%2C+for+that+is+to+put+Christ+out+of+heaven.+But+mark+what+the+lord+saith+unto+thee%3A+the+word+is+nigh+thee%2C+even+in+thy+mouth+and+in+thy+heart%2C+and+this+is+the+word+of+faith+which+we+preach%3A+If+thou+confess+with+thy+mouth+that+Jesus+Christ+is+the+lord%2C+%26+believe+with+thy+heart+that+God+raised+him+up+from+the+dead%2C+thou+shalt+be+safe.+If+thou+believe+that+Jesus+Christ+died+and+rose+again%2C+even+so+shalt+thou+be+assured+%28saith+the+Lord+God%29+that+dying+with+Christ%2C+I+will+bring+thee+again+with+him.%0A%0AThus+dear+brother%2C+I+thought+good+to+write+to+thee+in+the+name+of+the+Lord%2C+that+thou+fearing+death+for+nothing+else+but+because+of+thy+sins%2C+mightest+be+assured+of+pardon+of+them%2C+%26+so+embrace+death+as+a+dear+friend%2C+%26+insult+against+his+terror%2C+sting%2C+%26+power%2C+saying%3A+death+where+is+thy+sting%3F+hell+where+is+thy+victory%3F+Nothing+in+all+the+world+so+displeaseth+the+Lord+as+to+doubt+of+his+mercy.+In+the+mouth+of+two+or+three+witnesses%2C+we+should+be+content.+Therefore+in+that+thou+hast+heard+so+many+witnesses%2C+how+that+in+deed%2C+desiring+mercy+with+the+Lord%2C+thou+art+not+sente+empty+a+way%3A+give+credit+thereto%2C+and+say+with+the+good+Virgin+Mary%2C+behold+thy+servant+%28Oh+Lord%29+be+it+unto+me+according+to+thy+word.%E2%80%9D%0A%0A%E2%80%94+John+Bradford%2C+A+fruitful+treatise+and+full+of+heavenly+consolation+against+the+fear+of+death.+Whereunto+are+annexed+certain+sweet+meditations+of+the+kingdom+of+Christ%2C+of+life+everlasting%2C+and+of+the+blessed+state+%26+felicity+of+the+same%2C+%28London%3A+William+Powell%2C+1564%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf532ab62a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df532ab62a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/02/john-bradford-on-assurance-and-dying-in-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

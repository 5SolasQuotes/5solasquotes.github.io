<main class="wrap"><figure class="quote" id="q-af4b2061c2" data-kw="">
<blockquote><p>The instances he gives from the church of the Jews, or that may be given, are either civil observances, as the feast of purim; or moral conveniencies directed by general rules, as the building of synagogues; or customary signs suited to the nature of things, as wearing of sackcloth; or such as have no proof their being approved, as the feast of dedication, and some monthly fasts taken up in the captivity;—from none of which any objection can be taken against the position before laid down. Those from the church of the New Testament had either a perpetual binding institution from the authority of Christ, as the Lord’s-day Sabbath; or contain only a direction to use civil customs and observances in a holy and sanctified manner, as the love feasts and kiss of charity; or such as were never heard of in the New Testament at all, as the observation of Lent and Easter. He that out of these instances can draw a warranty for the power of the civil magistrate over religion and the consciences of men, to institute new duties in religion when he pleaseth, so these “do not countenance vice nor disgrace the Deity,” which all his Christian subjects shall be bound in conscience to observe, or otherwise make good any of those particular conclusions, that therefore Christ is not the only lawgiver to his church, or that divine revelation is not the adequate rule of divine worship, or that men may add any thing to the worship of God, to be observed in it constantly and indispensably by the whole church, will manifest himself to have an excellency in argumentation beyond what I have ever yet met withal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth and Innocence Vindicated in A Survey of a Discourse Concerning Ecclesiastical Polity, and the Authority of the Civil Magistrate Over the Consciences of Subjects in Matters of Religion in The Works of John Owen</cite>, ed. William H. Goold, vol. 13 (Edinburgh: T&amp;T Clark, n.d.), 479.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-210141a3e0" data-kw="">
<blockquote><p>Therefore, if the activity is conducive to worship, then it is lawful. We cannot ignore the human conscience here either, since an activity that might be conducive for worship to one person may not be conducive to worship for someone else. To take one example, it is certainly wise to let small children let loose some of their excess energy on the Sabbath (contrary to Laura Ingalls Wilder’s Farmer Boy! [below]). Otherwise, they will not be able to sit still and pay attention in worship. One does not have to take the attitude of Almanzo Wilder’s father [in Farmer Boy] in order to have a Puritan view of what is acceptable on the Sabbath! It is certainly a work of necessity to do something about the energy of small children. We must avoid both extremes of legalism and antinomianism here, as well as everywhere in our treatment of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lane-keister.html">Lane Keister</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Day &amp; Recreations on the Sabbath</cite>, …’ in Confessional Presbyterian, #5 (2009), p. 323</span></figcaption>

</figure><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>

</figure><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, pp. 566-67</span></figcaption>

<blockquote><p>This will I briefly show, when that I have spoken of justification, the which precedes regeneration, from whom we may discern it, but not divide it, no more than heat from the fire. Justification in Scripture is taken for the forgiveness of our sins, and consists in the forgiveness of our sins. This is only God’s work, and we nothing else but patients and not agents. After this work, in respect of us and our sense, comes regeneration, which altogether is God’s work also: for, as to our first birth we bring nothing (bring, quoth I? yes, we bring to let [prevent] it many things, but to further it nothing at all)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Writings of John Bradford</cite>, … Parker Society (d. 1555; Cambridge Univ. Press, 1848-1853), “Election &amp; Free-Will”, vol. 1, p. 217 Bradford (1510–1555).</span></figcaption>

<blockquote><p>3. The word ‘regeneration’ also signifies the same thing with conversion, but with this small difference: 1. The term is metaphorical, taken from our natural generation; because there is so great a change, that a man is as it were another man. 2. The word is in Scripture-sense, I think more comprehensive than conversion, repentance or vocation: For it signifies not only the newness of our qualities, but also of our relations, even our whole new state. This is not ordinarily acknowledged, but if we view the places where the word is used, it will prove so. For as Paul describing the thing, though he use not the word, 2 Cor. 5:11, says, ‘He that is in Christ is a new creature, old things are passed away, behold all things are become new,’ where relations must needs be part of that ‘all,’ as the context will show. So Titus 3:5, it is called the ‘laver’ or ‘washing of regeneration;’ and is distinguished from the ‘renewing of the Holy Ghost,’ at least as the general, comprehending that as a part. 1. Most expositors think that the word has reference to baptism, and expresses its effects or consequents. And no doubt baptism is for remission of sins, and therefore the laver of regeneration is for remission of sins. 2. The very text mentions plainly that grace by which we are saved; by free grace, and that is our free justification as well as free sanctification. And our divines commonly cite that text against the Papists upon that account, as pleading for free justification. ‘Not by works of righteousness that we have done, but according to his mercy He saved us, by the washing of regeneration, and the renewing of the Holy Ghost:’ Is not saving from the guilt of sin a part of our salvation? what reason to restrain ‘saving’ here to sanctification only? Doubtless if there were reason to restrain the word ‘regeneration’ to either, it would be to justification only: Because the giving of the Holy Ghost is next mentioned by itself, but justification is not mentioned at all if ‘regeneration’ comprehends it not. And it is certain, that the apostle intends not only to tell us that we are freely sanctified without works, but also that we are freely justified by grace without works. So Jn. 3:3, ‘Except a man be born of water and of the Spirit, he cannot enter into the Kingdom of God.’ Where he at least has some respect to baptism, as most suppose; and baptism is for the remission of sins: to be born of water therefore must needs include remission of sin. And this regeneration makes a man a new creature, and as Paul says, in the new creature all things are become new; and not the qualities only. But in the main, regeneration is the same with conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 8-9</span></figcaption>

<blockquote><p>3… Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this [faith] man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colloquy-of-regensburg.html">Colloquy of Regensburg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anthony Lane, Justification by Faith in Catholic-Protestant Dialogue. An Evangelical Assessment</cite>, tr. Anthony Lane (London: 2002), Appendix 1, pp. 233-34 This statement was affirmed by both the Reformed and Romanist sides.</span></figcaption>

<blockquote><p>1. In respect of its first moment regeneration comes about in another way than in respect of its progression. Regarding the first moment of regeneration man is purely passive; regarding its progression man cooperates with God. … 13. In this life regeneration is by degrees: these degrees do not only concern regeneration by itself but also the subjects. Some people are more regenerate than others; hence older people are more regenerated than the young ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite>, (1644), ch. 14, ‘On Regeneration’, pp. 239, 243</span></figcaption>

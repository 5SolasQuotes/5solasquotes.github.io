<main class="wrap"><figure class="quote" id="q-7be8fd49ca" data-kw="">
<blockquote><p>It cannot be concluded, they do not suffer for Christ, who have some sin mixed with that which is made the cause of their sufferings, if it be the cause of God indeed, for the substance of it, and they sincere in it for the main. When the people of God are ready to offer up themselves, and what they have for him, he will not reject such a sacrifice for every blemish. Christ had something against the church of Ephesus, something to charge her with as matter of provocation, even when he is speaking of her sufferings, Rev. ii. 4. And yet he owns her as one that had suffered and laboured for his name’s sake, verse 3.

Nor can this be concluded, because of some miscarriage under their sufferings. David, while he was persecuted by Saul, miscarried divers ways, as you may see 1 Sam. xxi. 2, 12, 13, and elsewhere; yet this did not hinder him from being a sufferer for righteousness.

As the Lord has provided a way, that what his people do for him may be accepted as done for him, though there be too many sinful mixtures therein, so he has provided an expedient, that what they suffer for him may be accepted as suffered for him, though there be many flaws therein, both for matter and manner. The Lord Jesus, the advocate of and sacrifice for his people, is effectual for both. When they apply themselves to him, in the exercise of faith and repentance, through his mediation, that which is therein evil shall not be remembered, that which is good therein will be accepted, Rom. xii. 1. How acceptable, see Eph. i. 6, 7.

Licinius, as you may read, Eusebius De vita Constantini, makes an edict, that whosoever did relieve the imprisoned and distressed Christians should suffer the same things that were inflicted upon them. Now, suppose some, out of love to Christ and his afflicted members, should have ventured (as many did indeed) to have relieved them, and yet should have done it too sparingly, or too fearfully, or with some selfish reflections, and should, according to the edict, have suffered for relieving them, here had been some sin mixed with the cause of their sufferings. And yet in this case, since their cause was good, and the cause of Christ, for the substance of it, who would deny but they suffered for Christ?

Or suppose one should suffer because he would not leave praying (which was Daniel’s case, Dan. 6), and yet in his prayer should have some mixture of unbelief, and lukewarmness, and other distempers, which the best cannot always escape, here would be some sin mixed with the cause of sufferings; yet who would deny but that, suffering for doing his duty, he is a sufferer for God?

To proceed a little further: suppose some godly Lutherans should suffer for those great truths of the gospel, which they maintain against the papists, and together with them should suffer for consubstantiation, which indeed is an error, here would be a sin mixed with the cause of their suffering; yet I suppose their laying down their lives for those other great truths of Christ, notwithstanding this sinful mixture, would be accounted a suffering for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

<blockquote><p>Under the humiliation of Christ are especially comprehended his sufferings, i. e. all those things which Christ endured for our sins, beyond the natural inclination of his will, although he voluntarily endured them; but especially those which he suffered at the end of his life, of which we must now speak. And in order that we may do it with precision, we observe that he not only suffered in body, but also in soul, as is evident, not only from the testimony of scripture, (Matt. xxvi. 38; John xii. 27,) but also because our salvation required that the surety of those sinners who had sinned in soul and body, and to whom the law threatened not only bodily, but also spiritual and internal sufferings, should also suffer both in soul and body. We observe, also, that these sufferings were very great and grievous, though not eternal; the sinner deserved eternal suffering, but the infinite dignity of Christ’s person was an equivalent to infinity of duration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.10, p. 295.</span></figcaption>

</figure><figure class="quote" id="q-feaede9d94" data-kw="">
<blockquote><p>A holy, a prudent silence under affliction doth not exclude and shut out a sense and feeling of our afflictions. Ps. xxxix. 9, though he ‘was dumb, and laid his hand upon his mouth,’ yet he was very sensible of his affliction: verses 10, 11, ‘Remove thy stroke away from me, I am consumed by the blow of thine hand. When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man is vanity.’ He is sensible of his pain as well as of his sin; and having prayed off his sin in the former verses, he labours here to pray off his pain. Diseases, aches, sicknesses, pains, they are all the daughters of sin, and he that is not sensible of them as the births and products of sin, doth but add to his sin and provoke the Lord to add to his sufferings, Isa. xxvi. 9-11.

No man shall ever be charged by God for feeling his burden, if he neither fret nor faint under it. Grace doth not destroy nature, but rather perfect it. Grace is of a noble offspring; it neither turneth men into stocks nor to stoics. The more grace, the more sensible of the tokens, frowns, blows, and lashes of a displeased Father. Though Calvin, under his greatest pains, was never heard to mutter nor murmur, yet he was heard often to say, ‘How long, Lord, how long?’ A religious commander being shot in battle, when the wound was searched, and the bullet cut out, some standing by, pitying his pain, he replied, Though I groan, yet I bless God I do not grumble. God allows his people to groan, though not to grumble. It is a God-provoking sin to be stupid and senseless under the afflicting hand of God. God will heat that man’s furnace of affliction sevenfold hotter, who is in the furnace but feels it not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 306-07.</span></figcaption>

<blockquote><p>May it please your Grace and your Lordships, I Should not presume to take up any part of that time, which Your Grace so happily employs in the Government and Conservation of a whole Nation; nor to divert the rest of this honourable Board from those important Affairs, which usually call your Lordships hither; were I not under an Obligation both of Gratitude and Duty, to be an Interpreter for those poor Protestants, lately come out of France, to take Sanctuary with you: and to express for them and in their names, as they have earnestly desired me, a part of that grateful sense, which they have, and will for ever preserve, of your Lordships Christian Charity and Generosity towards them: This they have often, I assure you, acknowledged to Heav’n in their Prayers, but could not be satisfied, till they had made their solemn and public Acknowledgments to their Noble Benefactors.

Life and Religion are the two things most dear and valuable of all upon earth: Life is the ground of all the Good and Happiness we enjoy in this world, and Religion is the foundation of all the Felicities we hope for in that to come; so that those persons that are deprived both of the comforts of Life, and the Profession and Exercise of their Religion, may justly be looked upon as the truest objects of pity that we can meet with in this world; and by the same rule, those that have a lively sympathy with such, have the true principle of a Christian Spirit, and are the true examples of a Christian Practice.

What extreme Hardships and Sufferings those Protestants were under in their own Country, both as to their Livelihood and Religion, is too sad and too notorious a truth, as well as too big a Subject for me now to enlarge upon. The many Proclamations which their Prince made against them, for pulling down and demolishing most of their Churches, and excluding them from all Trades and Preferments, are well known, they could neither serve God, nor enjoy themselves; They are forbidden to quit their Country, and yet by their hard usage, and persecution, in effect, not suffered to stay.

The Cry of that Egyptian-like Bondage and Slavery, they groaned under, that entered into the ears of the Lord of Hosts, entered also into your noble and charitable Hearts, and there has met with Compassion and Pity; and by your Christian Example and Charity you have set your selves Patterns to this whole Nation: By it you have excited the general Beneficence of all; and by it, no less than by your Orders, you have already influenced this great City (and I hope will shortly after, the whole Kingdom) into an Obedience to that truly Christian, and royal Law of Beneficence and Mercy.

And although this be eminent, and extraordinary in its kind, yet it is no wonder that that Illustrious Person, who began as early to be good, as to be great, whose matchless Courtesy and Generosity are not only known to his Friends, to his Servants, to Strangers, but even to his greatest Enemies; who has learned by a long experience, what it is to suffer for Righteousness sake, and to forsake all, rather than his Honour and Religion; no wonder, I say, that He should be ready and zealous to relieve those that suffer innocently, and for a good Conscience, and who forsake their All, rather than forsake their God.</p></blockquote>

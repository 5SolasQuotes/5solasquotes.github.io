<main class="wrap"><figure class="quote" id="q-2a0e069616" data-kw="">
<blockquote><p>Objection [of Rutherford’s Opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side nor for the other, what rulers think good is to be followed, there being no evil, nor impiety in that which they command. [Margin Note:] The will of rulers not a law to us in things indifferent. Answer [of Rutherford] 1: This is to make rulers in matters of salvation liable to the Scriptures of God, but in matters which men call indifferent, to make them Popes and to hang our consciences upon their sleeve, which is most absurd: 1. Because Paul, in matters most indifferent of days and meats, would not have the Romans to hang upon his judgement, but will rule both their practice and his own by the Law of nature: murder not, scandalize not. 2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if, in matters that they call ‘of salvation’, not [their] thoughts, but the Word of God should rule and square [regulate] canon-makers, but in matters indifferent, their thoughts should be a law. 3. Scripture and the Law of nature and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is convenient in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters which they call ‘fundamental’; yea, the Scripture shall be imperfect in the duties of the Second Table if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship [in the First Table].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 656</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>45. A man is said to be a partaker of another’s sin in nine ways, indicated by the following: Command, counsel, consent, flattery [or coaxing], retreat, participating, nodding [or faltering], not opposing, not making public [or not revealing]. [Jussio, consilium, consensus, palpo, recursus, participans, nutans, non obstans, non manifestans.] Or, in sum, consent is given to sinners by counseling, defending, helping, permitting what we might hinder, and being silent when we might profitably speak, Rom. 1:32.</p></blockquote>

</figure><figure class="quote" id="q-a2ed7eb824" data-kw="">
<blockquote><p>We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: … 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate [see others who are better on the issue of giving titles]). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Thomas Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered</cite>, … (London, 1650)</span></figcaption>

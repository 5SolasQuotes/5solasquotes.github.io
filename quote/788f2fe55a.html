<main class="wrap"><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44327ec6c7" data-kw="">
<blockquote><p>Has it never occurred to you that the pope, cardinals, bishops, monks, and that the whole synagogue of Satan are trouble-makers? The truth is, they are worse than false apostles. The files [sic] apostles taught that in addition to faith in Christ the works of the Law of God were necessary unto salvation. But the papists omit faith altogether and teach self-devised traditions and works that are not commanded of God, indeed are contrary to the Word of God, and for these traditions they demand preferred attention and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a></span></div>

</figure><figure class="quote" id="q-43f398b797" data-kw="Upon this rock">
<blockquote><p>Mt. 16:18 does not favor the primacy of Peter. First, the passage is allegorical and metaphorical, admitting of various interpretations. Assuredly, it cannot establish an ecumenical pontificate, which ought to be proved by some express passage. Second, these things are certainly said to Peter, but not about Peter. The reasons are various. (a) From the very words because Petra is expressly distinguished from Petro, both in person and in gender, as the denominating and the denominated. Yet if he had wished to indicate Peter, why did he use both? Why did he not say, “Thou art Peter and upon thee” (which would have removed all difficulty). Rather he says “and upon this rock.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>

</figure><figure class="quote" id="q-1aa6efdfbb" data-kw="Pope judge in own cause">
<blockquote><p>But it is unjust that he who is the subject of the controversy should be the judge of the controversy; and I am in greater doubt of the pope’s authority than of the sense of this passage. There is need, therefore, of some other and more impartial judge. For who could say this was a legitimate interpretation;— since the pope says that infallibility is promised to him in this text, therefore he is infallible? Surely he needs some greater authority and testimony than his own word to prove that such a promise hath been made to him. Besides, the papists themselves acknowledge, that the pope may not only err, but even be a heretic, and so completely overturn this interpretation of the passage. Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-386ba41121" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Animadversions on Fiat Lux</cite>, ch. 8</span></figcaption>

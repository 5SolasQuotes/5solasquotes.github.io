<main class="wrap"><figure class="quote" id="q-21e9bea9a2" data-kw="">
<blockquote><p>…an external ecclesiastical reformation and several canons [implemented by the apostles] concerning the reformation of external abuses and scandals in the Church: as for instance, that the churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick [1 Tim. 5] and that such widows must be at least 60 years old, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 13, pp. 165-66</span></figcaption>

<blockquote><p>…so the people [the Independent sectaries] for a great part of them be dangerous and insufferable, heady, refractory, proud, bitter, scornful, despisers of authority, who though but a few comparatively, and the laws standing, have attempted not to suffer the public prayers to be prayed, but what with singing, what with clapping on of hats in times of prayer…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons against the Independant Government of Particular Congregations</cite>, … (London, 1641), reason 6, p. 31 Edwards was an English presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-b55a47f3a4" data-kw="">
<blockquote><p>Of the Church of the New Testament, it was prophesied that God would give them one way, as well as one heart, Jer. 32:39, that there shall not only be one Lord, but his Name one, Zech. 14:9. We are exhorted to walk by the same rule, so far as we have attained, that is, to study uniformity, not diversity in those things which are agreed upon to be good and right, Phil. 3:16. Does not the apostle plainly intimate and commend a uniformity in the worship of God, 1 Cor. 14:27… verse 33, for God is not the author of confusion, but of peace, as in all the Churches of the saints, verse 40, ‘Let all things be done decently and in order.’ He limits the prophets to that same number, of two or three, even as he limits those that had the gift of tongues, verse 29. And was it not a great uniformity that he would have every man who prayed or prophesied, to have his head uncovered, and every woman covered, 1 Cor. 11? Does not the same apostle, besides the doctrine of faith and practical duties of a Christian life, deliver several canons to be observed in the ordination and admission of elders and deacons, concerning widows, concerning accusations, admonitions, censures and other things belonging to Church policy, as appears especially from the epistles to Timothy and Titus?… In the ancient Church, although there was not an uniformity in all particulars among all the churches, for instance in the point of fasting: some fasting on the Sabbath, some not, some taking the Lord’s Supper fasting, some after meals, which differences in fasting, gave occasion to the old rule: dissonantia jejunii non dissolvit consonantiam fidei [The dissonance of fasting does not dissolve the concord of the faith]. Although likewise, there was a great difference between the custom of one church and another in the time and manner of celebrating the Lords Supper and in other particulars, as Augustine, Socrates and the author of the Tripartite History record unto us. Yet the Centuries and other ecclesiastical historians show us in every century, a great uniformity in those ancient times, even in very many things belonging to Church government and form of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 15, pp. 199-201</span></figcaption>

</figure><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium</cite>, ... (London, 1645), ch. 6, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>Their women used both to pray and prophesy unveiled, and with their head bare, (for even women also used to prophesy) but the men went so far to wear long hair, as having spent their time in philosophy and covered their heads when praying and prophesying, each[?] of which was a Grecian custom.</p></blockquote>

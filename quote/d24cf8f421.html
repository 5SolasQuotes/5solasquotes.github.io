<main class="wrap"><figure class="quote" id="q-d24cf8f421" data-kw="">
<blockquote><p>We believe that these Holy Scriptures fully contain the will of God, and that whatsoever man ought to believe unto salvation, is sufficiently taught therein. For since the whole manner of worship which God requires of us is written in them at large, it is unlawful for any one, though an Apostle, to teach otherwise than we are now taught in the Holy Scriptures; nay, though it were an angel from, heaven, as the Apostle Paul saith. For since it is forbidden to add unto or take away any thing from the Word of God, it doth thereby evidently appear that the doctrine thereof is most perfect and complete in al respects. Neither may we compare any writings of men, though ever so holy, with those divine Scriptures; nor ought we to compare custom, or the great multitude, or antiquity, or succession of times or persons, or councils, decrees, or statutes, with the truth of God, for the truth is above all: for all men are of themselves liars, and more vain than vanity itself. Therefore we reject with all our hearts whatsoever doth not agree with this infallible rule, which the Apostles have taught us, saying, Try the spirits whether they are of God; likewise, If there come any unto you, and bring not this doctrine, receive him not into your house.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belgic-confession.html">Belgic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creeds of Christendom</cite>, vol. 3 (New York: Harper &amp; Brothers, 1882), 389.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b7d563a92" data-kw="">
<blockquote><p>Because, whereas the ministers are willing to reform abuses, and the magistrate is peremptory and resolute not to reform for some reasons of policy, the minister in that case is not to leave his ministry, or to trouble the Church, intempestiuis clamoribus, or to contest or contend with the magistrate: The reason is, because this course tends to the overthrow of the Church, and is opposite to that charity which he owes unto Christ and to his church, out of which ground and rule he ought to preach, and to hold on in the course of his ministry. He ought indeed to teach publicly and privately (as the matter requires) what is to be done, but this he must perform without sedition and troubling of the Church, but peaceably and discreetly. Charity will inform the pastor, if he love the Church indeed, how he ought in these cases to behave himself; Zanchi, On Philippians 1, fol. 45. Look also: Musculus, loc. pt. 2, Of Traditions, §6, fol. 31. …Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it; Zanchi, ibid. … Because if pastors cannot reform all things which need amendment, according to their desire, they must not therefore cast away their ministry, or trouble the whole Church with an unusual asperity. The reason: Because all godly ground and form of ecclesiastical discipline ought ever to have respect and have reference to the unity of the Spirit in the bond of peace, which the apostle commanded to be kept by serving one another; and which rule not being kept, the medicine of discipline grows to be superfluous and pernicious. It is confessed that pastors ought with their uttermost endeavors to labor that there remain no corruption in the Church: but they must use that wisdom which our Savior prescribes, lest by plucking up the tares, they hurt the good corn. Wherefore the precept of the apostle of separating the evil (or of mending corruption) must by no means be neglected, cum sine periculo violandae pacis fieri potest, when it may be done without the danger of violation of the Churches’ peace: for else He would not have it done. Calvin, Institutes, bk. 4, ch. 12, §11, 13.</p></blockquote>

<blockquote><p>Some that live in countries where none in twenty miles openly use the New one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that:

1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit.

2. That when they have no public church or worship to join with, but what uses the Old one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit.

3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says:

1. That it is a cursed thing to offer God a worse [worship] while we have better.

2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.]

3. That it is false worship and obeying man before God.

4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them.

5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers:

I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice.

II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C. See also ‘All Vows are Qualified’ and ‘Vows can Never Bind Beyond God’s Law’.]

III. That all worship is so far false as it is faulty; That to forsake all public worship when we cannot have the better translation is to be righteous, unrighteously, over much [Eccl. 7:16], and too little [righteous], and to disobey both God and man.

IV. Keep your possession as long as you can without more hurt than good. I am not one that ever strove to take it from you. But do your brethren in prison enjoy public worship? You’ll say, ‘They do better. It’s easier bearing their imprisonment, poverty and death than your own.’ But what shall ten parts of the kingdom do that must have the Old Translation or none? You’ll say, ‘I suppose, they may give over all church worship as impossible and take up with family worship.’ But stay:

      1. Must you not first prove the Old so bad as that no-church worship is better? Have you proved this?

      2. Will not your reason prove that we must also separate from you? Have not weak ministers as bad faults as a weak translation?

      3. What’s become then of your saying, ‘We had possession’? Have they possession of better that have none at all? Or will you be without all, because you had once possession of better? And will it excuse your ungodliness that you can lay the blame on them that dispossessed you? Or if they be schismatics for so using you, does it follow that you are none, if you persuade all to separate from all God’s Church worship rather than join where the Old Translation is used?

V. God’s Word is the rule, but only a general rule for words, modes and circumstances. To love God and our neighbour and the unity of the Church are his greatest commands. Go learn what these mean. To violate these and forsake all Church worship, if you cannot have the best translation, is not to keep to the rule, but most grossly to violate it in the greatest commands against many Scripture admonitions which vehemently urge you to love and unity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Some that live in countries where none in twenty miles openly use the New one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that:

2. That when they have no public church or worship to join with, but what uses the Old one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit.

3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says:

1. That it is a cursed thing to offer God a worse [worship] while we have better.

2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.]

3. That it is false worship and obeying man before God.

4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them.

5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers:

I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice.

II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C. See also ‘All Vows are Qualified’ and ‘Vows can Never Bind Beyond God’s Law’.]

III. That all worship is so far false as it is faulty; That to forsake all public worship when we cannot have the better translation is to be righteous, unrighteously, over much [Eccl. 7:16], and too little [righteous], and to disobey both God and man.

IV. Keep your possession as long as you can without more hurt than good. I am not one that ever strove to take it from you. But do your brethren in prison enjoy public worship? You’ll say, ‘They do better. It’s easier bearing their imprisonment, poverty and death than your own.’ But what shall ten parts of the kingdom do that must have the Old Translation or none? You’ll say, ‘I suppose, they may give over all church worship as impossible and take up with family worship.’ But stay:

      1. Must you not first prove the Old so bad as that no-church worship is better? Have you proved this?

      2. Will not your reason prove that we must also separate from you? Have not weak ministers as bad faults as a weak translation?

      3. What’s become then of your saying, ‘We had possession’? Have they possession of better that have none at all? Or will you be without all, because you had once possession of better? And will it excuse your ungodliness that you can lay the blame on them that dispossessed you? Or if they be schismatics for so using you, does it follow that you are none, if you persuade all to separate from all God’s Church worship rather than join where the Old Translation is used?

V. God’s Word is the rule, but only a general rule for words, modes and circumstances. To love God and our neighbour and the unity of the Church are his greatest commands. Go learn what these mean. To violate these and forsake all Church worship, if you cannot have the best translation, is not to keep to the rule, but most grossly to violate it in the greatest commands against many Scripture admonitions which vehemently urge you to love and unity.”

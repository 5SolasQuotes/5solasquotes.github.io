<main class="wrap"><figure class="quote" id="q-00c6949d1e" data-kw="">
<blockquote><p>But is the State to have no control over a Church whose ministers it pays? Yes, it possesses, and ought to have, control over the Church to the extent of withdrawing the emolument it conferred, whenever it becomes convinced that the Church is not fulfilling the ends for which she was established.

If, instead of teaching the truth of God, the Church becomes pervaded by error, it is the duty of the Civil Magistrate to withdraw from her his countenance and protection. In this he must act upon his own responsibility to the King of kings.

But to invade the province of the office-bearers of the Church — to assume the power of the keys — to take into his own hands the appointment of her ministers, and make them subservient creatures of his own — these things he may not do without incurring heinous guilt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 7.</span></figcaption>

<blockquote><p>45. A man is said to be a partaker of another’s sin in nine ways, indicated by the following: Command, counsel, consent, flattery [or coaxing], retreat, participating, nodding [or faltering], not opposing, not making public [or not revealing]. [Jussio, consilium, consensus, palpo, recursus, participans, nutans, non obstans, non manifestans.] Or, in sum, consent is given to sinners by counseling, defending, helping, permitting what we might hinder, and being silent when we might profitably speak, Rom. 1:32.</p></blockquote>

<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church.

54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

<blockquote><p>Sep. 25th 1849

My dear Doctor,

I should not have perpetuated the vanity of presenting you with my ugly phiz, had it not been put into my head by our mischievous friend Mrs Shaw. Perhaps however it may stir within your something of the “memory of joys that are past, pleasant and mournful to the soul.” It reminds me this moment of a very lovely one whom you thought like your second self, and who has had her place for years in the General Assembly of the church of the first born. Will you ever visit “Oauld Ireland” again? I am quite on classic ground now alongside Queen’s College and have a warm bed ready for you every day and every night. You will find that since your visit we have become quite scientific.

Most faithfully yours

John Edgar</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edgar.html">John Edgar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to John Torrey, 25 September 1849 (LuEsther T. Mertz Library, New York Botanical Garden, John Torrey Papers).</cite></span></figcaption>

<blockquote><p>No one presumes to teach an art till he has first, with intent meditation, learned it. What rashness is it, then, for the unskilful to assume pastoral authority, since the government of souls is the art of arts! For who can be ignorant that the sores of the thoughts of men are more occult than the sores of the bowels? And yet how often do men who have no knowledge whatever of spiritual precepts fearlessly profess themselves physicians of the heart, though those who are ignorant of the effect of drugs blush to appear as physicians of the flesh!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pastoral Rule</cite>, (c. 590), trans. George E. Demacopoulos, ed. John Behr, Popular Patristics Series 34 (Crestwood NY: St Vladimir’s Seminary Press, 2007), Book 1.1.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-04069179ec" data-kw="">
<blockquote><p>…the night of the first day was that which followed the light, after God had separated the light which he called ‘day’ from the darkness which he called ‘night’; to object the order of the words is vain, Moses himself takes off that objection by inverting that order in the following words, for v. 4, he puts light before darkness and day before night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-warren.html">Edmund Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Position 6, ‘That the Sabbath Begins in the Morning’ in The Jew’s Sabbath Antiquated &amp; the Lord’s Day Instituted by Divine Authority</cite>, ... (London: Maxwel, 1659), pp. 242-45, p. 244</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08ee15b796" data-kw="">
<blockquote><p>…let our rest and confidence be only in Christ, and to such as take Him for their rest, his work is but recreation, and so indeed we should esteem it in a spiritual sense; not looking upon it as a sour task, or a rigid exaction, but calling the Sabbath a delight, we should keep it accordingly, even the whole day, with the whole man, as a day of delights to the Lord, being transported beyond flesh and the world, and having our conversation in heaven, as much as is possible for creatures clothed with flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-warren.html">Edmund Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Jews’ Sabbath Antiquated, &amp; the Lord’s Day Instituted by Divine Authority</cite>, (London: Maxwel, 1659), Position 7, ‘The Lord’s Day must be kept holy to the Lord,’, p. 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-5fd58c05e0" data-kw="">
<blockquote><p>After dinner [lunch] Eliza Jane and Alice did the dishes, but Father and Mother and Royal and Almanzo did nothing at all. The whole afternoon they sat in the drowsy warm dining-room. Mother read the Bible and Eliza Jane read a book, and Father’s head nodded till he woke with a jerk, and then it began to nod again. Royal fingered the wooden chain that he could not whittle, and Alice looked for a long time out of the window. But Almanzo just sat. He had to. He was not allowed to do anything else, for Sunday was not a day for working or playing. It was a day for going to church and for sitting still. Almanzo was glad when it was time to do the chores.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/laura-ingalls-wilder.html">Laura Ingalls Wilder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Farmer Boy in Little House on the Prairie</cite>, (1933), ch. 8, ‘Sunday’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<main class="wrap"><figure class="quote" id="q-2bb3d36ea3" data-kw="">
<blockquote><p>And withal, there is no doubt but these ceremonies may be changed and varied according to the diversity and alteration of times and nations, and other circumstances. St. Augustine says in defence of this point (Ad Marcellinus, Epistle 5), Non itaque verum est quod dicitur, Semel recte factum 〈◊〉 est mutandum: mutata quippe temporis causa, etc…. Yet in ceremonies there are these four rules or cautions to be observed: 1. That they be not over many, and that those which be enjoined be necessary, according to the time and place wherein we live, according to the apostles’ example, who enjoined few things to those believing gentiles, Acts 15:28-29. 2. That the ceremonies enjoined be for edification, and not destructive to that which the substance builds and sets up. And this is the apostle’s counsel, ‘Let all things be done to edifying.’ (1 Cor. 14:26) For a destroyer (according to this rule) is a transgressor. (Gal. 2:18) And in this respect it is that the same apostle prohibits prayer in an unknown tongue. (1 Cor. 14:4) 3. That they be such as conduce to order: to which all things must be squared 〈 Greek 〉 according to order, (as the same apostle), else there will be confusion in the Church, and God is not the author of confusion. (1 Cor. 14:33) 4. Lastly, 〈 Greek 〉, that they be for decency. They must be such as make for the decent service of God. And therefore it is that the apostle inveighed against covering of the head and face [for men] in religious exercises. It was an uncomely and undecent thing for men to be covered, or women uncovered in the Church. (1 Cor. 11:4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments</cite>, (d. 1626; 1675), Ten Commandments, 2nd Commandment, ch. 5, p. 209</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef42a8d959" data-kw="">
<blockquote><p>Is this rational, that where two commands of the magistrate are joined, the one undoubtedly lawful to be obeyed, the other doubted of, that subjects should disobey the magistrate in that which is clearly lawful, because they have a doubt or unclearness anent obeying him in the other command? Does it not become subjects to go as far on in obedience to lawful authority as they see they may without sin against God? Then it is time to stop when anything is put to them by virtue of the king’s command which they clearly see they cannot do without sin.</p></blockquote>

</figure><figure class="quote" id="q-7447cdd86e" data-kw="">
<blockquote><p>Arguments of Peter Martyr disputing with Mr. Chadsey upon the first question: The analogy and resemblance between the sacrament and the thing signified must ever be kept in all sacraments. In the sacrament of the Lord’s body, this analogy or resemblance cannot be kept, if bread be transubstantiated: Ergo [therefore], the substance of bread must needs remain in the sacrament of the Lord’s body. The major [premise] of this argument is certain by St. Austen [Augustine] (Book on Catechizing in the Rudiments; Epistle to Dardan), where he says: Sacraments must needs bear a similitude of those things whereof they are sacraments, or else they can be no sacraments.</p></blockquote>

<blockquote><p>6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good. 7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God. 8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times. 9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power. 10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry, containing: I. the Reasons of their Preaching, II. an Answer to the accusations urged as reasons for the silencing of about 2000</cite>, … III. Reasons proving it the Duty and interest of the Bishops and Conformists to endeavour earnestly their restoration… (1668-1669; 1675; London: 1681) 249 pp. ToC, p. 240</span></figcaption>

<blockquote><p>§12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

<blockquote><p>48. That which God wills, that is, swears to be, is not in diverse times, nor does He swear [jubet, commandingly oblige] and call by distinct actions, but by one most simple act. And therefore diverse decrees ought not to be discerned in God. Nor is it true with [amidst, apud] God ‘that which is last in execution, that is the first in intention’, unless we may assuredly so interpret this phrase, ‘that which is last in execution, that is the first in intention’ in the manner that every good most evidently shines forth from preceding acts.</p></blockquote>

<blockquote><p>‘But for this cause came I to this hour.’ Here is the fifth article in this prayer: a sort of correction, in which Christ does resign his will, as man, to the will of God; as Mt. 26:39; Lk. 22:42. ‘Nevertheless, not my will, but thine be done.’ In this there is offered to us a question, Whether or no there be in this prayer any repugnancy in the human will of Christ to the will of God? For: 1. A correction of the human will seems to import a jarring and a discord; 2. Christ desired that, the contrary whereof He knew was from eternity decreed of God. 3. The Law of God is so spiritual, straight and holy that it requires not only a conformity to it, and our will, actions, words and purposes, but also in all our affections, desires, first-motions and inclinations of our heart, that no unperfect and half-formed lustings arise in us even before the complete consent of the will that may thwart or cross the known Law and command of God; and by this, ‘Thou shalt not lust,’ Rom. 7, and the duty of the highest love we owe to God, to love him with all the heart, soul, mind, and whole strength, Mt. 22:37; Mk. 12:33; Lk. 10:27. Some Arians and Arminians, John Geysteranus at the Synod of Dort, have said blasphemously that there was concupiscence and a will repugnant to God’s will in the second Adam, as in the first. But this they spoke against the consubstantiality and deity of the Son of God. To which we say: Assertion 1. Jesus Christ that holy thing, Lk. 1:35, was a fit high priest, holy, harmless, undefiled, separated from sinners, Heb. 7:26. Which of you (says Christ to the Jews) convinces me of sin, Jn. 8:46. There could not be a spot in this Lamb sacrificed for the sins of the world, no prick in this Rose, no cloud in this fair Sun, no blemish in this beautiful Well-beloved. Assertion 2. An absolute, resolved will or desire of heart to lust after that which God forbids in his Law must be a sinful jarring between the creature’s and the Creator’s will. Now, Christ‘s will was conditional and clearly submissive; it lay ever level with his Father’s holy will. Assertion 3. I shall not with some affirm that which in the general is true, a will contrary to God’s revealed command and will, called voluntas signi, which is our moral rule to oblige us, is a sin [see Assertion 4 below]; but a will contrary to God’s decree, called voluntas beneplaciti, which is not our rule obliging, except the Lord be pleased to impose it on us as a moral Law, is not a sin. Peter and the apostles, after they heard that prophecy of their denying of Christ and their being sinfully scandalized, and their forsaking of Christ when the Shepherd was smitten, were obliged to have a will contrary to that decree and to pray that they might not be led into temptation, but might have grace to confess their Savior before men and not flee, nor be scattered: Here is a resolute will of men lawfully contrary to the revealed decree of God, yet not sinful. But the Lord’s will that Christ should die for man, as it was a decree of the wise and most gracious Lord pitying lost man, so was it also a revealed commandment to Christ, that He should be willing to die and be obedient to the death, even the death of the cross, Phil. 2:8; yea, a rule of such humble obedience as we are obliged to follow, as is said, verse 5, ‘Let this mind be in you, which was also in Christ Jesus,’ etc. If the Lord’s will that Christ should die be nothing but his mere decree, it could not oblige us in the like case to be willing, as John says to lay down our life for the brethren. Yea, Jn. 10:18, Christ has a commandment of God and the revealed will of God to die for us: ‘No man takes it from Me, but I lay it down of myself: I have power to lay it down; I have power to take it again: this commandment have I received of my Father.’ Here is an express commandment given to Christ to die for sinners; and the Father loves Christ for obedience to this commandment. Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations. 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment, for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son, if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did God’s precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination natural in a father to preserve the life of the child.’ So the positive command of the Father that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die. 2. A martyr dying for the truth of Christ may have a natural and conditional desire and inclination to live, though his living be contrary to the Lord’s revealed will commanding him to seal the Gospel with his blood and to confess Christ before men. 3. If the brother, son, daughter, wife or friend that is as a man’s own soul, Dt. 13:6, blaspheme God, yea if father or mother do it, Dt. 33:8-9, yet is a father obliged to stone the son or daughter, the son being a magistrate or a Levite and priest, to judge according to law (the priests’ lips should preserve knowledge, Mal. 2:8) that his father or mother ought to be stoned to death; yet ought not father or son to lay aside that natural desire of being and life to son, father, brother which the law of nature in the Fifth Command does require, especially the desire being conditional, with submission to God’s will, as the desire of Christ is here; and the command to stone the blasphemer, that the father stone the son, the son the father, being positive, and though founded on the law of nature, that a man prefer his Lord Creator and God before son or father and mother, yet are they not precepts of the law of nature such as is the precept of nature that a man desire his own life and being, the father the life and being of the son. Assertion 5. The apparent opposition (for it is not real) is rather between Christ‘s sensitive and his sinless mere natural desire and affection, and his reasonable will, than his [human] will and the will of God: Nor can any say there is a fight or jarring between the conditional desire of Christ subjected in the same act of praying, to the Lord’s decree and the resolute and immutable will of God. The Law of God, because holy and spiritual, does require a conformity between all the inclinations and motions of our soul and the law of nature; but an absolute conformity between all our inclinations and every positive command of God, such as was the Lord’s command that Christ should die for sinners, is not required in the Law of God. If Adam submit his natural hunger or desire to eat of the forbidden tree, to God’s Law, and eat not, there is no sinful jarring between his will and God’s positive Law, ‘Thou shalt not eat of the tree of Knowledge of good and evil.’</p></blockquote>

+sacrificed+for+the+sins+of+the+world%2C+no+prick+in+this+Rose%2C+no+cloud+in+this+fair+Sun%2C+no+blemish+in+this+beautiful+Well-beloved.+Assertion+2.+An+absolute%2C+resolved+will+or+desire+of+heart+to+lust+after+that+which+God+forbids+in+his+Law+must+be+a+sinful+jarring+between+the+creature%E2%80%99s+and+the+Creator%E2%80%99s+will.+Now%2C+Christ%E2%80%98s+will+was+conditional+and+clearly+submissive%3B+it+lay+ever+level+with+his+Father%E2%80%99s+holy+will.+Assertion+3.+I+shall+not+with+some+affirm+that+which+in+the+general+is+true%2C+a+will+contrary+to+God%E2%80%99s+revealed+command+and+will%2C+called+voluntas+signi%2C+which+is+our+moral+rule+to+oblige+us%2C+is+a+sin+%5Bsee+Assertion+4+below%5D%3B+but+a+will+contrary+to+God%E2%80%99s+decree%2C+called+voluntas+beneplaciti%2C+which+is+not+our+rule+obliging%2C+except+the+Lord+be+pleased+to+impose+it+on+us+as+a+moral+Law%2C+is+not+a+sin.+Peter+and+the+apostles%2C+after+they+heard+that+prophecy+of+their+denying+of+Christ+and+their+being+sinfully+scandalized%2C+and+their+forsaking+of+Christ+when+the+Shepherd+was+smitten%2C+were+obliged+to+have+a+will+contrary+to+that+decree+and+to+pray+that+they+might+not+be+led+into+temptation%2C+but+might+have+grace+to+confess+their+Savior+before+men+and+not+flee%2C+nor+be+scattered%3A+Here+is+a+resolute+will+of+men+lawfully+contrary+to+the+revealed+decree+of+God%2C+yet+not+sinful.+But+the+Lord%E2%80%99s+will+that+Christ+should+die+for+man%2C+as+it+was+a+decree+of+the+wise+and+most+gracious+Lord+pitying+lost+man%2C+so+was+it+also+a+revealed+commandment+to+Christ%2C+that+He+should+be+willing+to+die+and+be+obedient+to+the+death%2C+even+the+death+of+the+cross%2C+Phil.+2%3A8%3B+yea%2C+a+rule+of+such+humble+obedience+as+we+are+obliged+to+follow%2C+as+is+said%2C+verse+5%2C+%E2%80%98Let+this+mind+be+in+you%2C+which+was+also+in+Christ+Jesus%2C%E2%80%99+etc.+If+the+Lord%E2%80%99s+will+that+Christ+should+die+be+nothing+but+his+mere+decree%2C+it+could+not+oblige+us+in+the+like+case+to+be+willing%2C+as+John+says+to+lay+down+our+life+for+the+brethren.+Yea%2C+Jn.+10%3A18%2C+Christ+has+a+commandment+of+God+and+the+revealed+will+of+God+to+die+for+us%3A+%E2%80%98No+man+takes+it+from+Me%2C+but+I+lay+it+down+of+myself%3A+I+have+power+to+lay+it+down%3B+I+have+power+to+take+it+again%3A+this+commandment+have+I+received+of+my+Father.%E2%80%99+Here+is+an+express+commandment+given+to+Christ+to+die+for+sinners%3B+and+the+Father+loves+Christ+for+obedience+to+this+commandment.+Assertion+4.+A+conditional+and+a+submissive+desire%2C+though+not+agreeable+to+a+positive+law+and+commandment+of+God%2C+is+no+sin%2C+nor+does+the+Law+require+a+conformity+in+all+our+inclinations+and+the+first+motions+of+our+desires+to+every+command+of+God%2C+though+most+contrary+to+nature+and+our+natural+and+sinless+inclinations.+1.+If+God+command+Abraham+to+kill+his+only+begotten+son+and+offer+him+in+a+sacrifice+to+God%2C+which+was+a+mere+positive+commandment%2C+for+it%E2%80%99s+not+a+command+of+the+law+of+nature+%28nor+any+other+than+positive%29+for+the+father+to+kill+the+son%2C+if+yet+Abraham+retain+a+natural+inclination+and+love+commanded+also+in+the+law+of+nature+to+save+his+son%E2%80%99s+life+and+to+desire+that+he+may+live%2C+this+desire+and+inclination%2C+though+contradictory+to+a+positive+command+of+God%2C+is+no+sin%3B+because+the+Fifth+Command%2C+grounded+on+the+law+of+nature%2C+does+command+it.+Nor+did+God%E2%80%99s+precept+%28%E2%80%98Abraham%2C+kill+now+thy+son%2C+even+Isaac+thine+only+begotten+son%E2%80%99%29+ever+include+this%2C+%E2%80%98Abraham%2C+root+out+of+thine+heart+all+desire+and+inclination+natural+in+a+father+to+preserve+the+life+of+the+child.%E2%80%99+So+the+positive+command+of+the+Father+that+the+Son+of+God+should+lay+down+his+life+for+his+sheep%2C+did+never+root+out+of+the+sinless+nature+of+the+man-Christ+a+natural+desire+to+preserve+his+own+being+and+life%2C+especially+He+desiring+it+with+special+reservation+of+the+will+of+God+commanding+that+He+should+die.+2.+A+martyr+dying+for+the+truth+of+Christ+may+have+a+natural+and+conditional+desire+and+inclination+to+live%2C+though+his+living+be+contrary+to+the+Lord%E2%80%99s+revealed+will+commanding+him+to+seal+the+Gospel+with+his+blood+and+to+confess+Christ+before+men.+3.+If+the+brother%2C+son%2C+daughter%2C+wife+or+friend+that+is+as+a+man%E2%80%99s+own+soul%2C+Dt.+13%3A6%2C+blaspheme+God%2C+yea+if+father+or+mother+do+it%2C+Dt.+33%3A8-9%2C+yet+is+a+father+obliged+to+stone+the+son+or+daughter%2C+the+son+being+a+magistrate+or+a+Levite+and+priest%2C+to+judge+according+to+law+%28the+priests%E2%80%99+lips+should+preserve+knowledge%2C+Mal.+2%3A8%29+that+his+father+or+mother+ought+to+be+stoned+to+death%3B+yet+ought+not+father+or+son+to+lay+aside+that+natural+desire+of+being+and+life+to+son%2C+father%2C+brother+which+the+law+of+nature+in+the+Fifth+Command+does+require%2C+especially+the+desire+being+conditional%2C+with+submission+to+God%E2%80%99s+will%2C+as+the+desire+of+Christ+is+here%3B+and+the+command+to+stone+the+blasphemer%2C+that+the+father+stone+the+son%2C+the+son+the+father%2C+being+positive%2C+and+though+founded+on+the+law+of+nature%2C+that+a+man+prefer+his+Lord+Creator+and+God+before+son+or+father+and+mother%2C+yet+are+they+not+precepts+of+the+law+of+nature+such+as+is+the+precept+of+nature+that+a+man+desire+his+own+life+and+being%2C+the+father+the+life+and+being+of+the+son.+Assertion+5.+The+apparent+opposition+%28for+it+is+not+real%29+is+rather+between+Christ%E2%80%98s+sensitive+and+his+sinless+mere+natural+desire+and+affection%2C+and+his+reasonable+will%2C+than+his+%5Bhuman%5D+will+and+the+will+of+God%3A+Nor+can+any+say+there+is+a+fight+or+jarring+between+the+conditional+desire+of+Christ+subjected+in+the+same+act+of+praying%2C+to+the+Lord%E2%80%99s+decree+and+the+resolute+and+immutable+will+of+God.+The+Law+of+God%2C+because+holy+and+spiritual%2C+does+require+a+conformity+between+all+the+inclinations+and+motions+of+our+soul+and+the+law+of+nature%3B+but+an+absolute+conformity+between+all+our+inclinations+and+every+positive+command+of+God%2C+such+as+was+the+Lord%E2%80%99s+command+that+Christ+should+die+for+sinners%2C+is+not+required+in+the+Law+of+God.+If+Adam+submit+his+natural+hunger+or+desire+to+eat+of+the+forbidden+tree%2C+to+God%E2%80%99s+Law%2C+and+eat+not%2C+there+is+no+sinful+jarring+between+his+will+and+God%E2%80%99s+positive+Law%2C+%E2%80%98Thou+shalt+not+eat+of+the+tree+of+Knowledge+of+good+and+evil.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+138-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfce7c195b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cfce7c195b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=%E2%80%98But%20for%20this%20cause%20came%20I,of%20Knowledge%20of%20good%20and%20evil.%E2%80%99" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Question 10: Whether the will is rightly distinguished into antecedent and consequent? Distinguished. Answer: If by “antecedent” be understood the declaration of the divine will, and of the order posited by it between the condition and the conditioned thing: Affirmed. E.g., “if anyone believes,” or “if anyone perseveres, he shall be saved”: which is equivalent to that categorical enunciation, “every believer or persevering one shall be saved.</p></blockquote>

<blockquote><p>(2) We have found that God Himself expresses an ardent desire for the fulfilment of certain things which He has not decreed in his inscrutable counsel to come to pass. This means that there is a will to the realization of what He has not decretively willed, a pleasure towards that which He has not been pleased to decree. This is indeed mysterious, and why He has not brought to pass, in the exercise of his omnipotent power and grace, what is his ardent pleasure lies hid in the sovereign counsel of his will. We should not entertain, however, any prejudice against the notion that God desires or has pleasure in the accomplishment of what he does not decretively will. (3) Our Lord Himself in the exercise of his messianic prerogative provides us with an example of the foregoing as it applies to the matter of salvation. He says expressly [in Mt. 23:37] that He willed the bestowal of his saving and protecting grace upon those whom neither the Father nor he decreed thus to save and protect.</p></blockquote>

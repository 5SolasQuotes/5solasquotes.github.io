<main class="wrap"><figure class="quote" id="q-7251b10f7e" data-kw="">
<blockquote><p>By justifying faith we understand, not only the common belief of the articles of the Christian religion, and a persuasion of the truth of God’s Word in general, but also a particular application of the gracious promises of the gospel to the comfort of our own souls, whereby we lay hold on Christ with all His benefits, having an earnest trust and confidence in God, that He will be merciful unto us for His only Son’s sake. So that a true believer may be certain, by the assurance of faith, of the forgiveness of his sins, and of his everlasting salvation by Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-ireland.html">Church of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Irish Articles</cite>, 1615, Art. 37</span></figcaption>

</figure><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</span></figcaption>

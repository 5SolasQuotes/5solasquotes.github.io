<blockquote><p>Is evangelical obedience a condition for the continuation of our justification? This is not a straightforward question. A simple yes or no betrays an understanding of the various senses in which the statement may be true or false.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jones.html">Mark Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Fairly Vanilla Theology: Justification &amp; Good Works” (2025) at Reformation21</cite></span></figcaption>

<blockquote><p>§VI. Thirdly, when we say it [justification] is an action of God imputing to a believing sinner, etc. we consider it not as a sudden and momentary action which is of no continuance, as if all our sins both past, present and to come are remitted in an instant, but as an act of God continued from our vocation [calling], wherein the grace of faith is begotten in us, to our glorification, which is the end of our faith. For as this action of God is called the justification of a sinner, so while we continue sinners, we have still need to be justified. And as we always have sin in this life, so that it may not be imputed, we have need, that Christ’s righteousness should be imputed unto us; and that as we sin daily, so Christ our advocate should continually make intercession for us: that notwithstanding our manifold slips, whereinto through human frailty we fall, and notwithstanding those manifold infirmities and corruptions which remain in us as the relics of original sin, we may be continued in the grace and favor of God by the continued imputation of Christ’s righteousness obtained by his continual intercession for us. For therefore does he continue his intercession for us that our justification may be continued to us, and that as we sin daily, so we may daily seek and obtain pardon. But if justification should so be wrought once and at once, as that after that act wrought in an instance, we should no more be justified, nor no more need remission of sin, then must we erroneously conceive that the sins which after the first moment of our justification we do commit, are actually remitted before they be committed; whereas God forgives only sins past, Rom. 3:25. So shall we not only set open a gap to all licentiousness (for who will so fear to commit sin as he ought, or when he has committed it so sue for the pardon thereof who is persuaded beforehand that it is already remitted), but also shall open the mouths of our adversaries, who will be ready to say, that we Protestants ought not to pray for remission of sin, because in our opinion (as they say) we need it not: but to this calumniation of the Papist I have elsewhere answered. §. VII. If it be said that it is a received opinion among many that justificatio simul et semel sit, that ‘justification is wrought at once, and but once,’ I answer that that assertion is not to be admitted without distinction, nor without good caution. The distinction is this, that there is a justification of a sinner before God in foro coelesti, which properly is called justification, and is that which here I have defined: and there is a justification whereby a man already justified before God is justified in foro conscientiae, in the court of his own conscience: which is not properly justification itself, but the assurance of it. To this latter that assertion of but once and at once cannot in any good sense be applied. For neither is the full assurance of our justification attained at once, but by degrees, wherein we are to labor and to give diligence to make, as our election and calling, so also our justification more and more sure unto us. Neither is it given but once. For by committing of any crime or any grievous sin, by spiritual desertions, by the forcible temptations of Satan, this act of spiritual faith, which we call assurance, may be interrupted or lost for a time; and yet by repentance, by prayer and practice of piety it may be recovered again, and therefore not given but once. To the former indeed it may be applied in both parts, but with a twofold caution: first, in respect of simul, at once, if it be understood as excluding degrees, and not continuance. Namely, that we are not justified by degrees, and as it were by little and little, as though our justification were not perfect at the first. For no sooner does a man truly believe in Christ, but the righteousness of Christ is imputed to him, and in and by that righteousness he stands righteous before God, as well at the first, as at the last; that righteousness of Christ by which he is justified, whether first or last, being most perfect. Therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men: howsoever the assurance of justification, and the work of sanctification, whereby we are to be renewed in the inner man day by day have degrees, according to the degrees of our faith, and according to the measure of grace received. Secondly, when it is said that we are justified before God semel, but once, that also may be admitted, if by once be meant one continual act. For as we are regenerated but once, because ut semel nascimur, ita semel renascimur, [‘as we have been born once, so we have been reborn once,’] so faith, which is wrought in our regeneration is given but once. For that which saint Jude says, verse 3, of faith once given, is no less true of the habit [abiding principle] than of the doctrine of faith; which habit, being once had, is never utterly lost. For all they who have true faith, are born of God, 1 Jn. 5:1; Jn. 1:12-13. And those who are once born of God are never unborn again; but being made sons by faith, as all the faithful are, Gal. 3:26, they are also made heirs of God and coheirs with Christ, Rom. 8:17. As faith therefore is never utterly lost, no more is justification. For so long as we have faith, so long we are justified. But the habit of faith we never lose, though perhaps some act of faith may sometimes be interrupted. Therefore our justification is but one continued act, and in that sense we are justified but once. §VIII. Now whereas we have defined and defended according to the Scriptures that justification is an action of God, and such an action as is without us and a continued act: hence we may conclude against the Papists: First, that neither their first, nor second justification is that justification which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.</p></blockquote>

n which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.”

ly%2C+that+we+are+not+justified+by+degrees%2C+and+as+it+were+by+little+and+little%2C+as+though+our+justification+were+not+perfect+at+the+first.+For+no+sooner+does+a+man+truly+believe+in+Christ%2C+but+the+righteousness+of+Christ+is+imputed+to+him%2C+and+in+and+by+that+righteousness+he+stands+righteous+before+God%2C+as+well+at+the+first%2C+as+at+the+last%3B+that+righteousness+of+Christ+by+which+he+is+justified%2C+whether+first+or+last%2C+being+most+perfect.+Therefore+the+righteousness+of+justification+cannot+be+increased%2C+neither+does+our+justification+before+God+admit+degrees%2C+either+in+one+and+the+same+person%2C+or+yet+in+diverse+men%3A+howsoever+the+assurance+of+justification%2C+and+the+work+of+sanctification%2C+whereby+we+are+to+be+renewed+in+the+inner+man+day+by+day+have+degrees%2C+according+to+the+degrees+of+our+faith%2C+and+according+to+the+measure+of+grace+received.+Secondly%2C+when+it+is+said+that+we+are+justified+before+God+semel%2C+but+once%2C+that+also+may+be+admitted%2C+if+by+once+be+meant+one+continual+act.+For+as+we+are+regenerated+but+once%2C+because+ut+semel+nascimur%2C+ita+semel+renascimur%2C+%5B%E2%80%98as+we+have+been+born+once%2C+so+we+have+been+reborn+once%2C%E2%80%99%5D+so+faith%2C+which+is+wrought+in+our+regeneration+is+given+but+once.+For+that+which+saint+Jude+says%2C+verse+3%2C+of+faith+once+given%2C+is+no+less+true+of+the+habit+%5Babiding+principle%5D+than+of+the+doctrine+of+faith%3B+which+habit%2C+being+once+had%2C+is+never+utterly+lost.+For+all+they+who+have+true+faith%2C+are+born+of+God%2C+1+Jn.+5%3A1%3B+Jn.+1%3A12-13.+And+those+who+are+once+born+of+God+are+never+unborn+again%3B+but+being+made+sons+by+faith%2C+as+all+the+faithful+are%2C+Gal.+3%3A26%2C+they+are+also+made+heirs+of+God+and+coheirs+with+Christ%2C+Rom.+8%3A17.+As+faith+therefore+is+never+utterly+lost%2C+no+more+is+justification.+For+so+long+as+we+have+faith%2C+so+long+we+are+justified.+But+the+habit+of+faith+we+never+lose%2C+though+perhaps+some+act+of+faith+may+sometimes+be+interrupted.+Therefore+our+justification+is+but+one+continued+act%2C+and+in+that+sense+we+are+justified+but+once.+%C2%A7VIII.+Now+whereas+we+have+defined+and+defended+according+to+the+Scriptures+that+justification+is+an+action+of+God%2C+and+such+an+action+as+is+without+us+and+a+continued+act%3A+hence+we+may+conclude+against+the+Papists%3A+First%2C+that+neither+their+first%2C+nor+second+justification+is+that+justification+which+is+taught+in+the+Scriptures%E2%80%A6+Not%2C+that+we+deny%2C+that+inherent+righteousness+is+by+practice+of+good+works+increased%3B+but+that+we+hold+that+justification+is+not+our+own+act%2C+neither+that+we+are+justified+by+any+righteousness+inherent+in+ourselves%2C+or+performed+by+ourselves%2C+nor+that+the+righteousness+of+justification+%28which+is+indeed+the+righteousness+of+Christ%29+can+be+increased%2C+and+therefore+no+degrees+of+justification.+%E2%80%A6+Thirdly%2C+they+do+not+hold+justification+to+be+one+continued+act+from+our+vocation+to+our+glorification%2C+but+such+an+act+as+may+not+only+be+interrupted+oftentimes+and+lost+for+a+time%2C+as+they+say+it+is%2C+by+every+mortal+sin+and+again+be+renewed+so+oft+as+they+go+to+shrift%3B+but+also+that+it+may+totally+and+finally+be+lost.+Which+error+I+have+confuted+at+large+in+my+treatise+of+Perseverance.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+A+Treatise+of+Justification+%28London%3A+1633%29%2C+ch.+1%2C+pp.+5-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F87e306e19e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/87e306e19e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=VI.%20Thirdly%2C%20when%20we%20say%20it,large%20in%20my%20treatise%20of%20Perseverance&amp;text=VI.%20Thirdly%2C%20when%20we%20say%20it%20%5Bjustification%5D%20is&amp;text=confuted%20at%20large%20in%20my%20treatise%20of%20Perseverance" rel="noopener" target="_blank">Read it online · Reformed Books Onl <blockquote><p>3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.</p></blockquote>

<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification… (London: Underhill, 1654), pt. 2, | sermon 13, n.p.</cite></span></figcaption>

<blockquote><p>4. The Holy Ghost speaks generally of all men, whether regenerate or unregenerate, and of all works, whether going before faith or following it, that a man, that is, every one, who is justified, is justified by faith without the works of the law, Rom. 3:28, that a man is not justified (that is, that no man is justified) by the works of the Law, but by the faith of Jesus Christ, for by the works of the Law no flesh, that is, as the Psalmist speaks, no man living shall be justified, Gal. 2:16. For as in the first act of justification we are justified by faith without respect of works, so our justification is continued unto us without respect of our works. And this appears most plainly in the examples of Abraham, of Job, of David, of Paul, etc. as I showed before, who, though they abounded with good works which they wrought by faith, yet were not justified by them, but by faith only. For that which Chrysostom says of Abraham is also verified of all the godly: for, says he, that a man having not works should be justified by faith, it is no unlikely thing: [Greek], but this, that a man flourishing in good works, should not thereby be justified, but by faith, it was wonderful, and very much sets forth the force of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification (London: 1633)</cite>, ch. 2, ‘That we are not justified by works’, pp. 446-47</span></figcaption>

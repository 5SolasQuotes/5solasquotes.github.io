<main class="wrap"><figure class="quote" id="q-636552f25c" data-kw="">
<blockquote><p>They say natural or physical necessity takes away liberty, but moral necessity does not; at the same time, they explain moral necessity so as to make it truly physical or natural.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“They say natural or physical necessity takes away liberty, but moral necessity does not; at the same time, they explain moral necessity so as to make it truly physical or natural.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9b5a185f1" data-kw="">
<blockquote><p>I willingly grant that the determination of the end does necessarily involve the means, that not only precede but procure the end. But I will utterly deny that sin is the means of damnation; we say rather that permission of sin is the means, whence notwithstanding it follows not that sin shall come to pass unavoidably, but rather avoidably, whether we consider the free will of man or the decree of God; for every particular sinful act is a natural thing, and undoubtedly man has free will as to do, so to abstain from doing, any particular act. And albeit God has determined that these particular sinful acts (instance the particular outrages committed against the holy Son of God by Herod, Pontius Pilate, together with the Gentiles and people of Israel) shall come to pass by his permission; yet seeing withal He has ordained them to come to pass contingently, that follows that they shall come to pass in such a manner as joined with a possibility of not coming to pass; otherwise they should come to pass not contingently but necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Riches of God’s Love (Oxford, 1653), bk. 1</cite>, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-1397d360fd" data-kw="">
<blockquote><p>That the will even of Lapsed man is held by no motive or impulsive necessity with respect to God; for He gave free will to men, and consequently does not totally take away that faculty by imposing necessity on it, either by his eternal decree, or by a temporal motion and inflexion.</p></blockquote>

</figure><figure class="quote" id="q-9a82b885b5" data-kw="">
<blockquote><p>When God (Deut. 17) forbids them [Israel] to choose a stranger [as king], He presupposes they may choose a stranger; for God’s law now given to man in the state of sin, presupposes he has corruption of nature to do contrary to God’s law. Now if God did hold forth that their setting a king over them was but the people’s approving the man whom God shall both constitute and design to be king, then he [John Maxwell] should presuppose that God was to design a stranger to be the lawful king of Israel, and the people should be interdicted to approve and consent that the man should be king whom God should choose; for it was impossible that the people should make a stranger king (God is the only immediate king-creator), the people should only approve and consent that a stranger should be king; yet, upon supposition that God first constituted and designed the stranger king, it was not in the people’s power that the king should be a brother rather than a stranger, for if the people have no power to make a king, but do only approve him or consent to him, when he is both made and designed of God to be king, it is not in their power that he be either brother or stranger, and so God commands what is simply impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

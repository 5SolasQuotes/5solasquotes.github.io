<main class="wrap"><figure class="quote" id="q-119f955e06" data-kw="">
<blockquote><p>Because there is explicit mention of children, servants, and sojourners, one gathers from this that parents, heads of households, and magistrates are not only required to hallow the Sabbath themselves but also to see to it that the children, servants, and sojourners entrusted to their hospitality and care hallow it as well. As far as the sharing of religion [religionis communicatio] is concerned, there is no difference between parents and children, masters and servants, rulers and subjects, “for there is one Lord of all, one faith for all, one hope and inheritance for all” (Eph. 4:4–5).

Finally, because foreigners were commanded to rest from working on the seventh day, it is clear that even though they were not forced to assume Israel’s religion, those foreigners were still required to submit themselves to God’s Law in external matters. This has been set before the Christian ruler to be imitated in its own way. Had sojourners been allowed to work on the Sabbath, not only would their example have been a source of offense to the Israelites, but also their own servile tasks could have resulted in a fraudulent evasion of the Law through them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Commonplaces: On the Law of God, on the Ceremonial and Forensic Laws</cite>, trans. Richard J. Dinda, ed. Benjamin T. G. Mayes and Joshua J. Hayes (1613; St Louis MO: Concordia Publishing House, 2015), XV.4.9.3. § 133.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

Finally, because foreigners were commanded to rest from working on the seventh day, it is clear that even though they were not forced to assume Israel’s religion, those foreigners were still required to submit themselves to God’s Law in external matters. This has been set before the Christian ruler to be imitated in its own way. Had sojourners been allowed to work on the Sabbath, not only would their example have been a source of offense to the Israelites, but also their own servile tasks could have resulted in a fraudulent evasion of the Law through them.”

<blockquote><p>47. The rest of the day is to be spent in pious activity. Formerly there was an offering peculiar to the sabbath, but the continued or daily offering with its drink offering was not to be omitted, Num. 28:10.

</figure><figure class="quote" id="q-0af9684ee6" data-kw="">
<blockquote><p>GOD has created all things according to His will and purpose (Proverbs 16:4). Hence all things should be directed toward God and be at His service. Anything made is indeed intended to be useful to its maker. Yet a pot cannot by itself help the potter to understand and to speak. Hence, just as objects which man manufactures cannot help man to be man—that is, to exercise his thought and word—so all creatures, not having a character comparable to that of God, cannot help their Creator in divine things. Nothing can help God to be God. Nothing can keep Him from acting as God. …

God, however, does not need man’s services, because in Himself and by Himself He has and is everything. Being almighty, He can very well do without man. He neither needs nor asks man to help His divine being, which is beyond man’s knowledge and comprehension. God’s reason for creating us and all creatures is to make His goodness known. He willed that whatever thing exists through His goodness should recognize it and rejoice over it. This is why we His creatures may and should be of service to Him in the administration of His goodness. Namely, each creature, together with its endowments and gifts from God, should serve all others in view of the good of all creatures, to the end that everywhere this praise to God may resound: The Lord is good in all things, and His liberality is over all His works (Psalm 145:9). And thus, as this same Psalm says, we will speak forth the celebration of His great goodness and joyously proclaim His righteousness (Verse 7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instruction in Christian Love</cite>, trans. Paul T. Fuhrmann (1523; Richmond VA: John Knox Press, 1952), pp 21, 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-bf3819461b" data-kw="">
<blockquote><p>You, in the first place, touch upon justification by faith, the first and keenest subject of controversy between us. Is this a knotty and useless question? Wherever the knowledge of it is taken away, the glory of Christ is extinguished, religion abolished, the Church destroyed, and the hope of salvation utterly overthrown.

That doctrine, then, though of the highest moment, we maintain that you have nefariously effaced from the memory of men. Our books are filled with convincing proofs of this fact, and the gross ignorance of this doctrine, which even still continues in all your churches, declares that our complaint is by no means ill-founded. But you very maliciously stir up prejudice against us, alleging that, by attributing every thing to faith, we leave no room for works.

I will not now enter upon a full discussion, which would require a large volume; but if you would look into the Catechism which I myself drew up for the Genevans, when I held the office of Pastor among them, three words would silence you. Here, however, I will briefly explain to you how we speak on this subject.

First, We bid a man begin by examining himself, and this not in a superficial and perfunctory manner, but to sift his conscience before the tribunal of God, and when sufficiently convinced of his iniquity, to reflect on the strictness of the sentence pronounced upon all sinners. Thus confounded and amazed at his misery, he is prostrated and humbled before God; and, casting away all self-confidence, groans as if given up to final perdition.

Then we show that the only haven of safety is in the mercy of God, as manifested in Christ, in whom every part of our salvation is complete. As all mankind are, in the sight of God, lost sinners, we hold that Christ is their only righteousness, since, by his obedience, he has wiped off our transgressions; by his sacrifice, appeased the divine anger; by his blood, washed away our stains; by his cross, borne our curse; and by his death, made satisfaction for us. We maintain that in this way man is reconciled in Christ to God the Father, by no merit of his own, by no value of works, but by gratuitous mercy. When we embrace Christ by faith, and come, as it were, into communion with him, this we term, after the manner of Scripture, the righteousness of faith.

What have you here, Sadolet, to bite or carp at? Is it that we leave no room for works? Assuredly we do deny that, in justifying a man, they are worth one single straw. For Scripture everywhere cries aloud, that all are lost; and every man’s own conscience bitterly accuses him. The same Scripture teaches, that no hope is left but in the mere goodness of God, by which sin is pardoned, and righteousness imputed to us. It declares both to be gratuitous, and finally concludes that a man is justified without works, (Rom. iv. 7.)

But what notion, you ask, does the very term Righteousness suggest to us, if respect is not paid to good works? I answer, if you would attend to the true meaning of the term justifying in Scripture, you would have no difficulty. For it does not refer to a man’s own righteousness, but to the mercy of God, which, contrary to the sinner’s deserts, accepts of a righteousness for him, and that by not imputing his unrighteousness. Our righteousness, I say, is that which is described by Paul, (2 Cor. v. 19,) that God bath reconciled us to himself in Jesus Christ. The mode is afterwards subjoined – by not imputing sin.

He demonstrates that it is by faith only we become partakers of that blessing, when he says that the ministry of reconciliation is contained in the gospel. But faith, you say, is a general term, and has a larger signification. I answer, that Paul, whenever he attributes to it the power of justifying, at the same time restricts it to a gratuitous promise of the divine favour, and keeps it far removed from all respect to works. Hence his familiar inference – if by faith, then not by works. On the other hand – if by works, then not by faith.</p></blockquote>

<blockquote><p>Even as David also does expound the blessedness of that man, to whom the Lord imputes righteousness without works, saying: ‘Blessed are they whose iniquities are forgiven, and whose sins are covered’.” [Rom. 4:7] What could be more plainly spoken than this? For he does evidently expound justification by sanctification, and sanctification by remission of sins. Furthermore, what else is sanctification but the adoption whereby we are received into the grace and number of the sons of God? What is he therefore that sees not, that in this treatise of St. Paul justification is taken for adoption? especially, since in the very same fourth chapter to the Romans he goes about to prove that an inheritance is due to faith, whereunto also he does attribute justification. By all this it is made manifest that the question of justification contains nothing else but the manner and reason of sanctification; that is to say, whereby and how men have their sins forgiven, and are received into the grace and number of the sons of God, and, being justified, are made heirs of the kingdom of God.</p></blockquote>

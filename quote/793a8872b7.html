<main class="wrap"><figure class="quote" id="q-793a8872b7" data-kw="">
<blockquote><p>For strangers are risen up against Me and violent men have sought after My soul; they have not set God before their eyes. The Only-begotten Son of God, the Word of God and God the Word—although assuredly He could Himself do all things that the Father could, as He says: What things soever the Father doeth, the Son also doeth in like manner, while the name describing the divine nature which was His inseparably involved the inseparable possession of divine power,—yet in order that He might present to us a perfect example of human humility, both prayed for and underwent all things that are the lot of man.

Sharing in our common weakness He prayed the Father to save Him, so that He might teach us that He was born man under all the conditions of man’s infirmity. This is why He was hungry and thirsty, slept and was weary, shunned the assemblies of the ungodly, was sad and wept, suffered and died. And it was in order to make it clear that He was subject to all these conditions, not by His nature, but by assumption, that when He had undergone them all He rose again. Thus all His complaints in the Psalms spring from a mental state belonging to our nature. Nor must it cause surprise if we take the words of the Psalms in this sense, seeing that the Lord Himself testified, if we believe the Gospel, that the Psalms spiritually foretold His Passion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily on Psalm LIII</cite>, 7 in Nicene and Post-Nicene Fathers 2, 9: 245.</span></figcaption>

<blockquote><p>24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not.</p></blockquote>

<blockquote><p>The light of nature, which is a spark of the will of God, has taught many useful rules even to pagans, anent the right way of making solemn speeches before others, the most of which are to be applied to preaching with due discretion; so that what is thought unseemly in the one is to be avoided in the other. But the best rules are taken from the preachings of Christ, of the apostles and prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’</cite>, vol. 1, p. 288</span></figcaption>

</figure><figure class="quote" id="q-4bcef8abf1" data-kw="">
<blockquote><p>Whenever someone has a serious problem and they look to other people for help, they often get told that “everything is going to be fine.” The Church of Ireland theologian, George Salmon (1819-1904) notes that to do so is to heal the wounds of others lightly:

Such comforting assurances are often easily given because they cost so little. They relieve him who makes them from the burden of a painful demand on him for sympathy. One is not always in the mood to mourn with those who mourn, or even to seem to mourn, and so it is pleasant to be able to persuade oneself that the need for such an effort has not arisen and may never arise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cathedral and University Sermons</cite>, (2nd edn, London: John Murray, 1901), p. 137.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-80a0035d97" data-kw="">
<blockquote><p>God hath made it the duty of men to spend their appointed time in the world, in his Service &amp; to his Glory, And indeed it is most just and reasonable that it should be so; for God is a Being of infinite Dignity &amp; Excellency, and all men have received their life &amp; being from Him, and he sustains them day and night and keeps them every moment: He is the Fountain of all that good that they enjoy or hope for. Upon God men have an absolute and entire dependence for all that they have, and for all that they need, &amp; that both for time &amp; eternity; and to Him they are under the highest Obligations: And therefore by the very law of their Creation, &amp; by all the laws &amp; rules of Reason &amp; equity, of Gratitude Piety, Prudence &amp; Self-interest, they are bound to serve and glorify God.

And indeed that men should spend their whole time, &amp; improve all their opportunities &amp; talents for that God who is a Being of all possible Perfection, whose Creatures they are, and whose Service and Glory is the very end of their being, &amp; of all that they are &amp; have, is a duty so reasonable, that there can be no just Objection against it, nor any good Excuse made for the neglect of it. Deut. 10.12. And now, Israel, what doth the Lord thy God require of thee, but to fear the Lord thy God, &amp; to walk in his ways, &amp; to love him, &amp; to serve the Lord thy God, with all thy heart, and with all thy soul?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-edwards.html">Timothy Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All the living must surely die, and go to judgment. A sermon (with some little, and but little enlargement in a few particulars) preached before the General Assembly of the colony of Connecticut at Hartford, on the day of election there, on May 11th. 1732</cite>, (New London CN: T. Green, 1732), pp 9-10.</span></figcaption>

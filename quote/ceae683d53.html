<main class="wrap"><figure class="quote" id="q-ceae683d53" data-kw="">
<blockquote><p>These are public duties. The private are some with reference to the public to prepare for it, and make use of it before and after, fitting our hearts to hear by prayer and meditation, and the like, and by praying and meditation applying that to our selves which we have heard, as the Bereans examined the Doctrine of Paul; some again without such reference, as all holy exercises of singing of Psalms, prayer, meditation, reading, together with actions of mercy, in laying aside as God hath blessed us for the use of the poor, and in visiting and relieving the sick, comfortless, needy, and the like; all which are acts as well of holiness toward God, as of mercy toward men. Especially we must know that it is our duty to meditate upon the great works of our Creation and Redemption, and our eternal rest in heaven, seeing the Sabbath is given us as a memorial of the two former, and an assurance of the later, that being the excellent rest, our entering into which this holy rest doth point at and help unto.

We must not only keep the Sabbath in the Church-meetings and solemn Assemblies (though it be specially appointed for the public worship) but at home in our houses, Levit. 23. 3. We must awake with God in the morning, begin with him, rise early, spend not much time in dressing of our selves that day, it is the Sabbath of the Lord, have holy thoughts while we are dressing our selves, pray to the Lord to pardon all our sins, and to put us into a holy frame, and yet finish all this so soon that we may be with the first in the public Assembly.

We may after the first Sermon eat and drink, but for spiritual ends and purposes, that our bodies being refreshed we may be the fitter to serve God, but must take heed of spending too much time, or feeding too liberally, which may cause drowsiness. We must then season all with heavenly discourse, Luke 4. from v. 1. to 25. We must not speak our own words. After the public worship is ended we must call our Families together and repeat what we have heard, and catechize them in the principles of Religion, Heb. 2. 1, 3. the fourth Commandment, sing Psalms and pray. At night we should bless God for the mercies of the day, lie down with a great deal of soul-refreshment, sleeping in the bosom of Jesus Christ.

And this is the matter of the duties to be performed, the manner is to consecrate the same as a delight unto God, with comfort and joy serving him on that day, as we do with comfort and cheerfulness follow our common business on the week days, as the Prophet Isaiah chap. 58. 13. expressly requireth. And call the Sabbath a delight] Call, that is, make or count, an Hebrew phrase often used in Isaiah: Sabbath; Some by it understand the extraordinary Sabbath or day of Fast, because in the beginning of the Chapter there is an expostulation about it, Levit. 16. 31. but the Lord is now speaking of an entire reformation; My holy day, the Sabbath, agree not so properly to an arbitrary Sabbath: A delight] LXX thy delicate things, i. one of the choicest privileges God hath given thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor</cite>, (London: William Lee, 1654), IX.V, pp 819-20.</span></figcaption>

<blockquote><p>Objection 2. Ordination and conformity, and common-prayers and ceremonies are connected with preaching, as one entire service; by partaking therefore of the one we contract the pollution of the other. Answer 1: What God Himself in a moral way joins together, no man may separate, only God Himself: But what God in nature has joined together, He gives us leave to separate, as chaff from wheat, etc. And so likewise for what man joins together, especially in the service of God and such matters thereof as God has not required; A set liturgy or stinted form of prayer for matter and words to be used (much less to be inseparably joined with preaching) is not required by the Lord, nor indeed is there any such necessary dependance by our laws… Answer 2… Nor are they so inseparably joined by our laws: But if they were, it is sufficient to my conscience that God has not so joined them. Our actings, and the reasons or grounds of them, are not to be interpreted in Church-matters by human laws; If they were, it would be difficult to inhabit in some commonwealths with a good conscience. Our living within the precincts of such a parish, our laws interpret as being of the same particular church with them for all Church-ordinances: but this being man’s law only, we judge ourselves not so necessarily involved by our habitation. A Church according to Scripture is a spiritual body: The limits are part of the essence and constitution of such a body, and therefore ought to be spiritual and of the same nature, and not merely human, as is the division of parishes.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Objection 2. Ordination and conformity, and common-prayers and ceremonies are connected with preaching, as one entire service; by partaking therefore of the one we contract the pollution of the other. Answer 1: What God Himself in a moral way joins together, no man may separate, only God Himself: But what God in nature has joined together, He gives us leave to separate, as chaff from wheat, etc. And so likewise for what man joins together, especially in the service of God and such matters thereof as God has not required; A set liturgy or stinted form of prayer for matter and words to be used (much less to be inseparably joined with preaching) is not required by the Lord, nor indeed is there any such necessary dependance by our laws… Answer 2… Nor are they so inseparably joined by our laws: But if they were, it is sufficient to my conscience that God has not so joined them. Our actings, and the reasons or grounds of them, are not to be interpreted in Church-matters by human laws; If they were, it would be difficult to inhabit in some commonwealths with a good conscience. Our living within the precincts of such a parish, our laws interpret as being of the same particular church with them for all Church-ordinances: but this being man’s law only, we judge ourselves not so necessarily involved by our habitation. A Church according to Scripture is a spiritual body: The limits are part of the essence and constitution of such a body, and therefore ought to be spiritual and of the same nature, and not merely human, as is the division of parishes.”

— Philip Nye, A Case of Great &amp; Present Use, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, pp. 20-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+2.+Ordination+and+conformity%2C+and+common-prayers+and+ceremonies+are+connected+with+preaching%2C+as+one+entire+service%3B+by+partaking+therefore+of+the+one+we+contract+the+pollution+of+the+other.+Answer+1%3A+What+God+Himself+in+a+moral+way+joins+together%2C+no+man+may+separate%2C+only+God+Himself%3A+But+what+God+in+nature+has+joined+together%2C+He+gives+us+leave+to+separate%2C+as+chaff+from+wheat%2C+etc.+And+so+likewise+for+what+man+joins+together%2C+especially+in+the+service+of+God+and+such+matters+thereof+as+God+has+not+required%3B+A+set+liturgy+or+stinted+form+of+prayer+for+matter+and+words+to+be+used+%28much+less+to+be+inseparably+joined+with+preaching%29+is+not+required+by+the+Lord%2C+nor+indeed+is+there+any+such+necessary+dependance+by+our+laws%E2%80%A6+Answer+2%E2%80%A6+Nor+are+they+so+inseparably+joined+by+our+laws%3A+But+if+they+were%2C+it+is+sufficient+to+my+conscience+that+God+has+not+so+joined+them.+Our+actings%2C+and+the+reasons+or+grounds+of+them%2C+are+not+to+be+interpreted+in+Church-matters+by+human+laws%3B+If+they+were%2C+it+would+be+difficult+to+inhabit+in+some+commonwealths+with+a+good+conscience.+Our+living+within+the+precincts+of+such+a+parish%2C+our+laws+interpret+as+being+of+the+same+particular+church+with+them+for+all+Church-ordinances%3A+but+this+being+man%E2%80%99s+law+only%2C+we+judge+ourselves+not+so+necessarily+involved+by+our+habitation.+A+Church+according+to+Scripture+is+a+spiritual+body%3A+The+limits+are+part+of+the+essence+and+constitution+of+such+a+body%2C+and+therefore+ought+to+be+spiritual+and+of+the+same+nature%2C+and+not+merely+human%2C+as+is+the+division+of+parishes.%E2%80%9D%0A%0A%E2%80%94+Philip+Nye%2C+A+Case+of+Great+%26+Present+Use%2C+%5BSolemn+League+%26%5D+Covenant+%26+Some+of+them+%5Bare%5D+Supposed+to+be+Scandalous+in+their+Lives%2C+Considered+%26+Affirmatively+Resolved+%281672%3B+1677%29%2C+Consideration+3%2C+pp.+20-22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe648ec0d37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e648ec0d37.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Objection%202.%20Ordination%20and%20conformity%2C%20and,as%20is%20the%20division%20of%20parishes&amp;text=Objection%202.%20Ordination%20and%20conformity%2C%20and%20common%2Dprayers%20and&amp;text=merely%20human%2C%20as%20is%20the%20division%20of%20parishes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

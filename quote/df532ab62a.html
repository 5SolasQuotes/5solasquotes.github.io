<main class="wrap"><figure class="quote" id="q-df532ab62a" data-kw="">
<blockquote><p>Be certain therefore and sure of pardon of thy sins: be certain and sure of everlasting life. Do not now say in thy heart, who shall descend into the deep? that is, doubt not of pardon of thy sins, for that is to fetch up Christ again: neither say thou, who shall ascend up in to heaven? that is, doubt not of eternal bliss, for that is to put Christ out of heaven. But mark what the lord saith unto thee: the word is nigh thee, even in thy mouth and in thy heart, and this is the word of faith which we preach: If thou confess with thy mouth that Jesus Christ is the lord, &amp; believe with thy heart that God raised him up from the dead, thou shalt be safe. If thou believe that Jesus Christ died and rose again, even so shalt thou be assured (saith the Lord God) that dying with Christ, I will bring thee again with him.

Thus dear brother, I thought good to write to thee in the name of the Lord, that thou fearing death for nothing else but because of thy sins, mightest be assured of pardon of them, &amp; so embrace death as a dear friend, &amp; insult against his terror, sting, &amp; power, saying: death where is thy sting? hell where is thy victory? Nothing in all the world so displeaseth the Lord as to doubt of his mercy. In the mouth of two or three witnesses, we should be content. Therefore in that thou hast heard so many witnesses, how that in deed, desiring mercy with the Lord, thou art not sente empty a way: give credit thereto, and say with the good Virgin Mary, behold thy servant (Oh Lord) be it unto me according to thy word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A fruitful treatise and full of heavenly consolation against the fear of death. Whereunto are annexed certain sweet meditations of the kingdom of Christ, of life everlasting, and of the blessed state &amp; felicity of the same</cite>, (London: William Powell, 1564), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c1e3ef88a9" data-kw="">
<blockquote><p>Now this brings me to mention one point that has brought a great deal of confusion to many genuine souls because of the loose way in which it is sometimes spoken of— that is, the difference between faith and assurance.

Christ is the object of faith. Christ is presented in the everlasting gospel as the one who died and who rose again and whose blood is able to cleanse from all sin. Christ is the one in whom there is eternal salvation. God says that whosoever believeth in Christ shall not perish but have everlasting life. Faith unites the soul to Christ as the Saviour of sinners. The soul realises, ‘I am a sinner, an empty sinner, a vile sinner, an undone sinner, a sinner who cannot deliver myself.’ And now, in the exercise of faith, the soul says, ‘Christ has been made precious to my soul by the Holy Spirit, and I embrace him, I believe in him, I trust in him, I embrace him.’ That’s faith, as distinct from assurance.

Now the gospel does not call a sinner to believe that Christ died for him. That’s very important. If you were called to believe that Christ died for you, that would mean that you were called to believe you are saved, which is in fact assurance and not faith. But a sinner who is exercising faith for the first time is exercising faith in order to be saved, not because they know they are saved.

Certainly the apostle spoke of ‘the Son of God, who loved me and, gave himself for me’. But that’s not faith, that’s assurance! What we’re talking about just now is the first exercise of faith that unites the soul to the divine Redeemer. The sinner exercises faith in Christ as the Saviour of sinners, as distinct from having assurance that Christ is the one who died for me. As Paul says, ‘This is a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners.’ That’s the presentation of Christ in the everlasting gospel which faith has to do with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-maclean.html">Donald MacLean</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Searched and Known: An Exposition of Psalm 139:1</cite>, (Stornoway: Reformation Press, Kindle edition, 2018), Kindle Locations 180-194.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-993df5d91b" data-kw="">
<blockquote><p>…being persuaded in my conscience that the Lord had a true Church in this Realm [of England]… which, being assembled out of all the parts of the land in Parliament, did commit this authority to ordain ministers unto the bishops: and knowing out of the Word of God that every true Church has this power and authority to ordain ministers: I considered with myself that though the Church offended in committing this power and authority unto them that by the Law of God were not capable of it, yet I might without sin seek and take the Church’s ordination at their hands: as I may reverence and take the benefit of the prince’s power and authority, which is of God, though it be committed unto and exercised by men that by the Law of God are not capable of it. Secondly, seeing it is a thing not to be refused if a man entering into the ministry might have the approbation of all and every one of the ministers of the Gospel in the land:¹ it seems unto me the approbation of that bishop, that is also a minister and preacher of the Gospel, cannot be deemed to be merely unlawful.² ¹ [That such makes a valid ordination, see ‘The Implicit or Tacit Consent of Church Governors is Sufficient for the Power of Being an Office-Bearer’ and ‘That Persons who enter Church Office by Corruption, with the Standing Consent of the Rest of the Church Governors, is Valid’.] ² [Samuel Rutherford with much of the reformed likewise rightly argued that, while the office of a regular episcopal bishop is not Scriptural, nor do they have power, nor should be given power so that a single bishop could ordain a minister, yet the bishops did receive and maintain, with corruptions, the nature of the ministerial office: ‘That Episcopal Bishops &amp; Prelates are Unlawful but Valid Gospel Ministers’.] Thirdly, the authority of the Christian Magistrate (without whose liking and allowance a minister cannot be admitted to the ministry in peace) coming [joining] to the bishop by act of Parliament, I may more boldly come to him³ for his approbation in regard of the Law: not looking so much unto the man, [but] as regarding with reverence the power of the law and Christian magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 10</cite>, p. 117</span></figcaption>

<blockquote><p>XX. Although the authority of these constitutions is great in the church, we deny that it is absolute, but limited; or that it is equal with the divine laws; or that it is as great a sin to transgress the former as the latter. We deny that they can change the nature of things, so that what are in themselves indifferent can be made necessary and of perpetual right; or that any part of Christian righteousness is in them, much less any merit with God; or that they can extend themselves beyond ecclesiastical polity or good order (eutaxian), which by themselves are not of piety, but only on account of another thing and by accident. Again, we say that they are not to be measured by themselves, but by divine laws, that they may not in anyway obstruct, but may rather subserve the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that… 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word going before or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>

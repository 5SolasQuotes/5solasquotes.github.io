<main class="wrap"><figure class="quote" id="q-ca36a5eaa5" data-kw="">
<blockquote><p>The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout (Soli Deo Gloria, 1992), 1:122-23</span></figcaption>

<blockquote><p>Goodness according to some admits of a threefold consideration: Of nature, which is called perfection. Of manners, called holiness. Of beneficence, id est [that is], a disposition to do good to others; this is properly called benignity: ‘Thou art good and doest good,’ Ps. 119:68. Goodness is either essential or by participation. God is essentially good: He is good of Himself; He is goodness itself: the creature is good by participation, i.e. by a goodness received of God. …the peculiar affection in parents towards their children renders them propense to do them good: and the soul full of matter (like wine which has no vent) propends to pour out itself; so is the Lord affected to do good according as He has willed concerning the creature. … God, who is the increated good, communicates Himself without division, effusion, or multiplication of Himself: all that He communicates, notwithstanding, He remains infinite and the same. God were God blessed forever though He had never willed of his goodness unto any, but if He were not a God of benignity, He were not our God.</p></blockquote>

<blockquote><p>‘For He abounds in pardoning.’ Now, because it is difficult to remove terror from trembling minds, Isaiah draws all argument from the nature of God, that He will be ready to pardon and to be reconciled. Thus the Holy Spirit dwells on this part of doctrine, because we always doubt whether or not God is willing to pardon us; for, although we entertain some thoughts of his mercy, yet we do not venture fully to believe that, it belongs to us. It is not without reason, therefore, that this clause is added, that we may not be hindered by uncertainty or doubt as to his infinite compassion toward us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 55:7</span></figcaption>

<blockquote><p>That God wills the good of men in bestowing any good gifts or graces upon them, needed no proof at all: We have always willingly granted this proposition. Yet for the true understanding thereof it must be observed that when we say, ‘This is God’s will; this is God’s aim or intent,’ these words have not always the same signification. This author [Samuel Hoard, an Arminian], by confounding the diverse meaning of these and the like words, does strangely entangle himself through his whole discourse. First therefore: Anything is said to be according to God’s will which, considered in itself, is according to the goodness and pureness of the Divine nature. This is a perpetual and necessary volition in God, qua Deo placet omne bonum [by which God is pleased by every good thing]. (See [Diego] Ruiz [d. 1632], Of the Will of God, disp. 6, §2, p. 38) And this simplex complacentia [simple complacency] towards all good actions of men, or events unto men, is possible circa creaturas omnes etiam nunquam futuras [about all creatures, even which will never be]. For there is no goodness imaginable which has not an agreement with the good will of God which we call amorem simplicis complacentiae [a love of simple complacency]. Satis constat hujusmodi complacentiam Dei versari circa poenitentiam, gratiam et gloriam possibilem Judae aut cujus libet damnati [It is sufficiently clear that this kind of complacency in God has reference to the possible repentance, grace, and glory of Judas, or of any damned person whatsoever]. (Ruiz, disp. 19, p. 214) But this is not it which we now speak of. 2. Secondly, God is said to will, desire or aim-at that good, for the obtaining whereof He affords fitting means, though withal He wills that it shall be in the liberty of the creature to hinder and frustrate those means, and though He have absolutely decreed to permit the creature to abuse them unto his own destruction. This is that which usually is termed by divines voluntas antecedens, voluntas conditionata, voluntas simplicis complacentiae [the will preceding, will-conditioned, will of simple complacency]. And thus God is said to aim-at or to will and desire the conversion, justification and salvation of those who never shall be converted, justified or saved. Neither must we think that by these men God’s omnipotent will is crossed, because his voluntas simplicis complacentiae [will of simple complacency] is not fulfilled. For the absolute will of God was that in such persons their own free-will might hinder the good effect of his gifts and graces, which He was absolutely resolved to permit for some greater good. Lastly, there is a will in God which strictly and most properly is called voluntas beneplaciti [will of good-pleasure] or his absolute will, which is not only a liking of the good willed unto the creature, and an ordering of fit means whereby the creature (if his own free-will hinder not) may attain it, but a merciful decree of so ordering the means and the very will of the creature, that it shall infallibly and infrustrately obtain the good end whereunto such means were accommodated. And of this will Ruiz truly affirms: Sola haec voluntas absoluta simpliciter amplectitur objectum, et ideo sola simpliciter et absolute meretur nomen voluntatis Beneplaciti [Only this absolute will simply embraces its object, and therefore only it, simply and absolutely, deserves the name of the will of good pleasure.]. (disp. 18, §4, p. 185) We grant, therefore, that in the second acception of the word ‘will,’ God truly wills, likes, desires the repentance, faith, perseverance and salvation of all to whom the Gospel is preached and Christ offered. But in the last and most proper acception, God wills the perseverance and salvation only of his elect, in whom He never ceases working till the happy effect be produced. Our divines at [the Synod of] Dort [1618-1619] granted a true and serious will in God according to the second acception of the word ‘will,’ but not according to the last. Which will simplicis complacentiae [of simple complacency] may stand with absolute reprobation. If this author can be content to acknowledge that for a true, serious and no delusory will, which affords the creature means of repenting, believing and being saved, though under an eternal absolute decree of permitting the final disobedience and perdition of the creature, we will free him from the trouble of answering the places of Scripture, and with him embrace the interpretation of Damascene, who tells us (Of the Orthodox Faith, bk. 4, ch. 20) that albeit the Scriptures do in such places seem to make God’s benefits causes of man’s sin and ruin, yet they must be understood [Greek], not [Greek]. A physician does give his patient physick with an absolute will to cure so far as his skill and ability will stretch: But God does not always give the means of salvation unto all men out of his absolute will, for then all should be cured and saved. Ps. 135, Omnia quaecunque voluit Deus, fecit in coelo et in terra [All which God wills is done in heaven and in earth]. Fulgentius gives the reason (1 ad Mon., ch. 12), Quia cui semper subest cum volet posse, non aliud est in illo velle quam posse [For to whom there is always present the ability whenever he wills, in him to will is nothing other than to be able.]. The will of God inviting or moving men to perform such good acts as tend to their salvation is God’s true and serious will, though He have not decreed by such means to produce their salvation. (See [Michael] Bajus, Institutes, bk. 1, ch. 104, etc. etc. 115, 116) This will is often despised by men to their own damnation. But there is a will not only ordaining means to the end, but of causing men to use the means unto the consecution of the end. And thus by giving them special grace, God wills the kingdom of glory only unto the elect. The former will is not to be baffled with the name of dissimulation, because this latter is only it which brings men unto glorification. And we further add that the reprobates in resisting the former will, which is vera voluntas simplicis complacentiae [the true will of simple complacency], do always fulfill the latter, which is God’s absolute will of permitting this resistance and of gathering out of it a greater illustration of his own glory. The blessings and means which God out of his goodness afforded to the angels, to Adam and which He continually affords unto wicked men, by the ill frame of their hearts may be and have been turned to their own hurt; and yet we cannot but acknowledge in them an antecedent and gracious will to do them good. But we do acknowledge, over and above this will of complacency, an absolute will of efficiency, by which God has mercifully decreed to work in some persons the will and the deed, and by the means of grace, de facto, to bring them unto glory. These two different manners of willing and working the salvation of men do demonstrate an absolute will in God of saving some, which we call the absolute decree of their election, and an absolute will of permitting others to draw upon themselves damnation by voluntary abusing the means of grace, which we call absolute reprobation. Chrysostom (who is no depressor of man’s free-will) was not ignorant of this absolute will of God turning and bending man’s which way He pleases: Si Deus voluerit, nullus impediet [If God wills, none impedes]. (See many times in homily 2 on Ps. 50) And of this will St. Augustine speaks (Enchiridion, ch. 97): In coelo et in terra non quaedam voluit et fecit, quaedam vero voluit et non fecit, sed omnia quaecun{que} voluit fecit. [In heaven and on earth, He did not will some things and accomplish them and will other things but not accomplish them; rather, He accomplished all things whatsoever He willed.] And St. Jerome, speaking of the Samaritans, says (apud Petr. Diac.): Si voluisset, ex indevotis devotos fecisset [If He had willed, He had made the impious pious]. And that prayer of Basil is famous (On the Incarnation, ch. 8): Malos, quaesumus, bonos facito; bonos in bonitate conserva. Omnia enim potes: quem enim volueris, salvas: et non est qui resistat tibi. [Make the wicked good, we beseech You; preserve the good in goodness. For You can do all things: whomsoever You will, You save; and there is none who may resist You.] Since therefore the Scriptures and the Fathers, and all orthodox divines, who confess that to be a true will which by affording ordinary means aims at the sanctification (1 Tim. 4:3) and salvation of all men (1 Tim. 2:4), do notwithstanding, intimate unto us an absolute will eternally predestinating and in time infallibly working the salvation only of some men; it is but a weak kind of reasoning from the affirmation of the one to conclude a negation of the other. The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it. Calvin usually speaks in the Scripture-phrase, even in those points which seem harsh to the ears of the Remonstrants. But this author having before truly explained how such phrases are to be understood, namely of the end whereunto reprobates always finally abuse them, and not of the end whereunto God has ordained them, he had done much better to have afforded Calvin’s words this charitable construction. And as for Beza, he denies not a proper and true ordination of the divine grace unto the effecting of salvation in all to whom it is afforded, nor a true will of complacency in God, that by them it should be used to that good end: but he denies an absolute will in God of saving them by that grace; and he shows the end which the wicked always come to by abusing it, which is, ut gravius puniantur [that they are more severely punished]. That Calvin had no other meaning, appears by these words of his which shut-up the section out of which the former are taken: Quid sibi vult Dominus eos docendo a quibus ne intelligatur curat? Considera unde vitium, et desines interrogare. In verbo enim qualiscunque sit obscuritas, satis tamen semper est lucis ad convincendam impiorum conscientiam. [What does the Lord intend by teaching those whom He takes no care should understand? Consider from where the fault proceeds, and you will cease to inquire. For in the Word, whatever its obscurity may be, there is nevertheless always enough light to convict the consciences of the wicked.] The drift of Calvin is not to affirm that God works either by any positive action, or by proper ordination of his Word unto any such end that deafness, blindness, senselesseness whereunto the reprobate grow only by their own default. But because God, who could soften their hearts and would if they were in the number of his elect, has ordained not to do it, this ordination is intimated by the event which perpetually follows upon it, namely deafness, blindness, etc. So that all which Calvin intends is this (see §14-15, where is mind is explained), that where God has not comprised men within his merciful decree of predestination, there He has decreed to hold-off his hand from effectually opening their ears and eyes; and they suo vitio obsurdescunt [become deaf through their own fault], etc. And Beza had no other intent, but to show that the Word preached unto the reprobate (Opuscula, p. 30 and Of Predestination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>

ination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].”

%29+But+this+is+not+it+which+we+now+speak+of.+2.+Secondly%2C+God+is+said+to+will%2C+desire+or+aim-at+that+good%2C+for+the+obtaining+whereof+He+affords+fitting+means%2C+though+withal+He+wills+that+it+shall+be+in+the+liberty+of+the+creature+to+hinder+and+frustrate+those+means%2C+and+though+He+have+absolutely+decreed+to+permit+the+creature+to+abuse+them+unto+his+own+destruction.+This+is+that+which+usually+is+termed+by+divines+voluntas+antecedens%2C+voluntas+conditionata%2C+voluntas+simplicis+complacentiae+%5Bthe+will+preceding%2C+will-conditioned%2C+will+of+simple+complacency%5D.+And+thus+God+is+said+to+aim-at+or+to+will+and+desire+the+conversion%2C+justification+and+salvation+of+those+who+never+shall+be+converted%2C+justified+or+saved.+Neither+must+we+think+that+by+these+men+God%E2%80%99s+omnipotent+will+is+crossed%2C+because+his+voluntas+simplicis+complacentiae+%5Bwill+of+simple+complacency%5D+is+not+fulfilled.+For+the+absolute+will+of+God+was+that+in+such+persons+their+own+free-will+might+hinder+the+good+effect+of+his+gifts+and+graces%2C+which+He+was+absolutely+resolved+to+permit+for+some+greater+good.+Lastly%2C+there+is+a+will+in+God+which+strictly+and+most+properly+is+called+voluntas+beneplaciti+%5Bwill+of+good-pleasure%5D+or+his+absolute+will%2C+which+is+not+only+a+liking+of+the+good+willed+unto+the+creature%2C+and+an+ordering+of+fit+means+whereby+the+creature+%28if+his+own+free-will+hinder+not%29+may+attain+it%2C+but+a+merciful+decree+of+so+ordering+the+means+and+the+very+will+of+the+creature%2C+that+it+shall+infallibly+and+infrustrately+obtain+the+good+end+whereunto+such+means+were+accommodated.+And+of+this+will+Ruiz+truly+affirms%3A+Sola+haec+voluntas+absoluta+simpliciter+amplectitur+objectum%2C+et+ideo+sola+simpliciter+et+absolute+meretur+nomen+voluntatis+Beneplaciti+%5BOnly+this+absolute+will+simply+embraces+its+object%2C+and+therefore+only+it%2C+simply+and+absolutely%2C+deserves+the+name+of+the+will+of+good+pleasure.%5D.+%28disp.+18%2C+%C2%A74%2C+p.+185%29+We+grant%2C+therefore%2C+that+in+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+God+truly+wills%2C+likes%2C+desires+the+repentance%2C+faith%2C+perseverance+and+salvation+of+all+to+whom+the+Gospel+is+preached+and+Christ+offered.+But+in+the+last+and+most+proper+acception%2C+God+wills+the+perseverance+and+salvation+only+of+his+elect%2C+in+whom+He+never+ceases+working+till+the+happy+effect+be+produced.+Our+divines+at+%5Bthe+Synod+of%5D+Dort+%5B1618-1619%5D+granted+a+true+and+serious+will+in+God+according+to+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+but+not+according+to+the+last.+Which+will+simplicis+complacentiae+%5Bof+simple+complacency%5D+may+stand+with+absolute+reprobation.+If+this+author+can+be+content+to+acknowledge+that+for+a+true%2C+serious+and+no+delusory+will%2C+which+affords+the+creature+means+of+repenting%2C+believing+and+being+saved%2C+though+under+an+eternal+absolute+decree+of+permitting+the+final+disobedience+and+perdition+of+the+creature%2C+we+will+free+him+from+the+trouble+of+answering+the+places+of+Scripture%2C+and+with+him+embrace+the+interpretation+of+Damascene%2C+who+tells+us+%28Of+the+Orthodox+Faith%2C+bk.+4%2C+ch.+20%29+that+albeit+the+Scriptures+do+in+such+places+seem+to+make+God%E2%80%99s+benefits+causes+of+man%E2%80%99s+sin+and+ruin%2C+yet+they+must+be+understood+%5BGreek%5D%2C+not+%5BGreek%5D.+A+physician+does+give+his+patient+physick+with+an+absolute+will+to+cure+so+far+as+his+skill+and+ability+will+stretch%3A+But+God+does+not+always+give+the+means+of+salvation+unto+all+men+out+of+his+absolute+will%2C+for+then+all+should+be+cured+and+saved.+Ps.+135%2C+Omnia+quaecunque+voluit+Deus%2C+fecit+in+coelo+et+in+terra+%5BAll+which+God+wills+is+done+in+heaven+and+in+earth%5D.+Fulgentius+gives+the+reason+%281+ad+Mon.%2C+ch.+12%29%2C+Quia+cui+semper+subest+cum+volet+posse%2C+non+aliud+est+in+illo+velle+quam+posse+%5BFor+to+whom+there+is+always+present+the+ability+whenever+he+wills%2C+in+him+to+will+is+nothing+other+than+to+be+able.%5D.+The+will+of+God+inviting+or+moving+men+to+perform+such+good+acts+as+tend+to+their+salvation+is+God%E2%80%99s+true+and+serious+will%2C+though+He+have+not+decreed+by+such+means+to+produce+their+salvation.+%28See+%5BMichael%5D+Bajus%2C+Institutes%2C+bk.+1%2C+ch.+104%2C+etc.+etc.+115%2C+116%29+This+will+is+often+despised+by+men+to+their+own+damnation.+But+there+is+a+will+not+only+ordaining+means+to+the+end%2C+but+of+causing+men+to+use+the+means+unto+the+consecution+of+the+end.+And+thus+by+giving+them+special+grace%2C+God+wills+the+kingdom+of+glory+only+unto+the+elect.+The+former+will+is+not+to+be+baffled+with+the+name+of+dissimulation%2C+because+this+latter+is+only+it+which+brings+men+unto+glorification.+And+we+further+add+that+the+reprobates+in+resisting+the+former+will%2C+which+is+vera+voluntas+simplicis+complacentiae+%5Bthe+true+will+of+simple+complacency%5D%2C+do+always+fulfill+the+latter%2C+which+is+God%E2%80%99s+absolute+will+of+permitting+this+resistance+and+of+gathering+out+of+it+a+greater+illustration+of+his+own+glory.+The+blessings+and+means+which+God+out+of+his+goodness+afforded+to+the+angels%2C+to+Adam+and+which+He+continually+affords+unto+wicked+men%2C+by+the+ill+frame+of+their+hearts+may+be+and+have+been+turned+to+their+own+hurt%3B+and+yet+we+cannot+but+acknowledge+in+them+an+antecedent+and+gracious+will+to+do+them+good.+But+we+do+acknowledge%2C+over+and+above+this+will+of+complacency%2C+an+absolute+will+of+efficiency%2C+by+which+God+has+mercifully+decreed+to+work+in+some+persons+the+will+and+the+deed%2C+and+by+the+means+of+grace%2C+de+facto%2C+to+bring+them+unto+glory.+These+two+different+manners+of+willing+and+working+the+salvation+of+men+do+demonstrate+an+absolute+will+in+God+of+saving+some%2C+which+we+call+the+absolute+decree+of+their+election%2C+and+an+absolute+will+of+permitting+others+to+draw+upon+themselves+damnation+by+voluntary+abusing+the+means+of+grace%2C+which+we+call+absolute+reprobation.+Chrysostom+%28who+is+no+depressor+of+man%E2%80%99s+free-will%29+was+not+ignorant+of+this+absolute+will+of+God+turning+and+bending+man%E2%80%99s+which+way+He+pleases%3A+Si+Deus+voluerit%2C+nullus+impediet+%5BIf+God+wills%2C+none+impedes%5D.+%28See+many+times+in+homily+2+on+Ps.+50%29+And+of+this+will+St.+Augustine+speaks+%28Enchiridion%2C+ch.+97%29%3A+In+coelo+et+in+terra+non+quaedam+voluit+et+fecit%2C+quaedam+vero+voluit+et+non+fecit%2C+sed+omnia+quaecun%7Bque%7D+voluit+fecit.+%5BIn+heaven+and+on+earth%2C+He+did+not+will+some+things+and+accomplish+them+and+will+other+things+but+not+accomplish+them%3B+rather%2C+He+accomplished+all+things+whatsoever+He+willed.%5D+And+St.+Jerome%2C+speaking+of+the+Samaritans%2C+says+%28apud+Petr.+Diac.%29%3A+Si+voluisset%2C+ex+indevotis+devotos+fecisset+%5BIf+He+had+willed%2C+He+had+made+the+impious+pious%5D.+And+that+prayer+of+Basil+is+famous+%28On+the+Incarnation%2C+ch.+8%29%3A+Malos%2C+quaesumus%2C+bonos+facito%3B+bonos+in+bonitate+conserva.+Omnia+enim+potes%3A+quem+enim+volueris%2C+salvas%3A+et+non+est+qui+resistat+tibi.+%5BMake+the+wicked+good%2C+we+beseech+You%3B+preserve+the+good+in+goodness.+For+You+can+do+all+things%3A+whomsoever+You+will%2C+You+save%3B+and+there+is+none+who+may+resist+You.%5D+Since+therefore+the+Scriptures+and+the+Fathers%2C+and+all+orthodox+divines%2C+who+confess+that+to+be+a+true+will+which+by+affording+ordinary+means+aims+at+the+sanctification+%281+Tim.+4%3A3%29+and+salvation+of+all+men+%281+Tim.+2%3A4%29%2C+do+notwithstanding%2C+intimate+unto+us+an+absolute+will+eternally+predestinating+and+in+time+infallibly+working+the+salvation+only+of+some+men%3B+it+is+but+a+weak+kind+of+reasoning+from+the+affirmation+of+the+one+to+conclude+a+negation+of+the+other.+The+doctrine+of+absolute+election+and+reprobation+infers+that+God+had+not+an+absolute+will+by+those+means+of+grace+which+He+bestowed+upon+the+non-elect+angels+or+men+to+bring+them+unto+glory%3B+and+that+He+had+an+absolute+will+to+permit+themselves+to+abuse+them+to+the+procuring+of+their+own+eternal+misery%3A+And+yet+he+that+should+say+that+God+by+giving+the+non-elect+angels+such+excellent+endowments%2C+or+by+giving+Cain+and+Judas+such+fatherly+admonitions%2C+did+in+those+means+aim+at+their+destruction%2C+speaks+both+ignorantly+and+profanely.+For+the+aim+of+God+and+the+end+of+any+good+gift+which+He+vouchsafes+unto+men%2C+is+to+be+measured+by+the+nature+of+the+gift+itself+and+not+by+the+perverse+use+which+God+suffers+the+receivers+to+make+of+it.+Calvin+usually+speaks+in+the+Scripture-phrase%2C+even+in+those+points+which+seem+harsh+to+the+ears+of+the+Remonstrants.+But+this+author+having+before+truly+explained+how+such+phrases+are+to+be+understood%2C+namely+of+the+end+whereunto+reprobates+always+finally+abuse+them%2C+and+not+of+the+end+whereunto+God+has+ordained+them%2C+he+had+done+much+better+to+have+afforded+Calvin%E2%80%99s+words+this+charitable+construction.+And+as+for+Beza%2C+he+denies+not+a+proper+and+true+ordination+of+the+divine+grace+unto+the+effecting+of+salvation+in+all+to+whom+it+is+afforded%2C+nor+a+true+will+of+complacency+in+God%2C+that+by+them+it+should+be+used+to+that+good+end%3A+but+he+denies+an+absolute+will+in+God+of+saving+them+by+that+grace%3B+and+he+shows+the+end+which+the+wicked+always+come+to+by+abusing+it%2C+which+is%2C+ut+gravius+puniantur+%5Bthat+they+are+more+severely+punished%5D.+That+Calvin+had+no+other+meaning%2C+appears+by+these+words+of+his+which+shut-up+the+section+out+of+which+the+former+are+taken%3A+Quid+sibi+vult+Dominus+eos+docendo+a+quibus+ne+intelligatur+curat%3F+Considera+unde+vitium%2C+et+desines+interrogare.+In+verbo+enim+qualiscunque+sit+obscuritas%2C+satis+tamen+semper+est+lucis+ad+convincendam+impiorum+conscientiam.+%5BWhat+does+the+Lord+intend+by+teaching+those+whom+He+takes+no+care+should+understand%3F+Consider+from+where+the+fault+proceeds%2C+and+you+will+cease+to+inquire.+For+in+the+Word%2C+whatever+its+obscurity+may+be%2C+there+is+nevertheless+always+enough+light+to+convict+the+consciences+of+the+wicked.%5D+The+drift+of+Calvin+is+not+to+affirm+that+God+works+either+by+any+positive+action%2C+or+by+proper+ordination+of+his+Word+unto+any+such+end+that+deafness%2C+blindness%2C+senselesseness+whereunto+the+reprobate+grow+only+by+their+own+default.+But+because+God%2C+who+could+soften+their+hearts+and+would+if+they+were+in+the+number+of+his+elect%2C+has+ordained+not+to+do+it%2C+this+ordination+is+intimated+by+the+event+which+perpetually+follows+upon+it%2C+namely+deafness%2C+blindness%2C+etc.+So+that+all+which+Calvin+intends+is+this+%28see+%C2%A714-15%2C+where+is+mind+is+explained%29%2C+that+where+God+has+not+comprised+men+within+his+merciful+decree+of+predestination%2C+there+He+has+decreed+to+hold-off+his+hand+from+effectually+opening+their+ears+and+eyes%3B+and+they+suo+vitio+obsurdescunt+%5Bbecome+deaf+through+their+own+fault%5D%2C+etc.+And+Beza+had+no+other+intent%2C+but+to+show+that+the+Word+preached+unto+the+reprobate+%28Opuscula%2C+p.+30+and+Of+Predestination%2C+p.+434%29%3A+non+eo+usque+conjunctum+cum+Spiritus+ministerio%2C+ut+illos+vera+fide%2C+qua+propria+nota+electi+a+reprobis+dignoscuntur%2C+Christo+ut+palmites+frugiferos+inserat.+%5Bis+not+so+joined+with+the+ministry+of+the+Spirit+as+to+insert+them+into+Christ+by+true+faith%2C+by+which%2C+as+the+distinctive+mark%2C+the+elect+are+distinguished+from+the+reprobate+as+fruitful+branches.%5D+Whence+follows+that+woeful+event%2C+ut+justo+exitio+devoti+magis+ac+mag%C3%ACs+reddantur+%5BGreek%5D+%5Bthat+they+may+be+rendered+more+and+more+devoted+to+just+destruction%5D.+For+%5BJohannes%5D+Maccovius%2C+if+his+speeches+%5Bsee+pp.+372-73+in+the+previous+section%5D+tend+to+show+the+intentional+end+of+the+gospel+preached%2C+and+not+the+eventual+success%2C+we+utterly+disclaim+his+opinion.+For+God+properly+intends+no+end+of+his+volitions+or+actions+but+Himself%2C+unto+whose+glory+all+things+have+naturam+mediorum+%5Bthe+nature+of+means%5D%2C+not+intenti+finis+%5Bthe+intention+of+an+end%5D.+The+intention+therefore+of+means+by+God+unto+any+lower+or+inferior+end+is+nothing+else+but+the+fitness+of+such+means+considered+in+themselves+%28and+not+abused%29+for+the+producing+of+that+end%3A+And+this+intention+is+not+altered+by+the+decree+of+reprobation%3B+for+that+decree+as+it+is+immanent+and+eternal+in+voluntate+divina%2C+nihil+ponit+in+reprobato+%5Bin+the+divine+will%2C+puts+nothing+in+the+reprobate%5D%3A+And+when+the+temporal+execution+comes%2C+it+puts+no+malice+into+his+will%3B+it+puts+no+necessitation+unto+wicked+actions+upon+his+will%3B+it+only+puts+in+God+an+absolute+will+of+not-giving+effectual+grace%2C+and+of+not-working+in+him+salutiferous+actions%2C+whereupon+follows+perditio+tua+exte+%5Byour+destruction+is+out+of+yourself%2C+Hos.+13%3A9%5D.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Animadversions+upon+a+Treatise+entitled%2C+God%E2%80%99s+Love+to+Mankind...+%28Cambridge%3A+Daniel%2C+1641%29%2C+%E2%80%98Answer%3A+Whether+the+decree+of+absolute+Reprobation+is+contrary+unto+the+use+and+end+of+God%E2%80%99s+gifts+bestowed+upon+men%2C%E2%80%99%2C+pp.+390-93&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6d7762388.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6d7762388.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=That%20God%20wills%20the%20good%20of,is%20out%20of%20yourself%2C%20Hos.%2013%3A9&amp;text=That%20God%20wills%20the%20good%20of%20men%20in&amp;text=your%20destruction%20is%20out%20of%20yourself%2C%20Hos.%2013%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

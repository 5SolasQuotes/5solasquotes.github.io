<blockquote><p>[Let us lift up our hearts] by hearty prayer send up our petitions… [unto God] unto the creator and governor of the whole world, that only is able and willing to forgive us our sins.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-016b0f6c72" data-kw="">
<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations upon our Savior’s Parable of the Prodigal Son… (London: Roycroft, 1678), ch. 27</cite>, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

iv>
</figure><figure class="quote" id="q-083c84e211" data-kw="">
<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject. I think that the word world, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/memoirs-of-dr-chalmers.html">Memoirs of Dr. Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>vol. 4, ‘His Last Sabbath’, this quote was compiled by Maurice Roberts | There are what are called Baxterian errors, I am aware, and one of these is in relation to the extent of the sacrifice of Christ; Baxter, I think, holding that Christ died for all men. Dr Chalmers answered</cite></span></figcaption>

</figure><figure class="quote" id="q-4ea84f799e" data-kw="">
<blockquote><p>…I only now advise every one who is kept from believing by this, that he knows not whether he be contained under the pardon or no, not to look to God’s secret will, but to attend to God’s revealed will in his Word, wherein it is expressly said that God would have no man to perish, but would have all men come to repentance [2 Pet. 3:9]; and so oft. That He desires not the death of a sinner [Eze. 18:23,32], that hereby he may be moved to seek and hope for that mercy, which God is so willing to bestow upon him, if the fault be not in his own self, as it was in the unbelieving Jews in Jerusalem, of whom our Savior complained, saying, ‘How often would I have gathered thy Children, as the Hen gathereth her Chickens under her wings, and ye would not?’ [Mt. 23:37] A further manifestation of this willingness in God to save sinners, may be seen in his gracious invitation of the unworthiest to come to the wedding of his Son [Mt. 22:2-3]: yea, more by his beseeching sinners to be reconciled to Him [2 Cor. 5:20]: and by the many and weighty arguments He uses to persuade men to believe, by the great rewards, earthly and spiritual, temporal and eternal, which all believers shall enjoy; and by the fearful woes which shall fall on all unbelievers, both in this life, and that to come, as plentifully is to be seen throughout the Scriptures.</p></blockquote>

</figure><figure class="quote" id="q-3cbc3b4bee" data-kw="">
<blockquote><p>The willingness of God to receive returning sinners is manifested in the highest degree; and the willingness of a sinner to return to Him in duty has the strongest engagements. He has done as much to encourage our obedience as to illustrate his glory. We cannot conceive what could be done greater for the salvation of our souls and consequently what could have been done more to enforce our observance. We have a Redeemer, as man, to copy it to us, and as God to perfect us in it. It would make the heart of any to tremble to wound Him that has provided such a salve for our sores and to make grace a warrant for rebellion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God… (London: Newman, 1682) | Wisdom of God</cite>, p. 387</span></figcaption>

<main class="wrap"><figure class="quote" id="q-872872fa2e" data-kw="">
<blockquote><p>Furthermore, it seems that to proceed against the cruelty of tyrants is an action to be undertaken not through the private presumption of a few, but rather by public authority. If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power. It must not be thought that such a multitude is acting unfaithfully in deposing the tyrant, even though it had previously subjected itself to him in perpetuity, because he himself has deserved that the covenant with his subjects should not be kept, since, in ruling the multitude, he did not act faithfully as the office of a king demands.

Thus did the Romans, who had accepted Tarquin the Proud as their king, cast him out from the kingship on account of his tyranny and the tyranny of his sons; and they set up in their place a lesser power: namely, the consular power. Similarly Domitian, who had succeeded those most moderate emperors, Vespasian, his father, and Titus, his brother, was slain by the Roman senate when he exercised tyranny, and all his wicked deeds were justly, and profitably, declared null and void by a decree of the senate. Thus it came about that Blessed John the Evangelist, the beloved disciple of God, who had been exiled to the island of Patmos by that very Domitian, was sent back to Ephesus by a decree of the senate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 6.</span></figcaption>

<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>

</figure><figure class="quote" id="q-56eedd4017" data-kw="">
<blockquote><p>That is, Natural Theology is not repugnant to Revealed Theology in the Abstract, although Natural Theology is far less complete, and takes a position beneath Revealed Theology. Nevertheless, both are Lights, Natural Theology the lesser, Revealed Theology the greater, which have their origin from the same Father of lights. Neither is natural truth able to be inconsistent with revealed truth, since truth harmonizes with truth, or truth does not contradict truth, as it is in the Axiom; indeed, truth is opposed, not to truth, but to falsehood, although the same truth often becomes known from diverse starting points: thus, that God created the world, is evident by reason and by faith, in Philosophy from the light of nature, in Theology from the light of Scripture.

But Natural Theology nowhere exists in the abstract, as, on the other hand, Revealed Theology, pure and clear of all defects, is able to be read in the Sacred Scriptures. When, therefore, any dispute occurs between them, Natural Theology with all Philosophy ought to yield to Revealed Theology as more certain, seeing that human corruption easily mingles itself with Natural Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 21, p. 164.</span></figcaption>

7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56eedd4017.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/05/bernardinus-de-moor-on-the-harmony-between-natural-and-revealed-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-51661f2fec" data-kw="">
<blockquote><p>What did John Calvin (1509– 64) know of Thomas Aquinas’s (d. 1274) theology? Did he actually read the Angelic Doctor’s work, or is his knowledge of Aquinas a mediated knowledge? And in the end did he understand what he encountered?… The older scholarship was generally optimistic about Calvin’s firsthand familiarity with Aquinas’s work… I argue that when citing Thomas, Calvin was not engaging Aquinas through a firsthand reading of his work. Rather, he received a mediated knowledge of Thomas from secondary sources. Even more, the evidence suggests that the secondary lens arises from the nominalist school of thought and refracts Thomas’s position in a direction more according to this school, in which human merit plays a stronger role in explaining the doctrine of predestination than Thomas himself believes. In the end, I conclude that Aquinas is of little to no importance to Calvin, with Calvin having very little firsthand knowledge of the Angelic Doctor’s thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-raith.html">Charles Raith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Calvin &amp; Aquinas Reconsidered” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis</cite>, (Brill, 2019), pp. 19-35, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>We offer and we perform all obedience which God has commanded, and we deny neither toll, tribute nor fear to her nor officers: We only bridle her blind rage, in which she would erect and maintain idolatry, and would murder our brethren who refuse the same. Neither yet fear we in this present day, that against us she makes a malicious lie, where that she says that it is not religion we go about, but a plain usurpation of authority: God forbid that such impiety should enter into our hearts, that we should make his holy religion a cloak and cover of our iniquity. From the beginning of this controversy ’tis evidently known what have been our requests, which, if the rest of the nobility and commonality of Scotland will cause to be performed unto us, if then in us appear any sign of rebellion, let us be reputed and punished as traitors, etc.</p></blockquote>

</figure><figure class="quote" id="q-dae5a551e8" data-kw="">
<blockquote><p>Controversy in religion is a hateful thing. It is hard enough to fight the devil, the world, and the flesh without private differences in our own camp. But there is one thing which is even worse than controversy, and that is false doctrine tolerated, allowed, and permitted without protest or molestation. It was controversy that won the battle of Protestant Reformation. If the views that some men hold were correct, it is plain we never ought to have had any Reformation at all! For the sake of peace, we ought to have gone on worshiping the Virgin and bowing down to images and relics to this very day! Away with such trifling! There are times when controversy is not only a duty but a benefit. Give me the mighty thunderstorm rather than the pestilential malaria. The one walks in darkness and poisons us in silence, and we are never safe. The other frightens and alarms for a little season. But it is soon over, and it clears the air. It is a plain Scriptural duty to “contend (Jude 3). I am quite aware that the things I have said are exceedingly distasteful to many minds. I believe many are content with teaching which is not the whole truth and fancy it will be “all the same” in the end. I am sorry for them. I am convinced that nothing but the whole truth is likely, as a general rule, to do good to souls. I am satisfied that those who willfully put up with anything short of the whole truth will find at last that their souls have received much damage. Three things there are which men never ought to trifle with—a little poison, a little false doctrine, and a little sin. I am quite aware that when a man expresses such opinions as those I have just brought forward there are many ready to say, “He is no Churchman.” I hear such accusations unmoved. The day of judgment will show who were the true friends of the Church of England and who were not. I have learned in the last thirty-two years that if a clergyman leads a quiet life, lets alone the unconverted part of the world, and preaches so as to offend none and edify none, he will be called by many “a good Churchman.” And I have also learned that if a man studies the Articles and Homilies, labors continually for the conversion of souls, adheres closely to the great principles of the Reformation, bears a faithful testimony against popery, and preaches as Jewell and Latimer used to preach, he will probably be thought a firebrand and “troubler of Israel,” and called no Churchman at all! But I can see plainly that they are not the best Churchmen who talk most loudly about Churchmanship. I remember that none cried “Treason” so loudly as Athaliah (2 Kings 11:14). Yet she was a traitor herself. I have observed that many who once talked most about Churchmanship have ended by forsaking the Church of England and going over to Rome. Let men say what they will. They are the truest friends of the Church of England who labor most for the preservation of truth. I lay these things before the readers of this paper and invite their serious attention to them. I charge them never to forget that truth is of more importance to a Church than peace. I ask them to be ready to carry out the principles I have laid down, and to contend zealously, if needs be, for the truth. If we do this we shall have learned something from Antioch [Acts 15].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Fallibility of Ministers’ in Knots Untied</cite></span></figcaption>

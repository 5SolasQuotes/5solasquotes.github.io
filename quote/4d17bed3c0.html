<blockquote><p>And in this comparison of fruits, under the name of a cause properly belonging to the final cause with respect not to losing but to retaining what has been freely given, the order and relation of works to salvation can most simply and conveniently be explained according to the rule of Scripture.</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 16.2</span></figcaption>

</figure><figure class="quote" id="q-48fb86105c" data-kw="">
<blockquote><p>But who of our Divines has ever denied that even the good works of the holy are in some way causes of their eternal reward? for it is not about this that we strive, but as to the source from which they have this power…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531.</cite>, p. 569</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>By all which you may clearly see that food is not more necessary for the preservation of natural life, than holiness is necessary for the preservation and salvation of the soul.</p></blockquote>

</figure><figure class="quote" id="q-3bd0cf9000" data-kw="">
<blockquote><p>The necessity of repentance, as a means, we here also acknowledge, seeing that to the impenitent there can be neither salvation nor remission of sin, etc. Remission of sin belongs to it, neither formally, nor meritoriously, nor satisfactorily, but at most: 1. Conditionally, as this is offered to us in the gospel, on the condition of repentance and faith. 2. Dispositively, etc. 3. Judicatively and ostensively, etc. Far be it from us therefore to make that remission with the Papists to be an effect properly so called of repentance; when that is due only to God’s grace by Christ, etc. But it’s partly a necessary consequent adjunct of it, in as much as under that condition, as also of new obedience (though not for it), remission of sins is propounded and offered to us, seeing it is inconvenient to remit sin to him that perseveres in sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collegium theologicum... (1649) trans. in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, pp. 407-8 | locus 13</cite>, p. 337</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

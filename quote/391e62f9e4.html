<main class="wrap"><figure class="quote" id="q-391e62f9e4" data-kw="">
<blockquote><p>Although we must not regard as the doctrine of the Reformed those which can by any method be deduced from their confessions and be imputed to them; nor as the opinion of the Lutherans that which may be inferred from their doctrine – it does not follow that we must not consider as the word of God that which may be lawfully and plainly deduced from it. The cases are entirely different. For the Holy Spirit (who searches the deep things of God as he is omniscient) could foresee and intend whatever it was possible to gather rightly from his words. But men (who are neither omniscient nor infallible) were unable to know what might in after times be deduced from their words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8141366f7a" data-kw="">
<blockquote><p>Likewise we reject human traditions, even if they be adorned with high-sounding titles, as though they were divine and apostolical, delivered to the Church by the living voice of the apostles, and, as it were, through the hands of apostolical men to succeeding bishops which, when compared with the Scriptures, disagree with them; and by their disagreement show that they are not Apostolic at all. … it would be wicked to assert that the apostles by a living voice delivered anything contrary to their writings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-5b92934789" data-kw="">
<blockquote><p>Although we allow to individual believers the judgment of private discretion (because &quot;he that is spiritual judgeth all things&quot; [1 Cor. 2:15], and the apostle commands us to &quot;prove all things&quot; [1 Thess. 5:21]), we do not therefore assert in opposition to Peter (2 Pet. 1:20*) that the Scriptures are of private interpretation (idia epilysis). For epilysis here does not mean the interpretation of the Scriptures so much as the origin of the prophetic oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.33</span></figcaption>

</figure><figure class="quote" id="q-3e0d0fef29" data-kw="">
<blockquote><p>For harmony. Though there may seem to be a contrariety between scripture and scripture, yet there is a blessed harmony between all the parts of Scripture; the contrariety is seeming, not real. As when a man is drawing water out of a well with two vessels of a different metal, the water at the first seemeth to be of a different colour, but when he draweth up the vessels nearer to him, the diversity of colours vanish, and the water appeareth to be of one and the same colour, and when he tasteth them, they have one and the same relish; so though at first sight there may seem to be some contradictions in the Scriptures, yet when we look more nearly and narrowly into them and compare one place with another, we shall find no contrariety, no repugnancy in them at all, but a perfect harmony, and a full and sweet consent and agreement between one place and another, between text and text, scripture and scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 226.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

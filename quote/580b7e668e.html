<main class="wrap"><figure class="quote" id="q-580b7e668e" data-kw="">
<blockquote><p>So we should regard the members of the church as God’s children as long as they do not forsake the church or give public evidence of their hypocrisy, which shows that they are reprobate. Furthermore, God expects that all to whom he desires to be a Father shall regard the church as their mother. May we, therefore, never doubt that we who have received the church as our mother, in whom we are born again and nourished, may also call God our Father. And may we, when simply remaining in the family of our mother, never doubt that we are heirs of the heavenly Father. …

The title “mother” that is given to the church teaches us that there is no entrance into eternal life other than to be conceived in this mother’s womb. She gives us birth, nourishes us at her breasts, and protects and preserves us by her guidance and control until at last we lay aside this mortal body and become like the angels of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Reformation Heritage Books, 2003), pp 37-38, 134.</span></figcaption>

</figure><figure class="quote" id="q-73e5398435" data-kw="">
<blockquote><p>VIII Rule. We must give place to the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times: but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul… he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but ony in general against false gods, saying that ‘they be no gods that are made with hands,’ v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience</cite>, (Cambridge. 1606), bk. 3, ch. 2, pp. 481-84</span></figcaption>

</figure><figure class="quote" id="q-5c36018bea" data-kw="">
<blockquote><p>After some overtures of a Match in the Reign of King Henry the Eighth, the Reformed Church in this Kingdom was solemnly married to Jesus Christ, when the Sceptre was swayed by Edward the Sixth: that godly young Prince (as became the Bridegroom’s friend) rejoicing greatly because of the Bridegroom’s voice.

The famous nine and thirty Articles of her Confession then framed, were an evident sign of her being with child, and that a thorough Reformation was then conceived, though but conceived. Many and fore were the breeding fits she conflicted with in Queen Mary’s days, and such as gave occasion to fear that she would have miscarried.

But God sent her ease from heaven under the succeeding Princes: in which condition she went on for a long while, drawing still nearer and nearer her time. Six years ago, after this Parliament had sate a while it was generally believed that she was false into her travel. And, in the midst of all those sorrows which have befallen England since, her friends encouraged themselves with this hope, that the quicker and sharper her pains grew, the liker she was to be speedily delivered of that man-child, which was by them so greedily expected.

But, behold, as if all these had been but fore-runners of her labour, not bearing-throws, she continues still in pain: insomuch as they now begin to think she has not gone her full time, and earnestly to desire she may; because they fear nothing more than an abortive Reformation. However, evident it is, not only that her pains are multiplied, but that they are caused, partly by the malignity of her enemies, who have embroiled her in a bloody Civil War …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), pp 35-36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-097d771964" data-kw="">
<blockquote><p>Believe if ye will [as it is claimed by Romanists] that [Emperor] Constantine gave to the Popes of Rome freedom and immunity from the imperial laws… we teach no such kingly power given to Church-men, and judge this Donation [of Constantine] to be a forged lie, invented by Papists… 6. We do not teach that Church-men are loosed from the positive laws of emperors and kings. [The Romanist, Robert] Bellarmine says that the Magistrate can neither punish Church-men, nor convene them before the tribunal… And as he says, by divine law the Pope is eximed [exempt] from all laws of princes… And what they allege for Peter’s exemption from paying tribute, will exime all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they) by a divine positive law are eximed from the laws of Magistrates… Paul will have every soul subject to superior powers, and except the Roman clergy want [lack] souls, they must also be subject. Solomon punished [the priest] Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected Himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Ceasar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil, as many as are in danger of resisting the power, are to be subject, Rom. 13:4. 2. but Church-men are such, therefore they are subject.</p></blockquote>

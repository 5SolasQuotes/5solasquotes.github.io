<main class="wrap"><figure class="quote" id="q-ebc7ade868" data-kw="">
<blockquote><p>Next you [Gilbert Burnet] inquire, Why do you [Scottish non-conformists] not anoint the sick with oil? I answer, though you address this demand to a non-conformist, yet it is evident that your conclusion of deformity to the Scripture pattern thence inferred, is equally levelled against the whole Protestant Church, wherein this ceremony is universally disused, and that not from your vain warrant of the Church’s authority in and over things expressly commanded, as you judge this rite to be; No, this is a presumption so high, and lax, that even the grossest Papists are unwilling to avouch it; But the sound answer of all the Churches is that, as the custom of anointing might have been occasioned from an observance then in use in these parts, where anointings were much more ordinary than in our parts of the world, so it is mentioned in the Scripture by the apostle James, not by way of command, but as the accustomed symbol adhibite[d] in the exercise of the gift of healing, which being then ordinary in the Church, is commanded to be applied by the prayer of faith, whereunto the effect is solely referred, and only with the formality of anointing, as being then customary in the like cases. Seeing then that the text runs clearly thus, ‘Is any sick? Let him call the elders, and let them pray over him anointing him with oil in the name of the Lord, and the prayer of faith shall save the sick;’ and that the application of the extraordinary gift of healing by prayer, with the then us […]all circumstance of anointing […] is here only enjoined, how can you make this text binding as to the manner and circumstance, when you cannot but acknowledge that the substance, viz. the power of healing, is ceased? But having made your non-conformist say that the apostle promises recovery upon the anointing, you turn to fight with your own shadow, and tell him there is no such matter, that the recovery is promised to prayer, and also forgiveness; and seing we pray by all for their raising up, and that they may be forgiven, why do we not as well anoint? But, what logic can make out this consequence inasmuch as anointing, being there only spoken of as the concomitant rite used in the application of the gift of healing, it is manifest that without the existence and exercise of the gift itself, it is not now to be repeated; and therefore though prayer be principally commanded as the special mean, by which even the gift of miracles was actuate[d] and made effectual, and to this day does remain as the great one by which all the promises either for raising up or remission are drawn out unto effect; yet thence to infer that anointing, a peculiar solemnity in the gift of healing, should still continue, notwitstanding the gift itself be ceased, is very absurd: Now, that anointing was an ordinary observance in the exercise of the gift of healing, you may read it clearly in the disciples’ practice, Mk. 6:13. And they anointed with oil many that were sick and healed them. This being then the just and true account, not only of our practice, but also of that of the whole reformed Churches, how vain and ridiculous are you to tell us, that our pretence of Scripture is but to impose on women and simple people, and all our persuasion, grave nods and big words: but leaving you to puff petulantly where you can prove nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117-19</span></figcaption>

<blockquote><p>We respond: it is further asked whether it be of a Scriptural or ecclesiastical use, or an ancient or new use.” 5 conclusions are given. 2nd Problem, ‘Whether the Old Testament Church from Moses to Ezra began to use and maintained liturgies?’, p. 361 3rd Problem, ‘Whether a liturgy from Ezra and the men of the great Synagogue (that consistory or Sanheidren, as it is termed in the Hebrew, beit deenu) was established, having been prescribed to the people of God, and was publicly used till Christ?’, p. 363 3 conclusions are given on p. 364. 4th Problem, ‘Whether forms &amp; litugies were established in the apostolic Church from the apostles to that Church, such that they have been prescribed to all succeeding churches?’, p. 364 3 conclusions. 5th Problem, ‘Whether a universal liturgy ought to be formed and written, and imposed on all the Churches throughout the whole globe?’, p. 365 3 reasons are given. 6th Problem, ‘Whether one provincial or national liturgy ought to be established, and introduced into all of its consociating churches?’, p. 367 4 conclusions. 7th Problem, ‘Whether liturgies in the national language, whatever is commonly used to write, ought to be taken up in the churches?’, p. 368 8th Problem, ‘Whether a liturgy in Churches already settled, from their first gathering or its introduction at the Reformation, may be changed?, p. 369 1 conclusion. 9th Problem, ‘What is the Gregorian or Roman service (named after Gregory VII) and what is the Mozarabic, or Gothic, and in what place were they used, or are used in the Roman Church?’, p. 370 [No 10th Problem] 11th Problem, ‘How far it is better for a populace having been accustomed to the Roman liturgies and rites from the Papacy to the Reformation, to carry them over, if they had been so engaged initially by the reformers, having purged and yet retained the Missal, Breviary and other liturgical books and rites?’, pp. 372-4 ch. 3, ‘Of Rituals or Ecclesiastical Ceremonies’, pp. 374-384 This chapter is on the general introductory principles of the nature and properties of ceremonies, including (1) their name, (2) their nature and definition, (3) division and (4) opposites. Under (1) Voet also briefly discusses adiaphora on p. 375. Under (2) Voet gives numerous principles and distinctions as to worship (and its kinds) in general (p. 375) before delineating distinctions about ceremonies in general (p. 376). p. 375, Voet distinguishes the following distinctions about worship: It is either natural or instituted. Natural is internal; instituted may be both internal and external. External is either alone or social, or private or public. Public worship is performed by the Church. p. 376, Ceremonies are either divine or human. Divine ceremonies have been immediately instituted by God; therefore their observance is necessary. Divine ceremonies are either political or ecclesiastical. Political are either general and perpetual, observance of natural decorum, or particular, as ceremonies of the judicial law of Moses. Ecclesiastical are sacred, mystical and religious, either of the Old Testament (before or after Moses) or of the New Testament. A human ceremony “which is observed in the practice of men, is called free. It is either civil or ecclesiastical. Civil is some external formality or a mode to be done between men, practiced by law or custom. These things are twofold: Either by a natural reason or necessity supporting, and therefore contributing to the essence or well being of something, such as a natural decorum or many aspects in the instruction of civil manners; or they are received by men as merely arbitrary and instituted. And such free ceremonies are either well-grounded or tolerated, or will be hissed at as vain, inept and rediculous as they may be seen openly in courts, halls, schools, barracks, colleges…</p></blockquote>

<blockquote><p>First, whereas you say, It suffices that it is bread and wine before consecration, by which substances we be nourished, it proves not but that in the sacrament itself the conveniency is by you taken away. For we speak not of the sacrament when it is now a sacrament, where also we affirm that the analogy must be kept. You appoint the same to be before the sacrament; and when ye come to the sacrament, you take it away, and so ye sin against the sacrament.</p></blockquote>

<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin. 1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful. 2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer. 1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God. 2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f9b5f464f6" data-kw="">
<blockquote><p>4. Antecedent and consequent wills are such as cannot agree to God as they [Arminians] understand them. For his antecedent will they make to be such whereby He wills and earnestly desires the salvation of all men: the consequent will, that whereby He wills the damnation of some, namely such as persist in unbelief; and the salvation of others; namely such as persevere in the faith; now these cannot agree with the nature of God; for:

1. For this antecedent will has sometimes an end and the consequent will always a beginning; the absolute or peremptory decree of damnation, never taking place till the antecedent or conditional will touching salvation be expired: and so likewise the peremptory decree of salvation, not taking place till the ceasing of the other. Now the acts of God’s will are immanent acts, therefore eternal like Himself. Objection: But God foresees who will persevere in believing, and upon this foresight grounds his purpose. Answer: Then upon this foresight, He only purposes to will their salvation when they do believe and persevere; but He does not actually will it, that is, will it with his consequent and peremptory will, till they do believe; which cannot stand with the eternity of his will.

2. This antecedent will they make rather to be a velleietas, than a volitio, rather ‘a wishing’ and desiring, than ‘a willing,’ which cannot agree to God; who is totus actus, all act, yea actus purissimus et perfectissimus, the most pure and perfect act: therefore no imperfect wishes and desires belong to Him. (Si Deus non potest, est impotens, si potest sed non efficit quia non licet, tum Deus vellet aliquid quod non liceret [If God cannot, He is impotent; if He can, but does not effect it because it is not permitted, then God would will something which is not permitted]. Dr. Twisse)

3. If God by his antecedent will does seriously and heartily desire the salvation of all men, when some of these come to be damned, then this desire either still continues in Him or not: If it does not continue, then his will is changeable, but he says of Himself, ‘I am the Lord, I change not,’ Mal. 3:6. Besides, they make this antecedent will whereby He wills the salvation of all to flow from his nature; and being natural to him, it must be unchangeable as his nature is: If it does continue, then God continues earnestly to desire the salvation of wicked men when they are damned; so never has his desire accomplished, which cannot stand with perfect felicity: yea if it does continue, then God does seriously will their salvation and damnation at one time, and so wills a flat contradiction: or else when He damns men, He does not will to damn them; and so his actions are not guided by his will.

4. If he does will their salvation, why does He not work it, for He is in heaven, and does whatsoever He will? ‘He works all things according to the pleasure of his will,’ Eph. 1:11.</p></blockquote>

<blockquote><p>A second set of distinctions can be made between the voluntas Dei absoluta et antecedens, the absolute and antecedent will, of God and the voluntas Dei ordinata et consequens. The Lutheran orthodox argue this distinction as a description of the effective will of God ad extra and juxtapose it with the previous distinction between the revelative will of God and the hidden will. The voluntas absoluta et antecedens, sometimes called voluntas prima, first or primary will, is the eternal divine will in and of itself, according to which the ultimate end or final good is willed by God apart from consideration of conditions, circumstances, and means to be encountered or used proximately in the achievement of the divine purpose. The voluntas ordinata et consequens, sometimes called voluntas secunda, second or secondary will, is the will of God according to which he orders proximate causes and effects both in terms of the universal order and its laws and in terms of the circumstances that arise out of the contingent events and the creaturely free wills resident in the order. The voluntas ordinata, therefore, corresponds with the potentia ordinata (q.v.), or ordained power of God, whereas the voluntas consequens is a distinct willing that rests on the divine foreknowledge. In the systems of Lutheran orthodoxy, the voluntas consequens is the will of God that elects intuitu fidei (q.v.), in view of faith. The Reformed deny the distinction between voluntas antecedens and voluntas consequens on the ground that it amounts to a denial of the freedom and independence of the divine will and implies contingency in God himself. They accept, however, the distinction between voluntas absoluta and voluntas ordinata in conjunction with that between potentia absoluta and potentia ordinata, and subsume both voluntas absoluta and voluntas ordinata under the voluntas decreti vel beneplaciti considered as the ultimate voluntas Dei decernens, the deciding will of God. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God. The voluntas revelata can be distinguished into a voluntas legalis, according to which God demands obedience to his will, and a voluntas evangelica, according to which God wills to save through grace in Christ. The Reformed occasionally allow here a distinction between voluntas antecedens and voluntas consequens. The former refers to the commands of God, the voluntas legalis, which ordains the conditions of human life absolutely; the latter refers to the voluntas evangelica, which establishes the conditions under which fallen mankind can be saved.</p></blockquote>

<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.”

</figure><figure class="quote" id="q-9aa4adf912" data-kw="">
<blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>

<blockquote><p>(2) In this Sinai-Covenant Jesus Christ is frequently tendered unto Israel, and that in variety of notions and considerations as has been abundantly manifested: The Tabernacle, the veil, the ark, the mercy-seat over the ark, the high priest with his consecration, garments, office, etc. the sacrifices of all sorts, the altar of incense, the altar of burnt-offering, etc. they all typed out and tendered Christ to Israel. Consequently true faith in Christ must herein be necessarily implied and required of Israel for discerning Christ in these mysteries, for apprehending and applying Him unto themselves for righteousness and salvation accordingly. For without such faith to apprehend and apply Christ, all these manifestations of Christ to Israel had been vain, useless and ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum</cite>, … (London: R.W., 1657), bk. 3, ch. 4, p. 865</span></figcaption>

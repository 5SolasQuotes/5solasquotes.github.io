<main class="wrap"><figure class="quote" id="q-64accecdb3" data-kw="">
<blockquote><p>That all the members of the catholic Church are united in this profession [of the Christian faith] is very true; but this is not all, they are bound to more than this, viz. to the exercise of the same specifical ordinances, to subjection to the same discipline, as also to love to one another, and where it is possible, to the celebrating together of the same numerical worship. And in any of these, to make any differences, is a breach of that union, that ought to be among the members of the catholic visible Church. … For when Christ has instituted that every church meeting together, and every member of the catholic Church, should exercise the same specifical ordinances, is not this a Church union, or union of Churches? And let it then be considered, that if every member of the Church catholic may be a member of any or every particular church, where providence may cast him (being rightly qualified thereunto), having right first to the same specifical ordinances as a member of the catholic, and then to the same numerical ordinances, where he comes and finds them (as some of his own way [that is congregationalism] do grant, and cannot well be denied), then the denial of such a person to join in those numerical ordinances [such as congregationalists practice] is a breach of that union and love which ought to be between the members of the catholic Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr</cite>, [John] Owen… (London, 1657), ch. 5; pp. 93-4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08bff57bc3" data-kw="">
<blockquote><p>…they [the apostolic Church] practiced all the ordinances directed, though they had no written directory¹ in a formal contexture or frame: for prayers, preaching, praising, sacraments and censures never Church wanted [lacked] in some one order or other, though we cannot say that the apostolic Church had this same very order and form: But a liturgy which is a commanded, imposed, stinted form, in such words and no other, is another thing than a directory, as an unlawful thing is different from a lawful: [¹ While Rutherford is speaking of directories in general, yet this section may have some reference to Westminster’s Directory for the Public Worship of God, as the Church of Scotland had adopted it in 1645, a year before this book of Rutherford’s was published.] 2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal, in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture, as was the [Anglican] Service-Book; and the pastor or people in these are not properly moral agents, nor do we press that Scripture should regulate men in these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Intro | Section 5, pp. 80-1</span></figcaption>

</figure><figure class="quote" id="q-f2f9ef2aec" data-kw="">
<blockquote><p>Another feature of the book [of Common Order, 1564] was that it was so framed as to make responsive worship impossible. The worshipper was to follow the continuous prayers with silent accord… At Frankfort [Germany] the signal for the outbreak of hostilities between the two parties was the loud responses of the Anglicans when a liturgy of compromise was read. The ground which Knox had taken up there, he was not likely to abandon in Scotland. His position would be that the people’s vocal part in divine service was the singing of Psalms; for the preface to the original Geneva Book says: ‘Prayers are after two manner of sorts, that is, either in words only or else with song joined thereunto.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-leishman.html">Thomas Leishman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ritual of the Church’ in</cite>, ed. Story, Robert, The Church of Scotland, Past and Present (1890 ff.), vol. 5, p. 327</span></figcaption>

<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 193</span></figcaption>

iged%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>While they [the Jews] had the tenth of their goods consecrated, these [Christians] on the other hand who have received freedom [from the Mosaic Law] assign all that they have to the uses of the Lord, cheerfully and freely giving them, and not in lesser portions only, as becomes men professing the hope of greater things.’ . . Start Here: Articles &amp; Book Articles Smyth, Thomas – The Parsimony of Professing Christians being Note A to The Rule &amp; Measure of Christian Charity in Works, vol. 7 American, southern presbyterian. Parsimony means an extreme unwillingness to spend money. Peck, Thomas – Moral Obligation of the Tithe (1890) in Miscellanies, vol. 1, pp. 146-57 Peck was an American, southern presbyterian.. He argues that while natural and Biblical principles morally obligate us to return a portion of our income to the service of the Lord, this does not obligate an exact amount of, or at least, 10% in the New Testament era. While this article is very valuable, yet throughout it Peck argues for Voluntaryism, which is contrary to the Establishment Principle of the Reformation.. This aspect of Peck’s article is not recommended. Balfour, William – The Establishment Principle Defended, pp. 126-34 (1873) Balfour was a minister in the Free Church of Scotland.. He here defends from Scripture the Reformation’s view of the Establishment Principle with regards to tithing. Balfour is here arguing against the Voluntary position of the Scottish United Presbyterian Church, with which Church the Free Church was considering union with in his time. The teaching of Scripture is clear. . Book Croteau, David – A Biblical &amp; Theological Analysis of Tithing: Toward a Theology of Giving in the New Covenant Era PhD dissertation (2005) 339 pp. Croteau brings out numerous, enlightening Biblical insights.. His historical survey on pp. 6-68 is very helpful, especially in documenting the tithing renewal that occurred in America during the late-1800’s and following.. Indispensable for further digging into the subject, especially for his citations of literature on the subject. . . Dictionary &amp; Encyclopedia Articles on the Biblical tithes 1800’s Smith, William – ‘Tithe’ in Dr. William Smith’s Dictionary of the Bible, Comprising its Antiquities, Biography, Geography &amp; Natural History, vol. 4 ed. H.B. Hackett &amp; Ezra Abbot (1871) ** ed. McClintock &amp; Strong – ‘Tithe’ in Cyclopedia of Biblical, Theological and Ecclesiastical Literature (1880) Davis, John D. – ‘Tithe’ in A Dictionary of the Bible (1898) . 1900’s Jewish Encyclopedia – ‘Tithe’ (1901-1906) ed. Orr, James – ‘Tithe’ in International Standard Bible Encyclopedia (1915 / 1939) . . Articles Theological &amp; Political 1500’s Bullinger, Henry – Tenth Sermon, pp. 486-500 in the Fifth Decade of The Decades 1550’s Bullinger (1504–1575) was a Swiss reformer, the successor of Zwingli as the head of the Zurich Church. ** Ursinus, Zacharias – p. 570 (bottom) of ‘The Fourth Commandment’ in Commentary on the Heidelberg Catechism trans. Williard, 3rd American ed. (1851) Ursinus (1534–1583) was a prominent German Reformed theologian. ** Vermigli, Peter Martyr – Pt. 4, ch. 13, ‘Of a Magistrate, &amp; of the Difference between Civil &amp; Ecclesiastical Power’, section 18-32 in Common Places (1583), pp. 235-45 Quote: “First we must understand that tithes in the old time pertained unto ceremonies, and that as well in Melchisedek as in the Levites: Because in either priesthood they were referred unto Christ, and either priesthood was in very deed a figure of Christ… But what signified the tenths in either priesthood? Truly they signified nothing else but that it behoved the old fathers to acknowledge that whatsoever they had came from Christ. By that ceremony, the people worshipped Christ Himself… Boniface says: “We receive the tithes of all laymen.” Ye take them indeed, but now that Christ is come, the paying of tithes is no more a ceremony as it was before the coming of Christ when by tithes men worshipped Christ which was to come in the flesh, and confessed that they ought unto Him, both themselves, and all that they had. After the very which manner they paid the first fruits of all that they had. Nevertheless our men in these days receive tithes: but by what law? Truly not by the ceremonial law, but by a moral Law: since it is requisite that the minister should be sustained by the people: (Mt. 10:10) For the laborer is worthy of his reward: And he which serves the Gospel ought to live by it. So then, whether stipends be paid unto ministers out of lands or out of houses, either in ready money or in tithes, it makes no matter so that they be not maintained dishonestly, but honestly. Indeed these rewards in some places do retain the old manner of tithes. Howbeit in many places they are not called tithes, but stipends or wages. And doubtless they be rather rewards which are due to the labors of ministers than tithes.</p></blockquote>

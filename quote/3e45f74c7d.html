<blockquote><p>20. Irony, stories, jests, repetitions of false things and the like are not lies for they are not testimonies. They are not testimonies because they are not confirmed by the credit and authority of the speaker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John D. Eusden (Baker, 1997), bk. 2, ch. 21, ‘Telling the Truth’, p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

— William Ames, The Marrow of Theology, ed. John D. Eusden (Baker, 1997), bk. 2, ch. 21, ‘Telling the Truth’, p. 326">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C20.+Irony%2C+stories%2C+jests%2C+repetitions+of+false+things+and+the+like+are+not+lies+for+they+are+not+testimonies.+They+are+not+testimonies+because+they+are+not+confirmed+by+the+credit+and+authority+of+the+speaker.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Theology%2C+ed.+John+D.+Eusden+%28Baker%2C+1997%29%2C+bk.+2%2C+ch.+21%2C+%E2%80%98Telling+the+Truth%E2%80%99%2C+p.+326&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e45f74c7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e45f74c7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-theater-stage-plays-movies-acting-etc/#:~:text=20.%20Irony%2C%20stories%2C%20jests%2C%20repetitions%20of,credit%20and%20authority%20of%20the%20speaker&amp;text=20.%20Irony%2C%20stories%2C%20jests%2C%20repetitions%20of%20false%20things&amp;text=by%20the%20credit%20and%20authority%20of%20the%20speaker" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4fab36383e" data-kw="">
<blockquote><p>For this mystery of iniquity [of conformity] had its first rise even in the apostles’ times, it began then to work. And what was this mystery of iniquity, but an exaltation of man’s power above all that is called God, or that is worshipped, so as to sit upon, or over, or in the Temple of God, over the consciences of God’s people, and over the Church as God Himself? And note there also, it is called an ‘apostasy’, or (as Tit. 1:14) a turning away from, or of the truth (as afore) and such are adversaries too, and all Antichristian. Such an one was Diotrephes; that [in Greek], who loved the preeminence (the very spawn of this mystery) which sets him a work to raise himself:

1. In not receiving the apostle John;

2. In prating against him with malicious words;

3. In not receiving the brethren;

4. In forbidding those that would; And 5. In casting them out of the Church. Thus also did this mystery begin to work, as the apostle intimates both in Tit. 1:14 and in Col. 2:8,17,18, 20, 22, 23. But then this mystery was but in the swaddling clouts, which afterward growing by degrees to the full stature, was so bedecked with infinite varieties of ceremonies, and daily new fashions in religion (as the crow with every bird’s feather) that getting an unlimited, usurped power, and that under the color of Jure Divino [by divine right], all men’s consciences, churches must conform to the present fashion of worship and Church-government. Thus by degrees this Mystery of iniquity mounted to its height, and has now obtained such a prescription of antiquity, as is equivalent to a law. And not only the Pope claims and exercises this power over his whole Popedom and Hierarchy, but from him our late Prelates. And whence, or from whom you derive this very power, unless immediately either from the Pope or from our late Prelates, whose personal Prelacy you have abandoned, saving their Prelatical spirit and usurped power: or else from the antiquity of this mystery; you may do well to inform us. And in truth, this was that very sluice, which when first opened, did let in that inundation and deluge not only of will-worship, in all kind of ceremonies and superstitions, but also of human forms and frames of Church-government, and in all of them such a tyrannical power over all consciences and Churches as has wholly drowned all; so as Christ’s Dove can nowhere find where to set her foot. And therefore in this time of pretended Reformation, to erect this great idol, to wit, a power in man to prescribe laws and to legitimate commandments for worship and Church government, and to press them upon every man’s conscience: what is it, but with Nebuchadnezzar to erect his golden image and with an immortal law of the Medes and Persians, to bind all men to fall down and worship it? Or what is it, but with Jeroboam and his counsel (and so in every alteration of the State) to set up the golden calves with a strict commandment of universal conformity; none daring among all those Ten Tribes openly to profess the pure worship of God, saving the prophet Eliah, to whom those seven thousand were not known. And therefore God rooted out Jeroboam’s house; and did the Tribes escape scot-free for their yielding willing obedience to the commandment of the king’s counsel, though it were a public act of State? Was not Ephraim oppressed and broken in judgement because he willingly walked after the commandment? For God set wicked kings over them, who oppressed and brake them in judgement, tyrannizing at their pleasure. As always where a people is brought under the spiritual yoke of bondage, they are never free from the temporal. Nor only this, but they were carried into perpetual captivity and never returned unto this day. An example to be laid to heart both of rulers and people. Remember Ephraim therefore, the horribleness of whose sin appears by the horribleness of the punishment. And like to this is that of Jerusalem and of the Jews. They said indeed, ‘If we thus let Him alone, all men will believe in Him, and the Romans will come and take away both our place and nation.’ No, blind Jews, because ye did renounce your King Christ, and so envy the people’s salvation, therefore the Romans came and took away both your place and nation. And how did the Jews reject this their King? Christ tells us in a parable of a nobleman, Luke 19, saying (v. 14), But his citizens hated him and sent a message after him, saying, ‘We will not have this man to reign over us.’ Where note: First, they were such as professed to be the people of God, His citizens. Secondly, the ground of their refusal of Him to be their king was hatred of Him, and so to refuse Him is to hate Him. Thirdly, the manner of their refusal: 1. They sent a message after Him (as the vulgar translation renders it), but the original is, ‘They sent [in Greek] an ambassage after Him,’ which is more then a message. It must be done by a public act of State, to make all cock-sure. And 2. the matter of the ambassage, ‘We will not have this man, or this fellow ([in Greek]) this, noting their contempt of Him. And the reason hereof was their will: ‘We will not.’ But what was the issue? Read and mark it, v. 27, where Christ not long after returns in judgement against them, which He executes by those very Romans whom they so feared, to whom He gives this commission: ‘But those mine enemies that would not that I should reign over them, bring hither, and slay them, etc.’ which was done accordingly. … Such as conform to a State religion, or a State church-government, make that the supreme law and lord over their conscience, and so exclude Christ’s supremacy. Enough is said of that. But you cut me off from what I was about to add: Man’s nature is too prone to idolize the Power so, as to make it as the shadow of the bramble, in Jotham’s parable, under which to ease themselves of the labor to search into the Scriptures and so to come to know what they believe; most men pinning their religion upon the sleeve either of the priest, as the Papists do, or also of the magistrate, as our common Protestants do, wrapping all up in an implicit faith and blind obedience, according to your Remonstrance that urges conformity to the religion and government of Christ already established, or which shall be set up. Thus it was enough for the Pharisees to say, ‘We have a law, and by that law Christ ought to die.’ Thus Christ must not be God, because the Roman Senate, according to their law formerly made, had not first motioned it, or passed their vote for it, before Tiberius Caesar had commended it to them, namely to admit of Christ into their pantheon to take place among their gods. And is it not even so with us? Must not Christ be King of the Jews, only because by an act of State (as before) they will not have this man to reign over them. And Christ must not be God, because the Roman Senate had not pre-resolved it. And so Christ must not be sole Lord over the conscience, nor sole Lawgiver of his Church, nor his Word the sole rule of worship and of Christ’s Kingly government of his spiritual Kingdom in the conscience, and Churches of the saints, nor indeed Christ’s kingdom-spiritual, because the Sate has made a law which must rule the conscience in point of forms of worship and of Church-government, that Christ’s kingdom must be worldly…</p></blockquote>

— Henry Burton, Conformity’s Deformity. In a Dialogue Between Conformity &amp; Conscience. Wherein the Main Head of all the Controversies in These Times Concerning Church-Government is Asserted &amp; Maintained, … (London, 1646), pp. 11-14, 23-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+this+mystery+of+iniquity+%5Bof+conformity%5D+had+its+first+rise+even+in+the+apostles%E2%80%99+times%2C+it+began+then+to+work.+And+what+was+this+mystery+of+iniquity%2C+but+an+exaltation+of+man%E2%80%99s+power+above+all+that+is+called+God%2C+or+that+is+worshipped%2C+so+as+to+sit+upon%2C+or+over%2C+or+in+the+Temple+of+God%2C+over+the+consciences+of+God%E2%80%99s+people%2C+and+over+the+Church+as+God+Himself%3F+And+note+there+also%2C+it+is+called+an+%E2%80%98apostasy%E2%80%99%2C+or+%28as+Tit.+1%3A14%29+a+turning+away+from%2C+or+of+the+truth+%28as+afore%29+and+such+are+adversaries+too%2C+and+all+Antichristian.+Such+an+one+was+Diotrephes%3B+that+%5Bin+Greek%5D%2C+who+loved+the+preeminence+%28the+very+spawn+of+this+mystery%29+which+sets+him+a+work+to+raise+himself%3A+1.+In+not+receiving+the+apostle+John%3B+2.+In+prating+against+him+with+malicious+words%3B+3.+In+not+receiving+the+brethren%3B+4.+In+forbidding+those+that+would%3B+And+5.+In+casting+them+out+of+the+Church.+Thus+also+did+this+mystery+begin+to+work%2C+as+the+apostle+intimates+both+in+Tit.+1%3A14+and+in+Col.+2%3A8%2C17%2C18%2C+20%2C+22%2C+23.+But+then+this+mystery+was+but+in+the+swaddling+clouts%2C+which+afterward+growing+by+degrees+to+the+full+stature%2C+was+so+bedecked+with+infinite+varieties+of+ceremonies%2C+and+daily+new+fashions+in+religion+%28as+the+crow+with+every+bird%E2%80%99s+feather%29+that+getting+an+unlimited%2C+usurped+power%2C+and+that+under+the+color+of+Jure+Divino+%5Bby+divine+right%5D%2C+all+men%E2%80%99s+consciences%2C+churches+must+conform+to+the+present+fashion+of+worship+and+Church-government.+Thus+by+degrees+this+Mystery+of+iniquity+mounted+to+its+height%2C+and+has+now+obtained+such+a+prescription+of+antiquity%2C+as+is+equivalent+to+a+law.+And+not+only+the+Pope+claims+and+exercises+this+power+over+his+whole+Popedom+and+Hierarchy%2C+but+from+him+our+late+Prelates.+And+whence%2C+or+from+whom+you+derive+this+very+power%2C+unless+immediately+either+from+the+Pope+or+from+our+late+Prelates%2C+whose+personal+Prelacy+you+have+abandoned%2C+saving+their+Prelatical+spirit+and+usurped+power%3A+or+else+from+the+antiquity+of+this+mystery%3B+you+may+do+well+to+inform+us.+And+in+truth%2C+this+was+that+very+sluice%2C+which+when+first+opened%2C+did+let+in+that+inundation+and+deluge+not+only+of+will-worship%2C+in+all+kind+of+ceremonies+and+superstitions%2C+but+also+of+human+forms+and+frames+of+Church-government%2C+and+in+all+of+them+such+a+tyrannical+power+over+all+consciences+and+Churches+as+has+wholly+drowned+all%3B+so+as+Christ%E2%80%99s+Dove+can+nowhere+find+where+to+set+her+foot.+And+therefore+in+this+time+of+pretended+Reformation%2C+to+erect+this+great+idol%2C+to+wit%2C+a+power+in+man+to+prescribe+laws+and+to+legitimate+commandments+for+worship+and+Church+government%2C+and+to+press+them+upon+every+man%E2%80%99s+conscience%3A+what+is+it%2C+but+with+Nebuchadnezzar+to+erect+his+golden+image+and+with+an+immortal+law+of+the+Medes+and+Persians%2C+to+bind+all+men+to+fall+down+and+worship+it%3F+Or+what+is+it%2C+but+with+Jeroboam+and+his+counsel+%28and+so+in+every+alteration+of+the+State%29+to+set+up+the+golden+calves+with+a+strict+commandment+of+universal+conformity%3B+none+daring+among+all+those+Ten+Tribes+openly+to+profess+the+pure+worship+of+God%2C+saving+the+prophet+Eliah%2C+to+whom+those+seven+thousand+were+not+known.+And+therefore+God+rooted+out+Jeroboam%E2%80%99s+house%3B+and+did+the+Tribes+escape+scot-free+for+their+yielding+willing+obedience+to+the+commandment+of+the+king%E2%80%99s+counsel%2C+though+it+were+a+public+act+of+State%3F+Was+not+Ephraim+oppressed+and+broken+in+judgement+because+he+willingly+walked+after+the+commandment%3F+For+God+set+wicked+kings+over+them%2C+who+oppressed+and+brake+them+in+judgement%2C+tyrannizing+at+their+pleasure.+As+always+where+a+people+is+brought+under+the+spiritual+yoke+of+bondage%2C+they+are+never+free+from+the+temporal.+Nor+only+this%2C+but+they+were+carried+into+perpetual+captivity+and+never+returned+unto+this+day.+An+example+to+be+laid+to+heart+both+of+rulers+and+people.+Remember+Ephraim+therefore%2C+the+horribleness+of+whose+sin+appears+by+the+horribleness+of+the+punishment.+And+like+to+this+is+that+of+Jerusalem+and+of+the+Jews.+They+said+indeed%2C+%E2%80%98If+we+thus+let+Him+alone%2C+all+men+will+believe+in+Him%2C+and+the+Romans+will+come+and+take+away+both+our+place+and+nation.%E2%80%99+No%2C+blind+Jews%2C+because+ye+did+renounce+your+King+Christ%2C+and+so+envy+the+people%E2%80%99s+salvation%2C+therefore+the+Romans+came+and+took+away+both+your+place+and+nation.+And+how+did+the+Jews+reject+this+their+King%3F+Christ+tells+us+in+a+parable+of+a+nobleman%2C+Luke+19%2C+saying+%28v.+14%29%2C+But+his+citizens+hated+him+and+sent+a+message+after+him%2C+saying%2C+%E2%80%98We+will+not+have+this+man+to+reign+over+us.%E2%80%99+Where+note%3A+First%2C+they+were+such+as+professed+to+be+the+people+of+God%2C+His+citizens.+Secondly%2C+the+ground+of+their+refusal+of+Him+to+be+their+king+was+hatred+of+Him%2C+and+so+to+refuse+Him+is+to+hate+Him.+Thirdly%2C+the+manner+of+their+refusal%3A+1.+They+sent+a+message+after+Him+%28as+the+vulgar+translation+renders+it%29%2C+but+the+original+is%2C+%E2%80%98They+sent+%5Bin+Greek%5D+an+ambassage+after+Him%2C%E2%80%99+which+is+more+then+a+message.+It+must+be+done+by+a+public+act+of+State%2C+to+make+all+cock-sure.+And+2.+the+matter+of+the+ambassage%2C+%E2%80%98We+will+not+have+this+man%2C+or+this+fellow+%28%5Bin+Greek%5D%29+this%2C+noting+their+contempt+of+Him.+And+the+reason+hereof+was+their+will%3A+%E2%80%98We+will+not.%E2%80%99+But+what+was+the+issue%3F+Read+and+mark+it%2C+v.+27%2C+where+Christ+not+long+after+returns+in+judgement+against+them%2C+which+He+executes+by+those+very+Romans+whom+they+so+feared%2C+to+whom+He+gives+this+commission%3A+%E2%80%98But+those+mine+enemies+that+would+not+that+I+should+reign+over+them%2C+bring+hither%2C+and+slay+them%2C+etc.%E2%80%99+which+was+done+accordingly.+%E2%80%A6+Such+as+conform+to+a+State+religion%2C+or+a+State+church-government%2C+make+that+the+supreme+law+and+lord+over+their+conscience%2C+and+so+exclude+Christ%E2%80%99s+supremacy.+Enough+is+said+of+that.+But+you+cut+me+off+from+what+I+was+about+to+add%3A+Man%E2%80%99s+nature+is+too+prone+to+idolize+the+Power+so%2C+as+to+make+it+as+the+shadow+of+the+bramble%2C+in+Jotham%E2%80%99s+parable%2C+under+which+to+ease+themselves+of+the+labor+to+search+into+the+Scriptures+and+so+to+come+to+know+what+they+believe%3B+most+men+pinning+their+religion+upon+the+sleeve+either+of+the+priest%2C+as+the+Papists+do%2C+or+also+of+the+magistrate%2C+as+our+common+Protestants+do%2C+wrapping+all+up+in+an+implicit+faith+and+blind+obedience%2C+according+to+your+Remonstrance+that+urges+conformity+to+the+religion+and+government+of+Christ+already+established%2C+or+which+shall+be+set+up.+Thus+it+was+enough+for+the+Pharisees+to+say%2C+%E2%80%98We+have+a+law%2C+and+by+that+law+Christ+ought+to+die.%E2%80%99+Thus+Christ+must+not+be+God%2C+because+the+Roman+Senate%2C+according+to+their+law+formerly+made%2C+had+not+first+motioned+it%2C+or+passed+their+vote+for+it%2C+before+Tiberius+Caesar+had+commended+it+to+them%2C+namely+to+admit+of+Christ+into+their+pantheon+to+take+place+among+their+gods.+And+is+it+not+even+so+with+us%3F+Must+not+Christ+be+King+of+the+Jews%2C+only+because+by+an+act+of+State+%28as+before%29+they+will+not+have+this+man+to+reign+over+them.+And+Christ+must+not+be+God%2C+because+the+Roman+Senate+had+not+pre-resolved+it.+And+so+Christ+must+not+be+sole+Lord+over+the+conscience%2C+nor+sole+Lawgiver+of+his+Church%2C+nor+his+Word+the+sole+rule+of+worship+and+of+Christ%E2%80%99s+Kingly+government+of+his+spiritual+Kingdom+in+the+conscience%2C+and+Churches+of+the+saints%2C+nor+indeed+Christ%E2%80%99s+kingdom-spiritual%2C+because+the+Sate+has+made+a+law+which+must+rule+the+conscience+in+point+of+forms+of+worship+and+of+Church-government%2C+that+Christ%E2%80%99s+kingdom+must+be+worldly%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Henry+Burton%2C+Conformity%E2%80%99s+Deformity.+In+a+Dialogue+Between+Conformity+%26+Conscience.+Wherein+the+Main+Head+of+all+the+Controversies+in+These+Times+Concerning+Church-Government+is+Asserted+%26+Maintained%2C+%E2%80%A6+%28London%2C+1646%29%2C+pp.+11-14%2C+23-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4fab36383e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4fab36383e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-conformity-to-what-is-not-right/#:~:text=For%20this%20mystery%20of%20iniquity%20%5Bof,that%20Christ%E2%80%99s%20kingdom%20must%20be%20worldly&amp;text=For%20this%20mystery%20of%20iniquity%20%5Bof%20conformity%5D%20had&amp;text=of%20Church%2Dgovernment%2C%20that%20Christ%E2%80%99s%20kingdom%20must%20be%20worldly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6cfc349ce3" data-kw="">
<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>

<blockquote><p>The state of the case turns on the definition. For the children of Reuben, Gad, and Manasseh, explain that they had a different intention, and thus exculpate themselves from the charge, inasmuch as the nature of the proceeding was quite different from what the others supposed… as if they had said, that it will be made palpable by the fact itself, that they never had any intention of devising any new form of worship; and they rightly explain how the altar would have been unlawful, namely, if they had built it for the purpose of offering sacrifice. For the Law did not condemn the mere raising of heaps of stones, but only enjoined that sacrifices should be offered in one place…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Joshua</cite>, 22 | v. 21</span></figcaption>

<blockquote><p>Educate yourself and may the Lord be near to you and protect you and yours; and whatever you do, no matter the amount of pressure, do not give up your God-given common sense or your appeals to God’s moral laws. They gave them up a long time ago.</p></blockquote>

<blockquote><p>117. A significant part of that dominion and subjection [Gen. 1:28] is that humans could feed not only on herbs and tree fruits, but also on animals for food. After the Pythagoreans and Hebrews, other ancient and modern Christians considered this unlawful, deceived by παρερμηνείᾳ [a misinterpretation] of Moses’ words, which when correctly explained declare the opposite. For God speaks thus [Gen. 1:29-30]: “Behold, I have given you every herb bearing seed, which is upon the face of the earth, and every tree which is in it, the fruit of the tree bearing seed shall be yours for food; ולכל חית הארץ [and for all living things of the earth], or together with all animals of the earth, indeed and every bird of יeaven and every creeping thing upon the earth, with every green herb of the earth for food.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Christian Theology</cite>, tr. by AI by Onku (Zurich: Bodmer, 1700), vol. 1, locus 6, ‘On the Creation of the World’, sect. 117, pp. 235-36</span></figcaption>

</figure><figure class="quote" id="q-ee60753388" data-kw="">
<blockquote><p>Righteousness, which is commonly called ‘Original’, is part of this image, and consists in that rectitude of human nature by which the affections obeyed the will, the will obeyed reason, and reason obeyed God. Since this was implanted in the first man in creation itself, Gen. 1:26-27, 31; 2:25; Eph. 4:24, it is rightly called ‘natural’. Through this man had free will unto good, but mutably. For when God did not preserve him, he could by a fallacious appearance of the object defect unto evil, as the event taught a little later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-2e7bfd0106" data-kw="">
<blockquote><p>The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, [Edward] Feser’ (RBO, 2025) | 12. ‘Gradation of Principles &amp; Practices’</span></figcaption>

2e7bfd0106.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=The%20many%20ethical%20gradations%20of%20common,ethical%20living%20in%20common%20life%20better&amp;text=The%20many%20ethical%20gradations%20of%20common%20life%20arise&amp;text=gradations%20of%20ethical%20living%20in%20common%20life%20better" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now, as medieval thinkers like Thomas Aquinas argued, anything with an intellect must also possess a will. For a substance with an intellect acts by virtue of being inclined toward what its intellect takes to be good, and the will just is (on this analysis) an inclination of that sort.</p></blockquote>

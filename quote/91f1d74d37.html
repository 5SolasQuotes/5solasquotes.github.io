<main class="wrap"><figure class="quote" id="q-91f1d74d37" data-kw="">
<blockquote><p>For when some have taken up a private interpretation of any place of Scripture, if, before they have thoroughly imbibed and vented it, they do not submit their conception, although they seem to be greatly satisfied in it and full of it, unto the authority of the Scripture in the declaration of its own mind in other places, there is but small hope of their recovery. And this is that pride which is the source and original of heresy, -- namely, when men will prefer their seemingly wise and rational conceptions of the sense of particular places before the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c75d8d272c" data-kw="">
<blockquote><p>Therefore he declares that the most precise norm, canon, or rule of faith is not the Scripture but the judgment of the church. … In his Hierarchiae ecclesiasticae assertio (Bk. 1, ch. 2), Pighius says that the apostles wrote some things not in order that these writings should rule over our faith and religion but rather that they should be subject to them. … the Holy Scripture is the most certain rule of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Concerning Sacred Scripture</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-3e0068a0fa" data-kw="">
<blockquote><p>They did only examine Paul&#x27;s doctrine by the rule and square of the Scripture … for the Scripture is the true touchstone whereby all doctrines must be tried. If any man say that this kind of trial is doubtful, forasmuch as the Scripture is oftentimes doubtful, and is interpreted divers ways, I say, that we must also add judgment of the Spirit, who is, not without cause, called the Spirit of discretion, [discernment.] But the faithful must judge of every doctrine no otherwise then out of, and according to, the Scriptures, having the Spirit for their leader and guide.</p></blockquote>

</figure><figure class="quote" id="q-56a4cd9a83" data-kw="">

<main class="wrap"><figure class="quote" id="q-3e7b5d19de" data-kw="">
<blockquote><p>IT is the Apostle’s Precept that we should stand fast in the liberty with which Christ hath made us free; and doubtless we are no more to deprive our selves of that liberty which our great Creator hath indulged us, than to throw away the life, health or estate with which he hath blessed us.

It is one thing for us as our free-will offering to set apart one of the days which God hath given us for our own occasions, for the service of God; another thing for us to think our selves obliged to do this, and to do it in a pretended Conscience to a command, when we have no such command.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), p. 81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 4, pp. 46-47</span></figcaption>

</figure><figure class="quote" id="q-91617f369c" data-kw="">
<blockquote><p>[R]eligion and liberty are inseparably connected. They may be compared to twin trees, growing on the same root, and nourished by the same soil. Religion is the best nurse of freedom, and freedom is the natural defender of the faith. In all periods, as has often been observed, they have flourished or decayed together. And they have generally had common friends, and common foes.

To maintain religious liberty, we must secure civil freedom, because religious liberty, though descended immediately from God, depends, for the outward enjoyment of it, on civil laws. And, in like manner, to maintain our civil rights, we must maintain the gospel in its purity and power; otherwise, in course of time, a growing immorality will corrupt and endanger the noblest constitution ever devised by the wisdom of man. Civil liberty is mortal. She will soon decay, she will certainly die, when she ceases to be animated by religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), p. 46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-d2f0d8ac55" data-kw="">
<blockquote><p>Liberty, or human right, in its most exalted sense, consists in being maintained in the possession of whatever is secured to man by the Divine law. I do not say, whatever may be secured by the constitution and laws of a country, because these may be most unrighteous. The law of God is the standard by which all right must be tried; and in accordance with which constitutions of civil government and laws ought to be made.

No man can have a right to do what he pleases. This would not be liberty but licentiousness, and instead of promoting the happiness of a people would most certainly destroy it. The pleasure and the will of the powerful few would then be gratified at the expense of society generally, as has always been the case in despotic governments; and such must always be the case, where the Bible principles of civil government are set aside, however liberal the form of government may be. The moment that these principles are departed from, that moment a nation enters upon dangerous ground, and no human wisdom or foresight can possibly balance the machinery of government, so as to prevent encroachments on the rights of one part or other of the nation. Despotism on the one hand or anarchy on the other, must be the result.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive Principles of the Reformed Presbyterian Church</cite>, (Albany NY: J. Munsell, 1841), p. 242.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

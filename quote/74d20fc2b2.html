<blockquote><p>I find her Majesty’s [Queen Elizabeth I’s] proceedings to have been grounded upon two principles. The one, that consciences are not to be forced, but to be won and reduced by force of truth, with the aid of time, and use of all good means of instruction and persuasion. The other, that causes of consciences when they exceed their bounds, and grow to be matter of faction, loose their nature, and that soveriegn princes ought distinctly to punish their practices and contempt, though colored with the pretence of conscience and religion. According to these principles, her majesty at her coming to the crown, utterly disliking the tyranny of Rome, which had used by terror and rigor to settle commandments of men’s faiths and consciences. Though as a princess of great wisdom and magnanimity, she suffered but the exercise of one religion; yet her proceedings towards the Papists, was with great lenity: expecting the good effects which time might work in them… her Majesty not liking to make windows into men’s hearts and secret thoughts, except the abundance of them did overflow into overt and express acts or affirmations, tempered her law so… and that… the humors of most Papists were altered, and that they were no more Papists in conscience, and of softness, but Papists in faction: Then were there new laws made for the punishment of such as should submit themselves to such reconcilements, or renunciation of obedience… For the other party, which have been offensive to the State, though in another degree, which named themselves Reformers, and we commonly call ‘Puritans,’ this has been the proceeding towards them: A great while, when they inveighed against such abuses in the Church as pluralities [of benefices], non-residence [of ministers] and the like, their zeal was not condemned, only their violence was sometime censured. When they refused the use of some ceremonies and rites, as superstitious, they were tolerated with much connivancy and gentleness; yea, when they called in question the superiority of bishops, and pretended to a democracy into the Church [many were congregationalists]; yet their propositions were here considered, and by contrary writings debated and discussed. Yet all this while, it was perceived that their course was dangerous and very popular: as because Papistry was odious, therefore it was ever in their mouths that they sought to purge the Church from the relics of Papistry; a thing acceptable to the people, who love ever to run from one extreme to another. Because multitude of rogues and poverty was an eye-sore, and a dislike to every man; therefore they put into the people’s head that if discipline were planted, there should be no vagabonds nor beggars, a thing very plausible: and in like manner they promised the people many of the impossible wonders of their discipline; besides, they opened to the people a way to government by their consistory and presbytery [through ruling elders]; a thing, though in consequence no less prejudicial to the liberties of private men, than to the sovereignty of princes; yet in first show very popular. Nevertheless this, except it were in some few that entered into extreme contempt, was born with, because they pretended in dutiful manner to make propositions, and to leave it to the providence of God, and the authority of the magistrate. But now of later years, when there issued from them that affirmed the consent of the magistrate was not to be attended; when under pretense of a confession, to avoid slander and imputations, they combined themselves by classes and subscriptions, when they descended into that vile and base means of defacing the government of the Church, by ridiculous pasquils [works of satire], when they begun to make many subjects in doubt to take oaths, which is one of the fundamental parts of justice in this land, and in all places; when they began both to vaunt of their strength and number of their partisans and followers, and to use cominations [threatenings] that their cause would prevail, through uproar and violence, then it appeared to be no more zeal, no more conscience, but mere faction and division: and therefore though the State were compelled to hold somewhat a harder hand to retrain them than before, yet was it with as great moderation, as the peace of the State or Church could permit. And therefore, sir, to conclude, consider uprightly of these matters, and you shall see her Majesty is no more a temporizer in religion: It is not the success abroad, nor the change of servants here at home, can alter her; only as the things themselves alter, she applied her religious wisdom to methods correspondent unto them; still retaining the two rules before mentioned, in dealing tenderly with consciences, and yet in discovering faction from conscience, and softness from singularity.</p></blockquote>

<blockquote><p>That there are many things which are not to be approved in the Church, which are not worthy of contention; Calvin, Epistle 51, fol. 100. … That many things must of us be tolerated which is not in our power to reform; Calvin, Epistle 148, fol. 254. That albeit men must endeavor to purge the Church of corruptions which sprung up out of superstition, yet this exception must go along, that certain things although they be not to be approved, yet must be born with all; Calvin, Epistle 305, fol. 504, to John Knox. That some rites and ceremonies, albeit not necessary are yet to be tolerated, or born withall for concord’s sake; Beza, Epistle 8, fol. 70. That as the manners of doting parents, so the customs of our unadvised country must be endured: yea the servitude which is without impiety, and that in matters of lesser nature (in the Church) must be borne withall; Harmony of Confessions §11, fol. 860; Melancthon, Concil. Thelog., pt. 2, fol. 107; and that there is ever some kind of servitude of the Church, more mild somewhere, somewhere more hard: howbeit more or less, there is ever some; Melanchthon, ibid., fol. 92.</p></blockquote>

<blockquote><p>X. If I say that God, pitying mankind, who through their own crime and the devil’s deceit have fallen into sin and destruction, sent His only-begotten Son. He became man for the sake of men, suffered and died, rose again, and ascended into heaven, obtaining remission of sins and eternal life for them. This great benefit of His Son, God makes known and proclaims to men through the preaching of the Gospel. Those who acknowledge and grieve over their sins, assent to the Gospel, believe in the Son, and trust in His merit and death, are reconciled to God, obtain remission of sins, and are transferred from a state of wrath and damnation to a state of glory and salvation, in which they will remain and surely become partakers of eternal glory, if, since they have believed and been reconciled to God, they strive to observe the divine commandments, do not live according to the flesh, and, with the help of divine grace, avoid committing sins against conscience. Thus, a man will be justified in this life and glorified in the future. If, I say, we use such words, taken from common usage and easily understood by anyone, there can be no disagreement among pious and gentle Christians about the doctrine. No one of them, unless afflicted by a vile and malicious urge to contend and quibble, will question this. But if I say, this is the principal efficient cause; this is the proximate principal cause; this is instrumental on the part of God, this on the part of man; this is merely a disposition; this is the formal cause itself; this is material, this necessary per se, this according to the hypothesis, if I start speaking this way, then it may easily happen that some will misunderstand or plainly not understand me, or interpret me differently than I intend; and thus, a controversy will arise over the use and application of such terms, which is purely scholastic and should not be given such importance that it disrupts the bond of Christian love and concord.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“X. If I say that God, pitying mankind, who through their own crime and the devil’s deceit have fallen into sin and destruction, sent His only-begotten Son. He became man for the sake of men, suffered and died, rose again, and ascended into heaven, obtaining remission of sins and eternal life for them. This great benefit of His Son, God makes known and proclaims to men through the preaching of the Gospel. Those who acknowledge and grieve over their sins, assent to the Gospel, believe in the Son, and trust in His merit and death, are reconciled to God, obtain remission of sins, and are transferred from a state of wrath and damnation to a state of glory and salvation, in which they will remain and surely become partakers of eternal glory, if, since they have believed and been reconciled to God, they strive to observe the divine commandments, do not live according to the flesh, and, with the help of divine grace, avoid committing sins against conscience. Thus, a man will be justified in this life and glorified in the future. If, I say, we use such words, taken from common usage and easily understood by anyone, there can be no disagreement among pious and gentle Christians about the doctrine. No one of them, unless afflicted by a vile and malicious urge to contend and quibble, will question this. But if I say, this is the principal efficient cause; this is the proximate principal cause; this is instrumental on the part of God, this on the part of man; this is merely a disposition; this is the formal cause itself; this is material, this necessary per se, this according to the hypothesis, if I start speaking this way, then it may easily happen that some will misunderstand or plainly not understand me, or interpret me differently than I intend; and thus, a controversy will arise over the use and application of such terms, which is purely scholastic and should not be given such importance that it disrupts the bond of Christian love and concord.”

— George Calixtus, Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus in the fundamentals tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 5-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CX.+If+I+say+that+God%2C+pitying+mankind%2C+who+through+their+own+crime+and+the+devil%E2%80%99s+deceit+have+fallen+into+sin+and+destruction%2C+sent+His+only-begotten+Son.+He+became+man+for+the+sake+of+men%2C+suffered+and+died%2C+rose+again%2C+and+ascended+into+heaven%2C+obtaining+remission+of+sins+and+eternal+life+for+them.+This+great+benefit+of+His+Son%2C+God+makes+known+and+proclaims+to+men+through+the+preaching+of+the+Gospel.+Those+who+acknowledge+and+grieve+over+their+sins%2C+assent+to+the+Gospel%2C+believe+in+the+Son%2C+and+trust+in+His+merit+and+death%2C+are+reconciled+to+God%2C+obtain+remission+of+sins%2C+and+are+transferred+from+a+state+of+wrath+and+damnation+to+a+state+of+glory+and+salvation%2C+in+which+they+will+remain+and+surely+become+partakers+of+eternal+glory%2C+if%2C+since+they+have+believed+and+been+reconciled+to+God%2C+they+strive+to+observe+the+divine+commandments%2C+do+not+live+according+to+the+flesh%2C+and%2C+with+the+help+of+divine+grace%2C+avoid+committing+sins+against+conscience.+Thus%2C+a+man+will+be+justified+in+this+life+and+glorified+in+the+future.+If%2C+I+say%2C+we+use+such+words%2C+taken+from+common+usage+and+easily+understood+by+anyone%2C+there+can+be+no+disagreement+among+pious+and+gentle+Christians+about+the+doctrine.+No+one+of+them%2C+unless+afflicted+by+a+vile+and+malicious+urge+to+contend+and+quibble%2C+will+question+this.+But+if+I+say%2C+this+is+the+principal+efficient+cause%3B+this+is+the+proximate+principal+cause%3B+this+is+instrumental+on+the+part+of+God%2C+this+on+the+part+of+man%3B+this+is+merely+a+disposition%3B+this+is+the+formal+cause+itself%3B+this+is+material%2C+this+necessary+per+se%2C+this </figure><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>

<blockquote><p>Melchior Adamus, both in the life of Carolostadius and in the life of Luther, observes the great evil which grew out of Luther’s dislike of Carolostadius, his strictness, zeal, and forwardness, in abolishing auricular confession, and difference of meats and casting out images out of churches, at which things Luther was the more offended, because done by Carolostadius in Wittenbreg during Luthers absence and without his knowledge and counsel. Luther did also allege that Carolostadius, his strictness and zeal in these lesser things, hindered and retarded the Reformation in more substantial points of doctrine. However the story notes that hence was the first rise of that deplorable Sacramentarian controversy [about the Lord’s Supper between the Lutherans and Reformed], which has ever since made so great a rupture in Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions (Edinburgh, 1649), ch. 10</cite>, pp. 129-30</span></figcaption>

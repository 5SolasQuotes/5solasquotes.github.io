<main class="wrap"><figure class="quote" id="q-3b4d25d63d" data-kw="">
<blockquote><p>XV. (8) Next is the calumny [of Papists against the Reformed] concerning independency, in the church as well as in the state, which causes us to recognize no authority in the church and to be hostile to superior powers. But nothing could be said more unjustly and be more foreign to our religion… We leave independency to those who withdraw themselves from the jurisdiction of the magistrate [such as Romanists] and think they are raised so far above kings that their crowns depend upon them, which they can confer or take away at pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1d886b46f" data-kw="">
<blockquote><p>…green and raw deliverances are plagues of God, not mercies; the plague is nine times removed, but Pharaoh’s heart is neither softened nor humbled, the scum abideth in the bloody city, as the Lord complains, Eze. 24:6, ‘Therefore thus saith the Lord God, Woe to the bloody City, to the pot whose scum is therein, and whose scum is not gone out;’ the prophet in Chaldea heard that Jerusalem had been boiled with the sword of the Lord, but the scum of their idolatry and blood remained in them; whilst the wicked of these kingdoms, malignants, bloody Irish, rotten hearted men, such backsliders and perjured apostates, as are in Scotland, delivered to Satan and excommunicated, while these taste of the gall and wormwood of the wrath of God in this war, the hand of God cannot be removed, and therefore that must be taken notice of, Jer. 6:29, ‘The bellows are burnt, the lead is consumed of the fire, the founder melteth in vain: for the wicked are not plucked away;’ O that our Lord would boil out on the fire the scum of both kingdoms. The whoredoms of Popish Egypt, and the ceremonies, the inventions of men are not mourned for by the pastors of the Lord, sure, I am, not by most of the ministers in Scotland…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached before the Right Honorable House of Lords, in the Abbey Church at Westminster, Wednesday the 25th day of June</cite>, 1645. Being the day appointed for a solemn and public humiliation., p. 40-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“…green and raw deliverances are plagues of God, not mercies; the plague is nine times removed, but Pharaoh’s heart is neither softened nor humbled, the scum abideth in the bloody city, as the Lord complains, Eze. 24:6, ‘Therefore thus saith the Lord God, Woe to the bloody City, to the pot whose scum is therein, and whose scum is not gone out;’ the prophet in Chaldea heard that Jerusalem had been boiled with the sword of the Lord, but the scum of their idolatry and blood remained in them; whilst the wicked of these kingdoms, malignants, bloody Irish, rotten hearted men, such backsliders and perjured apostates, as are in Scotland, delivered to Satan and excommunicated, while these taste of the gall and wormwood of the wrath of God in this war, the hand of God cannot be removed, and therefore that must be taken notice of, Jer. 6:29, ‘The bellows are burnt, the lead is consumed of the fire, the founder melteth in vain: for the wicked are not plucked away;’ O that our Lord would boil out on the fire the scum of both kingdoms. The whoredoms of Popish Egypt, and the ceremonies, the inventions of men are not mourned for by the pastors of the Lord, sure, I am, not by most of the ministers in Scotland…”

<blockquote><p>Aug. 10, 1585 Proclamation, Gatherings. The foresaid bailies and a part of the counsel ordains proclamation to be made through this burgh charging that no manner of persons enduring the time of this present pestilence, either men or women, take upon hand to hold any conventions at the close heads, Cowgate, and high streets, be even or be day, as they commonly do, whereby infection daily arises, discharging all convention of huseis [houses?] and women in special and all such other idle persons which has not charge or licence of the bailies, but only to convene at Kirk and market and to no other places and times, under the pain to be enclosed in their houses upon their own charges for the space of a month and further punished in their bodies and goods at the will of the magistrates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/city-of-edinburgh.html">City of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Extracts from the Records: 1585, Jul-Sept’, in Extracts From the Records of the Burgh of Edinburgh</cite>, 1573-1589, ed. J D Marwick (Edinburgh, 1882), pp. 430-437. British History Online</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-07e8509ec9" data-kw="">
<blockquote><p>That the feasts and meetings at halls, taverns, or other places within this city or liberties, used to be made by the countrymen of any shire, or other place within this realm, wrestlings, and fencers’ prizes, shows, or the like, which has been a cause of gathering multitudes together, be now forborne, and not attempted to be made by any person or persons whatsoever, until the city and the places adjacent shall be clear of the present infection (which God of his mercy grant).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mayor-of-london.html">Mayor of London</a></span><span class="wk"><span class="lbl">Work:</span> <cite>By the Mayor… of the City of London</cite>, 1630</span></figcaption>

</figure><figure class="quote" id="q-c3b11cf246" data-kw="">
<blockquote><p>As touching private persons, their bonds of friendship and amity are diverse and manifold; among these, this is the chiefest, unto which also natural conjunction of blood (as God witnesses) must give place, I mean the bond and tie of wedlock: so that in my judgement the husband cannot with a good conscience go or the wife from the husband, especially if one of them be [infected with?] the plague: And how much parents do owe unto their children, and children to their parents, kinsmen to kinsmen, the very laws of nature declares, the which Christian charity is so far off from letting loose, that contrariwise it draws them more and harder together: Yea, and for servants to forsake their masters, or masters to look slenderly to their servants being sick (which comes too often to pass), who have made use of their service when they were well, is cruelty. Yet is not the bond of all these friendships alike or equal, and therefore that which is not so near must give place to the nearer, forasmuch as many cannot be discharged at once.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (London, 1665), p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<main class="wrap"><figure class="quote" id="q-14036e0edb" data-kw="">
<blockquote><p>You will have many factious zealots to please, who being strangers to the love of holiness, Christianity, and unity, are ruled by the interest of an opinion or sect: and these will never be pleased by you, unless you will be one of their side or party, and conform yourself to their opinions. If you be not against them, but set yourselves to reconcile and end the differences in the church, they will hate you as not promoting their opinions, but weakening them by some abhorred syncretisms. As in civil, so in ecclesiastical wars, the firebrands cannot endure the peaceable: if you will be neuters, you shall be used as enemies. If you be never so much for Christ, and holiness, and common truth, all is nothing, unless you be also for them, and their conceits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works, vol. 1</cite>, p. 187</span></figcaption>

<blockquote><p>Here it is particularly to be observed that this [Church] discipline exercises such a degree of severity as is always connected with a spirit of kindness… it can easily be judged thence how far to proceed and where severity ought to cease… otherwise rigor exceeds the proper bound. Hence the immoderate austerity of the ancients cannot be approved, which was both contrary to the prescription of God and was exposed to great dangers… Therefore that spiritual sword is not to be unsheathed for a trivial cause (as is the case everywhere among the Anabaptists), but all things are to be first tried and only by degrees ought we to resort to extreme measures…</p></blockquote>

</figure><figure class="quote" id="q-c96b30e0f7" data-kw="">
<blockquote><p>The truth of history, however, requires that we should state here some of the steps taken by that party of the Presbyterians usually called Society People or Cameronians. [In 1680] One Henry Hall of Haughhead, in Teviotdale, a gentleman who was intimate with Mr. [Donald] Cargill, and had suffered great persecution, was apprehended at Queensferry with a paper in his possession disowning the government, and containing some very strong and exceptionable sentiments. This paper, it appears, was merely a scroll drawn up by Hall and Cargill, and more like a manifesto for a general rising of the people, than fitted for a suffering and subdued handful. It was never sanctioned by any meeting [of the Cameronians]; but having fallen into the hands of the governors, it was held as indicating the sentiments and designs of all the Presbyterians. The Queensferry Paper, as it was called, was thenceforth quoted and used against all suspected of Presbyterianism. Shortly after this Cameron and Cargill, with some others, having broken off from the rest of the Presbyterian ministers, published [in 1680] a declaration at Sanquhar, differing a little from, but in the same strain with, the Queensferry Paper. The Sanquhar Declaration openly declared war against Charles as a tyrant and usurper. This was followed up by one of the most singular scenes, perhaps, recorded in the history of the times — the Torwood excommunication. In a meeting held at Torwood, in Stirlingshire, in September, 1680, Mr. Cargill, after divine service, pronounced, with all solemnity and formality, the highest sentence of excommunication against King Charles, the Duke of York, the Dukes of Monmouth, Lauderdale, and Rothes, General Dalziel, and the advocate, Sir George Mackenzie; in the name of the Lord Jesus Christ casting them out of the church, and delivering them up unto Satan. These proceedings, we may well believe, irritated the ruling powers more than ever; and though unshared in and unapproved of by the rest of the Presbyterian ministers, they were eagerly laid hold of as pretexts for still greater severities against the whole of them. The furnace was “heated one seven times more than it was wont to be heated.” Into the history of the persecutions which followed we cannot minutely enter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875)</cite>, p. 347</span></figcaption>

thes%2C+General+Dalziel%2C+and+the+advocate%2C+Sir+George+Mackenzie%3B+in+the+name+of+the+Lord+Jesus+Christ+casting+them+out+of+the+church%2C+and+delivering+them+up+unto+Satan.+These+proceedings%2C+we+may+well+believe%2C+irritated+the+ruling+powers+more+than+ever%3B+and+though+unshared+in+and+unapproved+of+by+the+rest+of+the+Presbyterian+ministers%2C+they+were+eagerly+laid+hold+of+as+pretexts+for+still+greater+severities+against+the+whole+of+them.+The+furnace+was+%E2%80%9Cheated+one+seven+times+more+than+it+was+wont+to+be+heated.%E2%80%9D+Into+the+history+of+the+persecutions+which+followed+we+cannot+minutely+enter.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Jr.%2C+The+Story+of+the+Scottish+Church%3A+from+the+Reformation+to+the+Disruption+%28London%3A+Blackie+%26+Son%2C+1875%29%2C+p.+347&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc96b30e0f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c96b30e0f7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=The%20truth%20of%20history%2C%20however%2C%20requires,which%20followed%20we%20cannot%20minutely%20enter&amp;text=The%20truth%20of%20history%2C%20however%2C%20requires%20that%20we&amp;text=the%20persecutions%20which%20followed%20we%20cannot%20minutely%20enter" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

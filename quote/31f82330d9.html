<main class="wrap"><figure class="quote" id="q-31f82330d9" data-kw="">
<blockquote><p>Only it appeared to me to be requisite to show in passing, that this book makes known to us this privilege, which is desirable above all others — that not only is there opened up to us familiar access to God, but also that we have permission and freedom granted us to lay open before him our infirmities which we would be ashamed to confess before men. Besides there is also here prescribed to us an infallible rule for directing us with respect to the right manner offering to God the sacrifice of praise, which he declares to be most precious in his sight, and of the sweetest odour. There is no other book in which there is to be found more express and magnificent commendations, both of the unparalleled liberality of God towards his Church, and of all his works; there is no other book in which there is recorded so many deliverances nor one in which the evidences and experiences of the fatherly providence and solicitude which God exercises towards us are celebrated with such splendor of diction, and yet with the strictest adherence to truth, in short, there is no other book in which we are more perfectly taught the right manner of praising God, or in which we are more powerfully stirred up to the performance of this religious exercise. Moreover although The Psalms are replete with all the precepts which serve to frame our life to every part of holiness, piety, and righteousness, yet they will principally teach and train us to bear the cross; and the bearing of the cross is a genuine proof our obedience, since by doing this, we renounce the guidance of our own affections and submit ourselves entirely to God, leaving him to govern us, and to dispose of our life according to his will, so that the afflictions which are the bitterest and most severe to our nature, become sweet to us, because they proceed from him. In one word, not only will we here find general commendations of the goodness of God, which may teach men to repose themselves in him alone, and to seek all their happiness solely in him; and which are intended to teach true believers with their whole hearts confidently to look to him for help in all their necessities; but we will also find that the free remission of sins, which alone reconciles God towards us and procures for us settled peace with him, is so set forth and magnified, as that here there is nothing wanting which relates to the knowledge of eternal salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ’s Preface to the Commentary on the Psalms (HT: Matt Crutchmer)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-629728bd23" data-kw="">
<blockquote><p>By psalms are meant the Psalms of David, and others that compose the book that goes with that name; and by hymns we are to understand, not such as are made by good men, without the inspiration of the Spirit of God; since they are placed between psalms and spiritual songs, made by men inspired by the Holy Ghost… but these are only another name for the book of Psalms, the running title of which may as well be the book of Hymns, as it is rendered by Ainsworth… and by ‘spiritual songs’ are meant the same Psalms of David, Asaph, etc. and the titles of many of them are songs… These three words answer to Mizmorim, Tehillim, and Shirim, the several titles of David’s Psalms…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 5:19.Gill (1697-1771) was an English particular Baptist.</span></figcaption>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-fd15ac487b" data-kw="">
<blockquote><p>…the venerable councils of the fathers [referring to Laodicea (365) and Braga (563) above] decree that vulgar psalms should not at all be sung in the Church and that ‘nothing put together in poetic fashion’ should be employed in the divine praises. … …so that to avoid growths and errors of that kind they [‘God-fearing ones‘] cling more vigorously and more carefully to divine authority and statutes of the church. This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles; his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices. It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offense and hesitation. Let us apply ourselves wholly to divine words in which there is no error, no ambiguity.. … There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agobard-of-lyons.html">Agobard of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Divine Psalmody c. 836 10 paragraphs</span></figcaption>

<blockquote><p>And the best recreation to a spiritual mind, when it is weary of worldly employments, is to walk into Christ’s garden, and there, by reading and meditating, singing of Psalms (Col. 3:16) and holy conference, you may solace yourself with the sweet comforts of the holy Spirit, and may work your heart to joy in God, even to joy in the holy Ghost, and to a delight in the Commandments and Word of God.</p></blockquote>

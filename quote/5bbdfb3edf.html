<main class="wrap"><figure class="quote" id="q-5bbdfb3edf" data-kw="">
<blockquote><p>They destroy the Moral Law which was delivered by Moses, by saying that is imperfect. Christ came to fulfil (that is, say they) to make the Law perfect; and they overthrow the Gospel, by saying that we are justified by the works of the Law, and by their confounding of the Law of Faith, and the Law of works; they say as the Jews say, that the great work of the Messiah is to proclaim and confirm the Law, only they add that it was his intent, legem Mosaicam ceu minus perfectam perficere &amp; locupletare, and therefore they say, Christ and his Apostles did so often press obedience to the Law, to shew that we are to be justified by the works of the Law: and hence it is that they call our blessed Saviour, Mosen Mosissimum, as if Christ had not preached the Gospel, the Law of Faith, as the Apostle calls it, Rom. 3. 27. And by this means the Law of Justification by faith alone without the works of the Law, which is the scope of the Gospel, is quite overthrown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, growth, and danger of Socinianism together with a plain discovery of a desperate design of corrupting the Protestant religion, whereby it appears that the religion which hath been so violently contended for (by the Archbishop of Canterbury and his adherents) is not the true pure Protestant</cite>, (London: Samuel Gellibrand, 1643), p. 25.</span></figcaption>

</figure><figure class="quote" id="q-b7433537d5" data-kw="">
<blockquote><p>Since the moral law is the rule of life and conduct, which law is comprised in the decalogue, or ten commandments, it will be necessary to give an exposition of it. But first we must make a few preliminary observations. This law is divided into two tables, one of which contains the sum of the obedience we owe to God, the other of that which we owe to man; it is also divided into ten commandments, of which the first four relate to the first, the last six to the second table.

Again, there are certain rules for explaining the decalogue. The first rule is, that the negative are included in the affirmative, and the affirmative in the negative precepts, for what is good cannot be performed, without the opposite evil being avoided, nor the forbidden evil be avoided, without the opposite good being performed.

The second rule is, that under one species, which is expressed, all the species of the same genus are comprehended; and where one fault is prohibited, all others of the same kind, and analogous to it, together with every thing that tends or leads to it are also prohibited.

The third rule is, that the cause is included in the effect, the species in the genus, the correlative in the relative.

The fourth rule is that the law regulates not only the outward actions. but also the inward thoughts of the mind. “For the law is spiritual,” as St. Paul says; (Rom. vii. 14,) nor is the case the same with the heavenly Lawgiver, who searcheth the reins and the heart, as with an earthly lawgiver, who only takes cognizance of that which meets the senses.

The fifth rule is, that love is the sum and end of all the commandments.

The sixth rule is, that the affirmative precepts are not always binding, but admit of various interpretations and modifications according to time and place; for instance, a son is not always bound to obey his father; but the negative precepts are always binding, at all times, and in all places, without any regard to circumstances.

Moreover, there are certain rules of the obedience which is due to the law—it must be sincere, universal, perfect, and persevering. It must be performed by the whole man—the love of our neighbour must be subject to the love of God—and we must pay greater obedience to the moral precepts of the second table, than to the ceremonial precepts of the first, because God will have mercy, and not sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 8.8, pp 389-90.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-6c6c4f289d" data-kw="">
<blockquote><p>It is asked, eighth, whether the covenant of grace was promulgated in the Decalogue. The famous Cameron, because he did not distinguish carefully enough between the use of the Decalogue and its nature, stated that the Decalogue was neither the covenant of works nor the covenant of grace, but a certain subservient covenant, insofar as like a pedagogue, it drove the elect to seek Christ (Gal. 3:24; Rom. 10:4–5). The celebrated Cocceius with his followers, since he stated that by its violation the covenant of works was plainly abolished, nor did anything remain except the eternal and universal testament of grace until the Israelites’ making of the calf, after which the Decalogue, with the adding of the twofold formula, “Do this and you will live,” and “Cursed be the one who will not remain in all things which are written in the book of the law,” accepted not indeed the essence of the covenant of works, but yet the appearance of it, stated that the Decalogue is the pure, unadulterated covenant of grace. On the contrary, the rest of the Reformed state that in the Decalogue there is no promulgation of the covenant of grace, but only the renewal of the covenant of works, although that renewal, at least in relation to the elect, had an evangelical use, that it would drive them to embrace Christ. This is so because: (1) the Decalogue has nothing of Christ, nothing of faith in Christ. (2) Even if it did set forth Christ and faith in Christ, which yet we do not grant, yet it still has in addition all moral good works; accordingly we would not be justified by faith alone, because without any doubt we are justified by the observance of the covenant of grace. (3) The Decalogue has all those things (with only the positive commandment excepted, concerning not eating the forbidden fruit) which God stipulated from our first parents in the covenant of works. (4) It is also sanctioned with threats and promises, in the same way as the covenant of works. Therefore nothing prohibits saying that it properly presents the covenant of works again, although in relation to the elect, for an evangelical end and use. Nor is it any hindrance that in it mention is made of that formula which pertains to the covenant of grace, “I am your God,” because entirely nothing is repugnant to urging obedience to the covenant of works by arguments and motives taken from the benefits of the covenant of grace. But we will set aside this argument for its proper place, concerning the dispensation of the covenant of grace under Moses (bk. 8, ch. 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, vol. 4, trans. Todd Rester (Reformation Heritage Books, 2023), 45–46.</span></figcaption>

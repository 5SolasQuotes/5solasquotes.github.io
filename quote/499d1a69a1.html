<main class="wrap"><figure class="quote" id="q-499d1a69a1" data-kw="">
<blockquote><p>Those that endeavor to perform sincere obedience to all the commands of Christ, as the condition by which they are to procure for themselves a right and title to salvation, and a good ground to trust on Him for the same, do seek their salvation by the works of the law, and not by the faith of Christ, as He is revealed in the gospel and they shall never be able to perform sincere and true holy obedience by all such endeavors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (Zondervan Publishing House, 1954), 64.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— Walter Marshall, The Gospel Mystery of Sanctification (Zondervan Publishing House, 1954), 64. (HT: Nate Price)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+that+endeavor+to+perform+sincere+obedience+to+all+the+commands+of+Christ%2C+as+the+condition+by+which+they+are+to+procure+for+themselves+a+right+and+title+to+salvation%2C+and+a+good+ground+to+trust+on+Him+for+the+same%2C+do+seek+their+salvation+by+the+works+of+the+law%2C+and+not+by+the+faith+of+Christ%2C+as+He+is+revealed+in+the+gospel+and+they+shall+never+be+able+to+perform+sincere+and+true+holy+obedience+by+all+such+endeavors.%E2%80%9D%0A%0A%E2%80%94+Walter+Marshall%2C+The+Gospel+Mystery+of+Sanctification+%28Zondervan+Publishing+House%2C+1954%29%2C+64.+%28HT%3A+Nate+Price%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F499d1a69a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/499d1a69a1.html">Permalink</a><a class="src" href="https://heidelblog.net/2026/04/marshall-on-seeking-to-obey-as-the-condition-of-the-right-and-title-of-salvation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af730605b1" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… and as the cause which is called a sine qua non [without which: none]… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes</cite>, (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on, p. 670</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… and as the cause which is called a sine qua non [without which: none]… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.”

— Jerome Zanchi, ‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on, p. 670">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+absolutely+deny%2C+that+good+works+are+a+cause+of+salvation%2C+viz.%2C+an+instrumental+rather+than+an+efficient+one%E2%80%A6+and+as+the+cause+which+is+called+a+sine+qua+non+%5Bwithout+which%3A+none%5D%E2%80%A6+Good+works+are+an+instrumental+cause+of+the+possession+of+life+eternal%2C+for+by+these+as+by+media+and+by+the+legitimate+path+God+leads+us+into+the+possession+of+eternal+life%E2%80%A6+The+same+truly+are+rightly+able+to+be+said+to+be+an+instrumental+cause+of+eternal+life%2C+insofar+as+God+leads+us+by+them+into+eternal+life.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+%E2%80%98Whether+Good+Works+are+the+Cause+of+Eternal+Salvation%3F%E2%80%99+in+Of+the+Nature+of+God%2C+or+of+the+Divine+Attributes+%28Neustadt%2C+1593%29%2C+Book+5%2C+ch.+2%2C+after+Of+Predestination+in+General%2C+Question+6%2C+Other+Part%2C+Of+the+Predestination+of+the+Saints%2C+Question+3%2C+after+the+Thesis%2C+pp.+670-71%2C+begins+bottom+of+left+column+on%2C+p.+670&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf730605b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af730605b1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20do%20not%20absolutely%20deny%2C%20that,us%20by%20them%20into%20eternal%20life&amp;text=We%20do%20not%20absolutely%20deny%2C%20that%20good%20works&amp;text=God%20leads%20us%20by%20them%20into%20eternal%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c72b842e65" data-kw="">
<blockquote><p>For justification is withdrawn from works, not that no good works may be done, or that what is done may be denied to be good, but that we may not rely upon them, glory in them, or ascribe salvation to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.1.</span></figcaption>

</figure><figure class="quote" id="q-e9dd2533d6" data-kw="">
<blockquote><p>2. In that place, Mt. 25, it is showed to whom, not for what the reward shall be given: good works are required as a condition in those which are to be saved, not as a meritorious cause of their salvation: [David] Pareus: for in the same place our Savior shows the original and fountain of their salvation, ‘Come ye blessed of my Father, inherit the kingdom prepared for you, from the foundations of the world’: their salvation then depends upon the free and gracious election of God, not upon their works. [Anthony] Faius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Six-fold Commentary upon Romans</cite>, (Cambridge: Legge, 1611), on Rom. 2, 5. Controversies, 3rd Controversy, p. 134</span></figcaption>

</figure><figure class="quote" id="q-6f6fc665e9" data-kw="">
<blockquote><p>The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0ea1859a5e" data-kw="">
<blockquote><p>9. Yet in cases of necessity God has given great liberty unto us, to do many things for the preservation and comforts not only of the beasts and dumb creatures, but especially of man. Not only when he is weak and sick, but being healthful and strong, both in the works of our callings, and also of recreations, without which necessity we are persuaded that men ought ordinarily to cease from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbathum Veteris et Novi Testamenti, or The True Doctrine of the Sabbath</cite>, (Naphtali Press &amp; Reformation Heritage Books, 2015) | Author’s Preface, pp. 8–9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cee810d883" data-kw="">
<blockquote><p>As for the refreshing of our spirits and quickening them, and thereby making us the fitter for God’s service, as in any modest exercise of the body in private according to every man’s particular disposition, to prevent drowsiness and dulness in attending to God’s Word, in praying in singing of psalms, I know none that takes any exception against it.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-71341c3740" data-kw="">
<blockquote><p>Lastly, if it were granted that Ambrose did entreat Count Arbogastes at a feast, whether will any believe it, who considers the austere life of Ambrose, chastising his body with that discipline (as Paulinus, ibidem) that he observed a daily fast, that he would distain himself with feasts on the Lord’s day which hindred the exercises of religion, either public or private? Nay, truly, He might perhaps dine on the Lord’s day, as the custom of the Church required: but we must not believe that the grave father did fare so daintily on that day as that he could not attend the duties of piety: concerning which nature of feasts we are here speaking: in which number that is to [be] reckoned, which Baronius mentions out of Gregor. Turonens, who tells us of a certain presbyter, invading the Bishopric of Avergue, after the death of Sidonius Apollinaris, who, when the Lord’s day came, having prepared a banquet, commanded that all the citizens should be invited into the Church: a wickedness indeed beseeming the author, that he who had ambitiously invaded the Bishops’ See, against the Canons of the Church, should violate the Lord’s solemnity by his feast, that hindered the duties of divine worship: which unlawful example, I hope nobody that relishes anything of Christ will follow. And now I will conclude with St. Austin [Augustine] (Epistle 86), that none can rightly deny that a Christian may on the Lord’s day be refreshed with a moderate and sober dinner, and also will affirm with that grave father, that those who fear God must not riot on the Lord’s Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-young.html">Thomas Young</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s-Day, or a Succinct Narration compiled out of the Testimonies of Holy Scripture &amp; the Reverend Ancient Fathers</cite>, … (London: Leach, 1672), bk. 1, ch. 13, pp. 227-28 Young was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-51aa640d50" data-kw="">
<blockquote><p>56. Doubt: How should I know when to begin and conclude the Lord’s day? Resolution: It it a great question among divines: For mine own part (with submission) I think it begins at the dawning of the day, when Christ arose: I know it is said (Gen. 1) ‘The evening and the morning’ and not ‘The morning and the evening;’ nor dare I say it is an Histero proteron, for the often inculcating of it seems to point at some mystery: But this I say, that though it be granted that the natural day and particularly the Sabbath, containing four and twenty hours, had its revolution from evening to evening, yet nothing hinders why the Christian Sabbath may not be from morning to morning; for seeing the Lord’s Day is kept in memory of Christ’s resurrection, why should it not as well begin at the hour and minute, as be celebrated on the day that he rose from the dead?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-martindale.html">Adam Martindale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divinity-Knots Unloosed</cite>, … (London, 1649), ch. 12, pp. 53-54 Martindale (1623-1686) was an English presbyterian minister who had taken the Solemn League &amp; Covenant.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bf78098637" data-kw="">
<blockquote><p>To conclude, three sorts of works may lawfully be done on the Sabbath day: 1. Works of piety, which either directly concern the service of God, though they be performed by bodily labor: as under the Law, the priests did labour in killing and dressing the sacrifices, and burning them on the altar. And Christians under the Gospel, when they travail far to the places of God’s Worship: it is but a Sabbath day’s journey, like to that of the Shunamite (2 Kings 4:22), who travailed from home to hear the prophet on the Sabbath day, because she had no teaching near her own dwelling. And the preacher, though he labors in the sweat of his brows, to the wearying of his body, yet he does but a Sabbath day’s work. For the holy end sanctifies the work, as the temple did the gold, or the altar the gift thereon. Or else such bodily labor whereby the people of God are assembled to his worship, as the sounding of trumpets under the Law, or the ringing of bells under the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety 3rd</cite>, … (London: Hodgets, 1613), ‘Now of the third sort of duties after the holy Assembly,’, pp. 609-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

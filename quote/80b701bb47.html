<main class="wrap"><figure class="quote" id="q-80b701bb47" data-kw="">
<blockquote><p>In the [Scottish] Book of Common Order [‘The Order of Baptism’]… it is said that the sacraments are not ordained of God to be used in private corners, as charmers and sorcerers use[d] to do, but left to the congregation, and necessarily annexed to God’s Word as seals of the same. In the [general] assembly holden at Edinburgh… [Oct. 17,] 1581 [session 3], it was ordained that the sacraments be not ministered in private houses, but solemnly, according to the good order hitherto observed. But in the late pretended assembly holden at Perth, anno 1618, it was ordained [in its Acts] that the minister shall not refuse to baptize infants in private houses when great need compels the parents to crave it, but the great need is not specified, and therefore left to the judgement of every corrupt minister who shall be willing to pleasure his parishoner upon pretence of any alleged necessity, as a rainy day, or the saving of some charges [expenses], as a dinner, etc. Such like the minister must not refuse to administrate the communion in a private house beside him… It is required only that there be three or four of good religion and conversation present to communicate with him. But, which shakes all loose, these must be free of all impediments. What if they be not free? What suppose there were forty, let be four, if it be not celebrated in the congregation, it is but a private communion. … 2. …Because we cannot attain to a visible communion in the holy things of God immediately with the whole Church-militant, we enjoy it mediately by our communion in a particular congregation… … He [Dr. Lindsay] wrests also that place in Matthew [ch. 18], where Christ promised to be in the midst of two or three convened in his name, as if three or four convened to the administration of baptism or the Lord’s Supper, were a sufficient number to make up a lawful assembly… Christ speaks not there, as Master [Thomas] Cartwright has already answered, of the public administering of the Word and sacraments, but of the proceeding in the Church discipline. … It is a sinew of public assemblies, a hedge of our profession, a band of love and representation of our communion and fellowship, which is and ought to be among the members of the congregation. It is not a part, or two, or three, but the whole body of the congregation which is compared to one bread, when the apostle says, ‘We that are many are one bread, and one body, for we are partakers afore bread,’ 1 Cor. 10:17. Because it is not possible to us to celebrate a sacramental union with the whole Church militant, the Lord has appointed us to keep a sacramentall communion with some particular congregation or visible Church. … A company convened apart from the rest to communicate with the sick person is not united by themselves into the body of a Church, far less three of four, as take, the English [Anglican] service book means to be a number sufficient, seeing they allow the communion to be ministred to three or four in the Church, and in the time of plague, sweat, or such other like contagious sicknesses, the minister may communicate with the person diseased alone… says Bullinger (Decade 5, sermon 9). That is, ‘Seeing it is not a public or general meeting, when three or four communicate with the sick, they say nothing to purpose who say, that the supper may be celebrated beside the sick, if others also communicate.’ … The elements were sent to the absents in time, or immediately after the action in Justin Martyr’s time. Which was the first abuse we read of. After followed reservation of the eucharist for the use of the sick, which was a greater abuse, and carrying of it home to their houses. The opinion of the necessity of private communions did grow to such a height…</p></blockquote>

<blockquote><p>10. On the 6th Article of the 11th Chapter [of The Discipline of the Reformed Chuches of France, 1559], a question was propounded by the Province of Higher Languedoc, Whether in case of grievous sickness, and the child being in apparent danger of death, he might be baptized on lecture-days, before sermon began, and whether baptism might be administred at such times when as there is no sermon preached, but only public common-prayers? It was answered that if the consistory, or any of the elders did attest the malady of the infant, the pastor might do it [the baptism]. And if the observation of this article should beget new difficulties, the provinces were intreated to come prepared unto the next national synod, for their assoiling of them.</p></blockquote>

<blockquote><p>Neither can ye also of this matter, or of any my words gather that any part that remains after the receiving of the sacrament should be worshipped. For whatsoever strength the outward signs in the sacraments have, they have it of the Holy Ghost, of the Lord’s words, and of his institution and ordinance. Which things do no longer remain than while the use and receiving of the sacrament does continue. And the promise of God is applied to this sacrament whiles we eat and drink the sacrament. Wherefore that opinion and doctrine of reserving the sacrament was not catholic, nor universally used or received in the Christian congregations… We do not deny but that the leavings of the sacrament were sometimes reserved and kept: but it was done without any worshipping of it, and without any superstitious points of reverence. The leavings of this sacrament were delivered to children and to women to be carried to sick folk, as it is plain in the history of Eusebius and in Jerome, one of the doctors of the Church. And I would somewhat stagger to say the receiving of such leavings being done privately out of the holy company, and without the order and manner of receiving the communion instituted of Christ, was a right, a full and a perfect receiving of the communion or of the sacrament, which receiving of the sacrament among the sick folks I could yet nevertheless grant unto, so that the same do repeat the holy words of Christ and so ye some honest Christians do there among themselves put in use the ordinance of Christ in this behalf. For except more persons than one alone do receive the communion together: the due order and course of receiving this sacrament is not observed and kept. Christ’s words were to more than one, in this sort: Accipe, edite et bibite: that is to say, ‘Take ye, eat ye, and drink ye.’ There is bread broken into sundry pieces, which thing means that it should be dealed about and distributed to more than one. And they speak many things in their canon of the old mass, which unless a number do receive it together, are stark false and very lies. And besides this, it is called of learned men, coena, a supper, communio, a communion, and synaxis, a gathering or coming together: which names do nothing agree with a private action or doing of one person alone by himself. Neither do we in any place read in old writers of any private masses where one alone might receive the sacrament without the company of others. Honorius, bishop of Rome, was the first that made a decree that the sacrament of eucharistia should be reserved and kept and decreed further, that honor and reverence should be done to it, when it was carried abroad any whither. That if this thing had been done of others before his days, it had not belonged unto him to make a decree of any such thing. And to speak in a brief sum, we affirm and hold (as we have before said) that this sacrament has not his full strength and virtue and efficacy but whiles it is in doing and in executing, and whiles it is in receiving: which thing you see also to be done in all the other sacraments [such as the brazen serpent].</p></blockquote>

— Peter Martyr Vermigli, A Discourse or Treatise… concerning the Sacrament of the Lord’s Supper (London, 1550), p. lxxi">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+can+ye+also+of+this+matter%2C+or+of+any+my+words+gather+that+any+part+that+remains+after+the+receiving+of+the+sacrament+should+be+worshipped.+For+whatsoever+strength+the+outward+signs+in+the+sacraments+have%2C+they+have+it+of+the+Holy+Ghost%2C+of+the+Lord%E2%80%99s+words%2C+and+of+his+institution+and+ordinance.+Which+things+do+no+longer+remain+than+while+the+use+and+receiving+of+the+sacrament+does+continue.+And+the+promise+of+God+is+applied+to+this+sacrament+whiles+we+eat+and+drink+the+sacrament.+Wherefore+that+opinion+and+doctrine+of+reserving+the+sacrament+was+not+catholic%2C+nor+universally+used+or+received+in+the+Christian+congregations%E2%80%A6+We+do+not+deny+but+that+the+leavings+of+the+sacrament+were+sometimes+reserved+and+kept%3A+but+it+was+done+without+any+worshipping+of+it%2C+and+without+any+superstitious+points+of+reverence.+The+leavings+of+this+sacrament+were+delivered+to+children+and+to+women+to+be+carried+to+sick+folk%2C+as+it+is+plain+in+the+history+of+Eusebius+and+in+Jerome%2C+one+of+the+doctors+of+the+Church.+And+I+would+somewhat+stagger+to+say+the+receiving+of+such+leavings+being+done+privately+out+of+the+holy+company%2C+and+without+the+order+and+manner+of+receiving+the+communion+instituted+of+Christ%2C+was+a+right%2C+a+full+and+a+perfect+receiving+of+the+communion+or+of+the+sacrament%2C+which+receiving+of+the+sacrament+among+the+sick+folks+I+could+yet+nevertheless+grant+unto%2C+so+that+the+same+do+repeat+the+holy+words+of+Christ+and+so+ye+some+honest+Christians+do+there+among+themselves+put+in+use+the+ordinance+of+Christ+in+this+behalf.+For+except+more+persons+than+one+alone+do+receive+the+communion+together%3A+the+due+order+and+course+of+receiving+this+sacrament+is+not+observed+and+kept.+Christ%E2%80%99s+words+were+to+more+than+one%2C+in+this+sort%3A+Accipe%2C+edite+et+bibite%3A+that+is+to+say%2C+%E2%80%98Take+ye%2C+eat+ye%2C+and+drink+ye.%E2%80%99+There+is+bread+broken+into+sundry+pieces%2C+which+thing+means+that+it+should+be+dealed+about+and+distributed+to+more+than+one.+And+they+speak+many+things+in+their+canon+of+the+old+mass%2C+which+unless+a+number+do+receive+it+together%2C+are+stark+false+and+very+lies.+And+besides+this%2C+it+is+called+of+learned+men%2C+coena%2C+a+supper%2C+communio%2C+a+communion%2C+and+synaxis%2C+a+gathering+or+coming+together%3A+which+names+do+nothing+agree+with+a+private+action+or+doing+of+one+person+alone+by+himself.+Neither+do+we+in+any+place+read+in+old+writers+of+any+private+masses+where+one+alone+might+receive+the+sacrament+without+the+company+of+others.+Honorius%2C+bishop+of+Rome%2C+was+the+first+that+made+a+decree+that+the+sacrament+of+eucharistia+should+be+reserved+and+kept+and+decreed+further%2C+that+honor+and+reverence+should+be+done+to+it%2C+when+it+was+carried+abroad+any+whither.+That+if+this+thing+had+been+done+of+others+before+his+days%2C+it+had+not+belonged+unto+him+to+make+a+decree+of+any+such+thing.+And+to+speak+in+a+brief+sum%2C+we+affirm+and+hold+%28as+we+have+before+said%29+that+this+sacrament+has+not+his+full+strength+and+virtue+and+efficacy+but+whiles+it+is+in+doing+and+in+executing%2C+and+whiles+it+is+in+receiving%3A+which+thing+you+see+also+to+be+done+in+all+the+other+sacraments+%5Bsuch+as+the+brazen+serpent%5D.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Discourse+or+Treatise%E2%80%A6+concerning+the+Sacrament+of+the+Lord%E2%80%99s+Supper+%28London%2C+1550%29%2C+p.+lxxi&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae377637cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae377637cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Neither%20can%20ye%20also%20of%20this,sacraments%20%5Bsuch%20as%20the%20brazen%20serpent&amp;text=Neither%20can%20ye%20also%20of%20this%20matter%2C%20or&amp;text=the%20other%20sacraments%20%5Bsuch%20as%20the%20brazen%20serpent" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b72f941944" data-kw="">
<blockquote><p>Lastly, the names given to this sacrament, noting the nature thereof, do afford us a good consideration to strike through the heart of this private mass, being called sometimes the Supper of the Lord, and sometimes a Communion among ourselves. If it be an holy supper and spiritual banquet, why are none bidden and called thereunto? If it be a communion, why does the priest uncharitably swallow all alone? whereby they make it a communion, but without company: a supper, but without guests: meat, but without eating: drink, but without drinking: a table, but without sitting down: a participation, but without any that are partakers: a banquet, but without seeding thereat, the people departing as hungry and thirsty as they came. Wherefore, as no man celebrated the Passover aright, or received profit thereby, but such as did eat the flesh thereof: so can none come to the supper of the Lord as he ought, though he look upon others, except he eat of the bread and drink of the cup, according to the commandment of Christ, the author thereof. And thus much of the sole communions and private masses brought into the church against the example of Christ against the use of the apostles, and against the name and nature of the sacrament itself.</p></blockquote>

<blockquote><p>His second objection is that the Lord’s Supper is not given to the sick at their homes. I wish that they [the Lutherans] had gone before us in this with a purer example. Had they been careful to adapt their practice to the genuine rule of Christ, we would willingly have followed them. But since nothing is less accordant with the doctrine of our heavenly Master than that the bread should be carried about in procession like cakes in a fair, and then that one individual should receive in private and eat apart, disregarding the law of communicating, pious and learned men were from the very first much averse to private dispensations of the Supper. Nothing, therefore, can be more absurd than Westphal’s calumny, that owing to the crafty counsel of Satan, poor souls are deprived of consolation. For we [the Genevan Church] carefully recall to the remembrance of the sick the pledge of life which was once deposited with us, that they may thence confirm their faith, and borrow weapons for the spiritual combat. In short, we herein profit so far that the Supper received in the public assembly, according to the ordinance of Christ, supports them with present consolation not less effectually than if they were to enjoy it privately without communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, Second Defense of the… Sacraments, in Answer to the Calumnies of Joachim Westphal (1556) in Tracts, containing Treatises on the Sacraments… vol. 2 tr. Henry Beveridge (Edinburgh: Calvin Translation Society, 1849), pp. 320-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

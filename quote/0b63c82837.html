<main class="wrap"><figure class="quote" id="q-0b63c82837" data-kw="">
<blockquote><p>First, the word [justificare] does imply an accounting just: And this is acknowledged by the Papists themselves as more frequent though they plead much for such a sense as to make just. Now the truth is there needs not much quarrel even about that signification, though the Scripture does not manifest it: For we confess that he is made just, who is justified, and that not only in respect of the inward renovation of a man, but also in respect of justification; for God does not account him just who is not so, and certainly to esteem a man just without righteousness, is as absurd as to account a man learned without learning, or the wall white without whiteness; only we say this righteousness that does to make a man just, is not inherent in him, but reckoned to him by the satisfaction of another: for a man is accounted righteous two ways, either when he is not guilty of the crime charged upon him, or when he does make satisfaction; and in this latter sense by Christ we become righteous. 2. So that if the word should signify as much as to make righteous, as to sanctify does signify to make holy, still we could grant it, though not in the Popish way; and indeed the apostle, Rom. 5, says many are made righteous by the second Adam, which if not meant of inherent holiness, does imply that the righteousness we have by Christ is not merely declarative, but also constitutive; and indeed one is in order before the other, for a man must be righteous before he can be pronounced or declared so to be. But the Hebrew word does not signify this sense primarily; for whereas the Hebrew word in [the tense] qal does signify to be righteous by a positive quality; The word in hiphil, according to that rule in grammar, signifies to attribute and account this righteousness unto a man by some words, or other testimony, even as the word that in qal signifies to be wicked, does in hiphil signify to condemn and judge a man as wicked, so that there are these two things in justifying, whereof one is the ground of the other, first to make righteous, and then to pronounce or declare so. From these two follows a third, which is to deal with a man so justified as a just man, so that condemnation, crimes, reproach and fear shall be taken away from him. This declares the admirable benefit of being justified before God, for when this is done, Rom. 5:1, we have peace with God, Eph. 3, we come with boldness into his presence, and open face; so that unbelief and slavish fears in the godly are great enemies to this grace of justification; yea, they are a reproach and dishonor to it. Thou thinkest if thy heart were not conscious to sin, if nothing but holiness were in thee, thou wouldest be bold, thou wouldst not fear or be troubled, but thou dost not consider that God walks towards thee as a righteous man, looks upon thee as so, so that if Christ be bold thou mayst, if God will not reject Christ, or thy sins cannot condemn Him, so neither will God reject thee, or shall thy sins overwhelm thee; this is the sweet consolation of the Gospel, to a sinner broken-hearted, who would give a world for a perfect righteousness to make him accepted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, ... (London: Miller, 1651), Lecture 1, pp. 6-8</span></figcaption>

<blockquote><p>7. Man may be justified before man, not by man only, but by God also. 8. God also may justify us before man by our formal and inherent righteousness. Thus by sundry means here upon earth He sometimes justifies his children against the sundry calumniations and slanders of wicked men: But more specially He will do it at the Day of Judgment, in the face of the whole world, manifesting not only that righteousness of theirs, which they have in and by Christ; but the inherent innocency, integrity and sincerity of their hearts and ways, so much belied and traduced by the wicked enemies of sanctity and religion.</p></blockquote>

</figure><figure class="quote" id="q-3403251ace" data-kw="">
<blockquote><p>I find ground to assert a twofold justification. First, a general and first-justification (which most places before-mentioned speak of), when a person passes from an unjustified to a justified estate. This is owned by all, and therefore I shall say no more of it. Secondly, a particular, renewed, repeated and after-justification, when any particular act is approved by God and a person is accounted righteous in reference unto that. This kind of justification must needs be understood in that place where this phrase is first used, Gen. 15:6, ‘Abraham believed God, and He counted it to him for righteousness.’ Here it relates to his faith in that particular promise of God, concerning an heir to be born of his own body, and the numerousness of his seed by him, verses 4-5; and so must be meant of God’s approbation of that particular act of faith as a righteous act, or his accounting him righteous in that particular act… ‘Tis but as he [Paul] gathers and infers the general from one particular, that if Abraham were justified by faith and not by such [legal] works, whereof he might glory, then all others are justified so too, he being the father of all that believe, verse 11. i.e. an eminent example or pattern of the justification of believers. I say, it must needs be understood of a particular justification, with reference to that particular act, and not of his first and general justification; for he [Abraham] was a justified person long before that, as appears in that when he was called out of his own country, Gen. 12:1, 3, he obeyed that call, verse 4, and so became the friend of God [Jm. 2:23], who blessed him, [Gen. 12] verses 2-3, and appeared unto him, verse 7, by which, and all the following story, it is evident, that he was a good, righteous and holy man long before those words were spoken of him, ch. 15:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clark.html">Samuel Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture-Justification, or a Discourse of Justification, according to the Evidence of Scripture-Light</cite>, (London: S. Bridge, 1698) | 15. ‘Concerning the Kinds of Justification’, p. 81</span></figcaption>

<blockquote><p>to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.</p></blockquote>

2F5solasquotes.github.io%2Fquote%2Fa6a5faad9a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a6a5faad9a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=to%20dispute%20what%20works%20are%20worth,same%20thing%29%20are%20imputed%20for%20righteousness&amp;text=to%20dispute%20what%20works%20are%20worth%20in%20themselves&amp;text=is%20the%20same%20thing%29%20are%20imputed%20for%20righteousness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e41cf7d0f8" data-kw="">
<blockquote><p>There is no grace, no duty, for the substance of them, nor for the manner of their performance, that are required either by the Law or the gospel, but they [justified persons] are obliged unto them. Where they are omitted, we acknowledge that the guilt of sin is contracted, and that attended with such aggravations, as some will not own or allow to be confessed unto God Himself. Hence in particular the faith and grace of believers, do constantly and deeply exercise themselves in godly sorrow, repentance, humiliation for sin, and confession of it before God, upon their apprehensions of its guilt. And these duties are so far necessary unto the continuation of our justification as that a justified estate cannot consist with the sins and vices that are opposite unto them. So the apostle affirms, that if we live after the flesh, we shall die, Rom. 8:13. He that does not carefully avoid falling into the fire or water, or other things immediately destructive of life natural, cannot live. But these are not the things whereon life does depend. Nor have the best of our duties any other respect unto the continuation of our justification, but only as in them we are preserved from those things which are contrary unto it, and destructive of it. If this be that which is intended in this position, the continuation of our justification depends on our own obedience and good works, or that our own obedience and good works are the condition of the continuation of our justification, namely that God does indispensably require good works and obedience in all that are justified, so that a justified estate is inconsistent with the neglect of them, it is readily granted, and I shall never contend with any about the way whereby they choose to express the conceptions of their minds. … All other works and duties of obedience do accompany faith in the continuation of our justified estate, as necessary effects and fruits of it, but not as causes, means, or conditions whereon that effect is suspended. It is patient waiting by faith that brings in the full accomplishment of the promises, Heb. 6:12, 16.</p></blockquote>

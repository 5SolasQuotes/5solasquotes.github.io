<blockquote><p>It is no difficult Matter, for Church-Members to apprehend and be alarmed by the Military Progress of Satan, and his Host, when they appear under their own Colours: But the Case is quite different, when Satan is transformed into an Angel of Light, and takes the Field with false Christs, Apostles, Prophets, Teachers, Saints, The Professors of Christianity can scarce suspect any Person or Thing, that appears Christian, evangelical, holy and zealous; if they see Sheep’s Clothing, it is difficult to persuade them that a Wolf can be underneath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-gib.html">Adam Gib</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning Against Countenancing the Ministrations of Mr. George Whitefield, Published in the New Church at Bristow, upon Sabbath, June 6. 1742. Together with an Appendix upon the Subject, Wherein are shewn, that Mr. Whitefield is no Minister of Jesus Christ; that his Call and Coming to Scotland are </cite>, (Edinburgh: David Duncan, 1742), iv.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13cf881006" data-kw="">
<blockquote><p>Angels are spiritual substances created by God after his own image, and ordained to sing glory to God on high, and to be ministers upon earth, of the church or of the heirs of everlasting salvation. … By these descriptions and the testimonies cited in the text of the Epistle, seven differences may be gathered.

1 Christ is verily and by nature the son of God, begotten of the substance of the eternal father. Psal. 2. This day have I begotten thee. 2. Reg. 7. I will be a father to him, and he shall be a son to me. The Angels are not verily and by nature the sons of God, but only by adoption or grace. Ergo Christ far excelleth all the Angels.

2 Invocation is an honour to be attributed only to God the searcher of hearts, according to this saying: Thou shalt worship the Lord thy God; and in general, whosoever is worshipped, is better than he that worshippeth: But God commandeth that Christ shall be called upon, yea even of the Angels: Ps. 96. Worship ye him all ye Angels of God. Ergo Christ is both God, and also far more excellent than all the Angels.

3 Christ is the maker of heaven and earth. Psa. 101. Thou O Lord hast founded the earth from the beginning. Angels are substances created, as Psal. 103. is said: which makest thine Angels spirits, and thy ministers a flame of fire, that is to say, clear substances, which in sheerness, force, nimbleness, and swiftness, are like to fire.

4 Christ is an everlasting king, bearing a rightful scepter, and justifying all that flee unto him. Psa. 45. Thy throne O God endureth for ever and ever, the scepter of righteousness is the scepter of thy kingdom. But the Angels are but only the servants of this king, and impart not their righteousness unto any others.

5 Christ is verily and naturally the son of God. Ps. 45. O God (Christ,) thy God (the eternal father,) hath anointed thee with the oil of gladness for thy fellows’ sakes. Now the Angels are not God, but creatures.

6 Christ is anointed with fulness of the holy Ghost, to the intent he may anoint his fellows, that is to say, the rest of the members of the church. The Angels are not anointed with fulness of the holy Ghost, neither can they of their own power anoint others and garnish them with the gifts of the holy Ghost.

7 Christ sitteth at the right hand of the eternal Father, that is to say, reigneth in equal majesty and glory with the everlasting father. The Angels sit not at the right hand of the Father, nor reign in equal power with the eternal father: but are the ministers of Christ and of the whole church, pitching their tents round about all those that fear him …</p></blockquote>

</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

<blockquote><p>Q. 23. Is it lawful, as some plead, to have images or pictures in churches, though not for worship, yet for instruction, and raising the affections? No; because God has expressly prohibited not only the worshipping but the MAKING of any image whatever on a religious account; and the setting them up in churches, cannot but have a natural tendency to beget a sacred veneration for them; and therefore ought to be abstained from, as having at least an “appearance of evil,” Isa. 45:9-18; 1 Thess. 5:22. Q. 24. May they not be placed in churches for beauty and ornament? No; the proper ornament of churches is the sound preaching of the gospel, and the pure dispensation of the sacraments, and other ordinances of divine institution. Q. 25. Were not the images of the cherubims placed in the tabernacle and temple, by the command of God himself? Yes; but out of all hazard of any abuse, being placed in the holy of holies, where none of the people ever came: they were instituted by God Himself, which images are not; and they belonged to the typical and ceremonial worship, which is now quite abolished.</p></blockquote>

<blockquote><p>Q. Have men only benefit by this union of the two natures [of Christ], or doth it reach also to the Angels?

A. It seemeth to reach no further then to man; for God never meant to save those angels that fell, seeing they fell maliciously into rebellion against God, without tentation, contrary to the clear light of nature revealed in their Creation. And if he had purposed either to save them, or to have benefited the elect Angels, any otherwise then by confirming them, he would have taken their nature upon him.

Q. But why then is it said, that God (by Christ) doth reconcile all things unto himself, whether in earth, or heaven? Coloss. 1. 20.

A. By things in heaven, is there to be understood, not the Angels, but the Saints then in heaven. For although God did elect the Angels to eternal glory; yet Christ did not redeem them, but only the seed of Abraham.</p></blockquote>

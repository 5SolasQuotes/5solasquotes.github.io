<main class="wrap"><figure class="quote" id="q-2a5d66172a" data-kw="">
<blockquote><p>The Papists object, (1.) That the church is the supreme and infallible judge; from Deut. xvii. 8–13? Ans. There must be an umpire for the decision of controversies in church and state, for sake of order and peace, for determining rights and punishments; and in the visible church a judge is appointed for such a purpose, not to be a lord of our faith. And of such a judge, the passage in question speaks. This does not take away the right of private judgment, but only the right of persons to claim privileges in the church, against the judgment of others, on their own private judgment. Nor are these courts and judges infallible.

… They object, (2.) That God has granted infallibility and superior authority to the church; Matt. xviii. 17? Ans. (1.) In this passage Christ did not commit to the church infallible authority, nor authority to take away the right of private judgment, as accountable to God; but authority to regulate outward communion. (2.) The church has no promise of guidance infallible, nor any promise of guidance in taking away the right of private judgment, and substituting her own in its place. (3.) The church has the promise of guidance in her proper duty of regulating outward communion.

… They object, (3) Necessity requires that there be some ultimate judge in ecclesiastical things, as well as civil? Ans. (1.) There is a judge appointed by Christ, for the application of law to outward things, and to regulate outward fellowship, as there is in civil things, for outward order; viz., church courts. (2.) But courts are not an infallible judge, either in civil or ecclesiastical matters. (3.) Neither in civil, nor in ecclesiastical matters, does the judge interfere with private judgment, nor assume the responsibility of moral obligation for the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), pp 74-75.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b65e48dc5d" data-kw="">
<blockquote><p>In this matter there is no need of knowing immediately and a priori who has the Spirit, but only who speaks according to the Scriptures. When this becomes known by a reference to the Scriptures, we can readily judge a posteriori who utters the words of the Spirit and speaks from him. Thus the Bereans did not inquire a priori whether Paul who preached to them was moved by the Holy Spirit … but whether Paul spoke according to the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.35</span></figcaption>

</figure><figure class="quote" id="q-063d7aca10" data-kw="">
<blockquote><p>A supreme and infallible judge is indeed one who is never wrong in his decisions, and cannot err, who is not influenced by any interested party, and from whom there can be no appeal. But all these qualities can be attributed neither to the church nor to the councils nor to the pope, for they both can err and often have done so most grievously. … Only God speaking in Scripture lays claim to all these qualities in his own person, for he cannot fall into error, since he is truth itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.10</span></figcaption>

</figure><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>

</figure><figure class="quote" id="q-b1bdca0c90" data-kw="">
<blockquote><p>It is not denied that the people, learned and unlearned, in order to the proper understanding of the Scriptures, should not only compare Scripture with Scripture, and avail themselves of all the means in their power to aid them in their search after the truth, but they should also pay the greatest deference to the faith of the Church. … What Protestants deny on this subject is, that Christ has appointed any officer, or class of officers, in his Church to whose interpretation of the Scriptures the people are bound to submit as of final authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>

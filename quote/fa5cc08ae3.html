<blockquote><p>As one of the Scottish commissioners to the Westminster Assembly, Samuel Rutherford is an important source for understanding the Westminster Confession’s teaching on the civil magistrate and biblical penology. In this quotation, he informs us that the English Protestant divines believed that the penal sanction for adultery was of common equity:

The English Divines do well observe, That adultery is a capital crime to be punished by the Judge, Gen. 38. 24. Lev. 20. 10. Deut. 22. 22.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A free disputation against pretended liberty of conscience</cite>, (London, 1649), p. 313.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>21. ‘Moreover, thou shalt provide out of all the people.’… meaning, thou shalt choose out and take the most worthy, so that such an office be not entrusted rashly to any one that offers. But this was most reasonable, among a free people, that the judges should not be chosen for their wealth or rank, but for their superiority in virtue. Yet although it be right that regard should be chiefly had to virtue, so that if any one of the lower orders be found more suitable than others, he should be preferred to the noble or the rich; still should any one choose to, lay this down as a perpetual and necessary rule, he will be justly accounted contentious.</p></blockquote>

<blockquote><p>Remedy (1). First, Keep at the greatest distance from sin, and from playing with the golden bait which Satan holds forth to catch you; for this you have (Romans xii. 9), “Abhor that which is evil, cleave to that which is good.” When we meet with anything extremely evil and contrary to us, nature abhors it, and retires as far as it can from it. The Greek word that is there rendered “abhor,” is very significant; it signifies to hate it as hell itself, to hate it with horror.

Anselm used to say, “That if he should see the shame of sin on the one hand, and the pains of hell on the other, and must of necessity choose one; he would rather be thrust into hell without sin; than to go into heaven with sin,” so great was his hatred and detestation of sin. It is our wisest and our safest course to stand at the farthest distance from sin; not to go near the house of the harlot—but to fly from all appearance of evil, (Proverbs v. 8, 1 Thess. v. 22).

The best course to prevent falling into the pit is to keep at the greatest distance from it; he who will be so bold as to attempt to dance upon the brink of the pit, may find by woeful experience that it is a righteous thing with God that he should fall into the pit. Joseph keeps at a distance from sin, and from playing with Satan’s golden baits, and stands. David draws near, and plays with the bait, and falls, and swallows bait and hook! David comes near the snare, and is taken in it, to the breaking of his bones, the wounding of his conscience, and the loss of fellowship with his God.

Sin is a plague, yes, the worst and most infectious plague in the world; and yet, ah! how few are there who tremble at it–who keep at a distance from it! (1 Cor. v. 6) — “Know ye not that a little leaven leaveneth the whole lump?” As soon as one sin had seized upon Adam’s heart, all sin entered into his soul and infested it. How has Adam’s one sin spread over all mankind! (Romans v. 12) — “Wherefore by one man sin entered into the world, and death by sin, and so death passed upon all men, for that all have sinned.” Ah, how doth the father’s sin infect the child, the husband’s infect the wife, the master’s the servant! The sin that is in one man’s heart is able to infect a whole world, it is of such a spreading and infectious nature.

The story of the Italian, who first made his enemy deny God, and then stabbed him, and so at once murdered both body and soul, declares the unmixed malignity of sin; and oh! that what has been spoken upon this head may prevail with you, to stand at a distance from sin!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices</cite>, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-dfdd2e9594" data-kw="">
<blockquote><p>It is hard to resist the conclusion that the inspired writers meant to convey the idea that the legislation at Sinai might be resolved into several codes. We believe that there were three, all differing in their predestined term of endurance. The ceremonial law is universally admitted to have fulfilled its function when Christ made his atoning sacrifice. The ordinary civil and criminal code of the Jews required to be adapted, like the corresponding laws in other countries, to the exact state of intellectual and moral development which the Hebrew nation had reached at the time of its promulgation, and necessarily became, in some particulars, antiquated whenever they rose above that position.

It is only in regard to the moral law, as summed up in the decalogue, that any dispute exists. It in several respects stood on a different footing from the remaining parts of the Mosaic law. While the other precepts were given to the people through the instrumentality of Moses, it was proclaimed from the top of Sinai by the voice of Jehovah himself, amid lightning, and thunder, and tempest, and every accompaniment fitted to inspire awe. While the other precepts were committed to whatever materials were then used for writing on, skins of animals perhaps, and were preserved, no one knows where, the decalogue was traced by the finger of God on two tables of stone, cut doubtless from the enduring granite of the mountain peak, and then laid up in the ark of the covenant in the holiest part of the tabernacle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-hunter.html">Robert Hunter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Literature of the Sabbath Question in British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

It is only in regard to the moral law, as summed up in the decalogue, that any dispute exists. It in several respects stood on a different footing from the remaining parts of the Mosaic law. While the other precepts were given to the people through the instrumentality of Moses, it was proclaimed from the top of Sinai by the voice of Jehovah himself, amid lightning, and thunder, and tempest, and every accompaniment fitted to inspire awe. While the other precepts were committed to whatever materials were then used for writing on, skins of animals perhaps, and were preserved, no one knows where, the decalogue was traced by the finger of God on two tables of stone, cut doubtless from the enduring granite of the mountain peak, and then laid up in the ark of the covenant in the holiest part of the tabernacle.”

— Robert Hunter, Literature of the Sabbath Question in British and Foreign Evangelical Review">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+hard+to+resist+the+conclusion+that+the+inspired+writers+meant+to+convey+the+idea+that+the+legislation+at+Sinai+might+be+resolved+into+several+codes.+We+believe+that+there+were+three%2C+all+differing+in+their+predestined+term+of+endurance.+The+ceremonial+law+is+universally+admitted+to+have+fulfilled+its+function+when+Christ+made+his+atoning+sacrifice.+The+ordinary+civil+and+criminal+code+of+the+Jews+required+to+be+adapted%2C+like+the+corresponding+laws+in+other+countries%2C+to+the+exact+state+of+intellectual+and+moral+development+which+the+Hebrew+nation+had+reached+at+the+time+of+its+promulgation%2C+and+necessarily+became%2C+in+some+particulars%2C+antiquated+whenever+they+rose+above+that+position.%0A%0AIt+is+only+in+regard+to+the+moral+law%2C+as+summed+up+in+the+decalogue%2C+that+any+dispute+exists.+It+in+several+respects+stood+on+a+different+footing+from+the+remaining+parts+of+the+Mosaic+law.+While+the+other+precepts+were+given+to+the+people+through+the+instrumentality+of+Moses%2C+it+was+proclaimed+from+the+top+of+Sinai+by+the+voice+of+Jehovah+himself%2C+amid+lightning%2C+and+thunder%2C+and+tempest%2C+and+every+accompaniment+fitted+to+inspire+awe.+While+the+other+precepts+were+committed+to+whatever+materials+were+then+used+for+writing+on%2C+skins+of+animals+perhaps%2C+and+were+preserved%2C+no+one+knows+where%2C+the+decalogue+was+traced+by+the+finger+of+God+on+two+tables+of+stone%2C+cut+doubtless+from+the+enduring+granite+of+the+mountain+peak%2C+and+then+laid+up+in+the+ark+of+the+covenant+in+the+holiest+part+of+the+tabernacle.%E2%80%9D%0A%0A%E2%80%94+Robert+Hunter%2C+Literature+of+the+Sabbath+Question+in+British+and+Foreign+Evangelical+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdfdd2e9594.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href

<main class="wrap"><figure class="quote" id="q-2b43c99223" data-kw="">
<blockquote><p>Again, he [an episcopalian] argues we cannot be said to be members of a particular Church, or to hold communion with it, if we do not join in their worship, as it is established among them. This is easily answered by a plain distinction: unless we join in their established worship, as to the greatest and chief acts of it, conceditur [it is conceded]: as to all the parts of it, even to the least, negatur [I deny]. I may join with a Church in the Word and sacraments; and yet if they have a holy day or two beside the Sabbath, may forbear; yea I may, without this be a member of that Church (if they will suffer me), which all the Reformed Churches do, except the Episcopal Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., p. 257</span></figcaption>

<blockquote><p>That which is lawful for them to do… that is lawful for others to join with them in: for that which is no sin in the principal is none in the accessory, ceteris paribus [other things being equal]. And it cannot be simply unlawful to join in any action that is lawful, quatenus talis [so far as it is such].</p></blockquote>

</figure><figure class="quote" id="q-5623f461a7" data-kw="">
<blockquote><p>It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863), pp. 278-79</span></figcaption>

</figure><figure class="quote" id="q-3a21169bb9" data-kw="">
<blockquote><p>About refraining a moral duty for the evil mixed with it, or in the persons performing it:

1. As we are not to do evil that good may come of it, no more ought we to leave what is morally good undone for the evil that is some way mixed with it. Zeal for good is to be preferred to that which is against evil. The greatest good is better than the greatest evil is bad. Whatever good thing we do tends towards our union with the chiefest Good, the refraining of evil not so immediately.

2. Betwixt things indifferent and what is morally good, you have this difference: If there be any mixture of evil with the one, it becomes wholly evil; there is nothing of good in it to give stop or preponderate; but what is morally good will remain so still, though mixed with evil. We may allay the worth of it, as baser metals mixed with gold, but yet it is gold still, and may be perfectly severed.

3. ‘When I would do good,’ says the apostle, ‘evil is present with me.’ [Rom. 7:21] I cannot hear, or read or pray, and the rest, but with a mixture of sin; yet upon this account I may not cease from or neglect a known duty, not though materially considered the evil accompanying being greater than the good; as in meditation, when blasphemous thoughts arise, etc. To omit a known duty is a sin of wilfulness; the evil from me in it is but infirmity only; The least wilful sin is greater and more provoking than the greatest sin of infirmity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2, pp. 8-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

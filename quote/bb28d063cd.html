<blockquote><p>But these general truths may be added, concerning the Judicial Laws: 1. None can say that none of the Judicial Laws, concerning political constitutions, is to be observed in the New Testament: for then many special rules of natural and necessary equity would be rejected, which are contained in the Judicial Laws of God: Yea all the laws of equity in the world would be so cast; for none can be instanced, which may not be reduced to some of the Judicial Laws: And if any of them are to be observed, certainly these penal statutes so necessary for the preservation of policies, must be binding. … 3. Those Judicial Laws, which had either somewhat typical, or pedagogical, or peculiar to the then Judaical State, are indeed not binding to us under that formality; though even these doctrinally are very useful, in so far as in their general nature, or equity of proportion, they exhibit to us some documents of duty: but those penal judgments, which in the matter of them are appended to the Moral Law, and are in effect but accurate determinations and accommodations of the Law of Nature, which may suit our circumstances as well as the Jews, do oblige us as well as them. And such are these penal statutes I adduce; for, that blasphemy, murder and idolatry, are heinous crimes and that they are to be punished, the Law of Nature dictates; and how, and by whom, in several cases, they are to be punished, the Law judicial determines. Concerning the Moral Equity even of the strictest of them: [William] Ames, Of the Conscience, Book 5, ‘Of the Appended Precepts of Moses’. 4. Those Judicial Laws, which are but Positive in their form, yet if their special internal and proper reason and ground by Moral, which pertains to all nations, which is necessary and useful to mankind, which is rooted in and may be fortified by human reason, and as to the substance of them approven by the more intelligent heathens; those are Moral, and oblige all Christians as well as Jews: and such are these laws of punishing idolaters, etc. founded upon Moral grounds, pertaining to all nations necessary and useful to mankind, rooted in and fortified by human reason, to wit that the wrath of God may be averted, and that all may hear and fear and do no more so wickedly; especially this reason be superadded, when the case is such, that innocent and honest people cannot be preserved, if such wicked persons be not take order with.</p></blockquote>

<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law. 3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty. 4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things. 5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie. 6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one. 7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know: 1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such. 2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause. 3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechizing of Families... (London, 1683), ch. 42, ‘Of the 9th Commandment’</cite>, pp. 361-62</span></figcaption>

<blockquote><p>Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto. 8. What is denied jure to ecumenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecumenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>

ct%2C+Gal.+1%3A8.+%E2%80%9CBut+though+we+or+an+angel+from+heaven%2C+preach+to+you%2C+beside+what+we+have+preached%2C+let+him+be+accursed%2C%E2%80%9D+Gal.+1%3A8.+Therefore%2C+etc.%E2%80%9D%0A%0A%E2%80%94+James+Guthrie%2C+Protesters+no+Subverters%2C+and+presbyterie+no+papacie%3B+or%2C+A+vindication+of+the+protesting+brethren%2C+and+of+the+government+of+the+kirk+of+Scotland+from+the+aspersions+unjustly+cast+upon+them%E2%80%A6+1658%2C+pp.+107-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4481efc4d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c4481efc4d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=Inferior%20Kirk%2Djudicatories%2C%20being%20ordinances%20of%20Jesus,be%20accursed%2C%E2%80%9D%20Gal.%201%3A8.%20Therefore%2C%20etc&amp;text=Inferior%20Kirk%2Djudicatories%2C%20being%20ordinances%20of%20Jesus%20Christ%2C%20have&amp;text=let%20him%20be%20accursed%2C%E2%80%9D%20Gal.%201%3A8.%20Therefore%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-930c01a611" data-kw="">
<blockquote><p>XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist).</p></blockquote>

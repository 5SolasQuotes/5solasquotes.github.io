<blockquote><p>8. Concerning the 17th Proposition (which many will stumble at), I desire you to observe these things:

1. That as we avoid the titles of lay-elders and preaching-elders, so we do purposely avoid the determination of that controversy: Whether Christ has appointed ecclesiastical elders, distinct in office from teaching-elders, having no authority to preach, baptize or administer the Lord’s Supper, though they have gifts? I confess my own private opinion is that neither Scripture nor antiquity did know any such church-officers: But as I so much reverence and value the contrary minded, as not to expect that my judgment should stand in any competition with theirs, or in the least to sway any man to my opinion from theirs (though upon the concurrent judgment of so many learned men that are of the same opinion with me, I might reasonably expect that other men’s reputation should create no prejudice), so it is nothing to my brethren, nor the sense of our Agreement, what my private opinion is. We are not so unconscionably self-conceited or divisive as to think we must or may reject all those from our communion that differ in this point from us: or that it is a matter of so great moment that may hinder our fraternal and peaceable Association.

2. We have therefore agreed of the work of assisting-elders, and leave the discussion of their further authority and distinction of their office from teaching-elders, to others.

3. And that each party may well agree to this Proposition, without forsaking their principles, is beyond doubt. For the presbyterians and the congregational party, they both are for such elders as shall rule and not administer sacraments; and though some of one sort [congregationalists], say they may preach:

1. They say not that they must preach where the teaching-elders are well and present;

2. And perhaps it is because they would allow another gifted member to do the like. And for the episcopal divines, their practice and their writings prove what I say: For they have ever since the Reformation allowed great numbers of readers in England, of far lower abilities than we express in our Propositions; such as never preached, and some that were fain to labour for their livings in secular employments, as this country knows. And though they allowed them to baptise and administer the Lord’s Supper [by delegation], yet they never affirmed that they must do it when there was an abler minister of the same church to do it. And in their writings they do maintain the lawfulness of placing such reading ministers in chapels or parish churches under able pastors. So that it’s past doubt that we are all agreed that there may be such officers, or elders chosen to do the work that is here expressed. And if any think it a matter of so great necessity that we agree in our belief of these elders’ further power, as that we must not associate with those that agree not, I would intreat him to tell me why it is not in our Creed? or why it never was in the Creed of any Church? or whether no Church had ever a sufficient Creed so large as to contain all points of absolute necessity to salvation, or without which, we must avoid men’s society? or whether he dare yet put it in his Creed among fundamentals, or points of such necessity ‘I believe that lay or mere-ruling elders are, or are not Jure divino?’ Or whether he accuse not the Scripture itself of insufficiency for speaking so darkly of fundamentals themselves as that the most godly and learned are not able to understand it? And whether he lay not a ground of separation from multitudes of eminent learning and piety, yea from whole Churches which Christ Himself owns and will not allow us to separate from?

4. And observe further that the elders that we here speak of are only assistants to able preachers: we do not say that such may be allowed of alone where there is no other to preach (though what might be done in case of necessity, I will not determine). But if a great Church have one or two able men to preach publicly, and will moreover appoint some sober, godly, orthodox men to help them in private oversight, instruction, admonition and reproof; and if one call these ‘lay-elders’ or ‘ruling-elders,’ and another take them to be inferior ministers, as some sober chapel readers were, I would not quarrel about the notions or titles while we agree about the work to be done. Nor would I dare to reproach them with the name of dumb dogs on one side, or lay-elders (as dumb) on the other.

5. I thought meet also to tell you thus much of my own opinion; that it seems to me the best way (at our first ordering of our churches according to these Propositions) to take in none but school-masters, physicians, or other learned men to be elders (where such are to be had that are meet), and for those of our abler hearers that are unlearned, that it will be fittest first to try them in the office of deacons: both because the office of deacons is most unquestionable to all sorts and parties; and so it will avoid the reproaches of dissenters: and because the apostles made deacons before they ordained any fixed elders of particular churches; and they made abler men deacons than any of us are; and therefore none may think the office to be below him; and because it is orderly to ascend by degrees: and the apostles’ words, 1 Tim. 4:8-13, together with the constant expressions and practice of antiquity, do show that this is a degree to the eldership… And the danger of misguiding and dividing our congregations by men of weak judgments is so great that I think it much fitter to try them first in an office of known inferiority (for all confess that deacons should be guided by the elders) wherein they may be as serviceable to the Church than to begin them in an office of mere power, wherein they will think their votes to be of equal authority with the most judicious teachers [Baxter did not hold them to be equal], and so may breed contentions or foment errors or factions in the church; and yet be less capable of doing service than the deacons are (See Mr. Noyes, Temple Measured, of the Office of Deacons and Elders). This course therefore I have propounded to my brethren of this Association; and they think as I do… If any shall refuse the office of deacons as too mean for them, they shall thereby discover that pride that will prove them unfit to be either elders or deacons; and you will have cause to thank God that thereby a mischief to the Church is prevented, which might have followed if such unhumbled men had crept into authority.

6. But the great objection against this Proposition will be (by some) that we allow none to be elders but those that are ordained, and so overthrow mere-ruling elders. To which I answer:

1. These brethren must consider that we are forced for unity to speak indistinctly of all that are mere assisting elders and do not actually preach and administer sacraments, whether they take themselves to have authority to do more (as other ministers) or not: Now they will confess that such inferior or assisting ministers must be ordained: and we cannot now [formally] distinguish [them].

2. I never could learn that it is the judgment of presbyterians or congregational men that it is unlawful to ordain mere-ruling elders. And if they may do it, why should they not yield to it for peace, though they think not that they must do it?

3. I confess I know of no elders mentioned in Scripture without ordination and do despair of ever seeing it proved that the apostles did appoint two sorts of elders, one ordained and the other not ordained. The contrary I doubt not to prove by sufficient induction.

4. Deacons must be ordained that are inferior to elders; why then should not elders be ordained?

5. Let our brethren take heed lest they loose all their hold of that show they have in Scripture for mere-ruling elders (I mean quoad potestatem [as to the power], not quoad exercitium ordinarium [as to the ordinary exercise]), if they once disclaim all those as no such ruling elders who were ordained. It seems then that when the apostles ordained elders in every Church, and when Titus was left to ordain elders in every city, it was no mere-ruling elders that they ordained or were appointed to ordain!

6. I confess I am loath (without more reasons than I yet know) to give the intruders of the ministry so much encouragement as to tell them men may ordinarily be ruling elders without ordination? For doubtless a man may much more preach up and down in public occasionally without ordination: I mean, more may be said for it. Even some of the most learned episcopal divines think that by the bishop’s allowance private men may preach, and that it belongs more to the pastor to take care what doctrine is taught his people than that himself be the teacher. And most allow the preaching of probationers. And if you add to this that there is no need of ordination to the office of church-governing, I know partly what will follow.

7. Yet a greater doubt is behind, and that is: How we would have these men ordained? I answer:

1. We have not determined of that: We purposely avoid the point of ordination because the distance between the episcopal divines and others is well known in that point: and we resolve not to put such controverted points into our Agreement, lest thereby we necessarily exclude the dissenters. Our business is not now (as is said) to reconcile differences in judgment: much less to divide from those that differ from us: but to practice unanimously so much as we are agreed in.

2. We leave therefore every man in this to his own judgment. Those that are for bishops may be ordained by them with a presbytery, if they can obtain it. Those that are against them, may be ordained by the Associated pastors of that Association, the president performing the action. Those that fear danger from the law of the land if they ordain without authority, may send men to some neighbor county that has authority. Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had.

3. To avoid some of these contests, if deacons only be first ordained, as I before mentioned, it will prevent the quarrels that some may else be drawn to by difference of judgment. For many moderate episcopal men will allow presbyters to ordain deacons that will not allow them to ordain presbyters. As for those that will say, These are no true officers, nor to be acknowledged (whether deacons or presbyters) who were not ordained by a bishop, and thereupon will take occasion for a schism in our congregations, I shall speak more fully to their satisfaction anon.</p></blockquote>

he+constant+expressions+and+practice+of+antiquity%2C+do+show+that+this+is+a+degree+to+the+eldership%E2%80%A6+And+the+danger+of+misguiding+and+dividing+our+congregations+by+men+of+weak+judgments+is+so+great+that+I+think+it+much+fitter+to+try+them+first+in+an+office+of+known+inferiority+%28for+all+confess+that+deacons+should+be+guided+by+the+elders%29+wherein+they+may+be+as+serviceable+to+the+Church+than+to+begin+them+in+an+office+of+mere+power%2C+wherein+they+will+think+their+votes+to+be+of+equal+authority+with+the+most+judicious+teachers+%5BBaxter+did+not+hold+them+to+be+equal%5D%2C+and+so+may+breed+contentions+or+foment+errors+or+factions+in+the+church%3B+and+yet+be+less+capable+of+doing+service+than+the+deacons+are+%28See+Mr.+Noyes%2C+Temple+Measured%2C+of+the+Office+of+Deacons+and+Elders%29.+This+course+therefore+I+have+propounded+to+my+brethren+of+this+Association%3B+and+they+think+as+I+do%E2%80%A6+If+any+shall+refuse+the+office+of+deacons+as+too+mean+for+them%2C+they+shall+thereby+discover+that+pride+that+will+prove+them+unfit+to+be+either+elders+or+deacons%3B+and+you+will+have+cause+to+thank+God+that+thereby+a+mischief+to+the+Church+is+prevented%2C+which+might+have+followed+if+such+unhumbled+men+had+crept+into+authority.+6.+But+the+great+objection+against+this+Proposition+will+be+%28by+some%29+that+we+allow+none+to+be+elders+but+those+that+are+ordained%2C+and+so+overthrow+mere-ruling+elders.+To+which+I+answer%3A+1.+These+brethren+must+consider+that+we+are+forced+for+unity+to+speak+indistinctly+of+all+that+are+mere+assisting+elders+and+do+not+actually+preach+and+administer+sacraments%2C+whether+they+take+themselves+to+have+authority+to+do+more+%28as+other+ministers%29+or+not%3A+Now+they+will+confess+that+such+inferior+or+assisting+ministers+must+be+ordained%3A+and+we+cannot+now+%5Bformally%5D+distinguish+%5Bthem%5D.+2.+I+never+could+learn+that+it+is+the+judgment+of+presbyterians+or+congregational+men+that+it+is+unlawful+to+ordain+mere-ruling+elders.+And+if+they+may+do+it%2C+why+should+they+not+yield+to+it+for+peace%2C+though+they+think+not+that+they+must+do+it%3F+3.+I+confess+I+know+of+no+elders+mentioned+in+Scripture+without+ordination+and+do+despair+of+ever+seeing+it+proved+that+the+apostles+did+appoint+two+sorts+of+elders%2C+one+ordained+and+the+other+not+ordained.+The+contrary+I+doubt+not+to+prove+by+sufficient+induction.+4.+Deacons+must+be+ordained+that+are+inferior+to+elders%3B+why+then+should+not+elders+be+ordained%3F+5.+Let+our+brethren+take+heed+lest+they+loose+all+their+hold+of+that+show+they+have+in+Scripture+for+mere-ruling+elders+%28I+mean+quoad+potestatem+%5Bas+to+the+power%5D%2C+not+quoad+exercitium+ordinarium+%5Bas+to+the+ordinary+exercise%5D%29%2C+if+they+once+disclaim+all+those+as+no+such+ruling+elders+who+were+ordained.+It+seems+then+that+when+the+apostles+ordained+elders+in+every+Church%2C+and+when+Titus+was+left+to+ordain+elders+in+every+city%2C+it+was+no+mere-ruling+elders+that+they+ordained+or+were+appointed+to+ordain%21+6.+I+confess+I+am+loath+%28without+more+reasons+than+I+yet+know%29+to+give+the+intruders+of+the+ministry+so+much+encouragement+as+to+tell+them+men+may+ordinarily+be+ruling+elders+without+ordination%3F+For+doubtless+a+man+may+much+more+preach+up+and+down+in+public+occasionally+without+ordination%3A+I+mean%2C+more+may+be+said+for+it.+Even+some+of+the+most+learned+episcopal+divines+think+that+by+the+bishop%E2%80%99s+allowance+private+men+may+preach%2C+and+that+it+belongs+more+to+the+pastor+to+take+care+what+doctrine+is+taught+his+people+than+that+himself+be+the+teacher.+And+most+allow+the+preaching+of+probationers.+And+if+you+add+to+this+that+there+is+no+need+of+ordination+to+the+office+of+church-governing%2C+I+know+partly+what+will+follow.+7.+Yet+a+greater+doubt+is+behind%2C+and+that+is%3A+How+we+would+have+these+men+ordained%3F+I+answer%3A+1.+We+have+not+determined+of+that%3A+We+purposely+avoid+the+point+of+ordination+because+the+distance+between+the+episcopal+divines+and+others+is+well+known+in+that+point%3A+and+we+resolve+not+to+put+such+controverted+points+into+our+Agreement%2C+lest+thereby+we+necessarily+exclude+the+dissenters.+Our+business+is+not+now+%28as+is+said%29+to+reconcile+differences+in+judgment%3A+much+less+to+divide+from+those+that+differ+from+us%3A+but+to+practice+unanimously+so+much+as+we+are+agreed+in.+2.+We+leave+therefore+every+man+in+this+to+his+own+judgment.+Those+that+are+for+bishops+may+be+ordained+by+them+with+a+presbytery%2C+if+they+can+obtain+it.+Those+that+are+against+them%2C+may+be+ordained+by+the+Associated+pastors+of+that+Association%2C+the+president+performing+the+action.+Those+that+fear+danger+from+the+law+of+the+land+if+they+ordain+without+authority%2C+may+send+men+to+some+neighbor+county+that+has+authority.+Those+that+will+not+use+the+name+of+ordination+may+yet+use+the+thing%3A+which+is+nothing+but+the+solemn+designation+or+appointment+of+a+fit+person+to+the+office%2C+by+competent+men%3A+which+is+most+fitly+accompanied+with+prayer+and+imposition+of+hands%2C+where+they+may+be+had.+3.+To+avoid+some+of+these+contests%2C+if+deacons+only+be+first+ordained%2C+as+I+before+mentioned%2C+it+will+prevent+the+quarrels+that+some+may+else+be+drawn+to+by+difference+of+judgment.+For+many+moderate+episcopal+men+will+allow+presbyters+to+ordain+deacons+that+will+not+allow+them+to+ordain+presbyters.+As+for+those+that+will+say%2C+These+are+no+true+officers%2C+nor+to+be+acknowledged+%28whether+deacons+or+presbyters%29+who+were+not+ordained+by+a+bishop%2C+and+thereupon+will+take+occasion+for+a+schism+in+our+congregations%2C+I+shall+speak+more+fully+to+their+satisfaction+anon.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity%2C+%28London%3A+A.M.%2C+1653%29+%7C+An+Explication+of+Some+Passages+in+the+Propositions%2C+pp.+5-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bc9b3d8f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bc9b3d8f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=8.%20Concerning%20the%2017th%20Proposition%20%28which,more%20fully%20to%20their%20satisfaction%20anon&amp;text=8.%20Concerning%20the%2017th%20Proposition%20%28which%20many%20will&amp;text=shall%20speak%20more%20fully%20to%20their%20satisfaction%20anon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…there is another judgment [besides that proper to individual believing Christians] that is ministerial, official and authoritative… that what the shepherd teaches others God revealed to him first, and is put forth in a ministerial and official judging either in synods, or in public pastoral sermons and authoritative, but ministerial publishing the will and mind of Christ. Mal. 2:7, ‘They shall seek the Law from his mouth.’ Heb. 13:7,17. That way the people depends upon the ministerial judgment of synods and pastors… For pastors and synods teach fundamentals of faith ministerially to the people, and by hearing of them is faith begotten in the hearers… For this judgment authoritative as it is in the head of the Church (Christ) as in the fountain and only Law-giver, so it is ministerially only and by way of office in the elders, as the will and mind of the king is in the inferior judge, the ambassador or herald, not in the people; and the people are obliged ‘to obey those that are over them in the Lord, who watch for their souls, as those who must give an account’… and of this it is said, ‘he that heareth you’ (ministers of the Gospel, not the people) ‘heareth Me, he that dispiseth you dispiseth Me.’ And this is more than a privilege of order and honor, which one Christian has above another in regard of eminence of graces, gifts, and of wisdom, experience, and age: it is a privilege of office to speak in the name of the Lord, and yet it is inferior to a privilege of the law, because the Lord only imposes laws upon the conscience: for it is a middle judgment less than legislative, supreme and absolute over the conscience; this is in none save only in the King and head of the Church, and is royal and princely; Yet is it more (I say not more excellent, it not being saving of itself as in believers) than a privilege of mere honor and order, for though it lay no more bands on the conscience to obtain faith, because it is holden forth by men, it having no influence on the conscience because of men, whose word is not the formal object of faith, yet has it an official authority from pastors (which is not merely titulary) so as they may ministerially and officially command obedience to their judgment as far as it agrees with the mind of Christ, no farther: and when it is disobeyed may inflict censures, which private Christians cannot do, and puts these who disobey under another guiltiness than if private Christians did speak the same word, to wit not only in a case of disobedience to the Second Commandment, but in a state of disobedience to the Fifth Commandment formally, as not honoring father and mother; whereas to disobey that same word by way of counsel in the mouth of a brother, though it be the breach of the Fifth Commandment also [if the brother be superior in age, gifts, etc.], yet not in such a manner as when we refuse to hear the messenger of the Lord of Hosts; and his judgment as a messenger of God is public and binds as public to [the] highest obedience to the Fifth Commandment; but as it is a judgment of faith common to the doctor with other Christians, it binds as the mind of God holding faith in the Second Commandment what we are to believe.</p></blockquote>

e%3B+this+is+in+none+save+only+in+the+King+and+head+of+the+Church%2C+and+is+royal+and+princely%3B+Yet+is+it+more+%28I+say+not+more+excellent%2C+it+not+being+saving+of+itself+as+in+believers%29+than+a+privilege+of+mere+honor+and+order%2C+for+though+it+lay+no+more+bands+on+the+conscience+to+obtain+faith%2C+because+it+is+holden+forth+by+men%2C+it+having+no+influence+on+the+conscience+because+of+men%2C+whose+word+is+not+the+formal+object+of+faith%2C+yet+has+it+an+official+authority+from+pastors+%28which+is+not+merely+titulary%29+so+as+they+may+ministerially+and+officially+command+obedience+to+their+judgment+as+far+as+it+agrees+with+the+mind+of+Christ%2C+no+farther%3A+and+when+it+is+disobeyed+may+inflict+censures%2C+which+private+Christians+cannot+do%2C+and+puts+these+who+disobey+under+another+guiltiness+than+if+private+Christians+did+speak+the+same+word%2C+to+wit+not+only+in+a+case+of+disobedience+to+the+Second+Commandment%2C+but+in+a+state+of+disobedience+to+the+Fifth+Commandment+formally%2C+as+not+honoring+father+and+mother%3B+whereas+to+disobey+that+same+word+by+way+of+counsel+in+the+mouth+of+a+brother%2C+though+it+be+the+breach+of+the+Fifth+Commandment+also+%5Bif+the+brother+be+superior+in+age%2C+gifts%2C+etc.%5D%2C+yet+not+in+such+a+manner+as+when+we+refuse+to+hear+the+messenger+of+the+Lord+of+Hosts%3B+and+his+judgment+as+a+messenger+of+God+is+public+and+binds+as+public+to+%5Bthe%5D+highest+obedience+to+the+Fifth+Commandment%3B+but+as+it+is+a+judgment+of+faith+common+to+the+doctor+with+other+Christians%2C+it+binds+as+the+mind+of+God+holding+faith+in+the+Second+Commandment+what+we+are+to+believe.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%E2%80%A6+%281649%29%2C+ch.+2%2C+pp.+26-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F926007b7e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/926007b7e7.html">Permalink</a><a class="src" href="https://reformed

<main class="wrap"><figure class="quote" id="q-4e185def0a" data-kw="">
<blockquote><p>…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Agreements</cite>, p. 373</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>
<div class="actions"><button class="copy" data-copy="“…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1b86c2501" data-kw="">
<blockquote><p>Since, therefore, it is clear from what has been said that our will is effectively moved and determined by God as the first cause, the first mover, and therefore is preceded and predetermined by Him, it remains to be explained how this effective motion and determination, or rather divine pre-motion and predetermination, is consistent with the freedom of our will. For it does not seem that what is effectively moved and determined in one direction by a prior cause can be free to do otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXII. And these points are consistent with what is read in Estius in the above-cited passage, where he expounds the same doctrine and brings many confirmations to it. He concludes thus and objects to the freedom of human will:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin">
<blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</span></figcaption>

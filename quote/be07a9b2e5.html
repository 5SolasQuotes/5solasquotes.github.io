<main class="wrap"><figure class="quote" id="q-be07a9b2e5" data-kw="">
<blockquote><p>As for the law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says, and the prophet says (Mal. 2) that the Lord hates putting away;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 76 lt col</span></figcaption>

</figure><figure class="quote" id="q-8909a7b649" data-kw="">
<blockquote><p>7. They hold, that the oath ex officio [out of duty], whereby Popish and English ecclesiastical governors, either upon some secret informations or suggestions, or private susicions go about to bind men’s consciences to accuse themselves and their friends of such crimes or imputations as cannot by any direct course of law be proved against them, and whereby they are drawn to be instruments of many heavy crosses upon themselves and their friends, and that often for those actions that they are persuaded in their consciences are good and holy: I say that they hold that such an oath (on the urger’s part) is most damnable and tyrannous, against the very law of Nature, devised by Antichrist, through the inspiration of the Devil; that by means thereof the professors and practicers of the true religion might either in their weakness, by perjury damn their own souls or be drawn to reveal to the enemies of Christianity those secret religious acts and deeds, that being in the persuasion of their consciences for the advancement of the Gospel, will be a means of heavy sentences of condemnation against themselves and their dearest friends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Puritanism, containing the main opinions of the rigidest sort of those that are called Puritans in the realm of England</cite>, (d. 1618; London: 1641), ch. 5, pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

th,against%20themselves%20and%20their%20dearest%20friends&amp;text=7.%20They%20hold%2C%20that%20the%20oath%20ex%20officio&amp;text=of%20condemnation%20against%20themselves%20and%20their%20dearest%20friends" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b2daf828e1" data-kw="">
<blockquote><p>To open this, consider, That there is a twofold original fountain of Righteousness towards man:

1. There is the immediate command and word of God, and that is called Jus Divinum, Divine Righteousness.

2. There is the Law and Command of Nature, and that is Jus Humanum, An humane Righteousness, or Right: And this is either general, the first and immediate principles of nature, such as the apostle speaks of, Rom. 1, concerning the gentiles, that they had ‘a Law written in their hearts,’ [sic] verse 7 [2:14-15], about just and unjust things, and their consciences accusing or excusing, upon the omission or commission of such things, or else they are more remote and particular dictates, such as the good and wholesome laws of all lawgivers, in respective nations. So what is righteous and just between man and man, is to be determined by the laws of that land where they live: Indeed, if any lawgivers (as some heathenish have) commanded or allowed anything that is against the Law of God, or the universal dictates of right reason; such commands are not worthy the name of laws, they are rather unjust decrees, and so do not bind: But otherwise, the laws of a land determine what is righteous and just between man and man: for although it be God’s command, that a man should not steal, yet they are human laws that give the bounds and proprieties of estates to men: So that we Christians, and the Jews, do something differ about the rules of righteousness and equity; for God was the immediate Lawgiver unto that people: Moses as a messenger from God, received from God’s mouth the Judicial Law, which he delivered to them; so that the Judicial Law appointed by God Himself, was the statute-law of that realm: Their Laws were not human, as all the laws of kingdoms and states are since Christ’s coming, but they were Divine: Their laws about a thief, a murderer, the buyer and the seller, were all Divine laws, because immediately commanded by God, though the matter was merely human. Now its greatly disputed how far these Judicial Laws commanding judgement and justice between man and man, do bind us Christians; and whether all lawgivers and statesmen, are not bound to bring in those Judicial Laws? For who can determine what is righteousness and equity better then God, a righteous and wise God? It’s not pertinent to wade into this excellent question at this time: Though some in this point are very rigid, to make all obligatory, that are not expressly repealed by Christ; and some again are very remiss and lax; yet all conclude that the Moral Equity and Reason that was in every Judicial Law, does bind Christians as well as Jews; and with that we shall conclude this particular, whatsoever law God made about justice, restitution or punishment to the Jews, the equity and reason of that law, does still bind us, though not the particular manner. As for the New Testament, Christ’s Kingdoms was not temporal, or of this world; and therefore He only commands righteousness in the general, and commands that excellent maxim, which an heathen emperor did so much admire, saying, he received it from Christians, ‘What ye would have men do to you, do ye to them, for this is the Law and the Prophets,’ Mt. 7:12… Christ therefore He has only given us general rules of righteousness, and for the particulars, He does command Christians to obey and submit to the wholesome laws of that place where they are; as Rom. 13, ‘Pay tribute to whom tribute, custom to whom custom:’ And this the Scripture does often press, that none might think that the freedom they had by Christ did take them off from human obligations and relations: This was a great temptation, they thought because they were Christians, and made free by Christ, that this also did take them off from obedience to civil magistrates, and from the laws they lived under: No, the Scripture is diligent to teach this, That Christianity and the Gospel does not abolish political and civil government, but rather greatly advances it as an institution of God, pressing obedience thereunto for conscience sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), pp. 565-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

ight+think+that+the+freedom+they+had+by+Christ+did+take+them+off+from+human+obligations+and+relations%3A+This+was+a+great+temptation%2C+they+thought+because+they+were+Christians%2C+and+made+free+by+Christ%2C+that+this+also+did+take+them+off+from+obedience+to+civil+magistrates%2C+and+from+the+laws+they+lived+under%3A+No%2C+the+Scripture+is+diligent+to+teach+this%2C+That+Christianity+and+the+Gospel+does+not+abolish+political+and+civil+government%2C+but+rather+greatly+advances+it+as+an+institution+of+God%2C+pressing+obedience+thereunto+for+conscience+sake.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+Spiritual+Refining%3A+or+A+Treatise+of+Grace+and+Assurance%2C+%E2%80%A6+%28London%2C+1652%29%2C+pp.+565-66&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb2daf828e1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b2daf828e1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=To%20open%20this%2C%20consider%2C%20That%20there,pressing%20obedience%20thereunto%20for%20conscience%20sake&amp;text=To%20open%20this%2C%20consider%2C%20That%20there%20is%20a&amp;text=of%20God%2C%20pressing%20obedience%20thereunto%20for%20conscience%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

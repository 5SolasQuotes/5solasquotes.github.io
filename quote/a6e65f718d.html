<main class="wrap"><figure class="quote" id="q-a6e65f718d" data-kw="">
<blockquote><p>Of whom speaks the Confession this? Of the God of the elect only? Or of the God of every man? Is He the God of the elect only? Is He not also of the non-elect? Is this description of the gracious nature and attributes of God intended to be restricted to a part of mankind? Is not God as thus delineated the Creator and Father of every man without exception? Can it be supposed that the authors of this statement meant to be understood to say that God is not such a being for all men, but only for some? If this section does not teach the unlimited love and compassion of God towards all men as men, as his creatures, it teaches nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-shedd.html">William Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (1893)</cite>, pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-b6d0804060" data-kw="">
<blockquote><p>The effects of mercy are either special: proper to the elect, as flowing from special grace, Rom. 9:23. The elect are called (and by effectual calling so made) vessels of mercy. Or common, extended to those who are not elected, Lk. 6:35-36. Unto the beasts of the field, Ps. 104:27; Yea, over all his works, Ps. 145:9.</p></blockquote>

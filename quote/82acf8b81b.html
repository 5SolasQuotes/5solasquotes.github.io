<main class="wrap"><figure class="quote" id="q-82acf8b81b" data-kw="">
<blockquote><p>Christ has not made pastors under-kings to create any laws morally obliging the conscience to obedience in the court of God, which God has not made to their hand; if the king and synods only declare and propound, by a power of jurisdiction, that which God in the Law of Nature or the written Word has commanded; they are not the Law-makers, nor creators of that morality in the Law, which lays bonds on the conscience; yea, they have no organical, nor inferior influence in creating that morality, God only by an immediate act as the only immediate king, made the morality, and if king, parliaments and synods be under kings and under Law-givers, they must have an under-action, and a ministerial, subservient, active influence under Christ in creating as second causes, that which is the formal reason, and essence of all laws binding the conscience, and that is the morality that obliges the soul to eternal wrath, though king, parliament, pastors or synods should never command such a moral thing: Now to propound, or declare, that God’s will is to be done in such an act, or synodical directory or canon, and to command it to be observed under civil and ecclesiastical pain, is not to make a law, it is indeed to act authoritatively under Christ as King: but it makes them neither kings, nor Law-givers, no more than heralds are little kings, or inferior law-givers, and parliaments, because in the name and authority of king and parliament they promulgate the laws of king and parliament: The heralds are mere servants, and do indeed represent king and parliament, and therefore to wrong them, in the promulgation of laws, is to wrong king and parliament; but the heralds had no action, no hand at all in making the laws; they may be made when all the heralds are sleeping, and so by no propriety of speech can heralds be called mediate kings, under-Lawgivers, just so here, as touching the morality of all human laws, whether civil or ecclesiastical, God Himself immediately, yea, from eternity by an act of his free-pleasure made that without advice of men or angels; for who instructed Him? Neither Moses, nor prophet, nor apostle; yea, all here are meri precones, only heralds; Yet are not all these heralds, who declare the morality of laws, [for] equals may declare them charitative[ly], by way of charity to equals; but these only are to be obeyed as heralds of laws, whom God has placed in authority, as kings, parliaments, synods, the Church, masters, fathers, captains; And it follows no ways that we disclaim the authority of all these because we will not enthrone them in the chair of the Supreme and only Lawgiver, and head of the Church; they are not under-Law-givers and little kings to create laws, the morality of which binds the conscience (for this God only can do); therefore, there be no parliaments, no kings, no rulers that have authority over men, it is a most unjust consequence; for all our divines, against Papists, deny that human laws, as human, do bind the conscience; but they deny not, but assert the power of jurisdiction in kings, parliaments, synods, pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 25-26</span></figcaption>

<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>

<blockquote><p>…Pilate uses all means to get Jesus loose; he uses the present occasion to that purpose; knowing the use [custom] of the Jews, he would have been glad to have had Jesus set at liberty, above all the prisoners. To speak somewhat of this custom: They had this custom, to get a prisoner set at liberty at festival times, to the honor of their feasts… but therewith they dishonored God. Is that to honor God, to break his commandment?… We know this, there is nothing wherein a prince resembles God more than in clemency; but it is a sin to let a wicked man escape, or that the emperor should let him go; for God’s law says, Dt. 19:11-13, “Thine eye shall not spare the murderer, neither look upon him with a pitiful eye.”… Some will say, has not a free prince license to give him his life, albeit the law of God says, “The murderer shall die the death?”… It is true, indeed, a prince should be loath to put out that life that God has put in, and should beware to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince has no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate [lesson] the punishment, but to say he may let the man go free, he has no power. But they will insist further, and say, Is not this on the the judicial laws that was given to the Jews–then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them–they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know that natural men, ethnics, who had never the law of the Jews, they executed the murderer. But yet they insist, and they will bring in the example of good kings, who forgave capital crimes committed against the very universal and natural law; and namely of David. Forgave he not Joab for slaying of Abner and Amasah? and Amnon, for committing incest? and again, forgave he not Absalom for slaying of Amnon, his brother? But I answer: We are bound to live by God’s laws, and not by examples… Indeed, there is a difference between these crimes that are capital, and the crimes that in their own nature are not capital, but by the laws of princes are made capital; for upon just considerations, the prince has power to dispense with them: as, for example, it was not deadly of the own nature to Shimei to go out of the ports of Jerusalem, but because Solomon forbade it, it became deadly. Like as it is in the hands of princes to make and to change such special laws; so it lies in his hands to forgive such a man transgressing them, upon weighty and great considerations. So, to return, these crimes that are capital by natural law, a prince has no power to remit them, albeith he were ruler of all the world; he derogates to God’s glory. And secondly, if there were no more to let us see that God has not given that power to forgive capital crimes against God’s law and nature, the judgments of God which ceased on such men and their posterity were sufficient to show it…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…Pilate uses all means to get Jesus loose; he uses the present occasion to that purpose; knowing the use [custom] of the Jews, he would have been glad to have had Jesus set at liberty, above all the prisoners. To speak somewhat of this custom: They had this custom, to get a prisoner set at liberty at festival times, to the honor of their feasts… but therewith they dishonored God. Is that to honor God, to break his commandment?… We know this, there is nothing wherein a prince resembles God more than in clemency; but it is a sin to let a wicked man escape, or that the emperor should let him go; for God’s law says, Dt. 19:11-13, “Thine eye shall not spare the murderer, neither look upon him with a pitiful eye.”… Some will say, has not a free prince license to give him his life, albeit the law of God says, “The murderer shall die the death?”… It is true, indeed, a prince should be loath to put out that life that God has put in, and should beware to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince has no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate [lesson] the punishment, but to say he may let the man go free, he has no power. But they will insist further, and say, Is not this on the the judicial laws that was given to the Jews–then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them–they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know that natural men, ethnics, who had never the law of the Jews, they executed the murderer. But yet they insist, and they will bring in the example of good kings, who forgave capital crimes committed against the very universal and natural law; and namely of David. Forgave he not Joab for slaying of Abner and Amasah? and Amnon, for committing incest? and again, forgave he not Absalom for slaying of Amnon, his brother? But I answer: We are bound to live by God’s laws, and not by examples… Indeed, there is a difference between these crimes that are capital, and the crimes that in their own nature are not capital, but by the laws of princes are made capital; for upon just considerations, the prince has power to dispense with them: as, for example, it was not deadly of the own nature to Shimei to go out of the ports of Jerusalem, but because Solomon forbade it, it became deadly. Like as it is in the hands of princes to make and to change such special laws; so it lies in his hands to forgive such a man transgressing them, upon weighty and great considerations. So, to return, these crimes that are capital by natural law, a prince has no power to remit them, albeith he were ruler of all the world; he derogates to God’s glory. And secondly, if there were no more to let us see that God has not given that power to forgive capital crimes against God’s law and nature, the judgments of God which ceased on such men and their posterity were sufficient to show it…”

— Robert Rollock, Select Works, vol. 2, pp. 87-90 on Mt. 27:16-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6Pilate+uses+all+means+to+get+Jesus+loose%3B+he+uses+the+present+occasion+to+that+purpose%3B+knowing+the+use+%5Bcustom%5D+of+the+Jews%2C+he+would+have+been+glad+to+have+had+Jesus+set+at+liberty%2C+above+all+the+prisoners.+To+speak+somewhat+of+this+custom%3A+They+had+this+custom%2C+to+get+a+prisoner+set+at+liberty+at+festival+times%2C+to+the+honor+of+their+feasts%E2%80%A6+but+therewith+they+dishonored+God.+Is+that+to+honor+God%2C+to+break+his+commandment%3F%E2%80%A6+We+know+this%2C+there+is+nothing+wherein+a+prince+resembles+God+more+than+in+clemency%3B+but+it+is+a+sin+to+let+a+wicked+man+escape%2C+or+that+the+emperor+should+let+him+go%3B+for+God%E2%80%99s+law+says%2C+Dt.+19%3A11-13%2C+%E2%80%9CThine+eye+shall+not+spare+the+murderer%2C+neither+look+upon+him+with+a+pitiful+eye.%E2%80%9D%E2%80%A6+Some+will+say%2C+has+not+a+free+prince+license+to+give+him+his+life%2C+albeit+the+law+of+God+says%2C+%E2%80%9CThe+murderer+shall+die+the+death%3F%E2%80%9D%E2%80%A6+It+is+true%2C+indeed%2C+a+prince+should+be+loath+to+put+out+that+life+that+God+has+put+in%2C+and+should+beware+to+judge+rashly+in+capital+crimes.+It+is+no+small+matter+to+make+a+crime+capital%3B+but+if+the+crime+be+capital+and+deadly%2C+the+prince+has+no+power+to+hold+his+hand+aback+from+execution%2C+and+to+forgive.+Indeed%2C+for+weighty+and+great+considerations%2C+a+prince+may+mitigate+%5Blesson%5D+the+punishment%2C+but+to+say+he+may+let+the+man+go+free%2C+he+has+no+power.+But+they+will+insist+further%2C+and+say%2C+Is+not+this+on+the+the+judicial+laws+that+was+given+to+the+Jews%E2%80%93then+what+have+we+to+do+with+it%3F+I+answer%2C+these+laws%2C+seeing+the+Jews%2C+and+their+commonwealth%2C+and+laws+politic%2C+are+abrogate%2C+in+so+far+as+they+concerned+that+people%2C+we+have+nothing+ado+with+them%E2%80%93they+are+abolished%3B+but+for+as+much+as+they+are+grounded+upon+nature%2C+and+natural+law%2C+we+have+ado+with+them.+As+for+this+law%2C+it+is+natural.+Ye+know+that+natural+men%2C+ethnics%2C+who+had+never+the+law+of+the+Jews%2C+they+executed+the+murderer.+But+yet+they+insist%2C+and+they+will+bring+in+the+example+of+good+kings%2C+who+forgave+capital+crimes+committed+against+the+very+universal+and+natural+law%3B+and+namely+of+David.+Forgave+he+not+Joab+for+slaying+of+Abner+and+Amasah%3F+and+Amnon%2C+for+committing+incest%3F+and+again%2C+forgave+he+not+Absalom+for+slaying+of+Amnon%2C+his+brother%3F+But+I+answer%3A+We+are+bound+to+live+by+God%E2%80%99s+laws%2C+and+not+by+examples%E2%80%A6+Indeed%2C+there+is+a+difference+between+these+crimes+that+are+capital%2C+and+the+crimes+that+in+their+own+nature+are+not+capital%2C+but+by+the+laws+of+princes+are+made+capital%3B+for+upon+just+considerations%2C+the+prince+has+power+to+dispense+with+them%3A+as%2C+for+example%2C+it+was+not+deadly+of+the+own+nature+to+Shimei+to+go+out+of+the+ports+of+Jerusalem%2C+but+because+Solomon+forbade+it%2C+it+became+deadly.+Like+as+it+is+in+the+hands+of+princes+to+make+and+to+change+such+special+laws%3B+so+it+lies+in+his+hands+to+forgive+such+a+man+transgressing+them%2C+upon+weighty+and+great+considerations.+So%2C+to+return%2C+these+crimes+that+are+capital+by+natural+law%2C+a+prince+has+no+power+to+remit+them%2C+albeith+he+were+ruler+of+all+the+world%3B+he+derogates+to+God%E2%80%99s+glory.+And+secondly%2C+if+there+were+no+more+to+let+us+see+that+God+has+not+given+that+power+to+forgive+capital+crimes+against+God%E2%80%99s+law+and+nature%2C+the+judgments+of+God+which+ceased+on+such+men+and+their+posterity+were+sufficient+to+show+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+Select+Works%2C+vol.+2%2C+pp.+87-90+on+Mt.+27%3A16-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d63fb276b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d63fb276b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=Pilate%20uses%20all%20means%20to%20get,posterity%20were%20sufficient%20to%20show%20it&amp;text=Pilate%20uses%20all%20means%20to%20get%20Jesus%20loose&amp;text=and%20their%20posterity%20were%20sufficient%20to%20show%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For in the Old Testament there are many rules, directions and examples, as a pillar of fire to guide the Churches now by (as that Rom. 15:4 shows) namely those examples and rules of moral and common equity, else the Church of God should loose now many a good ground, for many practices… Now if you [Independents] will use the Old Testament in some examples and commands, as you do (though here you forget to mention it), then grounds out of the Old Testament (in matters not ceremonial and judicial proper to the Jews’ policy, nation and times) but in things of moral and common equity will justify other practices…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-be6325be1c" data-kw="">
<blockquote><p>Humiliation is that base, and voluntary condition of Christ, God-man upon earth; whereby he debased himself, as touching both Natures, that he might both die, and by dying satisfy: as touching his Divine Nature, he debased himself, both by a voluntary subjection of his Person, and by a hiding of his glory, and majesty before men, for the time: as touching his Human Nature, both by taking unto him the Infirmity of our Nature; and secondly, by his most humble Obedience of Life, and Death.

Exaltation is the condition of Christ, God-man, whereby he was advanced into the glory and dignity, which was meet, or convenient for the person of a Mediator, and that according to both natures; according to the divine nature by relation, or by a divine manifestation of that majesty which he hid, during the time of his abasement; according to the human; partly, by the deposition of his servile condition, and partly by the receiving gifts, in body &amp; in soul, concurring together unto the perfection and blessedness of his human nature, above all nature.

Of both states, there are proper degrees, opposite one to the other. Of Humiliation; and first of that which is outward, or of his Submission unto death, there are three degrees: death, with the curse conjoined: Burial, that the truth of his death might be ratified: Descent into Hell, or that voluntary debasement of Christ to suffer, and as it were, with wrestling, to overcome the pains of Hell, which Christ chiefly felt in his soul, when he was assaulted; first with heaviness, afterwards with the sorrows of both deaths.

To these are opposed three degrees of Exaltation: Resurrection, in which by divine power, having subdued death, he raised up himself unto life everlasting: Ascension, whereby, through the same power, he verily and visibly translated his body into the Heaven of the blessed sitting at the right hand of the Father, whereby Christ was actually endued with all fullness, both of glory, and power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved</cite>, trans. John Gawen (London: Francis Burton, 1610), 2.7, pp 198-201.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e63b4b4bbb" data-kw="">
<blockquote><p>Consider the odious filthiness of sin, the pertinacious adherence thereof unto thy nature; so that nothing but the incarnation and blood of the Son of God, the creator of the world, could wash it out. Consider the justice, and indispensable severity of our God against sin, which would not spare the life of his own Son, nor be satisfied without a sacrifice of infinite and co-equal virtue with itself.

Consider that it was thy sins, which were the associates with Judas, and Pilate, and the Jews, to crucify him: it was thy hypocrisy which was the kiss, that betrayed him; thy covetousness the thorns, that crowned him; thy oppression and cruelty the nails and spears, that pierced him; thy idolatry and superstition the knee, that mocked him; thy contempt of religion the spittle, that defiled him; thy anger and bitterness the gall and vinegar, that distasted him; thy crimson and redoubled sins the purple that dishonoured him: in a word, thou wert the Jew that killed him.

Canst thou, then, have so many members, as weapons, wherewith to crucify thy Saviour, and hast thou not a heart wherein to recognise, and a tongue wherewith to celebrate, the benefits of that blood which thy sins had poured out? The fire is quenched by that water, which by its heat was caused to run over; and shall not any of thy sins be put out by the overflowing of that precious blood, which thy sins caused to run out of his sacred body?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 107-08.</span></figcaption>

</figure><figure class="quote" id="q-0076ce0f8b" data-kw="sufferings soul wrath">
<blockquote><p>As the suffering of Christ is the principal part of the ransom paid for us by him and the special foundation of our confidence and consolation, it should also be the primary object of our faith and the theme of meditation, that with Paul we may count all things for loss but the knowledge of the crucified Jesus. Did Christ suffer only corporeal punishments for us in the body or in the soul, but only as to its lower and sensitive part? Or did he in truth also bear the spiritual and infernal punishments of sin themselves (in the superior as well as in the inferior part) properly in himself and from a sense of God’s wrath? We deny the former and affirm the latter against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.14.1</span></figcaption>

</figure><figure class="quote" id="q-5f2158f9f2" data-kw="">
<blockquote><p>But what of Schleiermacher, that man of colossal intellect, equally distinguished as a metaphysician and a critic? Well, that great man was the subject of a life-struggle between admiration, almost idolatrous, of the purely human excellence of Jesus of Nazareth on the one hand, and, on the other, an unconquerable inability to receive the simple testimony of the records from which alone it is derived. He had a faith which he could never shake off in the historic reality and transcendent perfection of the Man Christ Jesus. That faith, I believe, was the happy fruit of indelible impressions received by him, and deep emotions stirred within him, in his student days, at a Moravian establishment, whither his clerical father had sent the youth, seeing in him buddings of rare promise, as an asylum from the growing scepticism of Germany in his day.

In that establishment the worship of Christ as the proper embodiment of the whole Godhead, which characterises that remarkable sect, resounded daily, almost for hours, in the music and the prayers, in every varied form; and though he winced at it intellectually, the effect upon him was to plant, deep in his great soul, an image of that Object of worship which he was never able quite to disown. But a certain sceptical tendency, which was natural to him, rose against the Biblical view of Christ, and, to some extent, even of God himself. Working on metaphysical problems, with a Platonic cast of mind, he was smitten with admiration of the Pantheistic conception of the universe developed by Spinoza; and though his soul was incapable of resting in the cold dialectics of pure Spinozism, it imparted a certain tainted element to his Theism, not undiscernible by the intelligent reader of his Glaubenslehre.

But Schleiermacher was no less distinguished for critical penetration than for metaphysical acumen; and when he applied this critical faculty to the documents of our faith, its effect was all the more baneful than in the direction of metaphysics, that it told upon a class many times more numerous, and was capable of influencing society far more extensively than the students of metaphysics. Going outside the Gospel History, and sitting upon it, he brought to bear upon it what the Germans call the kritiches Gefühl, or the principles of that higher criticism which owes more to Schleiermacher than to any other single critic.

In doing this, he first dissolved the whole history into a heap of traditional fragments, then, comparing the different accounts of the same events in the evangelical narratives, he found them to a large extent conflicting; and, finally, out of the whole materials before him, he extracted, in the exercise of his critical instinct, what he deemed the true historical Jesus, the noblest and most beautiful representative of a Godlike and God-filled Humanity. But Humanity only could Schleiermacher see in Christ—a fontal Humanity, indeed, that of a Second Adam, but still pure Humanity, beauteous, even perfect, but nothing more.

Spending his great critical strength in anatomising the several narratives, making chemical compounds of their detached sections, the result was that, in respect of substance and phraseology, that glorious Personality which stands out so brightly to the view of others was obscured to him. Burrowing among his critical materials, the great Object of whom they treat presented itself to him in broken lights, and aspects in a great measure distorted. No better illustration of this will be found than in his view of the Miraculous Conception. This he could not take in. He regarded our Lord as having come into the world like all other descendants of the first pair: that was the result of his criticism, if not of a foregone conclusion. But unable to see how so spotless a life could spring from a birth tainted with the hereditary stain, he held that by some mysterious operation upon the parents this offspring of theirs was preserved from the hereditary taint.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Miraculous Conception of our Lord Jesus Christ: its Truth and Place in New Testament Christianity in British and Foreign Evangelical Review</cite></span></figcaption>

But Schleiermacher was no less distinguished for critical penetration than for metaphysical acumen; and when he applied this critical faculty to the documents of our faith, its effect was all the more baneful than in the direction of metaphysics, that it told upon a class many times more numerous, and was capable of influencing society far more extensively than the students of metaphysics. Going outside the Gospel History, and sitting upon it, he brought to bear upon it what the Germans call the kritiches Gefühl, or the principles of that higher criticism which owes more to Schleiermacher than to any other single critic.

In doing this, he first dissolved the whole history into a heap of traditional fragments, then, comparing the different accounts of the same events in the evangelical narratives, he found them to a large extent conflicting; and, finally, out of the whole materials before him, he extracted, in the exercise of his critical instinct, what he deemed the true historical Jesus, the noblest and most beautiful representative of a Godlike and God-filled Humanity. But Humanity only could Schleiermacher see in Christ—a fontal Humanity, indeed, that of a Second Adam, but still pure Humanity, beauteous, even perfect, but nothing more.

Spending his great critical strength in anatomising the several narratives, making chemical compounds of their detached sections, the result was that, in respect of substance and phraseology, that glorious Personality which stands out so brightly to the view of others was obscured to him. Burrowing among his critical materials, the great Object of whom they treat presented itself to him in broken lights, and aspects in a great measure distorted. No better illustration of this will be found than in his view of the Miraculous Conception. This he could not take in. He regarded our Lord as having come into the world like all other descendants of the first pair: that was the result of his criticism, if not of a foregone conclusion. But unable to see how so spotless a life could spring from a birth tainted with the hereditary stain, he held that by some mysterious operation upon the parents this offspring of theirs was preserved from the hereditary taint.”

— David Brown, The Miraculous Conception of our Lord Jesus Christ: its Truth and Place in New Testament Christianity in British and Foreign Evangelical Review">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+what+of+Schleiermacher%2C+that+man+of+colossal+intellect%2C+equally+distinguished+as+a+metaphysician+and+a+critic%3F+Well%2C+that+great+man+was+the+subject+of+a+life-struggle+between+admiration%2C+almost+idolatrous%2C+of+the+purely+human+excellence+of+Jesus+of+Nazareth+on+the+one+hand%2C+and%2C+on+the+other%2C+an+unconquerable+inability+to+receive+the+simple+testimony+of+the+records+from+which+alone+it+is+derived.+He+had+a+faith+which+he+could+never+shake+off+in+the+historic+reality+and+transcendent+perfection+of+the+Man+Christ+Jesus.+That+faith%2C+I+believe%2C+was+the+happy+fruit+of+indelible+impressions+received+by+him%2C+and+deep+emotions+stirred+within+him%2C+in+his+student+days%2C+at+a+Moravian+establishment%2C+whither+his+clerical+father+had+sent+the+youth%2C+seeing+in+him+buddings+of+rare+promise%2C+as+an+asylum+from+the+growing+scepticism+of+Germany+in+his+day.%0A%0AIn+that+establishment+the+worship+of+Christ+as+the+proper+embodiment+of+the+whole+Godhead%2C+which+characterises+that+remarkable+sect%2C+resounded+daily%2C+almost+for+hours%2C+in+the+music+and+the+prayers%2C+in+every+varied+form%3B+and+though+he+winced+at+it+intellectually%2C+the+effect+upon+him+was+to+plant%2C+deep+in+his+great+soul%2C+an+image+of+that+Object+of+worship+which+he+was+never+able+quite+to+disown.+But+a+certain+sceptical+tendency%2C+which+was+natural+to+him%2C+rose+against+the+Biblical+view+of+Christ%2C+and%2C+to+some+extent%2C+even+of+God+himself.+Working+on+metaphysical+problems%2C+with+a+Platonic+cast+of+mind%2C+he+was+smitten+with+admiration+of+the+Pantheistic+conception+of+the+universe+developed+by+Spinoza%3B+and+though+his+soul+was+incapable+of+resting+in+the+cold+dialectics+of+pure+Spinozism%2C+it+imparted+a+certain+tainted+element+to+his+Theism%2C+not+undiscernible+by+the+intelligent+reader+of+his+Glaubenslehre.%0A%0ABut+Schleiermacher+was+no+less+distinguished+for+critical+penetration+than+for+metaphysical+acumen%3B+and+when+he+applied+this+critical+faculty+to+the+documents+of+our+faith%2C+its+effect+was+all+the+more+baneful+than+in+the+direction+of+metaphysics%2C+that+it+told+upon+a+class+many+times+more+numerous%2C+and+was+capable+of+influencing+society+far+more+extensively+than+the+students+of+metaphysics.+Going+outside+the+Gospel+History%2C+and+sitting+upon+it%2C+he+brought+to+bear+upon+it+what+the+Germans+call+the+kritiches+Gef%C3%BChl%2C+or+the+principles+of+that+higher+criticism+which+owes+more+to+Schleiermacher+than+to+any+other+single+critic.%0A%0AIn+doing+this%2C+he+first+dissolved+the+whole+history+into+a+heap+of+traditional+fragments%2C+then%2C+comparing+the+different+accounts+of+the+same+events+in+the+evangelical+narratives%2C+he+found+them+to+a+large+extent+conflicting%3B+and%2C+finally%2C+out+of+the+whole+materials+before+him%2C+he+extracted%2C+in+the+exercise+of+his+critical+instinct%2C+what+he+deemed+the+true+historical+Jesus%2C+the+noblest+and+most+beautiful+representative+of+a+Godlike+and+God-filled+Humanity.+But+Humanity+only+could+Schleiermacher+see+in+Christ%E2%80%94a+fontal+Humanity%2C+indeed%2C+that+of+a+Second+Adam%2C+but+still+pure+Humanity%2C+beauteous%2C+even+perfect%2C+but+nothing+more.%0A%0ASpending+his+great+critical+strength+in+anatomising+the+several+narratives%2C+making+chemical+compounds+of+their+detached+sections%2C+the+result+was+that%2C+in+respect+of+substance+and+phraseology%2C+that+glorious+Personality+which+stands+out+so+brightly+to+the+view+of+others+was+obscured+to+him.+Burrowing+among+his+critical+materials%2C+the+great+Object+of+whom+they+treat+presented+itself+to+him+in+broken+lights%2C+and+aspects+in+a+great+measure+distorted.+No+better+illustration+of+this+will+be+found+than+in+his+view+of+the+Miraculous+Conception.+This+he+could+not+take+in.+He+regarded+our+Lord+as+having+come+into+the+world+like+all+other+descendants+of+the+first+pair%3A+that+was+the+result+of+his+criticism%2C+if+not+of+a+foregone+conclusion.+But+unable+to+see+how+so+spotless+a+life+could+spring+from+a+birth+tainted+with+the+hereditary+stain%2C+he+held+that+by+some+mysterious+operation+upon+the+parents+this+offspring+of+theirs+was+preserved+from+the+hereditary+taint.%E2%80%9D%0A%0A%E2%80%94+David+Brown%2C+The+Miraculous+Conception+of+our+Lord+Jesus+Christ%3A+its+Truth+and+Place+in+New+Testament+Christianity+in+British+and+Foreign+Evangelical+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f2158f9f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5f2158f9f2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/01/david-brown-on-friedrich-schleiermacher-christology-and-the-virgin-birth/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…any one who is willing… will easily perceive how… Mark has inserted this notice of the third hour, so that every one may there be led to bethink himself of an hour at which the Jews really crucified the Lord, although they sought to transfer the burden of the crime to the Romans… Thus, lest any one should leave the Jews out of account, and make the conception of so great a crime lie against those soldiers, Mark gives us here the statement, ‘And it was the third hour, and they crucified Him,’ his object being to have those Jews rather discovered to be the real crucifiers, who will be found by the careful investigator in a position making it quite possible for them to have cried out for the Lord’s crucifixion [before Pilate, Mk. 15:13-14] at the third hour, while he [the investigator] observes [via the Gospel of John] that what was done by the soldiers took place at the sixth hour.</p></blockquote>

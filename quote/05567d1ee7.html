<blockquote><p>When God ‘foreordains’ a sinner ‘to everlasting death,’ He decides to leave him in the sin which deserves everlasting death and results in it. The non-elect sinner has experienced the operation of common grace. It is an error to say that God shows no kind or degree of mercy to the non-elect. But he has resisted and defeated it. God decides to proceed no further with him by the bestowment of that special grace which regenerates, and ‘makes willing in the day of God’s power.’ The elect sinner has also experienced, resisted, and defeated common grace. God decides to proceed further with him, by effectual calling and regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 3, pp. 19-20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60e80e9399" data-kw="">
<blockquote><p>1. There is no power in man to remove that resistance that is in his heart against God and the work of his grace; that which out of its own corrupt principles does wholly resist, and cannot but resist, the operation and dispensation of all spiritual means that would prevail with it for good, that cannot take away the resistance; for resistance cannot take away resistance; it implies a palpable contradiction, as that which is professedly cross to common sense. But the corrupt heart of a natural man, while he is in the state of nature and corruption, does and cannot but wholly resist the work of God’s Spirit and grace, and all the saving operations of all the means thereof. The flesh lusts against the Spirit, and the Spirit against the flesh, and these two are contrary, Gal. 5:17. And what is born of the flesh is flesh, Jn. 3:7; that is the temper and inward constitution of a soul in its natural condition; it is wholly born of the flesh, and therefore nothing but flesh, and therefore can do nothing but resist the Spirit; yea, it cannot but oppose whatever would take that resistance away; for it is a received rule of reason, and confessed of all hands, everything desires the preservation of itself and its being; otherwise the being and the causes that made up the being should be cross to the thing, if it should endeavor its own destruction; nay, a thing should be opposite to itself. Hence it is that the corruption of the heart will put forth all the skill and strength it hath, or by the contrivements of carnal reason can compass, to fortify and preserve itself against the spiritual and saving dispensation of the work of God’s Spirit in his own ordinances; because wicked men look at the power thereof as that which works the ruin of their lusts; therefore they labor to avoid the light if they can; if not that, to oppose it, and overbear it by their delusions; if not that, to destroy it…

2. Before the soul can act against the evil of sin, or for the removal of this resistance wherein the destroying venom of sin lies, and that which stops the passage of the power of the ordinance and the work of grace, it is necessary that the Lord should not only concur with the act of the will of a sinner, to lead or draw forth the act thereof which He has ability to express, but He must let in an influence of the same power and virtue into the faculty of the will, whereby it may be enabled to put forth an act unto which it formerly had no power of itself…

3. The influence of this spiritual power whereby the Lord takes away this sinful resistance, is not by any gracious habit of sanctification, but by an irresistable motion of the work of his Spirit upon the soul…</p></blockquote>

<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>

<blockquote><p>Reply Obj. 1: A thing moved by another is forced if moved against its natural inclination; but if it is moved by another giving to it the proper natural inclination, it is not forced; as when a heavy body is made to move downwards by that which produced it, then it is not forced. In like manner God, while moving the will, does not force it, because He gives the will its own natural inclination. Reply Obj. 2: To be moved voluntarily, is to be moved from within, that is, by an interior principle: yet this interior principle may be caused by an exterior principle; and so to be moved from within is not repugnant to being moved by another. Reply Obj. 3: If the will were so moved by another as in no way to be moved from within itself, the act of the will would not be imputed for reward or blame. But since its being moved by another does not prevent its being moved from within itself, as we have stated (ad 2), it does not thereby forfeit the motive for merit or demerit.</p></blockquote>

<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>

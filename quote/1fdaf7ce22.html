<main class="wrap"><figure class="quote" id="q-1fdaf7ce22" data-kw="">
<blockquote><p>M.—Certainly I cannot deny that such princes deserved, and still deserve, to be fettered by laws; for no monster is more outrageous, or more pernicious than man, when, as in the fables of the poets, he has once degenerated into a brute.

B.—On this assertion you would insist still more if you had remarked what a complicated animal man is, and of what various monsters he is composed. This truth the ancient poets discerned with great acuteness, and expressed with no less elegance, when they record that, in the formation of man, Prometheus borrowed from the several animals certain particles with which he constituted his mingled frame. To recount the natures of all separately would be endless; but, undoubtedly, there appear evidently in man two abominable monsters, anger and lust.

And what else is the effect, or the object of laws, but to render these monsters obedient to reason, and to coerce them, while not obedient, by the power of their mandates. He, therefore, who releases either a king, or any other man, from the shackles of law, releases not only a single man, but sets loose against reason two of the most cruel monsters, and arms them for breaking through the barriers of order; so that truth and rectitude seem to have guided the tongue of Aristotle, when he said that “He who obeys the laws, obeys God and the law; and that he who obeys man, obeys man and a wild beast.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-buchanan.html">George Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland</cite>, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), p. 66.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1150b1a98" data-kw="">
<blockquote><p>These Judicial Laws were determinations of the Moral Law. A determination is either Iuris Divini [Divine law] or Humani [human]; these determinations in Moses’ Judicial Laws are Divini Juris; therefore they had greater force to bind the Jew, than any municpal law has to bind the subjects now, in respect they were given by God Himself, and these laws of men which draw nearest to them in equity, are most perfect; although particularly they cannot be fitted to every nation, no more than a shoe of one measure can serve for every foot. … Fourthly, the punishments inflicted by human laws are alterable: so were the punishments in Moses’ Judicial Law; therefore the Jews say of them, ascendunt et descendunt [ascending and desceding], which they understand, not of the greatest and highest transgressions, but of the middle sort of transgressions, which praecepta media, their middle precepts did forbid. Example, Ex. 21:29-36, If a man kept a pushing ox, knowing that he were wont [accustomed] to push, if he kill a man, then the Law ordains that the man shall die, or else to redeem himself with a sum of money; here the law ascended or descended: but if a man had willfully killed a man, that was praeceptum grave [a grave precept], the punishment neither ascended nor descended, but he was to die the death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explication of the Judicial Laws of Moses</cite>, pp. 1-3</span></figcaption>

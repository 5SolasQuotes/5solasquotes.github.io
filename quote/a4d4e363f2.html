<main class="wrap"><figure class="quote" id="q-a4d4e363f2" data-kw="">
<blockquote><p>There are some diseases that are called opprobria medicorum, ‘the disgraces of physicians’, because they know not what to say or do to them; or if they do anything it is to little purpose. If there be any soul-disease that be opprobrium theologorum, the disgrace of divines, it is this: of contention and division. How little has all that they have studied and endeavored to do prevailed with the hearts of men? What shall we do? Shall we but join in this one thing, to sit down together, and mourn one over another, one for another, till we have dissolved our hearts into tears, and see if we can thus get them to run one into another? Oh that it might be, what sorrow soever it costs us!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum</cite>, (1653) | ch. 31, ‘The Cure of our Divisions’, with 14 Joining Principles, pp. 252-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>On the 29th of May, 1679, the day appointed for celebrating the restoration of [king] Charles [II, in 1660], a body of them amounting to eighty armed men, under the guidance of Sir Robert Hamilton, came to Rutherglen, where they extinguished the bonfires kindled in honour of the day, and affixed a declaration to the cross condemning all the proceedings of government since the Restoration; in confirmation of which testimony they publicly burnt at the cross all the acts which had been emitted against the work of the Reformation, “as our enemies,” said they, “perfidiously and blasphemously have burnt our holy covenants through several cities of these covenanted kingdoms.”… The country, however, was not prepared for a general rising, and no due means had been taken to follow up the movement, or to meet the consequences. The government took the alarm, and Claverhouse was despatched to the west with a body of dragoons, having unlimited power to kill and destroy all whom he found in arms… On Sabbath morning, the 1st of June, 1679, intelligence was brought to a large field-meeting held that day at Loudonhill, of the approach of Claverhouse and his dragoons; upon which all who were armed resolved to leave the meeting, face the soldiers, and, if possible, relieve the prisoners. Accordingly, about forty horse and one hundred and fifty or two hundred foot, came up with Claverhouse and his party near Drumclog, in the parish of Evandale, about a mile east from Loudonhill. The particulars of the skirmish which followed are well -known… The following are the simple facts, in which all authentic accounts agree. After a short and very warm engagement, Balfour of Burley with some horse, and Colonel Cleland with some of the infantry, boldly crossed the morass which lay between the combatants, and attacked the dragoons of Claverhouse with such impetuosity that they were soon put to flight, leaving about forty killed on the field. Claverhouse’s horse was shot under him, and he himself narrowly escaped. Before commencing the engagement he had given the word, “No quarter,” and ordered those who guarded King and the other persons to shoot them, in the event of his troops being worsted; but the soldiers were soon compelled to flee for their own safety, and the prisoners escaped. The dragoons taken by the Covenanters received quarter, and were dismissed without harm, much to the displeasure of Hamilton, who insisted on their being dealt with as they intended to have dealt with the Covenanters. Panic-struck and filled with rage at his defeat, Claverhouse fled from the field of Drumclog, and never slackened rein till he reached Glasgow. Thither he was pursued by Hamilton, who made an attempt to take the city; but the inhabitants not only refused to rise, but shamefully maltreated some of his soldiers, who fell wounded in their streets. At this time Sir Robert’s troops amounted, according to his own account, to about six thousand horse and foot. They consisted, it is true, chiefly of raw undisciplined countrymen, ill supplied with arms or ammunition; but had they been properly managed, such was their courage and determination, that they might have kept the royal troops in check, and procured, if not victory, at least honourable terms. Unhappily, however, a spirit of disunion began to appear among their leaders, who, instead of combining against the common enemy, spent their time in hot disputes about points in which the most hearty and genuine friends of the Presbyterian cause differed from each other.</p></blockquote>

<blockquote><p>Mr. Robert Hamilton [1650–1701] was a gentleman of good family, being brother to Sir William Hamilton of Preston, to whose title and estates he would have succeeded, on his death, at the [Glorious] Revolution [1689], if he had not refused to own, or rather had not openly disowned, the authority of [King] William and Mary [of Orange]. He appears to have been a pious man and of good intentions, but of narrow views, severe in his temper, and altogether unqualified, by want of military talents and experience, for the command which he assumed, or which was conferred on him by the small body which proved successful in the skirmish at Drumclog [1679]. He is charged, and apparently not without reason, with having been active in pushing [Donald] Cargill, [Richard] Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert. This dissension was a main cause of the failure of the present attempt to redress national grievances. Hamilton and his party acted on the principle, that it was unlawful to associate, for vindicating their civil and religious rights, with any but those with whom they could join in church-communion; or, which amounts to the same thing, that it behoved them to introduce into the state of their quarrel, as appearing in arms, a condemnation of every thing in relation to the public interests of religion which was sinful or unscriptural;¹ a principle which, while it involved them in that very confounding of civil and ecclesiastical matters against which they inveighed so loudly under the name of Erastianism, tended to rivet the chains of servitude on themselves and the nation. ¹ [See ‘Not All Truths must be Preached in All Circumstances’ at ‘Pastors’ (RBO)] Into this error they appear to have been betrayed partly by mistaken notions of the controversy which had formerly arisen respecting the Public Resolutions [in the late-1640’s and early-1650’s].² What the more honest party at that period opposed was, the admitting to places of power and trust of such as had shown by their previous conduct that they were enemies to the reformation introduced into church and state, and would use the power intrusted to them to overturn it. ² [See ‘The Scottish Resolutioner-Protester Controversy, 1650’s’ (RBO)] This could not be said of those who had accepted of or acquiesced in the Indulgence,³ and still less of those whom Hamilton’s friends wrangled with so fiercely, who protested solemnly that they disapproved of the Indulgence, and whose former conduct vouched for the sincerity of their protestations. ³ [See the ‘Intro’ at ‘Defenses of Scottish Covenanting &amp; the Indulgence &amp; Occasional Hearing Controversies, 1661-1688’ (RBO)] Another remark is suggested by the facts here referred to. If ministers of the gospel would preserve their usefulness and respectability, they must guard their independence on the side of the people as well as of civil rulers. Provided they become “the servants of men,” it matters not much whether their masters wear a crown or a bonnet; and if, instead of going before the people to point out to them the path of duty, and checking them when they are ready to run into extremes, they wait to receive directions from them, and suffer themselves to be borne along by the popular stream, the consequences cannot fail to be fatal to both. Firm and tenacious of his purpose, the servant of the Lord, while gentle to all, ought to hold on the even tenor of his way, unmoved equally by the frown of the tyrant, the cry of the multitude, and the dictates of forward individuals, good and well-meaning men it may be, but who ” cannot see afar off,” and just need the more to be led that they think themselves capable of being leaders. An opposite conduct on the part of two or three ministers tended to foster those extravagant opinions and practices adopted by some presbyterians at this period, which discredited the cause for which they appeared, and which their best friends, though they may excuse, will not be able to defend, and should not seek to vindicate.</p></blockquote>

y+under+the+name+of+Erastianism%2C+tended+to+rivet+the+chains+of+servitude+on+themselves+and+the+nation.+%C2%B9+%5BSee+%E2%80%98Not+All+Truths+must+be+Preached+in+All+Circumstances%E2%80%99+at+%E2%80%98Pastors%E2%80%99+%28RBO%29%5D+Into+this+error+they+appear+to+have+been+betrayed+partly+by+mistaken+notions+of+the+controversy+which+had+formerly+arisen+respecting+the+Public+Resolutions+%5Bin+the+late-1640%E2%80%99s+and+early-1650%E2%80%99s%5D.%C2%B2+What+the+more+honest+party+at+that+period+opposed+was%2C+the+admitting+to+places+of+power+and+trust+of+such+as+had+shown+by+their+previous+conduct+that+they+were+enemies+to+the+reformation+introduced+into+church+and+state%2C+and+would+use+the+power+intrusted+to+them+to+overturn+it.+%C2%B2+%5BSee+%E2%80%98The+Scottish+Resolutioner-Protester+Controversy%2C+1650%E2%80%99s%E2%80%99+%28RBO%29%5D+This+could+not+be+said+of+those+who+had+accepted+of+or+acquiesced+in+the+Indulgence%2C%C2%B3+and+still+less+of+those+whom+Hamilton%E2%80%99s+friends+wrangled+with+so+fiercely%2C+who+protested+solemnly+that+they+disapproved+of+the+Indulgence%2C+and+whose+former+conduct+vouched+for+the+sincerity+of+their+protestations.+%C2%B3+%5BSee+the+%E2%80%98Intro%E2%80%99+at+%E2%80%98Defenses+of+Scottish+Covenanting+%26+the+Indulgence+%26+Occasional+Hearing+Controversies%2C+1661-1688%E2%80%99+%28RBO%29%5D+Another+remark+is+suggested+by+the+facts+here+referred+to.+If+ministers+of+the+gospel+would+preserve+their+usefulness+and+respectability%2C+they+must+guard+their+independence+on+the+side+of+the+people+as+well+as+of+civil+rulers.+Provided+they+become+%E2%80%9Cthe+servants+of+men%2C%E2%80%9D+it+matters+not+much+whether+their+masters+wear+a+crown+or+a+bonnet%3B+and+if%2C+instead+of+going+before+the+people+to+point+out+to+them+the+path+of+duty%2C+and+checking+them+when+they+are+ready+to+run+into+extremes%2C+they+wait+to+receive+directions+from+them%2C+and+suffer+themselves+to+be+borne+along+by+the+popular+stream%2C+the+consequences+cannot+fail+to+be+fatal+to+both.+Firm+and+tenacious+of+his+purpose%2C+the+servant+of+the+Lord%2C+while+gentle+to+all%2C+ought+to+hold+on+the+even+tenor+of+his+way%2C+unmoved+equally+by+the+frown+of+the+tyrant%2C+the+cry+of+the+multitude%2C+and+the+dictates+of+forward+individuals%2C+good+and+well-meaning+men+it+may+be%2C+but+who+%E2%80%9D+cannot+see+afar+off%2C%E2%80%9D+and+just+need+the+more+to+be+led+that+they+think+themselves+capable+of+being+leaders.+An+opposite+conduct+on+the+part+of+two+or+three+ministers+tended+to+foster+those+extravagant+opinions+and+practices+adopted+by+some+presbyterians+at+this+period%2C+which+discredited+the+cause+for+which+they+appeared%2C+and+which+their+best+friends%2C+though+they+may+excuse%2C+will+not+be+able+to+defend%2C+and+should+not+seek+to+vindicate.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Sr.%2C+Memoirs+of+Mr.+William+Veitch%2C+and+George+Brysson%2C+Written+by+Themselves%2C+ed.+Thomas+M%E2%80%99Crie+%28Edinburgh%3A+William+Blackwood%2C+1825%29%2C+%E2%80%9CBiographical+Notices+of+James+Ure+of+Shargarton%E2%80%9D%2C+pp.+452-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32fce1c9ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32fce1c9ef.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=Mr.%20Robert%20Hamilton%20%5B1650%E2%80%931701%5D%20was%20a,and%20should%20not%20seek%20to%20vindicate&amp;text=Mr.%20Robert%20Hamilton%20%5B1650%E2%80%931701%5D%20was%20a%20gentleman%20of&amp;text=to%20defend%2C%20and%20should%20not%20seek%20to%20vindicate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Unhappily, however, a spirit of disunion began to appear among their leaders, who, instead of combining against the common enemy, spent their time in hot disputes about points in which the most hearty and genuine friends of the Presbyterian cause [outside the establishment] differed from each other. These disputes referred to the indulgence; and it may appear strange that there should have been any controversy about a subject with regard to the sinfulness of which all of them were agreed. The question agitated was not whether the indulgence was lawful, but whether the acceptance of it should be expressly condemned in the proclamation to be made by those who were in arms, and numbered among their causes of fasting. This was opposed by some as inexpedient, because it would hinder many from joining them who were cordial friends to Presbytery; and it was proposed that this point should be reserved for the determination of a free General Assembly.¹ At the head of this party was Mr. John Welsh, whose expulsion from Irongray was formerly noticed, and who was not only in his own judgment opposed to the indulgence, but had been intercommuned for preaching in the fields for many years. Among all the eighteen ministers present, there was not one who had accepted the indulgence, or who approved of it. ¹ M’Crie’s Miscellaneous Writings, Review of Tales, &amp;c, p. 437. Sixteen of these ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron,² and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ² Richard Cameron was not present at Bothwell, being at that time in Holland, but he returned to Scotland shortly after. He declared to the ministers who licensed him, “that he would be a bone of contention among them; for if ever he preached against a national sin in Scotland, it should be against the indulgence, and for separation from the indulged.” [P. Walker’s Biograph. Presbyter, i. 292) ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians. On the present occasion they insisted that there should be inserted in the statement of their quarrel a decided condemnation of those who had taken the benefit of the indulgence; and proceeding on a mistaken view of the principles advocated by the Church of Scotland in the time of the Engagement, and by the Protesters in their contendings against the public resolutions [in the late-1640’s and early-1650’s], they refused to admit any into their ranks but those who would condemn and testify against the indulgence.† † M’Crie’s Memoirs of Veitch, &amp;c., p. 453… The violence, pertinacity, and extravagance of this party, prevailed over the more sober counsels of their brethren; and the consequence was, that several of the latter left the army in disgust. Still, however, the great body of the people remained, and though placed in the most unfavourable circumstances for meeting the enemy, they drew up with determined front at Bothwell Bridge, where they awaited their approach. The Covenanters behaved with the utmost gallantry, but, overpowered by superior numbers, they soon gave way, and the royal army obtained an easy victory over troops divided and disheartened by the conduct of their leaders.</p></blockquote>

— Thomas M’Crie Jr., The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875), pp. 328-331">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUnhappily%2C+however%2C+a+spirit+of+disunion+began+to+appear+among+their+leaders%2C+who%2C+instead+of+combining+against+the+common+enemy%2C+spent+their+time+in+hot+disputes+about+points+in+which+the+most+hearty+and+genuine+friends+of+the+Presbyterian+cause+%5Boutside+the+establishment%5D+differed+from+each+other.+These+disputes+referred+to+the+indulgence%3B+and+it+may+appear+strange+that+there+should+have+been+any+controversy+about+a+subject+with+regard+to+the+sinfulness+of+which+all+of+them+were+agreed.+The+question+agitated+was+not+whether+the+indulgence+was+lawful%2C+but+whether+the+acceptance+of+it+should+be+expressly+condemned+in+the+proclamation+to+be+made+by+those+who+were+in+arms%2C+and+numbered+among+their+causes+of+fasting.+This+was+opposed+by+some+as+inexpedient%2C+because+it+would+hinder+many+from+joining+them+who+were+cordial+friends+to+Presbytery%3B+and+it+was+proposed+that+this+point+should+be+reserved+for+the+determination+of+a+free+General+Assembly.%C2%B9+At+the+head+of+this+party+was+Mr.+John+Welsh%2C+whose+expulsion+from+Irongray+was+formerly+noticed%2C+and+who+was+not+only+in+his+own+judgment+opposed+to+the+indulgence%2C+but+had+been+intercommuned+for+preaching+in+the+fields+for+many+years.+Among+all+the+eighteen+ministers+present%2C+there+was+not+one+who+had+accepted+the+indulgence%2C+or+who+approved+of+it.+%C2%B9+M%E2%80%99Crie%E2%80%99s+Miscellaneous+Writings%2C+Review+of+Tales%2C+%26c%2C+p.+437.+Sixteen+of+these+ministers+while+they+condemned+the+Erastianism+of+the+indulgence%2C+and+deplored+the+conduct+of+their+brethren+who+had+accepted+it%2C+were+not+prepared+to+exclude+them+from+their+ranks%2C+or+refuse+aid+from+them+in+the+common+cause.+Though+they+themselves+could+not+conscientiously+submit+to+the+restrictions%2C+or+the+acknowledgments+implied+in+that+insidious+measure%2C+they+were+disposed+to+make+allowances+for+such+of+their+brethren+as+had+yielded+under+strong+temptation+or+plausible+arguments%3B+and+they+argued%2C+that+whatever+ecclesiastical+censure+their+conduct+might+afterwards+be+found+to+deserve%2C+to+deny+them+in+the+meantime+the+opportunity+of+vindicating+their+rights+and+liberties%2C+civil+and+religious%2C+by+excluding+them+from+the+army%2C+would+be+no+less+presumptuous+and+unjust+in+principle%2C+than+it+was+preposterous+in+the+present+circumstances+of+the+country.+This+liberal+view+of+the+subject+was+opposed+by+only+two+of+the+ministers%2C+namely%2C+Mr.+%5BDonald%5D+Cargill+and+Mr.+%5BThomas%5D+Douglas%3B+but+these+were+supported+by+a+considerable+number+of+the+lay+leaders+of+the+army%2C+at+the+head+of+whom+was+Sir+Robert+Hamilton.+Hamilton+appears+to+have+been+a+pious+man%2C+and+of+good+intentions%3B+but+of+narrow+views%2C+severe+in+his+temper%2C+and+altogether+unqualified+by+want+of+military+talents+and+experience%2C+for+the+command+which+he+assumed.+He+is+charged%2C+and+apparently+not+without+reason%2C+with+having+been+active+in+pushing+Cargill%2C+Cameron%2C%C2%B2+and+some+other+ministers%2C+to+those+extremes+which+produced+a+breach+between+them+and+their+brethren%2C+with+whom+they+had+until+of+late+acted+in+concert.%C2%B3+%C2%B2+Richard+Cameron+was+not+present+at+Bothwell%2C+being+at+that+time+in+Holland%2C+but+he+returned+to+Scotland+shortly+after.+He+declared+to+the+ministers+who+licensed+him%2C+%E2%80%9Cthat+he+would+be+a+bone+of+contention+among+them%3B+for+if+ever+he+preached+against+a+national+sin+in+Scotland%2C+it+should+be+against+the+indulgence%2C+and+for+separation+from+the+indulged.%E2%80%9D+%5BP.+Walker%E2%80%99s+Biograph.+Presbyter%2C+i.+292%29+%C2%B3+M%E2%80%99Crie%E2%80%99s+Mem.+of+Veitch%2C+%26c.%2C+Notices+of+James+Ure%2C+p.+452.+I+am+sorry+I+cannot+retract+the+judgment+here+pronounced+on+the+character+of+Hamilton%2C+the+correctness+of+which+has+been+challenged+by+some%2C+but+which+is+borne+out+by+the+whole+of+his+history%2C+and+refers+entirely+to+his+public+management%2C+without+any+reflection+either+on+his+piety%2C+his+integrity%2C+or+his+courage.+This+party+now+began+to+maintain+that+the+king+%5BCharles+II%5D%2C+by+assuming+an+Erastian+power+over+the+Church%2C+had+forfeited+all+right+to+the+civil+obedience+of+his+subjects%3B+a+principle+which+had+never+been+known+in+the+Church+of+Scotland+before%2C+and+which+was+afterwards+carried+to+a+great+extent+by+Richard+Cameron+and+his+followers%2C+who+from+him+were+termed+Cameronians.+On+the+present+occasion+they+insisted+that+there+should+be+inserted+in+the+statement+of+their+quarrel+a+decided+condemnation+of+those+who+had+taken+the+benefit+of+the+indulgence%3B+and+proceeding+on+a+mistaken+view+of+the+principles+advocated+by+the+Church+of+Scotland+in+the+time+of+the+Engagement%2C+and+by+the+Protesters+in+their+contendings+against+the+public+resolutions+%5Bin+the+late-1640%E2%80%99s+and+early-1650%E2%80%99s%5D%2C+they+refused+to+admit+any+into+their+ranks+but+those+who+would+condemn+and+testify+against+the+indulgence.%E2%80%A0+%E2%80%A0+M%E2%80%99Crie%E2%80%99s+Memoirs+of+Veitch%2C+%26c.%2C+p.+453%E2%80%A6+The+violence%2C+pertinacity%2C+and+extravagance+of+this+party%2C+prevailed+over+the+more+sober+counsels+of+their+brethren%3B+and+the+consequence+was%2C+that+several+of+the+latter+left+the+army+in+disgust.+Still%2C+however%2C+the+great+body+of+the+people+remained%2C+and+though+placed+in+the+most+unfavourable+circumstances+for+meeting+the+enemy%2C+they+drew+up+with+determined+front+at+Bothwell+Bridge%2C+where+they+awaited+their+approach.+The+Covenanters+behaved+with+the+utmost+gallantry%2C+but%2C+overpowered+by+superior+numbers%2C+they+soon+gave+way%2C+and+the+royal+army+obtained+an+easy+victory+over+troops+divided+and+disheartened+by+the+conduct+of+their+leaders.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Jr.%2C+The+Story+of+the+Scottish+Church%3A+from+the+Reformation+to+the+Disruption+%28London%3A+Blackie+%26+Son%2C+1875%29%2C+pp.+328-331&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4da3f6c3f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4da3f6c3f7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=Unhappily%2C%20however%2C%20a%20spirit%20of%20disunion,by%20the%20conduct%20of%20their%20leaders&amp;text=Unhappily%2C%20however%2C%20a%20spirit%20of%20disunion%20began%20to&amp;text=and%20disheartened%20by%20the%20conduct%20of%20their%20leaders" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

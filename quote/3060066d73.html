<blockquote><p>VIII. …We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted; or that salvation was purchased for him, whom God from eternity hath decreed to condemn: for this were a vain purchase… IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: and that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally, Christ may be said to reconcile all men to God by his death, after the same manner, that we say that the sun doth enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkness: Because if all and several men had their eyes, and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: after the same manner that the apostle saith, 1 Cor. 15:20, that ‘all men are made alive by Christ’, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 27, ‘How Far, &amp; in What Sense Christ Died for All? The Opinions of the Parties’ in The Anatomy of Arminianism… (1619; London, 1635), p. 196 ff. | Moulin first surveys the opinions and statements of the Arminians and then concludes the chapter with a positive statement of his (and others’) position:, pp. 198-199</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb7c5b46b9" data-kw="">
<blockquote><p>Is not Christ the Redeemer of all men? No: for He is a Redeemer neither to Pharaoh, nor Judas, neither unto Ciaphas, nor Herod, neither unto Julian, not in brief to all those that are damned or without hope, for whom they neither He died. Did Christ die for all men? His death was sufficient for all, say the Schoolmen, but effectual only for the Elect and them that are faithful. If we respect the virtue and force of Christ’s blood, it is sufficient for the redemption of all: but if we look upon the purpose and eternal counsel of God, and the goodwill of the Mediator, he died for the elect only. John 10:15, I lay down my life for my sheep, says Christ, and 17:9, I pray not for the world, but I pray for them whom thou have given me. Therefore He neither offered sacrifice for it, neither did He redeem it. And verse 19, For their sakes who believe, and whom the Father has given Me, I sanctify Myself. And Matt 26:28, My blood which is shed for many for the remission of sins.</p></blockquote>

</figure><figure class="quote" id="q-f1145c7e24" data-kw="">
<blockquote><p>Not all those who are called are predestined. For Christ said: ‘Many are called, but few are chosen’ (Mt. 22:14). But they contend that the calling is universal and that God would wish everyone saved. If it is understood as universal calling because it is offered to all and no one is excluded by name, it is true. If it is also called universal because the death of Christ and his redemption is sufficient for the whole world; that also is most true. But if this universality is meant so that He it is in everyone’s hand to receive the promises, I deny it: because to some it is given, to others it is not given. As if we did not see also that for a long time the very preaching of the Gospel was not given to many places, ages, and nations. God would have all to be saved, provided they believe. He gives faith to whom it seems good to Him. For He may justly do with his own what he will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Free Will &amp; Predestination” in Philosophical Works</cite>, trans. Joseph P. McLelland (Kirksville, MO: Sixteenth Century Essays &amp; Studies, 1994), vol 4, p. 332</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Now in the administration and government of a kingdom, these three things are necessarily required: 1. Laws; 2. Officers, Ministers, Judges, Courts; 3. Censures and punishments of offences. Which three being universally necessary in every Kingdom…</p></blockquote>

</figure><figure class="quote" id="q-53d9370573" data-kw="">
<blockquote><p>Here comes in that question, whether or not the power of the temporal magistrate (as such) be so derived from Christ, not only as God, but as Mediator, so that he is his deputy and vice-gerent. The negative may be made good by these following arguments: 1. The power of Christ’s deputies as Mediator is only ministerial, the power of servants or heralds (Lk. 22:25-26; Mt. 20:25-27): as Protestants prove against Papists in the controversy touching the supremacy of the Pope. But now the power of magistrates may be imperial and monarchical, and therefore it is not derived from Christ as He is Mediator unto his deputies. 2. All the deputies and vice-gerents of Christ as Mediator are obliged to promote the Kingdom and Gospel of Christ. But now heathenish magistrates that never heard, nor could hear of the name of Christ, are not bound to promote Christ’s Mediatory Kingdom and gospel: for they are invincibly ignorant thereof, and there can be no obligation without revelation (Jn. 15:22; Rom. 2:12). Therefore they are not the deputies and vice-gerents of Christ as Mediator, and therefore [they are] no magistrates as such: for, à quatenus ad de omni valet consequentia. 3. All the deputies and vice-gerents of Christ as Mediator have their commission from the Gospel; but now temporal magistrates have their commission at least from the secondary law of nature, the law of nations. But now the law of nature and nations dictates nothing of a Mediator, or anything relating unto Him as such. I should send the reader unto Mr. Gillespie in his Aaron’s Rod Blossoming, Book 2, chs. 6–7; to see farther of this subject, but because Mr. Baxter thinks Mr. Rutherford a more able disputant than Gillespie, I shall refer unto him, in his Lex &amp; Rex, Question 42, from pp. 422-433, as also his Divine Right of Church Government, [ch. 28] from pp. 600-42 where he prosecutes these and other arguments at large…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates</cite>, (Oxford, 1656), p. 43. Jeanes was an English presbyterian minister.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Here comes in that question, whether or not the power of the temporal magistrate (as such) be so derived from Christ, not only as God, but as Mediator, so that he is his deputy and vice-gerent. The negative may be made good by these following arguments: 1. The power of Christ’s deputies as Mediator is only ministerial, the power of servants or heralds (Lk. 22:25-26; Mt. 20:25-27): as Protestants prove against Papists in the controversy touching the supremacy of the Pope. But now the power of magistrates may be imperial and monarchical, and therefore it is not derived from Christ as He is Mediator unto his deputies. 2. All the deputies and vice-gerents of Christ as Mediator are obliged to promote the Kingdom and Gospel of Christ. But now heathenish magistrates that never heard, nor could hear of the name of Christ, are not bound to promote Christ’s Mediatory Kingdom and gospel: for they are invincibly ignorant thereof, and there can be no obligation without revelation (Jn. 15:22; Rom. 2:12). Therefore they are not the deputies and vice-gerents of Christ as Mediator, and therefore [they are] no magistrates as such: for, à quatenus ad de omni valet consequentia. 3. All the deputies and vice-gerents of Christ as Mediator have their commission from the Gospel; but now temporal magistrates have their commission at least from the secondary law of nature, the law of nations. But now the law of nature and nations dictates nothing of a Mediator, or anything relating unto Him as such. I should send the reader unto Mr. Gillespie in his Aaron’s Rod Blossoming, Book 2, chs. 6–7; to see farther of this subject, but because Mr. Baxter thinks Mr. Rutherford a more able disputant than Gillespie, I shall refer unto him, in his Lex &amp; Rex, Question 42, from pp. 422-433, as also his Divine Right of Church Government, [ch. 28] from pp. 600-42 where he prosecutes these and other arguments at large…”

<main class="wrap"><figure class="quote" id="q-1602ae4fbd" data-kw="">
<blockquote><p>Remember the Lords-day-Sabbath, the first day of the week, (unto which the seventh-day-Sabbath was translated by the Authority of Christ as appears by the after observation of that day by the Apostles and Apostolical Churches,) to keep it holy. This is the Princess and Queen of all days, This is the Glory of all the week. For, As on this day our blessed Saviour Rose from the dead triumphing victoriously over Death, Grave, Sin, and all our Spiritual Enemies: and thereby assured us of our Spiritual and Corporeal Resurrection by him. As on this day our Saviour vouchsafed many of his apparitions to his Disciples, instructing them and giving them commandments concerning the Kingdom of God. On this day the Holy Ghost was most miraculously poured forth upon the Apostles. On this day the Apostles and primitive Churches held their solemn Assemblies for the public worship of God.

This is the solemn Mart, and Market day for furnishing our Souls with all manner of Spiritual and Heavenly Provisions. This is that Solemn Season and sweet opportunity which Christ hath afforded and ordained for acquainting us with Himself and the Mysteries of his Kingdom, for maintaining our Communion with him in his Ordinances, for edifying and perfecting of us in all Spirituals. And as in the time of the Old Testament, The Sacrifices of the Sabbath-day were to be double to those on the week day: So our Spiritual Sacrifices on the Lords-days are to be twice so much as on any other day of the week; Especially, in Prayer and thanksgiving; in Reading the Scriptures, in Hearing the word preached, in Partaking the Lords Supper, in Catechizing, in Shewing Mercy to the poor, &amp;c. that so the sacred tincture and impressions of this day may remain fresh and lively upon your hearts all the week following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Tree of Life, or, The Natural Man Directed unto Christ (London, 1673), epistolary exhortation.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5b82d8f95" data-kw="">
<blockquote><p>19. 4. Although the day be wholly to be dedicated to the ends of a sacred rest before insisted on, yet, 1. Duties in their performance drawn out to such a length as to beget wearisomeness and satiety, tend not to edification, nor do any way promote the sanctification of the name of God in the worship itself. Regard, therefore, in all such performances is to be had:

1. Unto the weakness of the natural constitution of some, the infirmities and indispositions of others, who are not able to abide in the outward part of duties, as others can. And there is no wise shepherd but will rather suffer the stronger sheep of his flock to lose somewhat of what they might reach to in his guidance of them, than to compel the weaker to keep pace with them to their hurt, and it may be their ruin. Better a great number should complain of the shortness of some duties, who have strength and desires for a longer continuance in them, than that a few who are sincere should be really discouraged by being overburdened, and have the service thereby made useless unto them. I always loved in sacred duties that observation of Seneca concerning the orations of Cassius Severus, when they heard him, ‘Timebamus ne desineret,’ ‘We were afraid that he would end.’

2. To the spiritual edge of the affections of men, which ought to be whetted, and not through tediousness in duties abated and taken off.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), pp. 748-49</span></figcaption>

<blockquote><p>9. The strong, violent and firm persuasions of conscience in single persons, or in some communities of men, is not a sufficient indication of a moral law. The weak brother of whom St. Paul speaks durst not eat flesh, but thought it an impiety next to unpardonable, but he was abused: and there are at this day some persons, some thousands of persons against whose conscience it is to dress meat upon the Lord’s Day, or to use an innocent permitted recreation: Now when such an opinion makes a sect, and this sect gets firm confidents and zealous defenders, in a little time it will dwell upon the conscience as if it were a native there, whereas it is but a pitiful inmate and ought to be turned out of doors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., pp. 370-71</span></figcaption>

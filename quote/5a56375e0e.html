<main class="wrap"><figure class="quote" id="q-5a56375e0e" data-kw="">
<blockquote><p>11. As he that swears and keeps his allegiance to the king is a subject and member of the kingdom, though he be no member of any corporation; so, though he disown a thousand fellow subjects; yea, though he deny the authority of constable, justice, judge; so he that is devoted to Christ truly in the baptismal covenant, is a Christian, and a member of the universal Church, though he were of no particular church, or did disown a thousand members, or any particular officer of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation… (London: 1684), ch. 4</cite>, p. 23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ae997b8a40" data-kw="">
<blockquote><p>Worthy receivers, outwardly partaking of the visible elements in this sacrament,[n]… [n] 1 Cor. 11:28. …Wherefore all ignorant and ungodly persons, as they are unfit to enjoy communion with Him, so are they unworthy of the Lord’s table, and cannot, without great sin against Christ, while they remain such, partake of these holy mysteries,[p] or be admitted thereunto.[q] [p] 1 Cor. 11:27-29. 2 Cor. 6:14-16. [q] 1 Cor. 5:6,7,13. 2 Thess. 3:6,14,15. Matt. 7:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession of Faith 1646 | 29.7-8</cite></span></figcaption>

</figure><figure class="quote" id="q-db1e04fa84" data-kw="">
<blockquote><p>1. Particular converts are first converted into the Church-catholic entitive, and secondarily conjoined into particular consociations, for the more opportune enjoyment of ordinances actually and constantly. 2. Every member of a particular congregation is a member of the Church-catholic entitive, and that relation does primarily belong unto him. 3. External profession of the true faith and subjection to God’s ordinances is enough to make a man capable of being a member of the Church-catholic visible, and so also of a particular congregation, quoad externam formam [as far as the external form]. 4. By baptism members are visibly and ministerially admitted into the Church-catholic visible. 5. By excommunication rightly administered, an offender is cast out of the Church-catholic visible, as much as out of a particular congregation. 6. Federal holiness belongs to none primarily because [they are] born of members of a particular congregation, but [rather as they are] of the Church-catholic. 7. They that are only in the Church-catholic visible are not ‘without’ in the apostle’s sense [1 Cor. 5:12]. 8. Children of believing parents have right to baptism, though their parents were not members of any particular congregation, and [they] are debarred from their due if [they are] denied it. 9. Every visible believer is or ought to be a member of the particular Church wherein and among whom he dwells. [This ought to be qualified by regular circumstances conducing to edification.] 10. The being in the general Covenant [of Grace] gives right to the ordinances, and not any particular covenant; neither do we find any mention in Scripture of any particular covenant either urged or used at admission of members into a particular congregation, or at the constitution thereof. 11. The invisible members of the Church which have internal communion with Christ are also visible members and have external communion in external ordinances. 12. The departure of a member from a particular congregation and removal to another for convenience or by necessity is no sin; but departing from the Church-catholic, and ceasing to be a member thereof, is a sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Question 2, ‘Concerning Private Members’, pp. 257-8 of A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it… (London, 1650)</cite></span></figcaption>

<blockquote><p>3rd Conclusion. A visible profession of the truth and doctrine of godliness is that which essentially constitutes a visible church, and every member of the visible church; Only our [Independent] Brethren and we differ much about the nature of this profession which is required in members added to the Church. Our Brethren will have none members of the visible Church, but such as are satisfactory to the consciences of all the visible church, and give evidences so clear, as the judgement of discerning men can attain unto, that they are truly regenerated. We again do teach that the scandalously wicked are to be cast out of the Church by excommunication, and these of approved piety are undoubtedly members of the visible Church, so these of the middle sort are to be acknowledged members of the Church, though the Church have not a positive certainty of the judgement of charity that they are regenerated, so they be known: 1. to be baptized, 2. that they be free of gross scandals, 3. and profess that they be willing hearers of the doctrine of the Gospel. Such a profession as gives evidences to the positive certainty of the judgment of charity, of sound conversion, is not required to make and constitute a true, visible-Church.</p></blockquote>

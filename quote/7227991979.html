<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>

</figure><figure class="quote" id="q-b7cd1f6c82" data-kw="">
<blockquote><p>But now let us come to that which is commanded here concerning the Easterday of the Jews [Dt. 16:8], ‘Ye shall eat unleavened bread or cakes’ (says he) ‘by the space of six days, and there shall no leavened bread be found in your houses’… [Note that while the phrase occurs in a translation of a Bible verse, the term “space” is not explicitly in the Hebrew, nor the later KJV. Hence it reflects Calvin’s interpretation and use of that term and concept.] …when God commanded them to eat unleavened bread. And it was his will that this should be done, not only the same night that they ate the pascal lamb: but also that the same ceremony should be continued by the space of six days together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sermons of Mr. John Calvin upon the Fifth Book of Moses called Deuteronomy... (London, 1583), On Tuesday, Nov. 5, 1555, 97th Sermon, first on ch. 16</cite>, pp. 598-99</span></figcaption>

</figure><figure class="quote" id="q-8315798edf" data-kw="">
<blockquote><p>9. That it [Creation] is an action not successive, but instantaneous; for creation is not motion, as Thomas rightly proves, Summa Contra Gentiles bk. 2, chs. 17 and 19. Therefore God created each thing, if we consider them separately and in themselves, in an instant: although the creation of some succeeded to others in the span of six days, if we consider them collectively. But why God did not create all things at once, no reason besides his will can be adduced. For the twofold διασκοπία [scope] which is usually adduced from Ambrose, Hexaemeron, bk. 1, ch. 7, and Augustine, On Genesis, seems to me indeed, to speak truly, insufficiently solid: namely so that hence it might more openly be established that the world was founded not from eternity, but in time; and that men might so much the more distinctly and attentively meditate on the individual works of God. As if namely we would less meditatively and attentively [consider] the soul of man, or the animation [ensoulment] of the fetus, or the sun, or the hypostatic union of Christ, because God effected those works in a moment. But that reason which Augustine adduces for the time of six days in bk. 4, On the Trinity, and bk. 4, On the Literal Meaning of Genesis, ch. 1, namely that the number six is the first perfect [number], is plainly atheological, and savors of Kabbalistic superstitions: Petrus Bongus, On the Mysteries of Numbers, on the number six, p. 268, thus urges this, that he does not fear to write: For the number six is said to be sacred, and perfect not only because in this number of days all the species of things were founded, as William Hamerus had thought, following Pope Gregory the Great, bk. 35, ch. 20, Moralia, but also for that reason God perfected his works in six days, because six is perfect, and sacrosanct. Therefore even if those things were not, it would be perfect; but unless it itself were perfect, those things would not become perfect according to it: In the same chapter he adduces for this μυσταγωγία Kabbalah Clement of Alexandria, and Eusebius, who in the books of Evangelical Preparation, cites Clement. But it can be said that they argued more to the man, than from the truth of the thing and their own sense. For thus Clement, bk. 5, Stromata, p. 432: The βάρβαρος φιλοσοφία indeed knows one world, which is perceived by the intellect, but another sensible, etc. καὶ τὸν μὲν ἀρχέτυπον, and that indeed archetypal it attributes to the monad as that which is perceived by the intellect: but this sensible [world], to the number six. For among the Pythagoreans marriage is called the number six, as that which is the generative number. We reject: 1. The opinion of those, who establish that the entire world was founded in an instant, or at once, and afterwards the individual [things] were successively separated from each other. Maimonides in The Guide of the Perplexed, pt. 2, ch. 30. Of the same opinion are Philo, bk. 1, Allegories, Cajetan on Gen. 1, Melchior Cano in Bañez on ST, pt. Ia, q. 74, art. 2, Augustine, bk. 11, On the Literal Meaning of Genesis, ch. 22. We reject: 2. Those, who Kabbalistically deduce the duration of the world and other mysteries from the six days of the creation of the world. Of which sort were not only Jews, but also some from the Christians: Concerning which perhaps we must speak elsewhere in the chapter ‘On the End of the World, or on the Signs of the Times’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2 Latin | On Creation, pt. 1</cite>, p. 112</span></figcaption>

lliam+Hamerus+had+thought%2C+following+Pope+Gregory+the+Great%2C+bk.+35%2C+ch.+20%2C+Moralia%2C+but+also+for+that+reason+God+perfected+his+works+in+six+days%2C+because+six+is+perfect%2C+and+sacrosanct.+Therefore+even+if+those+things+were+not%2C+it+would+be+perfect%3B+but+unless+it+itself+were+perfect%2C+those+things+would+not+become+perfect+according+to+it%3A+In+the+same+chapter+he+adduces+for+this+%CE%BC%CF%85%CF%83%CF%84%CE%B1%CE%B3%CF%89%CE%B3%CE%AF%CE%B1+Kabbalah+Clement+of+Alexandria%2C+and+Eusebius%2C+who+in+the+books+of+Evangelical+Preparation%2C+cites+Clement.+But+it+can+be+said+that+they+argued+more+to+the+man%2C+than+from+the+truth+of+the+thing+and+their+own+sense.+For+thus+Clement%2C+bk.+5%2C+Stromata%2C+p.+432%3A+The+%CE%B2%CE%AC%CF%81%CE%B2%CE%B1%CF%81%CE%BF%CF%82+%CF%86%CE%B9%CE%BB%CE%BF%CF%83%CE%BF%CF%86%CE%AF%CE%B1+indeed+knows+one+world%2C+which+is+perceived+by+the+intellect%2C+but+another+sensible%2C+etc.+%CE%BA%CE%B1%E1%BD%B6+%CF%84%E1%BD%B8%CE%BD+%CE%BC%E1%BD%B2%CE%BD+%E1%BC%80%CF%81%CF%87%CE%AD%CF%84%CF%85%CF%80%CE%BF%CE%BD%2C+and+that+indeed+archetypal+it+attributes+to+the+monad+as+that+which+is+perceived+by+the+intellect%3A+but+this+sensible+%5Bworld%5D%2C+to+the+number+six.+For+among+the+Pythagoreans+marriage+is+called+the+number+six%2C+as+that+which+is+the+generative+number.+We+reject%3A+1.+The+opinion+of+those%2C+who+establish+that+the+entire+world+was+founded+in+an+instant%2C+or+at+once%2C+and+afterwards+the+individual+%5Bthings%5D+were+successively+separated+from+each+other.+Maimonides+in+The+Guide+of+the+Perplexed%2C+pt.+2%2C+ch.+30.+Of+the+same+opinion+are+Philo%2C+bk.+1%2C+Allegories%2C+Cajetan+on+Gen.+1%2C+Melchior+Cano+in+Ba%C3%B1ez+on+ST%2C+pt.+Ia%2C+q.+74%2C+art.+2%2C+Augustine%2C+bk.+11%2C+On+the+Literal+Meaning+of+Genesis%2C+ch.+22.+We+reject%3A+2.+Those%2C+who+Kabbalistically+deduce+the+duration+of+the+world+and+other+mysteries+from+the+six+days+of+the+creation+of+the+world.+Of+which+sort+were+not+only+Jews%2C+but+also+some+from+the+Christians%3A+Concerning+which+perhaps+we+must+speak+elsewhere+in+the+chapter+%E2%80%98On+the+End+of+the+World%2C+or+on+the+Signs+of+the+Times%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+2+Latin+%7C+On+Creation%2C+pt.+1%2C+p.+112&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8315798edf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8315798edf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=9.%20That%20it%20%5BCreation%5D%20is%20an,on%20the%20Signs%20of%20the%20Times&amp;text=9.%20That%20it%20%5BCreation%5D%20is%20an%20action%20not&amp;text=World%2C%20or%20on%20the%20Signs%20of%20the%20Times" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

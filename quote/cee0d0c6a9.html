<main class="wrap"><figure class="quote" id="q-cee0d0c6a9" data-kw="">
<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands-leiden.html">Netherlands Leiden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Egbert Watson Smith, The Creed of the Presbyterians (New York, 1901)</cite>, pp. 76-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3281fdd53" data-kw="">
<blockquote><p>…it is the duty of a Christian Magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. But how they that serve in any public civil office may leave their charge in the time of the plague, I do not see; … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing; he shall doubtless do very well both for the sick and the whole, and shall take away many questions which in this argument are wont [accustomed] to be raised:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague… (London, 1665)</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london.html">London</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles Creighton, A History of Epidemics in Britain, from A.D. 664 to the Extinction of the Plague [1666] (Cambridge, 1891)</cite>, p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-d88f5496f0" data-kw="">
<blockquote><p>May 21, 1585 Wilsoun, Russell, Walker, put to Assize. Finds expedient that Thomas Wilsoun, traveler, presently infected with the pest[ilence] and in point of death, and also Margaret Russell and Jonet Walker, her daughter, be incontinent [not containing themselves] put to the knowledge of an assize [judgment] for having of the pest and known the same concealing thereof and repairing amongst our Sovereign Lord’s lieges [lands] openly, to the infection of some and hazard of many, and being found culpable in any point of the premises, to be immediately execut[ed] to the death at the Stray Mercat. … May 28, 1585 Masters of the College. The bailies and a part of the council being convened, and understanding be master Robert Rollock and master Duncane Nairne, masters of the College, that the whole students, through the fire and brute of the pestilence, has left the schools and thereby they have nothing to do, desiring therefore licence of the town to depart and use their friends for a season, offering to return to their cuir [chair?] and service whensoever the town shall think expedient, upon advertisement to be made in their names be master Alexander Guthre, their clerk. Which desire the said bailies and council thought reasonable, and therefore willingly granted and consented thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-examples.html">Civil Examples</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of Edinburgh, Scotland 1585 | ‘Extracts from the Records: 1585, Apr-June’, in Extracts From the Records of the Burgh of Edinburgh, 1573-1589, ed. J D Marwick (Edinburgh, 1882), pp. 406-430. British History Online</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-aca0dbf1a1" data-kw="">
<blockquote><p>Besides these three causes of unsatisfiableness, God Himself doth justly put that property and poison into all worldly things doted upon, and desired immoderately, that they shall plague the heart that pursues them; by filling it still with a furious and fresh supply of more greediness, longings, jealousies, and many miserable discontentments: So that they become unto it, as drink unto a drunkard, a man in a hydropicus, dropsy, or burning fever, serve only to inflame it with new heat, and fiery additions of insatiable thirst and inordinate lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some General Directions for a Comfortable Walking with God… (London, 1626) 1625 was a plague year.</cite>, pp. 226-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

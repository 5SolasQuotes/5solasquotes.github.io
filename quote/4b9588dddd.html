<main class="wrap"><figure class="quote" id="q-4b9588dddd" data-kw="">
<blockquote><p>The whole divine essence is in every one of the three persons; but it was incarnated only in the second person of the Word, and not in the person of the Father, or of the Holy Ghost, for three reasons:—

First, That God the Father might the rather set forth the greatness of his love to mankind, in giving his first and only-begotten Son to be incarnated, and to suffer death for man’s salvation.

Secondly, That he who was in his divinity the Son of God, should be in his humanity the Son of man: lest the name of Son should pass to another, who by his eternal nativity was not the Son.

Thirdly, Because it was meetest that that person, who is the substantial image of his eternal Father, should restore in us the spiritual image of God, which we had lost. In the incarnation, the Godhead was not turned into the manhood, nor the manhood into the Godhead; but the Godhead, as it is the second person or Word, assumed unto it the manhood, that is, the whole nature of man, body and soul; and all the natural properties and infirmities thereof, sin excepted (Heb. iii. 17, 18; iv. 15.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), p. 7.</span></figcaption>

</figure><figure class="quote" id="q-56ca4a6008" data-kw="">
<blockquote><p>Although he took on him those infirmities which belong unto our human nature as such, and are inseparable from it until it be glorified, yet he took none of our particular infirmities which cleave unto our persons, occasioned either by the vice of our constitutions or irregularity in the use of our bodies. Those natural passions of our minds which are capable of being the moans of affliction and trouble, as grief, sorrow, and the like, he took upon him; as also those infirmities of nature which are troublesome to the body, as hunger, thirst, weariness, and pain,—yea, the purity of his holy constitution made him more highly sensible of these things than any of the children of men;—but as to our bodily diseases and distempers, which personally adhere unto us, upon the disorder and vice of our constitutions, he was absolutely free from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, Pneumatologia, or a Discourse Concerning the Holy Spirit, bk. 2, ch. 3, p. 167</span></figcaption>

</figure><figure class="quote" id="q-03c94e9d27" data-kw="">
<blockquote><p>It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-m-williams.html">Scott M. Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Person’ in Patristic &amp; Medieval Christian Theology’</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-5142552d4b" data-kw="">
<blockquote><p>God promised through the prophet Jeremiah [31:31, 32] that he himself would make a new covenant with us, not like that covenant which he came to regret with the fathers, when he led them from the land of Egypt. Because they made the covenant void. But this was to be the covenant: “I will put my law in your midst, and I will write my law in your heart and I will be your God and you will be my people.” Because, he will have been propitiated, he might no more remember our iniquities and our sins (Jeremiah 31; Hebrews 8). Likewise, this covenant promised to us knowledge of the true God which also embraces the free forgiveness of sins in Christ and also the he might beget from himself, renewal of man to the image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia 1.1.1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93fca1848a" data-kw="parties">
<blockquote><p>There is not the same signification attached to God’s covenant in the Scriptures. It denotes properly a pact and agreement entered into between God and man, consisting partly in a stipulation of duty (or of the thing to be done) and partly in the promise of a reward (which is the meaning in Gen. 17:2 where God is said to wish to make a covenant with Abraham). At one time it is taken improperly for a simple promise (as the promise not to destroy the world again by a flood is called a covenant, Gen. 9:9). At another time, it is taken metonymically for the symbols and sacraments of a covenant: as circumcision is called a covenant (Gen. 17); the eucharistic “cup” is said to be “the new testament in the blood of Christ” (Lk. 22:20), i.e., a sign and seal of it; then for “the tables of the covenant” laid up in the ark (1 K. 8:21); again for the “covenanted people,” as the people of God are called “the holy covenant” (Dan. 11:28, 30); and for the Messiah, the foundation of that covenant, in whom it is made with us (“I will give thee for a covenant of the people,” Is. 49:8). But we, dismissing the improper significations, attend here to the proper signification, when we dispute concerning the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.1.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/nature-of-the-covenant-of-grace.html">Nature of the Covenant of Grace</a> › <a href="../topics/the-covenant-of-grace/nature-of-the-covenant-of-grace/promise-condition-parties.html">Promise, condition, parties</a></span></div>

</figure><figure class="quote" id="q-44b9d08482" data-kw="">
<blockquote><p>In the Gospel of John, we read the English verb “to believe” fifty-four times in the English Standard Version. By contrast, the original Greek verb πιστεύω (pisteuō), which underlies and is commonly translated as forms of “believe,” occurs ninety-eight times in John’s Gospel. This is no small feature. Central to Jesus’ message as recorded by John is belief in him—belief that he is the Son of God, sent by God, so that many would believe in him and have eternal life. Yet, in our age belief can be difficult. Doubts arise in our mind. Afflictions of this life especially challenge us at times and lead us to wonder: Is it all real? Did Jesus really live, die on a cross, rise from the dead on the third day, and ascend into heaven where he rules over all today? Nevertheless, even in Jesus’ day many did not believe, though they saw him and witnessed the signs he performed to prove that he was the Messiah sent by God to save his people. It is at times like this when unbelief assaults us with questions, uncertainty, and hesitancy, that we should turn to the Gospel of John to hear Jesus call us to belief in him—to believe, with good reason, that he is our Lord and Savior, who gives eternal life to all who believe in him. For example, John 3:16, which is one of the most commonly memorized verses in the Bible, reminds us of God’s love for whoever believes in Jesus and that, by believing, they should not perish but have eternal life. Hear the comfort of these words. Are you suffering and even facing the possibility of death sooner than later from disease or illness? Be comforted by the hope of eternal life—hope that is grounded in the Savior, Christ Jesus, who calls us to believe him when he promises the abundance of eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Believe in Jesus Christ” | January 26, 2026</cite></span></figcaption>

<blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>

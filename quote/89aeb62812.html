<blockquote><p>[Margin Note:] It’s false that Christ so died for us, that is, in our stead, as that in our stead He fulfilled the Law and performed all active obedience and passive by doing and dying that God can require of us. 2. Christ may be said to die for us, as if we had substituted Him in our place, in so rigid a sense as if He had been made our surety to fulfill both the preceptive and active, and also the satisfying and suffering part of the Law in our room. This may please Antinomians, but a doubt it is, if it stand with the truth: For then whatever we, yea all mortal men be (for Christ died for them all, as many teach) most wicked, yet Christ’s active and surety, and cautionary righteousness should be ours; and though we should never believe, yet Christ who fulfilled the Law, and preceptive as well as the threatening part, must have believed for all that He died for, and what need we then in our persons either [to] believe or repent? It’s true, we need not perform any active obedience, as a part of active fulfilling of that Covenant of Works, which either must have all or no obedience. If it be said that alio titulo, ‘upon another account’ of thankfulness to our ransom-payer we owe active obedience: Yet all [persons] that Christ died for, both actively and passively, must be perfectly righteous and justified, [He] having paid the most perfect active and passive obedience that the Law required, though we never believe, and Christ must have paid the active part of justifying faith for us. And why, but we should be formally justified in Him without faith also? As also, God, not we, laid our sins upon Christ, Isa. 53:6; 2 Cor. 5:21, and therefore we did commissionate and substitute Christ to die in our room.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 3, pp. 246-47</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbb9050d7e" data-kw="">
<blockquote><p>The great question is, of which sort is our righteousness whereby we are justified? I answer, of the second sort [Christ’s passive righteousness], which yet is no derogation from it: for though it be not a righteousness so honoring ourselves, yet is it as excellent in Christ, and honorable to Him. And this first kind of righteousness [Christ’s active righteousness] as it is in Christ, cannot, retaining its own form, be made ours. And to that the Papists arguments will hold good. The Law commanded our own personal obedience, and not another for us; We did not so personally obey, we did not really obey in Christ: and God does not judge us to do what we did not; If we had, yet it would not have made us just: for one sin will make us unjust, though we were never so obedient before and after; Therefore if we had obeyed in Christ, and yet sinned in ourselves, we are breakers of the Law still. And so our righteousness cannot be of the first sort. This breach therefore must be satisfied for, and consequently, our righteousness must be of the second sort: seeing both cannot stand in one person as before said. Christ indeed had both these kinds of righteousness, viz. the righteousness of perfect obedience; and the righteousness of satisfaction for disobedience. But the former only was his own personal righteousnes, not communicable to another under that notion, and in that form of ‘a righteousness by obeying’. The latter, was his righteousness, as he stood in our room, and was by imputation a sinner: and so is also our righteousness in and through Him. Yet the former [Christ’s active righteousness] (as I have proved before etc.) is ours too, and our righteousness too (though many divines think otherwise), but how? Not as retaining its form, in the former sense: but as it is also in a further consideration, a part of the righteousness by satisfaction: seeing that Christ’s very personal obediential righteousness was also in a further respect satisfactory.</p></blockquote>

</figure><figure class="quote" id="q-f8a786cf96" data-kw="">
<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no suffering for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, ch. 1 of The Covenant of Life Opened (1655), pp. 225-30, p. 230</span></figcaption>

</figure><figure class="quote" id="q-95f67b534e" data-kw="">
<blockquote><p>Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 4 What is our iustice &amp; 5 How Christ’s satisfaction is made our justice and righteousness, pp. 680-82</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.”

— Zacharias Ursinus, The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 4 What is our iustice &amp; 5 How Christ’s satisfaction is made our justice and righteousness, pp. 680-82">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+justice+or+righteousness%2C+that+is%2C+the+justice+or+righteousness+of+the+Gospel%2C+whereby+we+are+just+in+the+sight+of+God%2C+is+not+our+conformity+with+the+Law%3A+but+it+is+Christ%E2%80%99s+satisfaction+performed+unto+the+Law+for+us%2C+or+the+punishment%2C+which+He+sustained+for+us%2C+and+so+his+whole+humiliation+%28that+is%2C+his+taking+of+flesh%2C+his+undertaking+of+servitude%2C+penury%2C+ignominy%2C+and+infirmity%3A+his+suffering+of+that+bitter+passion+and+death%3A+all+which+He+did+undergo+for+us%2C+but+willingly%29+and+that+humiliation+and+satisfaction+freely+of+God+imputed+unto+us+his+faithful+and+believers.+1+Cor.+2%3A2%2C+%E2%80%98I+esteemed+not+to+know+anything+among+you%2C+save+Jesus+Christ+and+Him+crucified.%E2%80%99+Col.+2%3A10%2C+%E2%80%98Ye+are+complete+in+Him.%E2%80%99+Rom.+5%3A19%2C+%E2%80%98By+the+obedience+of+one+shall+many+be+made+righteous.%E2%80%99+Isa.+53%3A5-6%2C+%E2%80%98With+his+stripes+we+are+healed.+The+Lord+hath+laid+upon+him+the+iniquity+of+us+all.%E2%80%99+Now+that+Christ+might+perform+obedience+and+satisfy+for+us%2C+it+behoved+Him+to+be+our+Mediator%2C+being+by+Himself+just+and+holy%2C+Heb.+7%3A26%2C+%E2%80%98For+such+an+High-Priest+it+became+us+to+have%2C+holy%2C+harmeless%2C+undefiled%2C+separate+from+sinners%2C+and+made+higher+than+the+heavens.%E2%80%99+All+these+things+are+true+perfectly+and+wholly+in+Christ.+For+He+has+perfectly+fulfilled+the+Law+for+us%3A+1.+by+the+holiness+of+his+human+nature.+2.by+his+obedience%3A+for+He+became+obedient+unto+the+death%2C+even+the+death+of+the+cross%3A+And+the+former+fulfilling+of+the+law%2C+namely%2C+the+holiness+of+Christ%E2%80%99s+human+nature%2C+was+requisite+for+the+other%2C+even+for+his+obedience.+This+obedience+and+satisfaction+of+Christ+is+our+satisfaction%2C+and+our+proper+iustice%2C+for+which+we+please+God%2C+for+which+we+are+received+into+favor+with+God+the+Father%2C+and+which+is+imputed+unto+us.+That+former+fulfilling+of+the+Law+is+indeed+imputed+also+unto+us%2C+namely+the+humiliation+and+justice+or+righteousness+of+Christ%E2%80%99s+human+nature%2C+that+we+may+be+reputed+holy+before+God%3A+but+this+holiness+of+Christ+is+imputed+unto+us+for+his+obedience+or+satisfaction+sake%3A+because+He+satisfied+for+us+God%E2%80%99s+justice%2C+in+sustaining+eternal+punishment+and+pains%2C+which+we+should+have+sustained+everlastingly.+Hence+is+it%2C+that+the+effusion+of+Christ%E2%80%99s+blood+%28as+being+the+complement+and+consummation+of+Christ%E2%80%99s+satisfaction%29+is+only+said+to+be+our+justice+and+righteousness.+1+Jn.+1%3A7%2C+%E2%80%98The+blood+of+Jesus+Christ+cleanseth+us+from+all+sin%2C%E2%80%99+that+is%2C+not+only+from+that+which+is+past%2C+but+also+from+that+which+is+to+come.+%E2%80%A6+5.+How+Christ%E2%80%99s+satisfaction+is+made+our+justice+and+righteousness%3A+This+question+is+adjoined+because+it+seems+absurd+that+we+should+be+justified+by+that+which+is+another+man%E2%80%99s%2C+and+not+ours.+The+satisfaction+or+justice+of+Christ+is+made+ours%2C+or+applied+unto+us%2C+two+ways%2C+that+is%2C+by+a+double+application.+The+former+application+is+God%E2%80%99s%2C+who+in+respect+of+that+fulfilling+of+the+Law+performed+by+Christ%2C+accepts+us%2C+and+applies+the+same+unto+us%3B+that+is%2C+He+imputes+it%2C+no+less+than+if+we+had+never+sinned%2C+or+at+least+had+paid+and+suffered+sufficient+punishment+for+our+sins.+For+albeit+to+justify+signifies+to+make+just%2C+yet+in+the+Church+it+signifies+another+thing%2C+and+is+taken+in+another+sense.+Or+God+does+apply+it%2C+when+He+imputes+the+fulfilling+of+the+Law+performed+by+Christ+unto+us%2C+even+as+if+it+were+performed+by+us%2C+neither+will+at+all+punish+us.+But+to+impute%2C+is%2C+to+accept+Christ%E2%80%99s+satisfaction%2C+performed+to+this+end%2C+that+it+might+be+our+justice+and+righteousness.+We+then+also+apply+unto+us+the+fulfilling+of+the+Law+performed+by+Christ%2C+when+we+are+steadfastly+persuaded%2C+that+God+does+impute%2C+apply+and+give+it+unto+us%2C+and+for+it+reputes+us+for+just%2C+absolving+us+from+all+guilt%E2%80%A6+That+which+we+have+now+spoken+of+both+applications%2C+both+God%E2%80%99s%2C+and+ours%2C+does+manifestly+show+what+is+meant+in+this+place+by+justifying%3A+Which+is%2C+that%2C+to+justify%2C+is+not+to+make+one+just+who+is+uniust%3A+but+to+repute+him+for+just+and+righteous+who+is+uniust%2C+and+to+absolve+the+unjust+and+unrighteous+from+all+guilt%2C+and+not+to+punish+him%2C+and+this+for+another%E2%80%99s+justice+and+righteousness+imputed+by+faith+unto+us.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+%E2%80%98Of+Justification%E2%80%99%2C+4+What+is+our+iustice+%26+5+How+Christ%E2%80%99s+satisfaction+is+made+our+justice+and+righteousness%2C+pp.+680-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95f67b534e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95f67b534e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Our%20justice%20or%20righteousness%2C%20that%20is,righteousness%20imputed%20by%20faith%20unto%20us&amp;text=Our%20justice%20or%20righteousness%2C%20that%20is%2C%20the%20justice&amp;text=justice%20and%20righteousness%20imputed%20by%20faith%20unto%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-1d3367e33f" data-kw="">
<blockquote><p>Just as we say there is a certain merit ex congruo, so we shall say there is a certain reward ex congruo, which is owed rather of grace than of justice.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96e9c4f20c" data-kw="">
<blockquote><p>That objection of Durandus would have force if God rendered the reward to good works out of commutative justice; but since God has decreed to give rewards to those who work well out of distributive justice, it is not necessary that we properly give him anything. For neither do those who run for the prize give anything to the king, and yet the king is bound to give the prize to him who has outstripped the rest in the race. Let it stand, therefore, that the good works of the just merit eternal life out of justice, and so ex condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 6</span></figcaption>

</figure><figure class="quote" id="q-d1b630de69" data-kw="Grace and merit">
<blockquote><p>These are incompatible: to give a thing from grace and to give it from merit. For merit makes a thing due, while grace supposes it undue. Therefore whatever is given from grace cannot be given from merit, otherwise grace would not be grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“These are incompatible: to give a thing from grace and to give it from merit. For merit makes a thing due, while grace supposes it undue. Therefore whatever is given from grace cannot be given from merit, otherwise grace would not be grace.”

— Francis Turretin, Institutes of Elenctic Theology, 17.5.17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThese+are+incompatible%3A+to+give+a+thing+from+grace+and+to+give+it+from+merit.+For+merit+makes+a+thing+due%2C+while+grace+supposes+it+undue.+Therefore+whatever+is+given+from+grace+cannot+be+given+from+merit%2C+otherwise+grace+would+not+be+grace.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+17.5.17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd1b630de69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d1b630de69.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-546eb0fd3d" data-kw="Merit">
<blockquote><p>There now can be no merit in man with God by works whatsoever, either of congruity or of condignity. (1) They are not undue, but due; for whatever we are and can do, all this we owe to God, whose debtors we are on this account called (Lk. 17:10; Rom. 8:12). (2) Not one is ours, but all are gifts of grace and fruits of the Spirit (Jam. 1:17; Phil. 2:13; 2 Cor. 3:5). (3) They are not perfect, but alloyed as yet by various impurities (Rom. 7:18; Gal. 5:17, 18; Is. 64:6). (4) They are not equal to future glory because there is no proportion between the finite and temporary and the infinite and eternal (Rom. 8:18; 2 Cor. 4:17). (5) The reward promised to them is purely gratuitous and undue and so to be expected not from the internal merit of the work and its intrinsic worth, but only from the most free estimation of it by the one who crowns it (Rom. 6:23; 4:4; 11:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.7</span></figcaption>

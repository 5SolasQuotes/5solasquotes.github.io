<main class="wrap"><figure class="quote" id="q-a999b4fd42" data-kw="">
<blockquote><p>XXI. However, it is not possible for God to grant grace without a satisfaction corresponding to justice. For since He has given a law to man, denounced penalties for transgressors, and appointed judgment—and since He is, by nature, a judge—it cannot happen that in judging, He would act against the office of a just judge. But it would violate justice to justify and release the guilty without satisfaction, even if the guilty party repented. … XXVIII. From all this it is understood that there is no remission of sins without satisfaction, and no satisfaction except that which Christ, God manifested in the flesh, has perfectly rendered for us—being made sin and a curse for us (2 Cor. 5:21; Gal. 3:13), and then justified by the Father through His resurrection and glorification, receiving thereby the full acquittal (or apoche).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a002a9e32" data-kw="">
<blockquote><p>Regarding the first , the Arminians think that the death of Christ was not necessary for procuring salvation for men, and they believe that God could have pardoned sins without any satisfaction. The Orthodox [Reformed], indeed, believe that that way of saving the human race was the most fitting of all, since God was pleased to use it; yet most of them readily concede to the Arminians that it was not absolutely necessary, and they do not contend that God’s justice was to that extent inexorable. Amyraut believes that God’s justice is so inflexible, and the majesty of his laws so holy and inviolable, that it could not suffer sins to be pardoned without satisfaction. In this matter, he has surrounded the orthodox doctrine with a defense by which it is stripped by many others. He has, moreover, proved his opinion on this matter with arguments in his Theses on the Necessity of Satisfaction for Grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Declaration of the Faith of Moses Amyraut concerning the Errors of the Arminians</cite>, trans. AI by Onku (Salmur: Lesnerius, 1646), p. 5 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

</figure><figure class="quote" id="q-3dea9d2390" data-kw="">
<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 5, pp. 12-13</span></figcaption>

h%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3e5c57f66e" data-kw="">
<blockquote><p>…God, if we speak of his absolute power, without respect to his free decree, He could have pardoned sin without a ransom, and gifted all mankind and fallen angels with heaven, without any satisfaction of either the sinner or his Surety; for He neither punishes sin, nor tenders heaven to men or angels by necessity of nature–as the fire casts out heat, and the sun light—but freely:</p></blockquote>

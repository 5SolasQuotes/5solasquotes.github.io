<main class="wrap"><figure class="quote" id="q-81dff26696" data-kw="">
<blockquote><p>This Prediction [in 1 Samuel 8] then of such punishment to them by their Kings oppressing of them, cannot be a Law or punishment intended to other Nations being under a King, who have not provoked God in seeking a King as Israel had God threatened and imposed on the Jews and other Nations in Nebuchadnezzar’s time their putting their neck under his yoke, though he was not their hereditary Prince, but an invading enemy. From whence no man will gather (I hope) that any Nation are bound to yield to a foreign Enemy invading them.

Also God threatened that the Jews should be carried captives into other Countries, and there they should serve other gods, wood and stone, &amp;c. where he would not shew them any favour; I am sure no man will argue from hence, that this is a law for other captives to submit to (or was any excuse to them, much less a law) but a mere punishment to them, and warning to other, least in them also sin be punished with sin, which is the forest punishment of all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar</cite>, (London: John White, 1643), p. 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-360defc9b6" data-kw="">
<blockquote><p>Then he assumes that that Man who came down from above is without a mind, but that the Godhead of the Only-begotten fulfils the function of mind, and is the third part of this human composite, inasmuch as soul and body are in it on its human side, but not mind, the place of which is taken by God the Word.

This is not yet the most serious part of it; that which is most terrible of all is that he declares that the Only-begotten God, the Judge of all, the Prince of Life, the Destroyer of Death, is mortal, and underwent the Passion in His proper Godhead; and that in the three days’ death of His body, His Godhead also was put to death with His body, and thus was raised again from the dead by the Father.</p></blockquote>

</figure><figure class="quote" id="q-8cdbb56aac" data-kw="">
<blockquote><p>Be wise then, dear child of God, and look upon your present affliction as a chastening. “What son is he whom the father chastens not?” “As many as I love, I rebuke and chasten.” There is not a more profitable instrument in all God’s house than the rod. No honey was sweeter than that which dropped from the end of Jonathan’s rod, but that is nothing compared to the sweetness of the consolation which comes through Jehovah’s rod.

Our brightest joys are the birth of our bitterest griefs. When the woman has her travail pangs, joy comes to the house because a child is born—and sorrow is to us also, full often, the moment of the birth of our graces. A chastened spirit is a gracious spirit—and how shall we obtain it unless we are chastened? Like our Lord Jesus, we learn obedience by the things which we suffer. God had one Son without sin, but He never had a son without sorrow—and He never will while the world stands. Let us, therefore, bless God for all His dealings and in a filial spirit confess, “You, Lord, have chastened me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gratitude for Deliverance from the Grace. A Sermon Intended for Reading on Lord s-Day, January 3rd, 1892’ in The Metropolitan Tabernacle Pulpit: Volume 38</cite></span></figcaption>

</figure><figure class="quote" id="q-deaee5f238" data-kw="">
<blockquote><p>¶ Husband. Whether he have stroken and beaten his wife, either else put &amp; enforced her to such labours &amp; works, whereby she hath been brought a bed afore her time, or hurt the child in her womb.

¶ Wife. Whether by medicines, or labour, or dancing, or any other means, she have been the occasion of untimely birth, or otherwise of hurting the child within her.

Whether she have carefully tendered and cherished her babe being new born, looking so diligently and so tenderly unto it as her duty required. There be many women that may justly be charged with great negligence in this behalf, and that many ways.

Whether laying the babe in the same bed with her in the night, she have crushed and bruised it, or by over-lying, smothered and killed it.

Whether by her adulterous life, or by her scolding and brawling with any other, or by making complaint to her husband of others, she have been the cause to set her husband and the other party together by the ears whereby the one hath violently assailed, wounded, or killed the other.

Nurses are liable to the same faults that matrons and wives. Harlots and strumpets, drabs, curtizans, queens, and such as have nothing of virgins but the name only, are likewise infamous for procuring their barrenness, untimely births, and killing their children. They therefore in this behalf have great cause diligently to examine their consciences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 90-91.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

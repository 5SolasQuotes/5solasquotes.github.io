</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97cd29bf36" data-kw="">
<blockquote><p>From this passage let us learn, that we ought to contemplate the providence of God in such a manner as to ascribe to his almighty power the praise which it deserves for righteous government. Although the rectitude by which God regulates his judgments is not always apparent or made visible to us, still it is never lawful to separate his wisdom and justice from his power. But as the Scriptures very frequently state and clearly explain the reason why God does this or that, we ought carefully to examine the cause of his works.

That invention which the Schoolmen have introduced, about the absolute power of God, is shocking blasphemy. It is all one as if they said that God is a tyrant who resolves to do what he pleases, not by justice, but through caprice. Their schools are full of such blasphemies, and are not unlike the heathens, who said that God sports with human affairs. But in the school of Christ we are taught that the justice of God shines brightly in his works, of whatever kind they are, “that every mouth may be stopped,” (Romans 3:19,) and that glory may be ascribed to him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 152.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

oopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-38c11b3b1a" data-kw="">
<blockquote><p>By abstaining from all worldly concerns. This is the reason, as we have showed, why it is needful and proper that certain stated parts of time should be set apart to be devoted to religious exercises, because the state of mankind is such in this world that they are necessitated to exercise their minds and employ their thoughts about secular matters.

‘Tis therefore convenient that there should be stated times wherein all should be obliged to throw by all other concerns, that their minds might the more freely and with less entanglement be engaged in religious and spiritual exercises. We are therefore to do thus, or else we frustrate the very design of the institution of a sabbath. We are strictly to abstain from being outwardly engaged in any worldly thing, either in our actions in worldly business, or recreations; we are told to rest in remembrance [of the Lord Jesus Christ and his redemption].

We should be careful that we don’t encroach upon the sabbath at its beginning by busying ourselves about the world after the sabbath is begun. We should avoid talking about worldly matters and thinking about them. For whether we are outwardly concerning ourselves with the world or no, yet if our minds are upon it, we frustrate the end of the sabbath. The design of its separation from other days was that our minds might be disengaged from worldly things, and we are to avoid being outwardly concerned with the world only for this reason, because that can’t be without taking up our minds.

We ought therefore to give the world no place in our thoughts on the sabbath, but to abstract ourselves from all worldly concernment and maintain a watch over ourselves that the world does not encroach, as it is very apt to do; Isaiah 58:13, “if thou turn away thy foot from the sabbath, from doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the Lord, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 248.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-90bfd51876" data-kw="">
<blockquote><p>There is a great difference to be made in respect of Humiliation, and the measure of godly sorrow for it. For as the sin may exceed another, as much as the Camel doth a Gnat; so ought the sorrow as much as an Ocean doth a drop. Thus Peter goeth out, and weeps bitterly; he did not so for every defect, and spiritual imperfection in him, as for this abominable Apostasy.

We read also of the incestuous person, as he committed a sin, that was not so much as named among the Gentiles, so he manifested such sorrow as was scarce heard among Christians; insomuch that the Apostle was afraid of him, lest he should be overwhelmed with too much sorrow. Now if for every sin of infirmity there should be as much sorrow and humiliation, as for these crimson and scarlet sins, how would the whole life of man be but a continual trouble of soul? and in what darkness would he live always?

Although all thy continual failings ought to be matter of humiliation unto thee, yet when such as these shall break out, thy soul ought to set open the flood-gates of thy soul. Neither may this be thought a low mercenary way, as if the party so humbled did intend a compensation unto God. But all places of Scripture must be regarded, as those which speak of Christ’s glorious grace; so also those which speak of our duties.

… The Spirit of God doth not only in his Word reveal a greater wrath against such sins, but he doth also withdraw all those consolations and comforts which were in the heart before. So that a man thus offending, doth, as it were, bolt himself in a dark dungeon, and shut out all the beams of the Sun against him. Insomuch that although Assurance, and the consolations of the holy Ghost may consist with the weaknesses, and sinful infirmities of God’s people; yet they do not with the gross impieties they plunge themselves into, as appeareth in David, Psal. 51. who prayeth for the restoring of that salvation he had lost by his sin.

The Spirit of God is a Dove, and that delighteth not in noisome buildings. The Spirit of God may be grieved and quenched in respect of the fruits thereof: So that a man thus wounded for sin, feels a very hell in his heart, admits of no comfort. Neither can it be otherwise, for when we refuse the Spirit of God sanctifying, we presently repel it comforting. If we have not the heat of this Sun, neither shall we have the light thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 207-08.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-4b59b4279c" data-kw="">
<blockquote><p>Although Christians should condemn cruelty to animals, it is a mistake to prefer the good of animals to that of human beings:

[I]t is a perverse thing to love any Creature so well as Mankind: against those Men that make more of their Horses and Hounds than of their Wives; and against those Women which make more of a Monkey, or of a Parrot, or of a Spaniel, than of their Husbands.</p></blockquote>

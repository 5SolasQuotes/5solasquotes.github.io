<main class="wrap"><figure class="quote" id="q-a938100c5b" data-kw="">
<blockquote><p>Objection: But is not this an approven distinction, that persons are within the Covenant, either externally, professedly, visibly, or internally, really, or according to the intention of God? Therefore, such as are externally within the Covenant, are not really and indeed within the Covenant of Grace. Answer: The adverb really relates to the real fruit of the fulfilled covenant, and so such as are only externally within the covenant are not really within the covenant, for God never directed, nor intended to bestow the blessing covenanted, nor grace to perform the condition of the covenant upon them. But they are really covenanted and engaged by their consented profession to fulfill the covenant. And as the commands and threatenings of the covenant of grace lay on a real obligation upon such as are only externally in covenant, either to obey or suffer, so the promise of the covenant imposes an engagement and obligation upon such to believe the promise; but sometimes we say the promises of the covenant of grace are not really made to the reprobate within the visible church, because God intends and decrees to, and for them, neither the blessing promised, nor the saving grace to fulfill the condition or to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenant of Life Opened… (Edinburgh: Anderson, 1655), pt. 1</cite>, ch. 13; pp. 92-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<blockquote><p>XXI. Let us now lastly consider the threatenings, whether there be any such in this covenant. It cannot indeed be denied, but that, in the doctrine of Christ and the apostles, we frequently meet with very many comminations, which have their peculiar respect to the covenant of grace, and which could not have thus been set before us if there had been no such covenant. For instance,—whoever shall not believe in Christ—whoever shall despise the counsel of God against his own soul—whoever shall not obey the Gospel, shall be condemned. And these threatenings seem to be distinguished from those which are evidently legal; such as the following: “Cursed is he that continueth not in all things,” &amp;c. Yet, if we would weigh the matter narrowly, the covenant of grace has no threatenings so peculiar to itself, but what may well be referred to the law, from which every curse proceeds. XXII. Which I would explain thus: we no where hear of any threatenings which may and ought not to be deduced from that threatening, which doubtless is purely legal, “Cursed is every one that continueth not in all things,” &amp;c. In this most general threatening are included the other more particular ones. Moreover, when salvation by Christ alone is proposed, in the covenant of grace, as the principal truth, the law, which enjoins man to embrace with a firm faith every truth made known to him by God, obliges him to receive this truth in particular, and be delighted with the glory of God shining forth in it, and that his own salvation is connected with the glory of God. Should we deny that the law lays us under this obligation, we should then affirm that the law does not enjoin us to acknowledge God as true, and that there is a holy love of God and of ourselves which the law does not command; all which are most absurd. I go further: When man, as the law prescribes, receives the truth of the Gospel with a lively faith, then not the law, but the Gospel, promises salvation to him. For the law knows of no other promise, than what depends on the condition of perfect obedience. But should man slight and obstinately reject that truth proposed to him, he sins against the law, and so incurs its curse, according to the general rule so often inculcated. And since we have supposed the Gospel declaring that salvation flows from the faith of Christ alone, the law enjoins that all who desire salvation should seek it by the faith of Christ alone; and consequently it cannot but thunder the curse against those who, rejecting the Gospel, believe not on Christ. As, therefore, unbelief, or the rejecting the Gospel, is a sin against the law, which is the only perfect rule of all virtue (it can be called a sin against the Gospel, only objectively), so every threatening of the curse and of wrath against unbelievers and the despisers of the Gospel, must come from and be reduced to the law; but then it is to the law as now subservient to the covenant of grace. XXIII. In the discourses of the Prophets, Christ, and his apostles, there is a certain mixture of various doctrines, which, indeed, are closely connected, and mutually subservient; each of which ought to be reduced to their proper heads, so that the promises of grace be referred to the Gospel, all injunctions of duty and all threatenings against transgressors to the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God &amp; Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, 2 vols. (London: Tegg &amp; Son, 1837), vol. 1, pp. 252–58; italics original. See also Herman Witsius, The Economy of the Covenants Between God &amp; Man, 2 vols. (1822; RHB, 2017), vol. 1</cite>, pp. 284–91</span></figcaption>

<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 54</span></figcaption>

<div class="actions"><button class="copy" data-copy="“That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).”

<blockquote><p>Question: Whether are there rarer threatenings of temporal evils under the New Covenant than under the Old? Answer: It cannot be denied, except the threatenings of the sword, famine, pestilence on Jerusalem and the desolation upon the Jews, Mt. 23-24. But in place of all the diseases of Egypt, Lev. 26, and the long roll of dreadful judgments and curses temporal, Dt. 28, denounced against the transgressors of the former covenant, Christ and the apostles are more sparing in denouncing temporal plagues in the New Testament. (Threatenings under the New Testament more spiritual than under the Old) Christ says the worm never dies, the fire never goes out, the hypocrite is to be bound hand and foot and casten into utter darkness, Mt. 22:12, and the Holy Ghost, such shall not inherit the kingdom of heaven, 1 Cor. 6:9; Eph. 5:5; the apostate is near a curse, his end burning, Heb. 8:6; he is to look for judgment and fiery indignation, Heb. 10:27; to some is reserved the blackness of darkness for ever, Jude 7; the lake that burns with fire and brimstone, which is the second death, Rev. 21:8. Because: (1) temporal blessings and curses are more legal, and more easily believed, when the light was dimmer than now; when light is larger, convictions stronger, and men are more apt to believe everlasting wrath. (2) It is a more Gospel-way to bear in the threatening of everlasting wrath than of temporal rods. (3) Desertions and trials under the Law were more legal and sharp and sad upon David, Hezekiah, Job, Jeremiah, Heman, Ps. 6; 38; 77; 102; 88; Isa. 38; Jer. 20. But it is to be thought that in regard the day now has dawned, the Gospel desertions, ceteris paribus [all things being equal], for the abundance of light, are more sharp, nearer to despair; see 2 Cor. 1:8, ‘We were pressed out of measure above strength, in so much that we despaired even of life, having received the sentence of death.’ It is a doubt if Paul should be so pressed by a sentence of temporary death. Though there be a larger measure of faith, to bear up the soul under the New Testament; but it would appear there is more of Hell now than under that dispensation, and that the gospel-despair of Judas, and of these that cry for mountains and hills to cover them, Lk. 23:29-30, is more intolerable under the Gospel. (The saints are stronger to suffer under the New Testament than under the Old) (4) There is a more numerous company of these who have not loved their lives to the death, and the martyrs that suffered more exquisite torments for Christ under the persecuting emperors and reign of Antichrist than ever before; the constraining love of Christ, which is stronger than death or hell, has so swallowed up all temporary sufferings, the Spirit has such influence on the flesh. (A larger number of godly, of the rude and unlearned, than of the wise and learned according to the flesh) (5) When the world seeks wisdom, 1 Cor. 1, and Rabbis of the Jews and learning and arts abound all the world over, as the profound philosophers of the gentiles, the wonders of nature prove, yet not many wise are called, 1 Cor. 1:21, 26-27; and unlettered and ignorant are, in number, for godly spiritual knowledge, far beyond the godly learned, and make that true, Isa. 11:9, ‘The earth shall be filled with the knowledge of the Lord, as the waters cover the sea,’ and Isa. 30:26, ‘And the light of the moon shall be as the light of the sun, and the light of the sun shall be as the light of seven days;’ so hath the Lord darkened carnal learning, though of itself the good gift of God, with the shining of spiritual wisdom in the fools of the world, for so are they judged, 1 Cor. 1:27.</p></blockquote>

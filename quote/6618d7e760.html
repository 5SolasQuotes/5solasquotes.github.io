<main class="wrap"><figure class="quote" id="q-6618d7e760" data-kw="">
<blockquote><p>1. The form of worship forbidden in the word of God is idolatry and the adoration of saints. 2. Idolatry is the making, maintaining and religious worshipping of an idol. … 3. An idol is an image of likeness [simulacrum] made for the purposes of religious worship. Propositions I. An idol differs from an image and likeness as species from genus… So not every likeness [simulacrum] is an idol; in fact, Tertullian calls man the simulacrum of God. … III. To make an idol is to make an image or likeness for purposes of religious worship. IV. Therefore, not all making of images and likenesses is idolatry; they may be made for memorials, for enjoyment and other secular [politicus] purposes. V. The cherubim, the bronze serpent, and other objects made by God’s order were not made for purposes of religious worship, but as types of Christ. Therefore, the papists wrongly seek to defend their idols on this pretext. For (1) God ordered the making of these objects, but forbids idols; (2) no religious worship was given them, so that when the bronze serpent began to be worshipped, it was destroyed (2 Kings 18:4); to idols the religious worship is given; (3) since all types are done away since the coming of Christ, such objects have no place in the New Testament. Saints are true idols [images of God]. VI. The images that the papists make of Christ, the angels, Mary and the saints [are forbidden]. The reason is tht they are made for purposes of religious worship. The papists deny that they are idols because… (4) the saints lived in genuine human form, and (5) the images are books for the laity. Response: …(4) As to the fourth, it follows from this only that images of the saints can be made, that is, if it is not done for purposes of religious worship. (5) As for the fifth argument, its premise is false; what kind of books the idols [note Wolleb does not say “images”] are is evident from Jeremiah 10:14-15 and Habakkuk 2:18-19, where they are called teachers of lies and vanity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (1626), bk. 2, ‘The Service of God’, 2nd Commandment in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 208-10</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17307d9f5f" data-kw="">
<blockquote><p>3. We acknowledge different opinions between Lutherans and Calvinians; so no doubt there are different opinions among the Lutherans themselves, and the Calvinians themselves, but we utterly deny there are different religions. The Lutherans we hold to be true Churches, agreeing with us in the fundamental points of faith, and likewise in being free from idolatry; for albeit they have images in their churches, which we conceive to be a very dangerous thing, yet they do not worship them; and although they hold real presence in the sacrament, yet they do not adore it. So that albeit we think some of their opinions are contrary to the Scripture, and they think the like of some of ours, yet neither we say of their religion, nor they of ours I trow, that it is contrary to the Scripture, much less that it is condemned in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Conscience Resolved, in answer to a</cite>, (pretended) perplexing question, etc. Wherein is evidently proved that the holy Scriptures (not the Pope) is the foundation whereupon the Church is built (London: 1652), pp. 27-28</span></figcaption>

</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, p. 197</span></figcaption>

</figure><figure class="quote" id="q-f1428f6aba" data-kw="">
<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>

<blockquote><p>If I love such things as God has lent me, and committed unto mine administration, so that I cannot find in mine heart to bestow them on the uses which God has appointed me, then I dishonour God and abuse his creature, in that I give more honor unto it than I should do; and then I make an idol of it, in that I love it more than God and his commandment; and then I dishonor my neighbor, from whose need I withdraw it.</p></blockquote>

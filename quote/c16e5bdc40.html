<main class="wrap"><figure class="quote" id="q-c16e5bdc40" data-kw="">
<blockquote><p>But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr: Beveridge (1559), bk. 2, ch. 12, section 6, pp. 9-10</span></figcaption>

</figure><figure class="quote" id="q-a789796766" data-kw="">
<blockquote><p>The image of God which we have spoken about neither completely perished through sin, nor completely survived from sin. Therefore it remains in some measure (Gen. 9:6; James 3:9; 1 Cor. 11:7, where without doubt the topic is not the past state, but the current one). It remains, I say, to the extent that it consists: (1) in the very nature of man, of the body and soul. (2) In the natural faculties of the soul, in the intellect and will. (3) In certain gifts of the intellect and will, insofar as among the worst is still seen some use of reason, and also some propensity to good, even moral good (Rom. 1:19; 2:15; 1 Cor. 5:1). Furthermore, (4) in at least some remnants of original dominion (Gen. 7:2). God willed all these bits of his own image to survive in us from the fall, first so that they may be witnesses of his own most undeserved goodness toward us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), Bk. 3, ch. 9, section 39</span></figcaption>

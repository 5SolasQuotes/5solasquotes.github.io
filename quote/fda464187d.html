<blockquote><p>This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espy, or than, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance, do greatly dishonor God, and lay an hard imputation upon Him; as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeavor with a true and sincere heart) to seek the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(London</cite>, 1610), 4th Sermon, pp. 125-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b02a872c3c" data-kw="">
<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 328. 1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way. 2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years. 3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 173-74</span></figcaption>

</figure><figure class="quote" id="q-89d3562958" data-kw="">
<blockquote><p>Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse. For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it. For there must be also heresies among you, that they which are approved may be made manifest among you. When ye come together therefore into one place, this is not to eat the Lord’s supper. For in eating every one taketh before other his own supper: and one is hungry, and another is drunken. What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-testament.html">New Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor., 11:17-22</span></figcaption>

</figure><figure class="quote" id="q-153252dd43" data-kw="">
<blockquote><p>These [formerly mentioned] separations are duty, and unto duty, but for a Corinthian to separate from God’s Church and God’s ordinance because some come unworthily to the Lord’s Table is no duty; because there is no command, it is no duty; and therefore we read not this word, ‘Come forth,’ in any of those epistles written to the seven Churches, Rev. 2-3, against which Christ says He ‘hath such and such things;’ they that lived in the impurer [church] are not called forth into the purer [church], but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part, for we may not make these churches and Babylon all one, nor make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s presence because Satan came also amongst them? Job 1:6. Must Shem and Japhet leap out of Noah’s Ark, because there is a Ham there? Would not our Savior rather have sent for John Baptist to have baptized Him rather than Himself have come from Nazareth to Bethabara, which some compute fourteen Dutch miles, that’s of ours fifty six? If that generation of vipers that came also to John’s baptism had either polluted the water, or the ordinance unto Christ? Mt. 3:7, 14. The abuses reproved were such as depraved the ordinance, and the corruptions [were] such as put themselves forth in the communicants at the very time of their participation. The Lord’s Supper was so intermeddled with their festival cheer as the difference between the Lord’s body and their own repast [meal] was not truly made. They discerned not the Lord’s body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, (London: 1657), ch. 2, pp. 31-32</span></figcaption>

<blockquote><p>11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship. 12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship. 12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.”

— Richard Baxter, Schism Detected in both Extremes… (London: 1684), pt. 2, p. 15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C11.+He+%5Ba+schismatic%5D+condemns+as+idolaters+all+the+Churches+on+earth+for+six+hundred%2C+if+not+one+thousand+years+after+the+apostles%3B+not+one+Church%2C+Christian+or+heretic+%28as+far+as+any+history+tells+us+that+I+have+found%29%2C+did+ever+deny+such+things+as+he+calls+false+worship+or+idolatry.+They+all+went+further+than+our+%5BAnglican%5D+parish+churches+do.+At+baptism+they+used+the+white+garment%2C+tasting+milk+and+honey%2C+chrism+or+anointing+the+forehead%2C+crossing%3B+they+adored+only+standing%2C+and+not+kneeling%2C+every+Lord%E2%80%99s+Day%2C+all+as+significant+ceremonies%3A+No+one+Church+or+person+is+said+to+scruple+these%3B+I+think+they+did+not+%5Bdo%5D+well%3A+but+God+rejected+not+their+worship.+12.+He+makes+all+or+near+all+the+Churches+on+earth+idolaters+at+this+day%3A+All+on+earth+save+the+Protestants+are+far+grosser+in+their+liturgies+and+ceremonies+than+the+English%3A+Of+the+Protesants%2C+Sweden%2C+Denmark%2C+Saxony+and+all+the+Lutherans+have+liturgies%2C+crossing%2C+ceremonies%2C+church-images%2C+consubstantiation.+The+Helvetians+%5BSwiss%5D+are+such+as+are+called+Erastians%2C+making+the+magistrate+the+only+ruler%2C+and+%5Bmaking%5D+sacraments+common+%5Bto+all%2C+having+no+excommunication%5D.+Geneva+and+France%2C+yea+and+Holland%2C+have+their+liturgies+and+some+rites.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Schism+Detected+in+both+Extremes%E2%80%A6+%28London%3A+1684%29%2C+pt.+2%2C+p.+15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcbced76d48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cbced76d48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=11.%20He%20%5Ba%20schismatic%5D%20condemns%20as,have%20their%20liturgies%20and%20some%20rites&amp;text=11.%20He%20%5Ba%20schisma

<main class="wrap"><figure class="quote" id="q-4aa74a5e2c" data-kw="Spirit of grace and of supplications">
<blockquote><p>The Spirit promised here is the Spirit of God, &#x27;the Holy Spirit,&#x27; with respect to the special end for which he is promised. And the manner of his administration, in the accomplishment of the promise, is expressed by, &#x27;I will pour out.&#x27; The same word is used for the same purpose in Eze 39.29, and Joel 2.28, as other words of the same importance are also, which we render &#x27;pouring out,&#x27; such as Pro 1.23; Isa 32.15, 44.3, 52.15. … What is intended in this, is a plentiful dispensation of him to the end for which he is promised, with respect to a singular and eminent degree in his operations. The apostle expresses this word, or the accomplishment of what is promised in it, by Tit 3.6, &#x27;he has richly&#x27; or abundantly &#x27;poured out his Spirit.&#x27; Therefore, what is intended is not a mere grant and communication of the Spirit, but a plentiful effusion of him; which must have some eminent effects as pledges and tokens of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit in Prayer</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/prayer-and-the-spirit.html">Prayer and the Spirit</a> › <a href="../topics/prayer/prayer-and-the-spirit/praying-in-the-spirit.html">Praying in the Spirit</a></span><span class="t"><a href="../topics/prayer/prayer-and-the-spirit.html">Prayer and the Spirit</a> › <a href="../topics/prayer/prayer-and-the-spirit/the-spirits-help.html">The Spirit&#x27;s help</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cfbccf335c" data-kw="">
<blockquote><p>Therefore, we maintain that the blessed Virgin is not to be worshiped, not to be invoked as a mediator or mother of graces; we do not want to place our trust in her, offer sacrifices in her name, celebrate festivals in her honor, erect images of her, or honor her through any such cult!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Virgin Mary</cite>, p. 13</span></figcaption>

</figure><figure class="quote" id="q-0181e0f60e" data-kw="invocation of saints refuted">
<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2b</span></figcaption>

</figure><figure class="quote" id="q-55267ed6c2" data-kw="forgive us our debts">
<blockquote><p>45. The fifth petition e Next follows: &quot;Forgive us our debts&quot; [Matt. 6:12]. With this and the following petition, Christ briefly embraces all that makes for the heavenly life, as the spiritual covenant that God has made for the salvation of his church rests on these two members alone: &quot;I shall write my laws upon their hearts,&quot; and, &quot;I shall be merciful toward their iniquity&quot; [Jer. 31:33 p.; cf. ch. 33:8]. Here Christ begins with forgiveness of sins, then presently adds the second grace: that God protect us by the power of his Spirit and sustain us by his aid so we may stand unvanquished against all temptations. e(a) He calls sins &quot;debts&quot; because we owe penalty for them, aand we could in no way satisfy it unless we were released by this forgiveness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>

</figure><figure class="quote" id="q-dccd5ef556" data-kw="Mary Invocation of saints Idolatry">
<blockquote><p>They worship the saints departed, especially the virgin Mary, in whose worship they are so profuse, that they may be called Marians rather than Christians. To the saints they pray, make vows, swear by them, consecrate altars and temples to them, and offer incense. All which are parts of religious worship due to God alone.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c9f458036e" data-kw="">
<blockquote><p>And, in the third place, this external calling is not without results. In general it can be said of it that God achieves His purpose by means of it… Among the heathen there is great difference between the ways in which they react to the calling of nature. Socrates and Plato are not to be named in one breath with Caligula and Nero. And so it is by no means the same thing whether the gospel is mocked and blasphemed, on the one hand, or accepted with an historical or temporary belief, on the other. True, between these two kinds of faith and a saving faith of the heart there is an essential difference. But that is not to equate them with total unbelief. On the contrary, they are fruits of God’s common grace and they carry with them many temporal blessings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Reasonable Faith: A Survey of Christian Doctrine trans. Henry Zylstra (Eerdmans, 1956), ch. 20, ‘The Christian Calling,’</cite>, pp. 415-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-063079bb27" data-kw="">
<blockquote><p>Thirdly, the Lord makes use of this outward and common covenanting with all receivers of the offer, as a mean to draw the confederate in the letter, to be confederate in the spirit; for, the faith which he requires as the condition of the covenant, he works in the elect, if not before, or with the external covenanting, yet undoubtedly after, in a time acceptable, and that by the ordinary means, the use whereof is granted to all confederate externally: and so as common illumination is a mean to that special, spiritual and saving illumination; and dogmatic or historical faith, is a mean unto saving faith; and external calling, is a mean of effectual calling, So external covenanting in the letter, is a mean most fit, and accommodate to make a man a covenanter in the spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/therapeutica-sacra.html">Therapeutica Sacra</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 3, Chapter 6</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-5cd726bb37" data-kw="">
<blockquote><p>41. And indeed, God loves all his creatures, insofar as they are his creatures, but not with the same level of love. For he loves some in Christ, whom he chose in Christ from eternity according to the will of his good pleasure. He does not love the reprobate in the same way, whom nevertheless he does not damn as innocent, but on account of their voluntary wickedness and willful unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Disputation on that Place of Paul, 1 Cor. 15:22, ‘As in Adam All Die, so in Christ All shall be Made Alive’, &amp; of this Question, Whether Christ has Died for All?, pt. 5 tr. Michael Lynch (Heidelberg, 1589)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-a251447b2a" data-kw="">
<blockquote><p>5. Here is added great and gracious encouragement to this sinful [unconverted, as is made clear by the larger context] people to take the admonition and advice well that Christ had given them, v. 19, v. 20. He tells them, (1.) It was given them in true and tender affection: “Whom I love, I rebuke and chasten. You may think I have given you hard words and severe reproofs; it is all out of love to your souls. I would not have thus openly rebuked and corrected your sinful lukewarmness and vain confidence, if I had not been a lover of your souls; had I hated you, I would have let you alone, to go on in sin till it had been your ruin.’’ Sinners ought to take the rebukes of God’s word and rod as tokens of his good-will to their souls, and should accordingly repent in good earnest, and turn to him that smites them; better are the frowns and wounds of a friend than the flattering smiles of an enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tong.html">William Tong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Matthew Henry’s Commentary, on Rev.</cite>, 3:19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

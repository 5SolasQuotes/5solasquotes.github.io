<blockquote><p>3. An ordinance may be said to be polluted upon this extrinsic consideration, to wit, when by some circumstance in it, or miscarriage of those that are about it, it is made common-like, and so wants that luster and honorableness that it ought to have; by such a fault the ordinance is made obnoxious to contempt and is despised by others, contrary to the Lord’s allowance. Thus the priests of old made the offerings of the Lord vile and contemptible, which was not by corrupting them in essentials, nor making them cease to be Ordinances, but by their miscarriages and corrupt irreverent way of going about them, they did lay that stumbling-block before others, to make them account these ordinances contemptible. This may be diverse ways fallen into… they do pollute that admonition, yet still these ordinances are ordinances, and that admonition an admonition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Pt. 2, ch. 14, ‘Clearing Whether the Ordinances of Christ be Any Way Polluted by Corrupt Fellow-Worshippers’ in The Dying Man’s Testament… (1659), pp. 148-9</span></figcaption>

nk">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7dc555aaa8" data-kw="">
<blockquote><p>Now besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us, signifies veneration or reverence, sitting at table signifies familiarity and fellowship. ‘For which of you,’ says our Master, ‘having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat.’ [Lk. 17:7] All these signs have their significations from nature. And if it be said that howbeit sitting at our common-tables be a sign natural, to signify familiarity amongst us, yet nature has not given such a signification to sitting at the Lord’s Table, I answer that sitting is a natural sign of familiarity at what table soever it be used. At the heavenly table in the Kingdome of Glory familiarly is expressed and signified by sitting, Mt. 8:11, ‘Many shall come from the east and west, and shall sit down with Abraham, etc.’ Much more then at the spiritual table in the Kingdom of Grace. The difference betwixt other common tables and the Lord’s Table can infer no more but that with great humility we ought to addresse ourselves unto it: yet still we are to make use of our familiarity with Christ ut tanquam in eodem toro accumbentes, as says Chrysostom. Wherefore we do not there so look to Christ in his princely throne and glorious majesty, exalted far above all principalities and powers, as to forget that He is our loving and kind banqueter, who has admitted us to that familiar fellowship with Him, which is signified by our sitting at his table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, pp. 85-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-816ed4b644" data-kw="">
<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>

<blockquote><p>5. The abuse of kneeling in the idolatrous action of elevation proceeds not from the nature of the action, but from the opinion of the agent, or rather from his will (for principium actionum humanarum [the principle of human actions], is not opinion, but will choosing that which opinion conceits to be chosen, or voluntas praeeunte luce intellectus). It is the will of the agent only which both makes the action of elevation to be idolatrous, and likewise kneeling in this action to receive the contagion of idolatry. For the elevation of the bread materialiter [materially], is not idolatrous (more than the lifting up of the bread among us by elders or deacons, when in taking it off the table, or setting it on, they lift it above the heads of the communicants), but formaliter [formally] only, as it is elevated with a will and intention to place it in state of worship. So likewise kneeling to the bread, materialiter [materially], is not idolatry (else a man were a idolater who should be against his will thrust down and holden by violence kneeling on his knees when the bread is elevated), but formaliter [formally], as it proceeds from a will and intention in men to give to the bread-elevated a state in that worship, and out of that respect to kneel before it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, p. 28</span></figcaption>

%20before%20it&amp;text=5.%20The%20abuse%20of%20kneeling%20in%20the%20idolatrous&amp;text=out%20of%20that%20respect%20to%20kneel%20before%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thirdly, it cannot be denied but that the first communicants who received from Christ [at the first Lord’s Supper] might with more ease and conveniency be placed at the table than can be now in many churches which have been accustomed to another way. But we must not bring down our rule to our conveniences; rather, bring up our conveniencies to our rule. It is no hard matter to alter pews and such like things in churches, where the present posture is inconsistent with following the pattern: and a less alteration will serve than is apprehended. Fourthly, the flux and reflux (so to speak) of several successive tables, where there is a great number to communicate, and the repeating, or pronouncing, and applying to those several tables of receivers the words, ‘Take ye, eat ye,’ which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they who so charge us ever make good what they alledge, unlesse they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection (suppose I say, there had been so many communicants) yet He had given them all at once the elements and had said but once, ‘Take ye, eat ye,’ and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not. Fifthly, our dissenting brethren of the Independent way, who dislike our several and successive tables in one congregation, as a dividing of those who ought to communicate all together (for they would have none of the communicants receive the cup [which comes after the bread] before all of the congregation who communicate have received the bread), these brethren, I say, may satisfy themselves from their own principles: For they hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example. If one of their congregations may receive the sacrament in several houses, when (by reason of numerousness) they cannot all receive it together in one house, I cannot conceive why they may not much more allow us several successive tables in the assembly when the whole cannot communicate at one table…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9dde05490c" data-kw="">
<blockquote><p>But though this has been said with reference to what is here handled, yet we may hence draw a general truth, — that no government is to be set up in the Church by the will of men, but that we are to wait for the command of God, and also that we ought to follow a certain rule in electing ministers, so that no one may intrude according to his own humour. Both these things ought to be distinctly noticed: for the Apostle here speaks not of persons only, but also of the office itself; nay, he denies that the office which men appoint without God’s command is lawful and divine. For as it appertains to God only to rule his Church, so he claims this right as his own, that is, to prescribe the way and manner of administration. I hence deem it as indisputable, that the Papal priesthood is spurious; for it has been framed in the workshop of men. God nowhere commands a sacrifice to be offered now to him for the expiation of sins; nowhere does he command priests to be appointed for such a purpose. While then the Pope ordains his priests for the purpose of sacrificing, the Apostle denies that they are to be counted lawful priests; they cannot therefore be such, except by some new privilege they exalt themselves above Christ, for he dared not of himself to take upon him this honour, but waited for the command of the Father. […] It hence appears that the greatest defect is the character of the office itself, that is, when men of themselves invent what God has never commanded. The less endurable then are those Romish sacrificers, who prattle of nothing but their own titles, that they may be counted sacred, while yet they have chosen themselves without any authority from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 116-17.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80cf1e0a6c" data-kw="">
<blockquote><p>The presbyter is the same as the bishop, and before parties had been raised up in religion by the provocations of Satan, the churches were governed by the Senate of the presbyters. But as each one sought to appropriate to himself those whom he had baptized, instead of leading them to Christ, it was appointed that one of the presbyters, elected by his colleagues, should be set over all the others, and have chief supervision over the general well-being of the community. . . Without doubt it is the duty of the presbyters to bear in mind that by the discipline of the Church they are subordinated to him who has been given them as their head, but it is fitting that the bishops, on their side, do not forget that if they are set over the presbyters, it is the result of tradition, and not by the fact of a particular institution by the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, 1:7</span></figcaption>

<blockquote><p>2. When we teach, that the pastor or pastors of every particular Church and congregation, with the elders of the same, being met together, have power to bind and loose, we understand this, only of such places wherein a competent number of understanding and qualified men, may be had to make up an eldership: otherwise let there be one eldership made up of two or three of the next adjacent parishes, according as was ordained by the Church of Scotland in the seventh chapter of the Second Book of Discipline [section 10]… …set some bounds to the execution of their power: which bounds we also think good to be kept, viz. that if a Church be so small that it has not so many well qualified men as may be sufficient to assist the pastor in the governement thereof, then let one common eldership be made up out of it and some other neighbor churches…</p></blockquote>

<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-867243b766" data-kw="">
<blockquote><p>In order to our Preparation, it is necessary that we take hold of God’s Covenant of Promise: There can be no devoting of ourselves aright to the Lord in a Covenant of Duty, unless we first take hold of God’s Covenant of Promise. We must avouch the Lord to be our God, and, in the Strength of his Grace, promise to walk in his Statutes, keep his Judgments and do them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-moncrieff.html">Alexander Moncrieff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744</cite>, (Edinburgh: David Duncan, 1747), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e15b92bbbb" data-kw="">
<blockquote><p>The covenant of grace is, properly speaking, an unconditional covenant. The conditions have been fulfilled for us by Christ, the covenant head of elect humanity (though we can refer to saving faith as a condition, but only in an improper sense). As Ralph Erskine argues:

This is the condition of the New Covenant. The Covenant of Works had only the active obedience of the first Adam for its condition; but the condition of the Covenant of Grace properly, is both the active and passive obedience of the second Adam, his doing and dying. Now, Lord, have respect to that blood that sealed the covenant; since the condition is fulfilled to thy infinite satisfaction, let the promised good be conferred upon me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith’s Plea Upon God’s Covenant: A Sermon on Psalm LXXIV. 20</cite>, (Falkirk: T. Johnston, 1821), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-93528f6b17" data-kw="">
<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ, his Last Discovery of Himself</cite>, ... (London: R.I., 1656), Christ’s Willingness to Save Sinners, 2nd Sermon, pp. 168-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject [who held to a universal atonement]. I think that the word ‘world’, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/memoirs-of-dr-chalmers.html">William Hanna</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Dr. Chalmers</cite>, vol. 4, ‘His Last Sabbath’</span></figcaption>

</figure><figure class="quote" id="q-ab5270ac96" data-kw="">
<blockquote><p>The Apostle [Paul] holds forth, that persons may be under the outward administrations of the Covenant, and yet not get the efficacy of it; [Romans 9] v.6. They are not all Israel that are of Israel; the Covenant was made with Abraham and his seed, all that were of him: and yet all were not Israel, that is, partakers of the inward life and efficacy of the Covenant; the Apostle only in these verses endeavours to take off that Objection, that God had broke his Covenant by casting away the Jews, and so distinguisheth of these that were merely of the flesh, who had the outward administration, but not the inward fruit, and these which were elect in the promise, in Isaac shall thy seed be called; the rest he calls the Children of the flesh, the former the Children of promise, v. 8. and so though they were under the outward dispensation of the Covenant, yet God was not mutable, nor his promise, though he rejected them, because of their own degeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of These Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), pp 20-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>But that which is used to express or described a practice [such as the laying on of hands], would seem to be an important, if not an essential part of it.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5690fca2e6" data-kw="">
<blockquote><p>…we have in these verses a remarkable testimony to Christ’s infinite superiority over all that are born of women… There is a constant tendency in human nature to ‘hear man’ [contrast Mt. 17:5]. Bishops, priests, deacons, popes, cardinals, councils, presbyterian preachers, and independent ministers, are continually exalted to a place which God never intended them to fill, and made practically to usurp the honor of Christ. Against this tendency let us all watch, and be on our guard. Let these solemn words of the vision ever ring in our ears, ‘Hear ye Christ.’ [Mt. 17:5] The best of men are only men at their very best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels, on Mt.</cite>, 17:1-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-6ac434a282" data-kw="">
<blockquote><p>III. Whether there can be regeneration of adults without antecedent or conjoined external calling through the Word externally set forth; and whether de facto there has been such? Response: The former is not to be denied. To the latter we say that ordinarily it does not happen, according to Rom. 10:15, 17; 1 Cor. 1 [1:21]; 2 [2:4-5], 21 [This should be different], compared with Ps. 147 [vv. 19-20]; Eph. 2:11–12. Nor do I see any example adduced after the new covenant was established. Concerning Abraham, it can be said that he had in his paternal family the external Word handed down from hand to hand through the patriarchs. Concerning Adam and Eve, it can be said that they were the first in whom God established the church after the fall, from whom thenceforth the church was propagated through the external Word. Nor is it certain that their first conversion was accomplished without some Word sounding externally (although in an extraordinary manner, because it was necessary first to establish the order and to begin from them).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“III. Whether there can be regeneration of adults without antecedent or conjoined external calling through the Word externally set forth; and whether de facto there has been such? Response: The former is not to be denied. To the latter we say that ordinarily it does not happen, according to Rom. 10:15, 17; 1 Cor. 1 [1:21]; 2 [2:4-5], 21 [This should be different], compared with Ps. 147 [vv. 19-20]; Eph. 2:11–12. Nor do I see any example adduced after the new covenant was established. Concerning Abraham, it can be said that he had in his paternal family the external Word handed down from hand to hand through the patriarchs. Concerning Adam and Eve, it can be said that they were the first in whom God established the church after the fall, from whom thenceforth the church was propagated through the external Word. Nor is it certain that their first conversion was accomplished without some Word sounding externally (although in an extraordinary manner, because it was necessary first to establish the order and to begin from them).”

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c08dbaf815" data-kw="">
<blockquote><p>18…. As touching the holy women and other prophets which exercised the ministry without attending till they were called, those we say had extraordinary vocations [callings], the Church either being as yet not planted, or else so fallen to decay as it might not otherwise be repaired.</p></blockquote>

</figure><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion… (London: R.W., 1657), ch. 1, sect. 3</cite>, pp. 6-7</span></figcaption>

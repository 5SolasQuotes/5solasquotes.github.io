<main class="wrap"><figure class="quote" id="q-8b7acc69c5" data-kw="">
<blockquote><p>But it is to be noted, that faith can never be without good works. Therefore these men, if they believe, although they repent in the last hour, yet undoubtedly shall they not be without good works. Which thing the example of the thief declareth, who repented in a manner at the very point of death, and was saved. For he, being converted unto God, confessed Christ, acknowledged his sins, exhorted his neighbour, and earnestly prayed for the obtainment of his own salvation. By all which things we may see, how diligently &amp; earnestly if he had had space to live, he would have applied himself unto good works.

What shall we say to infants, which die in Christ. They, forasmuch as by reason of age they are as yet not able to do any thing, are to be exempted out of the number of them, unto whom shall be rendered according to their works. For Paul speaketh of them which be of full age, whom ought have brought forth good works. And that which Chrysostom writeth, that this place teacheth us, not in any wise to put our trust in faith only, forasmuch as before the judgement seat of God, works also shall be examined, this his saying (I say) must be warily taken. For true faith never wanteth just works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romanes wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Ep</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 40.</span></figcaption>

</figure><figure class="quote" id="q-bcf1d08e49" data-kw="">
<blockquote><p>…Good works are necessary to salvation, not as a cause to an effect, or as if they merited a reward, but as a part of salvation itself, or as an antecedent to a consequent, or as a means without which we cannot obtain the end. In the same way we may also say, that good works are necessary to righteousness or justification, or in them that are to be justified, viz.: as a consequence of justification, with which regeneration is inseparably connected…. We may more safely and correctly say, That good works are necessary in them that are justified, and that are to be saved…. Augustine has correctly said: Good works do not precede them that are to be justified, but follow them that are justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Why Good Works are to be Done</cite>, p. 485 in section 5 of Question 91 of the Heidelberg Catechism in The Commentary of Zacharias Ursinus on the Heidelberg Catechism (Cincinnati, 1851)</span></figcaption>

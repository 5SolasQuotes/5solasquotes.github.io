<blockquote><p>The great death had appeared in Zurich… It was proving ‘the scourge of God’; the terror of Europe, and where could he be safer from it than amid the spray of the Jamina? But the unselfish pastor thought chiefly of his flock. He must hasten home, likely as he was to be the victim of the plague. If Chateaubriand [in western France] had known of this and thousands of similar cases, he would have given a better turn to his eloquent period than to say, ‘The Protestant pastor abandons the necessitous on the bed of death, and never risks his life in the midst of the pestilence.’ Zwingli found his house deserted by all the young men who had lived and studied with him, except his youngest brother Andrew, who had waited for his return. He sent Andrew immediately to Wildhaus, that he might escape ‘the death’. With heroic courage he went from house to house, devoting himself entirely to the victims of the frightful scourge. Everyday he proclaimed the messages and consolations of Christ to the sick arid the dying. In the pulpit he so preached that he raised the hearts of the terrified congregation with the invitations of Jesus to the heavy-laden and the promises treasured up in the Word of life. His faithful parishioners trembled for their pastor, as they saw him moving about among the shafts of death and bearing to them the cup of salvation. His devotion was talked of by friends at a distance. Two thousand five hundred people were swept away in a short time, and they were alarmed for him. Conrad Brunner of Wesen, soon to die of the plague, wrote to him from Basle, saying, ‘Do your duty, but at the same time remember to take care of your own life.’ The caution came too late: Zwingli was attacked by ‘the great death’. Switzerland seemed about to lose her mightiest preacher, Zurich her patriotic Reformer, his flock their best earthly friend. Dr. Hedio of Basel was thinking sadly of the possible result of ‘the murderous disease; for who would not grieve if the saviour of his country, if the trumpet of the gospel, if the courageous herald of the truth should be stricken down in the prime of life, high in hope and in the midst of his usefulness.’ The thoughts of Zwingli were turned inward; his eyes upward to heaven. His meditations and prayers were afterward recorded in poetry, whose rhythm and quaintness D’Aubigne has preserved in his version: Lo! at the door I hear death’s knock! Shield me, O Lord, My strength and rock. Thy hand once nailed Upon the tree, Jesus, uplift, And shelter me. Willest thou then, Death conquer me, In my own noon-day? So let it be! Oh! may I die, Since I am thine: Thy home is made For faith like mine. … Day and night were prayers ascending to God from the distressed believers for their pastor’s recovery… But the Lord heard the prayers of his people, the plague forsook its victim… Zwingli went into his pulpit still feeble and scarcely able to preach. ‘The plague has so weakened my memory and intellect,’ he wrote to Myconius, ‘that in preaching I sometimes altogether lose the thread of my discourse. All my members are oppressed with a languor that I cannot describe.’ This was not all; his salary was so small that he was under a burden of embarrassments. He could not support himself and his two assistants. Gifts might have poured in, but he would not accept them… The Lord had led his servant nearer to himself that he might have the privileges of a son. D’Aubigne says: ‘This pestilence of 1519, which committed such frightful ravages in the north of Switzerland, was, in the hands of God, a powerful means of converting many souls. But on no one did it exercise so powerful an influence as on Zwingli. The gospel, which had hitherto been too much regarded by him as a mere doctrine, now became a great reality. He arose from the darkness of the sepulchre with a new heart. His zeal became more active, his life more holy, his preaching more free, more Christian, more powerful. This was the epoch of Zwingli’s complete emancipation; henceforward he consecrated himself entirely to God. But the Reformation of Switzerland received a new life at the same time as the Reformer. The scourge, the great death, as it swept over these mountains and descended into the valleys, gave a holier character to the movement that was taking place. The Reformation, as well as Zwingli, was baptized in the waters of affliction and of grace, and came forth purer and more vigorous. It was a memorable day in the counsels of God for the regeneration of this people.&#x27;</p></blockquote>

<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>

<blockquote><p>And truly, I do marvel that those who without exception do condemn going aside, as being of it self repugnant unto charity, do not consider, that charity doth less require that we provide for the whole, than that we help those that are taken with that sickness. Finally, They say that as many as fly the plague, do that which no Christian ever did, when as there is no example thereof in the holy Histories. I answer, That this is too deceitful an argument, when as it is apparent that in the holy Scriptures is not set down what every one hath done; and that in many the general rules of doctrine, there is sufficient to determine those things whereof we have no commandment, nor any particular example; and that it is without doubt that it is not set down how often the people hath been visited with the plague, neither yet how every man behaved himself in the plague. But they say they have altogether contrary counsel in the holy Scriptures; for that David doth call us back unto the Tabernacle of the Most Highest, Ps. 91, as though he fled not unto God, which lawfully useth going aside: But yet, say they, David did not fly that very sore plague whereof mention is made, 2 Sam. 24, neither removed his household unto any other place. I grant this; but how many peculiar circumstances do forbid us to make of that a general conclusion? for he himself was the cause of that plague, and deservedly so far forth troubled, that he is ready even with his own destruction to redeem the public calamity; further, when as this plague continued not above three days at the most, what place was there left him to take advice or to fly unto? whither should he have fled, when the plague was hot in all his dominion, and yet is said not at all, or very little, to have touched the chief city itself? Again, they say Isaiah fled not from Hezekiah being sick of the plague: As if we held, that the shepherds with a good conscience, might willingly, and of their own accord, leave their sheep; Yea, and what if I should take exception that Isaiah came not to Hezekiah but by the special command of God? for so doth the History bear record. But, say they, Jeremiah also and Baruch, with other godly men, fled not out of the city being besieged of the Chaldees, though a great part of the people died as well of the plague as of famine; Neither do we say that we may worthily shun the plague by going aside, if we depart from that which we owe unto God, our country, and every of our neighbors: But I cannot but wonder, that those which allege this example of Jeremiah have forgotten that he was taken at the gate of the city, when he assayed to get out, Jer. 37:12. Last of all, they bring a notable example of the Church of Alexandria, out of the seventh Book of Eusebius, Ch. 20, as though we did allow the going aside either of all, or in all places, and times, or do not teach that such constancy and charity ought both to be praised, and also followed, so that a general rule be not made thereof; for Eusebius doth not say that every one, but that very many of the Christians did it.</p></blockquote>

there+left+him+to+take+advice+or+to+fly+unto%3F+whither+should+he+have+fled%2C+when+the+plague+was+hot+in+all+his+dominion%2C+and+yet+is+said+not+at+all%2C+or+very+little%2C+to+have+touched+the+chief+city+itself%3F+Again%2C+they+say+Isaiah+fled+not+from+Hezekiah+being+sick+of+the+plague%3A+As+if+we+held%2C+that+the+shepherds+with+a+good+conscience%2C+might+willingly%2C+and+of+their+own+accord%2C+leave+their+sheep%3B+Yea%2C+and+what+if+I+should+take+exception+that+Isaiah+came+not+to+Hezekiah+but+by+the+special+command+of+God%3F+for+so+doth+the+History+bear+record.+But%2C+say+they%2C+Jeremiah+also+and+Baruch%2C+with+other+godly+men%2C+fled+not+out+of+the+city+being+besieged+of+the+Chaldees%2C+though+a+great+part+of+the+people+died+as+well+of+the+plague+as+of+famine%3B+Neither+do+we+say+that+we+may+worthily+shun+the+plague+by+going+aside%2C+if+we+depart+from+that+which+we+owe+unto+God%2C+our+country%2C+and+every+of+our+neighbors%3A+But+I+cannot+but+wonder%2C+that+those+which+allege+this+example+of+Jeremiah+have+forgotten+that+he+was+taken+at+the+gate+of+the+city%2C+when+he+assayed+to+get+out%2C+Jer.+37%3A12.+Last+of+all%2C+they+bring+a+notable+example+of+the+Church+of+Alexandria%2C+out+of+the+seventh+Book+of+Eusebius%2C+Ch.+20%2C+as+though+we+did+allow+the+going+aside+either+of+all%2C+or+in+all+places%2C+and+times%2C+or+do+not+teach+that+such+constancy+and+charity+ought+both+to+be+praised%2C+and+also+followed%2C+so+that+a+general+rule+be+not+made+thereof%3B+for+Eusebius+doth+not+say+that+every+one%2C+but+that+very+many+of+the+Christians+did+it.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Short+Learned+%26+Pithy+Treatise+of+the+Plague%2C+Wherein+are+Handled+These+Two+Questions%3A+the+One%2C+Whether+the+Plague+Be+Infectious%2C+Or+No%3A+the+Other%2C+Whether+and+How+Far+it+May+of+Christians+Be+Shunned+by+Going+Aside+%281580%3B+London%2C+1665%29%2C+pp.+15-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25ae8b54ef.html&amp;via=5Solas" target="_blank" rel="noopener"> <blockquote><p>On his return home on the 31st he found that the mysterious and awful visitation of the cholera — which he always anticipated would, in its alarming and desolating course, visit Inverness — had broken out. The first decided cases appeared on the 21st. On the Sabbath following, the 2nd September, he improved the visitation by preaching in the forenoon from Ps. 106:29, “Thus they provoked Him to anger with their inventions; and the plague brake in among them.” In the afternoon, from Joel 2:14, “Who knoweth if He will return and repent, and leave a blessing behind Him, even a meat offering and a drink offering unto the Lord your God” — subjects peculiarly appropriate. On the first appearance of this awful disease, and during its progress, the feelings excited in the minds of the inhabitants, and depicted in their countenances, none could adequately describe but those who were eye-witnesses. The common sympathies of our nature with those in affliction, and the ties and tender affections of friendship seemed, in some cases, to be totally cut asunder, — all seemed to be absorbed with their own individual cases. Several families fled to the country. Though rather timid and sensitive as to visiting the sick, in cases of contagious fevers, he deemed it his duty to remain at his post, publicly and privately exhorting his people to improve the visitation. Prayer meetings were frequent in various quarters of the town, each night, in places and by persons of whom it could not be said that ” prayers were wont to be made.” He united with them, entering in some measure into the spirit as well as unto the letter of the noble and patriotic resolution of Nehemiah, “should such a man as I flee?” as will be seen in the following extract of a letter which communicated to the writer [the biographer] his unlooked-for and much-lamented death [after attending Lord’s Day worship and the Tuesday evening prayer meeting]…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9e7bfcd23f" data-kw="">
<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7b83c6949" data-kw="">
<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, (1697; RHB, 2019), Locus 23, ‘On the Grace of Sanctification’, section 14, p. 166</span></figcaption>

<blockquote><p>43. Vocal prayer is either in prose, or in meter.

44. In meter singing is joined, and therefore there must be more care of the speech and tone, then in prose.

45. But the melody of singing is ordained for a certain spiritual delight, whereby the mind is detained in the meditation of the thing that is sung. … 48. But because this religious melody has the respect of prayers: therefore it is not so fit, that the Decalogue, and other such like which do not partake the nature of prayer, be turned into meter and be sung instead of psalms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, &amp; the Interpreters thereof, and brought into Method</cite>, (London: 1642), Book 2, ch. 9, ‘Of Prayer’, pp. 283-4</span></figcaption>

</figure><figure class="quote" id="q-97557a90c5" data-kw="">
<blockquote><p>…we would not only fall down upon our faces and give him thanks, but with loud voices would we praise Him, and in the midst of the congregation would we extol his name, as David and Asaph do almost in every psalm. For doubtless whoso believeth that God loveth him, and feeleth by his faith, that he hath forgiven him all his sins, and careth for him… shall be compelled by the Spirit of God to break out into praise and thanksgiving therefore… but shall cry and call upon them, as David doth, saying: “Praise the Lord with me, and let us magnify his name together. I sought the Lord, and He heard me, yea, He delivered me out of all my fear.”… Yea, would God that our minstrels had none other thing to play upon, neither our carters and ploughmen other thing to whistle upon, save psalms, hymns, and such godly songs as David is occupied withal! And if women, sitting at their rocks [instruments used in spinning], or spinning at the wheels, had none other songs to pass their time withal, than such as Moses’ sister, Glehana’s [Elkanah’s] wife, Debora, and Mary the mother of Christ, have sung before them, they should be better occupied than with ‘hey nony nony, hey troly loly,’ and such like fantasies. If young men also that have the gift of singing, took their pleasure in such wholesome ballads as the [apocryphal] three children sing in the fire, and as Jesus the Son of Sirac doth in his last chapter, it were a token, both that they felt some spark of God’s love in their hearts, and that they also had some love unto Him; for truly, as we love, so sing we… Seeing then that, as the prophet David saith, it is so good and pleasant a thing to praise the Lord, and so expedient for us to be thankful (Ps. 147); therefore, to give our youth of England some occasion to change their foul and corrupt ballads into sweet songs and spiritual hymns of God s honor, and for their own consolation in him, I have here, good reader, set out certain comfortable songs grounded on God’s Word, and taken some out of the holy scripture, specially out of the Psalms of David, all whom would God that our musicians would learn to make their songs! and if they which are disposed to be merry, would in their mirth follow the counsel of St. Paul and St. James (Col. 3; James 5), and not to pass their time in naughty songs of fleshly love and wantonness, but with singing of psalms, and such songs as edify, and corrupt not men’s conversation. … The children of Israel in the old time, when God had delivered them from their enemies, gave thanks unto Him, and made their song of Him, as thou seest by Moses, Barak, David, and other more. Why should not we then make our songs and mirth of God, as well as they? Hath He not done as much for us as for them? Hath He not delivered us from as great troubles as them? Yes, doubtless. Why should He not then be our pastime, as well as theirs? As for such psalms as the scripture describeth (beside the great consolation that they bring into the heart of the spiritual singer) they do not only cause him to spend his time well by exercising himself in the sweet Word of God; but through such ensamples they provoke other men also unto the praise of God and virtuous living. And this is the very right use wherefore psalms should be sung; namely, to comfort a man’s heart in God, to make him thankful, and to exercise him in his Word, to encourage him in the way of godliness, and to provoke other men unto the same. By this thou mayest perceive, what spiritual edifying cometh of godly psalms and songs of God s Word; and what inconvenience foloweth the corrupt ballads of this vain world. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/miles-coverdale.html">Miles Coverdale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ghostly</cite>, [Spiritual] Psalms and Spiritual Songs (1539), ‘Unto the Christian Reader’ in Remains of Myles Coverdale (Cambridge: Parker Society, 1846), pp. 536-540</span></figcaption>

ing+we%E2%80%A6+Seeing+then+that%2C+as+the+prophet+David+saith%2C+it+is+so+good+and+pleasant+a+thing+to+praise+the+Lord%2C+and+so+expedient+for+us+to+be+thankful+%28Ps.+147%29%3B+therefore%2C+to+give+our+youth+of+England+some+occasion+to+change+their+foul+and+corrupt+ballads+into+sweet+songs+and+spiritual+hymns+of+God+s+honor%2C+and+for+their+own+consolation+in+him%2C+I+have+here%2C+good+reader%2C+set+out+certain+comfortable+songs+grounded+on+God%E2%80%99s+Word%2C+and+taken+some+out+of+the+holy+scripture%2C+specially+out+of+the+Psalms+of+David%2C+all+whom+would+God+that+our+musicians+would+learn+to+make+their+songs%21+and+if+they+which+are+disposed+to+be+merry%2C+would+in+their+mirth+follow+the+counsel+of+St.+Paul+and+St.+James+%28Col.+3%3B+James+5%29%2C+and+not+to+pass+their+time+in+naughty+songs+of+fleshly+love+and+wantonness%2C+but+with+singing+of+psalms%2C+and+such+songs+as+edify%2C+and+corrupt+not+men%E2%80%99s+conversation.+%E2%80%A6+The+children+of+Israel+in+the+old+time%2C+when+God+had+delivered+them+from+their+enemies%2C+gave+thanks+unto+Him%2C+and+made+their+song+of+Him%2C+as+thou+seest+by+Moses%2C+Barak%2C+David%2C+and+other+more.+Why+should+not+we+then+make+our+songs+and+mirth+of+God%2C+as+well+as+they%3F+Hath+He+not+done+as+much+for+us+as+for+them%3F+Hath+He+not+delivered+us+from+as+great+troubles+as+them%3F+Yes%2C+doubtless.+Why+should+He+not+then+be+our+pastime%2C+as+well+as+theirs%3F+As+for+such+psalms+as+the+scripture+describeth+%28beside+the+great+consolation+that+they+bring+into+the+heart+of+the+spiritual+singer%29+they+do+not+only+cause+him+to+spend+his+time+well+by+exercising+himself+in+the+sweet+Word+of+God%3B+but+through+such+ensamples+they+provoke+other+men+also+unto+the+praise+of+God+and+virtuous+living.+And+this+is+the+very+right+use+wherefore+psalms+should+be+sung%3B+namely%2C+to+comfort+a+man%E2%80%99s+heart+in+God%2C+to+make+him+thankful%2C+and+to+exercise+him+in+his+Word%2C+to+encourage+him+in+the+way+of+godliness%2C+and+to+provoke+other+men+unto+the+same.+By+this+thou+mayest+perceive%2C+what+spiritual+edifying+cometh+of+godly+psalms+and+songs+of+God+s+Word%3B+and+what+inconvenience+foloweth+the+corrupt+ballads+of+this+vain+world.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Miles+Coverdale%2C+Ghostly+%5BSpiritual%5D+Psalms+and+Spiritual+Songs+%281539%29%2C+%E2%80%98Unto+the+Christian+Reader%E2%80%99+in+Remains+of+Myles+Coverdale+%28Cambridge%3A+Parker+Society%2C+1846%29%2C+pp.+536-540&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97557a90c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97557a90c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=we%20would%20not%20only%20fall%20down,corrupt%20ballads%20of%20this%20vain%20world&amp;text=we%20would%20not%20only%20fall%20down%20upon%20our&amp;text=foloweth%20the%20corrupt%20ballads%20of%20this%20vain%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>When therefore you meet with those that fear God, make improvement of the communion of saints, not only by communicating in natural, and temporal good things as you are able, and as there is need; but especially in the communion of things spiritual, edifying yourselves in your most holy faith, by holy speech and conference, and in due time and place) in reading the holy Scriptures &amp; good books, and by prayer, and singing of Psalms together (Col. 3:16, Rules of singing). That your singing may please God, and edify yourself and others, observe these: Sing as in Gods sight, and, in matter of prayer &amp; praise speak of God in singing. The matter of your song must be spiritual, either indited by the Spirit, or composed of matter agreeing thereunto (Col. 3:16). You must sing with understanding. You must sing with judgement, being able in private to make choice of Psalms befitting the present times and occasions; And both in private and public to apply the Psalm sung to your own particular, as when and how to pray and praise in the words of the Psalm, taking heed…</p></blockquote>

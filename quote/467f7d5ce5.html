<blockquote><p>Pastors cannot excommunicate those of another congregation, or heathen; Therefore, [according to a congregationalist] they cannot teach them as pastors. It follows not, ex negatione speciei, non sequitur negatio generis [out of the negation of a species the negation of a genus does not follow]: This is not a man, therefore this is not a living creature. So: 1. A single pastor, he alone cannot excommunicate an offender of his own congregation; for one man is not a Church, therefore he cannot preach as a pastor to this offender. The consequence is most false… 2. Paul and Barnabas preach as sent pastors authorized both by God, and the laying on of hands, and praying of the prophets at Antioch, Acts 13; but they have no power to excommunicate the gentiles, who are yet no members of the Church, nor baptized. Paul, Acts 16:15, is sent to preach to Macedonia, without their choosing him to be their pastor; and yet Paul could not cast out those that were no members until they should be member.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 10, p. 470</span></figcaption>

<blockquote><p>8. In the last rubric after Communion of the Sick, it is said: ‘In the time of the plague, sweat, or such other like contagious times of sicknesses or diseases, when none of the parish, or neighbors, can be gotten to communicate with the sick in their houses, for fear of the infection, upon special request of the diseased, the minister may only communicate with him.’ By this, the minister is bound not only to visit every person sick of the plague, etc. (standing at some distance) but, to administer the Lord’s Supper also to him, if he desire it; and that alone, if none else will join, as it is not to be expected they should. This is no way agreeable to Christianity, or common humanity. Not to Christianity: for, first, the very nature of the sacrament requires a public administration, because there must be a Communion of more than two persons in the receiving of it. This appears plainly by several other rubrics of the same book. For: 1. in the first rubric after the public Communion, it is ordered, that, ‘if there be not above twenty persons in the parish, of discretion to receive the Communion, yet there shall be no Communion, except four, or three at the least communicate with the priest.’ If it be said, this is the order for public Communions; but, it concerns not private Communions of the sick: it is answered, 1. that it appears not by the Word, that there is any warrant, much less necessity for such private Communions: for, the first rubric after Communion of the sick, directs the minister thus: ‘If a man, either by extremity of sickness, or for want of warning in due time to the curate, or for lack of company to receive with him, or by any other just impediment, do not receive the sacrament of Christ’s Body and Blood; then the curate shall instruct him, that if he do truly repent of his sins, and steadfastly believe that Jesus Christ hath suffered death upon the cross for him, and shed his Blood for his Redemption, earnestly remembering the benefits he has thereby, and giving him hearty thanks therefore’ (without all which, what good will be get by receiving the sacrament?) ‘he does eat and drink the body and blood of our Savior Christ profitably to his soul’s health, although he do not receive the sacrament with his mouth.’ 2. In the rubric before the Communion of the sick, this order is given, that the curate having ‘knowledge overnight, or early in the morning,’ of the desire of the sick person to receive the Communion, and being signified ‘also how many be appointed to communicate with him, and having a convenient place in the sick man’s house, where the curate may reverently minister, and a good number to receive the Communion with the sick person, with all things necessary for the same, he shall there minister the holy Communion.’ Therefore by these rubrics, no Communion is to be ministered to the sick, where there be but two to receive it. Secondly, this is also no way agreeable to humanity. Must a minister, who has the charge of many souls, adventure his health, and life, to gratify an infectious person in that which (as by what has been before alleged) is no way of necessity to the sick man’s salvation? Must the minister do this, or be punished with deprivation, or otherwise? What cruelty is this? Nay, the very Canons of 1603, Canon 67, provided more mercifully than so; which runs thus: ‘When any person is dangerously sick in any parish, the minister or curate (having knowledge thereof) shall resort to him or her, (if the disease be not known, or probably suspected to be infectious) to instruct and comfort them,’ etc. Here is a dispensation in case of the plague, or other infectious disease, for so much as visiting the sick: and no word at all of giving the Holy Communion. So much shall at present suffice to be spoken of the rubrics.</p></blockquote>

<blockquote><p>Many and weighty reasons move me to think that the Lord’s Supper ought not to be denied to the sick. Meanwhile, I see how very easily this practice has fallen into many abuses, which ought prudently and diligently to be prevented. For unless there be a true communion, it departs wrongly from the sacred institution of Christ. Therefore, there ought to be some gathering of persons — of relatives, friends, and neighbors — so that the distribution may be made according to the command of Christ; then the action should be joined with an explanation of the mystery, and nothing should be done that differs from the ordinary order of the Church. To carry it about here and there indiscriminately is also very dangerous. And here it is most difficult to guard against the danger, lest superstition move some, and ambition or vain display move others, to request it. Therefore there is need of judgment and discretion, that it be given to none except in great peril of life. To bring bread from the temple as if it were sacred is a perverse inversion; and to carry it in procession is in no way to be tolerated.</p></blockquote>

<blockquote><p>…it becometh not Mr. Hooker with Arminians and Socinians to impeach the wisdom of the Holy One, because He appoints the giving of the seals, baptism to Judas and to Magus, who have no right, true and real in foro Dei [in the court of God], in the Decree of God, and in his holy intention, as I spake [on] pp. 248, 249, to the seals, and the grace sealed; nor to the engraven Law, and God’s teaching of the heart, and to perseverance; .. Again, God giveth a right to the seals to hypocrites; that is, he commandeth the Church to give the seals to Magus, whether such really or hypocritically believe; this is a right not properly inherent in visible members, for their profession, yea, or their supposed conversion: 1. Because all saving and real right to ordinances is relative to election to glory, and flows from the merit of Christ’s death; but visible professors, as such, of whose society Magus and Judas are, have not any saving and real right, as chosen and redeemed in Christ, by grant of our [Congregationalist] Brethren. 2. A right flowing only from an external profession, and from composed hypocrisy in Magus, is no true right; a lie cannot give a true right: I offend that Mr. Hooker so anxiously contends for a charter to such bastards as Magus. 3. It is a favor to hear the Gospel and partake of the seals; and jus activum, ‘an active right’ the Church and ministers have to call and admit to the seals all who profess as Magus, that the elect in the visible Church may be converted, but it is not a right proprie dictum ne quidem Ecclesiasticum [properly said with certainty to the Church], that they have who are such hypocrites as Judas and Magus; for the command and revealed Will of God most unproperly is said to give Magus a right to the seals: Except [for] Mr. Hooker, never [a] divine so spake; the command reveals the right, but gives none. As also the right of visible professors is jus passivum, and a conditional and passive right; for Magus and Judas have no right to be visible members, or to partake of the seals, yea or to profess the Covenant and Name of God, Ps. 50:16, but upon condition of faith: for God cannot command sin and an hypocritical profession: yea, He forbids [their] treading in his courts, Isa. 1:12-13, except they repent and believe, vv. 16, 17; therefore Magus sins in professing, and in being baptized: he remaining rotten. But the Church sins not, but does the command of Christ in calling, inviting all that profess, whether they be really, or in the judgement of charity, converts or no. Which distinction not being observed, our [congregationalist] Brethren and Mr. Hooker mistake the nature of an ecclesiastical right; for the Lord in the command gives to all visible professors, such as Peter, who really believe, both the ecclesiastic and external right to the seals which He decreed to give them, and the same internal and real right which they have by faith, and no other than according to his eternal decree, they have given them in time by real believing. But for hypocrites, as Magus, they have no right ecclesiastic to the seals, but a sort of active and permissive right, by which they claim room in the visible Church, and the seals from the Church. Therefore taking the Church-visible as only visible, as contra-distinguished from the invisible and really believing: and as visibility is common to both Peter and Magus, and their external profession obvious to the eye of man, so the visible Church hath no right that is true and real to the seals. So I retort the Argument upon Mr. Hooker: True real believers, as Peter, and hypocrites, as Magus, have either one and the same Church-right to membership and seals, or another, and diverse. The same right they cannot have: 1. Because the right of truly and really believing ones, is according to the decree of election, such as the Lord ordained to be purchased to them by the merits of Christ, and also according to the Lord’s revealed Will. He who believes hath right to eat of the Tree of Life, and to membership and seals: But this right Magus and hypocrites have not, for they have no part in Christ. 2. The right that believers, as Peter and John, have, is by fulfilling of the condition. He who believes, and loves to be reformed, hath right to the Covenant, promises, to perseverance, to the anointing that teacheth all things. These are promised and decreed to them, Jer. 31:33-34 &amp; 32:38-40; Isa. 54:10-11 &amp; 59:20-21; compared with Acts 13:47-48; Jn. 6:44-46 &amp; 6:37 &amp; 10:26-27; and to them only, not to Magus and to reprobates. 3. Magus, and such like wooden and tree-legs, might claim the same life, living membership, lively and vital operations, and to have the anointing, and to be kept through faith unto salvation by the power of God, 1 Pet. 1:4 and to have the fear of God put in their hearts, that they should not depart from God, as Jer. 31:39-40, if they have the same right to membership and the seals in their substance and grace signified with sound believers. And this is most absurd.</p></blockquote>

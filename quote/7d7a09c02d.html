<blockquote><p>Here are two parts of this law, the commandment, &amp; the reason of the same. And again, there are two parts of the commandment, of the which the one is moral or everlasting, namely, that the Sabbath be hallowed, that is to say, that some certain time be appointed for the ministry of the Church, or public worship of God. The other is ceremonial, and for a time, namely, that this time should be the seventh day, and that in it should be observed and kept the ceremonies of the Levitical law. And that this part is for a time, and the other everlasting, we do understand by the end of the commandment, and causes of both these parts.

The end of the commandment is the public praising of God in the congregation, or the conservation or maintenance and use of the ministry of the Church, which is an office ordained by God, to teach the Church concerning God and his will out of the word of God delivered by the Prophets and Apostles, and to minister the sacraments according to the ordinance of God. And God would have at all times of the world that there should be public assemblies of the Church, in the which should sound true doctrine concerning God, for these causes especially.</p></blockquote>

<blockquote><p>Northampton, May 18, 1742.

My dear Friend,

I am fully satisfied by the account your father has given me, that you have lately gone out of the way of your duty, and done that which did not belong to you, in exhorting a public congregation. I know you to be a person of good judgment and discretion, and therefore can with the greater confidence put it to you to consider with yourself what you can reasonably judge would be the consequence, if I and all other ministers should approve and publicly justify such things as laymen’s taking it upon them to exhort after this manner? If one may, why may not another? And if there be no certain limits or bounds, but every one that pleases may have liberty, alas! what should we soon come to? If God had not seen it necessary that such things should have certain limits and bounds, he never would have appointed a certain particular order of men to that work and office, to be set apart to it in so solemn a manner, in the name of God: the Head of the church is wiser than we, and knew how to regulate things in his church.

’Tis no argument that such things are right, that they do a great deal of good for the present, and within a narrow sphere; when, at the same time, if we look on them in the utmost extent of their consequences, and on the long run of events, they do ten times as much hurt as good. Appearing events are not our rule, but the law and the testimony. We ought to be vigilant and circumspect, and look on every side, and, as far as we can, to the further end of things. God may if he pleases, in his sovereign providence, turn that which is most wrong to do a great deal of good for the present; for he does what he pleases. I hope you will consider the matter, and for the future avoid doing thus.

You ought to do what good you can, by private, brotherly, humble admonitions and counsels; but ’tis too much for you to exhort public congregations, or solemnly to set yourself, by a set speech, to counsel a room full of people, unless it be children, or those that are much your inferiors, or to speak to any in an authoritative way. Such things have done a vast deal of mischief in the country, and have hindered the work of God exceedingly. Mr. [Gilbert] Tennent has lately wrote a letter to one of the ministers of New- England, earnestly to dissuade from such things.

Your temptations are exceeding great: you had need to have the prudence and humility of ten men. If you are kept humble and prudent, you may be a great blessing in this part of the land, otherwise you may do as much hurt in a few weeks as you can do good in four years. You might be under great advantage by your prudence to prevent those irregularities and disorders in your parts, that prevail and greatly hinder the work of God in other parts of the country; but by such things as these you will weaken your own hands, and fill the country with nothing but vain and fruitless and pernicious disputes. Persons when very full of a great sense of things are greatly exposed; for then they long to do something, and to do something extraordinary; and then is the devil’s time to keep them upon their heads, if they be not uncommonly circumspect and self-diffident.

I hope these lines will be taken in good part, from your assured friend,

Jonathan Edwards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Anon., 18 May 1742 in Edwards A. Park, ‘What can be done for augmenting the number of Christian ministers?’, Bibliotheca Sacra, 28, no. 109 (January 1871), pp 95-96.</cite></span></figcaption>

</figure><figure class="quote" id="q-bcc84caac2" data-kw="">
<blockquote><p>But it must be shew’d thirdly, how long this rest must continue, to which the answer is For a whole natural day, for of what quantity the foregoing six are, of that must the seventh be which cometh betwixt six in numbering, even four and twenty hours. If it be demanded at what time the day must begin and end: it is answered, when the first of the six following beginneth, and seeing God’s intention was not to bind all Nations to begin and end their days at one period, and that we cannot tie the seventh day, but we must in like manner tie the days before, and after, to a set period of beginning and ending; it is apparent that by this Commandment we are not tied to any set beginning or ending, but must follow the common computation and reckoning of other days which is amongst us, from twelve of the clock at night to twelve the next night, for we say twelve at night, and one a clock in the morning.

Neither is it any inconvenience that in some Countries the Sabbath shall be in being before and after the being of it in others, for the same inconvenience must needs follow upon any kind of beginning or ending either by Sun-set or Sun-rising (unless God had named a special hour which he hath not) for the Sun riseth and setteth in some places three or four, five or six hours sooner then in others, for a good space of the year at least. Yea in some Countries they have but two Sun-risings and Sun-settings in one year, that is, one half-year day, the other night. See Cartw. [Thomas Cartwright] Catechism.</p></blockquote>

— Edward Leigh, A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor, (London: William Lee, 1654), IX.V, pp 818-19.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+it+must+be+shew%E2%80%99d+thirdly%2C+how+long+this+rest+must+continue%2C+to+which+the+answer+is+For+a+whole+natural+day%2C+for+of+what+quantity+the+foregoing+six+are%2C+of+that+must+the+seventh+be+which+cometh+betwixt+six+in+numbering%2C+even+four+and+twenty+hours.+If+it+be+demanded+at+what+time+the+day+must+begin+and+end%3A+it+is+answered%2C+when+the+first+of+the+six+following+beginneth%2C+and+seeing+God%E2%80%99s+intention+was+not+to+bind+all+Nations+to+begin+and+end+their+days+at+one+period%2C+and+that+we+cannot+tie+the+seventh+day%2C+but+we+must+in+like+manner+tie+the+days+before%2C+and+after%2C+to+a+set+period+of+beginning+and+ending%3B+it+is+apparent+that+by+this+Commandment+we+are+not+tied+to+any+set+beginning+or+ending%2C+but+must+follow+the+common+computation+and+reckoning+of+other+days+which+is+amongst+us%2C+from+twelve+of+the+clock+at+night+to+twelve+the+next+night%2C+for+we+say+twelve+at+night%2C+and+one+a+clock+in+the+morning.%0A%0ANeither+is+it+any+inconvenience+that+in+some+Countries+the+Sabbath+shall+be+in+being+before+and+after+the+being+of+it+in+others%2C+for+the+same+inconvenience+must+needs+follow+upon+any+kind+of+beginning+or+ending+either+by+Sun-set+or+Sun-rising+%28unless+God+had+named+a+special+hour+which+he+hath+not%29+for+the+Sun+riseth+and+setteth+in+some+places+three+or+four%2C+five+or+six+hours+sooner+then+in+others%2C+for+a+good+space+of+the+year+at+least.+Yea+in+some+Countries+they+have+but+two+Sun-risings+and+Sun-settings+in+one+year%2C+that+is%2C+one+half-year+day%2C+the+other+night.+See+Cartw.+%5BThomas+Cartwright%5D+Catechism.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+system+or+body+of+divinity+consisting+of+ten+books%3A+wherein+the+fundamentals+and+main+grounds+of+religion+are+opened%2C+the+contrary+errors+refuted%2C+most+of+the+controversies+between+us%2C+the+papists%2C+Arminians%2C+and+Socinians+discussed+and+handled%2C+several+Scriptures+explained+and+vindicated+from+cor%2C+%28London%3A+William+Lee%2C+1654%29%2C+IX.V%2C+pp+818-19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbcc84caac2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bcc84caac2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/12/12/edward-leigh-on-the-time-for-observing-the-christian-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

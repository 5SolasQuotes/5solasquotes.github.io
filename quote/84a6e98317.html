<main class="wrap"><figure class="quote" id="q-84a6e98317" data-kw="">
<blockquote><p>Such works (that obtain a reward) are not only those of condign merit, but also: (1) the execution of a donation or almsgiving that is entirely gratuitous, which a poor man, humbly and faithfully waiting for it, does not render void by contempt or ingratitude; (2) the execution of a promise which is made not only under the condition of accepting and not despising the gift (a condition which no donation is so free as not to include), but also of a certain work besides—on which account it is in some sense meritorious, even though there may perhaps be no equality or commutation between this work and the promised reward; as, for example, if a father promises a jewel to his son who takes bitter medicine. Yet this is not a purely gratuitous donation, since the thing does not begin to be owed as soon as the promise is accepted, but when the condition has been fulfilled; nor is it properly merit of condignity, since the one acting benefits himself rather than gives something to another for which he ought to receive an equal price. But it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children to whom God has promised rewards, we admit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-crocius.html">Ludovicus Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma, bk. 4, ch. 18, pp. 1130-31, as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 369-70, trans. ChatGPT-5 Crocius (1586 – 1653 or 1655) was a German reformed minister, a delegate at the Synod of Dort and a professor of theology and philosophy in Bremen.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>The theology of the blessed or the exalted theology is the wisdom of divine matters communicated in the Spirit of God according to the measure of Christ with those who dwell in heaven; according to this theology they enjoy the eternal, gracious, and glorious vision of God for His glory.</p></blockquote>

</figure><figure class="quote" id="q-1f924395fc" data-kw="">
<blockquote><p>4. In the first operation of this light of glory, believers shall so behold the glory of Christ, and the glory of God in Him, as that therewith and thereby they shall be immediately and universally changed into his likeness. They shall be as He is, when they shall see Him as He is. There is no growth in glory, as to parts— there may be as to degrees. Additions may be outwardly made unto what is at first received as by the resurrection of the body; but the internal light of glory and its transforming efficacy is capable of no degrees, though new revelations may be made unto it unto eternity. For the infinite fountain of life and light, and goodness, can never be fathomed, much less exhausted. And what God spake on the entrance of sin, by the way of contempt and reproach, ‘Behold, the man is become like one of us!’ upbraiding him with what he had foolishly designed—on the accomplishment of the work of his grace, He says in love and infinite goodness, “Man is become like one of us, in the perfect restoration of our image in him.’ This is the first effect of the light of glory. … 4. …For, as it is expressly assigned thereunto in the Scripture, so whereas it contains the perfect operation of our minds and souls in a perfect state, on the most perfect object, it is the only mea.ns of our blessedness. And this is the true cause whence there neither is nor can be any satiety or weariness in heaven, in the eternal contemplation of the same glory. For not only the object of our sight is absolutely infinite, which can never be searched unto the bottom, yea, is perpetually new unto a finite understanding; but our subjective blessedness consisting in continual fresh communications from the infinite fulness of the divine nature, derived unto us through vision, is always new, and always will be so to eternity. Herein shall all the saints of God drink of the rivers of pleasure that are at his right hand, be satisfied with his likeness, and refresh themselves in the eternal springs of life, light, and joy for evermore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses on the Glory of Christ, ch. 14, ‘Other Differences…’ in Works, vol. 1</cite>, pp. 412-14</span></figcaption>

</figure><figure class="quote" id="q-605a0ea47d" data-kw="saints know one another">
<blockquote><p>Will the saints in the other world know one another? We affirm. As in the Scriptures nothing is taught expressly and distinctly on this question, so nothing is set forth to be necessarily believed concerning it. In the meanwhile, the more common opinion is the affirmative, which asserts that the saints will know each other. In our opinion, this is also the more probable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.11.1</span></figcaption>

</figure><figure class="quote" id="q-fc4e5a232a" data-kw="">
<blockquote><p>For man knows God naturally in the same way as he desires him naturally. Now man desires him naturally insofar as he naturally desires happiness, which is a likeness of the divine goodness. Hence it does not follow that God considered in Himself is naturally known to man, but that his likeness is. Therefore, man must come by reasoning to know God in the likenesses to Him which he discovers in God’s effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1, ch. 11</cite></span></figcaption>

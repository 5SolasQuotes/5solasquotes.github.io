<main class="wrap"><figure class="quote" id="q-9eb0413e17" data-kw="">
<blockquote><p>I have said that the Popes abused their power by exercising it, not in the interests of the peoples whom they claimed to govern, but in their own; and I must add, not in the interests of anything that can plausibly claim the high name of religion, but of the most vulgar ambition. For the Popes were not content with the lofty position of being supreme judges over temporal princes: they wanted to be temporal princes themselves; and when they sought to aggrandize their dominions they freely used the spiritual weapon of excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XXIII</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/temporal-power.html">Temporal power</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c5fe3bfc8" data-kw="">
<blockquote><p>For it is a certain mystery of iniquity, which in words establishes Christ, but in fact destroys him. This is the very antichristianism of the papists, who leave indeed the natures of Christ intact, but make away with the offices of Christ, and consequently Christ himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, p. 41</span></figcaption>

— William Whitaker, A Disputation on Holy Scripture, p. 41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+it+is+a+certain+mystery+of+iniquity%2C+which+in+words+establishes+Christ%2C+but+in+fact+destroys+him.+This+is+the+very+antichristianism+of+the+papists%2C+who+leave+indeed+the+natures+of+Christ+intact%2C+but+make+away+with+the+offices+of+Christ%2C+and+consequently+Christ+himself.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+p.+41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c5fe3bfc8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c5fe3bfc8.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.”

— John Calvin, Institutes of the Christian Religion, 4.6.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+question%2C+then%2C+may+be+thus+stated%2C+Is+it+necessary+for+the+true+order+of+the+hierarchy+%28as+they+term+it%29%2C+or+of+ecclesiastical+order%2C+that+one+See+should+surpass+the+others+in+dignity+and+power%2C+so+as+to+be+the+head+of+the+whole+body%3F+We+subject+the+Church+to+unjust+laws+if+we+lay+this+necessity+upon+her+without+sanction+from+the+word+of+God.+%E2%80%A6+Every+one+knows+that+the+high+priest+was+a+type+of+Christ%3B+now%2C+the+priesthood+being+transferred%2C+that+right+must+also+be+transferred.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.6.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5dd7f1a21d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5dd7f1a21d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.”

— John Calvin, Institutes of the Christian Religion, 4.7.24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CShall+we+recognise+the+Apostolic+See+where+we+see+nothing+but+horrible+apostasy%3F+Shall+he+be+the+vicar+of+Christ+who%2C+by+his+furious+efforts+in+persecuting+the+Gospel%2C+plainly+declares+himself+to+be+Antichrist%3F+Shall+he+be+the+successor+of+Peter+who+goes+about+with+fire+and+sword+demolishing+everything+that+Peter+built%3F+Shall+he+be+the+Head+of+the+Church+who%2C+after+dissevering+the+Church+from+Christ%2C+her+only+true+Head%2C+tears+and+lacerates+her+members%3F+Rome%2C+indeed%2C+was+once+the+mother+of+all+the+churches%2C+but+since+she+began+to+be+the+seat+of+Antichrist+she+ceased+to+be+what+she+was.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.7.24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd5daca24a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd5daca24a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>

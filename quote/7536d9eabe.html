<main class="wrap"><figure class="quote" id="q-7536d9eabe" data-kw="">
<blockquote><p>The Ten Commandments, accordingly, were published from Sinai in the form of a covenant, or federal, transaction. The Sinai transaction was a mixed dispensation. In it, the covenant of grace was repeated and published; the covenant of works was awfully displayed in subservience thereto; and a national covenant between God and the Israelites was also made as an appendage to the covenant of grace. Accordingly, the law of the Ten Commandments was thence promulgated by the Son of God, the glorious Mediator, as a rule of life to believers in a manner suited to the covenant of grace. The same law was repeated and displayed to the Israelites in the form of the covenant of works, and it was published to them as the matter of a national covenant, or covenant of peculiarity, between God and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cae1b72584" data-kw="">
<blockquote><p>You shall have no other gods. 1 What this means: You shall have Me alone as your God. What is the meaning of this, and how is it to be understood? What does it mean to have a god? Or, what is God? 2 Answer: A god means that from which we are to expect all good and in which we are to take refuge in all distress. So, to have a God is nothing other than trusting and believing Him with the heart. I have often said that the confidence and faith of the heart alone make both God and an idol. 3 If your faith and trust is right, then your god is also true. On the other hand, if your trust is false and wrong, then you do not have the true God. For these two belong together, faith and God [Hebrews 11:6]. Now, I say that whatever you set your heart on and put your trust in is truly your god.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concordia: The Lutheran Confessions</cite>, ed. Paul Timothy McCain (St. Louis, MO: Concordia Publishing House, 2005), 359.</span></figcaption>

<blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote>

</figure><figure class="quote" id="q-773bd4c750" data-kw="sixth commandment homicide">
<blockquote><p>Because various cases can occur in which homicide can either be lawful or unlawful and to be condemned, hence arises the question—What is prohibited in the sixth precept, “Thou shalt not kill,” and what is not? First negatively, judicial homicide is not prohibited. Are the rights of war and punishment contained under this commandment? Are suicide and duelling prohibited? The former we deny; the latter we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.16.1–2</span></figcaption>

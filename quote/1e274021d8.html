<blockquote><p>As the Party contracting on the side of man, was a Representative, so the party contracted for, were represented by him. Those whom one represents in a covenant, he contracts for, in that covenant; and those for whom one contracts, in a covenant made with him as a representative, he represents in that covenant.

As, in the covenant of works, those whom the first Adam contracted for, he represented, and those whom he represented, he contracted for; so, in the covenant of grace, those whom the second Adam contracted for, he represented, and those whom he represented, he contracted for. These two then, the persons represented, and the persons contracted for, are the same, and therefore must be of equal latitude.

Now the party whom, the Lord Jesus, in the covenant of grace, represented and contracted for, are the elect of mankind; a certain number of the posterity of Adam, chosen from eternity, to everlasting life; the children, partakers of flesh and blood, whom God gave to Christ as the second Adam, to be by him redeemed from sin and wrath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 41.</span></figcaption>

<blockquote><p>The covenant of grace, then, was made with Jesus Christ, as the second Adam, party-contractor: Psalm lxxxix. 3, “I have made a covenant with my chosen.” Compared with 1 Cor. xv. 45, “The last Adam was made a quickening spirit.” Gal. iii. 16, “Now to Abraham and his seed were the promises made. He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ.” Rom. v. 15, to the end.

And Christ in this covenant represented all the elect, as his spiritual seed, the parties contracted for: Gal. iii. 16, forecited. Isa. liii. 10, 11, “Yet it pleased the Lord to bruise him, he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand. He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.”

Then the covenant of redemption, and the covenant of grace, are not two distinct covenants, but two names of one covenant, under different considerations. That appears, in that the number of the covenants in Scripture is but two, whereof the covenant of works is one: Gal. iv. 24, “For these are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” By a covenant of redemption is meant a bargain of buying and selling; and the second covenant was such a covenant to Christ only: 1 Pet. i. 18, 19, “Forasmuch as ye know that ye were not redeemed with corruptible things, as silver and gold, from your vain conversation received by tradition from your fathers; but with the precious blood of Christ, as of a Lamb without blemish and without spot.”

By a covenant of grace is meant a bargain, whereby all is to be had freely; and it is such a covenant to poor sinners only: Is. lv. 1, “Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy and eat, yea, come, buy wine and milk without money, and without price.” The covenant of grace was made from eternity; Tit. i. 2, “In hope of eternal life, which Clod that cannot lie, promised before the world began.” Yet is it the second covenant, in respect of order and manifestation to the world, though it was first in being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 39-40 (emphasis added).</span></figcaption>

</figure><figure class="quote" id="q-b5b3f6611f" data-kw="">
<blockquote><p>That the elect were the party represented, or contracted and undertaken for, in the covenant of grace, appears from the following grounds.

1. The party with whom the covenant was made, is in the text called God’s chosen; as representing and contracting for all the chosen or elect: even as the first man was called Adam or man, as representing and contracting for all mankind in his covenant. For, as the apostle teacheth, Heb. ii. 11, He —and they — are all of one not only of one nature, but also of one body, to wit, the election; Christ is the head elect, Isa. xlii. 1, they the body elect, Eph. v. 23. Therefore they go under one name, principally belonging to him, and then to them by participation with him. Thus ho is also called Abraham’s seed, as representing all the spiritual seed of Abraham, that is, the elect, Gal. iii. 16, “And to thy seed which is Christ;” and the seed of the woman, as opposed to the serpent’s seed; and under that name also the elect are comprehended; they, and they only, being the party betwixt whom and the serpent with his seed, God puts the enmity, according to the promise, Gen. iii. 15.

2. Those whom Christ represented and contracted for in the covenant of grace, are the heavenly men: 1 Cor. xv. 47, 48, “The first man is of the earth, earthy: the second man is the Lord from heaven. As is the earthy, such are they also that are earthy; and as is the heavenly, such are they also that are heavenly.” Now, the heavenly men, belonging to Christ the second man, arc none other but the elect. For they are contra-distinguished to the earthy men, belonging to the first man; to wit, all mankind taken into the first covenant in Adam: and therefore they are the elect men, taken into the second covenant, in the second Adam.

Again, the heavenly men are those who shall bear the image of the heavenly man Christ, ver. 49; and such are the elect, and they alone. And, finally, they are those to whom Christ is, in respect of efficacy, a quickening spirit: for “as is the heavenly, such are they also that are heavenly.” As Adam’s deadly efficacy goes as wide as his representation did in the first covenant, reaching all mankind his natural seed, and them only; so Christ’s quickening efficacy goes as wide as his representation did in the second covenant, reaching all the elect, his spiritual seed, and them only: and if it did not, some would be deprived of the benefit which was purchased and paid for, by the surety, in their name: the which is not consistent with the justice of God.

3. They whom Christ represented and contracted for in the covenant, are his seed, his spiritual seed: Gal. iii. 16. “Now to Abraham and his seed were the promises made. He saith—and to thy seed, which is Christ.” Psalm lxxxix. 3, 4, “I have sworn unto David my servant. Thy seed will I establish for ever.” In the covenants typical of the covenant of grace, the parties represented were the seed of the representatives they were made with, as was cleared before: and in the first Adam’s covenant, his natural seed were the represented.

Wherefore, in the second Adam’s covenant, his spiritual seed are the represented. Now, Christ’s spiritual seed are the elect, and none other; for they are those whom he begets with the word of truth, Jam. i. 18. and are born again (1 Pet. i.23.) unto him in their regeneration; whom therefore lie sees as his seed, with his own image on them, Isa. liii. 10. They are the travail of his soul, who, sooner or later, are, all of them, justified, ver. 11. They are the seed that shall serve him, Psalm xxii. 30; which shall be established and endure for ever, namely, in a state of happiness, Psalm Ixxxix. 4, 29, 30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 400-01.</span></figcaption>

<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>

<blockquote><p>XV. In Scripture, we find two covenants of God with man: the Covenant of Works, otherwise called, the Covenant of Nature, or the Legal and the Covenant of Grace. The apostle teacheth us this distinction, Rom. 3:27, where he mentions the law of works, and the law of faith by the law of works, understanding that doctrine which points out the way in which, by means of works, salvation is obtained; and by the law of faith, that doctrine which directs by faith to obtain salvation. The form of the covenant of works is, “The man that doth these things shall live by them,” Rom. 10:5. That of the covenant of grace is, “Whosoever believeth in him shall not be ashamed,” Rom. 10:11. These covenants of mercy agree, 1st. That, in both, the contracting parties are the same, God and man. 2dly. In both, the same promise of eternal life, consisting in the immediate fruition of God. 3dly. The condition of both is the same, viz., perfect obedience to the law. Nor would it have been worthy of God to admit man to a blessed communication with him, but in the way of unspotted holiness. 4thly. In both, the same end, the glory of the most unspotted goodness of God. But in these following particulars they differ: 1st. The character or relation of God and man, in the covenant of works, is different from what it is in the covenant of grace. In the former, God treats as the Supreme Lawgiver, and the Chief Good, rejoicing to make his innocent creature a partaker of his happiness. In the latter, as infinitely merciful, adjudging life to the elect sinner consistently with his wisdom and justice. 2dly. In the covenant of works there was no mediator. In that of grace, there is the mediator, Christ Jesus. 3dly. In the covenant of works, the condition of perfect obedience was required to be performed by man himself, who had consented to it. In that of grace, the same condition is proposed, as to be, or as already performed, by a mediator. And in this substitution of the person consists the principal and essential difference of the covenants. 4thly. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore, man’s glorying is not excluded, but he may glory, as a faithful servant may do, upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man, in himself ungodly, is considered in the covenant as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. 5thly. In the covenant of works, something is required of man, as a condition which, performed, entitles him to the reward. The covenant of grace, with respect to us, consists of the absolute promises of God, in which the mediator, the life to be obtained by him, the faith by which we may be made partakers of him, the benefits purchased by him, and the perseverance in that faith, in a word, the whole of salvation, and all the requisites to it, are absolutely promised. 6thly. The special end of the covenant of works was, the manifestation of the holiness, goodness, and justice of God, conspicuous in the most perfect law, most liberal promise, and in that recompense of reward, to be given to those who seek him with their whole heart. The special end of the covenant of grace is, “the praise of the glory of his grace,” Eph. 1:6, and the revelation of his unsearchable and manifold wisdom: which divine perfections shine forth with lustre in the gift of a mediator, by whom the sinner is admitted to complete salvation, without any dishonour to the holiness, justice, and truth of God. There is also a demonstration of the all-sufficiency of God, by which not only man, but even a sinner, which is more surprising, may be restored to union and communion with God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XV. In Scripture, we find two covenants of God with man: the Covenant of Works, otherwise called, the Covenant of Nature, or the Legal and the Covenant of Grace. The apostle teacheth us this distinction, Rom. 3:27, where he mentions the law of works, and the law of faith by the law of works, understanding that doctrine which points out the way in which, by means of works, salvation is obtained; and by the law of faith, that doctrine which directs by faith to obtain salvation. The form of the covenant of works is, “The man that doth these things shall live by them,” Rom. 10:5. That of the covenant of grace is, “Whosoever believeth in him shall not be ashamed,” Rom. 10:11. These covenants of mercy agree, 1st. That, in both, the contracting parties are the same, God and man. 2dly. In both, the same promise of eternal life, consisting in the immediate fruition of God. 3dly. The condition of both is the same, viz., perfect obedience to the law. Nor would it have been worthy of God to admit man to a blessed communication with him, but in the way of unspotted holiness. 4thly. In both, the same end, the glory of the most unspotted goodness of God. But in these following particulars they differ: 1st. The character or relation of God and man, in the covenant of works, is different from what it is in the covenant of grace. In the former, God treats as the Supreme Lawgiver, and the Chief Good, rejoicing to make his innocent creature a partaker of his happiness. In the latter, as infinitely merciful, adjudging life to the elect sinner consistently with his wisdom and justice. 2dly. In the covenant of works there was no mediator. In that of grace, there is the mediator, Christ Jesus. 3dly. In the covenant of works, the condition of perfect obedience was required to be performed by man himself, who had consented to it. In that of grace, the same condition is proposed, as to be, or as already performed, by a mediator. And in this substitution of the person consists the principal and essential difference of the covenants. 4thly. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore, man’s glorying is not excluded, but he may glory, as a faithful servant may do, upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man, in himself ungodly, is considered in the covenant as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. 5thly. In the covenant of works, something is required of man, as a condition which, performed, entitles him to the reward. The covenant of grace, with respect to us, consists of the absolute promises of God, in which the mediator, the life to be obtained by him, the faith by which we may be made partakers of him, the benefits purchased by him, and the perseverance in that faith, in a word, the whole of salvation, and all the requisites to it, are absolutely promised. 6thly. The special end of the covenant of works was, the manifestation of the holiness, goodness, and justice of God, conspicuous in the most perfect law, most liberal promise, and in that recompense of reward, to be given to those who seek him with their whole heart. The special end of the covenant of grace is, “the praise of the glory of his grace,” Eph. 1:6, and the revelation of his unsearchable and manifold wisdom: which divine perfections shine forth with lustre in the gift of a mediator, by whom the sinner is admitted to complete salvation, without any dishonour to the holiness, justice, and truth of God. There is also a demonstration of the all-sufficiency of God, by which not only man, but even a sinner, which is more surprising, may be restored to union and communion with God.”

— Herman Witsius, The Economy of the Covenants between God and Man, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), 26–27.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXV.+In+Scripture%2C+we+find+two+covenants+of+God+with+man%3A+the+Covenant+of+Works%2C+otherwise+called%2C+the+Covenant+of+Nature%2C+or+the+Legal+and+the+Covenant+of+Grace.+The+apostle+teacheth+us+this+distinction%2C+Rom.+3%3A27%2C+where+he+mentions+the+law+of+works%2C+and+the+law+of+faith+by+the+law+of+works%2C+understanding+that+doctrine+which+points+out+the+way+in+which%2C+by+means+of+works%2C+salvation+is+obtained%3B+and+by+the+law+of+faith%2C+that+doctrine+which+directs+by+faith+to+obtain+salvation.+The+form+of+the+covenant+of+works+is%2C+%E2%80%9CThe+man+that+doth+these+things+shall+live+by+them%2C%E2%80%9D+Rom.+10%3A5.+That+of+the+covenant+of+grace+is%2C+%E2%80%9CWhosoever+believeth+in+him+shall+not+be+ashamed%2C%E2%80%9D+Rom.+10%3A11.+These+covenants+of+mercy+agree%2C+1st.+That%2C+in+both%2C+the+contracting+parties+are+the+same%2C+God+and+man.+2dly.+In+both%2C+the+same+promise+of+eternal+life%2C+consisting+in+the+immediate+fruition+of+God.+3dly.+The+condition+of+both+is+the+same%2C+viz.%2C+perfect+obedience+to+the+law.+Nor+would+it+have+been+worthy+of+God+to+admit+man+to+a+blessed+communication+with+him%2C+but+in+the+way+of+unspotted+holiness.+4thly.+In+both%2C+the+same+end%2C+the+glory+of+the+most+unspotted+goodness+of+God.+But+in+these+following+particulars+they+differ%3A+1st.+The+character+or+relation+of+God+and+man%2C+in+the+covenant+of+works%2C+is+different+from+what+it+is+in+the+covenant+of+grace.+In+the+former%2C+God+treats+as+the+Supreme+Lawgiver%2C+and+the+Chief+Good%2C+rejoicing+to+make+his+innocent+creature+a+partaker+of+his+happiness.+In+the+latter%2C+as+infinitely+merciful%2C+adjudging+life+to+the+elect+sinner+consistently+with+his+wisdom+and+justice.+2dly.+In+the+covenant+of+works+there+was+no+mediator.+In+that+of+grace%2C+there+is+the+mediator%2C+Christ+Jesus.+3dly.+In+the+covenant+of+works%2C+the+condition+of+perfect+obedience+was+required+to+be+performed+by+man+himself%2C+who+had+consented+to+it.+In+that+of+grace%2C+the+same+condition+is+proposed%2C+as+to+be%2C+or+as+already+performed%2C+by+a+mediator.+And+in+this+substitution+of+the+person+consists+the+principal+and+essential+difference+of+the+covenants.+4thly.+In+the+covenant+of+works%2C+man+is+considered+as+working%2C+and+the+reward+to+be+given+as+of+debt%3B+and+therefore%2C+man%E2%80%99s+glorying+is+not+excluded%2C+but+he+may+glory%2C+as+a+faithful+servant+may+do%2C+upon+the+right+discharge+of+his+duty%2C+and+may+claim+the+reward+promised+to+his+working.+In+the+covenant+of+grace%2C+man%2C+in+himself+ungodly%2C+is+considered+in+the+covenant+as+believing%3B+and+eternal+life+is+considered+as+the+merit+of+the+mediator%2C+and+as+given+to+man+out+of+free+grace%2C+which+excludes+all+boasting%2C+besides+the+glorying+of+the+believing+sinner+in+God%2C+as+his+merciful+Saviour.+5thly.+In+the+covenant+of+works%2C+something+is+required+of+man%2C+as+a+condition+which%2C+performed%2C+entitles+him+to+the+reward.+The+covenant+of+grace%2C+with+respect+to+us%2C+consists+of+the+absolute+promises+of+God%2C+in+which+the+mediator%2C+the+life+to+be+obtained+by+him%2C+the+faith+by+which+we+may+be+made+partakers+of+him%2C+the+benefits+purchased+by+him%2C+and+the+perseverance+in+that+faith%2C+in+a+word%2C+the+whole+of+salvation%2C+and+all+the+requisites+to+it%2C+are+absolutely+promised.+6thly.+The+special+end+of+the+covenant+of+works+was%2C+the+manifestation+of+the+holiness%2C+goodness%2C+and+justice+of+God%2C+conspicuous+in+the+most+perfect+law%2C+most+liberal+promise%2C+and+in+that+recompense+of+reward%2C+to+be+given+to+those+who+seek+him+with+their+whole+heart.+The+special+end+of+the+covenant+of+grace+is%2C+%E2%80%9Cthe+praise+of+the+glory+of+his+grace%2C%E2%80%9D+Eph.+1%3A6%2C+and+the+revelation+of+his+unsearchable+and+manifold+wisdom%3A+which+divine+perfections+shine+forth+with+lustre+in+the+gift+of+a+mediator%2C+by+whom+the+sinner+is+admitted+to+complete+salvation%2C+without+any+dishonour+to+the+holiness%2C+justice%2C+and+truth+of+God.+There+is+also+a+demonstration+of+the+all-sufficiency+of+God%2C+by+which+not+only+man%2C+but+even+a+sinner%2C+which+is+more+surprising%2C+may+be+restored+to+union+and+communion+with+God.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%2C+trans.+William+Crookshank%2C+vol.+1+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+26%E2%80%9327.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff3d6c8f7ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f3d6c8f7ef.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/10/witsius-on-the-relations-between-the-covenants-works-and-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<main class="wrap"><figure class="quote" id="q-e2705f2ca3" data-kw="">
<blockquote><p>[T]hose who say that it only belongs to certain persons to read Scripture, and who, for this reason, do not want it to be translated into the common language, for fear that simple women and other people may read it (Rom 1:14; Gal 3:28; Matt 11:28), are the true antichrists and instruments of Satan (Matt 23:13); they are afraid that their abuses be discovered by the coming of the light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.25, pp 41-42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

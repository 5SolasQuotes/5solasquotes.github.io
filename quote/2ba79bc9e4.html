<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>LW 62.78</cite></span></figcaption>

</figure><figure class="quote" id="q-8a64591cf5" data-kw="">
<blockquote><p>Third, their idolatry exceeds the idolatry of the heathen, in that they worship a breaden god, or Christ in and under the forms of bread and wine. And if Christ according to His humanity be absent from the earth, as I have proved, the popish host is as abominable an idol as ever was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, pp. 197–198</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a> › <a href="../topics/the-lords-supper/the-mass/adoration-of-the-host.html">Adoration of the host</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/transubstantiation.html">Transubstantiation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Third, their idolatry exceeds the idolatry of the heathen, in that they worship a breaden god, or Christ in and under the forms of bread and wine. And if Christ according to His humanity be absent from the earth, as I have proved, the popish host is as abominable an idol as ever was.”

</figure><figure class="quote" id="q-cf84acc948" data-kw="">
<blockquote><p>Our Opposites here tell us of two things necessary to the making up of idolatry, neither of which is found in their kneeling. First, they say except there be an intention in the worshipper to adore the creature which is before his eyes, his kneeling before it is no idolatry… Answer. …Nay then the three children should not have been idolaters if they had kneeled before Nebuchadnezzar’s image, intending their worship to God only, and not to the image. Our Opposites here take the Nicodemites by the hand. But what says Calvin? ‘Si isti boni sapientesque Sophistae, ibi tum fuissent, simplicitatem illorum trium servorum Dei irrisissent. Nam hujusmodi credo cos verbis objurgassent: miseri homines istud quidem*non est adorare, quum vos in rebus nullam fidem adhibetis: nulla est Idololatria nisi ubi est devotio, hoc est quaedam animi ad idola colenda venerandasque adjunctio atque applicatio, &amp;c.’ (De fugiend. idololat., homily 1) If Paybody had been in Calvin’s place he could not have called the [protestant] Nicodemites idolaters, forasmuch as they have no intention to worship the Popish images when they kneel and worship before them. Nay, the grossest idolaters that ever were, shall by this doctrine be no idolaters, and Paul shall be censured for teaching that the Gentiles did worship devils, since they did not intend to worship devils. ‘Idololatrae nec olim in Paganismo intendebant, nec hodie in Papatu intendunt, Daemonibus offerre. Quid tum? Apostolus contrarium pronuntiat, quicquid illi intendant,’ says Pareus (Com. in illum locum, sect. 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-ff4e87e7d8" data-kw="">

<main class="wrap"><figure class="quote" id="q-7e2afc9e54" data-kw="patience longsuffering">
<blockquote><p>The Lord is slow to anger and great in power, and will not at all acquit the wicked. In all the fears of God’s people, God will have a comforter for them. Judah might well be dejected with the calamity of their brethren; but God, by his prophets, calms their fears by predicting the ruin of that furious neighbor, and by the discovery of his own patience and longsuffering toward his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Patience of God</span></figcaption>

</figure><figure class="quote" id="q-6ef1659461" data-kw="">
<blockquote><p>Grace is unmerited favor; and the grace or favor of God is the source of all good. Peace, according to the usage of the corresponding Hebrew word, means well-being in general. It comprehends all blessings flowing from the goodness of God. The apostle prays to Christ, and seeks from him blessings which God only can bestow. Christ therefore was to him the object of habitual worship. He lived in communion with Christ as a divine person, the ground of his confidence and the source of all good.</p></blockquote>

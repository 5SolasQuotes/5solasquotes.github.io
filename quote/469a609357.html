<main class="wrap"><figure class="quote" id="q-469a609357" data-kw="">
<blockquote><p>Christ was able to heal the diseases of men, because he bare them Himself. Do not think that our Lord Jesus was actually diseased: He suffered greatly, but I read not that any disease was upon Him. Probably there was no man in whom there was less tendency to natural disease than in Him. His pure and blessed body was not subject to the diseases which are brought upon men through sin being in them. How, then, did He take upon Him our sicknesses and our sorrows?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Help for your Sickness’ on Matthew 8:16-17</cite>, (1890) Metropolitan Tabernacle Pulpit, vol. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>Although we recognize in Christ a twofold union, one personal (of the two natures, the divine and human in one person), the other natural (of the soul and body in the one human nature)… These two unions differ from each other… (4) in their adjuncts, because that [union of body and soul] is separable and was dissolved by the death of Christ, while this [the personal union] is inseparable–what the Logos (Logos) has once assumed he never laid aside.</p></blockquote>

</figure><figure class="quote" id="q-d319205c37" data-kw="">
<blockquote><p>XVII… From this [Col. 1:2, “Grace be unto you, and peace, from God our Father and the Lord Jesus Christ.”] we gather the following axioms. … 2. The Son of God is equal and coequal with the Father in honor, worship, and glory, as well as in essence. Otherwise, the Apostle would not attribute the same glory to both the Father and the Son unless they share the same essence. Since God does not give His glory to another [Isa. 42:8] of a distinct essence, it is evident that the Father and the Son share the same essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-55b3c85c6b" data-kw="">
<blockquote><p>XIII. A second rock to be avoided here is Eutychianism… who… confounded the two natures into one… one nature is neither changed nor converted by the hypostatical union into the other. Nor are the natures so confounded or mixed with each other that each of them does not retain its own properties and conditions.

XIV. The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6-7, 11); (2) two wills are ascribed to Him (‘not my will, but thine, be done,’ Lk. 22:42). Nor does it follow that there are two [persons] willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will. (3) Contraries are ascribed to Christ, which could not be if there were not two natures in Him (as that He would depart from the world and remain with us forever; that a child was born, who is the Father of eternity; that He suffered death and was made alive; in the form of God and in the form of a servant, etc.).

XV. Although the efficient cause of the operations of Christ is one alone, still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 13th Topic, Q. 7, ‘Was the hypostatical union of the two natures of Christ such that neither the person is divided nor the natures confounded? We affirm against Nestorius &amp; Eutyches., pp. 320-21</span></figcaption>

<blockquote><p>On two occasions we are told that Jesus felt that occurrences which he witnessed were extraordinary and experienced the appropriate emotion of “wonder” regarding them (Mt. viii. l0; Lk. vii 9; Mk. vi. 6).¹ ¹ [Greek] Thaumazo: see Schmidt, Synonymik etc., iv. §165, pp. 184sq.: “it is perfectly generally ‘to wonder’ or ‘to admire’, and is distinguished from thambein precisely as the German sich wundern, or hewundern is from staunen: that is, what has seized on us in the case of thaumazein is the extraordinary nature of the thing while in the case of thambain it is the unexpectedness and suddenness of the occurrence.” Cf. Art. “Amazement” in Hasting’s DCG. I, pp. 47, 48.</p></blockquote>

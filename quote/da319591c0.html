<main class="wrap"><figure class="quote" id="q-da319591c0" data-kw="">
<blockquote><p>He must cast away all pride and high thoughts, and conceit of his own goodness. He must be content to go to heaven as a poor sinner saved only by free grace, and owing all to the merit and righteousness of another… He must be willing to give up all trust in his own morality, respectability, praying, Bible-reading, church-going, and sacrament-receiving, and to trust in nothing but Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holiness</cite>, p. 140</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/meritorious-cause.html">Meritorious Cause</a></span><span class="t"><a href="../topics/the-christian-life/humility-and-meekness.html">Humility and Meekness</a> › <a href="../topics/the-christian-life/humility-and-meekness/humility.html">Humility</a></span></div>

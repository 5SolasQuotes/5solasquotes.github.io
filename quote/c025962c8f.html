<main class="wrap"><figure class="quote" id="q-c025962c8f" data-kw="">
<blockquote><p>But we define justification as follows: the sinner, received into communion with Christ, is reconciled to God by his grace, while, cleansed by Christ’s blood, he obtains forgiveness of sins, and clothed with Christ’s righteousness as if it were his own, he stands confident before the heavenly judgment seat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-4ad73332b1" data-kw="">
<blockquote><p>With respect to the word juftification, we have already shown, I hope, that in the writings of St. Paul it signifies the action of God, as a judge, acquitting man, pronouncing him just, and conferring upon him the reward of eternal life. Concerning this there is no dispute… Faith then, to which justification is attributed by St. Paul, is not to be undertood as one single virtue, but denotes the whole condition of the gospel covenant, that is, comprehends in one word, all the works of Chriftian piety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-bull.html">George Bull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Harmonia Apostolica, or the Mutual Agreement of St. Paul &amp; St. James, comprising a Complete View of Christian Justification</cite>, … tr. Thomas Wilkinson (1669-1670; London: Rivington, 1801) 320 pp. ToC, p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-db171871a3" data-kw="">
<blockquote><p>I shall take the boldness, therefore, to say, whoever be offended by it, that if we lose the ancient doctrine of justification through faith in the blood of Christ, and the imputation of his righteousness unto us, public profession of religion will quickly issue in Popery or Atheism….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, The Works of John Owen, 5:206–07</span></figcaption>

</figure><figure class="quote" id="q-14ddf125f9" data-kw="">
<blockquote><p>As to the first question, all Catholics acknowledge that the good works of the just are meritorious of eternal life; but some think these terms de condigno and de congruo should not be used, but that one should say absolutely that the good works of the just are meritorious of eternal life by the grace of God. … Others hold that the good works of the just are meritorious de condigno in a broad sense, so that this condignity, compared with condignity properly taken, may be called congruity, and compared with congruity properly taken, may be called condignity. … But the common opinion of theologians admits condign merit simply. And this opinion is most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

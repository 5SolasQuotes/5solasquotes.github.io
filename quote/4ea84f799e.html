<main class="wrap"><figure class="quote" id="q-4ea84f799e" data-kw="">
<blockquote><p>…I only now advise every one who is kept from believing by this, that he knows not whether he be contained under the pardon or no, not to look to God’s secret will, but to attend to God’s revealed will in his Word, wherein it is expressly said that God would have no man to perish, but would have all men come to repentance [2 Pet. 3:9]; and so oft. That He desires not the death of a sinner [Eze. 18:23,32], that hereby he may be moved to seek and hope for that mercy, which God is so willing to bestow upon him, if the fault be not in his own self, as it was in the unbelieving Jews in Jerusalem, of whom our Savior complained, saying, ‘How often would I have gathered thy Children, as the Hen gathereth her Chickens under her wings, and ye would not?’ [Mt. 23:37] A further manifestation of this willingness in God to save sinners, may be seen in his gracious invitation of the unworthiest to come to the wedding of his Son [Mt. 22:2-3]: yea, more by his beseeching sinners to be reconciled to Him [2 Cor. 5:20]: and by the many and weighty arguments He uses to persuade men to believe, by the great rewards, earthly and spiritual, temporal and eternal, which all believers shall enjoy; and by the fearful woes which shall fall on all unbelievers, both in this life, and that to come, as plentifully is to be seen throughout the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-culverwell.html">Ezekiel Culverwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Faith</cite>, (1648), pp. 184-86</span></figcaption>

</figure><figure class="quote" id="q-62ffb91a19" data-kw="">
<blockquote><p>The divine affections or virtues are not distinct dispositions or habits that stand as attributes or functions of will, as they do in human beings, but instead are divine perfections that have some analogy to the dispositions or habits of the human will: ‘for though, properly speaking, there are [no affections] in God, he being a most pure and simple act, free from all commotion and perturbation; yet there being some things said and done by him, which are similar to affections in intelligent beings, [sic] they [that] are ascribed to him; as love, pity, hatred, anger etc., from which must be removed everything that is carnal, sensual, or has any degree of imperfection in it.’ (Gill, Complete Body of Divinity, I, p. 112; cf. Synopsis purioris theologiae, VI.xxxix; Turretin, Inst. theol. elencticae, III.xix.1.) Several writers, most notably Venema, treat these affections not only in relation to the divine will, but also as the affective manifestations of the goodness and holiness of God… The basis for this understanding is the assumption that affections are not essential attributes or original properties but, rather, are ad extra manifestations in which God is known through his effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 557-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

s&amp;text=The%20divine%20affections%20or%20virtues%20are%20not%20distinct&amp;text=in%20which%20God%20is%20known%20through%20his%20effects" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Whatever sparks of goodness any creature has are the free effusions of God’s bounty, the offspring of his own inclination to do well, the simple favor of the donor; not purchased, not merited by the creature. God is as unconstrained in his liberty in all his communications as infinite in his goodness, the fountain of them.</p></blockquote>

<blockquote><p>…these considerations must be premised:

1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery.

2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will.

3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer:

1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God.

2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him.

3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay.

4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

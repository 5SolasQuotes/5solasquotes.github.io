<main class="wrap"><figure class="quote" id="q-763842ad09" data-kw="">
<blockquote><p>The foreign emigration to which we are constantly exposed, is an additional reason for alarm. The spirit of Europe generally is unfriendly to our religious as well as to our civil institutions, in the form which has been peculiar to them from the beginning. It is hostile for the most part altogether, to the Sabbath as honoured and observed by our fathers. And yet this spirit, under its worst character, is invading our shores at every point, and labouring to incorporate itself with the native mind of the country from one end of the land to the other.

It is no longer an element so small in itself, that it can be taken up and moulded by the surrounding mass to its own consistency and colour; but already it has actually changed the complexion of our national character, and imparted a tinge to it which may be easily read and understood. And every year is adding immensely to the volume and force, with which the strange transforming power is bearing in upon the ancient order of our institutions.

Every year finds us as a people more disposed to new impressions from abroad, and furnishes at the same time a heavier tide of emigration to take advantage of our condition. It is hard to say, how quickly the very genius of the country may not be literally overwhelmed and lost beneath this moral deluge. Instead of thousands we may soon have millions flowing in upon us, till we shall hardly be able to recognize our distinctive nationality at all, amid the new forms of life and the new modes of thought that shall be found prevailing on every side, rife with the foul spirit of Europe.

Every reflecting person must see, that the Sabbath is in great danger from this quarter. Unless a very vigorous effort be made on the part of the church, to withstand the lax views and loose practice which are thus gathering strength from day to day, the next generation may behold the day converted into a mere festival for popular recreation. Such is the tendency of the feelings we are importing from abroad; such is the result, which both the infidelity and popery of the old world may be expected to aid the secularism of the new, in struggling as quickly as possible to realize.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-presbytery-of-ohio.html">The Presbytery of Ohio</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Claims of the Christian Sabbath; A Report Read and Adopted April 21, 1836, at a Meeting of the Presbytery, held at Raccoon Church</cite>, (Pittsburgh PA: William Allinder, 1836), pp 5-7.</span></figcaption>

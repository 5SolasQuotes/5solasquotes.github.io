<blockquote><p>As it [singing divine praises] a moral duty, so it is never abolished, but continues under the New Testament as well as the Old. Though their manner of praising with a great variety of musical instruments and the like is abolished as being suited to that dispensation, wherein was much more of outward pomp and ceremony, yet praising God with the music of the voice is moral and never was abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon Notes on Col. 3:16 in Sermons, Series II, 1736 (WJE Online Vol. 51)</cite></span></figcaption>

</figure><figure class="quote" id="q-267606c00b" data-kw="">
<blockquote><p>6. The Word is God’s mean to work supernatural effects, to convert the soul, Ps. 19:7, to work faith, Jn. 20:3, to edify, Acts 20:32, to save, Rom. 1:16. The obedience to God’s Word, brings peace, Ps. 119:165, comfort, v. 50; Gen. 49:18; Isa. 38:3. But ceremonies, being apt to stir up the dull mind, must be apt to remove natural dullness, which is a supernatural effect, and so to bring, peace, joy, comfort: Organs are now holden by the same right, that they were in Moses’ Law, then they must stir up supernatural joy: There must be peace and comfort in practicing them. Hear how this sounds: ‘This is my comfort, O Lord, in my affliction, that thy surplice, organs, and holy-days have quickened my dull heart.’ Now what comfort [is there], except comfort in the Scriptures? Rom. 15:4. Ceremonies be innocent of all Scriptures [have nothing of the Scriptures in them]. What joy (a proper fruit of the Kingdom of Heaven, Rom. 14:17) can be in sapless ceremonies? Yea, observe: 1. Who truly converted from Popery, who [is] inwardly humbled in soul, does not abhor ceremonies by the instinct of the new birth? 2. What slave of hell and profane person call not for ceremonies? 3. Who has peace in dying that ceremonies were their joy? 7. All lawful ordinances may by prayer be recommended to God for a blessed success as all the means of salvation, Ps. 119:18; Mt. 26:26; Acts 4:29-30. 2. We may thank God for a blessed success, which they have by the working of the spirit of Grace, 2 Cor. 2:24; 1 Cor. 1:4-5; 2 Thess. 1:2-3; Eph. 1:3. 3. We are to have heat of zeal against profaning of Word, sacraments, prayer, or other ordinances of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’</cite>, p. 132</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-1ee9e51e3f" data-kw="">
<blockquote><p>…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon (1660) | To the Reader</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bc48cf2972" data-kw="faith instrument receives Christ alone means union">
<blockquote><p>So great is the necessity of faith in the matter of salvation that as Christ alone is the cause of salvation, so faith alone is the means and way to Christ. Hence it is celebrated as the bond of our union with Christ because he dwells in us by faith (Eph. 3:17); as the condition of the covenant of grace under which salvation is promised to us; as the instrument by which we receive Christ with all his benefits. For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.7.1–2</span></figcaption>

</figure><figure class="quote" id="q-0c657684bc" data-kw="">
<blockquote><p>True, spiritual, special faith in Christ includes in it a dependence on him, trust and confidence in him alone for everlasting life and salvation; it is a soul&#x27;s venturing on Christ, resolving if it perishes it will perish at his feet; it is a resignation of itself to Christ, a committing its soul, and the important welfare and salvation of it into Christ&#x27;s hands, trusting him with all, looking to him, relying on him, and acquiescing in him as the alone Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, Book 1, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-19f01e32d5" data-kw="">
<blockquote><p>Faith comprehends the knowledge of the mystery of God, and of Christ in the light of grace, the truth of which mystery the believer acknowledges with full assent of mind, on the authority of the testimony of God. And not only so, but he is also in love with that truth, exults therein and glorifies God; he likewise ardently desires communion with Christ … wherefore, when Christ is offered to him by the word and Spirit, he receives him with the greatest complacency of soul, leans and rests upon him, and gives and surrenders himself to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 3.7.26</span></figcaption>

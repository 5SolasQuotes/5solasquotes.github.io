<main class="wrap"><figure class="quote" id="q-33512f2508" data-kw="">
<blockquote><p>What call you the Judicial Law? That wherein God appointed a form of politic and civil government of the commonwealth of the Jews, which therefore is ceased with the dissolution of that State, for which it was ordained; saving only in the common equity. Is this law utterly revoked and abolished by Christ? No; for He came not to overturn any good government of the commonwealth, much less that which was appointed by God Himself. May not Christian Magistrates then swerve any thing from those laws of government, which were set down by Moses? In some circumstances they may, but in the general equity and substance they may not. What Judicial laws are immutably to be observed now of Christian Magistrates? Those which have reasons annexed unto thēm and specially those wherein God has appointed death for the punishment of heinous offenses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, … (London, 1645), p. 204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843) | question 17, p. 72 lt col top</span></figcaption>

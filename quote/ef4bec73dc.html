<main class="wrap"><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/decretive-and-preceptive-will.html">Decretive and preceptive will</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/secret-and-revealed-will.html">Secret and revealed will</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

</figure><figure class="quote" id="q-9c2ff7740d" data-kw="Sovereignty Wisdom Comfort">
<blockquote><p>But our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!</p></blockquote>

</figure><figure class="quote" id="q-b21e1532e1" data-kw="eternity no succession">

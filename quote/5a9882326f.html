<main class="wrap"><figure class="quote" id="q-5a9882326f" data-kw="">
<blockquote><p>Now the King Himself, the Lord who reigns in this external policy [of the Church], must be the only Lawgiver, James 4:12; Isa. 33:22. There can be no rabbis or doctors on earth who as little kings can make laws under Him, Mt. 23:8-10. Yea, not apostles, who can teach how the worship should externally be ordered, but what they receive of the King of the Church, 1 Cor. 11:23; Acts 15:13-18, how the house should be governed, Heb. 3:1-2; 4:5. Yea, nothing [is] more reasonable than that whatsoever is commanded by the God of Heaven, should be done in and for the house of the God of Heaven under the pain of his wrath, Ezra 7:23; 1. That there should be officers in a Kingdom, and laws to govern the subjects, beside the will of the prince or judges of the Land, or that the members of a family, or soldiers in an army should be governed by any rule, custom or law, beside[s] or without the will of the Master of the House, and of the general and commanders, is all one, as if subjects, families and soldiers should be ruled and governed by their own will and wisdom, and not by their king, judges, masters and commanders; For the question is upon this undeniable supposition, that Christ is the only Head and King of his Church, and so the Head and King of Prelates (if they be of the body) and of the rulers, guides and pastors of the Church, which are to be governed and ruled by certain laws, no less than the people, whether or no this representative Church of rulers, being subjects and members of the Head and King of the Church, are to be ruled by the wisdom, laws and commandments of this King, the Lord Jesus; or if they have granted to them a vast arbitrary power to govern both themselves and the people, by adding positive mandates of arbitrary commanders, such as Prelates are (in the mind of those who think they have no patent of any divine-right) and of surplice, crossing, kneeling for reverence to wood, to bread and wine.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3eb42af139" data-kw="">
<blockquote><p>The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1</cite>, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.</span></figcaption>

ncludes%20not%20only,are%20contained%20under%20the%20ceremonial%20precepts&amp;text=The%20Divine%20worship%20includes%20not%20only%20sacrifices%20and&amp;text=Consequently%20such%20are%20contained%20under%20the%20ceremonial%20precepts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-53e6cb8cf2" data-kw="">
<blockquote><p>The picture of a church much more concerned with carrying out its routine functions than with controversy is confirmed by W. R. Foster… Such studies, concentrating on the day to day life of the church and the extent of compromise, co-operation and continuity, undoubtedly provide a more accurate picture of the church as contemporaries saw it, and worked and worshipped in it, than sectarian histories which imply constant and bitter controversy at all levels. But it is worth suggesting that this tendency to concentrate on the positive elements of the church and on its routine functioning has gone too far; from too much emphasis on controversy the pendulum has swung so far that there is a tendency to ignore the controversy, that undoubtedly did exist. Foster’s “church before the covenants” seems so placid and united that the reader is left bewildered; the covenants evidently explode like a great storm suddenly appearing when the sky is clear and blue, and no attempt is made to explain the explosion. Controversial topics are played down or ignored; little is said about worship, almost nothing about theology. The new prayer book of 1637 which sparked off revolt is not mentioned in a book purporting to cover the period up to 1638; nor is the emergence of Arminianism in Scotland, undermining Calvinist orthodoxy and producing new tensions. Thus Foster’s book really only deals with some aspects of the church; what it does do, it does very well, but though it tells the truth it does not attempt to tell the whole truth.” – David Stevenson, “Scottish Church History, 1600-1660, a Select Critical Bibliography” (1982), p. 211 . On the Late-1600’s Articles Raffe, Alexander – pp. 180-188 of The Culture of Controversy: Religious Arguments in Scotland, 1660-1714 (Boydell Press, 2012) ToC McDougall: “Raffe outlined three tenets of partial conformity [for laymen]: avoidance of regular attendance at services given by conformist ministers; hearing sermons in parishes in other towns; and refusal to receive the sacraments from a conformist minister. This chapter will reveal a broader range of ways in which ministers and the laity could avoid conforming to Episcopacy without separating from the church entirely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-roland-foster.html">W. Roland Foster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church before the Covenants. The Church of Scotland</cite>, 1596-1638, p. 142</span></figcaption>

</figure><figure class="quote" id="q-55ed48034e" data-kw="">
<blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.”

<main class="wrap"><figure class="quote" id="q-6f194fe69f" data-kw="">
<blockquote><p>CHRIST IS MATCHLESS! O He is the wonder of the higher house! And will not He be your wonder and my wonder throughout the ages of eternity? Come away then, let us labour to keep up that work now, wherein eternity will not weary us. We cannot now think rightly of Him, but we will get eternity to the work.

His beauty and excellency is so ravishing, that a poor weak, silly-fond soul will be made to turn its dazzled eyes away from Him, when yet the heart will be melting in love’s hand. O! but we are narrow vessels that can receive nothing, but hereafter we shall see Him as He is.

O what is He? Angels cannot define Him, and we must be silent; yet this I must say, He is matchless: all perfections meet in Him. He is glorious, and He is the only best of choices. O! He is glorious in Himself, and manifests that in all his actings. His doings are like Himself, and carry large characters of all his attributes engraven upon them.

Why are such confusions upon his Church, but that He may get occasion to make his wisdom conspicuous in bringing order out thereof? O! He will do it, and his carrying on a strange work of discovery is a pledge of it. His faithfulness is engaged to do it. Let us not fear, though enemies’ cruelty and malice be more than formerly, yet his Word shall stand sure. And poor mad fools, what are they doing but crushing themselves and setting up his throne?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Robert Hamilton, 29 March 1684 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh, 1876), 4: 113-14.</cite></span></figcaption>

eformed Books Online</a></div>
</figure><figure class="quote" id="q-1fec7fc3b7" data-kw="">
<blockquote><p>Prayer is a blessed means of drawing from the fulness that is in Christ. And the saints of God, blessed in Christ, are by prayer made a blessing unto one another. Christ and the church must not be overlooked here. This will form an ever-recurring topic of converse, and constant subject of prayer. The church is the building of which Christ is the foundation and chief corner-stone; the body of which he is the Head; the spouse of which he is the Husband; the kingdom of which he is the sole Monarch. The church, in the sense of the word as comprehending all the redeemed and sanctified of God, is the interest dearest to Christ, and that in which the divine glory is to be made great.

Besides comprehending our own personal interest, it includes that of unnumbered thousands and millions, and all the glory accruing from them to Christ and to God. Her visible concerns, viewed in their subordination to the divine glory and spiritual interests of men, assume the highest relative importance, and must awaken the affections, and kindle the zeal of those that are Christ’s, and pray as he has taught, “Hallowed be thy name, thy kingdom come, thy will be done on earth as it is in heaven.” “Pray for the peace of Jerusalem: They shall prosper that love thee; ye that make mention of the Lord, (ye that are the Lord’s remembrancers,) keep not silence, and give him no rest till he establish, and till he make Jerusalem a praise in the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-symington.html">Andrew Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Social Prayer: A Sermon, Preached in Albion-Street Church, Glasgow, on the evening of Thursday, October 24, 1839</cite>, (Paisley: Alex. Gardner, 1840), pp 30-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

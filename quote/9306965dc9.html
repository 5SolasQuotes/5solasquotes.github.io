<blockquote><p>We do not say that the confidence by which we are justified is the forgiveness of sins already perceived, nor that the object of this confidence is the forgiveness of sins previously perceived; but that confidence by which we each believe our sins are forgiven in the present, not properly in the past or future, although both pertain to justifying faith, but not to the high, so to speak, formal aspect of justifying. When, therefore, the Gospel word offers mercy and forgiveness of sins through Christ to every believer, faith does not only believe in general that this is true, that sins will indeed be forgiven to all who truly believe in Christ, but also the believer confidently persuades himself that this promise applies to him, and by that act of confidence, he is then forgiven his sin, and it becomes his happiness mentioned by the apostle in Rom. 4:7. Just as by extending a hand and accepting a gift, the beneficiary who has approached becomes a participant. Thus, in a faithful person, there are simultaneously forgiveness of sins and confidence about that forgiveness; and by the faith through which that mercy and special grace were received, it is afterward retained, and what was believed about the future is embraced in the present, and what about the past remains certain afterward. But one who believes he will be justified if he believes in Jesus Christ is not yet justified in the past unless he believes in the present that righteousness is given to him, which he receives by the same act. What is later believed about the past does not justify him but presupposes him as justified. All these acts are of the same justifying faith, the first indeed predisposes to justification, the second properly justifies, the third pacifies the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXV. This is also the doctrine of the Professors of Leiden, critiqued in the eleventh chapter of the Remonstrants’ Confession, whose author is Andreas Rivetus. They say:</span></figcaption>

<blockquote><p>Belief was at first defined to be an assent to things known by revelation: but now ye are further to know that all assent is not of the same kind and degree, but differs according to the diversity of the objects assented unto. Therefore we must observe, that of the objects of belief: 1. Some are represented unto us only as true and good in themselves, without any special relation to our benefit and commodity. Unto such things, whether past, present or to come, the understanding and will of man do yield that common assent and approbation whereby they allow of the truth and goodness of everything that is apprehended by them as true and good in what kind soever it be. This is called a bare assent, or credulitas, belief in strict terms, when we only believe tis good and true, and go no further. 2. Some are revealed unto us not only as true and good in themselves, but more specially as containing some excellent truth and goodness that concerns us in regard of some benefit that we shall get thereby. In these things our assent is with adherence, affiance, trust and dependance upon the thing revealed. For as in general all truth and goodness draws the faculties of the soul to an approbation of them when they are known, so much more does the goodness and truth of those things, which are proportionable to our nature and necessities, wherein we may claim special interest and commodity, unite our wills and understanding in strong assent and adherence unto them. This kind of assent is in strict terms called faith or trust, fides, fiducia, which imply much more than credulitas, belief. Fidere in the property of the word is a degree beyond credere, importing an assent with reliance and confidence. Now the proper object of this assent is nothing but promises of some good hereafter to befall us. And promises are never believed, unless they be trusted upon: as a captive cannot be said to believe him that promises to ransom him upon a day, unless he trust and depend upon him. In which case we cannot distinguish between belief and trust, fidem and fiduciam, to make them two several acts, which are but one and the same; as is manifest thus, a promise is a revelation of some such truth as shall be beneficial to me in particular. The truth of such a promise consists in the certainty of performance. The goodness of the promise consists in the quality of the thing promised more or less excellent. But now to trust (fiduciam ponere, fidem habere) upon a promise is not to believe the goodness of the thing promised (for that often is known perfectly enough) but to be believe the certainty of performance of it unto me: as for instance, if a rich man promise to pay a poor man’s debts, the poor man needs not believe the goodness of the promise, for he well knows the benefit thereof. What then must he believe? The truth of it: where in stands that? in the performance that the rich man will certainly do for him what he has said. Now what is this else but to trust him? So that belief and trust or affiance are here essentially one and the same thing.</p></blockquote>

e%20same%20thing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In respect to this confidence, faith is called saving and justifying. For God justifies no one except those who place their confidence in Christ and firmly believe their sins to be forgiven because of His merit. Thus, to attain salvation, it is not enough to have knowledge of divine mysteries or even general assent, but confidence is also necessarily required.</p></blockquote>

<blockquote><p>How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence… Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to Him for righteousness and through him obtains the right to eternal life. First, it is distinguished from the works of the law (which could not be done if it were taken absolutely because thus it is a work of the law)… Therefore it [being a condition] cannot be ascribed to faith materially (inasmuch as it is a work), but instrumentally (inasmuch as it is the hand apprehending).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 3, ‘Is the covenant of grace conditional and what are its conditions?’ in Institutes of Elenctic Theology, ed. James Dennison Jr., trans. George Giger, 3 vols. (P&amp;R, 1992–1997), vol. 2, pp. 184–89</span></figcaption>

<div class="actions"><button class="copy" data-copy="“How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence… Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to Him for righteousness and through him obtains the right to eternal life. First, it is distinguished from the works of the law (which could not be done if it were taken absolutely because thus it is a work of the law)… Therefore it [being a condition] cannot be ascribed to faith materially (inasmuch as it is a work), but instrumentally (inasmuch as it is the hand apprehending).”

— Francis Turretin, Question 3, ‘Is the covenant of grace conditional and what are its conditions?’ in Institutes of Elenctic Theology, ed. James Dennison Jr., trans. George Giger, 3 vols. (P&amp;R, 1992–1997), vol. 2, pp. 184–89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+faith+is+a+condition.+XI.+As+to+the+former%2C+when+we+say+that+faith+is+a+condition+of+the+covenant%2C+we+do+not+mean+it+absolutely+and+according+to+its+nature+and+essence%E2%80%A6+Rather+it+must+be+considered+relatively+and+instrumentally%2C+inasmuch+as+it+embraces+Christ+and+applies+to+Him+for+righteousness+and+through+him+obtains+the+right+to+eternal+life.+First%2C+it+is+distinguished+from+the+works+of+the+law+%28which+could+not+be+done+if+it+were+taken+absolutely+because+thus+it+is+a+work+of+the+law%29%E2%80%A6+Therefore+it+%5Bbeing+a+condition%5D+cannot+be+ascribed+to+faith+materially+%28inasmuch+as+it+is+a+work%29%2C+but+instrumentally+%28inasmuch+as+it+is+the+hand+apprehending%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Question+3%2C+%E2%80%98Is+the+covenant+of+grace+conditional+and+what+are+its+conditions%3F%E2%80%99+in+Institutes+of+Elenctic+Theology%2C+ed.+James+Dennison+Jr.%2C+trans.+George+Giger%2C+3+vols.+%28P%26R%2C+1992%E2%80%931997%29%2C+vol.+2%2C+pp.+184%E2%80%9389&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8335b7151c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8335b7151c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=How%20faith%20is%20a%20condition.%20XI,as%20it%20is%20the%20hand%20apprehending&amp;text=How%20faith%20is%20a%20condition.%20XI.%20As%20to&amp;text=instrumentally%20%28inasmuch%20as%20it%20is%20the%20hand%20apprehending" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e2e12b5328" data-kw="">
<blockquote><p>Faith is a necessary and lively instrument of justification, which is amongst the number of true causes, not being a cause without which the thing is not done, but a cause whereby it is done. The cause without which a thing is not done, is only present in the action, and does nothing therein: But as the eye is an active instrument for seeing, and the care for hearing, so is faith also for justifying. If it be demanded whose instrument it is? It is the instrument of the soul, wrought therein by the Holy Ghost, and is the free gift of God. In the Covenant of works, works were required as the cause of life and happiness: but in the Covenant of grace, though repentance be necessary and must accompany faith, yet not repentance, but faith only is the cause of life. The cause not efficient, as works should have been, if man had stood in the former Covenant, but instrumental only: for it is impossible that Christ, the death and blood of Christ, and our faith should be together the efficient or procuring causes of justification or salvation.</p></blockquote>

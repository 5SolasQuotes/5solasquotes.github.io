<main class="wrap"><figure class="quote" id="q-6d5df55eca" data-kw="">
<blockquote><p>We justly blame the bishops of Rome, who, without the word of God, without the authority of the holy fathers, without any example of antiquity, after a new guise, do not only set before the people the sacramental bread to be worshipped as God, but do also carry about the same upon an ambling horse, whithersoever themselves journey, as in old times the Persians&#x27; fire, and the relics of the goddess Isis, were solemnly carried about in procession: and have brought the Sacraments of Christ to be used now as a stage play and a solemn sight: to the end, that men&#x27;s eyes should be fed with nothing else but with mad gazings and foolish gauds, in the self-same matter, wherein the death of Christ ought diligently to be beaten into our hearts, and wherein also the mysteries of our redemption ought with all holiness and reverence to be executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-d421357274" data-kw="Auricular confession">
<blockquote><p>It is not strange, therefore, that we condemn that auricular confession, as a thing pestilent in its nature, and in many ways injurious to the Church, and desire to see it abolished. But if the thing were in itself indifferent, yet, seeing it is of no use or benefit, and has given occasion to so much impiety, blasphemy, and error, who does not think that it ought to be immediately abolished?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.4.19</span></figcaption>

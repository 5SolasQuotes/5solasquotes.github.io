<blockquote><p>When the sins of the present times are not particularly mourned over, it cannot be expected that there will be any faithful enquiry into, or acknowledgement of, the defections and backslidings of former priods.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b76cd05d2" data-kw="">
<blockquote><p>The subject matter of these debates [surrounding the public Resolutions] is not so far removed out of the way as our [Resolutioner] Brethren do talk, but do still continue in many respects: 1. In regard of the sin and guilt thereof, which has not been taken-with, nor repented-of till this day. And as the resolution Brethren judge it hard for the protesting Brethren to be satisfied with nothing, unless they do repent of that, as a sin which in their consciences they judge to be a duty; So they must give leave to the protesting Brethren to judge it hard, that the Church, of which they are members and ministers, should lie under the guilt of a public transgression, and under great and sore wrath, because thereof, and they in the meanwhile not be permitted to discover her iniquity therein, that her captivity may be turned away, especially when they are engaged by Covenant so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, ... (1658), p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-873a5e2eaa" data-kw="">
<blockquote><p>Seventhly, Beware of separating new lights. To separate from, or gather new churches out of the true reformed or reforming churches, has not the least warrant from the Word of God. When we see this or that amiss in a church, we are bidden to exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwinglius conferred amicably with the Anabaptists in Zurich, as with dissenting brethren, and no course was taken to suppress or restrain them by the secular power, till they grew to gather churches out of the true reformed churches; but when it came to that, they could not be suffered or forborne, it was thought necessary to retrain them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions n.d</cite>, ch. 10, ‘Of New Lights’, Seventhly</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-71d73b837e" data-kw="">
<blockquote><p>But if we prove indeed that it [the Anglican Liturgy] is ‘defective and faulty, that you bring for an offering to God,’ when you [bishops] or your neighbors have a better, which you will not bring, nor suffer them that would (Mal. 1:13) and that you call evil good in justifying its blemishes, which in humble modesty we besought you to amend, or excuse us from offering, then God will better judge of the unlawful act than you [bishops] have done.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

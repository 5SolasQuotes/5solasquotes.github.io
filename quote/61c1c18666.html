<main class="wrap"><figure class="quote" id="q-61c1c18666" data-kw="">
<blockquote><p>But not only does Scripture give no countenance or authority to tradition as a recognised means of conveying to us the divine will, and not only does it virtually exclude tradition as a divine informant by plainly enough asserting its own sufficiency and perfection, but it also contains much that goes directly to disprove the authority and validity of tradition.

The pharisaic doctrine of tradition was the same as that of the Papists and Tractarians, and the use made of it by the Pharisees was precisely analogous to that made of it by their successors in the work of corrupting true religion, so that tradition is an old device of Satan; it met, as exhibited in the case of the Pharisees, with the most decided and emphatic condemnation from our Saviour, who not only himself refused to pay the smallest regard or respect to their traditions; in this as in everything else leaving us an example that we should follow his steps, but declared that they made the word of God of none effect by their traditions — a declaration just as applicable to the conduct of Papists and Tractarians as to that of those against whom it was originally directed.

When our Lord had so emphatically denounced this principle, and the use made of it, it might have been expected that Satan would scarcely have ventured to have again employed the same device for making the word of God of none effect among men who professed to honour Christ, and to submit to his authority. But the event has justified his wisdom and his knowledge of human nature. He has again succeeded, notwithstanding our Saviour’s warnings and denunciations, in making the word of God of none effect by tradition, in grievously corrupting the true religion by means of the devices and inventions of men.

We cannot recognise tradition as an authorised method of conveying to us the divine will, unless we have God’s own authority for regarding and trusting it as such. But God in his word has not only given it no such authority, but has, both by general principles and by specific statements, forbidden us to take it as our rule or guide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XXXIX, pp 485-86.</span></figcaption>

</figure><figure class="quote" id="q-c93bf87ff0" data-kw="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>

<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>

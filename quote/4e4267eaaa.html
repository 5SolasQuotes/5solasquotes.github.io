<blockquote><p>Objection: Again it is objected, the apostle Paul says in 1 Tim. 2:4 that God would have all men saved: How should it be then that any should perish, unless his will be changeable? Answer: Ambrose upon this place of the apostle expounds it thus: God will have all men to be saved, but so as they come to Him, He will have them saved; if they will salvation to themselves; and if this sense be admitted, there is no shadow of change in God, though many be not saved, because those many that are not saved, do not seek salvation… God will have all men saved, He wills the salvation even of the reprobate, as a thing in itself good and suitable to the disposition of a gracious God: but yet He does not determine or appoint it, and therefore though many perish, there is no change in God’s will: this place showing what God might approve of being done, not what He determined to do; He wills it by an antecedent will, as in itself considered; but not with a consequent will, and here is no change in God’s will;</p></blockquote>

ooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Objection%3A%20Again%20it%20is%20objected%2C%20the,is%20no%20change%20in%20God%E2%80%99s%20will&amp;text=Objection%3A%20Again%20it%20is%20objected%2C%20the%20apostle%20Paul&amp;text=and%20here%20is%20no%20change%20in%20God%E2%80%99s%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God in this attribute of mercy is infinite and incomprehensible. He is in this as in other attributes; indeed He is God. Heaps of places I might bring in; the Bible abounds with passages of the merciful inclination of God: Ex. 34:6-7, ‘The Lord God merciful and gracious, etc.’ And again, ‘Keeping mercy for thousands.’ Dt. 5:10, ‘And showing mercy unto thousands.’ Ps. 36:5, ‘Thy mercy O Lord is in the heavens,’ or unto the heavens. So that we need not ask as Esau did of Jacob his father about a blessing, ‘Hast thou but one blessing my father?’ (Gen. 27:38) So hast Thou but one mercy, O God? For come there never so many, there is mercy for all. The bottomless ocean of God’s mercy can never possibly be drawn dry by the creature. Many admirable sayings have we touching God’s mercy: First, God inclines to it; it comes naturally from Him: not as waters out of the pump, but as showers from heaven. Tis but ‘open our mouths’ and God will fill them [Ps. 95]. Yea secondly (to use the words of a painful and learned writer; [John] Downame’s Christian Warfare, bk. 2, ch. 34, sect. 4, p. 204), ‘It is not only not troublesome and painful’ (to wit because it is natural to God to show mercy) ‘but also pleasant and delightful for God to show mercy, etc.’ And a little after: ‘And contrariwise it should be troublesome and irksome, if I may so speak‘ (says mine author) ‘for God not to show and exercise his nature and mercy, etc.’ And once more: ‘For as the eye is delighted with seeing, and to be restrained therefrom is grievous unto it, as the ear is delighted with hearing and is much molested if it be stopped; and as every part and faculty of the body and soul are delighted in exercising their several actions and functions and are much vexed and cumbered if by any means they should be hindered, so is the Lord delighted and well pleased in showing and exercising his own nature and attributes.’ God weeps when He strikes, but smiles when He strokes. It does his heart good (as we use to say of men). Certainly God will not be barred of his pleasure; He rejoices much to have an occasion offered of exercising his mercy. Ps. 147:11, David says that, ‘the Lord is delighted in them that fear Him and attend upon his mercy.’ When men wait for mercy, God is delighted to exercise it towards them. Judicious Mr. [Joseph] Caryl, ‘To show mercy pleases Him more than it relieves us.’ Thirdly, God is said ‘to multiply’ to show mercy. Single acts of mercy cannot give Him content: He shows mercies by thousands, unto thousands of his people. Fourthly, ye have an expression, Isa. 30:18, ‘And therefore will He be exalted that He may have mercy upon you.’ But what do I speak of that which is infinite and incomprehensible? Sooner can we number the stars of heaven, drops of the ocean, sands on the shore, yea atoms in the sun, than give you a true account of the mercies of this most merciful God. What is a drop to the ocean? (Quantum scintilla ad mare se habet, tantum hominis malitia ad Dei clementiam imo vero non tantum; [As much as a spark is to the sea, so much is man’s wickedness to God’s clemency; indeed, not even so much.] Chrysostom) And what are our sins to the mercies of God. Infiniteness cannot be limited. God’s thoughts of mercy are exalted above the thoughts of our unworthiness far higher than the heavens are exalted above the earth. Mercy is as it were God’s fetching of breath. His infinite and incomprehensible goodness does in a sort wholly live in works of mercy; For all the world are object of God’s mercy since Adam’s fall: ‘For all have sinned, and have come short of the glory of God.’ That famous man, Jerome Zanchi has notable stuff about this matter. I will take notice but of one passage, upon Ex. 34:6-7, where it is said that God is slow to anger. He writes (On the Attributes, bk. 2, ch. 1, quest. 2): ‘And therefore we must note, although anger be attributed unto God, it is in God nothing else but the chief goodness and justice whereby He abhors evil, and according to his just judgment, does at length punish it if it be not amended by his longsuffering and patience. This here hence appears evidently speaking of revenge, which is an effect of anger; He does not say that He does presently inflict punishment, or that He is so ready to inflict it as to show mercy: but He says that He ‘is slow to anger,’ etc.’ And upon the 28th of Isa. 21, where the words are: ‘For the Lord shall rise up as in mount Perahim; He shall be wrath as in the valley of Gibeon, that He may do his work, his strange work, and bring to pass his acts, his strange act.’ ‘The prophet’ (says Zanchi): ‘makes two sorts of God’s works: his proper and strange works. The proper work of God is to show mercy and to spare or forgive; his strange work is to be angry and to punish.’ So far he. I have been somewhat long about this quotation. The weight lies upon this, that mercy in God is his nature, and therefore infinite; it is the very life of God, his drawing of breath in his proper works. Mercy, goodness, longsuffering are according to the nature of the Deity, which is far remote from all unjust severity, cruelty, tyranny and pride. All providences have mercy in them. Tis of the infinite mercy of God that the world is borne up, which would else sink into its first: nothing. It is mercy [that] respites the damnation of wicked men and saves the elect; yea, behold I tell you a mystery, mercies bring calamities: 1 Cor. 11:32, ‘But when we are judged we are chastened of the Lord that we should not be condemned with the world.’ O let me draw breath a little! Consider what unexpected, even incredible mercies God sometimes breathes out. Even when He seems to breathe out smoke and flames, yet He is angry that He may bring his work to pass, that is to say, his proper work; that is, that he may have mercy and preserve. The Devil, he breathes out deaths, miseries and mischiefs, but God loads us with mercies, and (as I said) the attribute of goodness sets God on work to put Himself out in endless mercies and tender bowels beyond what man or angel can possibly imagine.</p></blockquote>

+our+unworthiness+far+higher+than+the+heavens+are+exalted+above+the+earth.+Mercy+is+as+it+were+God%E2%80%99s+fetching+of+breath.+His+infinite+and+incomprehensible+goodness+does+in+a+sort+wholly+live+in+works+of+mercy%3B+For+all+the+world+are+object+of+God%E2%80%99s+mercy+since+Adam%E2%80%99s+fall%3A+%E2%80%98For+all+have+sinned%2C+and+have+come+short+of+the+glory+of+God.%E2%80%99+That+famous+man%2C+Jerome+Zanchi+has+notable+stuff+about+this+matter.+I+will+take+notice+but+of+one+passage%2C+upon+Ex.+34%3A6-7%2C+where+it+is+said+that+God+is+slow+to+anger.+He+writes+%28On+the+Attributes%2C+bk.+2%2C+ch.+1%2C+quest.+2%29%3A+%E2%80%98And+therefore+we+must+note%2C+although+anger+be+attributed+unto+God%2C+it+is+in+God+nothing+else+but+the+chief+goodness+and+justice+whereby+He+abhors+evil%2C+and+according+to+his+just+judgment%2C+does+at+length+punish+it+if+it+be+not+amended+by+his+longsuffering+and+patience.+This+here+hence+appears+evidently+speaking+of+revenge%2C+which+is+an+effect+of+anger%3B+He+does+not+say+that+He+does+presently+inflict+punishment%2C+or+that+He+is+so+ready+to+inflict+it+as+to+show+mercy%3A+but+He+says+that+He+%E2%80%98is+slow+to+anger%2C%E2%80%99+etc.%E2%80%99+And+upon+the+28th+of+Isa.+21%2C+where+the+words+are%3A+%E2%80%98For+the+Lord+shall+rise+up+as+in+mount+Perahim%3B+He+shall+be+wrath+as+in+the+valley+of+Gibeon%2C+that+He+may+do+his+work%2C+his+strange+work%2C+and+bring+to+pass+his+acts%2C+his+strange+act.%E2%80%99+%E2%80%98The+prophet%E2%80%99+%28says+Zanchi%29%3A+%E2%80%98makes+two+sorts+of+God%E2%80%99s+works%3A+his+proper+and+strange+works.+The+proper+work+of+God+is+to+show+mercy+and+to+spare+or+forgive%3B+his+strange+work+is+to+be+angry+and+to+punish.%E2%80%99+So+far+he.+I+have+been+somewhat+long+about+this+quotation.+The+weight+lies+upon+this%2C+that+mercy+in+God+is+his+nature%2C+and+therefore+infinite%3B+it+is+the+very+life+of+God%2C+his+drawing+of+breath+in+his+proper+works.+Mercy%2C+goodness%2C+longsuffering+are+according+to+the+nature+of+the+Deity%2C+which+is+far+remote+from+all+unjust+severity%2C+cruelty%2C+tyranny+and+pride.+All+providences+have+mercy+in+them.+Tis+of+the+infinite+mercy+of+God+that+the+world+is+borne+up%2C+which+would+else+sink+into+its+first%3A+nothing.+It+is+mercy+%5Bthat%5D+respites+the+damnation+of+wicked+men+and+saves+the+elect%3B+yea%2C+behold+I+tell+you+a+mystery%2C+mercies+bring+calamities%3A+1+Cor.+11%3A32%2C+%E2%80%98But+when+we+are+judged+we+are+chastened+of+the+Lord+that+we+should+not+be+condemned+with+the+world.%E2%80%99+O+let+me+draw+breath+a+little%21+Consider+what+unexpected%2C+even+incredible+mercies+God+sometimes+breathes+out.+Even+when+He+seems+to+breathe+out+smoke+and+flames%2C+yet+He+is+angry+that+He+may+bring+his+work+to+pass%2C+that+is+to+say%2C+his+proper+work%3B+that+is%2C+that+he+may+have+mercy+and+preserve.+The+Devil%2C+he+breathes+out+deaths%2C+miseries+and+mischiefs%2C+but+God+loads+us+with+mercies%2C+and+%28as+I+said%29+the+attribute+of+goodness+sets+God+on+work+to+put+Himself+out+in+endless+mercies+and+tender+bowels+beyond+what+man+or+angel+can+possibly+imagine.%E2%80%9D%0A%0A%E2%80%94+Thomas+Larkham%2C+The+Attributes+of+God+Unfolded+%26+Applied...+%28London%3A+Eglesfield%2C+1656%29+Larkham+%281602%E2%80%931669%29+was+an+English+puritan+clergyman+and+settler+in+New+England.%2C+pp.+131-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F900923f427.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/900923f427.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=God%20in%20this%20attribute%20of%20mercy,man%20or%20angel%20can%20possibly%20imagine&amp;text=God%20in%20this%20attribute%20of%20mercy%20is%20infinite&amp;text=beyond%20what%20man%20or%20angel%20can%20possibly%20imagine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b6bfd17c0d" data-kw="">
<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts: 1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added. 2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast. 3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>

nd%20in%20his%20deeds%20and%20performance&amp;text=I%20come%20now%20to%20the%20next%20attribute%20expressed&amp;text=his%20purposes%2C%20and%20in%20his%20deeds%20and%20performance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

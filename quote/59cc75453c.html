<main class="wrap"><figure class="quote" id="q-59cc75453c" data-kw="">
<blockquote><p>By the name of ‘door‘ [in Rev. 3:20], he means man’s heart. That does the Lord knock at by the preaching of his Word, crying out and bearing witness of the force and effectualness of it to our spirit. And the same preaching is never fruitless. For the godly receive comfort by it, and the ungodly are condemned by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kaspar-megander.html">Kaspar Megander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Augustine Marlorate, A Catholic Exposition upon the Revelation of St. John (1574), ch. 3, pp. 69-70 Megander (1495–1545) was a Swiss reformer who assisted Zwingli.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-d18b7522d8" data-kw="">
<blockquote><p>Sixthly, by his not only offering acquaintance with us upon these terms, by his ambassadors, his ministers, but by his coming personally by his Spirit to our several hearts, inviting and soliciting us to this acquaintance. According to that of our Lord Jesus Christ, ‘Behold I stand at the door and knock; if any man hear my voice, and open to Me, I will come in to him, and will sup with him, and he with Me.’ The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians</cite>, (London: Parker, 1679), ch. 4, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>(2) Believing is the soul’s receiving Christ. St. Paul says, “Ye have received Christ Jesus the Lord.” (Col. 2:6) Christ offers to come into man’s heart with pardon, mercy, and grace, and to dwell there as its Peace-maker and King. He says, ‘I stand at the door and knock.’ (Rev. 3:20) The believer hears his voice, opens the door and admits Christ as his Master, Priest and King.</p></blockquote>

</figure><figure class="quote" id="q-d16b64007b" data-kw="">
<blockquote><p>The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways;

1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported:

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, 3:20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

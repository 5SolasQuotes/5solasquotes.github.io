<main class="wrap"><figure class="quote" id="q-51fc46e695" data-kw="">
<blockquote><p>The truth is that fasting is such a help to extraordinary humiliation, as moderate feasting is to extraordinary thanksgiving, and therefore [fasting] is no more worship than Christian feasting: And to this purpose do our divines answer, concerning this place, which is ordinarily objected by every Papist, as here by the Rejoinder [of Ames’s opponent]. See Chemnitius upon these words. See Polanus, Syntagma, bk. 9, ch. 8, ‘Fasting is a help to prayer, a sign of humility and repentance, but is not a worship of God.’ 5. Fasting such as Hannah’s was, is not a human institution, as our ceremonies are, but partly natural, when the whole man is taken up with greater and more instant imployment, exclusive of all ordinary refreshments: and partly of divine application, in extraordinary humiliation, so that it has ground and example both in the Old &amp; New Testament, which our ceremonies are destitute of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (Amsterdam: Thorp, 1633), Manuduction, ch. 12, section 2, pp. 145-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/fasting-and-watchfulness.html">Fasting and Watchfulness</a></span></div>

</figure><figure class="quote" id="q-1fb865d1aa" data-kw="watchfulness">
<blockquote><p>These things are not said in order that we, favoring our own slothfulness, may give over the function of prayer to the Spirit of God, and vegetate in that carelessness to which we are all too prone. … But rather our intention is that, loathing our inertia and dullness, we should seek such aid of the Spirit. And indeed, Paul, when he enjoins us to pray in the Spirit [I Cor. 14:15], does not stop urging us to watchfulness. He means that the prompting of the Spirit empowers us so to compose prayers as by no means to hinder or hold back our own effort, since in this matter God&#x27;s will is to test how effectually faith moves our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.5</span></figcaption>

</figure><figure class="quote" id="q-3c2a030736" data-kw="">
<blockquote><p>Were there no more in praying but a communion with God, how sweet is it? When Christ prays, the ‘fashion of his countenance is changed,’ Lk. 9:29. There is a heaven in the bosom of prayer, though there were never a granting of the suit; sure there is a sin in making heaven a hire and in making duty a relative thing, a horse for a journey, a ship for a voyage to fetch home gold, where as there is heaven in praising God before the Throne, such as is both work and wages, and so in spiritual duties here.</p></blockquote>

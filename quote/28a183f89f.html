<main class="wrap"><figure class="quote" id="q-28a183f89f" data-kw="">
<blockquote><p>These differences were a sad trial and temptation to the Church, and occasioned many sad animosities and alienations in affection both amongst ministers and people, obstructed greatly the power of godliness and edification amongst all, and did beget much prejudice, envy and emulation, that many looked more at their own image in others than the image of God in them, and accordingly rejected them; which always falls in in differences amongst the godly. But after king Charles in the 1660 returned from his exile, then their eyes were opened to see the evil of division, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-356aa4c0e6" data-kw="">
<blockquote><p>Schism has ever proven exceeding hurtful to the Church, and has been an inlet and nursery to the greatest errors: It is most pressingly condemned in the Scriptures, even with as great weight as corrupt doctrine and heresy are; and it is attributed to that same original, to wit, the flesh, with witchcraft, idolatry, heresy, etc. Gal. 5:20. It has also proven most dangerous to those who have been engaged therein, and often has been a snare to bring on spiritual desertion, deadness of spirit, security, self-confidence, or some other spiritual evils of that kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-fb363377bd" data-kw="">
<blockquote><p>…simply a question of law in our own church, ‘the Presbyterian Church in the United States,’ the question of whether the Assembly has the power ‘to make law for the church in the matter of ‘offences,’ or to give its deliverances in thesi the force the force of judicial decisions. It had been contended by some that the deliverances of the Assemblies of 1865, 1869, and 1877 obliged the courts of original jurisdiction to discipline for dancing, that is, to exclude every church member convicted of dancing from the privileges of the church; that these courts had no discretion; that they were not allowed to interpret the law of the church for themselves, but must accept the interpretation of the Assembly, albeit that interpretation had not been given in the investigation of a judicial case regularly brought up (that is, in hypothesi), but as an abstract and general proceeding (in thesi)… Before proceeding to vindicate the action of the Assembly [which later said that its theses were ‘only didactic, advisory and monitory’], we beg leave to remind our readers that the principle here involved is one of immense importance. It lies at the root of all the struggles between the advocates of a constitutional government and the advocates of an ‘absolutism’… the essence of the struggle has always been the same… the question has always been, whether the power of the whole is over every part, or only over the power of the part; whether the whole is simply a great wheel, of which the parts are only spokes, or whether it be a wheel of which the parts are also wheels, each having a sphere and movement of its own, yet moving in subordination to the movement of the great wheel…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Powers of the Several Church Courts</cite>, ... (Richmond, 1896), vol. 2, pp. 331-360. Originally published in The Southern Presbyterian Review (April, 1880). Also with an introduction in ed. Hall &amp; Hall, Paradigms in Polity… (Eerdmans, 1994), pp. 585-602. | Peck:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

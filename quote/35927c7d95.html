<main class="wrap"><figure class="quote" id="q-35927c7d95" data-kw="">
<blockquote><p>I had in answer to Mr. [William] Prynne’s third Query, given this reason why profane and scandalous persons are to be kept off from the Sacrament, and yet not from hearing the Word: because the word is not only a confirming and comforting, but a converting Ordinance, and is a mean appointed of God to turn sinners from darkness to light, and from the power of Satan to God: Whereas the Sacrament is not a converting, but a confirming and sealing Ordinance, which is not given to the Church for the conversion of Sinners, but for the Communion of Saints: It is not appointed to put a man in the state of grace, but to seal unto a man that interest in Christ and in the Covenant of Grace which he already hath.

Mr. Prynne doth with much eagerness contradict me in this, and argue at length the contrary. (Which is the marrow and fatness (if there be any) in his debate concerning the eighth point of difference) Whereby he doth not only contradict me, but himself too (as shall appear) yea and join not only with the more rigid Lutherans, but with the Papists themselves against the Writers of the Reformed Churches. For the very same thing which is controverted between him and me, is controverted between Papists and Protestants. The Papists hold that the Sacraments are instrumental, to confer, give, or work grace; yea ex opere operato.

Our divines hold that the Sacraments are appointed of God, and delivered to the Church as sealing Ordinances, not to give, but to testify what is given, not to make, but confirm Saints. And they do not only oppose the Papists’ opus operatum, but they simply deny this instrumentality of Sacraments, that they are appointed of God for working or giving grace where it is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, The Divine Ordinance of Church Government Vindicated, So as the present Erastian Controversy concerning the distinction of Civil and Ecclesiasticall Government, Excommunication, and Suspension, is fully debated and discussed, from the holy Scripture, from the Jewish and C</cite>, (London: Richard Whitaker, 1646), Book 3.12, p. 229.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a2fa673ee" data-kw="">
<blockquote><p>In the time of Justin the Deacon some did carry that which was left of the Communion, at what time the Lord’s Supper was celebrated, to them which were absent by reason of their disease, from the public assembly or unto strangers, and outlandish bishops into their inn. And as Eusebius reports (Church History, Ch. 5, bk. 24), the bishop of Rome was wont to do so, but without superstition, and for no other end but for a token of concord and consent in doctrine and in the whole profession: but because we say that we must not so much enquire whether those fragments were sent, or but whether they were well sent. And that custom has degenerated into superstition, whereby at this day the host is carried to them alone which are about to die, and that for certain gain and advantage, as also in a vain persuasion of a certain necessary provision for their journey, that custom of carrying the Supper to the absent, is worthily taken away in our Churches. Cyprian in the administration of this sacrament, ‘We ought to do no other thing than that which Christ did.&#x27;</p></blockquote>

<blockquote><p>…when I preached at court before the [English] Queen’s majesty, and was speaking about the antiquity of the popish religion, I remember that I said this among other things, that our enemies, when they accuse our cause of novelty, both wrong us and deceive the people; for that they approved new things as if they were old and condemned as new things of the greatest antiquity; that their private masses and their mutilated communions, and the natural and real presence and transubstantiation, etc. (in which things the whole of their religion is contained) have no certain and express testimony either of holy scripture or ancient councils, or fathers, or of anything that could be called antiquity.</p></blockquote>

<blockquote><p>As to that question, Whether baptism may be lawfully administred extraordinarily where the child is ready to die? It was resolved that in those places where the Word of God is ordinarily preached, the established order shall be observed; but in such places where sermons are had only extraordinarily, at an undue hour, it is left to the minister’s discretion to accommodate themselves to the infirmities of parents, yet to be very careful that they do not nourish them up in superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, French Reformed Churches, John Quick, Synodicon (London, 1692) | 2nd Synod, at Poictiers (1560), ch. 6, section 8, p. 18</span></figcaption>

</figure><figure class="quote" id="q-ae377637cb" data-kw="">
<blockquote><p>Neither can ye also of this matter, or of any my words gather that any part that remains after the receiving of the sacrament should be worshipped. For whatsoever strength the outward signs in the sacraments have, they have it of the Holy Ghost, of the Lord’s words, and of his institution and ordinance. Which things do no longer remain than while the use and receiving of the sacrament does continue. And the promise of God is applied to this sacrament whiles we eat and drink the sacrament. Wherefore that opinion and doctrine of reserving the sacrament was not catholic, nor universally used or received in the Christian congregations… We do not deny but that the leavings of the sacrament were sometimes reserved and kept: but it was done without any worshipping of it, and without any superstitious points of reverence. The leavings of this sacrament were delivered to children and to women to be carried to sick folk, as it is plain in the history of Eusebius and in Jerome, one of the doctors of the Church. And I would somewhat stagger to say the receiving of such leavings being done privately out of the holy company, and without the order and manner of receiving the communion instituted of Christ, was a right, a full and a perfect receiving of the communion or of the sacrament, which receiving of the sacrament among the sick folks I could yet nevertheless grant unto, so that the same do repeat the holy words of Christ and so ye some honest Christians do there among themselves put in use the ordinance of Christ in this behalf. For except more persons than one alone do receive the communion together: the due order and course of receiving this sacrament is not observed and kept. Christ’s words were to more than one, in this sort: Accipe, edite et bibite: that is to say, ‘Take ye, eat ye, and drink ye.’ There is bread broken into sundry pieces, which thing means that it should be dealed about and distributed to more than one. And they speak many things in their canon of the old mass, which unless a number do receive it together, are stark false and very lies. And besides this, it is called of learned men, coena, a supper, communio, a communion, and synaxis, a gathering or coming together: which names do nothing agree with a private action or doing of one person alone by himself. Neither do we in any place read in old writers of any private masses where one alone might receive the sacrament without the company of others. Honorius, bishop of Rome, was the first that made a decree that the sacrament of eucharistia should be reserved and kept and decreed further, that honor and reverence should be done to it, when it was carried abroad any whither. That if this thing had been done of others before his days, it had not belonged unto him to make a decree of any such thing. And to speak in a brief sum, we affirm and hold (as we have before said) that this sacrament has not his full strength and virtue and efficacy but whiles it is in doing and in executing, and whiles it is in receiving: which thing you see also to be done in all the other sacraments [such as the brazen serpent].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse or Treatise</cite>, … concerning the Sacrament of the Lord’s Supper (London, 1550), p. lxxi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“Neither can ye also of this matter, or of any my words gather that any part that remains after the receiving of the sacrament should be worshipped. For whatsoever strength the outward signs in the sacraments have, they have it of the Holy Ghost, of the Lord’s words, and of his institution and ordinance. Which things do no longer remain than while the use and receiving of the sacrament does continue. And the promise of God is applied to this sacrament whiles we eat and drink the sacrament. Wherefore that opinion and doctrine of reserving the sacrament was not catholic, nor universally used or received in the Christian congregations… We do not deny but that the leavings of the sacrament were sometimes reserved and kept: but it was done without any worshipping of it, and without any superstitious points of reverence. The leavings of this sacrament were delivered to children and to women to be carried to sick folk, as it is plain in the history of Eusebius and in Jerome, one of the doctors of the Church. And I would somewhat stagger to say the receiving of such leavings being done privately out of the holy company, and without the order and manner of receiving the communion instituted of Christ, was a right, a full and a perfect receiving of the communion or of the sacrament, which receiving of the sacrament among the sick folks I could yet nevertheless grant unto, so that the same do repeat the holy words of Christ and so ye some honest Christians do there among themselves put in use the ordinance of Christ in this behalf. For except more persons than one alone do receive the communion together: the due order and course of receiving this sacrament is not observed and kept. Christ’s words were to more than one, in this sort: Accipe, edite et bibite: that is to say, ‘Take ye, eat ye, and drink ye.’ There is bread broken into sundry pieces, which thing means that it should be dealed about and distributed to more than one. And they speak many things in their canon of the old mass, which unless a number do receive it together, are stark false and very lies. And besides this, it is called of learned men, coena, a supper, communio, a communion, and synaxis, a gathering or coming together: which names do nothing agree with a private action or doing of one person alone by himself. Neither do we in any place read in old writers of any private masses where one alone might receive the sacrament without the company of others. Honorius, bishop of Rome, was the first that made a decree that the sacrament of eucharistia should be reserved and kept and decreed further, that honor and reverence should be done to it, when it was carried abroad any whither. That if this thing had been done of others before his days, it had not belonged unto him to make a decree of any such thing. And to speak in a brief sum, we affirm and hold (as we have before said) that this sacrament has not his full strength and virtue and efficacy but whiles it is in doing and in executing, and whiles it is in receiving: which thing you see also to be done in all the other sacraments [such as the brazen serpent].”

— Peter Martyr Vermigli, A Discourse or Treatise, … concerning the Sacrament of the Lord’s Supper (London, 1550), p. lxxi">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+can+ye+also+of+this+matter%2C+or+of+any+my+words+gather+that+any+part+that+remains+after+the+receiving+of+the+sacrament+should+be+worshipped.+For+whatsoever+strength+the+outward+signs+in+the+sacraments+have%2C+they+have+it+of+the+Holy+Ghost%2C+of+the+Lord%E2%80%99s+words%2C+and+of+his+institution+and+ordinance.+Which+things+do+no+longer+remain+than+while+the+use+and+receiving+of+the+sacrament+does+continue.+And+the+promise+of+God+is+applied+to+this+sacrament+whiles+we+eat+and+drink+the+sacrament.+Wherefore+that+opinion+and+doctrine+of+reserving+the+sacrament+was+not+catholic%2C+nor+universally+used+or+received+in+the+Christian+congregations%E2%80%A6+We+do+not+deny+but+that+the+leavings+of+the+sacrament+were+sometimes+reserved+and+kept%3A+but+it+was+done+without+any+worshipping+of+it%2C+and+without+any+superstitious+points+of+reverence.+The+leavings+of+this+sacrament+were+delivered+to+children+and+to+women+to+be+carried+to+sick+folk%2C+as+it+is+plain+in+the+history+of+Eusebius+and+in+Jerome%2C+one+of+the+doctors+of+the+Church.+And+I+would+somewhat+stagger+to+say+the+receiving+of+such+leavings+being+done+privately+out+of+the+holy+company%2C+and+without+the+order+and+manner+of+receiving+the+communion+instituted+of+Christ%2C+was+a+right%2C+a+full+and+a+perfect+receiving+of+the+communion+or+of+the+sacrament%2C+which+receiving+of+the+sacrament+among+the+sick+folks+I+could+yet+nevertheless+grant+unto%2C+so+that+the+same+do+repeat+the+holy+words+of+Christ+and+so+ye+some+honest+Christians+do+there+among+themselves+put+in+use+the+ordinance+of+Christ+in+this+behalf.+For+except+more+persons+than+one+alone+do+receive+the+communion+together%3A+the+due+order+and+course+of+receiving+this+sacrament+is+not+observed+and+kept.+Christ%E2%80%99s+words+were+to+more+than+one%2C+in+this+sort%3A+Accipe%2C+edite+et+bibite%3A+that+is+to+say%2C+%E2%80%98Take+ye%2C+eat+ye%2C+and+drink+ye.%E2%80%99+There+is+bread+broken+into+sundry+pieces%2C+which+thing+means+that+it+should+be+dealed+about+and+distributed+to+more+than+one.+And+they+speak+many+things+in+their+canon+of+the+old+mass%2C+which+unless+a+number+do+receive+it+together%2C+are+stark+false+and+very+lies.+And+besides+this%2C+it+is+called+of+learned+men%2C+coena%2C+a+supper%2C+communio%2C+a+communion%2C+and+synaxis%2C+a+gathering+or+coming+together%3A+which+names+do+nothing+agree+with+a+private+action+or+doing+of+one+person+alone+by+himself.+Neither+do+we+in+any+place+read+in+old+writers+of+any+private+masses+where+one+alone+might+receive+the+sacrament+without+the+company+of+others.+Honorius%2C+bishop+of+Rome%2C+was+the+first+that+made+a+decree+that+the+sacrament+of+eucharistia+should+be+reserved+and+kept+and+decreed+further%2C+that+honor+and+reverence+should+be+done+to+it%2C+when+it+was+carried+abroad+any+whither.+That+if+this+thing+had+been+done+of+others+before+his+days%2C+it+had+not+belonged+unto+him+to+make+a+decree+of+any+such+thing.+And+to+speak+in+a+brief+sum%2C+we+affirm+and+hold+%28as+we+have+before+said%29+that+this+sacrament+has+not+his+full+strength+and+virtue+and+efficacy+but+whiles+it+is+in+doing+and+in+executing%2C+and+whiles+it+is+in+receiving%3A+which+thing+you+see+also+to+be+done+in+all+the+other+sacraments+%5Bsuch+as+the+brazen+serpent%5D.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Discourse+or+Treatise%2C+%E2%80%A6+concerning+the+Sacrament+of+the+Lord%E2%80%99s+Supper+%28London%2C+1550%29%2C+p.+lxxi&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae377637cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae377637cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Neither%20can%20ye%20also%20of%20this,sacraments%20%5Bsuch%20as%20the%20brazen%20serpent&amp;text=Neither%20can%20ye%20also%20of%20this%20matter%2C%20or&amp;text=the%20other%20sacraments%20%5Bsuch%20as%20the%20brazen%20serpent" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. A change from the offers of Grace, to the revelations of wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11… There is never an offer of grace and love made to souls in the grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern, or A Serious Warning to a Timely &amp; Thorough Preparation for Death</cite>, (London: J. Robinson, 1674), pp. 73–75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17f9255f8e" data-kw="">
<blockquote><p>Secondly, we must from hence be exhorted to take heed of usurping Christ’s honor to our selves, of being our own rule or way. The Lord is a jealous God, and will not suffer any to be a self mover, or a God unto himself. It is one of God’s extremest judgments to give men over to themselves, and leave them to follow their own rules. When He has first woo’d men by his Spirit, and that is resisted; enticed them by his mercies, and they are abused; threatened them with his judgments, and they are mis-attributed to second causes; cried unto them by his prophets, and they are reviled; sent his own Son to persuade them, and He is trampled on and despised: when He offers to teach them, and they stop their ears; to lead them, and they pull away their shoulder; to convert them, and they hardened their heart; when they set up mounds against the Gospel, as it were to non-plus and pose the mercies of God, that there may be no remedy left; then after all these indignities to the Spirit of Grace, this is the judgement with which God uses to revenge the quarrel of his Grace and Covenant, to leave them to the hardness and impenitency of their own hearts, to be a rule and way unto themselves. My people would not hearken to my voice, and Israel would none of me. … [Reynolds below is describing Christ’s offers, wooings and entreaties both before and after conversion, which is clear from the beginning and end of the quote] We see then, to conclude all, what an absolute necessity lies upon us of having Christ, because with Him we have All things, and can do all things: without Him we are poor and can do nothing. And the more necessary the duty, the more sinful the neglect: especially considering that Christ withholds not Himself, but is ready to meet, to prevent, to attend every heart that in truth desires Him. If a man have a serious, simple, sincere will, to come wholly to Christ, not to be held back from him by His dearest and closest corruptions, by the sweetest pleasures, or strongest temptations, which can allure or assault him, he may draw near unto Him with boldness, and assurance of acceptation: he has a call, Christ invites [Margin Note: Rev. 22:17], yea entreats him, and therefore he may come: he has a command, Christ requires it of him, and therefore he must come. And now when we have Christ, how careful should we be to keep Him; how tender and watchful over all our behaviors towards Him, lest He be grieved and depart again. The Spirit of the Lord is a delicate spirit, most sensible of those injuries which his friends do Him. Let us therefore take heed of violating, afflicting, discouraging, grieving this Spirit (which is the bond of all our union and interest with Christ) in any of those his sacred breathings and operations upon the Soul. But when He teaches, let us submit and obey, receive the belief and the love of His Truth: when He promises, let us neither distrust nor despise, but embrace as true, and admire as precious, all the offers which He makes to us: when He contends with our lusts in His Word and secret suggestions, let him not always strive, but let us give up our fleshly affections to be crucified by Him: when He woos and invites us, when He offers to lead and to draw us, let us not stop the ear, or pull away the shoulder, or draw backward like froward children, or cast cold water in the face of Grace, by thwarting the motions, and rebelling against the dictates thereof, but let us yield our selves unto Him, captivate all our lusts, and consecrate all our powers, and submit all our desires to His rule and government; and then when He has been a Spirit of union, to incorporate us into Christ’s Body; and a Spirit of unction, to sanctify us with His Grace, He will undoubtedly be a Spirit of comfort and assurance, to seal us unto the day of our full redemption.</p></blockquote>

</figure><figure class="quote" id="q-1928f1dd77" data-kw="">
<blockquote><p>A farther difficulty here offers itself: Objection: …If the covenant, or second covenant (as opposite to that of works) be in Christ, and grounded on the work of reconciliation, then it is commensurate with it and of no greater latitude; and only the elect and chosen in Christ, the called according to God’s purpose, being reconciled, only these are in Covenant. [Yet] When the Scripture (as shall be, God willing, made good) confines not this covenant within the limits of the invisible Church, known only to God, but it is as large as the Church-visible. To this I answer that the Prophetical office of Christ, as Shepherd and Bishop of our souls, and so much of his Kingly office as consists in a legislative power, hath its foundation (as well as the Covenant) in this work of reconciliation. Had not this been undertaken by Christ for mankind, man had never enjoyed that light, man had never had an oracle, or an ordinance as the fruit of his prophetic office, yet, these ordinances are not commensurate with reconciliation, nor of equal latitude with election; So neither is the covenant, but either of both in order towards it. As ordinances therefore are Christ’s gift from Heaven, as the fruit of his death and resurrection, when yet all that partake of these ordinances do not yet die or rise with Christ; So, is the covenant, when yet all in covenant are not steadfast in it, nor obtain the graces of it. Therefore I know not how to admit that which a divine, singularly eminent, hath laid down, that all the effects of Christ’s death are spiritual, distinguishing and saving, seeing [that] gifts of Christ from his Father’s right hand are fruits of his death, yet not spiritual, distinguishing and saving. That they are in some sort spiritual, I dare grant that is, in ordine ad spiritualia [in order unto those things which are spiritual], (if I may so speak) they have a tendency to a spiritual work. That they are distinguishing from the world (as it is taken in opposition to the Church-visible) I yield, for I do not enlarge the fruit of Christ’s death to all man-kind, assenting to Master [John] Owen and Master [John] Stalham (d. 1677) in the grounds that they lay, of God’s respite [delay] of the execution of the whole penalty on man, with the continuance of outward favors not to be upon the account of Christ, but for other reasons; yet I know not how to affirm, that ordinances which yet are fruits of his death, are all saving, spiritual and distinguishing, seeing they neither confer salvation, nor saving grace on all that partake of them, so that Christ is a Mediator of this covenant and yet those enter into it that have not reconciliation by Christ Jesus; The Ephesians that were afar off, are made nigh by the blood of Christ (Eph. 2:13), that is, brought into a visible Church-state in the fruition of ordinances, made free of that city whose name is, ‘The Lord is here’ (Eze. 48:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Foederis, or, A Treatise of the Covenant of God</cite>, (London, 1658), ch. 17, pp. 98-99</span></figcaption>

ritual%2C+distinguishing+and+saving.+That+they+are+in+some+sort+spiritual%2C+I+dare+grant+that+is%2C+in+ordine+ad+spiritualia+%5Bin+order+unto+those+things+which+are+spiritual%5D%2C+%28if+I+may+so+speak%29+they+have+a+tendency+to+a+spiritual+work.+That+they+are+distinguishing+from+the+world+%28as+it+is+taken+in+opposition+to+the+Church-visible%29+I+yield%2C+for+I+do+not+enlarge+the+fruit+of+Christ%E2%80%99s+death+to+all+man-kind%2C+assenting+to+Master+%5BJohn%5D+Owen+and+Master+%5BJohn%5D+Stalham+%28d.+1677%29+in+the+grounds+that+they+lay%2C+of+God%E2%80%99s+respite+%5Bdelay%5D+of+the+execution+of+the+whole+penalty+on+man%2C+with+the+continuance+of+outward+favors+not+to+be+upon+the+account+of+Christ%2C+but+for+other+reasons%3B+yet+I+know+not+how+to+affirm%2C+that+ordinances+which+yet+are+fruits+of+his+death%2C+are+all+saving%2C+spiritual+and+distinguishing%2C+seeing+they+neither+confer+salvation%2C+nor+saving+grace+on+all+that+partake+of+them%2C+so+that+Christ+is+a+Mediator+of+this+covenant+and+yet+those+enter+into+it+that+have+not+reconciliation+by+Christ+Jesus%3B+The+Ephesians+that+were+afar+off%2C+are+made+nigh+by+the+blood+of+Christ+%28Eph.+2%3A13%29%2C+that+is%2C+brought+into+a+visible+Church-state+in+the+fruition+of+ordinances%2C+made+free+of+that+city+whose+name+is%2C+%E2%80%98The+Lord+is+here%E2%80%99+%28Eze.+48%3A35%29.%E2%80%9D%0A%0A%E2%80%94+Thomas+Blake%2C+Vindici%C3%A6+Foederis%2C+or%2C+A+Treatise+of+the+Covenant+of+God+%28London%2C+1658%29%2C+ch.+17%2C+pp.+98-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1928f1dd77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1928f1dd77.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/atonement/redemptive-benefits-for-the-reprobate/#:~:text=A%20farther%20difficulty%20here%20offers%20itself,The%20Lord%20is%20here%E2%80%99%20%28Eze.%2048%3A35&amp;text=A%20farther%20difficulty%20here%20offers%20itself%3A%20Obje <blockquote><p>Nebuchadnezzar… was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven… And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation. And all the inhabitants of the earth are reputed as nothing: and He doeth according to his will in the army of heaven, and among the inhabitants of the earth… At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me…</p></blockquote>

</figure><figure class="quote" id="q-5f5b1e2a9e" data-kw="">
<blockquote><p>[407] Although vicarious atonement as the acquisition of salvation in its totality cannot therefore be expanded to include all persons individually, this is not to say that it has no significance for those who are lost. Between the church and the world there is, at this point, not just separation and contrast. It is not the case that Christ has acquired everything for the former and nothing for the latter. … And also his work has value for all, even for those who have not believed and will never believe in Him. For though it is true that Christ did not, strictly speaking, acquire the natural life by his suffering and death, yet the human race was spared on account of the fact that Christ would come to save it. Christ is not the head of all human beings, not the prophet, priest, and king of everyone, for He is the head of the church and has been anointed king over Zion. Yet all human beings owe a great deal to Christ. The light shines in the darkness and illumines every person coming into the world. The world was made through him and remains so, though it did not recognize him. Also as the Christ, He gives to unbelievers many benefits: the call of the gospel, the warning to repent, historical faith, a virtuous life, a variety of gifts and powers, offices and ministries within the church, such as, for example, even the office of an apostle in the case of Judas. “Without Jesus Christ the world would not exist, for it would necessarily either be destroyed or be a hell” (Pascal). Even hanging from the cross, He still prays for forgiveness for the appalling sin being committed by the Jews at that very moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 3:470-75</span></figcaption>

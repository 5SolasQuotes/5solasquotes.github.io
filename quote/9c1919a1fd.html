<blockquote><p>We pay to Cæsar what is Cæsar’s, and to God what is God’s. Tribute is due to Cæsar, we do not deny it. The Church belongs to God, therefore it ought not to be assigned to Cæsar. For the temple of God cannot be Cæsar’s by right. That this is said with respectful feeling for the Emperor, no one can deny. For what is more full of respect than that the Emperor should be called the son of the Church. As it is said, it is said without sin, since it is said with the divine favour. For the Emperor is within the Church, not above it. For a good emperor seeks the aid of the Church and does not refuse it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon against Auxentius on the giving up of the Basilicas</cite>, (c. 385), 35-36 in NPNF2, 10: 436.</span></figcaption>

<blockquote><p>The third cause is to avoid the inconvenience of solitariness, signified in these words, “It is not good for man to be alone;” as though he had said, This life would be miserable and irksome, and unpleasant to man, if the Lord had not given him a wife to company his troubles. If it be not good for man to be alone, then it is good for man to have a fellow; therefore as God created a pair of all other kinds, so he created a pair of this kind.

We say that one is none, because he cannot be fewer than one, he cannot be less than one, he cannot be weaker than one, and therefore the wise man saith, Eccles. iv. 10, ‘Woe to him that is alone,’ that is, he which is alone shall have woe. Thoughts, and cares, and fears will come to him because he hath none to comfort him, as thieves steal in when the house is empty; like a turtle which hath lost his mate; like one leg when the other is cut off; like one wing when the other is clipped; so had the man been, if the woman had not been joined to him; therefore for mutual society, God coupled two together, that the infinite troubles which lie upon us in the world might be eased with the comfort and help one of another, and that the poor in the world might have some comfort as well as the rich ; for “the poor man,” saith Solomon, “is forsaken of his own brethren,” Prov. xix. 7; yet God hath provided one comfort for him, like Jonathan’s armour-bearer, that shall never forsake him, 1 Sam. xiv. 7, that is, another self, which is the only commodity (as I may term it) wherein the poor do match the rich; without which some persons should have no helper, no comfort, no friend at all.

But as it is not good to be alone, so Solomon sheweth that “it is better to be alone than to dwell with a froward wife,” Prov. xxi. 9, which is like a quotidian ague, to keep his patience in ure [sic]. Such furies do haunt some men, like Saul’s spirit, 1 Sam. xvi. 14, as though the devil had put a sword into their hands to kill themselves; therefore choose whom thou mayest enjoy, or live alone still, and thou shalt not repent thee of thy bargain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 12.</span></figcaption>

</figure><figure class="quote" id="q-eaaf0040a1" data-kw="">
<blockquote><p>But truly the Preservers [civil health officials appointed for the plague] shall in vain altogether with this travail [labor] and diligence look unto their commonwealth if they use not like wisdom in the receiving in or shutting out of either men or things that come from other places when as this sickness is now rife everywhere and is at this time in a great part of Germany. For what shall it avail to have removed the filth of our own places, if we will receive again the corruption from others? …even so also this magistrate of ours (whom in this case we have said must be a general physician [by metaphor]) must do his diligence in the universal and common body of the commonwealth and orderly provide for all, that not so much as the least piece of infection be received or left behind whereupon new wracks and dangers are to be feared. For (as the poet says) the flame that is not looked unto does straight again recover. … But if any man shall think that it is against charity for that I hold that men and such as are our brethren are to be shut out, of the which many fly unto us as unto a sanctuary, as it were from a deadly enemy: unto him I must make this answer, that I would have no man forsaken or in any case to be destitute of our help, but yet there ought to be a set and steadfast way and order in using of help. True charity begins at itself, but ends not in it self alone: But rather it stretches out itself as far as it can to every neighbor, and according unto her power, imparts her help with every man; and as Ambrose says of liberality, [it] is commended of her faith: cause, place and time. For what a kind of charity should this be, to receive one sick sheep into the fold and to bring the scab unto the whole flock?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, (London, 1583) | bk. 1, ch. 10, ‘Of not Receiving of Travelers and Strangers into the City, nor of Bringing in of Things without a Testimonial of the Health of that Place from Whence they Come’</span></figcaption>

<blockquote><p>According to the common opinion and public authority of the Anglican church by the supreme government of the king is meant the civil and the power of the sword, nor can it in any way be extended to a government which is purely of another kind” (ibid., p. 7). He who desires more on this subject should consult the celebrated Voetius (Politicae Ecclesiasticae, Pt. I [1663], Bk. I, Tract. II, pp. 149-82).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e6b638371c" data-kw="">
<blockquote><p>As to the first, there is implied in the lordship over the Sabbath which the Lord Jesus claims, as the Son of man, a right of property in it. The Sabbath was made for man; the Son of man is Lord of it. He asserts a right of property in his own name, and in the name of man; of mankind universally, and of every individual man in particular. This is a gracious charter, investing every child of Adam with a title to the free and undisturbed use of a weekly day of rest. It is a chartered title, which he may legitimately plead against all or any of his fellow-men who would invade or abridge his rest. A weekly Sabbath is the birth-right of humanity, ratified and vindicated by Him who represents humanity. The Sabbath was made for man. The Son of man is Lord of it.

Hear that, ye men of toil. Is it not good news for you? A weekly day of rest is yours; yours by divine right. It belongs to you as men. It is your property; as much your property as the bread for which you work so hard. Society is not entitled to defraud or deprive you of it. Your task-masters are not entitled to defraud or deprive you of it. You are not entitled to defraud or deprive one another of it. What surrender of your right you may fairly be expected to make, out of deference to the necessities of society, or of your employers, or of one another, may be a question forced upon them and you by the actual circumstances of the world and the conditions of human life, especially in so highly artificial a state of civilization as ours. Where such necessities are real, and really require the sacrifice, you may, and you should, without scruple and without grudging, consent to forego some portion of your privilege. The terms of the great charter securing it to you in perpetual possession, leave room, doubtless, for such accommodation.

The Sabbath was made for man; the Son of man is Lord of it. If the exigencies of human life, therefore, require a certain measure of work to be done on the Sabbath, it may be, it must be, lawful and right on your part, when you are lawfully called upon, to do it. But beware, ye working men. See that the exigencies to which you are asked to make even the smallest concession of your precious right, are real. Tell those who have more in their power than you have in estimating these exigencies, or in creating them, that you will watch them narrowly. Bid them consider their responsibility. Remind them that they are meddling with your right, that they are dealing with your property.

It is at their peril, if they either bribe, or tempt, or force you, to labour that is not clearly necessary. It is an act of robbery, let who will, or what may, bear the blame of it; society, or heads of houses, or masters of workshops; bad laws, bad customs, bad family arrangements; bad habits as regards even church-going itself. Whoever it may be, or whatever it may be, that exacts from you an hour’s service on the Sabbath that could be dispensed with or spared without prejudice to a higher duty, you are wronged, cruelly wronged. That is stolen from you to which you have as just a title as the heir has to his inheritance, or the monarch to her throne.

And will you be so foolish, so infatuated, so mad, as to listen to false friends, flattering you with the hope of relaxation, recreation, amusement? They promise you liberty. What are they themselves? And what is their liberty? If it is liberty to you, it is at the expense of Sabbath labour and Sabbath bondage to your fellows. It is liberty, moreover, which you will find it hard indeed to defend against griping avarice and the insolence of power, when the very men who give it to you, finding you free to play, will hold you free to work too; and, one by one, will drag you in, till Sabbath and week-day, all alike, there shall be one dreary monotony of work, work, work, all the year through, among all your families and in all your habitations.

Oh, would that ye knew your best and truest friend-that Son of man who tells you that the Sabbath was made for you, and that he, on your behalf, is Lord of the Sabbath! Would that ye understood what really is the only charter of your freedom in this toiling world, the charter which challenges for you, at the hands of all and sundry who have any control over you, a right, a sacred and indefeasible right, to have the Sabbath wholly to yourselves, that you may give it wholly to your God!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Sabbath: The Sabbath made for Man; The Son of Man Lord of it. A Sermon (Edinburgh: Johnstone &amp; Hunter, 1856), pp 44-48.</cite></span></figcaption>

<blockquote><p>[T]hey who have become inventors of unholy heresies, profane and apostate and enlarging their unbridled mouth against the Divine glory and uttering things perverted, will be caught as having of their folly slipped into charges not slighter than those of the infatuation of the Greeks or haply into charges even surpassing theirs. For it were better for them not to have known the way of truth than having known it to turn back from the holy commandment given to them: for the true proverb hath come to them, The dog returned to his own vomit, and, The washed sow to the wallowing in the mire.

<blockquote><p>For this is true in the majority of cases that women take more pains with their hair than men. Therefore, it seems to be a condition suitable to women that they use an artificial covering for the head more than men.</p></blockquote>

<blockquote><p>The rules here shall be:

A. Controversies shall not be shall not be sought out without necessity, because of the loss of time.

B. Yet, on the other hand, when there is an imminent danger to the church from these controversies, and thus your hearers must be equipped, controversies shall not be neglected.

C. Those controversies that have been buried shall not be exhumed, and those that are unknown shall not be made known, lest in refuting them we teach them.

D. We should not employ any arguments and solutions except solid ones, suitable for bringing a man to conviction, willing or not.

E. We should not be excessively labourious in this business, so that practice is not suspended or excluded.

F. Let us exert ourselves so that even the elenctic part, however much it can be done, is handled in a practical manner, that is, so that it is made manifest that the emphasis and power of the truth to be defended and the falsehood to be refuted is either to promote or to hinder piety, as well as eternal salvation.</p></blockquote>

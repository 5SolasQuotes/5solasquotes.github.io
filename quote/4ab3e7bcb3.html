</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f149a192bc" data-kw="">
<blockquote><p>I know none so liable to such a charge as myself, who yet am ready to give an account to any brother that is offended; and I believe that they ought to rebuke me personally and hear my answer, before they withdraw from me or censure me, much more so [regarding] many others for my sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“I know none so liable to such a charge as myself, who yet am ready to give an account to any brother that is offended; and I believe that they ought to rebuke me personally and hear my answer, before they withdraw from me or censure me, much more so [regarding] many others for my sake.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+know+none+so+liable+to+such+a+charge+as+myself%2C+who+yet+am+ready+to+give+an+account+to+any+brother+that+is+offended%3B+and+I+believe+that+they+ought+to+rebuke+me+personally+and+hear+my+answer%2C+before+they+withdraw+from+me+or+censure+me%2C+much+more+so+%5Bregarding%5D+many+others+for+my+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98Objections+Answered%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff149a192bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f149a192bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=I%20know%20none%20so%20liable%20to,regarding%5D%20many%20others%20for%20my%20sake&amp;text=I%20know%20none%20so%20liable%20to%20such%20a&amp;text=more%20so%20%5Bregarding%5D%20many%20others%20for%20my%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-205010c68a" data-kw="">
<blockquote><p>The Order for the election of elders in use at Edinburgh at the Reformation gave the Session the duty of selecting a number of names from which the congregation chose half to be elders. This Order was generally confirmed by the Assembly of 1582. According to the Second Book of Discipline the Session nominates and the people approve. The names of those proposed were always brought before the congregation in order that any objection might be brought forward. [John G.] Lorimer, quoting the Presbyterian Review, 1834, makes a vain attempt to insist that there was real popular election in the seventeenth century… Everybody, however, was satisfied that the people’s rights were amply preserved when the Session elected. In 1642 the Assembly stated the rule that the old Session should elect the new [elders] both in town and country, always of course with the consent of the people [contra patronage]… The same custom was followed in the churches of Strassburg, France and Holland… …On these occasions [in 1654, 1656, 1658, 1669, which were enumerated by Henderson, though not quoted here] the congregation apparently was not present, though the regular edicts with regard to objections had been submitted; but clearly it was more usual to admit elders publicly before the congregation, as for example at Yester in 1683. Nevertheless, at the end of the eighteenth century and beginning of the nineteenth elders at Oldmachar were regularly admitted simply at a Session meeting. … But the idea of popular election really came in with the Secessions [1733 ff.]. Currie, of Kinglassie, a Church of Scotland minister, had attempted something approaching popular election before 1740. In 1761 Aberdeen Associate Church minutes that ‘this congregation knows that the right of election belongs to such as are in full communion with us.’ In the Church of Scotland some of the Evangelicals favored popular election, and Lorimer devotes a chapter [ch. 10] in his Eldership of the Church of Scotland to advocating the method. It had been definitely rejected by Assembly a few years previously, but in 1842 it was carried, and it became the rule in the Free Church. At Urquhart Free Church in 1845 elders were elected at a meeting of male communicants and male heads of families…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-d-henderson.html">G.D. Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 216-25 of ch. 6, ‘Controversy’ in The Scottish Ruling Elder (1935)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

</figure><figure class="quote" id="q-a57c628b10" data-kw="">
<blockquote><p>After he [Cartwright’s opponent] says that ‘those words cannot be extended unto all the precepts,’ first because, ‘the office of widows should be then necessary:’ But he does not consider that St. Paul ordains them not simply, but upon condition. If he [Paul] had instituted the eldership with condition, if he had ordained that office [of elder] rather for the maintenance of the persons themselves than for the service of the church, if he had left so small choice of those to this office, as to that, namely that none might be chosen but poor, none but destitute of all friends, none under the age of sixty years: then he [the opponent] had said somewhat. And even now the perpetuity of that commandment touching widows remains in that sort [as] it was given: that is upon condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (1577), ‘That the Church Government by an Eldership in Every Congregation is by the Ordinance of God &amp; Perpetual’, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

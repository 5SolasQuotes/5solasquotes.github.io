<main class="wrap"><figure class="quote" id="q-22f84dec8a" data-kw="">
<blockquote><p>Others rely upon a mixed kind of righteousness: they will freely own, that their duties and performances will never exalt them into favour and acceptance with God; but, O, say they, it is Christ and our duties, Christ and our prayers, He and our tears and repentance, that must do it. But believe it, Sirs, Christ and the idol of self will never cement; these old rotten rags will never piece in with the white and new robe of righteousness of the Son of God: and if you adventure to mingle them together, ‘Christ shall profit you nothing,’ Gal. v. 2, 3, 4. Other’s again, they will pretend to renounce all their works and duties, and own, with their own mouth, yet still their hearts cleave fast unto a covenant of works; they were never through the law, dead to the law; and when nothing else will do, they will make their own act of believing the righteousness on which they lean for acceptance, which is still a seeking righteousness in themselves: whereas, if ever we be justified before God, we must have it in the Lord Jesus, saying, ‘In Him will we be justified and in Him alone will we glory.’ Faith carries the soul quite out of itself; yea, faith renounces its own act in the point of justification. All these, and many other rooms and lying refuges, hath the devil and our own hearts devised, to lead us off from Christ. But, O Sirs, believe it, these are but imaginary sanctuaries , and the hail will sweep them away. Nothing but the doing and dying of the Surety, apprehended by faith, will ever exalt you unto favour and fellowship with God, or acquit you from the curse and condemnation of the broken law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Late Rev. Ebenezer Erskine</cite>, 1:105–06 (Sermon on Psalm 89:16).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7742e8c36a" data-kw="">

</figure><figure class="quote" id="q-24e9ebff42" data-kw="">
<blockquote><p>1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>Fiftly, that man is iustified by faith only, that is, for the onely satisfaction of Christ apprehended by faith: and not partly by faith, that is, for Christs satisfaction imputed; and partly by works, that is, for inherent iustice: may be gathered by the sayings following, which teach that a man is iustified without workes.</p></blockquote>

</figure><figure class="quote" id="q-26c617e229" data-kw="">
<blockquote><p>VII. He calls both [kinds of people] in earnest [serio] and without any deceit. Concerning the elect there is no doubt. As to the reprobate, although they are not called ‘according to his purpose,’ or to salvation, nevertheless they are called in earnest, and salvation is offered them on condition of faith. Nor are they mocked because they have been deprived of the grace of believing. Rather, because they destroyed the original grace of their own accord, and also, by their evil passion, despised the means of grace, God therefore has the right to demand faith from them and uses it no less justly than do other creditors, so that their mouths are closed, they are without excuse, and the justice of God is upheld. Therefore, He does not call them to mock them, but in order to declare and reveal his justice. VIII. Therefore, common calling is not the basis for any conclusion regarding election, both because common calling is extended to both the reprobate and the elect, and because it is subject to the condition of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in</cite>, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 20, sect. 7–8, pp. 116-17 Latin: conditione</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“VII. He calls both [kinds of people] in earnest [serio] and without any deceit. Concerning the elect there is no doubt. As to the reprobate, although they are not called ‘according to his purpose,’ or to salvation, nevertheless they are called in earnest, and salvation is offered them on condition of faith. Nor are they mocked because they have been deprived of the grace of believing. Rather, because they destroyed the original grace of their own accord, and also, by their evil passion, despised the means of grace, God therefore has the right to demand faith from them and uses it no less justly than do other creditors, so that their mouths are closed, they are without excuse, and the justice of God is upheld. Therefore, He does not call them to mock them, but in order to declare and reveal his justice. VIII. Therefore, common calling is not the basis for any conclusion regarding election, both because common calling is extended to both the reprobate and the elect, and because it is subject to the condition of faith.”

<blockquote><p>That believers must repent for their being discouraged by their sins. Their being discouraged by their sins will cost them many a prayer, many a tear, and many a groan; and that because their discouragements under sin flow from ignorance and unbelief. It springs from their ignorance of the richness, freeness, fulness, and everlastingness of God’s love; and from their ignorance of the power, glory, sufficiency, and efficacy of the death and sufferings of the Lord Jesus Christ; and from their ignorance of the worth, glory, fulness, largeness, and completeness of the righteousness of Jesus Christ; and from their ignorance of that real, close, spiritual, glorious, and inseparable union that is between Christ and their precious souls. Ah! did precious souls know and believe the truth of these things as they should, they would not sit down dejected and overwhelmed under the sense and operation of sin, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices</cite>, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 94.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-42b48b0927" data-kw="">
<blockquote><p>It may be demanded, Had it not been sufficient for our good, and to the end he might redeem us, if he had only lived well and holily, and not also so to have suffered death for us? I answer, it had not sufficed: for all his most holy &amp; righteous works had not satisfied the justice and wrath of God for our sins, nor merited the mercy of God, reconciliation, righteousness &amp; life eternal for us: the reason is, for that the justice of God did require, for our breach of God’s covenant, that we should be punished with death eternal, according to the condition denounced and annexed to the promise of that covenant.

Therefore no good works of our own, or of any Mediator for us, after the breach of that covenant of works, could have satisfied the justice of God, which of necessity after a sort required the punishment and death of the offender, or certainly of some mediator in his steed. If then all the good &amp; holy works of the Mediator could not satisfy that wrath and justice of God for sin, it is clear they could not merit any new grace or mercy of God for us.

But you will say, that the good and holy works of Christ our Mediator have wrought some part at least of that satisfaction, whereby God’s justice was appeased for us: and some part of that merit whereby God’s favour was purchased for us? I answer, these works did serve properly for no part of satisfaction or merit for us: for that to speak properly, the death of Christ and his passion only did satisfy God’s justice, and merited his mercy for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), p. 29.</span></figcaption>

</figure><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</span></figcaption>

</figure><figure class="quote" id="q-db1c19f040" data-kw="">
<blockquote><p>A clear apprehension of this truth, that Jesus Christ is a King—Founder and Head of the Kingdom of Heaven upon earth, is fundamental to any proper understanding, either of the spirit and language of the Scriptures, or of the nature and relations of the Christian life. Through the whole revealed scheme of Redemption, this truth runs parallel with the truth of the Priesthood of Christ.

Nay, it is rather the essential form of that truth, and therefore the essential form of the Gospel itself. For “Christ crucified,” according to the apostle, is not merely a doctrine contained in the Gospel; it is the Gospel itself; the one idea of all the revelation which God has made of himself. As in the physical structure of man, the blood, driven by the heart to every extremity of his system, imparts to every atom the vitality without which it would be only so much dead clay: so in the structure of God’s revealed truth.

The Cross of Jesus is the grand heart of the system, and the atoning blood flowing from the cross is that which imparts to every syllable its divine life as the truth of God. Every other idea in the book has its life from this idea; without this the other truths of Scripture may be fashioned, as men who love not the doctrine of atonement have fashioned them, into a beautiful system of Ethical Theology. But when their highest skill has been exhausted upon the work, it is no living gospel.

It stands forth merely as the marble smitten by the wand of the genius of sculpture, beautiful indeed in form and structure, but a cold and lifeless thing—powerless to extend an arm to save, or speak a word of compassion to the fallen soul. So, on the other hand, conversely—as the life-bearing blood in the physical system must needs have, as one of its conditions, the bodily structure and form—at once a condition and a result of the outworking of the life that is in it; in like manner, in the system of Redemption, the doctrine of atonement by blood must ever develop its life-giving power in the formation of a body of Christ—his Church—the Kingdom of Heaven.

With this general view corresponds the successive developments of the story of Redemption. It is ever the story of an atoning Redeemer, embodied in the story of a King of Glory. The very first shadowy glimpse of Messiah at the opening of Genesis, as the seed of the woman, in the prophetic promise to the two trembling sinners in Eden, is of a wounded but victorious king, crushing the head of the mighty arch-enemy of humanity. In the amazing history of the actual fulfilment of the prophecy, even as we behold him hanging on the cross; there, over his head is still the inscription, “This is the King of the Jews.” In the last glimpse we catch of him through the door which John’s prophecy opens in heaven, He is still “the King of kings, and Lord of lords;” “the Lamb in the midst of the throne,” reigning in triumph over the myriads of his redeemed.

And so in every stage of the revelation of God’s purposes of mercy to the race. In the theology of Paul, the central truth is Christ risen and reigning, “till he hath put all enemies under his feet.” The story of the evangelist is of him concerning whom the wise men and Herod inquired, “Where is he that is born King of the Jews?” at his birth; and concerning whom Pilate inquired, “Art thou a King, then?” on the day of his death. Going back to the revelations of Him through the prophets, He appears in every vision that was vouchsafed to encourage the faith of the saints, as at once the atoning Limb that shall be led to the slaughter, but also as the Lion of the tribe of Judah. As the wailing sufferer “stricken of God,” but also as the Holy King in Zion, who “shall divide the spoil with the strong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855</cite>, (New York: Edward O. Jenkins, 1855), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

Nay, it is rather the essential form of that truth, and therefore the essential form of the Gospel itself. For “Christ crucified,” according to the apostle, is not merely a doctrine contained in the Gospel; it is the Gospel itself; the one idea of all the revelation which God has made of himself. As in the physical structure of man, the blood, driven by the heart to every extremity of his system, imparts to every atom the vitality without which it would be only so much dead clay: so in the structure of God’s revealed truth.

The Cross of Jesus is the grand heart of the system, and the atoning blood flowing from the cross is that which imparts to every syllable its divine life as the truth of God. Every other idea in the book has its life from this idea; without this the other truths of Scripture may be fashioned, as men who love not the doctrine of atonement have fashioned them, into a beautiful system of Ethical Theology. But when their highest skill has been exhausted upon the work, it is no living gospel.

It stands forth merely as the marble smitten by the wand of the genius of sculpture, beautiful indeed in form and structure, but a cold and lifeless thing—powerless to extend an arm to save, or speak a word of compassion to the fallen soul. So, on the other hand, conversely—as the life-bearing blood in the physical system must needs have, as one of its conditions, the bodily structure and form—at once a condition and a result of the outworking of the life that is in it; in like manner, in the system of Redemption, the doctrine of atonement by blood must ever develop its life-giving power in the formation of a body of Christ—his Church—the Kingdom of Heaven.

With this general view corresponds the successive developments of the story of Redemption. It is ever the story of an atoning Redeemer, embodied in the story of a King of Glory. The very first shadowy glimpse of Messiah at the opening of Genesis, as the seed of the woman, in the prophetic promise to the two trembling sinners in Eden, is of a wounded but victorious king, crushing the head of the mighty arch-enemy of humanity. In the amazing history of the actual fulfilment of the prophecy, even as we behold him hanging on the cross; there, over his head is still the inscription, “This is the King of the Jews.” In the last glimpse we catch of him through the door which John’s prophecy opens in heaven, He is still “the King of kings, and Lord of lords;” “the Lamb in the midst of the throne,” reigning in triumph over the myriads of his redeemed.

And so in every stage of the revelation of God’s purposes of mercy to the race. In the theology of Paul, the central truth is Christ risen and reigning, “till he hath put all enemies under his feet.” The story of the evangelist is of him concerning whom the wise men and Herod inquired, “Where is he that is born King of the Jews?” at his birth; and concerning whom Pilate inquired, “Art thou a King, then?” on the day of his death. Going back to the revelations of Him through the prophets, He appears in every vision that was vouchsafed to encourage the faith of the saints, as at once the atoning Limb that shall be led to the slaughter, but also as the Lion of the tribe of Judah. As the wailing sufferer “stricken of God,” but also as the Holy King in Zion, who “shall divide the spoil with the strong.”

— Stuart Robinson, Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855, (New York: Edward O. Jenkins, 1855), pp 4-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+clear+apprehension+of+this+truth%2C+that+Jesus+Christ+is+a+King%E2%80%94Founder+and+Head+of+the+Kingdom+of+Heaven+upon+earth%2C+is+fundamental+to+any+proper+understanding%2C+either+of+the+spirit+and+language+of+the+Scriptures%2C+or+of+the+nature+and+relations+of+the+Christian+life.+Through+the+whole+revealed+scheme+of+Redemption%2C+this+truth+runs+parallel+with+the+truth+of+the+Priesthood+of+Christ.%0A%0ANay%2C+it+is+rather+the+essential+form+of+that+truth%2C+and+therefore+the+essential+form+of+the+Gospel+itself.+For+%E2%80%9CChrist+crucified%2C%E2%80%9D+according+to+the+apostle%2C+is+not+merely+a+doctrine+contained+in+the+Gospel%3B+it+is+the+Gospel+itself%3B+the+one+idea+of+all+the+revelation+which+God+has+made+of+himself.+As+in+the+physical+structure+of+man%2C+the+blood%2C+driven+by+the+heart+to+every+extremity+of+his+system%2C+imparts+to+every+atom+the+vitality+without+which+it+would+be+only+so+much+dead+clay%3A+so+in+the+structure+of+God%E2%80%99s+revealed+truth.%0A%0AThe+Cross+of+Jesus+is+the+grand+heart+of+the+system%2C+and+the+atoning+blood+flowing+from+the+cross+is+that+which+imparts+to+every+syllable+its+divine+life+as+the+truth+of+God.+Every+other+idea+in+the+book+has+its+life+from+this+idea%3B+without+this+the+other+truths+of+Scripture+may+be+fashioned%2C+as+men+who+love+not+the+doctrine+of+atonement+have+fashioned+them%2C+into+a+beautiful+system+of+Ethical+Theology.+But+when+their+highest+skill+has+been+exhausted+upon+the+work%2C+it+is+no+living+gospel.%0A%0AIt+stands+forth+merely+as+the+marble+smitten+by+the+wand+of+the+genius+of+sculpture%2C+beautiful+indeed+in+form+and+structure%2C+but+a+cold+and+lifeless+thing%E2%80%94powerless+to+extend+an+arm+to+save%2C+or+speak+a+word+of+compassion+to+the+fallen+soul.+So%2C+on+the+other+hand%2C+conversely%E2%80%94as+the+life-bearing+blood+in+the+physical+system+must+needs+have%2C+as+one+of+its+conditions%2C+the+bodily+structure+and+form%E2%80%94at+once+a+condition+and+a+result+of+the+outworking+of+the+life+that+is+in+it%3B+in+like+manner%2C+in+the+system+of+Redemption%2C+the+doctrine+of+atonement+by+blood+must+ever+develop+its+life-giving+power+in+the+formation+of+a+body+of+Christ%E2%80%94his+Church%E2%80%94the+Kingdom+of+Heaven.%0A%0AWith+this+general+view+corresponds+the+successive+developments+of+the+story+of+Redemption.+It+is+ever+the+story+of+an+atoning+Redeemer%2C+embodied+in+the+story+of+a+King+of+Glory.+The+very+first+shadowy+glimpse+of+Messiah+at+the+opening+of+Genesis%2C+as+the+seed+of+the+woman%2C+in+the+prophetic+promise+to+the+two+trembling+sinners+in+Eden%2C+is+of+a+wounded+but+victorious+king%2C+crushing+the+head+of+the+mighty+arch-enemy+of+humanity.+In+the+amazing+history+of+the+actual+fulfilment+of+the+prophecy%2C+even+as+we+behold+him+hanging+on+the+cross%3B+there%2C+over+his+head+is+still+the+inscription%2C+%E2%80%9CThis+is+the+King+of+the+Jews.%E2%80%9D+In+the+last+glimpse+we+catch+of+him+through+the+door+which+John%E2%80%99s+prophecy+opens+in+heaven%2C+He+is+still+%E2%80%9Cthe+King+of+kings%2C+and+Lord+of+lords%3B%E2%80%9D+%E2%80%9Cthe+Lamb+in+the+midst+of+the+throne%2C%E2%80%9D+reigning+in+triumph+over+the+myriads+of+his+redeemed.%0A%0AAnd+so+in+every+stage+of+the+revelation+of+God%E2%80%99s+purposes+of+mercy+to+the+race.+In+the+theology+of+Paul%2C+the+central+truth+is+Christ+risen+and+reigning%2C+%E2%80%9Ctill+he+hath+put+all+enemies+under+his+feet.%E2%80%9D+The+story+of+the+evangelist+is+of+him+concerning+whom+the+wise+men+and+Herod+inquired%2C+%E2%80%9CWhere+is+he+that+is+born+King+of+the+Jews%3F%E2%80%9D+at+his+birth%3B+and+concerning+whom+Pilate+inquired%2C+%E2%80%9CArt+thou+a+King%2C+then%3F%E2%80%9D+on+the+day+of+his+death.+Going+back+to+the+revelations+of+Him+through+the+prophets%2C+He+appears+in+every+vision+that+was+vouchsafed+to+encourage+the+faith+of+the+saints%2C+as+at+once+the+atoning+Limb+that+shall+be+led+to+the+slaughter%2C+but+also+as+the+Lion+of+the+tribe+of+Judah.+As+the+wailing+sufferer+%E2%80%9Cstricken+of+God%2C%E2%80%9D+but+also+as+the+Holy+King+in+Zion%2C+who+%E2%80%9Cshall+divide+the+spoil+with+the+strong.%E2%80%9D%0A%0A%E2%80%94+Stuart+Robinson%2C+Christ%E2%80%99s+Kingdom+on+Earth%3A+A+Self-Expanding+Missionary+Society.+A+Discourse+for+the+Presbyterian+Board+of+Foreign+Missions%3B+Preached+in+the+First+Presbyterian+Church%2C+N.Y.%2C+May+6%2C+1855%2C+%28New+York%3A+Edward+O.+Jenkins%2C+1855%29%2C+pp+4-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb1c19f040.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db1c19f040.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/27/stuart-robinson-on-the-kingship-and-priesthood-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-70bcde1ce0" data-kw="">
<blockquote><p>True, this high and holy conception of a university was soon falsified. Young men whose object was not the study itself nevertheless coveted the privileges attached to the order of the learned and began to penetrate our sacred garden like veritable parasites. And then the sense of constituting a separate order bred stupid and foolish self-exaltation that stamped everyone whose name simply appeared on the registrar’s rolls as a scholar, while everyone who did not belong to the elect, to the “men of the gown,” was booed and reviled as a philistine or a “man of the town.”

Especially when the order of scholars still had external privileges and could with impunity defy the “constables” during nightly raids on shop signs and doorbells, and when a student paid no import duty on his wine, then privilege, as everywhere else, here too worked its evil effect. Not studying but creating a nuisance in public and carousing and drinking their fellows under the table became the base occupation in which students sought their honour. And of course, from their student days this false pride accompanied them into life. Because they had once attended university they thought they could forever look down with contempt on all those who had never gone to university. The holy laurels of learning fell into the mire, and the renegades’ faces were wreathed in the vines of wild creepers.

This behaviour came home to roost, and the outcome was that the sphere of scholarship lost its native impulse, tore up its charter, and put itself in the service of the State, so that Scolastica dissolved into Politica. Worse, a desire to break down the faith instead of shoring it up became for many the principal motive for doing scholarship. At last the evil, narrow-minded selfishness arrived that sees no higher purpose in the academy than to assist its visitors as quickly as possible in preparing them for what is called a “position.” The first stage caused the academy to forfeit its freedom, the second set it in opposition to God, and the third lowered it to the level of studying to pass the exams.

And who knows, maybe they have also sneaked into our own university already—those young men who supposedly are devoting themselves to academic studies but who have only one goal in mind: once and for all, and as quickly and cheaply as possible, to be done with bookish learning. They are parasites who come in order to pursue “success” but whose parched lips have never tasted one sip from the holy grail of scholarship. They are not looking for silver and do not search for hidden gold in the mine of scholarship: their only goal is to acquire a steady position and a guaranteed salary.</p></blockquote>

<blockquote><p>In Scripture the term bishop signifies exactly the same thing as elder, whether he is only an elder or even a pastor. I will strive to confirm this from several testimonies of sacred Scripture brought forth into our midst. Titus 1:5 says, “For the sake of this matter, remain in Crete, so that you may proceed to set in order what remains there, and establish elders town-by-town.” Then, describing what sort of men they should be, he says, “it is necessary that an elder be blameless,” et cetera. In Acts 20:17ff. Paul is said to have summoned to Miletus Ephesian elders, whom he then addresses in this way: “Attend to yourselves and to the whole flock, for which the Holy Spirit has established you as elders.” Note there in passing that it is not said that they are elders because they preside over the presbytery, but because they preside over their flock.

Philippians 1:1 says, “Paul and Timothy, servants of Jesus Christ to all the saints in Christ Jesus who are at Philippi, together with the elders and deacons.” He calls bishops elders. Indeed, Chrysostom, writing on this passage, says, “What belongs to the matter of whether there were bishops of the same city? It is not,” he says, “but that those who were then elders, the same were bishops.” In 1 Peter 5:2 Peter, compelling elders, says, “Feed the flock which is in your possession, elders [ἐπισκοποῦντες].” Finally, in this passage Paul, recounting all the orders of the ministers of the Word, says nothing about bishops as different from pastors. And Ambrose observed that when he wrote on this passage. He says, “the writings of the apostle do not agree in all ways with the ordering of the church which exists now.”

What is more, no Scripture speaks or means otherwise about bishops. And daily experience teaches that this kind of men, who are ambitious and enslaved to their stomach, make shipwreck of their conscience. The antichrist introduced the origin from this foundation and human invention, as it were, which God never blessed in His Word. They appoint the bishop as overseer over the presbytery for the sake of removing schism. But is it the case that I may say nothing from contrary experience, which Gregory of Nazianzus says to this response in Oratio in Maxim? He says, “Would that there may be no prerogative of a throne! But now this right side and left and middle, superior and inferior seats and that imported custom of going before or of coming over the same rank have broken us into many parts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 2901-2919.</span></figcaption>

</figure><figure class="quote" id="q-d7dc85d686" data-kw="">
<blockquote><p>In case the queen should invite me to any ecclesiastical office, such, I mean, as the government of a church, can I accept such appointment with a safe conscience, seeing that these things appear to me a sufficient excuse for non-compliance? 1. Because, through the want of church discipline, the bishop, or pastor, is unable properly to discharge his office.

2. Because there are so many civil burdens imposed upon the bishop, or pastor; those, for instance, of first fruits, as we call them, that is to say, the receipts of the first year, besides tenths; in addition to which, at least in the case of bishops, so much expense must always be incurred for their equipages, retainers, and attendance at court: so that, as you well know, a very small portion of their revenue is left for the discharge of the necessary duties of a bishop, namely, for the support of learned men, the relief of the poor, and other occasions of making his ministry more acceptable.

3. I am now writing with reference to the bishops more especially; and such is the degeneracy from the primitive institution, as regards their election, (for there is required neither the consent of the clergy, nor of the people;) such too is the vanity, not to say the unseemliness of their superstitious dresses, that I scarcely think it endurable, even if we are to act in all things according to the law of expediency.</p></blockquote>

— Thomas Sampson, Letter to Peter Martyr Vermigli, 17 December [1558] in The Zurich Letters, or The Correspondence of Several English Bishops and others, with some of the Heletian Reformers, during the Reign of Queen Elizabeth. Chiefly from the Archives of Zurich, ed. Hastings Robinson, Works of the Fathers and Early">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+case+the+queen+should+invite+me+to+any+ecclesiastical+office%2C+such%2C+I+mean%2C+as+the+government+of+a+church%2C+can+I+accept+such+appointment+with+a+safe+conscience%2C+seeing+that+these+things+appear+to+me+a+sufficient+excuse+for+non-compliance%3F+1.+Because%2C+through+the+want+of+church+discipline%2C+the+bishop%2C+or+pastor%2C+is+unable+properly+to+discharge+his+office.%0A%0A2.+Because+there+are+so+many+civil+burdens+imposed+upon+the+bishop%2C+or+pastor%3B+those%2C+for+instance%2C+of+first+fruits%2C+as+we+call+them%2C+that+is+to+say%2C+the+receipts+of+the+first+year%2C+besides+tenths%3B+in+addition+to+which%2C+at+least+in+the+case+of+bishops%2C+so+much+expense+must+always+be+incurred+for+their+equipages%2C+retainers%2C+and+attendance+at+court%3A+so+that%2C+as+you+well+know%2C+a+very+small+portion+of+their+revenue+is+left+for+the+discharge+of+the+necessary+duties+of+a+bishop%2C+namely%2C+for+the+support+of+learned+men%2C+the+relief+of+the+poor%2C+and+other+occasions+of+making+his+ministry+more+acceptable.%0A%0A3.+I+am+now+writing+with+reference+to+the+bishops+more+especially%3B+and+such+is+the+degeneracy+from+the+primitive+institution%2C+as+regards+their+election%2C+%28for+there+is+required+neither+the+consent+of+the+clergy%2C+nor+of+the+people%3B%29+such+too+is+the+vanity%2C+not+to+say+the+unseemliness+of+their+superstitious+dresses%2C+that+I+scarcely+think+it+endurable%2C+even+if+we+are+to+act+in+all+things+according+to+the+law+of+expediency.%E2%80%9D%0A%0A%E2%80%94+Thomas+Sampson%2C+Letter+to+Peter+Martyr+Vermigli%2C+17+December+%5B1558%5D+in+The+Zurich+Letters%2C+or+The+Correspondence+of+Several+English+Bishops+and+others%2C+with+some+of+the+Heletian+Reformers%2C+during+the+Reign+of+Queen+Elizabeth.+Chiefly+from+the+Archives+of+Zurich%2C+ed.+Hastings+Robinson%2C+Works+of+the+Fathers+and+Early&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd7dc85d686.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d7dc85d686.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/11/04/thomas-sampson-on-irregularities-in-the-government-of-the-english-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Calvin says, ‘The thing before judged was cleared to the people.’ Peter Martyr, [David] Pareus and others say well, ‘Excommunication would not be done nisi plebe consentiente,’ without the consent of the people, which includes women and servants over whose consciences, faith and practice rulers are not to domineer more than over the consciences of men. Cyprian by the plebs and universa fraternitas, the people and fraternity, understands the whole redeemed flock, men and women.</p></blockquote>

</figure><figure class="quote" id="q-e119cee609" data-kw="">
<blockquote><p>Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for ‘quod competit alicui qua tali competit omni tali.’ That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and settled ecclesiastical republic.</p></blockquote>

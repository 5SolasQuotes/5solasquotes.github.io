<main class="wrap"><figure class="quote" id="q-faf0320ed5" data-kw="">
<blockquote><p>Q. So much of the breaches of this Commandment against the body alone: what are they that are against the soul?

A. When Ministers are either Idol Shepherds, and cannot; or idle, and will not feed the flock committed to their charge: or for the most part neglect their own, and busy themselves elsewhere, without any necessary and lawful calling. Secondly, when Magistrates, that procure not as much as in them lieth, that the people under their government, do frequent the hearing of the Word read and preached, and receiving of the Sacraments, in the appointed times.

Q. Are inferiors also guilty of this sin?

A. Yea verily: all those people that have no knowledge, especially having had the ordinary means appointed of God for obtaining the same, either of their own, or of others, which they might have been the partakers of.

Q. How do both Superiors and Inferiors kill the soul?

A. By evil example of life: contrary whereunto is, to provoke one another to love, to give no offence, neither to Jews nor Gentiles, nor to the Church of God. Also in not rebuking our neighbour when he is in fault, but suffering him to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 137-38.</span></figcaption>

<blockquote><p>The Justice of Superiors is, whereby they endeavour that every inferior have his due.

This is performed by the Magistrate, in keeping both Tables of the Law; and in promoting and defending the true Religion, as we shewed in the former Book, in the doctrine of the true Church: they practice the same justice, in making laws, punishing offenders, rewarding the keepers of it, and in defending their Subjects against unjust force.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b3b10d3a32" data-kw="">
<blockquote><p>…the most part of men have some form in worshipping God and please themselves in it so well that they think God well-pleased with it; but few there are who know indeed what it is to worship Him in a manner acceptable to his majesty: Now you know it is all one not to worship Him at all, as not to worship Him in that way He likes to be worshipped: Therefore the most part of men are but self-worshippers, because they please none but themselves in it, it is not the worship his soul has chosen, but their own invention, for you must take this as an undeniable ground, that God must be worshipped according to his own will and pleasure, and not according to your humor, or invention; therefore his soul abhors will-worship, devised by men out of ignorant zeal, or superstition, though there might seem much devotion in it, and much affection to God, as in the Israelites sacrificing their children, what more seeming self-denial? And yet what more real self-idolatry; God owns not such a service, for it is not service and obedience to his will and pleasure, but to men’s own will and humor: therefore a man must not look for a reward but from Himself. Now it is not only will-worship when the matter and substance of the worship is not commanded of God, but also when a commanded worship is not discharged in the appointed manner: Therefore, O how few true worshippers will the Father find? True worship must have truth for the substance and spirit for the manner of it: else it is not such a worship as the Father seeks and will be pleased with; divine worship must have truth in it, that is plain, but what was that truth, it must be conformed to the rule and pattern of worship, which is God’s will and pleasure revealed in the word of truth, true worship is the very practice of the word of truth, it caries the image and superscription and command upon it, which is a necessary ingredient in it, and constituent of it. Therefore if thy service have the image of thy own will stamped on it, it is not divine worship, but will-worship. Thus all human ceremonies and ordinances enjoined for service of God, carry the inscription not of God, but of man who is the author and original of them, and so are but adulterated and false coin, that will not pass current with God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion</cite>, … ([Glasgow] 1666 / 1667), on Jn. 4:24, 2nd Sermon, pp. 131-32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3750c533ad" data-kw="">
<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-10f17955b5" data-kw="">
<blockquote><p>So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Augustine observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 7, sermon 57</span></figcaption>

</figure><figure class="quote" id="q-3986618db6" data-kw="">
<blockquote><p>Of the multitude that say they are of the catholic Church, it is rare to meet with men of a catholic spirit. Men have not a universal consideration of, and respect to, the whole Church, but look upon their own party as if it were the whole…. If it be the smallest parcel that possesses not many nations, no, nor cities on earth, they are ready to carry it, as if they were the whole Church, and as if it went well with the Church when it goes well with them.</p></blockquote>

<blockquote><p>The means for the maintenance of the poor are collected, by the deacons, the first day of the week, and other days of the public assembling of the people to the worship of God, at the entry of the Church. And if this prove not a competency, then do the people either bring in their charity on such days as are appointed by the eldership, or are willing to be taxed, according as they shall be judged to be able. In some cities, and parishes where this order has been carefully observed, none have been suffered to beg, and none have lacked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Alexander Henderson, The Government and Order of the Church of Scotland</cite>, (1641), pp. 31-32</span></figcaption>

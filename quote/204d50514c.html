<blockquote><p>In Francis Turretin’s day, there were some who appealed to the alleged discrepancies in Matthew 27:9 and Mark 1:2 in an attempt to demonstrate that scripture contradicted itself. Turretin was unmoved by their sophistries and provided a perfectly rational explanation as to why Matthew referred to Jeremiah and why Mark referred to Isaiah:

The prophecy concerning the thirty pieces of silver and the field bought with them is cited from Jeremiah (Mt. 27:9), which is certainly found in Zech. 11:12. From this some attribute universal falsehood and slips of the memory (sphalma mnēmonikon) to Matthew. But the difficulty can be cleared up in various ways. Some are of the opinion that the name Jeremiah (leremiou) has crept into the text from the ignorance of transcribers (since zou may have been written as an abbreviation of Zachariou), but that the error is one of small importance (viz., occurring in a proper name the correction of which is easily made from a comparison of the Old and New Testaments). Others (with better reason) maintain that there is here a blending (synchysin) of two prophetical passages from which this testimony is drawn, viz., from Jer. 32 and Zech. 11. Cases similar to this occur in: Mt. 21:5 from Is. 62:11 and Zech. 9:9; Mt. 21:13 from Is. 56:7 and Jer. 7:11; Acts 1:20 from Pss. 69:25 and 109:8; 1 Pet. 2:7, 8 from Ps. 118:22 and Is. 8:14.

Nor is it an unusual thing (when the words or testimonies belong to two persons) to omit one and give only the name of the other (as Mk. 1:2, 3 where the first part is taken from Malachi, the latter from Isaiah, and yet Malachi is omitted and Isaiah alone mentioned). And this can be done with greater propriety when the one who is cited is either more ancient than the other, and the later has drawn many things from him (as is the case here). For Jeremiah was before Zechariah, and Zechariah borrowed many things from him and imitated (as it were) his addresses (as might easily be shown from Zech. 1:14 which is taken from Jer. 18:11 and 35:15; and Zech. 3:8 from Jer. 23:5). Hence the Jews were in the habit of saying, “the spirit of Jeremiah is in Zechariah.”

To this it can be added that from the tradition of the Rabbis in the Babylonion Talmud (Baba Bathra, 14, cf. BT 1:70) which Rabbi David Kimchi quotes in his preface to the prophet Jeremiah, Jeremiah stands at the head of the prophets and is therefore named first (Mt. 16:14). Therefore Matthew (citing these words contained in the book of the prophets) could quote them only under his name because he held the first place there. So in Lk. 24:44, the book of holy writings (Hagiographorum) is mentioned under the name of the Psalms because this is the first of them. Finally, Jeremiah alone might be mentioned here by Matthew because he wished to give an account, not so much of the thirty pieces of silver or of the price for which Christ was bought (about which Zechariah treats), as of the price of the bought field (about which Jeremiah treats). Therefore what is said here of the price is drawn from Zechariah, and what is said of the field from Jeremiah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian and Reformed, 1992), 2.5.28.</span></figcaption>

<blockquote><p>For it is written in the law of Moses, ‘Thou shalt not muzzle the mouth of the ox that treadeth out the corn.’ Doth God take care for oxen?… Do ye not know that they which minister about holy things live of the things of the temple? and they which wait at the altar are partakers with the altar? Even so hath the Lord ordained that they which preach the gospel should live of the gospel.</p></blockquote>

<blockquote><p>We had so contrived it with my Lord Wharton, that the Lords that day did petition the Assembly, that they might have one of the Divines to attend their House for a week, as it came about to pray to God with them. Some days thereafter the Lower House petitioned for the same. Both their desires were gladly granted: for by this means the relics of the service-book, which till then was every day used in both Houses, are at last banished. Paul’s and Westminster are purged of their images, organs, and all which gave offense. My Lord Manchester made two fair bonfires of such trinkets at Cambridge….</p></blockquote>

<blockquote><p>Thus we see how the Lord granteth us six days for our bodies, and the seventh day for our souls: not that we must think, that other days are to be separated from this use, but that this day must be wholly severed from other for that use. For, if it were possible, or could be convenient, either in respect of our calling, or the places where we dwell, twice to meet every week day, as it is yet used in some places, though more of custom and fashion, then in faith and of conscience in most of those places, it were nothing but equal. For look what proportion is from six days to the seventh, the same may be gathered from nine, or rather twelve hours to the tenth: whereby the tithe at the least may be afforded for the Lord.

And herein is the only difference between the six days and the seventh, that the worship of God must in the six days be used at such seasons, as in wisdom are so separated and divided to that end, without any hindrance of our lawful and necessary callings, as it doth not take up the principal, but shreds and overplus of our vocation: but on the seventh day we must make such a separation from other days, that what we did but in part, in the week, or working days, we may do in whole on the seventh and Sabbath day.

True it is, that this equity of twice meeting every day, is more convenient for Cities and populous towns, where many dwell together, than in other places and situations, which for distance of place have not the congregation so dwelling together. Here our common distinction of calling the week days working days, and the Sabbath days holy days, taketh away their frivolous assertion, who think that every day should be our Sabbath day, as though we should confound and shuffle together our working days and resting days.</p></blockquote>

And herein is the only difference between the six days and the seventh, that the worship of God must in the six days be used at such seasons, as in wisdom are so separated and divided to that end, without any hindrance of our lawful and necessary callings, as it doth not take up the principal, but shreds and overplus of our vocation: but on the seventh day we must make such a separation from other days, that what we did but in part, in the week, or working days, we may do in whole on the seventh and Sabbath day.

True it is, that this equity of twice meeting every day, is more convenient for Cities and populous towns, where many dwell together, than in other places and situations, which for distance of place have not the congregation so dwelling together. Here our common distinction of calling the week days working days, and the Sabbath days holy days, taketh away their frivolous assertion, who think that every day should be our Sabbath day, as though we should confound and shuffle together our working days and resting days.”

— Richard Greenham, A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+we+see+how+the+Lord+granteth+us+six+days+for+our+bodies%2C+and+the+seventh+day+for+our+souls%3A+not+that+we+must+think%2C+that+other+days+are+to+be+separated+from+this+use%2C+but+that+this+day+must+be+wholly+severed+from+other+for+that+use.+For%2C+if+it+were+possible%2C+or+could+be+convenient%2C+either+in+respect+of+our+calling%2C+or+the+places+where+we+dwell%2C+twice+to+meet+every+week+day%2C+as+it+is+yet+used+in+some+places%2C+though+more+of+custom+and+fashion%2C+then+in+faith+and+of+conscience+in+most+of+those+places%2C+it+were+nothing+but+equal.+For+look+what+proportion+is+from+six+days+to+the+seventh%2C+the+same+may+be+gathered+from+nine%2C+or+rather+twelve+hours+to+the+tenth%3A+whereby+the+tithe+at+the+least+may+be+afforded+for+the+Lord.%0A%0AAnd+herein+is+the+only+difference+between+the+six+days+and+the+seventh%2C+that+the+worship+of+God+must+in+the+six+days+be+used+at+such+seasons%2C+as+in+wisdom+are+so+separated+and+divided+to+that+end%2C+without+any+hindrance+of+our+lawful+and+necessary+callings%2C+as+it+doth+not+take+up+the+principal%2C+but+shreds+and+overplus+of+our+vocation%3A+but+on+the+seventh+day+we+must+make+such+a+separation+from+other+days%2C+that+what+we+did+but+in+part%2C+in+the+week%2C+or+working+days%2C+we+may+do+in+whole+on+the+seventh+and+Sabbath+day.%0A%0ATrue+it+is%2C+that+this+equity+of+twice+meeting+every+day%2C+is+more+convenient+for+Cities+and+populous+towns%2C+where+many+dwell+together%2C+than+in+other+places+and+situations%2C+which+for+distance+of+place+have+not+the+congregation+so+dwelling+together.+Here+our+common+distinction+of+calling+the+week+days+working+days%2C+and+the+Sabbath+days+holy+days%2C+taketh+away+their+frivolous+assertion%2C+who+think+that+every+day+should+be+our+Sabbath+day%2C+as+though+we+should+confound+and+shuffle+together+our+working+days+and+resting+days.%E2%80%9D%0A%0A%E2%80%94+Richard+Greenham%2C+A+Treatise+of+the+Sabbath+in+The+Works+of+Richard+Greenham+%E2%80%93+Volume+Two&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae8aafe112.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae8aafe112.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/07/07/richard-greenham-on-the-sabbath-being-wholly-set-apart-for-our-souls/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Application 1: This may first let us see that notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field. Rome has long doted on Peter’s Chair, and Jerusalem might as well have bragged of her privileges as any other place, but Christ leaves them: Never rest we then in any outward estate, for Christ may leave us. The Palatinate [Germany] has been as reformed as any Church for doctrine, and though they might say, their bed was green, and their beams were of cedar, and their rafters of fir, yet God has left them: for do we think that if God had been there, these things had befallen them that now are.</p></blockquote>

<blockquote><p>If the Law was given by angels, and the Angel of God was in the burning bush, and the Angel conducted the people through the wilderness, and yet all these things are ascribed to God, much more near and glorious will the Divine Regiment there be…</p></blockquote>

</figure><figure class="quote" id="q-4d7f690453" data-kw="">
<blockquote><p>The replier to Dr. Mourton’s Particular Defence, observes (ch. 1, section 3), that this superstition about apparel in divine worship began first among the Frensh bishops, unto whom Caelestinus writes thus. Discernendi, etc. ‘We are to be distinguished from the common people and others by doctrine, not by garment, by conversation, not by habit [one’s dress], by the purity of mind, not by attire: for if we study to innovation, we tread underfoot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not lead the minds of the faithful into such things: for they are rather to be instructed than played withal: neither are we to blind and beguile their eyes, but to infuse instructions into their minds.’ In which words Caelestinus reprehends this apparel, as a novelty which tended to superstition, and made way to the mocking and deceiving of the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-d9cb792a33" data-kw="">
<blockquote><p>Meanwhile, seeing that this brutish stupidity has overspread the globe, men longing after visible forms of God, and so forming deities of wood and stone, silver and gold, or of any other dead and corruptible matter, we must hold it as a first principle, that as often as any form is assigned to God, his glory is corrupted by an impious lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.1</span></figcaption>

</figure><figure class="quote" id="q-20d92c6b49" data-kw="">
<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

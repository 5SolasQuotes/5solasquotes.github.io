<main class="wrap"><figure class="quote" id="q-b0039051eb" data-kw="old new">
<blockquote><p>However, we readily grant that the Old Testament and the Mosaic covenant taken strictly and absolutely as to the legal relation (schesin) differ in entire substance from the New. Hence the law and Moses are opposed to grace and to Christ (Jn. 1:17) and by Paul the letter and the Spirit, the ministration of condemnation and of righteousness (2 Cor. 3:6, 7). So we maintain that taken broadly and with the other evangelical relation (schesei) (clothed, namely, with its pedagogical circumstances), it did not differ as to substance, but only as to manner of dispensation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ce0cb580a" data-kw="new cov">
<blockquote><p>The new covenant is also taken in a twofold manner either broadly, inasmuch as it stands for the covenant of grace in general made with sinners, which existed under the Old Testament as well before Christ appeared as under the New after he had been manifested; or strictly, for the covenant of grace promulgated after the manifestation of Christ in the flesh, which should continue to the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.5</span></figcaption>

</figure><figure class="quote" id="q-05dd0db63e" data-kw="admin">
<blockquote><p>The nature of the things, for since they were still future and prophecies before their fulfillment are wont to be somewhat obscure (at least as to the manner of fulfillment), it is not to be wondered at that at first they were set forth more obscurely and then more clearly, the nearer the time of fulfillment approached. Thus the light increased more and more. There was a progress in revelation: prophet handed on to prophet, and he received the lamp of the gospel by which the church might be illuminated, adding a new measure of light. The same promises are repeated and illustrated. The more the time of fulfillment presses on, the clearer and fuller they become. Before the law given by Moses, the promise was somewhat obscure; from the giving of the law until the times of the prophets less obscure; from the times of the prophets until John the Baptist, clearer; after the preaching of John clear; after the coming of Christ most clear. Thus from the beginning, the Messiah was promised only as the seed of the woman (Gen. 3:15); afterwards as the son of Abraham (Gen. 12:2); to spring from Judah (Gen. 49:10); and in the tribe of Judah from the family of David (2 S. 7:13, 14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.7.V</span></figcaption>

</figure><figure class="quote" id="q-d728e80f6a" data-kw="abraham">
<blockquote><p>The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.7</span></figcaption>

</figure><figure class="quote" id="q-4e78a94b75" data-kw="david">
<blockquote><p>Any “good and joyful tidings” whatsoever are called by the Greeks euangelion and by the Hebrews khshrh tvbhh. Yet that is eminently (kat’ exochēn) ascribed in Scripture to the news (the most pleasing of all) concerning the happy advent of Christ to the world, the covenant of grace made in him and the salvation obtained through him. It is not, however, used always with the same meaning. Sometimes it denotes (broadly and in general) the gratuitous covenant made in Christ. In this sense, Paul speaking of the ancient people, says, “They have not all obeyed the gospel” (Rom. 10:16); and it is said, “The gospel was preached to them that are dead” (1 Pet. 4:6). Sometimes it is put strictly and in particular either for the promise and the doctrine concerning Christ about to come (in which sense, Paul says, “The gospel was preached before unto Abraham when the promises were given to him,” Gal. 3:8); or more properly for the doctrine of Christ manifested and the fulfillment of all the promises (in which sense it is everywhere used in the New Testament for the doctrine of the mission of Christ or the completed gospel and is opposed to the epangelia, which denotes simply the doctrine of the promise of Christ in the Old Testament).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12</span></figcaption>

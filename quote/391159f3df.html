<main class="wrap"><figure class="quote" id="q-391159f3df" data-kw="">
<blockquote><p>Mr. Chafer is in the unfortunate and, one would think, very uncomfortable, condition of having two inconsistent systems of religion struggling together in his mind. He was bred an Evangelical, and, as a minister of the Presbyterian Church, South, stands committed to Evangelicism of the purest water. But he has been long associated in his work with a coterie of “Evangelists” and “Bible Teachers,” among whom there flourishes that curious religious system (at once curiously pretentious and curiously shallow) which the Higher Life leaders of the middle of the last century brought into vogue; and he has not been immune to its infection. These two religious systems are quite incompatible. The one is the product of the Protestant Reformation and knows no determining power in the religious life but the grace of God; the other comes straight from the laboratory of John Wesley, and in all its forms—modifications and mitigations alike—remains incurably Arminian, subjecting all gracious workings of God to human determining. The two can unite as little as fire and water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Review” of He That Is Spiritual</cite>, Princeton Theological Review XVII, no. 1-4 (1919).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6857e8c576" data-kw="">
<blockquote><p>Question: Why did Christ take bread rather than any other element? Answer: …

2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance:

1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’

2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace.

3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy Eucharist</cite>, ... (London, 1668), ‘The Mystery of the Lord’s Supper’, pp. 7-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-c2600adf74" data-kw="">
<blockquote><p>To make an image of God is to blaspheme Him. An infinite nature cannot be represented, but it must be an infinite disparagement to it. It may be asked, May not God be represented by such corporeal forms as sometimes He appeared in? Answer: In the burning bush and in the glory on Mount Sinai, God appeared not as in an image or representation of Himself, but as in symbols of his presence. Whether it were God or angels only that appeared to Abraham and Jacob in human shape, is controvertible; or it might be God the Son as a preludium to his incarnation. Besides, God did not take those human shapes as images or representations of Himself, but as signs of his presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 16, pp. 202-3</span></figcaption>

</figure><figure class="quote" id="q-6ccc9b4c4f" data-kw="">
<blockquote><p>The particle wde, ‘here’, if referred to time, notes during Moses’s economy, while the Levitical law lasted; if it refer to place, it notes Jerusalem in the land of Canaan, where the temple was: in that habitation of the Israelitish church the Levitical priests were not only as to their nature and persons withering and decaying, ceasing to be on earth, though they had the honor to decimate their brethren, but as to their order and office, mortal, they were no better than the tithed and blessed by them, in prospect of death. Aaron himself, the first of the order, died, and so did all his successors, as well as Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, On Mt. 23:23</span></figcaption>

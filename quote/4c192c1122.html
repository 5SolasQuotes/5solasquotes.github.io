<blockquote><p>The matter is excellent, and well deserves a public view… The eminent Mr. Thomas Hog, minister of the Gospel at Kiltearn in Ross, says, he esteemed her much, and for many years had intimate Christian fellowship with her till very near his demise, and still gave her a great character.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9984774744" data-kw="">
<blockquote><p>…even by 1679 there were some twenty or thirty ministers still preaching in the fields, and no significant decline in the number of their hearers. But the year 1679 was to bring a very radical change and to usher in an era of persecution on a scale hitherto unknown. To some extent this situation resulted from the annoyance caused to the government by the activities of Robert Hamilton and his followers, who were by now acting as a kind of sel-appointed armed bodyguard to Cameron in his preaching tours about the country. Hamilton had already been involved, as early as November 1677, in a violent incident at the home of his friend John Balfour of Kinloch, in Fife [a principal actor in the assassination of Archbishop James Sharp in 1679], when a party of soldiers who approached the house were fired upon and one of them was seriously wounded. How far Hamilton himself may have been responsible for incidents of this kind is not altogether clear…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), p. 88</span></figcaption>

</figure><figure class="quote" id="q-a572ba3041" data-kw="">
<blockquote><p>Yet notwithstanding, I allow their constancy which strive for a just cause, being forced against their wills unto contention. I do worthily condemn frowardness which does hinder and stay the holy carefulness of reforming the Church. And as I behave myself gentle and tractable in mean [lowly] things (as external ceremonies), so do I not always judge it profitable to give place to their foolish stoutness which will forsake nothing of their old wonted [accustomed] custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>William Whittingham, A Brief Discourse of the Troubles begun at Frankfurt in Germany</cite>, 1554, about the Book of Common Prayer &amp; Ceremonies, &amp; Continued by the English Men there to the end of Queen Mary’s Reign [1558] (1574), ‘The Answer &amp; Judgement of… John Calvin… touching the [Service] Book of England’, p. XXXV</span></figcaption>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-f45ff72fcc" data-kw="">
<blockquote><p>…[James] Renwick possessed great character, knowledge and spirit. Unfortunately, a faction persistently refused to hear Renwick for a variety of hair-splitting reasons, including Renwick’s ordination [in 1683 in Holland by the reformed Dutch Church] by those who used musical instruments in worship services. Even Reverend [Alexander] Peden initially warned people against Renwick. To compound their worries at home, public sentiment abroad turned against the Society People. Many abroad were concerned with the remnant’s controversial views on several subjects: namely, their refusal to acknowledge the king’s authority, their overly restrictive requirements for fellowship, and their lack of ecclesiastical capability to call and oversee ministers. These concerns made it almost impossible to ordain additional ministers abroad (Shields, Faithful Contendings, pp. 100-101). The following questions posed to attendees to the General Society meetings are illustrative of the extent to which they went to remain free of the defections of the day: (1) Do ye know the principles and practices of these societies from whom ye have your commission? (2) Do ye and they own our covenants and engagements, our faithful Declarations and Testimonies? (3) Are ye and they free of giving any manner of bond to the enemies? (4) Are ye and they free of paying cess [a tax], locality, and any militia money? (5) Are ye and they free of paying stipends to the curates or to the Indulged? (6) Are ye and they free of taking the enemies’ pass or protection? (7) Are ye and they free of answering unto enemies their courts? (8) Are ye and they free of capitulation any manner or way with the enemies, or furnishing them with commodities? (9) Are ye and they free of counseling and consenting to any in their compliance, any of their foresaid ways, for you, in your name? (10) Are ye and they free of joining with the curates or indulged, by hearing them preach, accepting the administration of the sacraments at their hands, subjecting unto their discipline, or being married by them? (11) Are ye and they free of joining any of the foresaid ways of complying, unfaithful, and silent ministers of the time? The severity of life on the run combined with the endless criticism from home and abroad bore hard on the Society People.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (2000) Moore is very sympathetic with the Cameronians., p. 103</span></figcaption>

</figure><figure class="quote" id="q-567ceb6c81" data-kw="">
<blockquote><p>Employing the vivid imagery that was the hallmark of Spurgeon’s preaching, he wrote, ‘The house is being robbed, its very walls are being digged down, but the good people who are in bed are too fond of the warmth, and too much afraid of getting broken heads, to go downstairs and meet the burglars; they are even half vexed that a certain noisy fellow will spring his rattle, or cry, ‘Thieves!”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/macarthur-jr-john.html">John MacArthur</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Spurgeon &amp; the Downgrade Controversy’ from Ashamed of the Gospel</cite>, (Wheaton: Crossway, 1992)</span></figcaption>

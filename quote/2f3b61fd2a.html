<main class="wrap"><figure class="quote" id="q-2f3b61fd2a" data-kw="">
<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. … 2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse. 3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity. 4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’ 5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus</cite>, … (London, 1631), on Lev. 10, pp. 197-98</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c240066799" data-kw="">
<blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>

</figure><figure class="quote" id="q-103454afe4" data-kw="">

</figure><figure class="quote" id="q-13395f7f0e" data-kw="">
<blockquote><p>Because, where the doctrine itself is sound and pure, and the ceremonies used to a civil honesty and decency, the inconveniences are rather to be passed by in silence than that by occasion of them men should proceed to contentions and more grievous tumults; Calvin, Epistle 303, fol. 497. Because, albeit these things be not to be approved, yet, sometimes these indifferent things, howsoever offensive and burdensome, are to be born withal, so far forth (quoad aliter non liceat) as conveniently we cannot do otherwise, lest if men contend about them more bitterly then they ought, it be both an hindrance to the progress of the Gospel, and the things which in their own nature are indifferent, be taught by our vehement contention to be plainly wicked; which two points do bring with them most grievous inconveniences; P. Martyr to [John] Hooper, Common Places, folio 1086 [p. 117]. And therefore these things which the pastors cannot change, they should rather bear withal, than by forsaking the Church for that cause they should give occasion for far greater and more dangerous mischiefs unto Satan, who seeks nothing else; Beza, Epistle 12, fol. 99. … Because we must give place unto the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience, Acts 28:11; 19:10, 26; 15:28-29; Master [William] Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 482-83. Because if we cannot do the good that most we desire, in such exquisite manner as we would, we must content ourselves with the mean, and in things which are good and to be done, it is the safest course to satisfy ourselves in doing the less, lest in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action, Eccl. 7:16; read the proofs: Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 483-86.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 163-65</span></figcaption>

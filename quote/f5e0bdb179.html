<main class="wrap"><figure class="quote" id="q-f5e0bdb179" data-kw="">
<blockquote><p>In a letter to the Belfast News-Letter in support of the non-intrusionists in the established Church of Scotland, the Revd James Morgan argued that Christ’s headship over the church and the right of members to choose their ministers were the central principles at stake in the Ten Years’ conflict:

The fundamental principle for which the Church of Scotland now contends is theologically termed the Headship of Christ over the Church, but I prefer to express it in the words of Christ himself, when, after his resurrection, he said to his disciples – “all power is given unto me in heaven and in earth.” I do not see how any language could be employed more expressive of universal and sovereign dominion.

But it is not the broad principle with which we are at present concerned so much as particular exercise of the power which it claims; and our enquiry is, how has Christ been pleased to exercise his supreme authority in directing the appointment of the Ministers and officers of his Church? His mind upon this subject must be learned from his Word, and when we act in conformity with it, we honour and acknowledge his Headships. Nor is there any obscurity in his Word upon this subject.

We have a plain record of the manner in which the first disciples proceeded, under the guidance of their Great Head, and their conduct is designed to be our example. One of the first public duties in which they engaged after his ascension was the election of an apostle in the room of Judas, and that election was made by the united concurrence of the remaining Apostles &amp; the whole company of the Disciples, as will be obvious to the impartial reader of the first chapter in the Acts of the Apostles. Shortly after it became necessary to appoint the order of Deacons, and in their election also the concurrence and choice of the Disciples were sought by the Apostles themselves. A principle is thus clearly obtained, that in the appointment of Church officers the council and co-operation and approval of the members of the Church are essential. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 18 March 1842.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<blockquote><p>Obj. 4. Further, In the Old Law God was praised with musical instruments and human song, according to Ps. 32:2, 3: “Give praise to the Lord on the harp, sing to Him with the psaltery, the instrument of ten strings. Sing to Him a new canticle.” But the Church does not make use of musical instruments, such as harps and psalteries, in the divine praises, for fear of seeming to imitate the Jews. Therefore in like manner neither should song be used in the divine praises. On the contrary, Blessed Ambrose established singing in the Church of Milan, as Augustine relates (Conf. ix.). Reply Obj. 4. As the Philosopher says (Polit. viii.), Teaching should not be accompanied with a flute or any artificial instrument such as the harp or anything else of this kind: but only with such things as make good hearers. For suchlike musical instruments move the soul to pleasure rather than create a good disposition within it. In the Old Testament instruments of this description were employed, both because the people were more coarse and carnal—so that they needed to be aroused by such instruments as also by earthly promises—and because these material instruments were figures of something else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, trans. Fathers of the English Dominican Province (Bellingham, WA: Logos Bible Software, 2009), 2a.2ae.91.</span></figcaption>

<blockquote><p>This cathedral music introduces to the Church of God a rabble of church-officers which the Lord never appointed, and which never came into His heart, the choristers and singing-men, and that is a very great evil. It is not in the power of men, but it is the great prerogative of Jesus Christ to appoint officers in His church who has appointed none but pastors and teachers, elders and deacons.</p></blockquote>

<blockquote><p>QUESTION CLIV. What are the outward means whereby Christ communicates to us the benefits of his mediation? ANSWER. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation. …It is farther objected that those arguments which have been taken from the practice of the Old Testament church, to prove singing an ordinance, may, with equal justice, be alleged to prove the use of instrumental music in religious worship; since we very often read of their praising God with ‘the sound of the trumpet, psaltery, harp, organ,’ and other musical instruments. This is the principal argument brought for the use of musical instruments by those who defend it and conclude it an help to devotion. But, though we often read of music being used in singing the praises of God under the Old Testament; yet if what has been said concerning its being a type of that spiritual joy which attends our praising God for the privilege of that redemption which Christ has purchased, the objection will appear to have no weight, the type being now abolished, together with the ceremonial law. Besides, though we read of the use of music in the temple-service, yet it does not sufficiently appear that it was ever used in the Jewish synagogues; the mode of worship observed in which more resembled that which is at present performed by us in our public assemblies. But what may sufficiently determine this matter, is that we have no precept nor precedent for it in the New Testament, either from the practice of Christ, or his apostles. Some, indeed, allege that the absence of any such precept or precedent overthrows the ordinance of singing, and pretend that this ought to be no more used by us than the harp, organ, or other musical instruments. But it might as well be objected that, because incense, which was used under the ceremonial law, together with prayer in the temple,n is not now to be offered by us, prayer ought to be laid aside; which is, as all own, a duty founded on the moral law. …Again, when the psalmist makes use of those phrases which are adapted to the ceremonial law, as when he speaks of ‘binding the sacrifice with cords, even unto the horns of the altar,’ or of ‘offering bullocks upon it;’z the language cannot be taken in a literal sense, when applied to the gospel-state. And when we are exhorted to ‘praise God with the psaltery,’ &amp;c., we are to express those acts of faith which are agreeable to the gospel-dispensation. The general rule, indeed, which is applicable to all psalms of a similar nature, is that with the same frame of spirit with which we read them, we ought to sing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, 2 vol. (London, 1733; repr. New York: Robert Carter &amp; Brothers, 1855), 2.433, 437, 438.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-72736537e6" data-kw="">
<blockquote><p>Aristotle said it with style: people who set their heart on, proving to themselves with drawn-out arguments “that some providence is,” actually deserve whips, not words; a reply from an executioner, not a philosopher (nor, I add, a theologian). And what is more: if “that fire is hot,” something we perceive with touch; or “that noonday is light to our sense perception,” something we perceive with sight, do not require demonstration, then much less will divine providence, require it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“God’s Providence”</cite>, trans. Ryan M. Hurd | Modern Reformation 31.1 (Feb 2022), 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-32e424346d" data-kw="">
<blockquote><p>7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).</span></figcaption>

<blockquote><p>Material and formal cause, properly so called, does not have place in accidents, although by some all beings promiscuously, whether substances or accidents, are wont to be explained through four kinds of causes. Yet if anyone wishes to form analogical concepts of it [regeneration] after the manner of physical generation, let him consider:

I. The Holy Spirit as the one generating, 1 Jn. 5:1.

II. The transient matter or matter of generation, the Word of God, which is compared to seed, 1 Pet. 1:23.

III. The proximate constituting matter, the intellect.

IV. The form, faith or the new creature.

V. The composite from man’s intellect with will and from the image of God or new creature: let it be the new man, the man of God, the spiritual man.

VI. That introduced form informs and actuates the matter, and thus renders man active for spiritual life; moreover constitutes him in a certain kind of things and distinguishes him from all other men not regenerate; finally renders him fit for every good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>In light of all of these problems with Van Til’s thought, it is clear that when twentieth-century Reformed Christians followed Van Til and adopted his presuppositionalism in place of the traditional apologetics and theology of the sixteenth- and seventeenth-century Reformed scholastic theologians, they let go of an invaluable and precious birthright. What replaced that birthright has been uniquely detrimental to the contemporary Reformed church… If we would take the time to go back and carefully reread the Reformed scholastics, we would discover that it is they, and not Van Til, who provide us with an approach to theology and a foundation for apologetical work that is biblical, clear, precise, and internally self-consistent.</p></blockquote>

<blockquote><p>Christ in respect of his soul was comprehensor [one comprehending the highest blessedness], though viator [a pilgrim] in respect of his body. See Aquinas, part 3, q. 9, art. 2.” (System of Divinity, p. 873) . Suffering &amp; Death of Christ Agreement Agonies on the Cross Rivet: “Aquinas grants that Christ’s soul experienced everything that causes grief… and He took upon Himself every sorrow, the greatest gried in absolute quantity, and all the way to the point of death He not only bore in Himself the slanderings, tauntings, scourings, and shameful humiliations, but with patience, humility, and while enduring his harshest chastisement, He also appeased the wrath and anger of God that burned against mankind.” (Synopsis, Disp. 27, §6) . The Divine Second Person Remained United to his Soul &amp; Corpse through Death Thomas teaches this in Compendium, ch. 229; Mastricht teaches it in TPT, vol. 4, ch. 13, §13, pp. 466-68. See also, ‘On the Hypostatic Union in Christ’s Death’. . Disagreements Christ Suffered in the Higher Parts of his Soul on the Cross Thomas: “He suffered indeed as to all His lower powers… But Christ’s higher reason did not suffer thereby on the part of its object, which is God, who was the cause, not of grief, but rather of delight and joy, to the soul of Christ.” (Summa, pt. 3, q. 46, art. 7-8) Turretin: ‘Did Christ suffer only corporeal punishments for us in the body or in the soul, but only as to its lower and sensitive part? Or did He in truth also bear the spiritual and infernal punishments of sin themselves (in the superior as well as in the inferior part) properly in Himself and from a sense of God’s wrath? We deny the former and affirm the latter against the papists.’ (2.352) . Christ Remained truly a Man in his Death Mastricht relates that Thomas denied that Christ was in his death, with body and soul separated, a man, in the true and proper sense of that term, though Thomas confessed Christ was then a dead man (Compendium, ch. 22

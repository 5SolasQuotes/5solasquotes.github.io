<blockquote><p>5. God’s proper title which is Jehovah: wheresoever He that appeared as an angel, and is styled an angel, has this title Jehovah attributed to Him, there Christ Jesus is meant: On this ground it is evident that the angel which appeared to Moses in the burning bush was Christ, because He is called Jehovah, Ex. 3:3-4.</p></blockquote>

</figure><figure class="quote" id="q-b1ba9f71d5" data-kw="">
<blockquote><p>If I love such things as God has lent me, and committed unto mine administration, so that I cannot find in mine heart to bestow them on the uses which God has appointed me, then I dishonour God and abuse his creature, in that I give more honor unto it than I should do; and then I make an idol of it, in that I love it more than God and his commandment; and then I dishonor my neighbor, from whose need I withdraw it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), p. 58</span></figcaption>

</figure><figure class="quote" id="q-a6d63b8e1f" data-kw="">
<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, Second Commandment, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/images-icons-and-crucifixes.html">Images, icons and crucifixes</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span></div>

— Thomas Watson, The Ten Commandments, Second Commandment, p. 96">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+reproves+and+condemns+the+church+of+Rome%2C+who+from+the+Alpha+of+their+religion+to+the+Omega%2C+are+wholly+idolatrous.+They+make+images+of+God+the+Father%2C%E2%80%94painting+him+in+their+church+windows+as+an+old+man%2C%E2%80%94and+an+image+of+Christ+on+the+crucifix%3B+and%2C+because+it+is+against+the+letter+of+this+commandment%2C+therefore+they+sacrilegiously+blot+out+the+second+commandment+out+of+their+catechises%2C+dividing+the+tenth+commandment+into+two.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+Second+Commandment%2C+p.+96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa6d63b8e1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a6d63b8e1f.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-38c0a45750" data-kw="">
<blockquote><p>2. Though it be not simply unlawful to express in painting the visible shapes that were showed in vision to the prophets, if it be only for use and signification of the history, or if there be any other commendable use: yet to make those shapes for any use of religion, or service of God, is abominable idolatry. Fulke, ibid.: Epiphanius saw in a Church at Anablatha, an image painted in a table, as it had been of Christ or a saint; he took it down and cut it in pieces: affirming that it was contrary to the Scripture for any image of a man to hang in the Church of Christ. The Elibertine Council, Canon 36 decreed that no pictures should be made in Churches. If no pictures, much less carved images, which are a more strong provocation to idolatry. Augustine renders a reason why it is dangerous to have images in Churches, where there is yea but the least fear of superstition: Quis orat intuens simulachrum, qui non sic afficitur, vt ab eo se exaudiri putet, nec ab eo sibi praestari, quod desideret, putet? Who (sayth he) prayeth beholding an image, and is not so affected as though he were heard of it, and hopeth not to have that performed by it which he desireth? Ps. 113.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 349-50 of ‘Whether it be lawful to have the images of the Trinity, of Christ, or of the Angels’ in Synopsis Papismi (London, 1592), Controversies Concerning the Church Triumphant, 9th Controversy: concerning Saints Departed, 2nd Part, 5th Question, Part 1, Second Article</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-0aa68eeec8" data-kw="">
<blockquote><p>Remember.] This word used, seems, 1. To reflect upon by-past omission and forgetfulness. For, though it was instituted in paradise, and was not now a new unheard-of thing to this people, as appears by Exod. xvi. 23, yet, it is like they were much worn out of the observation and practice of it, especially during the time of their captivity in Egypt. So then, it is renewed thus: Keep holy this day which you know was so long ago appointed to be so—Be not now any more unmindful and regardless of it.

2. Such a way of enjoining seems more particularly needful in this [commandment] than in the rest, because it is not so written in nature as the rest, but depends wholly upon particular institution, which may also be the cause why it is so large, and the form of it alone, amongst all the ten, both negative and positive. Thou shalt do no work, and, Remember to keep it holy.

3. But the main reason of this Remember, is, the main thing or aim in this Precept, as both the badge, and the preserver and increaser of all piety and religion. And therefore is it, that it is so often pressed in the books of the Law, and in the sermons of the Prophets to the people of God, and so often called a sign of God’s covenant with them, and their mark of distinction from all other people. Exod. xxiii. 12, and xxxi. 13, 14. Levit. xix, 30; XXV. 2, &amp;c. Jer. xvii. Isa. Iviii. 13, 14, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 380.</span></figcaption>

</figure><figure class="quote" id="q-a6e684dc8d" data-kw="">
<blockquote><p>But it can be proved by perfectly sufficient evidence that the terms “hymns” and “songs” are actually different names for the inspired Psalms, and must have been perfectly familiar as such to the Ephesians and Colossians. The terms “psalms, and hymns, and songs” are all employed as titles to different psalms in the inspired collection in the Septuagint translation of the Old Testament into the Greek language. Moreover, in Colossians iii. 16, the command to sing psalms and hymns and song is prefaced by the expression, “Let the word of Christ dwell in you richly;” and then there follow the participial clauses, “speaking to one another, and singing with grace,” as explanatory of the command about the word of Christ, and showing, we think, unmistakably that the psalms, hymns, and songs are all “the word of Christ,” or portions of his inspired psalmody. Besides, the word “spiritual” following all three terms, as it does in the Greek, may more rationally be regarded as qualifying all three than only the last one, and may without violence he translated “inspired.” The command would then be to sing the psalms, hymns, and songs given by the Spirit of God for that purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-ba4f4a651c" data-kw="">
<blockquote><p>The most of the persons whom the Papists now keep holy days for were very religious godly people: And the zealous religious people of that age did think that the honoring of the memories of the martyrs was a great means to invite the infidels to Christianity and to encourage the weak to stick to Christ: and therefore they kept the days of their martyrdom in thanksgiving to God and in honor of them. The wicked of that age hated and persecuted both the martyrs and them that honored them. In the next age, religion being uppermost in the world, the wicked did turn hypocrites and keep holy days for the honor of their names whom their forefathers murdered. At last when it was observed that the Papists who burned the living saints were the greatest honorers of the dead, the most religious people turned quite to dislike and reject those very days which their predecessors had set up in thanksgiving to God for the doctrine, example and constancy of the martyrs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, ‘Take heed of superstition, and observe well the circular course of zealous superstition…’, p. 280</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c327d58595" data-kw="">
<blockquote><p>At Glasgow, Mr. Andrew Gray, a youth of twenty-two years at most, lately laureate at St. Andrew’s, upon one preaching or two at Glasgow, Mr. Patrick Gillespie and his friends will have him admitted to his place. I refused to consent; the youth being so young, and utterly a stranger to us; his trials of expectant being hastily past in the Presbytery of Hamilton; and none of the ministers either of Edinburgh or St. Andrew’s, the places of his residence, being acquainted with him, as he professed; also his voice being so weak, that the most in our kirks heard him not.

The Magistrates and Town-Counsel being utterly against his admission, dealt with him earnestly not to trouble them: at first, his modesty was so great, that a small impediment seemed enough to scare him from accepting of any charge; but so soon as our Session (which is bot the echo of what our brethren speaks) had given him a call, without haste he went on to his trials, and, over the belly of the town’s protestation, was admitted by their part of the Presbytery minister of Glasgow.

His voice is not yet so good as to be heard by diverse. He has the new guise of preaching, which Mr. Hew Binning and Mr. Robert Leighton began, contemning the ordinary way of exponing and dividing a text, of railing doctrines and uses; but runs out in a discourse on some common head, in a high, romancing, unscriptural style, tickling the ear for the present, and moving the affections in some, but leaving, as he confesses, little or nought to the memory and understanding. This we must misken [sic], for we cannot help it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Spang, 21 July 1654 in The Letters and Journals of Robert Baillie, ed. David Laing (3 vols, Edinburgh: Robert Ogle, 1842), 3: 258-59.</cite></span></figcaption>

<blockquote><p>We believe this communication [of Christ via Gospel ministry] to be (a) mystical, and incomprehensible to human reason, and (b) spiritual, since it is effected by the Holy Spirit; to whom, since he is the virtue of the living God, proceeding from the Father and the Son, we ascribe omnipotence, by which he joins us to Christ our Head, not in an imaginary way, but most powerfully and truly, so that we become flesh of his flesh and bone of his bone, and from his vivifying flesh he transfuses eternal life into us.</p></blockquote>

</figure><figure class="quote" id="q-627e8ca575" data-kw="">
<blockquote><p>Preach the word.” 2 Timothy 4:2.

THE theme presented in this clause of the great Apostle’s charge to Timothy, has suggested itself to my mind as eminently appropriate to the present occasion. The Gospel ministry, whether viewed with reference to the Divine warrant upon which it rests; the influence of the Holy Spirit upon which its efficiency depends; the transcendent importance of those truths which comprise its subject-matter; or the momentous issues suspended upon their reception or rejection, – rises in dignity and importance above all other functions exercised by man.

Any theory of preaching, which fails to assert its superiority to all other institutions, or which would subordinate it to any other agency whatever, we reject, as not only essentially defective, but impious and dishonouring to God, in its attempt to degrade that ordinance which Himself has instituted, for the accomplishment formed by the Creator merely to enhance, by the comparison, the grandeur of its ampler proportions, so does the preaching of the Word rise above all other instrumentalities of moral and spiritual power — shining among them not as the “Moon amid the lesser fires of the night,” but like the sun, in whose glory that of the stars is obscured — in the splendour of whose burning their feebler radiance is quenched.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Word: A Discourse, Delivered at the Opening of the Reformed Presbyterian Synod, in Allegheny, Pa., on Tuesday Evening, May 24, 1859</cite>, (New York: Thomas Holman, 1859), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

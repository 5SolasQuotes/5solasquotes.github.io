<main class="wrap"><figure class="quote" id="q-3de698be83" data-kw="">
<blockquote><p>We who are here providentially convened in our own defence, for preventing and removing the mistakes and misapprehensions of all, especially of those whom we wish to be, and hope are friends, do declare our present purposes and endeavours to be only in vindication and defence of the true reformed religion in its profession and doctrine, as we stand obliged thereunto by our national and solemn league and covenants, and that solemn acknowledgment of sins, and engagement to duties, made and taken in the year 1648, declaring against popery, prelacy, Erastianism, and all things depending thereupon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3 | At the beginning of the gathering, that week in which the attempt was made upon Glasgow, when they came to deliberate upon a declaration to be emitted, most part by far, in the meeting for consultation, were of Mr. Hamilton and Mr. Douglas’s sentiments, Mr. Welsh and a few others excepted; so that it was carried almost without a struggle that the indulgence should be testified against in the declaration agreed to. All that Mr Welsh and those of his sentiments could do, was to get the passage relative thereunto kept in general terms. The paper at this time before them is but short, and follows.</cite>, pp. 90-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-678f093652" data-kw="">
<blockquote><p>To treat with us upon that posture, or upon such terms, is a treatment neither scriptural, reasonable, just nor fair; nor is it the habile way to get grievances redressed. If this be the condition of union, it can never take place in our day, nor in any other period for what I know; at this rate ye proclaim a perpetual war. Nor is there any condescension here; for we might return to the Church of Rome, would they redress just grievances, and return to their happy state wherein they were when the apostle Paul wrote his epistle to the Romans. But, to make Church communion necessarily depend on such a redress in every part, is both destitute of a necessary warrant from the Word, and requires a standing-out until the Churches of Christ be brought to such a state as we are never like to see, nor for what I know is contained within the verge of the Lord’s gracious promises unto his Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

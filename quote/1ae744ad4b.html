<main class="wrap"><figure class="quote" id="q-1ae744ad4b" data-kw="">
<blockquote><p>And we must also add that whatever be their original and constitution, if all their governors were as the apostles, yet have they no power but what is for edification, and not for destruction; If they do or shall appoint and impose on men what tends unto the destruction of their souls, and not unto their edification, as it is fallen out in the Church of Rome; not only particular churches, but every individual believer is warranted to withdraw from their communion… Let none mistake themselves herein, believers are not made for churches, but churches are appointed for believers. Their edification, their guidance and direction in the profession of the faith and performance of divine worship in assemblies according to the mind of God, is their use and end; without which they are of no signification. The end of Christ in the constitution of his churches, was not the molding of his disciples into such ecclesiastical shapes, as might be subservient unto the power, interest, advantages and dignity of them that may in any season come to be over them; but to constitute a way and order of giving such officers unto them, as might be in all things useful and subservient unto their edification; as is expresly affirmed, Eph. 4:11-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Vindication of the Non-Conformists from the Charge of Schism</cite>, … (1680), p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

dd%20that%20whatever%20be&amp;text=their%20edification%3B%20as%20is%20expresly%20affirmed%2C%20Eph.%204%3A11%2D14" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7be42921fc" data-kw="">
<blockquote><p>Where Church-members are polluted and suffered notwithstanding by Church officers to remain in Church communion, Christ does not only not condemn the clean for keeping fellowship with them, but expressly requires them to continue as they did, then he allows not separation on that account.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Where Church-members are polluted and suffered notwithstanding by Church officers to remain in Church communion, Christ does not only not condemn the clean for keeping fellowship with them, but expressly requires them to continue as they did, then he allows not separation on that account.”

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhere+Church-members+are+polluted+and+suffered+notwithstanding+by+Church+officers+to+remain+in+Church+communion%2C+Christ+does+not+only+not+condemn+the+clean+for+keeping+fellowship+with+them%2C+but+expressly+requires+them+to+continue+as+they+did%2C+then+he+allows+not+separation+on+that+account.%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland+contra+the+Seceders&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7be42921fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7be42921fc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=Where%20Church%2Dmembers%20are%20polluted%20and%20suffered,allows%20not%20separation%20on%20that%20account&amp;text=Where%20Church%2Dmembers%20are%20polluted%20and%20suffered%20notwithstanding%20by&amp;text=then%20he%20allows%20not%20separation%20on%20that%20account" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3d1ed319fc" data-kw="">
<blockquote><p>It is one thing to withdraw from civil conversing with particular wicked men, and another thing to separate from God’s Church for its defects. There is therefore this observable in separating and withdrawing, that we are to keep less fellowship in civil things with a brother that is a Church-member and is gross, than with one that is without and not a member; as the apostle writes, 2[?***] Cor. 5:10. But we may and should on the other side keep Church fellowship with a true Church, though in many things faulty and corrupt, whereas we may not at all with an idolatrous company in their worship. Hence in that same epistle to the Corinthians, going to and eating in idols’ temples or at their feasts was so much condemned; yet communicating with the Church of Corinth or living as a member of it (though corrupt both in doctrine and practice) was never found fault with as to worship: For it is clear that that of not eating with an offending brother looks only to civil fellowship, because it is such a fellowship that is condemned with them, as is allowed to heathens, which certainly is such. If our churches therefore be Christ’s churches, as sometimes the favorers of separation grant, there can be no separation from them without turning to a schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

0one%20thing%20to%20withdraw,them%20without%20turning%20to%20a%20schism&amp;text=It%20is%20one%20thing%20to%20withdraw%20from%20civil&amp;text=separation%20from%20them%20without%20turning%20to%20a%20schism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3051b669e2" data-kw="">
<blockquote><p>…the decision of a Convention of Estates, or Parliament, in June to levy a ‘cess’, or tax, for the express purpose of raising additional troops to suppress the field-meetings. To Hamilton in particular, opposition to this tax became a test of orthodoxy, on a par with opposition to the indulgence. There is considerable evidence that in the summer and autumn of 1678 both he and Kersland sought to influence the younger field-preachers to adopt an increasingly militant tone in their preaching, and to condemn both those who payed the ‘cess’ and the ministers who had accepted the Indulgence. It is also clear that during this period both Hamilton and Kersland became increasingly associated with Richard Cameron… Throughout the 1670’s it had been customary for the leading field-preachers, such as John Welsh, to be accompanied by armed bodyguards as they moved around the country. This was seen as a necessary precaution for their own safety… Having attached himself to Cameron, Hamilton concluded that Cameron too should enjoy the same protection. He therefore gathered a body of men… whom he engaged to accompany Cameron around the country… Hamilton himself assumed the command of this group. A show of military order was observed, though neither Hamilton himself, nor, it apprears, any of those whom he led, had any military experience. However, it satisfied Hamilton’s fondness for demonstration and for display, and it was, of course, fully consistent with the militant approach which he advocated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 100-101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

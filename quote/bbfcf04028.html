<main class="wrap"><figure class="quote" id="q-bbfcf04028" data-kw="">
<blockquote><p>…for as no power given to man to murder his brother is of God, so no power to suffer his brother to be murdered is of God; and no power to suffer himself, a fortiori, far less can be from God. Here I speak not of physical power, for if free will be the creature of God, a physical power to acts which, in relation to God’s law, are sinful, must be from God.</p></blockquote>

</figure><figure class="quote" id="q-a58969579b" data-kw="">
<blockquote><p>23. To imagine God either without providence, or with general only, not special, indeed also singular, concerning any entities whatsoever and any acts of entities, is impious and hurls God from his throne.

24. But this providence is either effective of all good, or permissive and directive of evil, nor idle concerning evil but efficacious, although not efficient.

25. Whence those who strive to ascribe to God the efficiency of evil reduplicatively as such to orthodox [Reformed] Churches, do what they do from mere either ignorance or malice, since they constantly teach that God can be neither the physical nor the ethical cause of ethical evil as such.

26. To imagine God also without predestination is both to detract the eternal direction of all things from God, and to establish an uncertain end of the creation of men, and to make primary causes from secondary, and to constitute man the craftsman and architect of his own salvation.

27. Yet the orthodox doctrine of the Reformed Churches concerning predestination neither removes the guilt of the fall from man, nor imputes it to God, nor establishes a necessity of the fall incompossible with the freedom of the one falling or fallen. Nor have those who oppose necessity in every way to freedom well-perceived the nature either of necessity or of freedom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-51fb0d48d6" data-kw="">
<blockquote><p>But every man is tempted, when he is drawn away of his own lust, and enticed. Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death.’ John in 1 Jn. 2:12, 16, “The lust of the flesh, and the lust of the eyes, and the pride of life, is not of the Father, but is of the world.” Add. Gal. 5:17.

2. Actual sins, which flow from this impure font: Mt. 15:19, “For out of the heart proceed evil thoughts, murders, adulteries, fornications, thefts, false witness, blasphemies: These are the things which defile a man.” Jam. 1:15. To these [latter, phsycial evils,] pertain:

3. Punishments of every kind: calamities, diseases, and finally temporal and eternal death (Rom. 5:12, 14; 7:10-14; Eph. 2:3). Thomas in Summa, pt. 1 of 2, q. 85, art. 3, recounts four wounds of nature: ignorance, malice, concupiscence and infirmity, of which he constitutes the first in the intellect, the second in the will, the third in the concupiscible appetite, and the fourth in the irascible, which Bellarmine expounds diffusely and pathetically in On the Loss of Grace &amp; the State of Sin., bk. 6, ch. 9-12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 14-15 Latin | “§40. The effects [of original sin] are either moral or physical evils. To the former is to be referred: | 1. Concupiscence, not that natural and innate faculty by which, for our ordinate conservation, we desire necessary things like food, drink, sleep, etc.—for this was instilled in man by God—but the pravitious concupiscence derived into posterity through the fall, otherwise called the concupiscence of the flesh (Eph. 2:3; 1 Jn. 2:16; Gen. 8:21), which by its inordinate movements irritates man to evils, and is the cause, fuel, and fodder of sin and of all vices and outrages, concerning which Paul says in Rom. 7:7, “I had not known lust, except the law had said, ‘Thou shalt not covet.&#x27;” James 1:14:</span></figcaption>

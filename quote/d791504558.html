<blockquote><p>2. A Christian that is thus established, is fortified against spirit, word, or writing, or all suggestions that may perplex his mind.

[1.] Against pretended revelations, called here spirit.

(1.) Because having his mind thus settled, he may boldly defy all revelations pretended to the contrary: Gal. i. 8, ‘Though we, or an angel from heaven, preach any other gospel than we have preached, let him be accursed.’ Any doctrine, if diverse, or different from, or besides the written word, much more contrary to it, a Christian may reject it, and account it cursed doctrine; therefore neither church, nor angel, nor spirit is to be heard against it.

(2.) Because a Christian is upon better terms, having the written word, than if God dealt with him by way of revelations: 2 Peter i. 19, 25‘We have βεβαιότερον λόγον, a more sure word of prophecy;’ comparing it with the voice from heaven, of which he spake before; not as if there could be any uncertainty in the Lord’s voice speaking from heaven, but because a transient voice is more easily mistaken or forgotten than an authentic standing record; as Samuel thought Eli called him, when it was the Lord. It is quoad nos; though God gave evidence of the truth of such revelations as he made, yet we have more accommodate means. Our Lord intimateth such a thing: Luke xvi. 31, ‘If they hear not Moses and the prophets, neither will they be persuaded though one rose from the dead.’ This is the surest ground for faith to rest upon of any that ever hath been or can be given to sinners, subject to forgetfulness, jealousies, and mistakes.

(3.) Because it is not rational to expect new revelation, now the canon and rule of faith is closed up: Heb. ii. 1, 2, ‘Therefore we ought to give the more earnest heed to the things which we have heard, lest at any time we should let them slip,’ &amp;c.; Mat. xxviii. 20, ‘Teaching them to observe all things, whatsoever I have commanded you;’ John xvii. 29, ‘Neither pray I for these alone, but for them which shall believe on me through their word.’

(4.) Because if any such be pretended, it must be tried by the word: Isa. viii. 20, ‘To the law and to the testimony; if they speak not according to this word, it is because they have no light in them;’ so 1 John iv. 1, ‘Beloved, believe not every spirit, but try the spirits whether they are of God, because many false prophets are gone abroad into the world.’

(5.) Because they that despise ordinary means, and pretend to vision, revelation, or inspiration, are usually such as are given up by God to a vertiginous spirit, and cast into the dungeon of error, for the punishment of other sins: Micah ii. 11, ‘If a man walking in the spirit of falsehood do lie, he shall be the prophet of this people;’ God will permit those that are both deceivers and deceived themselves to come amongst them for a plague to them. Sleidan giveth sad instances of some given up to this fantastical frenzy, that killed their own relations on pretence of inspiration, and of others that murdered fifty thousand in one day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 24-5.</span></figcaption>

<blockquote><p>But what ought to be clearly observed is that Covenant of Works or Covenant of Life did not offer “salvation.” The word “salvation” implies something from which one is saved. Adam was not lost when that Covenant of Life was given him. On the contrary he had knowledge, righteousness and holiness. The Covenant of Works was not given as a way by which a sinner might get rid of his sin and merit eternal life. Neither was the Mosaic Law given for any such purpose. It was not given to present, even hypothetically, a way by which a sinner, already eternally under the condemnation of sin, could by future perfect obedience merit the favor of God. And Dr. Charles Hodge surely does not regard it as given for any such purpose. The root error, or one of the many root errors of the Dispensationalism of the Scofield Bible seems to me to be the utter failure to recognize and make central the fact of the Fall of man. I know that there are salutary inconsistencies in the Scofield Bible. I know that in the notes on the fifth chapter of Romans there is taught, not indeed the orthodox doctrine of imputation, but still some recognition of the universal corruption that has come from Adam’s sin. But by what a back-door even that much of the central Biblical teaching is brought in! As one reads Dr. Scofield’s notes one does not for the most part get the slightest inkling of the fact that anything irrevocable took place when Adam fell. After his Fall man continued to be tested in successive dispensations. See for example the definition of a dispensation which Dr. Scofield gives at the beginning. That is one of the things that seems to me to be so profoundly heretical in this commentary. It is contrary to the very heart of the Augustinian and Calvinistic view of sin. According to that view — and surely according to the Bible — the guilt of Adam’s first sin was imputed to his posterity. Adam being by divine appointment the representative or federal head of the race. Thus all descended from Adam by ordinary generation are guilty. They are guilty before they individually have done anything either good or bad. They are under the penalty of sin when they are born. Part of that penalty of sin is hopeless corruption, from which, if there is growth to years of discretion, individual transgressions spring. How utterly absurd would it have been therefore for God to offer the Mosaic Law, to such an already condemned and fallen race, as something which, if only obeyed by that already condemned and fallen race, would bring salvation and eternal life! Thus Dr. Scofield’s view of the Mosaic Law is rooted in a wrong view of sin — a wrong view which is against the very heart and core of the Reformed Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to J. Oliver Buswell, October 19</cite>, 1936.</span></figcaption>

<blockquote><p>Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, trans. Fathers of the English Dominican Province (Benziger Bros., 1947), 2nd part of 2nd part, Question 176, ‘Of the Grace of Tongues’, Article 1</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.”

</figure><figure class="quote" id="q-fb16cd0e02" data-kw="">
<blockquote><p>Distinctions have been drawn by certain exceedingly wise men (measured by their own estimate of themselves), between the people of God who lived before the coming of Christ and those who lived afterwards. We have even heard it asserted that those who lived before the coming of Christ do not belong to the Church of God! We never know what we shall hear next, and perhaps it is a mercy that these absurdities are revealed one at a time in order that we may be able to endure their stupidity without dying of amazement!

Why, every child of God in every place stands on the same footing! The Lord has not some children best beloved, some second-rate offspring, and others whom He hardly cares about. These who saw Christ’s day before it came, had a great difference as to what they knew, and perhaps in the same measure a difference as to what they enjoyed while on earth in meditating upon Christ; but they were all washed in the same blood, all redeemed with the same ransom price, and made members of the same body! Israel in the covenant of grace is not natural Israel, but all believers in all ages! Before the first advent, all the types and shadows all pointed one way—they pointed to Christ, and to Him all the saints looked with hope. Those who lived before Christ were not saved with a different salvation to that which shall come to us; they exercised faith as we must; that faith struggled as our struggles, and that faith obtained its reward as ours shall, as like as a man’s face to that which he sees in a glass is the spiritual life of David to the spiritual life of the believer now.

Take the book of Psalms in your hand, and forgetting, for an instant that you have the representation of the life of one in the olden times, you might suppose that David wrote but yesterday. Even in what he writes of Christ, he seems as though he lived after Christ instead of before, and both in what he sees of himself, and in what he sees of his Savior, he appears to be rather a Christian writer than a Jew. I mean that living before Christ, he has the same hopes and the same fears, the same joys and the same sorrows, and there is the same estimate of his blessed Redeemer which you and I have in these times. Jesus was the same yesterday as an anointed Savior to His people, as He is today, and they under Him received like precious gifts. If the goodly fellowship of the prophets could be here today, they would all testify to you that He was the same in every office in their times as He is in these, our days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jesus Christ Immutable. Delivered Lord s-day Morning, January 3, 1869’, no. 848 in The, Metropolitan Tabernacle Pulpit: Volume 15</cite></span></figcaption>

</figure><figure class="quote" id="q-e2b79a5551" data-kw="">
<blockquote><p>In former times those who accepted the divine preaching and who were baptized for their salvation were given visible signs of the grace of the Holy Spirit at work in them. Some spoke in tongues which they did not know and which nobody had taught them, while others performed miracles or prophesied. These Corinthians also did these things, but they did not use the gifts as they should have done. They were more interested in showing off than in using them for the edification of the church… Even in our time grace is given to those who are deemed worthy of holy baptism, but it may not take the same form as it did in those days.</p></blockquote>

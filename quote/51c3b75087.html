<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear. 2. Between the obvious usual sense of the words and an unusual forced sense. 3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense. 4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow. 5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause. 6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is: 1. That I have no obligation to fit my words to his personal private sense. 2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words. 3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense. 4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>

<blockquote><p>A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.</p></blockquote>

<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>

<blockquote><p>§98. If you ask what did the ministers all this while, I answer: they preached and prayed against disloyalty. They drew up a writing to the Lord General declaring their abhorrence of all violence against the person of the king [Charles I], and urging him and his army to take heed of such an unlawful act. They present it to the General when they saw the king in danger: But Pride prevailed against their counsels. §99. The king being thus taken out of the way, Cromwell takes on him to be for a commonwealth (but all in order to the security of the good people) till he had removed the other impediments which were yet to be removed: so that the Rump [Parliament] presently drew up a form of Engagement, to be put upon all men, viz. ‘I do promise to be true and faithful to the commonwealth as it is now established without a king or House of Lords.’ So we must take the Rump for an established commonwealth and promise fidelity to them. This the sectarian party [of Independents and sects] swallowed easily, and so did the king’s old cavaliers, so far as I was acquainted with them or could hear of them (not heartily, no doubt, but there were very few of them sick of the disease called tenderness of conscience or scrupulosity: But the presbyterians and the moderate episcopal men refused it (and I believe so did the prelatical divines of the king’s party for the most part; though the gentlemen had greater necessities [to preserve by the Engagement]). Without this Engagement no man must have the benefit of suing another at law (which kept men a little from contention and would have marred the lawyers’ trade); nor must they have any masterships in the universities, nor travel above so many miles from their houses, and more such penalties, which I remember not (so short lived a commonwealth deserved no long remembrance): Mr. [Richard] Vines and Dr. Rainbow and many more were hereupon put out of their headships in the universities, and Mr. Sidrach Sympson, and Mr. John Sadler and such others put in; yea, such a man as Mr. Dell, the chaplain of the army, who, I think, neither understood himself nor was understood by others any farther than to be one who took reason, sound doctrine, order and concord to be the intolerable maladies of Church and State, because they were the greatest strangers to his mind. But poor Dr. Edward Reynolds had the hardest measure; for when he refused to take the Engagement, his place was forfeited; and afterwards they drew him to take it, in hopes to keep his place (which was no less than the deanery of Christ’s-Church) and then turned him out of all, and offered his place to Mr. Joseph Caryl; but he refusing it, it was conferred on Dr. [John] Owen, to whom it was continued from year to year. And because the presbyterians still urged the [Solemn League and] Covenant against killing the king, and pulling down the parliament, and setting up a commonwealth, and taking the Engagement, some of the Independent brethren maintained that its obligation ceased, because it was a league, and the occasion of it ceased: And some of the Rump said it was like an almanac out of date; and some of the soldiers said they never took it; and others of them railed at it as a Scottish snare: So that when their interest would not suffer them to keep so solemn a vow, their wills would not suffer their judgments to confess it to be obligatory, at least as to the part which they must violate. §100. For my own part, though I kept the town and parish of Kidderminster from taking the Covenant (and seeing how it might become a snare to their consciences) yea, and most of Worcestershire besides, by keeping the ministers from offering it in any of the congregations to the people (except in Worcester City, where I had no great interest and know not what they did); yet I could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath, as if the bonds of national and personal vows were as easily shaked off as Sampson‘s cords. Therefore I spake and preached against the Engagement and dissuaded men from taking it. The first hour that I heard of it, being in company with some gentlemen of Worcestershire, I presently wrote down above twenty queries against it, intending as many more almost against the obligation as those were about the sense and circumstances. And one that was present got the copy of them, and shortly after I met with them verbatim in a book of Mr. Henry Hall‘s as his own (one that was long imprisoned for writing against Cromwell). Some episcopal divines that were not so scrupulous it seems as we, did write for it (private manuscripts which I have seen) and plead the irresistibility of the imposers, and they found starting holes in the terms, viz. that by “the commonwealth” they will mean the present commonwealth in genere, and by “established” they will mean only de facto and not de jure, and by “without a king, etc.” they mean not quatenus [as far as] but etsi [although], and that only de facto pro tempore [in point of fact for the time], quasi dicat [“as if to say”]: ‘I will be true to the government of England, though at the present the king and House of Lords are put out of the exercise of their power.’ These were the expositions of many episcopal men, and others that took it: But I endeavored to evince that this is mere juggling and jesting with matters too great to be jested with: And that as they might easily know that the imposers had another sense, so as easily might they know that the words in their own obvious usual sense among men must be taken as the promise or engagement of a subject as such to a form of government now pretended to be established: And that the subjects’ allegiance or fidelity to his rulers can be acknowledged and given in no plainer words: And that by such interpretations and stretchings of conscience, any treasonable oath or promise may be taken, and no bonds of society can signify much with such interpreters.</p></blockquote>

<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+gives+kingdoms+to+whom+He+will.+What+then%3F%E2%80%A6+and+He+gives+tyrannous+conquests+to+whom+He+will%3A+and+it+is+Nebuchadnezzar+to+whom+Daniel+speaks+that+from+the+Lord+%5BDan.+5%3A21%5D%2C+and+he+had+no+just+title+to+many+kingdoms%2C+especially+to+the+kingdom+of+Judah%2C+which+yet+God%2C+the+King+of+kings%2C+gave+to+him+because+it+was+his+good+pleasure%3B+and+if+God+had+not+commanded+them+by+the+mouth+of+his+prophet+Jeremiah%2C+might+they+not+have+risen%2C+and%2C+with+the+sword%2C+have+vindicated+themselves+and+their+own+liberty%2C+no+less+than+they+lawfully%2C+by+the+sword%2C+vindicated+themselves+from+under+Moab%2C+%28Judges+3%29+and+from+under+Jabin%2C+king+of+Canaan%2C+who%2C+twenty+years%2C+mightily+oppressed+the+children+of+Israel%2C+Judges+4.+Now+this+Popish+Prelate+%5BJohn+Maxwell%5D%2C+by+all+these+instances%2C+making+heathen+kings+to+be+kings+by+as+good+a+title+as+David+and+Hezekiah%2C+%5Bimplicitly%5D+condemns+the+people+of+God+as+rebels%2C+if%2C+being+subdued+and+conquered+by+the+Turk+and+Spanish+king%2C+they+should%2C+by+the+sword%2C+recover+their+own+liberty+%5Bsuch+as+happened+the+Reformation+in+the+Netherlands%5D%3B+and+that+Israel%2C+and+the+saviours+which+God+raised+to+them%2C+had+not+warrant+from+the+law+of+nature+to+vindicate+themselves+to+liberty%2C+which+was+taken+from+them+violently+and+unjustly+by+the+sword%E2%80%A6+for+Nebuchadnezzar%E2%80%99s+sovereignty+over+the+people+of+God%2C+and+many+other+kingdoms+also%2C+was+revenged+of+God+as+tyranny%2C+Jer.+1%3A6-7%3B+and+therefore+the+vengeance+of+the+Lord%2C+and+the+vengeance+of+his+temple%2C+came+upon+him+and+his+land%2C+Jer.+1%3A16%2C+etc.+It+is+true+the+people+of+God+were+commanded+of+God+to+submit+to+the+king+of+Babylon%2C+to+serve+him%2C+and+to+pray+for+him%2C+and+to+do+the+contrary+was+rebellion%3B+but+this+was+not+because+the+king+of+Babylon+was+their+king%2C+and+because+the+king+of+Babylon+had+a+command+of+God+so+to+bring+under+his+yoke+the+people+of+God.+So+Christ+had+a+commandment+to+suffer+the+death+of+the+cross+%28John+10%3A18%29+but+had+Herod+and+Pilate+any+warrant+to+crucify+him%3F+None+at+all.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F09822e2260.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/09822e2260.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-passive-obedience/#:~:text=God%20gives%20kingdoms%20to%20whom%20He,to%20crucify%20him%3F%20None%20at%20all&amp;text=God%20gives%20kingdoms%20to%20whom%20He%20will.%20What&amp;text=any%20warrant%20to%20crucify%20him%3F%20None%20at%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

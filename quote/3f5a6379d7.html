<main class="wrap"><figure class="quote" id="q-3f5a6379d7" data-kw="">
<blockquote><p>As it is full of Consolation to Believers in respect of themselves, so also in reference to posterity: Their children are God’s children: They being of the Lord’s Inheritance, their children are his heritage in like manner: These bring forth children to God, their seed be owns and challenges for His: An infinite love in God, an unspeakable comfort to a parent, when the Infant, who by corruption of nature is in Satan’s jaws, in no less danger of Hell, then Moses was of the water; and not so much as sensible of it; God pleases to look upon him in this condition and to make it the time of love, and to find out ways of freedom.

What the Apostle speaks from the Prophet of God’s care of the Gentiles, is certainly true being applied to Infants. I was found of them that sought me not, and made manifest to them that enquired not after me. Had we that hopeless opinion of our children as Papists of theirs that die without Baptism; what a wretched case were it (with David) to part with an Infant out of the world? How could such mourn in any other way then those that are without hope? parting with an Infant without part in Christ, and in no better posture towards God then the seed of the sinners of the Gentiles. But we find God more rich in mercy, Christ himself embracing them in their infancy, and taking them into his special love as those that bear his name:

And though death prevent their Baptism, He that hath appointed Ordinances is not tied to them, but can save without them. Bellarmine confesseth that the desire of Baptism in one of the Catechumen, (that is, one instructed in the Principles of Christ and not baptized) doth save; though the text, John 3.5. understood with their Comment be in the Letter against it, why then should not that Grace? which when the person is of capacity would shew it self in desires qualify for Salvation in like manner? Finding this love in God, these bowels in Christ, we may safely conclude, that Children have bliss, Parents have comfort, and let God have the Glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The birth-privilege, or, Covenant-holiness of believers and their issue in the time of the Gospel together with the right of infants to baptism</cite>, (London: Tho. Underhill, 1644), pp 32-33.</span></figcaption>

</figure><figure class="quote" id="q-cebb4ffe52" data-kw="">
<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For:

1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more?

2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites.

3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Disputations of Right to Sacraments</cite>, ... (London: Simmons, 1658), 2nd Disputation, pp. 200-201</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2b4fb559b4" data-kw="">
<blockquote><p>Fourthly, The rule [of worship], according to his revealed will. Every part of divine worship must have a divine precept. As the first command teacheth us what God is to be worshipped, so the second command teacheth in what way he will be worshipped. The tabernacle and all the instruments thereof, yea, the very snuffers and ash-pans, were to be made exactly according to the pattern in the mount, Exod. xxv. 40; Heb. viii. 5. Typifying that all the exercise of worship used by the church, whether in doctrine or discipline, must be conformed to the written word, Gal. i. 8.

Our religion must be not only rational but regular; our worship must be both universal and canonical, καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, Gal. vi. 16; ‘As many as walk according to this canon, or rule, peace be unto them.’ The saints’ service must be word service, λογικὴν λατρείαν, Rom. xii. 1; so the word is rendered by our translators, 1 Pet. ii. 2, λογικὸν ἄδολον γάλα, ‘ the sincere milk of the word.’

The institutions of Christ, not the inventions of men, are the rule of worship. Our work is not to make laws for ourselves or others, but to keep the laws which the great prophet of his church hath taught us; that coin of worship which is current amongst us must be stamped by God himself. We are to be governed as the point in the compass, not by the various winds, (the practices of former ages, or the fashions of the present generation, which are mutable and uncertain,) but by the constant heavens. Our devotion must be regulated exactly according to the standard of the word. It is idolatry to worship a false god, or the true God in a false manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 34-35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f4989fd79" data-kw="">
<blockquote><p>Let me remind you, in vindication of the glory of Immanuel, that going and telling Jesus, implies on His part, no ignorance of, or indifference to your case. He who redeemed us is God — “God manifest in the flesh.” All persons, all things, all events are known to Him from the end to the beginning. When, therefore, you stand in the presence chamber of Jesus you prefer no request, breathe into His ear no sorrow, unveil to His eye no infirmity, with which, in all its most minute detail, He was not already infinitely better acquainted than yourself.

Long ere the sadness had shaded your brow, or a tear had dimmed your eye, or the burden had pressed your spirit, or the perplexity had woven its web around your path, or the archer had bent his bow and winged his shaft — Jesus knew it all, had appointed it all, had anticipated it all. It was no surprise to Him! Precious truth! Christ had entwined my perplexity with His thoughts, had wrapped my grief around His heart, had provided a pavilion for my safety ere a pebble had paved, or a cloud had shaded, or a whisper of the storm had breathed over my path.

“O Lord! Thou knowest my down-sitting and mine uprising; Thou understandest my thoughts afar off, Thou compassest my path and my lying down, and art acquainted with all my ways.” Satisfied with such a fact, cheered by such a truth, animated by such a thought, you may unhesitatingly advance into the unknown history of another year; firm in the belief that Jesus will be faithful in fulfilling the promise, “I will bring the blind by a way that they knew not; I will lead them in paths that they have not known; I will make darkness light before them, and crooked things straight. These things will I do unto them, and not forsake them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Go and Tell Jesus</cite>, (75th edn, New York: A. D. F. Randolph &amp; Co., 1869), pp 23-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts</cite>, … (London: 1679), ch. 4, p. 89</span></figcaption>

</figure><figure class="quote" id="q-cb64ce6484" data-kw="">
<blockquote><p>Objection: But this case is unlike to that of liturgies. Answer: The Scripture is God’s own Word: A mistranslation makes that to be his Word that is not; which sure is a tenderer matter than in what words we speak our own minds to God. Sure [it is that] a depravation of Scripture is more [of a depravavation] than [that of] a ceremony: Were liturgies such an alteration of God’s own words, you would more plausibly accuse them. One that said, ‘God said this’ or that, which He said not, was worse than one that spake his own words indecently to God. To say, ‘This is God’s Word,’ which is not, is indeed adding to it [Prov. 30:6]; but so it is not to speak words as our own. How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence. But yet a word more: Question 1: Do you think that the Pharisees and scribes had so much of the gift of extemporary prayer that they could, and did use to make long prayers, as if it were by the spirit-extempore? Say so and you will disgrace the doctors’ arguments that lay so much on this manner of praying [by forms]. No doubt but it was forms and liturgies that they used; yet when Christ condemns them for praying in the streets to be seen and using long prayer for a pretence to devour widows’ houses:

2. Did Christ speak one word against them as forms or liturgies? Did He want [lack] zeal or knowledge?

3. Had they not been good in themselves, what cloak could they have made for so great evil?

4. Did Christ or his apostles ever forbear [abstain from] the synagogues for the sake of these long liturgies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Bad Translation &amp; Bad Liturgy</span></figcaption>

— Richard Baxter, Reformation &amp; Conformity, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Bad Translation &amp; Bad Liturgy">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection%3A+But+this+case+is+unlike+to+that+of+liturgies.+Answer%3A+The+Scripture+is+God%E2%80%99s+own+Word%3A+A+mistranslation+makes+that+to+be+his+Word+that+is+not%3B+which+sure+is+a+tenderer+matter+than+in+what+words+we+speak+our+own+minds+to+God.+Sure+%5Bit+is+that%5D+a+depravation+of+Scripture+is+more+%5Bof+a+depravavation%5D+than+%5Bthat+of%5D+a+ceremony%3A+Were+liturgies+such+an+alteration+of+God%E2%80%99s+own+words%2C+you+would+more+plausibly+accuse+them.+One+that+said%2C+%E2%80%98God+said+this%E2%80%99+or+that%2C+which+He+said+not%2C+was+worse+than+one+that+spake+his+own+words+indecently+to+God.+To+say%2C+%E2%80%98This+is+God%E2%80%99s+Word%2C%E2%80%99+which+is+not%2C+is+indeed+adding+to+it+%5BProv.+30%3A6%5D%3B+but+so+it+is+not+to+speak+words+as+our+own.+How+much+the+Septuagint+differs+from+the+Hebrew%2C+how+many+verses+it+leaves+out%2C+how+many+additions+and+alterations+it+makes%2C+is+commonly+known.+Christ%E2%80%99s+and+the+apostles%E2%80%99+use+of+this+was+no+approbation+of+its+faults%2C+much+less+their+presence+in+the+synagogues+when+others+read+Moses+and+the+prophets+in+them.+And+the+Psalms+in+the+Septuagint+translation+were+part+of+their+liturgy.+For+man+to+speak+faultily+is+no+wonder%3A+It+has+a+more+plausible+pretence+for+separation+to+say+that+men+corrupt+the+Word+of+God.+And+yet+when+it+is+but+such+an+effect+of+human+imperfection%2C+it+is+no+just+pretence.+But+yet+a+word+more%3A+Question+1%3A+Do+you+think+that+the+Pharisees+and+scribes+had+so+much+of+the+gift+of+extemporary+prayer+that+they+could%2C+and+did+use+to+make+long+prayers%2C+as+if+it+were+by+the+spirit-extempore%3F+Say+so+and+you+will+disgrace+the+doctors%E2%80%99+arguments+that+lay+so+much+on+this+manner+of+praying+%5Bby+forms%5D.+No+doubt+but+it+was+forms+and+liturgies+that+they+used%3B+yet+when+Christ+condemns+them+for+praying+in+the+streets+to+be+seen+and+using+long+prayer+for+a+pretence+to+devour+widows%E2%80%99+houses%3A+2.+Did+Christ+speak+one+word+against+them+as+forms+or+liturgies%3F+Did+He+want+%5Black%5D+zeal+or+knowledge%3F+3.+Had+they+not+been+good+in+themselves%2C+what+cloak+could+they+have+made+for+so+great+evil%3F+4.+Did+Christ+or+his+apostles+ever+forbear+%5Babstain+from%5D+the+synagogues+for+the+sake+of+these+long+liturgies%3F%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reformation+%26+Conformity%2C+Catholic+Communion+Doubly+Defended+by+Dr.+Owen%E2%80%99s+Vindicator+%26+Richard+Baxter%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+5%2C+%E2%80%98A+comparison+of+the+use+of+a+faulty+translation+of+the+Scripture+and+a+faulty+liturgy%E2%80%99+%7C+Bad+Translation+%26+Bad+Liturgy&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb64ce6484.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb64ce6484.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Objection%3A%20But%20this%20case%20is%20unlike,the%20sake%20of%20these%20long%20liturgies&amp;text=Objection%3A%20But%20this%20case%20is%20unlike%20to%20that&amp;text=synagogues%20for%20the%20sake%20of%20these%20long%20liturgies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

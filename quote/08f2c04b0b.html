<main class="wrap"><figure class="quote" id="q-08f2c04b0b" data-kw="">
<blockquote><p>But I fear the sense of this [said by antinomians], that ‘Christ repents for us, and obeys for us, He being the end of the Law to overy one that believes,’ be far otherwise, to wit, that Christ’s obedience of the Law, He being the end of the Law, as also his passive obedience is ours. If this be the intended sense, then: [1.] All our sanctification is nothing but the sanctification and holy active obedience of Christ. I yield this to be a broad, a fair and easy way to heaven. Christ does all for us [according to antinomians:], Christ weeped for my sins, and that is all the repentance required in me, if I believe that Christ was mortified and dead to the world for me, that is my mortification; and if I believe that the change of the whole man was truly in Christ, this is my true holiness: then my walking in holiness cannot be rewarded with life eternal, nor have any influence as a way or means leading to the kingdom.

2. Christ’s active obedience imputed to the sinner can be no evidence of justification, because it is in Christ, not in me; any evidence or mark of justification must be inherent in the believer, not in Christ.

3. And one and the same thing cannot be a mark and a sign of itself. Now the active obedience of Christ imputed to the sinner is holden [by antinomians] to be a part of justification [and therefore it cannot be a sign of justification].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 79</span></figcaption>

oksonline.com/the-active-obedience-of-christ#:~:text=But%20I%20fear%20the%20sense%20of,cannot%20be%20a%20sign%20of%20justification&amp;text=But%20I%20fear%20the%20sense%20of%20this%20%5Bsaid&amp;text=therefore%20it%20cannot%20be%20a%20sign%20of%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e7409ed15" data-kw="">

<blockquote><p>Crowe pays no attention at all to the historical debates,” – G.A. van den Brink . . Books 1600’s Walker, George – A Defense of the True Sense &amp; Meaning of the Words of the Holy Apostle, Rom. 4:3, 5, 9 in an Answer to Sundry Arguments Gathered from the Forenamed Scriptures by Mr. John Goodwin, together with a Reply to the Former Answer (1641) 56 pp. ToC Walker was a Westminster divine, who argues for Christ’s active righteousness being imputed in this work. Roborough, Henry – The Doctrine of Justification Cleared, by Animadversions on Mr. John Goodwin’s Animadversions Upon Mr. George Walker’s Defense of the True Sense of the Apostle, Rom. 4:3,5, etc. Together with an Examination of Both Parts of his Treatise of Justification: wherein the Imputation of Faith in a Proper Sense is Denied, &amp; the Imputation of Christ’s Righteousness, Active &amp; Passive, Affirmed, Against that Treatise (London: R.C., 1643) 221 pp. Roborough (d. 1649) was a non-voting scribe at the Westminster Assembly. John Goodwin was a prominent Arminian, though often considered a puritan. Roborough argues for Christ’s active righteousness being imputed in this work. See especially ‘Examination of Goodwin’s Conclusions’, ch. 5, ‘Wherein Scriptures are cleared, brought for the imputation of Christ’s active obedience with their true sense according to the judgment of the best expositors of the Protestant party’. Norton, John – A Discussion of that Great Point in Divinity, the Sufferings of Christ, &amp; the Question about his Righteousness-Active, Passive: &amp; the Imputation Thereof. Being an Answer to a Dialogue [of William Pynchon] entitled, The Meritorious Price of Redemption, Justification, etc. [1650], by John Norton, Teacher of the Church at Ipswich in New-England, who was Appointed to Draw up this Answer by the General Court (London, 1653) 270 pp. ToC Norton (1606-1663) was a puritan divine of England and New England. He argues for the imputation of Christ’s active obedience. Norton writes against William Pynchon (1590–1662), an influential New England settler who critiqued the puritan theology that surounded him and the nature of Christ’s satisfaction in an unique way in The Meritorious Price of Man’s Redemption… (1650; 1655). The book was burned on the Boston Common. The work argues that Christ’s obedience, rather than his punishment and suffering, was the price of atonement. Officials of the Massachusetts Bay Colony formally accused Pynchon of heresy and demanded that he retract its argument, which he did not. He moved back to England. The previously linked, later edition contains an appendix responding to Norton’s charges of heresy. . 2000’s McCormick, Micah – The Active Obedience of Jesus Christ PhD diss. (Southern Baptist Theological Seminary, 2010) 380 pp. Abstract: “Chapter 1 defines the doctrine, surveys previous literature, offers warrant for the work, and previews the argument of the work. In short, the thesis of this work is that the active obedience of Christ is a biblical doctrine. Chapter 2 presents a historical survey, tracing theologians from the early church up to the present time to see the development of the doctrine. Special attention is given to the Reformation and Post-Reformation eras, during which the doctrine received its primary development. Chapter 3 examines God’s original arrangement with Adam…. Chapter 4 examines human obedience after the Fall. Looking especially at the “do this and live” passages, this chapter argues that God requires perfect obedience from humans in order to gain eternal life. Chapter 5 traces the OT’s presentation of the need for a Messiah to come who would represent his people in perfect obedience… Chapter 6… Beginning with the Gospels and moving on to the rest of the NT, this chapter shows that Christ represented his people in perfect obedience throughout the whole course of his earthly mediation. Chapter 7 first offers a systematic formulation of the doctrine. This chapter then answers some of the major objections put to the doctrine of Christ’s active obedience, examining the views of opponents both ancient and contemporary. Chapter 8 summarizes the work…</p></blockquote>

th+Adam%E2%80%A6.+Chapter+4+examines+human+obedience+after+the+Fall.+Looking+especially+at+the+%E2%80%9Cdo+this+and+live%E2%80%9D+passages%2C+this+chapter+argues+that+God+requires+perfect+obedience+from+humans+in+order+to+gain+eternal+life.+Chapter+5+traces+the+OT%E2%80%99s+presentation+of+the+need+for+a+Messiah+to+come+who+would+represent+his+people+in+perfect+obedience%E2%80%A6+Chapter+6%E2%80%A6+Beginning+with+the+Gospels+and+moving+on+to+the+rest+of+the+NT%2C+this+chapter+shows+that+Christ+represented+his+people+in+perfect+obedience+throughout+the+whole+course+of+his+earthly+mediation.+Chapter+7+first+offers+a+systematic+formulation+of+the+doctrine.+This+chapter+then+answers+some+of+the+major+objections+put+to+the+doctrine+of+Christ%E2%80%99s+active+obedience%2C+examining+the+views+of+opponents+both+ancient+and+contemporary.+Chapter+8+summarizes+the+work%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Brandon+Crowe%2C+%E2%80%98The+Passive+%26+Active+Obedience+of+Christ%3A+Retrieving+a+Biblical+Distinction%E2%80%99+in+The+Doctrine+on+which+the+Church+Stands+or+Falls%2C+ed.+Matthew+Barrett+%28Wheaton%3A+Crossway%2C+2019%29%2C+pp.+441%E2%80%9368&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96e718dfb0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96e718dfb0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Crowe%20pays%20no%20attention%20at%20all,contemporary.%20Chapter%208%20summarizes%20the%20work&amp;text=Crowe%20pays%20no%20attention%20at%20all%20to%20the&amp;text=ancient%20and%20contemporary.%20Chapter%208%20summarizes%20the%20work" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>

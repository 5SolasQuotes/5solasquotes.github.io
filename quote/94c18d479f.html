<blockquote><p>The second main difference is this, namely, that the Covenant of works is made without a Mediator, to mediate between God and man. But in the Covenant of grace there is a Mediator coming between, to unite God and man together, and make them one. Hence Heb. 9.15. Christ is called the Mediator of the new Testament; so also Heb. 12.24. but the first Covenant of works had no Mediator. The reason of this difference is, because when God came to make a covenant of works with Adam, then there was no disagreement between God and man, man was yet righteous, persisting in that innocency and righteousness in which he was created, there was yet no breach made, the heart and mind of man answering to the mind of God, and therefore there was no need of a Mediator to bring them together;

But when the Covenant of grace is made with man, there is a former breach between God and him, and so there is need of a third party, of a Mediator to make them one. Hence is that in Gal. 3.20. A Mediator is not a Mediator of one; whiles we are one with God, there is no need of a Mediator, no more then there is need for one to mediate between a man and himself, (this is the ordinary interpretation of that place, though it may probably bear another sense) and so it was betwixt God and man in the beginning, there was no variance then between them by sin, then God made a Covenant with man, as with his friend, as Abraham is called the friend of God, but when sin had made a breach between God and man, then strangeness and enmity followed, God is estranged from us, and we are enemies unto God, so that without a Mediator, we can never come to be united into Covenant again.

Now man fears and trembles to come before God, and God being offended, cannot be at peace, unless his Justice be satisfied; Therefore when Adam had once sinned, he feared to come into the presence of God, and hid himself, till God revealed and made known to him the Mediator of the Covenant, that the Seed of the woman should break the Serpent’s head.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e02cb66de" data-kw="">
<blockquote><p>Others with my self hold that there is but two Covenants, the one a Covenant of Works, and the tree of life, was a Sacrament or sign and token of it, this was made with Adam before his fall and to all his posterity who come under it as soon as they take upon them his nature, for he did bear an Image for himself and all his posterity, so that if he had stood in his integrity he had conveyed his righteousness and holiness to all his posterity, and when he by sin defiled his nature, the whole race of mankind was polluted by him, and also he received a Covenant both for himself and all his posterity, and in case he had been faithful to it, all his posterity had stood with him, but he breaking that Covenant brought not only guilt upon himself but upon all his posterity with him, so that now there is none clean, no not one; how can he be clean that is born of a woman? Job 25:4. thus man’s nature is polluted.

And in regard of the Covenant, let every mouth be stopped, for all the world is become guilty before God, Rom. 3:29. for all have sinned and come short of the glory of God, Rom. 3:23. by one man sin entered into the world, and death by sin, and so death passed upon all men for that all have sinned, Rom. 5:12. so then all men by nature lie under the pollution and guilt of Adam’s sin, and liable to all the curses and penalties due unto them for breach of that Covenant.

But then there was a Covenant of grace which God the Father made with Jesus Christ from all eternity to save some of the posterity of Adam, and had not this Covenant been prepared ready against the fall of Adam to take place at the very moment of his fall, the Justice of God had immediately seized upon the whole Creation under Heaven, and consumed them to their first nothing, but then came Jesus Christ with the covenant in his hand saying, be gracious unto him, and deliver him from going down to the pit, I have found a ransom, Job 33:24. … the covenant of grace was made with Jesus Christ from all eternity, being a contract or plot of God the Father with God the Son from all eternity as mediator for the salvation of the Elect.</p></blockquote>

<blockquote><p>First Prop. If we had fulfilled the conditions of the first covenant, we should, by what we did, have obtained eternal life and blessedness.

Man was not made naturally immortal or incapable of death. Every creature is capable of death, and therefore we are told that God only hath immortality (1 Timothy 6:16). Indeed, man when he was first created had no seeds of corruption and death in his nature, no principle of decay that tended gradually to bring him again to the dust, but yet he was not incapable of dying. He was capable of both temporal and eternal death.

This matter therefore must be as God should dispose, whether he should die or live forever. God was not pleased absolutely to promise this to man when he first created him, but he gave him a trial for it. He promised implicitly that if he would approve himself perfectly obedient to Him, after a due time he should have eternal life and blessedness made sure to him.

Though his living forever as yet was not certain to him, yet God gave him a fair opportunity to have it made sure to him afterwards. It depended only on his own fidelity to his Creator. He had a fair opportunity after a while of being called to the tree of life, and so having everlasting life sealed to him, and be put out of all possibility of ever dying either eternally or temporally and, withal, of receiving a great addition of happiness.

Man in the state wherein he was created was in a very happy condition in paradise, as we have already shown. But doubtless, if he had stood, he would have been advanced to a much greater happiness. ‘Tis most reasonable to suppose that the blessedness he enjoyed even while in a state of trial shouldn’t be so great as after he had done his work and come to receive his reward. He now enjoyed life, but if he had stood he would have been called to the tree of life to eat of that, and his life should not only have been ascertained to him forever, but he would have advanced to a higher degree of life.

Eternal life was then, as it is now, the great promise of God. It was the promise of the covenant of works as well as the covenant of grace. And as eternal life don’t now, so it did not then, only denote a continuance of man’s life forever so that he should never die, but it denotes a most glorious and blessed life.

If Adam had stood, the tree of life would have been a tree of life to him these two ways, viz. as upon the eating of it after his trial he was to have a living forever ascertained to him, and was also to be exalted to a more glorious and blessed life.

His time of trial would not have lasted always. After a due time, if man had stood, he was to be confirmed then, and man would have [been] put beyond all possibility of falling. Not beyond a natural possibility—no creature ever was or ever will be naturally impeccable or naturally incapable of sinning—but God would have become engaged for his never sinning or dying, as we have all reason now to conclude that it is with the angels. They had a time of probation as well as man, as is evident because some of ’em fell. But the angels of light are now past their probation and are in a state of confirmed holiness and blessedness.

We have no account how long man was to have been tried before he was to be confirmed, and ’tis not probable that God revealed that to man. But if he proved obedient, after a due time he was to have eat of the tree of life.

The tree of life was a tree that God planted with the rest of the garden, that man might be the more assured of his reward in case of his obedience, and that this consideration might engage his spirit the more earnestly to seek that he might come to taste of it. ‘Tis probable that God told Adam of this tree to encourage his obedience. He might tell him in earnest that man had an opportunity of obtaining the fruit of this tree, and that eternal life and blessedness of which it was a seal, by what he himself did; an obtaining of this blessed reward was in his power.

It was in man’s own power perfectly to obey the law of God, which is not in our power now since the fall, as it was more in man’s power perfectly to obey the law and persevere in it then, than it is for fallen man to perform one act of sincere obedience. And that, upon two accounts, viz.

1. As he had no sin then that he was under the power and dominion of. We can’t obey now because we are dead in trespasses; Ephesians 2:1, “and you hath he quickened, who were dead in trespasses and sins.” We are stones; our hands are pinioned by strong lusts. But our first parents, they were free, not under any such bondage.

2. Adam had a sufficient assistance of God always present with him to have enabled him to have obeyed if he had used his natural abilities in endeavouring it, as he might do, though the assistance was not such as it would have been after he was confirmed to render it impossible for him to sin. Man might be deceived so that he should not be disposed to use his endeavours to persevere, but if he did use his endeavours, there was a sufficient assistance always with him to enable him to persevere. So that man had a very fair opportunity of obtaining eternal life and blessedness under the first covenant, and it was in his power to obtain it by what he did himself.</p></blockquote>

of+his+obedience%2C+and+that+this+consideration+might+engage+his+spirit+the+more+earnestly+to+seek+that+he+might+come+to+taste+of+it.+%E2%80%98Tis+probable+that+God+told+Adam+of+this+tree+to+encourage+his+obedience.+He+might+tell+him+in+earnest+that+man+had+an+opportunity+of+obtaining+the+fruit+of+this+tree%2C+and+that+eternal+life+and+blessedness+of+which+it+was+a+seal%2C+by+what+he+himself+did%3B+an+obtaining+of+this+blessed+reward+was+in+his+power.%0A%0AIt+was+in+man%E2%80%99s+own+power+perfectly+to+obey+the+law+of+God%2C+which+is+not+in+our+power+now+since+the+fall%2C+as+it+was+more+in+man%E2%80%99s+power+perfectly+to+obey+the+law+and+persevere+in+it+then%2C+than+it+is+for+fallen+man+to+perform+one+act+of+sincere+obedience.+And+that%2C+upon+two+accounts%2C+viz.%0A%0A1.+As+he+had+no+sin+then+that+he+was+under+the+power+and+dominion+of.+We+can%E2%80%99t+obey+now+because+we+are+dead+in+trespasses%3B+Ephesians+2%3A1%2C+%E2%80%9Cand+you+hath+he+quickened%2C+who+were+dead+in+trespasses+and+sins.%E2%80%9D+We+are+stones%3B+our+hands+are+pinioned+by+strong+lusts.+But+our+first+parents%2C+they+were+free%2C+not+under+any+such+bondage.%0A%0A2.+Adam+had+a+sufficient+assistance+of+God+always+present+with+him+to+have+enabled+him+to+have+obeyed+if+he+had+used+his+natural+abilities+in+endeavouring+it%2C+as+he+might+do%2C+though+the+assistance+was+not+such+as+it+would+have+been+after+he+was+confirmed+to+render+it+impossible+for+him+to+sin.+Man+might+be+deceived+so+that+he+should+not+be+disposed+to+use+his+endeavours+to+persevere%2C+but+if+he+did+use+his+endeavours%2C+there+was+a+sufficient+assistance+always+with+him+to+enable+him+to+persevere.+So+that+man+had+a+very+fair+opportunity+of+obtaining+eternal+life+and+blessedness+under+the+first+covenant%2C+and+it+was+in+his+power+to+obtain+it+by+what+he+did+himself.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+East+of+Eden%2C+%281731%29+in+Mark+Valeri+%28ed.%29%2C+Sermons+and+Discourses%2C+1730-1733%3A+The+Works+of+Jonathan+Edwards+Vol <blockquote><p>…the problem of the promises given under the covenant of works and the meaning of the “life” promised to Adam in return for obedience – perpetual, yes, but would it be heavenly or earthly? The[re was a] fairly radical disagreement on the issue between such eminent thinkers as Thomas Goodwin, John Cameron, Moise Amyraut, John Ball, and Johannes Marckius on the side of an earthly reward, and Francis Turretin, J.H. Heidegger, the Formula Consensus Helvetica, Thomas Boston and Thomas Ridgley on the side of a heavenly reward.</p></blockquote>

</figure><figure class="quote" id="q-7f6f7dd38c" data-kw="">
<blockquote><p>With regard to the covenant itself, we must observe, what was the duty required by God; what was the promise made to the performance of that duty; what was the threat denounced against the neglect of it. Now the duty consisted in all that knowledge of God which could be derived from contemplating the divine work, and from revelation, as much as could be acquired by a perfectly upright mind; but especially in obedience to the law of God, both the natural law, which was engraven on man’s heart, and any special commandments, which God might choose to impose (such as was the command to abstain from the fruit of the tree of the knowledge of good and evil;) in short, such an obedience was required, as was true and sincere (having respect not merely to some, but to all and each of God’s commands) constant and persevering, perfect and complete in all its parts. Moreover, man had sufficient power given him by his Creator to perform this obedience. The threatening denounced against the neglect of this obedience, was death, (Gen. 2:17,) by which we understand the death of the body, (Gen. 3:19,) together with all the miseries and calamities of life preceding; the death of the soul, on its separation from God, and from communion with him, (Ephes. 3:1,) and eternal death, consisting of the most dreadful torments both of soul and body. With regard to the promise of the covenant, though it is not expressly laid down, it is sufficiently clear from the threatening of death, which is opposed to it; for although God owes nothing to his creature, yet as the whole scripture sets him forth to us as slow to anger and abundant in mercy, it is not at all probable, that God denounced upon man the threat of eternal punishment, and at the same time gave him no promise. But if any one wonder why God should speak about punishment, and be silent concerning reward, we may give this as the probable reason of it, viz. that innocent Adam needed to have distinct mention made to him both of sin forbidden, and of death its consequence, seeing that in his upright state he was ignorant of death and sin, but it was not so necessary to make mention to him of the life which was to be bestowed upon him, on condition of his persevering in holiness; for he already enjoyed a most blessed life, from which he could very easily judge of the life that was to come. We must therefore form a judgment of the reward, from the punishment, and therefore, as the former comprehended all evil, especially eternal death, so the latter contained all that was good, particularly eternal life, and the most intimate communion with God in unchangeable holiness. This is further confirmed from the covenant of nature being the same as the covenant of works, as we shall see hereafter. Now the covenant of works promised eternal life, saying, “Do this, and live.</p></blockquote>

<blockquote><p>Question: Where do the natural knowledge of God and morality originate?

Answer: They do not originate from a new gift which God bestowed upon man after he lost the image of God. There is not a word in Scripture to suggest this. Reason neither teaches this, nor does necessity require it. It is also not a remnant of the image of God in its narrower sense, which consists of spiritual knowledge, righteousness, and holiness. It is a remnant, however, of the image of God in its wider sense, as far as this refers to the subject or essence of the image of God itself. In order to understand this correctly one must consider what the image of God actually is as well as what belongs to it. At the appropriate place these matters shall be discussed more extensively.

(1) Man was not first created in puris naturalibus, that is, he was not created as a purely natural and rational person, having no more than the five senses along with the instant ability to reason, the image of God being impressed upon him subsequent to his creation. It is my opinion that man would not have been truly man if the consciousness of God had not been present from the very outset. Rather, man was created in, and in possession of, the image of God. God, in creating man, created him in His image, generating this image in the very act of creating (Genesis 1:27). The existence of sensitivity as well as the capability for growth, both of which are inherent in the life of animals and vegetation, do not function as components united within a larger entity, but virtualiter et efficaciter, that is, by virtue of innate ability and propensity. The rational soul is also similarly capable of reasoning.

Thus, in a similar manner the image of God contains within itself both the natural knowledge of God and morality. These are not individual entities; neither do they coexist as components of a larger entity, as if in Adam there were a distinction between a knowledge of God and morality which would be of a natural sort, and a spiritual knowledge of the same which would be the image of God. Adam possessed these by virtue of innate ability and propensity. The image of God permeated everything and energized all faculties and motions of the soul; hence all that was within him and was performed by him was spiritual and holy in nature.

(2) Even though the image of God in Adam was indivisible, one can nevertheless distinguish three matters by way of intellectual deduction: 1) its basis or focal point, 2) its nature or essence, and 3) its consequence or purpose. The focal point of the image of God was the soul which is an invisible, immortal spirit, endowed with intellect, a will, and affections. The essence was spiritual knowledge, righteousness, and holiness. The consequence or purpose of the image of God was his glorious position and his exercise of dominion over the animal kingdom.

In reference to the focal point the following must be noted, which when properly understood will answer the initial question and eliminate much confusion concerning this matter. An artist cannot impress someone‟s image upon water or sand. To accomplish this he must have the appropriate base or medium. Similarly, the image of God could not have been impressed upon wood, stone, or an irrational creature. It required an intelligent, willing, rational soul, and a consciousness of God. The soul in Adam could not be separated from the image of God in its narrow sense, as the image of God permeated and energized the entire soul. We are merely making an intellectual deduction here.

As a result of Adam’s fall, the image of God in its narrow sense, consisting of spiritual knowledge, righteousness, and holiness, has been entirely removed from all the faculties and propensities of the soul. Nevertheless, Adam did not lose his human nature. He retained the soul in its essence and propensity, consisting of intelligence, will, disposition, reason, and consciousness of God. The consciousness of God is as natural to man as his ability to reason. This ability is at all times common to man, and to man only.

One can therefore state this in reverse: every human being is conscious of a deity, and a being which is conscious of a deity is necessarily a human being. Yes, by virtue of his consciousness of God[,] man distinguishes himself even further and more clearly from animals than by his ability to reason. In some animals one can discern a trace or semblance of the ability to reason, although such animals are not consciously aware of their activity. The impression of the existence of a deity is entirely absent and cannot be taught. Man’s consciousness of God is innate, however. Even if someone no longer manifests any evidence of this, it does not require many hours, for example, to bring the most savage heathen to an acknowledgement of it, which proves that such is his natural propensity. The consciousness of deity, viewed here as a propensity rather than the act itself, is not a remnant of the image of God in its narrower sense which consists of spiritual knowledge, righteousness, and holiness.

To insist otherwise would create unsolvable difficulties. It is, however, possible to state that it is a remnant of the image of God in its wider sense, which includes the previously mentioned faculties of the soul, and those only. It therefore belongs to the essential nature of man, so that the natural consciousness of God, as well as the natural morality which proceeds from it, do not merely differ in degree from the essential elements of the image of God—that is, spiritual knowledge, righteousness, and holiness—but they differ in their very nature.</p></blockquote>

<blockquote><p>What is the purpose of human existence? Both Christianity and classical philosophy in the Platonic and Aristotelian traditions answer that our highest end is to know God. But there is, according to Roman Catholic theology, a crucial difference between the knowledge of God that philosophy makes possible, and the kind that Christian revelation promises. Unaided human reason can establish that there exists a divine first cause of the world. It can infer God’s unity, perfect goodness, omnipotence, omniscience, and many other divine attributes. But it cannot afford us a direct (as opposed to merely inferential) knowledge of God’s very essence or nature. For example, it cannot reveal the Trinitarian inner life of God as three divine Persons. The direct apprehension of God’s essence is known as the beatific vision, and Catholic teaching holds that it is not something we are naturally capable of. Attaining it requires grace or supernatural assistance in the sense of special divine action to raise us above or beyond (hence the prefix “super-”) what our nature makes possible. Since it is not an end we are naturally capable of achieving, neither is it an end we are by nature made for. Rather, it is a supernatural end (again, in the sense of above or beyond our nature), to which God has graciously raised us. By nature alone we are aimed only toward an incomplete knowledge of God, such as the kind that philosophy provides. By grace we are directed toward the most intimate knowledge of him that is possible for a created thing. I have left out various nuances and details… On one side [of the 20th century Romanist debate] were Thomist theologians (that is to say, followers of St. Thomas Aquinas) such as Reginald Garrigou-Lagrange (1877–1964), who developed and defended the account just summarized. … …human beings are not, by nature, completely closed off to the beatific vision. They do by nature have what is called an “obediential potency” for it, a built-in capacity to have a supernatural end added to them. But Hart [who is Eastern Orthodox] dismisses this notion as doubletalk. If we really have such a capacity, he says, then this would after all amount to a natural orientation toward the beatific vision; whereas if it would not amount to that, then we are back to the problem that, by raising us to that end, God would be replacing us with some other kind of creature rather than transforming us. The notion of an “obediential potency” is supposed to be a middle ground between these options, but, Hart insists, there is no such middle ground. Yet that Hart is wrong about this is clear even from simple analogies drawn from everyday modern life. Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories (via download, or through USB and HDMI ports and the like)—including, if it is old enough, some that had not even been invented at the time the computer was designed and manufactured. Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them. Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice. Now, like other critics of the Thomist position, Hart insists that an orientation toward the supernatural end of the beatific vision is natural to us. Taken at face value, this is simply incoherent. If an orientation toward a certain end really is natural to us, then it makes no sense to describe it as supernatural (that is to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.</p></blockquote>

al potency” for it, a built-in capacity to have a supernatural end added to them. But Hart [who is Eastern Orthodox] dismisses this notion as doubletalk. If we really have such a capacity, he says, then this would after all amount to a natural orientation toward the beatific vision; whereas if it would not amount to that, then we are back to the problem that, by raising us to that end, God would be replacing us with some other kind of creature rather than transforming us. The notion of an “obediential potency” is supposed to be a middle ground between these options, but, Hart insists, there is no such middle ground. Yet that Hart is wrong about this is clear even from simple analogies drawn from everyday modern life. Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories (via download, or through USB and HDMI ports and the like)—including, if it is old enough, some that had not even been invented at the time the computer was designed and manufactured. Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them. Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice. Now, like other critics of the Thomist position, Hart insists that an orientation toward the supernatural end of the beatific vision is natural to us. Taken at face value, this is simply incoherent. If an orientation toward a certain end really is natural to us, then it makes no sense to describe it as supernatural (that is to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.”

gou-Lagrange+%281877%E2%80%931964%29%2C+who+developed+and+defended+the+account+just+summarized.+%E2%80%A6+%E2%80%A6human+beings+are+not%2C+by+nature%2C+completely+closed+off+to+the+beatific+vision.+They+do+by+nature+have+what+is+called+an+%E2%80%9Cobediential+potency%E2%80%9D+for+it%2C+a+built-in+capacity+to+have+a+supernatural+end+added+to+them.+But+Hart+%5Bwho+is+Eastern+Orthodox%5D+dismisses+this+notion+as+doubletalk.+If+we+really+have+such+a+capacity%2C+he+says%2C+then+this+would+after+all+amount+to+a+natural+orientation+toward+the+beatific+vision%3B+whereas+if+it+would+not+amount+to+that%2C+then+we+are+back+to+the+problem+that%2C+by+raising+us+to+that+end%2C+God+would+be+replacing+us+with+some+other+kind+of+creature+rather+than+transforming+us.+The+notion+of+an+%E2%80%9Cobediential+potency%E2%80%9D+is+supposed+to+be+a+middle+ground+between+these+options%2C+but%2C+Hart+insists%2C+there+is+no+such+middle+ground.+Yet+that+Hart+is+wrong+about+this+is+clear+even+from+simple+analogies+drawn+from+everyday+modern+life.+Consider+the+laptop+computer+on+which+you+might+be+reading+this.+There+is+an+obvious+sense+in+which+it+is+complete+all+by+itself%2C+with+its+operating+system%2C+other+software+installed+in+the+factory%2C+built-in+Wi-Fi+capability%2C+and+so+on.+Yet+it+has+the+capacity+to+have+added+to+it+all+sorts+of+new+software+and+accessories+%28via+download%2C+or+through+USB+and+HDMI+ports+and+the+like%29%E2%80%94including%2C+if+it+is+old+enough%2C+some+that+had+not+even+been+invented+at+the+time+the+computer+was+designed+and+manufactured.+Since+software+and+accessories+of+the+latter+sort+were+not+even+in+view+when+the+computer+was+designed%2C+they+cannot+be+said+to+be+ends+for+which+the+computer+was+made.+All+the+same%2C+they+are+ends+that+might+be+added+to+it%2C+because+it+does+at+least+have+the+inherent+capacity+to+have+such+ends+added+to+it.+This+is+analogous+to+the+notion+of+an+%E2%80%9Cobediential+potency%2C%E2%80%9D+and+it+indicates+the+sense+in+which+there+is+indeed+a+middle+ground+of+just+the+sort+Hart+claims+is+impossible.+In+what+Thomists+call+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+human+beings+would+not+have+the+beatific+vision+as+an+end+to+which+they+are+directed%2C+any+more+than+a+computer+is+oriented+toward+running+some+application+that+did+not+even+exist+when+it+was+manufactured.+But+just+as+a+computer+does+nevertheless+have+a+capacity+to+have+such+applications+added+to+it%2C+so+too+are+human+beings+made+in+such+a+way+that+an+orientation+toward+the+beatific+vision+might+be+imparted+to+them.+Hart%E2%80%99s+second+main+objection+is+that+any+rational+creature+would%2C+just+by+virtue+of+being+rational%2C+desire+to+know+the+very+essence+of+the+first+cause+of+all+things%2C+so+that+such+knowledge+would+be+its+natural+end.+There+is+a+sense+in+which+the+premise+is+true%2C+but+the+conclusion+does+not+follow.+To+borrow+an+example+from+the+philosopher+Thomas+Nagel%2C+consider+that+there+is+an+obvious+sense+in+which+a+human+being+might+desire+to+know+what+it+is+like+to+be+a+bat%E2%80%94to+fly+through+the+air+the+way+a+bat+does%2C+to+get+around+via+echolocation%2C+and+so+on.+Yet+there+is+also+an+obvious+sense+in+which+it+is+simply+not+part+of+our+nature+to+do+these+things%2C+so+that+human+beings+can+live+complete+lives+as+the+kind+of+creatures+we+are+without+doing+them.+For+that+reason%2C+our+curiosity+about+what+it+is+like+to+be+a+bat+does+not+entail+a+sense+of+deprivation+or+loss+in+the+way+that%2C+say%2C+a+missing+limb+would.+In+an+analogous+way%2C+had+human+beings+been+created+in+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+without+a+divinely+imparted+orientation+toward+the+supernatural+end+of+the+beatific+vision%2C+they+might+in+a+sense+nevertheless+wish+that+they+could+have+a+direct+knowledge+of+God%E2%80%99s+very+essence.+But+they+would+also+judge+that+this+is+simply+no+more+possible+for+them+than+it+is+possible+for+them+to+know+what+it+is+like+to+be+a+bat%2C+and+thus+they+would+not+feel+this+impossibility+as+a+deprivation+of+something+they+were+by+nature+made+for.+The+indirect+knowledge+of+God+that+they+are+capable+of+would+suffice.+Now%2C+like+other+critics+of+the+Thomist+position%2C+Hart+insists+that+an+orientation+toward+the+supernatural+end+of+the+beatific+vision+is+natural+to+us.+Taken+at+face+value%2C+this+is+simply+incoherent.+If+an+orientation+toward+a+certain+end+really+is+natural+to+us%2C+then+it+makes+no+sense+to+describe+it+as+supernatural+%28that+is+to+say%2C+beyond+our+nature%29.+Or%2C+if+it+really+is+supernatural%2C+then+it+makes+no+sense+to+describe+it+as+natural.+However%2C+in+fairness+to+Hart%2C+I+don%E2%80%99t+think+he+is+actually+guilty+of+this+particular+sort+of+incoherence.+In+order+to+be+guilty+of+it%2C+you+have+to+acknowledge+that+there+really+is+a+distinction+in+reality+between+the+natural+order+and+the+supernatural+order.+Catholic+thinkers+like+de+Lubac+do+acknowledge+this%2C+which+is+why+it+is+difficult+for+them+to+formulate+a+coherent+alternative+to+the+Thomist+position.+But+Hart+does+not+acknowledge+it.+He+insists+on+collapsing+the+distinctions+between+natural+and+supernatural%2C+between+nature+and+grace%2C+and+between+God%E2%80%99s+creating+us+and+his+orienting+us+to+the+beatific+vision.+And+this+is+where+his+position+becomes+truly+radical%E2%80%94indeed%2C+as+I+have+said%2C+pantheistic.+To+understand+how+and+why+Hart+goes+in+the+extreme+direction+he+does%2C+it+is+useful+to+note+that+one+of+the+motivations+for+the+Thomist+position+he+rejects+is+the+thesis+that+the+vision+of+God%E2%80%99s+very+essence+is+natural+only+to+God+himself%2C+and+not+to+any+created+thing+%28as+Aquinas+says+in+Question+27%2C+Article+2+of+De+Veritate%29.+This+implies+that+to+attribute+to+human+beings+a+natural+capacity+to+know+God%E2%80%99s+very+essence+would+be+to+identify+them+with+God.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98David+Bentley+Hart%E2%80%99s+Post-Christian+Pantheism%E2%80%99%2C+%282022%29+at+Public+Discourse&amp;url=https%3A%2F%2F5solasquotes.github. <blockquote><p>The law of the Lord. Here the second part of the psalm commences. After having shown that the creatures, although they do not speak, nevertheless serve as instructors to all mankind, and teach all men so clearly that there is a God, as to render them inexcusable, the Psalmist now turns towards the Jews, to whom God had communicated a fuller knowledge of himself by means of his word. While the heavens bear witness concerning God, their testimony does not lead men so far as that thereby they learn truly to fear him, and acquire a well-grounded knowledge of him; it serves only to render them inexcusable. It is doubtless true, that if we were not very dull and stupid, the signatures and proofs of Deity which are to be found on the theatre of the world, are abundant enough to incite us to acknowledge and reverence God; but as, although surrounded with so clear a light, we are nevertheless blind, this splendid representation of the glory of God, without the aid of the word, would profit us nothing, although it should be to us as a loud and distinct proclamation sounding in our ears.

Accordingly, God vouchsafes to those whom he has determined to call to salvation special grace, just as in ancient times, while he gave to all men without exception evidences of his existence in his works, he communicated to the children of Abraham alone his Law, thereby to furnish them with a more certain and intimate knowledge of his majesty. Whence it follows, that the Jews are bound by a double tie to serve God. As the Gentiles, to whom God has spoken only by the dumb creatures, have no excuse for their ignorance, how much less is their stupidity to be endured who neglect to hear the voice which proceeds from his own sacred mouth? The end, therefore, which David here has in view, is to excite the Jews, whom God had bound to himself by a more sacred bond, to yield obedience to him with a more prompt and cheerful affection.

Farther, under the term law, he not only means the rule of living righteously, or the Ten Commandments, but he also comprehends the covenant by which God had distinguished that people from the rest of the world, and the whole doctrine of Moses, the parts of which he afterwards enumerates under the terms testimonies, statutes, and other names. These titles and commendations by which he exalts the dignity and excellence of the Law would not agree with the Ten Commandments alone, unless there were, at the same time, joined to them a free adoption and the promises which depend upon it; and, in short, the whole body of doctrine of which true religion and godliness consists.

As to the Hebrew words which are here used, I will not spend much time in endeavouring very exactly to give the particular signification of each of them, because it is easy to gather from other passages, that they are sometimes confounded or used indifferently. עדות, eduth, which we render testimony, is generally taken for the covenant, in which God, on the one hand, promised to the children of Abraham that he would be their God, and on the other required faith and obedience on their part. It, therefore, denotes the mutual covenant entered into between God and his ancient people. The word פקודים, pikkudim, which I have followed others in translating statutes, is restricted by some to ceremonies, but improperly in my judgment: for I find that it is every where taken generally for ordinances and edicts. The word מצוה, mitsvah, which follows immediately after, and which we translate commandment, has almost the same signification.</p></blockquote>

s+from+his+own+sacred+mouth%3F+The+end%2C+therefore%2C+which+David+here+has+in+view%2C+is+to+excite+the+Jews%2C+whom+God+had+bound+to+himself+by+a+more+sacred+bond%2C+to+yield+obedience+to+him+with+a+more+prompt+and+cheerful+affection.%0A%0AFarther%2C+under+the+term+law%2C+he+not+only+means+the+rule+of+living+righteously%2C+or+the+Ten+Commandments%2C+but+he+also+comprehends+the+covenant+by+which+God+had+distinguished+that+people+from+the+rest+of+the+world%2C+and+the+whole+doctrine+of+Moses%2C+the+parts+of+which+he+afterwards+enumerates+under+the+terms+testimonies%2C+statutes%2C+and+other+names.+These+titles+and+commendations+by+which+he+exalts+the+dignity+and+excellence+of+the+Law+would+not+agree+with+the+Ten+Commandments+alone%2C+unless+there+were%2C+at+the+same+time%2C+joined+to+them+a+free+adoption+and+the+promises+which+depend+upon+it%3B+and%2C+in+short%2C+the+whole+body+of+doctrine+of+which+true+religion+and+godliness+consists.%0A%0AAs+to+the+Hebrew+words+which+are+here+used%2C+I+will+not+spend+much+time+in+endeavouring+very+exactly+to+give+the+particular+signification+of+each+of+them%2C+because+it+is+easy+to+gather+from+other+passages%2C+that+they+are+sometimes+confounded+or+used+indifferently.+%D7%A2%D7%93%D7%95%D7%AA%2C+eduth%2C+which+we+render+testimony%2C+is+generally+taken+for+the+covenant%2C+in+which+God%2C+on+the+one+hand%2C+promised+to+the+children+of+Abraham+that+he+would+be+their+God%2C+and+on+the+other+required+faith+and+obedience+on+their+part.+It%2C+therefore%2C+denotes+the+mutual+covenant+entered+into+between+God+and+his+ancient+people.+The+word+%D7%A4%D7%A7%D7%95%D7%93%D7%99%D7%9D%2C+pikkudim%2C+which+I+have+followed+others+in+translating+statutes%2C+is+restricted+by+some+to+ceremonies%2C+but+improperly+in+my+judgment%3A+for+I+find+that+it+is+every+where+taken+generally+for+ordinances+and+edicts.+The+word+%D7%9E%D7%A6%D7%95%D7%94%2C+mitsvah%2C+which+follows+immediately+after%2C+and+which+we+translate+commandment%2C+has+almost+the+same+signification.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+Psalms%2C+%281557%29%2C+trans.+James+Anderson+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+4b%3A+317-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff50dc5bd73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f50dc5bd73.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/11/12/john-calvin-on-the-knowledge-of-god-from-nature-and-scripture/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-626fccc13c" data-kw="">
<blockquote><p>It is an indubitable truth that the light of nature gives considerable information, with respect to the knowledge of God and divine things. That there is a supreme Being on whom every other being in the universe is dependent; that he is eternal, infinite in wisdom, power, goodness and justice, in a word, possessed of absolute perfection; that by him all things were at first created and are continually governed; that the affairs of mankind are, in a particular manner, the object of his attention; that there are laws of nature by which we are enabled to distinguish the difference betwixt just and unjust; finally, that the souls of men are immortal, and that there is a future state of rewards and punishment, all these truths are pretty clearly discovered by the light of nature. The heathens were not strangers to them, who had no other guide, with respect to such matters, but the aids derived from unassisted reason.</p></blockquote>

</figure><figure class="quote" id="q-7c1020566f" data-kw="">
<blockquote><p>What are the outward things which God has given to call us by? They are either common to the whole world, or proper to the Church. What are the things common to the whole world? God’s works not unprofitably given, although not sufficient to salvation. Is not the knowledge of the wisdom, power and goodness of God in the creation and government of the heaven and earth, with the things that are in them, sufficient to make us wise to salvation? No: First, it serves rather for further condemnation without the Word, Rom. 1:19-21. Secondly, as by and with the Word, the due meditation and consideration of God’s works is a good help to further us in religion and in the graces of God’s Spirit, 1 Cor. 1:21-22.</p></blockquote>

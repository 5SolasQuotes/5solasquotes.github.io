<blockquote><p>Let us therefore in all things believe the word of God delivered to us by the scriptures. Let us think that the Lord himself, who is the very living and eternal God, speaks to us by the scriptures.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

</figure><figure class="quote" id="q-a067c1d621" data-kw="">
<blockquote><p>When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Fathers of the Church, DXIX, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>
<div class="actions"><button class="copy" data-copy="“When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.”

— Martin Luther, Table Talk, Of the Fathers of the Church, DXIX, p. 297">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+God%27s+Word+is+by+the+Fathers+expounded%2C+construed%2C+and+glossed%2C+then%2C+in+my+judgment%2C+it+is+even+as+when+one+strains+milk+through+a+coal-sack%2C+which+must+needs+spoil+and+make+the+milk+black%3B+God%27s+Word+of+itself+is+pure%2C+clean%2C+bright+and+clear%3B+but%2C+through+the+doctrines%2C+books%2C+and+writings+of+the+Fathers%2C+it+is+darkened%2C+falsified%2C+and+spoiled.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Table+Talk%2C+Of+the+Fathers+of+the+Church%2C+DXIX%2C+p.+297&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa067c1d621.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a067c1d621.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9d87f1f662" data-kw="">
<blockquote><p>The student of Christian doctrine, because he strives after exactness of phrase, because he is conscious of the inadequacy of any one human formula to exhaust the truth, will be filled with sympathy for every genuine endeavour towards the embodiment of right opinion. Partial views attract and exist in virtue of the fragment of truth—be it great or small—which they include; and it is the work of the theologian to seize this no less than to detect the first spring of error. It is easier and, in one sense, it is more impressive to make a peremptory and exclusive statement, and to refuse to allow any place beside it to divergent expositions; but this show of clearness and power is dearly purchased at the cost of the ennobling conviction that the whole truth is far greater than our individual minds. He who believes that every judgement on the highest matters different from his own is simply a heresy must have a mean idea of the faith; and while the qualifications, the reserve, the lingering sympathies of the real student make him in many cases a poor controversialist, it may be said that a mere controversialist cannot be a real theologian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-f-westcott.html">B.F. Westcott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lessons from Work</cite>, pp. 84–85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>

</figure><figure class="quote" id="q-b016abb8db" data-kw="">
<blockquote><p>Reason 1. Because no man ought to separate himself from the true Church of Christ: Now such is an assembly professing the true faith, notwithstanding other corruption; for as holiness, if it might be supposed without true faith, cannot make a true Church, but false doctrine and error in the foundation overthrows it for being a Church: So e contra [from the contrary], corruptions in manners cannot make it no Church, when true faith is taught and maintained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary upon the Whole Prophesy of Malachi</cite>, (London: T.H., 1641), on ch. 1, verse 9, pp. 177</span></figcaption>

</figure><figure class="quote" id="q-2a0e5d748a" data-kw="">
<blockquote><p>Our brethren of Scotland writing against the tyranny of Prelates, when they were under it, in that book entitled, English and Popish Ceremonies [by Gillespie], have this passage: ‘If the error of conscience be about things unnecessary, then it is tutior pars, ‘the surest and safest way’ not to urge men to do that which in their consciences they condemn.’ And the ministers of the protestant Churches in France, giving their judgments, De pace inter Evangelicos procuranda, How Peace amongst the Protestants in Germany may be had, set forth by [John] Duraeus, say thus: ‘Let all matters controversal be brought into such a certain model as may give satisfaction to both parties; and that if it be possible, framed out of the very words of Scripture: and let no man require anything else of his brother.’ [Jerome] Zanchi, on the 4th Commandment, has this notable speech, ‘That which I say,’ says he: ‘is diligently to be observed, that those who would stir up princes to have all people, kingdoms, commonwealths which (not overthrowing the fundamentals of religion), differ from them in anything, condemned of heresy, excluded from friendship, driven out of their territories: these are no friends,’ says he, ‘either to their princes or to the Church of Christ.’ Many think they do great service to Christ, the Church and State, if they can stir up magistrates to suppress whatsoever they conceive are errors; it may be their hearts are upright in the main, they aim at peace, but certainly they cause much disturbance in Church and State. Bishop [John] Davenant in a little book entitled his, Exhortation to Brotherly Love amongst Churches, the ninth chapter, has this title: ‘That brotherly communion between Churches evangelical is not to be cut asunder because of diverse opinions about questions controversial.’ And in the beginning of the 10th chapter: ‘This is to be premised: The bonds of the brotherly communion of Christian Churches ought not to be dissolved upon every difference of opinions, but only for the denying or opposing fundamentals.’ Here see the moderation of a prelate. Thus Cyprian of old delivered his opinion and practised it accordingly, differing from many of his brethren, but withal professes: That he meant not to prescribe or give laws to any, that he would not contend with any of his colleagues so as to break divine concord and the peace of our Lord; that he was far from judging or censuring any of his brethren or cutting off from his communion any that were of a different mind; and that in such case none ought to constrain his colleague by tyrannical violence (therein glancing at the violent proceeding of Stephen to whom he wrote) to a necessity of believing or following what he thinks meet. (Epistle 72, to Stephen; Epistle 73, to Jubajanum) This modesty and charity of Cyprian is very often and very deservedly commended by St. Augustine (Contra Donatists, bk. 1, ch. 18; bk. •, chs. 1-2), says Dr. Potter, an episcopal man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London: Robert Davvlman, 1653), ch. 9; pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

otland%20writing%20against,says%20Dr.%20Potter%2C%20an%20episcopal%20man&amp;text=Our%20brethren%20of%20Scotland%20writing%20against%20the%20tyranny&amp;text=chs.%201%2D2%29%2C%20says%20Dr.%20Potter%2C%20an%20episcopal%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-330d3e89f1" data-kw="">
<blockquote><p>And therefore when they that separate do plead that they agree with us in the fundamentals of Faith, they do not excuse, but aggravate their schism in violating the unity of that Church which is sound in the Faith. (St. Augustine, Contra Faustus, bk. 20, ch. 2) For ’tis not diversity of Faith, but the breach of unity that makes a schismatic.</p></blockquote>

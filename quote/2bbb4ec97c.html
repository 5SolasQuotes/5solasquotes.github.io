<main class="wrap"><figure class="quote" id="q-2bbb4ec97c" data-kw="">
<blockquote><p>To be moved voluntarily, is to be moved from within, that is, by an interior principle: yet this interior principle may be caused by an exterior principle; and so to be moved from within is not repugnant to being moved by another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 105, art. 4, Whether God can move the created will, reply to obj. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>37. Everything caused either immediately or mediately by a free cause is contingent, and conversely every contingent being is caused immediately or mediately by a free cause.

38. Every cause that causes contingently is either itself a free will or depends for its existence or its causing on a free cause.</p></blockquote>

</figure><figure class="quote" id="q-a541fa9b54" data-kw="">
<blockquote><p>It is true that people, through corruption of nature, are averse to submit to governors ‘for conscience sake, as unto the Lord,’ because the natural man, remaining in the state of nature, can do nothing that is truly good, but it is false that men have no active moral power to submit to superiors, but only a passive capacity to be governed. He [John Maxwell] quite contradicts himself; for he said before (ch. 4, p. 49) that there is an ‘innate fear and reverence in the hearts of all men naturally, even in heathens, toward their sovereign;’ yea, as we have a natural moral active power to love our parents and superiors (though it be not evangelically, or legally in God’s court, good) and so to obey their commandments, only we are averse to penal laws of superiors. But this proves no way that we have only by nature a passive capacity to government; for heathens have, by instinct of nature, both made laws morally good, submitted to them, and set kings and judges over them, which clearly proves that men have an active power of government by nature. Yea, what difference makes the Prelate betwixt men and beasts? for beasts have a capacity to be governed, even lions and tigers; but here is the matter, if men have any natural power of government, the Popish Prelate would have it, with his brethren the Jesuits and Arminians, to be not natural, but done by the help of universal grace; for so do they confound nature and grace. But it is certain our power to submit to rulers and kings, as to rectors, and guides, and fathers, is natural;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 30</span></figcaption>

</figure><figure class="quote" id="q-8b52c7c702" data-kw="">
<blockquote><p>74. From this is plain how there is freedom in the will. For I am said ‘to see freely’ because I can freely use the visual power for seeing; so in the matter at hand, however much any cause be natural and always uniformly acting (as far as is on its own part), yet because it does not determine nor necessitate the will to willing, but the will of its own liberty can concur with it for willing or not willing and so can freely use it, therefore is it said that ‘to will and to refuse freely’ is in our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 25th Distinction, Question: ‘Whether an act of will is caused in the will by the object moving it, or by the will moving itself’ in Ordinatio, bk. 2, dist. 15-25 tr. Peter Simpson (2025), pp. 58-71, p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Samuel Rutherford on the Divine Origin of Possibility’ being ch. 8 in</cite>, ed. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology 1560-1775, pp. 142-3, 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…”

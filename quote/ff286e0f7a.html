<main class="wrap"><figure class="quote" id="q-ff286e0f7a" data-kw="">
<blockquote><p>…what is necessary to such actions, considered as human acts and common to them with all other human acts, ought to be left at liberty, or so commanded [for public worship] as they may be done without offence to the general rules of holy Writ, by which all human acts are to be guided, viz. so as God may be most glorified, others most edified, and least scandalized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-presbyterians.html">English Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anonymous, English Presbytery, or an Account of the Main Opinions of those ministers and people in England who go under the name of Presbyterians… (London, 1680)</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-71e99a049f" data-kw="">
<blockquote><p>But sure, all our jus and right… that captives and servants have to their masters and lords, is jus limitatum, a right ruled, limited, bounded by the Word of God; nor is the work they perform morally indifferent ([though] physically it is)… But for no cause the most weighty can we choose either to shed innocent blood or to co-operate with the shedding of it, nor to co-operate with the works of darkness, for it is shameful that a servant may lawfully cooperate with and thrust his master in at a window to go to a whore; the jus or dominion of masters to command, and the right of servants to obey is only in the Lord. …the one kind of action in itself is as indifferent and susceptible of moral lawfulness and unlawfulness as the other. And if the master do cooperate to commit harlotry in climbing in at a window to a whore, and to robbing, in digging through an innocent man’s house in the night, to kill the master of the house, and to steal his goods, then the servant that cooperates in these same physical actions, and also digs through the innocent man’s house and kills himself, is the harlot and the robber by cooperation and participation, no less than the master. The naked relation of a captive and of a servant cannot make the captive and servant innocent and guiltless cooperators, for then to sin at the command of any conqueror and master, because I am in the condition of a captive and servant, were lawful, though God forbid and inhibit me to do what I do, by the command of my master and conqueror, for in so doing, Utor meo jure, I use my right as a servant. For God forbids me in what relation I be in, servant or captive, to sin at the command of any, or for declining any ill of punishment, though as weighty as the torment of hell, separated from sinful despairing and blaspheming of God. Now to cooperate with that which I know to be a sin is to partake in other men’s sins, which is forbidden, as a sin, 1 Tim. 5:22; Eph. 5:11. But to run with the thief and to help an arch-robber, Prov. 1:13-14, is a consenting to his robbery and bloodshed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646), Appendix</cite>, p. 85-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-7349fce36d" data-kw="">
<blockquote><p>In Acts 16:3, about Paul using his liberty to circumcise Timothy due to the onlooking Jews, the necessity for this material action (albeit understood religiously and falsely by others, as Paul knew it would so be misunderstood beforehand) was for the sake of not unduly scandalizing others, even unbelievers, for the greater well-being of the Church, avoiding its disturbance and for the flourishing of the Gospel. Note that Gal. 5:1 calls circumcision “a yoke of bondage” when it is imposed out of religious necessity, and yet Paul was willing to occasionally submit to it for the higher good when he would not submit to it out of formal principle or always (Gal. 2:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 31</span></figcaption>

</figure><figure class="quote" id="q-26c2da0923" data-kw="">
<blockquote><p>Though the Old Testament rites after Christ’s death were called “the commandments and doctrines of men” (Col. 2:22), just as the sort that Jesus condemns in Mt. 15:2–9, yet Paul and the Christians did not put any opinion of holiness in these rites or opinion of necessity beyond their nature or what derived from the circumstances (though others did). Paul and the Christians used these material, inconvenient and scandalous (in some way) ceremonies in accord with nature’s light, Christian prudence and the Word’s general rules for the greater good: “Unto the pure all things are pure” (Tit. 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 32</span></figcaption>

</figure><figure class="quote" id="q-ea95be5137" data-kw="">
<blockquote><p>§3… When Christ says, ‘If thy right eye or hand offend (or scandalize thee) pluck it out,’ or ‘cut it off,’ etc., Mt. 5… He plainly means, ‘if it draw thee to sin,’ or else He had never added that it is better to enter maimed into life than having two eyes or hands to be cast into Hell! That is, in a word, ‘Thy damnation is a greater hurt than the loss of hand or eye, and therefore if there were no other way to avoid it, this would be a very cheap way.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory: a Sum of Practical Theology and Cases of Conscience</cite>, pp. 80, 82-83</span></figcaption>

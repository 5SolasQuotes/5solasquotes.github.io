<blockquote><p>Ye have heard, dearly beloved, that true faith is the justification of the church or faithful of God; that it is, I say, the forgiveness of all sins, a receiving into the grace of God, a taking by adoption into the number of the sons of God, an assured and blessed sanctification [beatificationem],¹ and finally, the well-spring of all good works.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d7e242940" data-kw="">
<blockquote><p>XXII… (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed, such that for the first constitution of justification, besides faith, not even the presence of good works is necessary, just as for the first constitution of fleshly marriage nothing is required but a consent of the spouses, because God justifies the ungodly (Rom. 4:5); then for its continuation their coexistence is required, just as for the continuation of marriage a coexistence of marriage duties is required, because faith working through love is required (Gal. 5:6); and finally for the consummation (insofar as the possession of eternal life is pronounced), the preexistence of good works is also required for the possession of eternal life (Mt. 25:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 128</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

e</a></div>

<blockquote><p>Article 11, ‘We are accounted righteous before God only for the Merit of our Lord and Savior Jesus Christ, and not for our own works or deservings: wherefore that we are justified by faith only, is a most wholesome doctrine, etc.’ Exposition: Though he that does righteousness is righteous, and the Scripture throughout and frequently mentions an inherent personal righteousness necessary to salvation, yet this is no universal righteousness, nor such as will justify us according to the Law of Innocency or Works; but is merely subordinate to the merit and efficacy of the sacrifice and righteousness of Christ, which only merits for us as a price, our faith being only the requisite (yet given) moral qualification for the reception of the free gift of pardon, justification and adoption, and has not the least part of the office or honor of Christ; yet are Christ’s words true, that by men’s words they shall be justified or condemned: And all men shall be judged according to their works: And James truly says that by works a man is justified, and not by faith only: Not by works of perfection or of Moses’s Law, nor any that as a price or commutation do make the reward to be of debt, and not of grace; but by a practical faith or Christianity: such acts as faith it self is, and prove our belief to be such as Christ has promised justification and salvation to; such as by justifying belief to be sincere, do justify the person against the charge of infidelity, hypocrisy, impenitence and ungodliness, Christianity is that faith which Paul opposes to works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>R. Baxter’s Sense of the Subscribed</cite>, [Anglican, 39] Articles of Religion (London: Cox, 1689), 11th Article, Of the Justification of Man, pp. 7-8</span></figcaption>

</figure><figure class="quote" id="q-5d48a72dfc" data-kw="">
<blockquote><p>A living faith justifies, not in its active state, but in its act of apprehending and laying hold upon Christ. On the other hand, faith’s second notable act is to purify and cleanse the heart and stir up other graces. In this sense, some learned individuals argue that good works are necessary to preserve a person in the state of justification, though they do not immediately contribute to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>𝑉𝑖𝑛𝑑𝑖𝑐𝑖𝑎𝑒 𝐿𝑒𝑔𝑖𝑠, Lecture</cite>, 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-79d09268e6" data-kw="">
<blockquote><p>Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity: but they are not the cause of, but only a precedent qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the Covenant of Grace, by condition we understand whatsoever is required on our part, as precedent, concomitant or subsequent to justification: repentance, faith and obedience are all conditions; but if by condition we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>

lowship+with+God+and+walk+in+darkness%2C+we+lie+and+do+not+the+truth%3A+But+if+we+walk+in+the+light%2C+as+He+is+in+the+light%2C+we+have+fellowship+one+with+another%2C%E2%80%99+1+Jn.+1%3A6-7.+This+walking+in+the+light+as+He+is+in+the+light+is+that+qualification+whereby+we+become+immediately+capable+of+Christ%E2%80%99s+righteousness%2C+or+actual+participants+of+his+propitiation%2C+which+is+the+sole+immediate+cause+of+our+justification%2C+taken+for+remission+of+sins%2C+or+actual+approbation+with+God.+The+truth+of+which+doctrine+St.+John+likewise+ratifies+in+terms+equivalent%2C+in+the+words+presently+following%3A+%E2%80%98and+the+blood+of+Christ+cleanseth+us%E2%80%99+%28walking+in+the+light+as+God+is+in+the+light%29+%E2%80%98from+all+sin.%E2%80%99+%5Bv.+7%5D%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+20-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F79d09268e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/79d09268e6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=Good%20works%20of%20all%20sorts%20are,light%29%20%E2%80%98from%20all%20sin.%E2%80%99%20%5Bv.%207&amp;text=Good%20works%20of%20all%20sorts%20are%20necessary%20to&amp;text=in%20the%20light%29%20%E2%80%98from%20all%20sin.%E2%80%99%20%5Bv.%207" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-a53208e82e" data-kw="chastise">
<blockquote><p>&quot;You have chastised me, and I was chastised, as a bullock unaccustomed to the yoke; turn me and l shall be turned.&quot; &amp;c. And it is for the breaking down of the weight of one&#x27;s spirit that God lays it on: for which cause it is declared to be a good thing to bear it, that being the way to make one at length as a weaned child. Secondly, A strong desire to have the cross removed, and to have matters in that part going according to our inclinations. This is very natural, nature desiring to be freed from everything that is burdensome or cross to it; and if that desire is kept in a due subordination to the will of God, and it is not too pre-emptory, it is not sinful. &quot;If it is possible, let this cup pass from me; nevertheless, not as I will.&quot; &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite></span></figcaption>

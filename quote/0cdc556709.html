<main class="wrap"><figure class="quote" id="q-0cdc556709" data-kw="">
<blockquote><p>As therefore I have showed in what sense the covenant of grace is called “the new covenant,” in this distinction and opposition, so I shall propose sundry things which relate unto the nature of the first covenant, which manifest it to have been a distinct covenant, and not a mere administration of the covenant of grace: — 1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 92</span></figcaption>

</figure><figure class="quote" id="q-3a2e559560" data-kw="believer obedience not punishment">
<blockquote><p>In the state of grace, it binds the believer only to obedience, not to punishment because there is no condemnation to those who are in Christ (Rom. 8:1), whose transgressions are forgiven (Ps. 32:1). Rather the question concerns the state of sin—whether in it the sinner is bound to both (which we assert). First, from the twofold condition of sinful man, who is both a creature and a sinful creature. As a creature, he owes to God obedience forever and never can be discharged from it. As a sinner, he owes punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.12–13</span></figcaption>

</figure><figure class="quote" id="q-1b06862aa9" data-kw="">

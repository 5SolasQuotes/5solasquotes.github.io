<main class="wrap"><figure class="quote" id="q-1abfa1fa62" data-kw="">
<blockquote><p>In Christianity, the moment we believe, God imputes Christ’s perfect performance to us as if it were our own, and adopts us into His family. In other words, God can say to us just as He once said to Christ, “You are my Son, whom I love; with you I am well pleased.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tim-keller.html">Tim Keller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Freedom of Self-Forgetfulness</cite>, p. 40</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f9aeee0f2" data-kw="">
<blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-94faf9202e" data-kw="">
<blockquote><p>Justification by faith is an answer to the greatest personal question ever asked by a human soul: “How shall I be right with God? How do I stand in God’s sight? With what favor does he look upon me?” There are those, I admit, who never raise that question. There are those who are concerned with the question of their standing before men but never with the question of their standing before God. There are those who are interested in what “people say” but not in the question of what God says. Such men, however, are not those who move the world. They are apt to go with the current. They are apt to do as others do. They are not the heroes who change the destinies of the race. The beginning of true nobility comes when a man ceases to be interested in the judgment of men and becomes interested in the judgment of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God Transcendent</cite></span></figcaption>

</figure><figure class="quote" id="q-2a0c39a651" data-kw="">

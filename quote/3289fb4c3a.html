</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0350d090e9" data-kw="">
<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27, 1643’ (London, 1644)</cite></span></figcaption>

<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (Edinburgh, 1641)</cite>, p. 150-1</span></figcaption>

et="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eaaf0040a1" data-kw="">
<blockquote><p>But truly the Preservers [civil health officials appointed for the plague] shall in vain altogether with this travail [labor] and diligence look unto their commonwealth if they use not like wisdom in the receiving in or shutting out of either men or things that come from other places when as this sickness is now rife everywhere and is at this time in a great part of Germany. For what shall it avail to have removed the filth of our own places, if we will receive again the corruption from others? …even so also this magistrate of ours (whom in this case we have said must be a general physician [by metaphor]) must do his diligence in the universal and common body of the commonwealth and orderly provide for all, that not so much as the least piece of infection be received or left behind whereupon new wracks and dangers are to be feared. For (as the poet says) the flame that is not looked unto does straight again recover. … But if any man shall think that it is against charity for that I hold that men and such as are our brethren are to be shut out, of the which many fly unto us as unto a sanctuary, as it were from a deadly enemy: unto him I must make this answer, that I would have no man forsaken or in any case to be destitute of our help, but yet there ought to be a set and steadfast way and order in using of help. True charity begins at itself, but ends not in it self alone: But rather it stretches out itself as far as it can to every neighbor, and according unto her power, imparts her help with every man; and as Ambrose says of liberality, [it] is commended of her faith: cause, place and time. For what a kind of charity should this be, to receive one sick sheep into the fold and to bring the scab unto the whole flock?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But truly the Preservers [civil health officials appointed for the plague] shall in vain altogether with this travail [labor] and diligence look unto their commonwealth if they use not like wisdom in the receiving in or shutting out of either men or things that come from other places when as this sickness is now rife everywhere and is at this time in a great part of Germany. For what shall it avail to have removed the filth of our own places, if we will receive again the corruption from others? …even so also this magistrate of ours (whom in this case we have said must be a general physician [by metaphor]) must do his diligence in the universal and common body of the commonwealth and orderly provide for all, that not so much as the least piece of infection be received or left behind whereupon new wracks and dangers are to be feared. For (as the poet says) the flame that is not looked unto does straight again recover. … But if any man shall think that it is against charity for that I hold that men and such as are our brethren are to be shut out, of the which many fly unto us as unto a sanctuary, as it were from a deadly enemy: unto him I must make this answer, that I would have no man forsaken or in any case to be destitute of our help, but yet there ought to be a set and steadfast way and order in using of help. True charity begins at itself, but ends not in it self alone: But rather it stretches out itself as far as it can to every neighbor, and according unto her power, imparts her help with every man; and as Ambrose says of liberality, [it] is commended of her faith: cause, place and time. For what a kind of charity should this be, to receive one sick sheep into the fold and to bring the scab unto the whole flock?”

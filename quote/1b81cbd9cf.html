<main class="wrap"><figure class="quote" id="q-1b81cbd9cf" data-kw="">
<blockquote><p>Writing to Queen Elizabeth I of England, Peter Martyr reminded her that it was the duty of the civil magistrate to put the advance of Christ’s kingdom before all other things:

For it behoveth that you restore again in this place the holy Gospel of Christ, which through injury of the times and importunity of the adversaries, hath lien some years past neglected, I will not say trodden under foot. This if you shall perform, all things shall happen prosperously unto you, no less than they did unto most godly king David. For it be said unto every Christian man, that he should first seek the kingdom of God, then other things should easily be supplied, shall we not think that the same is commanded unto kings? Certes, if it be commanded all men to worship God most sincerely, kings are not exempted from the precept: nay rather the greater estate they bear amongst men, the more are they bound to that law of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the most renowned Princess Elizabeth by the grace of God Queen of England, France and Ireland, Grace and everlasting happyness from God the Father through Jesus Christ our Saviour (1558) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

t-the-kingdom-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51b66a50ba" data-kw="">
<blockquote><p>The Sum of all, in one Syllogism.

That the Lord’s day, or Christian Sabbath, is necessarily to be observed by all Christians to the end of the World.

Whatsoever days observation was in the New Testament sanctified, and set apart to an holy use: First, by Christ his triumphant resurrection. Then, by his first appearing to his gathered Apostles &amp; Disciples, five times on that same day. Next, by his second appearing to his gathered Apostles. Fourthly, by his sending of the Holy-Ghost to his Apostles gathered again, and blessing of their doctrine by conversion of souls. Fifthly, by Apostolical Command, &amp; Constitution, to be observed by Christian Churches. Sixthly, by Christ’s Command, not to be profaned of any faithful Christian. Seventhly, by [the] apostles’ solemn practice of preaching, ministering the Sacraments in the Christian Congregation, and meditation of the Scripture.

Eighthly, by the holy-Ghost’s induing it with a notable &amp; peculiar title of the Lord’s day. By Apostolical, primitive, and all later reformed Churches general and continual practice, from thence unto our times. By the judgement of the spiritual &amp; most godly learned Teachers and Writers of the former and later ages. By the witness of God’s general and continual blessing of the practice thereof, with peace of conscience, joy of the Holy-Ghost, and sensible increase of knowledge and grace in all sincere Christians, that with soundness profess the Gospel every where. And last of all, by the dislike and opposition of the only most wicked of life, ignorant of mind, or otherwise unsound in judgement and doctrine. The Observation of that Day is most necessary, and doth tie the Conscience to the end of the World.

But such is the Observation of the Lord’s day, or first day of the week; and so confirmed in every point. Therefore, The holy Observation of the Lord’s day or first day of the week, is most necessary, and doth tie the conscience to the end of the World.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions, tending to prove the necessary use of the Christian Sabbath or Lord’s Day; and that it is commanded unto us in God’s Word. Whereunto is added the practice of that sacred day, framed after the rules of the same Word</cite>, (London: Thomas Man, [1607]), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-915e624165" data-kw="">
<blockquote><p>Things inconvenient even in matters of religion may be commanded in some cases (Circumcision was a burden, Acts 15:10, and these burdens called ‘necessary things,’ v. 28, and they were said to do well if they observe them, v. 29.): as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to preuent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary</cite>, pp. 586-98 on 1 Pet. 2:13 in A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), pp. 590-91</span></figcaption>

<blockquote><p>21. Neither are they for stated anniversary feasts or fasts, which are sadly profaned and abused among the Romanists, for at least the superstitious unthinking vulgar make little other use of them than for rioting and raveling, sporting and gamming, and other such dissolute practices, highly unbeseeming days that pass under the character and opinion of holy-days: Yet when emergencies and dispensations of providence occur that call for public humiliation and fasting, or solemn Thanksgiving, they think it their duty to consecrate some part of their time for fasts and thanksgivings, devoutly to deprecate God’s imminent wrath, and to plead the aversion of impendent judgments due to them for their sins, or to praise God for benefits received and to beg further favors; These being such pieces of religious work which God both by his Word and providence sometimes requires. Geneva: Treatise of Fasting; Acts of the Assembly, 1645. ss: Vlt.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2476d15112" data-kw="">
<blockquote><p>You will learn from our brother, master Butler, by what circumstances I am hindered and with whom I have to contend within these two days on the subject of divorce. In the commentaries¹ which I lately wrote on the decalogue, I allowed both to the man and his wife an equal liberty of divorce on account of adultery, if they are disposed to use that liberty which Christ has permitted in the gospel of his Church, where the marriage contract is dissolved by adultery. ¹ See a Declaration of the ten holy Commandments of Almighty God, in Hooper’s early writings, Parker Society edition. The passage here referred to will be found in pp. 378, 379, where Hooper complains of the uncharitable construction put upon it. My opponents allow the husband to divorce his wife by reason of adultery, and to marry another; but they do not allow the same liberty to the wife. In your next letter, as you love me, either confirm my opinion, or correct my error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Original Letters relative to the English Reformation, ed. Hastings Robinson for the Parker Society (Cambridge Univ. Press, 1846), vol. 1, Letter 32, Hooper to Bullinger</cite>, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c50ef5a04d" data-kw="">
<blockquote><p>Further, if parents should be unwilling to allow the honorable vows of their children and proceed to abuse their power over them, they must be admonished and persuaded by a warning, prayers, and the urging first of relatives and friends, and secondly of the presbyters of the church. But if harsh parents should ignore all these, then the magistrates must interpose their authority, lest anyone by the wickedness of his parents be either kept from marriage longer than is fair or driven to a less acceptable marriage, provided that those who have such inhuman parents are not seeking to be joined with corrupt men of little honor and piety. There was a provision concerning such things even in Roman laws (Digest XXIII, 2, 19, 21, 22; Code V, 4, 12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 18, ‘Marriages should not be held valid which are contracted without the consent of those who have power over the ones who make the contract, or without suitable advisors’</cite>, pp. 323-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-d742acd319" data-kw="">
<blockquote><p>…it was the opinion of the church of England, at the commencement of the reign of Queen Eli|zabeth, that, after a divorce for adultery, the parties might marry again. It is true that the despotic tribunal, the Star-Chamber, whose very name is odious to the ears of a free-born Englishman, did reverse this opinion… But, what was this less than acting against the spirit, reversing the very principles, of the Reformation; and recurring back again to the usages and practices of popery?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-kenrick.html">William Kenrick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations, Civil &amp; Canonical, on the Marriage Contract, as Entered into Conformably to the Rites &amp; Ceremonies of the Church of England (London, 1775)</cite>, p. 2</span></figcaption>

</figure><figure class="quote" id="q-57e3ee3491" data-kw="">
<blockquote><p>The laws then which the Church in proper speech is said to make, are decrees concerning outward order and comeliness in the administration of the Word and sacraments, in the meetings of the congregation, etc. and such laws made according to the general rules of God’s Word (which require that all things be done to edification, in comeliness, for the avoiding of offence) are necessary to be observed, and the Word of God binds all men to them so far forth as the keeping of them maintains decent order, and prevents open offence. Yet if a law concerning some external rite or thing indifferent, be at some time upon some occasion omitted no offence given, not contempt showed to ecclesiastical authority, there is no breach made in the conscience: and that appears by the example before handled. The apostles guided by the Holy Ghost made a decree for the avoiding of offence necessary to be observed, namely that the Gentiles should abstain from strangled [animals] and blood and idolythites, and yet Paul out of the case of scandal and contempt, permits the Corinthians to do otherwise, 1 Cor. 8 &amp; 9, which he would not have done, if to do otherwise out of the case of scandal and contempt had been sin</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience (1596)</cite>, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

od/#:~:text=The%20laws%20then%20which%20the%20Church,scandal%20and%20contempt%20had%20been%20sin&amp;text=The%20laws%20then%20which%20the%20Church%20in%20proper&amp;text=case%20of%20scandal%20and%20contempt%20had%20been%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession [i.e. Lutherans] might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren</cite>, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

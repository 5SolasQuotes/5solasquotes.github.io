<main class="wrap"><figure class="quote" id="q-3e8fffde8a" data-kw="">
<blockquote><p>1. Because the apostles require us to sing ‘Psalms, Hymns and Spiritual Songs’ (Jm. 5:13; Eph. 5:19; Col. 3:16). Which three are known to be the usual titles of the Scripture Psalms ([Greek &amp; Hebrew] See Ainsworth on the title of Psalm 3). 2. Because these, doubtless, best deserve the title of Spiritual Songs, which were endited by the immediate inspiration of the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-allen.html">Richard Allen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay to Prove the Singing of Psalms with Conjoined Voices, a Christian Duty: and to resolve the doubts concerning it</cite>, (London, 1696), p. 59. Allen was likely a baptist as at least two of the ministers recommending his book in the preface were baptists and as he is mainly arguing against the position that held that the psalms in meter ought not to be sung at all. He argues for majority psalm singing in the work.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Because the apostles require us to sing ‘Psalms, Hymns and Spiritual Songs’ (Jm. 5:13; Eph. 5:19; Col. 3:16). Which three are known to be the usual titles of the Scripture Psalms ([Greek &amp; Hebrew] See Ainsworth on the title of Psalm 3). 2. Because these, doubtless, best deserve the title of Spiritual Songs, which were endited by the immediate inspiration of the Holy Spirit.”

— Richard Allen, An Essay to Prove the Singing of Psalms with Conjoined Voices, a Christian Duty: and to resolve the doubts concerning it (London, 1696), p. 59. Allen was likely a baptist as at least two of the ministers recommending his book in the preface were baptists and as he is mainly arguing against the position that held that the psalms in meter ought not to be sung at all. He argues for majority psalm singing in the work.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Because+the+apostles+require+us+to+sing+%E2%80%98Psalms%2C+Hymns+and+Spiritual+Songs%E2%80%99+%28Jm.+5%3A13%3B+Eph.+5%3A19%3B+Col.+3%3A16%29.+Which+three+are+known+to+be+the+usual+titles+of+the+Scripture+Psalms+%28%5BGreek+%26+Hebrew%5D+See+Ainsworth+on+the+title+of+Psalm+3%29.+2.+Because+these%2C+doubtless%2C+best+deserve+the+title+of+Spiritual+Songs%2C+which+were+endited+by+the+immediate+inspiration+of+the+Holy+Spirit.%E2%80%9D%0A%0A%E2%80%94+Richard+Allen%2C+An+Essay+to+Prove+the+Singing+of+Psalms+with+Conjoined+Voices%2C+a+Christian+Duty%3A+and+to+resolve+the+doubts+concerning+it+%28London%2C+1696%29%2C+p.+59.+Allen+was+likely+a+baptist+as+at+least+two+of+the+ministers+recommending+his+book+in+the+preface+were+baptists+and+as+he+is+mainly+arguing+against+the+position+that+held+that+the+psalms+in+meter+ought+not+to+be+sung+at+all.+He+argues+for+majority+psalm+singing+in+the+work.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e8fffde8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e8fffde8a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=1.%20Because%20the%20apostles%20require%20us,immediate%20inspiration%20of%20the%20Holy%20Spirit&amp;text=1.%20Because%20the%20apostles%20require%20us%20to%20sing&amp;text=by%20the%20immediate%20inspiration%20of%20the%20Holy%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db563e53ef" data-kw="">
<blockquote><p>In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Psalms in meter. Agreeable to the Hebrew, to be sung in usual tunes. To the benefit of the churches of Christ</cite>, 1655 | Background to White’s psalter by Andrew Myers:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-90109a807c" data-kw="">
<blockquote><p>After his [Saul’s] death, the crown was set upon David‘s head. Whose constant pious life, and holy devotions (in Hymns, Psalms, and Spiritual Songs) are left, as the best patterns, directions, and encouragements to all posterity. And we are sure enough, that he himself, after his own use of them (to shew the difference betwixt His end, and Saul‘s) was happily assured to be one of the Heavenly Quire above, and there Crowned again with an immortal Crown of Glory. David is an ancient Pattern, a Royal Prophet, and Grand Guide to such, as are willing to fight the Battles of the Lord, in their Pilgrimage towards the true Land of Promise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-stokes.html">David Stokes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Verus Christianus</cite>, [The True Christian], or, Directions for Private Devotions and Retirements… (Oxford, 1668), ‘A Transition to What Follows in the Appendix’, no page number. Stokes (1591?-1669) was an educated Anglican.</span></figcaption>

</figure><figure class="quote" id="q-394b30f141" data-kw="">
<blockquote><p>Wicked men cry out of bands and cords in religion… Away with this strictness and preciseness, it extinguishes the joy and pleasure of our lives; give us our cups instead of bibles, our profane songs instead of spiritual psalms, our sports and pastimes instead of prayers and sermons.</p></blockquote>

</figure><figure class="quote" id="q-06d5cd28d0" data-kw="">
<blockquote><p>Why then will they [the Church of Rome] reprehend our singing? ‘Be ye’ (sayeth he) ‘fulfilled with the spirit, speaking amongst yourselves in Psalmes, Hymns and spiritual songs, singing and making melody unto the Lord in your hearts.’ You hear what the apostle of Christ willeth us to do. ‘My songs’ (sayth the prophet David) ‘will I make of thy name, O thou most highest.’ Whosoever therefore rebuketh us for singing of Psalms, the same doth withstand the Scriptures and holy Ghost. But if they themselves do allow their own singings, why then disallow they ours?… Yea, they themselves thus write: ‘Concerning the singing of Hymns, we have the example of our Savior, and of the apostles.’ Be not therefore any longer obstinate, the Psalms of David we sing, never go about to carp our singing. Many other things there be, which in us they do blame.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-evans.html">Lewis Evans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Castle of Christianity detecting the long erring estate, as well of the Roman Church, as of the Bishop of Rome: together with the defence of the catholic faith</cite>, … (London, 1568), ‘A Plain Demonstration of the Erring Estate of the Roman Church’, pp. 49-50. Evans (fl. 1574). This book was dedicated to Queen Elizabeth.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

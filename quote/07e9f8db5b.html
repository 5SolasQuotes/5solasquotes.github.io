<main class="wrap"><figure class="quote" id="q-07e9f8db5b" data-kw="">
<blockquote><p>The Mormon degradation and defamation of the notion of God marks it as no development of Christianity, but a most foul and blasphemous apostasy. … Christianity teaches that man was created by God. It teaches the doctrine of ex nihilo creation. Mormonism teaches the eternity of matter, and regards the souls of men as a part of that eternal matter. Christianity teaches that mankind fell in Adam, our ancestral head, from an estate of holiness. Mormonism teaches that souls in an imperfect state were embodied as a necessary stage in their progress toward perfection. Christianity teaches the moral helplessness of man and the need of divine grace in order to salvation. Mormonism teaches that man can do everything necessary to salvation once the eldest son of the Michael, who became Adam, has died in the race’s behalf. Mormonism looks forward to a heaven of sensuality much like that of Mohammed. Christianity looks forward to a heaven in which fleshly appetites have no scope. Mormonism is no development of Christianity. It is another gospel than that which Paul preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cary-johnson.html">Thomas Cary Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mormonism in Presbyterian Quarterly</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07ea07336f" data-kw="">
<blockquote><p>There were many great corruptions in the Church of the Jews in Christ’s time, the priests and teachers were ignorant and wicked, and had a corrupt and unlawful entrance into their calling; and the people were like to the priests, generally notoriously and obstinately ungodly; and the worship used in that Church was woefully corrupt; many superstitious ceremonies, the observation whereof were more strictly urged than the commandments and ordinances of God; the Temple made a den of thieves, the discipline and censures shamefully abused, the doctrine was corrupt in many points; Yet the Word tells you Christ (whose example it binds you to follow, and you profess your selves followers of Him in all imitable things) made no separation from this Church, professed Himself a member of it, was by circumcision incorporated a member, received baptism in a congregation of that people, was a hearer of their common service and their teachers, allowing and commanding his disciples to hear them, communicated in the Passover with the people and the priests: No more did his apostles make separation from this Church after his ascension, till their day had its period, etc. By their example it appears that till God has forsaken a Church, no man may forsake it, etc. So that we conclude from hence with Mr. [Arthur] Hildersham: Those assemblies that enjoy the Word and doctrine of salvation, though they have many corruptions remaining in them, are to be acknowledged as true Churches of God, and such as none of the faithful may make separation from. We shall need no further proof of this doctrine than the example of our Savior Himself, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters</cite>, Dwelling with God, p. 294 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-3801e70079" data-kw="">
<blockquote><p>Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude</cite>, verse 19 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-9b8ae6dcb5" data-kw="">
<blockquote><p>There is no patrociny intended, nor can be drawn by the most remote consequence, from what is here pleaded upon the point of separation, unto these dreadfully presaging anti-ministerial principles and practices, that several in this land are sadly precipitating themselves into, which, we hope, will be abundantly clear to the understanding peruser of what I have offered upon that head, and the state of the question, as it is exhibited.</p></blockquote>

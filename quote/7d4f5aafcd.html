</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e12381ac27" data-kw="degrees of glory">
<blockquote><p>Will there be degrees of glory? And will the glory in heaven be equal or unequal and unlike? The Romanists assert the inequality of glory from the inequality of merits which they are accustomed to place under it as a foundation. Among the orthodox the question is problematic; yet the more common opinion asserts degrees of glory without founding them upon merit of works, but upon the free gift of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.10.1–2</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 20.10.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWill%20there%20be%20degrees%20of%20glory%3F%20And%20will%20the%20glory%20in%20heaven%20be%20equal%20or%20unequal%20and%20unlike%3F%20The%20Romanists%20assert%20the%20inequality%20of%20glory%20from%20the%20inequality%20of%20merits%20which%20they%20are%20accustomed%20to%20place%20under%20it%20as%20a%20foundation.%20Among%20the%20orthodox%20the%20question%20is%20problematic%3B%20yet%20the%20more%20common%20opinion%20asserts%20degrees%20of%20glory%20without%20founding%20them%20upon%20merit%20of%20works%2C%20but%20upon%20the%20free%20gift%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2020.10.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe12381ac27.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e12381ac27.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7879f4cc76" data-kw="">
<blockquote><p>The most studied source for Gerald Odonis’ doctrine of the beatiﬁc vision is the text of his Advent 1333 disputed question known as his Quodlibet. The polemic nature of the question and its structural idiosyncrasies have led to diﬃculties in interpreting Odonis’ theory of the ‘middle vision’ of the divine essence that the separate souls of the blessed have, as well as in understanding his defense of Pope John XXII’s controversial opinion [that saints do not enjoy the complete Beatific Vision till after the Final Judgment] (which excludes such a middle vision). By relating Odonis’ 1333 disputation to his earlier commentary on the Sentences… this paper shows how Odonis tried to ﬁt his doctrine of the ‘middle vision’ with his previous discussion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-duba.html">William Duba</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Beatific Vision in the Sentences Commentary of Gerald Odonis’ Vivarium 47</cite>, (2009), pp. 348-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-40785982bc" data-kw="">
<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, (RHB), vol. 3, pp. 47-75</span></figcaption>

</figure><figure class="quote" id="q-ac45295e01" data-kw="">
<blockquote><p>There was a little Christian child who was asked, when she was dying, why she was so happy? ‘Because,’ she said, ‘I am going to be with Christ.’ ‘But,’ they said to her, ‘perhaps Christ will leave heaven.’ ‘Ah! Then,’ she said, ‘I will leave it, too, and go with Him.’ It is our very heaven to be with Christ; we shall see eye to eye.</p></blockquote>

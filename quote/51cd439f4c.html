<main class="wrap"><figure class="quote" id="q-51cd439f4c" data-kw="">
<blockquote><p>[Francis] Junius [the elder]… in his book Of the Church… his words are (pp. 60-61): ‘Ecclesia multis seculis fuit, cum Papatus non esset; accessit ei Papatus contingenter, et sic ab ea separabilis, ut hoc etiam tempore Ecclesiae sint ubi Papatus non est, et sine Papatu deinceps futurae sint. Papatus igitur non est Ecclesia, sed in Ecclesia est adnatum malum, pestis, hydrops, gangraena in corpore, vitae atque saluti ejus insidians, ideoque succum vitalem salutaremque Ecclesiae depascens quam infestissime.’ ‘The Church of God was many ages when there was no Papacy at all; as at this day also there are Churches where there is no Papacy: and will be hereafter without the Papacy. The Papacy therefore is not the Church, but a disease or botch grown to or in the Church, a plague, a dropsy, a gangrene in the body, endangering the health, feeding upon and infesting the healthful moisture and vital blood of the Church.’ And within a few lines after in the same page follow the words… ‘The Papal Church’ (says Franciscus Junius, neither Papist, nor Arminian) ‘qua id habet in se quod ad Ecclesiae definitionem pertinet, est Ecclesia.’ ‘As it has that in it which belongs to the definition of a Church, is a Church.’… ‘Quod vero habet in se adnatum malum, quod Papalitatem dicimus, eo respectu Ecclesia non est, sed vitiata atque corrupta Ecclesia et ad interitum tendens;’ ‘But the Church of Rome as it has a disease or evil grown to it, which we call the Papacy, in that respect it is not the Church, but a vitiate and corrupt Church, and tending to ruin.’ The meaning of the whole sentence of Junius is clear enough for us… to wit, that the Church of Rome, so far as it is Protestant, and holds some fundamental truths agreeable to the Scriptures, is a Church: but as it is Popish and adds many errors to those truths, consequently subverting those very truths it holds, it is no Church. Which I thus prove: No Spouse or true Church of Christ is in part or in whole that Antichrist, or Whore of Babylon: The present church of Rome, as it is taken for the Papacy or Popish state thereof, is in part… or in whole (as many pillars of our Church have taught) that Antichrist, or Whore of Babylon; Therefore the present Church of Rome, as it is taken for the Papacy or Popish state thereof, is no Spouse nor true Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Featley, A Second Parallel, together with a writ of error sued against the Appealer</cite>, (London, 1626), pp. 76-79</span></figcaption>

</figure><figure class="quote" id="q-c422225f03" data-kw="">
<blockquote><p>But the question yet remains from from whence had these before them their calling? Our divines tilen, Bucan, professors Leiden, Wallaeus, distinguish here three things:

1. Something in the calling of our reformers was from God: so authoritatively, they were called of god, the ministry being of god.

2. The Christian Church lying under Popery, called, designed, and ordained the men to be Pastors; so their calling according to the substance of the act was from God, and the Roman Church as a Chriftian Church.

3. There was corruption in the way and manner of their vocation, as the Antichristian ceremonies, and an oath to maintain the doctrine of the Church of Rome, not only as a Christian Church, but also as Romish; if any of them did swear to defend the corruptions of the church, this latter was taken away by God’s illumination of their minds: A called minister swears to defend the truth, and this truth of this Church; but aye under the notion of truth; and if he see it be error he still holds the substance of his oath, in as far as it is obligatory and ties him in conscience. It is objected: An Antichristian Church cannot ordain Christian ministers; rome was then an Antichristian Church; therefore. Answer: That which is wholly, as touching its whole essence Antichristian, cannot ordain Christian ministers: True, a dead man cannot beget a living barne [child]: the Roman Church was not wholly Antichristian, but kept some of Christ’s truth. that which is Antichristian in part only, may ordain ministers, who have the true essence of a ministerial calling…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 10, p. 125</span></figcaption>

</figure><figure class="quote" id="q-824010ec1c" data-kw="">
<blockquote><p>I answer that [if] the true Church was only at Jerusalem radically [during the time Israel was divided in the O.T.], as you [the Separatist John Robinson] say, [then it] would import that the 10 Tribes revolting from David’s house ceased to be a Church, which is false: [1.] Israel, though all the land were in Covenant with God, had circumcision and the Passover, and so were a true visible Church, even when they did meet in their synagogues. The altar, sacrifices, Temple, are not the essentials of a visible Church; they were a Church and did pray toward the Temple even in Babylon, and were to profess the true God before the heathen, Jer. 10:11. 2. There be typical reasons to hinder men why they cannot be capable of the priesthood [1 Kings 12:31], that did not exclude them from Church-state; but this hinders not but if the seals administered by a minister be true seals, then is the minister thereof catenus, insofar, a true minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), | pt. 1, p. 236</span></figcaption>

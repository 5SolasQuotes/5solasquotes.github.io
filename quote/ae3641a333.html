<main class="wrap"><figure class="quote" id="q-ae3641a333" data-kw="">
<blockquote><p>And that otherwise, if the tares grow so rank that they cannot be pulled up, and if the same evil disease take hold of so very many that the consent of the Church cannot be had to the excommunication of a wicked person, then good men must grieve and groan, and endure what they cannot help. Therefore, that excommunication may fruitfully succeed, the consent of the people is necessary… Howbeit, even in such cases when the consent of the Church cannot be had to the execution of this discipline, faithful pastors and professors [laymen] must, every one for his own part, take heed that he have no fellowship with the unfruitful works of darkeness, but even reprove them; yea they ought, in sensu negativo, excommunicate those who should be (but are not) excommunicate positively: which negative excommunication is not an ecclesiastical censure, but either a bare punishment, or a cautel and animadversion; And so says the Archbishop of Spalato [Marco Antonio de Dominis, d. 1624] (De Republica Ecclesiastica, vol. 2, bk. 6, ch. 9, num. 8, pp. 735-36), not only one brother may refuse to communicate with another, but a people also may refuse to communicate with their pastor, which he confirms by certain examples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... (1637), pt. 3, ch. 8, Digression 4, p. 190-91</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d5c862daf2" data-kw="">
<blockquote><p>10. If after this public admonition the sinner shall obstinately refuse to manifest repentance, or to reform; it is the duty of the ministers to make a personal application to him of those threatenings which Christ has denounced in Scripture against such as he is; and especially to declare in the name of Christ, that he is one whose communion the church is bound to avoid; and to require him to forbear usurping that communion, and to charge the chuch in Christ’s name to avoid all familiarity with him, not only in God’s worship, but in common conversation, further than natural and civil relations bind us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

ed Books Online</a></div>
</figure><figure class="quote" id="q-36a84597f2" data-kw="">
<blockquote><p>5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member [in some way] of the visible Church and converted to God, who is excommunicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 278</span></figcaption>

</figure><figure class="quote" id="q-e6dceec3ac" data-kw="">

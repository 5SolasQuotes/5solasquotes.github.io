<blockquote><p>XXV. Such a perfect observance of the laws of the covenant, up to the period which God had fixed for probation, had given man a right to the reward. Not from any intrinsic proportion of the work to the reward, as the grosser Papists proudly boast; but from God’s covenant and engagement, which was no ways unbecoming him to enter into. Nor had man, before the consummation of his obedience, even in the state of innocence, a right to life. He was only in a state of acquiring a right, which would at length be actually acquired, when he could say, I could have fulfilled the conditions of the covenant, I have constantly and perfectly done what was commanded; now I claim and expect that thou, my God, wilt grant the promised happiness. XXVI. How absurdly again do the Papists assert, that Adam, as he came from the hands of his Creator, had a right, as the adopted Son of God, to supernatural happiness, as to his paternal inheritance; which, according to Bellarmine, de Justificat. l. v. 17. “is due to the adopted Son of God, in right of adoption, previous to all good works.” But this is truly a preposterous way of reasoning. For the right of adoption belongs to the covenant of grace in Christ Jesus: “the adoption of children is by Jesus Christ,” Eph. 1:5. Besides, was this opinion true, good works could not be required, as the condition of acquiring a right to eternal life; but could only serve to prevent the forfeiture of the right of a son: by this means, the whole design of the covenant of works, and all the righteousness which is by the law, are quite destroyed. In fine, what can be more absurd, than the trifling manner in which these sophisters talk of the grace of adoption, as giving Adam a right to enter upon an heavenly inheritance, in a legal covenant: when, on the other hand, they so stiffly contend for the merits of works, under a covenant of grace. It is only there (to wit, under the covenant of grace) that we are to apply the above sentiment, that the inheritance is due to an adopted Son of God, in right of adoption, previous to all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), 1.3.25–26 (vol. 1.47).</span></figcaption>

<blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.”

— Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+present+there+is+gneral+agreement+that+the+doctrine+of+the+covenants+is+a+peculiarly+Reformed+doctrine.+It+emerged+in+Reformed+theology+where+it+was+assured+of+a+permanent+place+and+in+a+way+that+has+also+remained+confined+within+these+bounds.+It+is+true+that+towards+the+end+fo+the+seventeenth+century+this+doctrine+was+taken+over+by+several+Lutheran+theologians%2C%C2%B9+but+this+apparently+took+place+by+way+of+imitation%2C+the+doctrine+being+unknown+within+the+genuine+Lutheran+framework.+%C2%B9+Diestel+%28Jahrbucher+fur+Deutsche+Theologie%2C+10%2C+266%29+lists+those+Lutheran+theologians+who+gave+a+place+to+the+covenant+in+their+system%2C+viz.%2C+Calixtus%2C+Wolfgang+Jager+of+Tubingen%2C+Caspar%2C+Exner%2C+Reuter%2C+and+others.+Cocceius+enjoyed+a+good+reputation+in+Germany%2C+especially+as+an+exegete%2C+even+among+the+Lutherans.+The+covenant+of+works+was+emphasized.+This+is+strange+since+there+is+no+place+for+it+in+a+consistent+Lutheran+system.+Federal+and+natural+unity+were+placed+side+by+side+in+the+covenant+of+works+without+subordinating+the+one+to+the+other.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99+in+Redemptive+History+%26+Biblical+Interpretation%3A+the+Shorter+Writings+of+Geerhardus+Vos+ed.+Richard+Gaffin+%28d.+1949%3B+Presbyterian+%26+Reformed%2C+1980%29%2C+p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef5dce598c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef5dce598c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=At%20present%20there%20is%20gneral%20agreement,subordinating%20the%20one%20to%20the%20other&amp;text=At%20present%20there%20is%20gneral%20agreement%20that%20the&amp;text=works%20without%20subordinating%20the%20one%20to%20the%20other" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-17ff3efc11" data-kw="">
<blockquote><p>The covenant of works could by no means be renewed by fallen Adam, so as thereby to help himself and his posterity out of this misery, the which is the only thing in question here; otherwise, indeed, it might have been renewed, which is evident by this sad token, that many do actually renew it in their covenanting with God, being prompted thereto by their ignorance of the high demands of the law, their own utter inability, and the way of salvation by Jesus Christ. And from the same principle our legalist here makes no question but Adam might have renewed it, and kept it too, for the after-time; only, he questions whether or not Adam might thereby have helped himself, and his posterity too, out of the misery they were brought into by his sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes in Edward Fisher, The Marrow of Modern Divinity</cite>, (Christian Focus Publications, 2009), 62 (HT).</span></figcaption>

</figure><figure class="quote" id="q-354c26cd8f" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what species of sin (peccati) there was in Adam’s fall that kindled God’s horrible vengeance against the whole human race. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper. The prohibition from the tree of knowledge of good and evil was a test of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. The very name of the tree shows the sole purpose of the precept was to keep him content with his lot and to prevent him from becoming puffed up with cupidity. The promise (promissio), which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the tree of knowledge of good and evil, were meant to test (probandam) and exercise his faith. Hence it is not hard to deduce by what means Adam provoked God’s wrath upon himself. Indeed, Augustine speaks rightly when he declares that pride was the beginning of all evils. For if ambition had not raised man higher than was meet and right, he could have remained in his original state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.1.4.</span></figcaption>

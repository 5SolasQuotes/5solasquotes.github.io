<blockquote><p>‘Your reasonable service’: This sentence, I think, was added, that he might more clearly apply and confirm the preceding exhortation, as though he had said, — “Offer yourselves a, sacrifice to God, if ye have it in your heart to serve God: for this is the right way of serving God; from which, if any depart, they are but false worshippers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Rom. 12, verse 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-630b9d1cd4" data-kw="">
<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652), section 3, sermon 19</cite>, p. 105</span></figcaption>

<blockquote><p>6. Not everything in what is called a worship service must be worship.¹ The material presence of things or actions do not therein make them formally worship (2 Chron. 6:13; 20:21-23; Neh. 8:4; Acts 20:7-11). While generally speaking a church ought to keep within ‘Principles for the Use of Indifferent Things in Worship’, as that is what is found in the Word, yet, again, there is no necessary rule that all worship must be continuous. ¹ See historic reformed writers affirm: ‘Not Everything in what is called a Worship Service must be Worship’. The Reformed in the Post-Reformation sometimes held a monetary offering to be indifferent and able to be prudently done in the worship service,¹ even in the Church of Scotland.² The Westminster Assembly on a fast day filled with worship took a collection for maimed soldiers at the end.³ Westminster, allowing for the view and practice expressed, said in her Directory for the Public Worship of God, ‘Celebration of the Communion’: “The collection for the poor is so to be ordered, that no part of the public worship be thereby hindered.” The same might be said for children’s church. ¹ At the Reformation the collection of money (and possibly other things) was frequently moved from being with the offering of the Mass to after the Lord’s Supper, and was designated for the poor. On the continent it was often done as a part of the service, either at the dismissal, or just before: Hughes O. Old, The Patristic Roots of Reformed Worship (Zurich: Theologischer Verlag Zurich, 1975), pp. 28, 46, 49, 53-54, 63, 184, 310. In the Anglican Church it was done at the Lord’s Supper; see the reform made by Cranmer, illustrating his thought, in Horton Davies, Worship &amp; Theology in England: from Cranmer to Hooker, 1534-1603 (Princeton University Press, 1973), p. 188. Even a paradigmatic separatist congregation in Amsterdam, pastored by an English puritan turned separatist, had a similar practice: Ibid, p. 339. The partially conforming puritan, Nicholas Bownd, though against a collection in the service due to disturbances, yet testifies of the practice in his context: Bownd, Sabbathum Veteris et Novi Testamenti: or The True Doctrine of the Sabbath, ed. Chris Coldwell (Naphtali Press &amp; Reformation Heritage Books, 2015), pp. 353-55. The presbyterian and independent ministers’ request to the Anglican Church at the Savoy Conference (1661) shows what was happening and is consistent with pragmatic reasons: that the “Collection for the poor may be better made at or a little before the departing of the communicants.” The Grand Debate between the most reverend Bishops &amp; the Presbyterian Divines appointed by His Sacred Majesty as Commissioners for the Review &amp; Alteration of the Book of Common Prayer... (London, 1661), ‘Exceptions’, p. 15 ² William McMillan documents the collection often being taken when coming to sit at the Lord’s Table, or while there: The Worship of the Scottish Reformed Church, 1550-1638... (London: Clarke, 1931) ch. 18, pp. 220-21; Frederick W. McNally, The Westminster Directory, its Origin &amp; Significance, PhD diss. (University of Edinburgh, 1958), pp. 325-27 ³ John Lightfoot, Journal of the Proceedings of the Assembly of Divines, John R. Pitman (London: 1824) in The Whole Works of John Lightfoot, vol. 13, Oct. 17, 1643, p. 19 Thomas Cartwright (d. 1603) was a father of presbyterianism and puritanism in the late-1500’s and a partial-conformist to the Anglican Church government and worship. Over things he did not agree with therein, the chief political advisor to Queen Elizabeth was appealed to by Edward Dering (d. 1576), another presbyterian partial-conformist, to exhort Cartwright “to use Christian liberty and to bear with the time[s].”¹ That is, if something is not impious or of itself immoral (such as children’s church is not), with sufficient justification it may be done as part of one’s liberty in Christian life, though it be in a worship service and may be considered as worship by others. See this puritan principle of partial conformity soundly theologically set forth and defended.² ¹ Peter Lake, Moderate Puritans &amp; the Elizabethean Church (Cambridge University Press, 1982), p. 19 ² See Fentiman’s quote under ‘Not Everything in what is called a Worship Service must be Worship’, the book by English, Partially Conforming Puritans, A Refutation of the Errors of Separatists (1644; RBO, 2025) and the page at large, ‘On Occasional &amp; Principled Partial Conformity without Sin, or Moderate Puritanism’.</p></blockquote>

r+Verlag+Zurich%2C+1975%29%2C+pp.+28%2C+46%2C+49%2C+53-54%2C+63%2C+184%2C+310.+In+the+Anglican+Church+it+was+done+at+the+Lord%E2%80%99s+Supper%3B+see+the+reform+made+by+Cranmer%2C+illustrating+his+thought%2C+in+Horton+Davies%2C+Worship+%26+Theology+in+England%3A+from+Cranmer+to+Hooker%2C+1534-1603+%28Princeton+University+Press%2C+1973%29%2C+p.+188.+Even+a+paradigmatic+separatist+congregation+in+Amsterdam%2C+pastored+by+an+English+puritan+turned+separatist%2C+had+a+similar+practice%3A+Ibid%2C+p.+339.+The+partially+conforming+puritan%2C+Nicholas+Bownd%2C+though+against+a+collection+in+the+service+due+to+disturbances%2C+yet+testifies+of+the+practice+in+his+context%3A+Bownd%2C+Sabbathum+Veteris+et+Novi+Testamenti%3A+or+The+True+Doctrine+of+the+Sabbath%2C+ed.+Chris+Coldwell+%28Naphtali+Press+%26+Reformation+Heritage+Books%2C+2015%29%2C+pp.+353-55.+The+presbyterian+and+independent+ministers%E2%80%99+request+to+the+Anglican+Church+at+the+Savoy+Conference+%281661%29+shows+what+was+happening+and+is+consistent+with+pragmatic+reasons%3A+that+the+%E2%80%9CCollection+for+the+poor+may+be+better+made+at+or+a+little+before+the+departing+of+the+communicants.%E2%80%9D+The+Grand+Debate+between+the+most+reverend+Bishops+%26+the+Presbyterian+Divines+appointed+by+His+Sacred+Majesty+as+Commissioners+for+the+Review+%26+Alteration+of+the+Book+of+Common+Prayer...+%28London%2C+1661%29%2C+%E2%80%98Exceptions%E2%80%99%2C+p.+15+%C2%B2+William+McMillan+documents+the+collection+often+being+taken+when+coming+to+sit+at+the+Lord%E2%80%99s+Table%2C+or+while+there%3A+The+Worship+of+the+Scottish+Reformed+Church%2C+1550-1638...+%28London%3A+Clarke%2C+1931%29+ch.+18%2C+pp.+220-21%3B+Frederick+W.+McNally%2C+The+Westminster+Directory%2C+its+Origin+%26+Significance%2C+PhD+diss.+%28University+of+Edinburgh%2C+1958%29%2C+pp.+325-27+%C2%B3+John+Lightfoot%2C+Journal+of+the+Proceedings+of+the+Assembly+of+Divines%2C+John+R.+Pitman+%28London%3A+1824%29+in+The+Whole+Works+of+John+Lightfoot%2C+vol.+13%2C+Oct.+17%2C+1643%2C+p.+19+Thomas+Cartwright+%28d.+1603%29+was+a+father+of+presbyterianism+and+puritanism+in+the+late-1500%E2%80%99s+and+a+partial-conformist+to+the+Anglican+Church+government+and+worship.+Over+things+he+did+not+agree+with+therein%2C+the+chief+political+advisor+to+Queen+Elizabeth+was+appealed+to+by+Edward+Dering+%28d.+1576%29%2C+another+presbyterian+partial-conformist%2C+to+exhort+Cartwright+%E2%80%9Cto+use+Christian+liberty+and+to+bear+with+the+time%5Bs%5D.%E2%80%9D%C2%B9+That+is%2C+if+something+is+not+impious+or+of+itself+immoral+%28such+as+children%E2%80%99s+church+is+not%29%2C+with+sufficient+justification+it+may+be+done+as+part+of+one%E2%80%99s+liberty+in+Christian+life%2C+though+it+be+in+a+worship+service+and+may+be+considered+as+worship+by+others.+See+this+puritan+principle+of+partial+conformity+soundly+theologically+set+forth+and+defended.%C2%B2+%C2%B9+Peter+Lake%2C+Moderate+Puritans+%26+the+Elizabethean+Church+%28Cambridge+University+Press%2C+1982%29%2C+p.+19+%C2%B2+See+Fentiman%E2%80%99s+quote+under+%E2%80%98Not+Everything+in+what+is+called+a+Worship+Service+must+be+Worship%E2%80%99%2C+the+book+by+English%2C+Partially+Conforming+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281644%3B+RBO%2C+2025%29+and+the+page+at+large%2C+%E2%80%98On+Occasional+%26+Principled+Partial+Conformity+without+Sin%2C+or+Moderate+Puritanism%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%98There+is+No+Divine+Obligation+for+Infants+or+Young+Children+to+Regularly+attend+an+Adult+Worship+Service%E2%80%99+%28RBO%2C+2026%29%2C+pt.+3%2C+%E2%80%98Alternatives+to+Children+attending+the+Whole+Adult+Worship+Service%E2%80%99%2C+2.+%E2%80%98Children%E2%80%99s+Church+in+Service%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F907e64c486.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/907e64c486.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=6.%20Not%20everything%20in%20what%20is,Conformity%20without%20Sin%2C%20or%20Moderate%20Puritanism&amp;text=6.%20Not%20everything%20in%20what%20is%20called%20a&amp;text=Principled%20Partial%20Conformity%20without%20Sin%2C%20or%20Moderate%20Puritanism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-f1737ae76f" data-kw="">
<blockquote><p>At the beginning of his work An Apology for the Reformed Churches, the Huguenot theologian Jean Daillé helps to remind us that there were some in the post-Reformation Church of Rome who agreed with the Reformed, yet did not consider it proper to leave the Romish communion. Daillé’s objective in writing this book was to help them see that their objections to joining the Reformed churches, on the basis that to do so would be schismatic, were groundless:

Among all those actions and persuasions of us (Protestants) that are ill taken by our Adversaries, there is scarce any that is worse resented, or for which we are more bitterly and generally reproached, then our Separation from the See of Rome, and the Churches of her Communion. For they charge us of having by this means rent asunder the bowels of Jesus Christ, and miserably torn in pieces that holy Body, which He formed of His own blood. An horrible crime (questionless) and such an one as comes but little (if at all) behind the impiety of those outrageous murderers, who nailed our Saviour to the cross, pierced his side, and hands, and feet, with their abominable spear and nails.

And whereas other parts of our doctrine offend only our enemies, this hath the ill luck to displease some of our friends: For such I take them to be who approve our belief, and yet blame us for being out of the Church of Rome. It therefore doth behove us infinitely (for the common rectifying and enlightening of both parties) to examine this accusation, and to shew, if it be possible, the injustice and nullity of it: to the end, that they who approve our belief may join themselves to our Communion, seeing the weakness of those reasons, which have hitherto kept them on a side in which they acknowledge some errors; and that they who entirely reject our persuasion may hereafter consider the grounds whereon we go, without any more troubling themselves to throw upon us this invidious but vain reproach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 1-2.</span></figcaption>

</figure><figure class="quote" id="q-74466895c6" data-kw="">
<blockquote><p>For says he [Edward Stillingfleet]: ‘…if Presbytery had been settled upon the King’s Restoration [1660], would they [Independent churches] not have continued in their Separation?… 4. Had the Presbyterian government been settled at the King’s Restoration, by the encouragement and protection of the practise of it, without a rigorous imposition of every thing supposed by any to belong thereunto, or a mixture of human constitutions, if there had any appearance of a schism or separation continued between the parties, I do judge they would have been both to blame. For as it cannot be expected that all churches and all persons in them should agree in all principles and practises belonging unto Church order, nor was it so in the days of the apostles, nor ever since among any true Churches of Christ, so all the fundamental principles of Church communion would have been so fixed and agreed upon between them, and all offences in worship so removed, as that it would have been a matter of no great art absolutely to unite them, or to maintain a firm communion among them, no more than in the days of the apostles, and the primitive times, in reference to the differences that were among Churches in those days. For they allowed distinct communion upon distinct apprehensions of things belonging unto Church order or worship, all keeping the unity of the Spirit in the bond of peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, ... (1681), pp. 346-47</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3be63b5057" data-kw="">
<blockquote><p>Quest. 1. If it be not lawful to make the image of God the Father, yet may we not make an image of Christ, who took upon him the nature of man? Resp. No. Epiphanius seeing an image of Christ hanging in a church, broke it in pieces; ’tis Christ’s Godhead, united to his manhood, that makes him to be Christ; therefore to picture his manhood, when we cannot picture his Godhead, is a sin, because we make him to be but half Christ; we separate what God hath joined, we leave out that which is the chief thing, which makes him to be Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, (1692), 280. [spelling modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f49c1f4576" data-kw="">
<blockquote><p>At their famous council of 754, the iconoclasts, as is well-known, did not denounce all representations of Christ but only those which attempted in one way or another to stimulate his outward form or appearance by means of painting or sculpture. In fact, they specifically endorsed what they called the image of Christ as set forth in the Eucharist… Many, however, seem not to be aware that the iconoclasts at the same time announced their approval of still another, and, from the ethical point of view, at least, more significant conception of an image, which described the virtues of the saints as living images and called for their imitation. This spiritual or ethical interpretation of the image is probably to be understood as a part of the iconoclastic campaign to purify Christian worship of what many took to be superstitious and idolatrous practices. Our knowledge of these iconoclastic efforts in the direction of reform, dating from the so-called First Iconoclastic period (726-787), we owe principally to the text of the oros, (Horos, or dogmatic definition) and anathemas pronounced by the iconoclastic Council of 754… Apart from a brief general introduction and conclusion, the florilegium of 754 consists of eight excerpts from the fathers, of which all but two deal with what I shall, for the sake of brevity, call the ethical theory of the image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers</cite>, vol. 8 (1954), pp. 153-60, p. 153</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-46af5bd0b2" data-kw="">
<blockquote><p>We consider the placement of images and statues in the places of worship as explicitly forbidden by God’s Word a thousand times. For why else would they be placed there except for worship? Is it to stir the memory? And yet the Holy Spirit is wiser than we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (1559, RHB, 2016), p. 144</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-aba9d7468c" data-kw="">
<blockquote><p>In this sort may Christians honor the cross: for who makes any question but in our wars against the Jews or Mahumetists, we may bear our ensigns or arms crossed, for public testifying to the infidels that we are Christians, and our adversaries are miscreants and void of faith. So may the cross be engrave[n] on money to show that it is the coin or stamp of a Christian prince. So may the cross be placed on the gates of cities, castles or houses, to deliver apparently that the inhabitants in such places do make profession of Christianity. So was it long since ordained that the instruments of contracts or bargaining made by public notaries should be sealed and signed with the cross, as it is read in lib. de Cod. And in such like politic considerations, we reject not the use of the material cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise on the Virtue of the Cross &amp; the True Manner How to Honour It</cite>, (London, 1599), ‘How the Cross Ought to be Honored’, no page number. de La Faye (1540-1615) served with Theodore Beza in Geneva as a reformed professor of philosophy and theology.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

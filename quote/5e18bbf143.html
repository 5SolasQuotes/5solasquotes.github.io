<main class="wrap"><figure class="quote" id="q-5e18bbf143" data-kw="">
<blockquote><p>It is a remarkable coincidence that the very defect under which natural religion specially labours is just that which it was professedly the leading object of the Christian revelation to supply. If natural religion, whatever measure of light it may be fitted to cast upon the character and moral government of God and a future state, plainly teaches men that they are sinners, or transgressors of God’s laws, but does not plainly teach that God will forgive sin, or distinctly point out in what way, or upon what terms, forgiveness is to be secured; then men who have only the light of nature to guide them, even though they are making the best use of it, and indeed we might say just because they are making the best and fullest use of it, must be in a state of fearful anxiety and alarm as to the way and manner in which the sins they have committed are to tell upon their ultimate destiny.

Now, in this state the Christian revelation presents itself to their notice, and challenges their investigation. And in doing so it holds out, as one of its leading recommendations, that it professes to give a full solution of these important and perplexing questions which natural religion could not solve. It confirms indeed all the fears and apprehensions of nature as to the intrinsic difficulties connected with the subject of the pardon of sin, and the insufficiency of repentance; but, at the same time, it fully reveals the mercy of God, assures us of his readiness to pardon, and of his desire to save men, and unfolds to us a great scheme through which God has provided for securing this object, in full consistency with all the attributes of his nature and all the principles of his moral government, and gives us full and explicit instructions as to what we must do in order that we may escape the wrath and curse of God due to us for our sins, and attain to the enjoyment of his favour and eternal happiness.

Christianity has been sometimes called by infidels a mere republication of the law of nature, and some of those who have assumed the designation of rational divines have been able to see little more in it than this, and have been willing to rest its claims upon the additional clearness and certainty which it gives to the doctrines of natural religion. But this is a very inadequate view of Christianity, even when viewed simply as a revelation.

It is very manifest, even upon the face of it, that its leading peculiarity is, that it unfolds a remedial scheme, that it is adapted and addressed to man as a sinner—to man viewed not merely as a creature of God’s hand, and a subject of his government, but as a transgressor of his law; and that its most peculiar and transcendent value lies in its making known to us from God himself, and upon his own authority, his merciful and gracious purposes in regard to sinful men; the nature and character of the provision he has made for pardoning them, and the way and manner in which men individually are to obtain forgiveness.

Every man who had made a right and full use of the light of nature, so as to be alive to its defects, and desirous of further information on these momentous questions on which it leaves men so much in the dark, would regard this feature, which stands out so legibly stamped upon the Christian revelation, as affording, if not a positive presumption of its truth, at least a loud call to inquire seriously into its origin, evidences, and authority, and would be determined by it to prosecute the inquiry with all earnestness and impartiality, until firmly and distinctly persuaded either that Christianity is, as it professes to be, a revelation from God to men on matters essentially involving their destiny and happiness, or else a cunningly devised fable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture IX, pp 120-21.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-54003c0f60" data-kw="">
<blockquote><p>The practice of the ancient heathen rulers furnishes an argument for the public support of religion that ought not to be ignored. Ignorant as they were of supernatural revelation, they were necessarily thrown on the light of nature for direction. In such circumstances we have a right to apply the principle laid down by the Apostle Paul, when arguing with the Corinthians – “Doth not even nature teach you?”

Ignorant as they were of the true religion, the ancient heathen nations had an idea of the value and influence as a means of social improvement. However much their false religions may have failed as to the end proposed, their example shows at least that even the light of nature, dim as it is, suggests the obligation, to provide for the religious instruction of the community. …

The argument from the light of nature may not consistently be set aside as irrelevant by those who reject the authority of Scripture, claiming that civil government is founded in the law of nature, and that the light of nature is adequate for its administration. Mistaken as such are on this latter point, their own avowed principles demand of them an admission of the obligation of the civil magistrate to provide for the instruction of the people, as indicated by the light of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Support of Religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>

</a></div>
</figure><figure class="quote" id="q-5544b6ab43" data-kw="">
<blockquote><p>If the ministers of the civil power command thee to honour and glorify God, as God will be honoured, to defend (with thy person and goods) thy country against the enemies, to do such things as be for the wealth and benefit of thy country: thou art bounden to do it: for it is good, and God will have thee to do it. And if thou do it not, thou sinnest against God, and justly deservest the punishment not only of the power, but of everlasting damnation.

But if the ministers of the civil power command thee to dishonour God, to commit idolatry, to kill an innocent, to fight against thy country, to give or lend that thou hast, to such as mind the subversion and destruction of thy country, or to maintain them in their Wickedness, thou oughtest not to do it, but to leave it undone: for it is evil, and God (the supreme and highest power) will not that thou shouldest do it. The apostles in time of persecution did not only give us an example so to do, when the worldly powers would have had them to follow their proceedings, but also left us a lesson so to do.

God must be obeyed (say they) rather than men. And this lesson even from the beginning before it was written, was by the holy Ghost printed in man’s heart. When Pharaoh the tyranny commanded the midwives of the Egyptians, to kill all the male children that should be borne of the Israelites wives: think ye, he did only command them? No without doubt. Ye may be sure, he commanded not only upon threatened pains, but also promised them largely: and perchance as largely as those do, that being desirous of children, procure the midwives to say, they be with child, when their belly is puffed up with the dropsy or mole, and having bleared the common peoples’ eyes with processioning, Te deum singing, and bonfire blanketing, use all ceremonies and crying out, whilst an other bird’s egg is laid in the nest. But these good midwives fearing God (the high power) who had commanded them, not to kill, would not obey this tyrannical Pharaoh’s commandment, but left it undone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ponet.html">John Ponet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise of politick power and of the true obedience which subjects owe to kings and other civil governors, with an exhortation to all true natural English men</cite>, (Strasbourg: The heirs of W. Köpfel, 1556), unpaginated.</span></figcaption>

midwives+to+say%2C+they+be+with+child%2C+when+their+belly+is+puffed+up+with+the+dropsy+or+mole%2C+and+having+bleared+the+common+peoples%E2%80%99+eyes+with+processioning%2C+Te+deum+singing%2C+and+bonfire+blanketing%2C+use+all+ceremonies+and+crying+out%2C+whilst+an+other+bird%E2%80%99s+egg+is+laid+in+the+nest.+But+these+good+midwives+fearing+God+%28the+high+power%29+who+had+commanded+them%2C+not+to+kill%2C+would+not+obey+this+tyrannical+Pharaoh%E2%80%99s+commandment%2C+but+left+it+undone.%E2%80%9D%0A%0A%E2%80%94+John+Ponet%2C+A+short+treatise+of+politick+power+and+of+the+true+obedience+which+subjects+owe+to+kings+and+other+civil+governors%2C+with+an+exhortation+to+all+true+natural+English+men%2C+%28Strasbourg%3A+The+heirs+of+W.+Ko%CC%88pfel%2C+1556%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5544b6ab43.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5544b6ab43.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/06/07/john-ponet-on-refusing-to-comply-with-tyranny/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>

</figure><figure class="quote" id="q-5111f482c3" data-kw="">
<blockquote><p>The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1273808112" data-kw="">
<blockquote><p>Nothing of ourselves. For remission of sins and adoption and unspeakable glory are given to us by Him. For he exhorts them no longer from the things to come only, but even from those now present. For consider. He said, that we shall be raised again, and go on unto incorruption, and have an eternal house; but since present things have more force to persuade than things to come, with those who believe not in these as they ought to believe, he shows how great things they have even already received, and being themselves what. What then being, received they them? Dead all; (for he saith, “all died;” and, “He died for all;” so loved He all alike;) inveterate all, and grown old in their vices. But behold, both a new soul, (for it was cleansed,) and a new body, and a new worship, and promises new, and covenant, and life, and table, and dress, and all things new absolutely. For instead of the Jerusalem below we have received that mother city which is above (Gal. 4:26); and instead of a material temple have seen a spiritual temple; instead of tables of stone, fleshy ones; instead of circumcision, baptism; instead of the manna, the Lord’s body; instead of water from a rock, blood from His side; instead of Moses’ or Aaron’s rod, the Cross; instead of the promised [land], the kingdom of heaven; instead of a thousand priests, one High Priest; instead of a lamb without reason, a Spiritual Lamb. With these and such like things in his thought he said, “all things are new.” But “all” these “things are of God,” by Christ, and His free gift. Wherefore also he added, “Who reconciled us to Himself through Christ, and gave unto us the ministry of reconciliation.” For from Him are all the good things. For He that made us friends is Himself also the cause of the other things which God hath given to His friends. For He rendered not these things unto us, allowing us to continue enemies, but having made us friends unto Himself. But when I say that Christ is the cause of our reconciliation, I say the Father is so also: when I say that the Father gave, I say the Son gave also. “For all things were made by Him;” (John 1:3) and of this too He is the Author. For we ran not unto Him, but He Himself called us. How called He us? By the sacrifice of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Homilies of St. John Chrysostom, Archbishop of Constantinople, on the Epistle of St. Paul to the Romans,” in Saint Chrysostom: Homilies on the Acts of the Apostles and the Epistle to the Romans</cite>, ed. Philip Schaff, trans. J. Ashworth and Talbot B. Chambers, vol. 12, A Select Libra</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister</cite></span></figcaption>

<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, 611.</span></figcaption>

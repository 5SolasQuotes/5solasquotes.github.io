<main class="wrap"><figure class="quote" id="q-aef1bfff79" data-kw="">
<blockquote><p>Jehoahaz the son of Jehu began to reign over Israel in Samaria, and reigned seventeen years. And he did that which was evil in the sight of the Lord, and followed the sins of Jeroboam the son of Nebat, which made Israel to sin; he departed not therefrom… He delivered them into the hand of Hazael king of Syria, and into the hand of Benhadad the son of Hazael, all their days. And Jehoahaz besought the Lord, and the Lord hearkened unto him: for He saw the oppression of Israel, because the king of Syria oppressed them. And the Lord gave Israel a saviour, so that they went out from under the hand of the Syrians:</p></blockquote>

</figure><figure class="quote" id="q-498d9d8ee6" data-kw="">
<blockquote><p>If you look into 1 Peter 3:19-20, you there find that Christ “went and preached unto the spirits in prison; which sometime were disobedient, when once the long-suffering of God waited in the days of Noah.” The meaning of which is, that in the days before the flood, Christ by his Spirit strove [Gen. 6:3] with the disobedient and rebellious sinners in the ministry of Noah, who then were living men and women as we are, but now are “spirits in prison,” that is, damned souls in hell, for their disobedience…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Knocking at the Door of Sinners’ Hearts; or, A Solemn Entreaty to Receive the Savior and His Gospel in This the Day of Mercy</cite>, (New York: American Tract Society, 1850), p. 97. This quote was compiled by Tony Byrne.</span></figcaption>

</figure><figure class="quote" id="q-a6e65f718d" data-kw="">
<blockquote><p>Of whom speaks the Confession this? Of the God of the elect only? Or of the God of every man? Is He the God of the elect only? Is He not also of the non-elect? Is this description of the gracious nature and attributes of God intended to be restricted to a part of mankind? Is not God as thus delineated the Creator and Father of every man without exception? Can it be supposed that the authors of this statement meant to be understood to say that God is not such a being for all men, but only for some? If this section does not teach the unlimited love and compassion of God towards all men as men, as his creatures, it teaches nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (1893), pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-ec40d74b95" data-kw="">
<blockquote><p>It must also be borne in mind that elsewhere Hoeksema’s [who denies common grace] definition of the word ‘goodness’ is very different from the meaning commonly given to it by Reformed writers and, more particularly, its usage in the Westminster Standards. For example, in Answer 4 of the Shorter Catechism, we read, ‘God is a Spirit, infinite eternal and unchangeable in his being, wisdom, power, holiness, justice, goodness and truth’. The Shorter Catechism has been criticised by some at this point for not using the terms ‘grace, mercy, love’, but it must be recognised that in the minds of the Westminster Assembly the term goodness included all of these. This explains why the term ‘goodness’ is expanded in the Larger Catechism as equivalent to ‘most merciful and gracious, long-suffering, and abundant in goodness’ (Answer 7) and in the Westminster Confession as ‘most loving, gracious, merciful, longsuffering, abundant in goodness…forgiving iniquity, transgression and sin; the rewarder of them that diligently seek him…’ (Ch. 2.1). The terms ‘good’ and ‘goodness’ (Heb. tob) are consistently linked to God’s mercy or faithful love (Heb. chesed), for example in Psalms 23:6, 25:7-8, 86:5, 100:5, 145:9 etc., and when Psalm 34:8 is referred to in 1 Peter 2:3, the term is rendered ‘gracious’ (Gk. chreestos: A.V. ‘kind’). No doubt this explains why the term is rendered ‘gracious’ in the 1650 Metrical Psalter rendering Psalm 86:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-silversides.html">David Silversides</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Offer: Biblical &amp; Reformed</cite>, (Marpet Press, 2005), p. 16-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

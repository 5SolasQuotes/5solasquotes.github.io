<main class="wrap"><figure class="quote" id="q-53e918709b" data-kw="">
<blockquote><p>The Virgin Mary… completely sanctified by the grace and blood of her only Son and abundantly endowed by the gift of the Holy Spirit and preferred to all… now lives happily with Christ in heaven and is called and remains ever-Virgin and Mother of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Hilda Graef, Mary: A History of Doctrine &amp; Devotion, combined ed. of vols. 1 &amp; 2 (London: Sheed &amp; Ward, 1985), vol. 2, pp. 14-15. Bullinger was also a main author of the Second Helvetic Confession, quoted on this webpage.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b95374da72" data-kw="">
<blockquote><p>Last of all, which you make the greatest matter, the perpetual virginity of the mother of Christ after his birth, although for my part I do believe it, and wish all men so to do, yet dare I affirm that it is not damnable not to believe it except it can be proved that the Scripture has taught it. But you object against me first the condemnation of Helvidius testified by Sozomenus. Whereto I answer that he was justly condemned, not because he believed not, but because he did obstinately deny it, and troubled the peace of the church about an unnecessary question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Sincere &amp; True Translations of the Holy Scriptures into the English Tongue... (London, 1583), A Brief Confutation of Sundry Cavils…</cite>, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-cc430317f8" data-kw="Mary">
<blockquote><p>The Papists discover amazing stupidity by singing, in honor of Mary, those very words by which their superstition is expressly condemned, and who, in giving thanks, detach the woman&#x27;s saying, and leave out the correction.</p></blockquote>

— John Calvin, Commentary on a Harmony of the Evangelists, Luke 11:27-28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Papists+discover+amazing+stupidity+by+singing%2C+in+honor+of+Mary%2C+those+very+words+by+which+their+superstition+is+expressly+condemned%2C+and+who%2C+in+giving+thanks%2C+detach+the+woman%27s+saying%2C+and+leave+out+the+correction.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+a+Harmony+of+the+Evangelists%2C+Luke+11%3A27-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcc430317f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cc430317f8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom32" rel="noopener" target="_blank">Read it online · CCEL, vol. 2</a></div>
</figure><figure class="quote" id="q-ce7d2c08fc" data-kw="">
<blockquote><p>Nay, here idolatry is manifest; since the worship of adoration and religious invocation is due to God alone (Ps. 50:15; Matt. 4:10; Rom. 10:17), nor can the calves of the lips be offered to the Saints, nor the incense of prayers burned to them, without their thereby being reckoned omniscient, omnipotent, omnipresent, and immense — able in a moment to be present to all who invoke them, in various places, on various matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Concise Refutation of Papism</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/prayers-to-saints-and-for-the-dead.html">Prayers to Saints and for the Dead</a> › <a href="../topics/prayer/prayers-to-saints-and-for-the-dead/invocation-of-saints-refuted.html">Invocation of saints refuted</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/invocation-of-saints.html">Invocation of saints</a></span></div>

— Samuel Maresius, A Concise Refutation of Papism, p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNay%2C+here+idolatry+is+manifest%3B+since+the+worship+of+adoration+and+religious+invocation+is+due+to+God+alone+%28Ps.+50%3A15%3B+Matt.+4%3A10%3B+Rom.+10%3A17%29%2C+nor+can+the+calves+of+the+lips+be+offered+to+the+Saints%2C+nor+the+incense+of+prayers+burned+to+them%2C+without+their+thereby+being+reckoned+omniscient%2C+omnipotent%2C+omnipresent%2C+and+immense+%E2%80%94+able+in+a+moment+to+be+present+to+all+who+invoke+them%2C+in+various+places%2C+on+various+matters.%E2%80%9D%0A%0A%E2%80%94+Samuel+Maresius%2C+A+Concise+Refutation+of+Papism%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce7d2c08fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce7d2c08fc.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>

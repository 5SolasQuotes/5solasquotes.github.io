<main class="wrap"><figure class="quote" id="q-162a9cd4cd" data-kw="">
<blockquote><p>Now indeed these two kinds of theology are so different that they cannot truthfully be related to some one, definite head and shared genus. Of course the first kind of theology, which we have named divine and a prototype, does not belong to the one genus nor indeed to the other. The nature of the first kind of theology and of the second kind makes clear that its genus is not common with this created theology. For that essential, archetypal theology is a characteristic of the nature of God, and part (as we would put it) of that infinite knowledge which in God is essential. Whatever is essential, moreover, it is agreed that this is properly assigned to the same genus, together with the actual essence of which that thing is essential; so we speak of part for whole, and limb for body of the same kind, and sharing in the genus. God, however, is above every genus, essence beyond essence, as the holy fathers very aptly called Him. This theology in fact does not belong to the essence of those things to which it pertains, but attaches to them like a garment, as it were, enrobing their essence so to speak. And hence it is as far removed from that essence (so that I may use a common expression) as is heaven from earth. That it is not a part of that genus which we were discussing in the second passage, nature itself and reason show with all possible clarity. For if in fact it is essential, as it is, and in that respect of the same kind as the nature of God, certainly its reason will be the same and of the divine essence. But since that divine essence or nature is truly beyond essence and is limited by nothing shared with any other genus whether properly or improperly, that is, simply or by reduction, we claim most properly and certainly that this theology is beyond essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, 105.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66f80beee9" data-kw="">
<blockquote><p>1. Vos is very insightful and helpful for developing a Reformed natural theology.

2. Vos’s natural-theological method and underlying cognitive theory differ substantively from both that of Thomas Aquinas and even most Reformed scholastics (Voetius, Turretin, Maastricht, Charnock…). Associating Vos with Thomism (as Fesko seems to do in his Introduction) is inaccurate and amateurish.

3. Vos’s and Van Til’s accounts are fundamentally aligned. A main difference between Vos and Van Til is that Van Til makes the implanted knowledge of God a condition for the possibility of not only (i) the acquired knowledge of God but also (ii) knowledge of creatures—which Vos may not even disagree with. Non-Thomist elements in Vos’s natural theology—which also distinguish him from many Reformed scholastics:

1. Innate knowledge of God. The innate knowledge of God (i) involves a “thick” concept of God as absolute being (not a general concept of a highest being), (ii) is produced in all people by the Holy Spirit’s illumination, and (iii) is the principle of knowledge of God acquired through experience and inference.

2. Ontological argument. An adjusted form of the ontological argument is sound. It consists merely in drawing attention to the innate knowledge of God—not in deducing God’s existence from a concept of God’s essence (p. 52, n. 113; p. 56, n. 127).

3. Cosmological arguments. Arguments which simply prove that an uncaused cause exists are weak: They don’t prove that the cause must be an absolute being (p. 55, n. 124). The innate knowledge of God (as an absolute being) grounds our knowledge that every (non-absolute) effect requires a cause (p. 55, n. 127). Vos thinks that innate knowledge of God is a condition for the possibility of acquired knowledge of God, and he takes himself to be following Calvin here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Natural Theology</cite>, ed. J.V. Fesko, trans. Albert Gootjes</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-8d532074d1" data-kw="">
<blockquote><p>I subscribe to that of Clement of Alexandrinia: We ought not to swear allegiance to any sect of philosophers, whether Stoics, Epicures, Platonists, or Peripatetics, but we must select and embrace whatsoever is true and faithfully delivered concerning God by any sect; and the Truth selected out of all sects is not vain philosophy, but Natural Divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite></span></figcaption>

</figure><figure class="quote" id="q-324bf4807f" data-kw="">
<blockquote><p>Alongside of the archetypal knowledge of God, found in God Himself, there is also an ectypal knowledge of Him, given to man by revelation. The latter is related to the former as a copy is to the original, and therefore does not possess the same measure of clearness and perfection. All our knowledge of God is derived from His self-revelation in nature and in Scripture. Consequently, our knowledge of God is on the one hand ectypal and analogical, but on the other hand also true and accurate, since it is a copy of the archetypal knowledge which God has of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (For more on this see Recovering the Reformed Confession.)</span></figcaption>

<blockquote><p>Having noted these presuppositions, we now say that no human reason can be the principle by which or through which, or else on the ground of which or why we believe, or the foundation, law, or norm for what must be believed, under whose direction we are to judge.</p></blockquote>

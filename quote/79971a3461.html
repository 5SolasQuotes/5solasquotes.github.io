<main class="wrap"><figure class="quote" id="q-79971a3461" data-kw="">
<blockquote><p>§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Domestical Duties… (London: 1622) | 7th Treatise, “Duties of Servants” | section 9</cite>, p. 602</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-67d3f536c8" data-kw="">
<blockquote><p>Some of the interpreters refer these words [1 Cor. 11:16] to the question in hand, and think that the apostle is here opposing the custom of the Churches to these that contended for men covering their heads in public meetings: but the better sort take this to be spoken against the study of contention, and think the apostle his meaning here is only to show that it is not his fashion, nor the fashion of the Churches of God, to be contentious for matters of such indifferency as those were of.</p></blockquote>

</figure><figure class="quote" id="q-ecf7db324f" data-kw="">
<blockquote><p>At this day the Mahometans (or Turks) speak to their superiors covered, and so are covered also in their religious performances. The custom with us in these western parts is quite otherwise; the uncovering of the head is a sign or token of subjection: hence ministers pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11 | v. 4</cite></span></figcaption>

<blockquote><p>Our Covenanting forefathers were eminently honoured to contend for the crown-rights of the Redeemer. In their national vows, they plighted the allegiance of the nation to Him – and by those federal deeds, rulers and people were taken bound to consult for the promotion of Christ’s honour, and the interests of true religion, above any worldly interests. The laws passed in the reforming period in Britain were the embodiment of the grand fundamental principles of the Redeemer’s kingdom; and for a brief period, like a gleam of bright sunshine in the history of the nation, the doctrine was generally proclaimed, and widely respected, that Christ Jesus should reign supreme in his own house, and among his people, and that earthly rulers should yield Him all homage and subjection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 335.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79ac24fe26" data-kw="">
<blockquote><p>The Papists have often endeavoured to overthrow the Reformation by secret plots and conspiracies. So there were many plots against the life of Luther. The Papists were engaged in contriving to dispatch him, and to put him out of their way; and he, as he was a very bold man, often very much exposed himself in the cause of Christ: but yet they were wonderfully prevented from hurting him, and he at last died in his bed in peace.

And so there have been from time to time innumerable schemes secretly laid for the overthrow of the Protestant religion; among which, that which seem to be most considerable, and which seemed to be the most likely to have taken effect, was that which was in the time of King James II. of England, which is within the memory of many of us. There was at that time a strong conspiracy between the King of England and Lewis XIV. of France, who were both Papists, to extirpate the Northern heresy, as they called the Protestant religion, not only out of England, but out of all Europe; and had laid their schemes so, that they seemed to be almost sure of their purpose.

They looked upon it, that if the Reformed religion were suppressed in the British realms, and in the Netherlands, which were the strongest part, and chief defence of the Protestant interest, they should have easy work with the rest. And just as their matters seemed to become to a head, and their enterprise ripe for execution, God, in his providence, suddenly dashed all their schemes in pieces by the Revolution, at the coming in of King William and Queen Mary; by which all their designs were at an end; and the Protestant interest was more strongly established, by the crown of England’s being established in the Protestant house of Hanover, and a Papist being, by the constitution of the nation, for ever rendered incapable of wearing the crown of England. Thus they groped in darkness at noon day as in the night, and their hands could not perform their enterprise, and their kingdom was full of darkness, and they gnawed their tongues for pain. …

There was also a terrible persecution in England in Queen Mary’s time, wherein great numbers in all parts of the kingdom were burnt alive. After this, though the Protestant religion has been for the most part established by law in England, yet there have been very severe persecutions by the high church men, who symbolize in many things with the Papists. Such a persecution was that which occasioned our forefathers to flee from their native country, and to come and settle in this land, which was then an hideous howling wilderness. These persecutions were continued with little intermission till King William come to the throne.

Scotland also has been the scene, for many years together, of cruelties and blood by the hands of high churchmen, such as came very little short of the Popish persecution in Queen Mary’s days, and in many things much exceed it, which continued till they were delivered by King William. …

So since, when the Popish powers have plotted the overthrow of the Reformed church, and have seemed just about to bring their matters to a conclusion, and to finish their design, then God has wonderfully appeared for the deliverance of his church, as it was in the time of the Revolution by King William.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), pp 225, 228, 242.</span></figcaption>

e26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/79ac24fe26.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/20/jonathan-edwards-on-king-william-iii-and-the-defeat-of-popish-plots-against-the-reformed-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…we must not imagine that there are many Churches in the world, neither is that body to be separated which can bear or suffer no kind of division. Writers call the Church catholic, which undoubtedly signifies universal, because it is but one, neither can there be any more… And particular or several churches are as towns or cities in a kingdom: the multitude of cities divides not a kingdom. Of particular churches† dispersed throughout all the world, as a body of many members, is gathered and compacted together the catholic and universal church, which is the fellowship of all the saints. Therefore most certain it is that there is but one only Church of God, not many, whereof the only monarch is Jesus Christ; to whom be glory. † [Bullinger likely has in mind national or regional Churches (as numerous on this webpage); see sermon 1, p. 10 (top) where he speaks “of all the particular churches throughout the whole world, and of all the visible parts and members thereof.” The “visible parts” of such particular churches, in distinction from members, likely referred to lower levels of the Church under national Churches. Bullinger also speaks in that place of discipline being brought on the obstinate, likely referring to excommunication (Bullinger, Questions of Religion Cast Abroad (1572), ch. 14, pp. 119-20), which for him likely would have been carried out regionally.] The unity and united society of this Church of God is so great that out of her fellowship is there no people found acceptable unto God, any true salvation or safety, any light or truth; for without the pale of God’s church are no wholesome pastures found, all are infected with poison. No religion pleases God out of the Church of God… Lactantius therefore most truly says: “It is only the catholic Church, which retains true religion. Here is the fountain of truth: this is the household of faith: this is the Temple of God; into which if one enter not, or out of which if any depart, he is excluded from the hope of salvation and life everlasting.” [Institutes, bk. 4, ch. 30 (Leiden, 1660), p. 450] For our Saviour first said, that out of the sheepfold life is not found.</p></blockquote>

+likely+would+have+been+carried+out+regionally.%5D+The+unity+and+united+society+of+this+Church+of+God+is+so+great+that+out+of+her+fellowship+is+there+no+people+found+acceptable+unto+God%2C+any+true+salvation+or+safety%2C+any+light+or+truth%3B+for+without+the+pale+of+God%E2%80%99s+church+are+no+wholesome+pastures+found%2C+all+are+infected+with+poison.+No+religion+pleases+God+out+of+the+Church+of+God%E2%80%A6+Lactantius+therefore+most+truly+says%3A+%E2%80%9CIt+is+only+the+catholic+Church%2C+which+retains+true+religion.+Here+is+the+fountain+of+truth%3A+this+is+the+household+of+faith%3A+this+is+the+Temple+of+God%3B+into+which+if+one+enter+not%2C+or+out+of+which+if+any+depart%2C+he+is+excluded+from+the+hope+of+salvation+and+life+everlasting.%E2%80%9D+%5BInstitutes%2C+bk.+4%2C+ch.+30+%28Leiden%2C+1660%29%2C+p.+450%5D+For+our+Saviour+first+said%2C+that+out+of+the+sheepfold+life+is+not+found.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Decades%2C+2nd+Sermon%2C+%E2%80%98That+there+is+One+catholic+Church%3B+that+without+the+Church+there+is+no+light+or+salvation%3B+against+schismatics%3B+wherefore+we+depart+from+the+upstart+Church+of+Rome%3B+that+the+Church+of+God+is+the+house%2C+vineyard+and+Kingdom+of+God%3B+and+the+body%2C+sheepfold+and+spouse+of+Christ%3B+a+mother+and+a+virgin%E2%80%99+in+The+Decades+ed.+Thomas+Harding+%281549%3B+Cambridge%3A+Parker+Society%2C+1850%29%2C+vol.+4%2C+5th+Decade%2C+pp.+49-92%2C+pp.+50-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d2531e69e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d2531e69e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-phrase-there-is-no-salvation-outside-the-church/#:~:text=we%20must%20not%20imagine%20that%20there,the%20sheepfold%20life%20is%20not%20found&amp;text=we%20must%20not%20imagine%20that%20there%20are%20many&amp;text=out%20of%20the%20sheepfold%20life%20is%20not%20found" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9fae10ed87" data-kw="">
<blockquote><p>The God of truth and of peace (which two titles are the most resplendent gems in the crown of God’s glorious attributes) has commanded us to embrace and maintain with equal love and zeal the truth and peace (Zech. 8:19). Since also both these are the legacies of our blessed Saviour, bequeathed to his Church by his Testament, sealed with his blood; certainly every sincere Christian is concerned in both (2 Cor. 4:1); but the stewards of the mysteries of God are yet more deeply engaged in the preservation or restoration of both, to their utmost ability. At present, our amazing and distressing thoughts are great for the divisions of Reuben (to use the words of Deborah, Jud. 5:15) and the spiritual flames of dissension which (like the late dreadful fire in the city) devour the strength and beauty of our Church, call for the assistance of all hands to quench them. But as in a conflagration, while some labor to repress the violence, or stop the course of the spreading fire, others are employed to guard the goods, and, while they stand with aching hearts for the calamity, do good service in perserving their neighbours as well as their own goods from perishing or plunder: so while my brethren, the blessed sons of peace, are hard at work, in drawing water out of the ever-living spring, the Scripture, which plentifully affords the Word of truth and peace, and applying the same for the allaying of these consuming flames (whose endeavours for the peace of Jerusalem I pray God to prosper) I have undertaken to preserve and rescue an important truth concerning justification, from the attempts made by same to corrupt or obscure this heavenly doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</span></figcaption>

<blockquote><p>III. Man was eminently created by God in his own Image, after his Likeness, in respect of Sanctity and Holiness, Integrity and Rectitude.

There is a moral as well as intellectual Perfection. The Blessedness of God and his Glory lies in both. HE is infinitely and unchangeably possess’d of both. Nor is there any possible Perfection of Souls or Angels, but it must be both in Mind and Understanding, and also in Will and Affections. This is to follow the Dictate of that, and then the Light of God rules in the Heart; which is what we are call’d to by the Voice of Reason and Scripture. Then all is regular, wise, just, perfect.

There is none Holy as the Lord. He is glorious in Holiness. Holy, Holy, Holy, is his Name. Christ is the Holy One of God, and all the Angels of Heaven are holy Ones. They proclaim the equal Holiness of Father Son and Spirit, while they treble the Praises of the Divine Holiness. What then should be the Image of God on the Seraphims but their Holiness? while with cover’d Faces they make the Superlative Holiness of God the Subject of their Adoration. They never cease from this, They rest not Day and Night saying, Holy, Holy, Holy, Lord God Almighty! which art and wast and art to come. The Work of Saints on Earth is just the same, Exalt the Lord our God and worship at his Footstool, for the Lord our God is holy. And again, Give Thanks at the Remembrance of his Holiness.

This renders God fearful in Praises, that He is glorious in Holiness. “A perfect Understanding must have a perfect Will, and where the Mind and Will is perfect there must be perfect Holiness. Therefore is the Name of God most holy and reverend. He must needs be Holy in all his Works. He must needs then make Angels and Men holy. They could not come other out of his holy Hand. The Impress and Stamp of his Holiness must be upon them. Being capable of this Image of God, and it being necessary to their Perfection, they could not possibly be destitute of it. If every Word of God is pure, so is every Work. He cannot look upon Iniquity, he is of purer eyes than to behold it, he hates and loaths it, and loves Righteousness.

This bears his own Likeness, and is therefore lovely in his Eyes, for he infinitely loves Himself. We read, The Lord loveth the righteous: why? but because He is Himself righteous, and those that love and do Righteousness are like to Him. This one Thing is easily found, nor is all the Wisdom of Solomon needed to find it out, that God made Man upright. He could not make him otherwise. This Uprightness in the Creature is the Image of God upon it.

Men are Partakers of a Divine Nature, in the Regeneration of Souls. They are made upright and sincere in the Sight of God. Integrity and Uprightness preserves them, and they escape the Corruption that is in the World thro’ Lust, and add to their Faith, Virtue, Knowledge, Temperance, Patience, Godliness, brotherly Kindness and Charity. The Sons of Men (you see here) are capable of such a Glory and Likeness to God as to become again Partakers of the Divine Nature. This cannot possibly mean any thing more or less than some Restoration of the Image of God in them. The Loss of that Image is supposed, and it is said to be the Want of Original Righteousness &amp; the Corruption of his whole Nature.

He has corrupted himself thro’ Lust, and the World lies in this Corruption, it is propagated from Age to Age, and common to all Places. But then there is thro’ Grace an Escaping out of this Corruption, which some are made Partakers of, thro’ Sanctification of the Spirit. That is to say, they are made holy, virtuous, wise, temperate, patient, godly by the Power of Divine Grace, making a glorious Change in them; whereby they do again partake of that Divine Nature which was the Likeness of God upon Man in his first Creation.

This is the true and genuine Meaning of St. Peter‘s Words, repeated in the next Chapter They have escaped the Pollutions of the World, thro’ the Knowledge of the Lord and Saviour Jesus Christ. These the Holy Ghost calls new Men and new Creatures; being renewed in the Spirit of their Mind; the old Man being put off, which is corrupt according to deceitful Works, and the New Man put on, which after God is created in Righteousness &amp; true Holiness. See here the Image of God wherein Adam was created, and into which the Elect of God are recovered by the Power and Efficacy of the Gospel, which calls us with a holy Calling, from Uncleanness unto Holiness. This is the Image of God’s dear Son, and this is his Calling, Be ye Holy, for I am Holy. So we are made Children and adopted in Christ; for the HOLY ONE will put no other among his Children, but those in whom he puts this Likeness to Himself, his Son and Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissertation on the image of God wherein man was created</cite>, (Boston: S. Kneeland and T. Green, 1736), pp 11-13.</span></figcaption>

<blockquote><p>V. The Romanists hold original righteousness to be a supernatural gift, super-added to the native gifts and powers of the entire man. [Robert] Bellarmine explains the reason why they determine this to be so. There was in man naturally a contest between the flesh and the spirit, the reason and the appetite [lower desirous part], from which flowed a certain disease and languor of nature, arising from the condition of the material. Therefore God added original righteousness as a ‘golden bridle,’ to repress that conflict and to cover like a precious garment their nakedness, and as a remedy to heal that weakness (‘De gratia primi hominis,’ 5, 6 in Opera [1858], 4:23-29) This is the more common opinion among them, although the Jansenists and others exclaim loudly against it. Whence arose this expression of the [Medieval] Scholastics: ‘Naturals remained untouched, but the supernaturals only were lost.&#x27;</p></blockquote>

<blockquote><p>2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God.</p></blockquote>

<blockquote><p>Among these creatures theology deals especially with angels and human beings, since God has bestowed his image upon them. Propositions I. Although the entire universe is a mirror of the divine power, wisdom, and goodness, yet the image of God, properly speaking, is a quality only of angels and men. II. The image of God consists partly of natural gifts–the simple, invisible substance of angels and of human souls, life, intellect, will and immortality; and partly of supernatural ones–original blessedness, rectitude and majesty of intellect and will, and majesty and dominion over other creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), p. 56</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2f1b4c12b4" data-kw="">
<blockquote><p>Those that he stirs up and arouses from the impulses of a person’s own depravity. The situation is as follows. Satan investigates with the greatest care to discover the sins and wrongdoings to which each man is individually most inclined because of the special circumstances of his body, education, and habits.

He accordingly incites that man’s depravity and increasingly entices him by means of evil suggestions, corrupt imaginations, and frightening contemplations toward that very sin to which he is already most inclined, be it meanness, sexual indecency, pomposity, or whatever. So the man begins to feel the carnal lust and desire gradually heating within him to the boiling point. He experiences unusually strong stimulations and inclinations to that particular sin of indecency or revenge or anger. This is secretly caused by those hidden stirrings, the fiery darts and provocation of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-teellinck.html">Willem Teellinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Path of True Godliness</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke, Classics of Reformed Spirituality (1636; Grand Rapids MI: Reformation Heritage Books, 2003), pp 69-70.</span></figcaption>

<blockquote><p>But the example of him whose eyes are put out as a punishment for a crime, and who cannot justly be commanded to see, is inept and foreign to the present matter. Because a blind man is not bound to see; but one born in original sin is bound to be just and without sin, for from this obligation a rational creature is never released. Add to this that he who has been deprived of his eyes by a judge is blind involuntarily, and would wish for the recovery of his sight at a great price. But men born in sin are voluntarily evil, and rejoice in their own vice, and hate remedies.</p></blockquote>

<blockquote><p>5. Children! Be humbled under the sense of the iniquity of your parents when ye remember their ways, or possess what unjustly they have gotten, ye become guilty of their sins, without repentance. Especially you have need to take notice of this that are the children of parents that have opposed the purity of God’s service and worship and the work of its reformation, and have been corrupters of it: Children may be partakers of their parents’ faults and so plagued for them several ways; and we think that this forfeiture is more than ordinary. And therefore, as amongst men there are special crimes beyond ordinary procuring such a sentence, so is it here. And:

1. They be guilty by following their foot-steps, in walking in their parents sins, as Jeroboam’s children did.

2. In approving their fathers’ way, praising their fathers’ sayings or doings, as it is Psalm 49:13.

3. In winking at their parents’ sins and wickedness.

4. In boasting of their oppressions, bloodshed, etc. as if they were were acts of valor and manhood.

5. In being content that their fathers sinned, if it gained any possession to them.

6. In possessing and enjoying without repentance what to their knowledge they sinfully purchased.

7. In spending prodigally and riotously what the parents covetously gathered; the sin of the parent here is the seed of the sons’ sin.

8. In professing sorrow for the want [lack] of occasion to live in ignorance, profanity, or looseness as their fathers did, as in Jer. 44:17-19, they said that things went well then. [9.] In not being humbled before God for the sins of predecessors, nor confessing them to him, as Lev. 26:40, nor repairing the losses or injuries which we knew they did to any that were wronged or oppressed by them.</p></blockquote>

</figure><figure class="quote" id="q-047f196ad6" data-kw="">
<blockquote><p>The unchanged “heart is deceitful above all things,” and, insofar as godliness is concerned, “desperately wicked;” and in nothing do this deceitfulness and this desperate wickedness appear so radically, and truly, and conspicuously a part of our fallen being, as in the attempts which we make to palliate what is indefensible and inexcusable, and to characterise by the name of frailties and foibles what are held in the estimation of God, and represented in his Word, as symptoms of the deadliest enmity against the Most High, and sufficient to banish us from the light of his countenance for ever.

It is on this point that Satan exerts all his darkening, conscience-searing, and benumbing influence, for well does this subtle adversary know that when once the mask is taken off the face of sin, the sinner could not but loathe and avoid what he had lately admired and loved as “the perfection of beauty.” He, therefore, labours unweariedly, and both directly by his own suggestions, and indirectly through the agents whom he is permitted to employ, as prince of this apostate world, to keep the veil on the head of the seducer, and thus to lead the fancy to imagine charms in objects with whom are “the dead. and whose guests are in the depths of hell.”

Here he displays his delegated power, and thus he accomplishes those plans of opposition to the Divine purposes, and of unextinguishable hatred of goodness in the soul, which he formed from the moment that man was created, and the execution of which he commenced in paradise, and is still carrying on through the instrumentality of “the lust of the flesh, the lust of the eye, and the pride of life.”

This revealed truth has often been sneered at, or, where any thing like a sense of decency remains, attempted to be explained away by learned dissertations on figures of speech, and eastern personification, and hyperbole. Such a method of getting rid of a humiliating and troublesome doctrine may satisfy the corrupt infidel and the nominal Christian; but no sooner has the Spirit of God made a movement against the citadel of unbelief, and softened the stony heart, and touched the unclean lips with a live coal from the altar, than the reality of the devil’s presence and operation is felt and acknowledged. There is then an end of all delusion: sin stands disclosed in all its hideousness and hatefulness and sin is the name given to many thoughts, words, and actions, which were once regarded as any thing but offensive, either in the sight of God or man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-jeffrey.html">Robert Jeffrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lot s Flight from Sodom’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

f+the+eye%2C+and+the+pride+of+life.%E2%80%9D%0A%0AThis+revealed+truth+has+often+been+sneered+at%2C+or%2C+where+any+thing+like+a+sense+of+decency+remains%2C+attempted+to+be+explained+away+by+learned+dissertations+on+figures+of+speech%2C+and+eastern+personification%2C+and+hyperbole.+Such+a+method+of+getting+rid+of+a+humiliating+and+troublesome+doctrine+may+satisfy+the+corrupt+infidel+and+the+nominal+Christian%3B+but+no+sooner+has+the+Spirit+of+God+made+a+movement+against+the+citadel+of+unbelief%2C+and+softened+the+stony+heart%2C+and+touched+the+unclean+lips+with+a+live+coal+from+the+altar%2C+than+the+reality+of+the+devil%E2%80%99s+presence+and+operation+is+felt+and+acknowledged.+There+is+then+an+end+of+all+delusion%3A+sin+stands+disclosed+in+all+its+hideousness+and+hatefulness+and+sin+is+the+name+given+to+many+thoughts%2C+words%2C+and+actions%2C+which+were+once+regarded+as+any+thing+but+offensive%2C+either+in+the+sight+of+God+or+man.%E2%80%9D%0A%0A%E2%80%94+Robert+Jeffrey%2C+Lot+s+Flight+from+Sodom%E2%80%99+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F047f196ad6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/047f196ad6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/01/robert-jeffrey-on-satans-opposition-to-total-depravity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>La Place’s innovation was as a matter of course condemned by the Reformed world, formally at the Synod of Charenton (1644-1645) and in the Helvetic Consensus (1675) and by argument at the hands of the leading theologians — Rivetus, Turretin, Maresius, Driessen, Leydecker, and Marck. But the tendencies of the time were in its favor and it made its way. It was adopted by theologians like Wyttenbach, Endemann, Stapfer, Roell, Vitringa, Venema; and after a while it found its way through Britain to America, where it has had an interesting history — forming one of the stages through which the New England Theology (q.v.) passed on its way to its ultimate denial of the quality of sin involving guilt to anything but the voluntary acts of a free agent; and finally becoming one of the characteristic tenets of the so-called “New School Theology” of the Presbyterian Churches. Thus it has come about that there has been much debate in America upon “imputation,” in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.</p></blockquote>

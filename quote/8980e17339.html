<main class="wrap"><figure class="quote" id="q-8980e17339" data-kw="">
<blockquote><p>Question 16: What if a man or wife know that the other in hatred does really intend by poison or other murder, to take away their life? May they not depart? Answer: They may not do it upon a groundless or rash surmise, nor upon a danger which by other lawful means may be avoided (as by vigilancy, or the magistrate, or especially by love and duty). But in plain danger, which is not otherwise like[ly] to be avoided, I doubt not, but it may be done and ought. For it is a duty to preserve our own lives as well as our neighbours: And when marriage is contracted for mutual help, it is naturally implied that they shall have no power to deprive one another of life (however some barbarous nations have given men power of the lives of their wives). And killing is the grossest kind of desertion, and a greater injury and violation of the marriage-covenant than adultery, and may be prevented by avoiding the murderer’s presence, if that way be necessary. None of the ends of marriage can be attained where the hatred is so great.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’, p. 538</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>For first although there be accidents or certain adjuncts of worship, yet there is no worship to be simply called accidental, because it has in it the very essence of worship. Secondly, as the least commands of God—even to iotas and tittles—are religiously to be observed (Mat. 5:18-19), so additions which seem very small are by the same reason to be rejected. Thirdly, Moses does seal up even those laws of the place of Divine worship, of the manner, of abstinence from blood, and the like, which must needs be referred to accidental worship (if any such be), with this very caution of not adding or taking away (Deut. 12:32).</p></blockquote>

<blockquote><p>3. ‘Tis contrary to the example of the Apostles themselves, and condemns them as well as us, for they did not only teach and commend to the Churches that Reformation which Mr. Dell calls the mortifying or destroying of corruption and lust, or Christ dwelling and living in us, but likewise an external acclesiastical reformation, and several canons concerning the reformation of external abuses and scandals in the Church: as for instance, that the Churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick and that such widows must be at least 60 years old, and the like.</p></blockquote>

</figure><figure class="quote" id="q-e7179c861a" data-kw="">
<blockquote><p>Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. … Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. … Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.”

— William Perkins, ‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1, p. 692">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+we+may+use+any+such+fellowship+with+them+as+is%2C+or+shall+be+occasioned+by+virtue+of+our+particular+calling.+Thus+Christ%2C+being+the+Savior+of+the+world%2C+conversed+with+publicans+and+sinners.+Thus+Paul+being+the+Apostle+of+the+Gentiles%2C+enters+into+Athens%2C+and+there+beholds+their+devotions.+It+is+God%E2%80%99s+commandement+that+the+believing+wife%2C+shall+nor+forsake+her+unbelieving+husband%2C+if+he+be+willing+or+desirous+to+dwell+with+her.+%281+Cor.+7%3A13%29+If+it+be+alleged+that+Ezra+constrained+the+Israelites+to+put+away+their+Ammonitish+and+Moabitish%2C+and+the+rest+of+their+heathen%2C+wives+%28Ezra+10%3A3%29%3A+I+answer+that+their+marriages+were+indeed+void+and+no+marriages%3A+First%2C+because+the+nations+with+whom+they+married+were+people%2C+according+to+God%E2%80%99s+Law%2C+civilly+dead%3A+in+that+God+had+commanded+their+destruction%2C+unless+when+peace+was+offered%2C+they+accepted+of+it.+%28Dt.+20%3A10%29+Secondly%2C+in+that+they+were+not+only+idolators%2C+but+also+enticers+to+idolatry%3B+God+by+express+commandment+did+simply+forbid+the+Jews+to+marry+with+them+unless+they+did+repent+and+changed+their+religion.+And+in+regard+of+this+commandment%2C+the+foresaid+marriages+were+nullities%2C+as+incestuous+marriages+are+no+marriages+by+reason+of+the+absolute+prohibition+of+God.+Touching+the+society+forbidden+us+with+idolators%2C+it+is+the+society+of+amity%2C+that+is%2C+of+familiarity+and+special+love.+Two+examples%2C+whereof+we+find+in+the+Word+of+God.+One+is+of+contracts+of+marriage+with+idolators%2C+which+the+Scripture+precisely+condemns+as+an+abomination+in+lsrael+and+a+profanation+of+the+name+of+God%2C+when+Judah+marries+the+daughter+of+a+strange+god%2C+Mal.+2%3A11.+Boaz+indeed+married+Ruth%2C+a+Moabitess%2C+but+she+was+entered+and+received+into+the+body+of+the+Israelites+by+a+former+marriage%3A+and+she+was+one+that+believed+in+the+God+of+Israel.+%E2%80%98Thy+people%E2%80%99+%28says+he+to+Naomi+and+Ruth%29+%E2%80%98shall+be+my+people%2C+and+thy+God%2C+my+God.%E2%80%99+Sampson+likewise+married+a+woman+of+the+Philistines+%28Judg.+14%3A4%29%2C+but+that+was+by+divine+instinct+and+consequently+by+a+special+appointment+of+God.+Again+it+is+alleged+that+God+by+express+law+gave+leave+to+the+Israelites+to+marry+heathenish+women+taken+captives+in+war.+%28Dt.+21%3A10-11%29+Answer%3A+That+is+a+law+only+of+toleration%2C+without+approbation%2C+in+which+God%2C+for+the+hardness+of+their+hearts%2C+permits+the+evil%2C+which+cannot+by+policy+be+quite+taken+away.+And+this+appears+by+two+things%3A+First%2C+before+the+marriage%2C+the+woman+by+God%E2%80%99s+appointment+must+be+deformed%2C+by+cutting+off+her+hair%2C+by+the+growing+of+her+nails%2C+by+putting+off+the+garments+of+her+captivity%2C+and+by+mourning+for+her+father+and+mother+for+the+space+of+a+month%3A+and+the+end+of+this+was+to+cause+a+dislike+in+the+Israelites+of+their+intended+marriages%2C+or+to+signify+a+change+of+religion%2C+at+the+least+in+pretense%2C+in+the+parties+espoused.+%E2%80%A6+Here+one+exception+must+not+be+omitted.+Put+the+case+that+the+husband+is+an+idolator+and+is+content+to+dwell+with+his+believing+wife%3A+she+then+is+to+live+with+him%2C+not+only+in+the+society+of+peace%2C+but+also+in+the+society+of+amity+by+doing+all+duties+of+Iove+that+concern+a+wife%2C+so+far+as+may+stand+with+good+conscience.+For+the+precept+of+Paul%E2%80%99s%2C+that+marriage+and+marriage+duties+are+to+be+preserved+of+the+believing+party+with+an+infidel+%281+Cor.+7%3A13-14%29%2C+so+be+it+the+said+infidel+be+content.+It+may+be+al%21eged+that+thus+the+believer+exposes+himself+to+danger+of+idolatry.+I+answer%3A+Not+because+God+defends+them+that+call+upon+Him+who+thrust+not+themselves+into+danger%2C+but+bear+the+danger+and+calamity+into+which+they+are+fallen%2C+attending+upon+their+callings.+Again%2C+if+the+unbelieving+party+shall+solicit+the+other+and+use+all+means%2C+both+fair+and+foul%2C+to+draw+him+or+her+to+idolatry%2C+the+believing+party+in+this+case%2C+may+go+aside+for+a+time+and+omit+the+duty+of+marriage.+For+this+is+all+one+as+if+the+idolatrous+and+unbelieving+party+should+depart.+For+indeed%2C+that+party+is+said+to+depart+in+whom+the+cause+of+departing+is%2C+as+in+the+Church+he+is+a+schismatic+in+whom+the+cause+of+the+schism+is%2C+and+not+always+he+that+separates.+Secondly%2C+it+may+be+objected+that+a+Christian+may+not+become+the+member+of+a+harlot%2C+much+less+of+an+idolator%3B+considering+idolatry+is+a+great+sin.+I+answer%3A+The+reason+is+not+like.+For+the+fornicator+consents+to+the+fornication%3A+and+so+does+not+the+believing+party%2C+by+doing+duties+that+pertain+to+marriage%2C+consent+to+the+idolatry+of+the+unbelieving+party.+And+the+fornicator+willingly+joins+himself+with+an+harlot%3B+whereas+the+believing+party+desires+he+might+be+yoked+with+a+believer+and+not+with+an+infidel.+Lastly%2C+it+may+be+objected%3A+if+for+adultery%2C+divorce+may+be+made%2C+why+not+for+idolatry+which+is+spiritual+adultery%3F+I+answer%3A+That+not+any+sin+by+itself%2C+as+it+is+a+sin%2C+not+breaking+the+troth+and+bond+of+marriage%2C+is+the+proper+cause+of+a+divorce%3B+and+not+any+kind+of+idolatry%2C+but+the+sin+of+adultery+breakest+his+troth.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works+%28London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+p.+692&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe7179c861a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e7179c861a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divorce-remarriage/#:~:text=Thirdly%2C%20we%20may%20use%20any%20such,sin%20of%20adult

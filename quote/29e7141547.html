<main class="wrap"><figure class="quote" id="q-29e7141547" data-kw="">
<blockquote><p>Does it not seem that the condition of the Gospel Covenant is violated of many as truly as of the Legal Covenant? It is as truly violated by many; but it is not violated by as many. For the condition of the Legal Covenant is violated of all; Yea it is impossible to be kept, even to the penitent; But the condition of the Gospel Covenant is otherwise, etc. There was therefore need of a New Covenant, unless mankind should perish, etc. Certainly no man is saved but by a Covenant kept; therefore the Covenant by which men are saved, is not the same with that by which no man is saved, it being kept by no man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, … (d. 1625; Geneva: Chovet, 1658), as trans. in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 379-80 | Questions on Hebrews | on Heb. 8:9, p. 413</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f897806ad" data-kw="">
<blockquote><p>7. The covenant is either a covenant of works or a covenant of faith. This distinction coincides with that between the legal and the evangelical covenant. The first included a stipulation of works: ‘Do this and you will live.’ The second included a stipulation of faith: ‘Believe and you will be saved.’ Indeed, in this covenant too works are required, but not primarily, as if man is justified through them; but they are required as a consequence, as a sign of gratitude, as a proof of an unfeigned faith which in this way also edifies the neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite>, (1644), ch. 12, pp. 227-28</span></figcaption>

</figure><figure class="quote" id="q-5d6c0d32c6" data-kw="">
<blockquote><p>Scripture, moreover, has a, third rule for modifying the use of earthly blessings. We have already adverted to it when considering the offices of charity. For it declares that they have all been given us by the kindness of God, and appointed for our use under the condition of being regarded as trusts, of which one day we must give an account. We must, therefore, administer them as if we constantly heard the words sounding in our ears, ‘Give an account of your stewardship.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-1a1933b3bb" data-kw="">
<blockquote><p>Yea if the Covenant of the Gospel, that is, of life and salvation by Christ, be as absolute, without any condition on man’s part, as that with Noah concerning the not drowning of the whole world again (Gen. 9:9-10), then it is all one whether men receive it, and believe it, or no: the promise of life and salvation, and the covenant made with Christ concerning it, shall be made good unto them, as well as that made with Noah, shall be made good unto men, whether they know it and heare it, and believe it or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed</cite>, (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), p. 25</span></figcaption>

</figure><figure class="quote" id="q-a6876fd9dd" data-kw="">
<blockquote><p>It follows not that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more than the apple goes before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, (London, 1648), pt. 2, ch. 48, ‘Antinomians hold that the believer cannot sin against God…’, p. 63, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

<blockquote><p>14. Some theologians at the Council of Trent–from being too superstitious, or perhaps too contentious–so disliked, or at least were so suspicious of the word ‘imputation’ (viz., of Christ’s justice), as is related [by Paul Sarpi] in the History of that Council (bk. 2, sect. Franciscani vero gratiam habitualem inde, pp. 219-20, ed. Latin, p. 157), and is known of Dominicus a Soto from his writings (Of Nature and Grace, bk. 2, ch. 20), that they wished it taken away, because the Protestants used it so familiarly, although it is nowhere met with either in Scripture or in the Fathers, and because of the inferences which the Protestants elicit from it… So also in the Fathers the expressions communication, sharing, gift, diffusion, derivation, application, copulation, and conjunction, are often found, as is well known and allowed by those who most dislike the word ‘imputation,’ although this word signifies precisely the same thing as these others. Wherefore, since the thing itself is sufficiently certain, it is fruitless to contend about words. Nay, the very word ‘imputation’ occurs in S. Bernard (Epistle 190 to Pope Innocent [or Tract on some Capital Errors of Abelard, ch. 6, sect. 15, vol. 1, p. 652c.]); ‘If one died for all, all therefore are dead, viz., that the satisfaction of one may be imputed to all; as He being one, carried the sins of all.’ (Read diligently, I pray you, the whole of that epistle), and again, ‘Death is put to flight by the death of Christ, and the justice of Christ is imputed to us.’ (Sermo ad milites Templi, ch. 11 [sect. 22, vol. 1, p. 553e.]) and this [namely, that S. Bernard makes use of the word ‘imputation’] is allowed by many Romanists: A. Vega (Of Justification, bk. 15, ch. 2, prop. 2); Bellarmine (who also confesses that ‘the justice and merits of Christ are rightly said to be imputed to us, when they are given and applied to us, as if we had ourselves satisfied God, but not so that we should formally be called and be just through the justice of Christ’; Of Justification, bk. 2, ch. 7, sect. Quarto refellitur, ch. 10, sect. Deinde et ibidem Resp. ad tertium argumentum [sect. Resp. non dicitur] et ch. 11 circa finem sect. Potest tamen.]); Suarez (Of [Divine] Grace, bk. 7, Of the Sanctification of Man, ch. 7, n. 29); Ruardus Tapper (Explicatio articulorum viginti, art. 8, Of Justification, sect. Ad quod bifariam, t. 2, pp. 25-27); Vasquez (in pt. 1 of 2, tome 2, disp. 202, ch. 6, n. 45); Stapleton (Of Justification, bk. 7, ch. 9, sect. Aliquid, and sect. Notandum); Costerus (in Enchiridion, p. 292, anno 1593, pp. 254-56), and many others. And many centuries before S. Bernard, S. Athanasius affirms that ‘it behoves us to believe from the Holy Scriptures… that the fulfillment of the law performed by the first-fruits’ (i.e. Christ) ‘is ascribed or imputed to the whole mass;’ ([Pseudo] Athanasius, Confutationes quarumdam propositionum, sect. 15. Adversus cos. qui damno afficiunt genus nostrum, eo quod negant Servatorem ex natura nostra sump*i**c primitas. Tome 2, edit. Commelini, p. 270 [tome 2, p. 580, B.]) for in the Greek it is the same word which the apostle uses in the fourth chapter of the Romans; see the passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 2</cite>, pp. 113-15</span></figcaption>

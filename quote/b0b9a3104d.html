<main class="wrap"><figure class="quote" id="q-b0b9a3104d" data-kw="">
<blockquote><p>For here I observe, that men of learning in other respects have stumbled, who, when explaining the nature of those Sacraments, too incautiously blend things belonging to a quite different covenant. Nothing is here to be brought in which does not belong to the covenant of works, the promises of that covenant, and the duties of man under the same; all which are most distinct from the covenant of grace. Here we are to say nothing of Christ, nothing of justifying faith in him, nothing of our ceasing from our own works as impure, nor any thing of that rest after the miseries of this life. All these belong to another covenant. I do not, however, deny, that the unsearchable wisdom of God did appoint and order these symbols in such a manner that the remembrance of them, after the fall, might be able to instruct man in many things relating to the covenant of grace and its mediator. As that, according to Paul, the first Adam himself was a type of the second; Eve, curiously formed out of Adam’s rib while asleep, was a type of the church, as it were, taken from Christ in virtue of his death; and that the first marriage represented that great mystery which regards Christ and the church. These things, however, were neither known nor thought of in a state of nature; nor to be mentioned in a discourse on the Sacraments of the covenant of works. Having premised these things, let us now inquire into each particular with all the care possible, beginning with Paradise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants, trans. William Crookshank 2 vol (Edinburgh: T. Tegg &amp; Son, 1837), 1.81</cite></span></figcaption>

</figure><figure class="quote" id="q-e207580d7a" data-kw="">
<blockquote><p>2. God’s common providence towards mankind teaches us that God is inclined to mercy and is willing to be reconciled, that he is not implacable… By these things, it plainly appears that God hasn’t utterly forsaken the world of mankind as to any favor or merciful regards. This was the witness which God gave all mankind, and even the heathen, that had direct revelation of his disposition to a reconciliation. Acts 14:16–17, ‘Who in times past suffered all nations to walk in their own ways. Nevertheless He left not Himself without witness, in that He did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-18c1fcd7c3" data-kw="">
<blockquote><p>First, therefore, the apostle doth evidently in this place dispute concerning two covenants, or two testaments, comparing the one with the other, and declaring the disannulling of the one by the introduction and establishment of the other. What are these two covenants in general we have declared, — namely, that made with the church of Israel at mount Sinai, and that made with us in the gospel; not as absolutely the covenant of grace, but as actually established in the death of Christ, with all the worship that belongs unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 84</span></figcaption>

</figure><figure class="quote" id="q-d8fb1313fc" data-kw="">
<blockquote><p>And O how He ‘travails in the greatness of his strength, mighty to save! able to save to the uttermost them that come unto God by Him.’ O His infinite willingness to save us! how deeply marked in words, in oaths, in cries, in tears, in sighs, in groans, in blood, in death of an expiring God! He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you:</p></blockquote>

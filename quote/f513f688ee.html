<main class="wrap"><figure class="quote" id="q-f513f688ee" data-kw="">
<blockquote><p>To a person in any degree acquainted with the history of the Scottish Reformation, it must be completely evident that the Reformers laboured strenuously to establish, as an essential part of their system, the harmonious co-operation of a reformed State with a reformed Church, in maintaining truth and piety, and repressing falsehood and irreligion. This principle, after countless struggles and costly sacrifices, willingly tendered for its attainment, became ascendant at the memorable era of the Second Reformation, from 1638 to 1649, and was embodied in the solemn vows of the nation. These Federal Deeds assume the doctrine of an Establishment so fundamentally, that lay it aside, and they are deprived of half their meaning. They tender the national faith for the upholding of a pure establishment, which, through the good hand of God, had been set up; and they most unequivocally bind men, in civil authority, of whatever class, to employ their official power and resources to sustain the true religion professed, and to discontinue and eradicate error and false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenanter’s narrative and plea: exhibiting the error, schism, radicalism, and slander of Dr. Paul, and other separatists from the Reformed Presbyterian Church</cite>, (Belfast, 1841), pp 32-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

ants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12342aaba7" data-kw="">
<blockquote><p>I suppose none will deny, but that the Church of Israel had such Governors: instance their Priests and Levites. In Jehoshaphat’s time there is an express distinction made betwixt Ecclesiastical and Civil Governors under these two phrases, matters of the Lord, and matters of the King. If Church-Governors were an evidence of God’s good Providence under the Law, surely his Providence in this kind, would not be more scanty to the Church under the Gospel: for he hath promised to do better then at her beginnings. A change of Governors there may be, and that for the better; but an utter abolishing of all Governors, proper and peculiar to the Church, cannot be to the better. We expressly read that God hath set in his Church, among other good functions, Governments.

If it be said, that under that word, Governments, civil Magistrates are understood: I answer, that first this phrase, God hath set in the Church, and then the other particulars, among which Governments are reckoned, being all proper and peculiar to the Church, admit not such an interpretation thereof. To them which ask where any mention is made of a ruling Elder, I allege these words of an Apostle, (1 Tim. 5. 17.) The Elders that rule well, &amp;c. Apply them as you please, to Ministers or others: there are ruling Elders.

The word ἡγουμένων twice used by an Apostle, (Heb. 13. 7, 17.) and translated by our last and best Translators of the Bible, them that have rule, sheweth, that Ministers of the Gospel are Church-Governors: for Christians are required to obey them. And that Ministers are there meant, is evident by these phrases, They have spoken unto you the word of God, and they watch for your souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 24-25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-27a50a3489" data-kw="">
<blockquote><p>To be more plain, let me be more particular. The Voluntaries mistake us, if they conceive us to be Voluntaries. We hold by the duty of Government to give of their resources and their means for the maintenance of a gospel ministry in the land; and we pray that their eyes may be opened, so that they may learn how to acquit themselves as the protectors of the Church, and not as its corrupters or its tyrants. We pray that the sin of Uzziah, into which they have fallen, may be forgiven them, and that those days of light and blessedness may speedily arrive, when “kings shall be the nursing-fathers, and queens the nursing-mothers” of our Zion.

In a word, we hold that every part and every function of a common-wealth should be leavened with Christianity, and that every functionary, from the highest to the lowest, should, in their respective spheres, do all that in them lies to countenance and uphold it. That is to say, though we quit the Establishment, we go out on the Establishment principle — we quit a vitiated Establishment, but would rejoice in returning to a pure one. To express it otherwise — we are the advocates for a national recognition and national support of religion — and we are not Voluntaries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proceedings of the General Assembly of the Free Church of Scotland; with A Sketch of the Proceedings of the Residuary Assembly. 1843, ed. John Baillie (Edinburgh: W. P. Kennedy, 1843), p. 12.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-305b649448" data-kw="">
<blockquote><p>I conclude with one word: Although the Church may enjoin it on its children, not to maintain free intercourse with any private person who has been cast out of the Church, yet it cannot command subjects to revolt from their Sovereigns when excommunicated; because they are bound to continue rendering the obedience due to them by law natural, civil and divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, Question 4, ‘There is No Temporal Power Over Kings in Order to their Spiritual Benefit’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2, p. 240</span></figcaption>

med Books Online</a></div>
</figure><figure class="quote" id="q-0879226770" data-kw="">
<blockquote><p>The controversy which has been moved concerning the civil magistrate’s vice-gerentship, and the holding of his office of, and under, and for Jesus Christ, as He is Mediator, has a necessary coherence with, and dependence upon, another controversy concerning a twofold kingdom of Jesus Christ… It is a distinction which Mr. Hussey [an Erastian] cannot endure, and no marvel, for it overturns the foundation of his opinion. He looks upon it as an absurd assertion, p. 25, ‘Shall He have one kingdom as Mediator, and another as God?’ He quarrels all that I have said of the twofold kingdom of Christ, and will not admit that Christ, as Mediator, is King of the church only, p. 25-27, 35-37. … He holds that Christ, as Mediator, has placed the Christian magistrate under Him, and as his vice-gerent, and has given him commission to govern the church, which, if he or any man can prove from the word of God, it will go far in the decision of the Erastian controversy… Mr. [Thomas] Coleman [c.1597-1646] in his Re-Examination, p. 19, was fearful to set his foot upon so slippery ground. He was loath to adventure upon this assertion, that magistracy is derived from Christ, as Mediator, by a commission of deputation and vice-gerentship… Wherefore he made a retreat and held him at this: ‘That magistracy is given to Christ to be serviceable in his kingdom.’ But out steps Mr. Hussey and boldly avers a great deal more. I much mistake if he shall not be made either to make a retreat, as Mr. Coleman did, or to do worse.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The controversy which has been moved concerning the civil magistrate’s vice-gerentship, and the holding of his office of, and under, and for Jesus Christ, as He is Mediator, has a necessary coherence with, and dependence upon, another controversy concerning a twofold kingdom of Jesus Christ… It is a distinction which Mr. Hussey [an Erastian] cannot endure, and no marvel, for it overturns the foundation of his opinion. He looks upon it as an absurd assertion, p. 25, ‘Shall He have one kingdom as Mediator, and another as God?’ He quarrels all that I have said of the twofold kingdom of Christ, and will not admit that Christ, as Mediator, is King of the church only, p. 25-27, 35-37. … He holds that Christ, as Mediator, has placed the Christian magistrate under Him, and as his vice-gerent, and has given him commission to govern the church, which, if he or any man can prove from the word of God, it will go far in the decision of the Erastian controversy… Mr. [Thomas] Coleman [c.1597-1646] in his Re-Examination, p. 19, was fearful to set his foot upon so slippery ground. He was loath to adventure upon this assertion, that magistracy is derived from Christ, as Mediator, by a commission of deputation and vice-gerentship… Wherefore he made a retreat and held him at this: ‘That magistracy is given to Christ to be serviceable in his kingdom.’ But out steps Mr. Hussey and boldly avers a great deal more. I much mistake if he shall not be made either to make a retreat, as Mr. Coleman did, or to do worse.”

— George Gillespie, Aaron’s Rod Blossoming">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+controversy+which+has+been+moved+concerning+the+civil+magistrate%E2%80%99s+vice-gerentship%2C+and+the+holding+of+his+office+of%2C+and+under%2C+and+for+Jesus+Christ%2C+as+He+is+Mediator%2C+has+a+necessary+coherence+with%2C+and+dependence+upon%2C+another+controversy+concerning+a+twofold+kingdom+of+Jesus+Christ%E2%80%A6+It+is+a+distinction+which+Mr.+Hussey+%5Ban+Erastian%5D+cannot+endure%2C+and+no+marvel%2C+for+it+overturns+the+foundation+of+his+opinion.+He+looks+upon+it+as+an+absurd+assertion%2C+p.+25%2C+%E2%80%98Shall+He+have+one+kingdom+as+Mediator%2C+and+another+as+God%3F%E2%80%99+He+quarrels+all+that+I+have+said+of+the+twofold+kingdom+of+Christ%2C+and+will+not+admit+that+Christ%2C+as+Mediator%2C+is+King+of+the+church+only%2C+p.+25-27%2C+35-37.+%E2%80%A6+He+holds+that+Christ%2C+as+Mediator%2C+has+placed+the+Christian+magistrate+under+Him%2C+and+as+his+vice-gerent%2C+and+has+given+him+commission+to+govern+the+church%2C+which%2C+if+he+or+any+man+can+prove+from+the+word+of+God%2C+it+will+go+far+in+the+decision+of+the+Erastian+controversy%E2%80%A6+Mr.+%5BThomas%5D+Coleman+%5Bc.1597-1646%5D+in+his+Re-Examination%2C+p.+19%2C+was+fearful+to+set+his+foot+upon+so+slippery+ground.+He+was+loath+to+adventure+upon+this+assertion%2C+that+magistracy+is+derived+from+Christ%2C+as+Mediator%2C+by+a+commission+of+deputation+and+vice-gerentship%E2%80%A6+Wherefore+he+made+a+retreat+and+held+him+at+this%3A+%E2%80%98That+magistracy+is+given+to+Christ+to+be+serviceable+in+his+kingdom.%E2%80%99+But+out+steps+Mr.+Hussey+and+boldly+avers+a+great+deal+more.+I+much+mistake+if+he+shall+not+be+made+either+to+make+a+retreat%2C+as+Mr.+Coleman+did%2C+or+to+do+worse.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aaron%E2%80%99s+Rod+Blossoming&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0879226770.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class

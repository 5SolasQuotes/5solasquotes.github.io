<blockquote><p>Ma. Now remaineth the last Commmandment?

Sch. Thou shalt not cover thy Neighbour’s house. Thou shalt not covet thy Neighbour’s wife, nor his servant, nor his Maid, nor his Ox, nor his Ass, nor any thing that is his.

Ma. What is more commanded here than was before?

Sch. God hath before forbidden evil doings &amp; corrupt affectations of the mind; but now he requireth of us a more precise pureness, that we suffer not any desire, be it never so light, nor any thought, be it never so small, in any wise swerving from right, once to creep into our heart. For it is meet that even in our very hearts and minds, should shine before God most perfect pureness and cleanness. For no innocency and righteousness, but that which is most perfect, can please him: whereof he hath also set before us this Law as a most perfect Rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d5c1cb892f" data-kw="">
<blockquote><p>In Origen’s homily on Numbers 28-29, he expressed his view of how Christians were to observe the Sabbath:

Now the second feast, after the feast of the perpetual sacrifice, is recorded to be the sacrifice of the sabbath, and it is necessary that every saint and just person celebrate the feast of the Sabbath as well Well, what is the feast of the Sabbath, if not that feast of which the apostle says: “So a sabbath,” that is, the observance of the sabbath, “will be left for the people of God” [Hebrews 4:9] Therefore, leaving behind the Judaic observances of the sabbath, let us see what sort of observation of the sabbath there ought to be for the Christian. On the day of the sabbath, no worldly activity is supposed to be carried out. Thus if you cease doing secular works and carry out nothing worldly, but make room for spiritual works, if you come together at church, give ear to the divine readings and discussions, think about heavenly things, show concern for the future hope, keep the coming judgment before your eyes, do not look to present and visible things, but to the invisible and future things, this is how the Christian observes the sabbath.

But even the Jews should have observed these things. After all, even among them, if there was a craftsman, a builder or any other such worker, he takes it easy on the sabbath day. But the reader of the divine law, on the other hand, and the teacher, does not leave off from his work, and yet they are not defiling the sabbath; for this is what the Lord says to them: “Or have you not read that the priests in the temple violate the sabbath and are without an offense?” [Mark 12:5] Therefore, the one who has ceased from the works of the world and makes room for spiritual actions is the one who carries out the sacrifice of the sabbath and celebrates the feast day of the sabbaths.

He “carries no burdens on the road”; [Nehemiah 13:19] for every sin is a burden, as the prophet says: “They have weighed down on me like a heavy burden.” [Psalm 38:4] He “kindles no fire,” [Exodus 35:3] namely, that fire of which it is said: “Go in the light of your fire and in the flame which you have kindled.” [Isaiah 50:11] On the sabbath each one stays in his own place and does not go forth from it. Well, what is the “place” of the spiritual soul? Its place is justice, truth, wisdom, sanctification, and everything that Christ is; this is the “place” of the soul. It is not proper for the soul to go forth from this place, so that it may keep the true sabbaths and accomplish the feast day with the sacrifices of the Sabbath, as the Lord also said: “He who stays in me, I too [will stay] in him.” [John 15:5]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/origen-of-alexandria.html">Origen of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on Numbers</cite>, trans. Thomas P. Scheck, ed. Christopher A. Hall, Ancient Christian Texts (Downers Grove IL: IVP Academic, 2009), 23.4.1-2, pp 142-43.</span></figcaption>

</figure><figure class="quote" id="q-f8649d5762" data-kw="">
<blockquote><p>Because all the reasons of this commandment are moral and perpetual; and God has bound us to the obedience of this commandment with more forcible reasons than to any of the rest — First, because he foresaw that irreligious men would either more carelessly neglect, or more boldly break this commandment than any other; secondly, because that in the practice of this commandment the keeping of all the other consists; which makes God so often complain that all his worship is neglected or overthrown, when the Sabbath is either neglected or transgressed (Jer. xv. 22; Ezek. xx. 19, 20, 21, 24; xxiii. 38; Neh. ix. 4.) “It would make a man amazed,” saith Mr. Calvin, “to consider how oft, and with what zeal and protestation God requireth all, that will be his people, to sanctify the seventh day; yea, how the God of mercy mercilessly punisheth the breach of this commandment with cruel death, as though it were the sum of his whole honour and service.”

And it is certain, that he who makes no conscience to break the Sabbath, will not, to serve his turn, make any conscience to break any of the other commandments, so he may do it without discredit of his reputation or danger of man’s law. Therefore God placed this commandment in the midst of the two tables, because the keeping of it is the best help to the keeping of all the rest. The conscionable keeping of the Sabbath is the mother of all religion and good discipline in the church. Take away the Sabbath, and let every man serve God when he listeth; and what will shortly become of religion, and that peace and order (1 Cor. xiv. 33, 40) which God will have to be kept in his church?

The Sabbath-day is God’s market-day, for the week’s provision; wherein He will have us to come to him, and buy of him without silver or money (Isa. lv. 1, 2), the bread of angels, and water of life, the wine of the sacrament, and milk of the word to feed our souls; tried gold to enrich our faith (Rev. iii. 18;) precious eye-salve, to heal our spiritual blindness; and the white raiment of Christ’s righteousness, to cover our filthy nakedness.

He is not far from true piety, who makes conscience to keep the Sabbath-day; but he who can dispense with his conscience to break the Sabbath for his own profit or pleasure, his heart never yet felt what either the fear of God or true religion means; for, of this commandment may that speech of St. James be verified, “He that faileth in one, is guilty of all.” (James ii. 10.) Seeing, therefore, that God has fenced this commandment with so many moral reasons, it is evident that the commandment itself is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 169-71.</span></figcaption>

0AThe+Sabbath-day+is+God%E2%80%99s+market-day%2C+for+the+week%E2%80%99s+provision%3B+wherein+He+will+have+us+to+come+to+him%2C+and+buy+of+him+without+silver+or+money+%28Isa.+lv.+1%2C+2%29%2C+the+bread+of+angels%2C+and+water+of+life%2C+the+wine+of+the+sacrament%2C+and+milk+of+the+word+to+feed+our+souls%3B+tried+gold+to+enrich+our+faith+%28Rev.+iii.+18%3B%29+precious+eye-salve%2C+to+heal+our+spiritual+blindness%3B+and+the+white+raiment+of+Christ%E2%80%99s+righteousness%2C+to+cover+our+filthy+nakedness.%0A%0AHe+is+not+far+from+true+piety%2C+who+makes+conscience+to+keep+the+Sabbath-day%3B+but+he+who+can+dispense+with+his+conscience+to+break+the+Sabbath+for+his+own+profit+or+pleasure%2C+his+heart+never+yet+felt+what+either+the+fear+of+God+or+true+religion+means%3B+for%2C+of+this+commandment+may+that+speech+of+St.+James+be+verified%2C+%E2%80%9CHe+that+faileth+in+one%2C+is+guilty+of+all.%E2%80%9D+%28James+ii.+10.%29+Seeing%2C+therefore%2C+that+God+has+fenced+this+commandment+with+so+many+moral+reasons%2C+it+is+evident+that+the+commandment+itself+is+moral.%E2%80%9D%0A%0A%E2%80%94+Lewis+Bayly%2C+The+Practice+of+Piety%3A+Directing+a+Christian+to+walk%2C+that+he+may+please+God%2C+%281612%3B+Grand+Rapids+MI%3A+Soli+Deo+Gloria%2C+2019%29%2C+pp+169-71.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff8649d5762.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f8649d5762.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/27/lewis-bayly-on-the-importance-of-the-sabbath-to-true-piety/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Of course there are many other arguments for the use of hymns, as, for instance, that the Psalms are unsuitable for New Testament worship, breathe a spirit of revenge, and so forth, which borders, we think, on blasphemy; or that, as we are at liberty to pray in our own words, so we must be at liberty to sing praise in our own words in answer to this is that our liberty depends altogether on God’s revealed will, not on what we may think reasonable and further, that men were at liberty to pray in Old Testament times in their own words, but were required to employ only authorized psalmody in praise; and there is no reason for change in the matter now, and no reason for supposing that men are able now to frame suitable ones of praise, when they were considered so unable then that God furnished them with songs from heaven. Besides when people sing a hymn, they are not singing in their own words, but in the words of the hymn-writer, or in the words of an ecclesiastically authorized hymn-book. And if congregations are to take words other than their own in any case, one would think they would be safer with God’s words than with man’s.</p></blockquote>

<blockquote><p>The extremists upon both sides have a much easier task than the one who occupies the central position between them. A simple idea is much easier to define and manage than a complex one. But it is not so fertile, so prolific, or so completely true.

If simplicity and facility of management were all that the philosopher has to care for, the great comprehensive ideas of science would soon disappear; for they are neither uncomplex nor facile. “The simplest of governments,” says Webster while defending the excellent complexity of republicanism, “is a despotism.” The simplest of theories is the theory of an extremist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the Philosophy of History</cite>, (Andover: W. F. Draper, 1857), p. 37.</span></figcaption>

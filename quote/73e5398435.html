<blockquote><p>VIII Rule. We must give place to the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times: but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul… he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but ony in general against false gods, saying that ‘they be no gods that are made with hands,’ v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience (Cambridge. 1606), bk. 3, ch. 2</cite>, pp. 481-84</span></figcaption>

<blockquote><p>3. Neither Mr. Rutherford [contra what Hooker said] nor any judicious man can teach that either a gift to write books, or of eminent preaching, praying, exhorting, proceeds out of a power of office; it is a sanctified gift which the Church sees and judges to be in any before they call him to office; and any gift is by order of nature and time before the office, and so proceeds not from the office; and therefore it is not required that every pastor should have a gift of writing books; But if the Lord have given it to any, they exercise it as such [additionally] gifted officers as the prophets and apostles, as such prophets so gifted did write canonic Scriptures; so are pastors, if gifted, to write and preach in their way, and both to write and preach by their office. Nor is it good logic that all in office should write books because some by virtue of their office write books; for a minister gifted with four talents is obliged to gain with these four talents, and that as a minister by virtue of his office; but it is weak logic to infer, therefore, all ministers by virtue of their office are obliged to gain with four talents, for many are obliged by virtue of their office to gain with only two [talents, not including with writing books] to their Lord, and with only one [talent]. 4. It was needless to Mr. Hooker to prove writing of books does not belong to the power of office because a learned man out of office may do it with more authority, for Mr. Rutherford had no such intention [of teaching to the contrary]. For sure, if such a thing agreed to the office-power as the office-power, then all officers, pastors [and] elders were obliged to write books, and yet Mr. Hooker does not very happily prove it, because many learned men, unofficed, may with more authority of truth write books than officed men. It is only some officed men he must mean, or it is not true. [emphasis added below] And then I retort it thus: Many officed men may write books with more authority both of truth and of office (and two are better than one) than some unofficed men less learned [Rutherford affirms this]. Therefore [according to Hooker’s logic, it would seem], some gifted pastors do not as pastors so gifted, and by virtue of their office relating both to the presbyterian Church and their own congregation, edify all the Churches about by writing books. It follows not. [Rutherford is affirming that some gifted pastors do write books with the virtue of their office in relation to the churches, though a calling to write books does not derive simply from their office]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline… (London, 1658), bk. 2, ch. 4</cite>, pp. 210-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-d0de7ca7d1" data-kw="">
<blockquote><p>But it is further objected by Sutlivius that this could not be such a Presbytery as is among us, because ordination and imposition of hands pertain to none but the ministers of the Word. Answer 1. The children of Israel laid their hands upon the Levites (Num. 8:10), and we would know his reason why he denies the like power to ruling elders now, especially since this imposition of hands is but a gesture of one praying, and a moral sign declaring the person prayed for. 2. Howsoever our practice (which is also approved by good divines, Junius, Cont. 5, book 1, ch. 3; Synopsis Pur. Theol., Disputation 42, Thesis 37) is to put a difference betwixt the act of ordination and the external right thereof, which is imposition of hands, ascribing the former to the whole Presbytery both pastors and elders, and reserving the latter to the ministers of the Word, yet to be done in the name of all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assertion of the Government of the Church of Scotland (1641), pt. 2, ch. 3</cite>, p. 132</span></figcaption>

</figure><figure class="quote" id="q-0e5720ba36" data-kw="">

<blockquote><p>4. Mr. Hooker [a congregationalist] will not say all that were scattered, Acts 8[:4] (for they were all scattered, except the apostles, verse 1) did preach the Gospel, for there were of them women, verse 3; then some of them only preached. And if Mr. Hooker say they were not officers, Mr. Rutherford says they were officers, and that the extraordinariness of their condition supplied the want of a Church-calling, and let Mr. Hooker but attempt to bring a proof for it. 5. If nothing extraordinary was here, l […]t Mr. Hooker or any for him vindicate the place, Acts 8, from Anabaptists who allege the same place, Acts 8, to destroy the standing ordinance of the ministry: and read the judicious Tractate of the Ministers of London, of Mr. Collings.</p></blockquote>

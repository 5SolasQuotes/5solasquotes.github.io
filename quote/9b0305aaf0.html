<main class="wrap"><figure class="quote" id="q-9b0305aaf0" data-kw="">
<blockquote><p>The first Direction and Institution of a Church was by Covenant; the Israelites made a Covenant with the LORD, and He with them, Deut. v. 2. and from that Time they were called a Church, Acts; vii. 38, there they promised, they would do all the LORD had said, and be obedient, Exod., xxiv. 3, 7.

There was another Covenant made with them, Deut. xxix. 12, &amp;c. this was a Covenant of Grace, as the other was of Works, ver. 10, 11, 12. The LORD entered into Covenant with them that Day, and with their Children: By a Covenant He takes them to be his People, and to be their God.</p></blockquote>

<blockquote><p>7. The covenant is either a covenant of works or a covenant of faith. This distinction coincides with that between the legal and the evangelical covenant. The first included a stipulation of works: ‘Do this and you will live.’ The second included a stipulation of faith: ‘Believe and you will be saved.’ Indeed, in this covenant too works are required, but not primarily, as if man is justified through them; but they are required as a consequence, as a sign of gratitude, as a proof of an unfeigned faith which in this way also edifies the neighbor.</p></blockquote>

</figure><figure class="quote" id="q-1cd715af93" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are:

I. Real and passive, or received, union with Christ, and ingrafting into the new covenant, and thus communion of all goods in Christ.

II. Passive reconciliation and justification (as they call it), or rather internal, in us—from which is distinguished external or active justification, which is concerning us. Furthermore, this necessary distinction [between active and passive justification] has been illustrated above all others, and clearly and solidly defended by Dr. [Johannes] Maccovius in his Theological Collection, pt. 4, Disputation 9, compared with pt. 3, Disputation 16, and his particular syllabus of disputations on Justification. And we in the Problems on Justification shall vindicate it ἐν παρόδῳ [en parodō, in passing] from certain objections. There is no reason therefore to pursue it here at greater length. Only I add these three things for the sake of younger students:

      1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.

      2. That active justification is distinguished from the decree of justification, as the execution of a decree from the decree, and the emanating action of God from the immanent. Just as the decree of creation must necessarily be distinguished from creation itself.

      3. That the same was accomplished fundamentally and κατ’ ἐπαγγελίαν [kat’ epangelian, according to promise] in the first institution, contracting, and promulgation of the new covenant, Gen. 3 [v. 15]; consummatively in the cross and resurrection of Christ, Rom. 8:32–33; 2 Cor. 5:18–19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-38ad15fc71" data-kw="">
<blockquote><p>Come we to your [John Cotton‘s] proper opinion: You ‘do not acknowledge any unwillingness in God to reward the men of this world with life, upon any condition whatsoever.‘ I know no reason why you should conceive any of our divines to differ from you in this, although you had spoken out your meaning never so plainly and fully: not only denying unwillingness, but acknowledging a willingness, as afterwards you do; not a willingness only, which may have place though joined with a will to the contrary, as in all mixed actions, which yet are not incident to God, though they are to a creature, as who sometimes does some thing volens nolens [willingly not willingly]: for certainly God will save any man upon condition he believes and repents: and on the other side, neither is there any unwillingness in God, but a willingness rather, yea and that a resolute will to damn any man in case he dies in infidelity and impenitency. For we have the clear word of God to justify us herein, professing most evidently that ‘Whosoever believeth shall be saved; whosoever believeth not shall be damned.’ So that I wonder not a little whereto these expressions [of Cotton’s] tend, save that commonly such is the issue of imperfect conceptions, all preparations to the justifying of them fall miserably short of that whereunto they aim.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2, pp. 54-55</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Come we to your [John Cotton‘s] proper opinion: You ‘do not acknowledge any unwillingness in God to reward the men of this world with life, upon any condition whatsoever.‘ I know no reason why you should conceive any of our divines to differ from you in this, although you had spoken out your meaning never so plainly and fully: not only denying unwillingness, but acknowledging a willingness, as afterwards you do; not a willingness only, which may have place though joined with a will to the contrary, as in all mixed actions, which yet are not incident to God, though they are to a creature, as who sometimes does some thing volens nolens [willingly not willingly]: for certainly God will save any man upon condition he believes and repents: and on the other side, neither is there any unwillingness in God, but a willingness rather, yea and that a resolute will to damn any man in case he dies in infidelity and impenitency. For we have the clear word of God to justify us herein, professing most evidently that ‘Whosoever believeth shall be saved; whosoever believeth not shall be damned.’ So that I wonder not a little whereto these expressions [of Cotton’s] tend, save that commonly such is the issue of imperfect conceptions, all preparations to the justifying of them fall miserably short of that whereunto they aim.”

— William Twisse, A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof, [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2, pp. 54-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCome+we+to+your+%5BJohn+Cotton%E2%80%98s%5D+proper+opinion%3A+You+%E2%80%98do+not+acknowledge+any+unwillingness+in+God+to+reward+the+men+of+this+world+with+life%2C+upon+any+condition+whatsoever.%E2%80%98+I+know+no+reason+why+you+should+conceive+any+of+our+divines+to+differ+from+you+in+this%2C+although+you+had+spoken+out+your+meaning+never+so+plainly+and+fully%3A+not+only+denying+unwillingness%2C+but+acknowledging+a+willingness%2C+as+afterwards+you+do%3B+not+a+willingness+only%2C+which+may+have+place+though+joined+with+a+will+to+the+contrary%2C+as+in+all+mixed+actions%2C+which+yet+are+not+incident+to+God%2C+though+they+are+to+a+creature%2C+as+who+sometimes+does+some+thing+volens+nolens+%5Bwillingly+not+willingly%5D%3A+for+certainly+God+will+save+any+man+upon+condition+he+believes+and+repents%3A+and+on+the+other+side%2C+neither+is+there+any+unwillingness+in+God%2C+but+a+willingness+rather%2C+yea+and+that+a+resolute+will+to+damn+any+man+in+case+he+dies+in+infidelity+and+impenitency.+For+we+have+the+clear+word+of+God+to+justify+us+herein%2C+professing+most+evidently+that+%E2%80%98Whosoever+believeth+shall+be+saved%3B+whosoever+believeth+not+shall+be+damned.%E2%80%99+So+that+I+wonder+not+a+little+whereto+these+expressions+%5Bof+Cotton%E2%80%99s%5D+tend%2C+save+that+commonly+such+is+the+issue+of+imperfect+conceptions%2C+all+preparations+to+the+justifying+of+them+fall+miserably+short+of+that+whereunto+they+aim.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Treatise+of+Mr.+Cotton%E2%80%99s+clearing+certain+doubts+concerning+Predestination+together+with+an+Examination+thereof%2C+%5BJohn%5D+Cotton%E2%80%99s+clearing+certain+doubts+concerning+Predestination%2C+together+with+an+Examination+Thereof+%28London%3A+J.D.%2C+1646%29%2C+Question+2%2C+pp.+54-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38ad15fc71.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38ad15fc71.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Come%20we%20to%20your%20%5BJohn%20Cotton%E2%80%98s,short%20of%20that%20whereunto%20they%20aim&amp;text=Come%20we%20to%20your%20%5BJohn%20Cotton%E2%80%98s%5D%20proper%20opinion&amp;text=fall%20miserably%20short%20of%20that%20whereunto%20they%20aim" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

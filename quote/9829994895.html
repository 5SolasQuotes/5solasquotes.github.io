<main class="wrap"><figure class="quote" id="q-9829994895" data-kw="">
<blockquote><p>Messiah’s subjects are his, because by his spirit and power he forms them anew; fitting them now for his service here, and for the full enjoyment of heaven hereafter. To rescue men from external slavery, yet to leave their slavish habits and propensities in full force, would not greatly ameliorate their condition nor render them proper subjects of a free state. Christ does more than this for his people, and thereby his right to their persons and services is strengthened and confirmed. “Behold,” says he, “I make all things new,” and through his creative energy new light shines into the understanding, and new affections are kindled in the heart—new principles are implanted in the mind, and new hopes gladden the soul—new desires influence the will, and new actions characterise the life—old things pass away, and all things become new.

All this is effected by his blessed spirit. “Lo,” said Jesus, when about to leave this scene of suffering and of sorrow, “Lo I am with you always, even to the end of the world.” The disciples to whom this promise was made, continued not long upon earth, and we now behold him with the eye of flesh no more. Yet is he still present with his people. Yea he will never leave nor forsake them. Soon was his promise fulfilled, and the Comforter, sent from on high, took up his abode in the hearts of his people. They thus become temples of the Holy Ghost, in which he delights to dwell, and will for ever be glorified; they are members of that body of which Christ is at once the sovereign and head, and one spirit animates the whole.

If slight benefits conferred, or trivial changes of character produced, furnish claims of gratitude or of submission, what must be due from Messiah’s subjects to their Lord, who makes them new creatures, and fits them for the society of angels, and the spirits of just men made perfect? In consequence of this, whatever their previous character or conduct may have been, they now perceive that Christ is indeed a King; they cordially submit to him as their king; and, by cheerfully submitting themselves to him as his subjects, they confirm his right to their persons and services, they secure their own felicity in time and for ever, and they verify the prediction of our text, “Thy people shall be willing.</p></blockquote>

<blockquote><p>M.—I think I recollect that, towards their subjects, they were to practise the indulgence of fathers to their children, to use the diligence of shepherds in promoting their interest, to behave as generals for the security of their persons, as chief-justices in displaying a pre-eminence of virtue, and as emperors in issuing salutary edicts.

B.—Can he, then, be called a father, who treats his subjects as slaves? or he a shepherd, who does not feed but slay his flock? or he a pilot, whose constant study it is to throw the goods overboard; and who, according to the nautical adage, scuttles the vessel in which he sails?

M.—By no means.

B.—What do you think of the king who governs, not for the benefit of the people, but for the gratification of his own appetites and passions, and is manifestly engaged in an insidious conspiracy against his subjects?

M.—I shall certainly deem him neither a general, an emperor, nor a supreme judge.

B.—Should you, then, observe a man usurping the name of king who excels none of the multitude in any species of virtue, and is even inferior to many, who discovers no paternal affection for his subjects, but crushes them under his proud sway; who considers them as a flock entrusted to him, not for their preservation but for his own emolument; will you reckon him truly a king, though he should stalk along, crowded by a numerous train of guards, and make an ostentatious display of a magnificent dress, and dazzle the eye by exhibiting the sword of the law, and conciliate the favour and applause of the vulgar by prizes, games, processions, mad piles of buildings, and other popular signs of grandeur? Will you, I say, deem him a king?

M.—Not at all, if I mean to be consistent; I must consider him as an outcast from human society.

B.—By what bounds do you circumscribe this human society?

M.—By the very same to which you seemed to me, in your preceding dissertation, to wish it confined to the fences of law; for I see that robbers, thieves, and adulterers, who transgress them, are punished by the public, and that their transgression of the limits prescribed by human society is thought a just cause for their punishment.

B.—What will you say of those who never would come within the pale of human society?

M.—I should consider them as enemies to God and man, and entitled to the treatment, not of men, but of wolves and other noxious animals, which, if bred by any person, are bred to the destruction of himself and of others, and, if killed, are killed to the advantage, not only of the individual, but of the public. Nay, were I empowered to enact a law, I would adopt the Roman method of treating monsters, and order such a race of men to be exposed on some desolate island, or to be sunk in the deep at a distance from the sight of land, lest they should, even when dead, injure the living by their contagion; and publish a decree, that whoever despatched them should be rewarded, not only by the whole people, but by private persons, as is generally done to those who have killed wolves or bears, or seized their cubs.

For, if any such monster were to arise, and to utter human accents, and to have the appearance of a man’s face, and his likeness in every other part, I could never think myself connected with him by any social tie. Or, if any one, divesting himself of humanity, should degenerate into savage barbarity, and refuse to unite with other men, but for men’s destruction, I do not think him entitled to the appellation of man any more than satyrs, apes, or bears, though in his look, gesture, and language, he should counterfeit man.</p></blockquote>

<blockquote><p>Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].</p></blockquote>

<blockquote><p>Speaking at a meeting near the end of the American Civil War at Clifton Street Presbyterian Church, Belfast, the Revd Daniel Gunn Brown condemned chattel slavery:

There was, he said, the greatest possible difference between man as a rational being, free to improve his own faculties and to pursue his own lawful business, and man as a chattel, a mere thing or article of trade, a slave bought and sold, in the market for filthy lucre, at the caprice of will of his master.

There was the greatest possible difference, he said, between man as God and nature formed him, and man as slavery had debased him. God had ordained all men to dwell on the face of the earth together. God was the only Lord over man’s conscience and man’s liberty.</p></blockquote>

<blockquote><p>Of the Anabaptists’ arguments against the authority of masters, and subjection of servants. … 2. Objection. It is against nature for one to be servant, especially a bond-servant to another. Answer. To grant that it is against that absolute and perfect nature wherein at first God created man, and that it came in by sin, yet is it not against that order and course of nature wherein God has now settled man. God has turned many punishments of sin to be bounden duties: as subjection of wife to husband and man’s eating bread in the sweat of his brow.</p></blockquote>

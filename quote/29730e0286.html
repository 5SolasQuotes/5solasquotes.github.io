<main class="wrap"><figure class="quote" id="q-29730e0286" data-kw="">
<blockquote><p>Love to God, and love to man, is the substance of religion; when these prevail, civil laws will have little to do… 1. The magistrate (or ruling part of any society) ought to encourage piety by his own example, and by endeavoring to make it an object of public esteem. Whenever the general opinion is in favor of anything, it will have many followers. Magistrates may promote and encourage men of piety and virtue, and they may discountenance those whom it would be improper to punish. 2. …It is commonly said, however, that in case any sect hold tenets subversive of society, and inconsistent with the rights of others, that they ought not to be tolerated. On this footing Popery is not tolerated in Great Britain; because they profess entire subjection to a foreign power, the See of Rome: and therefore must be in opposition to the proper interest of their own state; and because violence or persecution for religion is a part of their religion, which makes their prosperity threaten ruin to others, as well as the principle imputed to them, which they deny, That faith [upholding agreements] is not to be kept with heretics… 3. The magistrate may enact laws for the punishment of acts of profanity and impiety. The different sentiments of men in religion ought not by any means to encourage or give a sanction to such acts as any of them count profane. Many are of the opinion, that, besides all this, the magistrate ought to make public provision for the worship of God, in such manner as is agreeable to the great body of the society; though, at the same time, all who dissent from it are fully tolerated. And, indeed, there seems to be a good deal of reason for it, that so instruction may be provided for the bulk of common people, who would, many of them, neither support nor employ teachers, unless they were obliged. The magistrate’s right in this case seems to be something like that of the parent; they have a right to instruct, but not to constrain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Moral Philosophy, Lecture 14, ‘Jurisprudence’ in Works</cite>, (Edinburgh, 1815), vol. 7, pp. 119-21</span></figcaption>

<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>HT</cite></span></figcaption>

<blockquote><p>33. That, as it is the duty of every man to worship God in such a manner as he thinks most acceptable to Him; all persons, professing the Christian religion, are equally entitled to protection in their religions liberty… the Legislature may, in their discretion, lay a general and equal tax, for the support of the Christian religion… And all acts of Assembly, lately passed, for collecting monies for building or repairing particular churches or chapels of ease, shall continue in force, and be executed… …and every encumbent of the church of England, who has remained in his parish, and performed his duty, shall be entitled to receive the provision and support established by the act, entitled ‘An act for the support of the clergy of the church of England, in this Province,’… …

35. That no other test or qualification ought to be required on admission to any office of trust or profit, than such oath of support and fidelity to this State, and such such oath of office, as shall be directed by this Convention, or the Legislature of this State, and a declaration of a belief in the Christian religion.

36. That the manner of administering an oath to any person, ought to be such, as those of the religious persuasion, profession, or denomination, of which such person is one, generally esteem the most effectual confirmation, by the attestation of the Divine Being…</p></blockquote>

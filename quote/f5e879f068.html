<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: 1) A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) If love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was [not] formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection. 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. That this blessedness is not simply intellection, but includes an act of will or love, seems to follow from the fact that there is in God some operation besides what is formally called intellection, for God is formally willing, at least in respect of creatures. (See the next chapter [Part 3] about the proof of free volition in God.) For if God freely creates things outside himself and so has volition, it seems that he also has some act of volition, namely love, toward himself. 3) God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally. As was said above about divine intellection, this divine love is not something really distinct from God’s essence. It extends, therefore, to everything that is really identified with the same essence. Hence it can be said that God loves his essence, his decrees, his knowledge, etc. This love is also eternal, unchangeable, non-contingent.</p></blockquote>

get="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There are two main views. One of them has come to be called corruptionism, and it holds that at death the human being ceases to exist (unless and until God resurrects him), even though the soul carries on. The other view is called survivalism, and it hold that the human being persists in existence after death and even before any resurrection, though only as constituted by his soul… …the position I favor is the survivalist one. For I have said that after death the human being persists, albeit in a severely reduced or incomplete state. Now the survivalist view is characterized as the view that after death but before the resurrection, the soul constitutes the human being… a form qua [as] form exists only together with the substance of which it is the form. However, since the substance of which the human soul is the form is not entirely coporeal, that substance subsists and continues beyond the death of the body because the death of the body involves the cessation of only the corporeal aspect of said substance, not the incorporeal aspect. Hence, because the substance that the human soul is the form of persists beyond the death of the body, the soul persists beyond the death of the body… this thing that exists beyond the death of the body is also a substance–albeit an incomplete one–and, since this incomplete substance just is the human being in a radically impaired state, it is quite natural to say that the soul that survives death just is the human being surviving death (again, in a radically incomplete state)… …For the corruptionist position holds, again, that at death the human being cease to exist, even though the soul carries on. Yet the human being is the substance of which the soul is a form. So, if the human being ceases to exist at death, then that means that the substance of which the soul is the form ceases to exist at death. And in that case, how could the soul carry on? How could a form exist apart from the substance of which it is the form?… There are two further important arguments for survivalism, one philosophical and one theological. The first is this… just as it is the human being who sees, and not the eye, it is the human being who thinks, and not the intellect. The eye sees only in a loose sense, and the intellect thinks only in a loose sense. Now, on both the survivalist view and the corruptionist view, the intellect survives the death of the body and thought occurs as well. But if thought occurs and if on Aquinas’s own principles it is strictly speaking only the human being, and not the intellect, which thinks, then it follows that there must be a sense in which the human being survives as well. The second, theological argument is this. Being a Christian theologian, Aquinas holds that, after death, the soul is rewarded, punished, or purged in light of the deeds of this present life. But it makes sense to reward, punish, or purge only perons, not mere parts of persons. It makes no sense, for example, to speak of rewarding or punishing Bob’s foot or hi pancreas for Bob’s good or bad deeds.</p></blockquote>

<blockquote><p>However, it is not agreed between the Scholastic Doctors and at least some of our theologians, as is evident from what has been said, whether the soul of our Lord Jesus Christ, while he was still on earth, before death already enjoyed that highest blessedness which it now enjoys in Heaven; and thus whether Christ could then be said to be simultaneously a wayfarer and a comprehender (which the Roman School teaches by common consent). But some of our theologians deny this, while others affirm it, most being silent and saying or establishing nothing about it. Furthermore, from that matter another dispute arises, whether Christ had faith and hope properly so called, which the Roman School denies, as has been shown before. But those of our theologians who deny that Christ’s soul was always perfectly blessed affirm it. Concerning faith, however, there seems to be a λογομαχία [logomachy, or dispute about words]… Moreover, from what has been said it appears that our theologians, either all or most, differ from the Roman School in this, that they think that all fullness of grace was not poured out upon Christ’s soul at once and simultaneously as soon as he was conceived in the Virgin’s womb, but that Christ made progress in grace with time, not only as to acts, but also as to habits; whereas on the contrary the Roman School holds that the gifts of the Spirit were conferred upon Christ in such abundance in his very first conception, that afterwards there was no place at all for increase, but whatever gifts and grace Christ now possesses in his soul, he always had even in his mother’s womb in the same measure and degree. But the principal dispute is about the knowledge of Christ’s soul, which indeed all agree now knows all things in heaven of which knowledge can fall to any creature, but they do not agree whether he always knew all things and never learned anything which he truly did not know before. And the Pontificals indeed by common consent hold that the soul of our Lord Jesus Christ was so filled with knowledge from its very creation, that it afterwards learned nothing which it did not know before, and that Christ never labored under any privative and properly so called ignorance, but through some created knowledge always knew all things which he now knows, and which it is possible for a creature to know. On the contrary, however, most of our theologians assert that it can be truly and properly said that Christ, insofar as he is man, was sometimes ignorant of something, and that his knowledge began to have various increases with age, and thus that he knows some things in heaven which he did not know when he was not yet glorified.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“However, it is not agreed between the Scholastic Doctors and at least some of our theologians, as is evident from what has been said, whether the soul of our Lord Jesus Christ, while he was still on earth, before death already enjoyed that highest blessedness which it now enjoys in Heaven; and thus whether Christ could then be said to be simultaneously a wayfarer and a comprehender (which the Roman School teaches by common consent). But some of our theologians deny this, while others affirm it, most being silent and saying or establishing nothing about it. Furthermore, from that matter another dispute arises, whether Christ had faith and hope properly so called, which the Roman School denies, as has been shown before. But those of our theologians who deny that Christ’s soul was always perfectly blessed affirm it. Concerning faith, however, there seems to be a λογομαχία [logomachy, or dispute about words]… Moreover, from what has been said it appears that our theologians, either all or most, differ from the Roman School in this, that they think that all fullness of grace was not poured out upon Christ’s soul at once and simultaneously as soon as he was conceived in the Virgin’s womb, but that Christ made progress in grace with time, not only as to acts, but also as to habits; whereas on the contrary the Roman School holds that the gifts of the Spirit were conferred upon Christ in such abundance in his very first conception, that afterwards there was no place at all for increase, but whatever gifts and grace Christ now possesses in his soul, he always had even in his mother’s womb in the same measure and degree. But the principal dispute is about the knowledge of Christ’s soul, which indeed all agree now knows all things in heaven of which knowledge can fall to any creature, but they do not agree whether he always knew all things and never learned anything which he truly did not know before. And the Pontificals indeed by common consent hold that the soul of our Lord Jesus Christ was so filled with knowledge from its very creation, that it afterwards learned nothing which it did not know before, and that Christ never labored under any privative and properly so called ignorance, but through some created knowledge always knew all things which he now knows, and which it is possible for a creature to know. On the contrary, however, most of our theologians assert that it can be truly and properly said that Christ, insofar as he is man, was sometimes ignorant of something, and that his knowledge began to have various increases with age, and thus that he knows some things in heaven which he did not know when he was not yet glorified.”

— Louis Le Blanc, 3. ‘Knowledge of Christ’s soul, and his grace and blessedness’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 2. Controversies on Christ’s Person &amp; Office, pp. 974-82 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+it+is+not+agreed+between+the+Scholastic+Doctors+and+at+least+some+of+our+theologians%2C+as+is+evident+from+what+has+been+said%2C+whether+the+soul+of+our+Lord+Jesus+Christ%2C+while+he+was+still+on+earth%2C+before+death+already+enjoyed+that+highest+blessedness+which+it+now+enjoys+in+Heaven%3B+and+thus+whether+Christ+could+then+be+said+to+be+simultaneously+a+wayfarer+and+a+comprehender+%28which+the+Roman+School+teaches+by+common+consent%29.+But+some+of+our+theologians+deny+this%2C+while+others+affirm+it%2C+most+being+silent+and+saying+or+establishing+nothing+about+it.+Furthermore%2C+from+that+matter+another+dispute+arises%2C+whether+Christ+had+faith+and+hope+properly+so+called%2C+which+the+Roman+School+denies%2C+as+has+been+shown+before.+But+those+of+our+theologians+who+deny+that+Christ%E2%80%99s+soul+was+always+perfectly+blessed+affirm+it.+Concerning+faith%2C+however%2C+there+seems+to+be+a+%CE%BB%CE%BF%CE%B3%CE%BF%CE%BC%CE%B1%CF%87%CE%AF%CE%B1+%5Blogomachy%2C+or+dispute+about+words%5D%E2%80%A6+Moreover%2C+from+what+has+been+said+it+appears+that+our+theologians%2C+either+all+or+most%2C+differ+from+the+Roman+School+in+this%2C+that+they+think+that+all+fullness+of+grace+was+not+poured+out+upon+Christ%E2%80%99s+soul+at+once+and+simultaneously+as+soon+as+he+was+conceived+in+the+Virgin%E2%80%99s+womb%2C+but+that+Christ+made+progress+in+grace+with+time%2C+not+only+as+to+acts%2C+but+also+as+to+habits%3B+whereas+on+the+contrary+the+Roman+School+holds+that+the+gifts+of+the+Spirit+were+conferred+upon+Christ+in+such+abundance+in+his+very+first+conception%2C+that+afterwards+there+was+no+place+at+all+for+increase%2C+but+whatever+gifts+and+grace+Christ+now+possesses+in+his+soul%2C+he+always+had+even+in+his+mother%E2%80%99s+womb+in+the+same+measure+and+degree.+But+the+principal+dispute+is+about+the+knowledge+of+Christ%E2%80%99s+soul%2C+which+indeed+all+agree+now+knows+all+things+in+heaven+of+which+knowledge+can+fall+to+any+creature%2C+but+they+do+not+agree+whether+he+always+knew+all+things+and+never+learned+anything+which+he+truly+did+not+know+before.+And+the+Pontificals+indeed+by+common+consent+hold+that+the+soul+of+our+Lord+Jesus+Christ+was+so+filled+with+knowledge+from+its+very+creation%2C+that+it+afterwards+learned+nothing+which+it+did+not+know+before%2C+and+that+Christ+never+labored+under+any+privative+and+properly+so+called+ignorance%2C+but+through+some+created+knowledge+always+knew+all+things+which+he+now+knows%2C+and+which+it+is+possible+for+a+creature+to+know.+On+the+contrary%2C+however%2C+most+of+our+theologians+assert+that+it+can+be+truly+and+properly+said+that+Christ%2C+insofar+as+he+is+man%2C+was+sometimes+ignorant+of+something%2C+and+that+his+knowledge+began+to+have+various+increases+with+age%2C+and+thus+that+he+knows+some+things+in+heaven+which+he+did+not+know+when+he+was+not+yet+glorified.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+3.+%E2%80%98Knowledge+of+Christ%E2%80%99s+soul%2C+and+his+grace+and+blessedness%E2%80%99+in+Theological+Theses+Published+at+Various+Times+in+the+Academy+of+Sedan+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+%281675%3B+London%2C+1683%29%2C+Posthumous+Works%2C+2.+Controversies+on+Christ%E2%80%99s+Person+%26+Office%2C+pp.+974-82+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2114a44213.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2114a44213.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=However%2C%20it%20is%20not%20agreed%20between,when%20he%20was%20not%20yet%20glorified&amp;text=However%2C%20it%20is%20not%20agreed%20between%20the%20Scholastic&amp;text=not%20know%20when%20he%20was%20not%20yet%20glorified" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5dd7c3879c" data-kw="">
<blockquote><p>Now in all dwelling in Christ there is a continual acting of life by believing, joying, resting in God. As Phillip says, Jn. 14:8, ‘Lord, show us the Father and it sufficeth us.’ Here life seeks a soul-satisfying union with life, for life is only a satisfactory object to life. Living things seek no dead things as such to be their happiness if reason do rightly act them, and God as revealed in Jesus Christ is that in which the saints find a soul-sufficiency for themselves; and the act of seeing God in Christ, whether in this life or in the life to come, is an act of life, for the soul lives in the ocean, sea, and bosom of a fair eternal truth. But does it act there? yea, it does, and the Scripture expresses its acting by seeing God, drinking the fountain of life. Then the soul, thus in Christ, drinks in love and milks, and sucks in the soul-rejoicing irradiations of Christ, and Christ letting out the breathings of the sweetness of his excellency on the face of the soul draws and sucks in reciprocally acts of admiration and wondering, Cant. 2:8, ‘The voice of my beloved, behold he cometh leaping upon the mountaines, and skipping on the hills;’ ‘behold’ is a word of wonder, 1 Jn. 3:1, ‘Behold what manner of love the Father hath bestowed on us.’ Not love only, but the manner and the kind of the Father’s love in Christ, is a world’s wonder, and 2 Thess. 1:10, Christ when he comes shall be wondered in them that believe. 2. Then again when we see and enjoy the drawing loveliness of Christ, He as the fountain and well of life pours in, in our intellectuall love and in the glancings and rays of our understanding, acts of divine light, lumps of fresh love from the spring of heaven’s love, and the soul opens its mouth wide and takes in the streams of Christ’s nectar, honey and milk, his consolations and love-breathings; and in his light we seeing light, and in his love, feeling love, He makes out light and love (as it were) coeternal with borrowed eternity; and we go along with the out-shinings of Christ’s bright countenance, to shine in borrowed light, to flame in borrowed coals of love; and as Christ is said to feed his flock among the lilies, the garden of Christ, his Church being the common pasture for the lambs of the flock; so He feeds the souls of the saints that enjoy Him, with the marrow, fatness and dainties of his light and love that shine in his face, even as the oil feeds the lamp; but with this difference, Christ’s dainties are not lessened because we feed upon them, as the oil is consumed with burning.</p></blockquote>

<blockquote><p>Uniquely among the thirteenth-century Scholastic theologians, Henry of Ghent (c.1217–1293) gives an account of beatific union with God according to which it consists not simply in God’s being the object of a creature’s acts of cognition and/or volition, but in God’s fully interpenetrating the creature in such a way that the creature becomes in some sense identical with God. This article places Henry’s view in its immediate theological context, and outlines the two most important immediate reactions to it – including its influence, hitherto unnoticed, on Meister Eckhart’s account of mystical union. In so doing, it highlights a continuity between Scholastic and non-Scholastic theology in the Middle Ages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Scholastic Debates on Beatific Union with God: Henry of Ghent</cite>, (c.1217-1293) &amp; his Interlocutors’ in Traditio</span></figcaption>

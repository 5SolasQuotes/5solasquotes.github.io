<main class="wrap"><figure class="quote" id="q-176be492d3" data-kw="">
<blockquote><p>[…] God’s will is to have his word understood of mankind, we may thereby gather especially, because that in speaking to his servants he used a most common kind of speech, wherewithal even the very idiots [uneducated persons – DR] were acquainted. Neither do we read that the prophets and apostles, the servants of God and interpreters of his high and everlasting wisdom, did use any strange kind of speech: so that in the whole pack of writers none can be found to excel them in a more plain and easy phrase of writing. Their writings are full of common proverbs, similitudes, parables, comparisons, devised narrations, examples, and such othe like manner of speeches, than which there is nothing that doth more move and plainly teach the common sorts of wits among mortal men. There ariseth, I confess, some darkness in the scriptures, by reason of the natural property, figurative ornaments, and the unacquainted use of the tongues. But that difficulty may easily be helped by study, diligence, faith, and the means of skilful interpreters. I know that the apostle Peter saith, in the epistles of Paul “many things are hard to be understood:” but immediately he addeth, “which the unlearned, and those that are unperfect, or unstable, pervert, as they do the other scriptures also, unto their own destruction.” Whereby we gather, that the scripture is difficult or obscure to the unlearned, unskilful, unexcercised, and malicious or corrupted wills, and not to the zealous and godly readers or hearers thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i,71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

<blockquote><p>Truly, this must not be tolerated in the church, that in place of the things which the Holy Spirit wrote in the Hebrew and Greek sources something should be foisted onto us as authentic which has been badly rendered by the translator or altered or mutilated and added by copyists, and that in such a way that one may not reject them even after he has examined the sources.</p></blockquote>

</figure><figure class="quote" id="q-36de6a17d3" data-kw="">
<blockquote><p>Secondly, we must consider the certainty, and authority of this book. The Church as yet, never rejected or refused this book: but have accounted the same among those, which we call Canonical books of holy scripture, and which have Ecclesiastical, and heavenly testimonies.

Furthermore, we have our saviour Christ (as concerning this matter) a sufficient testimony and witnesses, as may appear by the xii Chapter of Mathew, where he alledgeth the example of Jonas for his resurrection, affirming, that the coming of Jonas out of the Whale’s belly, was a type of the same. Furthermore, Christ preferreth the Ninevites, before the Israelites, because the Ninevites repented at the one only sermon of Jonas, and the Israelites would not be converted unto the Lord by many sermons.

Wherefore, if ever any man did, or shall hereafter doubt of the authority, truth, and certainty of this book, Christ by his testimony, hath so confirmed the same, that though an Angel came from heaven teaching the contrary, he ought not to be believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>News from Ninive to England, brought by the prophet Jonas: which news in plainly published in the godly and learned exposition of Master John Brentius</cite>, trans. Thomas Tymme (London: Henry Denham, 1570), preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

el="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>

<blockquote><p>Secondly, The Holy Spirit hath so disposed of the Scripture that the mind of God in all things concerning our faith and obedience, which are of necessity for us to know, might be clearly and distinctly understood. … [1.] In that whatever is necessary for us to believe concerning these things is plainly and clearly revealed in the Scripture, and that in sundry places.</p></blockquote>

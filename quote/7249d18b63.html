<main class="wrap"><figure class="quote" id="q-7249d18b63" data-kw="">
<blockquote><p>After the defeat at Bothwell, he avoided the consequences of his attainder and condemnation by an escape into Holland. There, in Geneva and the Palatinate, he endeavoured to excite the sympathy of foreign protestants with the sufferings of their Scottish brethren; and along with his brother-in-law, Gordon of Earlston, he acted as commissioner in behalf of the united societies, whom he greatly assisted by his influence in obtaining for them the countenance and support of the continental churches. He continued to reside principally in Holland, although the English government, apprised of his intention of returning with arms and money to the assistance of his persecuted countrymen, repeatedly urged upon the States an application for his delivery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3</cite>, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-5aea7a6f3c" data-kw="">
<blockquote><p>That no minister shall, upon any occasion, testify from the pulpit against any act of Assembly, be it never so sinful; or against any of the proceedings of the judicatories, be they never so unwarrantable.” (See 1st Testimony, p. 82) For there was far more ground to make their inference from the act of Assembly 1638, than from the act of Assembly 1733; and so all our worthy ancestors from that day, and the Brethren themselves, according to their argument, have been living in a Church in which there was a very sinful term of communion required of them; and yet they never complained of it, nor have they given the least testimony against it. But further, the above Act 1733, relating to these Brethren, being materially rescinded, as was shown above, this objection, even as to them, falls to the ground. But then, as to the second alleged sinful term of communion, viz. “That no minister, or member of this Church shall protest against acts, sentences or decisions of the supreme judicatory, etc.</p></blockquote>

</figure><figure class="quote" id="q-aab513d016" data-kw="">
<blockquote><p>But if we look to the Word of God, it will lead us further, that we be subject not only to the government of these princes which execute their office towards us well, and with such faithfulness as they ought, but also of all them who, by what mean soever it be, have the dominion in possession, etc.</p></blockquote>

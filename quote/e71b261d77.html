</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-552e96d443" data-kw="">
<blockquote><p>So that upon supposition of God’s will to permit Adam to fall, it was necessary that Adam should fall; necessary, I say, that he should fall: But how? Not necessarily, but contingently, and freely: and no other necessity is at this day found in man for the performing of any particular sinful act, but such as is joined with liberty; and that in such sort, as that the necessity is only Secundum quid [that which follows]; the liberty is Simpliciter [essential]: so called, I say, in respect of any particular act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, [John] Cotton’s Clearing Certain Doubts Concerning Predestination together with an Examination Thereof, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-387ee230a5" data-kw="">
<blockquote><p>The moderate Calvinists–who have seen the prominence which the Scriptures everywhere give to human agency, especially in the matter of sin; who have felt in their own souls that there were thoughts, words and deeds, states and affections of the soul, which were truly theirs, which began in the will as the immediate cause–have been compelled to admit that there is a sphere in which God leaves personal agents to themselves, and in which they are permitted to act as real efficient causes. So in innocence Adam was left to the freedom of his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by John Girardeau, The Will in its Theological Relations</cite>, pp. 13-14, from Thornwell’s Collected Writings, vol. 1, Theological Lectures, on Sin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-70bf458f2a" data-kw="apostasy">
<blockquote><p>The first sin of man (from which the others flow as from a fountain) is the voluntary apostasy of the first man from God, his Creator. In eating of the tree of the knowledge of good and evil, he transgressed not only this special interdict, but also in it the whole law of nature engraved upon his heart. It is certain that we must not regard that fall as any particular sin, such as theft or adultery, but as a general apostasy and defection from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.6.1-3</span></figcaption>

</figure><figure class="quote" id="q-78181b61e5" data-kw="">
<blockquote><p>XVI. Seventh, the will of God is universally effective. For whatever he wills, and just as he wills, he brings into effect in its own time and in its own way. Nor is there anything, if he wills it, that does not occur, or that does not occur as he wills it. “For our God is in the heavens; he does whatever he wills.” And Revelation 4:2 says, “By your will they exist and were created.” But (what must be noted) it always occurs just as he wills: if he wills the outcome of a thing, it always occurs; if he wills that it only be our duty, that we should will it ourselves, then it is so. But one must also distinguish between his effecting will and his effective will. The effecting will is only toward things that are good, both physically and morally. The effective will also concerns moral evils, insofar as first, in the eternal decree he determined their futurity, although he did not will to effect the evil itself to come to pass as such, and second, he also wills the substrate of sin, although he does not will its lawlessness and defect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 15, section 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

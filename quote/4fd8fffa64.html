<main class="wrap"><figure class="quote" id="q-4fd8fffa64" data-kw="">
<blockquote><p>Comprehended in the salutation or apostolic benediction: Because Paul, the author of this epistle, would not that the dignity of the Church of Corinth should in any ways be eclipsed (although he knew there were most corrupt persons among them, not only which lay hid, but openly showed themselves enemies to the apostle), but constantly accounted the Church at Corinth a true Church, to which, by his authority, he applied the benediction of the Gospel, and doubted not to wish them all good things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Pauls epistles, together with an explanation of those other epistles of the apostles, St. James, Peter, John &amp; Jude</cite>, ... (London: R.I., 1659) | on 2 Cor., 1:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbc91cf570" data-kw="">
<blockquote><p>1. What is schism from the Church of England? Sure it is not a denying its doctrine, or holding anything contrary thereunto; he that holds perversum Dogma [a perverse dogma] only, is an heretic, no schismatic, as St. Jerome teaches (on Titus 3). Mr. [Matthew] Newcomen, a learned presbyterian, as I observed in my last, lets the Separatists know that their agreeing with us and the Reformed Churches in doctrines that are fundamental, their holding one Head and one Faith, does not excuse them from being guilty of breach of unity, so long as they hold not one Body, one baptism. For he cites Beza, another learned presbyterian (Annotations on 1 Cor. 1:10). So that you may be willing to subscribe to the 39 Articles, and yet be schismatics from the Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-fullwood.html">Francis Fullwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Schism Fully Opened &amp; Applied to Gathered Churches</cite>, ... (London: 1672), ch. 8, pp. 44-45</span></figcaption>

<blockquote><p>1. That the [term] division which is intended here [in this chapter] is not every contest and alienation of mind, and difference of practice incident to men, but that which is proper to the church concerning church affairs, and so is to be distinguished from civil debates and contentions. We would advert also that there may be church differences that fall not under the charge of scandal, as when in some things men of conscience are of different judgments, yet carry it without any offense or breach of charity, or when in some practices there is diversity with forbearance, as was in Polycarp’s days, and the time of Irenaeus (about Easter matters)…</p></blockquote>

</figure><figure class="quote" id="q-e10e4d6844" data-kw="">
<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh: Higgins, 1659) | pt. 4, ch. 21, p. 426</span></figcaption>

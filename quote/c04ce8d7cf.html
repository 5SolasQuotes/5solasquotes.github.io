<main class="wrap"><figure class="quote" id="q-c04ce8d7cf" data-kw="">
<blockquote><p>The same man is not always baptized at the same moment of time with water and with the Spirit. The reason is, because God, who acts in baptism, does not act in a physical way, as when medicine, taken into the body, exerts its power, whether you are awake or asleep, and fire heats, whether you know it or not. But, as the Lord is a most free agent, sometimes baptism of water is without the baptism of the Spirit, as the example of Simon Magus teaches, Act. 8:13, and sometimes the Holy Spirit is conferred first, and water baptism afterward, as in Act. 8:12, 37, 28, and sometimes baptism of the Spirit follows after, as in infants. For, even if, in infants, to whom the kingdom of heaven belongs, if you consider the divine ordination, certainly, baptism and justification and regeneration converge, from the nature of the covenant, “I will be your God and the God of your seed,” Gen. 17:7,” yet its effect is at last manifested in its time by its true marks. For, like the seed of the word, so also the seed of the sacraments lies in the earth like a deposit for as long as it seems good to the Lord to defer his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Common Places (Franeker, 1650), ch. 79, ‘On Baptism’, p. 833 trans. Charles Johnson</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4c1b32671" data-kw="">
<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth</cite>, p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>…in favor of the baptism of infant servants, from the cessation of the Jewish Church to the times of Augustine, we can only say that Augustine speaks of it as a custom in existence; that it resulted, in his day, from the conviction that baptism came in place of circumcision, a conviction which we can trace up through the earliest fathers… …we commend the resolutions of the Synod of South Carolina… ‘1. Resolved, That it is the duty of believing masters to train up their servants, as well as their children, in the nurture and admonition of the Lord. 2. Resolved, That the principles of the Abrahamic covenant, as to the cirucmcision of servants, is till in force in reference to the infant offspring of those who stand to us in this relation; and that as baptism succeeds to circumcision, it is the duty of masters to dedicate such servants to God in the ordinance of baptism, and to do all in their power to train them up in a knowledge of the truth and in the way of salvation through Christ. 3. Resolved, That though there are great and manifest dificulties in carrying out the principles of these resolutions, these difficulties have chiefly resulted from the long continued neglect of believing masters and of the church, and that these difficulties must be gradually overcome by continued and persevering efforts.&#x27;</p></blockquote>

<blockquote><p>I confess when the fault is ceremonial, though the punishment be real, as the cutting off of an infant not circumcised [Gen. 17:14], and some punishments inflicted on the leper, it is not reason the law should oblige us in the New Testament, either as touching the punishment or the degree. Because these punishments for typical faults are ordained to teach rather than to be punishments, and the magistrate by no light of nature could make laws against unbaptized infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation... (1649)</cite>, p. 299</span></figcaption>

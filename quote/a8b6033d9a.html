<main class="wrap"><figure class="quote" id="q-a8b6033d9a" data-kw="">
<blockquote><p>Alas, we deceive ourselves with the noise of a covenant, and a cause of God; we cry it up as an antidote against all evils, use it as a charm, even as the Jews did their temple; and, in the mean time, we do not care how we walk before God, or with our neighbours: well, thus saith the Lord, “trust ye not in lying words,” &amp;c. Jer. vii. 4, 5, 6. If drunkenness reign among you, if filthiness, swearing, oppression, cruelty reign among you, your covenant is but a lie, all your professions are but lying words, and shall never keep you in your inheritance and dwellings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heart-Humiliation: or, Miscellany Sermons, Preached upon some choice texts, at several solemn occasions</cite>, (1676) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 3: 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee1a3d3007" data-kw="">
<blockquote><p>A second rule is, that as the matter in which we are zealous, must be good in it self, so it must be known unto us to be of that quality. True zeal must begin where the word begins, and end where it ends: for otherwise it cannot be of faith, which is ever grounded on the word; and whatsoever is not of faith is sin. We must not therefore content our selves with an honest meaning, and hope that we have a good zeal towards God, when we have no warrant for our hope: but must so acquaint our selves with the Scriptures of God, that our zeal may be according to knowledge.

Which rule discovereth the corruptness of their zeal, whether close hypocrites, or weak Christians, who are led on merely by the examples of good men, whom they affect, much to like of, and earnestly to stand for such things, as they perceive them in their practise to observe, and to make conscience of: and if there be but a word spoken against any of the things that they have taken a liking of, they are marvellously stirred with indignation thereat, and grow passionate and vehement against the parties, though they have never so good a meaning in that which they speak:

Yet let them be urged to prove out of the word the necessity of those duties which they so earnestly press, they can say little or nothing to the purpose for them; and so grow many times either to dislike and forsake all if they be hypocrites, or at least to be discouraged, and to be at a stand, if they be weaklings in Christ Jesus. And whence proceed these inconveniences but from this, that they are zealous for things that in themselves, and unto others are good and holy, but not thoroughly discerned of them to be of that nature: the consideration whereof, should make us to sit sure in matters of godliness, not building upon the example of good men, but upon the truth of the good word of God, and then our foundation shall never fail us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 86-87.</span></figcaption>

</figure><figure class="quote" id="q-bc57e011a2" data-kw="">
<blockquote><p>The truth of God is perfectly harmonious, and is one complete whole. All the parts of it fit into one another, and are mutually dependent upon each other; and as this edifice, so reared by God, is complete and compact in all its parts, so the subtle influence of Satan is often applied to the undermining of one part of the building, in the knowledge that if he should succeed, he can scarcely fail to effect the destruction of all the rest.

We might illustrate this by showing how error, in what at first sight may appear an unimportant point, ruins the whole system, and essentially affects the whole doctrines of the gospel. It may seem, for instance, that the dispute regarding the precise nature of saving faith is a comparatively unimportant point, and one on which Christian men may afford to differ; and yet an error on this point might easily be shown to affect the doctrines of God’s sovereignty, of human depravity, the extent and nature of the atonement, and justification by faith alone.

We might show, for example, that those who make justification by faith to consist in the belief of the fact that they are pardoned—who maintain that a man must believe that Christ died personally for him as an individual—are compelled necessarily to adopt a mode of statement in regard to the bearing of Christ’s death upon all men indiscriminately, and particularly upon the lost, which strikes at the root of the doctrine of personal substitution altogether, and makes it difficult, if not impossible, to believe that Christ actually suffered in the very room and stead of guilty sinners themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), pp 136-37.</span></figcaption>

</figure><figure class="quote" id="q-0f2cdba7fc" data-kw="">
<blockquote><p>It is a noble temper to be afraid of sin. If a person pretends conscience for a particular opinion and practice, and in the mean time be a common drunkard, swearer, liar, blasphemer, unclean person, one that lives as it were without God in the World, making no conscience of reading the Scripture, praying, bringing up and governing his Family in the nurture and fear of the Lord, only pretends conscience as to baptizing of Children, keeping the Seventh day Sabbath; this man is an hypocrite, and dissembles with God and men for there is an uniformity in conscience, and it would certainly oblige him to avoid known and confessed sins, as much as what he doth fancy is a sin, and as much oblige him to all, as to any known duty.

But where I see a Christian walking close with God in the general of his conversation, and differing from me in this or that point, because he thinks he cannot without sin believe and practise what I do; I cannot but love and honour him, and be very far from their Religion who think it the best and most Gospel way to cudgel him into my Persuasion: A Gaol, or a Fire and Faggots never yet cured an erring Conscience. Such Brethren though overtaken with a fault are certainly (according to the Apostle’s counsel) to be restored in the spirit of meekness, and to be dealt with, (like rational Creatures) argued, and treated, and persuaded out of their mistakes, not cudgelled out of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), epistle dedicatory.</span></figcaption>

<blockquote><p>And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.</p></blockquote>

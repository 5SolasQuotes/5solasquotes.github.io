<main class="wrap"><figure class="quote" id="q-d8ac1ea6f0" data-kw="">
<blockquote><p>THE present situation in the Presbyterian Church in the U. S. A. is only one phase of a situation that prevails in the Protestant churches throughout the world. Everywhere—in the countries of Europe and in mission lands—Christianity finds itself in a mighty conflict with an alien type of religious belief and life. This alien type of religious belief and life appears in many different forms, and expresses itself in many different ways; but at bottom it is everywhere the same. Disparagement of doctrine, decrying of controversy, sinking of doctrinal differences in a program of peace and work, the craze for organizational unions, the “interpretation” of the Bible and of the great Christian creeds to make them mean almost their exact opposite, the substitution of vague swelling words for a clear-cut proclamation of the Cross of Christ, exaltation of experience” at the expense of God’s written Word—these are everywhere the marks of one great and deadly enemy to the Christian faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Present Situation</cite>, (1930).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

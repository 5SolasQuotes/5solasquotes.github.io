<main class="wrap"><figure class="quote" id="q-50e7148f16" data-kw="">
<blockquote><p>Again I conceive that there be two sort of positives in the externals of [Church] government or worship: 1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: and when the Church forms a directory for worship and government, the directory itself is in the form not simply divine…. 2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal; in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture as was the [Anglican] Service-Book [which was sought to be imposed on Scotland in 1637]; and the pastor or people in these are not properly moral agents [working things in themselves moral or religious], nor do we press that Scripture should regulate men in these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro | Section 5, pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad950fb64d" data-kw="">
<blockquote><p>There are in England two sorts of episcopal divines. The one sort are Protestants, differing in nothing considerable from the rest of the Reformed Churches, save only in this matter of Church-government. These (if they be not ignorant, ungodly, negligent, insufficient) I shall heartily reverence and desire their union: And many of them the Church has had, and yet has, with whom I account myself unworthy to be once named: Such as were Jewel, Davenant, and many more formerly; and such as are Archbishop Ussher, Bishop Hall, Bishop Morton, Dr. Sanderson and many more at this day. I am very confident that we have not in our Propositions agreed on any exercise of discipline which is not agreeable to the Principles of Protestant bishops to grant us; nay which Papists do not very many of them allow, where no bishops are. If therefore any of you that are our hearers, being not able to maintain your own conceits, or objections against us, will fly to the authority of episcopal divines; we must entreat you to go to the writings of Protestants only; and if you will inquire of any now living, let them be such as our old godly Protestant bishops were: Or else I must tell you we neither expect their conjunction with us, nor shall much be moved by their judgments. For there is a second sort of episcopal divines of the last edition, and of the growth of about thirty years, who differ from us in greater matters than episcopacy, being indeed Cassandrian Papists, and levelling all their doctrines to the advancement of the Papal interest; If you will appeal to these episcopal divines, we should almost as soon consent to an appeal to Rome… 5. The late bishops [pre-1653], even in the judgment of all moderate men of their own party that ever I spoke with, did very many of them deserve to be put down, and more. Read the articles against Wren, Pierce, Goodman, Laud, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>

</figure><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>

</figure><figure class="quote" id="q-09a8066301" data-kw="">
<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects. 1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ. 2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction. 3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), pp. 12-14</span></figcaption>

<blockquote><p>[It is superstition] that all the pastors of the protestant Churches abroad, who had only the election of the people and the ordination of parochial pastors, and not of diocesan bishops, are no true ministers of Christ, but laymen. That therefore those Churches are no true Churches (in a political sense and as organized). That therefore their baptism is unlawful and a nullity, and all those nations are no baptized Christians (though the Papists who hold the validity of laymen’s baptizing do here censure [these protestant episcopal men] more easily). That it is not lawful to communicate in such Churches and receive the sacrament of the Lords supper from such ministers. That those countries which are baptized by such should be rebaptized. That those ministers who are ordained by such should be re-ordained.</p></blockquote>

<blockquote><p>Vers. 13. Go to now, ye that say, To day or tomorrow we will go into such a City, and continue there a year, and buy, and sell, and get gain.

The third Admonition, especially to buyers, touching the correcting of their slothful neglect of Divine Providence in undertaking businesses: He convinces them of this sin, from the words mimically propounded. The Arguments of the Exhortation are six.

Argum. 1. It is contained in form of citation to God’s Tribunal, Go to, &amp;c. As if he should say, this prophane and wicked manner of deliberation, which doth not acknowledge the Providence of God, can neither bear the trial of God, nor men judging aright: For as if you were Lords of your lives, and of your strength, and success of your labours, so ye speak, ye dare not defend this carriage before God: Therefore ye are held guilty of prophaneness, for these forms of speaking used by you.

Vers. 14. Whereas ye know not what shall be on the morrow: for what is your life? it is even a vapour, that appeareth for a little time, and then vanishes away.

Argum. 2. Ye foolishly determine touching the time to come, when we are all ignorant what will be to morrow: Therefore here you are accused of prophaneness.

For what] Argum. 3. Ye forget your mortality, and the frailty of your life, which is like a vapour, appearing for a little time, by and by cast down by the wind, it vanisheth away: Therefore here ye are deservedly accused of prophaneness.

Vers. 15. For that ye ought to say, if the Lord will, we shall live and do this or that.

Argum. 4. Ye consider not that ye ought to depend upon the Divine will, which is the fountain, rule, and measure of all things. In which argument he prescribes also the remedy against this evil; viz. that we do not always seriously acknowledge only the commanding or revealed will of God (which prescribes to us what, and how we ought to act:) But also the secret will of God, governing and efficaciously working in us, and by us, what, and how much, and as long as it seems good to him:

To which will we ought to submit our actions, and the success of them, and our life it self, always considering in our hearts, that we can do nothing without the efficacious will of God: and that we accustom our selves to such like forms, (If God will, If life, and other things necessary to action be vouchsafed) as to the glory of God, it is sufficient: For the Apostle doth not intend the Religion of outward words, as if forms might never be omitted, but requires continual acknowledgement of Divine Providence in the heart, and such an outward profession in words, which may distinguish us from prophane men.

Vers. 16. But now ye rejoice in your boastings: all such rejoicing is evil.

Argum. 5. Ye that are admonished, defend this prophane manner of speaking, as if ye rejoiced in your vain boasting, by which ye openly publish the wicked stupidity of the heart.

Vers. 17. Therefore to him that knoweth to do good; and doth it not, to him it is sin.

Argum. 6. By preventing an objection, If ye know that all your businesses is committed to Divine Providence, and yet do not only contrary, but do not acknowledge God’s Providence in the holy forms of speaking, as to outward expression, do not ye, by how much the more ye know your duty, bring upon your selves so much the more heavy guilt and punishment?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 284-85.</span></figcaption>

<blockquote><p>…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.</p></blockquote>

<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>

<blockquote><p>And in token of this subjection the apostle tells us, 1 Cor. 11:10, that the woman was to have power over her head, because of the angels. Which place, especially the latter clause of it, is diversly interpreted. But I think all agree in this, That this power which they were to have on their heads was a veil or covering, which at other times, but most especially in the congregation, women ought to wear on their heads; and which in the primitive times covered not only their heads, but all their face, as a guard to their modesty, and a screen to keep off loose and wanton eyes. And this veil is called power, to signify that they were under the power and authority of their husbands. But the men were uncovered in their assemblies, as the apostle tells us, verse 4, to signify that they had nothing over them, but were superior to all visible creatures, and subject only unto God. This power, or veil, women were to wear because of the angels… But either by angels are meant the ministers of the Church, before whom they are to show modesty and bashfulness; or else perhaps the celestial angels, who are always present and attending in the assemblies and congregations of the faithful; and therefore women should not do anything unbecoming and unseemly before them: Or lastly, because the angels themselves do reverence Christ, who is their head, and in token of their subjection unto him, are said to veil and cover their faces: And therefore women also in token of their subjection to their husbands, who are their heads, as Christ is of the Church, should likewise cover their heads and faces with a veil. So we find Gen. 24:65. that when Rebekah saw Isaac coming towards her, she took a veil and covered herself, as a sign of her subjection to him.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And in token of this subjection the apostle tells us, 1 Cor. 11:10, that the woman was to have power over her head, because of the angels. Which place, especially the latter clause of it, is diversly interpreted. But I think all agree in this, That this power which they were to have on their heads was a veil or covering, which at other times, but most especially in the congregation, women ought to wear on their heads; and which in the primitive times covered not only their heads, but all their face, as a guard to their modesty, and a screen to keep off loose and wanton eyes. And this veil is called power, to signify that they were under the power and authority of their husbands. But the men were uncovered in their assemblies, as the apostle tells us, verse 4, to signify that they had nothing over them, but were superior to all visible creatures, and subject only unto God. This power, or veil, women were to wear because of the angels… But either by angels are meant the ministers of the Church, before whom they are to show modesty and bashfulness; or else perhaps the celestial angels, who are always present and attending in the assemblies and congregations of the faithful; and therefore women should not do anything unbecoming and unseemly before them: Or lastly, because the angels themselves do reverence Christ, who is their head, and in token of their subjection unto him, are said to veil and cover their faces: And therefore women also in token of their subjection to their husbands, who are their heads, as Christ is of the Church, should likewise cover their heads and faces with a veil. So we find Gen. 24:65. that when Rebekah saw Isaac coming towards her, she took a veil and covered herself, as a sign of her subjection to him.”

<blockquote><p>I saw the evil of legal preaching, which lies in one of two things, or in both. 1. In laying too much stress upon the works of the law, our duties and strength: Or, 2. In pressing evangelical doctrines without an eye to that which is the spring of the church’s edification, the Spirit of the Lord… O Lord, thou knowest how much of it is in this poor church.</p></blockquote>

<blockquote><p>But it is the opinion of injudicious furious spirits that no truth is to be silenced for peace. Truth is not to be sold for carnal prosperity, but it is to be forborne for spiritual advantage and true necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions</cite>, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 208-9, p. 209</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13940a8abf" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ‘If government by independent congregations be insufficient because it authorizes not persons to be pastors over pagans, government by synods is sick of the same disease.’ [Rutherford’s] Answer: [1.] We judge the essence of a pastor not to stand in the call and choice of those to whom they are pastors; for it makes Paul, Barnabas and the apostles to be no pastors to the gentiles and to the heathen, to whom they preach, and [it] makes the apostles as apostles to be no pastors. [Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Richard Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, dis. 19, th. 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leided, in Synopsis of Pure Theology, dis. […], thesis 17, p. 605; Bucan, in loc., Com. 42, q. 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, &amp; munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Com. ibid. Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trochoregia, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (London, 1658), p. 472</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-5bccefe48c" data-kw="">
<blockquote><p>XXXVI… For as to the laying on of hands, it cannot be considered as a sign. (a) It is not an element, but an action. (b) It is common with confirmation and many other things and was practiced even under the Old Testament. (c) It was not instituted by Christ by any command, but is a free ceremony, which we read indeed of having been employed, but not of having been instituted; what has been employed, however, ought not at once to be said to have been instituted. Thus the washing of feet and breathing upon the apostles were employed by Christ (Jn. 13:5; Jn. 20:22); yet they were not on that account instituted. (d) Imposition of hands does not pertain to all the orders [of Church office], but only to some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fbf177cc5d" data-kw="">
<blockquote><p>The Confession, therefore, must be regarded as teaching, that it is not true of any but the elect only that they are redeemed by Christ, any more than it is true that any others are called, justified, or saved. Here I may remark by the way, that though many modern defenders of a universal atonement regard the word redemption as including the application as well as the impetration of pardon and reconciliation, — and, in this sense, disclaim the doctrine of universal redemption, — yet a different phraseology was commonly used in theological discussions about the period at which the Confession was prepared, and in the seventeenth century generally. Then the defenders of a universal atonement generally maintained, without any hesitation, the doctrine of universal redemption, — using the word, of course, to describe only the impetration, and not the application, of spiritual and saving blessings; and this holds true, both of those who admitted, and of those who denied, the Calvinistic doctrine of election. Of the first of these cases (the Calvinists) we have an instance in Richard Baxter’s work, which he entitled Universal Redemption of Mankind by the Lord Jesus Christ; and of the second (the Arminians) in Dr. Isaac Barrow’s sermons, entitled The Doctrine of Universal Redemption Asserted and Explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 325-31 of Historical Theology (Edinburgh: T&amp;T Clark, 1863), vol. 2</cite>, p. 327</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad2f535dcd" data-kw="">
<blockquote><p>Now for the clearing of the truth of this, when we say Christ died for us, the meaning is that Christ died for our benefit. Now these benefits which Christ procured unto us by his death, it may be they are of different conditions, whereof some are ordained to be conferred only conditionally, and some absolutely. And therefore it is fit we should consider them apart. As for example it is without question (I suppose) that Christ died to procure pardon of sin and salvation of soul, but how absolutely, whether men believe or no? Nothing less, but only conditionally, to wit, that for Christ’s sake their sins shall be pardoned and their souls saved, provided they do believe in Him. Now I willingly confess that Christ died for all in respect of procuring these benefits, to wit conditionally, upon the condition of their faith, in such sort that if all and every one should believe in Christ, all and every one should obtain the pardon of their sins and salvation of their souls for Christ’s sake. And I presume that no Arminian on the other side will affirm that Christ in such sort died for all and every one that all and every one should have their sins pardoned and their souls saved for Christ’s sake, whether they believe or no. What cause then is there of any difference between us on this point, thus explicated. Yet hereby it is manifest that the benefit of remission of sins and salvation of souls for Christ’s sake, shall in the end redound to none but such as believe, as this Author seems to acknowledge. But come we to faith itself and regeneration, are these benefits redounding unto us by the merits of Christ, yea or no?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice… (Amsterdam, 1631), 3rd Part | 1st Section</cite>, pp. 143-44</span></figcaption>

</figure><figure class="quote" id="q-cb0ca35f61" data-kw="">
<blockquote><p>When [Amyraldianism] urges that the Bible teaches that both by divine decree and in history Christ’s death, represented by it as unrestricted regarding its referents, was intended to save all men without exception (the doctrine of universal atonement), Amyraldianism must necessarily join forces with Arminian universalism which… shares this aspect of its vision and turn away altogether from a real substitutionary atonement…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-reymond.html">Robert L. Reymond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A New Systematic Theology of the Christian Faith (Nashville, TN: Thomas Nelson, 1998), p. 478; The italics are Reymond’s.</cite></span></figcaption>

<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect. IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism… (1619; London, 1635), ch. 27, ‘How far, and in what sense Christ died for all’</cite>, pp. 226-28</span></figcaption>

<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>

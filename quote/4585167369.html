<main class="wrap"><figure class="quote" id="q-4585167369" data-kw="Unity">
<blockquote><p>Since there are various species of union—some in evil, others in good and the truth—that unity only is to be proved which rests upon the truth. Hence unity is to be estimated by faith, not faith by unity. And thus the truth of doctrine, on which all true and saving union is founded, must first be known before the church can be evident.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a> › <a href="../topics/rome/the-church/visible-unity.html">Visible unity</a></span><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a> › <a href="../topics/the-church/schism-and-heresy/unity-of-the-church.html">Unity of the church</a></span></div>

<blockquote><p>Although infallibility is not given by God to the church, it cannot on this account be said that God was wanting in things necessary to her, because it is not necessary to have a supreme and infallible tribunal among men upon whose decrees and responses our faith should be suspended, since it is sufficient for her to have an infallible rule of faith and practice in the Scriptures, which as long as she observes, she will not wander from the right track.</p></blockquote>

</figure><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>

</figure><figure class="quote" id="q-48d95ae109" data-kw="Marks of the church Rome">
<blockquote><p>The Lord recognises nothing as his own, save when his word is heard and religiously observed. … If that temple which seemed consecrated for the perpetual habitation of God, could be abandoned by God and become profane, the Romanists have no ground to pretend that God is so bound to persons or places, and fixed to external observances, that he must remain with those who have only the name and semblance of a Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.3</span></figcaption>

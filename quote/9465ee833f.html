<main class="wrap"><figure class="quote" id="q-9465ee833f" data-kw="">
<blockquote><p>Have I caused my family to go with me to the Church? And did I with them come in due time, and being there, did stay the whole time of prayer, reading, and preaching of the Word, singing of Psalms, receiving and administering the Sacraments, even that of Baptism, when others are baptized, and did attend diligently, and join with the minister and the rest of the congregation in all those holy exercises?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scudder on the Church’s Public Worship</cite>, pp. 101-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf8c0a17d5" data-kw="">
<blockquote><p>The heart is the thing He chiefly calls for, expects, and eyes in all our performances… When we pray unto Him, praise Him, sing Psalms (2 Chron. 7:14; Isa. 26:9; Ps. 9:1; Col. 3:16; 1 Chron. 30:19), let’s do it with the heart. When we read or hear his Word, receive the Sacrament, or celebrate any other ordinance; let’s do it with the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wilson.html">John Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cultus Evangelicus, or, A Brief Discourse concerning the Spirituality and Simplicity of New-Testament Worship (London, 1667)</cite>, pp. 78-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-ba0d0318fc" data-kw="">
<blockquote><p>…every pious person is bound in duty to his conscience to have privately his daily devotional exercises, still on this [Lord’s] day above others a holy convocation ought to take place (as was the custom on the Sabbath, Lev. 23:3) in which there may be leisure for devout attention to the reading and hearing of the Word (Heb. 10:25), the celebration of the sacraments (Acts 20:7), the psalms and prayer (Col. 3:16; Acts 1:14), to alms and helo to the poor (1 Cor. 16:2) and in general to all that sacred service pertaining to external and stated worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (d. 1687), vol. 2, Eleventh Topic, Question 14, ‘The Lord’s Day’</cite>, p. 99</span></figcaption>

</figure><figure class="quote" id="q-9cc09eb96d" data-kw="">
<blockquote><p>6. The psalms of David, and other scriptural songs in the Old Testament, may, and ought to be sung in this part of gospel-worship: for saith he, ‘in psalms, hymns, and spiritual songs, singing,’ etc. or rather, ‘singing in psalms, hymns,’ etc. for so the words may be rendered: now all agree that hereby are designed the psalms of David, and other scriptural songs, though there be some difference about the kind of songs which are intended to be expressed by every one of those in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians (1656-1674; London, 1841), p. 239 &amp; 365 | On Col.</cite>, 3:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

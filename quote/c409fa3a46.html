<blockquote><p>The Gospel admits of Repentance after our Falls, and restores us again to the Favour of God upon our true Humiliation: but the Law as a Covenant of Works, left no room for Repentance, but required perfect Obedience without the least Failure; and in case of Non-performance, nothing was to be expected but the Execution of that Death it threatened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94c18d479f" data-kw="">
<blockquote><p>The second main difference is this, namely, that the Covenant of works is made without a Mediator, to mediate between God and man. But in the Covenant of grace there is a Mediator coming between, to unite God and man together, and make them one. Hence Heb. 9.15. Christ is called the Mediator of the new Testament; so also Heb. 12.24. but the first Covenant of works had no Mediator. The reason of this difference is, because when God came to make a covenant of works with Adam, then there was no disagreement between God and man, man was yet righteous, persisting in that innocency and righteousness in which he was created, there was yet no breach made, the heart and mind of man answering to the mind of God, and therefore there was no need of a Mediator to bring them together;

But when the Covenant of grace is made with man, there is a former breach between God and him, and so there is need of a third party, of a Mediator to make them one. Hence is that in Gal. 3.20. A Mediator is not a Mediator of one; whiles we are one with God, there is no need of a Mediator, no more then there is need for one to mediate between a man and himself, (this is the ordinary interpretation of that place, though it may probably bear another sense) and so it was betwixt God and man in the beginning, there was no variance then between them by sin, then God made a Covenant with man, as with his friend, as Abraham is called the friend of God, but when sin had made a breach between God and man, then strangeness and enmity followed, God is estranged from us, and we are enemies unto God, so that without a Mediator, we can never come to be united into Covenant again.

Now man fears and trembles to come before God, and God being offended, cannot be at peace, unless his Justice be satisfied; Therefore when Adam had once sinned, he feared to come into the presence of God, and hid himself, till God revealed and made known to him the Mediator of the Covenant, that the Seed of the woman should break the Serpent’s head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-bulkeley.html">Peter Bulkeley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The gospel-covenant; or The covenant of grace opened</cite>, (London: Benjamin Allen, 1646), pp 56-57.</span></figcaption>

</figure><figure class="quote" id="q-d30289b10e" data-kw="">
<blockquote><p>The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (London, 1645), 8, 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-efc3c1fb98" data-kw="">
<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … (d. 1595; Legat, 1600), bk. 1, ch. 7, pp. 25-26 trans. AI Latin</span></figcaption>

otherwise%2C+you+affirm%2C+this+privation+left+in+nature+by+sin+could+not+make+us+sinners.+Therefore%2C+we+are+not+only+bound+by+a+habitual+iniquity%2C+but+we+have+sinned+with+an+actual+will+in+Adam%3B+and+this+will+is+primarily+to+be+considered+in+original+sin%2C+without+which+we+could+neither+be+nor+be+held+as+sinners.+What+you+%5BBellarmine%5D+interpose+concerning+a+pact+or+precept+pertains+nothing+to+the+matter%3B+for+whether+Adam+received+this+justice+on+this+law+and+condition%2C+that+he+should+either+preserve+or+lose+it+for+himself+and+his+own%2C+or+whether+no+such+convention+intervened+between+God+and+Adam%2C+since+he+was+the+parent+and+origin+of+the+nature+and+of+the+human+race%2C+it+was+necessary+that+in+him+we+either+stand+or+fall.+Although%2C+that+God+threatened+him+with+death+if+he+should+move+his+hand+to+the+forbidden+tree%2C+from+this+it+sufficiently+appears+that+he+had+been+forewarned+of+the+danger+into+which+he+would+cast+himself+headlong+if+he+should+sin%2C+of+which+nothing+was+to+be+feared+if+he+should+remain+in+his+duty.+And+hither+is+wont+to+be+brought+what+we+read+in+the+prophet%3A+%E2%80%9CBut+they+like+Adam+have+transgressed+the+covenant%E2%80%9D+%28Hos.+6%3A7%29.+Nor+is+it+to+be+thought+that+Adam+was+ignorant+either+of+the+reward%2C+if+he+should+not+sin%2C+or+of+the+punishment%2C+if+he+should+dare+to+sin.+Unless+this+had+been+foretold+to+him%2C+he+would+have+had+some+excuse%2C+although+not+a+sufficient+one%3B+now%2C+having+been+taught+before+of+the+event%2C+since+he+did+not+have+faith+nor+take+care+for+himself%2C+he+is+to+be+thought+to+have+deservedly+fallen+into+this+calamity.+Although%2C+however%2C+there+had+been+no+word+on+this+matter%2C+yet+what+unhappiness+he+willingly+brings+upon+himself%2C+God+has+justly+inflicted+upon+all+his+posterity.+But+in+what+way%3F+Because+His+will+is+the+norm+of+right+and+of+justice.+You+will+never+otherwise+understand+it+to+have+been+just+that+we+are+all+born+miserable+on+account+of+the+temerity%2C+or+infidelity%2C+or+ambition%2C+or+whatever+fault+of+the+first+man.+For+that+you+say+his+will+was+ours%2C+and+we+willed+in+him%2C+I+confess+to+be+true%2C+but+the+reason+for+this+truth+is+none+other+than+the+will+of+the+creator.+For+what+cause+will+you+bring+%5Bon+your+view%5D+why+all+children+do+not+in+the+same+way+atone+for+the+faults+of+their+parents%3F+You+will+say+that+Adam+is+to+be+considered+as+the+seed+and+principle+of+nature%2C+and+his+sin+was+the+sin+of+nature+itself%3B+the+sins+of+others+are+personal%3B+therefore+his+is+transfused+with+nature%2C+not+those+of+others.+I+hear%2C+and+I+do+not+object.+But+why+Adam+by+sinning+destroyed+not+only+his+person+but+nature%2C+when+other+men+harm+their+own+persons+but+do+not+make+nature+worse%2C+assign+a+cause%2C+if+you+can%2C+other+than+the+most+just+will+of+God.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Treatise+on+Original+Sin%2C+%E2%80%A6+%28d.+1595%3B+Legat%2C+1600%29%2C+bk.+1%2C+ch.+7%2C+pp.+25-26+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc3c1fb98.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc3c1fb98.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=For%20you%20%5Ba%20Romanist%5D%20say%20that,the%20most%20just%20will%20of%20God&amp;text=For%20you%20%5Ba%20Romanist%5D%20say%20that%20that%20privation&amp;text=other%20than%20the%20most%20just%20will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>General rules are given in the New Testament for civil policy or government of commonwealth: yet no man (I think) will say that civil policy is so fully and perfectly taught in the New Testament as it was in the Old, or as religious worship is now in the New.</p></blockquote>

<blockquote><p>XXVII. Self-interest, self-Government and family-government are all antecedent to publick government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

</figure><figure class="quote" id="q-896bf0dbf5" data-kw="">
<blockquote><p>There is no community but is major [has authority] in this, that it can appoint its own tutors; and though it cannot be without all rulers [due to the inclinations of nature], yet it may well be without this or that prince and ruler, and, therefore, may resume its power, which it gave conditionally to the ruler for its own safety and good; and in so far as this condition is violated, and power turned to the destruction of the commonwealth, it is to be esteemed as not given; and though the people be not a politic judge in their own cause, yet in case of manifest oppression, nature can teach them to oppose defensive violence against offensive. A community in its politic body is also above any ruler, and may judge what is manifestly destructive to itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843) | question 17, p. 69 rt col top</span></figcaption>

</figure><figure class="quote" id="q-fa623de481" data-kw="">
<blockquote><p>2. Elections of governors would be performed as in the sight of God, and, in my weak apprehension, the person coming nearest to God’s judge, fearing God, hating covetousness, and to Moses’ king (Deut. 17), one who shall read in the book of the law; and it would seem now that gracious morals are to us instead of God’s immediate designation.

3. The genuine and intrinsical end of making kings is not simply governing, but governing the best way, in peace, honesty, and godliness (1 Tim. 2), therefore, these are to be made kings who may most expeditely procure this end. Neither is it my purpose to make him no king who is not a gracious man, only here I compare title with title.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 44</span></figcaption>

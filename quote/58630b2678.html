<main class="wrap"><figure class="quote" id="q-58630b2678" data-kw="">
<blockquote><p>Upon the Sabbath, [the 15th] when we were convened in the muir to hear sermon, they called a council of war and called the whole ministers, and told them, if they did not preach, name and sir-name, against the indulgence, they should preach none. They [the ministers] thought it very hard to be kept within guard, and to be commanded what to preach. They told them, they were to receive their commission from Jesus Christ what to preach, and not from them. When we heard of it, we came [to the council meeting] — for they never called us if we came not of ourselves. We told them that it was the height of supremacy to give instructions to ministers what to preach; we would hear no such doctrine. With this confusion this day was well spent, and when they saw us own them (the ministers) and that they could not prevail, they slipped their way; and so they went and preached, and every man went to hear him whom they liked best. At this debate there was one minister left us, and never returned again [to the camp], but was a-coming upon the Monday when we were broken; for he declared to me, when he was let out without the guard, that he thought they were set to take their lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell.</cite>, p. 466</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3801e70079" data-kw="">
<blockquote><p>Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude, verse 19 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’</cite>, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

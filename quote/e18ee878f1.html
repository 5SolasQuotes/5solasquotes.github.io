<main class="wrap"><figure class="quote" id="q-e18ee878f1" data-kw="">
<blockquote><p>…the pope… can excommunicate a ruler and thereby dissolve all obligations his subjects have to support and obey him, thus overthrowing governments at will. Thomas [of Aquinas] wrote: …if someone commits the sin of unbelief he can be deprived of his right to rule by judicial sentence, just as for other failings… Therefore, as soon as someone falls under a sentence of excommunication for apostasy from the faith, his subjects are ipso facto absolved from his rule and from the oath of fealty by which they were bound to him. (Summa Theologiae, ii-ii, Question 12, in Basic Writings of Thomas Aquinas, Anton C. Pegis, editor. New York: Random House, 1945.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robbins.html">John Robbins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Megalomania</cite>, (Trinity Foundation, 1995), pp. 130-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-7810b67d81" data-kw="">
<blockquote><p>But far be it from me to argue with Bellarmme (de poenit. bk. 3, ch. 2) from Uzziah’s bodily leprosy to infer that any prince who is spiritually leprous and turned heretical, is presently to be dethroned. Nothing can dethrone a king but such tyranny as is inconsistent with his royal office. Nor durst I infer that kings, now a-days, may be removed from actual government for one single transgression. It is true, eighty priests, and the whole kingdom, so serving king Uzziah (their motives, I know, were divine) proves well that the subjects may punish the transgression of God’s express law in the king, in some cases even to remove him from the throne;</p></blockquote>

</figure><figure class="quote" id="q-305b649448" data-kw="">
<blockquote><p>I conclude with one word: Although the Church may enjoin it on its children, not to maintain free intercourse with any private person who has been cast out of the Church, yet it cannot command subjects to revolt from their Sovereigns when excommunicated; because they are bound to continue rendering the obedience due to them by law natural, civil and divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge</cite>, Question 4, ‘There is No Temporal Power Over Kings in Order to their Spiritual Benefit’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2, p. 240</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-661b9790a3" data-kw="">
<blockquote><p>4. We may add this consideration, that hitherto toleration of errors and diversity of corrupt opinions have ever been looked upon, and made use of, as a most subtle means for undermining and destroying of the Church. It is marked of that skillful enemy of the Kingdom of Jesus Christ, Julian [A.D. 331-363], that having improven his subtilty to the utmost to find out means to destroy the Church by craft, which his predecessors by violence could not obtain, amongst other means he concluded this: Not to raise open persecution but to give liberty to all the differing bishops and teachers (which then, after the Council of Nicea and Constantine’s death, were very many and bitter in their differences) to follow their own way, and to vent their own opinions without all fear of any restraint: and therefore did call them that he might make intimation thereof to them for their further encouragement therein; The words which he used to them, as they are marked by Ammianus and cited by Lodovicus Molineus (p. 560) are: Ut consopitis civilibus discordiis, suae quisque Religioni serviret intrepidus, that is, in sum, That everyone forbearing civil discords, should worship in his own religion without control or fear: And is it like, that this shall prove a mean useful for the good of the Church, which that expert child of the devil did make use of to destroy the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (1659), pt. 3, ch. 13, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

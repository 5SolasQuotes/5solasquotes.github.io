<main class="wrap"><figure class="quote" id="q-542d0dd86b" data-kw="">
<blockquote><p>As God is pleased to enter into Covenant with his people, so is he first in the Covenant. God requires no man to bind himself by Covenant to Him, till the Lord first strike a Covenant with his Soul. As we love him, because he loved us first; so we enter into Covenant with him, because he first entereth into Covenant with us. I will be their God, he is first bound, and seals first; and then, and not till then, it follows; they shall be my people. This is the constant tenor of the Covenant. And shall he begin, and we think much to follow?

Can there be a marriage consummated where only the man is first married to the woman, and the woman will not after, for her part, be married to the man? Now, God no way so much declares his willingness to be in Covenant, and to be first in it, as by deliverances … great reason therefore, men should then second him by mutual stipulation. It is an hard case, when men will not follow, where God leads.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The first sermon, preached to the Honourable House of Commons now assembled in Parliament at their publique fast. Novemb. 17. 1640</cite>, (London: Philemon Stephens and Christopher Meredith, 1641), pp 32-33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cef707d457" data-kw="">
<blockquote><p>The Lutherans, on the other side, insist on two arguments to prove, that not a twofold administration of the same covenant, but that two covenants substantially distinct, are intended in this discourse of the apostle.

1. Because in the Scripture they are often so called, and compared with one another, and sometimes opposed unto one another; the first and the last, the new and the old.

2. Because the covenant of grace in Christ is eternal, immutable, always the same, obnoxious unto no alteration, no change or abrogation; neither can these things be spoken of it with respect unto any administration of it, as they are spoken of the old covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 89</span></figcaption>

<blockquote><p>THE NATURE OF GOD. John 17.3. This is life eternal, that they might know thee, the only true God.

Princ. It is life eternal, to know the only true God. God is a Spiritual Being, infinite in all Perfections. A Spiritual Being; and so without Body, Parts, or Passions. Infinite; and so without Cause, without defect, and without limit. In all Perfections; so remove all imperfection from anything, and you see God. And conceive a Spiritual Being, abounding with all Perfections, and that is God.</p></blockquote>

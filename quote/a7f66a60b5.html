<main class="wrap"><figure class="quote" id="q-a7f66a60b5" data-kw="">
<blockquote><p>We, all and every one of us underwritten, protest, that after long and due examination of our own consciences in matters of true and false religion, are now thoroughly resolved in the truth, by the Word and Spirit of God. And, therefore, we believe with our hearts, confess with our mouths, subscribe with our hands, and constantly affirm, before God and the whole world, that this only is the true Christian faith and religion, pleasing God and bringing salvation to man, which is now, by the mercy of God, revealed to the world by the preaching of the blessed Evangel, and is received, believed, and defended by many and sundry notable kirks and realms, but chiefely by the Kirk of Scotland, the king’s Majesty, and three Estates of this realm, as God’s eternal truth, and only ground of our salvation; as more particularly is expressed in the confession of our faith, stablished, and publicly confirmed, by sundry acts of Parliaments and now, of a long time has been openly professed by the king’s Majesty, and whole body of his realm, both in burgh and land. To the which Confession and form of religion we willingly agree in our consciences, in all points, as unto God’s undoubted truth and verity, grounded only upon his written Word. And, therefore, we abhor and detest all contrary religion and doctrine, but chiefly, all kind of Papistry, in general and particular heads, even as they are now damned and confuted by the Word of God, and Kirk of Scotland… We, therefore, willing to take away all suspicion of hypocrisy, and of such double dealing with God and his Kirk, protest, and call the Searcher of all hearts to witness, that our minds and hearts do fully agree with this our confession, promise, oath, and subscription, so that we are not moved for any worldly respect, but are persuaded only in our consciences, through the knowledge and love of God’s true religion, printed in our hearts by the Holy Spirit, as we shall answer to Him in the day when the secrets of all hearts shall be disclosed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Kirk of Scotland</cite>, vol. 3, pp. 501-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d757378e08" data-kw="">
<blockquote><p>The Shorter Catechism agreed upon by the Assembly of divines at Westminster, and presented to the honorable Houses of Parliament then sitting, and by them ordered to be printed and published, but no man enjoined to use it, or punishable if he made use of any other to instruct his people in. This little book for the comprehensiveness of it, as also exactness of order and expression, has (as it deserves) a great esteem with many learned men, notwithstanding to be the one and only book for all capacities that are to be instructed in principles throughout the nation, is a perfection not to be expected from any common gift, nor is this for such purpose the fittest in its kind, as we shall endeavor to show in this dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light</cite>, Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662., pp. 10-11</span></figcaption>

;text=we%20shall%20endeavor%20to%20show%20in%20this%20dispute" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8e6b20902e" data-kw="Creeds below Scripture">
<blockquote><p>The authority of confessions ought indeed to be great with the pious in the churches, but still sinking below the authority of the Scripture. For the latter is a rule, they the thing ruled. It alone is self-credible (autopistos) with respect to words as well as to things, divine and infallible; they, as divine in things, still in words and manner of treatment are human writings. Faith is immediately and absolutely due to it; to them an examination is due and that having been made, if they agree with the word, faith. It is the constant and immutable canon of faith; while they are subject to revision and new examination, in which it is right not only to explain and amplify them, but also to correct whatever fault should be found in them and reform according to the rule of the word. Hence it is evident that they err here in excess who hold such confessions as the rule of the truth itself and make them equal to the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.9</span></figcaption>

</figure><figure class="quote" id="q-67509949cf" data-kw="Councils under Scripture">
<blockquote><p>The weightiest controversies have been determined and settled in councils, but not by the absolute authority of the council itself, but by the judgment and authority of scripture in the council. Pious bishops never assembled to define a point themselves by their own authority, but by that of scripture. Therefore all religious councils have ascribed the supreme decision to the scriptures. … Since, then, councils, whenever they are good and pious, follow the scriptures, it is manifest that the supreme authority of judging belongs to the scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-34987f8b75" data-kw="">
<blockquote><p>6. It is also false and absurd which they [Separatists] say touching the authority of the classis [presbytery], that it is such ‘as does not become any except the apostles, that could not err, to have.’ But it is the less marvel that these men do speak on this manner when as they see Mr. [John] Davenport himself going before them and using a much-like-speech in his letter to the classis touching his consent required to the writing of the five ministers, namely that: ‘such a subjection is greater than may be yielded unto any council, whether of classis or synods, etc. that thereby the writings and decrees of men are made infallible, and equal with the Word of God, which is intolerable.’ But what wise man is there that sees not the strange folly and vanity of such assertions as these? Is no truth uttered or described by men in our times, whereunto the consent of men may be required, because there be now no apostles? Do not all Reformed Churches at this day require a subscription unto their confessions of faith in the several articles thereof? Do they hereby make their writings of equal authority with the Word of God, and themselves equal to the apostles that could not err? It is far from them. Neither Mr. Davenport, nor these complainants, shall ever be able to justify these slanderous complaints. Nay, if this were true, how could Mr. Davenport subscribe his name unto his own writing sent unto the classis, to show his consent unto it? Did he thereby make himself an apostle or his writing equal with the Word of God? Why may we not show our consent and subscribe to other writings of men upon persuasion of the truth so appearing unto us, as well as he subscribed to his own? They are so far from proving these assertions that they offer not to go about it; we acknowledge there is no judicatory on earth, either civil or ecclesiastical, either of consistory, classis or synod, but they are subject to error: when that error is showed by the Word of God, it ought to be corrected. This also is their practice, one synod often reforming that which has been decreed by another. Yet does not this take away their authority for the judgment and deciding of controversies. For by such reasoning they might take away all government and bring in confusion. By these and such-like injurious speeches they do exceedingly gratify many sorts of Libertines, Arians, Socinians and other heretics which do therefore so much abhor the subscriptions required in the Churches of God because they serve for detection and discovery of their errors. But as the preaching of the Word is not therefore to be condemned, because some preach error, so are not subscriptions and that consent which is required to many truths therefore to be rejected, though some do unjustly urge subscription unto errors.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. It is also false and absurd which they [Separatists] say touching the authority of the classis [presbytery], that it is such ‘as does not become any except the apostles, that could not err, to have.’ But it is the less marvel that these men do speak on this manner when as they see Mr. [John] Davenport himself going before them and using a much-like-speech in his letter to the classis touching his consent required to the writing of the five ministers, namely that: ‘such a subjection is greater than may be yielded unto any council, whether of classis or synods, etc. that thereby the writings and decrees of men are made infallible, and equal with the Word of God, which is intolerable.’ But what wise man is there that sees not the strange folly and vanity of such assertions as these? Is no truth uttered or described by men in our times, whereunto the consent of men may be required, because there be now no apostles? Do not all Reformed Churches at this day require a subscription unto their confessions of faith in the several articles thereof? Do they hereby make their writings of equal authority with the Word of God, and themselves equal to the apostles that could not err? It is far from them. Neither Mr. Davenport, nor these complainants, shall ever be able to justify these slanderous complaints. Nay, if this were true, how could Mr. Davenport subscribe his name unto his own writing sent unto the classis, to show his consent unto it? Did he thereby make himself an apostle or his writing equal with the Word of God? Why may we not show our consent and subscribe to other writings of men upon persuasion of the truth so appearing unto us, as well as he subscribed to his own? They are so far from proving these assertions that they offer not to go about it; we acknowledge there is no judicatory on earth, either civil or ecclesiastical, either of consistory, classis or synod, but they are subject to error: when that error is showed by the Word of God, it ought to be corrected. This also is their practice, one synod often reforming that which has been decreed by another. Yet does not this take away their authority for the judgment and deciding of controversies. For by such reasoning they might take away all government and bring in confusion. By these and such-like injurious speeches they do exceedingly gratify many sorts of Libertines, Arians, Socinians and other heretics which do therefore so much abhor the subscriptions required in the Churches of God because they serve for detection and discovery of their errors. But as the preaching of the Word is not therefore to be condemned, because some preach error, so are not subscriptions and that consent which is required to many truths therefore to be rejected, though some do unjustly urge subscription unto errors.”

— John Paget, An Answer to the Unjust Complaints of William Best… (Amsterdam, 1635), pp. 88-90">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+It+is+also+false+and+absurd+which+they+%5BSeparatists%5D+say+touching+the+authority+of+the+classis+%5Bpresbytery%5D%2C+that+it+is+such+%E2%80%98as+does+not+become+any+except+the+apostles%2C+that+could+not+err%2C+to+have.%E2%80%99+But+it+is+the+less+marvel+that+these+men+do+speak+on+this+manner+when+as+they+see+Mr.+%5BJohn%5D+Davenport+himself+going+before+them+and+using+a+much-like-speech+in+his+letter+to+the+classis+touching+his+consent+required+to+the+writing+of+the+five+ministers%2C+namely+that%3A+%E2%80%98such+a+subjection+is+greater+than+may+be+yielded+unto+any+council%2C+whether+of+classis+or+synods%2C+etc.+that+thereby+the+writings+and+decrees+of+men+are+made+infallible%2C+and+equal+with+the+Word+of+God%2C+which+is+intolerable.%E2%80%99+But+what+wise+man+is+there+that+sees+not+the+strange+folly+and+vanity+of+such+assertions+as+these%3F+Is+no+truth+uttered+or+described+by+men+in+our+times%2C+whereunto+the+consent+of+men+may+be+required%2C+because+there+be+now+no+apostles%3F+Do+not+all+Reformed+Churches+at+this+day+require+a+subscription+unto+their+confessions+of+faith+in+the+several+articles+thereof%3F+Do+they+hereby+make+their+writings+of+equal+authority+with+the+Word+of+God%2C+and+themselves+equal+to+the+apostles+that+could+not+err%3F+It+is+far+from+them.+Neither+Mr.+Davenport%2C+nor+these+complainants%2C+shall+ever+be+able+to+justify+these+slanderous+complaints.+Nay%2C+if+this+were+true%2C+how+could+Mr.+Davenport+subscribe+his+name+unto+his+own+writing+sent+unto+the+classis%2C+to+show+his+consent+unto+it%3F+Did+he+thereby+make+himself+an+apostle+or+his+writing+equal+with+the+Word+of+God%3F+Why+may+we+not+show+our+consent+and+subscribe+to+other+writings+of+men+upon+persuasion+of+the+truth+so+appearing+unto+us%2C+as+well+as+he+subscribed+to+his+own%3F+They+are+so+far+from+proving+these+a

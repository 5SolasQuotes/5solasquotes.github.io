<blockquote><p>VI. No more can the rite of the sacrament of confirmation than the name be shown from the Scriptures. The apostles indeed employed the imposition of hands (cheirothesian, Acts 8:17; 19:6), but since it is evident that that was done in a visible dispensation of the Holy Spirit in the nascent condition of the church and indeed from a special promise, it is clear that it was an extraordinary rite and for this reason only temporary (whose end ceased together with other miracles). That the sacerdotal chrism and anointing were altogether different from the apostolic laying on of hands (cheirothesia) and that this [chrism/anointing] referred to the bestowal of the extraordinary gifts of the Spirit is not obscurely gathered…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-061cbb5771" data-kw="">
<blockquote><p>Question 1. If so much knowledge will save a man as helps him to love God as God, may not heathens or infidels at least be saved? For they know that there is one God who is infinitely good and perfect, and more amiable than all the world, and the great benefactor of man, and of the whole creation: So that there is no goodness but what is in Him, or from Him, and through Him, and finally to Him: And man’s will is made to love apprehended good, and follows the last practical act of the intellect, at least where there is no competitor, but omnimoda ratio boni. And all men know that God is not only best in Himself, but good, yea best to them, because that all they have is from Him: and they have daily experience of pardoning grace contrary to their commerit. It seems therefore that they may love God as God. Answer: 1. To cause a man to love God as God, there is necessary both objective revelation of God’s amiableness, and such subjective grace which consists in a right disposition of the soul. 2. Objective revelation is considered as sufficient either to well disposed, or to an ill disposed soul. 3. This right disposition consists both in the abatement of men’s inclinations to contrary (sensual) objects, and in the inclining them to that which is divine and spiritual. And now I answer: 1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not. 2. Therefore to such the impossibility is not physical, but moral. 3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.) 4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations. 5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.) 6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Knowledge &amp; Love… (London: Parkhurst, 1689), pt. 2, ch. 14</cite>, pp. 265-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>The end of [external] calling can be considered in two ways: either on the part of God or on the part of the thing (which is called the end of the worker [finis operantis] and the end of the work [finis operis]). Although each is conjoined in the elect, yet in others they are separated… in the gospel call, the end of the thing is the salvation of man because by its nature it tends to the bringing of him to salvation by faith and repentance; but not at once with respect to all the called is it the end of God, but only of those to whom he decreed to give faith and salvation.</p></blockquote>

<blockquote><p>24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments. 26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. … 29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Sr. Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments. 26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. … 29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.”

— Sr. Friedrich Spanheim, Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C24.+Applicatory+works+of+grace+are+either+external+or+internal.+25.+External+ones+are+both+calling+through+the+Word%2C+partly+of+Law%2C+partly+of+gospel%2C+and+the+sealing+of+those+called+through+sacraments.+26.+Calling+through+Law+is+prior%2C+and+that+partly+imperative+of+obedience%2C+partly+declarative+of+sanction%2C+both+promissory+and+comminatory.+%E2%80%A6+29.+Calling+through+nature+to+God+the+Creator+is+broader%3B+calling+through+the+Word+to+God+the+redeemer+is+stricter.+30.+Universal+calling+to+salvation+neither+was%2C+nor+is%2C+nor+will+be.+31.+That+hope+of+special+mercy+is+shown+in+nature%2C+or+that+this+is+the+instrument+of+gospel-calling%2C+is+false%2C+nor+can+this+be+said+without+nature+being+established+as+a+herald+of+grace.%E2%80%9D%0A%0A%E2%80%94+Sr.+Friedrich+Spanheim%2C+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+%E2%80%98Miscellaneous+Theological+Disputation%E2%80%99%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F45d4a14433.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/45d4a14433.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/general-revelation#:~:text=24.%20Applicatory%20works%20of%20grace%20are,established%20as%20a%20herald%20of%20grace&amp;text=24.%20Applicatory%20works%20of%20grace%20are%20either%20external&amp;text=nature%20being%20established%20as%20a%20herald%20of%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

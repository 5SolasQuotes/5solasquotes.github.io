<blockquote><p>In the eighth century, Carolingian theologians at the Abbey of Corbie [France], Paschasius Radbertus (ca. 790-ca. 860) and Ratramnus (d. ca. 868) each wrote treatises on the Lord’s Supper. Both were titled ‘On the Body and Blood of the Lord’. They first debated what is ‘true’ and what is a ‘figure’ in the Lord’s Supper. Radbertus argued that the sign becomes the thing signified. In response, Ratramnus argued that if the sign becomes the thing signified, then we have no sacrament since Christ is received by faith, not sight; we would have no need of faith. If we have no faith, we have no Christ and no salvation. In the early sixteenth century, that debate was renewed by the Reformed and Lutheran theologians, with Lutherans republishing Radbertus and the Reformed, Ratramnus.” – ‘Foreward’, p. ix in Theodore Beza, A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016) Some other 9th century theologians who denied that Christ’s body and blood were materially eaten in the Eucharist during the Carolingian Eucharistic Controversy were: Gottschalk of Orbais, Alcuin of York &amp; Florus Magister. The same men were involved in a controversy over predestination. Generally speaking, the Carolingian theologians had a high view of predestination and took a spiritual view of the Lord’s Supper. Ratramnus took the central role in the Eucharistic controversy; Gottschalk took the central role in the predestinarian controversy. . . Post-Reformation Anthology of Heppe, Heinrich – ch. 26, ‘The Lord’s Supper’ in Reformed Dogmatics ed. Ernst Bizer, tr. G.T. Thomson (1861; Wipf &amp; Stock, 2007), pp. 627-57 Heppe (1820–1879) was a German reformed theologian. . . 1500’s Works Melanchthon, Philip ch. 27. ‘On Participation in the Table of the Lord’ in The Loci Communes of Philip Melanchthon… tr. Charles L. Hill (1521; Boston: Meador Publishing, 1944), pp. 258-60 Though Melanchthon (1497–1560) was a Lutheran, this work of his was the first ‘systematic theology’ of the Reformation, and, as it was very influential on reformed systematic theologies following shortly thereafter. Article 10, Of the Holy Supper in The Apology of the Augsburg Confession tr: F. Bente &amp; W. H. T. Dau (1531) ch. 22. ‘Of the Supper of Christ the Lord’ in Melanchthon on Christian Doctrine, Loci Communes, 1555 tr. Clyde L. Manschreck (1555; NY: Oxford Univ. Press, 1965), pp. 217-23 Zwingli, Ulrich – ‘The Eucharist’ in Commentary on True &amp; False Religion eds. Jackson &amp; Heller (1525; Labyrinth Press, 1981), pp. 198-253 Bucer, Martin – ‘On the Eucharist, and first the defense of Mr. Luther, then of those [the Reformed] whom the adversary makes out to be Berengarians’ in A Defense against the Catholic Principle… tr. Michael McFadden (Strasbourg, Rihel, 1536), pp. 41-62 Calvin, John ch. 29. ‘The Supper of the Lord’ in Instruction in Faith (1537) tr. Paul T. Fuhrman (Philadelphia: Westminster Press, 1949), pp. 70-72 Short Treatise on the Lord’s Supper (1541) in Tracts 2.163-198 Martin Klauber: “Joachim Westphal (1510-1574) represented the so-called true or Gnesio-Lutheran movement that attempted to preserve the purity of Luther’s thought against the alleged compromises of the Philippists, those who followed the lead of Philip Melancthon. As the superintendent of the state church in Hamburg, Westphal was well positioned to enter the fray of theological disputes… For the Gnesio-Lutherans the issue of Christ’s physical presence in the Lord’s Supper was of paramount importance. The formula borrowed from Luther was that the body and blood of Christ are truly and substantially present ‘in, with and under’ the consecrated elements. Those who partake, believers and unbelievers alike, receive the true body and blood of Christ Himself… This so called [sacramental] union is often referred to as ‘consubstantiation’, although Luther did not use the term… Calvin[‘s]… view [was] that although Christ is not present physically in the bread and in the wine, He is present spiritually. The sacrament would not, therefore, be an empty sign. Calvin followed Augustine closely… If, as the Lutherans believed, Christ is physically present… both believers and unbelievers who participate in the Eucharist partake of the body and blood of Christ… Calvin argued, by contrast, that only believers truly partake of the body and blood of the Lord. He posited this position in the Institutes as well as in his Petit traicte de la saincte cene (1541).” – ‘Introduction’ in Beza, Clear &amp; Simple Treatise on the Lord’s Supper A Treatise on the Sacraments of Baptism &amp; the Lord’s Supper (Edinburgh, 1837) 190 pp. no ToC 12. ‘Of the Lord’s Supper’ in Institutes of the Christian Religion: 1541 French Edition tr. Elsie A. McKee (1541; Eerdmans, 2009), pp. 546-84 ‘On [2] Excommunication, [3-4]Separation, the Lord’s Supper &amp; [5] Pastors’ in A Short Instruction for to Arm All Good Christian People against the Pestiferous Errors of the Common Sect of Anabaptists (London: Daye, 1549), no page numbers ‘Mutual Consent in Regard to the Sacraments Between the Ministers of the Church of Zurich &amp; John Calvin’ (1554) in Tracts 2:199-244 Defense of the Sound &amp; Orthodox Doctrine of the Sacraments (1555) Klauber: “Seizing on the publication of the Consensus [Tigurinus of Zurich and Geneva, 1549], Westphal began to criticize it publicly, which initiated the so-called second sacramental war between the Lutherans and the Reformed… Westphal initially composed three treatises [in 1552, 1553 &amp; 1555] critical of the Consensus… Westphal spared no words in his attack on his ‘godless’ opponents and their ‘satanic blasphemies.’… Calvin did not become aware of Westphal’s criticism until 1554, when Bullinger brought it to his attention. He was otherwise occupied with a host of issues including the Servetus affair, but he told Bullinger that he would respond. He did so in 1555, although he believed that Westphal’s Farrago was a ‘light-weight book’ and not worthy of a personal response… But Calvin decided to take the matter upon himself in his Defense of the Sound and Orthodox Doctrine of the Sacraments… and the literary war was on… He did not mention Westphal by name, hoping for peace with the Lutherans, especially since he had garnered Melanchthon’s support.” – Ibid. ‘Second Defense of the Sacraments in Answer to the Calumnies of Joachim Westphal’ (1556) in Tracts 2:245-345 Klauber: “Westphal responded [to Calvin’s Defense of the Sound and Orthodox Doctrine of the Sacraments, 1555] with his Just Defense Against the False Accusations of a Certain Sacramentarian… Calvin responded in 1556 with his Second Defense… This work was much more vituperative and personal than the first, and Calvin denied that he had made the sacrament an empty sign, saying that he was in agreement with the [Lutheran] Augsburg Confession [Article X, 1530]. Although he asserted his admiration of Zwingli, Calvin made it clear that there were significant distinctions between their views of Christ’s presence in the Lord’s Supper.” – Ibid. Last Admonition to Joachim Westphal (1557) in Tracts 2:346 Klauber: “Westphal in turn responded [to Calvin’s Second Defense…] in 1557 with his Confession of Faith on the Sacrament of the Eucharist… Calvin then answered in 1557 with The Last Admonition of John Calvin to Joachim Westphal Who if He Heeds It Not Must Henceforth Be Treated in the Way Which Paul Prescribed for Obstinate Heretics… Any real attempt at accord was lost when Calvin accused Westphal of stupidity and impudence. It would have to be left to Calvin’s colleagues, such as Beza, to attempt to repair the rupture. In true form Westphal responded in 1558 with two works, including his Defense of the Lord’s Supper against the Errors and Calumnies of John Calvin. This is a lengthy volume covering a host of topics including infant baptism, private absolution, and festival days, but the Eucharist figures by far the most prominently…</p></blockquote>

1861%3B+Wipf+%26+Stock%2C+2007%29%2C+pp.+627-57+Heppe+%281820%E2%80%931879%29+was+a+German+reformed+theologian.+.+.+1500%E2%80%99s+Works+Melanchthon%2C+Philip+ch.+27.+%E2%80%98On+Participation+in+the+Table+of+the+Lord%E2%80%99+in+The+Loci+Communes+of+Philip+Melanchthon%E2%80%A6+tr.+Charles+L.+Hill+%281521%3B+Boston%3A+Meador+Publishing%2C+1944%29%2C+pp.+258-60+Though+Melanchthon+%281497%E2%80%931560%29+was+a+Lutheran%2C+this+work+of+his+was+the+first+%E2%80%98systematic+theology%E2%80%99+of+the+Reformation%2C+and%2C+as+it+was+very+influential+on+reformed+systematic+theologies+following+shortly+thereafter.+Article+10%2C+Of+the+Holy+Supper+in+The+Apology+of+the+Augsburg+Confession+tr%3A+F.+Bente+%26+W.+H.+T.+Dau+%281531%29+ch.+22.+%E2%80%98Of+the+Supper+of+Christ+the+Lord%E2%80%99+in+Melanchthon+on+Christian+Doctrine%2C+Loci+Communes%2C+1555+tr.+Clyde+L.+Manschreck+%281555%3B+NY%3A+Oxford+Univ.+Press%2C+1965%29%2C+pp.+217-23+Zwingli%2C+Ulrich+%E2%80%93+%E2%80%98The+Eucharist%E2%80%99+in+Commentary+on+True+%26+False+Religion+eds.+Jackson+%26+Heller+%281525%3B+Labyrinth+Press%2C+1981%29%2C+pp.+198-253+Bucer%2C+Martin+%E2%80%93+%E2%80%98On+the+Eucharist%2C+and+first+the+defense+of+Mr.+Luther%2C+then+of+those+%5Bthe+Reformed%5D+whom+the+adversary+makes+out+to+be+Berengarians%E2%80%99+in+A+Defense+against+the+Catholic+Principle%E2%80%A6+tr.+Michael+McFadden+%28Strasbourg%2C+Rihel%2C+1536%29%2C+pp.+41-62+Calvin%2C+John+ch.+29.+%E2%80%98The+Supper+of+the+Lord%E2%80%99+in+Instruction+in+Faith+%281537%29+tr.+Paul+T.+Fuhrman+%28Philadelphia%3A+Westminster+Press%2C+1949%29%2C+pp.+70-72+Short+Treatise+on+the+Lord%E2%80%99s+Supper+%281541%29+in+Tracts+2.163-198+Martin+Klauber%3A+%E2%80%9CJoachim+Westphal+%281510-1574%29+represented+the+so-called+true+or+Gnesio-Lutheran+movement+that+attempted+to+preserve+the+purity+of+Luther%E2%80%99s+thought+against+the+alleged+compromises+of+the+Philippists%2C+those+who+followed+the+lead+of+Philip+Melancthon.+As+the+superintendent+of+the+state+church+in+Hamburg%2C+Westphal+was+well+positioned+to+enter+the+fray+of+theological+disputes%E2%80%A6+For+the+Gnesio-Lutherans+the+issue+of+Christ%E2%80%99s+physical+presence+in+the+Lord%E2%80%99s+Supper+was+of+paramount+importance.+The+formula+borrowed+from+Luther+was+that+the+body+and+blood+of+Christ+are+truly+and+substantially+present+%E2%80%98in%2C+with+and+under%E2%80%99+the+consecrated+elements.+Those+who+partake%2C+believers+and+unbelievers+alike%2C+receive+the+true+body+and+blood+of+Christ+Himself%E2%80%A6+This+so+called+%5Bsacramental%5D+union+is+often+referred+to+as+%E2%80%98consubstantiation%E2%80%99%2C+although+Luther+did+not+use+the+term%E2%80%A6+Calvin%5B%E2%80%98s%5D%E2%80%A6+view+%5Bwas%5D+that+although+Christ+is+not+present+physically+in+the+bread+and+in+the+wine%2C+He+is+present+spiritually.+The+sacrament+would+not%2C+therefore%2C+be+an+empty+sign.+Calvin+followed+Augustine+closely%E2%80%A6+If%2C+as+the+Lutherans+believed%2C+Christ+is+physically+present%E2%80%A6+both+believers+and+unbelievers+who+participate+in+the+Eucharist+partake+of+the+body+and+blood+of+Christ%E2%80%A6+Calvin+argued%2C+by+contrast%2C+that+only+believers+truly+partake+of+the+body+and+blood+of+the+Lord.+He+posited+this+position+in+the+Institutes+as+well+as+in+his+Petit+traicte+de+la+saincte+cene+%281541%29.%E2%80%9D+%E2%80%93+%E2%80%98Introduction%E2%80%99+in+Beza%2C+Clear+%26+Simple+Treatise+on+the+Lord%E2%80%99s+Supper+A+Treatise+on+the+Sacraments+of+Baptism+%26+the+Lord%E2%80%99s+Supper+%28Edinburgh%2C+1837%29+190+pp.+no+ToC+12.+%E2%80%98Of+the+Lord%E2%80%99s+Supper%E2%80%99+in+Institutes+of+the+Christian+Religion%3A+1541+French+Edition+tr.+Elsie+A.+McKee+%281541%3B+Eerdmans%2C+2009%29%2C+pp.+546-84+%E2%80%98On+%5B2%5D+Excommunication%2C+%5B3-4%5DSeparation%2C+the+Lord%E2%80%99s+Supper+%26+%5B5%5D+Pastors%E2%80%99+in+A+Short+Instruction+for+to+Arm+All+Good+Christian+People+against+the+Pestiferous+Errors+of+the+Common+Sect+of+Anabaptists+%28London%3A+Daye%2C+1549%29%2C+no+page+numbers+%E2%80%98Mutual+Consent+in+Regard+to+the+Sacraments+Between+the+Ministers+of+the+Church+of+Zurich+%26+John+Calvin%E2%80%99+%281554%29+in+Tracts+2%3A199-244+Defense+of+the+Sound+%26+Orthodox+Doctrine+of+the+Sacraments+%281555%29+Klauber%3A+%E2%80%9CSeizing+on+the+publication+of+the+Consensus+%5BTigurinus+of+Zurich+and+Geneva%2C+1549%5D%2C+Westphal+began+to+criticize+it+publicly%2C+which+initiated+the+so-called+second+sacramental+war+between+the+Lutherans+and+the+Reformed%E2%80%A6+Westphal+initially+composed+three+treatises+%5Bin+1552%2C+1553+%26+1555%5D+critical+of+the+Consensus%E2%80%A6+Westphal+spared+no+words+in+his+attack+on+his+%E2%80%98godless%E2%80%99+opponents+and+their+%E2%80%98satanic+blasphemies.%E2%80%99%E2%80%A6+Calvin+did+not+become+aware+of+Westphal%E2%80%99s+criticism+until+1554%2C+when+Bullinger+brought+it+to+his+attention.+He+was+otherwise+occupied+with+a+host+of+issues+including+the+Servetus+affair%2C+but+he+told+Bullinger+that+he+would+respond.+He+did+so+in+1555%2C+although+he+believed+that+Westphal%E2%80%99s+Farrago+was+a+%E2%80%98light-weight+book%E2%80%99+and+not+worthy+of+a+personal+response%E2%80%A6+But+Calvin+decided+to+take+the+matter+upon+himself+in+his+Defense+of+the+Sound+and+Orthodox+Doctrine+of+the+Sacraments%E2%80%A6+and+the+literary+war+was+on%E2%80%A6+He+did+not+mention+Westphal+by+name%2C+hoping+for+peace+with+the+Lutherans%2C+especially+since+he+had+garnered+Melanchthon%E2%80%99s+support.%E2%80%9D+%E2%80%93+Ibid.+%E2%80%98Second+Defense+of+the+Sacraments+in+Answer+to+the+Calumnies+of+Joachim+Westphal%E2%80%99+%281556%29+in+Tracts+2%3A245-345+Klauber%3A+%E2%80%9CWestphal+responded+%5Bto+Calvin%E2%80%99s+Defense+of+the+Sound+and+Orthodox+Doctrine+of+the+Sacraments%2C+1555%5D+with+his+Just+Defense+Against+the+False+Accusations+of+a+Certain+Sacramentarian%E2%80%A6+Calvin+responded+in+1556+with+his+Second+Defense%E2%80%A6+This+work+was+much+more+vituperative+and+personal+than+the+first%2C+and+Calvin+denied+that+he+had+made+the+sacrament+an+empty+sign%2C+saying+that+he+was+in+agreement+with+the+%5BLutheran%5D+Augsburg+Confession+%5BArticle+X%2C+1530%5D.+Although+he+asserted+his+admiration+of+Zwingli%2C+Calvin+made+it+clear+that+there+were+significant+distinctions+between+their+views+of+Christ%E2%80%99s+presence+in+the+Lord%E2%80%99s+Supper.%E2%80%9D+%E2%80%93+Ibid.+Last+Admonition+to+Joachim+Westphal+%281557%29+in+Tracts+2%3A346+Klauber%3A+%E2%80%9CWestphal+in+turn+responded+%5Bto+Calvin%E2%80%99s+Second+Defense%E2%80%A6%5D+in+1557+with+his+Confession+of+Faith+on+the+Sacrament+of+the+Eucharist%E2%80%A6+Calvin+then+answered+in+1557+with+The+Last+Admonition+of+John+Calvin+to+Joachim+Westphal+Who+if+He+Heeds+It+Not+Must+Henceforth+Be+Treated+in+the+Way+Which+Paul+Prescribed+for+Obstinate+Heretics%E2%80%A6+Any+real+attempt+at+accord+was+lost+when+Calvin+accused+Westphal+of+stupidity+and+impudence.+It+would+have+to+be+left+to+Calvin%E2%80%99s+colleagues%2C+such+as+Beza%2C+to+attempt+to+repair+the+rupture.+In+true+form+Westphal+responded+in+1558+with+two+works%2C+including+his+Defense+of+the+Lord%E2%80%99s+Supper+against+the+Errors+and+Calumnies+of+John+Calvin.+This+is+a+lengthy+volume+covering+a+host+of+topics+including+infant+baptism%2C+private+absolution%2C+and+festival+days%2C+but+the+Eucharist+figures+by+far+the+most+prominently%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Ratramnus%2C+The+Book+of+Bertram+the+Priest%3A+Concerning+the+Body+and+Blood+of+Christ+in+the+Sacrament+%E2%80%A0+c.+868+96+pp.+%7C+Dr.+R.+Scott+Clark%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa633cd4f23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a633cd4f23.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=In%20the%20eighth%20century%2C%20Carolingian%20theologians,figures%20by%20far%20the%20most%20prominently&amp;text=In%20the%20eighth%20century%2C%20Carolingian%20theologians%20at%20the&amp;text=the%20Eucharist%20figures%20by%20far%20the%20most%20prominently" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cfff28fb4f" data-kw="">
<blockquote><p>The truth is, we cannot lawfully be either praying or praising in the very act of receiving because our hearts and minds should then be exercised in meditating upon Christ’s death and the inestimable benefits which comes to us thereby, 1 Cor. 11:24, ‘Do this in remembrance of Me.’ This remembrance is described, v. 26, ‘Ye do show the Lord’s death.’ Now one of the special ways whereby we remember Christ and so do show forth his death is by private meditation upon his death, as Pareus resolves (Commentary on 1 cor. 11:26). This meditation is a speech of the soul to itself: and though it may stand with short ejaculations, which may and should have place in all our actions, yet can it not stand with an ordinary and continued prayer purposely conceived, as Bishop Lindsey would maintain [who advocated for prayer to God while kneeling to receive the elements]. For how can we orderly both speak to God by prayer and to ourselves by meditation at one instant of time? If therefore prayer be purposely and orderly conceived, it banishes away meditation, which should be the souls exercise in the receiving of the sacrament. And by the contrary, if meditation be entertained, as it should be, it admits not prayer to have place at that time. For it is well said that Dum auribus, oculis, manibus, dentibus exterius; auribus, oculis, manibus, dentibus fidei interius occupamur, orationem continuam et durabilem, absque mentis diragatione ab opere praecepto et imperato, instruere non possumus. (Calderwood, Altar of Damascus, p. 803)</p></blockquote>

<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>

<blockquote><p>VII. Sixth [Rule], ‘some precepts are affirmative’ (ordering things to be done, sins of omission); ‘others negative’ (prohibiting things to be avoided, sins of commission). ‘The former bind always, but not to always, the latter bind always to always.’ The virtues and duties commanded by the affirmative precepts cannot be exercised every moment together at once, and suppose certain conditions (which being absent, there is no place for them); for example, parents are not always alive or near us, so that we can render them their due respect. But the vices and crimes prohibited can be committed lawfully in no article of time. Here, however, we must make an exception of the general affirmative command to love God (which obliges always and to always) because there is no time or place or state in which man can be exempted from the duty of loving God. … XII. Fourth [Rule of Obedience], as the precepts do not have an equal degree of importance and necessity, so neither is the obedience to be reckoned of the same order and value… The omission of a command is one thing; opposition to it another; forgetfulness, neglect and contempt are different. Neglect proceeds from the langor of slothfulness…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“VII. Sixth [Rule], ‘some precepts are affirmative’ (ordering things to be done, sins of omission); ‘others negative’ (prohibiting things to be avoided, sins of commission). ‘The former bind always, but not to always, the latter bind always to always.’ The virtues and duties commanded by the affirmative precepts cannot be exercised every moment together at once, and suppose certain conditions (which being absent, there is no place for them); for example, parents are not always alive or near us, so that we can render them their due respect. But the vices and crimes prohibited can be committed lawfully in no article of time. Here, however, we must make an exception of the general affirmative command to love God (which obliges always and to always) because there is no time or place or state in which man can be exempted from the duty of loving God. … XII. Fourth [Rule of Obedience], as the precepts do not have an equal degree of importance and necessity, so neither is the obedience to be reckoned of the same order and value… The omission of a command is one thing; opposition to it another; forgetfulness, neglect and contempt are different. Neglect proceeds from the langor of slothfulness…”

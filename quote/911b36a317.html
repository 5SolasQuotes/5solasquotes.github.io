<main class="wrap"><figure class="quote" id="q-911b36a317" data-kw="">
<blockquote><p>…first I say that death of its own nature is evil: for God threatens the same and does cast it upon us as a punishment. Moreover, it is put as contrary unto life, which we doubt not but is good… But now I only ask this: If death be evil, why is it sometime wished for: for nothing can be desired but has some consideration of good? But you will say that even this has then some consideration of good, when men are thereby delivered from the grievous evils which they think that either they be not able to bear, or that in abiding of them they shall be grievously troubled: or else, when by the same they obtain some notable good thing. Wherefore, though it sometime appear lawful to wish death for any of these, yet is it a doubt whether one may kill himself for those things… But I speak nothing hear of them which slay themselves through frenzy and madness [insanity]… it may rather seem hear that they should be pitied… And we will use this proposition: It is not lawful for one to kill himself for any of those things which I have showed… And when the Amalechite had said that he stood upon the body of Saul while he was dying and did press him down that he might die the more easily, David answered, ‘Thou art the son of death.’ (2 Sam. 1:16) But if it had been lawful for Saul to have killed himself, how could the young man, which hastened his death, be worthy of death? For it is lawful for one to help another in an honest matter, and especially his prince. And if the law forbid thee to kill another man, it much rather forbids thee to kill thyself, since that which is not lawful for thee to do to another, is unlawful for thee to do to thyself. For the rule of charity must be taken from that charity wherewith we love ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, … (d. 1562; London: Henrie Denham et al., 1583), pt. 2, ch. 9, ‘The Sixth Precept: of Friendship’ | ‘Of Sword-Play’ 390 ‘Whether it be Lawful for any Man to Kill Himself’ 391-97, pp. 391-92</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b9ddfd8d5f" data-kw="">
<blockquote><p>In the conception of Christ we must observe and consider three things. The framing of the manhood, the sanctifying of it, and the personal union of the manhood with the Godhead. And howsoever I distinguish these three for order’s sake, yet must we know and remember, that they are all wrought at one and the same instant of time. For when the Holy Ghost frames and sanctifies the manhood in the womb of the virgin: at the very same moment it is received into the unity of the second person… As for his soul, it was not derived from the soul of the virgin Mary as a part thereof, but it was made as the souls of all other men be, of nothing by the power of God, and placed in the body; both of them from the first moment of their being, having their subsistence in the person of the son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge, 1595), p. 157</span></figcaption>

</figure><figure class="quote" id="q-7f7ce76c33" data-kw="">
<blockquote><p>In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

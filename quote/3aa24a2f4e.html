<main class="wrap"><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4c1b9cb59" data-kw="">
<blockquote><p>If the sacraments are said to remit sins, to save and to regenerate (Acts 2:38; 22:16; Eph. 5:26; Tit. 3:5; 1 Pet. 3:21), they do not do this by a proper, immediate and internal force (as is evident from 1 Pet. 3:21). Rather they do it sacramentally and improperly because they are efficacious signs by which those benefits are signified and sealed and in their legitimate use conferred.… When remission of sins is ascribed to baptism (Acts 22:16), it is not ascribed to it except under the relation of a sign and seal and not under the relation of a true, proper and immediate physical cause… In fine, although that remission is ascribed to baptism, it does not belong to it by reason of the external action properly, but by reason of the internal grace and receiving faith, without which all the external ablution is in vain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 19</span></figcaption>

</figure><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, Book XI, ch. II, Of the Efficacy of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-5304def06a" data-kw="">
<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a> › <a href="../topics/baptism/efficacy/baptismal-regeneration-vs-baptism-as-sign-and-seal.html">Baptismal regeneration vs baptism as sign and seal</a></span></div>
<div class="actions"><button class="copy" data-copy="“That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.”

— Charles Hodge, Systematic Theology, vol. 3, “Condition on which the Efficacy of Baptism is suspended”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+condition+is+faith.+It+is+the+clearly+pronounced+doctrine+of+the+Lutheran+Church+that+baptism+is+altogether+useless+or+void+of+any+saving+effect%2C+unless+the+recipient+be+a+believer.+And+by+faith+is+not+meant+mere+speculative+assent%2C+such+as+Simon+Magus+had%2C+but+true%2C+living%2C+and+saving+faith.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+3%2C+%E2%80%9CCondition+on+which+the+Efficacy+of+Baptism+is+suspended%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5304def06a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5304def06a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology3" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-c7037dede4" data-kw="">
<blockquote><p>We have a proof of this in Cornelius the centurion, who, after he had been previously endued with the graces of the Holy Spirit, was baptised for the remission of sins, not seeking a fuller forgiveness from baptism, but a surer exercise of faith; nay, an argument for assurance from a pledge. It will, perhaps, be objected, Why did Ananias say to Paul that he washed away his sins by baptism (Acts 22:16), if sins are not washed away by the power of baptism? I answer, we are said to receive, procure, and obtain, whatever according to the perception of our faith is exhibited to us by the Lord, whether he then attests it for the first time, or gives additional confirmation to what he had previously attested. All then that Ananias meant to say was, Be baptised, Paul, that you may be assured that your sins are forgiven you. In baptism, the Lord promises forgiveness of sins: receive it, and be secure. I have no intention, however, to detract from the power of baptism. I would only add to the sign the substance and reality, inasmuch as God works by external means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.15</span></figcaption>

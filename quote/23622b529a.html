<blockquote><p>What does the tenth Commandment require? That not even the least inclination or thought against any commandment of God ever enter our heart, but that with our whole heart we continually hate all sin and take pleasure in all righteousness (Rom. 7:7–8).</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Baptist Catechism</cite>, Q. 86</span></figcaption>

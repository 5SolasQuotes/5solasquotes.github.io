<blockquote><p>…for, if error be such an evil that thwarteth 1. both with God’s holiness and truth; and, 2. that hazardeth so many souls (for, never a plague hath so destroyed the face of the visible Church, nor carried so many souls to hell as error hath done), then the suffering of it cannot but be hateful to Him who loveth His Church.</p></blockquote>

<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>

<blockquote><p>50. Unto the external things of the Church belongs not only the correction of heretics and other troublers of the Church, but also that civil order and way of convocating and calling together synods, which is proper to the Magistrate; for the Magistrate ought by his authority and power both to establish the rights and liberties of synods assembling together at times appointed by the known and received law, and to indict and gather together synods occasionally as often as the necessity of the Church shall require the same; Not that all or any power to consult or determine of ecclesiastic or spiritual matters does flow or spring from the Magistrate as Head of the Church under Christ; but because in those things pertaining to the outward man, the Church needs the Magistrate’s aid and support. 51. So that the Magistrate calls together synods [as teaches WCF 31.2], not as touching those things which are proper to [ecclesiastical] synods; but in respect of the things which are common to synods with other meetings and civil public assemblies, that is, not as they are assemblies in the name of Christ, to treat of matters spiritual, but as they are public assemblies within his territories; for to the end that public conventions may be kept in any territory, the licence of the lord of that place ought to be desired. In synods therefore a respect of order, as well civil as ecclesiastical is to be had; And because of this civil order, outward defense, better accommodation, together with safe access and recess, the consent and commandment of him who is appointed to take care of, and defend human order, does intervene. … He [the magistrate] takes care also for maintaining the ministers and schools, and supplies the temporal necessities of God’s servants, by his command assembles synods, when there is need of them; and summons, calls out, and draws to trial the unwilling, which without the Magistrates strength and authority cannot be done, as has been already said; he makes synods also safe and secure, and in a civil way presides or moderates in them (if it so seem good to him), either by himself or by a substitute commissioner. In all which the power of the magistrate though occupied about spiritual things, is not for all that spiritual but civil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (1647), #50-51, 65</span></figcaption>

</figure><figure class="quote" id="q-c53cd5ae4b" data-kw="">
<blockquote><p>On his return home on the 31st he found that the mysterious and awful visitation of the cholera — which he always anticipated would, in its alarming and desolating course, visit Inverness — had broken out. The first decided cases appeared on the 21st. On the Sabbath following, the 2nd September, he improved the visitation by preaching in the forenoon from Ps. 106:29, “Thus they provoked Him to anger with their inventions; and the plague brake in among them.” In the afternoon, from Joel 2:14, “Who knoweth if He will return and repent, and leave a blessing behind Him, even a meat offering and a drink offering unto the Lord your God” — subjects peculiarly appropriate. On the first appearance of this awful disease, and during its progress, the feelings excited in the minds of the inhabitants, and depicted in their countenances, none could adequately describe but those who were eye-witnesses. The common sympathies of our nature with those in affliction, and the ties and tender affections of friendship seemed, in some cases, to be totally cut asunder, — all seemed to be absorbed with their own individual cases. Several families fled to the country. Though rather timid and sensitive as to visiting the sick, in cases of contagious fevers, he deemed it his duty to remain at his post, publicly and privately exhorting his people to improve the visitation. Prayer meetings were frequent in various quarters of the town, each night, in places and by persons of whom it could not be said that ” prayers were wont to be made.” He united with them, entering in some measure into the spirit as well as unto the letter of the noble and patriotic resolution of Nehemiah, “should such a man as I flee?” as will be seen in the following extract of a letter which communicated to the writer [the biographer] his unlooked-for and much-lamented death [after attending Lord’s Day worship and the Tuesday evening prayer meeting]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-findlater.html">Robert Findlater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoir of the Rev. Robert Findlater</cite>, ... (Glasgow ), p. 307. Findlater was a Church of Scotland minister in Inverness.</span></figcaption>

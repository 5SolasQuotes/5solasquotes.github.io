<blockquote><p>Nay, there is a general and universal invitation to everyone who thirsts to come to the waters; and God has promised to give “to him that is athirst, of a fountain of the water of life freely” (Revelation 21:6).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions, pp. 560-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-fb228d71e6" data-kw="">
<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners (Acts 5:30–31; 2:36; 1 Cor. 1:22–24).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 25</span></figcaption>

<blockquote><p>8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee.

9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God.

10. Wouldst thou have more tokens of his will yet? See Him dying, hanging upon the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners should run in to Him, breathing out the breath of free grace in his very last act upon a thief that had not an hour to live; Who shall despair? who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth! corrupt heart say thou art not willing to be saved.

11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.</p></blockquote>

<blockquote><p>We see that God is (as ye would say) wayward towards us; we see that He does not only bereave us of his blessings, but is also angry with us; and to be short, we perceive in Him nothing but all manner of rigor. And what is the cause hereof? Verily that we shut the gate against his goodness and will not suffer Him to use (as ye would say) his natural disposition. Lo here [is] a thing that should make us the better to acknowledge our faults and not to accuse God of any excessive cruelty when He deals not with us after our liking. For it is certain that He will take pleasure in doing us good, but on the other side let us consider also that He must in likewise delight to do us evil. And why so? Verily because that He is just. Indeed, if we did suffer God to use his own inclination towards us, He would bestow infinite benefits upon us and we living in this world should be as in Paradise. But because of our sins, we must live here like wretched wanderers; we must languish in many miseries, we must dwell in continual fear and in doubt and we must groan in great unrest: it must be even so. And wherefore? Because God is just. This is the very pleasure that is spoken of in this text, according whereunto it is said that God will rejoice and be glad when He has punished the wicked and maintained his majesty against them, for that they have despised Him and set Him at nought. Nevertheless, it is likewise true that He says by his prophet Isaiah [1:24] that He does it unwillingly. ‘Alas’ (says He) ‘must I needs revenge Me of mine enemies?’ God cries there ‘Alas,’ as if He were in sorrow and anguish for it. ‘I must’ (says He) ‘take comfort in avenging Me of mine enemies.’ Those whom He terms his enemies are the children whom He had adopted, and which boasted themselves to be his people. And how does He comfort Himself in them? Even by giving them over and by driving them away. But in the meanwhile He shows that it is against his will when He must so beat men down with main strokes, howbeit that He can none otherwise do. Yet notwithstanding, in very deed God is able to tame the hearts of men without any great violence: for (as we have said) He is not subject to our passions. But hereby we be to consider how his intent is to declare that our unreformable naughtiness is the cause why He is faine to pursue us after such manner as is spoken of here and that He is faine to take pleasure in doing us harm, wherein the order of nature is after a sort quite altered and changed: but all is through our own fault and we ourselves are to blame for it, and it is not for us to seek any other reason thereof than our own sin which has kindled his vengeance to the uttermost.</p></blockquote>

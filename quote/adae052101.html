<main class="wrap"><figure class="quote" id="q-adae052101" data-kw="">
<blockquote><p>God requires humiliation indeed afore, because men will not believe else; and he requires obedience after, as that which necessarily follows upon faith, so as a man cannot truly believe but it will follow, as heat follows light. Yet, upon believing, the bargain is struck up; and though faith be the great instrument, yet we say withal, that works are necessary to be in the person justified, yet not to justify. Thus heat is as necessarily in the sun as light; yet it makes not day by its heat, but by its light. Works of new obedience are required as necessary to the possession of salvation, but faith is that alone which puts us into a condition of having the title and right to it, by the blood and righteousness of Christ. Obedience is necessarily required in all that are made sons, and so cry, ‘Abba, Father;’ for if he be a father, where is his honour? But it is faith alone that makes us sons, Gal. 3:26. And though we are as necessarily ordained to sanctification, as to faith and to salvation through both, 2 Thes. 2:13, by which, as the necessary way, we come and are brought to salvation as the goal, yet it is by faith alone that we are put into that estate: Eph. 2:8, 9, ‘By grace ye are saved through faith, and that not of works,’ etc. Then might some say, works are not required; yes, says the apostle, as a necessary means you are ordained to come to salvation by, which is the end of your faith, and which are a necessary condition of that estate, though faith alone puts us into it; for he adds, ver. 10, ‘We are his workmanship, created to good works, which God hath ordained we should walk in.’ They are the condition of the subject that shall be saved, who must be made meet, not the condition of the promise of salvation itself. They are the condition of faith, or of the person believing; but as sight is that which saves us in heaven, by which we have all our happiness communicated to us, so is it faith that saves us here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Thomas Goodwin</cite>, (Edinburgh: James Nichol, 1864), 8.461–62.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0640bfcb7e" data-kw="">
<blockquote><p>Therefore we, being justified by faith, do good works, through which, as 2 Peter 1:10 says, our call and election are confirmed and made more certain day by day. But because we have only the first fruits of the Spirit and do not yet have the tithes, and because remnants of sin remain us, we do not keep the Law perfectly. But this is not imputed to us who believe in Christ—in Christ, who was promised to Abraham and has blessed us. For meanwhile we are cherished and fed, for the sake of Christ, in the lap of the forbearance of God. We are that wounded man who fell among robbers; whose wounds the Samaritan bound up, pouring on oil and wine; whom he set on his own beast and brought to an inn and took care of; and whom he entrusted to the innkeeper upon departing, with the words: “Take care of him” (Luke 10:30–35). Thus we are cherished meanwhile as in an inn, until the Lord reaches out His hand a second time, as Isaiah says, to deliver us (Is. 10:10–11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-cdc91157e0" data-kw="">
<blockquote><p>Titus 3:. Therefore to the obtaining of eternal life two things are necessary. the first is to believe well; the second is, to live well. By the first we are justified in the sight of God, for he respects our faith; by the second we are justified in the sight of men, for they regard our works. And thus are the apostles Paul and James reconciled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons</cite>, (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 107-09, pp. 110-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-6f6fc665e9" data-kw="">
<blockquote><p>The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.1</span></figcaption>

</figure><figure class="quote" id="q-632b3a7e5e" data-kw="">
<blockquote><p>The child of God is like a lame man that goes the right way, but yet halts at every step. Abraham and Sarah desire issue, that is from the Spirit; but they desire issue by Hagar their handmaid, that is from the flesh. Rebekah seeks the blessing for Jacob, that is a work of the Spirit; but she seeks it by lying, that is from the flesh. Peter eats with the Gentiles, that is from Christian liberty. He afterwards separates himself, that is from corruption. Thus we see that the best works are imperfect and mixed with corruption, and that for the best works we must humble ourselves and seek pardon, not in respect of the goodness of the work, but in respect of the defect thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:103.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7320ae0471" data-kw="">
<blockquote><p>The attaining of God&#x27;s glory was an end, which being ultimate and supreme, must in no case whatsoever give place. This is spoken of as the end of God&#x27;s executing judgments on his enemies in this world. … And this is spoken of as the end, both of the executions of wrath, and in the glorious exercises of mercy, in the misery and happiness of another world. Rom. 9:22–23, &quot;What if God, willing to show his wrath, and make his power known, endured with much long suffering, the vessels of wrath fitted to destruction: and that he might make known the riches of his glory on the vessels of mercy, which he hath afore prepared unto glory …?&quot; … Then his glory shall be obtained, with respect both to saints and sinners. From these things it is manifest … that God&#x27;s glory is the ultimate end of the creation of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation Concerning the End for Which God Created the World</cite>, on Ex. 14:17 and Rom. 9:22–23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/glory-and-blessedness.html">Glory and Blessedness</a> › <a href="../topics/attributes-of-god/glory-and-blessedness/gods-glory-as-the-end-of-all-things.html">God&#x27;s glory as the end of all things</a></span><span class="t"><a href="../topics/creation/creation-in-general.html">Creation in General</a> › <a href="../topics/creation/creation-in-general/gods-glory-as-the-end.html">God&#x27;s glory as the end</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7be12b839e" data-kw="Author of sin Justice">
<blockquote><p>But we teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, ch. 2, title 5 (On the Will of God)</span></figcaption>

</figure><figure class="quote" id="q-14ba01d57f" data-kw="Hardening Justice">
<blockquote><p>God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.</p></blockquote>

</figure><figure class="quote" id="q-3a5b0c6743" data-kw="">
<blockquote><p>If God be Jehovah, the supreme Lord, then it condemns the blasphemous papists, who speak after this manner, &#x27;Our Lord God the Pope.&#x27; Is it a wonder the pope lifts his triple crown above the head of kings and emperors, when he usurps God&#x27;s title, &quot;shewing himself that he is God?&quot; 2 Thess. 2:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 29</span></figcaption>

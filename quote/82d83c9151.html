<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>

<blockquote><p>The quaestio in which this quote appears is ‘whether the divine being is so true that it cannot be thought not to be.’ Bonaventure believes that a condition for the possibility of any intellectual cognition is knowledge of divine esse [being], which is first in the order of concepts. Bonaventure rehearses the below argument not in his own voice, and, in his respondeo, he distinguishes senses in which it is impossible to think that the first truth does not exist.</p></blockquote>

</figure><figure class="quote" id="q-dc3d5105c3" data-kw="">
<blockquote><p>Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-heider.html">Daniel Heider</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universals in Second Scholasticism: A Comparative Study with Focus on the Theories of Francisco Suárez S.J. (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-5b3de544e3" data-kw="">
<blockquote><p>It must also be kept in mind that for the Aristotelian-Thomistic tradition, human beings and their operations are, like other natural substances and processes, to be analyzed in terms of formal, material, efficient and final causes, which together form an irreducible unity. In the case of a thought (such as the thought that snow is white) the neural processes associated with the relevant phantasms [sensory experience or memory] might be regarded as the material cause of a single event of which the intellective activity is the formal cause. To be sure, the analysis of human thought and action in terms of the Aristotelian four-causal explanatory framework is a more complicated business than that suggests. But it is only if that framework is rejected that to acknowledge that there are immaterial aspects of thought can seem to open up what Dillard calls “an apparently unbridgeable gulf between thought and behavior.” And to reject it without argument would simply be to beg the question against the Aristotelian-Thomistic view.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024), pt. 3, ‘What is a human being?’</cite>, ch. 8, ‘Against Materialism’; p. 328</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

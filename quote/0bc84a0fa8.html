<main class="wrap"><figure class="quote" id="q-0bc84a0fa8" data-kw="">
<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation.html">Sacrifice and Propitiation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bef223640" data-kw="">
<blockquote><p>A person so great, so high, so glorious, as this Jesus Christ was, should have love for us, that passes knowledge. It is common for equals to love, and for superiors to be beloved; but for the King of princes, for the Son of God, for Jesus Christ to love man thus: this is amazing, and that so much the more, for that man the object of this love, is so low, so mean, so vile, so undeserving, and so inconsiderable, as by the scriptures, everywhere he is described to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

</figure><figure class="quote" id="q-300334332c" data-kw="">
<blockquote><p>Imperfect and unsatisfactory as this survey necessarily is, it is enough to prove not only that the Scriptures teach the divinity of Christ, but that Christianity as a religion consists in the love, worship, and service of the Lord Jesus, whose creatures we are, and to whom we belong by the still dearer relation of those whom He hath purchased with his own precious blood.</p></blockquote>

</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</span></figcaption>

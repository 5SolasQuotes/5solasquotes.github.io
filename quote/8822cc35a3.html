<main class="wrap"><figure class="quote" id="q-8822cc35a3" data-kw="">
<blockquote><p>We believe a, Predestination to Life, wherein God with [an] Everlasting Purpose, has decreed by His Counsel, to bring those whom He hath Chosen in Christ out of Mankind, unto Everlasting Salvation. We can Subscribe this Article, [The Seventeenth of the Church of England’s famous XXXIX,] because we find the Sacred Epistles to the Romans and Ephesians, Expressly asserting it. And when we have Subscribed it, we shall not then Deny it, then Decry it, then Oppose it; We should Look on it, as a very Scandalous Treachery to do so.

This Election of Some to Everlasting Life, which unavoidably implies a Rejection of Others, ’tis called, Rom. XI. 5. The Election of Grace. Oh! Sovereign Grace! Why has our God, Chosen us in Christ before the Foundation of the World, and Predestinated us unto the Adoption of Children! The Praise of the Glory of His Grace, is designed in it; is displayed in it. Why are Some Taken, to be Redeemed, Converted, Saved; when Others are not so! Tis, because, I will be gracious to whom I will be gracious, saith the Infinite GOD, who gives none Account of His Matters. Tis all from Unaccountable Grace. Tis, Even so, Father, because it pleases thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace defended. A censure on the ungodliness, by which the glorious grace of God, is too commonly abused. A sermon preached on the twenty fifth day of December, 1712. Containing some seasonable admonitions of piety. And concluded, with a brief dissertation on that case, whether the penitent thief on</cite>, (Boston: Samuel Gerrish, 1712), pp 4-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c515fd58" data-kw="">
<blockquote><p>As to the true State of the Doctrine, it may be taken up in these two or three Propositions.

1. That as God, from everlasting, was pleased, in his own free Sovereignty, to decree and determine, to create this World; and to make Man in it a reasonable Creature, in his own Image, holy and upright, every Way fitted and empowered for that Duty which was due, from such a rational Creature, to the great God Creator, with full Ability to persevere and continue in that happy State of Integrity; and to enter into a Covenant of Life with him, wherein all the human Race were to be concerned and engaged; and Adam, their first Father, constituted their public Head and Representative; so that as he kept or broke the Covenant, they were to enjoy or lose the promised Blessings of it:

And as God infallibly foreknew the Fall and Transgression of Adam, as what he had decreed to permit, and so the Depravity and Ruin of his Posterity consequent thereupon, according to the Covenant; with all the actual Sins which every Individual should ever be guilty of; so he was likewise pleased, of his own mere Grace and free Favour, to decree and determine, to recover and save a Number, only known to himself, of that fallen wretched Race, thro’ the Meditation of his own Son’s Redeeming them, by answering the Precept and Penalty of the broken Law for them; and thro’ the Sanctification of his eternal Spirit, making them fit for and capable of glorifying and enjoying him forever.

2. That God’s determining and appointing to save any of fallen Mankind, or any in particular more than others, was not up on the Foresight of any Difference which he foresaw they would make among themselves, by the better Improvement of any common Helps and Advantages, as the Reason of it: But it was purely of his own sovereign, free, wise Pleasure, and distinguishing Grace.

3. That the rest of fallen Mankind, not thus chosen and ordained to eternal Life, he was pleased, of his sovereign, wise and righteous Pleasure, as a just King and Lawgiver, to determine to leave in their fallen State; and to punish them according to all the Sin and Disobedience, which they should be guilty of, and chargeable with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-blair.html">Samuel Blair</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of predestination truly and fairly stated: confirmed from clear Scripture-evidence, and defended against all the material arguments and objections advanced against it</cite>, (Philadelphia PN: B. Franklin, 1742), pp 6-7.</span></figcaption>

</figure><figure class="quote" id="q-d360696bd6" data-kw="foreseen perseverance mutable election">
<blockquote><p>The Arminians (in order to defend the apostasy of saints) uphold the mutability of election. Thus they make it twofold: one incomplete and not decisive (of those who will believe), which can be revoked and made void by the inconstancy of men who can fall from faith; the other, however, complete and decisive (of those persevering and dying in faith), which is immutable.</p></blockquote>

<blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful.</p></blockquote>

</figure><figure class="quote" id="q-9d7bd937c1" data-kw="">
<blockquote><p>Predestination &amp; Reprobation Contrasted 1. The [Westminster] Confession does not teach or imply a double predestination. In an attempt to distinguish between election and reprobation we should use predestination for the elect and foreordination for the reprobate [as the Confession does].

2. Election and reprobation rest on different grounds: election on the redeeming love of God that undertakes the salvation of the lost; reprobation on the moral necessity to manifest to the universe the nature and consequences of sin in moral personality.

3. Means are used of God to fulfil the purpose of election, but God uses no means to fulfil His purpose of reprobation. It is left to sin to run its course and receive its wages.

4. The fruits of election are attributable to divine grace, the fruits of reprobation to personal sin. This means that while there is grace to some, there is injustice to none.

5. While God finds pleasure in the salvation of the elect, He has sworn by Himself that He has no pleasure in the death of the wicked. God does not need sin or its retribution for His self-manifestation, but its reality in the universe can serve that end.

6. That the elect will constitute a recreation of the race under a new Head is evident, while the reprobate are but the branches cut off from the tree of humanity. Christ will be revealed as the Savior of the world, though many are lost in the process.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-a-finlayson.html">R.A. Finlayson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Theological Writings of R.A. Finlayson</cite>, p. 265. Finlayson was a Free Church of Scotland professor during the mid-1900’s.</span></figcaption>

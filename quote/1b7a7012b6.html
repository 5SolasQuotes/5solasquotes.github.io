<main class="wrap"><figure class="quote" id="q-1b7a7012b6" data-kw="">
<blockquote><p>[3.] If parents, by refusing to comply with the desire of their children [in desiring to marry someone], plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</cite></span></figcaption>

<blockquote><p>§XXVII. With respect to Duration, the human soul is immortal, which Christian Religion teaches against the Sadducees, Epicureans, and Atheists, who think that souls are extinguished with their bodies. This is contradicted by: 1. Scripture, Eccl. 12:7, “The dust returns to its earth from whence it was, and the Spirit returns to God who gave it.” Mt. 10:28, “Fear not them which kill the body, but are not able to kill the soul: but rather fear him, which is able to destroy both soul and body in Hell.” Mt. 22:32, “I am the God of Abraham, and the God of Isaac, and the God of Jacob: God is not the God of the dead, but of the living.” Lk. 16:23, “The rich man in torments saw Abraham afar off, and Lazarus in his bosom,” etc. Lk. 23:43, Christ to the converted thief: “Today you will be with me in Paradise.” v. 46, Christ, expiring, cried out: “Father, into your hands I commend my Spirit.” 2 Cor. 5:8, Paul says: “We are willing rather to be absent from the body, and to be present with the Lord.” Phil. 1:23, “I have a desire to depart, and to be with Christ.” 1 Pet. 3:19, “By which also he went and preached unto the spirits in prison,” etc. add Ps. 49:15, “God will redeem my soul from the power of the grave: for He shall receive me.” 2 Sam. 12:23, “But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.” 1 Kn. 17:21, “O Lord my God, I pray thee, let this child’s soul come into him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), sect. 27</cite>, pp. 13-14 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-a421c29cff" data-kw="">
<blockquote><p>VIII. Whether brute animals were given for food from the first creation of things? We affirm, against some rabbis who want this to have happened only after the flood of Noah [Gen. 9]; before that time, only vegetables were granted, Gen. 1:29-30. But this savors of that Pythagorean saying in Ovid: ‘What have oxen, an animal without fraud and deceit, deserved?&#x27;</p></blockquote>

<blockquote><p>Of this intellectual treasure house [the conscience], we are to know these [things]: 1. That in the inner cabinet, the natural habit of moral principles lodges, the register of the common notions left in us by nature, the ancient records and chronicles which were in Adam’s time, the Law of Nature of two volumes [corresponding to both Tables of the Law]… All these are written in the soul, in deep letters, yet the ink is dim and old, and therefore this light is like the moon swimming through watery clouds, often under a shadow, and yet still in the firmament.</p></blockquote>

<blockquote><p>§XLVII. The purpose of created man with respect to God is the glory of his goodness, wisdom, power and sanctity (Prov. 16:4; Rom. 11:36). With respect to man, it is eternal life and salvation, which he ought to acquire by the consideration of his purpose and the use of the means (Lev. 18:5; Dt. 30:15,19; Eze. 33:11; Mt. 9:13; Lk. 10:28; Rom. 7:10; also Jn. 3:15-17; 2 Pet. 3:9; 1 Tim. 2:4; 1 Thess. 5:9). With respect to those who do not attend to the purpose of man and neglect the means of life, the end by accident, the event and consequence, is death (Rom. 7:10; Mk. 16:16; Jn. 3:18, 36; Rom. 1:18; 2 Cor. 2:16), and although man may fall short of his end, God is nevertheless not frustrated of his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-984ac52a70" data-kw="">
<blockquote><p>The Reformed commonly acknowledge a universal grace concerning natural things and a common grace concerning moral things, but saving grace concerning things that accompany salvation they do not allow, except as a grace proper to the elect: they acknowledge no saving grace that extends equally to each individual, not even that grace that they call objective.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (1698; RHB), vol. 2, bk. 2, ch. 17, section 32, ‘3. Does the saving grace of God extend equally to each and every person?’, p. 367</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed commonly acknowledge a universal grace concerning natural things and a common grace concerning moral things, but saving grace concerning things that accompany salvation they do not allow, except as a grace proper to the elect: they acknowledge no saving grace that extends equally to each individual, not even that grace that they call objective.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c60445e26" data-kw="">
<blockquote><p>Abraham Kuyper and Herman Bavinck brought this older discussion into the center of a much larger argument. Topics once dispersed across providence, pagan virtue, natural law, and the Spirit’s nonsaving operations became materials for interpreting cultural history, science, and public institutions. Their achievement was not to discover useful gifts among unbelievers but to ask what those gifts meant for the development of civilization and Christian participation in it. That change of scale is the problem of this essay. The older Reformed writers offered more than scattered anticipations of neo-Calvinism; Kuyper and Bavinck offered more than a new vocabulary for old conclusions. The history requires us to distinguish inheritance from reconstruction, and theological recognition from political authorization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-tomes.html">Jonathan Tomes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Common Grace before and after Kuyper</cite>, (2026)</span></figcaption>

</figure><figure class="quote" id="q-8619ed2862" data-kw="">
<blockquote><p>The Word must be preached to all without exception; the Gospel must be offered to converted and unconverted. Some object to this as if it would make the offer of grace too general. But the Lord Jesus has commanded it. ‘Many are called, but few are chosen.’ (Matt. 22:14; 20:16) ‘Go ye therefore, and teach all nations, baptizing them in the Name of the Father, and of the Son, and of the Holy Ghost.’ (Matt. 28:19) ‘Go ye into all the world, and preach the Gospel to every creature.’ (Mark 16:15) … Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 2, p. 369</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-9f715a8a9e" data-kw="">
<blockquote><p>God made man upright, gave him a righteous law, which, when broken, that all hopes might not be cut off, He sent his Son: Rom. 8:3, ‘God sending his own Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh,’ to be the foundation of a new covenant; offered you grace in Him, pardon of all your sins past, to help you in the course of obedience for time to come; moved you by powerful arguments, not by low and cheap considerations, but those of the greatest weight, the joys of heaven, the torments of hell; called upon you often by the ministry, knocked at your hearts as well as your ears by his Spirit; waited for your amendment for many years, tried you by mercies if they could melt you, by afflictions if they would reduce you to a sense of your duty. But all this will not do; yet you are still alive, and these means continued. What shall God do more? Now why are you not converted? Others are wrought upon by the same means and turned to the Lord, and have entered in by the strait gate, and framed their desire to walk in the narrow way. They have not offers more rich, or free, or particular. God has not told them of a hotter hell or a better heaven, or another or a more taking gospel. God speaks to you and them in the same terms, with the same grace and favor, and makes the door wide enough to get in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 2</span></figcaption>

<blockquote><p>8. The application [of redemption] plainly has the same latitude as redemption itself, i.e., redemption applies to all those and only to those for whom it was obtained by the intention of Christ and the Father. Yet because of them the same temporal benefits of Christ overflow also to others.

9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 1, ch. 24, ‘The Application of Christ’, p. 150</span></figcaption>

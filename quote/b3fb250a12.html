<main class="wrap"><figure class="quote" id="q-b3fb250a12" data-kw="">
<blockquote><p>And the “precision” of ministers concerns first of all themselves and their families, then members of their congregation and any who hear them, then neighbouring churches with which they have dealings either individually or through synod or classis, and finally those who are outside the church …

Anyone who reverses this order, or who advocates or demands precision for others, often with great importunity, in classis or synod, and emphasizing minutiae and ritual forms, while his own life, family, or church is simply an uncultivated field, should not be called a zealot or precisionist, but a meddler, busybody, Pharisee, Diotrephes [3 Jn. 9], who is everywhere and is busy everywhere, except at home.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectae Disputationes Theologicae</cite>, (1648-69) in Reformed Dogmatics, ed. and trans. John W. Beardslee III (New York: Oxford University Press, 1965), p. 324.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

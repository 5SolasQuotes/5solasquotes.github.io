<blockquote><p>One of the unclean spirits like frogs, we are told, proceeded out of the mouth of the “FALSE PROPHET.” By the False Prophet of the Revelation may we not understand, Mahomet, the arch deceiver of the Eastern world, who commenced his career in the fore part of the seventh century, on the assumption of being the Great and only Prophet of God, superior to Jesus Christ himself. By the spirit like a frog, “proceeding out of his mouth,” may we not understand the great delusive system of Mahometanism, which was devised, and matured by Mahomet, until, by the power of the sword, a vast proportion of the Eastern world was brought into subjection to an established religion, in opposition to the kingdom of our Lord Jesus Christ, and which was calculated to bear down like the force of a mighty torrent, against every thing that would tend to favour Christianity.

On this hypothesis, Mahometanism with all its false pretensions, and destructive delusions which have prevailed for more than a thousand years, deluging the Eastern nations with a food of errors, may be considered as one of the spirits like frogs, which belong to the combination of the spirits of devils working miracles, and going to the kings of the earth, to gather the nations in battle at the great day of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lebbus-armstrong.html">Lebbus Armstrong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be a Work of Darkness, Repugnant to the Christian Religion; and Inimical to a Republican Government (4th edn, New York: J. A. Lewis, 1831), p. 18.</cite></span></figcaption>

64021bf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/01/lebbus-armstrong-on-islam/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-314e241842" data-kw="">
<blockquote><p>There will come a time when in this world holiness shall be more general, and more eminent, than ever it hath been since Adam fell in paradise. The Scripture speaks clearly, roundly, and fully to this: Deut. xxx. 5, 6, 8, ‘The Lord thy God will bring thee into thine own land, and the Lord thy God will circumcise thine heart, and the heart of thy seed, to love the Lord thy God with all thy heart, and with all thy soul, and thou shalt return and obey the voice of the Lord, and do all his commandments.’

This gracious promise was made to the Jews above two thousand years ago, and yet to this very day it hath not been fulfilled; and therefore there will certainly come a time wherein God will make it good: Isa. xi. 6, ‘The wolf shall dwell with the lamb, &amp;c., and they shall not hurt, &amp;c., for the earth shall be full of the knowledge of the Lord, as the waters cover the sea.’

This glorious promise hath not been made good to this day, but there is a time a-coming wherein it shall be accomplished: Isa. xxxv. 8, ‘There shall be a highway, and it shall be called a way of holiness; the unclean shall not pass over IT.’ Isa. lix. 21, ‘This is my covenant, my word and my Spirit shall NEVER DEPART from thee for ever.’ Isa. Ix, 21, ‘Thy people shall be ALL RIGHTEOUS.’ Jer. xxxii. 40, 41, ‘I will make an everlasting covenant with them, that I will not turn away from them to do them good; but I will put my fear into their hearts, that they shall not depart from me. Yea, I will rejoice over them to do them good, and will plant them in this land assuredly with my whole heart and whole SOUL.’ So Ezek. xxxvi. 23-30; Mai. iv. 1, 2; 2 Pet. iii. 13.

Now it is very observable that this great promise must be fulfilled when the Jews shall return and be settled in their own land. And so the prophet Ezekiel, speaking of the glorious state of the church in the last days, Ezek. xliv. 7, 9, adds, ‘Thus saith the Lord, no stranger uncircumcised in heart shall enter into my sanctuary.’ Zeph. iii. 13, ‘The remnant of Israel shall not do iniquity, nor speak lies; neither shall a deceitful tongue be found in their mouths.’

Now the context clearly shews that these words relate to the glorious state of the church on earth, and they have never yet received their accomplishment, but shall in the last days, for he is faithful that hath spoken it: Zech. xiv. 20, 21, ‘Upon all shall be holiness to the Lord.’ I have opened this text pretty fully to you already in my former discourses on holiness, and therefore shall pass it by now, Rev. xxi. verse the first and verse the last, ‘And I saw a new heaven, and a new earth, and I saw the holy city New Jerusalem coming down from God out of HEAVEN. Behold the tabernacle of God is with men, &amp;c., and there shall in no wise enter into it anything that defileth, &amp;c., but they that are written in the Lamb’s book.’

I have formerly proved by several arguments, as divers of you knows, that this chapter cannot be understood of heaven, but must necessarily, and beyond all dispute, be understood of the glorious state of the saints on earth, which they shall certainly enjoy in the last days. By all these scriptures it is most evident that there will come a time when holiness shall be more general, and at a fuller height than ever yet it hath been since man fell from his original holiness; and therefore pray and wait, and wait and pray, look and long, and long and look, for the breaking forth of this day of glory upon the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 434-35.</span></figcaption>

<blockquote><p>The visible Church under the Old Testament, the charter of which was God’s covenant with Abraham, is likened by the Apostle Paul to a stately, wide-spreading olive tree. [Rom. 11] The race of Israel, incorporated in the Church, were the natural branches; converted Gentiles are the branches grafted in; and when Israel shall turn to the Lord, the natural branches shall be again restored; and the one goodly olive tree, verdant and beautiful, shall overspread all lands, and shall embrace, under its shadow, the people of all nations.</p></blockquote>

</figure><figure class="quote" id="q-7136adbf25" data-kw="">
<blockquote><p>When we look into the doctrine of Mahomet, we find therein many truths, which he had taken from Jews and Christians, which greatly advance his religion above that of the pagans. He admitted only of one God, and asserted that his essence was simple and infinite… Thus far his doctrine is good: these are truths which that impostor drew from the books of the Old and New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>True &amp; False Religion Examined</cite>, pp. 41-42</span></figcaption>

<blockquote><p>3. A magistrate may compel a heathen nation to the negative reverence of Christ in a indirect way, and that with the sword, though he cannot compel to the positive worshipping of Him: if a Christian prince subdue a pagan nation, he cannot force them with the sword to a positive receiving of the doctrine of the Gospel, but if it be a nation expressly blaspheming Christ, as the nation of the Jews now do, he may compel them to an abstinence from a professed blaspheming of Christ, because he is to use the sword against blasphemy.

4. The weapons of the Church as the Church are not carnal, but spiritual and mighty through God.</p></blockquote>

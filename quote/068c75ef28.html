<main class="wrap"><figure class="quote" id="q-068c75ef28" data-kw="">
<blockquote><p>Now, my young friends, I will tell you, if you are ever tempted for a moment, to give heed to those who would persuade you to renounce your belief in the Bible as a divine revelation, what you must be able to prove, before you can consistently venture on infidel ground. You must be able to show that the miracles of which the Bible contains a record, either were never performed, or if they were, that they do not prove its divine authority. If you take the former side of the alternative, and say that these miracles were never performed, you must still admit either that they were pretended to be performed, or they were not.

If they were pretended to be performed, as recorded in scripture, it behoves you to show how it was that so many competent witnesses, and among them the most malignant enemies, in circumstances the most favourable for detecting imposture, and for several years in succession, should actually have been deceived. If you say that they were not pretended to be performed, then you have to account for the fact that such a record of them as that which the Bible contains, should have been made, at the very time when the imposture — if it were one — was most open to detection; and that it should have been circulated first among the very persons who would have been most interested and most able to detect it; who yet never even pretended to call the facts in question.

If you say that the record of these miracles was not made during the age in which they were professedly performed, but that it was palmed upon some succeeding age, then you have to account for the fact that the whole mass of historical testimony fixes the date of this record to nearly the period in which they are alleged to have been performed; and you have this additional difficulty to solve; — how a record of facts, purporting to have occurred under the observation of the very people to whom the record was first given, could have been received by them as a true record, when, at the same time, no such facts had ever fallen within their knowledge.

But if you choose the latter side of the alternative, and say that these miracles were actually wrought, but still do not prove the Bible to be a divine revelation; — you have then to show either that the God of truth would give the stamp of his authority to falsehood, or else that these mighty works were performed by the aid of evil spirits; for that they transcended the limits of human power, admits of no question. The former of these suppositions — that Jehovah has lent his sanction to falsehood — you will not dare to admit, even in thought. If you admit the latter, and refer the miracles of the Bible to diabolical agency, then you have this great moral phenomenon to explain — how the enemy of all good came to be so heartily and earnestly engaged in the destruction of his own kingdom; for the manifest tendency of all the miracles of the Bible was to promote the cause of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sprague.html">William Sprague</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Young People (3rd edn, New York: D. Appleton &amp; Co., 1835), pp 63-65.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d9fb555af" data-kw="">
<blockquote><p>Consider causality. Here are four philosophical positions you could hold: Only God has causal power. (Occasionalism) Nothing has causal power, things just happen to move in certain ways onto which the mind projects generalizations. (Humeanism) Secondary causality exists; things other than God have causal power. (Thomism) Finite things have causal power; drop the bit about God. (Secular Aristotelianism) From a presuppositionalist perspective, one will think that, while the wisdom of this age led modern philosophers to these four positions, the Christian thinker can find a fifth. But the problem is there aren’t any other options. And, I’ve watched presuppositionalists try to solve this one. They almost always cite favorably David Hume’s skepticism about causality. Then they proceed to occasionalism, joining arms together with Medieval Islamic philosopher Al-Ghazali, and modern (Christian) philosophers Malebranche, Berkeley, and Leibniz. However, in my view, the idea that things have causal power (3 &amp; 4) is the superior view of causality, for a number of reasons… This position is simply better able to explain the world around us. The other positions are worse, or even absurd. (Imagine thinking that fire does not have the power to burn wood. God just jigs it up to look that way.) Presuppositionalism does not result in avoiding philosophy. It results in unstudied, tendentious philosophical conclusions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology</cite>, (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>It is first established that God neither is nor can be the author of sin… With this truth asserted, the question is: whether and how God concurs with the free cause toward the act of sin?… the common sense of all is that God does not concur with the formal element of sin, whatever that is, but only with the material and the substrate of the formal… For even the heretics do not say that God formally determines toward formal malice; indeed, Calvin explicitly says at (bk. 1, Institutes, ch. 18) that God does not will the treachery.</p></blockquote>

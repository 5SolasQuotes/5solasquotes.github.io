<main class="wrap"><figure class="quote" id="q-311b6056a9" data-kw="">
<blockquote><p>For what true-born Dutchman does not glow with the warmest affection for a prince, whom God, by conferring all manner of accomplishments, has rendered the delight of mankind? Who, like an auspicious star has shined on the world, deeply plunged and sunk in darkness. Who, in a word, from the ashes of his father, is providentially come forth to light, as the genuine phoenix of our days, and appears to be born only for the welfare of his country. When the Netherlands were trodden underfoot, distressed, and just on the brink of ruin, then heaven appointed you to relieve, to deliver them, and repel their calamities. The distressed republic flies for refuge to your bosom, being only sure to find an asylum there.

Your British subjects also, being almost ruined by the wicked designs of their kings, had long ago been chained, enslaved, and become the prey of lawless tyranny, had not your Majesty hastened to relieve them, while spreading out their suppliant hands towards you, nay, and to relieve them with that resolution, prudence and constancy, and with that success which their annals shall declare, to the amazement of posterity, who will hardly believe it. That expedition shall stand transmitted through ages, which was laid with incredible secrecy, notwithstanding so many piercing and watchful eyes, and undertaken with that resolution, in the winter and end of the year, amidst so many fearful dangers of a tempestuous ocean, did preserve and maintain to the queen of Islands, her liberty, her laws, her religion, and whatever is valuable and dear to generous breasts.

And is it to be wondered, that Britain, thus rescued under God, by your Majesty’s aid, now destitute of a ruler, her ill-advised king James being expelled, not by your Majesty, nor by the people of England, but by the stings of his own conscience; neither forced away, but voluntarily flying, should gratefully submit to her preserver and deliverer? Indeed to your Majesty, together with your most religious consort, Mary Augusta, by right of succession, the sceptre of the vacant kingdom devolved. And even in those circumstances, your Majesty had declined accepting it, though offered by both houses of parliament, had any besides yourself, and faithful consort, been found worthy to govern Britain, and capable to settle her distracted state, to maintain her liberty, and quash the efforts of envy. the pleasure and happiness of that station, but the thorns and difficulties thereof; neither your ambition, but the public necessity, constrained you to take the reins of government.</p></blockquote>

<blockquote><p>In the first place, what is the great object for which the Christian Church was instituted, apart from those secondary and subordinate ones, which it may attain, but for which it was not primarily established? There can be no doubt that Scripture represents the one great object of the establishment of a Church in the world to be the glory of God, in the salvation of sinners, by means of the publication of the gospel. For this end the Church was instituted at first; for this end it continues to exist from one generation to another; and it is only in so far as it accomplishes this one grand object of its existence, that it serves the proper and primary purpose of a Church at all.

Judging, then, by this first test, we are warranted in saying, that to hold and to preach the true faith or doctrine of Christ is the only sure and infallible note or mark of a Christian Church, because this is the one thing for the sake of which a Church of Christ has been instituted on earth. A true faith makes a true Church, and a corrupt faith a corrupt Church; and should it at any time apostatize from the true faith altogether, it would, by the very act, cease to be a Church of Christ in any sense at all. The Church was established for the sake of the truth, and not the truth for the sake of the Church.

In the second place, what are those things which, unlike the truth, have been instituted for the sake of the Church, and not the Church for the sake of them? Such, unquestionably, are the ordinances, office-bearers, and discipline which have been established within the Christian society. These being instituted for the advantage and edification of the Church, are, from their very nature, subordinate and secondary to the truth, for the holding and publication of which both they and the Church itself exist.

They may be necessary, and are necessary, for the perfection of the Church, but they are not necessary for its existence. They cannot be accounted fundamental, in the sense that without them it would cease to exist as a Church at all. The single thing essential to the being of a Christian Church on earth is the faith or doctrine of Christ. According to the distinction already laid down, for this thing the Church was instituted, and not this thing for the Church.

Other things, such as sacraments and ordinances, the ministry, and the outward administration of the Church, are not essential to it, but only accidental; they are necessary for its wellbeing, but not for its being. According to the same distinction, these things were instituted for the Church, and not the Church for them. The only true and infallible note or mark of a Church of Christ is the profession of the faith of Christ. According to the well-known saying of Jerome, when speaking of the prevalence of Arianism in the Church of the fourth century: Ecclesia non in parietibus consistit, sed in dogmatum veritate; Ecclesia ibi est, ubi fides vera est.

The one note or mark, then, which is common to every true Church, and peculiar to every true Church, is the profession of the faith of Christ. Whatever be the differences in other respects, whatever be the distinction in outward form or administration, in ordinances, in government, in worship, these things are subordinate to the one criterion of the profession of the true faith, which marks by its presence a true Church, and declares by its absence an apostate one. It is not the succession of outward forms and ordinances, the hereditary derivation from primitive times of a ministry and sacraments, that constitute a Church of Christ, or lay the foundation for its character and privileges.

These things were made for the Church, and not the Church for them. These things may be good to provide for its wellbeing; they will not suffice to prove its existence. It is the succession of the truth alone that marks out a Christian Church; and the stamp of birth and lineage that belongs to it is not the outward apostolic pedigree of its ministers, but the heritage of that faith which apostles first taught and published. It is not the want of a spotless ecclesiastical genealogy, or of sacraments derived by regular succession from primitive times, that will unchurch a Christian society, but the want of that apostolic doctrine which alone marks out a Church of Christ.

At this point, and in the very definition of a Church, begins that error which is developed in the intolerant principles of many in the present day who would unchurch all denominations but their own; and which manifests itself also in that outward formalism — Popish or Tractarian — which ascribes to external ordinances a value and sacredness which belong only to the truth as it is in Jesus.

Admit that the possession of a true faith, and that alone, is of the essence of a Church, and you assign to the truth the place and importance that rightfully belong to it. But join to the possession of the true faith the administration of outward ordinances, as necessary to constitute a Christian Church, and you assign to outward ordinances a rank and value which are not justly theirs, and make them of primary, and not, as they truly are, of secondary importance.</p></blockquote>

d+edification+of+the+Church%2C+are%2C+from+their+very+nature%2C+subordinate+and+secondary+to+the+truth%2C+for+the+holding+and+publication+of+which+both+they+and+the+Church+itself+exist.%0A%0AThey+may+be+necessary%2C+and+are+necessary%2C+for+the+perfection+of+the+Church%2C+but+they+are+not+necessary+for+its+existence.+They+cannot+be+accounted+fundamental%2C+in+the+sense+that+without+them+it+would+cease+to+exist+as+a+Church+at+all.+The+single+thing+essential+to+the+being+of+a+Christian+Church+on+earth+is+the+faith+or+doctrine+of+Christ.+According+to+the+distinction+already+laid+down%2C+for+this+thing+the+Church+was+instituted%2C+and+not+this+thing+for+the+Church.%0A%0AOther+things%2C+such+as+sacraments+and+ordinances%2C+the+ministry%2C+and+the+outward+administration+of+the+Church%2C+are+not+essential+to+it%2C+but+only+accidental%3B+they+are+necessary+for+its+wellbeing%2C+but+not+for+its+being.+According+to+the+same+distinction%2C+these+things+were+instituted+for+the+Church%2C+and+not+the+Church+for+them.+The+only+true+and+infallible+note+or+mark+of+a+Church+of+Christ+is+the+profession+of+the+faith+of+Christ.+According+to+the+well-known+saying+of+Jerome%2C+when+speaking+of+the+prevalence+of+Arianism+in+the+Church+of+the+fourth+century%3A+Ecclesia+non+in+parietibus+consistit%2C+sed+in+dogmatum+veritate%3B+Ecclesia+ibi+est%2C+ubi+fides+vera+est.%0A%0AThe+one+note+or+mark%2C+then%2C+which+is+common+to+every+true+Church%2C+and+peculiar+to+every+true+Church%2C+is+the+profession+of+the+faith+of+Christ.+Whatever+be+the+differences+in+other+respects%2C+whatever+be+the+distinction+in+outward+form+or+administration%2C+in+ordinances%2C+in+government%2C+in+worship%2C+these+things+are+subordinate+to+the+one+criterion+of+the+profession+of+the+true+faith%2C+which+marks+by+its+presence+a+true+Church%2C+and+declares+by+its+absence+an+apostate+one.+It+is+not+the+succession+of+outward+forms+and+ordinances%2C+the+hereditary+derivation+from+primitive+times+of+a+ministry+and+sacraments%2C+that+constitute+a+Church+of+Christ%2C+or+lay+the+foundation+for+its+character+and+privileges.%0A%0AThese+things+were+made+for+the+Church%2C+and+not+the+Church+for+them.+These+things+may+be+good+to+provide+for+its+wellbeing%3B+they+will+not+suffice+to+prove+its+existence.+It+is+the+succession+of+the+truth+alone+that+marks+out+a+Christian+Church%3B+and+the+stamp+of+birth+and+lineage+that+belongs+to+it+is+not+the+outward+apostolic+pedigree+of+its+ministers%2C+but+the+heritage+of+that+faith+which+apostles+first+taught+and+published.+It+is+not+the+want+of+a+spotless+ecclesiastical+genealogy%2C+or+of+sacraments+derived+by+regular+succession+from+primitive+times%2C+that+will+unchurch+a+Christian+society%2C+but+the+want+of+that+apostolic+doctrine+which+alone+marks+out+a+Church+of+Christ.%0A%0AAt+this+point%2C+and+in+the+very+definition+of+a+Church%2C+begins+that+error+which+is+developed+in+the+intolerant+principles+of+many+in+the+present+day+who+would+unchurch+all+denominations+but+their+own%3B+and+which+manifests+itself+also+in+that+outward+formalism+%E2%80%94+Popish+or+Tractarian+%E2%80%94+which+ascribes+to+external+ordinances+a+value+and+sacredness+which+belong+only+to+the+truth+as+it+is+in+Jesus.%0A%0AAdmit+that+the+possession+of+a+true+faith%2C+and+that+alone%2C+is+of+the+essence+of+a+Church%2C+and+you+assign+to+the+truth+the+place+and+importance+that+rightfully+belong+to+it.+But+join+to+the+possession+of+the+true+faith+the+administration+of+outward+ordinances%2C+as+necessary+to+constitute+a+Christian+Church%2C+and+you+assign+to+outward+ordinances+a+rank+and+value+which+are+not+justly+theirs%2C+and+make+them+of+primary%2C+and+not%2C+as+they+truly+are%2C+of+secondary+importance.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%3A+A+Treatise+on+the+Nature%2C+Powers%2C+Ordinances%2C+Discipline%2C+and+Government+of+the+Christian+Church%2C+ed.+D.+Douglas+Bannerman+%282+vols%2C+Edinburgh%3A+T+%26+T+Clark%2C+1868%29%2C+1%3A+59-61.&amp;url=https%3A%2F%2F5solasquo <blockquote><p>Men may be very straight and tender in the Word of God, and bold in reference to suffering, and yet fail and be very defective in the prosecution of Church censure against erroneous men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

— John Currie, An Essay on Separation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMen+may+be+very+straight+and+tender+in+the+Word+of+God%2C+and+bold+in+reference+to+suffering%2C+and+yet+fail+and+be+very+defective+in+the+prosecution+of+Church+censure+against+erroneous+men.%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F98041e35a6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/98041e35a6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=Men%20may%20be%20very%20straight%20and,of%20Church%20censure%20against%20erroneous%20men&amp;text=Men%20may%20be%20very%20straight%20and%20tender%20in&amp;text=the%20prosecution%20of%20Church%20censure%20against%20erroneous%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2d979a8a04" data-kw="">
<blockquote><p>They made great lamentation. Luke doth also commend their profession of godliness and faith in their lamentation. For a doleful and unprosperous end causeth men, for the most part, to forsake those causes wherein they were delighted before. But, on the other side, these men declare by their mourning, that they are no whit terrified with the death of Stephen from standing stoutly in the approbation of their cause; considering therewithal what great loss God’s Church suffered by the death of one man.

And we must reject that foolish philosophy which willeth all men to be altogether blockish that they may be wise. It must needs be that the Stoics were void of common sense who would have a man to be without all affection. Certain mad fellows would gladly bring in the same dotings into the Church at this day, and yet, notwithstanding, although they require an heart of iron of other men, there is nothing softer or more effeminate than they. They cannot abide that other men should shed one tear; if anything fall out otherwise than they would wish, they make no end of mourning. God doth thus punish their arrogancy jestingly, (that I may so term it,) seeing that he setteth them to be laughed at even by boys.

But let us know that those affections which God hath given to man’s nature are, of themselves, no more corrupt than the author himself; but that they are first to be esteemed according to the cause; secondly, if they keep a mean and moderation. Surely that man which denieth that we ought to rejoice over the gifts of God is more like a block than a man; therefore, we may no less lawfully sorrow when they be taken away.

And lest I pass the compass of this present place, Paul doth not altogether forbid men mourning, when any of their friends are taken away by death, but he would have a difference between them and the unbelievers; because hope ought to be to them a comfort and a remedy against impatience. For the beginning of death caused us to sorrow for good causes; but because we know that we have life restored to us in Christ, we have that which is sufficient to appease our sorrow. In like sort, when we are sorry that the Church is deprived of rare and excellent men, there is good cause of sorrow; only we must seek such comfort as may correct excess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 326-28.</span></figcaption>

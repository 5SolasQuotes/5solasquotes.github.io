<main class="wrap"><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.1c</span></figcaption>

</figure><figure class="quote" id="q-c89569f066" data-kw="councils can err">
<blockquote><p>The question does not simply concern the invisible church of the elect or the universality of believers, whether it can err in the foundation (which our doctrine concerning the perseverance of the saints sufficiently proves is slanderously charged upon us), but whether it is to be said to be so infallible as to be exposed to no error (which we deny). The question is not properly of the collective visible church of believers, but especially of the representative church in councils and of the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.2</span></figcaption>

</figure><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-942957c3d0" data-kw="">
<blockquote><p>Accordingly we see that the Councils to which this specious coloring is given, are no other than six or seven spurious Councils held after the light of sound doctrine was extinguished, and discipline had decayed, and when the merest dolts were present — Councils which exhibit no appearance of ancient dignity, but smack of the Gothic tyranny of the Roman See.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>

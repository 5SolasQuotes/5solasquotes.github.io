<main class="wrap"><figure class="quote" id="q-32d1da2e3c" data-kw="">
<blockquote><p>There is much spurious humility among many of the dear saints of God. It is thought by some, that to be always doubting one&#x27;s pardon and acceptance, is the evidence of a lowly spirit. It is, allow us to say, the mark of the very opposite of a lowly and humble mind. That is true humility that credits the testimony of God, — that believes because he has spoken it, — that rests in the blood, and righteousness, and all-sufficiency of Jesus, because he has declared that &quot;whoever believes in him shall be saved.&quot; This is genuine lowliness, — the blessed product of the Eternal Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, pp. 74–75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></span><span class="t"><a href="../topics/the-christian-life/humility-and-meekness.html">Humility and Meekness</a> › <a href="../topics/the-christian-life/humility-and-meekness/humility.html">Humility</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>

</figure><figure class="quote" id="q-1ef2c0c632" data-kw="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>

</figure><figure class="quote" id="q-a155569413" data-kw="">
<blockquote><p>When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, pp. 70–71</span></figcaption>

</figure><figure class="quote" id="q-7c73d67f29" data-kw="">
<blockquote><p>This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.</p></blockquote>

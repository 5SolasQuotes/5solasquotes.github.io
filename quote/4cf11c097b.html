<main class="wrap"><figure class="quote" id="q-4cf11c097b" data-kw="">
<blockquote><p>As for the prelate, who is pretended to be the pastor of pastors and an ecclesiastical creature, having majority of power, both of order and jurisdiction above the pastor and doctor, the Church of Scotland did ever repute such an one the fifth element, and the sixth finger in the hand, as having no warrant in the Word, and therefore unlawful, Ex. 25:9; Heb. 8:5; 1 Chron. 8. 19. 11, 12, 13; 1 Kings 6:38, as also expressly condemned, Lk 22:24-26; 1 Pet. 5:3-4; Mt. 18:18; 1 Cor. 5:4-6; Acts 1:23; 15:24. In the first constitution and infancy of our Church there were some visitors and superintendents for planting of churches, because breasts and hair of our churches were not grown, after the example of the apostles, who sent such to plant and visit churches, and appoint elders in congregations, Acts 8:14-16; 13:14-16; 14:23; Tit. 1:5-9; 21:17-18, but after the Church was planted there was no need of such. Titular doctors, who were pastors only, and taught not in the schools, but were only previous dispositions to episcopacy, as [the] blue color prepares a cloth for purple, our Church never allowed, upon the grounds allowing lawful doctors, as the Scripture does, Rom. 12:7-8; 1 Cor. 12:28; Eph. 4:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (1642), ch. 20, 2nd Article, ‘Officers of the Church’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d0ceefed5c" data-kw="">
<blockquote><p>…there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal (1659), ch. 8, When Some Errors are to be Foreborne</cite>, p. 205-206:</span></figcaption>

</figure><figure class="quote" id="q-0c7bcfc779" data-kw="">
<blockquote><p>But we have yet more to do, for the consequence of our argument is also denied both by the prelatical faction and by others [congregationalists] (whom we are more sorry to contradict) holding that reasons fetched from the Jewish Church do better fat the prelates than the consistorians; howsoever now to fetch the form of government for the Church from the Church of the Jews, were, say they, to revive the Old Testament. To me it seems strange that both the one side and the other do when they please reason from the forms of the Jewish Church and yet they will not permit us to reason in like manner. The former go about to prove the prelacy by the high priesthood and the lawful use of organs in the Church from the like in the temple of Solomon. The latter do argue that a congregation has right not only to elect ministers, but to ordain them and lay hands on them because the people of Israel laid hands on the Levites. That the maintenance of the ministers of the Gospel ought to be voluntary, because under the Law God would not have the priests and Levites to have any part or inheritance in the land of Canaan, but to be sustained by the offerings and altars of the Lord. That the power of excommunication is in the body of the Church, because the Lord laid upon all Israel the duty of removing the unclean and of putting away leaven out of their houses at the feast of Passover. Is it right dealing now to forbid us to reason from the form of the Jews? I will not use any further expostulation, but let the reader judge. The truth is this, even as that which is in a child, as he is a child, agrees not to a man, yet that which is in a child, as he is animal rationale, agrees also to a man: so what we find in the Jewish Church, as it was Jewish or in infancy and under the pedagogy of the Law, agrees not indeed to the Christian Church. But whatsoever the Jewish Church had as it was a political Church, or ecclesiastical republic (of which sort of things, the diversity and subordination of ecclesiastical courts was one) does belong by the same reason to the Christian Church. I say further, though the commonwealth and civil policy of the Jews be not in all points a pattern to our civil policy, yet I am sure it is no error to imitate the civil policy of the Jews in such things as they had, not for any special reason proper to them, but are common to all well constituted commonwealths, and so we may argue from their commonwealth that it is a good policy to have diverse civil courts and the higher to receive appellations from the inferior, as it was among them. Shall we not by the very like reason fetch from their ecclesiastical republic, diversity of spiritual courts, and the supreme to receive appellations from the inferior, because so was the constitution of the Jewish Church and that under the common respect and account of a political Church, and not for any special reason which does not concern us.</p></blockquote>

"../quote/0c7bcfc779.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/church-government/#:~:text=But%20we%20have%20yet%20more%20to,reason%20which%20does%20not%20concern%20us&amp;text=But%20we%20have%20yet%20more%20to%20do%2C%20for&amp;text=any%20special%20reason%20which%20does%20not%20concern%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

</figure><figure class="quote" id="q-61e1f1f8ad" data-kw="">
<blockquote><p>But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgie and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640 the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacy (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was, that I setled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.</cite></span></figcaption>

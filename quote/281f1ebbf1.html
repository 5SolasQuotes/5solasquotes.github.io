<main class="wrap"><figure class="quote" id="q-281f1ebbf1" data-kw="">
<blockquote><p>From this discrepancy between the Hebrew [Jews’] books [i.e. the Septuagint] and our own arises the well-known question as to the age of Methuselah; for it is computed that he lived for fourteen years after the deluge, though Scripture relates that of all who were then upon the earth only the eight souls in the ark escaped destruction by the flood, and of these Methuselah was not one… …that they may not cast a slight on the trustworthiness of versions which the Church has received into a position of high authority, and because they believe that the Jewish manuscripts rather than our own are in error. For they do not admit that this is a mistake of the [Septuagint] translators, but maintain that there is a falsified statement in the original, from which, through the Greek, the Scripture has been translated into our own tongue. They say that it is not credible that the seventy translators, who simultaneously and unanimously produced one rendering, could have erred, or, in a case in which no interest of theirs was involved, could have falsified their translation; but that the Jews, envying us our translation of their Law and Prophets, have made alterations in their texts so as to undermine the authority of ours. This opinion or suspicion let each man adopt according to his own judgment. Certain it is that Methuselah did not survive the flood, but died in the very year it occurred, if the numbers given in the Hebrew manuscripts are true. My own opinion regarding the seventy translators I will, with God’s help, state more carefully in its own place, when I have come down (following the order which this work requires) to that period in which their translation was executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God</cite>, bk. 15, ch. 11</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a04ecba4ce" data-kw="">
<blockquote><p>They [the Masoretes] together with the Sopherim themselves gave the most diligent attention to accurate preservation of the Hebrew Scriptures that has ever been devoted to any ancient literature, secular or religious, in the history of human civilization. So conscientious were they in their stewardship of the holy text that they did not even venture to make the most obvious corrections, so far as the consonants were concerned, but left their Vorlage [the version of the text they received] exactly as it was handed down to them. Archer concludes quoting W. F. Albright: “We may rest assured that the consonantal text of the Hebrew Bible, though not in- fallible, has been preserved with an accuracy perhaps unparalleled in any other Near Eastern literature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gleason-archer.html">Gleason Archer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of Old Testament Introduction rev</cite>, ed. (Moody, 1974) | ch. 3, ‘The Hebrew Manuscripts &amp; the Early Versions’, pp. 37-54, p. 65</span></figcaption>

<blockquote><p>John Murray was not only one of the most renowned twentieth-century representatives of classical Reformed theology, but also a highly-respected interpreter of Calvin. Here we have Murray’s vigorous refutation of arguments suggesting that Calvin did not teach the inerrancy of Scripture. Murray also demonstrates that Calvin did not consider Christ’s identity as the divine Word to be in any way prejudicial to Scripture being the very Word of God as well.” – Sherman Isbell . on Warfield Gerstner, John – ‘Warfield’s Case for Biblical Inerrancy’ 24 pp. in God’s Inerrant Word: a Symposium on the Trustworthiness of Scripture Warfield has some of the best writings on Inspiration and was a great defender of the Inerrancy of the Original Autographs of the Scriptures. Be aware, though, that, in his adoption of the ‘critical texts’ of Scripture (dug up in the mid-1800’s) and the philosophy behind them, Warfield did quietly drop the doctrine of the special, providential preservation of the Scriptures through the New Testament era *in all ages* (as WCF 1.8 states: “and by his singular care and providence kept pure in all ages, are therefore authentical”). Warfield, unfortunately has been greatly influenctial in this regard towards those who have come after him. For a correction of this, see The Ecclesiastical Text. . . The Chicago Statement on Biblical Inerrancy 1978 Chicago Statement on Biblical Inerrancy with Exposition 19 Articles Sproul, R.C. – Explaining Inerrancy: a Commentary Buy 51 pp. . . The Proof is in the Pudding To see the complete truthfulness of the Scriptural accounts demonstrated in detail, see the ‘Authenticity’ section at the end of each commentary section that we have on most books of the Bible: Old Testament Commentaries New Testament Commentaries . . Bible Difficulties Resolved Below are the top 5 recommendations (from this document) of Dr. Leslie McFall (a late, evangelical Biblical chronologist) out of 120 works from the pre-1900’s era that are in Cambridge University’s library. McFall said, “If you are stuck for time, consult Manasseh Ben Israel first then Baruh.</p></blockquote>

<blockquote><p>The Masoretes… mentioned even what they regarded as unusual accents, vowel points, and spelling. They recorded a number of variant readings — on the average of about one to a page of a printed Hebrew Old Testament— and they made reference to eighteen corrections attributed to the scribes before them… Their high regard for the text that had come down to them is evidenced by their placing in the margin readings which they believed to be correct and leaving the text itself unaltered… The view of P. de Lagarde that after A.D. 130 all manuscripts of the Hebrew Bible were closely fashioned after one archetype which had been decided on not long before that date has not been accepted by all; but it is at least the case that a type of text basically that of the Masoretes existed around A.D. 100 and that this text subsequently overcame whatever competitors it had…. Dr. [William H.] Green calls attention to the fact that Origen and Jerome place on translators or transcribers of the Septuagint the responsibility for the variations of the Septuagint from the Hebrew text known to them and do not entertain any belief that the Hebrew text had been altered. Pfeiffer expresses the opinion that Origen was misled by reason of a virtual fixation of the Hebrew text which had occurred [after the Septuagint but] before his time and by reason of the notable agreement among the available Hebrew manuscripts. But it is nevertheless important to observe that neither Origen nor Jerome nor any other early writer evidences any suspicion that a real revision or a fixation of the Hebrew text had occurred after the time of the Septuagint. Dr. Green does not deny the possibility that the Septuagint may have been made from a Hebrew text considerably, if not substantially, different from the text in use in Origen’s day. He thinks it quite possible that there may have been some inferior manuscripts of the Old Testament in use, especially among Jews outside of Palestine; but he holds that, even if this were the case, it would not follow that no authoritative text then existed and that there were no standard copies from which the traditional text has descended. He states a truth quite important in this connection that ‘reverence for the Scriptures and regard for the purity of the sacred text did not first originate after the fall of Jerusalem.’ …the counting of the letters, words, verses, and sections in all the books, the noting of the location of the middle letters and words of every book, and the marking of them at times by a letter of abnormal size. He [William Green] remarks that the Talmud regards all this as old and as performed by the early scribes.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Masoretes… mentioned even what they regarded as unusual accents, vowel points, and spelling. They recorded a number of variant readings — on the average of about one to a page of a printed Hebrew Old Testament— and they made reference to eighteen corrections attributed to the scribes before them… Their high regard for the text that had come down to them is evidenced by their placing in the margin readings which they believed to be correct and leaving the text itself unaltered… The view of P. de Lagarde that after A.D. 130 all manuscripts of the Hebrew Bible were closely fashioned after one archetype which had been decided on not long before that date has not been accepted by all; but it is at least the case that a type of text basically that of the Masoretes existed around A.D. 100 and that this text subsequently overcame whatever competitors it had…. Dr. [William H.] Green calls attention to the fact that Origen and Jerome place on translators or transcribers of the Septuagint the responsibility for the variations of the Septuagint from the Hebrew text known to them and do not entertain any belief that the Hebrew text had been altered. Pfeiffer expresses the opinion that Origen was misled by reason of a virtual fixation of the Hebrew text which had occurred [after the Septuagint but] before his time and by reason of the notable agreement among the available Hebrew manuscripts. But it is nevertheless important to observe that neither Origen nor Jerome nor any other early writer evidences any suspicion that a real revision or a fixation of the Hebrew text had occurred after the time of the Septuagint. Dr. Green does not deny the possibility that the Septuagint may have been made from a Hebrew text considerably, if not substantially, different from the text in use in Origen’s day. He thinks it quite possible that there may have been some inferior manuscripts of the Old Testament in use, especially among Jews outside of Palestine; but he holds that, even if this were the case, it would not follow that no authoritative text then existed and that there were no standard copies from which the traditional text has descended. He states a truth quite important in this connection that ‘reverence for the Scriptures and regard for the purity of the sacred text did not first originate after the fall of Jerusalem.’ …the counting of the letters, words, verses, and sections in all the books, the noting of the location of the middle letters and words of every book, and the marking of them at times by a letter of abnormal size. He [William Green] remarks that the Talmud regards all this as old and as performed by the early scribes.”

— John H. Skilton, ‘The Transmission of the Hebrew Text’ from ‘The Transmission of the Scriptures’ in eds. N.B. Stonehouse &amp; Paul Woolley, The Infallible Word: A Symposium by the Members of the Faculty of Westminster Theological Seminary, rev. ed. (Philadelphia: Presbyterian &amp; Reformed, 1967) at Bible-Researcher">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Masoretes%E2%80%A6+mentioned+even+what+they+regarded+as+unusual+accents%2C+vowel+points%2C+and+spelling.+They+recorded+a+number+of+variant+readings+%E2%80%94+on+the+average+of+about+one+to+a+page+of+a+printed+Hebrew+Old+Testament%E2%80%94+and+they+made+reference+to+eighteen+corrections+attributed+to+the+scribes+before+them%E2%80%A6+Their+high+regard+for+the+text+that+had+come+down+to+them+is+evidenced+by+their+placing+in+the+margin+readings+which+they+believed+to+be+correct+and+leaving+the+text+itself+unaltered%E2%80%A6+The+view+of+P.+de+Lagarde+that+after+A.D.+130+all+manuscripts+of+the+Hebrew+Bible+were+closely+fashioned+after+one+archetype+which+had+been+decided+on+not+long+before+that+date+has+not+been+accepted+by+all%3B+but+it+is+at+least+the+case+that+a+type+of+text+basically+that+of+the+Masoretes+existed+around+A.D.+100+and+that+this+text+subsequently+overcame+whatever+competitors+it+had%E2%80%A6.+Dr.+%5BWilliam+H.%5D+Green+calls+attention+to+the+fact+that+Origen+and+Jerome+place+on+translators+or+transcribers+of+the+Septuagint+the+responsibility+for+the+variations+of+the+Septuagint+from+the+Hebrew+text+known+to+them+and+do+not+entertain+any+belief+that+the+Hebrew+text+had+been+altered.+Pfeiffer+expresses+the+opinion+that+Origen+was+misled+by+reason+of+a+virtual+fixation+of+the+Hebrew+text+which+had+occurred+%5Bafter+the+Septuagint+but%5D+before+his+time+and+by+reason+of+the+notable+agreement+among+the+available+Hebrew+manuscripts.+But+it+is+nevertheless+important+to+observe+that+neither+Origen+nor+Jerome+nor+any+other+early+writer+evidences+any+suspicion+that+a+real+revision+or+a+fixation+of+the+Hebrew+text+had+occurred+after+the+time+of+the+Septuagint.+Dr.+Green+does+not+deny+the+possibility+that+the+Septuagint+may+have+been+made+from+a+Hebrew+text+considerably%2C+if+not+substantially%2C+different+from+the+text+in+use+in+Origen%E2%80%99s+day.+He+thinks+it+quite+possible+that+there+may+have+been+some+inferior+manuscripts+of+the+Old+Testament+in+use%2C+especially+among+Jews+outside+of+Palestine%3B+but+he+holds+that%2C+even+if+this+were+the+case%2C+it+would+not+follow+that+no+authoritative+text+then+existed+and+that+there+were+no+standard+copies+from+which+the+traditional+text+has+descended.+He+states+a+truth+quite+important+in+this+connection+that+%E2%80%98reverence+for+the+Scriptures+and+regard+for+the+purity+of+the+sacred+text+did+not+first+originate+after+the+fall+of+Jerusalem.%E2%80%99+%E2%80%A6the+counting+of+the+letters%2C+words%2C+verses%2C+and+sections+in+all+the+books%2C+the+noting+of+the+location+of+the+middle+letters+and+words+of+every+book%2C+and+the+marking+of+them+at+times+by+a+letter+of+abnormal+size.+He+%5BWilliam+Green%5D+remarks+that+the+Talmud+regards+all+this+as+old+and+as+performed+by+the+early+scribes.%E2%80%9D%0A%0A%E2%80%94+John+H.+Skilton%2C+%E2%80%98The+Transmission+of+the+Hebrew+Text%E2%80%99+from+%E2%80%98The+Transmission+of+the+Scriptures%E2%80%99+in+eds.+N.B.+Stonehouse+%26+Paul+Woolley%2C+The+Infallible+Word%3A+A+Symposium+by+the+Members+of+the+Faculty+of+Westminster+Theological+Seminary%2C+rev.+ed.+%28Philadelphia%3A+Presbyterian+%26+Reformed%2C+1967%29+at+Bible-Researcher&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ad5ec154a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ad5ec154a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/textual-criticism-of-the-old-testament/#:~:text=mentioned%20even%20what%20they%20regarded%20as,as%20performed%20by%20the%20early%20scribes&amp;text=mentioned%20even%20what%20they%20

<main class="wrap"><figure class="quote" id="q-83d9d40e9b" data-kw="">
<blockquote><p>They did not hold that faith was the only thing which invariably accompanies justification, or even that it was the only thing required of men in order to their being justified; for they admitted that repentance was necessary to forgiveness, in accordance with the doctrine of our [Westminster] standards, that, ‘to escape the wrath and curse of God due to us for sin, God requireth of us repentance unto life,’ [WSC #85] as well as ‘faith in Jesus Christ.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology (Edinburgh: T&amp;T Clark, 1863), vol. 2, ch. 21, ‘Justification’, section 1, ‘Popish &amp; Protestant Views’</cite>, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>I had never read one Socinian, nor much of any Arminians… and I remembered two or three things in Dr. [William] Twisse (whom I most esteemed) which inclined me to moderation in the five Articles [disputed between Arminians and the Reformed at Dort]: … 5. That faith is but causa dispositiva justificationis [a cause by way of disposition of justification], and so is repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.</cite></span></figcaption>

</figure><figure class="quote" id="q-e00340263b" data-kw="">
<blockquote><p>And here the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2nd pt., ch. 5, p. 349 of A Treatise of the Covenant of Grace (London, 1645)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-4866fffea8" data-kw="">
<blockquote><p>3rd Exception: They [Papists] say, we are indeed to believe our salvation on God’s part: but we must needs doubt in regard of ourselves: because the promises of remission of sins are given upon condition of man’s faith and repentance. Now we cannot (say they) be assured that we have true faith and repentance, because we may lie in secret sins, and so want that indeed which we suppose ourselves to have. Answer: I say again, he that does truly repent and believe, does by God’s grace know that he does repent and believe: for else Paul would never have said, ‘Prove yourselves whether you be in the faith or not:’ and the same apostle says, 2 Cor. 12, ‘We have not received the spirit of the world, but the Spirit which is of God, that we might know the things which are given of God:’ which things are not only life everlasting, but justification, sanctification, and such like. And as for secret sins, they cannot make our repentance void: for he that truly repents of his known sins, repents also of such as be unknown, and receives the pardon of them all. God requires not an express or special repentance of unknown sins; but accepts it as sufficient, if we repent of them generally: as David says, Ps. 19. ‘Who knows the errors of this life: forgive me my secret sins.’ And whereas they add that faith and repentance must be sufficient, I answer that the sufficiency of our faith and repentance stands in the truth and not in the measure or perfection thereof; and the truth of both where they are, is certainly discerned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic... (Cambridge, 1598), 3rd Point, Certainty of Salvation, ‘Our Reasons to the Contrary’</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-a279f3b688" data-kw="">
<blockquote><p>The commandment to embrace the Mediator by faith also conjoins repentance: according to that saying of John the Baptist, Mk. 1:15, Repent ye, and believe the Gospel. Thus God Himself from heaven reveals the Mediator, and commands that He be embraced by true faith, Mt. 17:5, this is my beloved Son, in whom I am well pleased; hear ye Him. The promise is expressed, Jn. 3:16, God so loved the world, that He gave His only begotten Son, that whosoever believeth in Him should not perish, but have everlasting life. … The external call, which ordinarily is made through the ministers and preachers of the word, concerns adults, and not the elect alone, even if these primarily, but also reprobates, to whom God also reveals the Mediator, and, should they repent, commands them to expect life from Him: and that unto this end, that, with the condition of repentance and faith neglected, without which salvation through Christ come to no one, they are made ἀναπολόγητοι or inexcusable, and understand the just cause of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), Gospel-Offer &amp; Covenant of Grace Wendelin (1584-1652)</cite></span></figcaption>

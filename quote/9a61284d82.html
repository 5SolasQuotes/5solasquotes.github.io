<main class="wrap"><figure class="quote" id="q-9a61284d82" data-kw="">
<blockquote><p>In the second part of this first testimony is declared further: — 1. What Christ will moreover do: He will “sing praises unto God;” and, 2. Where he will do it: “In the midst of the congregation.” The expression of both these is accommodated unto the declaration of God’s name and of praising him in the temple.

1. The singing of hymns of praise unto God in the great congregation was then a principal part of his worship. And in the first expression two things are observable: —

(1.) What Christ undertakes to do; and that is, to praise God. Now this is only exegetical of what went before. He would praise God by declaring his name. There is no way whereby the praise of God may be celebrated like that of declaring his grace, goodness, and love unto men; whereby they may be won to believe and trust in him, whence glory redounds unto him. (2.) The cheerfulness and alacrity of the spirit of Christ in this work. He would do it as with joy and singing, with such a frame of heart as was required in them who were to sing the praises of God in the great assemblies in the temple.

2. Where would he do this? קָהָ֣ל בְּת֖וֹךְ, “in the midst of the congregation,” — “the great congregation,” as he calls it, verse 23; that is, the great assembly of the people in the temple. And this was a type of the whole church of the elect under the new testament. The Lord Christ, in his own person, by his Spirit in his apostles, by his word, and by all his messengers unto the end of the world, setting forth the love, grace, goodness, and mercy of God in him the mediator, sets forth the praise of God in the midst of the congregation.

I shall only add, that whereas singing of hymns unto God was an especial part of the instituted worship under the old testament, to whose use these expressions are accommodated, it is evident that the Lord Christ hath eminently set forth this praise of God in his institution of worship under the new testament, wherein God will ever be glorified and praised. This was that which the Lord Christ engaged to do upon the issue of his sufferings; and we may propose it unto our example and instruction …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 425-26.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>

</figure><figure class="quote" id="q-9465ee833f" data-kw="">
<blockquote><p>Have I caused my family to go with me to the Church? And did I with them come in due time, and being there, did stay the whole time of prayer, reading, and preaching of the Word, singing of Psalms, receiving and administering the Sacraments, even that of Baptism, when others are baptized, and did attend diligently, and join with the minister and the rest of the congregation in all those holy exercises?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scudder on the Church’s Public Worship</cite>, pp. 101-2</span></figcaption>

</figure><figure class="quote" id="q-8032717e6d" data-kw="">
<blockquote><p>Oh! the wise invention of the teacher who contrived that while we were singing we should at the same time learn something useful; by this means, too, the teachings are in a certain way impressed more deeply on our minds. Even a forceful lesson does not always endure, but what enters the mind with joy and pleasure somehow becomes more firmly impressed upon it.

What, in fact, can you not learn from the psalms? Can you not learn the grandeur of courage? The exactness of justice? The nobility of self-control? The perfection of prudence? A manner of penance [repentance]? The measure of patience? And whatever other good things you might mention? Therein is perfect theology, a prediction of the coming of Christ in the flesh, a threat of judgment, a hope of resurrection, a fear of punishment, promises of glory, an unveiling of mysteries; all things, as if in some great public treasury, are stored up in the Book of Psalms.

To it, although there are many musical instruments, the prophet adapted the so-called harp, showing, as it seems to me, that the gift from the Spirit resounded in his ears from above. With the cithara and the lyre the bronze from beneath responds with sound to the plucking, but the harp has the source of its harmonic rhythms from above, in order that we may be careful to seek the things above and not be borne down by the sweetness of the melody to the passions of the flesh. And I believe this, namely, that the words of prophecy are made clear to us in a profound and wise manner through the structure of the instrument, because those who are orderly and harmonious in soul possess an easy path to the things above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 10 on Psalm 1</cite>, 2 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 153-54.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

What, in fact, can you not learn from the psalms? Can you not learn the grandeur of courage? The exactness of justice? The nobility of self-control? The perfection of prudence? A manner of penance [repentance]? The measure of patience? And whatever other good things you might mention? Therein is perfect theology, a prediction of the coming of Christ in the flesh, a threat of judgment, a hope of resurrection, a fear of punishment, promises of glory, an unveiling of mysteries; all things, as if in some great public treasury, are stored up in the Book of Psalms.

To it, although there are many musical instruments, the prophet adapted the so-called harp, showing, as it seems to me, that the gift from the Spirit resounded in his ears from above. With the cithara and the lyre the bronze from beneath responds with sound to the plucking, but the harp has the source of its harmonic rhythms from above, in order that we may be careful to seek the things above and not be borne down by the sweetness of the melody to the passions of the flesh. And I believe this, namely, that the words of prophecy are made clear to us in a profound and wise manner through the structure of the instrument, because those who are orderly and harmonious in soul possess an easy path to the things above.”

— Basil of Caesarea, Homily 10 on Psalm 1, 2 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 153-54.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COh%21+the+wise+invention+of+the+teacher+who+contrived+that+while+we+were+singing+we+should+at+the+same+time+learn+something+useful%3B+by+this+means%2C+too%2C+the+teachings+are+in+a+certain+way+impressed+more+deeply+on+our+minds.+Even+a+forceful+lesson+does+not+always+endure%2C+but+what+enters+the+mind+with+joy+and+pleasure+somehow+becomes+more+firmly+impressed+upon+it.%0A%0AWhat%2C+in+fact%2C+can+you+not+learn+from+the+psalms%3F+Can+you+not+learn+the+grandeur+of+courage%3F+The+exactness+of+justice%3F+The+nobility+of+self-control%3F+The+perfection+of+prudence%3F+A+manner+of+penance+%5Brepentance%5D%3F+The+measure+of+patience%3F+And+whatever+other+good+things+you+might+mention%3F+Therein+is+perfect+theology%2C+a+prediction+of+the+coming+of+Christ+in+the+flesh%2C+a+threat+of+judgment%2C+a+hope+of+resurrection%2C+a+fear+of+punishment%2C+promises+of+glory%2C+an+unveiling+of+mysteries%3B+all+things%2C+as+if+in+some+great+public+treasury%2C+are+stored+up+in+the+Book+of+Psalms.%0A%0ATo+it%2C+although+there+are+many+musical+instruments%2C+the+prophet+adapted+the+so-called+harp%2C+showing%2C+as+it+seems+to+me%2C+that+the+gift+from+the+Spirit+resounded+in+his+ears+from+above.+With+the+cithara+and+the+lyre+the+bronze+from+beneath+responds+with+sound+to+the+plucking%2C+but+the+harp+has+the+source+of+its+harmonic+rhythms+from+above%2C+in+order+that+we+may+be+careful+to+seek+the+things+above+and+not+be+borne+down+by+the+sweetness+of+the+melody+to+the+passions+of+the+flesh.+And+I+believe+this%2C+namely%2C+that+the+words+of+prophecy+are+made+clear+to+us+in+a+profound+and+wise+manner+through+the+structure+of+the+instrument%2C+because+those+who+are+orderly+and+harmonious+in+soul+possess+an+easy+path+to+the+things+ab

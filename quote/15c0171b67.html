<main class="wrap"><figure class="quote" id="q-15c0171b67" data-kw="">
<blockquote><p>THE Case handled in the following Discourse is of as great Moment as almost any thing that I know of; a right understanding of this Truth is necessary, &amp; the disputes of the present times call unto a more accurate and distinct enquiry into it. The danger is great, whiles some in pretence of honouring free Grace, despise the Command, and open a door of Licentiousness; and others to avoid this, verge as much to the Contrary extreme, and bring in a New-Covenant of Works: the keeping a due distance between both of these is a Christian’s wisdom: which is done, when we give to the LAW what is it’s due, and to GRACE that which belongs to it. If what is here offered, may Contribute any thing to the Information, or Establishment of any so as to help them to steer steady between these Rocks; the Publication of it will not be unseasonable: which that it may, I Commend it to the Divine Blessing,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The law established by the Gospel or, A brief discourse, wherein is asserted and declared, the great honour which is put upon the law of God, in the Gospel way of justification be faith alone. Being the substance of a sermon preached on the lecture in Boston, September 20. 1694</cite>, (Boston MA: Michael Perry, 1694), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/antinomians/use-of-the-law.html">Antinomians: Use of the Law</a></span></div>

anter.wordpress.com/2020/07/17/samuel-willard-on-avoiding-the-extremes-of-antinomianism-and-neonomianism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cc1f36030" data-kw="">
<blockquote><p>It is most surprising to me that anyone can claim that I reject the law or the Ten Commandments, since there is available, in more than one edition, my exposition of the Ten Commandments, which furthermore are daily preached and practiced in our churches. (I am not even mentioning the Confession and the Apology and our other books). Furthermore, the commandments are sung in two versions, as well as painted, printed, carved, and recited by the children morning, noon, and night. I know of no manner in which we do not use them, unless it be that we unfortunately do not practice and paint them with our deeds and our life as we should. I myself, as old and as learned as I am, recite the commandments daily word for word like a child. So if anyone perchance gained some other impression from my writings and yet saw and perceived that I stressed the catechism so greatly, he might in all fairness have addressed me and said, “Dear Dr. Luther, how is it that you emphasize the Ten Commandments so much, though your teaching is that they are to be discarded?” That is what they should have done, and not worked secretly behind my back and waited for my death, after which they could make of me what they would. Ah well, let them be forgiven who cease doing this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Against the Antinomians’ in Luther’s Works</cite>, vol. 47: The Christian in Society IV, ed. Pelikan, Oswald &amp; Lehmann (Philadelphia: Fortress Press, 1999), pp. 109–110</span></figcaption>

</figure><figure class="quote" id="q-32c2da0271" data-kw="">
<blockquote><p>If religion do not include the gospel, we are yet upon the old covenant of works, according to which none can be justified. If it do not include the law in the hands of a mediator, then “we turn the grace of God unto wantonness.” If it shut out Jesus Christ and have no use of him, how can either we or our performances stand or be accepted before his holy eyes?

If it exclude the law that Christ came to establish, how can he be pleased with our religion? both of these offer an indignity to the Son of God. The sum, then, of Christian religion is believing and sanctification of the Spirit unto obedience. That is the root and fountain, this is the fruit and stream; justification of our persons, and sanctification of our lives and hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heart-Humiliation: or, Miscellany Sermons, Preached upon some choice texts, at several solemn occasions</cite>, (1676) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 3: 34-35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/antinomians/use-of-the-law.html">Antinomians: Use of the Law</a></span></div>

If it exclude the law that Christ came to establish, how can he be pleased with our religion? both of these offer an indignity to the Son of God. The sum, then, of Christian religion is believing and sanctification of the Spirit unto obedience. That is the root and fountain, this is the fruit and stream; justification of our persons, and sanctification of our lives and hearts.”

</figure><figure class="quote" id="q-23748f47af" data-kw="">
<blockquote><p>In 1534 Philip Melancthon, perhaps in conjunction with lectures on Colossians delivered around the same time, produced a third edition of the Scholia. In it for the first time, he increased the number of functions, or uses, of the law from two to three… …It involved the persistent emphasis on the necessity of good works… …The notion that the law has uses or functions is a peculiarly Protestant concept with origins deep within Martin Luther’s theology. Gerhard Ebeling has demonstrated how the distinction between law and gospel and Luther’s insistence that God works on human beings through the Word resulted in Luther developing a twofold use of the Law… …Definitions of two uses of the law first appeared in an exposition of the epistle lesson for New Year’s Day; this sermon was published in 1522 as part of Luther’s Weihnachtspostil and seen through the presses by Melancthon. … Luther never saw a need to increase the uses of the law above two and thus create a separate use for believers… For Luther, the human being encountered the law in the two realms of human existence: coram Deo [before the presence of God] and coram hominibus [before the presence of men]. Thus, there was never any need for more than two uses of the law. In his theology the law never had an independent existence that demanded definition, but it was always a part of the human encounter with God. The 1527 and 1528 Scholia were the first publications in which Melancthon explicitly defined two functions of the law… …in 1534 Melancthon altered this section [of his Scholia on Col. 2:17] to read: “…God gave the law for these three reasons: to coerce the flesh and to terrify or humble. The third reason pertains to the righteous, that they may practice obedience.”… …The conscience, made good by God’s gracious declaration, must by necessity use the law to please God. No wonder Melancthon’s theology now needed a third use of the law! … For what reasons did this shift occur in Melancthon’s theology? As Rolf Schafer and others have pointed out, Melancthon’s focus on the law and its third use actually had its roots in his earliest published theology… But the very fact that Melancthon somehow felt constrained to change these earlier comments to reflect even more clearly his developing position suggests that something must have happened in the meantime. A crucial factor is the memory of Melancthon’s encounter with John Agricola. There is little doubt that Agricola’s denigration of the Decalogue–itself a reaction to Melancthon’s theology–caused Melancthon to strengthen his defense of the role of the law in the Christian’s life… … There was no question, too, that some of the changes in the Scholia–one thinks particularly of the third use of the law–were refined by Melancthon in his second edition of the Loci [Common Places] and in turn employed by a young French exile, John Calvin, in the first edition of his Institutes of the Christian Religion [1536].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-wengert.html">Timothy Wengert</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Law &amp; Gospel</cite>, [Repentance] (1997), Ch. 6, ‘Justifying Good Work: The Origins of the Concept of the Third Use of the Law (1534)’, pp. 177, 185, 191-3, 195-6, 200, 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/antinomians/use-of-the-law.html">Antinomians: Use of the Law</a></span></div>

80%9C%E2%80%A6God+gave+the+law+for+these+three+reasons%3A+to+coerce+the+flesh+and+to+terrify+or+humble.+The+third+reason+pertains+to+the+righteous%2C+that+they+may+practice+obedience.%E2%80%9D%E2%80%A6+%E2%80%A6The+conscience%2C+made+good+by+God%E2%80%99s+gracious+declaration%2C+must+by+necessity+use+the+law+to+please+God.+No+wonder+Melancthon%E2%80%99s+theology+now+needed+a+third+use+of+the+law%21+%E2%80%A6+For+what+reasons+did+this+shift+occur+in+Melancthon%E2%80%99s+theology%3F+As+Rolf+Schafer+and+others+have+pointed+out%2C+Melancthon%E2%80%99s+focus+on+the+law+and+its+third+use+actually+had+its+roots+in+his+earliest+published+theology%E2%80%A6+But+the+very+fact+that+Melancthon+somehow+felt+constrained+to+change+these+earlier+comments+to+reflect+even+more+clearly+his+developing+position+suggests+that+something+must+have+happened+in+the+meantime.+A+crucial+factor+is+the+memory+of+Melancthon%E2%80%99s+encounter+with+John+Agricola.+There+is+little+doubt+that+Agricola%E2%80%99s+denigration+of+the+Decalogue%E2%80%93itself+a+reaction+to+Melancthon%E2%80%99s+theology%E2%80%93caused+Melancthon+to+strengthen+his+defense+of+the+role+of+the+law+in+the+Christian%E2%80%99s+life%E2%80%A6+%E2%80%A6+There+was+no+question%2C+too%2C+that+some+of+the+changes+in+the+Scholia%E2%80%93one+thinks+particularly+of+the+third+use+of+the+law%E2%80%93were+refined+by+Melancthon+in+his+second+edition+of+the+Loci+%5BCommon+Places%5D+and+in+turn+employed+by+a+young+French+exile%2C+John+Calvin%2C+in+the+first+edition+of+his+Institutes+of+the+Christian+Religion+%5B1536%5D.%E2%80%9D%0A%0A%E2%80%94+Timothy+Wengert%2C+Law+%26+Gospel%2C+%5BRepentance%5D+%281997%29%2C+Ch.+6%2C+%E2%80%98Justifying+Good+Work%3A+The+Origins+of+the+Concept+of+the+Third+Use+of+the+Law+%281534%29%E2%80%99%2C+pp.+177%2C+185%2C+191-3%2C+195-6%2C+200%2C+206&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23748f47af.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23748f47af <blockquote><p>Is it possible to find a single instance in Scripture of accepted worship that was not prescribed by God? In the first act of worship recorded after the Fall, we are told that the person and offering of Cain were rejected, whilst those of Abel were accepted. Apart from the fact that a mere thank-offering, although it might suit an angel or an unfallen man, was totally unsuitable for a sinner, it is clear that there was a divine appointment of sacrifice pointing to the cross of Christ, for it is said, “By faith Abel offered unto God a more excellent sacrifice than Cain.”

Now faith implies a revelation or a testimony on which to rest, and it is evident that by the first promise in Eden, and the emblematical coats of skins, implying that the innocent must suffer that the guilty might be clothed, the doctrine of substitution was taught to our first parents before they were driven from the scene of their transgression. From the very first, therefore, acceptable worship was coupled with God’s appointment of sacrifice, and with the principle that “without shedding of blood there is no remission.”

Proceeding on this central principle, when men ceased to use their simple altars of earth or stone, and when an elaborate system of worship was introduced embodying still clearer types and emblems of the coming Messiah and His work, nothing was left to the invention of Moses, although so eminent in wisdom, and although God spake to him “as a man speaketh to his friend.” The most minute arrangements were made by God in regard to all parts of worship down to the pins of the tabernacle, and He said to Moses, “See thou do all things after the pattern shewed thee on the Mount.” God said, “What thing soever I command you, observe to do it; thou shalt not add thereto nor diminish from it.”

When David gave instructions to Solomon in regard to building the temple, it is said he gave “the pattern of all that he had by the Spirit;” and at the end he repeats this Divine appointment as follows:—“All this, said David, the Lord made me understand in writing by His hand upon me; even all the works of this pattern” (1 Chron. xxviii. 19). Every deviation from this, even in the smallest particular, and even when a good motive might have been pleaded, was condemned and resented by God.

By and by this system, with all its peculiarities, as having served its purpose, was done away with, and we emerge into the clearer light of the New Testament dispensation as foretold by Christ to the woman of Samaria. But the same principle still continues, and is clearly enforced. Christ commands His apostles to go and teach all nations, but still it is with this solemn injunction, “Teaching them to observe all things whatsoever I have commanded you;” it is not whatsoever I have not forbidden.

They were simply ambassadors for Christ, acting under written and limited instructions which were also in the hands of all the people, that all might judge how far they acted in accordance with them. Accordingly, when the Apostle Paul gives instructions in regard to the Sacrament of the Lord’s Supper, he says, “I have received of the Lord that which also I delivered unto you.” There is no permission to be found in the Word of God to alter, add to, or modify the ordinances of Christ.</p></blockquote>

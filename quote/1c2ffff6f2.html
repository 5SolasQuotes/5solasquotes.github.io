<blockquote><p>All divines, the fathers, as Augustine, Chrysostom, Ambrose, Jerome, Thomas, Bannes, Suarez, Vasquez, Valentia, make private exhorting and rebuking our fallen brother a duty of the law of nature… to reduce him whom we understand God has permitted to wander…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), p. 258</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4855f5d7d2" data-kw="">
<blockquote><p>For if we be bound to hold out our left cheek to strangers which will smite us on the right cheek: how much more ought we to suffer an extreme and unkind husband? But yet I mean not that a man should beat his wife; God forbid that, for that is the greatest shame that can be, not so much to her that is beaten, as to him that does the deed. But if by such fortune thou chancest upon such an husband, take it not too heavily, but suppose thou, that thereby is laid up no small reward hereafter, and in this lifetime no small commendation to thee, if thou canst be quiet. But yet to you that be men, thus I speak: Let there be none so grievous fault to compel you to beat your wives. But what say I, your wives? no, it is not to be born with that an honest man should lay hands on his maid servant to beat her. Wherefore if it be a great shame for a man to beat his bondservant, much more [of a] rebuke it is to lay violent hands upon his freewoman. And this thing may be well understood by the laws which the Panims have made, which does discharge her any longer to dwell with such an husband, as unworthy to have any further company with her that does smite her. For it is an extreme point, thus so vilely to entreat her like a slave, that is fellow to thee of thy life, and so joined unto thee before time in the necessary matters of thy living. And therefore a man may well liken such a man (if he may be called a man, rather then a wild beast) to a killer of his father or his mother. And whereas we be commanded to forsake our father and mother, for our wife’s sake, and yet thereby do work them none injury, but do fulfill the Law of God… Who can worthily express the inconvenience that is to see what weepings and walings be made in the open streets when neighbors run together to the house of so unruly an husband, as to a Bedlem man, who goes about to overturn all that he has at home? Who would not think that it were better for such a man to wish the ground to open, and swallow him in, than once ever after to be seen in the market?… Understand that God has given thee children with her, and art made a father, and by such reason appease thyself. Doest thou not see the husbandmen what diligence they use to till that ground which once they have taken to farm, though it be never so full of faults? As for an example, though it be dry, though it brings forth weeds, though the soil cannot bear too much wet, yet he tills it, and so wins fruit thereof… But thou peradventure wilt say that she is a wrathful woman, a drunkard, and beastly, without wit and reason. For this cause bewail her the more. Chase not in anger, but pray unto Almighty God. Let her be admonished and helped with good counsel, and do thou thy best endevor, that she may be delivered of all these affections. But if thou shouldest beat her, thou shalt increase her evil affections: For frowardness and sharpness is not amended with frowardness, but with softness and gentleness. Furthermore, consider what reward thou shalt have at God’s hand: For where thou mightest beat her, and yet, for the respect of the fear of God, thou wilt abstain and bear patiently her great offences, the rather in respect of that Law which forbids that a man should cast out his wife what fault soever she be made the combred with, thou shalt have a very great reward, and before the receit of that reward, thou shalt feel many commodities. For by this meanes she shall bee more obedient, and thou for her sake shalt be made the more meek.</p></blockquote>

<blockquote><p>Notwithstanding of all the multiplicity of Popish orders, yet Peter Lombard (pt. 4, distinction 4) treading the vestiges of the primitive simplicity, did observe that the apostles left only two sacred orders to be perpetual in the Church, the order of deacons and the order of elders. The administration of deacons is exercised about things bodily. The administration of elders about things spiritual. The former about the goods: the latter about the government of the Church. Now elders are of three sorts: 1. Preaching Elders, or Pastors, 2. Teaching Elders or Doctors, 3. Ruling Elders. All these are elders, because they have voice in presbyteries and all assemblies of the Church, and the government of the Church is incumbent to them all: nor only to the pastor and elder, but to the doctor also. The bishop of Dune, in his Examen conjurationis Scoticae [‘Examination of the Scottish Conjuration’], p. 35, alleges that our Church of Scotland did never yet determine whether doctors and deacons have right of voicing in the consistories and assemblies of the Church. But had he read our book of Policy, he might have found that it excludes deacons from being members of presbyteries and assemblies, ch. 8, but admits doctors into the same, ch. 5. The doctor being an elder, as said is, should assist the pastor in the government of the Kirk and concur with the elders, his brethren, in all assemblies, by reason the interpretation of the Word, which is [the] only judge in ecclesiastical matters, is committed to his charge. But they differ in that the pastor labors in the Word of exhortation, that is, by the gift of wisdom, applies the Word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labours in the Word of doctrine, that is, without such applications as the pastor uses, by simple teaching he preserves the truth and sound interpretation of the Scriptures against all heresy and error. The ruling elder does neither of these, but labours in the government and policy of the Church only. The apostle has distinguished these three sorts of elders, 1 Tim. 5:17, ‘Let elders that rule well be counted worthy of double honour, especially they who labour in the Word and doctrine,’ where, as Beza notes, he distinguishes the Word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7-8, he distinguishes teaching from exhortation: and 1 Cor. 12:8 puts the Word of wisdom and the word of knowledge for two different things. Now beside those elders which labour in the Word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the Word nor doctrine, but in ruling well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, …. (Edinburgh: Bryson, 1641), ch. 2, pp. 8-10</span></figcaption>

d+that+in+season+and+out+of+season%2C+as+he+knows+their+particular+cases+to+require.+The+doctor+labours+in+the+Word+of+doctrine%2C+that+is%2C+without+such+applications+as+the+pastor+uses%2C+by+simple+teaching+he+preserves+the+truth+and+sound+interpretation+of+the+Scriptures+against+all+heresy+and+error.+The+ruling+elder+does+neither+of+these%2C+but+labours+in+the+government+and+policy+of+the+Church+only.+The+apostle+has+distinguished+these+three+sorts+of+elders%2C+1+Tim.+5%3A17%2C+%E2%80%98Let+elders+that+rule+well+be+counted+worthy+of+double+honour%2C+especially+they+who+labour+in+the+Word+and+doctrine%2C%E2%80%99+where%2C+as+Beza+notes%2C+he+distinguishes+the+Word%2C+which+is+the+pastor%E2%80%99s+part%2C+from+doctrine%2C+which+is+the+doctor%E2%80%99s+part.+Even+as+Rom.+12%3A7-8%2C+he+distinguishes+teaching+from+exhortation%3A+and+1+Cor.+12%3A8+puts+the+Word+of+wisdom+and+the+word+of+knowledge+for+two+different+things.+Now+beside+those+elders+which+labour+in+the+Word%2C+and+those+which+labor+in+doctrine%2C+Paul+speaks+to+Timothy+of+a+third+sort+of+elders%2C+which+labor+neither+in+the+Word+nor+doctrine%2C+but+in+ruling+well.%E2%80%9D%0A%0A%E2%80%94+Geroge+Gillespie%2C+An+Assertion+of+the+Government+of+the+Church+of+Scotland+in+the+Points+of+Ruling-Elders%E2%80%A6.+%28Edinburgh%3A+Bryson%2C+1641%29%2C+ch.+2%2C+pp.+8-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d7bd346a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d7bd346a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/teachers/#:~:text=Notwithstanding%20of%20all%20the%20multiplicity%20of,nor%20doctrine%2C%20but%20in%20ruling%20well&amp;text=Notwithstanding%20of%20all%20the%20multiplicity%20of%20Popish%20orders&amp;text=the%20Word%20nor%20doctrine%2C%20but%20in%20ruling%20well" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Augustine says with us, we are in mercy ‘to rebuke what we cannot amend, and to bear it patiently.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 10, p. 149</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Augustine says with us, we are in mercy ‘to rebuke what we cannot amend, and to bear it patiently.&#x27;”

</figure><figure class="quote" id="q-926007b7e7" data-kw="">
<blockquote><p>…there is another judgment [besides that proper to individual believing Christians] that is ministerial, official and authoritative… that what the shepherd teaches others God revealed to him first, and is put forth in a ministerial and official judging either in synods, or in public pastoral sermons and authoritative, but ministerial publishing the will and mind of Christ. Mal. 2:7, ‘They shall seek the Law from his mouth.’ Heb. 13:7,17. That way the people depends upon the ministerial judgment of synods and pastors… For pastors and synods teach fundamentals of faith ministerially to the people, and by hearing of them is faith begotten in the hearers… For this judgment authoritative as it is in the head of the Church (Christ) as in the fountain and only Law-giver, so it is ministerially only and by way of office in the elders, as the will and mind of the king is in the inferior judge, the ambassador or herald, not in the people; and the people are obliged ‘to obey those that are over them in the Lord, who watch for their souls, as those who must give an account’… and of this it is said, ‘he that heareth you’ (ministers of the Gospel, not the people) ‘heareth Me, he that dispiseth you dispiseth Me.’ And this is more than a privilege of order and honor, which one Christian has above another in regard of eminence of graces, gifts, and of wisdom, experience, and age: it is a privilege of office to speak in the name of the Lord, and yet it is inferior to a privilege of the law, because the Lord only imposes laws upon the conscience: for it is a middle judgment less than legislative, supreme and absolute over the conscience; this is in none save only in the King and head of the Church, and is royal and princely; Yet is it more (I say not more excellent, it not being saving of itself as in believers) than a privilege of mere honor and order, for though it lay no more bands on the conscience to obtain faith, because it is holden forth by men, it having no influence on the conscience because of men, whose word is not the formal object of faith, yet has it an official authority from pastors (which is not merely titulary) so as they may ministerially and officially command obedience to their judgment as far as it agrees with the mind of Christ, no farther: and when it is disobeyed may inflict censures, which private Christians cannot do, and puts these who disobey under another guiltiness than if private Christians did speak the same word, to wit not only in a case of disobedience to the Second Commandment, but in a state of disobedience to the Fifth Commandment formally, as not honoring father and mother; whereas to disobey that same word by way of counsel in the mouth of a brother, though it be the breach of the Fifth Commandment also [if the brother be superior in age, gifts, etc.], yet not in such a manner as when we refuse to hear the messenger of the Lord of Hosts; and his judgment as a messenger of God is public and binds as public to [the] highest obedience to the Fifth Commandment; but as it is a judgment of faith common to the doctor with other Christians, it binds as the mind of God holding faith in the Second Commandment what we are to believe.</p></blockquote>

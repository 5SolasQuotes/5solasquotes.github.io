<main class="wrap"><figure class="quote" id="q-60822eb805" data-kw="Councils">
<blockquote><p>Wherefore, though our opponents should name councils of thousands of bishops it will little avail them; nor will they induce us to believe that they are, as they maintain, guided by the Holy Spirit, until they make it credible that they assemble in the name of Christ: since it is as possible for wicked and dishonest to conspire against Christ, as for good and honest bishops to meet together in his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-942957c3d0" data-kw="">
<blockquote><p>Accordingly we see that the Councils to which this specious coloring is given, are no other than six or seven spurious Councils held after the light of sound doctrine was extinguished, and discipline had decayed, and when the merest dolts were present — Councils which exhibit no appearance of ancient dignity, but smack of the Gothic tyranny of the Roman See.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>

</figure><figure class="quote" id="q-ec975dbf30" data-kw="Councils Authority of councils Sola Scriptura">
<blockquote><p>What, then, you will say, is there no authority in the definitions of councils? Yes, indeed; for I do not contend that all councils are to be condemned, and all their acts rescinded, or, as it is said, made one complete erasure. But you are bringing them all (it will be said) under subordination, and so leaving every one at liberty to receive or reject the decrees of councils as he pleases. By no means; but whenever the decree of a council is produced, the first thing I would wish to be done is, to examine at what time it was held, on what occasion, with what intention, and who were present at it; next I would bring the subject discussed to the standard of Scripture. … In this way, councils would be duly respected, and yet the highest place would be given to Scripture, everything being brought to it as a test.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a> › <a href="../topics/church-government-and-the-ministry/synods-and-assemblies/authority-of-synods.html">Authority of synods</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-ac32f176d6" data-kw="">
<blockquote><p>The Supreme Judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Spirit speaking in the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 1.10</span></figcaption>

</figure><figure class="quote" id="q-67509949cf" data-kw="Councils under Scripture">
<blockquote><p>The weightiest controversies have been determined and settled in councils, but not by the absolute authority of the council itself, but by the judgment and authority of scripture in the council. Pious bishops never assembled to define a point themselves by their own authority, but by that of scripture. Therefore all religious councils have ascribed the supreme decision to the scriptures. … Since, then, councils, whenever they are good and pious, follow the scriptures, it is manifest that the supreme authority of judging belongs to the scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 6</span></figcaption>

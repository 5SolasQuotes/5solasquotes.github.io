<main class="wrap"><figure class="quote" id="q-2b88affb2e" data-kw="">
<blockquote><p>Sometimes we argue or reason from the general to the special: as, All men may marry who have not the gift of Chastity, ergo, Priests and ministers may marry. And contrary from the special to the general in a part: as, Abraham was justified by faith, therefore man may be justified by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-ramus.html">Petrus Ramus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Logic Newly Translated</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><figure class="quote" id="q-3b016a99c9" data-kw="">
<blockquote><p>The sum of the whole discussion amounts to this: [1] that celibacy is better than marriage, because it has more liberty, so that persons can serve God with greater freedom; but at the same time, that [2] no necessity ought to be imposed, so as to make it unlawful for individuals to marry, if they think proper; and farther, that [3] marriage itself is a remedy appointed by God for our infirmity, which all ought to use that are not endowed with the gift of continency. Every person of sound judgment will join with me in acknowledging and confessing, that the whole of Paul’s doctrine on this point is comprehended in these three articles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 7, v. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><figure class="quote" id="q-e88490c0b8" data-kw="">
<blockquote><p>When one asked him concerning marriage, whether it were good to marry; seeing sometimes, when concupiscence pricked him, he was moved to it, and some other time when he felt no such thing, he thought he might abstain from it: He answered, many come hastily into that calling, not vying the means of trying their estate thoroughly before; as namely, whether they by prayer, fasting, and avoiding all occasions of concupiscence, have the gift of chastity or no? Many use some of the means, and not all: many use all the means, but a small time: therefore it is good to use first the means, not part of them, but all of them: not for a while, but long. If so be that all these things will not prevail, attend upon the Lord’s ordinance, and wait when the Lord shall give just occasion of using that estate, to his glory and our comfort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

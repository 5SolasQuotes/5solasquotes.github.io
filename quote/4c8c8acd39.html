<main class="wrap"><figure class="quote" id="q-4c8c8acd39" data-kw="">
<blockquote><p>And it is much less praise-worthy if godly bishops be enjoined, laying aside, or at least changing the honest and ancient apparel which the apostles wore, to wit, that common and grave habit, to put on the ridiculous and execrable or accursed garment of godless Mass-priests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, p. 54</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-810a0efac6" data-kw="">
<blockquote><p>As you allow me to speak freely, I solemnly assure you I have been most scrupulously adverse from strife and contention. I have taught nothing which did not naturally arise from the passage on which I was lecturing; yea, when occasions of speaking on the habits [vestments] have come in my way, I have ever avoided them. But I do not deny that I have said our ministry [in the Church in England] has deviated from that of the primitive and apostolic church, to the purity of which I wished ours to be conformed: but this I said in so candid and modest a way, that none but ignorant or malicious persons could find fault. Yet I hear that I am accused to your excellency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by Alexander Grosart in the biographical preface</cite>, p. ix, to A Commentary upon the Epistle… to the Colossians</span></figcaption>

</figure><figure class="quote" id="q-3ca928498c" data-kw="">
<blockquote><p>The church and its supreme governor demanded obedience in all things indifferent. Nonconformists (and it was in this context that the word ‘nonconformist’ first entered the English religious vocabulary) complained that to enforce the use of these things on reluctant consciences was to deprive them of their indifference. The doctrine of ‘Christian liberty’ which came to the fore in these circumstances, was arguably the taproot of that species of Christian conviction known ever since as Puritanism. It was not equivalent to individualistic license, but rather to a conviction that the edification of the church, composed of ‘lively stones’, required the emancipation of conscience from all human ordinances and its total subjection to the word of God… … In 1566 Archbishop Matthew Parker, in consultation with his suffragans and prompted by the queen, published some ‘Advertisements,’ a call to strict conformity… The resultant crisis rocked both the universities of Oxford and Cambridge and came to its head in London, toward Easter 1566. Thirty-seven ministers, much of the preaching ministry in London, at first refused to conform and were suspended; of these a few, the hardest of the hard core, were eventually deprived of their livings… …the Vestiarian Controversy introduced a lasting fault line into the Elizabethan church. The more drastic presbyterianism of the 1570’s might never have come about if it had not been for the episcopal ‘persecution’ of those who cast off the surplice in the 1560’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-collinson.html">Patrick Collinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Vestiarian Controversy’ in Oxford Encyclopedia of the Reformation</cite>, (1996), vol. 4, pp. 231-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

1996%29%2C+vol.+4%2C+pp.+231-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3ca928498c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3ca928498c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=The%20church%20and%20its%20supreme%20governor,off%20the%20surplice%20in%20the%201560%E2%80%99s&amp;text=The%20church%20and%20its%20supreme%20governor%20demanded%20obedience&amp;text=who%20cast%20off%20the%20surplice%20in%20the%201560%E2%80%99s" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), pp. 11-13</span></figcaption>

<blockquote><p>§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 9 in Remains (London: Parkhurst, 1684), pp. 219-20</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.”

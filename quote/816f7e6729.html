<blockquote><p>3. Touching the material parts of the sacrament, what elements He appointed: even such as of all other are of most general use among all nations, bread and wine, those which most befit a common salvation, Jude verse 2, and a common Savior, 1 John 2:1.

4. Touching the formal part of it, which consists in his manner of consecration, and the analogy between the outward elements and spiritual and heavenly things signified under them, that it may be known to be a spiritual meat [food], even the Word, the bread of life, and spiritual drink, even the quickening and enlivening Spirit.</p></blockquote>

</figure><figure class="quote" id="q-5f508fedcc" data-kw="">
<blockquote><p>1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living Images in this extent. I pass by the instance of the woman of Tekoah, 2 Sam. 14, because the bare history proves not the lawfulness. But Paul’s speaking as of himself and Apollos the things which concerned others, was approvable: And as Christ frequently taught by parables, so his parables were a description of good and evil, by the way of feigned history, as if such and such things had been done by such persons as never were. And this fiction is no falsehood; For the hearer knows that it is not meant as an historical narrative, but a parable; And it is but an image in words, or a painted doctrine. And if a person and action may be feigned by words, I know not where it is forbidden to feign them by personal representation. Therefore to personate another is not simply a sin.

2. To personate good men in good actions is not simply unlawful: because:

1. It is not unlawful as it is personating, as is showed:

2. Nor as lying: Because it is not an asserting, but a representing; nor so taken.

3. To personate a bad man in a bad action, is more dubious; but seems not to be in all cases unlawful. To pass by David’s feigning himself mad (as of uncertain quality) it is common with preachers to speak oft the words of wicked men, as in their names or persons, to disgrace them: And Prov. 5:11-12, etc. comes near it. And whether Job be a history, or a dialogue personating such speakers, is doubted by the most learned expositors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes], p. 877</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-8af35392ec" data-kw="">
<blockquote><p>And here, that we may not be drawn aside by the prevalence of vulgar error, it should be understood that ceremonies are not, therefore, unlawful, because they are significant. For the holy kiss, respecting which mention is made in Rom. 16:16, was a sign by which they wished to signify the fraternal love and union of all Christians. And even the learned Peter Martyr, is so far from rejecting ceremonies because they are significant, that he says, ‘they are the more laudable, if, in the way of sermons, they admonish us of some duty.’ (on 1 Cor. 11)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, tr. Josiah Allport (1634; 1846), Determination 20, ‘The English Church is fully competent to bind to the observance of ceremonies’, p. 331 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>

</figure><figure class="quote" id="q-364bdb303f" data-kw="">
<blockquote><p>Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.”

— King James I, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDr.+%5BJohn%5D+Rainolds+objected+the+example+of+the+brazen+serpent%2C+demolished+and+stamped+to+powder+by+Ezekiel%2C+because+the+people+abused+it+to+idolatry%3A+wishing%2C+that%2C+in+like+sort%2C+the+cross+should+be+abandoned%2C+because+in+the+time+of+Popery+it+had+been+superstitiously+abused.+Whereunto+the+King%E2%80%99s+Majesty+answered+diverse+ways%3A+First%2C+quoth+he%2C+though+I+be+sufficiently+persuaded+of+the+cross+in+baptism%2C+and+the+commendable+use+thereof+in+the+Church+so+long%3A+yet%2C+if+there+were+nothing+else+to+move+me%2C+this+very+argument+were+an+inducement+to+me+for+the+retaining+of+it%2C+as+it+is+now+by+order+established%3A+For%2C+inasmuch%2C+as+it+was+abused%2C+so+you+say%2C+to+superstition+in+time+of+popery%2C+it+does+plainly+imply%2C+that+it+was+well+used+before+Popery.+I+will+tell+you%2C+I+haue+lived+among+this+%5Bdissenting%5D+sort+of+men+%28speaking+to+the+lords+and+bishops%29+ever+since+I+was+ten+years+old%2C+but+I+may+say+of+myself+as+Christ+did+of+Himself%3A+Though+I+lived+amongst+them%2C+yet+since+I+had+ability+to+judge%2C+I+was+never+of+them%3B+neither+did+anything+make+me+more+to+condemn+and+detest+their+courses+than+that+they+did+so+peremptorily+disallow+of+all+things+which+at+all+had+been+used+in+Popery.+For+my+part%2C+I+know+not+how+to+answer+the+objection+of+the+Papists%2C+when+they+charge+us+with+novelties%3A+but+truly+to+tell+them+that+their+abuses+are+new%2C+but+the+things+which+they+abused+we+retain+in+their+primitive+use%2C+and+forsake+only+the+novel+corruption.+By+this+argument+we+might+renounce+the+Trinity+and+all+that+is+holy%2C+because+it+was+abused+in+Popery+%28and+speaking+to+Doctor+Rainolds+merely%29+they+used+to+wear+hose+and+shoes+in+Popery%2C+therefore%2C+you+shall%2C+now%2C+go+barefoot.+Secondly%2C+quoth+his+Majesty%2C+what+resemblance+is+there+between+the+brazen+serpent%2C+a+material+visible+thing%2C+and+the+sign+of+the+cross+made+in+the+air%3F+Thirdly%2C+I+am+given+to+understand+by+the+bishops%2C+and+I+find+it+true%2C+that+the+Papists+themselves+did+never+ascribe+any+power+or+spiritual+grace+to+the+sign+of+the+cross+in+baptism.+Fourthly%2C+you+see%2C+that+the+material+crosses%2C+which+in+time+of+Popery+were+made%2C+for+men+to+fall+down+before+them%2C+as+they+passed+by+them%2C+to+worship+them+%28as+the+idolatrous+Jews+did+the+brazen+serpent%29+are+demolished%2C+as+you+desire.%E2%80%9D%0A%0A%E2%80%94+King+James+I%2C+ed.+William+Barlow%2C+The+Sum+%26+Substance+of+the+Conference+which+it+pleased+his+excellent+Majesty+to+have+with+the+Lords%2C+Bishops+%26+other+of+his+Clergy%E2%80%A6+at+Hampton+Court%2C+January+14%2C+1603+%28London%3A+Windet%2C+1604%29%2C+2nd+Day%2C+pp.+67-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F364bdb303f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/364bdb303f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Dr.%20%5BJohn%5D%20Rainolds%20objected%20the%20example,serpent%29%20are%20demolished%2C%20as%20you%20desire&amp;text=Dr.%20%5BJohn%5D%20Rainolds%20objected%20the%20example%20of%20the&amp;text=the%20brazen%20serpent%29%20are%20demolished%2C%20as%20you%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

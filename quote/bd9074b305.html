<main class="wrap"><figure class="quote" id="q-bd9074b305" data-kw="">
<blockquote><p>Now adays monarchs pretend always in their titles, to be kings by the grace of God: but how many of them to this end only pretend it, that they may reign without control; for to what purpose is the grace of God mentioned in the title of kings, but that they may acknowledge no superior? In the mean while God, whose name they use, to support themselves, they willingly would tread under their feet. It is therefore a mere cheat when they boast to reign by the grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Daniel</cite>, 4:25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now adays monarchs pretend always in their titles, to be kings by the grace of God: but how many of them to this end only pretend it, that they may reign without control; for to what purpose is the grace of God mentioned in the title of kings, but that they may acknowledge no superior? In the mean while God, whose name they use, to support themselves, they willingly would tread under their feet. It is therefore a mere cheat when they boast to reign by the grace of God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4f94fa4f1" data-kw="">
<blockquote><p>‘Whether to the King.’ It may be questioned, whom the apostle means by the word King? Such as understand the epistle to be written to the Jews, may perhaps conceive that the kings that ruled by deputation in Judea should be meant, such as were Herod and Agrippa. But in as much as the Jews were scattered through the provinces, and those provincial Jews were most in quiet: and in as much as for the reasons afore given, it is likely that the epistle was written to all Christians, both Jews and Gentiles; therefore by the King he meant Caesar.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (d. 1622; 1637), on 1 Tim., 2:13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-21b0057632" data-kw="">
<blockquote><p>Assertion 1 — There is an oath betwixt the king and his people, laying on by reciprocation of bands mutual civil obligation upon the king to the people and the people to the king; 2 Sam. 5:3, “So all the elders of Israel came to the king to Hebron, and king David made a covenant with them in Hebron before the Lord, and they anointed David king over Israel.” 1 Chron. 11:3, “And David made a covenant with them before the Lord, and they anointed David king over Israel, according to the word of the Lord by Samuel.” 2 Chron. 23:2-3, ” And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem. And all the congregation made a covenant with the king [Joash] in the house of God.” 2 Kings 11:17, “Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people; between the king also and the people.” Eccl. 8:2, “I counsel thee to keep the king’s commandment, and that in regard of the oath of God.</p></blockquote>

e</a></div>

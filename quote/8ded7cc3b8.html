<main class="wrap"><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, Book XI, ch. II, Of the Efficacy of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-b945658aed" data-kw="">
<blockquote><p>The first, the most obvious, and the most decisive argument against this doctrine is, that, so far as any work or act of the sinner is concerned, the Bible everywhere teaches that the only indispensable condition of salvation is faith in Jesus Christ.… Whosoever believes on the Son hath everlasting life. This stands firm. It matters not to what Church he may belong; it matters not whether he be Jew or Gentile, bond or free, learned or unlearned, good or bad, baptized or unbaptized, whosoever believes shall be saved.… Neither does the Bible anywhere teach that Christian baptism effects either pardon or regeneration in those still out of Christ.</p></blockquote>

</figure><figure class="quote" id="q-485a9633bd" data-kw="">

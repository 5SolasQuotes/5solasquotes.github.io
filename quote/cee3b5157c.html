<main class="wrap"><figure class="quote" id="q-cee3b5157c" data-kw="">
<blockquote><p>If they [the Resolutioners] say that there is a difference upon the matter betwixt that which is done by them and done by the other [side]: take the matter simply and without respect to their numbers, and we believe the protesting Brethren will be content to stand or fall by it: and if it be the plurality of the number only, we cannot accompt [account] that, especially in a time of corruption, a sufficient plea either for condemning the one or justifying the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (Edinburgh, 1658)</cite>, pp. 23-24</span></figcaption>

</figure><figure class="quote" id="q-f51fbde79a" data-kw="">
<blockquote><p>13. If a pastor preach some unsound doctrines or faultily perform the public worship, or neglect just discipline and receive the unworthy to the communion of the church, or reject the worthy, the presence of the innocent members (who make not the fault their own by consent, or by neglecting their duties to reform it), makes none of this to be their sin, nor is to be taken for a sign of their consent: Nor will the presence of the unworthy deprive the godly of the blessing or comfort of God’s ordinance: Nor are they bound to separate from that church because of these corruptions, unless they are so great as to unchurch that church or make their worship and communion such as God Himself rejects and will not accept: or unless by imposing sin upon them, or some other way, the church expel them, or they have accidentally some other reason to remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing I. a Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians… (London: Parkhurst, 1691), pt. 2, Question 2</cite>, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49c7f784b9" data-kw="">
<blockquote><p>This was the constant judgment of the old non-conformists, which I shall transcribe from a grave author. ‘Those,’ says he: ‘that for many years together, during the reign of the three last princes [Edward VI, James I, Charles I], denied to come up to a full conformity to this [Anglican] Church, had a low oinion of the discipline then exercised (of which they have left behind them large evidences), yet how tender were they of the Church’s honour to keep Christians in communion? How zealous were they against separation? as may appear in the labours of Mr. [Robert] Parker, Mr. [John] Paget, Mr. [John] Ball. Mr. [Thomas] Brightman laid us low enough, when he [in his Commentary on Revelation] did not only parallel us with luke-warm Laodicea, but made that Church the type, and we the antitype, by reason of our discipline; yet how zealous is he against separation from these assemblers, and breaks out in these words: ‘Therefore their error is wicked and blasphemous, who so forsake the Church, as if Christ were altogether banished thence.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bibliographies.html">Bibliographies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London Ministers | A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’</cite>, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

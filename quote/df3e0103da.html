<main class="wrap"><figure class="quote" id="q-df3e0103da" data-kw="">
<blockquote><p>At the forty-first convention on 24 October 1688, the Societies decided against indifference to a Dutch landing and that they would rise, but only in a ‘defensive posture’ in order to avoid ‘snares’, by which they meant committing themselves in advance to Orange’s settlement, and to prevent their own ‘destruction’. If the Dutch landed in England, as was expected, the Societies would not suddenly appear in arms. Only when the Dutch expedition was ‘advanced’ in Scotland, the kingdom ‘in combustion’ and the Societies were pressed to declare which side they were on, would they rise in the ‘part of the country commanded by the Dutch’… Unlike in previous attempted risings, the Societies also agreed their position towards their potential partners in advance. The same convention unanimously concluded not to associate with the Dutch in one body or come under their command, but after ‘some debate’ it agreed to cooperate with them against their common enemy, accept arms and to take Dutchmen to teach them ‘the art of war’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies</cite>, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb363377bd" data-kw="">
<blockquote><p>…simply a question of law in our own church, ‘the Presbyterian Church in the United States,’ the question of whether the Assembly has the power ‘to make law for the church in the matter of ‘offences,’ or to give its deliverances in thesi the force the force of judicial decisions. It had been contended by some that the deliverances of the Assemblies of 1865, 1869, and 1877 obliged the courts of original jurisdiction to discipline for dancing, that is, to exclude every church member convicted of dancing from the privileges of the church; that these courts had no discretion; that they were not allowed to interpret the law of the church for themselves, but must accept the interpretation of the Assembly, albeit that interpretation had not been given in the investigation of a judicial case regularly brought up (that is, in hypothesi), but as an abstract and general proceeding (in thesi)… Before proceeding to vindicate the action of the Assembly [which later said that its theses were ‘only didactic, advisory and monitory’], we beg leave to remind our readers that the principle here involved is one of immense importance. It lies at the root of all the struggles between the advocates of a constitutional government and the advocates of an ‘absolutism’… the essence of the struggle has always been the same… the question has always been, whether the power of the whole is over every part, or only over the power of the part; whether the whole is simply a great wheel, of which the parts are only spokes, or whether it be a wheel of which the parts are also wheels, each having a sphere and movement of its own, yet moving in subordination to the movement of the great wheel…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Powers of the Several Church Courts</cite>, ... (Richmond, 1896), vol. 2, pp. 331-360. Originally published in The Southern Presbyterian Review (April, 1880). Also with an introduction in ed. Hall &amp; Hall, Paradigms in Polity… (Eerdmans, 1994), pp. 585-602. | Peck:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-2d96200e9c" data-kw="">

<blockquote><p>In general I remark that you would gladly have people believe that the sentences of the Church of Scotland against you are upon account of your adhering to the covenanted work of reformation, and testifying against all sins of the time. But this is the ordinary practice of all schismatics, “by good words and fair speeches, to deceive the hearts of the simple,” Rom. 16:17-18, which portion of Scripture, I earnestly commend to your consideration.</p></blockquote>

</figure><figure class="quote" id="q-3801e70079" data-kw="">
<blockquote><p>Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude</cite>, verse 19 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 24</span></figcaption>

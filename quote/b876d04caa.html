</figure><figure class="quote" id="q-6857e8c576" data-kw="">
<blockquote><p>Question: Why did Christ take bread rather than any other element? Answer: …

2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance:

1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’

2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace.

3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy Eucharist</cite>, ... (London, 1668), ‘The Mystery of the Lord’s Supper’, pp. 7-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-c1b9f9054e" data-kw="">
<blockquote><p>It is granted by all sober Protestants that the Church has power of making canons and constitutions for decency and order in the public worship of God; and not only to prescribe the necessary circumstances of time and place, but also to continue and establish those ancient rites of the Christian Church which were practiced in the primitive times and are in themselves of an indifferent nature; which authority of the Church was asserted in the Augustan [Augsburg] Confession [art. 7, 15, 21, 24, Conclusion], and particularly by Mr. Calvin (Institutes, bk. 4, ch. 10, sect. 27. See Thomas Cartwright, [A Reply to an Answer,] bk. 1, [Answer to pp. 20-22,] p. 27), and other worthy persons in the Reformation. Which our [Anglican] reformers also did assume to themselves, as is declared in the 20th Article [of the 39 Articles]; and has been practised and defended against all Dissenters, as well by Scripture (Acts 15:28; 1 Cor. 11:16), as by antiquity and right reason… And the Royal Martyr [King Charles I] was so tender of their reputation that in his answer to the Parliament’s remonstrance, he promises to reform the ceremonies with these cautions:

1. That the reformation were pursued with such modesty and submission that the quiet of the kingdom were not disturbed;

2. Nor the decency and comeliness of God’s service discountenanced;

3. Nor the pious, sober and devout actions of those reverend persons who were the first laborers in the blessed Reformation be scandalized and defamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo</cite>, ‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo: or the Pharisees’ Lesson, showing the Impiety &amp; Unreasonableness of contending for Outward Forms &amp; Ceremonies to the Violation of Obedience, Charity &amp; the Public Peace in The Character of a Separatist, or Sensuality the Ground of Separation... (London: Kettilby, 1677)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-3eb42af139" data-kw="">
<blockquote><p>The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1</cite>, Question 101, ‘Of the Ceremonial Precepts in Themselves’, Article 1, ‘Whether the nature of the ceremonial precepts consists in their pertaining to the worship of God?’, Reply to Objection 1. While Aquinas’s teaching can be taken too far, as Romanists have taken it in setting apart as holy the many various instruments involved with the mass, yet there is an aspect of truth in the teaching.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Divine worship includes not only sacrifices and the like, which seem to be directed to God immediately, but also those things whereby His worshippers are duly prepared to worship Him: thus too in other matters, whatever is preparatory to the end comes under the science whose object is the end. Accordingly those precepts of the Law which regard the clothing and food of God’s worshippers, and other such matters, pertain to a certain preparation of the ministers, with the view of fitting them for the Divine worship: just as those who administer to a king make use of certain special observances. Consequently such are contained under the ceremonial precepts.”

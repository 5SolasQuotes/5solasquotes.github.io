<main class="wrap"><figure class="quote" id="q-197e7a02b9" data-kw="">
<blockquote><p>Yet we should be very careful that our ears be not more attentive to the melody than our minds to the spiritual meaning of the words. Augustine also admits in another place that he was so disturbed by this danger that he sometimes wished to see established the custom observed by Athanasius, who ordered the reader to use so little inflection of the voice that he would sound more like a speaker than a singer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, trans. F. L. Battles (Westminster Press, 1961), 3.20.32.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a9f82966d" data-kw="">
<blockquote><p>Now those first ceremonial observations [of the Early Church with evangelical feasts] are guilty of opening that gate for all the human presumptions to enter into God’s house which pressed in after them: which gate could never be shut from that day to this. 2. Those very feasts made a composition or mixture of human institutions with divine, and therefore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day. Easter brought in a superstitious Lent to attend upon it, made baptism wait for her moon: and conformed our Lord’s Supper unto the Jewish Passover in unleavened bread, etc. [3.] It was the first apple of contention among Christians, the first weapon wherewith the Bishop of Rome played his prises [prices?] against other Churches, and after slew so many Britons with by Austin the monk. Holy-days in honor of Christ invited unto them saints’ holy days, etc. 4. It is presumtion to make men’s inventions as guiltless of evil consequences as God’s holy ordinances. They are active efficacious occasions given of evil: these [ordinances of God] are only passive occasions taken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship (Amsterdam: Thorp, 1633)</cite>, ch. 1, section 17, pp. 84-85</span></figcaption>

</figure><figure class="quote" id="q-ea6928ec62" data-kw="">
<blockquote><p>…whereas your surplice is arbitrarily institute[d], and imposed to signify innocency, without either real foundation or sufficient warrant, wherein, whether you do more usurp against God’s prerogative to appoint sacred and mysterious signs, and that simplicity, in which he has set forth his Gospel, or be more grossly mistaken in the event and fruit of your application, is a great question? I grant that necessity or decency have introduced many things circumstantial that are rational, and consequently upon some real antecedent ground expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures and the like, without which worship cannot be performed; But to ascribe a liberty to the Church of appointing ceremonies, having for reason of their signification, the will of the instituter, and their use only in the representation, is so manifest an impingement upon Divine authority and the sacraments thereby ordained, and has already produced such a mass of superstitious superfluity in the Romish-Church, that I much admire to find a serious person pleading for such fopperies…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… (1671), 3rd Dialogue</cite>, pp. 111-12</span></figcaption>

&amp;text=find%20a%20serious%20person%20pleading%20for%20such%20fopperies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), ‘The Distribution of Theology’</cite></span></figcaption>

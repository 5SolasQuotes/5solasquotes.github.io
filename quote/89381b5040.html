<main class="wrap"><figure class="quote" id="q-89381b5040" data-kw="">
<blockquote><p>In today’s intellectual milieu, pride and sloth are the two chief interpretive vices. Partisan pride protects its beliefs behind the shield of identity politics, while systemic sloth shrugs indifferently at the pursuit of truth itself. In response, today’s Bible interpreters need more than the right kind of method; they need to be the right kind of people: readers marked by interpretive virtue rather than interpretive vice. With boldness, they oppose systemic sloth and proclaim what God has said. At the same time, with humility, they resist partisan pride and remain humbly open to correction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kevin-vanhoozer.html">Kevin VanHoozer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Even Heretics Know Hebrew: How to Interpret the Bible in Partisan Times’</cite>, (2023) 35 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-8292d341b5" data-kw="">
<blockquote><p>I do not doubt that the most ancient fathers, to whom the coming night was the end of one day and the beginning of another, followed this mode of reckoning. Although Moses did not intend here to prescribe a rule which it would be criminal to violate; yet (as we have now said) he accommodated his discourse to the received custom. Wherefore, as the Jews foolishly condemn all the reckonings of other people, as if God had sanctioned this alone; so again are they equally foolish who contend that this modest reckoning, which Moses approves, is preposterous. The first day: Here the error of those is manifestly refuted, who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1:5</span></figcaption>

</figure><figure class="quote" id="q-76a5437c2b" data-kw="">
<blockquote><p>We do not deny that there can be in the church a ministerial and secondary judge, who can officially moderate controversies over the faith by the Word of God, but we hold that the Holy Spirit, as its source, teaches us the true interpretation of Scripture where inner assurance is concerned. We deny that any supreme and infallible judge except Scripture need be sought with regard to external proof of the object, much less that the pope, who assumes such a task, is to be accepted. We believe that Scripture alone, or God speaking in it, is enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.7</span></figcaption>

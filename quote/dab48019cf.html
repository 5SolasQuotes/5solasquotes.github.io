<blockquote><p>…while he [the opponent] says: ‘That all Scots-men were generally of one Communion, and that the presbyterians (except the Cameronians) had returned to the Episcopal Church, and were become hearers, and many communicaters with her: That there was no separate meetings kept, at least publicly, but very rarely.’ This, I say, is most false: For though never any of the presbyterians would, directly nor undirectly, own episcopal government, yet many of the more sober and intelligent among them did not think it unlawful to hear them occasionally, who had complied with episcopacy; yet they chose rather to hear their own lawful pastors, though driven into corners, than these unfaithful men: And not only so, but there were many thousands, beside Cameronians, who would never hear them: And that many (who when they had occasion to hear others, made use of that opportunity) did go to hear these men, when their liberty of hearing others was taken away, it is no wonder. Yet this practice was far less general than he says, and meetings of nonconformists were not so rare (for all the horrid persecution that they were under) as he would make us believe: Many, who were no Cameronians, kept up their meetings, though I confess it was no wonder that their meetings were not public [after about 1680], when they were by such barbarous persecutions driven into corners… §2. Another falshood is, that the party which was then treated severely, was only the Cameronians: Whereas, though they had their share of the persecution, yet other presbyterians were most cruelly dealt with; and it was observed, that, indeed, the spite of his [episcopal / royalist] party appeared most against the most sober of the presbyterians, as being the persons most capable to do them hurt. …It is also most false and calumnibus, ‘that all presbyterians in Scotland were of one principle, only the Cameronians were more ingenuous’: For the sober presbyterians did always condemn many, both principles and practices, of that party. Such as that magistrates and ministers fall, ipso facto, from their authority, respective, and stations, when they are guilty of mis-managements, and that private persons may treat them as such, without a ••••enee [decree?] of State or Church. That the rest of the presbyterians condemned the Cameronians for keeping up their meetings, is also an untruth, for they also kept up meetings; but they condemned them for the manner of their meeting, with such contempt of, and bidding defiance to the authority of the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Church of Scotland, being an Answer to Five Pamphlets</cite>, … (Edinburgh: Parkhurst, 1691) Rule (c. 1629 – 1701) was a divine right, resisting presbyterian who was a leader in the post-1690 Church of Scotland. | Answer to 2nd Letter, pp. 14-16</span></figcaption>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>7. We must distinguish betwixt a dependance ‘absolute’, and ‘in some respect’; a congregation does absolutely depend upon the holy Scriptures alone, as the perfect rule of faith, and manners, of worship and of Church-Government; for we accurse the tyranny of prelates, who claimed to themselves autocratoric power over congregations to whom they gave their naked-will for a law: one of themselves told a whole synod that they ought to esteem that best which seems so to superiors; and that this is a sufficient ground to the conscience for obeying, though the thing be inconvenient. We say that congregations ought indeed to be subject to presbyteries and synods, yet not absolutely, but in the Lord, and in things lawful: and to this purpose the constitutions of presbyteries and synods are to be examined by the judgement of Christian discretion; for a synod is judex judicandus [a judge which ought to be judged], and regula regulata [a rule having been regulated], so that it ought not to be blindly obeyed, whether the ordinances be convenient or inconvenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), pt. 2, ch. 2, p. 44</span></figcaption>

<blockquote><p>We know no other public redress; for Christ has left it there, and so may we also: Neither can it be instructed from Scripture that Christ has appointed separation to be the next step of a private person’s duty for removing of offenses.” And there he shows, “A private person must either acquiesce, as being exonered, when he has followed the action before the Church, or he shall have no ground of peace anywhere till he be out of the world, or out of all visible Churches: And so also there can be no other way of keeping public order and ordinances, and of eviting scandal and confusion. This truth is fully made out,” says he, “by these three worthy and pious divines of New England, [John] Cotton, [Thomas] Hooker and [John] Norton.</p></blockquote>

<blockquote><p>3. Nor does it belong to the essence of Presbyterial Government, that all members of this Church, and inferior judicatures, should so submit to the superior respective judicatures, that if they be grieved with the sentence, they ought to acquiesce thereunto, and not to contra-act, but only appeal, until there shall be a general assembly to determine the matter. This never was, and I trust, nor shall ever be their mind who are for presbyterial government; nor do our brethren justly father it upon the general Assembly, 1648, Session 30. For our Church acknowledges no subjection nor subordination of inferior judicatures unto superiors, but in the Lord, and so to submit to any sentence, and to forbear a duty of preaching the Gospel, praying, visiting, exhorting, catechizing pastorally in families, to abstain from the Lord’s Supper, and from acts of due censure necessary for the flock upon the known unjust sentence of a synod, until a general Assembly (which possibly cannot be convened in an age to determine) is to: 1. Obey men unjustly forbidding a called minister of Christ to preach in season, and out of season, rather than God; for they unjustly forbid, and the Lord justly commands; therefore the called minister must act and contra-act to their unjust sentence, and not forbear for an hour, as the Scripture clears, 2 Tim. 4:1-2; Acts 20:17-20; 1 Cor. 9:16; Isa. 58:1; Jer. 1:17; Eze. 2:3-5 &amp; 3:10,17; Acts 5:28-29; and so this is unjust. 2. It is to make synods and ecclesiastical judicatures lords of our faith, which the Reformed Churches detest in popish councils; for all men and councils most lawful can challenge only limited obedience and submission in the Lord to their determinations, if they speak and command ‘according to the Law and the Testimony’, Isa. 8:20, ‘otherwise there is no sight in them.’ And so it is popish. 3. We conceive in performing acts of that government which Christ owns in his Word, we do not sin; for no authority of a judicature can make that to be the word of God, and obedience to God, which was not, as to the matter, obedience to God before that authority, nor on the contrary. Now to abstain from preaching, praying, eating and drinking as the Lord’s Supper in a called minister, and in a visible professor, duly called and fitted, is sin; then cannot the authority of the Church, far less their known unjust sentence make it lawful. 4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>

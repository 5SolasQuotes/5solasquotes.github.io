</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span></div>

</figure><figure class="quote" id="q-44b94d52cb" data-kw="">
<blockquote><p>Thirdly, I demand of you, how you could so nakedly propound the apostolical directions, patterns and examples of the primitive Churches to walk by (excepting mere circumstances and the rules of the law of nature) and not except withal extraordinary and miraculous, personal and particular, occasional and accidental, temporary and local patterns and examples. I own the Scripture for the rule, rightly understanding it, and in matters of discipline and Church-order profess to walk by it, desiring to be tied to the Scripture patterns, particularly to the patterns of examples and precepts recorded in the New Testament (provided this be understood in essentials and fundamentals of order, in matters of perpetual use, and of a common reason to all times and places); only I add that in some things, where in matter of order and external government there may be no such clear directions either by precept or example, there general rules of the Word, with deductions out of Scripture examples, and from precepts by way of analogy, with rules of common prudence be taken in too. Now the interpretation of this rule (as I have laid it down) being rejected, and the rule simply taken up without such limitations, will produce a wild and strange discipline and Church-order, to practice all things recorded in the Acts of the Apostles and epistles without distinction and difference of those times, persons, places, and ours: and on the other hand to practice nothing but what has a clear example, or precept is strange too, and in so doing, reasonable men cannot become a Church society, nor exercise Church communion. And however in matters of external government and administration of holy things in the visible Church some pretend to this, to practice whatever they find recorded in the Scriptures, and to practice nothing whatsoever they find not there, yet none of the Independents, no not the highest form of them, the Anabaptists, nor the highest sort of Anabaptists (who were called Apostolici [Apostles] from their pretending to imitate the apostles in all things) ever yet have or do practice all patterns and examples recorded in the New Testament, or are contented with them alone, but practice somewhat over and above not particularly recorded in Scripture. I could lay down a catalogue of many particulars specified in the Acts of the Apostles and epistles not practiced in your churches, nor in any churches of the Independent way, as also of many things practiced by you which we never read of in the Scriptures, so that all the Independents are in many things according to the first pattern both defective and excessive. But I refer the full handling of this to a Tractate I intend concerning the Scriptures [which appears to never have been published], How far the Scriptures are a rule for all matters of Church government and order in the visible Church. I add only one thing for the reader’s sake, that they be careful to understand this first principle of yours, not so nakedly as you lay it down in pages 8-11 [of the Independents’ Apology], because it has been, is, and may be a rock to split many on, and an ignis fatuus [elf-fire] to lead many into waters, instead of a sacred pillar of fire to guide to Heaven in a safe way. This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top. Now how far the want [lack] of these limitations and distinctions in this your first rule has led some of you into errors and strange practices and may lead you further, as into anointing the sick with oil, baptizing in rivers, etc. I leave you to consider of. But yet this first and great principle upon which you went and reared up your new Church way, how difficult and abstruse a rule, and how doubtful a groundwork do you make it, before you pass from it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, pp. 75-78</span></figcaption>

y, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top. Now how far the want [lack] of these limitations and distinctions in this your first rule has led some of you into errors and strange practices and may lead you further, as into anointing the sick with oil, baptizing in rivers, etc. I leave you to consider of. But yet this first and great principle upon which you went and reared up your new Church way, how difficult and abstruse a rule, and how doubtful a groundwork do you make it, before you pass from it…”

</figure><figure class="quote" id="q-47ac56c75b" data-kw="perspicuity">
<blockquote><p>The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).”

— Francis Turretin, Institutes of Elenctic Theology, 2.17.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20question%20is%20not%20whether%20things%20essential%20to%20salvation%20are%20everywhere%20in%20the%20Scriptures%20perspicuously%20revealed.%20We%20acknowledge%20that%20there%20are%20some%20things%20hard%20to%20be%20understood%20%28dysno%C4%93ta%29%20and%20intended%20by%20God%20to%20exercise%20our%20attention%20and%20mental%20powers.%20The%20question%20is%20whether%20things%20essential%20to%20salvation%20are%20anywhere%20revealed%2C%20at%20least%20so%20that%20the%20believer%20can%20by%20close%20meditation%20ascertain%20their%20truth%20%28because%20nothing%20can%20be%20drawn%20out%20of%20the%20more%20obscure%20passages%20which%20may%20not%20be%20found%20elsewhere%20in%20the%20plainest%20terms%29.%20As%20Augustine%20remarks%3A%20%E2%80%9CAdmirable%20and%20healthily%20the%20Spirit%20has%20so%20arranged%20the%20Scriptures%20that%20by%20the%20plainer%20passages%20he%20might%20meet%20our%20desires%20and%20by%20the%20obscurer%20remove%20our%20contempt%E2%80%9D%20%28CI%202.6%20%5BFC%202%3A66%3B%20PL%2034.39%5D%29%3B%20and%2C%20%E2%80%9CWe%20feed%20in%20the%20open%20places%2C%20we%20are%20exercised%20by%20the%20obscure%3B%20there%20hunger%20is%20driven%20away%2C%20here%20contempt%E2%80%9D%20%28Sermon%2071%2C%20%E2%80%9CDe%20Verbis%20Domini%2C%E2%80%9D%207.11%20%5BPL%2038.450%5D%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%202.17.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47ac56c75b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47ac56c75b.html">Permalink</a><span class="src none">No free online copy linked</span></div>

<blockquote><p>. . . he is the best student who does not read his thoughts into the book, but lets it reveal its own; who draws from it its sense, and does not import his own into it, nor force upon its words a meaning which he had determined was the right one before he opened its pages. Since then we are to discourse of the things of God, let us assume that God has full knowledge of Himself, and bow with humble reverence to His words. For He Whom we can only know through His own utterances is the fitting witness concerning Himself.</p></blockquote>

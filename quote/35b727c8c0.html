<main class="wrap"><figure class="quote" id="q-35b727c8c0" data-kw="">
<blockquote><p>Hence it came to pass, that the reformation of the Church as unto the matter of it, or the purity and holiness of its members, was not in the least attempted until Calvin set up his discipline at Geneva, which has filled the world with clamors against him from that day to this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, (London: William Marshall, 1689), p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-536663c18e" data-kw="">
<blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. Joel Beeke, tr. Todd Rester (Reformation Heritage Books), vol. 5, bk. 7, ch. 1, §35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-5db2709540" data-kw="">
<blockquote><p>How much the ministry of the Word and sacraments should weigh with us… so as to be a perpetual badge for distinguishing the Church, has been explained; for we have shown, first, that wherever it exists entire and unimpaired, no errors of conduct, no defects should prevent us from giving the name of Church; and, secondly, that trivial errors in this ministry ought not to make us regard it as illegitimate. Moreover, we have shown that the errors to which such pardon is due, are those by which the fundamental doctrine of religion is not injured, and by which those articles of religion, in which all believers should agree, are not suppressed, while, in regard to the sacraments, the defects are such as neither destroy nor impair the legitimate institution of their Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr. Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 2, §1, p. 42</span></figcaption>

<blockquote><p>In this work [his Commentary on Romans] Bucer was convinced that a clear exposition of the scriptures, as well as the chuch fathers and even some scholastic theologians, would lead the old church to the evangelical truth of the fundamentals of the Christian faith.</p></blockquote>

</figure><figure class="quote" id="q-cf0205aa37" data-kw="">
<blockquote><p>Q. IV. What are the ends that I aim at in the great undertaking? … 3. I can appeal to God, that I have no design in the least to maintain a party, or to keep up any schismatical faction; my heart rises against the thoughts of it. I hate dividing principles and practices, and whatever others use, I am for peace and healing; and if my blood would be sufficient balsam, I would gladly part with the last drop of it, for the close up of the bleeding wounds of differences that are amongst true Christians. Peace is such a precious jewel, that I would give anything for it but truth. Those who are hot and bitter in their contendings for or against little things, and zealous in keeping up names of division and maintaining parties, are of a spirit which I understand not. Let not my soul come into their secret. My ends then are according to my principles, and I humbly appeal to God concerning the integrity of my heart in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Serious Self-Examination Before Ordination’</cite>, (1687) in the biographies of Henry by William Tong &amp; J.B. Williams</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

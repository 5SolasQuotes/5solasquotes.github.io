<blockquote><p>And he came to his disciples. Though he was neither delivered from fear, nor freed from anxiety, yet he interrupted the ardor of prayer, and administered this consolation.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72f383c48f" data-kw="">
<blockquote><p>Natural self is to be denied as well as corrupt self, as appears by the example of Christ, who had no corrupt self to deny, and yet ’tis said, Rom. 15:3, ‘He pleased not Himself.’ Christ had an innocent natural will, by which He loved his natural life and peace; ‘Father let this cup pass.’ But He submitted it to God; ‘Not my will, but thine be done,’ Mt. 26:39. Therefore we also must not only deny self as corrupted by sin, but self as separate from God. How else shall we submit to God in these things wherein He may lay a restraint upon us, or put us to trial about them, whether we love them in order to Him, they being things which otherwise we may affect. And besides, to love any thing apart from God, and to seek it apart from God and rejoice in it apart from God, without any reference and respect to God, is to make the creature the last end, in which the action terminates, which is an invading of God’s prerogative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, ... (London: Robinson, 1684), Sermons on 2 Cor. 5, sermon 29, on 2 Cor. 5:15, p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

vine-natures-of-christ/on-the-human-nature-of-christ/#:~:text=Natural%20self%20is%20to%20be%20denied,is%20an%20invading%20of%20God%E2%80%99s%20prerogative&amp;text=Natural%20self%20is%20to%20be%20denied%20as%20well&amp;text=terminates%2C%20which%20is%20an%20invading%20of%20God%E2%80%99s%20prerogative" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a931e0e622" data-kw="">
<blockquote><p>Controversy 3 – Would Jesus Christ have been made man and come into the world if men had not sinned? We deny against the Socinians and Scholastics. Arguments:

1. He was only promised after the fall (Gen. 3:15), and He could not have been born of a virgin except in virtue of the promise.

2. Those who are well have no need of a physician (Mt. 9:13). He only came to save sinners (2 Tim. 1:15).

3. He has been sent on the basis of the love of God toward fallen man (Jn. 3:16), which could not exist in that case. [That is, He would not have had compassion on fallen man, if man had not fallen. This compassion and love for fallen man is given as the reason for the Father sending the Son.]

4. It would not have been necessary for God to be man; therefore, He would have come in vain.

5. Nor would humanity have had any obligation (obligatio) to Him as incarnate. Objections:

1. Christ is the firstborn of all creatures (Col. 1:15). Reply. ‘Firstborn’ means generated from eternity before all creatures.

2. In all things, He is preeminent (primus) (v. 19). Reply. In dignity and position.

3. All things have been created in Him (meaning “on account of Him”). Reply. All things have been created on account of Him as God not as man.

4. Then we have not been made on account of Christ, but He was made on account of us. Reply. Yes, as man. Objection. Then we should be given thanks since it is on account of us. Reply. That’s ridiculous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, pp. 112-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-c9cd8a1652" data-kw="">
<blockquote><p>The union personalis in Christ was made adiairetos, indivisibly, in respect of place, so that the human nature is nowhere unsupported by the Logos, the Logos nowhere fails to support the human nature, nor is it outside the Logos or the Logos apart from it: akoristos, inseparably in respect of time, because this union is never dissolved but is perpetual, which was also seen in the death and burial…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, As quoted in Heinrich Heppe, ed. Biser, trans. Thomson (Wipf &amp; Stock, 2007), ch. 17, ‘The Mediator…’, p. 434</span></figcaption>

</figure><figure class="quote" id="q-04da18c64a" data-kw="">
<blockquote><p>Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

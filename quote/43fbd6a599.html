<main class="wrap"><figure class="quote" id="q-43fbd6a599" data-kw="">
<blockquote><p>4. When a man, finding that God is a free and intellectual Agent, and sees, as he may by natural reason, everything ordered to a suitable end to his Being, and by a suitable means or rule conducing to that end, and finds a higher degree of being in himself than in other creatures, and consequently an higher end, and consequently an higher rule conducing to that end, he does most naturally resolve this rule into that law, which by the will of God is given to man conducing to that end, the subject of which rule must be all his internal and external actions, both in reference to God, to himself and to others: but here then is the next question, and the next degree of ignorance in men, viz. What that law or will of God is concerning man? and from hence grow those varieties and errors in worship of God. And though haply most men, knowing the true God, may by the same Light of Nature concur in the general and fundamentals of worship, viz. That God is to be feared with all reverence, loved with all intention, obeyed with all sincerity, cheerfulness and exactness: all which are but natural conclusions from the nature of God, the nature of Man, and the relation that he bears to God, as his Creator, Lord, and Preserver…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-hale.html">Matthew Hale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of God, &amp; of Ourselves I. by the Light of Nature, II. by the Sacred Scriptures</cite>, (London: 1688), pt. 1, ‘By the Light of Nature’, ch. 5, pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9df714d182" data-kw="">
<blockquote><p>…worship taken generally, signifies the giving of honor and reverence to another. Now this honor is either civil or divine. Civil honor is that outward reverence we give to men, by prostrating of the body, or bowing of the knee; and the end of this civil worship is, that thereby we might acknowledge another to be our superior… The second kind of honor is divine or religious worship, when we give such honor to another that thereby we do ascribe divinity and divine power unto it, acknowledging thereby that it is some divine thing above all creatures. And this we do first, when we ascribe the Godhead to it, and make it God: secondly, when we ascribe God’s attributes to it, as omnipotency, providence, etc. thirdly, when we acknowledge it to be the creator and maker of all things: fourthly, when we acknowledge it to be the giver of those good things we enjoy, and the defender of us from evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Satan’s Sophistry Answered by our Savior Christ, &amp; in Diverse Sermons Further Manifested</cite>, (London, 1604), ‘Satan’s Sophistry,’, pp. 114-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

e · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dd3fc2d5ef" data-kw="">
<blockquote><p>XIX… I. The moral precepts are known by nature, and therefore eternal, and obligate all men: The rest are not so. II. The moral precepts are the principal worship of God; the ceremonial and forensic are subordinate, but serve the moral precepts, and therefore yield to them. III. The moral precepts obligate all rational creatures; the others obligate the Jews only. IV. The ceremonial and forensic are typical; the moral are antitypical. V. The moral are general; the ceremonial and forensic are special and determinate.</p></blockquote>

<blockquote><p>I do not here conceive that the Church acknowledges she has cast off her garments of Christ’s righteousness; for then how should she remain the spouse of Christ? Yea, how then should her heart have been otherwise than asleep too? But only she pleads she should appear too naked if she should open to Christ, if she should worship Him in the simplicity and nakedness of his simple ordinances.</p></blockquote>

</figure><figure class="quote" id="q-df48ea1b24" data-kw="">
<blockquote><p>But they differ, in that the pastor labors in the word of exhortation, that is, by the gift of wisdom applies the word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labors in the word of doctrine, that is, without such applications as the pastor uses; by simple teaching he preserves the truth and sound interpretation of the Scriptures, against all heresy and error. The ruling elder doth neither of these, but labors in the government and policy of the church only. The Apostle has distinguished these three sorts of elders, 1 Tim. 5.17, “Let elders that rule well be counted worthy of double honor, especially they who labor in the word and doctrine.” Where, as [Theodore] Beza notes, he distinguished the word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7,8, he distinguishes teaching from exhortation; and 1 Cor. 12:8, puts “the word of wisdom,” and “the word of knowledge,” for two different things. Now, besides those elders which labor in the word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the word nor doctrine, but in ruling well. Hence it appears how truly the Book of Policy, ch. 2, says, That there are four ordinary, perpetual, and necessary offices in the church, the office of the pastor, the doctor, the elder, and the deacon; and that no other office, which is not one of these four, ought to be received, or suffered in the church.</p></blockquote>

<blockquote><p>2. What is essential for making a minister who is extraordinarily called of God, is not ever more essential to the making of a minister ordinarily called of God, in an island where the Gospel is: if all the pastors should die, the people might choose pastors to themselves, but they could not then make pastors; God only, without the ministry of other pastors, in that case should make pastors; but it follows not hence that pastors ordinarily have not their calling to be pastors from the ordination of pastors.</p></blockquote>

</figure><figure class="quote" id="q-e3ae0d6ec3" data-kw="">
<blockquote><p>Here are three opinions concerning these prophets mentioned by the apostle: 1. [that they were, and warrant, laymen preaching, as held by the Independent, Socinians and Arminians;] 2. That these prophets were Church officers, and no more but ordinary teachers or interpreters of Scripture in the Church: without excluding the sons of the prophets, or probationers from their assembly, and from exercising their gifts in preaching upon occasion, and fore-trial of their gifts, or of the growth and increase thereof, yet I remember no place in the New Testament where ordinary pastors are said to prophesy, except Rev. 11:3, where notwithstanding, prophesy is ascribed unto them in no other sense than the working of miracles, v. 6: ‘Those have power to shut heaven, that it rain not in the days of their prophesy, and have power over waters to turn them into blood, and to smite the earth with all plagues as often as they will.’ All which (prophesying and miracles) is spoken by way of allusion to Moses and Elijah. 3. That they were extraordinary prophets, immediately and extraordinarily inspired by the Holy Ghost; and that they are to be reckoned among these other administrations which were not to continue, or be ordinary in the Church: apostles, evangelists, workers of miracles. (Synopsis of Pure Theology, disp. 42, thesis 22; Martyr, Common Places, class. 4, ch. 1; Aretius, Theological Problems, place 62; Calvin, Institutes, bk. 4, ch. 3, §4; Diodati on 1 Cor. 14:1; the late English Annotations on 1 Cor. 12:28; Mr. [Paul] Bayne on Eph. 4:11, together with two learned countrymen of mine, Mr. David Dickson on 1 Cor. 14:31 and Mr. [Samuel] Rutherfurd on his Peaceable Plea, ch. 16) I know many Protestant writers of very good note, are of the second opinion. But with all due respect unto them, I hold the third opinion, with Gerhard [a Lutheran], Common Places, tome 6, p. 72, and diverse others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 5, “Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14 and 1 Cor. 12:28; Eph. 4:11, were extraordinary, and so not to continue: Or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry” in A Treatise of Miscellany Questions (Edinburgh, 1649), pp. 64-85, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Here are three opinions concerning these prophets mentioned by the apostle: 1. [that they were, and warrant, laymen preaching, as held by the Independent, Socinians and Arminians;] 2. That these prophets were Church officers, and no more but ordinary teachers or interpreters of Scripture in the Church: without excluding the sons of the prophets, or probationers from their assembly, and from exercising their gifts in preaching upon occasion, and fore-trial of their gifts, or of the growth and increase thereof, yet I remember no place in the New Testament where ordinary pastors are said to prophesy, except Rev. 11:3, where notwithstanding, prophesy is ascribed unto them in no other sense than the working of miracles, v. 6: ‘Those have power to shut heaven, that it rain not in the days of their prophesy, and have power over waters to turn them into blood, and to smite the earth with all plagues as often as they will.’ All which (prophesying and miracles) is spoken by way of allusion to Moses and Elijah. 3. That they were extraordinary prophets, immediately and extraordinarily inspired by the Holy Ghost; and that they are to be reckoned among these other administrations which were not to continue, or be ordinary in the Church: apostles, evangelists, workers of miracles. (Synopsis of Pure Theology, disp. 42, thesis 22; Martyr, Common Places, class. 4, ch. 1; Aretius, Theological Problems, place 62; Calvin, Institutes, bk. 4, ch. 3, §4; Diodati on 1 Cor. 14:1; the late English Annotations on 1 Cor. 12:28; Mr. [Paul] Bayne on Eph. 4:11, together with two learned countrymen of mine, Mr. David Dickson on 1 Cor. 14:31 and Mr. [Samuel] Rutherfurd on his Peaceable Plea, ch. 16) I know many Protestant writers of very good note, are of the second opinion. But with all due respect unto them, I hold the third opinion, with Gerhard [a Lutheran], Common Places, tome 6, p. 72, and diverse others.”

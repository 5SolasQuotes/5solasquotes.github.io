<main class="wrap"><figure class="quote" id="q-3232404889" data-kw="">
<blockquote><p>God, indeed, from time to time showed the presence of his divine majesty by definite signs, so that he might be said to be looked upon face to face. But all the signs that he ever gave forth aptly conformed to his plan of teaching and at the same time clearly told men of his incomprehensible essence. For clouds and smoke and flame [Deuteronomy 4:11], although they were symbols of heavenly glory, restrained the minds of all, like a bridle placed on them, from attempting to penetrate too deeply. Therefore Moses, to whom, nevertheless, God revealed himself more intimately than to the others [Exodus 33:11], did not succeed by prayers in beholding that face; but he received the answer that man is not able to bear such great brightness [Exodus 33:20]. The Holy Spirit appeared under the likeness of a dove [Matthew 3:16]. Since, however, he vanished at once, who does not see that by one moment’s symbol the faithful were admonished to believe the Spirit to be invisible in order that, content with his power and grace, they might seek no outward representation for themselves? For the fact that God from time to time appeared in the form of a man was the prelude to his future revelation in Christ. Therefore the Jews were absolutely forbidden so to abuse this pretext as to set up for themselves a symbol of deity in human form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559; Battles edition), 1.11.3.</span></figcaption>

<blockquote><p>3. We acknowledge different opinions between Lutherans and Calvinians; so no doubt there are different opinions among the Lutherans themselves, and the Calvinians themselves, but we utterly deny there are different religions. The Lutherans we hold to be true Churches, agreeing with us in the fundamental points of faith, and likewise in being free from idolatry; for albeit they have images in their churches, which we conceive to be a very dangerous thing, yet they do not worship them; and although they hold real presence in the sacrament, yet they do not adore it. So that albeit we think some of their opinions are contrary to the Scripture, and they think the like of some of ours, yet neither we say of their religion, nor they of ours I trow, that it is contrary to the Scripture, much less that it is condemned in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Conscience Resolved, in answer to a</cite>, (pretended) perplexing question, etc. Wherein is evidently proved that the holy Scriptures (not the Pope) is the foundation whereupon the Church is built (London: 1652), pp. 27-28</span></figcaption>

</figure><figure class="quote" id="q-c9fff794c6" data-kw="">
<blockquote><p>Images of God were strictly forbidden. But Puritan psychology also kept its strong Scholastic roots… Tension between Reformed iconoclasm and Scholastic psychology was not immediately apparent, but during the Evangelical Awakening of the 1740s it became acute. The problem may be stated concisely: If mental images are natural products of the imagination, how can a mental image of Christ be condemned as idolatrous? Does not this impugn the character of God who gave the mind its capacity for forming images? The following study… concludes with the controversy which erupted in Scotland when Jonathan Edwards defended the psychological neutrality of ‘Imaginary ideas of Christ.&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-26b513cea7" data-kw="">
<blockquote><p>Paul … alludes to the creation of Adam, and rises up to the eternal purpose of God, who, before he created mankind, decreed of his own mere will and pleasure, to manifest his glory, both in saving of some whom he knew, in a way of mercy, and in destroying others, whom he also knew, in righteous judgment. And verily, unless we judge this to be the case, God will be greatly injured; because he will not be sufficiently wise, who first creates men, and looks upon them corrupt, and then appoints to what purpose he has created them: nor sufficiently powerful, if when he has taken up a purpose concerning them, he is hindered by another, so that he obtains not what he willed; nor sufficiently constant, if willingly and freely he takes up a new purpose, after his workmanship is corrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Complete Tract on the Doctrine &amp; True Use of Predestination, out of the Lectures of Theodore Beza on Chapter 9 of the Epistle to the Romans</cite>, … adjoined are some places taken out of the book of Dr. Luther on the Bound Will Against Erasmus, from which appears that his judgment on Predestination was in everyway consonant with ours 2nd ed. ed. Raphael Eglin (Eustathius Vignon, 1583) 182, pp. no ToC Table</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2693a5332b" data-kw="">
<blockquote><p>The doctrinal structure which stands out as most original in Bullinger’s Compendium is the definitive establishment of the gracious covenant of God as the ground for our understanding of Christology and soteriology. Bullinger accords to the covenant a position in relation to his doctrine of God much like the position of an infralapsarian doctrine of predestination.</p></blockquote>

</figure><figure class="quote" id="q-e733164a3e" data-kw="">
<blockquote><p>It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…</p></blockquote>

</figure><figure class="quote" id="q-9d7bd937c1" data-kw="">
<blockquote><p>Predestination &amp; Reprobation Contrasted 1. The [Westminster] Confession does not teach or imply a double predestination. In an attempt to distinguish between election and reprobation we should use predestination for the elect and foreordination for the reprobate [as the Confession does]. 2. Election and reprobation rest on different grounds: election on the redeeming love of God that undertakes the salvation of the lost; reprobation on the moral necessity to manifest to the universe the nature and consequences of sin in moral personality. 3. Means are used of God to fulfil the purpose of election, but God uses no means to fulfil His purpose of reprobation. It is left to sin to run its course and receive its wages. 4. The fruits of election are attributable to divine grace, the fruits of reprobation to personal sin. This means that while there is grace to some, there is injustice to none. 5. While God finds pleasure in the salvation of the elect, He has sworn by Himself that He has no pleasure in the death of the wicked. God does not need sin or its retribution for His self-manifestation, but its reality in the universe can serve that end. 6. That the elect will constitute a recreation of the race under a new Head is evident, while the reprobate are but the branches cut off from the tree of humanity. Christ will be revealed as the Savior of the world, though many are lost in the process.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-a-finlayson.html">R.A. Finlayson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Theological Writings of R.A. Finlayson</cite>, p. 265. Finlayson was a Free Church of Scotland professor during the mid-1900’s.</span></figcaption>

<blockquote><p>Either you will distinguish God’s decrees by the objects, or not. If not, you must not distinguish between election and rejection, willing and nilling, loving Peter and hating Judas, etc. If yea, then you must not take up with the unexplained words, ‘reprobation’ and ‘election’. 1. By reprobation is meant either God’s will to punish men. 2. Or his will to give them no special saving grace. 3. Or his not-willing to give it them. For the first, I told you before that the object of God’s will to punish men in Hell is a sinner foreseen finally rejecting mercy. 2. The object of his will to punish men with positive temporal punishments is the sinner foreseen in his immediate capacity for them. 3. Whether punishment by not giving that Spirit for faith, repentance and holiness, be decreed (being nothing but a not-giving) is before discussed. But if it could be proved, yet the object of God’s denying further mercy and help, is evermore one that has abused former mercy, or refuses that as offered to him. (idem, d. 95, 1 Ferrariensis plane indicat Deum neminem damnare, aut rejicere a regno suo voluisse, quod ipse appellat deserere, nisi pravisa culpa [Ferrariensis plainly indicates that God willed to damn no one or to reject anyone from his kingdom, which he calls ‘to desert,’ except on account of foreseen sin.].) 4. But God’s non-volition to give grace is no act and has no object. But we judge that all mankind are now from under the mere Covenant of Innocency, and that none perish but for the abuse of mercy, which had a tendency to their recovery (the case of infants must be spoke to in its place once for all). But all this belongs to the case of grace and free-will. And 2. As for election, we say that: (How Augustine distinguished election to justification and [election] to glory, see him, bk. 1, to Simplicius, quest. 2 and that which about this Vasquez has on Thomas, pt. 1, disp. 89, ch. 6) 1. The object of God’s will to glorify men, is man sanctifying and persevering in an immediate capacity for glory in esse cognito [known being]. 2. The object of God’s will to give the grace of perseverance, is a foreseen sanctified person in the next capacity. 3. The object of God’s will to justify, sanctify and adopt, is a foreseen believer. 4. The object of God’s will to give special grace, which shall effectually cause men to repent and believe, is ordinarily a foreseen disposed sinner prepared by his common grace, but sometimes an unprepared sinner, whom, of his free will, he will suddenly convert, as it pleases him freely to distribute his benefits (all being unworthy). 5. The object of God’s will, to give the highest degrees of common grace, external (in the purest preaching of the Gospel, and other mercies) and internal (in greater helps of the Spirit) is sometimes a sinner in esse cognito, who has not grossly rejected lower helps, and sometimes freely the worser sort of sinners who have abused former mercies. 6. The object of God’s will to give the first common mercy which has a tendency in its use to men’s recovery and salvation, is all mankind fallen in Adam: For all are under the New Covenant of Grace made with Adam, Gen. 3:15, in some degree (and with Noah) and all have much mercy tending to repentance; and none are left as the devils in despair, without any offered remedy or help. 7. The object of God’s will to give man the Covenant of Innocency, was Adam foreseen as mere man. 8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that: 1. God’s power makes it possible for all things to be. 2. Next God knows them possible. 3. He knows what is convenient or fit to be made to his unsearchable ends. 4. He wills that they shall be, and man among the rest, and so on. If you will needs have the order of decrees, this is all that we can say of them. Arminian: All this pleases us well: but it will not please your own [moderate] party or the Calvinists that you make so many acts of election, which they tell you is but one entire thing, as mentioned in Scripture: Nor yet that you lay every decree or will upon foresight. Baxter: You are mistaken. No moderate, considerate man of them will deny anything that I have said, for: 1. As to the Scripture use of the word ‘election’, it is not the mere name that we are now opening, but the matter in question. Nor is it the expounding of particular texts that I am upon; and if I were, no man will deny but that the word ‘election’ is variously used in the Scripture: sometime for God’s eternal will to make us Christians of infidels, and to save us by Christ; and sometime for actual choosing us by converting grace in time; and sometime for actual choosing men in time by vocation to some office or special work, etc. And as to the distinguishing of all these volitions of God, no man will deny the effects to be distinct. Undoubtedly these are various effects of God: 1. To make man. 2. To give him the Covenant of Innocency. 3. To give him the Covenant of Grace, with all the common mercies of it. 4. To give some persons and nations the gospel and other mercies above the greatest part of the world, with answerable helps of the Spirit. 5. To give men special grace, effectual for faith and repentance. 6. To give men pardon, adoption and sanctification. 7. To give men perseverance. 8. To give them glory. And if these are various works, either you will distinguish of God’s will by his various works, or not. (Sive secundum nostram rationem distinguamus illud decretum in plura, sive dicamus esse unicum, non est multum curandum: Certum enim est apud omnes, Deum omnia et singula voluisse unico simplicissimo acta suae voluntatis: Est enim ipsius voluntas, et voluntatis operatio idem quod sua essentia simplex et individua si aliquis contenderet esse etiam nostro modo intelligendi esse unicum actum simplicissimum voluntatis, ego non curabo. [Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.] Vasquez on Thomas, pt. 1, quest. 14, art. 13, disp. 65; and is not this a short end of many controversies?) If you do not, our whole controversy about the order of the decrees is quickly at an end (and I am content with the abbreviation): For where there is no distinction, there is no order. And when I distinguish them never so much, I say, as well as any, that they are all one in regard of the one will or essence of God that wills them. In God there is no real diversity; but his will is thus variously denominated extrinsically from its respect to the various objects to which it does trans[p]ire, and of the various effects which it produces. And thus do all men talk of God. Else they could not distinguish his saving will from his damning will; nor election from rejection, in his decree. So that no man can tell how to differ here. And as to foresight, you as much mistake. For: 1. I say not that God foresees any good in any man, but what He gives him and wills to give him. But we speak of the order of those volitions in the way of execution. (Alexander Alesius is noted by Vasquez and others as singular for holding that predestination to the first grace was upon foresight of the future good use of that grace as the cause: But he denies that the first grace is actually given on the same cause: Therefore Vasquez thinks he changed his mind.) 2. And all men that ascribe intentions, volitions or purposes to God, do and must make the object of them as such to be quid cognitum [what is known], or something which some call an idea in the mind of God; It is not a prius volitum qua tale [first volition as such] that is the object of a volition, but bonum intellectum [the intellectual good]. And therefore nothing but foresight or apprehension of the thing needs to be put in the description of the object. Nor do I deny but that we must in our ordinary discourse speak comprehensively, and denominate ‘election’ eminently from the noblest parts: For as our full salvation includes all, or almost all, so our conversion and glorification presupposes all that antecedes. And therefore as we may and must talk of salvation in general, and not always stand to mention all the parts of it, so must we eminently talk of election to salvation as comprehending the rest, and not always stand to distinguish of the parts. But when you will make a controversy of the order and the object of these acts or parts, we must distinguish.</p></blockquote>

d%2C+no+man+will+deny+the+effects+to+be+distinct.+Undoubtedly+these+are+various+effects+of+God%3A+1.+To+make+man.+2.+To+give+him+the+Covenant+of+Innocency.+3.+To+give+him+the+Covenant+of+Grace%2C+with+all+the+common+mercies+of+it.+4.+To+give+some+persons+and+nations+the+gospel+and+other+mercies+above+the+greatest+part+of+the+world%2C+with+answerable+helps+of+the+Spirit.+5.+To+give+men+special+grace%2C+effectual+for+faith+and+repentance.+6.+To+give+men+pardon%2C+adoption+and+sanctification.+7.+To+give+men+perseverance.+8.+To+give+them+glory.+And+if+these+are+various+works%2C+either+you+will+distinguish+of+God%E2%80%99s+will+by+his+various+works%2C+or+not.+%28Sive+secundum+nostram+rationem+distinguamus+illud+decretum+in+plura%2C+sive+dicamus+esse+unicum%2C+non+est+multum+curandum%3A+Certum+enim+est+apud+omnes%2C+Deum+omnia+et+singula+voluisse+unico+simplicissimo+acta+suae+voluntatis%3A+Est+enim+ipsius+voluntas%2C+et+voluntatis+operatio+idem+quod+sua+essentia+simplex+et+individua+si+aliquis+contenderet+esse+etiam+nostro+modo+intelligendi+esse+unicum+actum+simplicissimum+voluntatis%2C+ego+non+curabo.+%5BWhether%2C+according+to+our+manner+of+conceiving%2C+we+distinguish+that+decree+into+several+%5Bacts%5D%2C+or+whether+we+say+that+it+is+one+%5Bact%5D%2C+it+is+not+much+to+be+concerned+about.+For+it+is+certain+among+all%2C+that+God+willed+all+things+and+each+individual+thing+by+one+most+simple+act+of+His+will.+For+His+will%2C+and+the+operation+of+His+will%2C+is+the+same+as+his+simple+and+undivided+essence.+If+someone+were+to+contend+that+even+according+to+our+manner+of+understanding%2C+there+is+one+single+most+simple+act+of+the+will%2C+I+would+not+be+concerned.%5D+Vasquez+on+Thomas%2C+pt.+1%2C+quest.+14%2C+art.+13%2C+disp.+65%3B+and+is+not+this+a+short+end+of+many+controversies%3F%29+If+you+do+not%2C+our+whole+controversy+about+the+order+of+the+decrees+is+quickly+at+an+end+%28and+I+am+content+with+the+abbreviation%29%3A+For+where+there+is+no+distinction%2C+there+is+no+order.+And+when+I+distinguish+them+never+so+much%2C+I+say%2C+as+well+as+any%2C+that+they+are+all+one+in+regard+of+the+one+will+or+essence+of+God+that+wills+them.+In+God+there+is+no+real+diversity%3B+but+his+will+is+thus+variously+denominated+extrinsically+from+its+respect+to+the+various+objects+to+which+it+does+trans%5Bp%5Dire%2C+and+of+the+various+effects+which+it+produces.+And+thus+do+all+men+talk+of+God.+Else+they+could+not+distinguish+his+saving+will+from+his+damning+will%3B+nor+election+from+rejection%2C+in+his+decree.+So+that+no+man+can+tell+how+to+differ+here.+And+as+to+foresight%2C+you+as+much+mistake.+For%3A+1.+I+say+not+that+God+foresees+any+good+in+any+man%2C+but+what+He+gives+him+and+wills+to+give+him.+But+we+speak+of+the+order+of+those+volitions+in+the+way+of+execution.+%28Alexander+Alesius+is+noted+by+Vasquez+and+others+as+singular+for+holding+that+predestination+to+the+first+grace+was+upon+foresight+of+the+future+good+use+of+that+grace+as+the+cause%3A+But+he+denies+that+the+first+grace+is+actually+given+on+the+same+cause%3A+Therefore+Vasquez+thinks+he+changed+his+mind.%29+2.+And+all+men+that+ascribe+intentions%2C+volitions+or+purposes+to+God%2C+do+and+must+make+the+object+of+them+as+such+to+be+quid+cognitum+%5Bwhat+is+known%5D%2C+or+something+which+some+call+an+idea+in+the+mind+of+God%3B+It+is+not+a+prius+volitum+qua+tale+%5Bfirst+volition+as+such%5D+that+is+the+object+of+a+volition%2C+but+bonum+intellectum+%5Bthe+intellectual+good%5D.+And+therefore+nothing+but+foresight+or+apprehension+of+the+thing+needs+to+be+put+in+the+description+of+the+object.+Nor+do+I+deny+but+that+we+must+in+our+ordinary+discourse+speak+comprehensively%2C+and+denominate+%E2%80%98election%E2%80%99+eminently+from+the+noblest+parts%3A+For+as+our+full+salvation+includes+all%2C+or+almost+all%2C+so+our+conversion+and+glorification+presupposes+all+that+antecedes.+And+therefore+as+we+may+and+must+talk+of+salvation+in+general%2C+and+not+always+stand+to+mention+all+the+parts+of+it%2C+so+must

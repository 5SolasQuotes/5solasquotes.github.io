<main class="wrap"><figure class="quote" id="q-b49b78d7ff" data-kw="">
<blockquote><p>…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons</cite>, … (1675) Jekyll (d. 1698) was an Anglican minister.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76e3df8a2d" data-kw="">
<blockquote><p>The irregularities they were guilty of in this solemnity. The substance was well managed, and with a great deal of devotion… 2. Many were permitted to eat the passover who were not purified according to the strictness of the law, 2 Chron. 30:18. This was the second month, and there was not warrant to put them off further to the third month… And they were loth to forbid them communicating at all, lest they should discourage new converts, and send those away complaining whom they desired to send away rejoicing. [Hugo] Grotius observes from this that ritual institutions must give way, not only to a public necessity, but to a public benefit and advantage… ‘The good Lord pardon every one’ in the congregation that has fixed, engaged, or ‘prepared, his heart’ to those services, though the ceremonial preparation be wanting. Note: (1) The great thing required in our attendance upon God in solemn ordinances is that we prepare our hearts to seek Him, that we be sincere and upright in all we do, that the inward man be engaged and employed in it, and that we make heart-work of it, it is all nothing without this. ‘Behold, thou desirest truth in the inward part.’… For this is the ‘one thing needful,’ that we ‘seek God,’ his favour, his honour, and that we set our hearts to do it. (2) Where this sincerity and fixedness of heart are there may still be many defects and infirmities, both the frame of the spirit and the performance of the service may be short of ‘the purification of the sanctuary.’ Corruptions may not be so fully conquered, thoughts not so closely fixed, affections not so lively, faith not so operative, as they should be. Here is a defect in sanctuary purification. There is nothing perfect under the sun, nor ‘a just man that doeth good, and sinneth not.’ (3) These defects need pardoning healing grace; for omissions in duty are sins as well as omissions of duty. If God should deal with us in strict justice according to the best of our performances, we should be undone. (4) The way to obtain pardon for our deficiencies in duty, and all the iniquities of our holy things, is to seek it of God by prayer; it is not so a pardon of course but that it must be obtained by petition through the blood of Christ. (5) In this prayer we must take encouragement from the goodness of God: ‘The good Lord pardon;’ for, when He proclaimed his goodness, He insisted most upon this branch of it, ‘forgiving iniquity, transgression, and sin.’… 2. A successful prayer… not only [He] did not lay their sin to their charge, but graciously accepted their services notwithstanding; for healing denotes not only forgiveness (Isa. 6:10; Ps. 103:3), but comfort and peace, Isa. 57:18; Mal. 4:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible</cite>, on 2 Chron. 30, vv. 13-20</span></figcaption>

<blockquote><p>Come friends, there is no end, nor much hope in disputing against fixed prejudice and wrong confident conceits, how clear soever the light be against it. Hold your judgment and I shall hold mine till God irresistibly reconcile us; and if you cannot forgive me, I can forgive you, but not own the guilt of your mistakes and the effects; I have too much already of my own. I had rather you accused me than [my own] conscience [accuse me] for wilful contracting¹ anymore. The Lord save us from our enemies, but more especially from our friends and all their temptations, and above all, from ourselves.</p></blockquote>

</figure><figure class="quote" id="q-6867dcfd5e" data-kw="">
<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved: 1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law. 2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock. 3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">Degrees of Impurities</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London Ministers</cite>, A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved: 1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law. 2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock. 3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.”

— Degrees of Impurities, London Ministers | A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+that+before+this+text+%5BMal.+1%3A14%2C+%E2%80%9Ccursed+be+the+deceiver%2C+which+hath+in+his+flock+a+male%2C+and+voweth%2C+and+sacrificeth+unto+the+Lord+a+corrupt+thing%3A%E2%80%9D%5D+can+be+opposed+to+what+has+been+said%2C+it+must+be+proved%3A+1.+That+the+things+in+question+are+corruptions%2C+as+much+prohibited+as+the+blind+and+lame+under+the+Law.+2.+That+they+are+such+as+a+person+does+choose%2C+and+it+is+in+his+power+to+help%2C+and+offers+it+when+he+has+a+male+in+his+flock.+3.+That+such+a+corruption+as+affects+not+the+substance+of+worship%2C+does+yet+alter+the+nature+of+it%2C+and+makes+the+whole+to+be+a+corrupt+thing+and+abominable+to+God.%E2%80%9D%0A%0A%E2%80%94+Degrees+of+Impurities%2C+London+Ministers+%7C+A+Collection+of+Cases+%26+other+Discourses+lately+written+to+recover+Dissenters+to+the+communion+of+the+Church+of+England+by+some+Divines+of+the+City+of+London+%28London%2C+1685%29%2C+vol.+1%2C+John+Williams%2C+%E2%80%98The+Non-Conformists%E2%80%99+Plea+for+Lay-Communion+with+the+Church+of+England%E2%80%99+Williams+%28d.+1709%29+was+an+Anglican+bishop.%2C+p.+38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6867dcfd5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6867dcfd5e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=So%20that%20before%20this%20text%20%5BMal,corrupt%20thing%20and%20abominable%20to%20God&amp;text=So%20that%20before%20this%20text%20%5BMal.%201%3A14%2C%20%E2%80%9Ccursed&amp;text=be%20a%20corrupt%20thing%20and%20abominable%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6ed8f21cd7" data-kw="">
<blockquote><p>Come to churches and say, ‘You have these defects among you, and these things to be reformed;’ but if you will come and say, ‘Your churches and your ministers are Antichristian and come from Babylon,’ there is nothing [that] provokes more…. …and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion.</p></blockquote>

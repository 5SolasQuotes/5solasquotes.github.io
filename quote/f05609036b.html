<blockquote><p>I grant, that necessity or decency have introduced many things circumstanial, that are rational, and consequently upon some real antecedent ground, expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures, and the like, without which worship cannot be performed; but to ascribe a liberty to the Church, of appointing ceremonies, having for reason of their signification the will of the instituter, and their use only in the representation, is so manifest an impingement upon divine authority…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, (1671), ‘The Third Dialogue Answered’, pp. 111-12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3ffcc16b4a" data-kw="">
<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-53bee3b9e5" data-kw="">
<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here (section 14) object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [a pseudonym for the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use[d] to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself [a papal apologist] distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgesse [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgesse himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the Sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more then non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, pp. 62-63</span></figcaption>

hing+of+this+is+of+man%2C+but+is+all+divine%5D%2C+for+Christ%E2%80%99s+own+Words+are%2C+or+at+least+should+be%2C+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are+by+Christ%E2%80%99s+own+institution+holy+symbols+of+his+blessed+body+and+blood.+Whereas+the+Word+preached+to+us+is+but+mixedly+and+mediately+divine%2C+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+God%2C+we+are+bidden+try+the+spirits+%5B1+Jn.+4%3A1%5D+and+are+required+after+the+example+of+the+Bereans+to+search+the+Scriptures+daily+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+like+sort+to+try+the+elements+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us+that+the+sacrament+given+according+to+Christ%E2%80%99s+institution+is+more+merely+and+immediately+divine+than+is+the+Word+preached.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+4%2C+%E2%80%98That+the+Ceremonies+are+Idols+among+Formalists+themselves%3B+%26+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+Idolatry%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53bee3b9e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53bee3b9e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=Those%20who%20speak%20out%20more%20plainly,divine%20than%20is%20the%20Word%20preached&amp;text=Those%20who%20speak%20out%20more%20plainly%20than%20bishop&amp;text=and%20immediately%20divine%20than%20is%20the%20Word%20preached" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As for adoring of the ark and footstool of God: 1. Joan Gisenius, a Lutheran says, The Jews had precept and promise to worship God before the ark; we have no command to tie external adoration to any place or creature. 2. Didoclavius [David Calderwood] says, It is lawful to adore God before the ark, and the symbols of his immediate presence, because God is there to receive his own worship Himself, by an immediate indwelling presence: For says Mr. [John] Weames, He appeared in glory above the ark, betwixt the cherubims, and it was a type of Christ who dwelt in our flesh; but it is not lawful to worship Him before the symbols of his grace [the sacraments]. 3. The ark was a type in the act of teaching, we grant; but that it was in the act of adoring God who was immediately present, and a symbol vice-gerent of God, we read not. There is no need of mediate signs where God is immediately present and adored as He was in the ark; they were to fix both senses and thoughts immediately upon God. 4. They were to worship, not the ark, but the precept is, et incurvate vos scabello, Worship toward the ark. Arias Montanus turns it, ‘Worship to the ark’: The Greek fathers of the second Nicene Council, ignorant of the Hebrew Tongue, would have the Lord commanding to adore his footstool; whereas the particle [Hebrew] is a note of the dative case, and often it signifies motion to a thing, or at a place, [Hebrew] ad dextram, and does not absolutely signify the accusative case. Musculus, ‘ad Scabellum‘, he makes it the ark of the testament. Calvin, the Temple. Junius makes it well to signify the measure of bowing, bow to the footstool, or ground, or pavement of the Temple where the Lord’s feet are, as he sat on the cherubims, 1 Chron. 28:1. For there is no ground for adoring the ark, but the words are to be read, ‘Exalt the Lord our God, and bow yourselves’, (to wit, to Jehovah, who shows Himself, or dwells at his footstool), that is, betwixt the cherubims, 2 Sam. 6:1. For the word [Hebrew] at his footstool, is not constructed with the verb, [Hebrew] incurvate vos: Jesuits and Formalists devised that construction, but it is to be constructed with the word, which is to be repeated from the former part of the verse, Bow yourselves to Jehovah who dwelleth in the ark, or in the Temple: A familiar elipsis to the Hebrews, Ps. 5:8. I will bow myself (to the Jehovah dwelling) in the temple of thy holiness, as we are taught, ‘Our Father which art in Heaven’: So [Greek or Hebrew] and it is a description of God from the place where He dwelt, and exhibited his presence to his rude people. 4. It is ignorance in Burges to prove God may be adored in the elements, because they are as excellent symbols of God’s presence as the ark: for created excellency is no ground of adoring the elements, except it be a Godhead, and uncreated excellency: We condemn Pope Anastasius, who directs reverend bowing at the hearing of the Gospel, and not of the Epistles, as if the Gospel were holier than the Epistles.</p></blockquote>

et+are%2C+as+he+sat+on+the+cherubims%2C+1+Chron.+28%3A1.+For+there+is+no+ground+for+adoring+the+ark%2C+but+the+words+are+to+be+read%2C+%E2%80%98Exalt+the+Lord+our+God%2C+and+bow+yourselves%E2%80%99%2C+%28to+wit%2C+to+Jehovah%2C+who+shows+Himself%2C+or+dwells+at+his+footstool%29%2C+that+is%2C+betwixt+the+cherubims%2C+2+Sam.+6%3A1.+For+the+word+%5BHebrew%5D+at+his+footstool%2C+is+not+constructed+with+the+verb%2C+%5BHebrew%5D+incurvate+vos%3A+Jesuits+and+Formalists+devised+that+construction%2C+but+it+is+to+be+constructed+with+the+word%2C+which+is+to+be+repeated+from+the+former+part+of+the+verse%2C+Bow+yourselves+to+Jehovah+who+dwelleth+in+the+ark%2C+or+in+the+Temple%3A+A+familiar+elipsis+to+the+Hebrews%2C+Ps.+5%3A8.+I+will+bow+myself+%28to+the+Jehovah+dwelling%29+in+the+temple+of+thy+holiness%2C+as+we+are+taught%2C+%E2%80%98Our+Father+which+art+in+Heaven%E2%80%99%3A+So+%5BGreek+or+Hebrew%5D+and+it+is+a+description+of+God+from+the+place+where+He+dwelt%2C+and+exhibited+his+presence+to+his+rude+people.+4.+It+is+ignorance+in+Burges+to+prove+God+may+be+adored+in+the+elements%2C+because+they+are+as+excellent+symbols+of+God%E2%80%99s+presence+as+the+ark%3A+for+created+excellency+is+no+ground+of+adoring+the+elements%2C+except+it+be+a+Godhead%2C+and+uncreated+excellency%3A+We+condemn+Pope+Anastasius%2C+who+directs+reverend+bowing+at+the+hearing+of+the+Gospel%2C+and+not+of+the+Epistles%2C+as+if+the+Gospel+were+holier+than+the+Epistles.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+Ch.+1%3B+pp.+171-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb76668911.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb76668911.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-veneration-as-distinguished-from-the-worship-of-adoration/#:~:text=As%20for%20adoring%20of%20the%20ark,Gospel%20were%20holier%20than%20the%20Epistles&amp;text=As%20for%20adoring

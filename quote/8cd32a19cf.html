<main class="wrap"><figure class="quote" id="q-8cd32a19cf" data-kw="">
<blockquote><p>For with less peril is God made a careless spectator and beholder of sin, than if he be believed to be the author and inciter to sin. Neither is there any more capital mischief, than to transfer to God the cause of man’s wickedness. For thus it comes to pass that men having broken their bars, do scot-free commit all riot, as having God the patron and author of their wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 1, p. 2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god.html">The Decrees of God</a></span></div>

</figure><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>

</figure><figure class="quote" id="q-efeb675893" data-kw="liberty of decree">
<blockquote><p>The liberty of the divine decree does not hinder it from being God himself because it is free only terminatively and on the part of the thing, but not subjectively and on the part of God. It is free in the exercised act inasmuch as it resides in the liberty of God to decree this or that thing. It is not free in the signified act because to decree anything depends upon the internal constitution of God by which he understands and wills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1.13</span></figcaption>

</figure><figure class="quote" id="q-19470c5e06" data-kw="Author of sin">
<blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

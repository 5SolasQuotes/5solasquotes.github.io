<main class="wrap"><figure class="quote" id="q-77c36c6e92" data-kw="">
<blockquote><p>Public and popular amusements were also interdicted, among Christians, on the Lord’s-day, from an early period; and when the empire became Christian, were prohibited by law, and under severe sanctions. No ludicrous sports, games, or recreations, however lawful at other times, were allowed on this day. The theatre, the horse-race, the circus, the diversion of hunting, the amusement of dancing, of luxurious feasting, and every kind of dissipating pleasure, were solemnly forbidden, and in many cases visited with heavy penalties. In short, the law of the Church forbade every occupation or amusement which was adapted in any measure to turn a day of spiritual and sacred rest, into a day of carnal indulgence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay in John Holmes Agnew, A Manual on the Christian Sabbath</cite></span></figcaption>

</figure><figure class="quote" id="q-7d64ca73d6" data-kw="">
<blockquote><p>Judge, therefore, reader, whether the pope with his be the church; whether their authority be above the scripture; whether all they teach without scripture be equal with the scripture; whether they have erred, and not only whether they can. And against the mist of their sophistry take the ensamples that are past, in the Old Testament and authentic stories, and the present practice which thou seest before thine eyes.

Judge whether it be possible that any good should come out of their dumb ceremonies and sacraments into thy soul. Judge their penance, pilgrimages, pardons, purgatory, praying to posts, dumb blessings, dumb absolutions, their dumb pattering, and howling, their dumb strange holy gestures, with all their dumb disguisings, their satisfactions and justifyings. And because thou findest them false in so many things, trust them in nothing; but judge them in all things.

Mark at the last the practice of our fleshly spirituality and their ways, by which they have walked above eight hundred years; how they establish their lies, first, with falsifying the scripture; then through corrupting with their riches, whereof they have infinite treasure in store; and last of all, with the sword. Have they not compelled the emperors of the earth, and the great lords and high officers to be obedient unto them, to dispute for them, and to be their tormentors …</p></blockquote>

<blockquote><p>REV. AND DEAR SIR,

I rejoice to hear that my poor labours have been of any service to any in New England. All glory be to the great and glorious God, when out of the mouths of babes and sucklings, he is pleased sometimes to ordain praise. I rejoice to hear the progress of God’s work among you, this last summer and that there are any appearances of its continuance: Blessed be God, dear brother! As to the subject you mention of laymen being sent out to exhort and to teach, supposing them to be real converts, I cannot but think, if it be encouraged and continued, it will be of dreadful consequence to the church’s peace and soundness in the faith. I will not gainsay but that private persons may be of service to the church of God by private, humble, fraternal reproof, and exhortations; and no doubt it is their duty to be faithful in these things.

But in the mean time if christian prudence and humility do not attend their essays, they are like to be prejudicial to the church’s real well-being. But for ignorant young converts to take upon them authoritatively to instruct and exhort publicly, tends to introduce the greatest errors and the grossest anarchy and confusion. The ministers of Christ should be apt to teach and able to convince gainsayers, and it is dangerous to the pure church of God, when those are novices, whose lips should preserve knowledge. It is base presumption, whatever zeal be pretended to, notwithstanding, for any persons to take this honour to themselves, unless they be called of God, as Aaron.

I know most young zealots are apt, through ignorance, inconsideration, and pride of heart, to undertake what they have no proper qualifications for: and, through their imprudences and enthusiasm, the church of God suffers. I think all that fear God, should rise up and crush the enthusiastic creature in the egg. Dear brother, the times we live in are dangerous. The churches in America and elsewhere are in great hazard of enthusiasm: we have need to think of the maxim, principiis obsta. May Zion’s King protect his church! I add no more, but love, and beg a remembrance in your prayers.

GILBERT TENNENT.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-tennent.html">Gilbert Tennent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Jonathan Edwards, [1741] in S. E. Dwight, The Life of President Edwards (New York: G. &amp; C. &amp; H. Carvill, 1830), p. 153.</cite></span></figcaption>

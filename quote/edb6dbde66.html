<main class="wrap"><figure class="quote" id="q-edb6dbde66" data-kw="">
<blockquote><p>‘Sing to the Lord, O ye his saints.’ Not if someone utters the words of the psalm with his mouth, does that one sing to the Lord; but, all who send up the psalmody from a clean heart, and who are holy, maintaining righteousness toward God, these are able to sing to God, harmoniously guided by the spiritual rhythms.

How many stand there, coming from fornication? How many from theft? How many concealing in their hearts deceit? How many lying? They think they are singing, although, in truth they are not singing. For, the Scripture invites the saint to the singing of psalms. ‘A bad tree cannot bear good fruit.’ nor a bad heart utter words of life. Therefore, ‘make the tree good and its fruits good.’ Cleanse your hearts, in order that you may bear fruit in the spirit and may be able, after becoming saints, to sing psalms intelligently to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 14 on Psalm 29</cite>, 3 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 217-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-fec6114fcb" data-kw="">
<blockquote><p>He [Baynes] subsequently discusses the difference of the words in terms of the manner of singing. He does say that a spiritual song might be one which is framed according to the Scripture (Baynes, [ed. London, 1658,] p. 505), but makes no suggestion that this is to be used in an ordinary public worship context. When he comes to “the sum of the verse,” he speaks of “singing both in private and publick, which this Scripture and Col. 3:16 do commend;” but where he speaks of the church service he confines his terms to “Psalms”—”and all things, Psalms, Prayers in the Church must be to edify” (p. 505). When he finally applies the passage he provides this maxim: “get the spirit of David to sing a Psalm of David” (p. 506).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Winzer, ‘Westminster and Worship Examined</cite>, Matthew Winzer, ‘Westminster and Worship Examined: a Review of Nick Needham’s Essay on the Westminster Confession of Faith’s Teaching Concerning the Regulative Principle, the Singing of Psalms, and the Use of Musical Instruments in the Public Worship of God’ from The Confessional Presbyterian #4 (2008), p. 264</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“He [Baynes] subsequently discusses the difference of the words in terms of the manner of singing. He does say that a spiritual song might be one which is framed according to the Scripture (Baynes, [ed. London, 1658,] p. 505), but makes no suggestion that this is to be used in an ordinary public worship context. When he comes to “the sum of the verse,” he speaks of “singing both in private and publick, which this Scripture and Col. 3:16 do commend;” but where he speaks of the church service he confines his terms to “Psalms”—”and all things, Psalms, Prayers in the Church must be to edify” (p. 505). When he finally applies the passage he provides this maxim: “get the spirit of David to sing a Psalm of David” (p. 506).”

medbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=He%20%5BBaynes%5D%20subsequently%20discusses%20the%20difference,a%20Psalm%20of%20David%E2%80%9D%20%28p.%20506&amp;text=He%20%5BBaynes%5D%20subsequently%20discusses%20the%20difference%20of%20the&amp;text=to%20sing%20a%20Psalm%20of%20David%E2%80%9D%20%28p.%20506" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4f75f98945" data-kw="">
<blockquote><p>He would have us cheerful, he commandeth us to rejoice evermore; and, is any merry, ‘let him sing’ (James 5:13), but one of the songs of ‘Sion’ [Ps. 137:3]: only let no corrupt communication proceed out of your mouths; but that which is good to the use of edifying, that it may minister grace to the hearers. Sing Psalms, Hymns, &amp; spiritual Songs, singing with a grace in your hearts to the Lord (Col. 3:16). To such songs the spirit of grace commeth flying: the bees come to aromatical and sweet things, the swine will to the mire: to obscene and meritricious songs and discourses, the devil’s swarm, let them only use and love them, who love their company.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover</cite>, (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ., p. 38-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<main class="wrap"><figure class="quote" id="q-3252b463f8" data-kw="">
<blockquote><p>12. There was in the primitive times an ecclesiastical order of widows, which St. Paul mentions, 1 Tim. 5, whose whole ministry was devoted to charity. They were indeed of the poorer sort, fit rather to receive than give alms; yet the less they could do with their purses, the more was required of their persons: the humbler offices of washing the saints feet, the careful task of bringing up children, and a diligent attendance on every good work. And sure there is parity of reason that those who upon the score of their wealth, exempt themselves from those laborious services should commute for it by more liberal alms. In the warmth and zeal of Christianity, women of the higest quality performed both sorts of charity, forgot their greatness in their condescensions, yet assumed it again in their bounty; founded hospitals, and yet with a labor of love, as the apostle styles it, Heb. 6:10, disdained not sometimes to serve in them. But these are examples not like[ly] to be transcribed in our days: greatness is now grown to such an unwieldiness that it cannot stoop though to the most Christian offices, and yet can as little soar up in any munificent charities: it stands like Nebuchadnezzar’s golden image: a vast bulk only to be adored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-allestree.html">Richard Allestree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lady’s Calling... (Oxford, 1673), pt. 2, section 3, ‘Of Widows’, p. 219 Allestree (1619-1681) was an Anglican.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<blockquote><p>I have also proven before that human laws do not bind to obedience but only in this case, when the things which they prescribe do agree and serve to those things which God’s Law prescribes: so that as human laws they bind not, neither have they any force to bind, but only by participation with God’s Law.</p></blockquote>

</figure><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

<blockquote><p>Bavinck… says, the church ‘cannot do without women in this work.’ This includes things like Sunday school, care for the poor and the sick, care for the elderly, the support of pregnant women, and more. He doesn’t think these activities need to be directly under the oversight of the church as an institution, but the church does have the calling to promote this kind of work where women use their gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wes-bredenhof.html">Wes Bredenhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Herman Bavinck on Women in the Church’ (2021)</cite></span></figcaption>

<blockquote><p>Now beside the apostles, prophets and evangelists, which were not ordained to be ordinary and perpetual offices in the Church (Fr. Junius, Animadversions on Bellarmine, Controversy 5, bk. 1, ch. 11), there are but two ecclesiastical orders or degrees instituted by Christ in the New Testament, viz. elders and deacons. ‘Excellenter Canones d•…os tantum sacros ordines appellari censent, Diaconatus scilicet &amp; Presbyterat•…, quia hos solos primitiva Ecclesia legitur habuisse, &amp; de hi•… sol•… praeceptum Apostli habe•…,’ says the [Medieval] Master of Sentences [Peter Lombard] (bk. 4, Distinction [?]). …Scripture makes no difference of order and degree betwixt bishops and elders; it shows also that they are one and the same order. For in Ephesus and Crete, they who were made elders were likewise made bishops, Acts 20:17 with 28; Tit. 1:5 with 7. And the Apostle, Phil. 1:1, divides the whole ministry in the Church of Philippi into two orders, bishops and deacons. Moreover, 1 Tim. 3, he gives order only for bishops and deacons, but says nothing of a third order. Wherefore it is manifest, that beside those two orders of elders and deacons, there is no other ecclesiastical order which has any divine institution or necessary use in the Church. Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only. They who labor in the Word and doctrine, are either such as do only teach, and are ordained for conserving in schools and seminaries of learning the purity of Christian doctrine and the true interpretation of Scripture, and for detecting and confuting the contrary heresies and errors, whom the apostle calls doctors or teachers: Or else they are such as do not only teach, but also have a more particular charge to watch over the flock, to seek that which is lost, to bring home that which wanders, to heal that which is diseased, to bind up that which is broken, to visit every family, to warn every person, to rebuke, to comfort, etc., whom the apostle calls sometimes pastors, and sometimes bishops or overseers. The other sort of elders are ordained only for discipline and Church government, and for assisting of the pastors in ruling the people, overseeing their manners and censuring their faults… and many more of our divines, who teach that the apostle, 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by ‘governments’, 1. Cor. 12:28, where the apostle says not ‘helps in governments,’ as our new English Translation corruptly reads, but ‘helps, governments,’ etc. plainly putting ‘governments’ for a different order from ‘helps’, or deacons. Deacons were instituted by the apostles (Zanchi, in 4 Prae., col. 766-67) for collecting, receiving, keeping and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, Churches, schools and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments (Junius, Animadversions on Bellarmine, Controversy 5, bk. 1, ch. 13). Beside which employments the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies... (1637), pt. 3, ch. 8, Digression 1, ‘Of the vocation of men of Ecclesiastical order’</cite></span></figcaption>

ripture%2C+and+for+detecting+and+confuting+the+contrary+heresies+and+errors%2C+whom+the+apostle+calls+doctors+or+teachers%3A+Or+else+they+are+such+as+do+not+only+teach%2C+but+also+have+a+more+particular+charge+to+watch+over+the+flock%2C+to+seek+that+which+is+lost%2C+to+bring+home+that+which+wanders%2C+to+heal+that+which+is+diseased%2C+to+bind+up+that+which+is+broken%2C+to+visit+every+family%2C+to+warn+every+person%2C+to+rebuke%2C+to+comfort%2C+etc.%2C+whom+the+apostle+calls+sometimes+pastors%2C+and+sometimes+bishops+or+overseers.+The+other+sort+of+elders+are+ordained+only+for+discipline+and+Church+government%2C+and+for+assisting+of+the+pastors+in+ruling+the+people%2C+overseeing+their+manners+and+censuring+their+faults%E2%80%A6+and+many+more+of+our+divines%2C+who+teach+that+the+apostle%2C+1+Tim.+5%3A17%2C+directly+implies+that+there+were+some+elders+who+ruled+well%2C+and+yet+labored+not+in+the+Word+and+doctrine%2C+and+those+elders+he+means+by+them+that+rule%2C+Rom.+12%3A8+and+by+%E2%80%98governments%E2%80%99%2C+1.+Cor.+12%3A28%2C+where+the+apostle+says+not+%E2%80%98helps+in+governments%2C%E2%80%99+as+our+new+English+Translation+corruptly+reads%2C+but+%E2%80%98helps%2C+governments%2C%E2%80%99+etc.+plainly+putting+%E2%80%98governments%E2%80%99+for+a+different+order+from+%E2%80%98helps%E2%80%99%2C+or+deacons.+Deacons+were+instituted+by+the+apostles+%28Zanchi%2C+in+4+Prae.%2C+col.+766-67%29+for+collecting%2C+receiving%2C+keeping+and+distributing+of+ecclesiastical+goods%2C+which+were+given+and+dedicated+for+the+maintenance+of+ministers%2C+Churches%2C+schools+and+for+the+help+and+relief+of+the+poor%2C+the+stranger%2C+the+sick+and+the+weak%2C+also+for+furnishing+of+such+things+as+are+necessary+to+the+ministration+of+the+sacraments+%28Junius%2C+Animadversions+on+Bellarmine%2C+Controversy+5%2C+bk.+1%2C+ch.+13%29.+Beside+which+employments+the+Scripture+has+assigned+neither+preaching%2C+nor+baptizing%2C+nor+any+other+ecclesiastical+function+to+ordinary+deacons.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Dispute+Against+the+English-Popish+Ceremonies...+%281637%29%2C+pt.+3%2C+ch.+8%2C+Digression+1%2C+%E2%80%98Of+the+vocation+of+men+of+Ecclesiastical+order%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F30381f79ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/30381f79ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/offices-of-church#:~:text=Now%20beside%20the%20apostles%2C%20prophets%20and,other%20ecclesiastical%20function%20to%20ordinary%20deacons." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

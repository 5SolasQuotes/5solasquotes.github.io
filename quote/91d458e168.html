<main class="wrap"><figure class="quote" id="q-91d458e168" data-kw="">
<blockquote><p>Be it so that God rewards the right use of natural things with an increase of natural goods, but not with the collation of supernatural ones. For this would be “to cross over into another kind” (metabainein eis to allo genos). For it is as if someone said that God promised good health to one who makes good use of honors. It is certain that the natural does not have an order of causality to the supernatural, because they are distant by a whole kind; nor can the seed of nature ever rise into the fruit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 57</span></figcaption>

<blockquote><p>…yet this necessity of sinning, incident to all that are brought forth into the world, in massa peccati et perditionis, in the mass of original sin and perdition, is not such either in their, or our opinion, as whereby they cannot but sin; although they would abstain from it; though this be obtruded upon us as it was upon Remigius: whereupon he pleads for himself, and such as were of his mind in the doctrine of predestination after this manner, p 53: Nemo it a sentit aut dicit quod Dei praedestinatio aliquem invitum faciat peccare, ut jam non propriae voluntatis perversitate sed Divinae praedestinationis necessitate peccare videatur. ‘No man’ (says he) ‘does so think or speak as if God’s predestination made a man to sin against his will, in such sort as he should seeme to sin, not through the perverseness of his own will, but by the necessity of divine predestination.’ So say we; neither is this impotency of doing good, anywhere else, but in the corruption of the will, it being a moral impotency according to that of Saint Augustine, Libertas sine gratia non est libertas sed contumacia; ‘Liberty without grace, is not liberty, but wilfullness,’ and Remigius, Histor: Gottescal, p. 29, Ex quibus (says he) speaking of reprobates: Nemo potest salvari, non propter violentiam aliquam Divinae potestatis, sed propter indomabilem et perseverantem nequitiam suae iniquitatis. ‘Not one of them can be saved, not because of any violence of divine power, but by reason of the untameable and persevering naughtiness of their own iniquity.’ and p. 144: De reprobis nullum salvari ullatenus existimavi, non quia non possunt homines de bono ad malum commutari et de malis ac pravis boni ac recti fieri, sed quia in meliùs mutare noluerunt, et in pessimis operibus usque ad fiaē perseverare voluerunt. ‘None of the reprobates do we judge to be saved, not because they could not be changed from evil to good, and of evil and depraved become good and right, but because they would not be changed into better and would to the end persevere in wicked works.’ So then they could be changed but would not: But in what respect is it said they could be changed? was it in respect of the freedom of their wills without grace? Nothing less; see his own words, p. 34: Si dixisset generaliter, nemo hominum sine Dei gratia libero bene uti potest arbitrio, esset catholicus: ‘Had he said generally that no man can rightly use his free will, without the grace of God, he had been a catholic.’ But all the question is about the manner how this grace does work (to wit) whether God gives men grace to believe and repent if they will, and leaves to them to perform the act of faith and repentance; or whether God works the very act of faith and repentance, not to dispute of this point out of God’s Word, which clearly teaches that God works in us the will and the deed, according to his good pleasure, Phil. 3:13. And that he makes us perfect to every good work, working in us that which is pleasing in his sight through Jesus Christ. (Heb. 13:21) Let us take notice of the discourse between Hincmarus and Remigius on this argument that till the love of God comes, man is dead, his will is dead to that which is good. Now love is only given to the believers, posse charitatem habere naturae est hominum, charitatem autem habere gratiae est fidelium. (Of the Predestination of the Saints, ch. 5) For thus writes Hincmarus, p. 3.113: Bonum quod agimus et Dei est et nostrum, Dei per praevenientem gratiam, nostrum per subsequentē liberam voluntatem. ‘The good that we do is both God’s work and ours; of God by grace preventing, ours by free will following.’ To this Remigius answers and first he says Hincmarus discourses after such a manner as if a good work were partly God’s work and partly ours; and again as if the beginning of a good work were God’s, but the effect thereof of man’s free will; although as he (Hincmarus) does endeavor to temper this speech of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653) | Book 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, pp. 14-15</span></figcaption>

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653) | Book 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, pp. 14-15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6yet+this+necessity+of+sinning%2C+incident+to+all+that+are+brought+forth+into+the+world%2C+in+massa+peccati+et+perditionis%2C+in+the+mass+of+original+sin+and+perdition%2C+is+not+such+either+in+their%2C+or+our+opinion%2C+as+whereby+they+cannot+but+sin%3B+although+they+would+abstain+from+it%3B+though+this+be+obtruded+upon+us+as+it+was+upon+Remigius%3A+whereupon+he+pleads+for+himself%2C+and+such+as+were+of+his+mind+in+the+doctrine+of+predestination+after+this+manner%2C+p+53%3A+Nemo+it+a+sentit+aut+dicit+quod+Dei+praedestinatio+aliquem+invitum+faciat+peccare%2C+ut+jam+non+propriae+voluntatis+perversitate+sed+Divinae+praedestinationis+necessitate+peccare+videatur.+%E2%80%98No+man%E2%80%99+%28says+he%29+%E2%80%98does+so+think+or+speak+as+if+God%E2%80%99s+predestination+made+a+man+to+sin+against+his+will%2C+in+such+sort+as+he+should+seeme+to+sin%2C+not+through+the+perverseness+of+his+own+will%2C+but+by+the+necessity+of+divine+predestination.%E2%80%99+So+say+we%3B+neither+is+this+impotency+of+doing+good%2C+anywhere+else%2C+but+in+the+corruption+of+the+will%2C+it+being+a+moral+impotency+according+to+that+of+Saint+Augustine%2C+Libertas+sine+gratia+non+est+libertas+sed+contumacia%3B+%E2%80%98Liberty+without+grace%2C+is+not+liberty%2C+but+wilfullness%2C%E2%80%99+and+Remigius%2C+Histor%3A+Gottescal%2C+p.+29%2C+Ex+quibus+%28says+he%29+speaking+of+reprobates%3A+Nemo+potest+salvari%2C+non+propter+violentiam+aliquam+Divinae+potestatis%2C+sed+propter+indomabilem+et+perseverantem+nequitiam+suae+iniquitatis.+%E2%80%98Not+one+of+them+can+be+saved%2C+not+because+of+any+violence+of+divine+power%2C+but+by+reason+of+the+untameable+and+persevering+naughtiness+of+their+own+iniquity.%E2%80%99+and+p.+144% od+agimus+et+Dei+est+et+nostrum%2C+Dei+per+praevenientem+gratiam%2C+nostrum+per+subsequente%CC%84+liberam+voluntatem.+%E2%80%98The+good+that+we+do+is+both+God%E2%80%99s+work+and+ours%3B+of+God+by+grace+preventing%2C+ours+by+free+will+following.%E2%80%99+To+this+Remigius+answers+and+first+he+says+Hincmarus+discourses+after+such+a+manner+as+if+a+good+work+were+partly+God%E2%80%99s+work+and+partly+ours%3B+and+again+as+if+the+beginning+of+a+good+work+were+God%E2%80%99s%2C+but+the+effect+thereof+of+man%E2%80%99s+free+will%3B+although+as+he+%28Hincmarus%29+does+endeavor+to+temper+this+speech+of+his%2C+by+the+addition+of+grace%2C+not+by+the+fulness+of+it%3B+gratiae+adjunctione+non+etiam+plenitudine%2C+%E2%80%98by+the+adjunction+of+grace%2C+not+also+by+the+fulness+of+it.%E2%80%99+So+he+should+have+done%2C+says+Remigius%2C+cum+vere+totum+sit+Dei%3B+seeing+indeed+the+whole+is+God%E2%80%99s+work%3B+As+the+truth+itself+says%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+the+apostle%2C+%E2%80%98What+hast+thou+that+that+thou+hast+not+received%3F%E2%80%99+Whence+the+blessed+and+glorious+martyr+Cyprian+has+so+defined+it%2C+saying+we+must+glory+in+nothing%2C+seeing+nothing+is+ours%2C+and+concludes+thus%3A+Bonum+itaque+nostrum+totum+Dei+est%2C+quia+totum+est+ex+Deo%3B+et+nihil+boni+nostri%2C+nostrum+est%2C+quia+nihil+boni+nostri+est+ex+nobis.+%E2%80%98Therefore+our+good+works+are+wholly+God%E2%80%99s%2C+and+no+good+of+ours+is+ours%2C+because+it+is+not+of+us.%E2%80%99+And+to+reconcile+this+seeming+contradiction%2C+in+calling+it+our+good%2C+yet+denying+it+to+be+from+us%2C+he+concludes+thus%3A+omne+bonum+nostrum%2C+et+totum+Dei+est%2C+donando%3B+et+totum+nostrum+est%2C+accipiendo.+%E2%80%98Every+good+thing+of+ours+is+wholy+God%E2%80%99s+in+as+much+as+He+gives+it%2C+and+it+becomes+ours+full+and+whole%2C+for+as+much+as+we+receive+it.%27%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29+%7C+Book+2%2C+An+Examination+of+Certain+Passages+inserted+into+Mr.+Hord%E2%80%99s+Discourse%2C+Answer+to+the+Additions%2C+pp.+14-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5c96b5d161.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5c96b5d161.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=yet%20this%20necessity%20of%20sinning%2C%20incident,as%20much%20as%20we%20receive%20it&amp;text=yet%20this%20necessity%20of%20sinning%2C%20incident%20to%20all&amp;text=whole%2C%20for%20as%20much%20as%20we%20receive%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

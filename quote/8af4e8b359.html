<main class="wrap"><figure class="quote" id="q-8af4e8b359" data-kw="eternal generation sunbeams">
<blockquote><p>The generation of the Son is not by derivation or transfusion, nor by an action that begins or ends, but by an eternal emanation, which has no parallel in nature, where generations occur in time. This generation is somewhat shadowed by the analogy of sunbeams continually flowing from the body of the sun. Just as the sun is not prior to its rays, nor is the begetter prior in time to the begotten, so the eternal Father eternally begets the Son, and no temporal priority is to be imagined here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/eternal-generation.html">Eternal generation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ccec615c7d" data-kw="eternal generation essence">
<blockquote><p>As all generation indicates a communication of essence on the part of the begetter to the begotten (by which the begotten becomes like the begetter and partakes of the same nature with him), so this wonderful generation is rightly expressed as a communication of essence from the Father (by which the Son possesses indivisibly the same essence with him and is made perfectly like him).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.4</span></figcaption>

</figure><figure class="quote" id="q-b0d6ffec2e" data-kw="Word Wisdom Spirit">
<blockquote><p>The Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son. In this matter, we must tread cautiously and with suspended judgment. This doctrine must be approached soberly and reverently, as it surpasses human comprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis VIII–IX</span></figcaption>

</figure><figure class="quote" id="q-6fcdad7bf1" data-kw="against Arian">
<blockquote><p>The Scriptures teach so frequently and so explicitly that the Son is God and eternal that to argue otherwise is to willfully ignore the clear light of evidence. Notable is Psalm 45, where, according to the Apostle in Hebrews 1, the Psalmist addresses Christ: &quot;Your throne, O God, is forever and ever; the scepter of your kingdom is a scepter of uprightness. You have loved righteousness and hated wickedness; therefore, God, your God, has anointed you with the oil of gladness beyond your companions.&quot; And in Isaiah 9:6, the Son is called &quot;Mighty God, Everlasting Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XIV</span></figcaption>

</figure><figure class="quote" id="q-a6a6dcb745" data-kw="begot necessarily willingly">
<blockquote><p>Arius vexed the Orthodox by asking whether the Father begot the Son by necessity or by will. To this, the response must be that the Father begot the Son not out of necessity but necessarily, for He did not beget contingently. However, whatever this necessity is, it is voluntary and natural and lacks coercion. The Father did not beget the Son by will, but He begot willingly, for He is not compelled by any external or superior cause to beget.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXIV</span></figcaption>

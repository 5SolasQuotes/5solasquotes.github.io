<main class="wrap"><figure class="quote" id="q-d29f8c98c0" data-kw="">
<blockquote><p>10 The doctrine concerning the Essence of God, is absolved in this question, What God is: to wit, Jehovah Elohim, One in Essence, three in Persons.

11 For God hath so manifested him self; that in the divine Essence being but one, and that undivided, there are three Persons, neither more nor less; to wit, the Father, the Son, and the Holy Ghost.

12 The Father is the first Person, [n]either made, nor created, nor begotten, nor proceeding.

13 The Son is the second Person, not made, nor created, but begotten of the Father from all eternity.

14 Who in the fullness of time took upon him our human nature, in which and through which he paid the price of our redemption.

15 The Holy Ghost is the third person, not made, nor created, nor begotten; but proceeding from the Father and the Son from all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Doctrine</cite>, trans. Ralph Winterton (Cambridge: Roger Daniel, 1640), chapter 1, unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43b8e22d5f" data-kw="">
<blockquote><p>These [Christians] I call by name (for they are not nameless like the stars which are numbered and have names), and they follow me, for I rear them up beside the waters of rest; and they follow every such shepherd, whose voice they love to hear, as you see; but a stranger they will not follow, but will flee from him, because they have a habit of distinguishing the voice of their own from that of strangers. They will flee from Valentinus with his division of one into two, refusing to believe that the Creator is other than the Good. They will flee from Depth and Silence, and the mythical Æons, that are verily worthy of Depth and Silence.

They will flee from Marcion’s god; compounded of elements and numbers; from Montanus’ evil and feminine spirit; from the matter and darkness of Manes; from Novatus’ boasting and wordy assumption of purity; from the analysis and confusion of Sabellius, and if I may use the expression, his absorption, contracting the Three into One, instead of defining the One in Three Personalities; from the difference of natures taught by Arius and his followers, and their new Judaism, confining the Godhead to the Unbegotten; from Photinus earthly Christ, who took his beginning from Mary.

But they worship the Father and the Son and the Holy Ghost, One Godhead; God the Father, God the Son and (do not be angry) God the Holy Ghost. One Nature in Three Personalities, intellectual, perfect, Self-existent, numerically separate, but not separate in Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Arians</cite>, (380), XVI in Nicene and Post-Nicene Fathers 2, 7: 333-34.</span></figcaption>

</figure><figure class="quote" id="q-c4f864304b" data-kw="">
<blockquote><p>Ob. The Son and holy Ghost are not without beginning, therefore they are not eternal.

Answ. This is not a beginning of time or continuance, but only of order and offspring: but the Sabellian here cavil, viz. Christ saith, He that seeth me, seeth the Father: and believest thou not that I am in the Father, and the Father in me? Joh. 14.9.10. therefore the Father and the Son are one person. Ans. Indeed he that seeth the Son seeth the Father, because the Son hath the same essence with the Father, and being manifested in the flesh, hath delivered to us the whole will of God, Joh. 1.18.

Ob. 2. That which is one in number, cannot without contradiction be said to be three in persons: but God is one in number, (Deut. 6.4.) ergo.

Ans. That unity doth signify God’s simple essence, not the manner by which that simple essence subsisteth. Therefore God absolutely according to his essence is one, because he is indivisible: and only in respect of inward relation, I meane the reason of subsisting, is three.

Ob. 3. If there be one being of the Father, another of the Son, and another of the holy Ghost: it followeth, that in God there are three divers beings, and consequently three divers persons.

Ans. The being of the Father doth not signify that essence by which he is absolutely God, but by which he is Father, that is, in that he otherwise subsisteth then doth the Son: therefore the being of the Father is one thing, and the being of the Son is another, and yet both of them have the same essence.

Ob. 4. If there be three Persons truly distinguished, and one only essence, then is there a quaternity in God.

Ans. Not so: for the essence differeth from Person only in reason: but the Persons differ each from other both in reason and in being.

Ob. 5. The Father begot his Son either existing or not existing, to say either of these is absurd.

Ans. We may well say, that the Father begat his Son already existing, because the Father was never without the Son, even as the sun was never without his light. Again, it may be as well said, that he begat him not existing, in that his generation, although it be eternal, yet in order goeth before existence, as the sun is before his light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), pp 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-183aba85a8" data-kw="">
<blockquote><p>A commonplace of the history of doctrine has it that the East (following the Cappadocian Fathers) and the West (following Augustine) adopt radically divergent accounts of the Trinity, though it is less commonly agreed just what the differences between the accounts are. For example, it is often held in the textbooks that the Eastern view somehow ‘starts from’ the persons, whereas the Western view somehow ‘starts from’ the essence… Ayres is clearly correct in supposing that this characterization of the matter is false, and I would like to develop that assessment here. … What I shall do here is briefly consider a couple of philosophical theories on the relations between particulars and universals (section I), and then show how, if at all, the theories could dovetail with Trinitarian theology (section II). In my final section – section III – I attempt to deal with an objection to my analysis, namely that Eastern views, as commonly understood, seem compatible with ‘social’ views of the Trinity in ways that Western views do not. I shall argue that this analysis is mistaken, both on historical and on conceptual grounds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Two Models of the Trinity?’ in Heythrop Journal XLIII</cite>, (2002), pp. 275–94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-aba4ef230c" data-kw="">
<blockquote><p>But such reasoning [that there is only one divine person, not three], if it is approved, is really the heresy of Sabellius. For if we also affirm of the other person everything we affirm of one person, since the two persons are one thing, then Son and Word and begotten should be affirmed of the Father in the same way that these things are affirmed of the Son. And both Father and begetter and unbegotten should be affirmed of the Son in the same way that the Father is such. But if this is so, the Father does not differ from the Son, nor the Son from the Father. Therefore, there is one person, not two.

For although God will be Father and Son, we affirm two persons because we believe the Father and the Son to be distinct from one another. For a father is always the father of someone, and a son the son of someone, nor is a father ever the father of his very self, or a son the son of his very self; rather, a father is one person, and his son another person, and a son is likewise one person, and his father another person.

Therefore, if the Father in God is not one person, and the one of whom he is the Father another person, and if the Son is not one person, and the one of whom he is the Son another person, we falsely call God a Father or a Son. For there can be no Father in God if the one of whom the Father is supposed to be the Father is not distinct from the Father. And likewise, there can be no Son in God if the one of whom the Son is supposed to be the Son is not distinct from the Son. Therefore, there will be no grounds for us to affirm that there are two persons in God, which we affirm because God is Father, and God is Son, and the Father is ever one person, and the Son another.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ded130424e" data-kw="">
<blockquote><p>…the Catalogue itself, containing many errors, blasphemies and practices of the sectaries of this time… Now the errors, heresies, blasphemies in this Catalogue particularized, may be referred to sixteen heads or sorts of sectaries, as namely, 1. Independents. 2. Brownists… … 109. That none are to be admitted to the Lord’s Supper, though believers and saints, nor their children to be baptized, but only they who are members in a church-way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna</cite>, (London, 1646), pp. 13 &amp; 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>Nor is it any sinful separation or disorder for the members of one church to communicate occasionally with other churches of Christ, seeing our relation to the universal Church is more strict and inviolable than to any particular church as such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord</cite>, … (London: Parkhurst, 1691), pt. 2, Question 2, pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-9ab316be07" data-kw="">
<blockquote><p>1. Where persons are esteemed members of churches by external causes without their own consent, or by parochial cohabitation, they may remove from one church unto another by the removal of their habitation according unto their own discretion. For such cohabitation being the only formal cause of any relation to such a church in particular, upon the ceasing of that cause, the relation ceases of its own accord.

2. Where persons are members of churches by mutual confederation, or express personal consent, causeless departure from them is an evil liable unto many aggravations.

3. But whereas the principal end of all particular churches is edification, there may be many just and sufficient reasons why a person may remove himself from the constant communion of one church unto that of another. And of these reasons he himself is judge on whom it is incumbent to take care of his own edification above all other things. Nor ought the church to deny unto any such persons their liberty desired, peaceably and according unto order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, … (London, 1689), ch. 10, pp. 225-26 Owen was a congregationalist puritan.</span></figcaption>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-221fa855fe" data-kw="">
<blockquote><p>There are many cases in which local separation may be lawful: First, as if our callings justly remove us to another place or country. Secondly, if our spiritual advantage bind us to remove to a better minister and more suitable society when we are free. Thirdly, if our lawful pastors be turned out of the place, and we follow them, and turn away but from usurpers. Fourthly, if the pastors turn heretics or wolves. Fifthly, if the public good of the churches require my removal. Sixthly, if any sin be imposed on me, and I be refused by the Church unless I will commit it. In these and some other such cases a remove is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 59, p. 238</span></figcaption>

</figure><figure class="quote" id="q-d9f8a261cc" data-kw="">
<blockquote><p>…when the Gospel is come to a people, if the question be, what gives to this man, not to this man true real right to membership, and ordinances, and seals, so as he may claim them before God and not sin: the meritorious right is Christ’s death, the condition upon his part is faith; hence visible profession as such cannot give right… Profession is in order to the rulers and members of the Church, which have hand according to their place, either formal or tacit consent, to receive in members… the question is, what profession is required in such as the rulers may without sin admit to membership and ordinances; we say a profession morally true, not real conversion judged to be real by men. Now this confession or profession doth not make a Church-member, but declare a Church-member, and it only declares him to the conscience of the rulers, that they sin not in admitting such: but declares him neither to have right before God nor to his own conscience. Yea, for all this profession [Simon] Magus sinned in being baptized, Magus usurped, and hath no true and real right, no not ecclesiastic, except in a most unproper sense; [yet] the Church hath right and command to receive him to member membership and seals…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 1, ch. 22, ‘Whether profession makes a member of the Church visible?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), p. 123</span></figcaption>

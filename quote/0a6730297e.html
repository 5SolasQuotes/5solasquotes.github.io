<blockquote><p>Quest. Why then are Christ’s Disciples bound to pray daily for Pardon? Matth. 6.12.

Answ. 1. Because we are daily committing new Sins, in many things we offend all, James 3.2. We miss it in every thing: Oh, how many are our secret Faults, Psal. 19.12.2. God would have us daily lie under the sense of our former guilt, the desert of Sin, and the worth of pardoning Grace; David was assured of Pardon by Nathan, 2 Sam. 12.13. yet afterwards prays for it, Psal. 51.2. The prodigal Son confesseth his fault, after his Father had fallen on his Neck, Luk. 15.20, 21.3.

Pardoning Grace may be clouded in the sense and assurance of it, and in this respect the Righteousness of God is revealed from Faith to Faith, Rom. 1.17. From a less to a stronger Faith. Besides, 4. We may distinguish betwixt a justified State, and applications of Pardon to Souls, there is forgiveness with God, which must be daily sued out by Faith and Prayer, Psal. 130.4.</p></blockquote>

<blockquote><p>2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. …

I. The nature of this freedom from sin. I told you before, it is an exemption from the dominion and reign of sin.

      1. We quit the evil disposition and temper of our souls…

      2. We renounce our former course of living, after the habits we are free from the acts, we do not, and durst not to live in sin, the former conversation [conduct] is cast off as well as the former lusts… Now this freedom is expressed by a word that signifies justification, and fitly:

      1. Because of the nature of justification, in which there are two branches; liberatio a poena [liberation from punishment], and acceptatio ad vitam [acceptance to life]. The punishment incurred by the Fall is poena damni and poena sensus, the loss and the pain: Both may be considered as in this life, or the life to come… But in this life we must also consider the loss and pain. The pains are all those miseries and afflictive evils, which came into the world by reason of sin. The loss is loss of God’s image: that threatening, ‘Thou shalt die the death,’ Gen. 2:17, implied spiritual death as well as temporal and eternal. Now we are justified when we are freed from punishment, and among other punishments from the punishment of loss, when God giveth us the blessing, which sin had deprived us of: As for instance, when He gives us the sanctifying Spirit [Rom. 5:5], this is called a receiving the atonement, Rom. 5:11. We had forfeited it by sin, and God being pacified in Christ, does restore it to us. Man brought upon himself spiritual death by sin, and the gift of the sanctifying Spirit is the great and first act of God’s pardoning mercy, and a means to qualify us for other parts of pardon. Though the thing be plain of itself, yet to make it more clear to us:

      2. Let us distinguish of the kinds of justification. There is a twofold justification, it is either constitutive or executive. First, constitutive justification is by the new Covenant, when those who submit to the terms are constituted or made righteous: Jn. 5:24, ‘He that hears my word, and believes in Him that sent Me, has everlasting life, and shall not come into condemnation; but is passed from death to life.’ There is God’s grant, and whosoever can make good his claim, has a right to justification by God’s own grant, according to the law of grace, he is one freed from sin. Secondly, executive, when God accordingly takes off all penalties and evils, and gives us all the good which belongs to the righteous or justified: as in the case in hand, when God gives us the Spirit to break the power and reign of sin: And therefore so often in Scripture is God said to sanctify us as a God of peace, or as a God pacified and reconciled to us in Jesus Christ: Heb. 13:20-21, ‘Now the God of peace that brought again from the dead our Lord Jesus, that great Shepherd of the sheep, through the blood of the everlasting covenant, make you perfect in every good work to do his will, working in you that which is well-pleasing in his sight.’ 1 Thess. 5:23, ‘And the very God of peace sanctify ye wholly, etc.’ 2 Cor. 5:18, ‘And all things are of God, who hath reconciled us to Himself by Jesus Christ.’ This God does as a Judge, acting according to the rules of government constituted in the new Covenant, upon the account of the merit of Christ, and our actual interest in Him.

II. As to the degree, how far we are freed from sin.

      1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit.

      2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.</p></blockquote>

of+grace%2C+he+is+one+freed+from+sin.+Secondly%2C+executive%2C+when+God+accordingly+takes+off+all+penalties+and+evils%2C+and+gives+us+all+the+good+which+belongs+to+the+righteous+or+justified%3A+as+in+the+case+in+hand%2C+when+God+gives+us+the+Spirit+to+break+the+power+and+reign+of+sin%3A+And+therefore+so+often+in+Scripture+is+God+said+to+sanctify+us+as+a+God+of+peace%2C+or+as+a+God+pacified+and+reconciled+to+us+in+Jesus+Christ%3A+Heb.+13%3A20-21%2C+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+Shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+covenant%2C+make+you+perfect+in+every+good+work+to+do+his+will%2C+working+in+you+that+which+is+well-pleasing+in+his+sight.%E2%80%99+1+Thess.+5%3A23%2C+%E2%80%98And+the+very+God+of+peace+sanctify+ye+wholly%2C+etc.%E2%80%99+2+Cor.+5%3A18%2C+%E2%80%98And+all+things+are+of+God%2C+who+hath+reconciled+us+to+Himself+by+Jesus+Christ.%E2%80%99+This+God+does+as+a+Judge%2C+acting+according+to+the+rules+of+government+constituted+in+the+new+Covenant%2C+upon+the+account+of+the+merit+of+Christ%2C+and+our+actual+interest+in+Him.%0A%0AII.+As+to+the+degree%2C+how+far+we+are+freed+from+sin.%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A01.+All+the+justified+and+converted+to+God+are+freed+from+the+Reign+of+it.+The+flesh%2C+though+it+remaineth%2C+is+made+subject+to+the+Spirit%2C+which+by+degrees+doth+destroy+the+reliques+of+sin%3A+For+it+is+said+of+the+justified%2C+Rom.+8.1.+There+is+no+condemnation+to+them+that+are+in+Christ+Jesus%2C+who+walk+not+after+the+flesh%2C+but+after+the+Spirit.%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A02.+The+more+obedient+we+are+to+the+motions+of+the+sanctifying+Spirit%2C+the+more+power+we+have+against+sin%3A+Gal.+5.18.+If+ye+be+led+by+the+Spirit%2C+ye+are+not+under+the+Law%2C+under+the+irritating+Power+and+Curse+of+it.+Many+sins+are+in+a+great+measure+left+uncured+as+a+part+of+our+punishment.+%E2%80%A6+4.+Where+the+work+is+really+begun+and+duly+submitted+unto%2C+we+have+hopes+of+a+better+estate%2C+it+still+increases+towards+that+perfect+blessedness%2C+when+we+shall+be+without+spot+and+blemish%2C+or+any+such+thing%2C+Eph.+5%3A27.+What+a+life+do+God%E2%80%99s+holy+ones+live+in+Heaven%2C+who+are+wholly+freed+from+sin%3F%E2%80%A6+There+is+none+in+Heaven+by+the+first+Covenant+%5Bof+Words%5D%3B+all+that+are+there+come+thither+as+sanctified+and+justified+by+Jesus+Christ%2C+and+in+the+way+of+his+pardoning+grace.+Surely+since+we+have+the+same+Redeemer%2C+depend+upon+the+merit+of+the+same+sacrifice%2C+and+wait+for+the+same+Spirit+in+the+use+of+all+holy+means+and+endeavours%2C+He+will+not+be+strange+to+us%E2%80%A6+%E2%80%A6+IV.+How+is+it+a+consequent+of+our+dying+with+Christ%3F%E2%80%A6+%E2%80%A6+2.+It+is+his+privilege%2C+being+crucified+with+Christ%3B+he+has+a+right%2C+and+not+a+right+only%2C+but+his+justification+is+executed+and+applied+to+him+by+the+gift+of+the+sanctifying+Spirit%2C+which+is+the+surest+token+of+God%E2%80%99s+love%2C+and+the+true+effect+of+his+approbation%E2%80%A6+%E2%80%A6+Use+1.+To+inform+us+of+the+intimate+connection+between+all+the+parts+and+branches+of+the+grace+of+the+Gospel.+We+are+absolved+and+discharged+from+the+power+of+sin+as+well+as+from+the+guilt+of+it.+All+will+grant+that+justification+respects+the+guilt+of+sin%3B+but+the+apostle+tells+us+here+that+justification+respects+the+power+of+sin+also.+The+penalty+was+the+loss+of+God%E2%80%99s+image+as+well+as+of+his+favor%3A+so+that+pardon+is+executed+and+applied+when+our+natures+are+sanctified+and+healed.+The+privation+of+the+Spirit+being+the+great+punishment%2C+the+gift+of+the+Spirit+is+a+great+branch+of+our+absolution%2C+and+so+Christ%E2%80%99s+reconciling+and+renewing+grace+fairly+accord+and+agree.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton%2C+%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29+%7C+Sermons+on+Rom.+6%2C+Sermon+6%2C+pp.+36-41+on+Rom.+6%3A7%2C+%E2%80%9CFor+he+that+is+dead+is+freed+%5B%CE%B4%CE%B5%CE%B4%CE%B9%CE%BA%CE%B1%CE%B9%CF%89%CF%84%CE%B1%CE%B9%2C+justified%5D+from+sin.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae8014cdae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae8014cdae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=2.%20The%20predicate%20%5Bof%20the%20verse,renewing%20grace%20fairly%20accord%20and%20agree&amp;text=2.%20The%20predicate%20%5Bof%20the%20verse%20Rom.%206%3A7&amp;text=reconciling%20and%20renewing%20grace%20fairly%20accord%20and%20agree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§VI. Thirdly, when we say it [justification] is an action of God imputing to a believing sinner, etc. we consider it not as a sudden and momentary action which is of no continuance, as if all our sins both past, present and to come are remitted in an instant, but as an act of God continued from our vocation [calling], wherein the grace of faith is begotten in us, to our glorification, which is the end of our faith. For as this action of God is called the justification of a sinner, so while we continue sinners, we have still need to be justified. And as we always have sin in this life, so that it may not be imputed, we have need, that Christ’s righteousness should be imputed unto us; and that as we sin daily, so Christ our advocate should continually make intercession for us: that notwithstanding our manifold slips, whereinto through human frailty we fall, and notwithstanding those manifold infirmities and corruptions which remain in us as the relics of original sin, we may be continued in the grace and favor of God by the continued imputation of Christ’s righteousness obtained by his continual intercession for us. For therefore does he continue his intercession for us that our justification may be continued to us, and that as we sin daily, so we may daily seek and obtain pardon. But if justification should so be wrought once and at once, as that after that act wrought in an instance, we should no more be justified, nor no more need remission of sin, then must we erroneously conceive that the sins which after the first moment of our justification we do commit, are actually remitted before they be committed; whereas God forgives only sins past, Rom. 3:25. So shall we not only set open a gap to all licentiousness (for who will so fear to commit sin as he ought, or when he has committed it so sue for the pardon thereof who is persuaded beforehand that it is already remitted), but also shall open the mouths of our adversaries, who will be ready to say, that we Protestants ought not to pray for remission of sin, because in our opinion (as they say) we need it not: but to this calumniation of the Papist I have elsewhere answered. §. VII. If it be said that it is a received opinion among many that justificatio simul et semel sit, that ‘justification is wrought at once, and but once,’ I answer that that assertion is not to be admitted without distinction, nor without good caution. The distinction is this, that there is a justification of a sinner before God in foro coelesti, which properly is called justification, and is that which here I have defined: and there is a justification whereby a man already justified before God is justified in foro conscientiae, in the court of his own conscience: which is not properly justification itself, but the assurance of it. To this latter that assertion of but once and at once cannot in any good sense be applied. For neither is the full assurance of our justification attained at once, but by degrees, wherein we are to labor and to give diligence to make, as our election and calling, so also our justification more and more sure unto us. Neither is it given but once. For by committing of any crime or any grievous sin, by spiritual desertions, by the forcible temptations of Satan, this act of spiritual faith, which we call assurance, may be interrupted or lost for a time; and yet by repentance, by prayer and practice of piety it may be recovered again, and therefore not given but once. To the former indeed it may be applied in both parts, but with a twofold caution: first, in respect of simul, at once, if it be understood as excluding degrees, and not continuance. Namely, that we are not justified by degrees, and as it were by little and little, as though our justification were not perfect at the first. For no sooner does a man truly believe in Christ, but the righteousness of Christ is imputed to him, and in and by that righteousness he stands righteous before God, as well at the first, as at the last; that righteousness of Christ by which he is justified, whether first or last, being most perfect. Therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men: howsoever the assurance of justification, and the work of sanctification, whereby we are to be renewed in the inner man day by day have degrees, according to the degrees of our faith, and according to the measure of grace received. Secondly, when it is said that we are justified before God semel, but once, that also may be admitted, if by once be meant one continual act. For as we are regenerated but once, because ut semel nascimur, ita semel renascimur, [‘as we have been born once, so we have been reborn once,’] so faith, which is wrought in our regeneration is given but once. For that which saint Jude says, verse 3, of faith once given, is no less true of the habit [abiding principle] than of the doctrine of faith; which habit, being once had, is never utterly lost. For all they who have true faith, are born of God, 1 Jn. 5:1; Jn. 1:12-13. And those who are once born of God are never unborn again; but being made sons by faith, as all the faithful are, Gal. 3:26, they are also made heirs of God and coheirs with Christ, Rom. 8:17. As faith therefore is never utterly lost, no more is justification. For so long as we have faith, so long we are justified. But the habit of faith we never lose, though perhaps some act of faith may sometimes be interrupted. Therefore our justification is but one continued act, and in that sense we are justified but once. §VIII. Now whereas we have defined and defended according to the Scriptures that justification is an action of God, and such an action as is without us and a continued act: hence we may conclude against the Papists: First, that neither their first, nor second justification is that justification which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.</p></blockquote>

teous before God, as well at the first, as at the last; that righteousness of Christ by which he is justified, whether first or last, being most perfect. Therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men: howsoever the assurance of justification, and the work of sanctification, whereby we are to be renewed in the inner man day by day have degrees, according to the degrees of our faith, and according to the measure of grace received. Secondly, when it is said that we are justified before God semel, but once, that also may be admitted, if by once be meant one continual act. For as we are regenerated but once, because ut semel nascimur, ita semel renascimur, [‘as we have been born once, so we have been reborn once,’] so faith, which is wrought in our regeneration is given but once. For that which saint Jude says, verse 3, of faith once given, is no less true of the habit [abiding principle] than of the doctrine of faith; which habit, being once had, is never utterly lost. For all they who have true faith, are born of God, 1 Jn. 5:1; Jn. 1:12-13. And those who are once born of God are never unborn again; but being made sons by faith, as all the faithful are, Gal. 3:26, they are also made heirs of God and coheirs with Christ, Rom. 8:17. As faith therefore is never utterly lost, no more is justification. For so long as we have faith, so long we are justified. But the habit of faith we never lose, though perhaps some act of faith may sometimes be interrupted. Therefore our justification is but one continued act, and in that sense we are justified but once. §VIII. Now whereas we have defined and defended according to the Scriptures that justification is an action of God, and such an action as is without us and a continued act: hence we may conclude against the Papists: First, that neither their first, nor second justification is that justification which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.”

— George Downame, A Treatise of Justification, (London: 1633), ch. 1, pp. 5-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7VI.+Thirdly%2C+when+we+say+it+%5Bjustification%5D+is+an+action+of+God+imputing+to+a+believing+sinner%2C+etc.+we+consider+it+not+as+a+sudden+and+momentary+action+which+is+of+no+continuance%2C+as+if+all+our+sins+both+past%2C+present+and+to+come+are+remitted+in+an+instant%2C+but+as+an+act+of+God+continued+from+our+vocation+%5Bcalling%5D%2C+wherein+the+grace+of+faith+is+begotten+in+us%2C+to+our+glorification%2C+which+is+the+end+of+our+faith.+For+as+this+action+of+God+is+called+the+justification+of+a+sinner%2C+so+while+we+continue+sinners%2C+we+have+still+need+to+be+justified.+And+as+we+always+have+sin+in+this+life%2C+so+that+it+may+not+be+imputed%2C+we+have+need%2C+that+Christ%E2%80%99s+righteousness+should+be+imputed+unto+us%3B+and+that+as+we+sin+daily%2C+so+Christ+our+advocate+should+continually+make+intercession+for+us%3A+that+notwithstanding+our+manifold+slips%2C+whereinto+through+human+frailty+we+fall%2C+and+notwithstanding+those+manifold+infirmities+and+corruptions+which+remain+in+us+as+the+relics+of+original+sin%2C+we+may+be+continued+in+the+grace+and+favor+of+God+by+the+continued+imputation+of+Christ%E2%80%99s+righteousness+obtained+by+his+continual+intercession+for+us.+For+therefore+does+he+continue+his+intercession+for+us+that+our+justification+may+be+continued+to+us%2C+and+that+as+we+sin+daily%2C+so+we+may+daily+seek+and+obtain+pardon.+But+if+justification+should+so+be+wrought+once+and+at+once%2C+as+that+after+that+act+wrought+in+an+instance%2C+we+should+no+more+be+justified%2C+nor+no+more+need+remission+of+sin%2C+then+must+we+erroneously+conceive+that+the+sins+which+after+the+first+moment+of+our+justification+we+do+commit%2C+are+actually+remitted+before+they+be+committed%3B+whereas+God+forgives+only+sins+past%2C+Rom.+3%3A25.+So+shall+we+not+only+set+open+a+gap+to+all+licentiousness+%28for+who+will+so+fear+to+commit+sin+as+he+ought%2C+or+when+he+has+committed+it+so+sue+for+the+pardon+thereof+who+is+persuaded+beforehand+that+it+is+already+remitted%29%2C+but+also+shall+open+the+mouths+of+our+adversaries%2C+who+will+be+ready+to+say%2C+that+we+Protestants+ought+not+to+pray+for+remission+of+sin%2C+because+in+our+opinion+%28as+they+say%29+we+need+it+not%3A+but+to+this+calumniation+of+the+Papist+I+have+elsewhere+answered.+%C2%A7.+VII.+If+it+be+said+that+it+is+a+received+opinion+among+many+that+justificatio+simul+et+semel+sit%2C+that+%E2%80%98justification+is+wrought+at+once%2C+and+but+once%2C%E2%80%99+I+answer+that+that+assertion+is+not+to+be+admitted+without+distinction%2C+nor+without+good+caution.+The+distinction+is+this%2C+that+there+is+a+justification+of+a+sinner+before+God+in+foro+coelesti%2C+which+properly+is+called+justification%2C+and+is+that+which+here+I+have+defined%3A+and+there+is+a+justification+whereby+a+man+already+justified+before+God+is+justified+in+foro+conscientiae%2C+in+the+court+of+his+own+conscience%3A+which+is+not+properly+justification+itself%2C+but+the+assurance+of+it.+To+this+latter+that+assertion+of+but+once+and+at+once+cannot+in+any+good+sense+be+applied.+For+neither+is+the+full+assurance+of+our+justification+attained+at+once%2C+but+by+degrees%2C+wherein+we+are+to+labor+and+to+give+diligence+to+make%2C+as+our+election+and+calling%2C+so+also+our+justification+more+and+more+sure+unto+us.+Neither+is+it+given+but+once.+For+by+committing+of+any+crime+or+any+grievous+sin%2C+by+spiritual+desertions%2C+by+the+forcible+temptations+of+Satan%2C+this+act+of+spiritual+faith%2C+which+we+call+assurance%2C+may+be+interrupted+or+lost+for+a+time%3B+and+yet+by+repentance%2C+by+prayer+and+practice+of+piety+it+may+be+recovered+again%2C+and+therefore+not+given+but+once.+To+the+former+indeed+it+may+be+applied+in+both+parts%2C+but+with+a+twofold+caution%3A+first%2C+in+respect+of+simul%2C+at+once%2C+if+it+be+understood+as+excluding+degrees%2C+and+not+continuance.+Namely%2C+that+we+are+not+justified+by+degrees%2C+and+as+it+were+by+little+and+little%2C+as+though+our+justification+were+not+perfect+at+the+first.+For+no+sooner+does+a+man+truly+believe+in+Christ%2C+but+the+righteousness+of+Christ+is+imputed+to+him%2C+and+in+and+by+that+righteousness+he+stands+righteous+before+God%2C+as+well+at+the+first%2C+as+at+the+last%3B+that+righteousness+of+Christ+by+which+he+is+justified%2C+whether+first+or+last%2C+being+most+perfect.+Therefore+the+righteousness+of+justification+cannot+be+increased%2C+neither+does+our+justification+before+God+admit+degrees%2C+either+in+one+and+the+same+person%2C+or+yet+in+diverse+men%3A+howsoever+the+assurance+of+justification%2C+and+the+work+of+sanctification%2C+whereby+we+are+to+be+renewed+in+the+inner+man+day+by+day+have+degrees%2C+according+to+the+degrees+of+our+faith%2C+and+according+to+the+measure+of+grace+received.+Secondly%2C+when+it+is+said+that+we+are+justified+before+God+semel%2C+but+once%2C+that+also+may+be+admitted%2C+if+by+once+be+meant+one+continual+act.+For+as+we+are+regenerated+but+once%2C+because+ut+semel+nascimur%2C+ita+semel+renascimur%2C+%5B%E2%80%98as+we+have+been+born+once%2C+so+we+have+been+reborn+once%2C%E2%80%99%5D+so+faith%2C+which+is+wrought+in+our+regeneration+is+given+but+once.+For+that+which+saint+Jude+says%2C+verse+3%2C+of+faith+once+given%2C+is+no+less+true+of+the+habit+%5Babiding+principle%5D+than+of+the+doctrine+of+faith%3B+which+habit%2C+being+once+had%2C+is+never+utterly+lost.+For+all+they+who+have+true+faith%2C+are+born+of+God%2C+1+Jn.+5%3A1%3B+Jn.+1%3A12-13.+And+those+who+are+once+born+of+God+are+never+unborn+again%3B+but+being+made+sons+by+faith%2C+as+all+the+faithful+are%2C+Gal.+3%3A26%2C+they+are+also+made+heirs+of+God+and+coheirs+with+Christ%2C+Rom.+8%3A17.+As+faith+therefore+is+never+utterly+lost%2C+no+more+is+justification.+For+so+long+as+we+have+faith%2C+so+long+we+are+justified.+But+the+habit+of+faith+we+never+lose%2C+though+perhaps+some+act+of+faith+may+sometimes+be+interrupted.+Therefore+our+justification+is+but+one+continued+act%2C+and+in+that+sense+we+are+justified+but+once.+%C2%A7VIII.+Now+whereas+we+have+defined+and+defended+according+to+the+Scriptures+that+justification+is+an+action+of+God%2C+and+such+an+action+as+is+without+us+and+a+continued+act%3A+hence+we+may+conclude+against+the+Papists%3A+First%2C+that+neither+their+first%2C+nor+second+justification+is+that+justification+which+is+taught+in+the+Scriptures%E2%80%A6+Not%2C+that+we+deny%2C+that+inherent+righteousness+is+by+practice+of+good+works+increased%3B+but+that+we+hold+that+justification+is+not+our+own+act%2C+neither+that+we+are+justified+by+any+righteousness+inherent+in+ourselves%2C+or+performed+by+ourselves%2C+nor+that+the+righteousness+of+justification+%28which+is+indeed+the+righteousness+of+Christ%29+can+be+increased%2C+and+therefore+no+degrees+of+justification.+%E2%80%A6+Thirdly%2C+they+do+not+hold+justification+to+be+one+continued+act+from+our+vocation+to+our+glorification%2C+but+such+an+act+as+may+not+only+be+interrupted+oftentimes+and+lost+for+a+time%2C+as+they+say+it+is%2C+by+every+mortal+sin+and+again+be+renewed+so+oft+as+they+go+to+shrift%3B+but+also+that+it+may+totally+and+finally+be+lost.+Which+error+I+have+confuted+at+large+in+my+treatise+of+Perseverance.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+A+Treatise+of+Justification%2C+%28London%3A+1633%29%2C+ch.+1%2C+pp.+5-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F87e306e19e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/87e306e19e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=VI.%20Thirdly%2C%20when%20we%20say%20it,large%20in%20my%20treatise%20of%20Perseverance&amp;text=VI.%20Thirdly%2C%20when%20we%20say%20it%20%5Bjustification%5D%20is&amp;text=confuted%20at%20large%20in%20my%20treatise%20of%20Perseverance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

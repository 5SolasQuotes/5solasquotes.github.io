<main class="wrap"><figure class="quote" id="q-a24ec265da" data-kw="">
<blockquote><p>Reading of Homilies: Albeit that all learned and godly teachers do with one consent condemn an ignorant, unlearned slothful minister, and by all means do persuade to their uttermost endeavor in the furtherance and planting of a godly, learned and painful [characterized by taking many pains] ministry, as Calvin, Epist. 127, fol. 124 &amp; Epistle 87, fol. 164-65; Bucer, Censura, ch. 2, fol. 458 &amp; ch. 7, fol. 465 &amp; Epistle to Cranmer, fol. 683; Idem, On the Reign of Christ, bk. 1, ch. 15, fol. 52, 62; Beza, Epistle 12, fol. 95-96 &amp; Epistle 8, fol. 79; Hyperius, De Scriptur. lect., bk. 1, fol. 122-36 &amp; Tome 2, fol. 675-78; Peter Martyr, loc. inter Epist. fol. 1085; Danaeus, Isag., pt. 3, bk. 3, ch. 45, fol. 373; Zanchi, Obseruat. ad Confes., ch. 25, fol. 66-67; Whittaker, in Epistle Dedicatory contra Paraeus, with diverse others. Yet in a case of necessity, Bucer says that it is better that godly and learned homilies made by others should be rehearsed or read unto the people so long as preachers are wanting, which may holily and wholesomely teach and exhort them; Censura, ch. 7, fol. 465. Also in another place he commands the order used both in the primitive times among the Fathers, as also in England in his time of appointing readers in the Church, with condition, si idonei, if they be fit: if they read gravely, religiously, clearly, and to the people’s edification: if they be de singulari pietate commendati, of singular piety: Else he concludes Illos non esse Ministros Christi, that they are not the ministers of Christ which chop and mumble up their reading, as they cannot be understood with edification by the people: I script. Anglican. de vi et vsu ministerij, fol. 564-65. This Zanchi also cites and approves out of Bucer: Obseruat. ad confess., ch. 25, §10-11, fol. 65-67.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623), ‘Reformed Practices’, p. 157</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6bb519db25" data-kw="">
<blockquote><p>The presbyterians deny not but private men may preach in some cases. None that fear God do desire any to bury their talent, nor would hinder men from doing the work of God. But they would have bona bene [good things done well], God’s work done in God’s order. On these conditions we [congregationalists of Baxter’s stripe] allow private men to preach.

1. If they do it but ex charitate [out of charity], and pretend not to the ministerial office.

2. And if they do it occasionally, and not as men separated to that work as their calling (for then they become ministers indeed while they disclaim it in name).

3. If they do it not needlessly, to a proud ostentation of their parts, but only when abler men, or ministers, are not to be had or else [are] on some urgent weighty cause.

4. If they make not themselves the judges of their own fitness, but expect the approbation of the judicious, faithful, concordant ministers that know them.

5. If they undertake no more than they can perform, and suppose not themselves fitter than they are, and so run not beyond their knowledge, nor dishonor not the work of God.

6. If they thrust not themselves into any church to preach without a call, nor ordinarily without the pastor’s consent.

7. If they do it not unseasonably when by offending they are likely to do more hurt than good.

8. If in the manner, season and continuance they submit to the guidance of the pastors of the Church (if it be more than ordinary teaching, and not such as every able master of a family may there do). With these cautions we grant that private men may preach; many episcopal divines grant it: and the presbyterians ordinarily permit it in their expectants that are trained up for the ministry… And, says Dr. Fulke, Demetrius himself does seem to allow that when no bishop was present, a layman might preach: Eusebius, Ecclesiastical History, bk. 6, ch. 19 [sect. 15-18]. But that every proud unworthy man and every seducing heretick should preach, yea and thrust himself into other men’s charges, or that any should preach besides the forementioned rules, this we deny, and take it for a dangerous usurpation. But are we not agreed [with the presbyterians] in this? Hear and judge: Mr. [John] Cotton so downright denies ordinary private men to prophesy, interpreting 1 Cor. 14:31 of extraordinarily gifted prophets (of which see his Keys, pp. 20-21) that Mr. [Thomas] Goodwin and Mr. [Philip] Nye thought meet to signify some dissent, ‘Preface’, p. 6. And yet they grant, that this must be performed by private men:

1. Only occasionally, not in an ordinary course.

2. By men of such abilities as are fit for office.

3. And not assuming this of themselves, but judged such by those that have the power, and so allowed and designed to it. And, 4. So as their doctrine be subjected (for the judging of it) in an especial manner to the teaching elders of that church. And I think that this is enough to signify that here we shall have no cause of a breach with them [presbyterians]. Mr. [John] Norton speaks to the same purpose, pp. 123-25, and joins with Mr. Cotton in denying prophesy to private men and expounding 1 Cor. 14 of extraordinarily gifted prophets only: In this therefore doctrinally we agree [with the presbyterians].</p></blockquote>

</figure><figure class="quote" id="q-52542a4692" data-kw="">
<blockquote><p>In preaching they [the Independents] differ from the Brownists [Separatists] and us, and join with the Popish monks; they will not be tied to a text of Scripture for the ground of their discourse, but will be at liberty to run out on whatsoever matter they think most fit and expedient for their hearers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), ch. 6, p. 118</span></figcaption>

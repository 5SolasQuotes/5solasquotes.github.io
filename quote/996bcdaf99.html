<main class="wrap"><figure class="quote" id="q-996bcdaf99" data-kw="">
<blockquote><p>Perfection is God all-sufficient and all-excellent: not having need of any thing, giving sufficience unto and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite Sea of all happiness. Perfection is increated [uncreated] glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word ’eminently,’ taken in its strict and proper sense, seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. Eminential continency, and virtual continency (that is, for one thing to be contained in another eminently, as the excellency of the creature is in the Creator: or virtually, as all things saleable are in money, Eccl. 10:9) are not the same: the first is proper to the Creator; the second is found in the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, p. 20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f207c9e0fe" data-kw="">
<blockquote><p>…those dreamers who have a spirit of bitterness and contradiction, who reprove everything and prevent the order of nature. We will see some who are so deranged, not only in religion but who in all things reveal their monstrous nature, that they will say that the sun does not move, and that it is the earth which shifts and turns. When we see such minds we must indeed confess that the devil posses them, and that God sets them before us as mirrors, in order to keep us in his fear. So it is with all who argue out of pure malice, and who happily make a show of their imprudence. When they are told: “That is hot,” they will reply: “No, it is plainly cold.” When they are shown an object that is black, they will say that it is white, or vice versa. Just like the man who said that snow is black; for although it is perceived and known by all to be white, yet he clearly wished to contradict the fact. And so it is that they are madmen who would try to change the natural order, and even to dazzle eyes and benumb their senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on 1 Corinthians 10:19-24’ in Calvini Opera Selecta, Corpus Refomatorum</cite>, Vol 49, p. 677, tr. Robert White in ‘Calvin &amp; Copernicus: the Problem Reconsidered’ in Calvin Theological Journal 15 (1980), pp. 236-237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

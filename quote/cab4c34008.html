<main class="wrap"><figure class="quote" id="q-cab4c34008" data-kw="">
<blockquote><p>In light of all of these problems with Van Til’s thought, it is clear that when twentieth-century Reformed Christians followed Van Til and adopted his presuppositionalism in place of the traditional apologetics and theology of the sixteenth- and seventeenth-century Reformed scholastic theologians, they let go of an invaluable and precious birthright. What replaced that birthright has been uniquely detrimental to the contemporary Reformed church… If we would take the time to go back and carefully reread the Reformed scholastics, we would discover that it is they, and not Van Til, who provide us with an approach to theology and a foundation for apologetical work that is biblical, clear, precise, and internally self-consistent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/keith-a-mathison.html">Keith A. Mathison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Christianity &amp; Van Tillianism’ (2019) 113 paragraphs</cite></span></figcaption>

<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>

<blockquote><p>Material and formal cause, properly so called, does not have place in accidents, although by some all beings promiscuously, whether substances or accidents, are wont to be explained through four kinds of causes. Yet if anyone wishes to form analogical concepts of it [regeneration] after the manner of physical generation, let him consider: I. The Holy Spirit as the one generating, 1 Jn. 5:1. II. The transient matter or matter of generation, the Word of God, which is compared to seed, 1 Pet. 1:23. III. The proximate constituting matter, the intellect. IV. The form, faith or the new creature. V. The composite from man’s intellect with will and from the image of God or new creature: let it be the new man, the man of God, the spiritual man. VI. That introduced form informs and actuates the matter, and thus renders man active for spiritual life; moreover constitutes him in a certain kind of things and distinguishes him from all other men not regenerate; finally renders him fit for every good work.</p></blockquote>

<blockquote><p>50. Being is divided into substance and accident. … About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. … Relative Being to Absolute Being [see pp. 69-72 of the Summary] 52. If there is relative being, absolute being must exist. For once the existence of a purely relative being has been admitted, some other beings must exist, namely subject, term and foundation [p. 69]. But all these are as it were the matter of relation and so are not formally the relation, nor formally ‘existing-to’; therefore they are absolute beings. But even on the other opinion, this proposition can in some way be saved. For if relative being is formally a being of reason with a foundation in the thing, something truly real and therefore absolute is required, namely the foundation itself. 53. From the nature of relation, it is plain that relation cannot be found, nor be known, unless subject, term, and foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Conclusions respecting Reality’</cite></span></figcaption>

<blockquote><p>The soul, by which each was man, was not educed from the potency of the body, but was created from nothing by God [in Gen. 2], infused into the body and personally united with it. For God breathed into the body the spirit of life, that is, the soul, Gen. 2:7, and thus man was made a living soul, in the same place and 1 Cor. 15:45. Therefore the soul of man is of a spiritual nature, as it is everywhere called ‘spirit’, Ps. 31:5; Eccl. 12:7; Zech. 12:1; Lk. 23:46; Acts 7:59. It is immortal, which cannot be killed, Mt. 10:28, but after death remains surviving, Mt. 22:32; Phil. 1:23; Lk. 16:22-23ff. Endowed also with the faculty of understanding and willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The soul, by which each was man, was not educed from the potency of the body, but was created from nothing by God [in Gen. 2], infused into the body and personally united with it. For God breathed into the body the spirit of life, that is, the soul, Gen. 2:7, and thus man was made a living soul, in the same place and 1 Cor. 15:45. Therefore the soul of man is of a spiritual nature, as it is everywhere called ‘spirit’, Ps. 31:5; Eccl. 12:7; Zech. 12:1; Lk. 23:46; Acts 7:59. It is immortal, which cannot be killed, Mt. 10:28, but after death remains surviving, Mt. 22:32; Phil. 1:23; Lk. 16:22-23ff. Endowed also with the faculty of understanding and willing.”

<blockquote><p>It was formerly stated, that one in which a divine right or the warrant for any duty is established, is by approved examples in scripture. The word of God contains examples to persons in every character and station of life. In particular, it exhibits examples of godly magistrates. But where do we read, in all the book of God, of approved magistrates who confined themselves, in their official capacity, to civil matters, and the secular interests of mankind, and who did not employ their authority for the advancement of religion? We have a large account of the conduct of Moses and Joshua, David and Solomon, Asa and Jehoshaphat, Hezekiah and Josiah. Who will deny that their actions are recorded as an example to rulers? But they are commended chiefly for the warm zeal and activity, which they displayed in their station, in settling or reforming religion, providing for the instruction of their subjects, and the due administration of divine ordinances. No magistrate, who consults the Bible, will ever imagine that religious matters are excluded from his province. This notion must have been imbibed from some very different source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, sections 6 &amp; 23, pp. 8-9, 14</span></figcaption>

</figure><figure class="quote" id="q-322cbbbe63" data-kw="">
<blockquote><p>Whosoever shall seriously consider, how the Earth is divided in several parcels, according to the diversity of Nations, Peoples, Languages, Empires, and Kingdoms, and how in every State or Common-Wealth, each one of their Bodies and Commonalities have their proper and peculiar portions, and in each Commonality each one his possessions and Heritages, doubtless in this he shall find a wonderful Harmony, and an admirable disposition, which cannot proceed from Fate and Fortune; but indubitably is from a supreme Wisdom, which hath so managed and disposed of these things, and given to every one so much as it judged fit, as a dying Father doth justly and wisely give to every one of his Children their Portions to avoid the Suits and Quarrels that might arise among them.

This distinction of Heritages and Possessions doth not proceed from the Fancy and mere Will of man (see the forecited passage of Moses for that) but is grounded upon Justice and Reason, it proceeds I say from that Reason by which man is above bruits, and is the Foundation of all those virtues which make him so wonderful and excellent above beasts, for without the distinction of Mine and Thine, there could not be amongst men any Operation of Virtue. The Earth of it self brings forth, and affords to all living Creatures all that is necessary for them to keep them alive, Man only excepted; therefore they have nothing of their own, but live in common with what they meet withal, but as for man, if he will supply his necessary wants, he must labour, till the Earth, and in sundry manners seek out of it that which is profitable to, or necessary for him: And to this end he is endowed with Reason, which guides and instructs him in his undertakings.

Now it is just, and consonant to Reason, that every one should enjoy the fruits of his Labours, and possesses the incomes of them: Add to this, that man comes naked into the World, and hath need of Clothes to cover himself, as well for decency, as to protect him from the injuries of Weather, and therefore needs a house also to shelter himself, and of several Utensils to supply the needs of this Life, which obligeth him to betake himself to divers kinds of Handy-crafts, and Workmanships, the possession and disposition of which ought to belong to those that made them.

Moreover, Man in this differs from Beasts, in that he ought not to follow his Lusts loosely without Rule or measure, but ought to be tied to one woman by an indissoluble Bond, and this Nature hath taught to all Peoples and Nations, even the most wild and barbarous, all which of them do practise Marriage as a Doctrine taught them by Nature and Reason: it follows then that the breeding and education of the Children which are born from Marriage, ought rather to be given them by their Fathers and Mothers then by any others.

From all these forementioned, it appears that the distinction of Mine and Thine, and the difference of Possessions of Goods and Heritages, proceeds from an immutable and Natural Right grounded in Reason, Equity, and Justice, and not an arbitrary thing merely depending upon the Fancy of men that would have it so, whence the impertinency of Plate is evident, who would in his Common Wealth have all things, even Women and Children common, for besides that, in this state of sin which man is now involved in, such a thing is both absurd and impossible, and would introduce in the society of men a monstrous confusion of things, I say that even if there were no sins in man, and that he was in his first are of purity, it could not with any pretence of Reason have place any where, as before it hath been shewed.

Now in this difference of Mine and Thine, which is, and ought to be among men, and without which their society cannot subsist, is ground the Exercise of all Virtues, as of Justice, Temperance, Truth, Fidelity, Magnanimity, Liberality, &amp;c. This being so, we must necessarily acknowledge a Providence and infinite Wisdom which hath endowed man with this Reason, and ground of this difference of Mine and Thine, and so consequently of all Moral Virtues which all do acknowledge to be the most glorious, admirable, &amp; excellent things in all the world, and which could never have had for its Author, Fate, or change, or any irrational thing, such as necessarily the order of Nature is, unless it be ruled and governed by a superior wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-cappel.html">Louis Cappel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated</cite>, trans. Philip Marinel (London: Thomas Dring, 1660), pp 49-52.</span></figcaption>

— Louis Cappel, The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated, trans. Philip Marinel (London: Thomas Dring, 1660), pp 49-52.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhosoever+shall+seriously+consider%2C+how+the+Earth+is+divided+in+several+parcels%2C+according+to+the+diversity+of+Nations%2C+Peoples%2C+Languages%2C+Empires%2C+and+Kingdoms%2C+and+how+in+every+State+or+Common-Wealth%2C+each+one+of+their+Bodies+and+Commonalities+have+their+proper+and+peculiar+portions%2C+and+in+each+Commonality+each+one+his+possessions+and+Heritages%2C+doubtless+in+this+he+shall+find+a+wonderful+Harmony%2C+and+an+admirable+disposition%2C+which+cannot+proceed+from+Fate+and+Fortune%3B+but+indubitably+is+from+a+supreme+Wisdom%2C+which+hath+so+managed+and+disposed+of+these+things%2C+and+given+to+every+one+so+much+as+it+judged+fit%2C+as+a+dying+Father+doth+justly+and+wisely+give+to+every+one+of+his+Children+their+Portions+to+avoid+the+Suits+and+Quarrels+that+might+arise+among+them.%0A%0AThis+distinction+of+Heritages+and+Possessions+doth+not+proceed+from+the+Fancy+and+mere+Will+of+man+%28see+the+forecited+passage+of+Moses+for+that%29+but+is+grounded+upon+Justice+and+Reason%2C+it+proceeds+I+say+from+that+Reason+by+which+man+is+above+bruits%2C+and+is+the+Foundation+of+all+those+virtues+which+make+him+so+wonderful+and+excellent+above+beasts%2C+for+without+the+distinction+of+Mine+and+Thine%2C+there+could+not+be+amongst+men+any+Operation+of+Virtue.+The+Earth+of+it+self+brings+forth%2C+and+affords+to+all+living+Creatures+all+that+is+necessary+for+them+to+keep+them+alive%2C+Man+only+excepted%3B+therefore+they+have+nothing+of+their+own%2C+but+live+in+common+with+what+they+meet+withal%2C+but+as+for+man%2C+if+he+will+supply+his+necessary+wants%2C+he+must+labour%2C+till+the+Earth%2C+and+in+sundry+manners+seek+out+of+it+that+which+is+profitable+to%2C+or+necessary+for+him%3A+And+to+this+end+he+is+endowed+with+Reason%2C+which+guides+and+instructs+him+in+his+undertakings.%0A%0ANow+it+is+just%2C+and+consonant+to+Reason%2C+that+every+one+should+enjoy+the+fruits+of+his+Labours%2C+and+possesses+the+incomes+of+them%3A+Add+to+this%2C+that+man+comes+naked+into+the+World%2C+and+hath+need+of+Clothes+to+cover+himself%2C+as+well+for+decency%2C+as+to+protect+him+from+the+injuries+of+Weather%2C+and+therefore+needs+a+house+also+to+shelter+himself%2C+and+of+several+Utensils+to+supply+the+needs+of+this+Life%2C+which+obligeth+him+to+betake+himself+to+divers+kinds+of+Handy-crafts%2C+and+Workmanships%2C+the+possession+and+disposition+of+which+ought+to+belong+to+those+that+made+them.%0A%0AMoreover%2C+Man+in+this+differs+from+Beasts%2C+in+that+he+ought+not+to+follow+his+Lusts+loosely+without+Rule+or+measure%2C+but+ought+to+be+tied+to+one+woman+by+an+indissoluble+Bond%2C+and+this+Nature+hath+taught+to+all+Peoples+and+Nations%2C+even+the+most+wild+and+barbarous%2C+all+which+of+them+do+practise+Marriage+as+a+Doctrine+taught+them+by+Nature+and+Reason%3A+it+follows+then+that+the+breeding+and+education+of+the+Children+which+are+born+from+Marriage%2C+ought+rather+to+be+given+them+by+their+Fathers+and+Mothers+then+by+any+others.%0A%0AFrom+all+these+forementioned%2C+it+appears+that+the+distinction+of+Mine+and+Thine%2C+and+the+difference+of+Possessions+of+Goods+and+Heritages%2C+proceeds+from+an+immutable+and+Natural+Right+grounded+in+Reason%2C+Equity%2C+and+Justice%2C+and+not+an+arbitrary+thing+merely+depending+upon+the+Fancy+of+men+that+would+have+it+so%2C+whence+the+impertinency+of+Plate+is+evident%2C+who+would+in+his+Common+Wealth+have+all+things%2C+even+Women+and+Children+common%2C+for+besides+that%2C+in+this+state+of+sin+which+man+is+now+involved+in%2C+such+a+thing+is+both+absurd+and+impossible%2C+and+would+introduce+in+the+society+of+men+a+monstrous+confusion+of+things%2C+I+say+that+even+if+there+were+no+sins+in+man%2C+and+

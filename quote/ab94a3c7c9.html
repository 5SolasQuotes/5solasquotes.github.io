<blockquote><p>If it be asked whether ignorance can excuse a man, and how far it excuses. Answer 1. There is no ignorance (properly so called) that excuses wholly, pro toto, it being of itself sinful, and men being obliged to know what is sin, and what not; neither can ever men do that out of faith which they do in ignorance, and know not if it be in itself sinful or lawful: this is to be understood in respect of ignorantia Juris, non facti, of ‘the ignorance of the Law, and not of the ignorance of the fact’ (as they call it); for men may sometimes be ignorant of this, and yet be innocent, as when one is cutting with an axe, and it falls off the helve, etc. but in respect of the Law, there is no invincible ignorance that can excuse any for their not knowing God’s mind, because they are obliged to know it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 1st Commandment, pp. 45-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-46ea3c98db" data-kw="">
<blockquote><p>3. Magistrates as magistrates hold forth in their Law abstinence from these sins [of adultery, incest, murder, etc.], not as the ambassadors of Christ, craving subjection of conscience and divine faith to those charges, but only external obedience: For though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience, nor is he in Christ’s stead to lay divine bands on the conscience to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order and as the Creator, and Founder, and another of human societies and of peace, to exact external obedience and to lay bands on your hands, not to shed innocent blood, and on your body not to defile it with adultery or incest, nor to violate the chastity of your brother; Hence it is evident that the adversaries are far out who would have ministers who do hold forth commands that lay hold on the conscience and crave faith and soul-submission under the pain of eternal wrath, to do and act as the deputies and vicars of those who have nothing to do with the conscience [such as prelates who simultaneously held civil offices], and have neither office nor authority to crave soul submission or to threaten or inflict any punishment but such as is circumscribed within the limits of time and which the body of clay is capable of; yea, when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 550-51</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 8, p. 150</span></figcaption>

</figure><figure class="quote" id="q-57c4aa3f04" data-kw="">
<blockquote><p>IV. (3) We must observe that the right of God (as far as regards creatures) is either of dominion (which includes the right of possessing, disposing and using creatures, as a lord or proprietor, who is able to use and enjoy his own property at pleasure); or of government (which properly refers to rational creatures whom He governs as ruler and legislator; to whom belong legislation, judgment and execution…)… … XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist). … XXXII. …(3) Nor assuredly can the Egyptians [at the Exodus, with reference to them giving their belongings to the Israelites] themselves be considered the lawful owners in the court of heaven with God, but only usurpers (as also other wicked men, although in the forum of earth and with men they are esteemed such)… XXXIII. Although it was not lawful to move a sickle into a neighbor’s standing corn, still the liberty was formerly lawfully granted to a passing traveller, either to pluck ears of corn from the field or grapes from a vineyard for the sake of satisfying hunger (Dt. 23:24,25). This was done not by dispensing with the law of theft, but by its true interpretation for it was a work of necessity, permitted by the supreme Lord for the purpose of binding men more closely in the bonds of love. If these acts have any indecency in themselves, they cease to be such when the divine command (or instinct or vocation) intervenes, imposing such a necessity or conceding liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, sections 4, 18, 32-33, pp. 8, 12 &amp; 18</span></figcaption>

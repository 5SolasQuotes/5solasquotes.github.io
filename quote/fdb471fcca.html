<main class="wrap"><figure class="quote" id="q-fdb471fcca" data-kw="">
<blockquote><p>Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-richardson.html">John Richardson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Choice Observations &amp; Explanations upon the Old Testament… which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

sonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Many%20signs%20of%20lamentations%20are%20expressed,the%20flesh%2C%20tearing%20it%2C%20cutting%20it&amp;text=Many%20signs%20of%20lamentations%20are%20expressed%20here.%20Which&amp;text=marks%20upon%20the%20flesh%2C%20tearing%20it%2C%20cutting%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c03c3aae9e" data-kw="">
<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-mede.html">Joseph Mede</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Diatribae Discourses on Diverse Texts of Scripture (London, 1642-1648), Discourses on Diverse Texts of Scripture, Sermon on 1 Cor. 11:5</cite>, pp. 182-83</span></figcaption>

</figure><figure class="quote" id="q-95f09a7369" data-kw="">
<blockquote><p>Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.</p></blockquote>

<blockquote><p>Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…</p></blockquote>

<blockquote><p>The Banner of Truth reprint of James Bannerman’s famous book on ecclesiology, The Church of Christ omitted the preface by Principal Robert S. Candlish. We reproduce it here owing to the insights that it gives into Bannerman’s teaching methods and for Candlish’s biographical reflections on his fellow Free Churchman:

I HAVE been asked to introduce these Volumes to the Christian public, and I gladly consent to do so. They do not indeed require any introduction outside of themselves; nor, if they did, could mine be of much avail, for I cannot pretend to anything like such a systematic and scholarly acquaintance with the department of Theology to which they belong, as might give me a right to speak with authority. The book, therefore, as to its intrinsic merits, must speak for itself, so far as I am concerned; it will do so all the better for the brief analysis of its contents which Dr. [Robert] Rainy has furnished. I may be allowed, however, to say that, whether exhaustively or suggestively, Dr. Bannerman seems to me to have mastered the entire field, not only in the way of a general survey, but in the way of insight also into all details.

Exhaustively or suggestively, I have said; for these would seem to be two different methods of professorial prelection. Of the two, the suggestive method is clearly the preferable one. To send students away under the impression that they have got all that needs to be got for solving every problem and settling every question in the branch of study to which they have been giving one or two years of attendance on professorial lectures, is a serious mistake on the part of the Chair, and a sore evil to its victims, discovered often only when it is too late to have it remedied.

No such fault can be found with these Lectures. But a special good can be found in them. They are exhaustive, in the right way of exhaustively mapping out the entire ground to be surveyed minutely and particularly; while at the same time they are not exhaustive, but the reverse, as regards the actual surveying of the ground thus mapped out. They are suggestive, and highly suggestive, in themselves and in their references, on all questions of detail, while at the same time they bring out clearly and fully the entire doctrine as a whole, and the bearing of these detailed questions upon the entire doctrine as a whole.

But I may be allowed a few words about the Author, if not about this work of his.

I can testify, with the utmost confidence, to his being competent, and admitted on all hands to be competent, to give a fair and full representation of the theory of Church polity, all but unanimously adopted in Scotland at and after the Reformation, — not under influences from without, such as regal supremacy or papal dictation; but inwardly and directly from the study of the Divine Word, and the honest application of its principles to the problems of Divine Providence as they came up. For that is what we claim to be the characteristic of our Scottish Reformation, that in all the departments of doctrine, worship, and government, it was no mere modification of the Romish system, in accommodation to altered circumstances, but a reconstruction of the Divine plan, freshly based on the old foundation.

For the exposition of the doctrine of the Church upon that footing, and in that view, Dr. Bannerman was eminently qualified. He was a close and thorough biblical student; and he was an authority in ecclesiastical history and law.

I can recall his first public and prominent service rendered to the Church in the years 1839–41, when it fell to him mainly to conduct a case of heresy, involving very delicate and difficult points in Theology. And I can recall also his valuable service rendered in connection with the gravest question raised in the course of our ‘ten years’ conflict, —that of the Strathbogie interdicts. In both instances Dr. Bannerman won for himself the full confidence and esteem of the whole Church; and it was felt to be only a suitable acknowledgment of his worth and his work when he was called to occupy the professorial Chair.

Of his manner of occupying that Chair, I need not speak. But I must express the deep feeling of regret with which all parties in the Church received the tidings of his death, at the very time when he was coming forward more than his special professorial engagements had previously permitted, in the discussion of matters widely and deeply affecting the general interests of Christian peace and union in the Church catholic, as well as in our own branch of it. In that view, one is constrained to wonder, and stand in awe, and say, ‘It is the Lord.’ R. S. C.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: x-xii.</span></figcaption>

<blockquote><p>So far then as the Council proveth the determination and commandment that it giveth by the plain word of God, so soon do we reverence and embrace the same. But if men, under the name of a Council, pretend to forge unto us new articles of our faith, or to make constitutions repugnant to the word of God, then utterly we must refuse the same, as the doctrine of devils, which draweth our souls from the voice of our only God, to follow the doctrine and constitutions of men.</p></blockquote>

<blockquote><p>It may be noted here that the term ‘Cameronian’, often loosely applied to the adherents of Cameron and Cargill, was originally coined about 1678 or 1679 to describe, disparagingly, those who shared [Richard] Cameron’s views on the supremacy [of the English and Scottish king] and Indulgence (cf. The Nonconformist’s Vindication, 1700, p. 16; A True and Impartial Relation of Bothwell Bridge, 1797, p. 16 [1751, p. 20]). It did not, however, gain much currency until after the Revolution of 1688, when it was used to denote those elements of the United Societies which did not join the Revolution Settlement (cf. [Patrick Walker] Six Saints of the Covenant, vol. I. p. 251)¹ ¹ [Walker says previously in the volume: “I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton, who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world;” Ibid., pp. 138-39] The term was never owned by those to whom it was applied, and it is uniformly described in their literature as a ‘by-name’ or ‘nick-name’ (cf. A Short Memorial of Sufferings and Grievances, 1690, title page). To the same effect are some remarks by John M’Main (Earnest Contendings, 1723, p. 376) when in taking Wodrow severely to task for using the term in his History he asserts, ‘He calumniates and fixes upon these faithful witnesses of Jesus Christ that stigma, or name of reproach, wherewith their enemies had branded them, calling them after a man, and falsely alleging that they termed themselves so, and labours to make his readers, in this and future generations, believe the calumny thus confirmed, that they were not Presbyterians. But he cannot produce one instance among all the cloud of witnesses, whom he so reproaches, evincing that ever any of them did so term themselves.&#x27;</p></blockquote>

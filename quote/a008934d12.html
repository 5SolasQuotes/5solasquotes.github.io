<main class="wrap"><figure class="quote" id="q-a008934d12" data-kw="">
<blockquote><p>The covenant of grace, set down in the Old Testament before Christ came, and in the New since he came, is one and the same in substance, albeit different in outward administration: For the covenant in the Old Testament, being sealed with the ordinances of circumcision and the paschal lamb, did set forth Christ’s death to come, and the benefits purchased by it, under the shadow of bloody sacrifices, and various ceremonies: but since Christ came, the covenant being sealed by the ordinances of baptism and the Lord’s supper, does clearly hold forth Christ already crucified before our eyes, victorious over death and the grave, and gloriously ruling heaven and earth, for the good of his own people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson-james-durham.html">David Dickson &amp; James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Saving Knowledge</cite>, (Edinburgh, 1650; repr. Crown &amp; Covenant Publications, 2022), 8–9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff0eb34bea" data-kw="">
<blockquote><p>2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-5fb64f8045" data-kw="">
<blockquote><p>This disposition [in Eze. 18:33] proves that God is ready to pardon, to forbear, and to forgive sins if only people were willing to come to their senses. But because they continue to be stubborn and to reject every remedy, He is tortured, as it were, by their wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, vol. 2: Lectures on Genesis: Chapters 6–14, eds. Pelikan, Hilton &amp; Lehmann (Concordia, 1999), p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bf0de92f98" data-kw="">
<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London: T.R. &amp; E.M., 1653), on Ps. 81:13, pp. 254-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ion%20for%20time%20to%20come" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-711e7bc10b" data-kw="">
<blockquote><p>The proposition is universal, as to the modification of the subject, “all;” but in the word “of them,” it is restrained unto those alone with whom this covenant is made. […] But whereas it is the internal, effectual grace of the covenant, and not only the means, but the infallible event thereon, —not only that they shall be all taught to know, but that they shall all actually know the Lord, — all individuals are intended; that is, that whole church all whose children are to be taught of God, and so to learn as to come unto him by saving faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:11; Works, vol. 22, p. 202</span></figcaption>

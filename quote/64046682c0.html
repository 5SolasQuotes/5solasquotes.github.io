<main class="wrap"><figure class="quote" id="q-64046682c0" data-kw="">
<blockquote><p>And as for motion of heart, and inclination of will towards that evil which I have not done, it is also manifest, for though I have not been guilty of idolatry, either in making or worshipping of images, yet have I not been free from carnal imaginations of God in the time of his worship nor from will-worship.

And though I have not been so guilty of profaning the name of the Lord after such a gross manner as some others have been, yet have I not been free from an inclination of heart, and disposition of will thereunto; for I have both thought and spoken irreverently both of his titles, attributes, word, and works, yea, and many times do so to this day.

And though I do not now so grossly profane the Lord’s day, as it may be others have done, and do still, yet have I formerly done it grossly, yea, and do still, find an inward disposition of heart, and inclination of will, both to omit those duties which tend to the sanctifying of it, and to do those worldly actions which tend to the profanation of it.

And though when I was a child and young, I did not so grossly dishonour and disobey my parents and other superiors, as some others did, yet I had an inclination of heart and disposition of will thereunto, as it was manifest by my stubbornness, and by not yielding of willing obedience to their commands nor submitting patiently to their reproofs and corrections.

And though it may be, I have done more of my duty to my inferiors than some others have done, yet have I found an inclination of heart, and a disposition of will, many times to omit those duties which I have performed, so that I have as it were, been fain to constrain myself to do that which I have done.

And though I have not been guilty of the gross act of murder, yet have I had, and have still an inclination of heart and disposition of will thereunto, in that I have been, and am still, many times subject to rash, unadvised, and excessive anger; yea, I have been and still am divers times wrathful and envious towards others that offend me.

And though I never was guilty of the foul and gross act of fornication or adultery, yet have I had an inclination of heart, and disposition of will thereunto, in that I have not been free from filthy imaginations, unchaste thoughts, and inward motions and desire to uncleanness.

And though I was never guilty of the gross act of stealing, yet have I had an inclination of heart, and a disposition of will thereunto, in that I have neither been free from discontentedness with mine own estate, nor from covetous desire after that which belongs to another.

And though I never did bear false witness against any man, yet have I had an inclination of heart and disposition of will thereunto, in that I have not been free from contemning, despising, and thinking too basely of others; neither have I been free from evil surmisings, groundless suspicions, and rash judging of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 445-46.</span></figcaption>

</figure><figure class="quote" id="q-c49d678bc0" data-kw="">
<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>

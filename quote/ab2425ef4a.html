<blockquote><p>III. The union of pastor and flock in relation makes that which is a form-aptitudinal (as the soul to the body) to be the form in act (as the union of soul and body)…

IV. Union is in order to communion, which is primary by the exercise of the formal powers on the matter, and secondary by the action of all the parts according to their several capacities and offices. …

VI. These several degrees of union are found in bodies natural and politic:

      1. The union of soul and body makes a man, and an embryo before it be organized.

      2. The union of the body makes it capable of the soul’s further operation.

      3. The union of the organical, chief parts (as heart, lungs, etc.) to the rest make it a true human body completed to the nutriment and action of life.

      4. That it have hands and fingers, feet and toes, and all integral parts, makes it an entire body.

      5. The due site, temperament and qualities of each part make it a sound body.

      6. Comely color, hair, action, going, speech, etc. make it a comely body.

      7. To have all parts of equal quantity and office would make it uncomely: and to have the same hair, color, etc. is unnecessary at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>

</figure><figure class="quote" id="q-7b3ddb0eda" data-kw="">
<blockquote><p>We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

0within%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

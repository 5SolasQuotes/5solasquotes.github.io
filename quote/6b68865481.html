<main class="wrap"><figure class="quote" id="q-6b68865481" data-kw="">
<blockquote><p>Also strangers of approved piety, may be capable of Church rebukes, which are Church censures… …now Paul and the faithful at Corinth are not estranged from those of approved piety of other congregations: he took care to edify and rebuke them, and so are all the saints to edify, censure and rebuke one another…. The banished servants of God, who suffer for the Truth, or transient members, who because their calling is ordinarily trafficking, and so not consistent with a membership in a settled congregation, are they (I say) without [1 Cor. 5:13], not to be edified by the censures of the Church, but left to the immediate judgement of God? This is contrary to God’s Word, and an insolent interpretation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644) | pt. 2, ch. 4, section 5, pp. 200-1</span></figcaption>

<blockquote><p>The fifth argument taken of the end [design] of baptism, to wit, because that they which are baptized, are baptized for dead, that is to say, that they may have a remedy against death because that baptism is a token of regeneration. They that are baptized [are baptized] to this end and purpose, that death may be put out in them, or, to rise again from the death, whereof baptism is a seal.</p></blockquote>

</figure><figure class="quote" id="q-63ac008ebd" data-kw="">
<blockquote><p>…from whence it will appear that a believing master may present his servant and children to baptism, though it does not follow that a believing master may or will present those of his servants or children that are adult or of years without their consent, yet he may by his authority require them to it as an external duty; he cannot compel them to any duty, or restrain them from any vice without their consent, yet he may correct them, and incline their will to any outward duty by his authority, and having wrought upon them to consent and submit, the commissioner may baptize them that come so presented: the master of a family is a king, a prophet, and a priest, if by any of these offices he can prevail with his houshold, he may bring them to the performance of their duties… …though it be the master or husband’s duty to move his family, yet he cannot always prevail; and special direction concerning the wife is given to suffer her in regard of the bond of matrimony and that under some limited and restrained terms in hope of her conversion [1 Cor. 7]; yet nothing is said concerning servants but that he may either force them or be rid of them if they continue infidels in that sense, that is refuse to list themselves among disciples; the public worship of some God being the bond of all human society, Ps. 101:6, ‘He that walketh in a perfect way, he shall serve me:’ he that keeps any servant that will not be baptized, is not a good Christian; it is true, all men of discretion ought to consent to every duty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hussey.html">William Hussey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Mr. Tombes</cite>, [a Baptist], his Sceptical Examination of Infants’-Baptism… (London, 1646), pp. 44-45 Page 43 starts the context. Hussey was the Erastian minister who debated Gillespie on the Mediatorial Kingdom of Christ. Not every particular in the larger context is endorsed.</span></figcaption>

</figure><figure class="quote" id="q-cebb4ffe52" data-kw="">
<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For:

1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more?

2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites.

3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Disputations of Right to Sacraments</cite>, ... (London: Simmons, 1658), 2nd Disputation, pp. 200-201</span></figcaption>

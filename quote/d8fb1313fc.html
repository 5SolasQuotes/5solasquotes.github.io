<main class="wrap"><figure class="quote" id="q-d8fb1313fc" data-kw="">
<blockquote><p>And O how He ‘travails in the greatness of his strength, mighty to save! able to save to the uttermost them that come unto God by Him.’ O His infinite willingness to save us! how deeply marked in words, in oaths, in cries, in tears, in sighs, in groans, in blood, in death of an expiring God! He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix, “An Address to the Rising Generation” in Two Short Catechisms Mutually Connected (Edinburgh: 1769), as in Addresses to Children Concerning Salvation (Torwood Press, 2013)</cite>, pp. 9-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>7. From these things it is plain that God, when He pursues with a hatred of displeasure an elect person whom He previously loved with a love of complacency, is not changed, even though perhaps the act of complacency, considered as it adds a respect of reason to such an object, is now in no way in Him. For: First, when such an act is removed, God is not physically and really changed, because nothing departs from Him beyond a mere respect of reason, as Suárez and Vázquez demonstrate by irrefutable arguments in the places cited. Secondly, neither is He changed morally, because He does not change his purpose, but on the contrary, remains [steadfast] in his purpose, or rather in his natural inclination, by which from eternity He was, now is, and always will be, inclined to love virtue and to detest vices or sins. He also remains [steadfast] in his purpose of leading those whom He chose and justified to eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Venial &amp; Mortal Sin (1633; 1649), pt. 1, sect. 6, ‘God can love those whom He previously hated, and hate those whom He previously loved, without any change, whether physical or moral, in his will’ tr. Michael Lynch Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-904eca776e" data-kw="">
<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Stephen Charnock, 5 vols. (d. 1680; Edinburgh: Banner of Truth, 1997), vol. 5, “Man’s Enmity to God,”</cite>, p. 521</span></figcaption>

</figure><figure class="quote" id="q-2ccc0475a4" data-kw="">
<blockquote><p>…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Stock of Divine Knowledge, being a lively Description of the Divine Nature, or the Divine Essence, Attributes &amp; Trinity particularly explained and profitably applied… (London: T.H., 1641) Stock (c.1568-1626) was an English puritan.</cite>, ch. 19, Of the Anger of God, pp. 217-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Third, because every agent acts by its form; hence the manner in which it has its form is the manner in which it is an agent. Therefore whatever is primarily and essentially an agent must be primarily and essentially form. Now God is the first agent, since He is the first efficient cause. He is therefore of His essence a form; and not composed of matter and form.</p></blockquote>

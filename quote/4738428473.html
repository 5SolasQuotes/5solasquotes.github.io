<blockquote><p>It was an argument of Jezebel’s favor to the prophets of the groves that they did eat at her table, 1 Kings 18:19. So did Nehemiah express his friendship to the 150 Jews and rulers who did eat at his table, Neh. 5:17. Peradventure in the two last examples there were some successive (at least several tables). However, eating at any man’s table was ever a symbol of friendship with him.</p></blockquote>

<blockquote><p>…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660) | To the Reader</span></figcaption>

<blockquote><p>20. They are not fond of significant mystic ceremonies in the worship and service of God, but rather follow and symbolize that comely Gospel-simplicity which Christ and his apostles used that in the Church of Rome has been sadly marred with the whorish fairdings and gaudrie of human devices, additions and traditions, rather borrowed from the old pagan pagentry than the sacred page: But though they nauseate such relics and pieces of Papistry, yet what rites and ceremonies are decent and convenient, either from the nature or adjuncts of the religious things or actions they are exercised about, they are neither so shay nor foolish as to refuse to use them, K. J. Conf., art: 21, Acts of the Assembly, 1638, ss: 7, Assembly’s Confession, ch. 21, article 1.</p></blockquote>

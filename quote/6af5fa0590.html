<main class="wrap"><figure class="quote" id="q-6af5fa0590" data-kw="">
<blockquote><p>In the religion of the Mahumetans I find much good, viz. a confession of one only God, and most of the natural parts of religion; a vehement opposition to all idolatry; a testimony to the veracity of Moses, and of Christ; that Christ is the Word of God, and a great prophet, and the writings of the apostles true: All this therefore where Christianity is approved, must be embraced. And there is no doubt but God has made use of Mahumet as a great scourge to the idolaters of the world; as well as to the Christians who had abused their sacred privileges and blessings: Wherever his religion does prevail, he casts down images, and fills men’s minds with a hatred of idols, and all conceit of multitude of Gods, and brings men to worship one God alone, and does that by the sword in this, which the preaching of the Gospel had not done in many obstinate nations of idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons of the Christian Religion</cite>, pp. 202-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19a373cae8" data-kw="">
<blockquote><p>Fourth, it is asked whether Christians can have a Jew or Saracen as a slave. It seems that they can: By what is said in XXIII, q. 8, Dispar, where it is said concerning Saracens, and in the Extra, De Iudaeis, where it is said that Jews were subjected by their own fault to perpetual servitude. Therefore Christians can have a pagan or Jew as a slave. This also obtains by custom in remote parts. On the contrary: 1. XXVIII, q. 1, where it is said: Whoever among those who have been baptized have not henceforth avoided the company of unbelievers, let them be given to Christians and let those men be publicly assigned to beatings. And there too: Let no cleric or layman dwell with Jews. And the apostle seems to give the reason, 1 Cor. 15:33: ‘Evil company corrupts good morals.’ [Solution]: To this it must be said that it is permitted for a Christian to have a pagan or Jew as a subject; yet he ought not to have familiarity with him, as is had in the Extra, De Iudaeis, Ad: for too great familiarity could be an occasion of drawing these men to the evil of unbelief. If, however, that man should wish to become a Christian in actuality, he ought not to be forbidden: for the inspiration of the Holy Spirit in such matters is not to be repelled. Nor by this is the service of the master taken away, but he ought to serve, or otherwise his liberation from servitude ought to be procured. To the objections: 1. However, it must be said in the contrary sense that from those authorities the subjection of servitude is not denied, but cohabitation of familiarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology</cite>, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 2 | ch. 4, ‘Whether Christians can have a Jewish or Saracen Slave?’</span></figcaption>

</figure><figure class="quote" id="q-c3edeec990" data-kw="">
<blockquote><p>do constantly affirm what I set forth in my Apology, as I remember, whether in my own or the late Queen’s time, that conscience and religion have been the cause of the last extremity of punishment. For however much a man may be addicted to his religion, however much he may openly and constantly profess it, no danger of death will hang over him unless he shall have actually offended against the foreign laws in any act; or shall have been seen to be the very summit of a conspiracy of counsels pernicious to the commonwealth: except only such as relate to sacrifices, and other parts of the Pontifical system, who in transmarine regions insinuate themselves into sacred orders: who have so many conspiracies, so many treasons by them in England, either conceived or instigated or applauded, that from our borders they are driven back under the penalty of destruction. And yet none of them remains in the same thing which you would wish to call holy: that by the single case, being mulcted, death should immediately follow.</p></blockquote>

</figure><figure class="quote" id="q-18fd5445ae" data-kw="">
<blockquote><p>Must so many efforts be used to force from us [French protestants] that French heart that God and birth has given us? What have we done to merit so many misfortunes and such severe punishments? We are hunted, we are drove up and down as if we were the plagues of the Republic; We are treated as the enemies of the Christian name. In places where the Jews are tolerated, they have all manner of liberty, they exercise arts and merchandise; they are physicians, they are consulted, the health and life of Christians is put into their hands: And as for us, as if we were infected, we are forbidden to approach children that come into the world, we are banished from the bars and faculties, we are removed from the king’s person, we are banished from societies, our charges are taken from us, we are forbidden the use of all means that might secure us from being famished; we are abandoned to the hatred of the people, we are deprived of that precious liberty that we had purchased by so many services; our children are taken from us, who are a part of ourselves; we are made to lead a languishing life, in lowness, in poverty, and often in dark prisons. Formerly, when declarations were made against us, they were at most contented with registering them in the rolls. They are at present fixed up, they are cried about the streets as if they were gazettes, to inspire the people with a spirit of fury against us. And they have been so successful that in the great cities of France we expect to have our throats cut, one time or another, by a popular sedition; so that we are very near the Inquisition. Can it be said that there is liberty of conscience in a kingdom where the people are banished, lose their honor, and their goods are confiscated for religion’s sake? There needs nothing more than fire; and that terrible tribunal of the Inquisition, which France has been hitherto so much afraid of, will be established there. Are we Turks, are we infidels? We believe in Jesus Christ, we believe him the eternal Son of God, we invoke him solely; and we have no idols. We have a sovereign respect for the sacred Scriptures, we believe there is a Heaven and a Hell, the maxims of our morality are of so great a purity, that they dare not contradict them. We have a respect for kings, we are good subjects, good citizens, faithful in commerce: Let us be tried according to law, and it will appear if we have been engaged in any conspiracy against the State, and if we have any ways failed in our duty. Thanks be to God, nothing can stagger our fidelity, and the stock of love we have for our prince is not to be drained: if it depended on our enemies, we should be enemies of the State we make a part of; they design to push us on to crimes, that the king may have a just occasion of ruining us; but they have hitherto missed their aim, and are like to do so still; the king may see it, whilst that they so successfully turn the effects of his goodness from us, there is not one of us but who is ready to lose his life for his sake; we are Frenchmen as well as we are Reformed Christians; we would shed to the very last drop of the blood of our veins to serve our king, and for the preserving our religion, even to death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Policy of the Clergy of France, to destroy the Protestants of that Kingdom</cite>, ... (London: Bentley, 1681), 2nd Conference, pp. 100-103</span></figcaption>

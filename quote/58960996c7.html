<main class="wrap"><figure class="quote" id="q-58960996c7" data-kw="">
<blockquote><p>I have heard many pleading for ceremonies say that if the magistrate commanded them and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), 5th Disputation, ch. 2; pp. 423–24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7a94b00e0" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the Magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15. (Circumcision was a burden, Acts 15:10, and these burthens were necessary things, v. 28, and they were said to do well if they observe them, v. 29.) And Moses may make an ordinance about the use of a bill of divorcement, which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things, and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God, except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London, 1637), on 1 Tim. 2:13, pp. 434-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-5345e00844" data-kw="">
<blockquote><p>It is divine law, jure divino, both by nature and Scripture, for the stronger to relinquish rights and privileges for the here and now to help the weaker, for the greater good (Ps. 40:6–8; Mt. 5:38–48; Mk. 15:3–5; Jn. 10:15–17; 1 Cor. 6:4–8; 9:4–23; Eph. 5:25–26; Phil. 2:6–9; 1 Pet. 2:19–25; WLC 99.5), especially when called by Christ to do so (Mt. 28:18–20; Acts 9:15–16). Ought not the stronger and more excellent parts of the body, rather than ignoring or forsaking the weaker and less comely parts, unite with, serve and benefit them, covering them over with greater honor, as we ourselves do and God does (1 Cor. 12:23–24), “that there should be no schism in the body”? (1 Cor. 12:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-5e0e2b277e" data-kw="">
<blockquote><p>Study moderation in all things: Let not Christian prudence pass with you for wisdom of the flesh, nor Christian moderation for Laodicean lukewarmness. ‘Let your moderation be known to all men;’ let it be visible and apparent, both in your passions, opinions and discourses. 1st. Moderate your affections, let not wildfire take the place of zeal, nor zeal turn passionate, pickish, peevish and bitter… Nor does the wrath of man work the righteousness of God. 2ly. Be moderate in your opinions: This moral idol of the mind (opinion) is too apt to be adored and oversway. Put a temper to it and hang a balance upon it, to keep it in poise and course; for true is that in common experience, though a fallacy indeed, that opinio est veritate major. And for moderation in opinion, study well: (1) Your fallibility and aptness to mistake, and consequently to dwell in a constant self-jealousy and suspicion. We like not to allow of fluctuating and Pyrronian doubting about necessary and vital points, nor to hang all opinions either (like Mahomed’s tomb between the two loadstones) in an aequilibrio. Yet too much confidence in matters of mere opinion is oft a vanity, refuted sufficiently by the new discoveries time and industry produces, compelling us to alter. But what one thing does contribute more to beget and continue ruptures than conceit and idolizing of self-wisdom and self-opinion, with an undervaluing of all that differ from us, while yet (perhaps) they may hit nearer the mark of truth than we, and have better advantages to discover it than we? (2) Study self-reflection, to consider how oft ye have found in time your (once confident) opinions to have failed you, that you have been necessitated to change and take up new measures. And this will help you to much moderation, experience being the schoolmaster of very fools. (3) Be moderate in your discourses; how are some’s tongues dipped in gall and set on fire of Hell! and instead of edifying communication that may minister grace to the hearers, little other than rigid censuring and bitter backbiting of one another! O when shall our tongue be our glory, not our shame! but to bridle the intemperacy of the tongue, study to speak nothing but what God may hear, and as in his hearing; speak of others as of yourselves; and this will make you speak sparingly, charitably and with due moderation. And were tongues once well governed, and that unruly evil tamed, no doubt but differences would soon diminish. Let your moderation then in all things be known to all men, the Lord is at hand. Moderation in our way is like the symmetry in the humors of the body, which keeps all in health and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 154-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons, but must make conscience of it that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13], to obey the human ordinances of men in authority; from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances and that we be careful not to offend private men in free ceremonies.</p></blockquote>

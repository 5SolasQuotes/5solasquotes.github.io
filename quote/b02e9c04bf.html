<main class="wrap"><figure class="quote" id="q-b02e9c04bf" data-kw="">
<blockquote><p>The origin of the Sabbath is distinctly intimated in the text, “The Sabbath was made for man.” From which we learn, …

That the Author of the Sabbath is the Creator of man. He who made man, and knew perfectly what institutions would meet his necessities, appointed for him the Sabbath. Six parts of his time were allowed for ordinary avocations; the seventh was set apart for sacred duties and enjoyments. On this point there can be no controversy between believers in the inspiration of the Scriptures.

They may differ respecting the time when the Sabbath was instituted. They may differ as to the question, whether it is of universal obligation, or whether it is a Jewish institution. They may also differ on the question, whether the Christian Sabbath is identical with the Jewish, with only the change of the day. And they may not entirely agree respecting the degree of strictness with which it ought to be observed.

But all must acknowledge that the keeping of the Sabbath as a holy day, has been and is binding, only because God has commanded it. It is the Creator of man who appointed the Sabbath for him, and said, “Remember the Sabbath-day to keep it holy.” …

The text [Luke 2:27] also discovers to us the time when the Sabbath was appointed. It was made for man, not for any particular nation, age, or dispensation, but for the whole race. The word man is generic, and can mean nothing less than the human race. But if the Sabbath was made for the race, its appointment must have been coeval with the creation of man. The Scriptures afford ample evidence that this is true.

First. It is confirmed by the obvious meaning of the inspired narrative: “Thus the heavens and the earth were finished, and all the host of them. And on the seventh day God ended his work which he had made. And God blessed the seventh day, and sanctified it; because that in it he had rested from all his works which God created and made.” To bless and sanctify a day, can mean nothing but to set it apart for religious services, and to make it a day of special blessing to those who rightly observe it.

Such is the uniform meaning of the terms employed; and such is the view given of the Sabbath by the prophet Isaiah: ”If thou turn away thy foot from the Sabbath, from doing thy pleasure on my holy day, and shalt call the Sabbath a delight, the holy of the Lord, honourable; and shalt honour him, not doing thine own way, nor finding thine own pleasure, nor speaking thine own word; then shalt thou delight thyself in the Lord, and I will cause thee to ride on the high places of the earth, and feed thee with the heritage of Jacob thy father.” (Isa. Iviii. 13, 14.)

The plain meaning of the inspired narrative, then, is, that at the time when the work of creation was completed, and God rested from his work, lie appointed the seventh, day to be a religious rest, and a day of religious duty and enjoyments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathan-l-rice.html">Nathan L. Rice</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Origin and History of the Sabbath in The Christian Sabbath: Its History, Authority, Duties, Benefits, and Civil Relations. A Series of Discourses</cite></span></figcaption>

<blockquote><p>How this Worship is Correspondent to the Nature of God. The Lord does show it in the fourth of John, verses 23 and 24, saying, the true worshippers, shall worship God in spirit and truth, that is in the Spirit of sanctification dwelling in the mind, helping our infirmities with sighs and groans, which cannot be expressed; and in the truth of his Word dwelling in us in all wisdom and spiritual understanding, such as these the Father requires should worship Him, because God is a Spirit, and they that worship Him, must worship Him in spirit and truth, and not in the ignorance of the mind, nor in the invention and will-worship of man; For this cause the Psalmist says in the 51:6, ‘Thou O Lord lovest truth in the inward affections’; and in the 50th Psalm he says, ‘Offer to God the sacrifice of praise, and pay the vows of the Most High, and call upon God; for the Lord loves truth in the inward parts.’ This is the pure and simple worship of God, without the glory and beauty of outward ceremonies, agreeing with the simple pure essence and nature of God Himself. Consider well Paul’s caveat in the Col. 2:8,18,20-23, warning all men to beware of human wisdom, and deceitful inventions and traditions, according to the rudiments of the world, and not after Christ; the outward show of holiness which puffs up men’s hearts with self-conceit, being burdened with traditions, which having a glorious show of holiness, of wisdom and voluntary religion, wherein men are out of measure superstitious in zeal, not sparing their bodily labor.</p></blockquote>

<blockquote><p>The apostle delivered nothing as it were by a second hand to the Corinthians, but what he had formerly received from the Lord. Divine things are unto us deposited; we must first be receivers, before deliverers.

HERE then we see, first, both the absurdity and the wickedness of a will-worship; when the same man who is to perform the obedience, shall dare to appoint the laws, implying a peremptory purpose of no farther observance, than may consist with the allowance of his own judgement: whereas true obedience must be grounded on the majesty of that power that commands, not on the judgement of the subject, or benefit of the precept imposed.

Divine laws require obedience, not so much from the quality of the things commanded (though they be ever holy and good), as from the authority of him that institutes them. We are all the servants of God; and servants are but living instruments, whose property it is to be governed by the will of those, in whose possession they are. Will-worship, and services of superstition, well they may flatter God, they do not please him.</p></blockquote>

— Edward Reynolds, Meditations on the Holy Sacrament of the Lord’s Last Supper, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 15-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+apostle+delivered+nothing+as+it+were+by+a+second+hand+to+the+Corinthians%2C+but+what+he+had+formerly+received+from+the+Lord.+Divine+things+are+unto+us+deposited%3B+we+must+first+be+receivers%2C+before+deliverers.%0A%0AHERE+then+we+see%2C+first%2C+both+the+absurdity+and+the+wickedness+of+a+will-worship%3B+when+the+same+man+who+is+to+perform+the+obedience%2C+shall+dare+to+appoint+the+laws%2C+implying+a+peremptory+purpose+of+no+farther+observance%2C+than+may+consist+with+the+allowance+of+his+own+judgement%3A+whereas+true+obedience+must+be+grounded+on+the+majesty+of+that+power+that+commands%2C+not+on+the+judgement+of+the+subject%2C+or+benefit+of+the+precept+imposed.%0A%0ADivine+laws+require+obedience%2C+not+so+much+from+the+quality+of+the+things+commanded+%28though+they+be+ever+holy+and+good%29%2C+as+from+the+authority+of+him+that+institutes+them.+We+are+all+the+servants+of+God%3B+and+servants+are+but+living+instruments%2C+whose+property+it+is+to+be+governed+by+the+will+of+those%2C+in+whose+possession+they+are.+Will-worship%2C+and+services+of+superstition%2C+well+they+may+flatter+God%2C+they+do+not+please+him.%E2%80%9D%0A%0A%E2%80%94+Edward+Reynolds%2C+Meditations+on+the+Holy+Sacrament+of+the+Lord%E2%80%99s+Last+Supper%2C+%281638%29+in+The+Whole+Works+of+the+Right+Rev.+Edward+Reynolds%2C+D.D.%2C+ed.+Alexander+Chalmers+%286+vols%2C+London%2C+1826%29%2C+iii%2C+15-16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc61e996173.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c61e996173.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/28/edward-reynolds-on-the-wickedness-of-will-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>There is a political end of the Sabbath, viz. The refreshment and recreative breathing of the outward man, a relaxation of the body from the pains and toil of the week; and therefore the Sabbath is called a rest. It is said of God Himself that on the seventh day He rested and was refreshed, Ex. 31:17. And how much more does poor man stand in need of rest and refreshment? Death indeed fairly unpins our tabernacle of clay, folds it up and lays it in the grave, but too much labour tears it down; man’s body is taken down by death, is thrown down by too much toil, therefore the wearisome labours of the week must be allayed by the rest of the Sabbath. The very name of a Sabbath signifies nothing but rest, strongly to argue, that that holy day was appointed for mans relaxation from the hurries of the world, and the sweats of the week. The Sabbath is a rest to the body and a revival to the soul, the body’s ease, and the soul’s enjoyment; the outward man on the Sabbath recovers strength, and the inward man receives Christ: Our exhausted spirits on God’s holy day are sweetly recruited, and our importunate souls are rarely answered, they then prey upon a Christ offered in the Gospel. Plato observes that the gods willing to recrui• mankind over-toiled with labour, in pity have appointed festival days for their ease and relaxation. Thus that heathen philosopher gives in his verdict to this particular; Indeed God’s blessed Sabbath shores up a piece of clay, and it builds up a piece of eternity, the precious and the immortal soul. The Sabbath is the body’s friend, and the soul’s fosterer; the body’s rest-time, and the soul’s term-time.</p></blockquote>

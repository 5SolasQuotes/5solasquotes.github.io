<main class="wrap"><figure class="quote" id="q-a065e90440" data-kw="">
<blockquote><p>For seeing the Sabbath day is the school day, the fair day, the market day, the feeding day of the soul, when men purely knowing the use of it, separate it wholly from other days, they shall see how they may recover themselves from sins already past, arm themselves against sin to come, grow in knowledge, increase in faith, and how much they shall be strengthened in the inner man.

Wherefore in the book of God, when the Lord will urge the observation of the whole law, he often doth it under this one word of keeping the Sabbath. Again, when the Prophets sharply rebuke the people for their sins, they particularly lay before them, how the Sabbaths of the Lord are broken.

And to speak the truth, how can a man lie long in the liking of sin, who embraceth this doctrine in conscience, who willingly would have his sins discovered, his conscience unripped, the judgments of God against his sins threatened, whereby he might come to a loathing, and grow to a further misliking of his sins daily? Sure it is indeed, that as in other things, so in this, the ceremonial use little availeth. Howbeit, if for the ceremonial use of the Sabbath, because many so use it, therefore we should leave it, we might as well by the same reason put out of the doors of the Church the administration of the Sacraments, the making of prayer, the preaching of the word, because the most part of men use these things for a fashion: neither is it the question which we have in hand, what men do, but what they ought to do in the observation of the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

<blockquote><p>If we will well flee sin, let us keep us as far from it, as we can, and take heed not only to touch it, but also to come near it, for it is so infectious a plague, and so stinking and dangerous a poison, that although one keep himself back from it so far as is possible, yet can he not avoid, but that he shall be infected &amp; corrupted therewith. A man cannot have so small acquaintance therewith, but that immediately it will be turned into over great familiarity and boldness, and then into a customer, which cannot be shaken off: as we see it by experience in all sorts of sin.

And to know these more plainly, let us take one example which may serve us for all the rest, and which shall be very agreeable to the matter, we have in hand; let us consider by what way a harlot cometh to the last step of infamy and abomination: she slippeth not, nor slideth away like an eel as a common harlot at the first day, but first she beginneth to wander a little out of the bonds of modesty, shamefastness, and honesty, which ought to be in a woman that is virtuous and full of the fear of God: she delighteth to hear &amp; speak dishonest and infamous words, and to sing filthy and wicked songs: she taketh pleasure in dances, and to be conversant amongst lusty youths, and feedeth her eyes with their gesture &amp; countenances, &amp; her ears to hear their amorous and lascivious talk: after she hath once abandoned her eyes and ears, she is no longer whole and chaste.

For we cannot think that woman truly chaste, which is not so in heart and mind, and in all parts and members of her body, they that know what honesty and chastity is, will judge hereof in this sort, for they cannot call things, but by their name: but they which take pleasure in such pastimes, as harlots, and such other worldlings, carnal folks, and courtesans, which can disguise and change the names of things, will not call these lascivious love tricks wicked wantonness, but civility and courtesy, notwithstanding whatsoever name, men give to the thing, yet shall it be always, what it is, and shall not change the nature, for the alteration and change of names: seeing then the eyes &amp; ears are already won, the other parts are not very sure: after these follow other dalliances as tickings or toyings, which defile the body yet somewhat more and more enflameth to whoredom:

[W]hen chastity is once violated so far, it will go hard, if in short space it perish not altogether, and that whoredom follow not incontinently thereupon, notwithstanding at the beginning there will be some shame fastness, which will keep it secret: but after by process of time and long custom, this shamefastness will fall by little and little, so that the secret harlot will become altogether impudent without any shame at all, or fear of God or man. As much may we say of all other sins: for it is all one reason: By little steps a man cometh to the heap and depth of sin: But I have willingly taken the example of whoredom, because it is most like unto idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the faithful necessary for all the children of God: especially in the so dangerous days</cite>, trans. F. H. (London: Tobie Smith, 1582), unpaginated.</span></figcaption>

nanter</a></div>
</figure><figure class="quote" id="q-cd99a1c389" data-kw="">
<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117-19</span></figcaption>

ugh+our+Lord+did+practice+this+lowly+act+of+condescendence+as+eminently+expressive+of+that+humility+whereunto+He+would+have+his+disciples+instructed%2C+yet+neither+is+it+in+itself+of+the+nature+of+a+sacramental+sign%2C+whereof+all+the+significancie+is+from+the+institution%2C+and+virtue+in+the+exhibition+of+the+thing+signified%2C+which+you+cunningly+omit+to+mention%3B+Nor+does+Christ+perform+it+by+way+of+institution%2C+for+repetition%2C+but+by+way+of+example%2C+for+imitation%2C+as+is+manifest+from+the+text%2C+John+13%3A4%2C+etc.+where+we+find+that+our+Lord+does+first+wash+his+disciples%E2%80%99+feet+before+He+told+them+what+He+was+a+doing%3B+and+then+having+done+the+act%2C+not+simply+significant+by+his+appointment%2C+but+of+itself+as+the+effect+expressing+the+greatest+humility+as+its+cause%2C+He+teaches+them+not+a+%5B%E2%80%A6%5Do+%5B%E2%80%A6%5Demne+reiteration%2C+but+the+use+in+these+words%2C+%E2%80%98If+I+your+Lord+and+Master+have+washed+your+feet%2C+ye+also+ought+to+wash+on+another%E2%80%99s+feet%E2%80%99%3A+%E2%80%98If+I+have+been+among+you+as+He+that+serves%2C+so+ought+ye+to+serve+one+another%2C+for+I+have+given+you+an+example+that+ye+should+do+as+I+have+done+to+you.%E2%80%99+I+have+not+showed+you+humility+in+a+figure+to+be+repeated+for+your+remembrance%2C+but+by+a+solid+practice+taught+you+the+like+performance%3A+so+that+to+turn+this+pattern+unto+a+rite+is+in+effect+as+far+from+our+Lord%E2%80%99s+purpose+as+the+instruction+of+plain+examples+is+preferable+to+that+of+mystic+representations%3A+Which+exposition+is+so+true+and+sound%2C+that+as+this+fancy+of+yours+was+never+owned+by+the+Church+of+Christ%2C+so%2C+it+is+most+certain%2C+that+where+it+has+been+followed+%28I+mean+by+the+Pope%29+and+this+action+has+been+used+as+a+rite%2C+it+has+only+been+made+a+color+to+the+most+prodigious+and+superlative+pride+that+ever+the+sun+beheld%3A+and+thus+I+hope+all+men+may+see+that+the+not+using+of+this+washing%2C+never+again+used+for+anything+we+read%2C+by+way+of+sacrament+or+ceremony%2C+either+by+our+Lord+or+his+apostles+and+Churches%2C+is+neither+a+deformity+in+us+from+the+Scripture%2C+nor+an+argument+for+your+irreligious+laxness+in+things+you+call+externals.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%2C+%E2%80%A6+%281671%29%2C+3rd+Dialogue%2C+pp.+117-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd99a1c389.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd99a1c389.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=you%20%5BGilbert%20Burnet%5D%20boldly%20attempt%20to,laxness%20in%20things%20you%20call%20externals&amp;text=you%20%5BGilbert%20Burnet%5D%20boldly%20attempt%20to%20make%20even&amp;text=your%20irreligious%20laxness%20in%20things%20you%20call%20externals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Q. 6. What is meant by keeping holy the sabbath day?

A. Separating it to the holy worship and praise of the Creator, and resting to that end from unnecessary, bodily labour.

Q. 7. What doth the word “remember” signify?

A. 1. First, it is an awakening caveat, to bid us take special care that we break not this commandment. 2. And then that we must prepare, before it comes, to avoid the things that would hinder us in the duty, and to be fit for its performance.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-211b8ff5db" data-kw="">
<blockquote><p>If God is, he must needs have subsisted of all Eternity, without any beginning. For, who should have given him his being? He could not have created himself, nor be made out of nothing, without any cause, and no first, or Superior cause can challenge the Creation of him, for there is nothing before, or superior to God.

And if he hath existed from all Eternity, he is then infinite, in respect of his duration. And if he hath an infinite duration, his Power is also infinite; and if he is infinitely Powerful, this World, which (though very great) is notwithstanding finite, and is not so great, but that it can have been made, or created by him, or ruled and Governed by an infinite Power, such as his is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-cappel.html">Louis Cappel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The hinge of faith and religion: or, a proof of the deity against atheists and profane persons, by reason, and the testimony of Holy Scripture: the divinity of which is demonstrated</cite>, trans. Philip Marinel (London: Thomas Dring, 1660), pp 66-67.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

And if he hath existed from all Eternity, he is then infinite, in respect of his duration. And if he hath an infinite duration, his Power is also infinite; and if he is infinitely Powerful, this World, which (though very great) is notwithstanding finite, and is not so great, but that it can have been made, or created by him, or ruled and Governed by an infinite Power, such as his is.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a79d93e3f" data-kw="">

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-ea4e2273a8" data-kw="">
<blockquote><p>The most fundamental reason [for Thomas] why God’s perfection is infinite is that act is limited only insofar as it is received in a potency. ‘But God is act in no way existing in another, for neither is He a form in matter… nor does His esse inhere in some form or nature, since He is His own esse… It remains, then, that God is infinite” (prgr. 5). In other words: “…God, Who is pure act (actus purus) is infinite in His actuality (in sua actualitate)” (prgr. 6). He possesses esse, goodness, perfection not as participated, but by essence (his very esse in His goodness) and, therefore, He is infinite in goodness (prgr. 8-9). A further argument… proceeds from the fact that our ‘intellect… extends to the infinite in understanding…. But this ordination of the intellect would be in vain unless an infinite intelligible existed” (prgr. 10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-l-balas.html">David L. Balas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Thomist View on Divine Infinity’ in Proceedings of the American Catholic Philosophical Association</cite>, vol. 55 (1981), pp. 91-98, pp. 93-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

<blockquote><p>When as the Devil had walked at liberty through all nations almost from the beginning of the world, and had filled the whole world with all kind of wickedness and heinous sins, at length in the coming of Christ, which had chosen to Himself a Church and much people among the gentiles, his licenciousness is bridled… he was caught I say and bound with that great chain of sincere doctrine, that he cannot range abroad at liberty as he was wont… But the time which here is compassed in the space of a thousand years, in which the Devil should be kept bound in prison, does signify a long time, and uncertan to men. In which space of time the pure doctrine of the Gospel should flourish in the world, and many men out of all nations should be taken into the eternal inheritaunce of Christ and we see that almost by the space of a thousand years after Christ some light of sincere doctrine remained in the world, at the least many did consent upon the points of Christian religion which were chief and most necessary to salvation: until at length the doctrine of Antichrist being brought in, of merits, of satisfactions, of the sacrifice of the mass and other monsters, the only foundation of faith and free justification of faith was taken away. In that whole space of time therefore, the power of Satan was bound, so long as by faith in the merits of Christ alone, the way was open for men to heaven. And we must note that Satan is said to be bound, and shut in prison, so long as he does not seduce the greatest multitude to eternal destruction…. For after that he must be loosed for a litle season, etc. When as now the pestilence of the Mahumet, and the Pope waxed strong and increased. He must be loosed for a litle time, that he may seduce the nations into idolatry, as he seduced the whole world before the birth of Christ. For after a thousand yeares whiles the Turks in the East, and the papists in the west possessed all with there dotages, we may rightly conjecture that Satan was loosed out of prison. But this evil shall not endure long, for the end of the world is at hand, and the truth of the gospel being restored again to the world, has disclosed the falsehoods of both the enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prælections upon the Sacred &amp; Holy Revelation of St. John</cite>, (1573), on Rev. 20, p. 131-32 Fulke (1538-1589) was a reformed Anglican.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbc6fbd442" data-kw="">
<blockquote><p>6. …Yea, he bound that malicious Satan and made him sure for a thousand years’ space, to make of the vessels of wrath the vessels of mercy. This did he by his strong word of covenaunt, whom he made for a thousand generations. And a full performance it is of God’s first promise for man’s behove, that Christ should tread down the head of the serpent. For a thousande years was this restraint. Mark besides the mystery, the time from the ascension of Christ unto the days of Silvester the second bishop of Rome of that name, and ye shall all find that it was from Christ’s nativity a complete thousand, after all the historiographers. By such necromancy as he learned of a Sarazin in Spain obtained he the papacy, and as witnesses John Wycliff in his book, De solutiōe sathane, in Christ’s vicarship he loosened that devil who Christ had afore shut up, and set him again at large to deceive afresh. Consider for the time that he was thus bound, the constaunt says of the Christians, and the invincible hearts of their martyrs, and ye shall find them far different from them which has been since. He was then so weak, so infatuate and babish, that not only wise men, learned men, and strong men, did set him light, but also young maidens, children, and tender infants in a manner did laugh him to scorn, and set all his subtle sleights at nought. Evident will this be to all them that shall read the lives of the holy martyrs and saints of the primative Church… 8. …Neither was he able to pluck them from Christ’s faith by flattering prosperity, nor yet by urgent adversity. Neither could tyrannies nor heresies for that time prevail against the Gospel. … 12. And where as it is here said that after these thousand years Satan must be let loose again for a certain time… In the end of these thousand years reigned in the papacy at Rome the aforenamed necromanser Silvester, which was both a black monk and also a Frenchman born. This beastly Antichrist boasting himself not only to be Christ’s vicar in earth, but also to be equal with him in majesty and power, set first the Devil at large by his necromancy, which took from the hearts of men the living Word of the Lord lest they should be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John the Evangelist</cite>, … (d. 1563; London [c. 1570]), on Rev. 20 no page numbers Bale was an Anglican reformer.</span></figcaption>

<blockquote><p>Luther struck the key-note of this anti-popery exegesis. He had at first a very low opinion of the Apocalypse, and would not recognize it as apostolic or prophetic (1522), but afterward he utilized for polemic purposes (in a preface to his edition of the N.T. of 1530). He dated the one thousand years (Rev. 20:7) with Augustine from the composition of the book [of Revelation], and the six hundred and sixty-six years from Gregory VII [c. 1015 – 1085], as the supposed founder of the papacy, and understood Gog and Magog to mean the unspeakable Turks and the Jews. As Gregory VII. was elected pope 1073, the anti-Christian era ought to have come to an end A.D. 1739; but that year passed off without any change in the history of the papacy.</p></blockquote>

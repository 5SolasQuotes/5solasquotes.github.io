<main class="wrap"><figure class="quote" id="q-e3edb3ec83" data-kw="">
<blockquote><p>The imposed use of Indifferencies has been (like the Canaanites to the Israelites) pricks in the eyes, and thorns (or goads) in the sides of, i. e. matter of much mischief and vexation to, the Church of God almost in all ages; Especially, in the Jewish Church, when it drew towards the dregs, much of this sediment appeared. How far the Papal, Antichristian Church is over-run with this ill humour, is notorious:

And it’s one great evil which our English Church now labours and groans under at this day. ‘Tis this, which has been the apple of contention, and bone of division; the stone of stumbling, and rock of offence among us, ever since the beginning of the Reformation, in the time of our Josiah, King Edward the 6th. And after many years freedom from this itch, it brake out again some years since, to our great disturbance, and scratching of one another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vincent-alsop.html">Vincent Alsop</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exercitation on the historical relation, Matth. 15, 1–9, Mark 7, 1–13, concerning eating with unwashen hands by way of appendix or supplement to the discourse concerning indifferencies: and More particularly, to Argument or Reason the Fourth; to prove, That Indifferencies enjoined by Authority do</cite>, (London: Benj. Alsop, 1680), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aaf93bec2a" data-kw="">
<blockquote><p>How shall we hold and keep fast the letter of Scripture, when there are so many Greek copies of the New Testament? and these diverse from one another? Yes, well: for though there are many received copies of the New Testament; yet there is not material difference between them. The four Evangelists do vary in the relation of the same thing; yet because there is no contradiction or material variation, we do adhere to all of them, and deny none. In the times of the Jews before Christ, they had but one original of the Old Testament; yet that has several readings: there is a marginal reading and a line reading, and they differ no less than eight hundred times the one from the other; yet the Jews did adhere to both and denied neither; Why? Because there was no material difference. And so now, though there be many copies of the New Testament; yet seeing that there is no material difference between them, we may adhere to all:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture Light the Most Sure Light</cite>, (1656), sermon 3 on 2 Pet. 1:19, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Yet, with all his serenity, unlike the violence of his contemporaries, Shakspere showed in no uncertain way his dislike of the Puritans and their growing power.</p></blockquote>

</figure><figure class="quote" id="q-09b3b03b78" data-kw="">
<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), | pt. 4, ‘Against the Indifferency of the Ceremonies’ | ch. 3, ‘Whether There be Anything Indifferent In Actu Exercito [In the Exercised Act]?’ No., p. 16</span></figcaption>

</figure><figure class="quote" id="q-729868d934" data-kw="">
<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, ... (1625; Brill), vol. 3, Disputation 45, ‘On the Lord’s Supper’, pp. 183-85 &amp; 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

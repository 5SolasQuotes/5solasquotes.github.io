<main class="wrap"><figure class="quote" id="q-134828ed61" data-kw="">
<blockquote><p>… That this Commission may receive into ministerial communion such of the late conform ministers, as having qualified themselves according to law, shall apply personally to them, one by one, duly and orderly, and shall acknowledge, engage, and subscribe upon the end of the Confession of Faith, as follows, viz.: I… do sincerely own and declare, the above Confession of Faith, approven by former General Assemblies of this Church, and ratified by law in the year 1690, to be the confession of my faith; and that I own the doctrine therein contained to be the true doctrine which I will constantly adhere to; as likeways that I own and acknowledge Presbyterian Church government of this Church, now settled by law, by Kirk-Sessions, Presbyteries, Provincial Synods and General Assemblies, to be the only government of this Church, and that I will submit thereto, concur therewith, and never endeavour directly nor indirectly, the prejudice or subversion thereof… As also that the General Assembly require all Presbyteries and Synods, in their admitting or receiving any to ministerial communion, that they oblidge them to take and subscribe the same acknowledgment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/formulas-of-subscription.html">Formulas of Subscription</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Assembly 1694</cite>, Act approving Overtures anent a Commission of the General Assembly and Instructions thereto</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb26639659" data-kw="">
<blockquote><p>As to one thing there was no doubt, viz., that whoever should be allowed to sit and give their opinion, all of them, some ensnared by ambition, others blinded by avarice, others inflamed with rage, would be mortal enemies to sound doctrine, and being bound together in secret conspiracy to establish the tyranny of the Pope, would exert themselves to destroy the kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Preface to the Pious Reader</span></figcaption>

</figure><figure class="quote" id="q-c1195806d4" data-kw="">
<blockquote><p>The Zeeland form for ministers reads: ‘We the undersigned ministers of the Word declare by this subscription, that we heartily believe and are persuaded that all the articles and points of doctrine contained and explained in this Confession and Catechism, from greatest to least, do fully conform (in alles conform syn) to the Word of God, and we also hereby solemnly promise, as the occasion requires, to teach and advocate all these points of doctrine publicly and privately. And if at any time we should have any sentiment or objection against any article or point of doctrine, contained in the aforesaid Confession and Catechism, we promise that we will neither publicly nor privately present the same except properly in classical or synodical assemblies, under the penalty of being censured as schismatics. And if at any time the classis or synod may deem it proper, to maintain unity in doctrine, to require of us our further sentiments and explanation of any article of the aforesaid Confession or Catechism, we also hereby promise to be always ready and willing to do so, without refusal, under the penalty above mentioned.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Netherlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Donald Sinnema, “The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal</cite>, (July 2007), p. 268, fn. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-c0c69850e8" data-kw="">
<blockquote><p>Furthermore, the Churches of Helvetia, and Savoy, and the free cities of France, and the Low Countries, and Scotland, are to be reverenced as the true Churches of God, as their confession make manifest. And no less must we think of our own Churches in England and Ireland. For we hold, believe, and maintain, and preach the true Faith, that is, the ancient doctrine of salvation by Christ, taught and published by the prophets and apostles, as the book of the [39] Articles of Faith agreed upon in open parliament do fully show…</p></blockquote>

</figure><figure class="quote" id="q-db801550a1" data-kw="">
<blockquote><p>Classis Walcheren in Zeeland [in 1574] drafted the earliest form of subscription used by ministers: ‘We the undersigned ministers of the Word of God, within these islands of Walcheren, do hereby believe and confess that the written [Belgic] Confession of Faith of the Christian churches of the Netherlands, lying under Spanish rule, contained in 37 articles and printed again in the year 1573 at Dordrecht, conforms (ghelijkformigh is) in all parts to the Word of God. And so we promise to orient our doctrine and worship to it, in our teaching, consolation, and admonition, and to oppose what conflicts with it, according to our abilities.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Netherlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Donald Sinnema, “The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal</cite>, (July 2007), p. 260</span></figcaption>

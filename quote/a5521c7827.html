<main class="wrap"><figure class="quote" id="q-a5521c7827" data-kw="">
<blockquote><p>Are the wicked intermixed with true and zealous professors? What shall we then say to the old Donatists (Socrates, Ecclesiastical History, bk. 1, ch. 7), and the Brownists, and Anabaptists, which separate themselves from the true Church, say with those in the prophet, ‘Come not near us for we are holier then ye.’ Me thinks I may say unto them as Constantine said to Acesius, a Novatian Bishop: Let them make a ladder for themselves to ascend into heaven, here is no place for them on earth, as long as this world shall last, the Lord’s wheat shall grow up with the tares.(Mt. 13:29) Christ has spoken it, and Christ is truth, ‘if there be in them any charity, they will assent to this verity’ (Sit in illis charitas et congaudeant veritate, Augustine, Cor. 2:6). ‘Yea but light has no communion with darkness, nor bitterness with honey, nor life with death, nor the unbeliever with the infidel.’ It is the objection of Petilian the Donatist against Augustine. But his answer is that when they eschew the darkness, they forsake the light: when they flee from death they flee from life also: Attendis Zizania per mundum, &amp; triticum non attendis, cum per totum vtraque sint iussa crescere? attendis semen maligni, quod ad finem messis separabitur; et non attendis semen Abrahae, in quo benedicentur omnes gentes? Dost thou mark the darnel, and dost thou not remember the wheat? Dost thou think upon the seed of the serpent, whose head shall be crushed; and dost thou not think upon the seed of Abraham, in whom all the nations of the earth shall be blessed? When thou fleest from the chaff, thou forsakest the good wheat, which is mingled with it. When thou separatest thyself from the seed of the wicked, thou seperatest thyself from the seed of Abraham. When thou thus dividest thyself from the hypocrites that are in the true Church, thou cuttest thyself from the Church, and a member taken from the whole must needs perish. If thou wilt think upon this with that heedfulness that thou shouldst, thou wilt not forsake the green pastures of the Lord that are besides the waters of comfort (Ps. 23) because of the goats; nor leave God’s house because of the vessels of dishonor; nor run out of the Lord’s floor, because of the chaff; nor separate thyself from the wheat because of the tares, which shall at length be bound in a bundle and cast into the fire; nor burst the unity of the Lord’s net because of the bad fish, which swim in it, (which, when the net is brought to land, shall be cast away), but as a father speaks: tolerare potiùs propter bonos cōmixtionem malorum, quam violare propter malos charitatem bonorum; rather for the good to tolerate the bad than for the bad to forsake the good. (Augustine, bk. 3, Contra litt. Petit., ch. 3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-dawes.html">Lancelot Dawes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Sermons preached at the Assizes holden at Carlile touching sundry Corruptions of these Times (Oxford: Barnes, 1614), 1st Sermon, pp. 32-34 Dawes (1580–1653) was an Anglican clergyman.</cite></span></figcaption>

<blockquote><p>He speaks there of Jesus Christ the Righteous: the Son of God, who is here in my text likewise made the object of this knowledge. ‘Thou art Christ the Son of the living God,’ [Mt. 16] is by Christ Himself made the rock upon which the whole Church is builded, ‘And other foundation’ (says St. Paul) ‘can no man lay than that is laid, which is Jesus Christ.’ Not that we should think that there were no other fundamental doctrine to be acknowledged but this alone (for the articles of the Holy Ghost, forgiveness of sins, resurrection of the dead, eternal judgement, and such like other have their place also in the foundation), but because this is the most special object of faith, and the primary foundation of all the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration of the Universality of the Church of Christ &amp; the Unity of the Catholic Faith… (London, 1629)</cite>, pp. 38-39</span></figcaption>

</figure><figure class="quote" id="q-e5add384d7" data-kw="">
<blockquote><p>If you ask, ‘Whom must we learn of?’ I answer: Of those that know, and have learned themselves. No name or title, or relation, or habit will enable any man to teach you that which he knows not himself. 1. Children must learn of their parents and tutors. 2. People must learn of their able, faithful pastors and catechizers. 3. All Christians must be teachers by charitable helps to one another… 4. Take nothing as necessary to the being of Christianity and to salvation which is not recorded in the Scripture and has not been held as necessary by all true Christians in every age and place… 5. Maintain the unity of the Spirit in the bond of peace with all true Christians as such, and live in love in the communion of saints… 6. Prefer not any odd or singular sect before the universal consent of the faithful in your learning or communion, so far as the judgment of men is to be regarded… 7. Never set a doubtful opinion against a certain truth or duty: reduce not things certain to things uncertain; but contrarily uncertain things to certain: for instance, It is certain that you ought to live in love and peace with all that are true Christians, and to do good to all and wrong to none: Let not any doubtful difference make you violate this rule, and hate, and slander and backbite, and hurt them for a doubtful, indifferent or unnecessary thing… 8. Faithfully serve Christ as far as you have attained, and be true to all the truth that you know; sin not by omission or practice against the knowledge which you have, lest God in justice give up your understanding to believe a lie. 9. Remember that all men on earth are ignorant, and know but as in a glass, and in part, and therefore the best have many errors: No man knows the smallest grass or worm with an adequate, perfect knowledge. And if God bear with multitudes of errors in us all, we must bear with such as are tolerable in each other… Divinity is not less mysterious than Law and Physic, etc. where controversies abound. 10. Yet stilt not yourselves in knowledge, nor say we have learned enough, but continue as Christ’s scholars in learning more and more to the death: the wisest know little, and may still increase. There is a great difference in excellency, usefulness and comfort between men of clear digested knowledge, and confused undigested apprehensions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 283-87 in Sermon 11, ‘The Cure of Melancholy &amp; Overmuch Sorrow by Faith &amp; Physic’ in A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved by Sundry Ministers in October, 1682 ed. Samuel Annesley (London: Dunton, 1683)</cite>, pp. 285-87</span></figcaption>

t+God+in+justice+give+up+your+understanding+to+believe+a+lie.+9.+Remember+that+all+men+on+earth+are+ignorant%2C+and+know+but+as+in+a+glass%2C+and+in+part%2C+and+therefore+the+best+have+many+errors%3A+No+man+knows+the+smallest+grass+or+worm+with+an+adequate%2C+perfect+knowledge.+And+if+God+bear+with+multitudes+of+errors+in+us+all%2C+we+must+bear+with+such+as+are+tolerable+in+each+other%E2%80%A6+Divinity+is+not+less+mysterious+than+Law+and+Physic%2C+etc.+where+controversies+abound.+10.+Yet+stilt+not+yourselves+in+knowledge%2C+nor+say+we+have+learned+enough%2C+but+continue+as+Christ%E2%80%99s+scholars+in+learning+more+and+more+to+the+death%3A+the+wisest+know+little%2C+and+may+still+increase.+There+is+a+great+difference+in+excellency%2C+usefulness+and+comfort+between+men+of+clear+digested+knowledge%2C+and+confused+undigested+apprehensions.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+pp.+283-87+in+Sermon+11%2C+%E2%80%98The+Cure+of+Melancholy+%26+Overmuch+Sorrow+by+Faith+%26+Physic%E2%80%99+in+A+Continuation+of+Morning-Exercise+Questions+%26+Cases+of+Conscience+Practicaly+Resolved+by+Sundry+Ministers+in+October%2C+1682+ed.+Samuel+Annesley+%28London%3A+Dunton%2C+1683%29%2C+pp.+285-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe5add384d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5add384d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=If%20you%20ask%2C%20%E2%80%98Whom%20must%20we,digested%20knowledge%2C%20and%20confused%20undigested%20apprehensions&amp;text=If%20you%20ask%2C%20%E2%80%98Whom%20must%20we%20learn%20of&amp;text=of%20clear%20digested%20knowledge%2C%20and%20confused%20undigested%20apprehensions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d25bfdbd6b" data-kw="">
<blockquote><p>…a man may be a schismatic, forsaking communion with a true Church, and yet not be an heretic, in as much as he may rightly believe all the articles of the Faith. … Other divisions there are which are with separation, when men shall withdraw themselves from fellowship and communion with a true Church, so breaking themselves off from the body. And this (says our judicious [William] Ames)¹ by way of special appropriation, deserves most rightly to be called by the name of ‘schism’: in as much as heresy in this division is perfected and brought to a head, as also most clearly manifested, and declared, viz. in refusing of due Church-communion. ¹ Quia autem haec scissio maxime perficitur et apparet in debita communione Ecclesiastica recusanda, idcirco illa separatio per appropriationem singularium recte vocatur Schisma [But because this division is chiefly brought about and becomes evident in the refusing of due ecclesiastical communion, therefore that separation, by the appropriating of things to oneself, is rightly called ‘schism’]. Ames, Cases of Conscience on Schism Which refusal may be either partial, or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting, and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called. Which (again) may be either from the Church, or from a Church. From the Church catholic, the whole Church. That was properly Donatism (the direct error of the Seekers at this day): Or from a particular Church; and that is properly Separatism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of the Present Schism of New Separation in old England (London: Field, 1646)</cite>, pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-c9eab65a4f" data-kw="">
<blockquote><p>So then did you know any to hold forth fundamental errours, such as are the overthrow of faith or destructive to the power of godliness, there is no countenance to be given to such, you make yourselves sharers with him in his sin and bring upon yourselves the same guilt. And therefore says Paul, Tit. 3:10: ‘A man that is an heretic after the first and second admonition reject, knowing that he that is such, is subverted, and sins being condemned of himself.’ These are the rules for undoing errors: Nay and were they defiling though not damning errors, were they but sinful, though not destroying errours, yet if they were evidenced to us, and manifest to us to be errors, we ought not to connive at them, to countenance them in their way, but to admonish, to reprove them, to exhort them and use all possible ways left by Christ to reclaim them. But now when the things held forth are but merely opinion, or if more, yet they are not any way injurious to faith, or hurtful to the power and practise of godliness, then there may be more agreement, the difference of judgment should not in this case alienate affections, though you are not all of one mind, yet you are all of one heart, and here you differ only about the way to advance God’s glory. You have both cordial affections to God and Christ, you desire to bring Him glory, only you differ in the way; one thinks this way, and the other this, and in both it may be the Scripture is silent, or holds out as much for one as the other. Now in this case why should there be falling out: certainly diversities of opinion, may be countenanced, and yet without sin, provided that it does not arise either from fickleness, unsettledness and inconstancy in us, or from pride, that we love to side and differ from others, or that it does not tend to make disturbance of the peace of the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Errour… (London: Kembe, 1646)</cite>, pp. 67-68</span></figcaption>

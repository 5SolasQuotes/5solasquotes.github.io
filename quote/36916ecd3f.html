<main class="wrap"><figure class="quote" id="q-36916ecd3f" data-kw="">
<blockquote><p>You so vaunt your selves lustily in speech of the circumcision of your foreskins, and your uncircumcised hearts overflow with spiderlike poison: you brag of keeping the Sabbath day whiles you take your bodily repose only: but the right use of the Sabbath of the Lord is to have a quiet mind, free from all ire of envy and malice.

This Sabbath you do profane continually, but then chiefly most wickedly, when ye murdered the Lord himself, neither seem as yet satisfied therewith, nor ye will relent any iota at al from your cackred [sic] contumacy: you profess in words the letter of the law, but utterly disclaim from the spiritual meaning of the law in your deeds.

You cry out, The Temple of the Lord, the Temple of the Lord: and yet you abhor the Church of Christ, being the true Temple of the Lord: you challenge to your selves a wonderful haughty prerogative of the blood offerings, of the Priesthood, of the Sacrifices and ceremonies of the Law, which in deed carry a certain gallant resemblance of true religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>

<blockquote><p>Wherefore we thought it right, to shew forth with all accuracy, in our present definition the error of such as make and venerate these, for it is the unanimous doctrine of all the holy Fathers and of the six Ecumenical Synods, that no one may imagine any kind of separation or mingling in opposition to the unsearchable, unspeakable, and incomprehensible union of the two natures in the one hypostasis or person. What avails, then, the folly of the painter, who from sinful love of gain depicts that which should not be depicted—that is, with his polluted hands he tries to fashion that which should only be believed in the heart and confessed with the mouth? He makes an image and calls it Christ. The name Christ signifies God and man. Consequently it is an image of God and man, and consequently he has in his foolish mind, in his representation of the created flesh, depicted the Godhead which cannot be represented, and thus mingled what should not be mingled. Thus he is guilty of a double blasphemy—the one in making an image of the Godhead, and the other by mingling the Godhead and manhood. Those fall into the same blasphemy who venerate the image, and the same woe rests upon both, because they err with Arius, Dioscorus, and Eutyches, and with the heresy of the Acephali. When, however, they are blamed for undertaking to depict the divine nature of Christ, which should not be depicted, they take refuge in the excuse: We represent only the flesh of Christ which we have seen and handled. But that is a Nestorian error. For it should be considered that flesh was also the flesh of God the Word, without any separation, perfectly assumed by the divine nature and made wholly divine. How could it now be separated and represented apart? So is it wish the human soul of Christ which mediates between the Godhead of the Son and the dulness of the flesh. As the human flesh is at the same time flesh of God the Word, so is the human soul also soul of God the Word, and both at the same time, the soul being deified as well as the body, and the Godhead remained undivided even in the separation of the soul from the body in his voluntary passion. For where the soul of Christ is, there is also his Godhead; and where the body of Christ is, there too is his Godhead. If then in his passion the divinity remained inseparable from these, how do the fools venture to separate the flesh from the Godhead, and represent it by itself as the image of a mere man? They fall into the abyss of impiety, since they separate the flesh from the Godhead, ascribe to it a subsistence of its own, a personality of its own, which they depict, and thus introduce a fourth person into the Trinity. Moreover, they represent as not being made divine, that which has been made divine by being assumed by the Godhead. Whoever, then, makes an image of Christ, either depicts the Godhead which cannot be depicted, and mingles it with the manhood (like the Monophysites), or he represents the body of Christ as not made divine and separate and as a person apart, like the Nestorians. The only admissible figure of the humanity of Christ, however, is bread and wine in the holy Supper. This and no other form, this and no other type, has he chosen to represent his incarnation. Bread he ordered to be brought, but not a representation of the human form, so that idolatry might not arise. And as the body of Christ is made divine, so also this figure of the body of Christ, the bread, is made divine by the descent of the Holy Spirit; it becomes the divine body of Christ by the mediation of the priest who, separating the oblation from that which is common, sanctifies it. The evil custom of assigning names to the images does not come down from Christ and the Apostles and the holy Fathers; nor have these left behind them, any prayer by which an image should be hallowed or made anything else than ordinary matter.</p></blockquote>

</figure><figure class="quote" id="q-f61059cb55" data-kw="">
<blockquote><p>If we had the true portrait and very resemblance of our Saviour Christ, taken from his own body, what account ought we to make of it? Had I such a picture, I would keep it as most precious, not only above all other painting, but as one of the most worthy objects of man’s sight: But I would ever make more account of the least Christian than of such a picture: For a Christian represents Christ a great deal better then any paint. A true human body animated not only with a reasonable soul, but also with the spirit of Christ, does it not more resemble Christ than a dead crucifix, or a shape that expresses nothing but some superficial lineaments? I say more: That if one would abuse this picture and idolatrize it, I would do by it as Hezekiah did by the brazen serpent, 2 Kings 18:14. . A notable difference betwixt one of the figures which represented Christ and those that represented the angels, and a consideration upon the matter. In the Old Testament Christ was figured by the image of a serpent set upon a pole, without the Tabernacle, in an open place: But the angels were figured by the faces of men, having wings, placed over the ark itself, in the most holy of Holies. If we consider these figures and their placing, that of Christ’s was greatly inferior unto that of the angels: and if the true image of Christ did consist in outward lineaments, a human shape had been fitter there than that of a serpent. . Whence is it that in the Apocalypse, Jesus Christ (being man) is deciphered only in parabolical figures rather than in the natural form of his own body? We see him appear with seven stars in his right hand, and a two-edged sword going forth of his mouth: We see him clad with a robe dipped in blood, and mounted upon a white horse: We see him in the shape of a lamb slain, having seven eyes and seven horns. But we never see him there, or in any other place of the holy history, in the figure of his own natural visage: To teach us that we ought rather to seek Him in the description of his graces than in the idea of the feature of his visage.</p></blockquote>

</figure><figure class="quote" id="q-ea6928ec62" data-kw="">
<blockquote><p>…whereas your surplice is arbitrarily institute[d], and imposed to signify innocency, without either real foundation or sufficient warrant, wherein, whether you do more usurp against God’s prerogative to appoint sacred and mysterious signs, and that simplicity, in which he has set forth his Gospel, or be more grossly mistaken in the event and fruit of your application, is a great question? I grant that necessity or decency have introduced many things circumstantial that are rational, and consequently upon some real antecedent ground expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures and the like, without which worship cannot be performed; But to ascribe a liberty to the Church of appointing ceremonies, having for reason of their signification, the will of the instituter, and their use only in the representation, is so manifest an impingement upon Divine authority and the sacraments thereby ordained, and has already produced such a mass of superstitious superfluity in the Romish-Church, that I much admire to find a serious person pleading for such fopperies…</p></blockquote>

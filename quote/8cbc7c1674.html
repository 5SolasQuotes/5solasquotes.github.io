<main class="wrap"><figure class="quote" id="q-8cbc7c1674" data-kw="">
<blockquote><p>We now come to the closing scene of our redemption. For the lively assurance of our reconciliation with God arises from Christ having come from hell as the conqueror of death, in order to show that he had the power of a new life at his disposal. Justly, therefore, does Paul say that there will be no gospel, and that the hope of salvation will be vain and fruitless, unless we believe that Christ is risen from the dead, (1 Cor. 15:14.) For then did Christ obtain righteousness for us, and open up our entrance into heaven; and, in short, then was our adoption ratified, when Christ, by rising from the dead, exerted the power of his Spirit, and proved himself to be the Son of God. Now, though he manifested his resurrection in a different manner from what the sense of our flesh would have desired, still the method of which he approved ought to be regarded by us also as the best. He went out of the grave without a witness, that the emptiness of the place might be the earliest indication; next, he chose to have it announced to the women by the angels that he was alive; and shortly afterwards he appeared to the women, and, finally, to the apostles, and on various occasions. Thus he gradually brought his followers, according to their capacity, to a larger measure of knowledge. He began with the women, and not only presented himself to be seen by them, but even gave them a commission to announce the gospel to the apostles, so as to become their instructors. This was intended, first, to chastise the indifference of the apostles, who were like persons half-dead with fear, while the women ran with alacrity to the sepulchre, and likewise obtained no ordinary reward. For though their design to anoint Christ, as if he were still dead, was not free from blame, still he forgave their weakness, and bestowed on them distinguished honour, by taking away from men the apostolic office, and committing it to them for a short time. In this manner also he exhibited an instance of what Paul tells us, that he chooses those things which are foolish and weak in the world to abase the loftiness of the flesh. And never shall we be duly prepared to learn this article of our faith in any other manner than by laying aside all pride, and submitting to receive the testimony of the women. Not that our faith ought to be confined within such narrow limits, but because the Lord, in order to make trial of our faith, determines that we shall become fools, before he admits us to a more ample knowledge of his mysteries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, trans., William Pringle, 3.338–39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e4abf0ed1" data-kw="">
<blockquote><p>Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17, pp. 253-54</span></figcaption>

</figure><figure class="quote" id="q-6337527b5a" data-kw="">
<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>

<blockquote><p>Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Miscellanies”</cite>, (1722), WJE Online vol. 13, t. ‘Universal Redemption’, p. 174</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.”

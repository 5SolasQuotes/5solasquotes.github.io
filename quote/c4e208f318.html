<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, … (1636), Of the Communicants’ gesture in the act of receiving, eating and drinking’, 4th Part, ch. 5, ‘Kneeling in the act of receiving the sacramental elements of the supper is idolatry’, pp. 104-6</span></figcaption>

<blockquote><p>we must see why it is that St. Paul praises the Corinthians… Now we note that in the Church of God there is first of all doctrine, and then there is order and policy… As for the rest, other than doctrine, there is also policy, and this policy is left to us in liberty. So, for example, we are presently assembled at eight o’clock; one might well arrange for it to be at seven o’clock, or change the order in some regard. And, indeed, we often see that one Church will by no means have precisely the same order as another… and do we have a different Christianity on that account? Not at all. For what belongs to outward order and policy (as I said) has been left to human liberty. It is true we must proceed with sound-mindedness and modesty, and ever consider what is fitting for the edification of the Church, as we will be exhorted in the fourteenth chapter, and there it will be treated more fully. …he did not inject himself by imposing certain laws, bringing souls into bondage; he did not erect a ‘divine service’ such as one sees in Papistry. None of all that. Rather he conveyed to them an order designed to maintain decency, peace and concord among them… So, when the gospel is preached in any place, and a church is raised up, some particular ordinances must be established, which one will know to be proper and which everyone will use in his liberty. But this (as I said) has nothing to do with adding to the doctrine of faith, nor with making laws that put our souls in bondage.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“we must see why it is that St. Paul praises the Corinthians… Now we note that in the Church of God there is first of all doctrine, and then there is order and policy… As for the rest, other than doctrine, there is also policy, and this policy is left to us in liberty. So, for example, we are presently assembled at eight o’clock; one might well arrange for it to be at seven o’clock, or change the order in some regard. And, indeed, we often see that one Church will by no means have precisely the same order as another… and do we have a different Christianity on that account? Not at all. For what belongs to outward order and policy (as I said) has been left to human liberty. It is true we must proceed with sound-mindedness and modesty, and ever consider what is fitting for the edification of the Church, as we will be exhorted in the fourteenth chapter, and there it will be treated more fully. …he did not inject himself by imposing certain laws, bringing souls into bondage; he did not erect a ‘divine service’ such as one sees in Papistry. None of all that. Rather he conveyed to them an order designed to maintain decency, peace and concord among them… So, when the gospel is preached in any place, and a church is raised up, some particular ordinances must be established, which one will know to be proper and which everyone will use in his liberty. But this (as I said) has nothing to do with adding to the doctrine of faith, nor with making laws that put our souls in bondage.”

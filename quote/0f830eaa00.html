<main class="wrap"><figure class="quote" id="q-0f830eaa00" data-kw="">
<blockquote><p>John Bidle’s XII Arguments Drawn out of the Scripture; wherein the commonly Received Opinion, Touching the Deity of the Holy Spirit, Is clearly and fully Refuted (1647) was answered by several Reformed theologians and scholars, both continental and British. These responses were full, demonstrative, and clear; but they were written largely for academics. It fell to a young parish minister, Matthew Poole, not yet thirty years of age, to provide a concise and popular response, for the edification of the common man. Poole’s Blasphemer Slaine with the Sword of the Spirit remains one of the best popular defenses of the Deity of the Holy Spirit in the English language.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Blasphemer Slain with the Sword of the Spirit in The Literary Labors of the Reverend Matthew Poole</cite>, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82dcf6a70a" data-kw="Spirit personality agent">
<blockquote><p>He is an intelligent, voluntary, divine agent; he knoweth, he worketh as he will: which things, if, in their frequent repetition, they are not sufficient to evince an intelligent agent, a personal subsistence, that hath being, life, and will, we must confess that the Scripture was written on purpose to lead us into mistakes and misapprehensions of what we are, under penalty of eternal ruin, rightly to apprehend and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, Of the Holy Ghost</span></figcaption>

</figure><figure class="quote" id="q-8d5cf3a7cf" data-kw="Spirit of both Filioque">
<blockquote><p>Scripture teaches that the Spirit proceeds from both the Father and the Son, in passages where He is called the Spirit of both. In Romans 8:9, He is called both the Spirit of God and the Spirit of Christ in the same verse. The Spirit is said to be sent by both the Father and the Son (John 15:26): &quot;The Comforter, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father.&quot; And in John 16:14: &quot;He will take what is mine and declare it to you.&quot; Reason also supports this.</p></blockquote>

</figure><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 8, “The Holy Spirit”</span></figcaption>

</figure><figure class="quote" id="q-fd31edefff" data-kw="fons deitatis Father">
<blockquote><p>The Son emanates from the Father alone, but the Holy Spirit from the Father and the Son together. … If the mode of subsisting is considered (according to which the Father is the fountain of deity from whom the Son emanates), not improperly in this sense is he said to proceed from the Father through the Son.</p></blockquote>

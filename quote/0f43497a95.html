<main class="wrap"><figure class="quote" id="q-0f43497a95" data-kw="">
<blockquote><p>The author [J. L. Girardeau] in his eloquent conclusion anticipates that some will meet his arguments with sneers rather than serious discussion, which he proposes to endure with Christian composure. It is a reproach to our church, which fills us with grief, to find this prediction fulfilled in some quarters. Surely persons calling themselves Presbyterians should remember that the truths they profess to hold sacred have usually been in small minorities sneered at by the arrogant majorities. So it was in the days of the Reformers, of Athanasius, of the Apostles, and of Jesus himself.

The resort to this species of reply appears the more ill-considered, when we remember that Dr. Girardeau is supporting the identical position held by all the early fathers, by all the Presbyterian reformers, by a Chalmers, a Mason, a Breckinridge, a Thornwell, and by a Spurgeon. Why is not the position as respectable in our author as in all this noble galaxy of true Presbyterians? Will the innovators claim that all these great men are so inferior to themselves?

The idea seems to be that the opposition of all these great men to organs arose simply out of their ignorant old-fogeyism and lack of culture; while our advocacy of the change is the result of our superior intelligence, learning and refinement. The ignorance of this overweening conceit makes it simply vulgar. These great men surpassed all who have succeeded them in elegant classical scholarship, in logical ability, and in theological learning. Their depreciators should know that they surpassed them just as far in all elegant culture.

The era of the Reformation was the Augustan age of church art in architecture, painting and music. These reformed divines were graduates of the first Universities, most of them gentlemen by birth, many of them noblemen, denizens of courts, of elegant accomplishments and manners, not a few of them exquisite poets and musicians. But they unanimously rejected the Popish Church music; not because they were fusty old pedants without taste, but because a re fined taste concurred with their learning and logic to condemn it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Girardeau s “Instrumental Music in Public Worship”’, Presbyterian Quarterly</cite></span></figcaption>

</figure><figure class="quote" id="q-7ac968f88a" data-kw="">
<blockquote><p>But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.</p></blockquote>

<blockquote><p>2. A calling is extraordinary, either in habit or in exercise; in habit, as to be an apostle and have the gift of miracles: Thus our reformers calling was not extraordinary, they were not immediately called by God from Heaven; for they would not have concealed such a calling, if they had had any such: Or a calling is extraordinary in the exercise, and that two ways; either in the principle moving them to teach, or, 2. in the manner of teaching and efficacy; a calling extraordinary in the principle moving is twofold: Either a mere prophetical impulsion of revelation stirring them up to such an act, as the Spirit of the Lord came upon Saul and he prophesied; this our reformers had not because we never find that they allege it. 2. A more than ordinary motion with illumination by God’s Spirit speaking in the Scriptures, in which motions they were not subordinate in the exercise of their ministry to the Church of pastors, but immediately in that subordinated to God; and in this I prove that our reformers were extraordinary doctors.

1. Because Eze. 34, in a universal apostasy of the prophets and shepherds, the Lord extraordinarily works, v. 11, ‘For thus saith the Lord God, behold I, even I will both search my sheep, and seek them out.’ Now this is by pastors, when the ordinary pastors are all failed. So Rev. 11, in that universal apostasy under Antichrist, when the gentiles tread upon the outer court of the Temple and the holy City, God stirs up two witnesses to prophesy in sackcloth; that is, some few pastors (for two is the smallest number) and they prophesy and are slain, and yet they rise again. We need not apply this to men in particular, as to John Huss and Jerome of Prague; but certainly, some few spake against Babylon and they were borne down and oppressed and killed, and men of that same spirit rose and spake that same truth as if the very two men who were slain had risen within three days again.

2. Because when the Church is overgone with heresy and Apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; and suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 126-7</span></figcaption>

1. Because Eze. 34, in a universal apostasy of the prophets and shepherds, the Lord extraordinarily works, v. 11, ‘For thus saith the Lord God, behold I, even I will both search my sheep, and seek them out.’ Now this is by pastors, when the ordinary pastors are all failed. So Rev. 11, in that universal apostasy under Antichrist, when the gentiles tread upon the outer court of the Temple and the holy City, God stirs up two witnesses to prophesy in sackcloth; that is, some few pastors (for two is the smallest number) and they prophesy and are slain, and yet they rise again. We need not apply this to men in particular, as to John Huss and Jerome of Prague; but certainly, some few spake against Babylon and they were borne down and oppressed and killed, and men of that same spirit rose and spake that same truth as if the very two men who were slain had risen within three days again.

2. Because when the Church is overgone with heresy and Apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; and suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.”

%2C+some+few+spake+against+Babylon+and+they+were+borne+down+and+oppressed+and+killed%2C+and+men+of+that+same+spirit+rose+and+spake+that+same+truth+as+if+the+very+two+men+who+were+slain+had+risen+within+three+days+again.+2.+Because+when+the+Church+is+overgone+with+heresy+and+Apostasy%2C+our+reformers%2C+in+the+exercise+of+their+ministry%2C+were+not+to+keep+a+certain+flock+as+in+a+constitute%5Bd%5D+Church%2C+and+suppose+they+had+no+calling+but+eminent+gifts%2C+they+were+to+spread+the+Gospel+to+nations%2C+as+Luther+did%3B+and+suppose+the+people+should+resist+them%2C+as+in+many+places+they+did%3B+yet+God+called+them%2C+and+they+were+not+to+expect+election+from+people%3A+So+%5Bmen+of%5D+Cyprus+and+Cyrenus+preached%2C+Acts+11+and+18%2C+and+we+read+of+no+vocation+that+they+had+from+either+people+or+apostle.+So+Origen+preached+to+a+people+in+a+certain+town+where+there+was+not+one+Christian%2C+and+afterwards+he+was+chosen+their+pastor.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland%2C+%281642%29%2C+pp.+126-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb61100438.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb61100438.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=2.%20A%20calling%20is%20extraordinary%2C%20either,afterwards%20he%20was%20chosen%20their%20pastor&amp;text=2.%20A%20calling%20is%20extraordinary%2C%20either%20in%20habit&amp;text=Christian%2C%20and%20afterwards%20he%20was%20chosen%20their%20pastor" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>All the power to be owned in bishops, is derived to them from the King; and, in those things wherein the King has power in church matters, in those things we may obey the bishops, as his delegates and substitutes… the law calls the King patron-general of England. His appointing me to preach [in the second indulgence], supposes I must have hearers, and those, of necessity, out of some parish or other. What we do is to serve the present necessity, and not of choice.</p></blockquote>

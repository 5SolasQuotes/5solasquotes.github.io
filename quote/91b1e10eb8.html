<main class="wrap"><figure class="quote" id="q-91b1e10eb8" data-kw="">
<blockquote><p>‘and in sin has my mother conceived me’ …he having original sin from his parents, was in that sin ‘conceived’, that is, fostered and nourished in his mother’s womb, and brought forth in the same, for so largely do I take the word of ‘conceiving’, the beginning of a thing being put for the growth, proceeding and continuance of the same thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-wilcox.html">Thomas Wilcox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Very Godly &amp; Learned Exposition upon the Whole Book of Psalms (1591), on Ps. 51, p. 151 Wilcox (c.1549-1608) was an English puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1282dc278f" data-kw="">
<blockquote><p>III. Problem: Whether [a man may be generated] from a man and a brute? I would scarcely dare to concede it. Some examples are adduced by the historians Castanheda the Portuguese, Saxo Grammaticus, Olaus Magnus, João de Barros, Juan Eusebio Nieremberg, bk. 5 chs. 6-7, and that well-known one in Belgium in Delrio, bk. 2, question 14. But to confess the truth, I would prefer not to be so liberal in believing… …Fortunio Liceti [d. 1657] in book 2 of his work On Monsters [1616], chs. 68-73… His second reason is: That the uterus, for example of a [living] cow, can be a suitable place in which a human fetus can be conserved, cherished, and all the functions necessary for its formation and perfection can be performed no less than in a human uterus, as he says is clear from what he wrote in his book, On the Perfect Constitution of Man in the Uterus [1616], chs. 23-24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), ‘On Creation’, pt. 10 Latin</cite>, pp. 298-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

ormed Books Online</a></div>
</figure><figure class="quote" id="q-58428f44b4" data-kw="">
<blockquote><p>I so think that in the very point of generation, when the matter is disposed to that point that it is apt for the reception of the substantial form, which makes a man out of an embryo, that the souls of individual men are more probably both new and created from nothing, this being in greater harmony with the sacred letters, testimonies of the fathers and philosophers, and reasons than that one is propagated from another through being passed over or through the seed of parents.</p></blockquote>

</figure><figure class="quote" id="q-4fa34fcbb3" data-kw="">
<blockquote><p>III. The union of pastor and flock in relation makes that which is a form-aptitudinal (as the soul to the body) to be the form in act (as the union of soul and body)… IV. Union is in order to communion, which is primary by the exercise of the formal powers on the matter, and secondary by the action of all the parts according to their several capacities and offices. … VI. These several degrees of union are found in bodies natural and politic: 1. The union of soul and body makes a man, and an embryo before it be organized. 2. The union of the body makes it capable of the soul’s further operation. 3. The union of the organical, chief parts (as heart, lungs, etc.) to the rest make it a true human body completed to the nutriment and action of life. 4. That it have hands and fingers, feet and toes, and all integral parts, makes it an entire body. 5. The due site, temperament and qualities of each part make it a sound body. 6. Comely color, hair, action, going, speech, etc. make it a comely body. 7. To have all parts of equal quantity and office would make it uncomely: and to have the same hair, color, etc. is unnecessary at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation… (London: 1684), ch. 4</cite>, pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

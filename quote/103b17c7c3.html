<main class="wrap"><figure class="quote" id="q-103b17c7c3" data-kw="">
<blockquote><p>From the consideration of which arises an important controversy between us and the Papists, which we shall briefly touch upon. The Apostle, as you have heard, desires for the faithful grace and peace from God, and from the Lord Jesus Christ; i. e. gratuitous acceptance for Christ’s sake, adoption among the children of God, and assurance of the remission of sins: Hence it is enquired Whether the faithful can or cannot assuredly determine with themselves that they are in favour with God, and that their sins are remitted them for Christ’s sake, in whom they have believed ? Our opinion is that every faithful and truly justified man may, and ought, infallibly to believe, that his sins are remitted to him as an individual, and that God is reconciled to him; i. e. that he hath this grace and peace, which the Apostle desired for the Colossians.

The opinion of the Papists is. That they who are truly justified and in favour with God, yet neither can nor ought to believe that they are reconciled to God and justified; but to hope and conjecture only that they are in a state of grace, and have obtained remission.

We establish our opinion by these arguments :

1. From the nature of faith. He who is endued with true faith sees, by the very light of that faith kindled in his heart through the Holy Spirit, that he believes in Christ, and is justified by faith: but he who sees this, at the same time is able to conclude that he is in favour with God, and that his sins are remitted him. For Scripture plainly states. Being justified by faith we have peace, Rom. v. 1 . He that believeth on the Son hath everlasting life, John iii, 16 and 36. Therefore the whole difficulty lies in this. To shew that a believer is authorised to say, not from conjecture and opinion, but from conviction, I believe in Christ. This is proved from Augustine, De Trin. xiii. 1, That which we are commanded to believe we are not able to see ; yet faith itself when it is wrought in us, we know to be in us. So Thomas [Aquinas], Whosoever hath knowledge or faith, is sure that he hath it; became it is of the nature of faith, that a man should be certain of those things of which he hath faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 36-38.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-389fd2ec20" data-kw="">
<blockquote><p>Controversy VI: Can man be certain of his present justice or the divine grace received in Christ? Thesis: The certainty of justice or justification in Christ is not a human conjecture but an infallible confidence that excludes final and total doubt and is based both on the promise of grace, which is universal for all believers, and on the special application and infallible testimony of the Holy Spirit. [Romanist] Antithesis: No one in this life can affirm with certainty and infallibility that their sins have been forgiven without a special revelation. This is a vain confidence and a presumptuous heresy. Thesis:

1. Scripture teaches that the justified have peace (Romans 5) and are persuaded of God’s grace (Romans 8; 2 Timothy 3 and 4).

2. The testimony of the Holy Spirit in our hearts is infallible (John 16; Romans 8; Galatians 4), being the seal and guarantee with which believers are confirmed and sealed (2 Corinthians 1; Ephesians 1 and 4).

3. True faith confidently trusts and expels doubt or unease from the heart (Romans 4; James 1; Ephesians 2; Hebrews 10 and 11).

4. Through the study of external piety, as an infallible argument, we know that we have true faith (2 Peter 1; 1 John 3 and 4).

5. The promises of grace are universal for believers (John 3; Romans 10) and are conditioned on faith and repentance. Therefore, these promises apply to all who find that condition in themselves.

6. The Church Fathers teach the same. Augustine: “It is not arrogance but faith to proclaim what you have received.” Bernard: “Believe that your sins are forgiven. This is the testimony the Holy Spirit gives in our hearts, saying: ‘Your sins are forgiven.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

</figure><figure class="quote" id="q-051d847712" data-kw="">

<blockquote><p>II. It is not queried whether passive power (which is the principle of suffering from another) may be granted in God. Since this cannot be supposed without imperfection and change, it is evident that it should be removed far from him. Nor if the generation of the Son or the spiration of the Spirit is expressed in passive terms, does it immediately follow that there is in God passive power (since this denotes a mere relation [schesin] to the persons generating and spirating). But we treat only of the active power, the principle of acting on another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 3, Q. 21, ‘The Power of God, p. 245</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a243bfa1f6" data-kw="repentance anthropopathism">
<blockquote><p>Repentance is attributed to God after the manner of men (anthrōpopathōs) but must be understood after the manner of God (theoprepōs): not with respect to his counsel, but to the event; not in reference to his will, but to the thing willed; not to affection and internal grief, but to the effect and external work because he does what a penitent man usually does.</p></blockquote>

</figure><figure class="quote" id="q-81566d7454" data-kw="">
<blockquote><p>Still, a critic might object that anything that actualizes another thing must be undergoing change itself in the course of doing so, and thus must have potentialities which need to be actualized. Thus (so the objection might go) the very notion of a purely actual actualizer is incoherent. [1.] But one problem with this objection is that it simply begs the question. The Aristotelian argument for God’s existence claims to prove that no potential could be actualized at all unless there is a first actualizer, which is purely actual and thus devoid of potentiality. So, given that the premises of this argument are true and that the conclusion follows logically from them, it follows that the conclusion is true and therefore coherent. Accordingly, it won’t do simply to insist that the conclusion must be false; one has to show specifically either that one of the premises is false or that the conclusion does not follow. Otherwise, one ought to admit that the argument shows precisely that a purely actual actualizer really is possible (since actual) after all. [2.] Another problem is that the objection seems to be grounded in what logicians call a fallacy of accident. In our experience, when a thing changes another thing, it undergoes change itself; for instance, when your arm moves a stick, that is because your arm is itself moving in the process. Things in our experience thus actualize other things precisely by going from potential to actual themselves. But it doesn’t follow that absolutely anything that actualizes another thing must itself go from potential to actual. That is like reasoning from the premise that every president of the United States has in fact been under seven feet tall to the conclusion that absolutely anyone who could ever become president must be under seven feet tall. That does not follow, because there is no essential connection between being president and being under seven feet tall, but only an accidental or contingent connection. And the connection would remain contingent even if the facts of biology make it extremely unlikely that there will ever be a president taller than seven feet. Similarly, even if the actualizers of our experience are themselves mixtures of actual and potential, it simply doesn’t follow (for all the critic has shown) that there is an essential, as opposed to merely contingent, connection between being an actualizer and being a mixture of actual and potential. [3.] Besides, it is hardly as if the notion of a purely actual actualizer were somehow paradoxical, as (say) the notion of an “immortal mortal” would be. An “immortal mortal” would be something that both dies and does not die, which is self-contradictory. But a purely actual actualizer is something that actualizes other things without itself being actualized, and there is no self-contradiction in that idea. Furthermore, the reason the actualizers of our experience are themselves being actualized even as they actualize other things is precisely because they are limited in the various ways entailed by being mixtures of actual and potential. For example, because an arm which moves a stick is actually at one point in space and only potentially at another, its potential to be at the other point in space has to be actualized by something else if it is to get the stick to that other point in space. But something which is pure actuality, devoid of all potentiality, would have no such limitations, and thus not need to be actualized itself as it is actualizing other things.</p></blockquote>

</figure><figure class="quote" id="q-711b1f206b" data-kw="">
<blockquote><p>Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another. 2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things. 3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation. 5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels. 6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number. 7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows: 1. That whatsoever is in God, is God. 2. Whatsoever God wills He willed from eternity and always wills. 3. Whatsoever God wills, He wills simply, absolutely and independently. 4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.</p></blockquote>

, because they are all God Himself. From the simplicity of God it follows: 1. That whatsoever is in God, is God. 2. Whatsoever God wills He willed from eternity and always wills. 3. Whatsoever God wills, He wills simply, absolutely and independently. 4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.”

— John Norton, The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 5-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSimplicity+is+God%2C+one+mere+and+perfect+act+without+all+composition.+God+calls+his+name%2C+%E2%80%98I+am%2C%E2%80%99+Ex.+3%3A14%2C+that+is%2C+mere+essence%2C+wherein+is+nothing+past%2C+nor+to+come.+Because+spirits+are+immixed+in+respect+of+bodies%2C+to+show+that+He+is+not+compounded%2C+He+says+He+is+a+Spirit%2C+Jn.+4%3A24.+When+we+say+that+God+is+a+mere+and+perfect+act%2C+the+meaning+is+that+God+is+a+cause+without+any+cause%2C+a+being+that+is+not+from+any+being%3B+not+compounded+of+an+act%2C+by+which+He+is%2C+and+possibility%2C+by+which+He+might+not+have+been+or+may+not+be%3A+of+whom+it+never+could%2C+nor+can+be+said+that+anything+was+to+be+in+Him%2C+which+was+not%3B+or+cannot+be%2C+that+is.+That+God+is+a+pure+and+simple+act+without+all+composition+is+evident%2C+because+of+his+perfection%3B+all+composition+supposes+imperfection%2C+because+He+is+the+first+Being.+Were+there+any+composition+in+God%2C+it+would+follow+there+were+first+and+second+in+God%3A+Something+in+God+that+were+not+first%2C+or+that+there+were+more+first+Beings.+Because+God+is+a+Being+of+absolute+necessity+%28Deus+est+ens+necesse+esse+%5BGod+is+necessary+being%5D.+Smising%2C+Of+the+One+God%2C+tract+2%2C+disp.+2%2C+n.+49%29%3A+Composition+implies+either+that+there+must+be+more+beings+of+absolute+necessity%2C+or+that+there+is+something+in+God+that+may+not+be.+Composition+supposes+succession%2C+i.e.+something+past+or+to+come+in+God%3B+contrary+to+his+name%2C+%E2%80%98I+am%E2%80%99.+Nay+it+supposes+that+not-being+is+not+repugnant+to+the+nature+of+God%3A+Where+there+is+composition%2C+there+may+be+dissolution%3B+dissolution+is+the+way+to+not-being.+It+much+helps+us+in+the+contemplation+of+the+simplicity+of+God+to+look+upon+it+as+opposed+to+composition%2C+all+the+ways+whereof+the+learned+have+referred+to+these+seven+heads.+Composition+is+either+of+1.+Parts%2C+which+are+bounded+by+quantity%3B+as+a+body+having+one+part+upon+another.+2.+Matter+and+form%3B+as+a+man+of+body+and+soul%3A+these+two+compositions+are+only+found+in+corporeal+things.+3.+General+and+special+nature%3A+as+every+species%2C+whose+common+nature+is+to+be+found+in+some+other+thing%2C+where+the+special+nature+is+not%3B+as+a+living+creature+and+a+man.+4.A+subject+and+an+accident%3B+as+every+created+substance%3A+There+are+no+accidents+in+God%3A+He+is+wise%2C+holy%2C+just%2C+essentially%3A+there+is+not+a+substance+and+a+quality+in+Him.+When+God+is+said+only+to+have+immortality%2C+1+Tim.+6%3A16%2C+it+is+to+be+understood+by+way+of+eminency%3B+He+so+has+it+as+none+has+besides+Him%3A+He+has+it+originally%2C+not+derivatively+and+by+participation.+5.+An+act+and+a+possibility-objective+that+is+to+be%2C+if+the+thing+looked+at+as+yet+is+not+in+being%3B+or+%5Ba+possibility-%5Dpassive+that+is+not+to+be+%28though+that+not-being+never+shall+be%29%2C+if+the+thing+be+looked+at+as+in+actual+being%3A+this+composition+holds+concerning+angels.+6.+A+person+and+nature%3B+as+Christ%2C+compounded+of+the+divine+Person+and+human+nature%3B+which+yet+is+not+properly+composition+of+parts%2C+but+of+number.+7.+Being+and+individuation%3B+that+is%2C+that+by+which+we+have+such+a+particular+being%2C+as+humanity+and+Peter.+Objection%3A+Where+there+is+a+plurality%2C+there+is+not+simplicity%3A+But+in+the+divine+nature+there+is+a+plurality%3A+therefore.+Answer%3A+The+objection+holds+where+there+is+a+plurality+of+essences%2C+beings+or+things%2C+but+not+where+there+is+only+a+plurality+of+subsistences.+In+the+divine+nature%2C+though+there+be+a+Trinity%2C+therefore+a+plurality+of+subsistences+or+Persons%2C+yet+there+is+but+one+essence%3A+In+the+Trinity+there+is+distinction%2C+but+not+composition.+Objection+2.+The+attribute+of+simplicity+concludes+that+all+the+attributes+are+God+Himself%2C+and+consequently+that+there+is+no+inequality+amongst+them%3A+yet+we+read+that+his+tender+mercies+are+over+all+his+works%3B+so%2C+as+it+may+seem%2C+mercy+exceeds+the+other+attributes.+Answer%3A+The+meaning+is+that+his+mercy+is+over%2C+that+is%2C+upon+all+his+works%2C+not+that+God%E2%80%99s+mercy+exceeds+all+his+other+attributes%2C+as+if+one+attribute+were+greater+than+another%3A+for+all+the+attributes+of+God+are+equal%2C+not+one+higher+or+greater+than+another%2C+because+they+are+all+God+Himself.+From+the+simplicity+of+God+it+follows%3A+1.+That+whatsoever+is+in+God%2C+is+God.+2.+Whatsoever+God+wills+He+willed+from+eternity+and+always+wills.+3.+Whatsoever+God+wills%2C+He+wills+simply%2C+absolutely+and+independently.+4.+God+is+justice%2C+wisdom%2C+love%2C+etc.+essentially%3A+although+He+be+said+to+have+them+eminently%2C+yet+He+has+them+not+derivatively.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+5-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F711b1f206b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/711b1f206b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=Simplicity%20is%20God%2C%20one%20mere%20and,yet%20He%20has%20them%20not%20derivatively&amp;text=Simplicity%20is%20God%2C%20one%20mere%20and%20perfect%20act&amp;text=them%20eminently%2C%20yet%20He%20has%20them%20not%20derivatively" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For suppose we agree that its [God’s] existence involved no actualization of potential. Might not we still say that its activity involved the actualization of potential? Might not we thus say that while it had no potentialities with respect to its existence, it does have potentialities with respect to its activity (such as its activity of actualizing the existence of other things)? There are several problems with this suggestion, however, one of which might be obvious now that we have set out the principle agere sequitur esse [action follows being], according to which what a thing does reflects what it is. If the first cause of things exists in a purely actual way, how could it act in a less than purely actual way? How could its acting involve potentiality any more than its existence does? A thing’s existence is, after all, what is metaphysically most fundamental about it; everything else follows from that. In this case we are talking about something whose very existence is purely actual and devoid of potentiality. So, from where in its nature are the (metaphysically less fundamental) potentialities for activity that the critic suggests it has supposed to derive? Another problem with the suggestion in question is that to say of God that he has potentiality with respect to his activity, though not with respect to his existence, entails that God has parts—a purely actual part, and a part that is a potentiality. Now, as we saw in chapter 2, whatever has parts requires a cause. The reason is that the whole of which the parts are constituents is merely potential until actualized by some principle which combines the parts. This principle cannot be something intrinsic to the thing, for in that case it would be the cause of itself, which is incoherent. So, it must be something extrinsic to the thing. Keep in mind that this is true even if we think of the thing in question as having always existed, since we still need some explanation of why the parts are combined at all regardless of how long they have been combined. Even if the thing had no temporally prior cause, it would still require an ontologically prior cause. But to say of the first cause of things that it has a cause of its own is also incoherent, since if it has a cause of its own, it just isn’t really the first cause at all, and it isn’t what terminates the regress of a hierarchical series of the causes of the existence of things. For this reason too, then, there isn’t any sense to be made of the idea that God qua [as] first cause has potentialities with respect to his activity. So, again, God is purely actual, with no potentiality at all.</p></blockquote>

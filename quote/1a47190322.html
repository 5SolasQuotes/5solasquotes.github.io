<main class="wrap"><figure class="quote" id="q-1a47190322" data-kw="">
<blockquote><p>Consideration of these things ought to provoke us to think often of our duty so that we avoid doing the things that Paul accused the Galatians of. Having found freedom from idolatry and the worship of false gods, the Galatians had fallen back into a new form of slavery and allowed their consciences to be burdened and constrained by the yoke of legal ceremonies. Quite rightly, Paul condemned this. We have felt a similar blessing in that God has saved us from the slavery of sin and the devil by his Son Jesus Christ, and in these latter days he has taken us out of the darkness of superstition and led us into the light of the gospel.

Let us therefore acknowledge this great blessing and hang on to the freedom gained at such a price. Let us flee the wickedness of sin, and let us not love the world and the things of the world. Let us avoid every kind of superstition, and let us make sure that we do not fall into any trap that might take us back to the service of superstitious cults, which would be the most bitter burden of all. It burdens the conscience to the point that it does not allow anything in human life to appear happy and joyful.

It tortures minds with hunger and thirst, nor does it show us any way by which God might be placated and satisfied. The only thing it reveals is the perversity of the human mind. Instead of submitting to the saving slavery of the yoke of Christ, which is more precious than golden freedom and which is really easy and light, we seek the freedom or rather the license of the flesh. Instead of defending the freedom of the Spirit that Christ has obtained for us, we prefer to be slaves and bind ourselves to sin and its author the devil, nor are we bothered or bored by any amount of labour or trouble.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 143-44 (emphasis added).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f6fce6380" data-kw="">
<blockquote><p>…and some Christian commonwealths, he [Barclay] means his own synagogue of Rome, spiritual Sodom, a cage of unclean birds, suffers harlots by law; and the whores pay so many thousands yearly to the Pope, and are free of all punishment by law, to eschew [avoid or lessen] homicides, adulteries of Romish priests, and other greater sins; therefore [it would conclude] God has given power to a king to play the tyrant without any fear of punishment to be inflicted by man. But if this be a good argument, the magistrate to whom God has committed the sword to take vengeance on evil doers (Rom. 13:3-6), such as are perjured persons, professed whores and harlots, has a lawful power from God to connive at sins and gross scandals in the commonwealth, as they dream that the king has power given from God to exercise all acts of tyranny without any resistance. But:

1. This was a grievous sin in Eli, that he being a father and a judge, punished not his sons for their uncleanness, and his house, in God’s heavy displeasure, was cut off from the priesthood therefore. Then God has given no such power to the judge.

2. The contrary duty is lying on the judge to execute judgment for the oppressed (Job 29:12-17; Jer. 22:15-16) and perverting of judgment, and conniving at the heinous sins of the wicked, is condemned (Num. 5:31-32; 1 Sam. 15:23; 1 Kings 29:42-43; Isa. 1:17; 10:1; 5:23); and therefore God has given no power to a judge to permit wicked men to commit grievous crimes without any punishment. As for the [Mosaic] law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says; and the prophet says (Mal. 2) that the Lord hates putting away; but that God has given any such permissive power to the king, that he may do what he pleases, and cannot be resisted, this is in question.</p></blockquote>

</figure><figure class="quote" id="q-b159df79e1" data-kw="">
<blockquote><p>I challenge all men to shew me a nation that, till Christianity appeared to bless this world, enjoyed a constitution like our own. God be thanked for it, thanked for the Sovereign that fills the throne, thanked for the loyalty of her people, and thanked for our calm but resolute determination — as this city lately saw — to stand by the liberties and protect the privileges which came down to us from battles which our fathers fought, and scaffolds where they fell …

It is our freedom, our mental, social, political, religious freedom — which has made us great; and these, with God’s blessing, we owe to his word. The Bible has been the source of our liberties. The Bible and the Shorter Catechism, read and studied by Scotchmen, these have toughened their intellects, and set all the wheels of their minds in motion.

Talk of Liberty! liberty without the Bible is either dead or delirious. Look at France, where they would have liberty divorced from religion! …

No political regeneration has ever stood, or will ever stand, unless it is preceded, accompanied, or followed by a spiritual awakening. In our case, there was no failure. The Argyles, and Guthries, and Cargills of other days — Knox, with his indomitable spirit and bold endurance, the martyrs who sleep in the Greyfriars’ churchyard, and those who lie on Scotland’s hills, with nothing to mark their graves but a weathered stone, with its rude sketch of an open Bible, and a naked sword, they neither prayed, nor laboured, nor bled, nor died in vain.

And why? Why, but because they laid the foundations of our liberties deep in the Word of God. Therefore, we have a sovereign, but no slaves in this land; we have authority, but no oppression; we have rulers, but no tyrants; we have liberty without license, and religion without superstition: free trade, a free parliament, free justice, free thought; liberty, not the false, which is every man doing what he will, but the true, which is every man doing what he ought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-guthrie.html">Thomas Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Truth and Man’s Freedom: A Sermon’ in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

Talk of Liberty! liberty without the Bible is either dead or delirious. Look at France, where they would have liberty divorced from religion! …

No political regeneration has ever stood, or will ever stand, unless it is preceded, accompanied, or followed by a spiritual awakening. In our case, there was no failure. The Argyles, and Guthries, and Cargills of other days — Knox, with his indomitable spirit and bold endurance, the martyrs who sleep in the Greyfriars’ churchyard, and those who lie on Scotland’s hills, with nothing to mark their graves but a weathered stone, with its rude sketch of an open Bible, and a naked sword, they neither prayed, nor laboured, nor bled, nor died in vain.

And why? Why, but because they laid the foundations of our liberties deep in the Word of God. Therefore, we have a sovereign, but no slaves in this land; we have authority, but no oppression; we have rulers, but no tyrants; we have liberty without license, and religion without superstition: free trade, a free parliament, free justice, free thought; liberty, not the false, which is every man doing what he will, but the true, which is every man doing what he ought.”

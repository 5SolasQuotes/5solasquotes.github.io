<main class="wrap"><figure class="quote" id="q-09f5a9f3d5" data-kw="">
<blockquote><p>There is greater difficulty than Mr. Doctor [Archbishop Whitgift] mentions in the words of St. Paul, where he says a woman praying or prophesying ought to be vailed and have her head covered, in which words it seems that the apostle licenses a woman to prophesy so that she do it with her head covered. But to him that shall diligently consider the place, it shall appear that the women of Corinth did pass the bounds of modesty and of shamefastness two ways, whereof one was that they came into the congregation contrary to the custom of those countries with their heads and faces uncovered: another was that they also took upon them to speak in the congregation, both which faults St. Paul condemned…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift against the Admonition to the Parliament (1573), To the next section beginning at the 79 page and holding on until the 82 page</cite>, p. 141</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c2f68e531" data-kw="">
<blockquote><p>Sixthly, He tells us page 32, That in all Reformed Churches men used to enter into the place of public worship with their hats off, which is as great an untruth, as ever dropped from writers’ pen, unless it be understood of places of public worship, whilst public worship is actually performed in them, and if it may be so understood, then the Presbyterians would hugely approve of it. By the [Westminster] Directory it was enjoined that, all enter the assembly not irreverently, but in a grave and seemly manner: gravity and seemliness do include putting off the hat, which yet would be a ridiculous action, if a man should use it, as too many now a days do as oft as they go through the Church, though none be met for worship, and though they themselves intended no worship: nor does the Directory any where condemn the manner which Mr. Durell tells us has obtained among the French Ladies, viz. to unmask themselves when they come into the temple; provided they do not unmask themselves out of a vain or wanton design; if they should do so, they know by whom they are condemned. [I but says Mr. Durell, the devoutest sort both of men and women, use[d] to kneel and make a prayer for God’s blessing, before they sit down, and this the [Westminster] Directory prohibits.] Had he said that the devouter sort use a short prayer when they took no seats, and came to perform no service to God; then he had said something to excuse the actings of some among us. The peoples making a secret prayer before they sit down in their seats, is not forbidden by the Directory, unto all, or unto any, but these who come into the Church the public worship being begun, and whether it be more meet for such to betake themselves to their private devotions, or to join with the Assembly in that ordinance that is in hand, let the learned judge for they are wise. Seventhly, All might have been spared that is brought, page 33, Of people’s standing bare in time of divine service, and at the administration of sacraments: In the very Church of Scotland all are uncovered at the administration of the sacraments; here in England men had left off to put on their hats in time of sermon (which Mr. Durell seems to distinguish from Service) had Mr. Calamy and others been hearkened to. Eighthly, Above all, what need we be told, page 22, that Calvin wore a gown and a cap: Were not presbyterians accustomed so to do in the universities? Those sent down by the two Houses to Cambridge, did all of them preach in the University Church in their gowns, and in their hoods;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662.</cite>, pp. 55-57</span></figcaption>

<blockquote><p>Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59</cite>, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

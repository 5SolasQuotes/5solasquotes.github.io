<blockquote><p>Q. 2. Why will God have a Sabbath on earth?

A. God will have a Sabbath on earth, to give us therein an emblem of that eternal Sabbath in heaven, wherein his people shall be serving him, and praising him without interruption, or mixture of any other business throughout eternity; Heb. iv. 9. There remaineth therefore a rest to the people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of the Assembly’s catechism. With practical inferences from each question: as it was carried on in the Lord’s Days exercises in</cite>, Dartmouth, in the first year of liberty, 1688 (1692) in The works of John Flavel (6 vols, London, 1820), 6: 233.</span></figcaption>

<blockquote><p>THERE is one general remark on our Lord’s teaching as to the Sabbath, which may fitly precede the consideration of the special argument in the text. The remark is this: Often as our Lord was assailed and annoyed with questions about the Sabbath, he never once gave the slightest hint of there being any intention on his part to abolish the institution. This is the more remarkable, when we consider that he had no reserve in announcing the coming changes as to the place of worship, and the manner of worship.

As to the place of worship, – in conversing with the woman of Samaria (John iv.), when she asked whether Jerusalem or her own mountain was the ordained and sanctioned seat of worship, the Lord decides the controversy in favour of the Jews. But he takes care to add that the occasion of the controversy was about to disappear; the consecration of Jerusalem, or of any particular spot, as pre-eminently a centre of religious influence or authority, is to cease: “Woman, believe me, the hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father. Ye worship ye know not what we know what we worship: for salvation is of the Jews. But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth: for the Father seeketh such to worship him. God is a spirit: and they that worship him. must worship him in spirit and in truth.” (John iv. 21-24.)

So also in regard to the manner of worship; the Lord seems almost anxious to press the announcement that the temple worship is to be superseded and abolished. Once and again he figuratively puts himself in the place of the temple, and makes his own death and resurrection represent the ruin of one religious structure or economy, and the erection of another in its stead. And in a literal prophecy of great solemnity, he foretells the utter overthrow of the building; and, in consequence, the final abrogation of its services. All the more striking, on that account, is the silence of our Lord as to any contemplated alteration in the stated time of worship, any prospective repeal of the law of the Sabbath. Not a hint of the sort occurs in any one of the many conversations which he had to carry on, with reference to that very matter.

For my part, I am altogether at a loss to imagine how Christ, – I say not as a divine teacher, but simply as a fair teacher, could so often discuss points of debate about the manner of keeping the Sabbath, without uttering so much as a single word to indicate that, in his kingdom, the very bone of contention itself the institution to which the controversy related-was to be materially modified at least, if not to be taken bodily out of the way. If a change of that sort had really been in contemplation, I cannot conceive how He who is “the faithful witness,” could say so much about the Sabbath and the way of keeping it, without the shadow of a warning that, under his reign, the Sabbath is to cease, or its character is to be changed.

It would be impossible here to consider collateral arguments. Old Testament prophecy (Ps. cxviii. 22-24) seems to predict, and New Testament phraseology, speaking of “the Lord’s day,” seems to imply, the change which has taken place from the seventh day of the week to the first; and good reasons can be given for that change not being more abruptly and formally enjoined. The analogy of the Scriptures as a whole may be powerfully urged, in favour of the continued obligation of a weekly day of rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Sabbath: The Sabbath made for Man; The Son of Man Lord of it. A Sermon (Edinburgh: Johnstone &amp; Hunter, 1856), pp 7-11.</cite></span></figcaption>

<blockquote><p>Only it appeared to me to be requisite to show in passing, that this book makes known to us this privilege, which is desirable above all others — that not only is there opened up to us familiar access to God, but also that we have permission and freedom granted us to lay open before him our infirmities which we would be ashamed to confess before men. Besides there is also here prescribed to us an infallible rule for directing us with respect to the right manner offering to God the sacrifice of praise, which he declares to be most precious in his sight, and of the sweetest odour. There is no other book in which there is to be found more express and magnificent commendations, both of the unparalleled liberality of God towards his Church, and of all his works; there is no other book in which there is recorded so many deliverances nor one in which the evidences and experiences of the fatherly providence and solicitude which God exercises towards us are celebrated with such splendor of diction, and yet with the strictest adherence to truth, in short, there is no other book in which we are more perfectly taught the right manner of praising God, or in which we are more powerfully stirred up to the performance of this religious exercise. Moreover although The Psalms are replete with all the precepts which serve to frame our life to every part of holiness, piety, and righteousness, yet they will principally teach and train us to bear the cross; and the bearing of the cross is a genuine proof our obedience, since by doing this, we renounce the guidance of our own affections and submit ourselves entirely to God, leaving him to govern us, and to dispose of our life according to his will, so that the afflictions which are the bitterest and most severe to our nature, become sweet to us, because they proceed from him. In one word, not only will we here find general commendations of the goodness of God, which may teach men to repose themselves in him alone, and to seek all their happiness solely in him; and which are intended to teach true believers with their whole hearts confidently to look to him for help in all their necessities; but we will also find that the free remission of sins, which alone reconciles God towards us and procures for us settled peace with him, is so set forth and magnified, as that here there is nothing wanting which relates to the knowledge of eternal salvation.</p></blockquote>

<blockquote><p>Section 3, That on the Lord’s Day we must abstain from carnal recreations… we ought to… feed and cherish it with vain sports and worldly recreations… To them that are wearied with labour, the rest of the Lord’s Day is the best and fittest recreation for the refreshing of their bodies; and if they be spiritually-minded, the exercises of the Sabbath before spoken of, are the best recreations for the cheering of the heart and mind. For who can reasonably think when a man is tired with the week’s labour, that… should recreate a man more, than an holy and religious rest, hearing the Word, singing of Psalms, holy conferences, and such like…</p></blockquote>

</figure><figure class="quote" id="q-10bee237fb" data-kw="">
<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>

<blockquote><p>The third point comes now to be considered, namely the harmony or consent of both wills. For the words are, ‘I would, ye would not.’ [Mt. 23:37] Here it may justly be demanded whether there be a harmony or consent between God’s will and man’s will, and how it stands with this text. I answer, there is an excellent harmony: and generally it stands in this, that God’s will has a sovereign lordship over the will of man, and man’s will stands subject to it absolutely, and simply depends upon it. And by this means, where man has a will, God has an antecedent will;† and where man’s will has any stroke or action, there God’s will formerly had his stroke and action. † [Given the context and below, it is likely Perkins means God’s will of decree is antecedent to man’s will, involving the predetermination of man’s will. Perkins below criticizes Damascene’s sense of the term antecedent will.]</p></blockquote>

<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>

<blockquote><p>38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’

39. Therefore there is no cause properly so called to be given of God’s will.

40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself.

41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another.

42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature.

43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed.

44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’

45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, ... (d. 1633; London: Griffin, 1642), bk. 1, ch. 7, Of the Decree &amp; Counsel of God, pp. 32-33</span></figcaption>

<blockquote><p>11. We must as is said before distinguish between Christ (and the Father in Him) as Rector per Leges [Legislator through laws] or Legislator, and as Dominus Absolutus [Absolute Lord]. And so we must distinguish between those benefits which Christ as Rector gives by his laws and those which as mere Benefactor and Absolute Proprietary He gives, though not contrary to his laws or Covenant, yet over and above what by Covenant or Law He gives. Also we must distinguish between the event and nature of things as such, and the right to and dueness of things as such. And consequently we must most carefully distinguish between God’s will de rerum eventu [concerning the event of things] and his will de debito [concerning debt], as such. The clear distinguishing of these two is a singular key to the opening of the sense of Scripture, and in particular of this controversy. For indeed, it is to distinguish between our physics and our ethics. God’s will about natural beings as such stands at the top of physics as the first cause. God’s will de debito, as such, stands at the top of our ethics as the first cause. And you may easily conceive how the confounding of our physics and ethics must needs blind us and lose us in our divinity, as it would do in philosophy. I join all these distinctions together, for in some they all come to one or are of necessary consideration jointly that any one of them may be understood. Our divines, usually with the Schoolmen, distinguish between voluntatem signi and beneplaciti [will of sign and of good-pleasure]. But in the ordinary school-sense, that is not the same distinction with that which I here intend. Dr. [William] Twisse oft uses the distinction between voluntatem propositi et praecepti [will of putting forth and of precept], and means in effect the same that I do: But he oft speaks of it as being but metonymically God’s will and not properly. By which I must conclude that he meant quoad eventum [as to the event], and not quoad debitum [as to debt]; for God properly wills that this shall be man’s due or duty. I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies:

1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines:

1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing.

2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold:

1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will.

2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do. Also observe that you must here carefully distinguish between God’s act in making a law and the moral act of that law, or of his will by that law when it is made. I call not legislation itself, ‘God’s will de debito‘ or ‘his legislative will’. His ordaining the sign itself, or making the law which is his instrument, is an act of his will de rerum eventu vel naturae [concerning the event of things, or of their nature]. For it only makes that instrument or sign by which right [of debt] shall be after[wards] produced, but [it] does not directly thereby produce that right. But it is the signification and moral act of that law, which flows from its nature, which does produce right, and which we here intend. The scribe that writes a statute, and the sovereign himself, in composing the matter, order and terms, does but make that signum or instrument which, being made, does therefore institute right, because it signifies the sovereign’s will to institute it. So much for the explication of my meaning in this distinction. 2. Next I shall say somewhat to prove the soundness of it, which is therefore necessary because some ignorant persons laugh at it, as if we feigned two wills in God, and one of them contrary to the other. Otherwise, to men of understanding, it is not very needful; and therefore I shall say but this briefly: It is not two wills in God as two distinct essences or faculties that I assert, but only two distinct acts: Distinct, I say, in regard of their distinct products or effects, and so to man’s apprehension, though in God we say there is no diversity or distinction. Yet as we cannot handsomely conceive of his will to save Peter, and his will to damn Judas, as one act, having such different effects: so it is here. Who knows not that naturality and morality, physics and ethics, event and right are different things, and consequently we may and must distinguish of God’s willing them accordingly. When a man says, ‘You shall do this,’ preceptively, he does only say, ‘It shall be your duty to do it,’ but says not that eventually you shall do it. Nor are his words false if you never do it. He that says prophetically or by prognostication, ‘you shall do this,’ means that it shall so come to pass; and if it do not, his words are false; but he does not say, ‘It is or shall be your duty.’

12. Accordingly we must distinguish between the antecedent and consequent acts and will of Christ as Ruler of mankind. For the understanding of which and avoiding mistakes, observe:

1. That we speak not now of eternal decrees, but of the will of Christ in this relation as He is the Ruler of the world and Church, and as He is the conveyer of his mercies according to and by his Covenant, and as He judges the world according thereunto.

2. That by his antecedent will and acts, we mean only that which in his government is antecedent to man’s obedience or disobedience, which is principally legislation and making his new Covenant, and also the giving of preachers and other acts, which are the first part of his administration. And by his consequent acts and will, we mean only that second part of government which finds man obedient or disobedient, and is commonly called judgment and execution. And when we say that by his antecedent acts and will Christ gives pardon, justification and right to glory equally to all, we mean that as Legislator and Promiser He has antecedently made an universal act of oblivion, or deed of gift, conditionally pardoning, etc. all, and no farther than conditionally pardoning any. And when we say that He consequently justifies and saves none but true Christians, and in that sense died for no other according to his consequent will, we mean that as Judge of mankind, He will give justification and salvation to believers and to no others; nor [did He] ever intended to do otherwise. (Let the reader know that the foresaid scheme of the effects of Christ’s death is more accurately, and yet more briefly, done in my Methodus Theologiae: and therefore let him that dislikes the number or order of distributions pass it by: But I have not time to reform it here.</p></blockquote>

een+voluntatem+propositi+et+praecepti+%5Bwill+of+putting+forth+and+of+precept%5D%2C+and+means+in+effect+the+same+that+I+do%3A+But+he+oft+speaks+of+it+as+being+but+metonymically+God%E2%80%99s+will+and+not+properly.+By+which+I+must+conclude+that+he+meant+quoad+eventum+%5Bas+to+the+event%5D%2C+and+not+quoad+debitum+%5Bas+to+debt%5D%3B+for+God+properly+wills+that+this+shall+be+man%E2%80%99s+due+or+duty.+I+shall+therefore+a+little+further+explain+this+distinction+and+then+show+you+the+soundness+of+it%2C+and+then+the+exceeding+usefulness+and+necessity+of+it%2C+both+in+this+and+many+other+controversies%3A+1.+For+the+title+I+choose+rather+to+denominate+it+from+the+object+than+the+act%2C+because+the+diversity+is+in+the+object%2C+but+none+in+the+species+of+the+act+naturally+considered%3A+Debitum+and+natural+being+are+two+distinct+things%3B+but+%E2%80%98to+will%E2%80%99+one+and+%E2%80%98to+will%E2%80%99+the+other+is+all+one+as+to+the+nature+of+willing.+God+does+as+properly+will+duty+as+He+wills+natural+beings.+Yet+if+I+must+denominate+it+from+the+acts%2C+I+would+distinguish+between+God%E2%80%99s+Directive+Will+and+his+Legislative.+For+to+call+it+voluntas+praecepti+is+too+narrow+a+term%2C+for+the+precept+is+but+one+part+of+God%E2%80%99s+Law+and+determines+only+of+one+sort+of+right%2C+that+is%2C+of+the+dueness+of+obediential+actions+or+forbearance+of+forbidden+actions.+But+there+is+also+a+debitum+praemii+et+beneficii%E2%80%93pure+vel+absolute%E2%80%93dati%2C+et+debitum+poenae+%5Bdebt+of+reward+and+benefit%2C+whether+purely+or+absolutely+given%2C+and+a+debt+of+punishment%5D%2C+which+the+rest+of+the+Law%2C+Testament+or+Covenant+of+God+determines+of%2C+which+must+all+be+here+included+as+well+as+the+former.+In+sum%2C+the+Law+determines%3A+1.+What+shall+be+due+from+us%3B+2.+and+what+shall+be+due+to+us%2C+and+on+what+terms.+I+call+it+therefore%2C+The+will+of+God+de+eventu%2C+et+de+debito+%5Bof+event%2C+and+of+debt%5D%2C+as+such.+I+say+%E2%80%98as+such%2C%E2%80%99+for+else+they+are+coincident%3A+For+God%E2%80%99s+will+de+rerum+natura%2C+vel+existentia+determines+de+debito+quatenus+evenit+esse+debitum+%5Bdetermines+the+nature+or+existence+of+things%2C+and+debt+so+far+as+debt+comes+about%5D%2C+but+not+qua+debitum+%5Bas+debt%5D.+And+his+will+de+debito+determines+of+the+dueness+of+some+events%2C+not+as+eventual+%5Bas+to+the+event%5D%2C+but+as+due.+Or+to+avoid+all+ambiguity%3A+call+it+God%E2%80%99s+will+de+ente+mere+naturali+%5Bconcerning+merely+natural+being%5D+and+his+will+de+debito+morali+%5Bconcerning+moral+debt%5D%2C+or+Legislative+or+Governing.+2.+And+for+the+nature+of+the+distinction%2C+understand+further+that+there+are+two+acts+which+I+call+God%E2%80%99s+will+de+debito%3A+The+first+is+that+immanent+act+of+his+will+by+which+He+strictly+and+properly+wills+what+shall+be+due.+This+also+is+twofold%3A+1.+Productive%2C+or+instituting+dueness%3B+2.+and+approbative%2C+or+taking+complacency+in+duty.+The+former+of+these+I+principally+intend%2C+but+exclude+not+the+latter.+God+does+eternally+will+every+due%2C+but+it+is+not+therefore+eternally+or+from+eternity+due.+For+He+wills+from+eternity+%28to+speak+vulgarly%29+only+that+this+shall+be+due+at+such+a+time+and+by+such+a+means.+I+say+by+such+means%3A+For+though+God%E2%80%99s+will+produce+all+dueness%2C+yet+only+by+means+does+He+produce+it.+That+means+is+the+revelation+of+his+will.+2.+This+revelation+of+God%E2%80%99s+will+de+debito+we+call+his+Law.+This+therefore+is+the+second+thing+which+I+call+God%E2%80%99s+will+de+debito%2C+or+his+Legislative+will%2C+that+is%2C+the+Law+as+it+is+signum+voluntatis+divinae+%5Ba+sign+of+the+divine+will%5D%2C+that+is%2C+formally+as+a+law.+This+I+call+God%E2%80%99s+will+de+debito%2C+only+metonymically%2C+as+it+is+the+sign+of+his+will+before+expressed.+If+the+proper+will+of+God+were+separated+from+this%2C+it+would+then+be+no+producer+of+dueness+or+right+at+all%2C+for+it+would+be+no+law%2C+no+signum%3B+it+would+lose+its+nature+as+abrogated+laws+do.+Also+observe+that+you+must+here+carefully+distinguish+between+God%E2%80%99s+act+in+making+a+law+and+the+moral+act+of+that+law%2C+or+of+his+will+by+that+law+when+it+is+made.+I+call+not+legislation+itself%2C+%E2%80%98God%E2%80%99s+will+de+debito%E2%80%98+or+%E2%80%98his+legislative+will%E2%80%99.+His+ordaining+the+sign+itself%2C+or+making+the+law+which+is+his+instrument%2C+is+an+act+of+his+will+de+rerum+eventu+vel+naturae+%5Bconcerning+the+event+of+things%2C+or+of+their+nature%5D.+For+it+only+makes+that+instrument+or+sign+by+which+right+%5Bof+debt%5D+shall+be+after%5Bwards%5D+produced%2C+but+%5Bit%5D+does+not+directly+thereby+produce+that+right.+But+it+is+the+signification+and+moral+act+of+that+law%2C+which+flows+from+its+nature%2C+which+does+produce+right%2C+and+which+we+here+intend.+The+scribe+that+writes+a+statute%2C+and+the+sovereign+himself%2C+in+composing+the+matter%2C+order+and+terms%2C+does+but+make+that+signum+or+instrument+which%2C+being+made%2C+does+therefore+institute+right%2C+because+it+signifies+the+sovereign%E2%80%99s+will+to+institute+it.+So+much+for+the+explication+of+my+meaning+in+this+distinction.+2.+Next+I+shall+say+somewhat+to+prove+the+soundness+of+it%2C+which+is+therefore+necessary+because+some+ignorant+persons+laugh+at+it%2C+as+if+we+feigned+two+wills+in+God%2C+and+one+of+them+contrary+to+the+other.+Otherwise%2C+to+men+of+understanding%2C+it+is+not+very+needful%3B+and+therefore+I+shall+say+but+this+briefly%3A+It+is+not+two+wills+in+God+as+two+distinct+essences+or+faculties+that+I+assert%2C+but+only+two+distinct+acts%3A+Distinct%2C+I+say%2C+in+regard+of+their+distinct+products+or+effects%2C+and+so+to+man%E2%80%99s+apprehension%2C+though+in+God+we+say+there+is+no+diversity+or+distinction.+Yet+as+we+cannot+handsomely+conceive+of+his+will+to+save+Peter%2C+and+his+will+to+damn+Judas%2C+as+one+act%2C+having+such+different+effects%3A+so+it+is+here.+Who+knows+not+that+naturality+and+morality%2C+physics+and+ethics%2C+event+and+right+are+different+things%2C+and+consequently+we+may+and+must+distinguish+of+God%E2%80%99s+willing+them+accordingly.+When+a+man+says%2C+%E2%80%98You+shall+do+this%2C%E2%80%99+preceptively%2C+he+does+only+say%2C+%E2%80%98It+shall+be+your+duty+to+do+it%2C%E2%80%99+but+says+not+that+eventually+you+shall+do+it.+Nor+are+his+words+false+if+you+never+do+it.+He+that+says+prophetically+or+by+prognostication%2C+%E2%80%98you+shall+do+this%2C%E2%80%99+means+that+it+shall+so+come+to+pass%3B+and+if+it+do+not%2C+his+words+are+false%3B+but+he+does+not+say%2C+%E2%80%98It+is+or+shall+be+your+duty.%E2%80%99+12.+Accordingly+we+must+distinguish+between+the+antecedent+and+consequent+acts+and+will+of+Christ+as+Ruler+of+mankind.+For+the+understanding+of+which+and+avoiding+mistakes%2C+observe%3A+1.+That+we+speak+not+now+of+eternal+decrees%2C+but+of+the+will+of+Christ+in+this+relation+as+He+is+the+Ruler+of+the+world+and+Church%2C+and+as+He+is+the+conveyer+of+his+mercies+according+to+and+by+his+Covenant%2C+and+as+He+judges+the+world+according+thereunto.+2.+That+by+his+antecedent+will+and+acts%2C+we+mean+only+that+which+in+his+government+is+antecedent+to+man%E2%80%99s+obedience+or+disobedience%2C+which+is+principally+legislation+and+making+his+new+Covenant%2C+and+also+the+giving+of+preachers+and+other+acts%2C+which+are+the+first+part+of+his+administration.+And+by+his+consequent+acts+and+will%2C+we+mean+only+that+second+part+of+government+which+finds+man+obedient+or+disobedient%2C+and+is+commonly+called+judgment+and+execution.+And+when+we+say+that+by+his+antecedent+acts+and+will+Christ+gives+pardon%2C+justification+and+right+to+glory+equally+to+all%2C+we+mean+that+as+Legislator+and+Promiser+He+has+antecedently+made+an+universal+act+of+oblivion%2C+or+deed+of+gift%2C+conditionally+pardoning%2C+etc.+all%2C+and+no+farther+than+conditionally+pardoning+any.+And+when+we+say+that+He+consequently+justifies+and+saves+none+but+true+Christians%2C+and+in+that+sense+died+for+no+other+according+to+his+consequent+will%2C+we+mean+that+as+Judge+of+mankind%2C+He+will+give+justification+and+salvation+to+believers+and+to+no+others%3B+nor+%5Bdid+He%5D+ever+intended+to+do+otherwise.+%28Let+the+reader+know+that+the+foresaid+scheme+of+the+effects+of+Christ%E2%80%99s+death+is+more+accurately%2C+and+yet+more+briefly%2C+done+in+my+Methodus+Theologiae%3A+and+therefore+let+him+that+dislikes+the+number+or+order+of+distributions+pass+it+by%3A+But+I+have+not+time+to+reform+it+here.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Universal+Redemption+of+Mankind+by+the+Lord+Jesus+Christ+Stated+%26+Cleared%2C+%E2%80%A6+%28London%3A+Salusbury%2C+1694%29%2C+ch.+2%2C+pp.+27-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3379d5e856.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3379d5e856.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=11.%20We%20must%20as%20is%20said,not%20time%20to%20reform%20it%20here&amp;text=11.%20We%20must%20as%20is%20said%20before%20distinguish&amp;text=I%20have%20not%20time%20to%20reform%20it%20here" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

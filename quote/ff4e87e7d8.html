<main class="wrap"><figure class="quote" id="q-ff4e87e7d8" data-kw="">
<blockquote><p>From the perpetuity of the Lord’s Kingdom, we may infer that this cause of God shall prevail, and that the Church, though in the burning bush, cannot be consumed; for Jehovah is in the bush.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4417b543a8" data-kw="">
<blockquote><p>…to appear in the likeness of a flame of fire in a bush, and the bush not consumed, is not an impossible work to a created angel: yet it was God Himself, even Christ the Son of God that so appeared: for He is called the God of Abraham, the God of Isaac, Ex. 3:6, which could be no angel. And Moses pronouncing a blessing upon Joseph, says, The good will of him that dwelt in the bush, shall come upon the head of Joseph, Deut. 33:16, but God only has the power and authority of blessing… It was God therefore, and not an angel that appeared in the bush. Now then by these places given in instance it is evident, that some things said to be done by God in the Scriptures, not exceeding the power of angels, were so done by the Lord Himself, and not by the angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum: that is, A Sixfold Commentary... (London: Haviland, 1633), Question 20, ‘Whether Jehovah Christ Jesus appeared not in the Old Testament, but only, or usually the angels’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-ebe86ae8b9" data-kw="">
<blockquote><p>That making of pictures of creatures, which are visible or may be comprehended, or historical fancies (to speak so) such as the senses and elements use to be holden forth by (which are rather hieroglyphics than real pictures) these I say, are not simply unlawful, but are so when they are abused (so Solomon made images of lions for his use, and thus the gift of engraving and painting as well as others which God has given to men, may be made use of, when (as has been said) it is not abused)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments… (London, 1675), 1st Commandment</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-d9eb87081e" data-kw="">
<blockquote><p>For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it. Hezekiah is praised for destroying the bronze serpent to which divine worship was being offered (2 Kings 10 [18:4]), and so I think they should be praised also who do away with the image of the crucifix as well, for the purpose of guarding against the same idolatry, and eliminate them from all temples and sacred places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’</cite>, p. 489</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it. Hezekiah is praised for destroying the bronze serpent to which divine worship was being offered (2 Kings 10 [18:4]), and so I think they should be praised also who do away with the image of the crucifix as well, for the purpose of guarding against the same idolatry, and eliminate them from all temples and sacred places.”

</figure><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>

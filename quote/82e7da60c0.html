<blockquote><p>That ministers and other office-bearers in the Church, ought to be set over congregations by the call and consent of the majority of such in these congregations who are admitted to full communion with the Church in all her sealing ordinances; and that there should be no preference of voices in this matter upon the account of any secular consideration.</p></blockquote>

<blockquote><p>let it be considered in steering this course, using this liberty and holding [lay] communion [but not ministerial] with this very [Anglican] Church, under these very corruptions and by attendance on this very order of service and solemn public worship: I am not without the caution and conduct of the sober, godly, learned promoters and pursuers of a perfect and complete reformation: The reformed Churches beyond the seas and in Scotland obtained higher degrees of reformation, and more purity of ordinances, than did England (for power and dominion the chiefest reformed Church) yet these never did disown or decline communion with her, nor advise any her members thereunto, yet they did often rebuke and complain of her lukewarm hesitation in the degrees of reformation obtained, and retention of those corruptions which ought to have been expelled among ourselves…</p></blockquote>

</figure><figure class="quote" id="q-8ce7ded970" data-kw="">
<blockquote><p>The committee of the Assembly of Westminster, in their Reply to the Independents, said, If the Church impose anything that is sinful, we must forbear to comply, yet without separation, as was the practice of the puritans in the late times. As to the charge of schism, they admit that difference in judgment, in some particular points, is not schism; nor does an inconformity to some things enjoined deserve that name. But our [Independent] Brethren desire further to set up separate communions, which is a manifest rupture of our societies into others; and is therefore a schism in the Body. This is a setting up altar against altar, allowing our churches, as Independents do, to be true churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Q. What is the Moral Law?

A. It is a Doctrine commanding the perfection of Godliness, and Righteousness, binding us to eternal death for our least defect therein; which Law is handled at large throughout the whole Scripture, but is summarily contained, first into ten words, or ten Commandments, written by God’s own finger at the first, in Tables of stone: to signify thereby, not only the hardness of our hearts, in which they ought to be imprinted; but also the perpetual use of them, to the very end of the world. And after, further abridged into two Commandments by our Saviour Christ, containing the sum of the whole Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), pp 74-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09eadf03f7" data-kw="">
<blockquote><p>Therefore Paul separates the spiritual people of the new covenant from the Law when he says that this people is not the child of Hagar, who had a husband, but of Sarah, the free woman, who does not know the Law. In this way he sets the people of faith far above and beyond the Law. But if it is above and beyond the Law, then it is justified, not by the Law and works but solely by its spiritual birth, that is, by faith. For spiritual birth is nothing other than faith. Now just as the people of grace neither has the Law nor can have it, so the people of the Law neither has grace nor can have it; for it is impossible for Law and grace to exist together. Either we must be justified by faith and lose the righteousness of the Law, or we must be justified by the Law and lose grace and the righteousness of faith. It is a bitter and tragic loss when we keep the Law and lose grace. On the other hand, it is a fortunate and saving loss when we keep grace and lose the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 445.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote>

</figure><figure class="quote" id="q-a7d6993795" data-kw="">
<blockquote><p>First here observe, that the Law of God is made perpetual and unchangeable: If any man ask how this can be, seeing the Apostle saith, The Law is changed?

Answer. The Law is threefold; Ceremonial, Judicial, and Moral, as hath been said: now that place is principally to be understood of the Ceremonial law, which indeed is abrogated, in regard of the observation of it in God’s worship; but in the scope and substance of it, which is Christ crucified, with his benefits, whom it shadowed out, it remaineth still, and is now more plain then ever it was.

As for the Judicial law, though it be abrogated unto us, so far forth as it was peculiar to the Jews; yet, as it agrees with common equity, and serves directly to establish the precepts of the Moral law, it is perpetual. If it be said, that Christ changed the Moral law, in changing the Sabbath day, from the seventh day to the eight: I answer, Christ did so indeed by his Apostles, but that is no change of the substance, but of the ceremony of the Sabbath: for the substance of that law is, the enjoining of a seventh day’s rest unto the Lord. Now though the seventh day from the creation be not kept, yet a seventh day is kept still.

If it be further said, that the Law it self is abrogated; for that every one that breaketh the Law is not accursed, according to the sentence thereof, Deut. 27. 26.

Answer. We must know that the Law is but one part of God’s word, and the Gospel another, revealing another part of Gods will, besides that which the Law made known; for it adds a qualification to the Law, moderating the rigour thereof, after this manner: He is accursed (saith the Law) that faileth in any commandment, except (saith the Gospel) he be reconciled again in Christ, and in him have the pardon of his transgressions. And yet the Moral law remains for ever a rule of obedience to every child of God, though he be not bound to bring the same obedience for his justification before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 74-75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-8efa5b6e4a" data-kw="">
<blockquote><p>Now having expounded the words of the Commandment, let us come briefly to handle the question, Whether this Commandment be perpetual, binding all men in all ages, or whether temporary binding only the men which lived before the resurrection of Christ, and no further? It is manifest that the Laws given in the old Testament are to be distinguished in regard of their continuance into these two kinds. For the will of the Law-giver (from which the force, extent, and continuance of the Law hath its original) was that some of them should be observed but till the resurrection of Christ and no longer, and again that some should continue in force from the time of their making to the world’s end.

Now concerning this fourth Commandment, it is apparent that the Law-giver did intend that it should bind all men for ever from the time that he gave it. For how could he declare his mind in this behalf more plainly then by equalling it in all things with those precepts which are known to be of everlasting continuance, and by separating it from, and exalting it above all those other which are known to have been but Temporary. It was promulgated in the same majestic manner with the same voice, at the same time, and in the same place that the other nine. It was delivered to the same person to be laid up together in the same Ark, and so is a part of the same Covenant, whence those Tables are called the Tables of the Covenant, and that Ark the Ark of the Covenant.

What Commandment, therefore is a part of the eternal Covenant, and is by God graced and commended with all those signs of commendation wherewith all the rest are graced, cannot, I think, be made of less continuance then the rest; for what did their writing in Tables of stone, and laying up in the Ark signify, but their durableness and eternal continuance, and full accomplishment for us in Christ. The Lord hath separated this precept from all temporary precepts, by giving it those privileges, as it were, and notes of honour, which all of them wanted, and God hath equalled it with the perpetual and everlasting precepts, by communicating to it all those testimonies of force and continuance which they had, therefore we are bound to believe that he would have this to continue in force as much and as long as the rest, even to all men in all ages, so long as this world shall last.

There is one argument that carries some shew of force for the overthrowing of this Doctrine of the perpetuity of the fourth Commandment, viz. That we are not now bound to do the thing it requireth, nay we are bound not to do it. For our Sabbath is not the seventh but the eighth from the Creation. To which I answer, That this fourth Commandment doth not require to rest and sanctify the seventh from the creation, nor from any other period or date of time, but alone the seventh after six of labour, or coming betwixt six of labour, in a settled course of numbering from any period that God should appoint; and so in the meaning of the Commandment we do now and ever must rest the seventh day, for the seventh is that part in order of numbering which doth still come betwixt six, having six before it and six after continually, and so our day of rest hath, and therefore we also rest the seventh day.

Indeed the period from which we take the beginning of our account, is not the same but another, for they did reckon from the beginning of the Creation and so forward, we from the Resurrection and so forward; but ours is as truly and surely the seventh as theirs, though reckoned from another period; and for the period from whence the count must be made, we have no word at all in this precept. He saith not six days from the creation thou shalt labour, and the seventh from the creation is the Sabbath of the Lord, in it thou shalt do no work, but six days shalt thou labour; and he saith not after, the Lord blessed and sanctified the seventh day from the creation, but the Sabbath day; that is, the seventh after six of labour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor</cite>, (London: William Lee, 1654), IX.V, pp 813-14.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now having expounded the words of the Commandment, let us come briefly to handle the question, Whether this Commandment be perpetual, binding all men in all ages, or whether temporary binding only the men which lived before the resurrection of Christ, and no further? It is manifest that the Laws given in the old Testament are to be distinguished in regard of their continuance into these two kinds. For the will of the Law-giver (from which the force, extent, and continuance of the Law hath its original) was that some of them should be observed but till the resurrection of Christ and no longer, and again that some should continue in force from the time of their making to the world’s end.

Now concerning this fourth Commandment, it is apparent that the Law-giver did intend that it should bind all men for ever from the time that he gave it. For how could he declare his mind in this behalf more plainly then by equalling it in all things with those precepts which are known to be of everlasting continuance, and by separating it from, and exalting it above all those other which are known to have been but Temporary. It was promulgated in the same majestic manner with the same voice, at the same time, and in the same place that the other nine. It was delivered to the same person to be laid up together in the same Ark, and so is a part of the same Covenant, whence those Tables are called the Tables of the Covenant, and that Ark the Ark of the Covenant.

What Commandment, therefore is a part of the eternal Covenant, and is by God graced and commended with all those signs of commendation wherewith all the rest are graced, cannot, I think, be made of less continuance then the rest; for what did their writing in Tables of stone, and laying up in the Ark signify, but their durableness and eternal continuance, and full accomplishment for us in Christ. The Lord hath separated this precept from all temporary precepts, by giving it those privileges, as it were, and notes of honour, which all of them wanted, and God hath equalled it with the perpetual and everlasting precepts, by communicating to it all those testimonies of force and continuance which they had, therefore we are bound to believe that he would have this to continue in force as much and as long as the rest, even to all men in all ages, so long as this world shall last.

There is one argument that carries some shew of force for the overthrowing of this Doctrine of the perpetuity of the fourth Commandment, viz. That we are not now bound to do the thing it requireth, nay we are bound not to do it. For our Sabbath is not the seventh but the eighth from the Creation. To which I answer, That this fourth Commandment doth not require to rest and sanctify the seventh from the creation, nor from any other period or date of time, but alone the seventh after six of labour, or coming betwixt six of labour, in a settled course of numbering from any period that God should appoint; and so in the meaning of the Commandment we do now and ever must rest the seventh day, for the seventh is that part in order of numbering which doth still come betwixt six, having six before it and six after continually, and so our day of rest hath, and therefore we also rest the seventh day.

Indeed the period from which we take the beginning of our account, is not the same but another, for they did reckon from the beginning of the Creation and so forward, we from the Resurrection and so forward; but ours is as truly and surely the seventh as theirs, though reckoned from another period; and for the period from whence the count must be made, we have no word at all in this precept. He saith not six days from the creation thou shalt labour, and the seventh from the creation is the Sabbath of the Lord, in it thou shalt do no work, but six days shalt thou labour; and he saith not after, the Lord blessed and sanctified the seventh day from the creation, but the Sabbath day; that is, the seventh after six of labour.”

— Edward Leigh, A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor, (London: William Lee, 1654), IX.V, pp 813-14.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+having+expounded+the+words+of+the+Commandment%2C+let+us+come+briefly+to+handle+the+question%2C+Whether+this+Commandment+be+perpetual%2C+binding+all+men+in+all+ages%2C+or+whether+temporary+binding+only+the+men+which+lived+before+the+resurrection+of+Christ%2C+and+no+further%3F+It+is+manifest+that+the+Laws+given+in+the+old+Testament+are+to+be+distinguished+in+regard+of+their+continuance+into+these+two+kinds.+For+the+will+of+the+Law-giver+%28from+which+the+force%2C+extent%2C+and+continuance+of+the+Law+hath+its+original%29+was+that+some+of+them+should+be+observed+but+till+the+resurrection+of+Christ+and+no+longer%2C+and+again+that+some+should+continue+in+force+from+the+time+of+their+making+to+the+world%E2%80%99s+end.%0A%0ANow+concerning+this+fourth+Commandment%2C+it+is+apparent+that+the+Law-giver+did+intend+that+it+should+bind+all+men+for+ever+from+the+time+that+he+gave+it.+For+how+could+he+declare+his+mind+in+this+behalf+more+plainly+then+by+equalling+it+in+all+things+with+those+precepts+which+are+known+to+be+of+everlasting+continuance%2C+and+by+separating+it+from%2C+and+exalting+it+above+all+those+other+which+are+known+to+have+been+but+Temporary.+It+was+promulgated+in+the+same+majestic+manner+with+the+same+voice%2C+at+the+same+time%2C+and+in+the+same+place+that+the+other+nine.+It+was+delivered+to+the+same+person+to+be+laid+up+together+in+the+same+Ark%2C+and+so+is+a+part+of+the+same+Covenant%2C+whence+those+Tables+are+called+the+Tables+of+the+Covenant%2C+and+that+Ark+the+Ark+of+the+Covenant.%0A%0AWhat+Commandment%2C+therefore+is+a+part+of+the+eternal+Covenant%2C+and+is+by+God+graced+and+commended+with+all+those+signs+of+commendation+wherewith+all+the+rest+are+graced%2C+cannot%2C+I+think%2C+be+made+of+less+continuance+then+the+rest%3B+for+what+did+their+writing+in+Tables+of+stone%2C+and+laying+up+in+the+Ark+signify%2C+but+their+durableness+and+eternal+continuance%2C+and+full+accomplishment+for+us+in+Christ.+The+Lord+hath+separated+this+precept+from+all+temporary+precepts%2C+by+giving+it+those+privileges%2C+as+it+were%2C+and+notes+of+honour%2C+which+all+of+them+wanted%2C+and+God+hath+equalled+it+with+the+perpetual+and+everlasting+precepts%2C+by+communicating+to+it+all+those+testimonies+of+force+and+continuance+which+they+had%2C+therefore+we+are+bound+to+believe+that+he+would+have+this+to+continue+in+force+as+much+and+as+long+as+the+rest%2C+even+to+all+men+in+all+ages%2C+so+long+as+this+world+shall+last.%0A%0AThere+is+one+argument+that+carries+some+shew+of+force+for+the+overthrowing+of+this+Doctrine+of+the+perpetuity+of+the+fourth+Commandment%2C+viz.+That+we+are+not+now+bound+to+do+the+thing+it+requireth%2C+nay+we+are+bound+not+to+do+it.+For+our+Sabbath+is+not+the+seventh+but+the+eighth+from+the+Creation.+To+which+I+answer%2C+That+this+fourth+Commandment+doth+not+require+to+rest+and+sanctify+the+seventh+from+the+creation%2C+nor+from+any+other+period+or+date+of+time%2C+but+alone+the+seventh+after+six+of+labour%2C+or+coming+betwixt+six+of+labour%2C+in+a+settled+course+of+numbering+from+any+period+that+God+should+appoint%3B+and+so+in+the+meaning+of+the+Commandment+we+do+now+and+ever+must+rest+the+seventh+day%2C+for+the+seventh+is+that+part+in+order+of+numbering+which+doth+still+come+betwixt+six%2C+having+six+before+it+and+six+after+continually%2C+and+so+our+day+of+rest+hath%2C+and+therefore+we+also+rest+the+seventh+day.%0A%0AIndeed+the+period+from+which+we+take+the+beginning+of+our+account%2C+is+not+the+same+but+another%2C+for+they+did+reckon+from+the+beginning+of+the+Creation+and+so+forward%2C+we+from+the+Resurrection+and+so+forward%3B+but+ours+is+as+truly+and+surely+the+seventh+as+theirs%2C+though+reckoned+from+another+period%3B+and+for+the+period+from+whence+the+count+must+be+made%2C+we+have+no+word+at+all+in+this+precept.+He+saith+not+six+days+from+the+creation+thou+shalt+labour%2C+and+the+seventh+from+the+creation+is+the+Sabbath+of+the+Lord%2C+in+it+thou+shalt+do+no+work%2C+but+six+days+shalt+thou+labour%3B+and+he+saith+not+after%2C+the+Lord+blessed+and+sanctified+the+seventh+day+from+the+creation%2C+but+the+Sabbath+day%3B+that+is%2C+the+seventh+after+six+of+labour.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+system+or+body+of+divinity+consisting+of+ten+books%3A+wherein+the+fundamentals+and+main+grounds+of+religion+are+opened%2C+the+contrary+errors+refuted%2C+most+of+the+controversies+between+us%2C+the+papists%2C+Arminians%2C+and+Socinians+discussed+and+handled%2C+several+Scriptures+explained+and+vindicated+from+cor%2C+%28London%3A+William+Lee%2C+1654%29%2C+IX.V%2C+pp+813-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8efa5b6e4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8efa5b6e4a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/11/edward-leigh-on-the-perpetual-obligation-of-the-fourth-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

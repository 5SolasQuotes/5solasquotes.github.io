<main class="wrap"><figure class="quote" id="q-deac9362f2" data-kw="">
<blockquote><p>To put us all upon prizing Apostolical doctrine as the Crown of our Church and Nation. Let Italy boast of her rich Copes, stately Altars, curious Images (which are so far from adorning a Church, as that they do indeed defile it) the Crown and glory of England is, that she hath maintained the truth of Christ, and enjoyed the light of the twelve Stars; deposited in this blessed book. Did I only say she hath maintained the truth of Christ? may I not venture to assert that she doth maintain it? If not, the next assertion must be that of the Lamentations, Chap. 5. 16, The crown is fallen from our heads, not unto us.

But I hope better things of the Kingdom, and such as accompany Reformation, though I thus speak. Doubtless the Confession of Faith, lately presented to the Honourable Houses by the Assembly of Divines (who have therein expressed the sense of many millions beside themselves) will abundantly manifest to the world, that this crown is not wholly fallen from England’s head: yet I fear there is cause enough to acknowledge, that it doth not stand so fast on as heretofore, by reason of the many Opinionists, whose main employment is to shake it.

Verily whosoever bears a loyal heart to Jesus Christ, cannot but grieve to see the jewels of that crown, which he hath provided for his Church’s head, pawned and sold, and embezzled as they are: to see not only Arminians, Libertines, and Socinians gratified in abundance of their principles; but even Mahumetans closed with by some, in what they hold concerning the authority of Scripture, and concerning the deity of Jesus Christ, and of God the Holy Ghost.

Yet notwithstanding, would we all in the strength of Christ, set our selves for time to come, to buy the truth (which none should sell) and, when truth hath been sold by others to redeem it; I doubt not but within a while that would become applicable to England, which the Prophet speaks of Zion, Isa. 62. 3. Thou shalt also be a Crown of glory in the hand of the Lord, and a royal Diadem in the hand of thy God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), pp 30-31.</span></figcaption>

<blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

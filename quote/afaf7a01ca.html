<blockquote><p>What we will antecedently, we do not will simply, but in a qualified sense; because the will is compared to things as they are in themselves: but in themselves they are in particular, hence we simply will something, according as we will it considering all particular circumstances, which is to will consequently.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d59742bc63" data-kw="">
<blockquote><p>But Damascene makes the emphasis on the mode of willing. For he distinguishes in God an antecedent will and a consequent will. And the antecedent will is the will with respect to that for which God makes man, and it is irrefragably of goods. The consequent will, however, is the will, not that which follows merits, but that which wills some things according to the foreknowledge of merits. The first, namely the antecedent, is called by the masters the conditional will or the will by which God wills, as far as it depends on Him. The second, however, namely the consequent, is called absolute. The difference, however, between this will and that is not according to a diversity of affection or mode of willing that is in God, but according to the reason of connoting and understanding. For as God is said to will the salvation of all, as far as it depends on Him and antecedently, there is connoted in all men an orderability to salvation, both on the part of the nature given and on the part of the grace offered. For God gave a nature according to which they could know Him and, once known, seek Him, and once sought, find Him, and once found, adhere to Him, and through this obtain salvation. He similarly offered grace, when he sent and offered his Son, whose price sufficed for the salvation of all. He also bestowed and showed the laws and mandates of salvation. He Himself is also present to all who inquire and is near to all who call upon Him. Therefore, to will antecedently to save man is to do what is ordered to salvation and not to be lacking to the one who wills to arrive. Whence, to will antecedently to save does not connote salvation, but orderability to salvation. To will, however, consequently or absolutely to save is to will to give salvation to him whom he foreknows will arrive at salvation through his help and grace, and it connotes the event of salvation. And thus it is not to be said that God wills all men to be saved. The masters agree more with this response, although both are good. According to this, therefore, it must be answered that God wills all men to be saved, as far as it depends on Him or by his antecedent will, but not by his absolute or consequent will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 46, Question 1, ‘Whether God wills all men to be saved by the will of his good-pleasure? [No]’</span></figcaption>

</figure><figure class="quote" id="q-b5b07bba5c" data-kw="">
<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination</cite>, (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2, p. 357</span></figcaption>

<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>

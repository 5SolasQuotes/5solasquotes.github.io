<main class="wrap"><figure class="quote" id="q-55e1ecd4fb" data-kw="">
<blockquote><p>For the reason why the law inculcates all these precepts is, that when a man has failed in fulfilling them, he may not be swollen with pride, and so exalt himself, but may in very weariness betake himself to grace. Thus the law fulfils its office as “schoolmaster,” so terrifying the man as “to lead him to Christ,” to give Him his love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Man’s Perfection in Righteousness: Addressed to Eutropius and Paulus</cite>, (415) in NPNF1, 5: 162.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b72ef7f2ea" data-kw="">
<blockquote><p>5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation.

6. Although true believers be not under the law, as a covenant of works, to be thereby justified, or condemned; yet is it of great use to them, as well as to others; in that, as a rule of life informing them of the will of God, and their duty, it directs and binds them to walk accordingly; discovering also the sinful pollutions of their nature, hearts, and lives; so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin, together with a clearer sight of the need they have of Christ, and the perfection of his obedience. It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin: and the threatenings of it serve to show what even their sins deserve; and what afflictions, in this life, they may expect for them, although freed from the curse thereof threatened in the law. The promises of it, in like manner, show them God’s approbation of obedience, and what blessings they may expect upon the performance thereof: although not as due to them by the law as a covenant of works. So as, a man’s doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law; and, not under grace.

7. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it; the Spirit of Christ subduing and enabling the will of man to do that freely, and cheerfully, which the will of God, revealed in the law, requireth to be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-confession-of-faith.html">Westminster Confession of Faith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 19.5–7.</span></figcaption>

</figure><figure class="quote" id="q-ba4b257802" data-kw="">
<blockquote><p>34 The Law is the doctrine of works: Therefore it manifesteth unto us the corruption of our nature; it terrifieth us, and prescribeth unto us the rule of well-doing.

35 The Gospel is the doctrine of faith: which pointeth at Christ our Mediator, who hath made satisfaction for our sins, and raiseth up the conscience of man.

36 The practice of the Law and the Gospel consisteth in true Repentance.

37 Whereunto there is required Contrition, to be wrought in us by the Law; and Faith, by the Gospel.

38 Faith apprehendeth the Righteousness of Christ offered in the word of the Gospel: by which man, after Contrition wrought in him by the void of the Law, is justified before God, and beginneth to be renewed by the receiving of the Holy Ghost.

39 For by faith our hearts are purified. Acts 15.9.

40 Therefore the fruits of true Repentance are good works.

41 For, Faith worketh by Love. Gal. 5.6. And Christ giveth unto us not only his righteousness, but also his Holy Spirit, which beginneth to renew our nature, and bridle in us the concupiscences of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Doctrine</cite>, trans. Ralph Winterton (Cambridge: Roger Daniel, 1640), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-5cc5f5e843" data-kw="">
<blockquote><p>It may also be said that this law is in the middle of a code, all the rest of which is acknowledged to be binding; and why not this? Were the other precepts of this code spoken by God from Sinai, amidst blackness and darkness, and tempest and terrors? So was this. Were the others written by the finger of God, on tables of stone? So was this. Were the others deposited in the ark of the testimony, in the holy of holies, under the wings of the cherubim? So was this.

No ceremonial or repealable law, given to the Jews, had these marks of honor put upon it. Did Christ say, “I came not to destroy, but to fulfil the law?” He said it as much of this as of any other precept. Did Christ’s most devoted followers keep the other commandments? So did they keep this. Luke 23: 56.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), p. 3.</span></figcaption>

</figure><figure class="quote" id="q-7536d9eabe" data-kw="">
<blockquote><p>The Ten Commandments, accordingly, were published from Sinai in the form of a covenant, or federal, transaction. The Sinai transaction was a mixed dispensation. In it, the covenant of grace was repeated and published; the covenant of works was awfully displayed in subservience thereto; and a national covenant between God and the Israelites was also made as an appendage to the covenant of grace. Accordingly, the law of the Ten Commandments was thence promulgated by the Son of God, the glorious Mediator, as a rule of life to believers in a manner suited to the covenant of grace. The same law was repeated and displayed to the Israelites in the form of the covenant of works, and it was published to them as the matter of a national covenant, or covenant of peculiarity, between God and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 46.</span></figcaption>

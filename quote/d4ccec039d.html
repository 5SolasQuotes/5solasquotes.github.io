<blockquote><p>If any, through necessity, be hindered from being present at the beginning, they ought not, when they come into the congregation, to betake themselves to their private devotions, but reverently to compose themselves to join with the assembly in that ordinance of God which is then in hand.</p></blockquote>

</figure><figure class="quote" id="q-6ed8f21cd7" data-kw="">
<blockquote><p>Come to churches and say, ‘You have these defects among you, and these things to be reformed;’ but if you will come and say, ‘Your churches and your ministers are Antichristian and come from Babylon,’ there is nothing [that] provokes more…. …and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion.</p></blockquote>

<blockquote><p>34. Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest¹ minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers² and to be fined and lie in prison on no better a cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Best may be that which can be Attained</span></figcaption>

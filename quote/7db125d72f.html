<main class="wrap"><figure class="quote" id="q-7db125d72f" data-kw="">
<blockquote><p>Not that our Lord by this intended to confirm all sentences of excommunication, or to patronize any cheat or hypocrisy in any, to gain an absolution, or restoration to the church. But only, as to the first, to assure stubborn and impenitent sinners that he would ratify what his church did, according to the rule He had given them to act by… If therefore any be cast out of any church for professing or standing to any truth of the gospel, or because he will not do what is sinful, we must not understand them bound in heaven, though they be bound on earth, nor have any such excommunications any terror in them. How forcible are right words! But these arguings, what do they reprove? The church is not by this text made infallible, nor is the holy God by it engaged to defend their errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 18, verse 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59e476181b" data-kw="">
<blockquote><p>…there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ... (Edinburgh: 1867), vol. 1, pp. 242-43</span></figcaption>

et="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b7435080a5" data-kw="">
<blockquote><p>The believer is bound to obey the rulers of the church only as long as they obey God and preach his pure and entire Word. But when they forsake the truth and rise up against God, the supreme ruler, he would be a rebel against God who would follow them. An inferior order is to be retained while the superior is unviolated; but where it is treated of the supreme power and of salvation, he would be injurious to God and to himself and his neighbor who should follow the erring and not withdraw from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, Question 23, pp. 220-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-ff2a372682" data-kw="">
<blockquote><p>For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies … Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, q. 5, ch. 5</span></figcaption>

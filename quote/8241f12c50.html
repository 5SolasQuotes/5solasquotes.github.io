<main class="wrap"><figure class="quote" id="q-8241f12c50" data-kw="">
<blockquote><p>That in things obscure and remote from our senses, if so be we read any thing in Holy Scripture, which may without endangering the faith we profess, be made to comply with different opinions, we should not rashly espouse any of them; or if we do, yet not so as to resolve not to change our judgment whatever light be offered to us afterwards, or to contend not so much for the sense of the Holy Scriptures, as our own opinion, as the true sense of the Scripture, when it is our own, whereas we ought rather to make that to be ours which is the assertion of the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in Jean Le Clerc, A Supplement to Dr. Hammond’s Paraphrase &amp; Annotations on the New Testatament… (London: Buckley, 1699)</cite>, p. 341</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>

</figure><figure class="quote" id="q-1164379e79" data-kw="">
<blockquote><p>But a most pernicious error widely prevails that Scripture has only so much weight as is conceded to it by the consent of the church. As if the eternal and inviolable truth of God depended upon the decision of men! For they mock the Holy Spirit when they ask: Who can convince us that these writings came from God?</p></blockquote>

</figure><figure class="quote" id="q-cade01efb4" data-kw="">

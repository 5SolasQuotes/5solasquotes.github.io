<main class="wrap"><figure class="quote" id="q-661fb6a393" data-kw="">
<blockquote><p>For the nation and kingdom that will not serve thee shall perish, yea, those nation shall be utterly wasted.” (Isaiah 60:12) …

If the expression does not ascribe to the Church any control over the State, it still more clearly forbids the idea that the State may exercise control over the Church. This, indeed, if it were at all permitted, would be to reverse the statement of the text, and to make out the line of duty to be, not that nations should serve the Church, but that the Church should serve the nations of the earth.

Whatever subjection the Church, both collectively and in her individual members, may give the State in civil things, she is not only free from this subjection in spiritual matters — that is, in all those things in which she is a church — in all those matters in which her being as a Church consists — but is warranted to expect and to claim the service of the State. Not only will the fulfilment of the prediction in the text “make an end of the Erastian controversy,” [George Gillespie] — the mere announcement should have prevented its rise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-lumsden.html">James Lumsden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Nations to the Church, and their Danger in Neglecting it in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47c8764617" data-kw="">
<blockquote><p>Only this I say, that to open a wide door, and to grant an unbounded liberty unto all sorts of heretics and sectaries … is inconsistent with the Solemn League and Covenant of the three kingdoms, by which we are obliged to endeavour the extirpation of Popery, Prelacy, superstition, heresy, and schism; lest we partake in other men’s sins, and thereby be in danger to receive of their plagues; so it is, in the own nature of it, an error so pernicious, so abominable, so monstrous, that it makes all learned men to stand amazed, and taken with horror, in so much that they cannot at first gather their thoughts to put pen to paper against it. I know this liberty and toleration was maintained by the Donatists of old, and by the Socinians, Arminians, and Anabaptists of late; but it has been constantly opposed by all that were sound and orthodox, both ancient and modern, who have asserted the lawful use of a coercive power against those things, whereby (though under pretence of conscience) God is openly dishonoured, souls ensared and destroyed, faith and piety subverted and overthrown; and further, the compelling of the outward man, though not to the practice of things indifferent (which compulsion I do not allow), yet to the practice of necessary duties, and the external means and ordinances, by which through the blessing of God, men’s hearts and consciences may be savingly affected and wrought upon. And I beseech you what else means Asa’s covenant: That whosoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman. And what else means Josiah’s covenant, whereof it is said, He caused all that were present in Jerusalem and Benjamin to stand to it. And what else is that in Ezra, that whosoever would not come to Jerusalem to make a covenant, and to put away strange wives, all his substance should be forfeited, and himself separated from the congregation of those that had been carried away, that is, excommunicated. And what else is that other act of Josiah in putting down the priests of the high places. And what say you to the stoning those who did entice the people to turn out of the way wherein the Lord commanded them to walk, saying, Let us go after other Gods to serve them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 132-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-5fd50f4490" data-kw="">
<blockquote><p>But how does this oath, or the act of parliament requiring ministers to take this oath, make ministers dependent on the magistrate in the exercise of their ministry, when the oath only contains the duty of a subject, and speaks nothing either of the ministry or exercise of the ministry? ‘Yea, but the act enjoining it, makes it an essential requisite to a minister of this national Church.’ Answer: There is no such metaphysical term in the act as essential, but only that ministers of this national Church shall take it. The Church is considered not simply as a Church, but as national, having national and legal privileges, which they are deprived of that refuse this oath. It does not say he shall not be a minister if he take it not, but he shall not have the countenance and protection of civil authority, he shall not enjoy his benefice, shall not have allowance form the magistrate for, and encouragement in the exercise of his ministry. He shall not enjoy the peaceable public exercise of his ministry. And what wonder that the magistrate will not countenance them as ministers who will not bind themselves to him as subjects? that he will not let them preach to his subjects if he can hinder them, who will not promise and swear when required that they will not preach treason and rebellion against him, when they should teach them subjection and obedience to Christ? that he will not let them teach others what they call their duty to God who will not do their duty to their sovereign, but separate these things which God has conjoined, ‘Fear God, honor the king’? See more of this in the Seasonable Admonition and Exhortation of the Commission of the General Assembly, anno 1698, which you have neither obeyed neither yet given a reason of your disobedience; and in a Treatise against Separation, by Mr. Alexander Shields, one of your teachers, to whom you became his enemy, because he told you the truth… …But [the magistrate] shows by this act whom he will countenance and protect in the exercise of the ministry, to whom he will give or allow the stipends and legal maintenance to encourage them in the exercise of the ministry, whom he will suffer to pass and repass, and exercise their ministry without hazard or molestation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., p. 35</span></figcaption>

<blockquote><p>19. …that all persons, professing a belief in the faith of any Protestant sect, who shall demean themselves peaceably under the government, as hereby established, shall be capable of being elected into any office of profit or trust, or being a member of either branch of the Legislature, and shall fully and freely enjoy every privilege and immunity, enjoyed by others their fellow subjects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-jersey.html">State of New Jersey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of New Jersey</cite>, 1776 (Thorpe, 5.2597-8)</span></figcaption>

<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>

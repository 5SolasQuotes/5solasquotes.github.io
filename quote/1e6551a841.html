<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhart-b-ladner.html">Gerhart B. Ladner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Concept of the Image in the Greek Fathers &amp; the Byzantine Iconoclastic Controversy’ in Dumbarton Oaks Papers, vol. 7 (1953), pp. 3-34</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd31cbe326" data-kw="">
<blockquote><p>Images of God. Since God as Spirit is in essence invisible and immense, he cannot really be expressed by any art or image. For this reason we have no fear pronouncing with Scripture that images of God are mere lies. Therefore we reject not only the idols of the Gentiles, but also the images of Christians. Images of Christ. Although Christ assumed human nature, yet he did not on that account assume it in order to provide a model for carvers and painters. He denied that he had come “to abolish the law and the prophets” (Matt. 5:17). But images are forbidden by the law and the prophets” (Deut. 4:15; Isa. 44:9). He denied that his bodily presence would be profitable for the Church, and promised that he would be near us by his Spirit forever (John 16:7). Who, therefore, would believe that a shadow or likeness of his body would contribute any benefit to the pious? (2 Cor. 5:5). Since he abides in us by his Spirit, we are therefore the temple of God (1 Cor. 3:16). But “what agreement has the temple of God with idols?” (2 Cor. 6:16). … But in fact in order to instruct men in religion and to remind them of divine things and of their salvation, the Lord commanded the preaching of the Gospel (Mark 16:15) – not to paint and to teach the laity by means of pictures. Moreover, he instituted sacraments, but nowhere did he set up images. The Scriptures of the laity. Furthermore, wherever we turn our eyes, we see the living and true creatures of God which, if they be observed, as is proper, make a much more vivid impression on the beholders than all images or vain, motionless, feeble and dead pictures made by men, of which the prophet truly said: “They have eyes, but do not see” (Ps. 115:5). Lactantius. Therefore we approved the judgment of Lactantius, and ancient writer, who says: “Undoubtedly no religion exists where there is an image.</p></blockquote>

</figure><figure class="quote" id="q-ffe939c855" data-kw="">
<blockquote><p>Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite>, Q. 105</span></figcaption>

<blockquote><p>Q. Is it unlawful to make an image of the Trinity, or of any Person in the Godhead? It is utterly unlawful, and a great dishonor to figure the incorruptible God by the shape of a base and corruptible man or bird, or other creature. Dt. 4:15-18; Rom. 1:23; Acts 17:24, 29; Isa. 40:15, 18-19; Hab. 2:8. It abuses our understandings: the party thinks there is some good in an image, else he would not make it; and that’s a lie: He lies that shows me a toad and says it is the picture of an angel; so, etc. All the pictures of Christ in the flesh, as that on Christ on the cross and resurrection are lies, false in their representations and false in the conceit of any good by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Principle[s] of Faith &amp; Good Conscience Digested into a Catechetical Form… (Oxford: Hall, 1665), ch. 30</cite>, pp. 132-33</span></figcaption>

<blockquote><p>…we must conclude that the florilegium of the Council of 815 does not advance beyond the iconoclastic theology of the earlier period… its authors made no original contributions, and merely re-used materials or repeated arguments current among the iconoclasts of 754. The most that can be said is that the iconoclasts of 815 added 12 (or 28) patristic references to the florilegium of 754, none of which, however, can be regarded as constituting an innovation or substantial addition to the iconoclastic armory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers, vol. 8 (1954), pp. 153-60</cite>, p. 159</span></figcaption>

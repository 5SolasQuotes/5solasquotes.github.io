</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82e246423c" data-kw="">
<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope, but an infallible assurance of faith, founded on the blood and righteousness of Christ revealed in the Gospel; and also upon the inward evidence of those graces of the Spirit unto which promises are made, and on the testimony of the Spirit of adoption, witnessing with our spirits that we are the children of God; and, as a fruit thereof, keeping the heart both humble and holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.2</span></figcaption>

</figure><figure class="quote" id="q-980d9f5504" data-kw="">
<blockquote><p>VIII. You will say, ‘How may I know that I am in a state of grace, since it is so important to discern this?’ Surely the apostle did not warn in vain that we should take care not to seem to have received the grace of God in vain (2 Cor 6:1). But they have received it in vain, who, seeming to have received it, either experience or show no power of it, or even fall away from that which they seemed to have received (Heb 12:15). Therefore you will know in this way that you are what you profess:

      1. If you know through faith that you are in Christ, the fount and origin of grace (Rom 5:1 – Therefore, since we have been justified by faith, we have peace with God through our Lord Jesus Christ, 8:1 – There is therefore now no condemnation for those who are in Christ Jesus).

      2. From a sense of reconciliation with God in your soul, whence also we approach the throne of grace with confidence (Rom 4:16, Luke 1:30 – you have found favor with God, Acts 7:46).

      3. From the testimony of the Holy Spirit certifying the soul of it (Rom 8:16, Eph 4:30).

      4. Finally from the holiness of life agreeing with the state of grace. For grace is a sanctifying grace, and is so incompatible with sin that the kingdom of grace and of sin cannot abide in the same seat, nor can anyone be at the same time under grace and under sin (Rom 6:14 – For sin will have no dominion over you, since you are not under law but under grace, v.22 – But now that you have been set free from sin and have become slaves of God, the fruit you get leads to sanctification). Jude v. 4 – ungodly people, who pervert the grace of our God into sensuality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, (Leiden: Johann Elsevir, 1664) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-fd92ded097" data-kw="Assurance Election Holy Spirit">
<blockquote><p>When the Holy Ghost sealeth a man up, the thing he makes known, the thing he sealeth to him is this, that he is in Christ, that he hath been elected in Christ by God the Father from everlasting, that he is one in Christ; he was one with him from everlasting, he was one with him when he hung upon the cross, he is one with him now in heaven.</p></blockquote>

</figure><figure class="quote" id="q-bc95880ead" data-kw="">
<blockquote><p>XXXVI. As the certainty of perseverance is the consolation of the laboring, not the mother of security… since it can be granted only to those walking in the path of holiness… This is properly the fruit of the soul confirmed in the Lord and of the exercised senses. Therefore those who are not as yet confirmed must press forward by degrees and perceptibly in the ways of the Lord… XXXVII… Such is the holy security of the pious, which not only does not exclude watchfulness and the desire for piety, but necessarily supposes them as the certain means of their own preservation.</p></blockquote>

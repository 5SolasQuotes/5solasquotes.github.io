<main class="wrap"><figure class="quote" id="q-1d54e976df" data-kw="against Socinian denial">
<blockquote><p>Concerning the necessity of a satisfaction, there are three principal opinions of theologians. The first of those simply denying it (as the Socinians, who not only deny that Christ made a real satisfaction, but that there was any need of it). The satisfaction here discussed is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.3–4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f83191034" data-kw="definite atonement elect">
<blockquote><p>But the common opinion of the Reformed is that Christ (from the mere good-pleasure of the Father) was appointed and given as a Redeemer and head, not to all men, but to a certain number of men. By the election of God, these compose his mystical body. For these alone, Christ (perfectly acquainted with his call) in order to fulfill the decree of election and the counsel of the Father, was willing and determined to die; also to add to the infinite price of his death a most efficacious and special intention to substitute himself in their place and to acquire faith and salvation for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.8</span></figcaption>

</figure><figure class="quote" id="q-0bc84a0fa8" data-kw="">
<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:14</span></figcaption>

</figure><figure class="quote" id="q-d22831f21d" data-kw="resurrection victory">
<blockquote><p>The miracles which followed the resurrection of Christ prove that he lives and reigns gloriously in heaven (to say nothing now of the justice of God, the glory of Christ and our salvation, which necessarily demanded it, according to the prophecies uttered concerning it). Did he rise again by his own or by another’s power? The orthodox ascribe the cause of the resurrection to Christ himself no less than to the Father.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e3b73937d5" data-kw="">
<blockquote><p>There is a twofold judgement which discerns and judges of Faith. The one absolute, whereby the most high God, whose supreme Authority alone, binds us to believe whatsoever He propounds to be believed by us, has in his written Word pronounced, declared and established what He would have us to believe concerning Himself, or his worship. The other [is] limited and subordinate: which is either public or private. That which is public, is either ordinary or extraordinary. The Ministerial or subordinate public judgement, which I call ordinary, is the judgement of every pastor or doctor, who by reason of his public vocation and office, ought by his public ministry to direct and instruct the judgments of other men in matters of Faith. Which judgement of pastors and doctors is limited and restricted to the plain warrants and testimonies of Holy Scripture (Junius, Cont. 1, bk. 3, ch. 4, note 17), they themselves being only the ambassadors of the judge, to preach and publish the sentence which He has established, so that a pastor is not properly judex [a judge] but index [an informer]. The subordinate public judgment, which is extraordinary, is the judgement of a council, assembled for the more public and effectual establishment and declaration of one or more points of faith and heads of Christian doctrine, and that in opposition to all contrary heresy, or error, which is broached and set a foot in the Church. (M. Ant. De Dom. de Rep. Eccl., bk. 7, ch. 3, n. 32) From which council, no Christian man who is learned in the Scriptures may be excluded, but ought to be admitted to utter his judgement in the same. For in the indagation [investigation] or searching out of a matter of faith, they are not the persons of men which give authority to their sayings, but the reasons and documents which every one brings for his judgment. The subordinate judgement, which I call private, is the judgment of discretion (Davenant, Of the Judge of Controversies, ch. 25; Junius, as above), whereby every Christian, for the certain information of his own mind and the satisfaction of his own conscience, may and ought to try and examine, as well the decrees of councils as the doctrines of particular pastors, and insofar to receive and believe the same as he understands them to agree with the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Edinburgh, 1637) | Pt. 3 | ch. 8, Digression 3, ‘Of the Judging of Controversies and Questions of Faith’, pp. 176-7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbecbbb5dc" data-kw="">
<blockquote><p>Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1, Edinburgh, 1868, p. 243</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

lank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-039d0d1ff8" data-kw="">
<blockquote><p>But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; and when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this [absolute, necessary, passive] submission [to erroneous Church decisions] which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny, because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, it being for matter God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: a Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do.</p></blockquote>

</figure><figure class="quote" id="q-db154a1515" data-kw="">
<blockquote><p>But, 2. All the power and authority of synods we conceive to be ministerial, not lordly, limited, regulated by the only Word of God in the Scripture, and in matters circumstantial, of order and decency, as time, place, persons… by the law of nature, rules of piety, charity, and Christian prudency, for the edification of our brethren and the glory of God; And a lawful synod we judge has power ministerial from Christ… commanding in the Lord… are to be obeyed, and the conscience submitted to them, not absolutely, not for the sole will and mere authority of the heralds, as if they were infallible, not with blind obedience, not without reclamation, or appeal, if they be either contrary or beside the scriptures, but conditionally in so far as they are agreeable to the Word of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, … (London, 1648), ‘A Brotherly and Free Epistle…’, no page numbers</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But, 2. All the power and authority of synods we conceive to be ministerial, not lordly, limited, regulated by the only Word of God in the Scripture, and in matters circumstantial, of order and decency, as time, place, persons… by the law of nature, rules of piety, charity, and Christian prudency, for the edification of our brethren and the glory of God; And a lawful synod we judge has power ministerial from Christ… commanding in the Lord… are to be obeyed, and the conscience submitted to them, not absolutely, not for the sole will and mere authority of the heralds, as if they were infallible, not with blind obedience, not without reclamation, or appeal, if they be either contrary or beside the scriptures, but conditionally in so far as they are agreeable to the Word of God…”

<blockquote><p>We acknowledge not what Navarrus and Gregory say, that excommunication, whether just or unjust, is to be feared, for the curse causlessly does not fall. The sentence is either given out: [1.] a jure, vel ab homine, by the Law, or the persons. Secondly, it is either just or unjust. Thirdly, and that three ways: exanimo, [out of] good or ill zeal; secondly, ex causa, [out of] a just or unjust cause; thirdly, ex ordine [out of order], when order of law is kept. An unjust sentence is either valid or null. That which is invalid is either invalid through defect of the good mind of the excommunicators, and this is not essential to the excommunication’s validity. That which is invalid this way only, ligat, ‘it binds’ in foro exteriore [in the external court]. But that which is unjust through want [lack] of a just cause, it only binds from external communion; but because God’s ordinances are to be measured from their own nature, and the general intention of the catholic Church, and not from abuses and particular intentions of such excommunicators: therefore they do not exclude from the general Church-desires. The fourth Council of Carthage, as also Gerson says, an unjust sentence neminem gravare debet, ‘should affright no man’…</p></blockquote>

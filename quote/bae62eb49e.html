<main class="wrap"><figure class="quote" id="q-bae62eb49e" data-kw="">
<blockquote><p>Of this intellectual treasure house [the conscience], we are to know these: 1. That in the inner cabinet, the natural habit of moral principles lodges, the register of the common notions left in us by nature, the ancient records and chronicles which were in Adam’s time, the Law of Nature of two volumes: One of the first table, that there is a God, that He creates and governs all things, that there is but one God, infinitely good, more just rewarding the evil and the good; And of the second table, as to love our parents, obey superiors, to hurt no man, the acts of humanity; All these are written in the soul, in deep letters, yet the ink is dim and old, and therefore this light is like the moon swimming through watery clouds, often under a shadow, and yet still in the firmament. Caligula, and others, under a cloud, denied there was any God, yet when the cloud was over, the light broke out of prison, and granted, a God there must be; strong winds do blow out a torch in the night, and will blow in the same light again; and that there be other seeds, though come from a far land, and not growing out of the ground, as the former, is clear, for Christ scatters some Gospel-truths in this chalmer [chamber]; as John 7:28, ‘Then cried Jesus in the Temple; as He taught, saying, Ye both know Me, and whence I am.’ John 15:24, ‘But now they have both seen, and hated both Me and my Father.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 1, ‘Of Conscience &amp; its Nature’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf33b0c2d9" data-kw="">
<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomar.html">Francis Gomar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’</cite>, (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-037b17dcd5" data-kw="">
<blockquote><p>XVII. Certain judicial laws have the character of common right, as to the substance and form of that eternal reason which is in God, or from God in nature and Scripture; but certain are of particular right, with respect to singular determinations, according to the reason of circumstances, things, and persons which are subject to them. In the former respect these laws retain their immutable part; but in the latter they are changed from time to time. … XX… Finally, the judicial law has been abolished as to form and external constitution, posited in the determination of particular circumstances, things, and facts: but not as to its substance and equity, both natural and divine. XXI. And this abrogation argues neither any defect in the laws, nor imprudence or change in their Author; but rather the most prudent counsel of the supreme and eternal Legislator, varying those things according to the convenience of persons, things, and circumstances, which were enacted for the common and particular good of the same, and abolishing what He had given only for a time (which Paul calls a time of reformation, Heb. 9:10). Indeed, with the distinction of the nation removed and the prefigured truth exhibited, those things had to be changed and cease which both distinguished the Jewish nation from others and shadowed forth the truth to come in the Messiah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’</cite>, (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology Latin</span></figcaption>

</figure><figure class="quote" id="q-194310bf0d" data-kw="">
<blockquote><p>2. Though the Law of Ceremonies, given by Moses, does not oblige Christians, (Christ, the substance of those shadows, being come, Col. 2:17) nor yet the Judicial Law, which was given to the Jewish Commonwealth, and to stand and fall with it, Num. 36:6-7, yet, the Moral Law, or the Law of the Ten Commandments, as being never yet repealed by God, does stand in force, and is binding unto Christians: for, Paul does urge this duty of obedience unto parents upon children, because the Moral Law enjoins it: ‘Honor thy father and mother, which is the first commandment with promise.’ [Eph. 6:2]</p></blockquote>

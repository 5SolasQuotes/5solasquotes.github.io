<main class="wrap"><figure class="quote" id="q-049837a5a4" data-kw="">
<blockquote><p>[T]he Gospel, guide of my pilgrim steps to a better world, sheds many precious blessings on this one. I believe it was intended to do so. This is no accident; ’tis the purpose of Him who, our pattern as well as propitiation, divided his time between the interests of this world and the next; taught us to care for men’s bodies as well as for their souls, to carry a loaf of bread as well as a Bible to the houses of the poor; and who, with the very hand that had been opening the gates of Paradise, dried the cheek of grief, bound up bleeding hearts, gave a brother to a sister’s arms, and lighted with joy the dark abodes of sorrow.

What Christ was in temporal things to a narrow circle, Christianity has been to a wide one. What country has she ever entered without a troop of earthly blessings in her train? Christianity is not all for the next world. We are too apt to forget this — ministers as well as people; and I am not the servant of Jesus I should be, unless I walk in the footsteps of Him who spent his strength and passed his time as well in blessing men’s bodies as in saving their souls. Let not the Church forget her duty to the world. Let not the world forget what she owes to the Church; nor, in persecuting religion, be the senseless infant that, ignorant of what it owes a mother, beats the kind breast it hangs on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-guthrie.html">Thomas Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Truth and Man’s Freedom: A Sermon’ in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

<blockquote><p>WE are now to speak of the Second Head, Concerning Separation from true Churches, and the true worship of God in them, because of the sins of Fellow-worshipers.

I. That which our Adversaries hold concerning this, is, That the presence of wicked men at Ordinances do defile the Ordinances to the Godly: Therefore, say they, where ever there is any corruption in a Church, or where prophane or wicked men are suffered to be in it, The Godly are bound to abstain from the Lords Table, and not to communicate with the mixed multitude; And because they hold it is not Lawful for any to live in any Church, where they cannot enjoy the whole Ordinances of God: Therefore they maintain that the Godly are bound to Separate from That Church, and to make up a Church of their Own, by gathering out so many of the Godly that are in it, as they can get, and make a little Congregation of their own, choosing any of them to be a Minister, and some one or two to be Elders, And so they set up a Church against a Church, a Church in the Bosom of a Church.

This is not a new Error, It troubled the Church of Christ long since, in the Fourth Century or something more than Three hundred years after Christ: The Donatists, a kind of Hereticks arose and troubled the Church for a long time, and did teach the same very thing; Against whom the Godly Fathers of the Church in that time did write: Yet because this Error was carried on with a shew of Holiness and Strictness more than ordinary, It took such deep rooting in the minds of some well minding People (some of them at least) that it could not be driven out by force of Argument, till the Lord did leave the maintainers of this Error to fall into other vile abominations, for all their pretence of Strictness; Which made all others to loathe them: And before it could be gotten rooted out of the minds of men, It troubled the Church almost 100. years together. The same is the Error which we have now to Refute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors toleration, Erastianism, Independency and separation delivered in some sermons from I Joh. 4. I, preached in the year 1652: to which are added four sermons preached on several occasions</cite>, (Edinburgh: George Mosman, 1692), pp 214-15.</span></figcaption>

<blockquote><p>…simply a question of law in our own church, ‘the Presbyterian Church in the United States,’ the question of whether the Assembly has the power ‘to make law for the church in the matter of ‘offences,’ or to give its deliverances in thesi the force the force of judicial decisions. It had been contended by some that the deliverances of the Assemblies of 1865, 1869, and 1877 obliged the courts of original jurisdiction to discipline for dancing, that is, to exclude every church member convicted of dancing from the privileges of the church; that these courts had no discretion; that they were not allowed to interpret the law of the church for themselves, but must accept the interpretation of the Assembly, albeit that interpretation had not been given in the investigation of a judicial case regularly brought up (that is, in hypothesi), but as an abstract and general proceeding (in thesi)… Before proceeding to vindicate the action of the Assembly [which later said that its theses were ‘only didactic, advisory and monitory’], we beg leave to remind our readers that the principle here involved is one of immense importance. It lies at the root of all the struggles between the advocates of a constitutional government and the advocates of an ‘absolutism’… the essence of the struggle has always been the same… the question has always been, whether the power of the whole is over every part, or only over the power of the part; whether the whole is simply a great wheel, of which the parts are only spokes, or whether it be a wheel of which the parts are also wheels, each having a sphere and movement of its own, yet moving in subordination to the movement of the great wheel…</p></blockquote>

— Thomas Peck, ‘The Powers of the Several Church Courts, ... (Richmond, 1896), vol. 2, pp. 331-360. Originally published in The Southern Presbyterian Review (April, 1880). Also with an introduction in ed. Hall &amp; Hall, Paradigms in Polity… (Eerdmans, 1994), pp. 585-602. | Peck:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6simply+a+question+of+law+in+our+own+church%2C+%E2%80%98the+Presbyterian+Church+in+the+United+States%2C%E2%80%99+the+question+of+whether+the+Assembly+has+the+power+%E2%80%98to+make+law+for+the+church+in+the+matter+of+%E2%80%98offences%2C%E2%80%99+or+to+give+its+deliverances+in+thesi+the+force+the+force+of+judicial+decisions.+It+had+been+contended+by+some+that+the+deliverances+of+the+Assemblies+of+1865%2C+1869%2C+and+1877+obliged+the+courts+of+original+jurisdiction+to+discipline+for+dancing%2C+that+is%2C+to+exclude+every+church+member+convicted+of+dancing+from+the+privileges+of+the+church%3B+that+these+courts+had+no+discretion%3B+that+they+were+not+allowed+to+interpret+the+law+of+the+church+for+themselves%2C+but+must+accept+the+interpretation+of+the+Assembly%2C+albeit+that+interpretation+had+not+been+given+in+the+investigation+of+a+judicial+case+regularly+brought+up+%28that+is%2C+in+hypothesi%29%2C+but+as+an+abstract+and+general+proceeding+%28in+thesi%29%E2%80%A6+Before+proceeding+to+vindicate+the+action+of+the+Assembly+%5Bwhich+later+said+that+its+theses+were+%E2%80%98only+didactic%2C+advisory+and+monitory%E2%80%99%5D%2C+we+beg+leave+to+remind+our+readers+that+the+principle+here+involved+is+one+of+immense+importance.+It+lies+at+the+root+of+all+the+struggles+between+the+advocates+of+a+constitutional+government+and+the+advocates+of+an+%E2%80%98absolutism%E2%80%99%E2%80%A6+the+essence+of+the+struggle+has+always+been+the+same%E2%80%A6+the+question+has+always+been%2C+whether+the+power+of+the+whole+is+over+every+part%2C+or+only+over+the+power+of+the+part%3B+whether+the+whole+is+simply+a+great+wheel%2C+of+which+t

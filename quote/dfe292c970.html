<main class="wrap"><figure class="quote" id="q-dfe292c970" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book… I find not myself in my understanding convinced thereby of the necessity of lawfulness of conforming unto or complying with an unjust prevailing power, further than I was before persuaded it might be lawful or necessary so to do: viz. paying taxes and submitting to some other things (in themselves not unlawful) by them imposed or required, such as I had a lawful liberty to have done in the same manner, though they had not been so command; and seem to me in the conjuncture of present circumstances prudentially necessary to preserve myself or my neighbor from the injuries of those that would be willing to make use of my non-submission to mine or his ruin. So as it be done with these cautions:

1. Without any violation either of duty to God, or of any other just obligation that lies upon me by oath, law, or otherwise.

2. Only in the case of necessity otherwise not to be avoided.

3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek:] dunamis (to the force), but not acknowledge the [Greek:] exousia (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right title, or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide presume, that the oppressed power, to whom my obedience is justly due, if he perfectly knew the present condition I am in, together with the exigence and necessity of the present case, and of all the circumstances thereof, would give his willing consent to such conformity or compliance. So that upon the whole matter and in short, I conceive I may so far submit to the impositions or comply with the persons of a prevailing usurped power, unjustly commanding things in themselves not unlawful, or make use of that power to protect me from others’ injuries, as I may submit unto, comply with, or make use of an highway thief or robber, when I am fallen into his hands and lie at his mecy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Resolution of Conscience</cite>, (by a learned divine) in Answer to a letter sent with Mr. Ascham’s book, treating how far it may be lawful to submit to an usurped power… (London: 1649), pp. 1-3 GB</span></figcaption>

<blockquote><p>But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.</p></blockquote>

<blockquote><p>§12. Question 7. May a true man promise money to a robber for the saving of his life or of a greater sum or more precious commodity? Answer: Yes, in case of necessity, when his life or estate cannot better be preserved: And so taxes may be paid to an enemy in arms, or to a plundering soldier (supposing that it do no other hurt which is greater than the good). Any man may part with a lesser good to preserve a greater: And it is no more voluntary or imputable to our wills than the casting of our goods into the sea to save the vessel and our lives.</p></blockquote>

<blockquote><p>Assertion 3. The king is more properly a sort of patron, to defend the people (and therefore has no power given either by God or man to hurt the people) and a minister, or public and honorable servant (Rom. 13:4), for he is the minister of God to thee for good.

1. He is the commonwealth’s servant objectively, because all the king’s service, as he is king, is for the good, safety, peace and salvation of the people, and in this he is a servant.

2. He is the servant of the people representatively, in that the people has impawned in his hand all their power to do royal service.</p></blockquote>

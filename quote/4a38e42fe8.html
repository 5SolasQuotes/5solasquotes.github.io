<main class="wrap"><figure class="quote" id="q-4a38e42fe8" data-kw="">
<blockquote><p>Assertion 4. Nothing keeps us from calling good works an inferior cause of the actual possession of eternal life. Thus says our Calvin Institutes, book 3, ch. 14, section 21. ‘In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 531 of ’10. Whether good works are necessary as causes of justification, and therefore also of salvation?’ in Ch. 12, ‘On the Justification of Sinners’ in Examination of Arminianism (Utrecht, 1668)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation: Negatum Est [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-f9786c0af2" data-kw="">
<blockquote><p>The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-alsted.html">Henry Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology… in Seven Parts (Hanau, Germany, 1620)</cite>, p. 496</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].”

— Henry Alsted, Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology… in Seven Parts (Hanau, Germany, 1620), p. 496">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Orthodox%3A+Good+works+do+not+precede+one+justified%2C+but+necessarily+follow+one+justified+and+precede+unto+salvation.+They+are+yet+ordinarily+necessary+by+adults+out+of+the+supposition+or+necessity%3A+1.+Of+presence%2C+as+signs+and+effects+of+true+faith.+2.+Of+divine+command.+3.+of+a+means%2C+so+far+as+they+are+the+way+of+salvation%2C+a+condition+and+cause+sine+qua+non+%5Bwithout+which+there+is+nothing%5D.%E2%80%9D%0A%0A%E2%80%94+Henry+Alsted%2C+Controversy+10%2C+%E2%80%98Whether+Good+Works+are+Necessary%3F%E2%80%99+in+%E2%80%98Of+Justification+%26+of+Good+Works+in+General%E2%80%99+in+Part+4%2C+Controversies+with+the+Papists+in+Polemical+Theology%E2%80%A6+in+Seven+Parts+%28Hanau%2C+Germany%2C+1620%29%2C+p.+496&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9786c0af2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9786c0af2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=The%20Orthodox%3A%20Good%20works%20do%20not,non%20%5Bwithout%20which%20there%20is%20nothing&amp;text=The%20Orthodox%3A%20Good%20works%20do%20not%20precede%20one&amp;text=sine%20qua%20non%20%5Bwithout%20which%20there%20is%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-71b550412f" data-kw="">
<blockquote><p>We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam.</cite>, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.”

<blockquote><p>It speaks of grace, not of wrath; of mercy, not of vengeance; of peace returning, not of peace departing. … It offers to the sinner a reversal of the sentence of death, by presenting him with the death of another in his stead.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4653bc431" data-kw="">
<blockquote><p>Scripture, however, says absolutely nothing to the effect that we either should or could make satisfaction to God for our sins in some part either by our works or by our sufferings. It does not say that when the priest in absolution looses and remits sin he should impose penalties as punishment and satisfaction for sins. It says nothing about the punishments of purgatory; it has nothing about a treasury of works of supererogation; it teaches nothing about a key, delivered solely to the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 4, p. 168</span></figcaption>

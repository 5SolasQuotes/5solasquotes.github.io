<blockquote><p>And in the first place, consider whether such things may not be done more than hath yet been done for the Reformation of known evils, things that have been mentioned, faithfully &amp; solemnly Testified against, by those Messengers of the Lord, that have from year to year spoken to us in His Name on such days as this, as Drunkenness, Unrighteousness and other Immoralities, vicious &amp; prophane Practices; and among others, that of Prophanation of the Sabbath; concerning which I shall now briefly Observe something, and that only in one branch of it, and that is persons commonly &amp; without any just cause Absenting themselves from the Public Worship of God on the Sabbath-Day (I speak not of Quakers &amp; other Sectaries, but of them that make the same Profession that we generally do) I can’t but fear that many in this Government are very guilty of this great Neglect &amp; sinful Omission of their Duty.

And it may truly be said of them that are thus guilty, that they live much in the Violation of the Fourth Commandment, which is, Remember the Sabbath-day to keep it holy; and in the Neglect of a principal means of putting visible Honour upon God, and of doing their part to maintain &amp; keep up Religion in the Places where they dwell, and are guilty of putting an open slight upon Christ, the Offers and Tenders of the Gospel, and all the glorious things contained in it, and of the much in the neglect of the great &amp; principal means of their own Salvation. All these Evils they do at once, and live in them, that commonly neglect the Public Worship of God. Surely this practice in which so many great Evils are contained, can be no little Sin.

It may well be tho’t that every Member of this Assembly will readily own, that all ought to be done that can be done, in the great duty of turning from Sin to God: Now therefore let it be seriously Considered, whither that has been done for the Reformation of this Evil?</p></blockquote>

<blockquote><p>It was at Poietiers that the evangelisation of France began in a systematic way. The school which Calvin here gathered round him comprehended persons in all conditions of life… They discoursed about Divine mysteries as they walked together on the banks of the neighboring torrent, the Clain, or as they assembled in the garden of the Basses Treilles, where… they often held their re-unions… By-and-by it was thought prudent to discontinue these meetings in the Basses Treilles, and to seek some more remote and solitary place of re-union. A deep and narrow ravine… then known as the ‘Cave of Benedict,’ but which from that day to this has borne the name of “Calvin’s grotto,” was selected as the scene of the future gatherings of the converts. It was an hour’s walk from the town… In this grotto, so far as the light of history serves, was the Lord’s Supper celebrated for the first time in France after the Protestant fashion. On an appointed day the disciples met here, and Calvin, having expounded the Word and offered prayer, handed round the bread and cup, of which all partook… The place had none of the grandeurs of cathedral, but ‘the glory of God and the Lamb’ lent it beauty. No chant of priest, ‘no swell of organ accompanied the service, but the devotion of contrite hearts, in fellowship with Christ, was ascending from that rocky chamber, and coming up before the throne in heaven.</p></blockquote>

<blockquote><p>The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 142-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>In a speech delivered at Glasgow on ‘The Dangers of Scotland’, James Begg called for a renewal of the Scottish covenants:

In conclusion, he [Begg] spoke of the duties of the young men in the matters to which he had been attending. For one thing, they were to be patriots. In fact, he would say it was high time they were considering the renewal of the Covenants of Scotland. This struggle was only beginning – the dark cloud was only appearing in the immediate distance; but he had no doubt, unless Scotland was to be given over to ruin and destruction, she would, as the struggles grew nearer, band herself together, and assert her power as of old.</p></blockquote>

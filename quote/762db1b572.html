<blockquote><p>For we ought always to be carefully on our guard that the sanctity of this mystery be not profaned, which it certainly should be if it were promiscuously administered to aliens, or if any one received it without having such sponsors as may be counted among the legitimate members of the church.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c66017b6" data-kw="">
<blockquote><p>We must carefully remember this, for there are two extremes to which men are subject. Either they will fall into superstition or they will be irreverent and pay no attention to the worship of God. There are many today who think that baptism and the Lord’s Supper are nothing, and that they could easily bypass them, as though they were angels. […] While recognising the first extreme, let us be careful on the other hand not to fall into superstition, which we are too included to do by nature. We see how those who want to be devout always go too far: some have, for instance, attached the salvation of men to baptism, and have thought that the blood of Christ was now nothing, so to speak. They say that without the water of baptism, nothing happens, and have even added charism, spittle, and all these empty rites. By their foolish fantasies, men have invented this and that in order to avoid the firm and solid determination to hold to the will of God declared to us in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Samuel: chapters 1-13</cite>, trans. D. F. Kelly (Edinburgh, 1992), pp 271-2.</span></figcaption>

<blockquote><p>With some relief, we turn to some contested exegesis. In one of his letters from Westminster Robert Baillie wrote home as follows: ‘We have ended our Directorie for baptisme. Thomas Goodwin one day was exceedinglie confounded: He has undertaken a publicke lecture against the Anabaptists: it was said, under pretence of refuting them, he betrayed our cause to them: that of the Corinthians, our chief ground for the baptisme of infants, ‘Your children are holy’, he exponed of a reall holiness, and preached down our ordinare and necessare distinction of reall and federall holiness. Being posed hereupon, he could no wayes cleare himselfe, and no man took his part.’ The Directory ended up with the statement that the children of believers ‘are Christians, and federally holy before baptism, and therefore are they baptized’. John Lightfoot was unfortunately absent from the Assembly on 16 July 1644, when the meaning and implications of 1 Corinthians 7:14 were rehearsed at length and in depth. We may judge it one of the company’s better days. The minutes are ample but not clear at every point. Goodwin kept up his end from first to last. ‘It is such a holynesse as if they dy they should be saved/whether a holynesse of election or regeneration I know not; but I thinke it is they have the holy ghost.’ Lazarus Seaman spelt out the alarm that others showed: ‘all agree that this holynesse is the ground of baptisme … except he can make out this, the baptizing of infants is gone as toutching his judgment’. Goodwin in effect denied any distinction between real and federal holiness: the holiness predicated of the children of a single Christian parent by Paul is the same as that of ‘I will be your God and you shall be my people. Therefore be holy.’ If 1 Corinthians 7:14 speaks of any other holiness, then baptism is the seal of some other holiness than the holiness of salvation. But saving holiness is what infallibly saves, commented Stephen Marshall anxiously. As Rutherford put it, ‘wher ther is reall and inherent holynesse ther must be a seeing of god, and being in the state of salvation’. But ‘the Lord hath election and reprobation amongst Infants noe lesse than those of age’.65 This emerged as the main objection to Goodwin’s interpretation, which was alleged to imply that all such infants would indubitably be saved (so Marshall) and that the decrees of election and reprobation could not stand (Rutherford). So argument ensued on the difference between an indefinite proposition and a universal proposition. Goodwin’s case rested on the former: ‘an indefinite faith founded upon an indefinite promise’. Herbert Palmer could not concur: Paul’s answer to the ‘inconvenience’ to a child from one parent’s infidelity must be ‘a universal proposition and de fide we are bound to believe it de omnibus et singulis’. To be sure, Goodwin did not entertain every notion that some divines read into his position. He denied that he was speaking of a holiness received by the child by traduction from the parent, as Richard Vines had supposed (‘and so they shall be borne regenerate and really holy’),69 but only of a holiness by way of designation. Calamy came back at Goodwin: ‘he judges of the reall holynesse of the infant by the reall holynesse of the parent’. But this is how we all proceed, rejoined Goodwin; it is the children of believers that we baptize.71 The combined learning and piety of the Westminster theologians did not resolve the exegesis of 1 Corinthians 7:14. The verse had inevitably engaged the attention of previous generations of expositors, and had found the early Fathers and the Reformers of the sixteenth century espousing a variety of theories that, if not universally comprehensive, was at least indefinite. But whereas earlier exegetes had been especially preoccupied with avoiding the attribution to the children of a holiness which they could not comfortably credit also of the unbelieving partner, the dominant concerns of the divines at Westminster led in other directions. The irony lay in their very captivity to this verse in the first instance, for at least one thing can be incontrovertibly deduced from it—that the children in question who are declared ‘holy’ had not been baptized, nor, if the parallel with the unbelieving spouse extends this far, is their imminent baptism implied. This is, I think, the only place in the New Testament where children are in view of whom we know for certain whether they have or have not been baptized. They have not—but are said to be already ‘holy’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-f-wright.html">David F. Wright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism in Historical Perspective</cite>, (Great Britain: Paternoster, 2007), pp. 252–54</span></figcaption>

orinthians+7%3A14.+The+verse+had+inevitably+engaged+the+attention+of+previous+generations+of+expositors%2C+and+had+found+the+early+Fathers+and+the+Reformers+of+the+sixteenth+century+espousing+a+variety+of+theories+that%2C+if+not+universally+comprehensive%2C+was+at+least+indefinite.+But+whereas+earlier+exegetes+had+been+especially+preoccupied+with+avoiding+the+attribution+to+the+children+of+a+holiness+which+they+could+not+comfortably+credit+also+of+the+unbelieving+partner%2C+the+dominant+concerns+of+the+divines+at+Westminster+led+in+other+directions.+The+irony+lay+in+their+very+captivity+to+this+verse+in+the+first+instance%2C+for+at+least+one+thing+can+be+incontrovertibly+deduced+from+it%E2%80%94that+the+children+in+question+who+are+declared+%E2%80%98holy%E2%80%99+had+not+been+baptized%2C+nor%2C+if+the+parallel+with+the+unbelieving+spouse+extends+this+far%2C+is+their+imminent+baptism+implied.+This+is%2C+I+think%2C+the+only+place+in+the+New+Testament+where+children+are+in+view+of+whom+we+know+for+certain+whether+they+have+or+have+not+been+baptized.+They+have+not%E2%80%94but+are+said+to+be+already+%E2%80%98holy%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+David+F.+Wright%2C+Infant+Baptism+in+Historical+Perspective%2C+%28Great+Britain%3A+Paternoster%2C+2007%29%2C+pp.+252%E2%80%9354&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c7994e476.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c7994e476.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/baptismal-regeneration#:~:text=With%20some%20relief%2C%20we%20turn%20to,are%20said%20to%20be%20already%20%E2%80%98holy&amp;text=With%20some%20relief%2C%20we%20turn%20to%20some%20contested&amp;text=have%20not%E2%80%94but%20are%20said%20to%20be%20already%20%E2%80%98holy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5cf2aa299e" data-kw="">
<blockquote><p>I see here two washings, one outward, another inward: the first in these words The laver of regeneration, the next. The renewing of the Holy Spirit. The first, is our Baptism: the next, the inward washing and renewing by the Holy Spirit, represented by this outward Baptism. As the water washeth away the filth from the body so the Holy Spirit purgeth &amp; washeth the heart from sin. I will speak but thus far shortly of Baptism.

The outward washing in Baptism is not to be looked to lightly: the pouring on of the water, is but a base sign to look to: yet it is not a bare sign of the washing of the Holy Spirit: but it is the instrument that God taketh in His hand, &amp; whereby He applieth to us the inward washing of the Holy Spirit, Col. 2. 12. Rom. 6. 4, he ascribeth our regeneration to Baptism. We by Baptism are buried with Christ, risen with Christ, and if this mean be contemned, there shall be no regeneration: if a man lightly [neglect] this Baptism, I affirm, there shall be no renewing inwardly by the Holy Spirit: and if he be not renewed, he shall never be saved: for without regeneration, no salvation.

Ye see (2. Kin. 5. 10) what was enjoined to Naaman the Syrian, when he sought cleansing, the Prophet bade him go to the Jordan, and wash him seven times: But hee thought with himself, What is this? Are not there fair Rivers at home at Damascus? Yea, he would not go till hee took better counsel: but so soon as he went, and washed himself seven times, he was cleansed. Even so it is in Baptism: if a man contemn the outward washing, hee shall never be cleansed by the Spirit.</p></blockquote>

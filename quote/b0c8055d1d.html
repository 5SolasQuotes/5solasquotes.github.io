<main class="wrap"><figure class="quote" id="q-b0c8055d1d" data-kw="">
<blockquote><p>I answer that there were in the law some precepts that were purely ceremonial, as circumcision, the immolation of the lamb, and so on. Such laws, since they were only figurative, it is no longer licit to observe, for they were a figure of something to come; hence, anyone who observes them now would be signifying that Christ is still to come. But others were purely moral, and these must be observed now. …

But others were partly ceremonial and partly moral, as the judicial precepts. These laws are no longer to be used in regard to what is ceremonial; but in regard to what is moral, they must be obeyed. Yet it is not necessary that they be observed in their proper form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 7, L. 2, 339.</span></figcaption>

<blockquote><p>…focuses on the relationship of theology and philosophy as formulated in the thought of three key Dutch Reformed theologians… All three were at the forefront of the philosophical debates that swirled in the Dutch Republic in the seventeenth and eighteenth centuries, especially instigated by the arrival of Renee Descartes (1596–1650) in the Netherlands in 1628… By studying these three theologians, Goudriaan “seeks to understand better how Dutch Reformed theology integrated and responded to philosophical views in the period from 1625 through 1750. Voetius, professor of theology at the University of Utrecht, was initially the premier defender against the Cartesian encroachment upon the Dutch Reformed Church that sought to undermine both her theology and piety. This mantle would be taken up by his successor at the university, Petrus van Mastricht. As might be expected, Goudriaan demonstrates that Voetius and Mastricht were in essential agreement with one another in their theology and polemic against Cartesianism as they engaged it from distinctly Reformed premises and commitments. Goudriaan deals successively with specific loci where the relationship between theology and philosophy was acutely tried and tested, including: reason and revelation; creation and the physical world; the providential rule of God over the world; anthropological issues of the relationship between the soul and the body; and divine and natural law. He notes that both Voetius and Mastricht had aligned themselves with the older Aristotelian philosophy against the newer Enlightenment philosophy, yet the debate was not waged over whose philosophical system was correct. This in itself would have been a losing concession, for it was precisely their aim that Reformed theology not be corrupted by alien philosophical concepts or categories that ultimately undermined Scriptural authority and teaching. Philosophy was instead viewed by them as an instrument or servant of the most basic Reformed principle, namely, the authority of Scripture as their principium cognoscendi. For them Scripture was not subordinated to philosophy, but philosophy to Scripture. This starting point alone accounted for the full-orbed nature of creation with its rich diversity, including spirits and bodies, heaven and earth, which Cartesian dualism could not account for or bring into any real, dynamic relation. Because of this common commitment to the Reformed principle of Scripture’s authority, Goudriaan observes, “the theological development from Voetius to Driessen supports the broader claim that biblical Christianity outlives the philosophical and conceptual apparatus with whose help it is explained.” To put it another way, philosophy was not the indispensable lord of theology, but its disposable handmaiden—it would, therefore, continue even when philosophies changed or failed.” – Daniel Ragusa Ariew, Roger – Descartes Among the Scholastics in History of Science &amp; Medicine Library, vol. 20 Pre (Brill, 2011) Schlebusch, J.A. – Cartesianism &amp; Reformed Scholastic Theology: A Comparative Study of the Controversy a Master’s thesis (Univ. of the Free State, South Africa, 2013) 160 pp. Includes a translation of two chapters of Christopher Wittich’s Two Dissertations in ch. 3, and of two chapters of Peter van Mastricht’s Vindication of the Truth, which reply to Wittich, in ch. 4. . . Cartesianism in Scotland in the Post-Reformation Articles Raffe, Alasdair – ‘Intellectual Change Before the Enlightenment: Scotland, the Netherlands &amp; the Reception of Cartesian Thought, 1650-1700’ The Scottish Historical Review, vol. 94; no. 238, pt. 1 (April 2015), pp. 24-47 Gellera, Giovanni ‘Descartes in Scotland &amp; Pre-Enlightenment Scottish Philosophy’ ‘The Scottish Faculties of Arts &amp; Cartesianism (1650-1700)’ History of Universities XXIX (2), pp. 166-187 ‘English Philosophers &amp; Scottish Academic Philosophy (1660–1700)’ (2017) ‘Robertson’s Philosophical Theses (1596): between Late Renaissance &amp; Early Modern Scholasticism’ eds. Alexander Broadie &amp; J.S. Reid, Philosophical Discourse in Seventeenth-Century Scotland: Key Texts (Scottish History Society) ‘The Philosophy of Robert Forbes: A Scottish Scholastic Response to Cartesianism’ Journal of Scottish Philosophy 11(2) (Sept., 2013), pp. 191-211 Abstract: “In the second half of the seventeenth century, philosophy teaching in the Scottish universities gradually moved from scholasticism to Cartesianism. Robert Forbes, regent at Marischal College and King’s College, Aberdeen, was a strenuous opponent of Descartes. The analysis of the philosophy of Forbes and of his teacher Patrick Gordon sheds light on the relationship between Scottish Reformed scholasticism and the reception of Descartes in Scotland.</p></blockquote>

ought%2C+1650-1700%E2%80%99+The+Scottish+Historical+Review%2C+vol.+94%3B+no.+238%2C+pt.+1+%28April+2015%29%2C+pp.+24-47+Gellera%2C+Giovanni+%E2%80%98Descartes+in+Scotland+%26+Pre-Enlightenment+Scottish+Philosophy%E2%80%99+%E2%80%98The+Scottish+Faculties+of+Arts+%26+Cartesianism+%281650-1700%29%E2%80%99+History+of+Universities+XXIX+%282%29%2C+pp.+166-187+%E2%80%98English+Philosophers+%26+Scottish+Academic+Philosophy+%281660%E2%80%931700%29%E2%80%99+%282017%29+%E2%80%98Robertson%E2%80%99s+Philosophical+Theses+%281596%29%3A+between+Late+Renaissance+%26+Early+Modern+Scholasticism%E2%80%99+eds.+Alexander+Broadie+%26+J.S.+Reid%2C+Philosophical+Discourse+in+Seventeenth-Century+Scotland%3A+Key+Texts+%28Scottish+History+Society%29+%E2%80%98The+Philosophy+of+Robert+Forbes%3A+A+Scottish+Scholastic+Response+to+Cartesianism%E2%80%99+Journal+of+Scottish+Philosophy+11%282%29+%28Sept.%2C+2013%29%2C+pp.+191-211+Abstract%3A+%E2%80%9CIn+the+second+half+of+the+seventeenth+century%2C+philosophy+teaching+in+the+Scottish+universities+gradually+moved+from+scholasticism+to+Cartesianism.+Robert+Forbes%2C+regent+at+Marischal+College+and+King%E2%80%99s+College%2C+Aberdeen%2C+was+a+strenuous+opponent+of+Descartes.+The+analysis+of+the+philosophy+of+Forbes+and+of+his+teacher+Patrick+Gordon+sheds+light+on+the+relationship+between+Scottish+Reformed+scholasticism+and+the+reception+of+Descartes+in+Scotland.%E2%80%9D%0A%0A%E2%80%94+Aza+Goudriaan%2C+Reformed+Orthodoxy+%26+Philosophy%2C+1625%E2%80%931750%3A+Gisbertus+Voetius%2C+Petrus+Van+Mastricht%2C+And+Anthonius+Driessen&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefb89e808a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efb89e808a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cartesianism-against-it/#:~:text=focuses%20on%20the%20relationship%20of%20theology,the%20reception%20of%20Descartes%20in%20Scotland&amp;text=focuses%20on%20the%20relationship%20of%20theol

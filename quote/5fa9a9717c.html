<blockquote><p>And lastly the Scripture speaks in a twofold manner of our conversion: [1] Sometimes the Lord attributes to us, and requires of us the whole work thereof, as if it depended altogether on our will; ‘If ye be willing and obedient, ye shall eat the good things of the land.’ (Isa. 1:19) ‘Turn ye unto Me, and I will turn unto you:’ (Zech. 1:3) ‘Make you a new heart, and a new spirit: for why will ye die, O house of Israel:’ (Eze. 18:31) ‘Repent ye and believe the Gospel’ (Mk. 1:15; Why God requires and attributes conversion to man: On Grace &amp; Free Will, ch. 6; Of Corruption &amp; Grace, ch. 3) not, as if it were [Greek] or in our power to do these things. For how can they spiritually move who are dead in sins? But the Scripture thus speaks: 1. To teach us that we neither will, nor can do anything of ourselves: but are bound to ask it of God. And 2. Because God by such exhortations, threatenings, promises and conditions does please effectually to raise up our desire and by his Spirit enables us to perform his will. Augustine says well: ‘God commands us those things which we cannot do, that we may know what we ought to ask of Him.’ And in another place: ‘O man observe from the commandment what thou shouldst have: by reproofs, what thou art deprived of by thy own default, and in prayer acknowledge whence to receive what thou desirest to have.’ [2] And again other [passages] where the Lord ascribes the whole work of our conversion unto Himself alone and commands us so to acknowledge it. As: ‘I will make you to walk in my ways, and I will take the stony heart out of your flesh, and I will give you an heart of flesh.’ (Eze. 36:26) ‘Turn thou me, and I shall be turned.’ (Jer. 31:18) ‘No man can come unto me, except the Father draw him.’ (Jn. 6:44) ‘Without Me ye can do nothing.’ (Jn. 15:6) See the like: Eph. 2:1; 1 Cor. 2:13-14; Rom. 8:7; 2 Cor. 3:5; Lk. 24:45; Acts 16:14; 11:18. All which testimonies do plainly evince that the grace of conversion is not indifferent or universal: but as our sufficient [help], so also our effectual help does wholly depend upon the general and particular pleasure and motion of God. Which difference of the Scriptures, and the cause thereof, because the Pelagians and their adherents have not observed: But ••ther abused the former places, as if they were absolutely spoken: and corrupted the latter by their equivocations about grace, calling it (as they also do to this day) a suasory, indifferent and resistible grace, limited by the will of man either to that which is good or evil: they have most falsely wrested the same, for to establish their idol of free-will. Now herewithal they must of necessity embrace all other Pelagian heresies and impieties also, as namely: 1. That faith and good works foreseen, do go before God’s predestination: and so are not from God’s predestinating of them: whereupon it will follow that predestination, being an effect of causes and conditions foreseen, is not to be called a predestination, but rather a post-destination. 2. That faith going before predestination must also be before vocation: seeing we are elected before we are called: And by this ground not God, but man should be the author of faith: contrary to that of Rom. 9:16, ‘It is not of him that willeth, or of him that runneth, but of God that sheweth mercy.’ 3. That the will either co-working, or not co-working with foregoing grace does make men to differ, which is contrary to 1 Cor. 4:7, ‘Who maketh thee to differ from another? And what hast thou that thou didst not receive?’ And so the increase of faith and grace should be given according to the merit of congruity. 4. That man’s will is not corrupted or made worse by the Fall of Adam: and so either there should be no original sin at all, or else but in name only: whereas, ‘The heart of man is deceitful above all things.’ 5. That the Law is not above man’s strength, but that he may absolutely fulfill the same: and be altogether free from sin in this life, if he would: wheras the Scriptures on the contrary teach that there is not any one just man in the earth which does good and sins not. All which errors establish merits of condignity, overthrow the grace and merits of Christ, and so consequently the truth of Christian religion, being nothing indeed, but in name only: and in a word confirms pagan divinity and philosophy. For in all these positions, the names only excepted, there is nothing but what philosophy itself teaches, both concerning the beginnings and reward of virtue: which to philosophers is faith, righteousness and works.</p></blockquote>

<blockquote><p>Now let us see how both these kinds of sorrow belong unto sound repentance. That first sorrow, which is of the law, and is conceived by reason of the punishment which follows sin, I confess it is no part of this holy change and conversion unto God, for of its own nature it does rather estrange us from God, than convert us to God; and, in very deed, it does altogether alienate the wicked from God as from a terrible judge. Notwithstanding, in repentance it has his use, for it prepares the elect by giving them sense of their misery, to that grace and mercy which is propounded in the Gospel. The latter sorrow, which is according to God, and is effected by the Gospel, is properly a part of repentance, and does effect that change of the mind and reason before specified. And, therefore, the apostle says, 2 Cor. 7:10, that the sorrow which is according to God causes repentance.</p></blockquote>

<blockquote><p>I. Free-will in lapsed nature cannot without the help of grace do a moral work, which by co-operation of the supernatural end shall be truly good and a work of virtue, so as that by the doer it be referred to God, beloved simply above all, as to the ultimate natural end. II. Man by the sole strength of nature cannot assent to all supernatural mysteries propounded and explained to him as revealed of God, or because revealed of God, so as the formal reason of his belief is divine revelation. III. Not only faith itself, but also the first beginning of faith proceeds from the help of grace, and not from the strength of nature only. IV. The free-will of man in lapsed nature cannot without the help of grace, love God above all simply, even as He is the author of Nature. V. Man in lapsed Nature, without the help of grace, cannot fulfill all the precepts even of the Law of Nature, nor overcome any great difficulty and temptation, even for any little time, which it is necessary to overcome, for the keeping of that Law. VI. There is no law, nor ever was made by God, of his giving the actual helps of preventing grace to them that do all that is in them by the sole faculty of nature: nor has Christ merited, or would have, any such law. VII. God by his helping grace flows into free-will by pre-moving it that it may co-operate; and also, truly-efficiently together with the same free-will, causes its pious operation. VIII. When God by his exciting grace strikes and touches the hearts of men, He does not expect that the will by its innate liberty begin its motion by consenting: But God by adjuvant [assisting] grace effects that it freely and infallibly consent. IX. Adjuvant grace and free-will are not partial causes of supernatural consent, as two drawing a boat, so as neither is pre-moved by the other, or makes it co-operate with it. X. Scientia media [middle knowledge] is not to be ascribed to God—But all prescience [foreknowledge] of the future co-operation of the will, even from the foresaid hypothesis, presupposes in signo rationis [in the sign of reason, or according to man’s conceptions] the free decree of God’s will, by which absolutely (or granting that hypothesis) He will in us, and with us, effect that operation if good, and permit it if evil. XI. There is on our part no cause, reason or condition assignable for which God’s supernatural providence, in comparison of this or that, has the formal reason of predestination, or retains the common reason of providence: but predestination is to be reduced into the sole free-will of God. XII. God by an absolute and efficacious decree of his will, antecedently to the prescience of the future good use of free-will, predetermined all good acts which are done in time, specially those by which the predestinate come to eternal life. XIII. The co-operation of free-will with the gifts of grace is in the predestinate an effect of predestination, and efficiently proceeds from God making us by the help of grace freely to co-operate; and consequently depends not on the sole and innate liberty of the will. XIV. We must necessarily distinguish of a twofold help of grace: one sufficient, by which man may be converted to God or work piously; the other effectual, by which God effects that he be actually converted and act piously. XV. The effectual help of preventing or pre-operating grace moves man’s free-will to act, not only by persuading, alluring, inviting or other morally attracting, even inwardly, but also efficaciously and truly effecting that the will moved and excited of God determine itself and act well. XVI. The efficacy of the help of preventing grace and the infallible connection of it with the free co-operation of the will, is totally founded and taken as from its first root, from the omnipotency of God and from the absolute and efficacious decree of his will willing that the man whom He moves be converted and work piously. Nor does this efficacy any way depend, no not as on a condition sine qua non [without which: nothing], on the future co-operation of the created will, though the free act by which man perseveres depend effectively on his will moved by God. XVII. Supposing effectual grace in free-will, it infallibly follows that free-will will consent and act piously. So that these two are incompossible: that effectual Grace be in a man and that he actually dissent. XVIII. The gift of perseverance, as such, and the efficacy of it depends not, no not as on a condition sine qua non on the co-operation of our free-will, but on the absolute decree of God effecting man’s perseverance. XIX. Effectual aid and a power of dissenting are compossible in the same subject and consist in the same will. XX. By preventing-grace-efficacious as aforesaid, the liberty of the will is not destroyed, nor the actual use of it hindered, but is wonderfully perfected and roborated [made strong].</p></blockquote>

</figure><figure class="quote" id="q-9f8dab1808" data-kw="">
<blockquote><p>Therefore, good works do not entirely lose their salutary force by any grave sin. Let it be that they are mortified for a time. Let it be that their force and efficacy of leading to life is blunted, let it be that it is intercepted, let it be that it is suspended; yet it is not taken away, not extinguished, not abolished, not to die; but with the arrival of a new act of penitence and of trust in Christ our propitiator, they are finally revived, because the interposition of the grave sin is removed, they recover their former vigor and do not cease to exercise their force of leading to life, until all who are truly penitent are crowned, redeemed with a diadem of unfading glory.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-463b55b605" data-kw="">
<blockquote><p>As it [the Jewish Church] was Jewish, it had musicians to play upon harps, psalteries, cymbals and other musical instruments in the temple, 1 Chron. 25:1, concerning which, hear Bellarmine’s confession, de bon. oper., bk. 1, ch. 17. Justin says that: ‘the use of instruments was granted to the Jews for their imperfection: and that therefore such instruments have no place in the Church. We confess indeed that the use of musical instruments agrees not alike with the perfect and with the imperfect, and that therefore they began but of late to be admitted in the Church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, ... (Edinburgh: Bryson, 1641), ch. 3, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-4843d0e5f4" data-kw="">
<blockquote><p>A second characteristic of Puritan worship was its utter simplicity and sincerity. This unostentatious and modest form of worship found its appropriate domestic setting in meeting-houses… The Puritans refused to let the pealing organ blow To the full-voiced quire below In service high and anthems clear… in favour of the pedestrian metres of the Psalms so that all could memorize them and sing them in unison… their sense of holiness in approaching God was so strong that they could do without any theatrical or adventitious aids which would make tawdry the splendour of the Creator’s covenant mercies to his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship &amp; Theology in England, from Cranmer to Baxter and Fox</cite>, 1534-1690, pp. 530-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<blockquote><p>…there are some things which, though appointed by God and of intrinsic importance, do not so belong to the essence of an ordinance that their absence renders it utterly invalid… Now in the sense indicated, instrumental music in worship is incidental, for we do not hold that its combination with vocal music renders the worship utterly void; yet we protest against its use as an unwarrantable element, and, on that account, a corruption of the worship.</p></blockquote>

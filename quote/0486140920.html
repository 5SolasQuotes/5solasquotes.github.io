<main class="wrap"><figure class="quote" id="q-0486140920" data-kw="">
<blockquote><p>M.—I think I recollect that, towards their subjects, they were to practise the indulgence of fathers to their children, to use the diligence of shepherds in promoting their interest, to behave as generals for the security of their persons, as chief-justices in displaying a pre-eminence of virtue, and as emperors in issuing salutary edicts.

B.—Can he, then, be called a father, who treats his subjects as slaves? or he a shepherd, who does not feed but slay his flock? or he a pilot, whose constant study it is to throw the goods overboard; and who, according to the nautical adage, scuttles the vessel in which he sails?

M.—By no means.

B.—What do you think of the king who governs, not for the benefit of the people, but for the gratification of his own appetites and passions, and is manifestly engaged in an insidious conspiracy against his subjects?

M.—I shall certainly deem him neither a general, an emperor, nor a supreme judge.

B.—Should you, then, observe a man usurping the name of king who excels none of the multitude in any species of virtue, and is even inferior to many, who discovers no paternal affection for his subjects, but crushes them under his proud sway; who considers them as a flock entrusted to him, not for their preservation but for his own emolument; will you reckon him truly a king, though he should stalk along, crowded by a numerous train of guards, and make an ostentatious display of a magnificent dress, and dazzle the eye by exhibiting the sword of the law, and conciliate the favour and applause of the vulgar by prizes, games, processions, mad piles of buildings, and other popular signs of grandeur? Will you, I say, deem him a king?

M.—Not at all, if I mean to be consistent; I must consider him as an outcast from human society.

B.—By what bounds do you circumscribe this human society?

M.—By the very same to which you seemed to me, in your preceding dissertation, to wish it confined to the fences of law; for I see that robbers, thieves, and adulterers, who transgress them, are punished by the public, and that their transgression of the limits prescribed by human society is thought a just cause for their punishment.

B.—What will you say of those who never would come within the pale of human society?

M.—I should consider them as enemies to God and man, and entitled to the treatment, not of men, but of wolves and other noxious animals, which, if bred by any person, are bred to the destruction of himself and of others, and, if killed, are killed to the advantage, not only of the individual, but of the public. Nay, were I empowered to enact a law, I would adopt the Roman method of treating monsters, and order such a race of men to be exposed on some desolate island, or to be sunk in the deep at a distance from the sight of land, lest they should, even when dead, injure the living by their contagion; and publish a decree, that whoever despatched them should be rewarded, not only by the whole people, but by private persons, as is generally done to those who have killed wolves or bears, or seized their cubs.

For, if any such monster were to arise, and to utter human accents, and to have the appearance of a man’s face, and his likeness in every other part, I could never think myself connected with him by any social tie. Or, if any one, divesting himself of humanity, should degenerate into savage barbarity, and refuse to unite with other men, but for men’s destruction, I do not think him entitled to the appellation of man any more than satyrs, apes, or bears, though in his look, gesture, and language, he should counterfeit man.</p></blockquote>

<blockquote><p>The Prelate [John Maxwell] objects out of Spalato, Arnisaeus and Hugo Grotius… All government and superiority in rulers is not primely and only for the subjects’ good; for some are by God and nature appointed for the mutual and inseparable good of the superior and inferior, as in the government of husband and wife, or father and son; and in herili dominio, in the government of a lord and his servant, the good and benefit of the servant is but secondary and consecutively intended, it is not the principal end, but the external and adventitious [end], as the gain that comes to a physician is not the proper and internal end of his art, but follows only from his practice of medicine.</p></blockquote>

<blockquote><p>The question of negro slavery moves ecclesiastical and civil society to their centres. The rights of man have always occupied a prominent place in the testimony of Covenanters; and as we never permitted slaveholders to enjoy the communion of the church, we could not witness the great efforts of British and American philanthropists without deep sympathy. We, as Covenanters, look with peculiar interest at this most intense movement of the public mind, in its bearings on the United States’ Constitution, and on the fourteen state constitutions south of Mason and Dixon’s line, in all of which there are imbodied pro-slavery provisions.

In this view our distinctive principles are justified, as they respect human rights, by these benevolent anti-slavery efforts. On this great topic, a Christian, especially a Reformed Presbyterian magazine should, and by the Divine aid will, speak out in a manner that cannot be misunderstood. We thank God that he has called forth so strong and increasing a host of auxiliaries in pleading the cause of human liberty. We hope and pray that Messiah will lead them all on, as he has done many, to assault the citadel of this despotism—the United States’ Constitution.</p></blockquote>

— James M. Willson, Introduction in Covenanter">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+question+of+negro+slavery+moves+ecclesiastical+and+civil+society+to+their+centres.+The+rights+of+man+have+always+occupied+a+prominent+place+in+the+testimony+of+Covenanters%3B+and+as+we+never+permitted+slaveholders+to+enjoy+the+communion+of+the+church%2C+we+could+not+witness+the+great+efforts+of+British+and+American+philanthropists+without+deep+sympathy.+We%2C+as+Covenanters%2C+look+with+peculiar+interest+at+this+most+intense+movement+of+the+public+mind%2C+in+its+bearings+on+the+United+States%E2%80%99+Constitution%2C+and+on+the+fourteen+state+constitutions+south+of+Mason+and+Dixon%E2%80%99s+line%2C+in+all+of+which+there+are+imbodied+pro-slavery+provisions.%0A%0AIn+this+view+our+distinctive+principles+are+justified%2C+as+they+respect+human+rights%2C+by+these+benevolent+anti-slavery+efforts.+On+this+great+topic%2C+a+Christian%2C+especially+a+Reformed+Presbyterian+magazine+should%2C+and+by+the+Divine+aid+will%2C+speak+out+in+a+manner+that+cannot+be+misunderstood.+We+thank+God+that+he+has+called+forth+so+strong+and+increasing+a+host+of+auxiliaries+in+pleading+the+cause+of+human+liberty.+We+hope+and+pray+that+Messiah+will+lead+them+all+on%2C+as+he+has+done+many%2C+to+assault+the+citadel+of+this+despotism%E2%80%94the+United+States%E2%80%99+Constitution.%E2%80%9D%0A%0A%E2%80%94+James+M.+Willson%2C+Introduction+in+Covenanter&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69c466e0fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69c466e0fb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/25/james-m-willson-on-the-philadelphia-covenanter-periodical-negro-slavery-and-the-rights-of-man/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>XVIII. The natural law cannot be said to have undergone a change… XIX. Nor by the introduction of slavery; while before, by the primeval law [Gen. 1], all were free. They were not otherwise free than inasmuch as they were free from criminality. When this entered [with the Fall of Adam], slavery passed upon all. For he who assails another’s liberty deservedly loses his own. Nor if the law of nature makes all men equal with regard to nature does it follow that they are equal with regard to qualities and external condition.</p></blockquote>

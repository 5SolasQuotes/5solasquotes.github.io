<main class="wrap"><figure class="quote" id="q-64968dc87b" data-kw="">
<blockquote><p>3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 652</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-1e7198fc15" data-kw="">
<blockquote><p>First of all, I hold that it is proper for the ceremonies in the church to be absolutely as few and as pure as possible. For besides the fact that we must now worship the Lord in Spirit and truth, even plain experience, that teacher of fools, ought to warn us not to imitate the example of those who–while setting no limit on their ceremonies–do not increase the worship of God, but completely undermine it. And so we determined that we should take thought how to do away with ceremonies rather than establishing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (RHB, 2016), p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church:

1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’

2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>§7. Of Bowing at the Name of Jesus It is rationally supposed that in this act, not the name, but the Person so named is made the object of adoration; the name pronounced is only the occasion of the present adoration of the Person. Nothing in reason or Scripture does evince that it is simply evil to adore Christ by incurvation of the body or other reverent gesture upon occasion of the pronouncing of the name “Jesus.</p></blockquote>

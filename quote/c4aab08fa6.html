<blockquote><p>…engages the recent critics and addresses one of their major concerns: that the doctrine of divine simplicity is not a biblical teaching. By analyzing the use of Scripture by key theologians from the early church to Karl Barth, Barrett finds that divine simplicity developed in order to respond to theological errors (e.g., Eunomianism) and to avoid misreading Scripture. Through close attention to Scripture, the work also argues that divine simplicity has two biblical roots: the names of God and the indivisible operations of the Trinity ad extra [outside of Himself]… divine simplicity can be rearticulated by following a formal analogy from the doctrine of the Trinity–the analogia diversitatis (analogy of diversity)–in which the divine attributes are identical to the divine essence but are not identical to each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jodan-p-barrett.html">Jodan P. Barrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity: a Biblical &amp; Trinitarian Account Pre</cite></span></figcaption>

<blockquote><p>God in his Word reveals Himself to be Jehovah Elohim, i.e. one God subsisting in three Persons. Though essence and subsistence, that is, the divine nature, and the Trinity of Persons in that nature, are the same thing, they being distinguished not as a Being and a Being, but as the manner of a Being or thing is distinguished from the Being or thing itself: yet for the help of our apprehension, God being pleased so far to condescend to our capacity (as delighting to be understood by us), we first consider of the essence, then of the subsistence.</p></blockquote>

<blockquote><p>This thesis offers a constructive account of the doctrine of divine simplicity in Christian theology. In its methodology, the thesis aims to present this divine perfection as an implicate of the scriptural portrayal of God, to draw upon the insights and conceptual resources of Thomas Aquinas and various Reformed orthodox theologians, and to respond to some objections to divine simplicity…. The case for God’s simplicity is made by examining God’s singularity, aseity, immutability, infinity, and act of creation in Holy Scripture and then tracing the ways in which these descriptions of God imply that he is (negatively) not composed of parts. Rather, he is (positively) actus purus and really identical with his own essence, existence, and attributes, each of which is identical with the whole being of the triune God considered under some aspect. In light of the constructive work, this study then addresses the three most pressing objections to divine simplicity: (1) that it denigrates God’s revelation of his many attributes in the economy; (2) that it eliminates God’s freedom in creating the world and acting in history; and (3) that it does not cohere with the doctrine of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity: a Dogmatic Account PhD diss</cite>, (Univ. of St. Andrews, 2014) 325 pp. Here is the pubilshed version of this dissertation: Divine Simplicity: a Dogmatic Account in T&amp;T Clark Studies in Systematic Theology, vol. 30 (Bloomsbury, 2010) 260 pp.</span></figcaption>

<blockquote><p>This thesis presents a case for the traditional doctrine of divine simplicity by construing it along the lines that God exists as actus purus. My formulation of divine simplicity draws upon the medieval insight that God is what He is in virtue of what He does in one, eternal act of will with which He is identical. In chapter I, I survey the contemporary literature on divine simplicity. In chapter II, I critique Alvin Plantinga’s Platonic theory of the divine attributes… In chapter III, I provide rejoinders to all of Plantinga’s defeaters against divine simplicity… In chapter IV, I develop a viable theory of divine simplicity, given an actus purus conception of God, and I formulate a number of arguments supporting it… As such, I seek to demonstrate that the traditional understanding of the divine essence is something that is worthy for theists to embrace and to explore…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allen-stanley-gehring.html">Allen Stanley Gehring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity as Actus Purus Ref</cite>, (Texas A &amp; M University, 2005)</span></figcaption>

<blockquote><p>Something Composite to: the Ineffectible, Efficient Cause is Simple [see p. 72 of the Summary] .

54. Every composite depends on its parts as on a material cause; for the parts are the principles of which the composite consists. Hence parts are the material principle of a composite. Simple being is that which lacks parts. Composite being, on the other hand, is that which consists of parts united with each other. There is a physical composite if the thing consists of parts really distinct. There is a metaphysical composite if the thing consists of formalities that are united in such a way with each other that they have the idea of parts, as genus and difference. Formalities that do not have the idea of parts do not impede simplicity in a being, as science [knowledge] and will in God.

55. Every composite is an effect. This point follows from conclusion 21, because a composite is something that is matter-ed (see the preceding conclusion).

56. Every composite is composed ultimately of simple elements. From conclusion 16, we cannot proceed infinitely with respect to material causes essentially ordered. Therefore we must reach some matter-ing that is not matter-ed, that is, to a material cause that is not materially caused. But this non-matter-ed material cause is nothing other than a part that is not composed in its turn of other parts, which is the conclusion proposed.

57. An independent or uncausable being, because it is not an effect, is not composite; therefore such a being is simple. This follows from conclusion 55.

58. If there is something composite, there is something simple. This follows from conclusion 56 with respect to a first being in the order of material causality. But from the existence of the composite we can also infer the existence of a first being in the order of efficient causality. For if something is composite it is also an effect (from conclusion 55), and dependent (from conclusion 28). Therefore some ineffectible efficient cause is required (from conclusions 23 to 27). But every ineffectible being is simple (from conclusion 57). . Part 3, An Infinite, Perfect Being Imperfect Composites to Pure Perfections [see pp. 73-74 of the Summary]

59. Every composite consists of act and potency. For parts have in their formal concept the idea of mutual perfectibility, and so are in potency to the whole.

60. Hence composition is a mixed perfection. This follows from the preceding conclusion and also from the fact that a composite is caused and dependent on another; for being a dependent being involves some imperfection in the dependent being. Simplicity, on the contrary, involves no such imperfection.

61. Every mixed perfection can be reduced to one or several pure perfections that exist concretely in a limited degree. The reason is that the imperfection by virtue of which some perfection is said to [be] mixed is nothing other than the lack of being-ness. Therefore in itself formally, imperfection is something negative and not positive; for it is the negation of some positive perfection. Therefore it always involves something else, namely a positive being-ness of which there is a limitation. This positive being-ness in its formal concept either includes imperfection and hence is a mixed perfection, or does not include imperfection and hence is a pure perfection. If it is a pure perfection the conclusion is gained. If it is mixed, the same question will return: Is the positive perfection in which the imperfection of this mixed perfection inheres a pure perfection or a mixed one? So either there would be an infinite regress and so there would be no perfection, or a stand would be made in some pure perfection, which is the conclusion intended. So, for example, reasoning, which is formally a mixed perfection, can be reduced to understanding, which is a pure perfection. Likewise, the extension of parts beyond parts can be reduced to simples that have a definitive presence in space, etc.

62. No pure perfection is incompatible with another pure perfection. This is plain from the definition of pure perfection; for a pure perfection or a perfection simply is that whose formal idea does not involve limitation or imperfection. Therefore of itself such a perfection cannot limit the being-ness of the subject in which it is, and so neither can it exclude from its subject other perfections simply.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>

61. Every mixed perfection can be reduced to one or several pure perfections that exist concretely in a limited degree. The reason is that the imperfection by virtue of which some perfection is said to [be] mixed is nothing other than the lack of being-ness. Therefore in itself formally, imperfection is something negative and not positive; for it is the negation of some positive perfection. Therefore it always involves something else, namely a positive being-ness of which there is a limitation. This positive being-ness in its formal concept either includes imperfection and hence is a mixed perfection, or does not include imperfection and hence is a pure perfection. If it is a pure perfection the conclusion is gained. If it is mixed, the same question will return: Is the positive perfection in which the imperfection of this mixed perfection inheres a pure perfection or a mixed one? So either there would be an infinite regress and so there would be no perfection, or a stand would be made in some pure perfection, which is the conclusion intended. So, for example, reasoning, which is formally a mixed perfection, can be reduced to understanding, which is a pure perfection. Likewise, the extension of parts beyond parts can be reduced to simples that have a definitive presence in space, etc.

62. No pure perfection is incompatible with another pure perfection. This is plain from the definition of pure perfection; for a pure perfection or a perfection simply is that whose formal idea does not involve limitation or imperfection. Therefore of itself such a perfection cannot limit the being-ness of the subject in which it is, and so neither can it exclude from its subject other perfections simply.”

ion+intended.+So%2C+for+example%2C+reasoning%2C+which+is+formally+a+mixed+perfection%2C+can+be+reduced+to+understanding%2C+which+is+a+pure+perfection.+Likewise%2C+the+extension+of+parts+beyond+parts+can+be+reduced+to+simples+that+have+a+definitive+presence+in+space%2C+etc.+62.+No+pure+perfection+is+incompatible+with+another+pure+perfection.+This+is+plain+from+the+definition+of+pure+perfection%3B+for+a+pure+perfection+or+a+perfection+simply+is+that+whose+formal+idea+does+not+involve+limitation+or+imperfection.+Therefore+of+itself+such+a+perfection+cannot+limit+the+being-ness+of+the+subject+in+which+it+is%2C+and+so+neither+can+it+exclude+from+its+subject+other+perfections+simply.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6498434d6c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6498434d6c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=Something%20Composite%20to%3A%20the%20Ineffectible%2C%20Efficient,from%20its%20subject%20other%20perfections%20simply&amp;text=Something%20Composite%20to%3A%20the%20Ineffectible%2C%20Efficient%20Cause%20is&amp;text=it%20exclude%20from%20its%20subject%20other%20perfections%20simply" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

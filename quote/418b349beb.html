<main class="wrap"><figure class="quote" id="q-418b349beb" data-kw="">
<blockquote><p>One of the most difficult questions which the seeker after souls has to meet arises out of the doctrine of Inability. “What, then, must I do to be saved?” He cannot be put off, and he ought not to be put off, with a mere “You can do nothing.” This is not the Scripture answer… Such a response [by the seeker] may doubtless be nothing more than a theoretical difficulty raised by the sinner as an excuse for not obeying the command of God. In such a case it is enough, in reply to it, to point out that at bottom it is a cavil. The command to believe is explicit. And the object of faith is most winningly presented to the mind and heart. Our obvious duty is to believe: and if we do not do so the responsibility rests upon us. That we cannot do so is the result and index of our sinfulness. Inability is a sinful condition of the will, and the sole reason why a man cannot believe is that he is so exceedingly sinful that such a one as he cannot use his will for believing. He cannot will to do it because he loves sin too much. For such a “cannot” he is certainly responsible. … 1. Something may be done toward removing the difficulty by pointing out the nature of the puzzle into which the mind has fallen. The puzzle is a logical one, and concerns doctrine, not action; and it must not be permitted to stand as an obstacle to action. Regeneration is not a fact of experience [not self-consciously experienced], but an inference from experience; and inability is not a ground of quiescence [not acting], but an inference from quiescence [not acting]. It passes away in regeneration; and no one can know that it is gone save by the change in activity. We reason back from our experience and call in the doctrine of inability to explain our actual conduct, and that of regeneration to explain the gulf between our conduct of yesterday and today. But that gulf is revealed in consciousness only by action. No man can know, then, whether he is unable save [except] by striving to act. We may point out, therefore, that the doctrine of inability does not affirm that we cannot believe, but only that we cannot believe in our own strength within us by which we may attain to belief. But this is far from asserting that on making the effort we shall find it impossible to believe. We may believe, in God’s strength…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Inability &amp; the Demand of Faith’ in Selected Shorter Writings</cite>, ed. John Meeter, vol. 2, pp. 725-26</span></figcaption>

<blockquote><p>The inability of sinful man is not… to be reckoned among those things which are absolutely impossible (adynata)… nor simplynatural (as that is natural from which we are called neither good nor bad; while this inability is certainly vicious and culpable); or as natural is contradistinguished from voluntary (as in a stone or brute there is a natural inability to speak). Our inability is in the highest degree voluntary; or as that is called natural which arises from a defect of natural faculty or power (such as the inability to see in the blind, to walk in the paralytic, to rise in the dead). Our inability does not exclude, but always supposes in man a natural power to understand and will… For although the phrase can in some measure be tolerated when understood of the natural power of willing (never taken away from us in whatever state we may be; as that by which we are distinguished from the brutes), still it cannot be admitted when we speak of the moral disposition of the will to good; not only to willing, but to willing well. Concerning this alone we dispute with our opponents…</p></blockquote>

<blockquote><p>only we may observe, that though there may such a thing be allowed to the Will, in actu primo [its first act], which the Schools call Simultas potentiae [simultaneous potentialities], by virtue where of the Will, according to its own nature, is capable of acting or not acting, or acting either thus or contrarily; and is capable of acting thus now, and is afterwards capable of revoking that act: nay indeed, this is the root of the liberty of the Will. Nevertheless, in actu secundo [the following act], or which the Schools call Potentia Simultatis [a potency for simultaneous alternatives], which is in the Wills applying itself to its act, it does not then act Indifferently, but upon choice, by which it is determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Reply to Mr. George Kieth, as quoted in Muller, Divine Will</cite>, p. 290. Willard was a New England puritan and here follows the paradigm laid out in Turretin, that an initial free deliberation and power of the soul to alternatives ought to be distinguished from when the soul chooses its choice and no longer remains indifferent towards it, but determines it and follows through upon it.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“only we may observe, that though there may such a thing be allowed to the Will, in actu primo [its first act], which the Schools call Simultas potentiae [simultaneous potentialities], by virtue where of the Will, according to its own nature, is capable of acting or not acting, or acting either thus or contrarily; and is capable of acting thus now, and is afterwards capable of revoking that act: nay indeed, this is the root of the liberty of the Will. Nevertheless, in actu secundo [the following act], or which the Schools call Potentia Simultatis [a potency for simultaneous alternatives], which is in the Wills applying itself to its act, it does not then act Indifferently, but upon choice, by which it is determined.”

— Samuel Willard, A Brief Reply to Mr. George Kieth, as quoted in Muller, Divine Will, p. 290. Willard was a New England puritan and here follows the paradigm laid out in Turretin, that an initial free deliberation and power of the soul to alternatives ought to be distinguished from when the soul chooses its choice and no longer remains indifferent towards it, but determines it and follows through upon it.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Conly+we+may+observe%2C+that+though+there+may+such+a+thing+be+allowed+to+the+Will%2C+in+actu+primo+%5Bits+first+act%5D%2C+which+the+Schools+call+Simultas+potentiae+%5Bsimultaneous+potentialities%5D%2C+by+virtue+where+of+the+Will%2C+according+to+its+own+nature%2C+is+capable+of+acting+or+not+acting%2C+or+acting+either+thus+or+contrarily%3B+and+is+capable+of+acting+thus+now%2C+and+is+afterwards+capable+of+revoking+that+act%3A+nay+indeed%2C+this+is+the+root+of+the+liberty+of+the+Will.+Nevertheless%2C+in+actu+secundo+%5Bthe+following+act%5D%2C+or+which+the+Schools+call+Potentia+Simultatis+%5Ba+potency+for+simultaneous+alternatives%5D%2C+which+is+in+the+Wills+applying+itself+to+its+act%2C+it+does+not+then+act+Indifferently%2C+but+upon+choice%2C+by+which+it+is+determined.%E2%80%9D%0A%0A%E2%80%94+Samuel+Willard%2C+A+Brief+Reply+to+Mr.+George+Kieth%2C+as+quoted+in+Muller%2C+Divine+Will%2C+p.+290.+Willard+was+a+New+England+puritan+and+here+follows+the+paradigm+laid+out+in+Turretin%2C+that+an+initial+free+deliberation+and+power+of+the+soul+to+alternatives+ought+to+be+distinguished+from+when+the+soul+chooses+its+choice+and+no+longer+remains+indifferent+towards+it%2C+but+determines+it+and+follows+through+upon+it.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32c61b6390.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32c61b6390.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=only%20we%20may%20observe%2C%20that%20though,choice%2C%20by%20which%20it%20is%20determined&amp;text=only%20we%20may%20observe%2C%20that%20though%20there%20may&amp;text=but%20upon%20choice%2C%20by%20which%20it%20is%20determined" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

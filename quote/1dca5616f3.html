<main class="wrap"><figure class="quote" id="q-1dca5616f3" data-kw="">
<blockquote><p>The seed of the Messiah stand in his relation to the Father, sons by Grace because he is the Son by Nature. His children. The full meaning, we take it, is, they are children in him; for the expressions his children and his brethren are interchangeably used — “He is not ashamed to call them brethren, saying, Behold I and the children which God hath given me.” Heb. ii. 11-13. He raises all whom the Father hath given him as near himself as possible, to the rank of sons in the family of God, with a title to the heavenly glory.

The foundation of our being children is, that Christ is God’s only-begotten Son in a sense peculiarly his own before the world was; and we find the order of the Covenant, when he said — “I ascend unto my Father and your Father, and to my God and your God,” not to our Father, for there is no such equality, but to my Father by nature, and yours by being found in me. This relationship is Christ’s of right, it is ours of grace through him — an undeserved boon; and God becomes our Father only because he is the Father of one so near and dear to us.

Christ’s Sonship is not a mere official Sonship, beginning when he took the flesh. The relationship is from everlasting, founded in nature and not arbitrary; and in like manner the love involved in it had no beginning, and can have no end. The Son dwelt in the Father’s bosom before the world was, dear to him as his own soul. Had the Sonship begun in time, as some men vainly speak, we could imbibe but little comfort; for there might be constant fear, that what had a beginning might also have an end. But when we see that the Sonship is founded in the very nature of the Godhead, and can no more change than God can change, a joy unspeakable is derived from the discovery. And is not the thought an overwhelming one, that to us it should be given to stand within this bond between the Father and the Son — to be taken up, as far as may be, into this relationship, and remembered in inseparable connection with God’s dear Son?</p></blockquote>

<blockquote><p>In the original language of the Old Testament, the word which we translate covenant is, according to some, derived from a root that signifies, to cut down, or cut off; because in ancient times, it was, in making a solemn covenant, usual for the parties contracting, to cut beasts for sacrifice in two, and to pass between the parts of them, in order to confirm their agreement. According to others, it is more properly derived from a root that signifies, to choose; and is expressive of the nature of a free compact: for, in every such compact, a choice is made of the parties between whom, of the objects about which, and of the conditions on which, the agreement is made.

Now that word is, in the Old Testament, employed by the sacred writers, to express the covenant of grace, considered as a compact, or covenant properly so called, or, as made from all eternity, between the Father, and the Son as the last Adam. In this sense, it is used especially in Psalm Ixxxix. 3, where the eternal Father saith, “I have made a covenant with my chosen One”—The same word is also used, and used most frequently, to signify the covenant of grace, considered as a testament or testamentary deed, and as manifested to sinners, in time. It is employed to express that glorious covenant, as published and offered to sinners; as accepted by the faith of elect sinners; as ratified by the sacraments; and by the internal sealing of the Holy Spirit, by which it is rendered effectual In a word, it is often used, to express the covenant in its testamentary form, as administered by the Lord Jesus Christ, to sinners of mankind.

The term in the original language of the New Testament, by which, the inspired Penmen of it, have translated the one above mentioned, from the Old; is in like manner used by them, sometimes, to express the covenant of grace, considered as a proper compact, or federal settlement, between the Father, and the Son as the Representative of his elect. In this sense, the apostle Paul uses it, in Heb. vii 22., when he says, “By so much, was Jesus made a Surety of a better covenant.” The same term is also used by the Apostle, in the same Epistle, to signify the same covenant, as turned into a testament or testamentary disposition. “And for this cause,” says he, “he is the Mediator of the new testament, that by means of death for the redemption of the transgressions that were under the first testament, they which are called, might receive the promise of eternal inheritance. For where a testament is, there must also of necessity be the death of the Testator. For a testament is of force, after men are dead: otherwise it is of no strength at all, while the Testator liveth.”

The blessings of Salvation are, in the 15th verse, styled “the eternal inheritance” because they are not given to believers, on condition of the good works which they perform; but are bequeathed to them, in a testament, ratified by the death of the blessed Testator. As the covenant, considered as administered to sinners of mankind, is of a testamentary form, in which, the Lord Jesus, who purchased all the benefits of it, and who, as the Trustee of it, has them all committed to him, actually bequeaths them to poor sinners; so it was necessary, that by his death, he should render it, as a testamentary deed, firm and irreversible.

The same word is likewise employed, by the apostle Paul, to express at once, the idea, both of a covenant properly so called, and of a testament In his epistle to the Galatians, he says, “Brethren, I speak after the manner of men: Though it be but a man’s covenant, yet if it be confirmed, no man disannulleth, or addeth thereto.” Here, the term is used in a mixed sense; to signify the covenant of grace, considered both as a covenant, and as a testament, or as a testamentary covenant. This glorious covenant, was made to assume a testamentary form, in every dispensation of it; whether as typically confirmed, by the death of typical sacrifices, or as actually ratified, by the death of Jesus Christ.

Thus then, it is manifest from the original terms, which are used in sacred Scripture, to express the covenant of grace, that this august contract is to be considered, on the one hand, as a covenant or compact properly so called, and on the other, as a testamentary disposition or deed of conveyance. In respect of Christ, it is a proper covenant; in regard to us, it is a testament: considered as made in eternity, it is a covenant, a covenant of redeeming grace; considered as administered to sinners in time, it is a testament, ratified by the death of the adorable Testator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 7-10.</span></figcaption>

<blockquote><p>It is true, that CHRIST his death is a sufficient price of ransom for the sins of the whole world: Yea of more worlds, if there were more then one, for his blood and his sufferings, whereby he redeemed us, were the blood and sufferings of him that was and is God but yet they are effectual only to those that do believe.

For if CHRIST had redeemed all men, then all should be saved. For all that are redeemed are also justified, &amp; all that are justified shall be glorified For, for whom CHRIST died, for them he hath satisfied the justice of his father, so that there is no condemnation to them, whom CHRIST hath redeemed.

For whom CHRIST died, them by his death he reconciled to God, now they, who when they were enemies were reconciled to God by the death of his Son; much more being reconciled shall be saved by his life: Neither may we think, that CHRIST would die for them, for whom he would not pray. But for the world saith he, that is for the company of the wicked and reprobates I pray not but for them whom thou hast given me out of the world.

But if the Oath of an honest man, ought to be the end of controversy, much more ought the Oath of God in this place end this controversy concerning universal redemption. For God hath sworn, that to so many as he redeemeth, he will give them to worship him in holiness and righteousness. But the greater part of mankind have never the grace to worship God in holiness and righteousness, and therefore to them the benefit of redemption doth not belong.</p></blockquote>

<blockquote><p>Doctrine of the Covenant directly Scriptural.

It may seem unnecessary to say that this is a doctrine which has express verbal warrant in Holy Scripture. We have been led to this topic in connexion with the doctrine of the Atonement; and, it may be in point, therefore, to call to mind the significant phrase, “The blood of the everlasting covenant” (Heb. xiii. 20). Surely that single Divine form of speech is sufficient to set forth an organic connexion between the Covenant of Grace and the sacrifice of Jesus. Take again the memorable promise: “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. ix. 11); and our Lord’s own affecting utterance in instituting the sacrament of the Supper: “This cup is the new covenant in my blood.”

Surely these Divine expressions are very express; and they are sufficient to show that no man discusses the doctrine of Christ’s death who severs it from the considerations presented by the Covenant of Grace. It is the “blood” that maketh “atonement;” but in this case the “blood” is the “blood of the Covenant.” Men may therefore discuss as long as they please an abstract theory of an abstract atonement; but if they give not heed to this atonement which the Covenant of Grace conditions and explains, they are not any more dealing with true theology, than men should deal with real astronomy who should speculate on central forces in the abstract and pretermit the actual law of gravitation —the law of the inverse square of the distance — which rules in the starry heavens.

It is scarcely necessary to refer to the express assertion of the covenant between the Father and the Son in the proposition: “The counsel of peace shall be between them both” (Zech. vi. 13). Our Lord is designated at once the “Mediator of the Covenant” (Heb. viii. 6.; xii. 24), and the “Surety of the Covenant” (Heb. vii. 22). Nay, He is represented as the substance of the Covenant: “I the Lord have called Thee in righteousness, and will hold thine hand, and will keep Thee, and give Thee for a covenant of the people, for a light to the Gentiles” (Isa. xlii. 6; xlix. 8).

The work of Christ is thus in express terms affirmed to be a covenant work — a work having immediate respect to a covenant. The work of the Spirit is spoken of in similar connexion with a covenant: “As for me, this is my covenant with them, saith the Lord; My Spirit that is upon thee, and my words that are in thy mouth, shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed’s seed, saith the Lord, from henceforth and for ever ” (Isa. lix. 21).

When the Lord invites lost sinners to Himself, it is in terms like these: “Incline your ear, and come unto me: hear, and your souls shall live; and I will make with you an everlasting covenant, even the sure mercies of David” (Isa. lv. 3). When, moved by such entreaties, sinners ask the way to Zion, with their faces thitherward, it is with the mutual exhortation: “Come, and let us join ourselves to the Lord in a perpetual covenant that shall not be forgotten” (Jer. i. 5). When, after entering on this blessed relation with God, they would express their full satisfaction with it in the midst of all life’s troubles and afflictions, they are wont to say: “Though my house be not so with God; yet He hath made with me an everlasting covenant, ordered in all things and sure: this is all my salvation, and all my desire” (2 Sam. xxiii. 5).

For in the midst of all troubles by which their sins are chastised and their spirit chastened, the Lord sustains their faith by the gracious declaration: “My covenant will I not break, nor alter the word that hath gone out of my mouth” (Ps. lxxxix. 34). And when grieved in the view of the “cruelty” that obtains in the “dark places of the earth,” the Church’s strongest appeal to God on their behalf is this: “Have respect unto Thy covenant” (Ps. lxxiv. 20).

These are some of the more express verbal assertions of the reality and fact of a Covenant of Grace. Intelligent piety is familiar with them as with household words; and we quote them simply to show that the federal theology is no product of mere human ingenuity — no merely artificial structure — but a Scriptural theme, the terminology of which is directly furnished by Scripture itself. It is no roundabout result of mere theologising, but one of the immediate data of Divine inspiration.</p></blockquote>

<blockquote><p>Scripture, moreover, has a, third rule for modifying the use of earthly blessings. We have already adverted to it when considering the offices of charity. For it declares that they have all been given us by the kindness of God, and appointed for our use under the condition of being regarded as trusts, of which one day we must give an account. We must, therefore, administer them as if we constantly heard the words sounding in our ears, ‘Give an account of your stewardship.&#x27;</p></blockquote>

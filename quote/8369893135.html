<main class="wrap"><figure class="quote" id="q-8369893135" data-kw="">
<blockquote><p>VII. (3) By parity, the necessity of baptism is the same as that of circumcision. Now circumcision was to be administered to infants according to the command of God. Therefore also infant baptism. The truth of the major is proved (a) because baptism is put in the place of circumcision and succeeds it in the New Testament (from Col. 2:12, where Paul discovers circumcision in baptism). (b) From the end of each—circumcision was a sacrament of initiation that they might be received into the covenant; baptism is the same. (c) From the thing signified by each, which is the internal circumcision of the heart and the grace of regeneration. (d) The grace of God is not diminished and restricted in the New Testament, but rather enlarged. If therefore the infantile age is an obstacle in baptism on account of the defect of reason, there was the same impediment in circumcision. For if the blessings of God were not even then fruitlessly offered by circumcision, why should the same not be thought of baptism? Nor is it to be said either that “the circumcision of infants was expressly commanded, but not infant baptism.” It is one thing to be contained expressly; another implicitly in a general command (as we said before). Or that “the argument does not proceed rightly because there are various differences between circumcision and baptism.” The analogy of both sacraments ought to be attended to not in all, but in the principal condition related to the confirmation of the gratuitous covenant and declared in the New Testament (to wit, that both sacraments were a sign of the covenant, a symbol of initiation and a badge of profession, by which anciently the Jews were distinguished from the Gentiles and now Christians are distinguished from unbelievers). The differences (usually adduced) are of another kind which do not touch the very essence of the sacrament and its end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 19.20.7 (p. 416–17).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-5c0ff4ccae" data-kw="">
<blockquote><p>The subject of baptism is the faithful people of God, without any distinction of nation, sex, or age. Indeed, infants of the covenanted must be baptized as equally as the infants of the covenanted were once circumcised because the promise made to Abraham and His seed, Christ having been revealed, was not diminished but enlarged through the mouth of Peter: “The promise is yours and your children’s” (Acts 2:39). In this argument St. Peter commanded each one (ἕκαστον) to be baptized (Acts 2:38). Indeed, the Israelites, who once were “near,” and the faithful from the Gentiles, who once were “far off” (Acts 2:39), are held with no distinction under the New Testament (Gal. 3:28). For the children of the faithful Gentile, notwithstanding infidelity of the other parent, are “holy” (1 Cor. 7:14). Therefore, since baptism as equally as circumcision seals that covenant for those who believe, into which their children have been received as holy, in the same right baptism is administered to these as circumcision once was to those. For Christ commanded “to make disciples and to baptize the nations,” with no distinction of age (Matt. 28:19). Therefore, those who are born in the lap of the church are fit at the age of infant to begin the institution and must be baptized as equally as their parents. Therefore, the apostles baptized whole “households” (1 Cor. 1:16). (XXII–XXVI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 24.9, trans. Casey Carmichael, Classic Reformed Theology (Reformation Heritage Books, 2019), 179.</span></figcaption>

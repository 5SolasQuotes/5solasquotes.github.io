<main class="wrap"><figure class="quote" id="q-b5c7e4cb15" data-kw="" data-pol="">
<blockquote><p>God therefore commands a strong and ardent affection, an affection not to be impeded by any portion, however minute, of concupiscence. He requires a mind so admirably arranged as not to be prompted in the slightest degree contrary to the law of love.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.8.50</figcaption>

<main class="wrap"><figure class="quote" id="q-fa54aabda8" data-kw="">
<blockquote><p>In the first place, be cautious that you do not degenerate into the spirit of a mere hearer, so as to place the chief stress of your profession upon running hither and thither after preachers. There are many who are always upon the wing; and, without a due regard to what is incumbent upon them in the shop, in the family, or in the closet, they seem to think they were sent into the world only to hear sermons, and to hear as many in a day as they possibly can. Such persons may be fitly compared to Pharaoh’s lean kine; they devour a great deal; but, for want of a proper digestion, they do not flourish: their souls are lean; they have little solid comfort; and their profession abounds more in leaves than in fruit.

If the twelve Apostles were again upon earth, and you could hear them all every week; yet, if you were not attentive to the duties of the closet; if you did not allow yourself time for reading, meditation, and prayer; and if you did not likewise conscientiously attend to the concernments of your particular calling, and the discharge of your duties in relative life; I should be more ready to blame your indiscretion, than to admire your zeal.

Every thing is beautiful in its season; and if one duty frequently jostles out another, it is a sign either of a weak judgment, or of a wrong turn of mind. No public ordinances can make amends for the neglect of secret prayer; nor will the most diligent attendance upon them justify us in the neglect of those duties, which, by the command and appointment of God, we owe to society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter XIII, Forty-One Letters on Religious Subjects</cite></span></figcaption>

<blockquote><p>Here by “schoolmaster” understand one that teaches little children or [minors] the first rudiments or elements, A, B, C. And the law is “a schoolmaster to Christ,” for two causes. One, because it points out and shadows forth unto us Christ by bodily rudiments of ceremonies and sacrifices. The second is because the law, specially the moral law, urges and compels men to go to Christ. For it shows us our sins, and that without remedy. It shows us the damnation that is due unto us. And by this means, it makes us despair of salvation in respect of ourselves. And thus it enforces us to seek for help out of ourselves in Christ. The law is then our schoolmaster not by the plain teaching, but by stripes and correction. In this verse, Paul sets down the manner and way of our salvation, which is on this manner: first, the law prepares us by humbling us; then comes the gospel, and it stirs up faith. And faith wrought in the heart apprehends Christ for justification, sanctification, and glorification. Paul sets this forth by a fit similitude. They that would be the servants and children of God must come into the school of God and be taught of Him. In this school are two forms and two masters. In the first form, the teacher and master is the law. And he teaches men to know their sin and their deserved damnation, and he causes us to despair of our salvation in respect of ourselves. And when men have been well schooled by the law and are brought to acknowledge their sins and that they are slaves of sin and Satan, then must they be taken up to a higher form and be taught by another schoolmaster, which is faith or the gospel. The lesson of the gospel is that men after they are humbled must fly to the throne of grace, believe in Christ, and with all their hearts turn unto God that they may be justified and glorified. When we have by the teaching of this second master learned this good lesson, we are become children and servants of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 204–05.</span></figcaption>

</figure><figure class="quote" id="q-1eea581c23" data-kw="">
<blockquote><p>…there are some things which, though appointed by God and of intrinsic importance, do not so belong to the essence of an ordinance that their absence renders it utterly invalid… Now in the sense indicated, instrumental music in worship is incidental, for we do not hold that its combination with vocal music renders the worship utterly void; yet we protest against its use as an unwarrantable element, and, on that account, a corruption of the worship.</p></blockquote>

<blockquote><p>[A] superfluous will worship, of which there is too palpable an example and practice in this kingdom at this time, in the observation of days. No church or kingdom on earth has greater reason to take heed to it, than the Church and Kingdom of England. Because the house and service of God has been pestered, beside a multitude of superstitious observations and ceremonies, with a greater number of days, than the Church of the Jews had in the time of their ceremonial worship.

Because the Christian Sabbath or Lord’s Day has been profaned, and what has been added to other days has been added with derogation to the Lord’s Day. They have forsaken the fountain of living waters, and digged unto themselves cisterns which hold no water. Because God has called this land to mourning and fasting, as we profess this day, and I pray God that the unseasonable keeping of this festivity, which God has not commanded, be not more prevalent for evil, than the humiliation of this day for good.</p></blockquote>

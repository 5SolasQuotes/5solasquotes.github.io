<main class="wrap"><figure class="quote" id="q-81a0bda88a" data-kw="">
<blockquote><p>Let not those teeth that eat the bread of angels, grind the face of the poor; let not the mouth which doth drink the blood of Christ, thirst after the blood of his neighbour; let not that hand which is reached out to receive Christ in the sacrament, be stretched out to injure him in his members; let not those eyes which look on Christ, be gazing after vanity; certainly, if he will not be one in the same body with a harlot”, neither will he be seen with the same eyes. He is really in the heaven of the greater world; and he will be nowhere else sacramentally, but in the heavenly parts of man, the lesser.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-783fa29df7" data-kw="">
<blockquote><p>THE OBSERVANCE OF THE SUPPER WITH BOTH BREAD AND WINE. We think that rite, manner, or form of the Supper to be the most simple and excellent which comes nearest to the first institution of the Lord and to the apostles’ doctrine. It consists in proclaiming the Word of God, in godly prayers, in the action of the Lord himself, and its repetition, in the eating of the Lord’s body and drinking of this blood; in a fitting remembrance of the Lord’s death, and a faithful thanksgiving; and in a holy fellowship in the union of the body of the Church. We therefore disapprove of those who have taken from the faithful one species of the sacrament, namely, the Lord’s cup. For these seriously offend against the institution of the Lord who says: “Drink ye all of this”; which he did not so expressly say of the bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-0e203154b2" data-kw="">
<blockquote><p>The substance of the body and blood of Christ, is not in the bread and wine of the sacrament; his exalted body is no more to be broken and sliced in pieces; nor doth it consist with his state of glory, to have his substantial body shrouded under such mean elements. But the bread and wine are memorials and pledges of his body and blood, instituted by him as signs to signify him; therefore he that receives them without a due respect to Christ, and handles them unworthily, despising those things which are signified by them, is a contemner of the Son of God, since he hath no value for that which is a mark of his authority and his love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Unworthy Receiving of the Lord’s Supper</cite>, (c. 1682) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), iv, 475.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-6225698499" data-kw="">
<blockquote><p>Regarding ministers, if one today comes to believe it is most proper, apart from necessity, to sit at a table for the Supper, or to do it with a common cup, and that’s not going to happen in the next few weeks or several months, must a minister abstain from dispensing an impure Supper (with the attendant consequences) or resign his charge to his congregation and go elsewhere? Do you have a framework in which to deal with this, while maintaining a clear and undoubting conscience? If Church officers cannot ever comply with things not fully right, regarding worship or otherwise, then officers can never remain in the Church while seeking her reform. Most all the reformers were against Gillespie’s principle as they continued in the Church (maintaining her unity) while performing practices they did not believe were fully right, while seeking to reform them to the Word, which largely occurred. That was a great good, only able to be attained through that means and our principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

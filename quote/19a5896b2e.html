</figure><figure class="quote" id="q-9093877d1c" data-kw="">
<blockquote><p>There is a twofold opinion concerning the reformation of Churches: some hold that nothing at all should be added to apostolical simplicity, and by consequence are of mind that whatsoever the apostles did, they think they are to do it, but whatsoever the Church after the apostles did add to the first rites, they think them fit even all at once to be abolished. There are others on the other side which hold that certain ancient rites (besides the apostolical ordinances) are to be retained, partly as profitable and necessary: partly also albeit not necessary, yet to be tolerated for concord sake’s. For mine own part I doubt not but the apostolical doctrine to be most absolutely perfect without all exception, to the which it is not lawful to add or to detract any thing; howbeit, touching ceremonies my judgement is otherwise. For first, it is certain that even the apostles themselves could not determinately set down what they judged to be expedient for the Churches in their first beginning: and therefore necessarily they proceeded by little and little, as the institution of deacons does make evident, inasmuch as they suffered for a season many Jewish ceremonies, as appears in the story of their Acts: again, to whom can it be doubtful that the apostles had exceeding regard unto their times, places and persons in external rites. Inasmuch as it is not profitable that the same rites were observed everywhere, as appears in that excellent epistle of Irenaeus to Victor. Besides, necessity itself abolished certain of their ordinances, as their common feasts of love. Wherefore whatsoever was performed by the apostles in rites and ceremonies, I do not judge that presently, neither yet without some exception, to be followed as a rule. And indeed I wonder not that those ancient fathers, having respect unto their own times, did take away some things, some things add and somewhat alter. Only herein (with their good leave be it spoken) they seem to me to have often failed, that they neither held any measure in their rites, neither had that due regard to Christian simplicity and purity as was meet.</p></blockquote>

</figure><figure class="quote" id="q-5510b393e4" data-kw="">
<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/shola-lee.html">Shola Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”You’re sold a lie’: How do you spot a cult’</cite>, (2025) at BBC.com</span></figcaption>

<blockquote><p>Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.”

— William Perkins, A Reformed Catholic... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCivil+worship+is+the+honor+done+to+men+set+above+us+by+God+Himself%2C+either+in+respect+of+their+excellent+gifts%2C+or+in+respect+of+their+offices+and+authority+whereby+they+govern+others.+The+right+end+of+this+worship+is+to+testify+and+declare+that+we+reverence+the+gifts+of+God%2C+and+that+power+which+He+has+placed+in+those+that+be+his+instruments.+And+this+kind+of+worship+is+commanded+only+in+the+Second+Table+and+in+the+First+Commandment+thereof%2C+%E2%80%98Honor+thy+father+and+mother.%E2%80%99+Upon+this+distinction+we+may+judge+what+honor+is+due+to+everyone.+Honor+is+to+be+given+to+God%2C+and+to+whom+He+commands.+He+commands+that+inferiors+should+honor+or+worship+their+betters%E2%80%A6+Good+angels%2C+because+they+excel+men+both+in+nature+and+gifts%2C+when+they+appeared+were+lawfully+honored%3A+yet+so%2C+as+when+the+least+signification+of+honor+was+given+that+was+proper+to+God%2C+they+refused+it.+And+because+they+appear+not+now+as+in+former+times%2C+not+so+much+as+civil+adoration+in+any+bodily+gesture+is+to+be+done+unto+them.+Lastly%2C+governors+and+magistrates+have+civil+adoration+as+their+due%3A+and+it+cannot+be+omitted+without+offense.+Thus+Abraham+worshipped+the+Hittites%2C+Gen.+23%2C+and+Joseph+his+brethren%2C+Gen.+50.+To+come+to+the+very+point%3A+upon+the+former+distinction%2C+we+deny+against+the+Papists+that+any+civil+worship+in+the+bending+of+the+knee+or+prostrating+of+the+body+is+to+be+given+to+the+saints%2C+they+being+absent+from+us%3B+much+less+any+religious+worship%2C+as+namely+invocation+signified+by+any+bodily+adoration.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic...+%28Cambridge%2C+Legat%2C+1598%29%2C+14th+Point%2C+%E2%80%98Worshipping+of+Saints%E2%80%99%2C+%E2%80%98The+Dissent%E2%80%99%2C+pp.+248-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33a10a09f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33a10a09f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=Civil%20worship%20is%20the%20honor%20done,invocation%20signified%20by%20any%20bodily%20adoration&amp;text=Civil%20worship%20is%20the%20honor%20done%20to%20men&amp;text=as%20namely%20invocation%20signified%20by%20any%20bodily%20adoration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

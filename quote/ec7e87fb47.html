<main class="wrap"><figure class="quote" id="q-ec7e87fb47" data-kw="">
<blockquote><p>Let us not use things and rites in divine worship which are not prescribed, or not necessary by the law of nature, or even which do not have a particular use in worship, which were monuments of past idolatry, and had an enormous abuse, because God commanded to abolish monuments of this sort, Ex. 39:13; Num. 25:3, 33:52-53; Dt. 7:5; Is. 30:22; 1 Cor. 10:20; Rev. 2:14, 20…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus theologiae, 14.1.57 trans. Charles Johnson</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99848ae32d" data-kw="">
<blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.”

— John Calvin, Institutes of the Christian Religion, 2.8.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+phrase+that+follows%2C+%E2%80%9Cbefore+my+face%2C%E2%80%9D+makes+the+offense+more+heinous+because+God+is+provoked+to+jealousy+as+often+as+we+substitute+our+own+inventions+in+place+of+him.+This+is+like+a+shameless+woman+who+brings+in+an+adulterer+before+her+husband%E2%80%99s+very+eyes+only+to+vex+his+mind+the+more.%E2%80%A6+Therefore%2C+when+God+by+his+present+power+and+grace+testified+that+he+kept+watch+over+the+people+whom+he+had+chosen%2C+he+warned+them%E2%80%94to+keep+them+even+more+from+the+crime+of+rebellion%E2%80%94that+they+could+introduce+no+new+gods+without+his+witnessing+and+observing+their+sacrilege.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.8.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F99848ae32d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99848ae32d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ebe86ae8b9" data-kw="">
<blockquote><p>That making of pictures of creatures, which are visible or may be comprehended, or historical fancies (to speak so) such as the senses and elements use to be holden forth by (which are rather hieroglyphics than real pictures) these I say, are not simply unlawful, but are so when they are abused (so Solomon made images of lions for his use, and thus the gift of engraving and painting as well as others which God has given to men, may be made use of, when (as has been said) it is not abused)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments… (London, 1675), 1st Commandment</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“That making of pictures of creatures, which are visible or may be comprehended, or historical fancies (to speak so) such as the senses and elements use to be holden forth by (which are rather hieroglyphics than real pictures) these I say, are not simply unlawful, but are so when they are abused (so Solomon made images of lions for his use, and thus the gift of engraving and painting as well as others which God has given to men, may be made use of, when (as has been said) it is not abused)…”

— James Durham, An Exposition of the Ten Commandments… (London, 1675), 1st Commandment, p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+making+of+pictures+of+creatures%2C+which+are+visible+or+may+be+comprehended%2C+or+historical+fancies+%28to+speak+so%29+such+as+the+senses+and+elements+use+to+be+holden+forth+by+%28which+are+rather+hieroglyphics+than+real+pictures%29+these+I+say%2C+are+not+simply+unlawful%2C+but+are+so+when+they+are+abused+%28so+Solomon+made+images+of+lions+for+his+use%2C+and+thus+the+gift+of+engraving+and+painting+as+well+as+others+which+God+has+given+to+men%2C+may+be+made+use+of%2C+when+%28as+has+been+said%29+it+is+not+abused%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+An+Exposition+of+the+Ten+Commandments%E2%80%A6+%28London%2C+1675%29%2C+1st+Commandment%2C+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Febe86ae8b9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ebe86ae8b9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/religious-images-in-worship/#:~:text=That%20making%20of%20pictures%20of%20creatures,been%20said%29%20it%20is%20not%20abused&amp;text=That%20making%20of%20pictures%20of%20creatures%2C%20which%20are&amp;text=as%20has%20been%20said%29%20it%20is%20not%20abused" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6618d7e760" data-kw="">
<blockquote><p>1. The form of worship forbidden in the word of God is idolatry and the adoration of saints. 2. Idolatry is the making, maintaining and religious worshipping of an idol. … 3. An idol is an image of likeness [simulacrum] made for the purposes of religious worship. Propositions I. An idol differs from an image and likeness as species from genus… So not every likeness [simulacrum] is an idol; in fact, Tertullian calls man the simulacrum of God. … III. To make an idol is to make an image or likeness for purposes of religious worship. IV. Therefore, not all making of images and likenesses is idolatry; they may be made for memorials, for enjoyment and other secular [politicus] purposes. V. The cherubim, the bronze serpent, and other objects made by God’s order were not made for purposes of religious worship, but as types of Christ. Therefore, the papists wrongly seek to defend their idols on this pretext. For (1) God ordered the making of these objects, but forbids idols; (2) no religious worship was given them, so that when the bronze serpent began to be worshipped, it was destroyed (2 Kings 18:4); to idols the religious worship is given; (3) since all types are done away since the coming of Christ, such objects have no place in the New Testament. Saints are true idols [images of God]. VI. The images that the papists make of Christ, the angels, Mary and the saints [are forbidden]. The reason is tht they are made for purposes of religious worship. The papists deny that they are idols because… (4) the saints lived in genuine human form, and (5) the images are books for the laity. Response: …(4) As to the fourth, it follows from this only that images of the saints can be made, that is, if it is not done for purposes of religious worship. (5) As for the fifth argument, its premise is false; what kind of books the idols [note Wolleb does not say “images”] are is evident from Jeremiah 10:14-15 and Habakkuk 2:18-19, where they are called teachers of lies and vanity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity (1626), bk. 2, ‘The Service of God’, 2nd Commandment in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965)</cite>, pp. 208-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-216a1ae61b" data-kw="">
<blockquote><p>Therefore the aforesaid names signify the divine substance, but in an imperfect manner, even as creatures represent it imperfectly. So when we say, God is good, the meaning is not, God is the cause of goodness, or God is not evil; but the meaning is, Whatever good we attribute to creatures, pre-exists in God, and in a more excellent and higher way. Hence it does not follow that God is good, because He causes goodness; but rather, on the contrary, He causes goodness in things because He is good; according to what Augustine says (De Doctr. Christ. i, 32), Because He is good, we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 13 | art. 2, I answer that</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc79a50ce6" data-kw="">
<blockquote><p>Creation is the production of something from nothing both as to itself and as to its subject. It differs from formation, which is production from nothing as to itself but not as to its subject. Conclusion 23: The first external production of God must be creation. This conclusion is against the philosophers who reckoned that God was only the former of the world but not its creator. The conclusion is proved from the fact that all beings outside God are effects. Therefore if you say the matter from which God made things was present beforehand I ask: what about the matter? It cannot exist from itself because it lacks the properties of a being from-itself (from conclusion 2 of this part 3); therefore from another, and therefore ultimately from God (from corollary 1 of conclusion 3 of this part).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, pp. 103-4</span></figcaption>

<blockquote><p>I. What is Creation, the second special work of God (as you affirmed) that we are to inform ourselves of out of the Scriptures? B. It is a most powerful work of God the Father, the Son, and the Holy Ghost, by which in the beginning, in the space of six days, by his Word only, out of nothing, He made the heavens and the earth, with all things in them visible and invisible; to the praise of his infinite power, wisdom and goodness.</p></blockquote>

<blockquote><p>the Schoolmen manage it as an insuperable difficulty: Whether God could have made the world, or any thing better than it is? If you will pardon me for making that easy which they make ineffable, I answer: Goodness is primitive (that is, God) or derivative, which only is in creatures. This last is formally good, as it is related as conformed to God’s will, the Prime Good, as its rule: To be a Deo volitum [having been willed by God], is the formal notion of created good. And so the world is perfect, and can be no better, because it is as God wills it: and yet God can make particular creatures better to themselves, and to one another; He can make any man more wise, more holy, etc. But bonum sibi [good with respect to Him] is no further properly bonum, than it is volitum a Deo: Therefore God can make the world far otherwise than it is; and yet then it would be no better. For still it would be but as God willed it to be: So that the matter and private goodness might alter; but the true form of goodness would be still just the same as now.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), sect. 1, ‘Of our Knowledge of God as here Attainable’</cite>, p. 2, margin note</span></figcaption>

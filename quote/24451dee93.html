<main class="wrap"><figure class="quote" id="q-24451dee93" data-kw="">
<blockquote><p>…Christ Himself is not by us worshipped under any other formal reason but as He is God…

1. Jesus Christ, the Mediator, being theanthropos, God and man… is to be worshipped with divine religious worship, even as the Father….

2. That our religious, divine and spiritual worship, has a double or two-fold respect unto Jesus Christ: (1) As He is the ultimate formal object of our worship, being God, to be blessed for evermore… (2) As the way, means and cause of all the good we receive from God in our religious approach to Him….

3. That Jesus Christ our Mediator, theanthropos, God and man, who is to be worshipped with divine or religious worship, is to be so worshipped because He is our Mediator. That is, his mediation is the ratio quia, an unconquerable reason and argument, why we ought to love Him, fear Him, believe in Him, call upon Him, and worship Him in general…

4. Though Jesus Christ, who is our Mediator, God and man, is to be worshipped with divine worship, even as we honor the Father, yet this is not as He is mediator, but as He is God, blessed for evermore… That is, his mediatory office is not the formal cause and reason of yielding divine worship to Him, nor under that consideration is that worship ultimately terminated in Him… Now the formal cause or reason of all divine worship is the deity or divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 19, ‘Of Christ’s Kingly Office’, pp. 373-96 in The Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12 See especially bottom of p. 385 ff., pp. 385-389</span></figcaption>

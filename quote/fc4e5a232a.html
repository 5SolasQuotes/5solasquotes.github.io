<main class="wrap"><figure class="quote" id="q-fc4e5a232a" data-kw="">
<blockquote><p>For man knows God naturally in the same way as he desires him naturally. Now man desires him naturally insofar as he naturally desires happiness, which is a likeness of the divine goodness. Hence it does not follow that God considered in Himself is naturally known to man, but that his likeness is. Therefore, man must come by reasoning to know God in the likenesses to Him which he discovers in God’s effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.8.1</span></figcaption>

<blockquote><p>And so Christ sanctified both these types of theology [the humble type and exalted type] in His own person, since He both experienced the humble theology in the humiliation of the flesh, and now enjoys the exalted type in that very exaltation by which He now has been exalted above every name…</p></blockquote>

</figure><figure class="quote" id="q-088949c4d2" data-kw="">
<blockquote><p>If it be man’s chief end to glorify God and enjoy Him for ever, then man has attained his end, the sole purpose for which he was made, the entire object for which he exists, when he enters into communion with God, abides in His presence, streaming out to Him in all the emotions, I do not say appropriate to a creature in the presence of his Maker and Lord, apprehended by him as the Good Lord and Righteous Ruler of the souls of men, but appropriate to the sinner who has been redeemed by the blood of God’s own Son and is inhabited by His Spirit and apprehends his Maker as also his Saviour, his Governor as also his Lover, and knows the supreme joy of him that was lost and is found, was dead and is alive again,—and all, through the glory of God’s seeking and saving love. He who attains to this experience has attained all that is to be attained. He is absorbed in the beatific vision. He that sees God shall be like Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith &amp; Life: ‘Conferences’ in the Oratory of Princeton Seminary</cite>, (1916), “Prayer as a Practice”, p. 439</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

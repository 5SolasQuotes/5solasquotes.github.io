<main class="wrap"><figure class="quote" id="q-87ae96c457" data-kw="lots contingency">
<blockquote><p>As all things are foreseen by an infallible foreknowledge (Acts 15:18; Heb. 4:13), so they must necessarily happen infallibly. They are certainly predicted as future so that the word of God cannot fail. Therefore they must happen necessarily, if not as to the mode of production (which is often contingent), still as to the certainty of the event—even of lots (Prov. 16:33), of the sparrows and the hairs of our heads (Mt. 10:29, 30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/fate-fortune-and-chance.html">Fate, Fortune and Chance</a> › <a href="../topics/providence/fate-fortune-and-chance/lots.html">Lots</a></span><span class="t"><a href="../topics/providence/fate-fortune-and-chance.html">Fate, Fortune and Chance</a> › <a href="../topics/providence/fate-fortune-and-chance/contingency.html">Contingency</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7be12b839e" data-kw="Author of sin Justice">
<blockquote><p>We teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, ch. 2, title 5 (On the Will of God)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“We teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.”

</figure><figure class="quote" id="q-f87d7ae16e" data-kw="Permission Author of sin">
<blockquote><p>As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/permission-of-sin.html">Permission of sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, on providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+pravity+or+sin+that+is+in+actions%2C+as+God+decreed+the+futurition+of+sin%2C+or+permitted+it+to+take+place%2C+and+did+not+hinder+it%3B+so+all+the+sin+or+vitiosity+that+is+in+actions+proceeds+entirely+from+the+creature%2C+and+the+evil+lusts+and+passions+that+are+in+his+heart.+Thus+a+man%27s+taking+up+a+stone%2C+and+throwing+it%2C+is+a+natural+action%2C+which+the+providence+of+God+enables+him+to+perform%3B+but+his+throwing+it+at+another+man+with+an+intention+to+kill+him%2C+is+permitted+by+God%2C+otherwise+it+could+not+take+place.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+on+providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff87d7ae16e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f87d7ae16e.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" rel="noopener" target="_blank">Read it online · Internet Archive (multi-volume)</a></div>
</figure><figure class="quote" id="q-203bb6b5d2" data-kw="Author of sin">
<blockquote><p>Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.5.16</span></figcaption>

</figure><figure class="quote" id="q-19470c5e06" data-kw="Author of sin">
<blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

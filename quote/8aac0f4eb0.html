<main class="wrap"><figure class="quote" id="q-8aac0f4eb0" data-kw="">
<blockquote><p>Our apostles also knew, through our Lord Jesus Christ, and there would be strife on account of the office of the episcopate. For this reason, therefore, inasmuch as they had obtained a perfect fore-knowledge of this, they appointed those [ministers] already mentioned, and afterwards gave instructions, that when these should fall asleep, other approved men should succeed them in their ministry.

We are of opinion, therefore, that those appointed by them, or afterwards by other eminent men, with the consent of the whole Church, and who have blamelessly served the flock of Christ in a humble, peaceable, and disinterested spirit, and have for a long time possessed the good opinion of all, cannot be justly dismissed from the ministry.

For our sin will not be small, if we eject from the episcopate those who have blamelessly and holily fulfilled its duties. Blessed are those presbyters who, having finished their course before now, have obtained a fruitful and perfect departure [from this world]; for they have no fear lest any one deprive them of the place now appointed them. But we see that ye have removed some men of excellent behaviour from the ministry, which they fulfilled blamelessly and with honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Epistle to the Corinthians</cite>, (90), 38 in Ante-Nicene Fathers, 1: 17.</span></figcaption>

<blockquote><p>From which testimonies [of Jerome], these things are clear: 1. That there was no difference betwixt the names and offices of bishops and presbyters in the days of the apostles; 2 That the difference was not begun by any apostolic constitution; but upon Church-custom, the decrees of Councils and such other grounds. 3. That although he acknowledges some difference for the time, as that bishops were to ordain, from which presbyters were restricted, yet that is clearly asserted by him not to flow from any divine constitution (for there can be none imagined after the apostles days) but from some human or Church constitution…</p></blockquote>

<blockquote><p>Thirdly, I demand of you [Independent divines at Westminster], how you could so nakedly propound the apostolical directions, patterns and examples of the primitive Churches to walk by (excepting mere circumstances and the rules of the law of nature) and not except withal extraordinary and miraculous, personal and particular, occasional and accidental, temporary and local patterns and examples. I own the Scripture for the rule, rightly understanding it, and in matters of discipline and Church-order, profess to walk by it, desiring to be tied to the Scripture patterns, particularly to the patterns of examples and precepts recorded in the New Testament (provided this be understood in essentials and fundamentals of order, in matters of perpetual use, and of a common reason to all times and places); only I add that in some things, where in matter of order and external government there may be no such clear directions either by precept or example, there general rules of the Word, with deductions out of Scripture examples, and from precepts by way of analogy, with rules of common prudence be taken in too. Now the interpretation of this rule (as I have laid it down) being rejected, and the rule simply taken up without such limitations, will produce a wild and strange discipline and Church-order, to practise all things recorded in the Acts of the apostles and epistles, without distinction and difference of those times, persons, places and ours: and on the other hand to practise nothing but what has a clear example or precept is strange too, and in so doing, reasonable men cannot become a Church society, nor exercise Church communion. And however in matters of external government and administration of holy things in the visible Church some pretend to this, to practise whatever they find recorded in the Scriptures, and to practise nothing whatsoever they find not there, yet none of the Independents, no not the highest form of them, the Anabaptists, nor the highest sort of Anabaptists (who were called Apostolici from their pretending to imitate the Apostles in all things) ever yet have or do practise all patterns and examples recorded in the New Testament, or are contented with them alone, but practise somewhat over and above not particularly recorded in Scripture. I could lay downe a catalogue of many particulars specified in the Acts of the apostles and epistles, not practised in your churches, nor in any churches of the Independent way, as also of many things practised by you (which we never read of in the Scriptures), so that all the Independents are in many things according to the first pattern both defective and excessive. But I referre the full handling of this to a tractate I intend concerning the Scriptures, How far the Scriptures are a rule for all matters of Church government and order in the visible Church… This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practises and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 (vv. 13 &amp; 17) speaks of it. Schlusselburgius (de Secta Anabaptist.) writes also that there is a sort of Anabaptists called Apostolici, so named because they professed to imitate the apostles in all things: they washed one anothers feet, they held all things ought to be common, they travelled up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, ‘what you have heard in the ear, preach upon the house top.’ Now how far the want of these limitations and distinctions in this your first rule has led some of you into errors and strange practices and may lead you further, as into annointing the sick with oil, baptizing in rivers, etc. I leave you to consider of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, (London: G.M., 1644), pp. 75-77</span></figcaption>

<blockquote><p>PATRONAGE is usually defined to be the exercise of a power of presentation to a Church, which power is held solely in virtue of some secular qualification, such as inheritance or purchase. … In a matter relating to the appointment of the office-bearers of the Church, our ultimate appeal must be “to the law and to the testimony.” Were it true, as some allege, that Scripture lays down no general principles or definite rule, for the guidance of the Church in the election of her office bearers, this matter would fall to be regulated by an enlightened regard to utility; but we trust to make it plain in the course of the following observations, that we are not left by Scripture altogether in the dark, in a matter which so nearly concerns the interests of the Church.

Amid much that is distressing and painful in the circumstances in which the Church of Scotland is now placed in its relations with the Civil Power, it is matter of sincere gratification that these very circumstances are forcing her office-bearers and members back upon first principles—constraining them to abandon all temporizing shifts and expedients, and to take their stand upon the broad and sure basis of the everlasting and unchangeable word of God.

It was a great step in advance towards right principles which the General Assembly made in 1834, when the old doctrine of Non-intrusion was asserted, and effective steps taken to have that principle carried into operation in every case of settlement. It was a still further and more gratifying advance in the same direction, when, five years thereafter, the Assembly took up the language, and resumed the tone of the ancient Assemblies of the Church, and declared the free and unfettered prerogatives which the Lord Jesus Christ, as King and Head of his Church, had conferred upon her.

It is impossible to attach too much importance to this declaration, whether we regard it merely in the light of a testimony in behalf of a great scriptural truth, or as the most healthful indication which could have been afforded, that the Church of Scotland, after a long and dreary period of defalcation, had rid herself of the notion, which lay upon her like an incubus, and paralysed her energies, that she was a mere civil corporation, existing for civil ends.

This idea, fostered under the reign of Moderatism, and forming indeed the very essence of it, had wrought most deadly mischief, not only as regarded the matter of settlement, in which the great thing to be considered was, not the “perfecting of the Saints,” but the following out of the will of the patron; but also as regarded the matter of preaching, in which the great thing to be considered was, not the winning of souls to Christ, but the rearing up of good citizens, on the basis of a cold and secular Morality.

One thing only remains, so far as regards the assertion of principles, to set the Church upon the platform of her ancient standards, and that is, to re-declare the indefeasible right of the members of the Church to elect their own office-bearers. This principle appears necessarily to flow from that of the spiritual independence of the Church, and it is practically one of the most important consequences which result from it.</p></blockquote>

<blockquote><p>The Jewish subordinations, being no temple ordnances, nor typical or ceremonial, do in the moral equity of them concern us as well as them; at least we may with much more reason urge an argument, a pari ratione [from the reason of parity], from subordinations in the Jewish Church to prove a subordination still; then our brethren can argue from thence against it: For the grounds of that subordination being from moral equity; and the ends and necessity of it being the same, now as then (viz. revolving difficult cases, ordering matters of common concernment, reforming offences in inferior societies, receiving appeals, redressing of injuries and neglect in mal-administration, etc.) the same reason still remains, that for the same ends and purposes, there should be subordinations now in the Chrisitan Church that was then in the Jewish.</p></blockquote>

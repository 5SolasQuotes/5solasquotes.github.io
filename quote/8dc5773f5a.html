<main class="wrap"><figure class="quote" id="q-8dc5773f5a" data-kw="">
<blockquote><p>II. But not only is the cross of Christ a manifestation equally to all of the name or nature of God,– it is the proof and measure of that infinite compassion which dwells in the bosom of God towards each and all of the lost race of Adam, and his infinite willingness, or rather longing and yearning desire, to receive each and all of them again into his favor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement, its Efficacy &amp; Extent</cite>, (1867), pt. 2, The Question Viewed in its Practical Relation to the Gospel Call &amp; the Acceptance of it by Faith, p. 196</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“II. But not only is the cross of Christ a manifestation equally to all of the name or nature of God,– it is the proof and measure of that infinite compassion which dwells in the bosom of God towards each and all of the lost race of Adam, and his infinite willingness, or rather longing and yearning desire, to receive each and all of them again into his favor.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b28314cab9" data-kw="">
<blockquote><p>Hence it is commonly called a will of sign and opposed to the will of good pleasure, which is always fulfilled — as several weighty Thomists here expound: Cajetan, Bañez, Zumel, cited by González (disp. 56, sect.1)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 2. ‘General will of God concerning the salvation of all men, 1 Tim. 2:4’ in Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two… vol. 1 tr. AI by Vertias (Padua: Frambotti, 1671), bk. 1, Collation 12, pp. 841-73 A more detailed ToC is given at the beginning of the volume. | Thomas, while allowing for other interpretations, preferred taking 1 Tim. 2:4, about God willing all men to be saved, to refer to an antecedent will of God, in contrast to a consequent will of God. He also speaks of it as a conditional and imperfect will, and a velleity (disposition or willingness) in contrast to the absolute will of God. (Summa, pt. 1, q. 19, art. 6, ‘Whether the will of God is always fulfilled’ [Aquinas distinguishes]) Macedo adds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-2c31393b0e" data-kw="">
<blockquote><p>‘For He abounds in pardoning.’ Now, because it is difficult to remove terror from trembling minds, Isaiah draws all argument from the nature of God, that He will be ready to pardon and to be reconciled. Thus the Holy Spirit dwells on this part of doctrine, because we always doubt whether or not God is willing to pardon us; for, although we entertain some thoughts of his mercy, yet we do not venture fully to believe that, it belongs to us. It is not without reason, therefore, that this clause is added, that we may not be hindered by uncertainty or doubt as to his infinite compassion toward us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 55:7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-35beddc22d" data-kw="">
<blockquote><p>And such a hope ought especially to encourage us to repent, for we see that God is ready to receive us and seeks reconciliation with us, and is always prepared to forgive all our sins, provided we from the heart return to Him; and He seems as one unwilling to inflict punishment.</p></blockquote>

</figure><figure class="quote" id="q-688db4ad07" data-kw="">
<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘Doctrine of Election’, pt. 1 Wendelin (1584-1652)</span></figcaption>

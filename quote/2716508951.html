<main class="wrap"><figure class="quote" id="q-2716508951" data-kw="">
<blockquote><p>Our Saviour sat one day by the well. He talked with a sinful woman, and laid His finger upon the sore spot in her life. “Thou hast had five husbands,” He said; “and he whom thou now hast is not thy husband.” The woman then apparently sought to evade the consideration of the sin in her own life by asking a theological question regarding the right place in which to worship God. What did Jesus do with her theological question? Did He brush it aside after the manner of modern religious workers? Did He say to the woman: “You are evading the real question; do not trouble yourself about theological matters, but let us return to the consideration of the sin in your life.”

Not at all. He answered that theological question with the utmost fulness as though the salvation of the woman’s soul depended on her obtaining the right answer. In reply to that sinful woman, and to what modern religious workers would have regarded as an evasive question, Jesus engaged in some of the profoundest theological teaching in the whole New Testament. A right view of God, according to Jesus, is not something that comes merely after salvation, but it is something important for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Importance of Christian Scholarship for Evangelism. An Address Delivered in London before the Bible League, June 17, 1932 in Christianity Today</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83c600c2c9" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ”The Apostles’ (says Mr. Rutherford) ‘stand in the room of the whole catholic ministerial guides when they revealed the keys.’ [Hooker’s] Answer [to Rutherford]: The apostles in that commission were extraordinary persons sent to all the world to lay the foundation of the Gospel, by an apostolic power; and in this sense they have no successors, nor stand in the room of any.’ [Rutherford’s] Answer: [1.] If the apostles represent none in this sense, Mt. 28:19; Mk. 16:15; Jn. 20:21, ‘Go and teach, etc.’, ‘Whose sins ye remit, etc.’, then none succeed the apostles to teach, baptize, remit and retain sins; pastors then must do these without a commission from Christ, or these ordinances must cease. 2. Mt. 28; Jn. 20, He sends the apostles and says, ‘Behold, I am with you to the end of the world,’ in preaching and baptizing. The apostles, Mt. 28:19-20; Jn. 20:21-22, when they received power to preach and baptize, did represent all ordinary teachers to the end of the world, or then ordinary teachers want [lack] all calling. But the apostles do not live to preach and baptize to the end of the world; therefore that ministerial presence of Christ must be promised to some represented by the apostles. So the English Divines, Calvin, Beza, Diodati [held], as apostles gifted with power of working miracles, etc., they represented none, nor had they any successors. So [in] Mt. 28, the pastors have the power of the keys and of office given them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, ... (London, 1658), bk. 4, ch. 2, pp. 353-4</span></figcaption>

</figure><figure class="quote" id="q-354cc7d39c" data-kw="">
<blockquote><p>Add unto these a distinction betwixt a congregation lying alone in an island, province or nation, and a congregation bordering with sister churches. If either there be but one congregation in a kingdom or province, or if there be many far distant one from another, so that their pastors and elders cannot ordinarily meet together, then may a particular congregation do many things by itself alone, which it ought not to do where there are adjacent neighbouring congregations, together with which it may and should have a common presbytery.</p></blockquote>

</figure><figure class="quote" id="q-d76ea58305" data-kw="">
<blockquote><p>…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.</p></blockquote>

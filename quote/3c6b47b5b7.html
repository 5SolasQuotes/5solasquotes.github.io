<main class="wrap"><figure class="quote" id="q-3c6b47b5b7" data-kw="">
<blockquote><p>Christ never said a word about Peter’s episcopacy at Rome nor about his successor. Neither according to Scripture nor according to tradition has Peter ever breathed a hint that the bishop at Rome would be his only true successor. … Conclusion: The primacy of the Roman bishop over the entire Christian church is totally unfounded. It cannot show the divine right on which it rests; it does not even have a reliable historical foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd6fbda734" data-kw="">
<blockquote><p>It is not the case that there is one church at Rome and another in all the world beside. Gaul and Britain, Africa and Persia, India and the East worship one Christ and observe one rule of truth. If you ask for authority, the world outweighs its capital. Wherever there is a bishop, whether it be at Rome or at Engubium, whether it be at Constantinople or at Rhegium, whether it be at Alexandria or at Zoan, his dignity is one and his priesthood is one. Neither the command of wealth nor the lowliness of poverty makes him more a bishop or less a bishop. All alike are successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span></div>

</figure><figure class="quote" id="q-5b5bb0e3ba" data-kw="Upon this rock">
<blockquote><p>Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God (Mt. 16:16). On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay&quot; (1 Cor. 3:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/peters-primacy.html">Peter&#x27;s primacy</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/primacy-of-peter.html">Primacy of Peter</a></span></div>
<div class="actions"><button class="copy" data-copy="“Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God (Mt. 16:16). On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay&quot; (1 Cor. 3:11).”

— John Calvin, Institutes of the Christian Religion, 4.6.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPeter+had+confessed+in+his+own+name%2C+and+that+of+his+brethren%2C+that+Christ+was+the+Son+of+God+%28Mt.+16%3A16%29.+On+this+rock+Christ+builds+his+Church%2C+because+it+is+the+only+foundation%3B+as+Paul+says%2C+%22Other+foundation+than+this+can+no+man+lay%22+%281+Cor.+3%3A11%29.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.6.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b5bb0e3ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b5bb0e3ba.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-c23f226acb" data-kw="">
<blockquote><p>For neither does any of us set himself up as a bishop of bishops, nor by tyrannical terror does any compel his colleague to the necessity of obedience; since every bishop, according to the allowance of his liberty and power, has his own proper right of judgment, and can no more be judged by another than he himself can judge another. But let us all wait for the judgment of our Lord Jesus Christ, who is the only one that has the power both of preferring us in the government of His Church, and of judging us in our conduct there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seventh Council of Carthage (256)</cite>, opening address</span></figcaption>

</figure><figure class="quote" id="q-49003e754d" data-kw="">
<blockquote><p>Certain it is that many popes have been notorious heretics, as Liberius and Felix, who were Arians; Honorius, a Monothelite; and John XXIII, who denied the immortality of the soul. In the papal see, several schisms have been, and divers times many popes together, excommunicating one another and reciprocally calling one another Antichrist; and of those Antichrists, the worst commonly overcame. So according to the very canons of the Roman Church, factions and corruptions in the creation of the popes have several times made their election void and therefore have broken the thread of that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, bk. 1, ch. 32</span></figcaption>

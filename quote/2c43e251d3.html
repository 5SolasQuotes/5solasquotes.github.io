<blockquote><p>2. It is asked, Whether it be possible for a regenerated man always to retain this habitual intention of pleasing God in all things, although in the mean time he fails in many?

I answer; That not only is it possible, but necessary, if he wishes to retain faith and a good conscience: for these cannot consist, neither remain in the same heart with the design of sinning and of displeasing God. Therefore every believer constantly keeps in mind the purpose of pleasing God and of abstaining from sin, according to that saying of Paul, The good that I would I do not; but the evil which I would not, that I do. Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me, Rom. vii. 19. He who chooseth good, and not evil, retains the design of pleasing God, although, being allured by evil concupiscence, he sometimes does that through infirmity which displeases God, he makes it his main business to please in all things, whilst he studies to avoid every single sin.

Lastly, it is asked. Whether a believer retaining this design of pleasing God, is always acceptable and pleasing to him, notwithstanding those his failures and infirmities?

I answer, first. That the person of a godly and faithful man is always pleasing and acceptable to God, because he is regarded by God not as he is in himself, but as a member under Christ the head; But there is no condemnation to them who are in Christ Jesus, Rom. viii. 1. Secondly, The good works of the faithful, although imperfect, are nevertheless pleasing to God, because they are regarded by him as by a loving Father, not as an austere judge; as covered and adorned with the most perfect obedience of Christ, not as naked and alone. Lastly, The failings and sins of the faithful are indeed hateful and displeasing to God, but out of a simple hatred, not redounding upon the person. And therefore God hates sin in the regenerate, and for that reason declares war against it, through the Spirit of grace; but the regenerate themselves, in the mean time, are acceptable to him, and on that account he favours and blesses them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 126-27.</span></figcaption>

<blockquote><p>Consecrating of churches is taken two ways:

1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches:

1. That the end being sacred, to wit, the habitual worshipping of God in that place.

2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple.

2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place.

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 90-91</span></figcaption>

<blockquote><p>This comprehensive application of the [Scriptural] rule [articulated by Rutherford] was necessitated because the advocates for human ceremonies had argued that such things might be justified as circumstances of worship. It was maintained that circumstances which were not forbidden were lawful if they were edifying. Their reformed opponents quickly saw that this argument effectively created a class of religious actions which were beside the Word in matters of faith and worship. Their response was clear and concise: any action which served as a means of worship was a moral action and required the warrant of God’s Word. To the point, Rutherford asserted, “In actions or religious means of worship, and actions moral, whatever is beside the Word of God is against the Word of God”. (Divine Right of Church Government, 1646, [Intro, section 2], pp. 19-20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Constitutional Principle of the Scottish Reformation</cite>, 2012, vol. 2, pp. 1-42</span></figcaption>

<blockquote><p>Or for the sins here forbidden:

Say first, hast thou not sometime spent the Lord’s day in idleness, or in worldly business, in vanities, or in sin? Secondly, hast thou not omitted publique duties, or comest in too late, or wentest out too soon? Thirdly, hast thou not on those days sold wares, carried burthens, brought in sheaves, or wrought in the harvest? Fourthly, hast thou not employed thy cattle, or servants, or children, or any other, though thou workest not thy self?

Fifthly, hast thou not profaned the Lord’s day, by needless works, words, or thoughts, about thy calling, or about thy recreation? Sixthly, have not the strict observance of the duties of that day been tedious unto thee, saying in thine heart, When will the day be gone? If in any of these thou hast transgressed, then hast thou broken this Commandment, Remember that thou keep holy the Sabbath day.</p></blockquote>

Say first, hast thou not sometime spent the Lord’s day in idleness, or in worldly business, in vanities, or in sin? Secondly, hast thou not omitted publique duties, or comest in too late, or wentest out too soon? Thirdly, hast thou not on those days sold wares, carried burthens, brought in sheaves, or wrought in the harvest? Fourthly, hast thou not employed thy cattle, or servants, or children, or any other, though thou workest not thy self?

Fifthly, hast thou not profaned the Lord’s day, by needless works, words, or thoughts, about thy calling, or about thy recreation? Sixthly, have not the strict observance of the duties of that day been tedious unto thee, saying in thine heart, When will the day be gone? If in any of these thou hast transgressed, then hast thou broken this Commandment, Remember that thou keep holy the Sabbath day.”

— Isaac Ambrose, Prima, the first things, in reference to the middle and last things: or, the doctrine of regeneration, the new birth, the very beginning of a godly life, (London: Nathanael Webb and William Grantham, 1640), p. 54.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COr+for+the+sins+here+forbidden%3A%0A%0ASay+first%2C+hast+thou+not+sometime+spent+the+Lord%E2%80%99s+day+in+idleness%2C+or+in+worldly+business%2C+in+vanities%2C+or+in+sin%3F+Secondly%2C+hast+thou+not+omitted+publique+duties%2C+or+comest+in+too+late%2C+or+wentest+out+too+soon%3F+Thirdly%2C+hast+thou+not+on+those+days+sold+wares%2C+carried+burthens%2C+brought+in+sheaves%2C+or+wrought+in+the+harvest%3F+Fourthly%2C+hast+thou+not+employed+thy+cattle%2C+or+servants%2C+or+children%2C+or+any+other%2C+though+thou+workest+not+thy+self%3F%0A%0AFifthly%2C+hast+thou+not+profaned+the+Lord%E2%80%99s+day%2C+by+needless+works%2C+words%2C+or+thoughts%2C+about+thy+calling%2C+or+about+thy+recreation%3F+Sixthly%2C+have+not+the+strict+observance+of+the+duties+of+that+day+been+tedious+unto+thee%2C+saying+in+thine+heart%2C+When+will+the+day+be+gone%3F+If+in+any+of+these+thou+hast+transgressed%2C+then+hast+thou+broken+this+Commandment%2C+Remember+that+thou+keep+holy+the+Sabbath+day.%E2%80%9D%0A%0A%E2%80%94+Isaac+Ambrose%2C+Prima%2C+the+first+things%2C+in+reference+to+the+middle+and+last+things%3A+or%2C+the+doctrine+of+regeneration%2C+the+new+birth%2C+the+very+beginning+of+a+godly+life%2C+%28London%3A+Nathanael+Webb+and+William+Grantham%2C+1640%29%2C+p.+54.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F548c0f4a16.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/548c0f4a16.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/11/19/isaac-ambrose-on-the-sins-forbidden-in-the-fourth-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

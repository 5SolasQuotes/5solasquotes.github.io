<main class="wrap"><figure class="quote" id="q-31910b646a" data-kw="">
<blockquote><p>Ninethly… Images, however, which are misused for worship, I do not count among ceremonies, but among the number of those things which are diametrically opposed to the Word of God. But those which do not serve for worship and in whose cases there exists no danger of future worship, I am so far from condemning that I acknowledge both painting and statuary as God’s gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rule of Faith in</cite>, ed. James Dennison, Jr., Reformed Confessions… (RHB, 2008), vol. 1, pp. 131-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da10e894b5" data-kw="">
<blockquote><p>To make such images and representations to be used in divine worship, is not simply evil, as appears by the brazen serpent, a temporary ordinance for an occasion in the wilderness; and by the cherubims on the mercy-seat, a stated ordinance for the Mosaical dispensation. There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 18, p. 205</span></figcaption>

894b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da10e894b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=To%20make%20such%20images%20and%20representations,the%20same%20as%20a%20bright%20medium&amp;text=To%20make%20such%20images%20and%20representations%20to%20be&amp;text=shining%20through%20the%20same%20as%20a%20bright%20medium" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9568da3cfe" data-kw="Queen of Heaven Idolatry Paganism">
<blockquote><p>If &quot;the Queen of the heavens&quot; be adopted, then I am inclined to think that the moon is intended: and we know how much superstition has ever prevailed among most people as to the worship of the moon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, Jer. 7:18</span></figcaption>

— John Calvin, Commentaries on Jeremiah, Jer. 7:18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+%22the+Queen+of+the+heavens%22+be+adopted%2C+then+I+am+inclined+to+think+that+the+moon+is+intended%3A+and+we+know+how+much+superstition+has+ever+prevailed+among+most+people+as+to+the+worship+of+the+moon.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentaries+on+Jeremiah%2C+Jer.+7%3A18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9568da3cfe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9568da3cfe.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom17" rel="noopener" target="_blank">Read it online · CCEL, vol. 1</a></div>
</figure><figure class="quote" id="q-27bfb2857b" data-kw="">
<blockquote><p>Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 283-84 (1633)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

ross%20and%20surplice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-99dfff926c" data-kw="">
<blockquote><p>Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

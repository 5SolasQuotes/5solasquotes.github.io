<main class="wrap"><figure class="quote" id="q-364d33927d" data-kw="">
<blockquote><p>The Lord’s Supper is the other Sacrament of the New Testament; in which Christians that are of age, receive spiritually Christ’s body and blood sealed to them in the reception of Bread and Wine according to Christ’s institution. The Rules …

III. The outward matter thereof, or Signs, are Bread and Wine.

IV. The Supper is lame, without both Signs; and to rob the people of the Cup, is Sacrilege.

V. The inward matter is Christ, with all his satisfaction and merit.

VI. As it is Jewish superstition, to use unleavened Bread; so the Popish Penny-Wafers are superstitious relics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, Divinity 3rd, ed. (London, 1660), p. 197, Ch. 24 – Of the Lord’s Supper</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-752dfaf3c6" data-kw="">
<blockquote><p>Secondly, it was not of the substance of the institution [of the Lord’s Supper] to eat unleavened bread, no more than to eat it at night… we are not more bound to the one, than to the other. Again, Christ used unleavened bread because it was the usual bread at that time: so we do use that which is the usual bread in our time. And St. Paul speaketh of such bread as was usual among the gentiles, when he saith, ‘The bread which we break’, 1. Cor. 10:17. Ergo, ordinary bread and leavened [is] to be used, not unleavened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Concerning the Elements</cite>, (London, 1592), Controversies Concerning the Church Triumphant, 13th Controversy, of the Sacrament of the Lord’s Supper, First Part: of the Sacrament of the Eucharist, 4th Question, p. 462</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a96796ee1c" data-kw="">
<blockquote><p>Took bread. Matthew 26:26 , it is said, “ as they were eating, ” i.e. during the repast, “ Jesus took bread, ” that is, he took of the bread lying on the table; and as it was at the time of the Passover, there is no doubt that the bread used was unleavened. It was the thin Passover bread of the Jews. But as no part of the significancy of the rite depends on the kind of bread used, as there is no precept on the subject, and as the apostles subsequently in the celebration of the ordinance used ordinary bread, it is evidently a matter of indifference what kind of bread is used. It was however for a long time a subject of bitter controversy. At first the Latins and Greeks used leavened bread; when the Latins introduced the unleavened wafer from superstitious fear of any of the fragments being dropped, the Greeks retained the use of fermented bread, and accused the Latins of Judaizing. Romanists and Lutherans use unleavened wafers; Protestants generally ordinary bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1878 | This quote was compiled by Andy Webb</span></figcaption>

v>
</figure><figure class="quote" id="q-e844ecfaff" data-kw="">
<blockquote><p>It is evident, however, from the apostolic history, that the Apostles used whatever kind of bread was at hand. There is no significance either in the kind of bread or in the form of the loaf. It is enough that it is bread. This makes it the proper emblem of Him who declared himself to be the true bread which came down from heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/morton-h-smith.html">Morton H. Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>See wiki for a bio. This quote was compiled by Andy Webb</cite>, “1. The first element that Jesus took from the table was the bread. This being the Jewish Passover, this bread had to be unleavened bread, since that was the only bread allowed at this feast. (See Exodus 12:15 ). It may be questioned whether there was any requirement that the bread be unleavened in the New Testament practice. This question is legitimate, if we understand that the Lord’s Supper was observed in connection with regular meals. Hodge says:</span></figcaption>

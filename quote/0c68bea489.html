<main class="wrap"><figure class="quote" id="q-0c68bea489" data-kw="">
<blockquote><p>Because these places [of Scripture] do not only apply the titles indifferently, but do indifferently apply the duties, qualifications and every other thing that belongs to such officers and offices; and there is nothing spoken of the one in Scripture, but it is also spoken of the other, neither anything required as a qualification in, or duty from the one, but is also done in reference to the other, and that expressly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, (Edinburgh, 1658), pp. 223-33, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-1b04833bae" data-kw="">
<blockquote><p>…the instrumental cause of the administration of the Lord’s Supper, viz. the ministers of the Gospel, and the power which they have as ministers to administer the Lord’s Supper. It is called by divines potestas ordinis [the power of order] or potestas muneris specialis [the power of a special office]: and by the London divines in their Divine-Right of Church-Government, is defined to be a Church-power more special and particular to the office of some Church-governors only, as the power of preaching the Gospel, and which they as ministers may execute virtute officii [by virtue of the office]: and it is distinguished from the power of jurisdiction which is more general and common to the office of all Church-governors, as the power of censures, wherein ruling-elders may act with ministers… …That which belongs to ministers as ministers, belongs to all ministers, and always, in all states and conditions of the Church, as well in an un-presbyterated as a presbyterated Church. For a quatenus ad de omni valet argumentum: and the universality required in a proposition, that is, de omni, is universalitas posterioristica, as well as prioristica; temporis, as well as subjecti; Indeed this universality of time, this always is not to be understood, as in natural attributions, for that which is absolutely such in a mathematical latitude, but is to be taken (as usually it is) when it is applied to matters moral, for frequency or usualness… For first every power is for its act, and therefore power in a minister of administring the Lord’s Supper is not to lie idle and unactive; but to be exercised and actuated as often as there is a fit occasion and opportunity; unless there be some such impediment, as I spake of but now, etc. ‘[Greek] Hoc est frustra, quod sua natura in alterius gratiam est comparatum, quando non perficit id, cujus gratia est, &amp; natura comparatum est.’ (Aristotle, bk. 2, Physics, text 62. ‘Now if that may be said in vain which does not reach that end unto which it was appointed, much more may that be said so which is never used or applied for the compassing of that end.’ Secondly, The edification of the Church of Christ is, as the London divines say well, that eminent scope and end why Christ gave Church Government, and all other ordinances of the New Testament to the Church, 2 Cor. 10:8; 2 Cor. 13:10. The power then both of Order and Jurisdiction are both to be employed to the edification of the Church. The power of jurisdiction the minister cannot exercise singly by himself, without other Church officers. The power of order he may: For he alone is the seat and receptacle thereof. …Now a minister ought to exercise and employ for the edification of the Church all the power and authority that he may lawfully exercise. For, not to employ it, were with the slothful servant in the parable to hide his talent in the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650) Jeanes was an English presbyterian., pp. 26-27</span></figcaption>

<blockquote><p>28. We have, therefore, a most excellent and sure mark to distinguish… the legitimate observances of the Church, if we remember that one of two things, or both together, are always intended, viz., that in the sacred assembly of the faithful, all things may be done decently, and with becoming dignity, and that human society may be maintained. In order by certain bonds, as It were, of moderation and humanity… since nothing here is sought but the maintenance of charity by a common office… 30. …the whole sum of righteousness, and all the parts of divine worship, and everything necessary to salvation, the Lord has faithfully comprehended, and clearly unfolded, in his sacred oracles, so that in them He alone is the only Master to be heard. But as in external discipline and ceremonies [he used as an example bowing in prayer], he has not been pleased to prescribe every particular that we ought to observe, (he foresaw that this depended on the nature of the times, and that one form would not suit all ages, in them we must have recourse to the general rules which he has given, employing them to test whatever the necessity of the Church may require to be enjoined for order and decency. Lastly, as he has not delivered any express command, because things of this nature are not necessary to salvation, and, for the edification of the Church, should be accommodated to the varying circumstances of each age and nation, it will be proper, as the interest of the Church may require, to change and abrogate the old, as well as to introduce new forms. I confess, indeed, that we are not to innovate rashly or incessantly, or for trivial causes. Charity is the best judge of what tends to hurt or to edify: if we allow her to be guide, all things will be safe. 31. Things which have been appointed according to this rule, it is the duty of the Christian people to observe with a free conscience indeed, and without superstition, but also with a pious and ready inclination to obey…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-78047d539a" data-kw="">
<blockquote><p>It shall be bound in heaven, and loosed in heaven: not that Christ has hereby obliged himself to confirm all church-censures, right or wrong; but such as are duly passed according to the Word, clave non errante [the key not erring]–the key turning the right way, such are sealed in heaven; that is, the word of the gospel, in the mouth of faithful ministers, is to be looked upon, not as the word of man, but as the word of God, and to be received accordingly, 1 Thess. 2:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew 16, verse 19</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-434a2843e4" data-kw="">
<blockquote><p>[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Question 4, ‘Whether the Precept of Obedience to Superiors, or the Precept of Eschewing Scandal be More Obligatory?’</cite>, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

he%20killing%20of%20our%20brother%E2%80%99s%20soul&amp;text=Rutherford%E2%80%99s%20Anglican%20opponents%20said%3A%5D%20%E2%80%98Notwithstanding%2C%20that%20crossing%2C%20kneeling&amp;text=which%20forbids%20the%20killing%20of%20our%20brother%E2%80%99s%20soul" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-84e5bda01e" data-kw="">
<blockquote><p>This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics (Amsterdam, 1663-1676), Vol. 4, pt. 3, bk. 4, Tract 1, ‘Of Ecclesiastical Power’, 7. Of the Legislative Power of the Churches, 5th Question, Response 2</cite>, p. 796</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.”

— Gisbertus Voetius, Ecclesiastical Politics (Amsterdam, 1663-1676), Vol. 4, pt. 3, bk. 4, Tract 1, ‘Of Ecclesiastical Power’, 7. Of the Legislative Power of the Churches, 5th Question, Response 2, p. 796">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+is+brought+forth+in+that+text+of+the+apostle%2C+2+Thess.+2%3A13%2C+%E2%80%98because%2C+when+ye+received+the+word+of+God+which+ye+heard+of+us%2C+ye+received+it+not+as+the+word+of+men%2C+but+as+it+is+in+truth%2C+the+word+of+God%2C+which+effectually+worketh+also+in+you+that+believe.%E2%80%99+%5BPower+of+rule+and+discipline+is%5D+to+ministers+%5Bantecessoribus%2C+those+who+come+before%5D+because+in+the+name+and+power+of+Christ+they+manifest+themselves+amidst+consciences%2C+and+they+are+ministers+to+consciences+of+laws+broad+and+fixed%2C+and+of+laws+of+faith+and+obedience%2C+by+which+laws+they+are+taken+hold+of%3B+and+they+%5Bthe+ministers%5D+are+%CF%83%CF%8D%CE%BD%CE%B5%CF%81%CE%B3%CE%BF%CE%B9+%5B%E2%80%98laborers+together%E2%80%99%5D+and+%CF%83%CF%85%CE%BD%CE%B5%CF%81%CE%B3%CE%BF%E1%BF%A6%CE%BD%CF%84%CE%B5%CF%82+%5B%E2%80%98workers+together%E2%80%99%5D+of+God+%281+Cor.+3%3A9+%26+2+Cor.+6%3A1%29+in+laws+written+on+the+heart%2C+and+on+the+mind+%28Heb.+10%3A16%29%E2%80%A6+Therefore%2C+they+bear%2C+impose+and+manifest+divine+laws+to+consciences%2C+inasmuch+as+God%2C+through+ministers%2C+may+bear%2C+impose+and+manifest+them.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Ecclesiastical+Politics+%28Amsterdam%2C+1663-1676%29%2C+Vol.+4%2C+pt.+3%2C+bk.+4%2C+Tract+1%2C+%E2%80%98Of+Ecclesiastical+Power%E2%80%99%2C+7.+Of+the+Legislative+Power+of+the+Churches%2C+5th+Question%2C+Response+2%2C+p.+796&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84e5bda01e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84e5bda01e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-the-mere-will-determination-judgment-or-saying-so-of-authorities-is-in-insufficient-ground-of-faith-obedience-that-authorities-are-never-to-act-or-require-something-without-a-naturally-mo/#:~:text=This%20is%20brought%20forth%20in%20that,may%20bear%2C%20impose%20and%20manifest%20them&amp;text=This%20is%20brought%20forth%20in%20that%20text%20of&amp;text=through%20ministers%2C%20may%20bear%2C%20impose%20and%20manifest%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f40671079e" data-kw="Councils and the pope">
<blockquote><p>Although the Levitical high priest had the right to convoke councils and to gain for them infallible authority, it does not follow that the same belongs to the Roman pontiff, because no other besides Christ succeeded the ancient high priest (Heb. 7, 8, 9). Besides, the right of extraordinary conventions was with the supreme magistrate (as we have said) and if they had any authority, that flowed entirely from the word, not from the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.17</span></figcaption>

<blockquote><p>Do they not teach that no idle ceremony, which serves not unto edifying, is to be suffered in the Church (Paraeus, on 1 Cor. 14:26; John Calvin, Epist. &amp; Resp., col. 478); and that godly bretheren are not holden to subject themselves unto such things as they perceive neither to be right nor profitable? (Calvin, on 1 Cor. 10:23; Taylor on Titus 1:15, p. 295) That whatsoever either would scandalize our brother, or not be profitable to him for his edification, Christians for no respect must dare to meddle with it?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3b73937d5" data-kw="">
<blockquote><p>There is a twofold judgement which discerns and judges of Faith. The one absolute, whereby the most high God, whose supreme Authority alone, binds us to believe whatsoever He propounds to be believed by us, has in his written Word pronounced, declared and established what He would have us to believe concerning Himself, or his worship. The other [is] limited and subordinate: which is either public or private. That which is public, is either ordinary or extraordinary. The Ministerial or subordinate public judgement, which I call ordinary, is the judgement of every pastor or doctor, who by reason of his public vocation and office, ought by his public ministry to direct and instruct the judgments of other men in matters of Faith. Which judgement of pastors and doctors is limited and restricted to the plain warrants and testimonies of Holy Scripture (Junius, Cont. 1, bk. 3, ch. 4, note 17), they themselves being only the ambassadors of the judge, to preach and publish the sentence which He has established, so that a pastor is not properly judex [a judge] but index [an informer]. The subordinate public judgment, which is extraordinary, is the judgement of a council, assembled for the more public and effectual establishment and declaration of one or more points of faith and heads of Christian doctrine, and that in opposition to all contrary heresy, or error, which is broached and set a foot in the Church. (M. Ant. De Dom. de Rep. Eccl., bk. 7, ch. 3, n. 32) From which council, no Christian man who is learned in the Scriptures may be excluded, but ought to be admitted to utter his judgement in the same. For in the indagation [investigation] or searching out of a matter of faith, they are not the persons of men which give authority to their sayings, but the reasons and documents which every one brings for his judgment. The subordinate judgement, which I call private, is the judgment of discretion (Davenant, Of the Judge of Controversies, ch. 25; Junius, as above), whereby every Christian, for the certain information of his own mind and the satisfaction of his own conscience, may and ought to try and examine, as well the decrees of councils as the doctrines of particular pastors, and insofar to receive and believe the same as he understands them to agree with the Scriptures.</p></blockquote>

</figure><figure class="quote" id="q-afc5f31ec4" data-kw="">
<blockquote><p>3. Suppose that the suffrage and voice of a pastor and of an elder be voices different only in diverse relations to diverse officers, to wit, the pastor and the elder; yet in the matter of bearing weight in the conscience from force of truth, and not from the authority of men, they are equal; and therefore ruling elders having knowledge and light, and withal authority of office, may well have voices [in Church courts]: But it follows not hence that these who have knowledge are formal canon-makers, because the decrees and constitutions of synods lay two obligations upon the people: [1.] One for the matter, and so in respect that in the moral part thereof they must be agreeable to the Word, they bind the consciences to an obedience of conscience. 2. They impose an ecclesiastical tie from the authority of the council and canon-makers, and so they require subjection or obedience of reverence for the authority-official that is in the canon-makers: The second command lays on the first bond or tie, and the first command lays on the other bond and tie.</p></blockquote>

<blockquote><p>[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Question 4, ‘Whether the Precept of Obedience to Superiors, or the Precept of Eschewing Scandal be More Obligatory?’, p. 47</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.”

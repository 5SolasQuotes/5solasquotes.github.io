<main class="wrap"><figure class="quote" id="q-70e2ce4325" data-kw="">
<blockquote><p>First, whereas he troubleth himself with distinguishing the Supralapsarian and Sublapsarian Doctrine, calling them Supralapsarians who in ordering the eternal decrees of God concerning Election and Preterition or Reprobation place them before the consideration of the fall, and those Sublapsarians who place them after; this pains might well have been spared. For Priorities and Posteriorities in the eternal immanent decrees of God are but imaginations of man’s weak reason, and framed diversly (nay contrarily) as well by Schoolmen and Papists as by Protestants or those which are termed Calvinists; and finally they have little or no use in this controversy, as hath been formerly shewed.

Aquinas thought it no such matter of moment whether Predestination be considered before man’s fall and state of misery or after: Motus non accipit speciem à termino à quo, sed à termino ad quem. Nihil enim refert quantum ad rationem dealbationis, utrùm ille qui deal∣batur fuerit niger, aut pallidus, aut rubeus: &amp; similiter nihil refert ad rationem praedestinatio∣nis, utrùm aliquis praedestinetur in vitam aeter∣nam à statu miseriae vel non. [Motion does not take its form from the term to which it is, but from the term to which it is. For it has nothing to do with the reason of bleaching, whether he who is being whitened is black, or pale, or red: and likewise it has nothing to do with the reason of predestination, whether a person is predestined to eternal life from a state of misery or not.] And for Reprobation, he seemeth rather to incline to their opinion who place it in order of consideration before the fall in making it such a part of the Divine providence as permitteth some men deficere à fine [to fail at the end]. So that this Distinction of Supralapsarians and Sublapsarians hath served this Author to no other purpose but to the inculcating of the same objections again and again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise intitled God’s love to mankind</cite>, (Cambridge: Roger Daniel, 1641), pp 204-05.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aa9e0dab1" data-kw="">
<blockquote><p>But if the law of God be diligently searched, this doubt shall easily be resolved. For it will witness that no less ought the murderer, the blasphemer, and such other, to suffer the death, then that the meek and the fearer of God should be defended. And also, that such as maintain and defend the one, are no less criminal before God then those that oppress the others. […] Now to you justifiers of Servetus: Servetus was an abominable blasphemer against God; and you are justifiers of Servetus: therefore ye are blasphemers before God, like abominable as he was. […] Ye will not easily admit that Servetus be convicted of blasphemy; for if he be, ye must be compelled to confess (except that ye will refuse God) that the sentence of death executed against him was not cruelty; neither yet that the judges who justly pronounced that sentence were murderers nor persecutors; but that this death was the execution of God’s judgement, and they the true faithful servants of God, who, when no other remedy was found, did take away iniquity from amongst them. That God hath appointed death by his law, without mercy, to be executed upon the blasphemers, is evident by that which is written, Leviticus 24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An answer to the cavillations of an adversary respecting the doctrine of predestination</cite>, (1560) repr. in The works of John Knox, ed. David Laing (6 vols, Edinburgh, 1856), v, 223-4.</span></figcaption>

</figure><figure class="quote" id="q-c8a0ce7831" data-kw="">
<blockquote><p>II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For:

      1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess.

      2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1baa8cb2b9" data-kw="intercession preserves salvation">
<blockquote><p>(2) The method of our salvation; it was not sufficient to obtain salvation once, unless it could be perpetually preserved and applied. But the orthodox think that a real intercession is to be held as a part of his priestly office, distinct from the kingly. Christ intercedes as a Priest.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-54e422f3ec" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 10, § 1, “Christ our Intercessor”</span></figcaption>

</figure><figure class="quote" id="q-99e73a55f3" data-kw="intercession necessary">
<blockquote><p>Various arguments prove the necessity of his intercession. (1) The institution of God, who wished two parts to be in the priesthood—satisfaction and intercession; just as under the Old Testament the high priest was bound to do two things in virtue of his office—first, to offer a victim upon the altar of whole burnt offerings; second, to carry the blood of the offered victim into the holy place and to burn incense upon the altar of incense. Having finished his sacrifice on earth upon the cross, Christ must intercede in heaven. Hence Paul testifies if he were on earth, he should not be a priest (Heb. 8:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.15.2</span></figcaption>

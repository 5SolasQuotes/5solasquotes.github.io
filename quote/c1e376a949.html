<blockquote><p>Why then are the prayers of them that love and fear God so little effectual many times? The main cause is the wandering of their thoughts when they are about that holy duty. For it is no wonder that God granteth not what we ask when we think not what we ask. And it were a wonder if that Holiest of Holies, being spoken to without attention, did not resent so great a contempt which we would not use to our inferiors.

Since then the wandering of our thoughts is the cause of that great evil, what is the cause of that wandering? Indeed the prime cause is the incapacity of our low carnal nature to comprehend the infinite God; who being invisible and immaterial doth not help the mind with any image proportionate to the sense and imagination; without which it is very hard for the understanding to fix his thoughts. And that defect in our nature is made worse by this defect in our duty, that we make our addresses to God having not considered before what we are going about, what God is, and what we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A week of soliloquies and prayers. With a preparation for the Holy Communion</cite>, (London: H. Moseley, 1657), epistle dedicatory.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00fb97cdc5" data-kw="">
<blockquote><p>15. Now rests it to see whether it be lawful for godly men to desire miracles of God… I say when men are in this perplexity, the will being ready bent, yea very desirous to obey the commandment of God, godly men cannot be accused either of tempting of God or of rashness if so be they desire to be confirmed by some sign. For whosoever in those cases desires such things as God has been accustomed to offer, he does not amiss. No man is ignorant but that to Ahaz was offered a sign to the intent he might be assured of the promises offered him by Isaiah; wherefore to desire those things which God Himself sometime gives and freely offers, ought not to be forbidden as unlawful, wherof there is no want of examples. … For these things [in Mk. 16:17-18] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers wherby the gospel was commended. For even as the Law of Moses procured to itself credit, through the manifold miracles showed upon Mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner, miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark, belonged not to all times; whereof it is not our part either to complain or find any fault; because that we hear that the Holy Ghost distributes to every one as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>

</figure><figure class="quote" id="q-fbc83b9ecc" data-kw="">
<blockquote><p>O Lord Jehovah, how little do we poor miserable mortals know of thy Supreme Deity, and incomprehensible perfections! how far short do our thoughts come about thee, who art infinite or immense in thy being, thy attributes, thy sovereignty over the creatures! what mortal can take upon him to set bounds to this thy sovereignty, where thou dost not lead the way!

Lord, we know that thou art indebted to none, and that there is none who can say to thee, what dost thou, or why dost thou so? That thou art also holy, and infinitely good, and therefore a lover and rewarder of holiness. May the consciousness of our ignorance in other things kindle in our hearts an ineffable desire of that beatific vision, by which, knowing as we are known, we may in the abyss of thy infinity behold those things which no thought of our at present can reach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank (1677; 2 vols, London, 1822), i, pp 81-82, 1.4.23.</span></figcaption>

<blockquote><p>Q. How many things do we pray for in this petition [“Thy kingdom come”]?

A. For two things.

Q. What is the first?

A. That God will send faithful Pastors to preach his Word.

Q. What is the second?

A. That GOD will send Christian Princes to give countenance to it.</p></blockquote>

</figure><figure class="quote" id="q-d15a6d0bf8" data-kw="">
<blockquote><p>It is very odd how difficult it seems for some persons to understand just what Calvinism is. And yet the matter itself presents no difficulty whatever. It is capable of being put into a single sentence; and that, one level to every religious man’s comprehension. For Calvinism is just religion in its purity. We have only, therefore, to conceive of religion in its purity, and that is Calvinism.

In what attitude of mind and heart does religion come most fully to its rights? Is it not in the attitude of prayer? When we kneels before God, not with the body merely, but with the mind and heart, we have assumed the attitude which above all others deserves the name of religious. And this religious attitude by way of eminence is obviously just the attitude of utter dependence and humble trust. He who comes to God in prayer, comes not in a spirit of self-assertion, but in a spirit of trustful dependence. No one ever addressed God in prayer thus: “O God, thou knowest that I am the architect of my own fortunes and the determiner of my own destiny. Thou mayest indeed do something to help me in the securing of my purposes after I have determined upon them. But my heart is my own, and thou canst not bend it. When I wish thy aid, I will call on thee for it. Meanwhile, thou must await my pleasure.” Men may reason somewhat like this; but that is not the way they pray. […]

The Calvinist is the man who is determined to preserve the attitude he takes in prayer in all his thinking, in all his feeling, in all his doing. That is to say, he is the man who is determined that religion in its purity shall come to its full rights in his thinking, and feeling, and living. This is the ground of his special mode of thought, by reason of which he is called a Calvinist; and as well of his special mode of acting in the world, by reason of which he has become the greatest regenerating force in the world. Other men are Calvinists on their knees; the Calvinist is the man who is determined that his intellect and heart, and will shall remain on their knees continually, and only from this attitude think, and feel, and act. Calvinism is, therefore, that type of thought in which there comes to its rights the truly religious attitude of utter dependence on God and humble trust in his mercy alone for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Calvinism? in Selected shorter writings of Benjamin B. Warfield</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

In what attitude of mind and heart does religion come most fully to its rights? Is it not in the attitude of prayer? When we kneels before God, not with the body merely, but with the mind and heart, we have assumed the attitude which above all others deserves the name of religious. And this religious attitude by way of eminence is obviously just the attitude of utter dependence and humble trust. He who comes to God in prayer, comes not in a spirit of self-assertion, but in a spirit of trustful dependence. No one ever addressed God in prayer thus: “O God, thou knowest that I am the architect of my own fortunes and the determiner of my own destiny. Thou mayest indeed do something to help me in the securing of my purposes after I have determined upon them. But my heart is my own, and thou canst not bend it. When I wish thy aid, I will call on thee for it. Meanwhile, thou must await my pleasure.” Men may reason somewhat like this; but that is not the way they pray. […]

The Calvinist is the man who is determined to preserve the attitude he takes in prayer in all his thinking, in all his feeling, in all his doing. That is to say, he is the man who is determined that religion in its purity shall come to its full rights in his thinking, and feeling, and living. This is the ground of his special mode of thought, by reason of which he is called a Calvinist; and as well of his special mode of acting in the world, by reason of which he has become the greatest regenerating force in the world. Other men are Calvinists on their knees; the Calvinist is the man who is determined that his intellect and heart, and will shall remain on their knees continually, and only from this attitude think, and feel, and act. Calvinism is, therefore, that type of thought in which there comes to its rights the truly religious attitude of utter dependence on God and humble trust in his mercy alone for salvation.”

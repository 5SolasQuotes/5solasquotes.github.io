<main class="wrap"><figure class="quote" id="q-60381d9307" data-kw="">
<blockquote><p>Congregation, recognize the truth expounded here in its essence and commended for the profit of your souls. This truth that was sealed by Jesus’ suffering and death can free us from the evil of sin through the power of the Spirit. Oh, that your hearts would desire to see, to use prudently, and to profit from that which concerns your eternal salvation. These few pages are a treasure that contains everything that is able to satisfy you eternally. Learn here to know the God of gods and how through worship to be affected by the Holy Word; here learn how truly to pray to the Triune God—Father, Son, and Holy Spirit—exalting His being, honouring His name, recognizing His glories.

Wisely and holily, He accomplishes what He eternally decrees concerning creation and providence. He displays His service and gives His laws to reasonable creatures that they might know what leads them to true virtue. Behold here the first man, glorious in covenant with God, then sadly falling into sin and guilt and slavery to Satan. Behold how he was plunged into death, swept into the abyss by a thousand evils. Note God’s Son, moved to compassion, fulfilling God’s righteousness, displaying pity in the covenant of peace, our Mediator.

Note His sweet-sounding names, His natures, His offices, and how He brought redemption for our endangered souls. Observe that God’s Son in both His low and His exalted estates obtained God’s sweet honeycombs, medicine for our souls. He called His child, gave her new life, faith, salvation, righteousness, and holiness. And by godly living, praying, and watching, she is made a participant in full assurance by Him when He uses baptism and the Lord’s Supper as seals for heart and mouth. He shows His love and strengthens His partner in their holy covenant.

Behold mankind, which shall surely die and be raised again to receive its judgment on the last day. Then the ungodly will receive eternal woe, but God’s people, chosen for salvation, will be jubilant. Oh! What a holy outcome for Jesus’ followers, gathered here on earth and guided by heaven’s Word and Spirit. They will taste this salvation for all eternity, and after their struggle they will come to the eternal, blessed, joyful feast. Oh, come and see, savour the truth—so blessed in its radiance and clarity for those who see it with the Spirit’s help. Beg for light, that you may find life in the treasury of exalted truth, the rock on which God’s people build.</p></blockquote>

<blockquote><p>3. This Covenant hath the promise of a circumcised heart, Deuteronomy 30:6, and of the word of faith that is near in the mouth, and of the righteousness of faith clearly differenced from the righteousness of the Law by doing. For so Paul, Romans 10:5-7, etc., expounds, Moses, Deuteronomy 30:11-14.

4. The Covenant of Works taught nothing of the way of expiation of sin by blood typifying the ransom of blood that Christ was to pay for our sins, as this covenant, all along had sacrifices and blood to confirm it. Exodus 24:8. And Moses took the blood and sprinkled it on the people, and said, behold this is the Blood of the Covenant which the Lord hath made with you, concerning all these words. Now the words were the Ten Commandments. See Hebrews 9:18-24.

(5.) This Covenant is made with Israel only, Exodus 20; Deuteronomy 5:6; Deuteronomy 6:5-7, 12. The Covenant of Works is made with all mankind. 6. No people under the Law can be justified and saved thereby, nor have their sins pardoned, Romans 3:9-11, 19-20; Romans 4:1-4; Romans 9; Romans 10; Psalms 130:3; Psalms 143:2; Galatians 3:1-3, 10-13. But in this Covenant, Abraham, David, Genesis 15; Psalm 32; Romans 4:1-9. And the Jews by faith, have remission of sins and salvation, as also the Gentiles have, Acts 10:43; Acts 15:11. […]

8. The Passover and Circumcision, Genesis 17:7, all along were seals of the Covenant, as Baptism on with circumcision in substance, Colossians 2:11, is the seal of the same Covenant, Acts 2:39-41. Now the Law required no Circumcision, no shedding of blood, no repentance, no new heart, but eternal condemnation followed the least breach thereof. Paul saith, Galatians 5:3, If ye be Circumcised (as the false Apostles would have, that thereby you may be justified and saved) you are debtors to keep the whole Law perfectly, as the only way to life, and by no other Covenant can you be justified and saved, now Abraham was not circumcised that way, circumcision did bind Abraham to keep the Law, as a Ceremony and Seal of the Covenant of Works doth command no ceremony, no sacrifice, no type of Christ Mediator at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened; or, a Treatise of the Covenant of Grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 111-13.</span></figcaption>

<blockquote><p>Thirdly, God has expressed Himself in Scripture, as much, yea more, for his willingness, than for his power to help; therefore we need not make our uncertainty of his will the reason of our unbelief, when we say, we are assured of his power: God has said, He is Almighty, etc., but there are not only words importing that God is willing to help his people, but promises and oaths that He will (Ps. 50:15) ‘Call upon me, and I will deliver thee’; Eze. 33:11, ‘As I live, saith the Lord God, I have no pleasure in the death of the wicked (that place is meant primarily of a civil death, a death in trouble) but that the wicked turn from his way and live.’ Yea, God has manifested a willingness to help a people, which his power has not seconded; but He never manifested his power, when his will did not concur: that most passionate exclamation, ‘O Jerusalem, Jerusalem, How often would I have gathered thee! etc.’ [Mt. 23:37] implies a general willingness in Christ to gather Jerusalem, yet Christ did not act his divine power effectually for their gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Unbelief</cite>, (London, 1645), p. 40</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thirdly, God has expressed Himself in Scripture, as much, yea more, for his willingness, than for his power to help; therefore we need not make our uncertainty of his will the reason of our unbelief, when we say, we are assured of his power: God has said, He is Almighty, etc., but there are not only words importing that God is willing to help his people, but promises and oaths that He will (Ps. 50:15) ‘Call upon me, and I will deliver thee’; Eze. 33:11, ‘As I live, saith the Lord God, I have no pleasure in the death of the wicked (that place is meant primarily of a civil death, a death in trouble) but that the wicked turn from his way and live.’ Yea, God has manifested a willingness to help a people, which his power has not seconded; but He never manifested his power, when his will did not concur: that most passionate exclamation, ‘O Jerusalem, Jerusalem, How often would I have gathered thee! etc.’ [Mt. 23:37] implies a general willingness in Christ to gather Jerusalem, yet Christ did not act his divine power effectually for their gathering.”

— Joseph Caryl, The Arraignment of Unbelief, (London, 1645), p. 40">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+God+has+expressed+Himself+in+Scripture%2C+as+much%2C+yea+more%2C+for+his+willingness%2C+than+for+his+power+to+help%3B+therefore+we+need+not+make+our+uncertainty+of+his+will+the+reason+of+our+unbelief%2C+when+we+say%2C+we+are+assured+of+his+power%3A+God+has+said%2C+He+is+Almighty%2C+etc.%2C+but+there+are+not+only+words+importing+that+God+is+willing+to+help+his+people%2C+but+promises+and+oaths+that+He+will+%28Ps.+50%3A15%29+%E2%80%98Call+upon+me%2C+and+I+will+deliver+thee%E2%80%99%3B+Eze.+33%3A11%2C+%E2%80%98As+I+live%2C+saith+the+Lord+God%2C+I+have+no+pleasure+in+the+death+of+the+wicked+%28that+place+is+meant+primarily+of+a+civil+death%2C+a+death+in+trouble%29+but+that+the+wicked+turn+from+his+way+and+live.%E2%80%99+Yea%2C+God+has+manifested+a+willingness+to+help+a+people%2C+which+his+power+has+not+seconded%3B+but+He+never+manifested+his+power%2C+when+his+will+did+not+concur%3A+that+most+passionate+exclamation%2C+%E2%80%98O+Jerusalem%2C+Jerusalem%2C+How+often+would+I+have+gathered+thee%21+etc.%E2%80%99+%5BMt.+23%3A37%5D+implies+a+general+willingness+in+Christ+to+gather+Jerusalem%2C+yet+Christ+did+not+act+his+divine+power+effectually+for+their+gathering.%E2%80%9D%0A%0A%E2%80%94+Joseph+Caryl%2C+The+Arraignment+of+Unbelief%2C+%28London%2C+1645%29%2C+p.+40&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d1bafe9b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d1bafe9b6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Thirdly%2C%20God%20has%20expressed%20Himself%20in,divine%20power%20effectually%20for%20their%20gathering&amp;text=Thirdly%2C%20God%20has%20expressed%20Himself%20in%20Scripture%2C%20as&amp;text=act%20his%20divine%20power%20effectually%20for%20their%20gathering" rel="noo

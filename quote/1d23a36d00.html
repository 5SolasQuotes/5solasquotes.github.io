<main class="wrap"><figure class="quote" id="q-1d23a36d00" data-kw="">
<blockquote><p>In answer unto this, consider, that a royal law is issued out, yea, the very law of nature, written at first upon Adam’s heart, is repeated and adapted unto the dispensation of the covenant of grace, binding and obliging every one, to whom these presents are intimated, to take him as their God in Christ, upon the footing of this new covenant.

And it is remarkable, how Infinite Wisdom outwits the policy of hell, and turns the counsel thereof into foolishness. Satan ruins man by tempting him to break the law, and so to affront God in his authority and sovereignty. Well, but God takes the very first commandment of that law which Adam broke, and brings it in under a new covenant, the sum of which is this, “I am the Lord thy God,” and so makes that very law subservient to man’s recovery, and his greatest warrant to lay claim to Jehovah as his God. So that you see this first commandment in this situation, connected with the preface, is just big and pregnant with amazing grace and love.</p></blockquote>

<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.7, pp 7-8.</span></figcaption>

<blockquote><p>Q. 32 Why is this covenant also called a testament?

A. First, because the term testament began to be used in the church instead of the term covenant.

Second, because just as a testament is not valid without the death of the testator, so also this covenant could not be valid without the death of Christ.

Q. 33 What is the difference between the Old and the New Testament?

A. It is the same testament or covenant of God with all the elect from the first promise given in Paradise, concerning the seed of the woman who would crush the head of the serpent, to the end of the world.

But they are called Old and New Testaments because some of the circumstances and signs of the covenant were changed.

First, in the Old they believed in the Christ who was still to come; in the New we believe in the Christ who has been revealed.

Second, the Old contained the promise of the preservation of the nation of Israel until the time of Christ; in the New we have only the general promise of the preservation of the church under various governments.

Third, the Old had levitical ceremonies, for which, having been abolished in the New, Christ instituted baptism and the Lord’s supper.

Fourth, the Old was more obscure; the New is clearer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>

<blockquote><p>I. How God delights not in the death of a sinner… If God has more pleasure in the conversion of sinners than their destruction, why are there not more converted than we find to be? The greatest part of mankind are perishing in their unbelief and impenitency. Answer: (1) I might answer, that this text speaks not absolutely, but comparatively. God rejoices in the execution of his justice, as well as in all his other works; but if you compare things with things, He rejoices rather in acts of mercy than in acts of vengeance. His disposition inclines Him to mercy rather than to wrath: ‘Mercy pleases Him,’ Mic. 7:18; and mercy rejoices over judgment in the conflict. Justice is alienum opus, ‘his strange work,’ Isa. 28:21; Lam. 3:33, ‘He does not afflict willingly, nor grieve the children of men;’ not with his heart. Mercy, like live honey, drops of its own accord. He is forced to the other [judgment]; it [judgment] is wrested from Him. Though the properties are equally infinite in God, yet they do diversely exert themselves towards men as to the effects. Now the world is upon its trial. God’s primary end is the conversion of a sinner; his secondary end the honor of his vindictive justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, pp. 463-79</span></figcaption>

— Thomas Manton, Works, vol. 21, Two sermons on Eze. 18:23, pp. 463-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+How+God+delights+not+in+the+death+of+a+sinner%E2%80%A6+If+God+has+more+pleasure+in+the+conversion+of+sinners+than+their+destruction%2C+why+are+there+not+more+converted+than+we+find+to+be%3F+The+greatest+part+of+mankind+are+perishing+in+their+unbelief+and+impenitency.+Answer%3A+%281%29+I+might+answer%2C+that+this+text+speaks+not+absolutely%2C+but+comparatively.+God+rejoices+in+the+execution+of+his+justice%2C+as+well+as+in+all+his+other+works%3B+but+if+you+compare+things+with+things%2C+He+rejoices+rather+in+acts+of+mercy+than+in+acts+of+vengeance.+His+disposition+inclines+Him+to+mercy+rather+than+to+wrath%3A+%E2%80%98Mercy+pleases+Him%2C%E2%80%99+Mic.+7%3A18%3B+and+mercy+rejoices+over+judgment+in+the+conflict.+Justice+is+alienum+opus%2C+%E2%80%98his+strange+work%2C%E2%80%99+Isa.+28%3A21%3B+Lam.+3%3A33%2C+%E2%80%98He+does+not+afflict+willingly%2C+nor+grieve+the+children+of+men%3B%E2%80%99+not+with+his+heart.+Mercy%2C+like+live+honey%2C+drops+of+its+own+accord.+He+is+forced+to+the+other+%5Bjudgment%5D%3B+it+%5Bjudgment%5D+is+wrested+from+Him.+Though+the+properties+are+equally+infinite+in+God%2C+yet+they+do+diversely+exert+themselves+towards+men+as+to+the+effects.+Now+the+world+is+upon+its+trial.+God%E2%80%99s+primary+end+is+the+conversion+of+a+sinner%3B+his+secondary+end+the+honor+of+his+vindictive+justice.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Works%2C+vol.+21%2C+Two+sermons+on+Eze.+18%3A23%2C+pp.+463-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e10921dfd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9e10921dfd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=I.%20How%20God%20delights%20not%20in,the%20honor%20of%20his%20vindictive%20justice&amp;text=I.%20How%20God%20delights <blockquote><p>5. Now, if we choose to investigate whether it is right to administer baptism to infants, shall we not say that a man is talking nonsense or indeed raving who would halt with the mere element of water and outward observance, but cannot bear to turn his mind to the spiritual mystery? If any account of this is made, it will be evident that baptism is properly administered to infants as something owed to them. For in early times the Lord did not deign to have them circumcised without making them participants in all those things which were then signified by circumcision [cf. Gen. 17:12]. Otherwise, he would have mocked his people with mere trickery if he had nursed them on meaningless symbols, which is a dreadful thing even to hear of. For he expressly declares that the circumcision of a tiny infant will be in lieu of a seal to certify the promise of the covenant. But if the covenant still remains firm and steadfast, it applies no less today to the children of Christians than under the Old Testament it pertained to the infants of the Jews. Yet if they are participants in the thing signified, why shall they be debarred from the sign? If they grasp the truth, why shall they be driven away from the figure? Notwithstanding, the outward sign so cleaves to the word in the sacrament that it cannot be separated from it; yet if the sign is considered separately from the word, which, I ask you, shall we esteem more? Obviously, since we see that the sign serves the word, we shall say that it is under the word, and shall relegate it to a lower place. Therefore, since the word “baptism” is applied to infants, why shall the sign, which is an appendix of the word, be denied to them? This one reason, if no others were at hand, would be quite enough to refute all those who would speak in opposition. The objection that there was a stated day for circumcision is sheer evasion. We admit that we are not now bound to certain days like the Jews; but since the Lord, without fixing the day, yet declares that he is pleased to receive infants into his covenant with a solemn rite, what more do we require?

6. Yet Scripture opens to us a still surer knowledge of the truth. Indeed, it is most evident that the covenant which the Lord once made with Abraham [cf. Gen. 17:14] is no less in force today for Christians than it was of old for the Jewish people, and that this word relates no less to Christians than it then related to the Jews. Unless perhaps we think that Christ by his coming lessened or curtailed the grace of the Father—but this is nothing but execrable blasphemy! Accordingly, the children of the Jews also, because they had been made heirs of his covenant and distinguished from the children of the impious, were called a holy seed [Ezra 9:2; Isa. 6:13]. For this same reason, the children of Christians are considered holy; and even though born with only one believing parent, by the apostle’s testimony they differ from the unclean seed of idolators [1 Cor. 7:14]. Now seeing that the Lord, immediately after making the covenant with Abraham, commanded it to be sealed infants by an outward sacrament [Gen. 17:12], what excuse will Christians give for not testifying and sealing it in their children today? And let no one object against me that the Lord did not command that his covenant be confirmed by any other symbol than circumcision, which has long since been abolished. There is a ready answer that for the time of the Old Testament he instituted circumcision to confirm his covenant, but that after circumcision was abolished, the same reason for confirming his covenant (which we have in common with the Jews) still holds good. Consequently, we must always diligently consider what is common to both, and what they have apart from us. The covenant is common, and the reason for confirming it is common. Only the manner of confirmation is different—what was circumcision for them was replaced for us by baptism. Otherwise, if the testimony by which the Jews were assured of the salvation of their posterity is taken away from us, Christ’s coming would have the effect of making God’s grace more obscure and less attested for us than it had previously been for the Jews. Now, this cannot be said without grievously slandering Christ, through whom the Father’s infinite goodness was more clearly and liberally poured out upon the earth and declared to men than ever before. And if so, we must admit that at least it should not be concealed with more malign intent, nor revealed with weaker testimony than under the dim shadows of the law.</p></blockquote>

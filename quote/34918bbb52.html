<main class="wrap"><figure class="quote" id="q-34918bbb52" data-kw="">
<blockquote><p>Where they say, and sometimes do persuade fools, that they are able by their masses to distribute and apply unto men&#x27;s commodity all the merits of Christ&#x27;s death, yea, although many times the parties think nothing of the matter, and understand full little what is done, this is a mockery, an heathenish fancy, and a very toy. For it is our faith that applieth the death and cross of Christ to our benefit, and not the act of the massing priest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/the-mass.html">The mass</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/ex-opere-operato.html">Ex opere operato</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f569c2b03" data-kw="">
<blockquote><p>Transubstantiation (or the change of the substance of Bread and Wine) in the Supper of the Lord, cannot be proved by holy Writ; but is repugnant to the plain words of Scripture, overthroweth the nature of a Sacrament, and hath given occasion to many superstitions. The Body of Christ is given, taken, and eaten, in the Supper, only after an heavenly and spiritual manner. And the mean whereby the Body of Christ is received and eaten in the Supper is Faith. The Sacrament of the Lord&#x27;s Supper was not by Christ&#x27;s ordinance reserved, carried about, lifted up, or worshipped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 28</span></figcaption>

</figure><figure class="quote" id="q-7794a32bba" data-kw="two vs seven">
<blockquote><p>However, this topic contains many heads. First, we will dispute in general concerning the sacraments; second, in particular of baptism and the holy Supper, which are the two sacraments of the New Testament instituted by Christ; third, of the five false and spurious ones added by Romanists. But we must first say something about the word and the definition of a sacrament. Use of the word “sacrament.”.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.1.2</span></figcaption>

</figure><figure class="quote" id="q-ac42065a3f" data-kw="Penance Satisfaction">
<blockquote><p>For while they require three things in repentance--viz. compunction of heart, confession of the mouth, and satisfaction of work --they at the same time teach that these are necessary to obtain the pardon of sins. … But if forgiveness of sins depends on the conditions to which they bind it, nothing can be more wretched and deplorable than our situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.4.2</span></figcaption>

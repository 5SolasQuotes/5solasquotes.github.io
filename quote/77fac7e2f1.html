<main class="wrap"><figure class="quote" id="q-77fac7e2f1" data-kw="">
<blockquote><p>The opinions of theologians can be reduced to three classes. Some ascend beyond the fall (supra lapsum) and are hence called supralapsarians. They think that the object of predestination was man either not as yet created or at least not yet fallen. Others descend below the fall (infra lapsum) and hold that man not only as fallen, but also as redeemed through Christ (and either believing or unbelieving) was the object of predestination. Others, holding a middle ground, stop in the fall (in lapsu) and maintain that man as fallen was considered by God predestinating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.9.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a0bf0ad744" data-kw="supralapsarian">
<blockquote><p>They who ascend above the fall (supra Lapsum) or creation to determine the object of predestination think … the decree of predestination should be made to precede the decree of creation and the permission of the fall. … Although this order contains nothing absolutely repugnant to the foundation of salvation and the analogy of faith … yet various objections hinder its reception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.4–5</span></figcaption>

</figure><figure class="quote" id="q-3f39f8f51d" data-kw="">
<blockquote><p>They speak far more safely and truly who, in assigning the object of predestination, do not ascend beyond the fall. The Scripture certainly leads us to this. It says that we are chosen out of the world; therefore not as creatable or capable of falling only, but as fallen and in the corrupt mass: “Because ye are not of the world, but I have chosen you out of the world, therefore the world hateth you” (Jn. 15:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.9.15</span></figcaption>

</figure><figure class="quote" id="q-e2b4a0e89f" data-kw="order of decrees">
<blockquote><p>Although in the decrees (considered formally on the part of God), order cannot properly be attended to (because they are not many and divided acts, but one only and a most simple act by which he from eternity decreed all things), yet there is no objection to ascribing a certain order to them. As they are considered objectively and on our part … some order must necessarily be conceived in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b52b9bcac5" data-kw="">
<blockquote><p>Doctrine 22, That there is no salvation out of the catholic Church From hence also by consequence we understand and believe this catholick Church so to be the only holy one, and to be saved, that out of it there is no holiness, no salvation: and since the truth so shines in her alone, without which salvation belongs to no man, that there is none out of her; and lastly since none besides the body of Christ can be saved, ‘For no man has ascended up to heaven, but He that came down from heaven, even the son of man which is in heaven,’ viz. the whole son of man, with his whole body, which is the Church; so that St. Peter has not unfitly compared the Church to the ark of Noah, in which alone mankind was saved, and as many as were found out of it perished in the waters. But what we confess to be most true of the whole Church, we cannot grant the same of every particular Church, namely to affirm that only in this or that Church, in the Roman or Constantinopolitan, truth and salvation are to be had, so as there is none without it, and consequently that it cannot be departed from, but truth and salvation and Christ must be forsaken too. For some Church may be so qualified, that unless you renounce communion with it, you cannot have part or communion with the catholic, and the head thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Body of Christian Religion (d. 1590; London: Redmayne, 1659), ch. 24, ‘Concerning the Church Militant’, Doctrine 22</cite>, pp. 302-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>

alink</a><a class="src" href="https://reformedbooksonline.com/on-the-phrase-there-is-no-salvation-outside-the-church/#:~:text=Doctrine%2022%2C%20That%20there%20is%20no,the%20catholic%2C%20and%20the%20head%20thereof." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cdb3944bc9" data-kw="">
<blockquote><p>Secondly, There is no salvation out of the Church, but there may be salvation out of the visible Church. As multitudes that are in the visible Church are not saved, so some out of it may be saved. I speak not this to encourage any to neglect being of the visible Church… Is not the greatest company in any visible Church either such open profane, or careless Christians, or downright hypocrites? Are there not ten, an hundred of such for one that truly fears God? Well, when we speak of the Holy Catholic Church, can we only think of that which is visible, as to an outward profession, in which millions perish and go to Hell forever? No, we are to think of the Church invisible; the number known to God of his faithful ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Genuine Remains of… John Lightfoot... (d. 1675; London: R.J., 1700), Tract 3, ‘An Exposition of Two Select Articles of the Apostles’ Creed’, I. ‘I believe the Holy Catholick Church’</cite>, pp. 241-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>

</figure><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.1c</span></figcaption>

<blockquote><p>This book explores the Westminster Confession of Faith’s claim that ‘there is no ordinary possibility of salvation’ outside of the Church by asking what it means, whether it is biblical, and why it is important. The author concludes that the Westminster Confession rightly stresses the role of the Church in bringing people to salvation without making this claim absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ryan-mcgraw.html">Ryan McGraw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ark of Safety: Is There Salvation Outside of the Church? in Explorations in Reformed Confessional Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>

— Ryan McGraw, The Ark of Safety: Is There Salvation Outside of the Church? in Explorations in Reformed Confessional Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+book+explores+the+Westminster+Confession+of+Faith%E2%80%99s+claim+that+%E2%80%98there+is+no+ordinary+possibility+of+salvation%E2%80%99+outside+of+the+Church+by+asking+what+it+means%2C+whether+it+is+biblical%2C+and+why+it+is+important.+The+author+concludes+that+the+Westminster+Confession+rightly+stresses+the+role+of+the+Church+in+bringing+people+to+salvation+without+making+this+claim+absolute.%E2%80%9D%0A%0A%E2%80%94+Ryan+McGraw%2C+The+Ark+of+Safety%3A+Is+There+Salvation+Outside+of+the+Church%3F+in+Explorations+in+Reformed+Confessional+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F747c9aeb40.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/747c9aeb40.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-phrase-there-is-no-salvation-outside-the-church/#:~:text=This%20book%20explores%20the%20Westminster%20Confession,salvation%20without%20making%20this%20claim%20absolute." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9a4f26d536" data-kw="">
<blockquote><p>As also there is a greater company of persons, called out of the world, to profess the name of Jesus and to worship Him outwardly, according to his Word, and to own Him for their King, by submitting to his laws, ordinances and officers by an outward profession. And this is that company, which is called the visible Church, because both their exercise, and their bond of union with this King, and with one another, is outward, and obvious to the eye; to wit, an open profession of the true religion and outward submission to and following of the ordinances and institutions of Christ: But as to this visible Church, in his [a Quaker’s] following words, he seems to take no notice thereof; for he describes to us the Church Invisible; and then tells us, that without this Church there is no salvation. But this is impertinently spoken; for that Church is made up only of the elect; And if we should speak of the Invisible Church, as now existing in this world, we could not say that any elect belonged to it, but such as were effectually called; for the rest were not yet called out of the world, or out of their state of nature; and he told us, that a church is a company of persons called out of the world. To say then that there is no salvation out of that company, that are already effectually called, is neither pertinent, nor truth; for there are many, who are not yet called, whom God, will in due time call and bring home; and these whom He has elected, He does bring into the visible Church where they may enjoy the ordinances, which God hath appointed for conversion: And therefore we say, that out of this visible Church there is ordinarily no salvation: But all this is said by him to make way for his Church, that will take in heathens, pagans, Turks and Tartars, that never heard, nor never shall hear a word of Jesus Christ; which Church, as he would delineate it to us, has not the least relation to Christ, as Head and King; nor any advantage of, or interest in the institutions of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism the Pathway to Paganism... (Edinburgh: John Cairns, 1678), ch. 16</cite>, pp. 360-61</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a178804e77" data-kw="">
<blockquote><p>The Psalter is of all books of the Bible that book which gives expression to the experimental side of religion. In the law and the prophetic writings, it is God who speaks to his people; but in the Psalter we listen to the saints speaking to God. Hence the Psalter has been at all times that part of Scripture to which believers have most readily turned and upon which they have chiefly depended for the nourishment of the inner religious life of the heart.

I say that part of Scripture and not merely that part of the Old Testament, for even taking the Old and New Testament together the common experience of the people of God affirms that there is nothing in Holy Writ which in our most spiritual moments – when we feel ourselves nearest to God – so faithfully and naturally express what we think and feel in our hearts as these songs of the pious Israelites.

Our Lord himself, who had a perfect religious experience and lived and walked with God in absolute adjustment of his thoughts and desires to the Father’s mind and will, our Lord himself found his inner life portrayed in the Psalter and in some of the highest moments of his ministry borrowed from it the language in which his soul spoke to God, thus recognizing that a more perfect language for communion with God cannot be framed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Glory: Sermons Preached in the Chapel of Princeton Theological Seminary</cite>, (1922; Edinburgh: Banner of Truth, 1994), pp 169-70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4e6e6fd000" data-kw="apocrypha">
<blockquote><p>The Apocryphal books are so called not because the authors are unknown (for there are some canonical books whose authors are unknown and some apocryphal books whose authors are known); not because they could be read only in private and not in public (for some of them may be read even in public), but either because they were removed from the crypt (apo tēs kryptēs) (that sacred place in which the holy writings were laid up) as Epiphanius and Augustine think; or because their authority was hidden and suspected, and consequently their use also was secret since the church did not apply to them to confirm the authority of ecclesiastical doctrines (as Jerome says, ‘Praefatio in libros Salomonis’ from “Hieronymi Prologus Galeatus” in Biblia Sacra Vulgata Editionis Sixti V … et Celementis VIII [1865], p. lii); or, what is more probable, because they are of an uncertain and obscure origin (as Augustine says, CG 15.23* [FC 14:474]). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.1</span></figcaption>

</figure><figure class="quote" id="q-281f1ebbf1" data-kw="">
<blockquote><p>From this discrepancy between the Hebrew [Jews’] books [i.e. the Septuagint] and our own arises the well-known question as to the age of Methuselah; for it is computed that he lived for fourteen years after the deluge, though Scripture relates that of all who were then upon the earth only the eight souls in the ark escaped destruction by the flood, and of these Methuselah was not one… …that they may not cast a slight on the trustworthiness of versions which the Church has received into a position of high authority, and because they believe that the Jewish manuscripts rather than our own are in error. For they do not admit that this is a mistake of the [Septuagint] translators, but maintain that there is a falsified statement in the original, from which, through the Greek, the Scripture has been translated into our own tongue. They say that it is not credible that the seventy translators, who simultaneously and unanimously produced one rendering, could have erred, or, in a case in which no interest of theirs was involved, could have falsified their translation; but that the Jews, envying us our translation of their Law and Prophets, have made alterations in their texts so as to undermine the authority of ours. This opinion or suspicion let each man adopt according to his own judgment. Certain it is that Methuselah did not survive the flood, but died in the very year it occurred, if the numbers given in the Hebrew manuscripts are true. My own opinion regarding the seventy translators I will, with God’s help, state more carefully in its own place, when I have come down (following the order which this work requires) to that period in which their translation was executed.</p></blockquote>

</figure><figure class="quote" id="q-481419e3f6" data-kw="">
<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively.

8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object.

9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light.

10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary.

11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected.

12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them.

13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church.

14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true.

15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>

2.+All+dogmatic+traditions+of+the+Roman+Church+fabricated+outside+God%E2%80%99s+word+are+opposed+to+God%E2%80%99s+word%2C+ritual+ones+for+the+greatest+part+of+them.+13.+Neither+the+constitution+of+the+%5BBiblical%5D+canon+nor+the+interpretation+of+the+constituted+canon+ultimately+rests+on+the+authority+of+the+Church.+14.+The+%CE%B1%E1%BD%90%CF%84%CE%BF%CE%BA%CF%81%CE%B1%CF%84%CE%BF%CF%81%CE%B9%CE%BA%CF%8C%CF%82+%5Babsolute+ruler%5D%2C+judge+of+controversies%2C+is+the+one+Spirit+of+God%2C+the+%CE%BA%CE%B1%CE%BD%CE%BF%CE%BD%CE%B9%CE%BA%CF%8C%CF%82+%5Bnormative%5D+judge+is+sacred+Scripture%2C+the+%E1%BD%80%CF%81%CE%B3%CE%B1%CE%BD%CE%B9%CE%BA%CF%8C%CF%82+%5Binstrumental%5D+or+%CE%BB%CE%B5%CE%B9%CF%84%CE%BF%CF%85%CF%81%CE%B3%CE%B9%CE%BA%CF%8C%CF%82+%5Bministerial%5D+judge+is+the+Church%2C+but+the+one+which+is+true%2C+not+the+one+which+merely+professes+itself+to+be+true.+15.+But+Scripture+is+a+real+Judge%2C+not+personal%2C+whence+vain+are+the+argumentations+which+are+drawn+against+the+real+judge+from+the+characteristics+of+a+personal+judge.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim+the+Elder%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima%2C+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F481419e3f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/481419e3f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-authority-of-the-bible/#:~:text=7.%20That%20Word%20of%20God%20was,the%20characteristics%20of%20a%20personal%20judge&amp;text=7.%20That%20Word%20of%20God%20was%20first%20%E1%BC%84%CE%B3%CF%81%CE%B1%CF%86%CE%BF%CE%BD&amp;text=judge%20from%20the%20characteristics%20of%20a%20personal%20judge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2080b22833" data-kw="">
<blockquote><p>Let us give place and consent to the Holy Scripture (says St. Augustine) for it can neither deceive nor be deceived. The bishops also and clergy of England in the epistle of their book to the King’s grace (De peccatorum meritis et remissione, ch. 22) do affirm that holy Scripture alone shows men the right path to come to God to see Him, to know Him, to love Him, to serve Him and so to serve Him as He most desires. Wherefore they are rather obstinate against God, which instead of his only Word, preach and teach other doctrines.</p></blockquote>

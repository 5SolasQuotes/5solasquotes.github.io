<main class="wrap"><figure class="quote" id="q-7382e893e9" data-kw="">
<blockquote><p>Intending to lay open in a brief and School Method a Theological institution, we will premise two things, in stead of a Preface or introduction thereunto. The one of Divinity it self, and of the Nature and verity thereof. The other concerning the order and Method of our institution.

Divinity we mean not that first pattern, which in God is of God himself, nay, is God himself (for both God &amp; that which is in God is the self same in a simple Essence) wherein by an indivisible and unchangeable act, he knoweth both himself in himself, and out of himself all and singular things by himself, but the stamp out of that former expressed and shapened by a revelation and gracious communication thereof, either according to the universal nature in all men, or according to special grace &amp; measure of the scripture in the Church. He that would enquire the verity hereof, ought to consider two things, first, that it is, secondly, what it is. That there is such a stamp of Divinity, the Nature of God, the light both of our own Natural conscience, and supernatural knowledge revealed, as also the common experience of Nations and ages do declare.

The Nature of God, for sith he is by all means infinitely good, we must no way think that God wanteth a good mean to communicate good, whose property it is to be a communicator of himself, or to communicate himself with other his creatures, according to their condition. The light both of our Natural conscience, by which clearly shining, all men have this settled in their hearts, that there is a Divination, and other kinds of divine communications as also of supernatural Knowledge revealed whereby we know that whole truth to be fully and plainly registered in the holy scriptures, which was behooful for us to know to our salvation.

Common Experience, for even the Gentiles themselves being strangers from God, had the Oracles of the Devil in stead of these from God rather then that they would deny that stamped Divinity, or be said to want the same, for hence it came to pass, that whereas among the Heathen, some of their gods were thought to be very gods, some others to be such spirits, as they called Daemons, the heathens Divinity was held to bee of two parts, for the one treated of the gods themselves, the other of those spirits, which they called Daemons, that which treated of their gods, was held of them to be three-sold, as Augustine out of Varro teacheth, to wit, Poetical, Natural, and Civil, that which did set forth the power of those spirits, was two-fold: for whereas of those spirits, called Demons, some were good, some evil: that which discoursed of the evil spirits who were to be pacified and appeased, was called Magic and Enchantment: but the other which delighted the good with sacrifices, was called Divine ministration and Expiation: therefore there is a Divinity.

Now if you respect the true interpretation of the word, it is defined thus, to be a knowledge of the Oracles or speeches of God: but if the thing or matter it self; it is a true wisdom of divine things from God communicated, either by meane Natural, according to inbred principles, or else by a meane more excellent, according to grace supernatural. And of this Divinity we speak in this place, we call it Wisdom by example of Scripture: first, for the excellency of the thing, as being the most certain declarer of principles, &amp; most noble Princess of all sciences: secondly, for the singular meane or manner of knowing, for this wisdom is distinguished from that which in the Scripture is called earthly, sensual, and devilish.

The subject of this Theological wisdom are matters divine, both for their Nature, and the manner of considering: for whereas a Subject hath two parts, the one which containeth the place of the matter, &amp; is called the thing considered: the other of the form, and is the manner of considering it: we observe them both in the explication of this subject: The thing considered is God himself, and all things disposed unto God, that is all things divine, either of their own nature, or by relation unto God: The manner of considering is proportionable to God’s truth, even to the whole truth, and every part thereof alike (or equally) infused, fitted to the dignity of the deliverer to the nature of the argument, as also to the condition of those, to whom it is delivered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved</cite>, trans. John Gawen (London: Francis Burton, 1610), pp 1-6.</span></figcaption>

</figure><figure class="quote" id="q-c6f3600098" data-kw="">
<blockquote><p>The overall chain of argument, then, goes something like this: Pure reason proves through philosophical arguments that there is a God and that we have immortal souls. This by itself entails that a miracle like a resurrection from the dead is possible. Now the historical evidence that Jesus Christ was in fact resurrected from the dead is overwhelming when in interpreted in light of that background knowledge. Hence pure reason also shows that Jesus really was raised from the dead. But Jesus claimed to be divine, and claimed that the authority of his teachings would be confirmed by His being resurrected. So the fact that He was resurrected provides divine authentication of His claims. Hence reason shows that He really was divine… Of course some of those teachings [of Christ] are taken on the basis of authority, but the point is that the trustworthiness of that authority is something that, it is claimed, can be established by reason.. We can know such-and-such a teaching was true because Christ taught it… and a divine being cannot be in error… Every link in the chain is supported by argument… All I am interested in doing here is sketching out the general strategy that Christian theology has traditionally used in justifying its doctrinal claims, and the point of doing so is to understand where faith fits into the picture… So how does it come into play? This way… suppose that the general strategy just sketched can be successfully fleshed out. Then it follows that if you are rational you will believe anything Christ taught; indeed, if you are rational you will believe it even if it is something that you could not possibly have come to know in any other way, and even if it is something highly counterintuitive and difficult to understand. For reason will have told you that Christ is infallible, and therefore cannot be wrong in anything He teaches. In short, reason tells you to have faith in what Christ teaches, because He is divine. And that is at bottom what faith is from the point of view of traditional Christian theology: belief in what God has revealed because if God has revealed it it cannot be in error; but where the claim that He revealed it is itself something that is known on the basis of reason. Faith doesn’t conflict with reason, then; it is founded on reason and completes reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (Southbend, IN: St. Augustine’s Press, 2008), pp. 155-157</span></figcaption>

nterintuitive+and+difficult+to+understand.+For+reason+will+have+told+you+that+Christ+is+infallible%2C+and+therefore+cannot+be+wrong+in+anything+He+teaches.+In+short%2C+reason+tells+you+to+have+faith+in+what+Christ+teaches%2C+because+He+is+divine.+And+that+is+at+bottom+what+faith+is+from+the+point+of+view+of+traditional+Christian+theology%3A+belief+in+what+God+has+revealed+because+if+God+has+revealed+it+it+cannot+be+in+error%3B+but+where+the+claim+that+He+revealed+it+is+itself+something+that+is+known+on+the+basis+of+reason.+Faith+doesn%E2%80%99t+conflict+with+reason%2C+then%3B+it+is+founded+on+reason+and+completes+reason.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+The+Last+Superstition%3A+a+Refutation+of+the+New+Atheism%2C+%28Southbend%2C+IN%3A+St.+Augustine%E2%80%99s+Press%2C+2008%29%2C+pp.+155-157&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc6f3600098.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c6f3600098.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/apologetics#:~:text=The%20overall%20chain%20of%20argument%2C%20then,founded%20on%20reason%20and%20completes%20reason&amp;text=The%20overall%20chain%20of%20argument%2C%20then%2C%20goes%20something&amp;text=it%20is%20founded%20on%20reason%20and%20completes%20reason" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-fd689867fb" data-kw="">
<blockquote><p>It [theology] is called doctrine, not to separate it from understanding, knowledge, wisdom, art or prudence–for these go with every exact discipline, and most of all with theology–but to mark it as a discipline which derives not from nature and human inquiry like others, but from divine revelation and appointment. Isa. 51:4, ‘Doctrine shall go forth from Me;’ Mt. 21:25, ‘From heaven… Why then did you not believe him?’; Jn. 9:29, ‘We know that God has spoken to Moses;’ Gal. 1:11-12, ‘The gospel… is not according to man. For I neither received it from man, nor was I taught it, but it came through a revelation;’ Jn. 6:45.

3. The principles of other arts, since they are inborn in us, can be developed through sense perception, observation, experience and induction, and so brought to perfection. But the basic principles of theology, though they be advanced by study and industry, are not in us by nature. Matt. 16:17, ‘Flesh and blood has not revealed this to you.’

4. Every art has its rules to which the work of the person practicing it corresponds. Since living is the noblest work of all, there cannot be any more proper study than the art of living well.

5. Since the highest kind of life for a human being is that which approaches most closely the living and life-giving God, the nature of theological life is living to God. … 8. Although it is within the compass of this life to live both happily and well, euzoia, living well, is more excellent than eudaimonia, living happily. What chiefly and finally ought to be striven for is not happiness which has to do with our own pleasure, but goodness which looks to God’s glory… …

10. Now since this life so willed is truly and properly our most important practice, it is self-evident that theology is not a speculative discipline but a practical one–not only in the common respect that all disciplines have eupraxia, good practice, as their end, but in a special and peculiar manner compared with all others.

11. Nor is there anything in theology which does not refer to the final end or to the means related to that end–all of which refer directly to practice.

12. This practice of life is so perfectly reflected in theology that there is no precept of universal truth relevant to living well in domestic economy, morality, political life or law-making which does not rightly pertain to theology.

13. Theology, therefore, is to us the ultimate and noblest of all exact teaching arts. It is a guide and master plan for our hightest end, sent in a special manner from God, treating of divine things, tending towards God, and leading man to God. It may therefore not incorrectly be called theozoia, a living to God, theourgia, a working towards God, as well as theology.</p></blockquote>

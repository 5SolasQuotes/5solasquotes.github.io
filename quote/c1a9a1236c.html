<main class="wrap"><figure class="quote" id="q-c1a9a1236c" data-kw="">
<blockquote><p>Man’s natural liberty is this: privilege of having and doing those things only to which the individual has a moral right. Consequently, the natural liberty of two men in the same commonwealth may be different, because under Providence, their natural endowments and relations may differ. Were it possible to frame a government thoroughly equitable, each person’s civic liberty would be identical with his natural: the privilege of having and doing all those things, and those only, to which each has a moral right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Philosophy (Mexico, MO, 1897)</cite>, p. 383</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-cbf3704f54" data-kw="">
<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God; the power that ‘is’ [Rom. 13:1], must be from God; the magistrate as magistrate, is good, in nature of office, and the intrinsecal end of his office, Rom. 13:4, for he is the minister of God for thy good; and therefore a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power, and is no more from God (but from sinful nature, and the old serpent) than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-ef2f2a676e" data-kw="">
<blockquote><p>Assertion 3. The king is more properly a sort of patron, to defend the people (and therefore has no power given either by God or man to hurt the people) and a minister, or public and honorable servant (Rom. 13:4), for he is the minister of God to thee for good. 1. He is the commonwealth’s servant objectively, because all the king’s service, as he is king, is for the good, safety, peace and salvation of the people, and in this he is a servant. 2. He is the servant of the people representatively, in that the people has impawned in his hand all their power to do royal service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 70 lt col mid</span></figcaption>

</figure><figure class="quote" id="q-a9c679b4da" data-kw="">
<blockquote><p>For we nowhere teach that the sword is a means of converting, but the just vengeance that is inflicted by the minister of God upon false teachers, as upon other evil-doers, so it is not destinated by God for spiritual gaining and reducing of heretics that may repent, but for judicial expiation of wrongs done to the flock and Christian society.</p></blockquote>

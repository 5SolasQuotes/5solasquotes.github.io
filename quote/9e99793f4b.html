<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ . 1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following. 2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing. 3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation. 4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/diego-ruiz-de-montoya.html">Diego Ruiz de Montoya</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries &amp; Disputations on the First Part of St. Thomas, on the Will of God &amp; its Proper Acts</cite>, (Lugduni: Prost, 1630), Quest. 19, On the Will of God, Disputation 20, ‘It is explained whether the antecedent will is conditional, and whether it is formally concerned with the means, insofar as they are means’ tr. AI by The Faith Received Ruiz (1562-1632) was a Spanish Jesuit theologian who fundamentally was on the side of those affirming Middle Knowledge in the De Auxiliis controversy, who yet sought to bridge the difference with a formulation which came to be critiqued by both Jesuits and Dominicans. Ruiz was a favorite of John Davenant.</span></figcaption>

<blockquote><p>It seems, I confess, by its more obvious aspect [in the term ‘will of sign’, which is often misunderstood], too much to countenance the ignominious slander which profane and atheistical dispositions would fasten on God, and the course of his procedure towards men; and which it is the design of these papers to evince of as much absurdity and folly, as it is guilty of impiety and wickedness: as though He only intended to seem willing of what He really was not; that there was an appearance to which nothing did subesse [exist under]. And then why is the latter called voluntas [will]? unless the meaning be, He did only will the sign; which is false and impious;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconcileableness of God’s Prescience of the Sins of Men with the Wisdom and Sincerity of His Counsels, Exhortations, and Whatsoever Means He Uses to Prevent Them</cite>, Section 19, page 51-2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It seems, I confess, by its more obvious aspect [in the term ‘will of sign’, which is often misunderstood], too much to countenance the ignominious slander which profane and atheistical dispositions would fasten on God, and the course of his procedure towards men; and which it is the design of these papers to evince of as much absurdity and folly, as it is guilty of impiety and wickedness: as though He only intended to seem willing of what He really was not; that there was an appearance to which nothing did subesse [exist under]. And then why is the latter called voluntas [will]? unless the meaning be, He did only will the sign; which is false and impious;”

</figure><figure class="quote" id="q-a3ebf2ba79" data-kw="">
<blockquote><p>Both Piscator of late, by evidence of Scripture, and Bradwardine long before, by demonstration of reason, have proved that no will in God is conditionate, quoad actum volentis [as to the act of the one willing]; all the conditions are found, quoad res volitas [with respect to the things willed]. And indeed, though the purposes of God are absolute, yet his promises are therefore conditionate, because they are conformed to the manner of God’s operation with man: For, as God works in all things agreeable to their natures, so in man He uses to work agreeable to his nature. And therefore, albeit his purpose be absolute to bring them to grace and glory, to faith, repentance and salvation; yet He allures them to faith and repentance by promises and threatnings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646) | 3rd Doubt, p. 63</span></figcaption>

<blockquote><p>Whether she was a virgin before birth, during birth and after birth? It is affirmed. Whether she remained for the whole of life in that state of virginity? It is denied. It is permitted to be investigated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations</cite>, … (Utrecht, 1643), Part 1, 2nd Section, ‘Of Redemption’, Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’, I. ‘Of the Person of Christ the Mediator’, 1. ‘Of the Assumption &amp; Union of the Human Nature’, ‘Of Mary the Mother of Christ’, no page number. In Voet’s explanations of the Latin abbreviations, he explains “Disq” by saying that it can also mean ‘It is investigated’ as long as neither side is said to be determined. And it is probably able to be investigated and [publicly] disputed on either side.</span></figcaption>

</figure><figure class="quote" id="q-0a2bd3d9c6" data-kw="">
<blockquote><p>He took unto him his wife, that is, he took her unto his house (for betrothed virgins used to abide at their own friends’ houses till the consummation of the marriage) and owned her as his wife, yet not fully using her as such, for the text saith he knew her not (a modest phrase used from the beginning of the world, as appears from Gen 4:1, to express the conjugal act) till she had brought forth her firstborn Son. Some make a great stir in determining whether he knew her afterwards, yea or no. Some of the ancients were stiff in their opinion that he did not, so are the popish writers, and many protestant interpreters. Mr. Calvin I think determines best, that none will move such a question, but such as are unwarrantably curious; nor contend for either part, but such as are unreasonably quarrelsome. For as, on the one side, none can conclude that she had more children from the word till, further than they can conclude, from Ps 110:1, that Christ shall not for ever sit at his Father’s right hand (the word until being a particle only exclusive of a preceding time, not affirming the thing in future time), nor doth the term firstborn conclude any born afterward; so, on the other side, there are no cogent arguments to prove that Mary had no more children by Joseph. We read of the brother of our Lord, Gal 1:19, and of his mother and his brethren, Matt 12:47; and though it be true brethren may signify kinsmen, according to the Hebrew dialect, yet that it doth so in these texts cannot be proved. The Holy Ghost had made use of the virgin for the production of the Messias; why after this her womb should be shut up, and Joseph take her home to be his wife, and not use her as such I cannot tell, nor yet what reproach it could be to Mary or to our Savior, marriage being God’s ordinance, and the undefiled bed honorable: and those who think our Savior would have been dishonoured in any others lying in the same bed after him, seem to forget how much he humbled himself in lying in that bed first, and then in a stable and a manger. We know he knew her not till Christ was born, whether he did afterward or no we are willingly ignorant because God hath not told us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 1, vv. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>

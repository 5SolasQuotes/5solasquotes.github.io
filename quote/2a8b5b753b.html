<main class="wrap"><figure class="quote" id="q-2a8b5b753b" data-kw="">
<blockquote><p>As we deny not those things that are written, so we refuse those things that are not written. That God was born of a virgin we believe, because we read it: that Mary did marry after she was delivered, we believe not, because we read it not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-jerome.html">St Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Helvidius</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), ‘The Distribution of Theology’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-340fa712b7" data-kw="">
<blockquote><p>Edward Bagshaw, p. 12: ‘2. Being present where those things are used in the worship of God, which God has not commanded, this would involve us in the guilt and contagion of them…’ Richard Baxter: Here are two more false doctrines intimated: 1. That to use things in the worship of God which He has not commanded (without exception) is a sin. 2. That being present where they are used involves us in the guilt. Where note: 1. That it is not part of the worship [formally], but things used in the worship that he speaks of. 2. That I proved the contrary to both these at large… and [Bagshaw] gives not a syllable of answer to my twenty instances and many undeniable reasons to the contrary… Sermon notes, meters, tunes, printed Bibles (as printed) and divided into chapters and verses, the words of a sermon or prayer, the particular method, cups, tables, etc. are used in the worship of God without any particular command or any command for this rather than that in cases of indifferency: and yet all these are not therefore unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw (London: Simmons, 1671)</cite>, sect. 44, pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-51cb7778d8" data-kw="">
<blockquote><p>Thirdly, ceremonies called “sacred” are of two sorts, properly so called, or reductively. Properly sacred are all and only such as be of divine institution, which we call also simply necessary, necessitato praecepti [by the necessity of precept]. Reductively sacred are such as in their particular have no divine institution, but are applied in their use to those things which are divine, and these we call arbitrary or ambulatory ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-burges.html">John Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer Rejoined anent Ceremonies to William Ames (1631), ‘The Second Point concerns the Sorts and Difference of Ceremonies’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

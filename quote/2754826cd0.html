<main class="wrap"><figure class="quote" id="q-2754826cd0" data-kw="">
<blockquote><p>A spiritual knowledge is always attended with a spiritual life; a new man, and such a knowledge as is after the image of God, go together: Col. iii. 10, ‘Having put on the new man, which is renewed in knowledge, after the image of him that created him.’ As the natural image of God consisted in understanding and will, so the spiritual image of God by grace consists in a rectifying those faculties; the understanding with a spiritual knowledge, and the will with a spiritual bias. The faculties we have from God as creator by nature, the operation of those faculties about their proper spiritual objects we have by grace.

As the apostle distinguisheth ‘the form of godliness’ from ‘the power,’ 2 Tim. iii. 5, so he doth a form of knowledge from the life of it, Rom. ii. 20, which is a knowledge in the letter, not in the spirit, verse 29; the one is a picture wherein every limb is painted, the other is quickened and animated with a divine life. Speculative knowledge is as the light of torches, guiding, not heating; this as the sun, which both directs and warms; a fire felt as well as seen; truth known, and truth used as a compass to sail by.

When the knowledge of the nature of God is impressed upon us for imitation, and is, as the conference of Christ with his disciples, inflaming the heart, Luke xxiv. 32, and driving away the cold affections towards God; when righteousness is understood as well as judgment, and that as a path, and a good path, to walk in; when we are not only directed to the path, but are pleased with the goodness of it, and the approving wisdom enters into the heart, and the knowledge of it becomes pleasant to the soul, Prov. ii. 9, 10; when there is not only a knowledge of God, but a liking to retain it; a sight of the sun, and a delight in his beams; a knowledge of the fire, and approach to its heat; a mighty pleasure in God and Christ, as a sweet ointment poured forth; when God is known and embraced as the chief good and ultimate end; Christ known and embraced as the way to be at peace with God, and an honourer of him: such a knowledge as is not only like animal spirits in the brain, but vital spirits in the heart enabling for action; not like a cloud hanging in the air, but distilling in fruitful showers for the assistance of the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 18.</span></figcaption>

<blockquote><p>§XVII. There is disagreement today whether the essence of the soul is to be constituted in actual thought itself [by Cartesians], or otherwise. Theologians and philosophers hitherto have stated: The soul is a spiritual substance endowed with the faculty of thinking; and thinking always in the first act [in its existence and power], but not always in the second [in that power’s exercise]. But certain more recent thinkers [Cartesians] wish that the very essence and substance of the rational soul is thought, or that the mind is constituted by actual thought itself. We approve the former opinion with the following arguments: (1) Because Scripture distinguishes the essence of the soul from its action or operation, i.e., thought, Prov. 19:21, “Many are the thoughts in a man’s heart,” where the heart or mind is manifestly distinguished from the thoughts. Thus in Prov. 16:9 it is said: “The heart of man plans his way.” Mt. 1519, “out of the heart proceed evil thoughts.” Paul in Rom. 9:11 says of Esau and Jacob: “when they had not yet been born, or had done any good or evil etc.” from which it appears that these twins, at least in their mother’s womb, had not yet thought. In Dan. 4:29-30, Nebuchadnezzar for seven periods lacked the use of reason and the exercise of thoughts, unless we wish to assert that Nebuchadnezzar was changed in substance into another species, and therefore was utterly deprived of all humanity and mind, from which it would follow: One Nebuchadnezzar sinned, another bore the punishment for his pride. (2) From reason: No substance, at least no created one, is constituted by its own action. Since, therefore, thought is an action of our mind, it is clear that the soul is not constituted by thought, which [Renee] Descartes does not deny in his Reply to the 3rd Objection, Obj. 2 to the 2nd Meditation, p. 82. (3) No attribute is constitutive of its substance, but is consequent to it; nor does it make the substance, but presupposes it. Thought is an attribute which is predicated of the soul, and follows it. Therefore, thought does not constitute or make its substance or subject. (4) Thoughts are multiple and numerous; therefore, for the multiplication of thoughts, the soul would have to be multiplied; for their variation, it would have to be varied; for the production of thoughts, it would have to be produced. (5) The soul can lack thoughts in the second act, for example, when a person sleeps, and in a swoon, apoplexy, and epilepsy; at which time, according to the other hypothesis, the person would lack a mind. (6) Because the learned think more than the rustic and stupid, it would follow that there is more soul in a learned person than in a rustic and stupid one. (7) According to this opinion, the simplicity of God, by which He is believed to be pure act, would not remain proper to God, but would be communicated to men. (8) This opinion is repugnant to the fathers, scholastics, theologians, and even Protestant philosophers up to these times. See Leidecker, Fac. Verit., Locus 7, Controversy 6.</p></blockquote>

bstance, but presupposes it. Thought is an attribute which is predicated of the soul, and follows it. Therefore, thought does not constitute or make its substance or subject. (4) Thoughts are multiple and numerous; therefore, for the multiplication of thoughts, the soul would have to be multiplied; for their variation, it would have to be varied; for the production of thoughts, it would have to be produced. (5) The soul can lack thoughts in the second act, for example, when a person sleeps, and in a swoon, apoplexy, and epilepsy; at which time, according to the other hypothesis, the person would lack a mind. (6) Because the learned think more than the rustic and stupid, it would follow that there is more soul in a learned person than in a rustic and stupid one. (7) According to this opinion, the simplicity of God, by which He is believed to be pure act, would not remain proper to God, but would be communicated to men. (8) This opinion is repugnant to the fathers, scholastics, theologians, and even Protestant philosophers up to these times. See Leidecker, Fac. Verit., Locus 7, Controversy 6.”

— Barthold Holtzfus, ‘Theological Dissertation on Creation’, (Frankfurt: Schwartz, 1712), trans. AI">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7XVII.+There+is+disagreement+today+whether+the+essence+of+the+soul+is+to+be+constituted+in+actual+thought+itself+%5Bby+Cartesians%5D%2C+or+otherwise.+Theologians+and+philosophers+hitherto+have+stated%3A+The+soul+is+a+spiritual+substance+endowed+with+the+faculty+of+thinking%3B+and+thinking+always+in+the+first+act+%5Bin+its+existence+and+power%5D%2C+but+not+always+in+the+second+%5Bin+that+power%E2%80%99s+exercise%5D.+But+certain+more+recent+thinkers+%5BCartesians%5D+wish+that+the+very+essence+and+substance+of+the+rational+soul+is+thought%2C+or+that+the+mind+is+constituted+by+actual+thought+itself.+We+approve+the+former+opinion+with+the+following+arguments%3A+%281%29+Because+Scripture+distinguishes+the+essence+of+the+soul+from+its+action+or+operation%2C+i.e.%2C+thought%2C+Prov.+19%3A21%2C+%E2%80%9CMany+are+the+thoughts+in+a+man%E2%80%99s+heart%2C%E2%80%9D+where+the+heart+or+mind+is+manifestly+distinguished+from+the+thoughts.+Thus+in+Prov.+16%3A9+it+is+said%3A+%E2%80%9CThe+heart+of+man+plans+his+way.%E2%80%9D+Mt.+1519%2C+%E2%80%9Cout+of+the+heart+proceed+evil+thoughts.%E2%80%9D+Paul+in+Rom.+9%3A11+says+of+Esau+and+Jacob%3A+%E2%80%9Cwhen+they+had+not+yet+been+born%2C+or+had+done+any+good+or+evil+etc.%E2%80%9D+from+which+it+appears+that+these+twins%2C+at+least+in+their+mother%E2%80%99s+womb%2C+had+not+yet+thought.+In+Dan.+4%3A29-30%2C+Nebuchadnezzar+for+seven+periods+lacked+the+use+of+reason+and+the+exercise+of+thoughts%2C+unless+we+wish+to+assert+that+Nebuchadnezzar+was+changed+in+substance+into+another+species%2C+and+therefore+was+utterly+deprived+of+all+humanity+and+mind%2C+from+which+it+would+follow%3A+One+Nebuchadnezzar+sinned%2C+another+bore+the+punishment+for+his+pride.+%282%29+From+reason%3A+No+substance%2C+at+least+no+created+one%2C+is+constituted+by+its+own+action.+Since%2C+therefore

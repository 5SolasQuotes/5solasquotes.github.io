<main class="wrap"><figure class="quote" id="q-b2e530e092" data-kw="">
<blockquote><p>If he take vincible, as opposed to invincible ignorance, he Popishly then says that the Scripture offers to us many things whereof we may be invincibly ignorant. Now invincible ignorance, Protestants acknowledge only in matters of fact, or of gospel-truths never so much as in the letter revealed, as heathens may be invincibly ignorant of Christ, and their ignorance not be sinful, as John 15:22, and Jacob was invincibly ignorant in lying with Leah instead of Rachel. There can be no such vincibleness, or invincibleness, in an heretic that hears the Gospel, for whoever hear the Gospel and yet remain ignorant, their ignorance is not invincible, Nulla est invincibilis ignorantia juris [Nothing is invincible ignorance in law].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), p. 343</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84ded9faba" data-kw="">
<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’, p. 13 trans. AI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

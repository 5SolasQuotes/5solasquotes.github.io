<blockquote><p>1. Isolation of members psychologically and or physically from individuals outside the group whose ideas and philosophies are contrary to those promoted by the group. 2. Intense “love-bombing” that so powerfully affects individuals with deep-seated emotional needs that those persons are psychologically thrown off balance. They are faced with an agonizing decision: stay with the group and receive love, or lose the group and lose love. 3. A systematic replacement of the pre-conversion identities of members with a new group related identity. 4. Rapid-fire teaching techniques that do not allow members to think critically about what is being said, coupled with an environment where an open discussion of relevant issues and expression of contrary opinions is discouraged. 5. The use of fear and intimidation against members who desire to leave the group, or former members seeking to break ties with the group. 6. Use of deceptive recruitment techniques that include false information about the groups doctrinal beliefs and coverups of negative episodes in the group history. 7. Total, unquestioning allegiance to a central leader or elite core of leaders. 8. The promotion of and ” ends justifies the means” philosophy within the group. 9. An “us” versus “them” mentality that stresses the group’s unique hold on truth and demonizes anyone who opposes that alleged truth. 10. An inordinate emphasis on submission and obedience to group authority, which effectively guilts a person into submission. 11. Consistent stress on the importance of following the divinely revealed truths being taught by a group leader or leaders. 12. A siege mentality that dismisses all criticism as “persecution”. 13. Shunning and harsh criticism of “rebellious” members who question the teachings or practices of the group. 14. An elitist attitude that is drilled into members, which state that those outside the group are spiritually lukewarm, compromising, or entirely lost. 15. Excess of control over personal aspects of members lives: i.e. where to live, where to work, who to date, who to marry, what literature to read, when vacations can be taken, etc. 16. Rigid restrictions related to the sleeping habits, food intake, exercise, and leisure times of members.</p></blockquote>

<blockquote><p>They offered fire that God had not commanded. Hence I say that all things in Gods worship must have a warrant out of God’s Word, must be commanded. It’s not enough that it is not forbidden: I beseech you observe it: it is not enough that a thing is not forbidden, and what hurt is there in it? But it must be commanded: I confess in matters that are civil and natural, there this may be enough; If it be but according to the rules of prudence, and not forbidden in the Word; we may make use of this in civil and natural things. But now when we come to matters of religion, and the worship of God, we must either have a command, or some what out of God’s Word by some consequence drawn from some command wherein God manifests his will; either a direct command, or by comparing one thing with another, or drawing consequences plainly from the words. We must have a warrant of the worship of God… It’s true, there are some things in the worship of God that are natural and civil helps, and there we need not have any command: As for instance; when we come to worship God, the congregation meets, they must have a convenient place to keep the air and weather from them: now this is but a natural help, and so far as I use the place of worship as a natural help I need have no command. But if I will put any thing in a place beyond what it has in its own nature, there I must look for a command. For if I account one place more holy than another; or to think that God should accept of worship in one place rather than in another: This is to raise it above what it is in its own nature. So that when any creature is raised in a religious way, above what it has in it by nature; if I have not Scripture to warrant me I am therein superstitious. It’s a very useful rule for to help you: If any creature that you make any use of in a way of religion beyond what it has in its own nature, if you have not some warrant from the Word of God (whatsoever specious show there may be in it) it is superstition. As now for the place, there was a place that was holy, but then it had an institution from God. And so for garments, to use those that are decent, the light of reason is enough: but if I will put any thing upon them beyond what there is in them in their own nature, as heretofore in a surplice, what, had that any more decency in its own nature, but only man’s institution? Now when man shall put a religious respect upon a thing, by virtue of his own institution when he has not a warrant from God; here’s superstition! … Now God has written the law of natural worship in our hearts, as that we should love God, fear God, trust in God, and pray to God; this God has written in our hearts: But there are other things in the worship of God that are not written in our hearts, that only depend upon the Will of God revealed in his Word, which were no duties except they were revealed in his Word. And these are of such a nature as we can see no reason for, but only this, because God will have them. As now, there are many kinds of ceremonies to manifest honor to princes that there is no reason for them at all, but merely because it is a civil institution so appointed: So God would have some ways for the honoring of Him, that the creature should not see into the reason of them, but merely the Will of God to have them so:</p></blockquote>

<blockquote><p>There is a twofold worship: 1. A civil reverence we give to persons of honour, Gen. 23:7, ‘Abraham stood up and bowed himself to the children of Heth.’ Piety is no enemy to courtesy. 2. A divine worship, which we give to God, is his prerogative-royal, Neh. 8:6, ‘They bowed their heads, and worshipped the Lord with their faces towards the ground.’ This divine worship God is very jealous of; this is the apple of his eye, this is the pearl of his crown which He guards as he did the Tree of Life, with cherubims and a flaming sword, that no man may come near to violate it: Divine worship must be such as God Himself has appointed, else it is offering strange fire, Lev. 10:2.</p></blockquote>

<blockquote><p>Of all tyrannies, a tyranny sincerely exercised for the good of its victims may be the most oppressive. It would be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth. This very kindness stings with intolerable insult. To be ‘cured’ against one’s will and cured of states which we may not regard as disease is to be put on a level of those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals.</p></blockquote>

</figure><figure class="quote" id="q-0e39098969" data-kw="">
<blockquote><p>By the one same act man both serves and worships God, for worship regards the excellence of God, to Whom reverence is due: while service regards the subjection of man who, by his condition, is under an obligation of showing reverence to God. To these two belong all acts ascribed to religion, because, by them all, man bears witness to the Divine excellence and to his own subjection to God, either by offering something to God, or by assuming something Divine.</p></blockquote>

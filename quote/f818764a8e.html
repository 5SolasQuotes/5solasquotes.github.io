<blockquote><p>3d. Case. Whether may God carry it strangely, as if he were an Enemy to a New Creature, that should seem to be his darling?

Answ. Thou art a Stranger to Scripture, and the Experiences of all God’s Children, if thou think God must always be dandling this New Creature on his Knee, or giving it the Kisses of his Mouth; no, no, he hath reserved these Sweat-meats for the upper Table in Heaven: there’s great reason thou should have his Frowns, as well as Smiles, to humble thy Heart, exercise thy Graces, discover the necessity of Christ, the desirableness of Heaven: God can and may, without any impediment to his Love, hide it for a season from his own dearest Child: David indeed called in question God’s Love and Faithfulness, when he hid his Face; but at last, he found that it was his Infirmity, and doubtless, lamented it as his Sin:

God hath given abundant Security in his Promises of his Love without present sense: you must not think much at him, if he do not come to visit you, and take you up in his Arms as oft as you would have him: Thou needest some purging Physick as well as Cordials: a Son may need a Frown, as well as a Smile from his Father: God is a free Agent, his Kisses are his own: but its well thou art so sensible of his Access and Recess, his Smiles and Frowns: it’s a sign of some Spiritual Life in thy Soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), 191-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-766a5a5f6c" data-kw="">
<blockquote><p>Two centuries ago, in the days of the Stuarts, it would have been impossible for the Church to purchase her freedom even at this cost. On the 1st November 1662, four hundred ministers of the Church of Scotland, substantially for the same principle of Christ’s sole kingly authority in his Church, left their churches and pleasant homes, and cast themselves and their families on the world. But it was not to poverty only, with its manifold hardships, they thus committed themselves, but, as every reader of his country’s history knows, to all manner of sufferings even unto death. And they deemed the principle worth suffering for even to death.

Well it was for the liberties of all Great Britain, as the issue proved, that they did, that they had no sympathy with those in our time who say—it is but a question about external things after all, not touching doctrine, not affecting the truths on which salvation depends. Indeed? Christ’s sole kingly authority in his Church not a matter of vital doctrine! It was well, at least, that our martyr-forefathers thought otherwise, thought that if the shepherds’ consent to the pulling down of the fence which protects the flock, and the wolf thus get in among them, it is small consolation for the sheep that it was only the fence the shepherds suffered to be broken down.

With John Knox, a hundred years before, they judged, “Take from us our assemblies, and take from us the gospel” And thus were they willing, for Christ’s sole regal authority in his kingdom, to surrender, not their livings only, but their lives. The difference in our happier times simply is, that we were able to secure our freedom by parting, not with our lives, but with our livings only. Hence the Disruption of 1843.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-j-brown.html">Charles J. Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh</cite>, (Edinburgh: T. Nelson and Sons, 1863), p. 12.</span></figcaption>

</figure><figure class="quote" id="q-efcb982dfb" data-kw="">
<blockquote><p>Christ was to suffer in his natural affections, of joy, sorrow, confidence, fear, love, yet without sin; and though I could not shew how this anxiety and faith could not consist, yet it cannot be denied; for Grace doth not destroy Nature, nor could the vision of personal union hinder the exercise of all human affections and infirmities in Christ, in the state of his humiliation, as clothes of gold cannot allay the pain of the head and stomach: Grace is a garment of cloth of gold, and the union personal, the perfection of grace; yet it hindered not Christ from being plunged in extreme horror and anxiety.</p></blockquote>

</figure><figure class="quote" id="q-0ca399b86f" data-kw="">
<blockquote><p>She [the church at Philadelphia] is set in the second place after Sardis (for this is the first after Jezabel overcome) where by is shewed that her Antitype is the second reformed Church, which should arise after the Germane, and this is the Church of the Helvetians, Suevia [Swabia], Geneva, France, Holland Scotland. I join all these into one, because they live almost after one and the same kind of laws and ordinances, as touching the things that are of any moment. Neither doth the distance of place break of that society which the conjunction of minds and will doth couple.

Yea this dispersion doth agree chiefly to the Philadelphians, whom we have shewed to dwell thicker and more frequent in the fields then in the city. Whereby it cometh to pass that this thins [sic] of the citizens taketh up much place, though the citizens are not so many. We shall find that this Church which I speak of arose a little while after the German; when Ulricus Zwinglius began to teach at Tigur in Helvetia, in the year 1519, and the reformation was begun the fourth year after, to wit, in the year 1523, at which time no Papist durst enter into combat against Zwinglius, who did defer the judgment of all controversies to the arbitrement of the sacred scriptures. They of Constance, Basil, Strasbourg, Geneva and others, followed their steps. …

In the Antitype, a divine power specially shineth forth sanctifying the Church, by kindling the desyre of godlines, and in making it in Christ Iesus fit and cheerfull to every good worke. Let my words be without envy, the true doctrine soundeth no where purer, the worship lesse corrupted, more flourisheth the faithfull diligence of the Pastors, is performed more willing obedience of the peo∣ple, nor greater reverence of all religion among all degrees. …

Neither doth she keep only the doctrine of salvation uncorrupt, but also she both delivereth and teacheth in writings and exerciseth in practise a sincere manner of administring, wherby salvation is bestowed. Certainly the whole will of God is communicated with his saints, so as Christ taketh to himself not undeservedly this praise of true in governing this Church: He doth also perform plenteously that which he promised, that he would keep safe and sound those that seek him with an upright heart.

What have not endevoured the French man, the Spaniard, the Savoyan, the Pope, to root out them of Geneva, a small people, and environed on every side with enemies, and shut up from all aid of friends? Nevertheless it flourisheth yet still thanks be to God, and shall flourish hereafter, while all her adversaries burst with envy: as long as she shall continue in this holy order. The French Church hath been preserved hitherto, no other wise then the three children in the furnace.

Who would have believed that the Low Countries had been able to resist and withstand the raging Philip, the cruel Duke d’Alve, and so many bloody Tyrants? But true is he, who hath promised this honour to his saints, that they should bind the Kings with chains, and their nobles with fetters of iron, Psalm 149.8.9. And that I may not speake of every each one, they can be safe only by thy protection, o most high God, who art constant in all thy promises, whom both enemies almost infinite do persecute with deadly hatred, and also to whom many of their freinds through envy wish not very well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A revelation of the Apocalypse, that is, the Apocalypse of S. John illustrated with an analysis &amp; scolions where the sense is opened by the scripture, &amp; the events of things foretold, shewed by histories. Hereunto is prefixed a general view: and at the end of the 17. chapter, is inserted a refutatio</cite>, (Amsterdam: Judocus Hondius &amp; Hendrick Laurenss, 1661), pp 90-91, 92-93.</span></figcaption>

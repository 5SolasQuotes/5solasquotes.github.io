<main class="wrap"><figure class="quote" id="q-d3d4d7bee7" data-kw="">
<blockquote><p>This is the first in a two-part series on Henry Bullinger and the issue of the conclusion to the Lord’s Prayer. Some have argued that denying the originality of the conclusion as is found in the Received Text/Majority Text or in the Authorised Version/New King James Version is tantamount to denying biblical inerrancy or the preservation of scripture. As we saw recently, Henry Bullinger clearly believed in the providential preservation of the biblical text. Nevertheless, he did not believe that the conclusion to the Lord’s Prayer was originally part of Matthew’s gospel. Ergo, one does not have to be a Received Text-ultraist to believe that God has preserved his word.

My own opinion is that the evidence seems to favour the view that the words ‘for thine is the kingdom, and the power, and the glory for ever’ (Matthew 6:13 Geneva Bible) belonged to the original text. However, it is important that people hear both sides of the argument and so I am allowing Bullinger’s position to be presented, even though I am not currently persuaded it is correct. In this post, we are simply highlighting what his position was. In the next post on this subject, we will give his reasons for holding this viewpoint. For now, we see that Bullinger did not believe that the conclusion was part of Matthew’s inspired account:

And because I have said, which all godly men also throughout the whole world confess, that a most perfect platform of praying is delivered unto us in the Lord’s Prayer by our Lord Jesus Christ himself; it remaineth, that we cite word for word that most holy form of praying, orderly made with most divine words even by the mouth of the Lord, as Matthew the apostle hath left it recorded unto us; and then to expound the same as briefly and plainly as may be, to the intent that every one may the better understand what he prayeth, and feel a more effectual working inwardly. Of that most heavenly prayer this is the form:

O our Father, which art in heaven; hallowed be thy name. Thy kingdom come. Thy will be done, as well in earth, as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive them that trespass against us. And lead us not into temptation but deliver us from evil. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 205-06.</span></figcaption>

<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>

<blockquote><p>A prayer upon the Lord’s prayer.

O Most mighty Lord and eternal God, who hast by thy dear son Christ Jesus our Lord and Saviour, reconciled unto thy self all things in heaven and earth, and in him haste made an everlasting bond and covenant with us thy faithful children, that thou wilt not only be our God, but also our most loving and merciful Father, whereof as a pledge thou hast given us thy holy Spirit of adoption, whereby we may with boldness and full trust and confidence come to thee by hearty prayer, as unto our most loving and merciful Father, being assured that thou wilt not deny us any thing which thou knowest shall be expedient for us: grant we beseech thee (dear Father) that we being fully persuaded in our hearts of this thy fatherly love and affection towards us, may be stirred up to make our petitions with such an affection, ardent desire, love and reverence to thy majesty, that our minds be not carried away with by thoughts creeping in, but without all wandering may be fully bent and attentive to the thing we ask, and fully staid upon thy merciful and just protection.

We then beseech thee (dear Father) that thou wilt strengthen our hearts with thy holy Spirit, that considering thou hast made all things for the glory of thy Name, so we may in all our doings, enterprises, counsels and purposes, chiefly above all things seek thy Glory: that we may fully acknowledge thee not only the Author of all things, but the ruler, guider and governor of all things, both in Heaven and earth: that we never diminish thine incomprehensible Glory, by attributing unto our selves any power, strength, or ability to do, will, or think that which is good: but from our hearts we may acknowledge all our goodness to come from thee, yielding for the same continually praise and thanksgiving to thy glorious Name: that we never by distrusting thy merciful providence, dishonour thy Name, but that even in our greatest distress we may put our full confidence in thee, not looking upon our weakness, but staying upon thy power and promises, by hearty prayer fleeing unto thee our only refuge: that our whole life may be so framed according to thy holy will in all points, that thy glorious Name in us may be sanctified, and that we be not an occasion that thy holy Name be blasphemed through our wicked life and conversation.

Let thy Kingdom (most merciful Father) appear, and manifestly be declared in all the world, but especially amongst thy Church, and faithful flock: declare thy self Lord and King over them, ruling them by the sceptre of thy holy word, and force of thy holy Spirit. Increase the number of faithful Pastors and Preachers amongst the people: bless their labours to the increase of this Kingdom of thy dear Son Jesus Christ, and to the destruction of the kingdom of Satan and antichrist. Suppress the rage of the enemies, that they may know that thou, O Lord, doest reign in all ages, to the behoof of thy Church and terror of thine enemies.

Grant these mercies good lord, not only to the whole Church in general, but especially to every one of us thy Children particularly: Grant that we may effectually feel the force of this thy Kingdom in our hearts. Beat down in us our old corrupt Adam, with all sinful delights, thoughts, motions, and desires: and renew in us day by day our spiritual and inward man, that we may be wholly bent to delight, think, desire, and do those things which be acceptable in thy sight.

Frame our hearts (good Lord) with such humble obedience to thy holy will, that we may be heartily well content with whatsoever it pleaseth thy goodness to lay upon us: that we never cease in our miseries, but continually call upon thee by hearty prayers, although we feel no release at all, yet that still patiently we may abide, and quietly wait for thy good leisure and appointed time of deliverance, when thou knowest it shall be most expedient for us.

Grant us, dear Father, that all our counsels, studies, labours and endeavours, being by thy holy spirit guided and framed, we may every one in that vocation in which thou haste placed him, so faithfully travail, to the discharging of our consciences, and edifying of thy Church, that our accompt may be found acceptable before thy throne and Judgement seat. So blesse our labours and travels, that we may have sufficient for the preserving of this present life, and be content with those benefits which thou shalt bestow upon us, whether they be many or few, acknowledging them to be received of thee: not greedily to care for them or vainly to delight in them, but thankfully esteem of them, as thy benefits bestowed upon us, and as faithful Stewards moderately to use them to the relief of our brethren, and the discharge of our consciences.

Increase in us (good Lord) the gift of faith, that we may daily more and more in our souls and consciences be assured, that our sins be defaced, clean blotted out, and covered with the full, perfect, and sufficient sacrifice of thy dear Son Christ Jesus our Lord and Saviour once made for vs that we are united, knit, and made one body with him, partakers of his righteousness, justification, and holiness, and even fellow heirs with him of everlasting life: that we may unfeignedly from the bottom of our hearts love thee for this thine unspeakable goodness and mercy: forgiving from our hearts our brethren which doe offend us, pray for them, love, cherish, and comfort them as fellow members all of one body, with perfect natural love and compassion linked together to our head Christ Jesus.

Strengthen us, good Lord, with thy holy spirit, that we be not overcome with the subtle suggestions and sinful motions of Satan the devil: hold us up with thy merciful hand that we sleep not in sin, that we be not drawn away with the wicked world, nor the enticements of the flesh, to delight in wickedness: but so arm us with thy mighty power, that we may strongly abide all the assaults and subtle sleights of our ghostly enemy, and sincerely to walk before thy face, both in prosperity and adversity, to thy honour and glory, the health of our souls, &amp; profit of thy Church, through Jesus Christ our only Lord and Saviour. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-dering.html">Edward Dering</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Godly private prayers for householders to meditate upon, and to say in their families</cite>, (London: John Charlewood, [1578]), unpaginated.</span></figcaption>

<blockquote><p>Prayer consists in calling upon the true God, and arises from an acknowledgment and sense of our want, and from a desire of sharing in the divine bounty, in true conversion of heart and confidence in the promise of grace for the sake of Christ the mediator, asking at the hands of God such temporal and spiritual blessings as are necessary for us; or in giving thanks to God for the benefits received. The genus or general character of prayer consists invocation or adoration. Adoration is often used in the sense of the whole worship of God, since we regard him as the true God, whom we worship. Prayer is a species or part of invocation, for to call upon the true God is to ask of him such things as are necessary both for soul and body, and to render thanks to him for benefits received. It is here used in the sense of the general character of pray. There are, therefore, two species or parts comprehended in prayer—petition and thanksgiving. Petition is a prayer asking of God those blessings necessary both for the soul and body. Thanksgiving is prayer acknowledging and magnifying the benefits received from God, and binding those who receive these gifts to such gratitude as is pleasing to God. Thankfulness in general consists in acknowledging and professing what and how great is the benefit received, and in binding those who are the recipients thereof to the performance of such duties as are mutual, possible and becoming. It comprehends, therefore, truth and justice. The apostle Paul, in his first Epistle to Timothy, 2:1, enumerates four species of prayer, saying, “I exhort, therefore, that first of all supplication, prayers, intercessions, and giving of thanks, be made for all men.” The first includes prayers against evil things; the second, petitions for good things; the third, intercession for others; and the fourth, thanksgiving for benefits received and evils warded off. This distinction is drawn from the end or design of prayer. Prayer is also distinguished into public and private prayer, from the circumstances of person and place. Private prayer is the intercourse which a faithful soul has with God, asking, alone and apart from others, certain blessings for himself, or for others; or giving thanks for benefits received. This form of prayer is not restricted to any particular words or places, for oftentimes the heart, when burdened and distressed, gives utterance to nothing more than sighs and groans; and the Apostle commands “that men pray every where, lifting up holy hands.” (1 Tim. 2:8.) Public prayer is that which, by the use of certain words, is offered up to God by the whole church in the congregation, the minister leading, as it is right and proper that he should in the public gatherings of the church. Language, or the use of the tongue, is necessary for this form of prayer. Hence Christ said: When ye pray, say, Our Father, &amp;c. It was also chiefly for this that the tongue was made, that God might be praised and magnified by it; and it is out of the abundance of the heart that the mouth speaketh. Lastly, by this others are also invited to praise and worship God.</p></blockquote>

<blockquote><p>To praying aright is required light and warmth, a light of the mind, and warmth of affections; the former for the matter, the latter for the manner. And it is a false light and warmth that makes some natural men think that sometimes they pray aright, Isa. lxiii. 2. But all genuine light, and vital warmth comes from the Spirit, Eph. i. 17, 18; 2 Tim. i. 7.

Hence the emblem of the virtue of the Holy Spirit was “cloven tongues, like as of fire,” Acts ii. 3, 4. And the effect thereof is someway compared with that of drunkenness (which excuses it no more than Christ’s being compared to a thief excuses stealing, Rev. xvi. 15); for as the liquor being received to excess, influences the man, so that things come in his head which otherwise would not, and the affections and passions are wrought up by it, Prov. xxiii. 33, so the Spirit indwelling and influencing, presents to the mind matter of prayer, and works up the affections suitable thereto, Eph. v. 18, 19, Cant. vii. 9.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“To praying aright is required light and warmth, a light of the mind, and warmth of affections; the former for the matter, the latter for the manner. And it is a false light and warmth that makes some natural men think that sometimes they pray aright, Isa. lxiii. 2. But all genuine light, and vital warmth comes from the Spirit, Eph. i. 17, 18; 2 Tim. i. 7.

Hence the emblem of the virtue of the Holy Spirit was “cloven tongues, like as of fire,” Acts ii. 3, 4. And the effect thereof is someway compared with that of drunkenness (which excuses it no more than Christ’s being compared to a thief excuses stealing, Rev. xvi. 15); for as the liquor being received to excess, influences the man, so that things come in his head which otherwise would not, and the affections and passions are wrought up by it, Prov. xxiii. 33, so the Spirit indwelling and influencing, presents to the mind matter of prayer, and works up the affections suitable thereto, Eph. v. 18, 19, Cant. vii. 9.”

— Thomas Boston, Discourses on Prayer, (1727) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 58.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+praying+aright+is+required+light+and+warmth%2C+a+light+of+the+mind%2C+and+warmth+of+affections%3B+the+former+for+the+matter%2C+the+latter+for+the+manner.+And+it+is+a+false+light+and+warmth+that+makes+some+natural+men+think+that+sometimes+they+pray+aright%2C+Isa.+lxiii.+2.+But+all+genuine+light%2C+and+vital+warmth+comes+from+the+Spirit%2C+Eph.+i.+17%2C+18%3B+2+Tim.+i.+7.%0A%0AHence+the+emblem+of+the+virtue+of+the+Holy+Spirit+was+%E2%80%9Ccloven+tongues%2C+like+as+of+fire%2C%E2%80%9D+Acts+ii.+3%2C+4.+And+the+effect+thereof+is+someway+compared+with+that+of+drunkenness+%28which+excuses+it+no+more+than+Christ%E2%80%99s+being+compared+to+a+thief+excuses+stealing%2C+Rev.+xvi.+15%29%3B+for+as+the+liquor+being+received+to+excess%2C+influences+the+man%2C+so+that+things+come+in+his+head+which+otherwise+would+not%2C+and+the+affections+and+passions+are+wrought+up+by+it%2C+Prov.+xxiii.+33%2C+so+the+Spirit+indwelling+and+influencing%2C+presents+to+the+mind+matter+of+prayer%2C+and+works+up+the+affections+suitable+thereto%2C+Eph.+v.+18%2C+19%2C+Cant.+vii.+9.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+Discourses+on+Prayer%2C+%281727%29+in+The+Whole+Works+of+the+Late+Reverend+Thomas+Boston+of+Ettrick%2C+ed.+Samuel+McMillan+%2812+vols%2C+Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11%3A+58.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9db79a3fbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9db79a3fbd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/28/thomas-boston-on-warm-affections-in-prayer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

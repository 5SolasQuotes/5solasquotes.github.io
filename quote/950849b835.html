<main class="wrap"><figure class="quote" id="q-950849b835" data-kw="">
<blockquote><p>We should learn here that no one should place his trust in men, even if he is in an estate ordained by God. But if we are not to believe nor put our trust in Annas and Caiaphas, how are we to believe or trust the devil, the pope in Rome, the monks in monasteries, or the godless bishops? God so thoroughly forbids putting trust in any man that one should not even trust in those who are in the highest, best, and most secure estates. For no estate on earth has been so gloriously confirmed as was the estate of Annas and Caiaphas. If Annas and Caiaphas became scoundrels in their order and estate, even though it was the most exalted on earth, then you should learn from this not to esteem any man on the basis of his estate or see. The papal jurists exalted their pope and said, “non est praesumendum, quod tantae altitudinis apex possit errare“—“It is not to be presumed that the pope in such a lofty station can err.” Against this claim I set the following: Annas and Caiaphas occupy a loftier position and sit on a greater throne than do the pope and the emperor. Yet they not only err but also are scoundrels and knaves—the worst of scoundrels and knaves ever to have lived on earth, for they crucified the Son of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works: Sermons on the Gospel of John</cite>, 178-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01dbabec62" data-kw="">
<blockquote><p>The state and condition of the church with respect unto them has utterly ceased; and nothing can be more vain than to pretend any succession unto them, in the whole or any part of their office, unless men can justify their claim unto it by any or all of those things which concurred unto it in the apostles, which they cannot do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, ch. 3 (Works 15)</span></figcaption>

</figure><figure class="quote" id="q-6d95bf0c06" data-kw="">
<blockquote><p>Thus, if Tertullian be believed, true succession consists in conformity with the doctrine of the apostles: which being found in a church, whether great or small, of old or fresh date, such a church is truly apostolical, although for lack of histories she cannot show the line of her succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, bk. 1, ch. 32</span></figcaption>

— Pierre Du Moulin, The Novelty of Popery, bk. 1, ch. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%2C%20if%20Tertullian%20be%20believed%2C%20true%20succession%20consists%20in%20conformity%20with%20the%20doctrine%20of%20the%20apostles%3A%20which%20being%20found%20in%20a%20church%2C%20whether%20great%20or%20small%2C%20of%20old%20or%20fresh%20date%2C%20such%20a%20church%20is%20truly%20apostolical%2C%20although%20for%20lack%20of%20histories%20she%20cannot%20show%20the%20line%20of%20her%20succession.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20The%20Novelty%20of%20Popery%2C%20bk.%201%2C%20ch.%2032&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d95bf0c06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d95bf0c06.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-be1bfa0f0d" data-kw="">
<blockquote><p>For their very doctrine, after comparison with that of the apostles, will declare, by its own diversity and contrariety, that it had for its author neither an apostle nor an apostolic man; because, as the apostles would never have taught things which were self-contradictory, so the apostolic men would not have inculcated teaching different from the apostles, unless they who received their instruction from the apostles went and preached in a contrary manner. To this test, therefore will they be submitted for proof by those churches, who, although they derive not their founder from apostles or apostolic men (as being of much later date, for they are in fact being founded daily), yet, since they agree in the same faith, they are accounted as not less apostolic because they are akin in doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prescription against Heretics</cite>, ch. 32</span></figcaption>

</figure><figure class="quote" id="q-420ef1c703" data-kw="">
<blockquote><p>This question is proposed on account of those who glory in the name of Jesus, and yet, at the same time, seek their salvation, either wholly or in part, in some other place without him, in the merits of the saints, in the indulgences of the Pope, in their own offerings, works, fastings, prayers, alms, etc., as do the Papists, the Jesuits, and other hypocrites of a cast. We must therefore enquire, whether these persons believe in Jesus as the only Saviour, or not. It is answered, that they do not believe in him, but that in very deed they deny him, however much they may boast of him in words. The substance of this answer is included in this syllogism, drawn from the description of an only and perfect Saviour: Whosoever is a perfect, and only Saviour, he does not confer salvation with others, nor in part only. Jesus is a complete and only Saviour, as we have shown in the exposition of the former question. Therefore he does not confer salvation in connection with others, nor in part only; but he alone confers it entire, and in the most perfect manner. Hence we justly conclude that all those who seek their salvation wholly or in part somewhere else, in reality deny him to be an only and perfect Saviour. Or, we may put it in this form: Those who seek salvation elsewhere than in Christ, whether in the saints, or in themselves, &amp;c., do not believe in Jesus as an only Saviour. The Papists and Jesuits, who look upon their works as meritorious, do this. Therefore they do not believe in Jesus as their only Saviour. The minor proposition is acknowledged by them; and as to the major, it is clearly evident from the description which we have given of a perfect Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus Doctrinae Orthodoxae on Heidelberg Catechism Q. 30</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

<main class="wrap"><figure class="quote" id="q-fb8bcc743b" data-kw="">
<blockquote><p>V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”) [in man as unfallen]: namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b150ac1821" data-kw="">
<blockquote><p>As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God.</p></blockquote>

</figure><figure class="quote" id="q-2e7bfd0106" data-kw="">
<blockquote><p>The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, [Edward] Feser’ (RBO, 2025) | 12. ‘Gradation of Principles &amp; Practices’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-f32404dc04" data-kw="">
<blockquote><p>Man’s intellect, to go no further, since it attains universal and necessary truth, is not limited by material conditions and material organs. Hence man’s soul, the source of his intellect, is independent of matter, and hence survives the corruption of the human organism.</p></blockquote>

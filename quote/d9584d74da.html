<blockquote><p>…but [nonconformists] will keep all loving correspondence with them [parish churches], and seasonably sometimes communicate with them to show their principles by their practice. For the benefit of Christian love and concord, may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They prefer their own manner of worshipping God, as better than the Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9c7f70eeb" data-kw="">
<blockquote><p>They [older non-conformists] argue that there is no necessity for [total] Separation for the sake of such corruptions, because a person may communicate in the worship without partaking in those corruptions…

1. This separation of the good from the bad in divine worship they grant possible. So Mr. [John] Ball: ‘If some things human be mixed with divine, a sound Christian must separate the one from the other, and not cast away what is of God as a nullity, fruitless, unprofitable, defiled, because somewhat of men is annexed unto them. In the body we can distinguish betwixt the substance and the sickness which cleaves unto it; betwixt the substance of a part or member, and some bunch or swelling, which is a deformity, but destroys not the nature of that part or member, etc.’ (Trial of the Grounds, etc., [ch. 13,] p. 308) …

2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London</cite>, (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 32</span></figcaption>

</figure><figure class="quote" id="q-5623f461a7" data-kw="">
<blockquote><p>It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863), pp. 278-79</span></figcaption>

<blockquote><p>[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.”

— John Calvin, Sermons… upon the Book of Job (London: 1574), 2nd sermon on ch. 15, 58th Sermon, pp. 298-99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BJob+15%3A15%5D+%E2%80%98For+God+finds+not+steadfastness+in+his+saints+%28that+is+to+say+in+his+angels%29%2C+neither+are+the+heavens+clean+in+his+sight%3A%E2%80%99%E2%80%A6+For+first+and+foremost+they+%5Bmen%5D+had+need+to+be+cleaner+and+purer+than+the+angels%2C+and+they+had+need+to+surmount+the+brightness+of+the+sun+and+the+stars%2C+seeing+that+the+heavens+themselves+are+infected+before+God%2C+if+comparison+should+be+made+between+them+and+Him%E2%80%A6+But+there+is+another+higher+righteousness+in+God%2C+which+surmounts+all+creatures%2C+insomuch+as+no+angel+is+able+to+satisfy+it.+And+no+wonder+at+all%3A+for+what+comparison+is+there+between+an+infinite+thing+and+a+thing+that+has+bounds%3F+Behold%2C+although+the+angels+have+great+glory+in+them%3A+yet+are+they+but+creatures.+And+what+is+God%3F+He+is+an+infinite+thing%2C+insomuch+that+when+we+think+upon+Him%2C+we+ought+to+be+ravished+into+astonishment.+So+then+let+us+not+think+it+strange%2C+that+God%E2%80%99s+righteousness+should+be+so+high+that+when+all+creatures+come+to+that+point%2C+all+that+is+to+be+found+in+them+shall+be+nothing+at+all%2C+but+they+shall+deserve+to+be+utterly+wiped+out%E2%80%A6+And+so+far+are+we+unable+to+stand+upright+that+the+very+angels+of+heaven+are+confounded+there.+And+why%3F+Because+the+very+heavens+themselves+are+not+clean.+For+whereas+God+has+created+the+sun+to+give+light+to+the+world%2C+and+given+some+brightness+to+the+stars+also%3A+it+follows+not+therefore+that+they+have+a+divine+perfection.+We+must+remember+what+has+been+said+afore%3A+namely+that+all+the+creatures+that+God+made+do+keep+still+some+marks+of+his+grace.+But+if+a+man+would+compare+that+which+is+in+the+creatures+with+that+which+is+in+God%3A+he+shall+find+that+the+one+is+all+and+the+other+is+nothing.+Thus+ye+see+how+the+heavens+are+not+clean%2C+that+is+to+say%2C+that+there+is+always+some+imperfection+in+the+creatures%2C+so+as+they+have+not+the+power+to+stand+before+God%2C+as+in+respect+of+the+infinite+glory+that+is+in+Him.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Sermons%E2%80%A6+upon+the+Book+of+Job+%28London%3A+1574%29%2C+2nd+sermon+on+ch.+15%2C+58th+Sermon%2C+pp.+298-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ecf20077e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ecf20077e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Job%2015%3A15%5D%20%E2%80%98For%20God%20finds%20not,infinite%20glory%20that%20is%20in%20Him&amp;text=Job%2015%3A15%5D%20%E2%80%98For%20God%20finds%20not%20steadfastness%20in&amp;text=of%20the%20infinite%20glory%20that%20is%20in%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

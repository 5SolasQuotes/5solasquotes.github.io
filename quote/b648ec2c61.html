<main class="wrap"><figure class="quote" id="q-b648ec2c61" data-kw="">
<blockquote><p>That necessary Being is most unmixed or purest Being. Without allay. That is pure which is full of it self. Purity is not here meant in a corporeal sense (which few will think) nor in the moral; but as with Metaphysicians it signifies simplicity of essence. And in its present use is more especially intended to signify that simplicity which is opposed to the composition of act, and possibility. We say then that necessary Being imports purest actuality. Which is the ultimate and highest perfection of Being. For it signifies no remaining possibility, yet unreplete, or not filled up, and consequently the fullest exuberancy and entire confluence of all Being, as in its fountain and original source. We need not here look further to evince this than the native import of the very terms themselves; necessity and possibility; the latter whereof is not so fitly said to be excluded the former (as contingency is) but to be swallowed up of it; as fulness takes up all the space which were otherwise nothing but vacuity or emptiness. It is plain then that necessary Being, engrosses all possible Being, both that is, and (for the same reason) that ever was so. For nothing can be or ever was in possibility to come into Being, but what either must spring, or hath sprung, from the necessary self-subsisting Being.

So that unto all that vast possibility, a proportionable actuality of this Being must be understood to correspond. Else the other were not possible. For nothing is possible to be produced which is not within the actual productive power of the necessary Being. I say within its actual productive power, for if its power for such production were not already actual, it could never become so, and so were none at all. Inasmuch as necessary being can never alter, and consequently can never come actually to be, what it, already, is not (upon which account it is truly said, In aeternis posse &amp; esse sunt idem.) Wherefore in it, is nothing else but pure actuality, as profound and vast, as is the utmost possibility of all created or producible Being, i. e. It can be nothing other than it is, but can do all things (of which more hereafter.) It therefore stands opposed not only (more directly) to impossibility of Being (which is the most proper notion of no-Being) but some way, even to possibility also; That is the possibility of being any thing but what it is; as being every way complete, and perfectly full already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The living temple, or, A designed improvement of that notion that a good man is the temple of God</cite>, (London: John Starkey, 1675), pp 150-52.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb47c23da1" data-kw="">
<blockquote><p>First, ‘God’ (say they [Arminians]), ‘considering all mankind as fallen from that grace and favor in Adam where they were created, and excluded utterly from the attainment of salvation by virtue of the covenant of works which was at the first made with him, yet by his infinite goodness was inclined to desire the happiness of them all and every one, that they might be delivered from misery and be brought unto Himself, which inclination of his they call his universal love and antecedent will, whereby He would desirously have them all to be saved, out of which love He sends Christ.’ [Owen:] That God has any natural or necessary inclination by his goodness or any other property to do good to us or any of his creatures, we do deny: everything that concerns us is an act of his free will and good pleasure, and not a natural necessary act of his Deity, as shall be declared. Secondly, the ascribing an antecedent conditional will unto God, whose fulfilling and accomplishment should depend on any free contingent act or work of ours, is injurious to his wisdom, power and sovereignty, and cannot well be excused from blasphemy, and is contrary to Rom. 9:19, ‘Who hath resisted his will? I say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu</cite>, … (London: W.W., 1648), bk. 2, ch. 4, pp. 91-92</span></figcaption>

<blockquote><p>Surely it is easy to observe that we are too fearful of some distinctions which carry in them a jealousy of former abuse and yet both may well be admitted in a good sense and serve for excellent purpose. As that (if we labor for our better understanding to explicate the one will of God by several notions of the antecedent and consequent will of God, which Paulus Ferrius, a reformed schoolman, approves by the suffrages of Zanchi, Polanus and other orthodox divines, to look at it a little running, as that which gives no small light to the business in hand. As there is wont to be conceived a double knowledge of God, the one of mere understanding whereby He foreknows all things that may be; the other of vision, or approbation, whereby he foreknows that which undoubtedly shall be, so there is a double will to be conceived of God answerable to this double knowledge: an antecedent will, which answers to the mere understanding whereby God wills every possible good without the consideration of the adjuncts appertaining to it; a consequent will answering to the knowledge of approbation, whereby (all circumstances prepensed) God does simply will this or that particular event as simply good to be and which is there upon impossible not to be. The one of these is a will of complacency, the other of prosecution; the one is as it were an optative will, the other an absolute. In the first of these God would have all to be saved because it is in a sort good in itself, in that the nature of man is ordainable to life and man has by God common helps seriously offered for the attaining thereof; neither can we think it other than pleasing to God that his creatures should both do well and fare well. In the latter He wills some of all to be saved, as not finding it simply good (all circumstances considered) to extend this favor to all; this appears in the effect, for if God absolutely willed it, it could not fail of being, neither does ought hinder, but these two may stand well together, a complacence in the blessedness of his creature and a will of his smart. For both that which we will in one regard, we may not will in another, as we may wish a felon to live as a man, to die as a malefactor; and besides, the possibility of one opposite does not hinder the act of another, as he that has power to run perhaps does sit or lie. Learned Zanchi methinks gives at once a good satisfaction as to this doubt (Of the Nature of God, 1.3, ch. 4); so to the ordinary exception whereat many have stumbled, of the pretended mockage of God’s invitations, where He means not, as some have misconceived, a serious effect. In the parable of the Gospel (says he) those which were first bidden to the marriage feast and came not, were they therefore mocked by the king because he only signified unto them what would be acceptable unto him and what was their duty to perform? and yet he did not command them to be compelled as he did the second guests to come to the wedding? Surely no, yet in the mean time, there was not the same will of the king in the inviting of the first and of the second, for in these second there was an absolute will of the king, that they should without fail come; and therefore he effectually caused them to come. In the former he only signified, and that fairly and ingenuously, what would be pleasing to him: Thus he. The entertainment of this one distinction, which has the allowance of orthodox and learned authors to be free from any danger or inconvenience, would mitigate this strife since it is that which the opponents contend for, which the defendents may yield without any sensible prejudice.</p></blockquote>

+neither+can+we+think+it+other+than+pleasing+to+God+that+his+creatures+should+both+do+well+and+fare+well.+In+the+latter+He+wills+some+of+all+to+be+saved%2C+as+not+finding+it+simply+good+%28all+circumstances+considered%29+to+extend+this+favor+to+all%3B+this+appears+in+the+effect%2C+for+if+God+absolutely+willed+it%2C+it+could+not+fail+of+being%2C+neither+does+ought+hinder%2C+but+these+two+may+stand+well+together%2C+a+complacence+in+the+blessedness+of+his+creature+and+a+will+of+his+smart.+For+both+that+which+we+will+in+one+regard%2C+we+may+not+will+in+another%2C+as+we+may+wish+a+felon+to+live+as+a+man%2C+to+die+as+a+malefactor%3B+and+besides%2C+the+possibility+of+one+opposite+does+not+hinder+the+act+of+another%2C+as+he+that+has+power+to+run+perhaps+does+sit+or+lie.+Learned+Zanchi+methinks+gives+at+once+a+good+satisfaction+as+to+this+doubt+%28Of+the+Nature+of+God%2C+1.3%2C+ch.+4%29%3B+so+to+the+ordinary+exception+whereat+many+have+stumbled%2C+of+the+pretended+mockage+of+God%E2%80%99s+invitations%2C+where+He+means+not%2C+as+some+have+misconceived%2C+a+serious+effect.+In+the+parable+of+the+Gospel+%28says+he%29+those+which+were+first+bidden+to+the+marriage+feast+and+came+not%2C+were+they+therefore+mocked+by+the+king+because+he+only+signified+unto+them+what+would+be+acceptable+unto+him+and+what+was+their+duty+to+perform%3F+and+yet+he+did+not+command+them+to+be+compelled+as+he+did+the+second+guests+to+come+to+the+wedding%3F+Surely+no%2C+yet+in+the+mean+time%2C+there+was+not+the+same+will+of+the+king+in+the+inviting+of+the+first+and+of+the+second%2C+for+in+these+second+there+was+an+absolute+will+of+the+king%2C+that+they+should+without+fail+come%3B+and+therefore+he+effectually+caused+them+to+come.+In+the+former+he+only+signified%2C+and+that+fairly+and+ingenuously%2C+what+would+be+pleasing+to+him%3A+Thus+he.+The+entertainment+of+this+one+distinction%2C+which+has+the+allowance+of+orthodox+and+learned+authors+to+be+free+from+any+danger+or+inconvenience%2C+would+mitigate+this+strife+since+it+is+that+which+the+opponents+contend+for%2C+which+the+defendents+may+yield+without+any+sensible+prejudice.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+The+Shaking+of+the+Olive+Tree%2C+the+Remaining+Works+of+that+incomparable+prelate+Joseph+Hall%2C+%E2%80%A6+%28London%3A+Cadwell%2C+1660%29%2C+Via+Media%3A+the+Way+of+Peace+in+the+Five+Busy+Articles+commonly+known+by+the+name+of+Arminius%2C+Of+the+Fifth+Article+of+Perseverance%2C+pp.+376-78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a1212302c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a1212302c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Surely%20it%20is%20easy%20to%20observe,may%20yield%20without%20any%20sensible%20prejudice&amp;text=Surely%20it%20is%20easy%20to%20observe%20that%20we&amp;text=the%20defendents%20may%20yield%20without%20any%20sensible%20prejudice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The object of divine love is God. God is good, and good is amiable. God is all good: there is none good but one, that is God. God is essentially good, goodness in the abstract; he is infinitely excellent, he is all perfection. In this one attribute all the rest of the attributes of God are included, and this in each of them.

However the Scriptures, speaking to our capacities, describe God and his glorious attributes in several and distinct notions, yet in each one all are included; each one is infinite, and infinite perfection is essentially all perfection. God is originally good, the fountain and pattern of all that moral good which is in his creatures; he is bountiful and gracious, ready to do them good; and he is the felicitating end, or the final blessedness of the soul.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3c413d8d35" data-kw="">
<blockquote><p>Self-righteous people, who think that they are to be saved by their own works, have no business to come to the Lord’s Table. Strange as it may sound at first, these persons are the least qualified of all to receive the Sacrament. They may be outwardly correct, moral and respectable in their lives, but so long as they trust in their own goodness for salvation, they are entirely in the wrong place at the Lord’s Supper.

For what do we declare at the Lord’s Supper? We publicly profess that we have no goodness, righteousness, or worthiness of our own, and that all our hope is in Christ. We publicly profess that we are guilty, sinful, and corrupt, and naturally deserve God’s wrath and condemnation. We publicly profess that Christ’s merit and not ours, Christ’s righteousness and not ours, is the alone cause why we look for acceptance with God. Now what has a self-righteous man to do with an ordinance like this? Clearly nothing at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), p. 137.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e940f435b9" data-kw="">
<blockquote><p>WHAT THE LORD’S SUPPER IS.

The Lord’s Supper is an holy and heavenly banquet, in which the faithful Christians, besides the corporal earing of the bread, and the outward drinking of the wine, do spiritually through faith both eat the body of Christ and drink his blood, unto the confirmation of their faith, the comfort of their conscience, and the salvation of their souls. …

Secondly, to stir us up unto thanksgiving, while we consider how precious, great, and inestimable benefits we have received of God the Father by the death of his Son; as deliverance from Satan, freedom from the curse of the law, forgiveness of sins, the favour and good-will of God, quietness of conscience, the Holy Ghost, righteousness, victory against sin, death, and hell, salvation, and finally everlasting life.

That we should not be unthankful, but rather joyfully brast out into all kind of spiritual praises, lauding and magnifying God the Father for these his most high and singular free gifts, the Lord Christ did institute this holy supper. Therefore is it called of the ancient doctors Sacramentum Eucharistæ: “The sacrament of thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 508-09.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-4808383cac" data-kw="">
<blockquote><p>The proofs which are alleged [for Christ’s physical presence in communion] from the omnipotency of God, do infer no corporal presence of Christ in the Supper. Not the First; because the omnipotency of God excludeth, both things contrary to his nature, and things contradictory; and not to be able to do those things, is not a point of weakness, but of infinite power, and constancy. Not the Second; because his first apparition was heavenly, which nothing furthereth the presence of Christ on earth: The second, was in the night, which appeared not to the eyes, but to the mind.

Not the Third; because the Fathers treated, either of the presence of Christ, as touching his person, as Chrysostom; or of the Sacramental presence of his body in the Supper, as Ambrose; or of the effect of the eating of his body, as Cyril, and Theophilact: or lastly, they spake Hyperbolically, as Augustine.

Not the Fourth; because, to reason from the divine nature, to the human, and from the one part of man, which is spiritual, to the other, which is corporal, is even proportionally inconsequent. Not the Fifth; because it is one thing to treat of the mysteries, which go beyond Nature; but another thing of the miracles which overthrow nature. Not the Sixt; because of those things, which are equally united, the one cannot be any where else, where the other is not, or may not be; and to attribute to Christ two bodies equally united, were a monstrous thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved</cite>, trans. John Gawen (London: Francis Burton, 1610), 2.13, pp 430-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-0f2836f600" data-kw="">
<blockquote><p>For since false teachers and heretics in regard of the spiritualness of their sin are the worst of evil doers, and such as work abomination in the Israel of God, and there is no particular laws in the New Testament for bodily coercing of Sorcerers, Adulterers, Thieves, Traitors, false witnesses, who but speak lies against the good name of their neighbour, not against the name of God, nor against Sodomites, defilers of their bodies with beasts, perjured persons, Covenant breakers, liars &amp;.c. What reason in nature can there be to punish the one, and not the other? for it may with as good colour of reason be said, that all the Laws in the old Testament, for drawing of the sword against Sodomites, Adulterers and such like, were typical and temporary, and are done away now in Christ, for Christ will have these converted in as spiritual a way by the only power of the word of God as the other and no where in any express law in the New Testament doth God command to use the bloody sword against them, more than against blasphemers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A free disputation against pretended liberty of conscience</cite>, (London, 1649), pp 57-8.</span></figcaption>

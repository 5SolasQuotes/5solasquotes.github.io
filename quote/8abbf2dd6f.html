<main class="wrap"><figure class="quote" id="q-8abbf2dd6f" data-kw="">
<blockquote><p>Then again, inasmuch as, in an infinitely greater degree, it is God’s not to sin, shall we therefore venture to say that He is able both to sin and to avoid sin? God forbid that we should ever say that He is able to sin! For He cannot, as foolish persons suppose, therefore fail to be almighty, because He is unable to die, or because He cannot deny Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Nature and Grace, Against Pelagius</cite>, (415), 57 in NPNF1, 5: 140.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fd151550ce" data-kw="">
<blockquote><p>Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories… Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’</cite>, (2022) at Public Discourse</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-ebe0ac0578" data-kw="">
<blockquote><p>There is no necessity for any other proof of native depravity, than the aversion, which children early manifest to religious instruction and to spiritual exercises. From this cause it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>

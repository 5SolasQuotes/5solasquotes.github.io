<main class="wrap"><figure class="quote" id="q-045f424b42" data-kw="">
<blockquote><p>The Apostle makes but two Covenants, 1. of works, and 2. of grace, and this of grace twofold in the administration, viz. Old and New. Hebr. Chap. 8. Chap. 9. where the Apostle makes it his business to set down all the main differences between the old and new Testament-administration of the covenant of grace: but never mentions this of the Anabaptists; that children of believers were to be signed with the 1. sign of the old, in the old Testament, and not with that of the New, in the new Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants.: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christi</cite>, (London: M. Simmons, 1646), p. 2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d733f2d51" data-kw="">
<blockquote><p>We may consider a visible Church either metaphysically or politically. It is one thing to consider men as living creatures endued with reason; another thing to consider them as magistrates, masters, fathers, children, servants, etc. So is it one thing to consider a visible Church as a society of men and women separated from the blind world by divine vocation [calling], and professing together the gospel of Jesus Christ; and another thing to consider it as a political body, in which the power of spiritual government and jurisdiction is exercised–some governing and some governed. These are very different considerations; for first, a visible Church being taken entitatively or metaphysically, her members do ordinarily communicate together in those holy things which fall under the power of order, which I may call sacra mystica [sacred, mystical rites]; but being taken politically, her members communicate together in such holy things as fall within the compass of the power of jurisdiction, which I may call sacra politica [sacred politics]. Secondly, infants under age, being initiated in baptism, are actually members of the Church in the former consideration, but potentially only in the latter; for they neither govern, nor yet have the use of reason to be subject and obedient to those that do govern.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, … (1641; Edinburgh, 1646), 2nd part, ch. 11, p. 62</span></figcaption>

online.com/infant-baptism/#:~:text=We%20may%20consider%20a%20visible%20Church,obedient%20to%20those%20that%20do%20govern&amp;text=We%20may%20consider%20a%20visible%20Church%20either%20metaphysically&amp;text=subject%20and%20obedient%20to%20those%20that%20do%20govern" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-246d713917" data-kw="">
<blockquote><p>Then the minister continues, saying: Be mindful that God our savior wills all people to come to the knowledge of the truth through the only mediator, Jesus Christ, who handed himself over as a ransom for many. God also wills for us to join in many prayers, that we should arrive at the unity of faith and knowledge of the Son of God, our redeemer. Therefore we ask the Lord to grant faith to this little one, that the external baptism should take place internally through the Holy Spirit in [by means of?] the salvific water. Therefore, pray in this way: Almighty, eternal God, who through the flood, in accordance with your severe but just judgment, condemned the unbelieving world and saved, on the grounds of your immense mercy, faithful Noah’s eight; you who submerged hardened Pharaoh with all his people in the Red Sea, but then led your people Israel across with dry feet, a prefiguring of baptism — We beseech you through your immense mercy that you would deign to look mercifully upon your servant, [name], and kindle in his heart the light of faith, so as to be grafted into your Son, buried together with him in death, and also raised into a new life, in which he would eagerly follow your son in bearing his cross daily and cling to him in true faith, firm hope, and ardent love, so that for your sake, he could boldly despise this life, which is nothing other than death, and on the last day present himself fearlessly at the universal judgment of your Son. Through our Lord Jesus Christ, your Son, who lives and reigns with you in the unity of the Holy Spirit, God throughout all ages. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-lavater.html">Ludwig Lavater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rites &amp; Institutions of the Zurich Church</cite>, (1559)</span></figcaption>

2F246d713917.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/246d713917.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Then%20the%20minister%20continues%2C%20saying%3A%20Be,Spirit%2C%20God%20throughout%20all%20ages.%20Amen&amp;text=Then%20the%20minister%20continues%2C%20saying%3A%20Be%20mindful%20that&amp;text=the%20Holy%20Spirit%2C%20God%20throughout%20all%20ages.%20Amen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dae5e88ec1" data-kw="">
<blockquote><p>All ministers must be admonished to be more careful to instruct the ignorant than ready to satisfy their appetites; and more sharp in examination than indulgent, in admitting to that great mystery such as are ignorant of the use and virtue of the same. And therefore we think that the administration of the Table ought never to be without that examination pass before, especially of those whose knowledge is suspect. We think that none are apt to be admitted to that mystery who cannot formally say the Lord’s Prayer, the articles of the belief, and declare the sum of the law… Every master of household must be commanded either to instruct, or else cause [to] be instructed, his children, servants, and family, in the principles of the Christian religion; without the knowledge whereof ought none to be admitted to the Table of the Lord Jesus. For such as are so dull and so ignorant, that they can neither try themselves, neither yet know the dignity and mystery of that action, cannot eat and drink of that Table worthily. And therefore of necessity we judge it, that every year at least, public examination be had by the ministers and elders of the knowledge of every person within the church: to wit, that every master and mistress of household come themselves, and their family (so many as are come to maturity), before the ministers and elders, to give confession of their faith, and to answer to such chief points of religion as the ministers shall demand. Such as are ignorant in the articles of their faith; understand not, nor cannot rehearse the commandments of God; know not how to pray, neither whereinto their righteousness consists, ought not to be admitted to the Lord’s Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ninth Head, Concerning the Policy of the Church</cite></span></figcaption>

</figure><figure class="quote" id="q-6c2ab75214" data-kw="">
<blockquote><p>Now concerning baptism, baptize as follows: after you have reviewed all these things, baptize in the name of the Father and of the Son and of the Holy Spirit in running water. But if you have no running water, then baptize in some other water; and if you are not able to baptize in cold water, then do so in warm. But if you have neither, then pour water on the head three times in the name of the Father and Son and Holy Spirit. And before the baptism let the one baptizing and the who is to be baptized fast, as well as any others who are able. Also, you must instruct the one who is to be baptized to fast for one or two days beforehand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-didache.html">The Didache</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7 (early 2nd century) trans. Michael W. Holmes, The Apostolic Fathers: Greek Texts and English Translations, 3rd edn (Grand Rapids: Baker, 2007).</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5a088289f0" data-kw="">
<blockquote><p>It hath been pretended, the language and manner of these psalms are not suited to the spiritual nature of our gospel-worship. That, however, may as well be urged against the reading of them, as against the singing of them:

Nay, against the reading of a great part of the Old Testament in our Christian worship. It is certain many passages in the book of Psalms, or of other scripture-songs, are expressive of the exercises of faith, repentance, love, or the like graces, which still remain of the same form as under the Old Testament.

The predictions are either accomplished, and so may be sung to the honour of GOD’S mercy and faithfulness; or, if not accomplished, may be sung in the hopes [sic], that God will accomplish them in his time. The history of what God did for his Jewish servants and church, may be sung with admiration of his love, wisdom, power, and grace therein manifested. It is further to be considered, that much of what related to David, or the Jewish church, was typical of the character and concerns of Jesus Christ and the gospel-church; and so ought to be sung with special application thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David, in Metre: allowed by the authority of the General Assembly of the Church of Scotland, and of the Presbyterian Churches in</cite>, America. With notes exhibiting the connexion, explaining the sense, and for directing and animating devotion (Pittsburgh, 1812), v.</span></figcaption>

<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law.

11. The end of the First Commandement… He enjoins Himself to be worshipped and adored of us in the true practice of godliness.

12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>

<blockquote><p>That the services of domestic worship may be instrumental in subserving this high purpose, two things are indispensable;— they should be performed with scrupulous punctuality, and formality should be carefully avoided. No multiplicity or variety of engagements — no plea of inability for conducting devotional services — no backwardness, from the presence of servants or strangers, can be sustained as valid excuses for the occasional or frequent neglect of a duty, on which so much of the benefit or happiness of the family depends.

To limit family worship to one part of the day, and to omit it, at times, from the interruption of business or society, is to neglect Heaven’s standing institute and to postpone the spiritual welfare of the household to the trivial, fleeting interests of the world. It is, in fact, to substitute a human invention for God’s appointed ordinance, and to render the spiritual and eternal interests of a family subservient to mere worldly caprice or convenience.

Ability for duty is obtained in the way of diligently observing it, and never by neglecting it; and obstacles and interruptions will give way before those whose faces are towards God’s altar, and whose heartfelt purpose is that of the veteran Joshua — “As for me and my house, we will serve the Lord.” David might have pleaded multiplicity of engagements, and pressing public duties, as an excuse for neglecting family worship, on the day that he returned to “bless his house;” and the “father of the faithful” had doubtless many temptations, in his frequent journeyings, to omit at times the devotional exercises of the family.

But the saints of God have ever regarded their true interest, and the blessing of their households, as connected with seeking God’s face; and amidst difficulties and trials, they have considered daily domestic worship as at once the most valuable work in which the family could be employed, and as the most effectual means of promoting its genuine prosperity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Commendation of Abraham, or, Parental Duties; and the Blessing Resulting from their Faithful Performance</cite>, (Edinburgh: William Whyte &amp; Co., 1844), pp 61-63.</span></figcaption>

<blockquote><p>A. 3: And God’s prohibition, Deut. 12, of adding or diminishing, is not washed away so easily as your words would make men believe. You say, It reaches to the whole duty of man, and government of the Church, etc. Answer: There be some things in the duty of man and church-matters that God has left to man: To do those is no addition to God’s laws: But to do the like work that God by his Law has done, which He never left to man, seems to me the addition there forbidden: e.g. If men had made another Tabernacle, another ark of the Covenant, another holy vestment for Aaron, another sacrament like circumcision or the Passover, He that so reproved their worshiping in the high places would have reproved these.</p></blockquote>

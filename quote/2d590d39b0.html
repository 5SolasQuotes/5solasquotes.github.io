<main class="wrap"><figure class="quote" id="q-2d590d39b0" data-kw="">
<blockquote><p>But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-salkeld.html">John Salkeld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Paradise</cite>, … (London: Griffin, 1617), ch. 64, pp. 319-21 Salkeld (1576–1660) was born in England, studied with Jesuits in the university of Coimbra and in Portugal, but had become a protestant again living in England by the time of this work.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43f63abc46" data-kw="">
<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36.

535. Leigh, Treatise, II.xiii (p. 100).

536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker Academic, 2017), pp. 41-42</span></figcaption>

<blockquote><p>…why then did Christ here urge the testimony of John? Why, these things I say, that you may be saved. This He aimed at in all this discourse, to save not his own life, but the souls of others; He produced John’s testimony because, being one of themselves, it was to be hoped that they would hearken to it. Note, First, Christ desires and designs the salvation even of his enemies and persecutors. Secondly, the word of Christ is the ordinary means of salvation. Thirdly, Christ in his word considers our infirmities and condescends to our capacities, consulting not so much what it befits so great a prince to say as what we can bear, and what will be most likely to do us good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“…why then did Christ here urge the testimony of John? Why, these things I say, that you may be saved. This He aimed at in all this discourse, to save not his own life, but the souls of others; He produced John’s testimony because, being one of themselves, it was to be hoped that they would hearken to it. Note, First, Christ desires and designs the salvation even of his enemies and persecutors. Secondly, the word of Christ is the ordinary means of salvation. Thirdly, Christ in his word considers our infirmities and condescends to our capacities, consulting not so much what it befits so great a prince to say as what we can bear, and what will be most likely to do us good.”

<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753.

137. Unpublished MS sermon on Lk. 6:35.

138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743.

139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>

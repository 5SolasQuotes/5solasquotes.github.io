<main class="wrap"><figure class="quote" id="q-b496c1a657" data-kw="">
<blockquote><p>We must look to Paul&#x27;s design. He intends to shew that we have brought nothing to God, by which he might be laid under obligations to us; and he shews that even the good works which we perform have come from God. Hence it follows, that we are nothing, except through the pure exercise of his kindness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“We must look to Paul&#x27;s design. He intends to shew that we have brought nothing to God, by which he might be laid under obligations to us; and he shews that even the good works which we perform have come from God. Hence it follows, that we are nothing, except through the pure exercise of his kindness.”

— John Calvin, Commentaries on the Epistles to the Galatians and Ephesians, Ephesians 2:10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%20must%20look%20to%20Paul%27s%20design.%20He%20intends%20to%20shew%20that%20we%20have%20brought%20nothing%20to%20God%2C%20by%20which%20he%20might%20be%20laid%20under%20obligations%20to%20us%3B%20and%20he%20shews%20that%20even%20the%20good%20works%20which%20we%20perform%20have%20come%20from%20God.%20Hence%20it%20follows%2C%20that%20we%20are%20nothing%2C%20except%20through%20the%20pure%20exercise%20of%20his%20kindness.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Epistles%20to%20the%20Galatians%20and%20Ephesians%2C%20Ephesians%202%3A10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb496c1a657.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b496c1a657.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom41" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86e2524294" data-kw="">
<blockquote><p>Though we do good works, we do not found our salvation upon them; for we can do no work but what is polluted by our flesh, and also punishable; and although we could perform such works, still the remembrance of one sin is sufficient to make God reject them. Thus, then, we would always be in doubt, tossed to and fro without any certainty, and our poor consciences would be continually vexed if they relied not on the merits of the suffering and death of our Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/imperfection-of-believers-works.html">Imperfection of Believers&#x27; Works</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span></div>

</figure><figure class="quote" id="q-d163ded14a" data-kw="">
<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?”

— John Calvin, Institutes of the Christian Religion, 3.14.17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%20if%20we%20attend%20to%20the%20four%20kinds%20of%20causes%20which%20philosophers%20bring%20under%20our%20view%20in%20regard%20to%20effects%2C%20we%20shall%20find%20that%20not%20one%20of%20them%20is%20applicable%20to%20works%20as%20a%20cause%20of%20salvation.%20The%20efficient%20cause%20of%20our%20eternal%20salvation%20the%20Scripture%20uniformly%20proclaims%20to%20be%20the%20mercy%20and%20free%20love%20of%20the%20heavenly%20Father%20towards%20us%3B%20the%20material%20cause%20to%20be%20Christ%2C%20with%20the%20obedience%20by%20which%20he%20purchased%20righteousness%20for%20us%3B%20and%20what%20can%20the%20formal%20or%20instrumental%20cause%20be%20but%20faith%3F%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.14.17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd163ded14a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d163ded14a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-9c4add85b0" data-kw="">
<blockquote><p>They say, we are justified by works, as by causes thereof: we say, that we are justified by works as by signs and fruits of our justification before God, and no otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, on James 2:21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/justified-before-god-and-before-men.html">Justified before God and before men</a></span><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/works-as-evidence.html">Works as evidence</a></span><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>

— William Perkins, A Reformed Catholic, on James 2:21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+say%2C+we+are+justified+by+works%2C+as+by+causes+thereof%3A+we+say%2C+that+we+are+justified+by+works+as+by+signs+and+fruits+of+our+justification+before+God%2C+and+no+otherwise.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+on+James+2%3A21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c4add85b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c4add85b0.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" rel="noopener" target="_blank">Read it online · Internet Archive (1597 ed.)</a></div>
</figure><figure class="quote" id="q-e83ff2c72e" data-kw="">
<blockquote><p>Although hypocrites and other unregenerate men may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God, and estate of salvation (which hope of theirs shall perish): yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavoring to walk in all good conscience before him, may, in this life, be certainly assured that they are in the state of grace, and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.1</span></figcaption>

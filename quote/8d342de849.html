<main class="wrap"><figure class="quote" id="q-8d342de849" data-kw="">
<blockquote><p>In the first place, we may learn the great importance of ecclesiastical discipline, and of preserving it. in its scriptural purity and primitive vigour. Evangelical and vital religion cannot flourish generally or permanently in any church where this is neglected.

Discipline is to the church of Christ what a wall is to a city, when an enemy has taken the field. It serves the same purpose that a fence does to a garden: if it be broken down, or suffered to fall into disrepair, the boar from the forest, and the wild beast of the field, will enter, and devour all that is beautiful or productive within.

This is a subject which ought to come home with peculiar force to the consciences and feelings of all Christians dwelling in this favoured land. As marks of the true church, the reformers on the continent specified the pure preaching of the word, and administration of the sacraments; but, in addition to these, our reformers of Scotland, in their first Confession of Faith, described “discipline executed according to the word of God, as a certain and infallible sign of the true church.” The establishment of a scriptural and efficient discipline in the church of Scotland, at the very beginning of the Reformation, was her distinguishing glory, on account of which she was lauded and felicitated by foreigners, who desired to possess that blessing, but could not obtain it.

As the want of this ordinance of the church’s Head has produced the most mournful consequences abroad, so to the neglect or perversion of it at home may be ascribed, in a high degree, those corruptions as to faith, worship, and morals which have spread among ourselves, and which, more than once, have threatened to lay waste all our pleasant things. “Purity of doctrine and discipline,” says one of our religious patriots, who “stood in the gap” at a critical period of our ecclesiastical history, “are like the twins of Hippocrates, who always sickened and recovered at the same time, and at last twined and died together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>

<blockquote><p>2. Some sins may be of so heinous scandal, that if the person repent of them this day, his absolution and reception may be delayed till the scandal be removed:

1. Because the public good is to be preferred before any man’s personal good.

2. And the Churches, or enemies about, cannot so suddenly know of a man’s repentance. If they hear of a man’s murder, perjury or adultery today, and hear that he is absolved tomorrow, they will think that the Church consists of such, or that it makes very light of sin. Therefore the ancient Churches delayed and imposed penances, partly to avoid such scandal.

3. And partly because that some sins are so heinous that a sudden profession is not a sufficient evidence of repentance, unless there be also some evidence of contrition.</p></blockquote>

<blockquote><p>Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>

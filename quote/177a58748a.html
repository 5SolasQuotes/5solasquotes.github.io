<blockquote><p>Question: Did Zipporah do well in this act of circumcising her son? Answer:

1. This act is unparalleld in all sacred history, therefore hereupon dubious.

2. Though the law before this time doth not declare to us the administratour strictly, yet this worke was first committed to Abraham, and afterwards in the setlement of the Church to Ministers fit for the doing of it; and this sheweth what was right to be done in former times.

3. It was doubtles her husbands duty, and for her to do it in his presence could not belong to her but upon necessity, he being at that time by the opposition of Gods hand disinabled.

4. Doubtles here was infirmity in all, which though God pardoned, yet he did not allow.

5. This was a singular extraordinary act, therefore not to be drawn into imitation by any against Gods law of administration of baptism under the Gospel, as the Papists do. Learn hence: … D.

2. It is the wife’s duty and praise to save the husband from perishing under God’s hand. D.

3. Sacrament-administration may reconcile, where the neglect has provoked God. D.

4. God has born with weak and unfit hands in such administrations, but not to approve them. … D. 9. Forms of words are useful in the Sacraments, such as are sutable to their nature, but not arbitrary.</p></blockquote>

<blockquote><p>24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what he meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise, made him partaker of the sacrament. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly. If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to Him (Eze. 16:20; 23:37) For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and fallacious. In that view, Paul says that the gentiles, so long as they were plunged in idolatry, were strangers to the covenant (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellowship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism. To this we must refer the narrative of the evangelist, that those who were baptized by John confessed their sins (Mt. 3:6). This example, we hold, ought to be observed in the present day. Were a Turk to offer himself for baptism, we would not at once perform the rite without receiving a confession which was satisfactory to the Church.</p></blockquote>

<blockquote><p>First, their ecclesiasticall errors, such as peculiarly concern the doctrine or discipline of the Church are: First, that Christ took not flesh from the Virgin Mary, but that he passed through her as the sun beams do through glass, or rain through a spout. Secondly, that there is no original sin. Thirdly, that children ought not to be baptized. Fourthly, that such as have been baptized in their infancy ought to be re-baptized when they come to years of discretion. Fifthly, that lay-people may preach and administer the sacraments… Sixthly, that men have free will, not only in natural and moral, but also in spiritual actions. Seventhly, that absolution and the church-peace ought to be denied to such who are fallen into any grievous sin; yea, though they repent of it. Eighthly, that Luther’s doctrine is worse than the Pope’s. Secondly, their politicall errors, or in matter of state, are: First, that the people may depose their magistrates and chief rulers… Secondly, that a Christian with a good conscience may not take upon him, or bear the office of a magistrate, or keep any court of justice. Thirdly, that none may administer an oath to another. Fourthly, that no malefactors ought to be put to death. Thirdly, their economical errors [about the family] are: First, that no man has a propriety in his goods, but that all things ought to be held in common. Secondly, that it is lawful to have more wives than one at once. Thirdly, that a man may put away his wife if she differ from him in point of religion, and be not of their sect. … All the errors of the Anabaptists are of two sorts: First, such as they hold in common with other heretics. Secondly, such as are peculiar to their sect. First, concerning the common errors [not mentioned above]… First, with the Millenaries and their joint issue is, that Christ before the day of judgement shall come down from Heaven, and reign with the saints upon earth a thousand years; in which time they shall destroy all the wicked, binding their kings in chains, and their nobles in links of iron. … Thirdly, with the Donatists and their joynt issue is that in the true church there are no scandals, or lewd and vicious livers; that the church of Christ is confined to their sect; that we ought to separate from all assemblies of Christians wherein there are any abuses or scandals, yea, though the church allows them not, but seeks to reform them; that all such as have been baptized by any other than those of their sect, ought to be rebaptized. … Seventhly, with the Enthusiasts and their joint issue is that the Scripture is not our only rule of faith and manners, but that God reveals his will to his children at this day by visions and dreams… … Ninthly, with the Arminians and their joint issue is, that there is no original sin, or at least, that none is damned for it alone; that election is upon foreseen faith and repentance; that God gives all men sufficient grace to be saved; that man has free-will of himself either to accept or refuse God’s grace; that Christ died indifferently for all; that a true beleever, who is in the state of grace, may fall away totally and finally. Tenthly, with the Brownists or Barrowists and their joint issue is, that there ought to be a parity in the church… that in regard of these and such like abuses and corruptions [in ceremonies and governemnt] the church of England is no true Church of Christ, and consequently, that all that have a care of their soules must of necessity separate from her. Eleventhly, with a peculiar sect, called the Separati and their joint issue is, that no Christian may go to law, or in any case to right himself by arms or violent means. Secondly, such [errors] as are peculiar to their sect, and these are six: … Thirdly, that there ought to be no set form of Liturgy or prayer by the book, but only by the Spirit. Fourthly, that there ought to be no distinction by the Word of God between the clery and the laity, but that all who are gifted may preach the Word and administer the sacraments. Fifthly, that it is not lawful to take an oath at all, no, not though it be demanded by the magistrate…</p></blockquote>

hich time they shall destroy all the wicked, binding their kings in chains, and their nobles in links of iron. … Thirdly, with the Donatists and their joynt issue is that in the true church there are no scandals, or lewd and vicious livers; that the church of Christ is confined to their sect; that we ought to separate from all assemblies of Christians wherein there are any abuses or scandals, yea, though the church allows them not, but seeks to reform them; that all such as have been baptized by any other than those of their sect, ought to be rebaptized. … Seventhly, with the Enthusiasts and their joint issue is that the Scripture is not our only rule of faith and manners, but that God reveals his will to his children at this day by visions and dreams… … Ninthly, with the Arminians and their joint issue is, that there is no original sin, or at least, that none is damned for it alone; that election is upon foreseen faith and repentance; that God gives all men sufficient grace to be saved; that man has free-will of himself either to accept or refuse God’s grace; that Christ died indifferently for all; that a true beleever, who is in the state of grace, may fall away totally and finally. Tenthly, with the Brownists or Barrowists and their joint issue is, that there ought to be a parity in the church… that in regard of these and such like abuses and corruptions [in ceremonies and governemnt] the church of England is no true Church of Christ, and consequently, that all that have a care of their soules must of necessity separate from her. Eleventhly, with a peculiar sect, called the Separati and their joint issue is, that no Christian may go to law, or in any case to right himself by arms or violent means. Secondly, such [errors] as are peculiar to their sect, and these are six: … Thirdly, that there ought to be no set form of Liturgy or prayer by the book, but only by the Spirit. Fourthly, that there ought to be no distinction by the Word of God between the clery and the laity, but that all who are gifted may preach the Word and administer the sacraments. Fifthly, that it is not lawful to take an oath at all, no, not though it be demanded by the magistrate…”

— Daniel Featley, The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged… (London, 1645), Ch. 2, ‘Of the Errors of the Anabaptists, both common to other sects, and those which are peculiarly their own’, pp. 28-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+their+ecclesiasticall+errors%2C+such+as+peculiarly+concern+the+doctrine+or+discipline+of+the+Church+are%3A+First%2C+that+Christ+took+not+flesh+from+the+Virgin+Mary%2C+but+that+he+passed+through+her+as+the+sun+beams+do+through+glass%2C+or+rain+through+a+spout.+Secondly%2C+that+there+is+no+original+sin.+Thirdly%2C+that+children+ought+not+to+be+baptized.+Fourthly%2C+that+such+as+have+been+baptized+in+their+infancy+ought+to+be+re-baptized+when+they+come+to+years+of+discretion.+Fifthly%2C+that+lay-people+may+preach+and+administer+the+sacraments%E2%80%A6+Sixthly%2C+that+men+have+free+will%2C+not+only+in+natural+and+moral%2C+but+also+in+spiritual+actions.+Seventhly%2C+that+absolution+and+the+church-peace+ought+to+be+denied+to+such+who+are+fallen+into+any+grievous+sin%3B+yea%2C+though+they+repent+of+it.+Eighthly%2C+that+Luther%E2%80%99s+doctrine+is+worse+than+the+Pope%E2%80%99s.+Secondly%2C+their+politicall+errors%2C+or+in+matter+of+state%2C+are%3A+First%2C+that+the+people+may+depose+their+magistrates+and+chief+rulers%E2%80%A6+Secondly%2C+that+a+Christian+with+a+good+conscience+may+not+take+upon+him%2C+or+bear+the+office+of+a+magistrate%2C+or+keep+any+court+of+justice.+Thirdly%2C+that+none+may+administer+an+oath+to+another.+Fourthly%2C+that+no+malefactors+ought+to+be+put+to+death.+Thirdly%2C+their+economical+errors+%5Babout+the+family%5D+are%3A+First%2C+that+no+man+has+a+propriety+in+his+goods%2C+but+that+all+things+ought+to+be+held+in+common.+Secondly%2C+that+it+is+lawful+to+have+more+wives+than+one+at+once.+Thirdly%2C+that+a+man+may+put+away+his+wife+if+she+differ+from+him+in+point+of+religion%2C+and+be+not+of+their+sect.+%E2%80%A6+All+the+errors+of+the+Anabaptists+are+of+two+sorts%3A+First%2C+such+as+they+hold+in+common+with+other+heretics.+Secondly%2C+such+as+are+peculiar+to+their+sect.+First%2C+concerning+the+common+errors+%5Bnot+mentioned+above%5D%E2%80%A6+First%2C+with+the+Millenaries+and+their+joint+issue+is%2C+that+Christ+before+the+day+of+judgement+shall+come+down+from+Heaven%2C+and+reign+with+the+saints+upon+earth+a+thousand+years%3B+in+which+time+they+shall+destroy+all+the+wicked%2C+binding+their+kings+in+chains%2C+and+their+nobles+in+links+of+iron.+%E2%80%A6+Thirdly%2C+with+the+Donatists+and+their+joynt+issue+is+that+in+the+true+church+there+are+no+scandals%2C+or+lewd+and+vicious+livers%3B+that+the+church+of+Christ+is+confined+to+their+sect%3B+that+we+ought+to+separate+from+all+assemblies+of+Christians+wherein+there+are+any+abuses+or+scandals%2C+yea%2C+though+the+church+allows+them+not%2C+but+seeks+to+reform+them%3B+that+all+such+as+have+been+baptized+by+any+other+than+those+of+their+sect%2C+ought+to+be+rebaptized.+%E2%80%A6+Seventhly%2C+with+the+Enthusiasts+and+their+joint+issue+is+that+the+Scripture+is+not+our+only+rule+of+faith+and+manners%2C+but+that+God+reveals+his+will+to+his+children+at+this+day+by+visions+and+dreams%E2%80%A6+%E2%80%A6+Ninthly%2C+with+the+Arminians+and+their+joint+issue+is%2C+that+there+is+no+original+sin%2C+or+at+least%2C+that+none+is+damned+for+it+alone%3B+that+election+is+upon+foreseen+faith+and+repentance%3B+that+God+gives+all+men+sufficient+grace+to+be+saved%3B+that+man+has+free-will+of+himself+either+to+accept+or+refuse+God%E2%80%99s+grace%3B+that+Christ+died+indifferently+for+all%3B+that+a+true+beleever%2C+who+is+in+the+state+of+grace%2C+may+fall+away+totally+and+finally.+Tenthly%2C+with+the+Brownists+or+Barrowists+and+their+joint+issue+is%2C+that+there+ought+to+be+a+parity+in+the+church%E2%80%A6+that+in+regard+of+these+and+such+like+abuses+and+corruptions+%5Bin+ceremonies+and+governemnt%5D+the+church+of+England+is+no+true+Church+of+Christ%2C+and+consequently%2C+that+all+that+have+a+care+of+t <blockquote><p>Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’</p></blockquote>

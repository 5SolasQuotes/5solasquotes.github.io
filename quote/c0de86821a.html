<blockquote><p>IV. We must observe that the right of God (as far as regards creatures) is either of dominion (which includes the right of possessing, disposing and using creatures, as a lord of proprietor, who is able to use and enjoy his own property at pleasure); or of government (which properly refers to rational creatures whom he governs as ruler and legislator; to whom belong legislation, judgment and execution, so as to have the power of enacting laws, of judging in accordance with them and of carrying out the sentence pronounced).

This right is normally distinguished into natural and positive: the former, according to which he must prescribe to rational creatures their duties (the opposites of which imply a contradiction because they are not founded simply on the divine will, but on the perfection, eminence, holiness and rectitude of the divine nature); the latter, however, according to which he freely and from his mere good-pleasure prescribes such duties as he either was able not to prescribe, or the opposites of which antecedently to the open intimation of the divine will, he might have willed and enjoined without any prejudice to his perfection and holiness, and without embarrassing contradiction.

V. Therefore, whatever things have so close a connection with the nature, perfection, eminence and holiness of God (that he cannot command their opposites without prejudice to his nature and which involve a contradiction as commanded) belong to that natural right. It is certain that God cannot deny himself, or do or command anything contrary to his own holiness and perfection. So God cannot command the hatred of himself, blasphemy and lying; or relieve man from the dependence and obedience due to him because this would be to say that God is not God (i.e., the first cause and absolute Lord). …

VII. From this distinction of the divine right flows the distinction of the precepts (to be held here). For those things that have so close a connection with the nature of God that (the rational and governable creature being posited) he cannot but be bound to do them (such as he should subject himself to and reverence God; should have him for his one only God; and the like), without controversy belong to natural right. But those which flow from the free good will of God and which he was perfectly free to establish or not establish, ought to be referred to positive right. …

XIV. Second, if all the precepts of the law are dispensable and founded only upon positive right, God was perfectly free to make or not make them; yea, he could even command the contrary without any repugnancy. In those things which are by nature indifferent (adiaphora), he who has the right to command has also the right to forbid and so command the opposite. Thus God on this hypothesis could not only give no law to the rational creature about loving and worshipping him, but could also lay down the contrary concerning hating and blaspheming him; not believing any god; or not believing him to be just, good, omnipotent and the like; not obeying him; worshipping strange gods, yea, even the Devil himself.

Thus the most horrible sins (hatred of God, atheism, blasphemy and the like) would become praiseworthy for the very reason that they would fall under the precept, their character would be changed and they would no longer be sins. The proposition of such monstrous absurdities is their own sufficient refutation. For who does not see that God cannot do such things without denying himself and doing violence to his own nature? For as he is true and holy, it is repugnant to his nature to command what is false and base. Now if he would command the hatred of himself (or atheism and idolatry), he would command dreadful and most base falsehoods against his own truth and holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.2.4, 5, 7, 14.</span></figcaption>

<blockquote><p>I answer that… Therefore, that toward which God has ordered the creature with regard to himself is said to be willed by him as by a first intention or by an antecedent will. But when a creature is impeded from this end because of its defect, God still fulfills in it the goodness of which it is capable; and this pertains, as it were, to his second intention and it is called a consequent will. Thus, since God made all men for blessedness, he is said to will the salvation of all men by an antecedent will; but since some are turned against their own salvation, whom the order of his wisdom does not allow to come to salvation because of their defect, he fulfills in them what pertains to his goodness in another way, namely, condemning them by justice; so that whereas they do not attain to the first order of his will, they fall into the second; and while they do not carry out God’s will, the will of God is fulfilled in them. However, the very defect of sin by which someone is rendered worthy of punishment in the present or else the future is not willed by God either by an antecedent or a consequent will, but it is only permitted by him… and neither did he order him to salvation according to the order of predestination, which is the order of absolute will; rather, to the extent that this order is from himself, he gave to him a nature ordered to beatitude. Reply Obj. 1: Neither order nor distinction comes from the act of the will, but only from the things willed.</p></blockquote>

<blockquote><p>The Psalmist’s expression in the eyes of the Lord, are very pregnant to our purpose. Here is a description of eternity, proving that God seeth all things with one intuitive cast of his eye, and that although to us things are present, past and to come, yet to God all things are present, and although we are not able to reach this with our understanding, no more then a pigmy the Pyramids, yet we must rest more upon this Scripture assertion, then our own understanding, Quicquid de Deo dici (we may add cogitari) potest, eo ipso est indig∣num quia dici (cogitari) potest: and again dignè Deum aestimamus, dum inaestimabilm dicimus.

The Schoolmen dispute, whether those things which God did once know, he still knoweth, as for example, God once knew that Christ was to die, but now it is not true, that he is to die; and their resolution is, that we cannot properly say, God begins to know what he did, or ceaseth to know what he did, but rather that the thing it self beginneth to be known, or ceaseth to be known, so that the change is not in respect of God’s knowing, but the thing known, as when I see the Sun, and afterwards it is hid in the cloud, the change is not in my eye, but in the Sun; Hence they also resolve, that God knoweth all things simul together, that his knowledge is invariable, that it admitteth not of increase or decrease, that all things are present to him, and that as the Sun is always in actu lucendi, so God in actu intelligendi …</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Psalmist’s expression in the eyes of the Lord, are very pregnant to our purpose. Here is a description of eternity, proving that God seeth all things with one intuitive cast of his eye, and that although to us things are present, past and to come, yet to God all things are present, and although we are not able to reach this with our understanding, no more then a pigmy the Pyramids, yet we must rest more upon this Scripture assertion, then our own understanding, Quicquid de Deo dici (we may add cogitari) potest, eo ipso est indig∣num quia dici (cogitari) potest: and again dignè Deum aestimamus, dum inaestimabilm dicimus.

The Schoolmen dispute, whether those things which God did once know, he still knoweth, as for example, God once knew that Christ was to die, but now it is not true, that he is to die; and their resolution is, that we cannot properly say, God begins to know what he did, or ceaseth to know what he did, but rather that the thing it self beginneth to be known, or ceaseth to be known, so that the change is not in respect of God’s knowing, but the thing known, as when I see the Sun, and afterwards it is hid in the cloud, the change is not in my eye, but in the Sun; Hence they also resolve, that God knoweth all things simul together, that his knowledge is invariable, that it admitteth not of increase or decrease, that all things are present to him, and that as the Sun is always in actu lucendi, so God in actu intelligendi …”

— Anthony Burgess, The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London, (2nd edn, London: Tho. Underhill, 1651), p. 92.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Psalmist%E2%80%99s+expression+in+the+eyes+of+the+Lord%2C+are+very+pregnant+to+our+purpose.+Here+is+a+description+of+eternity%2C+proving+that+God+seeth+all+things+with+one+intuitive+cast+of+his+eye%2C+and+that+although+to+us+things+are+present%2C+past+and+to+come%2C+yet+to+God+all+things+are+present%2C+and+although+we+are+not+able+to+reach+this+with+our+understanding%2C+no+more+then+a+pigmy+the+Pyramids%2C+yet+we+must+rest+more+upon+this+Scripture+assertion%2C+then+our+own+understanding%2C+Quicquid+de+Deo+dici+%28we+may+add+cogitari%29+potest%2C+eo+ipso+est+indig%E2%88%A3num+quia+dici+%28cogitari%29+potest%3A+and+again+dign%C3%A8+Deum+aestimamus%2C+dum+inaestimabilm+dicimus.%0A%0AThe+Schoolmen+dispute%2C+whether+those+things+which+God+did+once+know%2C+he+still+knoweth%2C+as+for+example%2C+God+once+knew+that+Christ+was+to+die%2C+but+now+it+is+not+true%2C+that+he+is+to+die%3B+and+their+resolution+is%2C+that+we+cannot+properly+say%2C+God+begins+to+know+what+he+did%2C+or+ceaseth+to+know+what+he+did%2C+but+rather+that+the+thing+it+self+beginneth+to+be+known%2C+or+ceaseth+to+be+known%2C+so+that+the+change+is+not+in+respect+of+God%E2%80%99s+knowing%2C+but+the+thing+known%2C+as+when+I+see+the+Sun%2C+and+afterwards+it+is+hid+in+the+cloud%2C+the+change+is+not+in+my+eye%2C+but+in+the+Sun%3B+Hence+they+also+resolve%2C+that+God+knoweth+all+things+simul+together%2C+that+his+knowledge+is+invariable%2C+that+it+admitteth+not+of+increase+or+decrease%2C+that+all+things+are+present+to+him%2C+and+that+as+the+Sun+is+always+in+actu+lucendi%2C+so+God+in+actu+intelligendi+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+true+doctrine+of+justification+asserted+and+vindicated%2C+from+the+errors+of+Papists%2C+Arminians%2C+Socinians%2C+and+more+especially+Antinomians+in+XXX+lectures+preached+at+Lawrence-Jury%2C+London%2C+%282nd+edn%2C+London%3A+Tho.+Underhill%2C+1651%29%2C+p.+92.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3ac8d1b5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d3ac8d1b5e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/09/anthony-burgess-on-gods-eternal-knowledge/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion, the faith of Judas the traitor, which nevertheless He by no means willed or decreed by the will of good pleasure since such things never happen in the nature of things… the object of the will of sign or approving of God, is that which is morally good and honest, but of the disapproving, what is unjust and evil: whether it happen in the nature of things, or not… Thus God willed and commanded the repentance of Cain, but it by no means follows therefore Cain repents, because the event of the thing or non-event of the thing is badly, and by no art of logic concluded from the will of sign or approving… the commandment of God does not signify to us the will of God about such an event; but only the will of God about such moral equity of the thing. … as far as pertains to the essence of the will of sign, God equally approves with moral complacency the final obedience of Judas the traitor, as the obedience of Peter the apostle:</p></blockquote>

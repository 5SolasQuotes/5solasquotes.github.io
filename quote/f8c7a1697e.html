<main class="wrap"><figure class="quote" id="q-f8c7a1697e" data-kw="">
<blockquote><p>When the whole body of the Church is spoken of, Christ is brought forward conspicuously so as to include all the children of God. We hear what Paul says: “The promises were given to Abraham and to his seed. He saith not, And to seeds, as of many, but as of one, And to thy seed, which is Christ.” (Gal. iii. 16.)

He does not include the whole multitude of children who were descended from Abraham himself according to the flesh, seeing that all were not partakers of the blessing. Ishmael was rejected, Esau was a reprobate, and many others were cut off. When the people were rescued from Babylon, but a small remnant came out; for the greater part rejected God’s astonishing kindness. Where then was “the seed?” In Christ, who is the Head, and contains in himself the rest of the members; for in him is joined and bound by an indissoluble bond all the seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Fourth</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 8a: 11.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d7bd346a7" data-kw="">
<blockquote><p>Notwithstanding of all the multiplicity of Popish orders, yet Peter Lombard (pt. 4, distinction 4) treading the vestiges of the primitive simplicity, did observe that the apostles left only two sacred orders to be perpetual in the Church, the order of deacons and the order of elders. The administration of deacons is exercised about things bodily. The administration of elders about things spiritual. The former about the goods: the latter about the government of the Church. Now elders are of three sorts: 1. Preaching Elders, or Pastors, 2. Teaching Elders or Doctors, 3. Ruling Elders. All these are elders, because they have voice in presbyteries and all assemblies of the Church, and the government of the Church is incumbent to them all: nor only to the pastor and elder, but to the doctor also. The bishop of Dune, in his Examen conjurationis Scoticae [‘Examination of the Scottish Conjuration’], p. 35, alleges that our Church of Scotland did never yet determine whether doctors and deacons have right of voicing in the consistories and assemblies of the Church. But had he read our book of Policy, he might have found that it excludes deacons from being members of presbyteries and assemblies, ch. 8, but admits doctors into the same, ch. 5. The doctor being an elder, as said is, should assist the pastor in the government of the Kirk and concur with the elders, his brethren, in all assemblies, by reason the interpretation of the Word, which is [the] only judge in ecclesiastical matters, is committed to his charge. But they differ in that the pastor labors in the Word of exhortation, that is, by the gift of wisdom, applies the Word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labours in the Word of doctrine, that is, without such applications as the pastor uses, by simple teaching he preserves the truth and sound interpretation of the Scriptures against all heresy and error. The ruling elder does neither of these, but labours in the government and policy of the Church only. The apostle has distinguished these three sorts of elders, 1 Tim. 5:17, ‘Let elders that rule well be counted worthy of double honour, especially they who labour in the Word and doctrine,’ where, as Beza notes, he distinguishes the Word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7-8, he distinguishes teaching from exhortation: and 1 Cor. 12:8 puts the Word of wisdom and the word of knowledge for two different things. Now beside those elders which labour in the Word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the Word nor doctrine, but in ruling well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, …. (Edinburgh: Bryson, 1641), ch. 2, pp. 8-10</span></figcaption>

<blockquote><p>he is led up to the throne of Saint Mark, to succeed him in piety, no less than in office; in the latter indeed at a great distance from him, in the former, which is the genuine right of succession, following him closely. For unity in doctrine deserves unity in office; and a rival teacher sets up a rival throne; the one is a successor in reality, the other but in name. For it is not the intruder, but he whose rights are intruded upon, who is the successor, not the lawbreaker, but the lawfully appointed, not the man of contrary opinions, but the man of the same faith; if this is not what we mean by successor, he succeeds in the same sense as disease to health, darkness to light, storm to calm, and frenzy to sound sense.</p></blockquote>

<blockquote><p>Q. What is his Prophetical office?

A. It is the first part of his mediation, whereby he is our Prophet, Doctor, or Apostle.

Q. How is he our Prophet, Doctor, or Apostle?

A. In that he hath opened the whole will of his Father, concerning all things necessary to salvation.

Q. How doth that appear?

A. By his own testimony, Joh. 15. 15. I call you no more servants, because the servant knoweth not what his master doth. But I call you friends, because all which I have heard of my Father, I have made known unto you.

Q. What learn you from thence?

A. What a foul error it is in then, that think that our Saviour Christ delivered not all things, pertaining to the instruction and government of his Church, but left them moreover to the traditions and inventions of men.

Q. What further?

A. That the Ministers of the Word should not utterly suppress in silence, any truth that Christ hath revealed. And that the people should content themselves with that which Christ hath taught, rejecting whatsoever else, the boldness of men shall obtrude upon them.

Q. Did his office of Doctor-ship then first begin, when he came into the world?

A. No: for he (at the first) opened his Fathers will unto us, by the ministry of his servants the Prophets: and after he came into the world, he opened the same doctrine more plainly and fully by the Apostles and Evangelists.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1bdd639fb1" data-kw="">
<blockquote><p>Although the Reformed Presbyterian Synod was initially cautiously supportive of what it saw as the good aspects of the 1859 Revival in Ulster, it seems fairly clear that by 1861 they had come to realise that the movement was deeply pernicious (we would have preferred it had they agreed with the PCI’s Isaac Nelson and William Hamilton and completely condemned the movement, but this is still a very strong statement against the fanaticism which manifested itself during the Year of delusion). Here is what the Irish Synod wrote to their American brethren:

The great religious excitement, or, as it has been called, “Revival,” which took place here during the Summer of 1859, was so conducted that we could take very little part therein. As a similar movement took place in your own country a short time previous, it is not necessary that we should now refer particularly to it. Though the whole religious community in the North of Ireland was for a time greatly agitated, our people for the most part kept entirely aloof from those scenes of dangerous and irrational excitement everywhere prevailing.

And now that matters have assumed very much of their wonted aspect, we have no doubt but the “Revival” was overruled by God for the quickening of many of His dear saints, and we hope also leading to the conversion of not a few souls to Christ: but the almost utter annihilation of the distinction between truth and error; the contempt cast upon the instituted ordinances of grace; the substitution of mere excitement and feeling for knowledge and genuine experimental religion; the enthusiasm and presumption engendered in self-styled “converts” and self-constituted preachers; the perversion and corruption of the worship of God, have produced effects which it will require a considerable length of time to counteract and remedy.

But whilst we thus easily discover and point out the evils connected with such “Revivals,” how much more important it is for us to endeavour to obtain a real revival of true religion among ourselves! A revival of religion in our own souls, in our families, in our congregations, and in our churches. Do we not need it? Let us, therefore, strive together in prayer for a more copious effusion of the Holy Spirit, that all sin, self-seeking, pride, formality, hypocrisy, and worldly-mindedness may be put away from us, and that we may be made more holy, more spiritually-minded, more zealous for the Divine glory, and more devoted to His service – that our churches may be more vital, active, and godly, “strengthening the things that remain, that are ready to die.” Let our mutual aim be, that by holy living we may recommend the truth unto others, causing our lights so to shine before men, that others seeing our good works may be led to glorify our Father in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian-synod-of-ireland.html">Reformed Presbyterian Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Hart and William McCarroll to American Synod, 18 April 1861’ in Covenanter</cite>, v, no. 8 (Aug. 1861), pp 214-15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e23ee680bb" data-kw="">
<blockquote><p>So may we say, can any man forbid bread and wine, that these should not receive the Lord’s Supper, which have received the Holy Ghost; and have in some degree all spiritual qualifications requisite in communicants. They have the word of promise, which is the greater; who can inhibit the sign which is the less? They are Mr. Geree his words for the baptism of infants. They are faederati, therefore they must be signati. It is Mr. Marshal’s argument upon the same subject; and mutatis mutandis applyable to our purpose. Perhaps you will say, you would willingly give believers their right, but prophane and scandalous persons will also intrude [into the Supper] who have no right: What if they do? If you have no power or authority from Christ to keep them back by yourself; If you have used the utmost of your power to erect an eldership in the congregation; if you have used your power of order to the utmost for keeping them back by exhortation, if you mourn for their intrusion, wherein are you to be blamed? Because they do wrong, will you do no right? And shall the saints be debarred their dues, because these wretches without your allowance, sieze upon what is undue, that unto which they have no right?</p></blockquote>

</figure><figure class="quote" id="q-4cf0dda483" data-kw="">
<blockquote><p>The ministry is for edification and not for destruction… God has told us that no positive duty is a duty at all times… He gives us all a charge to learn what this means, ‘I will have mercy and not sacrifice,’ which must needs import: I prefer mercy before sacrifice and would have no sacrifice which hinders mercy… as that according to God’s ordinary way of working, it were like to do more hurt than good; it were no duty at that time. Discipline is an ordinance of Christ: But if sound reason tell me that if I publicly call this man to repentance, or excommunicate him, it is like to do much hurt to the church and no good to him, it would be at that time no duty but a sin. As physic [medicine] must be forborne where the disease will but be exasperated by it. Therefore Christ bounds our very preaching and reproof with a ‘Shake off the dust off your feet as a testimony against them.’ And give not that which is holy to dogs, etc. when treading under foot and turning again and rending us, is likest to be the success, the wisdom of Christ and not that of the flesh only requires us to take it for no duty. This is to be observed by them that think that admonitions and excommunications, and exclusion from the sacrament must be used in all places and at all times alike, without respect to the end, come of it what will: Or that will tempt God by presuming that He will certainly either bless or at least justify their unseasonable and imprudent actions as if they were a duty at all times. To be either against the Scripture or against the end is a certain proof that an action is no duty, because no means.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The ministry is for edification and not for destruction… God has told us that no positive duty is a duty at all times… He gives us all a charge to learn what this means, ‘I will have mercy and not sacrifice,’ which must needs import: I prefer mercy before sacrifice and would have no sacrifice which hinders mercy… as that according to God’s ordinary way of working, it were like to do more hurt than good; it were no duty at that time. Discipline is an ordinance of Christ: But if sound reason tell me that if I publicly call this man to repentance, or excommunicate him, it is like to do much hurt to the church and no good to him, it would be at that time no duty but a sin. As physic [medicine] must be forborne where the disease will but be exasperated by it. Therefore Christ bounds our very preaching and reproof with a ‘Shake off the dust off your feet as a testimony against them.’ And give not that which is holy to dogs, etc. when treading under foot and turning again and rending us, is likest to be the success, the wisdom of Christ and not that of the flesh only requires us to take it for no duty. This is to be observed by them that think that admonitions and excommunications, and exclusion from the sacrament must be used in all places and at all times alike, without respect to the end, come of it what will: Or that will tempt God by presuming that He will certainly either bless or at least justify their unseasonable and imprudent actions as if they were a duty at all times. To be either against the Scripture or against the end is a certain proof that an action is no duty, because no means.”

— Richard Baxter, The Cure of Church Divisions, … (London, 1670), pt. 1, Direction 37, pp. 205-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+ministry+is+for+edification+and+not+for+destruction%E2%80%A6+God+has+told+us+that+no+positive+duty+is+a+duty+at+all+times%E2%80%A6+He+gives+us+all+a+charge+to+learn+what+this+means%2C+%E2%80%98I+will+have+mercy+and+not+sacrifice%2C%E2%80%99+which+must+needs+import%3A+I+prefer+mercy+before+sacrifice+and+would+have+no+sacrifice+which+hinders+mercy%E2%80%A6+as+that+according+to+God%E2%80%99s+ordinary+way+of+working%2C+it+were+like+to+do+more+hurt+than+good%3B+it+were+no+duty+at+that+time.+Discipline+is+an+ordinance+of+Christ%3A+But+if+sound+reason+tell+me+that+if+I+publicly+call+this+man+to+repentance%2C+or+excommunicate+him%2C+it+is+like+to+do+much+hurt+to+the+church+and+no+good+to+him%2C+it+would+be+at+that+time+no+duty+but+a+sin.+As+physic+%5Bmedicine%5D+must+be+forborne+where+the+disease+will+but+be+exasperated+by+it.+Therefore+Christ+bounds+our+very+preaching+and+reproof+with+a+%E2%80%98Shake+off+the+dust+off+your+feet+as+a+testimony+against+them.%E2%80%99+And+give+not+that+which+is+holy+to+dogs%2C+etc.+when+treading+under+foot+and+turning+again+and+rending+us%2C+is+likest+to+be+the+success%2C+the+wisdom+of+Christ+and+not+that+of+the+flesh+only+requires+us+to+take+it+for+no+duty.+This+is+to+be+observed+by+them+that+think+that+admonitions+and+excommunications%2C+and+exclusion+from+the+sacrament+must+be+used+in+all+places+and+at+all+times+alike%2C+without+respect+to+the+end%2C+come+of+it+what+will%3A+Or+that+will+tempt+God+by+presuming+that+He+will+certainly+either+bless+or+at+least+justify+their+unseasonable+and+imprudent+actions+as+if+they+were+a+duty+at+all+times.+To+be+either+against+the+Scripture+or+against+the+end+is+a+certain+proof+that+an+action+is+no+duty%2C+because+no+means.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%2C+%E2%80%A6+%28London%2C+1670%29%2C+

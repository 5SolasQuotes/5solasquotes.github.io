<main class="wrap"><figure class="quote" id="q-629d1dd748" data-kw="">
<blockquote><p>Those virtues which more immediately respect God, appeared in Christ in the work that he did for our redemption. There appeared in him an holy fear and reverence towards God the Father. Christ had a greater trial of his virtue in this respect than any other had, from the honourableness of his person. This was the temptation of the angels that fell, to cast off their worship of God, and reverence of his majesty, that they were beings of such exalted dignity and worthiness themselves.

But Christ was infinitely more worthy and honourable than they; for he was the eternal Son of God, and his person was equal to the person of God the Father: and yet, as he had taken on him the office of mediator, and the nature of man, he was full of reverence towards God. He adored him in the most reverential manner time after time. So he manifested a wonderful love towards God.

The angels give great testimonies of their love towards God, in their constancy and agility in doing the will of God; and many saints have given great testimonies of their love, who, from love to God, have endured great labours and sufferings, but none ever gave such testimonies of love to God as Christ has given; none ever performed such a labour of love as he, and suffered so much from love to God. So he manifested the most wonderful submission to the will of God. Never was any one’s submission so tried as his was. So he manifested the most wonderful spirit of obedience that ever was manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), p. 154.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d897e7cab1" data-kw="">
<blockquote><p>We are told by hymnologers that there is no mention in such psalms of the “sweet name of Jesus.” But is there in the hymns in question? But what Christian minister what Christian elder, nay, what Christian child, who has had a godly father or mother, does not know who the Refuge of the believer is? Does any soul ever sing such a psalm without rejoicing in that name as “ointment poured forth,” as the way into this Refuge, and in the Holy Spirit, who, in God’s infinite grace, has guided him into it? It is very shallow piety indeed that needs all this to be put in words in a song of praise.

It is not the nature of truly lifting up of the soul to God in trust, and hope, and joy, to do it in the details of a doctrinal and theological discussion, whether in thanksgiving, in penitence, or prayer. So the psalms express the essence of them all. What Christian congregation in this land does not know the Redeemer, the name of Jesus, and the Holy Spirit? Did David not know it when he sang Psalm Ixxxviii. 1 — “Lord God, my Saviour,” (my Jesus) “day and night, Before thee cried have I,”- etc.

Nay, did Abraham not know it when he “saw his day afar off, and was glad”? Our Lord himself hath amply taught us, both personally, and by His inspired apostles, that they did; and are we not to know it when we sing Psalms il., xvi., xxii., xxiii., xlv., cx., cxviii., and many others?

To sing these psalms with our gospel light, is to enjoy the communion of saints from the beginning of the church on earth even until now — a communion in praise, at least, which sectarian hymns from their very nature completely destroy, and raise the spirit of controversy rather than kindle the lofty flame of pure devotion. Who does not know what is the child’s true hymn — “The Lord’s my Shepherd?” What child does not know who He was — the great and the good Shepherd, who giveth His life for the sheep, and who “carrieth the lambs in His bosom;” and who said, “Suffer the little children to come unto me”?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 135-36.</span></figcaption>

</figure><figure class="quote" id="q-02f259dbc0" data-kw="">
<blockquote><p>But besides these most public appearances of Jehovah, there hath been, in splendid succession, a series of particular signal interpositions, which hath diffused, through the different times and societies of the church, his majesty and his praises. With a view to these subordinate displays of Divine glory, David utters a prophecy, which includes a long train of remarkable events, not to be finished till the end of the world, in the following words: Psal. cxlv. 4-7. “One generation shall praise thy works to another, and shall declare thy mighty acts. Men shall speak of the might of thy terrible acts; they shall abundantly utter the memory of thy great goodness, and shall sing of thy righteousness.”

These words inform mankind, that, from time to time, they shall see coming forth to view such events as shall give farther evidence of the divinity of God’s word, of the certainty of its promises and its threatenings, of the eternal counsels and the supreme power of the true God, and of the subjection of all events to his control, his designs, his glory, and the happiness of his people.

Such was that great public change in Britain, which the completion of an hundred benign years has lately brought back, with fresh delight, to our memories and mouths. God himself doth observe, and will bring into judgment, the thoughts, words and conduct of those who profess, or who decline to profess, a grateful recollection of that magnificent period.

That I may promote such sentiments on this subject as shall be honourable to God and profitable to us, let me endeavour to apply the light of God’s word to that event: for as the pieces of burnished metal, placed on the summits of high buildings, however bright in themselves, yet hardly appear till they are kindled into splendour by the beams of the sun; so, till we are specially enlightened by the word and the Spirit of God, our ideas will fall exceedingly short of the dignity of this, and every other Divine work.

I find therefore in the Scripture history, that the record of signal events is frequently accompanied with particular inspired compositions, which celebrate the glory of God displayed in these events. Such compositions were of important use for directing and animating the praises of those persons who witnessed the occasions of them. By means of these compositions, believers, in succeeding ages, not only are excited to remember the great events, but are enabled, in the sympathy of faith, to enter into the feelings of those who were then present. And a third use of these sacred compositions is, that they remain in the church’s treasury, to be applied to new occasions, in some respects similar to the original occasions of their being written.

The words of my text are the conclusion of one of those inspired songs, which breathe wonderful sentiments of gratitude and triumph. We shall then do some justice to the memory of God’s interpositions at the Revolution, when we feel something of that sacred fire which animated the writer of this psalm. It was composed, most probably, on occasion of that stroke, inflicted by an angelic arm, which repelled the blasphemies, and disappointed the bloody designs of Senacherib, the Assyrian monarch. This deliverance is recorded in three different places of the sacred book. Those who duly consider the mischiefs which were prevented by the Revolution, the blessings introduced thereby, together with the surprising concurrence of circumstances giving birth to that event, will not blame my application of this psalm to the present subject, as being over-strained or unnatural.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Majesty of the King of Kings: A Sermon, Preached on the Subject of the Revolution, Nov. 9. 1788 in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, and A Serious Call Respecting a Mission to the River Indus</cite></span></figcaption>

t+me+endeavour+to+apply+the+light+of+God%E2%80%99s+word+to+that+event%3A+for+as+the+pieces+of+burnished+metal%2C+placed+on+the+summits+of+high+buildings%2C+however+bright+in+themselves%2C+yet+hardly+appear+till+they+are+kindled+into+splendour+by+the+beams+of+the+sun%3B+so%2C+till+we+are+specially+enlightened+by+the+word+and+the+Spirit+of+God%2C+our+ideas+will+fall+exceedingly+short+of+the+dignity+of+this%2C+and+every+other+Divine+work.%0A%0AI+find+therefore+in+the+Scripture+history%2C+that+the+record+of+signal+events+is+frequently+accompanied+with+particular+inspired+compositions%2C+which+celebrate+the+glory+of+God+displayed+in+these+events.+Such+compositions+were+of+important+use+for+directing+and+animating+the+praises+of+those+persons+who+witnessed+the+occasions+of+them.+By+means+of+these+compositions%2C+believers%2C+in+succeeding+ages%2C+not+only+are+excited+to+remember+the+great+events%2C+but+are+enabled%2C+in+the+sympathy+of+faith%2C+to+enter+into+the+feelings+of+those+who+were+then+present.+And+a+third+use+of+these+sacred+compositions+is%2C+that+they+remain+in+the+church%E2%80%99s+treasury%2C+to+be+applied+to+new+occasions%2C+in+some+respects+similar+to+the+original+occasions+of+their+being+written.%0A%0AThe+words+of+my+text+are+the+conclusion+of+one+of+those+inspired+songs%2C+which+breathe+wonderful+sentiments+of+gratitude+and+triumph.+We+shall+then+do+some+justice+to+the+memory+of+God%E2%80%99s+interpositions+at+the+Revolution%2C+when+we+feel+something+of+that+sacred+fire+which+animated+the+writer+of+this+psalm.+It+was+composed%2C+most+probably%2C+on+occasion+of+that+stroke%2C+inflicted+by+an+angelic+arm%2C+which+repelled+the+blasphemies%2C+and+disappointed+the+bloody+designs+of+Senacherib%2C+the+Assyrian+monarch.+This+deliverance+is+recorded+in+three+different+places+of+the+sacred+book.+Those+who+duly+consider+the+mischiefs+which+were+prevented+by+the+Revolution%2C+the+blessings+introduced+thereby%2C+together+with+the+surprising+concurrence+of+circumstances+giving+birth+to+that+event%2C+will+not+blame+my+application+of+this+psalm+to+the+present+subject%2C+as+being+over-strained+or+unnatural.%E2%80%9D%0A%0A%E2%80%94+John+Love%2C+The+Majesty+of+the+King+of+Kings%3A+A+Sermon%2C+Preached+on+the+Subject+of+the+Revolution%2C+Nov.+9.+1788+in+Sermons+Preached+on+Public+Occasions%3A+With+Fifteen+Addresses+to+the+People+of+Otaheite%2C+and+A+Serious+Call+Respecting+a+Mission+to+the+River+Indus&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F02f259dbc0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/02f259dbc0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/12/john-love-on-the-glorious-revolution/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7e0622f533" data-kw="">
<blockquote><p>And in token of this subjection the apostle tells us, 1 Cor. 11:10, that the woman was to have power over her head, because of the angels. Which place, especially the latter clause of it, is diversly interpreted. But I think all agree in this, That this power which they were to have on their heads was a veil or covering, which at other times, but most especially in the congregation, women ought to wear on their heads; and which in the primitive times covered not only their heads, but all their face, as a guard to their modesty, and a screen to keep off loose and wanton eyes. And this veil is called power, to signify that they were under the power and authority of their husbands. But the men were uncovered in their assemblies, as the apostle tells us, verse 4, to signify that they had nothing over them, but were superior to all visible creatures, and subject only unto God. This power, or veil, women were to wear because of the angels… But either by angels are meant the ministers of the Church, before whom they are to show modesty and bashfulness; or else perhaps the celestial angels, who are always present and attending in the assemblies and congregations of the faithful; and therefore women should not do anything unbecoming and unseemly before them: Or lastly, because the angels themselves do reverence Christ, who is their head, and in token of their subjection unto him, are said to veil and cover their faces: And therefore women also in token of their subjection to their husbands, who are their heads, as Christ is of the Church, should likewise cover their heads and faces with a veil. So we find Gen. 24:65. that when Rebekah saw Isaac coming towards her, she took a veil and covered herself, as a sign of her subjection to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments with other Sermons</cite>, … (London, 1691) | 5th Commandment, pp. 285-6</span></figcaption>

</figure><figure class="quote" id="q-afadbdd95b" data-kw="">
<blockquote><p>The human understanding is the ear to which the Word of God speaks, and if it be but so spoken as that that ear may plainly hear it, it is enough. God is sovereign as to the manner of revealing his mind, whether he will reveal it by saying it in express terms or whether we can perceive it by laying several things that he has said together. If his mind be but revealed, it is sufficient for us if there be but sufficient means for the communication of his mind to our minds, whether we hear so many express words with our ears or see them with our eyes or see by the eye of reason and understanding the thing that he would signify to us.

Who can say that if that had been the mind of God that we should keep the first day of the week, he would have commanded it in express terms, as he did the keeping the seventh day of old? Indeed, if God had so made our faculties that we were not capable of receiving a revelation of God’s mind in any other way, then there would be some reason to say so. But God has given such understanding that we are capable of receiving a revelation when made in another manner. And if God deals with [us] agreeably to our natures and in a way proportionable to our capacities, it is enough.

And if God any way whatsoever discovers his mind in a way proportionable to our faculties, we are obliged to obedience, and God may expect our notice and observance [of] his revelation in the same manner as if he had revealed it in express terms.</p></blockquote>

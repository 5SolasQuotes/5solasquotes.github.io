<main class="wrap"><figure class="quote" id="q-a88ab6465b" data-kw="">
<blockquote><p>The words: ‘No man can come to Me, except the Father which has sent Me draw him,’ [John 6:44] present only the converse aspect of those [words spoken] to the disciples: ‘All that which the Father gives Me shall come to Me, and him that comes to Me I will in no wise cast out.’ For, far from being a judgment on, it would have been an excuse of, Jewish unbelief, and, indeed, entirely discordant with all Christ’s teaching, if the inability to come were regarded as other than personal and moral, springing from man’s ignorance and opposition to spiritual things. No man can come to the Christ—such is the condition of the human mind and heart, that coming to Christ as a disciple is, not an outward, but an inward, not a physical, but a moral impossibility—except the Father ‘draw him’. And this, again, not in the sense of any constraint, but in that of the personal, moral, loving influence and revelation, to which Christ afterwards refers when He says: ‘And I, if I be lifted up from the earth, will draw all men unto Myself’ (John 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alfred-edersheim.html">Alfred Edersheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life &amp; Times of Jesus the Messiah, Complete &amp; Unabridged in One Volume</cite>, (Hendrickson, 1993), Book 3, Chapter 32, p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1670871fbd" data-kw="">
<blockquote><p>Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Jonathan Edwards &amp; the Absence of Free Choice: A Parting of Ways in the Reformed Tradition” 71 min., Sept. 29th</cite>, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.”

</figure><figure class="quote" id="q-7a0d7bc387" data-kw="">
<blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause.</p></blockquote>

</figure><figure class="quote" id="q-d5b8c9281a" data-kw="">
<blockquote><p>No creature can do those things that are above nature as principal agent; however, it can cause a motion by uncreated power as instrumental agent: for as there is an obediential potency in creation, so that whatever the Creator has disposed happens in it, thus also so that it happens by means of it, which is the definition of an instrument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 8, quest. 2, art. 3, Reply to obj. 4, bk. 4</span></figcaption>

</figure><figure class="quote" id="q-8609c1b4f4" data-kw="">
<blockquote><p>The inability of sinful man is not… to be reckoned among those things which are absolutely impossible (adynata)… nor simplynatural (as that is natural from which we are called neither good nor bad; while this inability is certainly vicious and culpable); or as natural is contradistinguished from voluntary (as in a stone or brute there is a natural inability to speak). Our inability is in the highest degree voluntary; or as that is called natural which arises from a defect of natural faculty or power (such as the inability to see in the blind, to walk in the paralytic, to rise in the dead). Our inability does not exclude, but always supposes in man a natural power to understand and will… For although the phrase can in some measure be tolerated when understood of the natural power of willing (never taken away from us in whatever state we may be; as that by which we are distinguished from the brutes), still it cannot be admitted when we speak of the moral disposition of the will to good; not only to willing, but to willing well. Concerning this alone we dispute with our opponents…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, sections 39-40 of Question 4, ‘Whether the free will in a state of sin is so a servant of and enslaved by sin that it can do nothing but sin…’ in Institutes (P&amp;R), vol. 1, 10th Topic, pp. 681-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=The%20inability%20of%20sinful%20man%20is,alone%20we%20dispute%20with%20our%20opponents&amp;text=The%20inability%20of%20sinful%20man%20is%20not&amp;text=Concerning%20this%20alone%20we%20dispute%20with%20our%20opponents" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

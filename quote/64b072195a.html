<blockquote><p>[Margin note:] How far the will of sign may be a will Question 33, Whether the will of sign may improperly and metonymically be the will of God? Response: The will of sign, according as it designates what is the pleasing and acceptable revealed will of God to us, that which is of our duty, so it is called the approving will, contradistinguished from the will of good-pleasure [of decree], and refers to two things:

1. To that which we ought to believe or do, inasmuch as that is obliging of consciences, since we ought to will to please God and will the reward of obedience following.

2. It refers to obedience, and this so far as God displays that to us by an act, either through special grace or a common concursus. The first will is of complacency and is properly called will, whose object is the duty of the rational creature. In this way God sincerely [serio] approves and wills obedience, and is pleased in this moral good as a rule and norm, and it is not less a will than that which is called of good-pleasure [or the will of decree]. But the latter way is not an executing will as the will of good-pleasure is, nor does God will, intend or decree through grace or concursus, to work in the creatures that which He commands or prohibits, because He commands or prohibits it. And in this way the will of sign is so far improperly called ‘the will of sign’; indeed, the punishment is called the wrath of God, because assuredly God punishes that which is done, as men are accustomed to do such being angry and in the passion of wrath, being aroused and agitated, although nonetheless, passions do not occur in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, (Edinburgh, 1649), Metaphysical Inquiries, p. 605 Trans. T. Fentiman. A ‘metonymy’ is something that is indirectly named by something closely related to it. Rutherford here delineates the eternal foundation of the will of sign, namely what Rollock had elucidated, the will of approval in God, which wills the goodness of things in and of themselves.</span></figcaption>

<blockquote><p>XXV. Thirdly, it is asked how Christ could offer such prayers to God as openly appear to be repugnant to the divine counsel and will, and thus to the piety and obedience which he most constantly exhibited to the Father? For what? Was he not born and made mediator for this very reason, that he might drink this cup for our salvation? Did he not know that this was the decree of the Father, as he himself testified more than once, that he must suffer many things and be killed? Mt. 16:21. Indeed, when he was being seized by the soldiers, he rebukes Peter for resisting them: “Shall I not drink the cup which my Father hath given me?” How, therefore, is he contrary to himself and to the Father, by requesting with such effort that the cup be transferred from him? Here, indeed, there are many things that can be replied. 1st, We suppose, against the Monothelites, that there was a twofold will in Christ, just as there was a divine and a human nature; these were not indeed adverse and repugnant to one another, but were nevertheless diverse insofar as they were directed toward diverse objects. The divine [will] willed death because it had been so ordained by the Father for our redemption; the human, however, shuddered and prayed against it, because it viewed it as the destruction of nature and the most dire of all evils that could exist; yet the human will is not rightly said to have been repugnant to the divine, because it petitioned not absolutely, but conditionally; not with a deliberate and elective will, but rather with an inefficacious and natural velleity. Therefore, it is to be observed 2nd, that the will can be divided in many ways; for one is called efficacious, another inefficacious; that is called efficacious which is the principle of acting, and which moves and impels a man to execute those things which it wills and to remove, as much as it can, any impediments to operation; [Ineffectual] which is not brought into effect, whether because of impediments arriving from elsewhere, or because it is a simple complacency in the good, or displeasure at evil, and does not proceed further so as to be a principle of operating, nor does it in reality impel one to the execution of the thing, which deserves to be called velleity rather than will. Therefore, when Christ is said to have willed that the cup might pass, this ought not to be understood of an efficacious will which produced in Him any attempt at escaping and extricating Himself from those snares; indeed, we see Him led as a sheep to the slaughter, Isa. LIII:8, so that He in no way resisted, nor attempted to flee from death, but of an ineffectual will which signifies nothing other than a simple displeasure arising from a natural inclination by which the will abhors that which destroys nature. XXVI. The will is either natural and indeliberate, or deliberate and elective. The former is called will by way of nature, the latter by way of reason, thus Thomas, pt. 3, quest. 18, art. 5. Will as nature, or by way of nature, is a physical faculty having a natural inclination toward the preservation of the whole composite, or it is a desire for advantage; it is called indeliberate will because it is borne toward an object considered absolutely without any consideration of circumstances. But will by way of reason is a rational faculty for pursuing the general good of the whole man as he is man, or for following the dictate of the practical intellect advising what is right and just; it is called elective will because it is a desire and affection for justice rather than for one’s own utility; it is also called deliberate will because it regards an object clothed in all its circumstances, and this will is referred to rational cognition as to its cause, because it follows not the instinct of nature but the dictate of reason. The will of nature naturally flees those things which are contrary to nature, such as death, torments, etc. The will by way of reason can be borne even toward those things which are adverse to nature, provided they are just and honorable or necessary; thus, for example, he who by natural will flees and is averse to a bitter potion, nevertheless receives the same by rational will, because he knows there is no other way of recovering health. In the same way, martyrs by nature cannot but shudder at death, but the same persons, nevertheless, approach it eagerly out of reason as the most glorious testimony of the benevolence of God, and glory in it. In clearly the same manner, Christ willed and did not will death, in a different respect. The will by way of nature did not will it, but the same by way of reason willed it; it did not will it insofar as natural appetite was a desire that He might live, and it viewed death absolutely and in itself as the destruction of nature. But insofar as He viewed the same with its circumstances, that is, as decreed by God and necessary for the salvation of the elect, He was borne toward it with a most propense affection, just as He testified elsewhere that this was His food, that He might do the will of His Father. Jn. IV:34; XXVII:4. Will is distinguished into simple and absolute, and hypothetical or conditional. The former is that by which one wills something absolutely and efficaciously, so that he leaves nothing undone so that that will may be brought into effect. The latter in which one wills something under a condition, and which is contained within certain limits. Thus, with an absolute will, the faithful seek the remission of their sins, and whatever things are necessary for their salvation. But with a conditional will, they seek those things which do not pertain to salvation in themselves, nor, whether granted, promote it, or, if denied, remove it—for instance, wealth, health, strength, external peace—in the seeking of which they must always add that condition, expressly or implicitly: “if the will of God so carries it.</p></blockquote>

be+observed+2nd%2C+that+the+will+can+be+divided+in+many+ways%3B+for+one+is+called+efficacious%2C+another+inefficacious%3B+that+is+called+efficacious+which+is+the+principle+of+acting%2C+and+which+moves+and+impels+a+man+to+execute+those+things+which+it+wills+and+to+remove%2C+as+much+as+it+can%2C+any+impediments+to+operation%3B+%5BIneffectual%5D+which+is+not+brought+into+effect%2C+whether+because+of+impediments+arriving+from+elsewhere%2C+or+because+it+is+a+simple+complacency+in+the+good%2C+or+displeasure+at+evil%2C+and+does+not+proceed+further+so+as+to+be+a+principle+of+operating%2C+nor+does+it+in+reality+impel+one+to+the+execution+of+the+thing%2C+which+deserves+to+be+called+velleity+rather+than+will.+Therefore%2C+when+Christ+is+said+to+have+willed+that+the+cup+might+pass%2C+this+ought+not+to+be+understood+of+an+efficacious+will+which+produced+in+Him+any+attempt+at+escaping+and+extricating+Himself+from+those+snares%3B+indeed%2C+we+see+Him+led+as+a+sheep+to+the+slaughter%2C+Isa.+LIII%3A8%2C+so+that+He+in+no+way+resisted%2C+nor+attempted+to+flee+from+death%2C+but+of+an+ineffectual+will+which+signifies+nothing+other+than+a+simple+displeasure+arising+from+a+natural+inclination+by+which+the+will+abhors+that+which+destroys+nature.+XXVI.+The+will+is+either+natural+and+indeliberate%2C+or+deliberate+and+elective.+The+former+is+called+will+by+way+of+nature%2C+the+latter+by+way+of+reason%2C+thus+Thomas%2C+pt.+3%2C+quest.+18%2C+art.+5.+Will+as+nature%2C+or+by+way+of+nature%2C+is+a+physical+faculty+having+a+natural+inclination+toward+the+preservation+of+the+whole+composite%2C+or+it+is+a+desire+for+advantage%3B+it+is+called+indeliberate+will+because+it+is+borne+toward+an+object+considered+absolutely+without+any+consideration+of+circumstances.+But+will+by+way+of+reason+is+a+rational+faculty+for+pursuing+the+general+good+of+the+whole+man+as+he+is+man%2C+or+for+following+the+dictate+of+the+practical+intellect+advising+what+is+right+and+just%3B+it+is+called+elective+will+because+it+is+a+desire+and+affection+for+justice+rather+than+for+one%E2%80%99s+own+utility%3B+it+is+also+called+deliberate+will+because+it+regards+an+object+clothed+in+all+its+circumstances%2C+and+this+will+is+referred+to+rational+cognition+as+to+its+cause%2C+because+it+follows+not+the+instinct+of+nature+but+the+dictate+of+reason.+The+will+of+nature+naturally+flees+those+things+which+are+contrary+to+nature%2C+such+as+death%2C+torments%2C+etc.+The+will+by+way+of+reason+can+be+borne+even+toward+those+things+which+are+adverse+to+nature%2C+provided+they+are+just+and+honorable+or+necessary%3B+thus%2C+for+example%2C+he+who+by+natural+will+flees+and+is+averse+to+a+bitter+potion%2C+nevertheless+receives+the+same+by+rational+will%2C+because+he+knows+there+is+no+other+way+of+recovering+health.+In+the+same+way%2C+martyrs+by+nature+cannot+but+shudder+at+death%2C+but+the+same+persons%2C+nevertheless%2C+approach+it+eagerly+out+of+reason+as+the+most+glorious+testimony+of+the+benevolence+of+God%2C+and+glory+in+it.+In+clearly+the+same+manner%2C+Christ+willed+and+did+not+will+death%2C+in+a+different+respect.+The+will+by+way+of+nature+did+not+will+it%2C+but+the+same+by+way+of+reason+willed+it%3B+it+did+not+will+it+insofar+as+natural+appetite+was+a+desire+that+He+might+live%2C+and+it+viewed+death+absolutely+and+in+itself+as+the+destruction+of+nature.+But+insofar+as+He+viewed+the+same+with+its+circumstances%2C+that+is%2C+as+decreed+by+God+and+necessary+for+the+salvation+of+the+elect%2C+He+was+borne+toward+it+with+a+most+propense+affection%2C+just+as+He+testified+elsewhere+that+this+was+His+food%2C+that+He+might+do+the+will+of+His+Father.+Jn.+IV%3A34%3B+XXVII%3A4.+Will+is+distinguished+into+simple+and+absolute%2C+and+hypothetical+or+conditional.+The+former+is+that+by+which+one+wills+something+absolutely+and+efficaciously%2C+so+that+he+leaves+nothing+undone+so+that+that+will+may+be+brought+into+effect.+The+latter+in+which+one+wills+something+under+a+condition%2C+and+which+is+contained+within+certain+limits.+Thus%2C+with+an+absolute+will%2C+the+faithful+seek+the+remission+of+their+sins%2C+and+whatever+things+are+necessary+for+their+salvation.+But+with+a+conditional+will%2C+they+seek+those+things+which+do+not+pertain+to+salvation+in+themselves%2C+nor%2C+whether+granted%2C+promote+it%2C+or%2C+if+denied%2C+remove+it%E2%80%94for+instance%2C+wealth%2C+health%2C+strength%2C+external+peace%E2%80%94in+the+seeking+of+which+they+must+always+add+that+condition%2C+expressly+or+implicitly%3A+%E2%80%9Cif+the+will+of+God+so+carries+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Disputations+on+the+Satisfaction+of+Christ%E2%80%A6+%28Geneva%2C+1666%29%2C+6th+Disputation%2C+which+is+the+Fourth+on+the+Truth+of+Christ%E2%80%99s+Satisfaction%2C+Asserted+from+his+Agony+and+Desertion+tr.+AI+by+The+Received+Faith%2C+sect.+25-29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88115f67b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88115f67b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=XXV.%20Thirdly%2C%20it%20is%20asked%20how,will%20of%20God%20so%20carries%20it&amp;text=XXV.%20Thirdly%2C%20it%20is%20asked%20how%20Christ%20could&amp;text=if%20the%20will%20of%20God%20so%20carries%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. Above, indeed, we proved that there is not in God a conditioned will properly so called, although rewards and punishments are proposed to us conditionally: For these differ as much as heaven from earth. Eternal life is conditional, but the sacred oracles do not know of a will of God to give eternal life that is conditional. For there was in God a will by which these things were concatenated, the establishment of Saul’s kingdom and the obedience of Saul, just as the vision of miracles and the conversion of the Tyrians are concatenated, as I mentioned above. Would the establishment of the kingdom have followed the obedience of Saul in this sense, but God had both decreed and long before predicted through the patriarch Jacob, Gen. 49:10, that royal power would be with the tribe of Judah, and that Shiloh, that is, Christ, would arise from him? What? Would that promise have been false if Saul had obeyed? What kind of dreams are these? Corvinus will say (in the cited location), if God had established the kingdom for Saul on the condition that he obeyed, then He would have wished to establish it. ‘For if’ (he says) ‘God had done that, the condition being posited, He surely wished to do it before the condition was fulfilled, under that law, if it were fulfilled.’ A conditional will includes two things (Alvarez, disp. 22, ad fig. 8):

1. Formally and expressly, an affection of simple complacency.

2. Eminently and implicitly, [there is] an efficacious and absolute will, which indeed does not actually exist, but nevertheless would exist if the condition were fulfilled; but insofar as it is turned into an absolute [will] through the fulfillment of the condition, it is called conditional. Response:

1. There is no consequence [in the argument]. If God had established Saul’s kingdom on the hypothesis of obedience, Corvinus, according to his custom, fraudulently assumes this, but does not prove it. Would that he had brought forward an argument! For this alone follows: ‘Therefore He would have willed and decreed to establish it, if He had established it,’ which is most true and by us in no way denied. But because God sends a Savior if men are sinners, it in no way follows: ‘Therefore He decreed to send a Savior on the hypothesis that men are sinners.’ For God’s eternal decree in no way depends upon a temporal condition to be fulfilled by men, for otherwise it would not be eternal.

2. If God had established Saul’s kingdom, He would have decreed to establish it; if He had decreed to establish it, He would also have decreed to work obedience in Saul by efficacious grace, just as He provided this in David. Therefore, from the condition having been fulfilled, there would have followed the temporal and external act of God, but in no way from the same would there have followed the eternal and immanent act. What? Would it be in the power of the creature that there should be eternal acts and eternal volitions in God? Then it would be in the power of the creature that God’s will should exist, and consequently that God Himself should exist; for God’s volitions are the same as God Himself.

3. He says that the conditional will comprises an affection of simple complacency, that is, an absolute volition. Does God therefore absolutely love and will eternal life for Judas, and also conditionally will eternal life for Judas? But these are contradictory. For if God [wills] salvation of the Jew simply, then He would also effect that (Alvarez, disp. 22, ad fig. 8); and therefore he still begs the question.

4. He says that a conditional will eminently contains the absolute will of God, which is not in act, yet would be if the condition were fulfilled, but he foreknows from eternity that the condition will never be fulfilled. How, therefore, does a conditional will, either eminently or formally, contain such an efficacious will, which God both foreknows and decrees will never be? This is a dream.

5. Is not the condition to be fulfilled such a thing upon which the absolute will of God depends? The Arminians deny this, for they do not wish for the first cause to be suspended from the second.

6. “According as it is turned into the absolute,” he says, “it is called conditional.” But truly, change the word “turned” into the word “changed,” and then the eternal conditional will of God is changed into an absolute one. Is the will of God so mutable? But how is the natural desire of God turned into an absolute decree, and then the same will of God will be both natural and free, that is, free and not free? If God has now ceased to will the salvation of the believing elect by an antecedent will, and now absolutely wills them to be saved because they believe, then an end is given to the eternal desire of God. But truly, since He desires the salvation of the elect because He is good toward His creatures, if that desire has now vanished as having been changed into an absolute will, He ceases to be good toward believers.

7. This absolute will, once the condition has been fulfilled, either follows necessarily or contingently. If necessarily, then the efficacious decree of God concerning the salvation of believers is not free, but follows necessarily, by a necessity of nature, from the act of man; and yet Arminius himself concedes that election is a free decree. But if it follows contingently, or freely, from the decree, then God decreed to decree, He willed to will absolutely the salvation of believers. How absurd it is that He should first decree to decree, before He decrees! But this is to posit a progression to infinity. (Alvarez, disp. 22, ad fig. 8)</p></blockquote>

then+He+would+also+effect+that+%28Alvarez%2C+disp.+22%2C+ad+fig.+8%29%3B+and+therefore+he+still+begs+the+question.+4.+He+says+that+a+conditional+will+eminently+contains+the+absolute+will+of+God%2C+which+is+not+in+act%2C+yet+would+be+if+the+condition+were+fulfilled%2C+but+he+foreknows+from+eternity+that+the+condition+will+never+be+fulfilled.+How%2C+therefore%2C+does+a+conditional+will%2C+either+eminently+or+formally%2C+contain+such+an+efficacious+will%2C+which+God+both+foreknows+and+decrees+will+never+be%3F+This+is+a+dream.+5.+Is+not+the+condition+to+be+fulfilled+such+a+thing+upon+which+the+absolute+will+of+God+depends%3F+The+Arminians+deny+this%2C+for+they+do+not+wish+for+the+first+cause+to+be+suspended+from+the+second.+6.+%E2%80%9CAccording+as+it+is+turned+into+the+absolute%2C%E2%80%9D+he+says%2C+%E2%80%9Cit+is+called+conditional.%E2%80%9D+But+truly%2C+change+the+word+%E2%80%9Cturned%E2%80%9D+into+the+word+%E2%80%9Cchanged%2C%E2%80%9D+and+then+the+eternal+conditional+will+of+God+is+changed+into+an+absolute+one.+Is+the+will+of+God+so+mutable%3F+But+how+is+the+natural+desire+of+God+turned+into+an+absolute+decree%2C+and+then+the+same+will+of+God+will+be+both+natural+and+free%2C+that+is%2C+free+and+not+free%3F+If+God+has+now+ceased+to+will+the+salvation+of+the+believing+elect+by+an+antecedent+will%2C+and+now+absolutely+wills+them+to+be+saved+because+they+believe%2C+then+an+end+is+given+to+the+eternal+desire+of+God.+But+truly%2C+since+He+desires+the+salvation+of+the+elect+because+He+is+good+toward+His+creatures%2C+if+that+desire+has+now+vanished+as+having+been+changed+into+an+absolute+will%2C+He+ceases+to+be+good+toward+believers.+7.+This+absolute+will%2C+once+the+condition+has+been+fulfilled%2C+either+follows+necessarily+or+contingently.+If+necessarily%2C+then+the+efficacious+decree+of+God+concerning+the+salvation+of+believers+is+not+free%2C+but+follows+necessarily%2C+by+a+necessity+of+nature%2C+from+the+act+of+man%3B+and+yet+Arminius+himself+concedes+that+election+is+a+free+decree.+But+if+it+follows+contingently%2C+or+freely%2C+from+the+decree%2C+then+God+decreed+to+decree%2C+He+willed+to+will+absolutely+the+salvation+of+believers.+How+absurd+it+is+that+He+should+first+decree+to+decree%2C+before+He+decrees%21+But+this+is+to+posit+a+progression+to+infinity.+%28Alvarez%2C+disp.+22%2C+ad+fig.+8%29%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Apologetic+Exercitations+for+Divine+Grace%2C+Exercitation+2%2C+%28Amsterdam%3A+Laurentius%2C+1636%29%2C+Exercise+2%2C+ch.+4%2C+%E2%80%98On+the+Antecedent+%26+Consequent+Will+of+God%E2%80%99%2C+pp.+323-63+tr.+AI+by+The+Faith+Received+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03bc725315.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03bc725315.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=3.%20Above%2C%20indeed%2C%20we%20proved%20that,Alvarez%2C%20disp.%2022%2C%20ad%20fig.%208&amp;text=3.%20Above%2C%20indeed%2C%20we%20proved%20that%20there%20is&amp;text=to%20infinity.%20%28Alvarez%2C%20disp.%2022%2C%20ad%20fig.%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f54f4838e3" data-kw="">
<blockquote><p>In Romans 2:4, it [longsuffering] is associated with the goodness and forbearance of God, and subsumed under his goodness, as that which is despised by the impenitent who treasures up for himself wrath in the day of wrath, who does not know that the goodness of God “leadeth him to repentance” (eis metanoian se agei). The choice of the verb agein is to be noted. Since the impenitent are in view, it cannot refer to efficacious grace. Nevertheless, it is a strong verb as its use in Romans 8:14 shows: “As many as are led by the Spirit of God, these are the sons of God” (cf. Gal. 5:18). It must be understood as a constraining influence flowing from the goodness of God which is calculated to bring men to repentance. The construction in Romans 2:4 is remarkably similar to that in II Peter 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’, On 2 Pet., 3:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3b72859a83" data-kw="">
<blockquote><p>The second conclusion pretended to be drawn from this [Rev. 2:21] is that the Lord has a universal will to have all men saved, seeing He gives her time to repent. This we say does not follow hence: For: … 4. It will not follow Christ wills persons to repent; therefore He wills their salvation: because He may be said to will them to repent when He requires it of them as their duty: and thus their duty of repenting is the immediate object of his revealed and preceptive will: but a person’s salvation is the proper object of his will of good-pleasure, or of his decreeing and purposing will. And no otherways can He be said to will such persons’ salvation (because He commands them to repent) than this, to wit, that in His Word He has signified repentance to be such a person’s duty, and that He has appointed a connection between repentance and salvation; which still relates to his revealed will: even as when God made the first Covenant with Adam, it might be said that He willed Adam to be holy, and that by that Covenant He had made a connection between holiness and life; yet it is not proper to say that the Lord willed life to Adam upon that condition, because that looks to the event and respects the Lord’s will of purpose: which cannot but be effectual. And if the Lord’s willing of men (at least such as are under his ordinances) to be saved be thus understood as including only the duty which God lays upon men and the connection that He has made between it and salvation in his Word, it may be admitted: but if it be extended to any antecedent will in God Himself, distinct from that which is called His revealed will, this place and such like will give no ground for such an assertion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 2, Lecture 6, on vv. 18-29, pp. 169-70</span></figcaption>

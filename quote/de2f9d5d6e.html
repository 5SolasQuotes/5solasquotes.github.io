<main class="wrap"><figure class="quote" id="q-de2f9d5d6e" data-kw="">
<blockquote><p>Because it is the Lord’s day. -“This is the day which the Lord hath made; we will rejoice, and be glad in it” (Ps. cxviii. 24). “I was in the Spirit on the Lord’s day” (Rev. i. 10). It is His, by example. It is the day on which He rested from His amazing work of redemption. Just as God rested on the seventh day from all His works, wherefore God blessed the Sabbath day, and hallowed it; so the Lord Jesus rested this day from all His agony, and pain, and humiliation. “There remaineth therefore the keeping of a Sabbath to the people of God” (Heb. iv. 9). The Lord’s day is His property, just as the Lord’s Supper is the supper belonging to Christ. It is His table. He is the bread. He is the wine. He invites the guests. He fills them with joy and with the Holy Ghost. So it is with the Lord’s day. All days of the year are Christ’s, but He hath marked out one in seven as peculiarly His own. “He hath made it,” or marked it out. Just as He planted a garden in Eden, so He hath fenced about this day and made it His own.

This is the reason why we love it, and would keep it entire. We love everything that is Christ’s. We love His word. It is better to us than thousands of gold and silver. “O how we love His law! it is our study all the day.” We love His house. It is our trysting-place with Christ, where He meets with us and communes with us from off the mercy-seat. We love His table. It is His banqueting-house, where His banner over us is love-where He looses our bonds, and anoints our eyes, and makes our hearts burn with holy joy. We love His people, because they are His, members of His body, washed in His blood, filled with His Spirit, our brothers and sisters for eternity. And we love the Lord’s day, because it is His. Every hour of it is dear to us-sweeter than honey, more precious than gold. It is the day He rose for our justification. It reminds us of His love, and His finished work, and His rest. And we may boldly say that that man does not love the Lord Jesus Christ who does not love the entire Lord’s day.

Oh, Sabbath-breaker, whoever you be, you are a sacrilegious robber! When you steal the hours of the Lord’s day for business or for pleasure, you are robbing Christ of the precious hours which He claims as his own. Would you not be shocked if a plan were deliberately proposed for breaking through the fence of the Lord’s table, and turning it into a common meal, or a feast for the profligate and the drunkard? Would not your best feelings be harrowed to see the silver cup of communion made a cup of revelry in the hand of the drunkard? And yet what better is the proposal of our railway directors? “The Lord’s day” is as much His day as “the Lord’s table” is His table. Surely we may well say, in the words of Dr. [John] Love, that eminent servant of Christ, now gone to the Sabbath above: “Cursed is that gain, cursed is that recreation, cursed is that health, which is gained by criminal encroachments on this sacred day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Love the Lord’s Day</cite>, (1841) in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee (Edinburgh: Oliphant Anderson &amp; Ferrier, 1892), pp 594-96.</span></figcaption>

<blockquote><p>…the venerable councils of the fathers [referring to Laodicea (365) and Braga (563) above] decree that vulgar psalms should not at all be sung in the Church and that ‘nothing put together in poetic fashion’ should be employed in the divine praises. … …so that to avoid growths and errors of that kind they [‘God-fearing ones‘] cling more vigorously and more carefully to divine authority and statutes of the church. This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles; his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices. It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offense and hesitation. Let us apply ourselves wholly to divine words in which there is no error, no ambiguity.. … There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the venerable councils of the fathers [referring to Laodicea (365) and Braga (563) above] decree that vulgar psalms should not at all be sung in the Church and that ‘nothing put together in poetic fashion’ should be employed in the divine praises. … …so that to avoid growths and errors of that kind they [‘God-fearing ones‘] cling more vigorously and more carefully to divine authority and statutes of the church. This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles; his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices. It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offense and hesitation. Let us apply ourselves wholly to divine words in which there is no error, no ambiguity.. … There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.”

<blockquote><p>Q. What is to be observed in the word, Remember?

A. That although all the Commandments are needful diligently to be remembered, yet this more specially.

Q. Why so?

A. First, because this Commandment hath least light of nature, to direct us to the observation of it.

Secondly, for that we are naturally most negligent in the observation of this, suffering our selves to be withdrawn by our worldly business, from God’s service upon the Lord’s day; and therefore such a special warning is needful to be added.

Q. What is it that we should here remember, for the better sanctifying of the Sabbath?

A. That we so compass all our business within the six working days, that our worldly affairs enter not, or encroach into the possession of the Lord’s day; not only willingly, but not so much as by any forgetfulness: as when (through want of foresight, or forecasting) the payment of money, due by obligation, or any such businesses that might be prevented, shall fall out on that day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 112-13.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2aeddf632" data-kw="">
<blockquote><p>To which thing it is no light instigation, that by these late tumults you have tried, that the peace of the Common-wealth doth consist in the integrity of Religion, neither can the purity of true Religion (which is maintained by you) be violated, but that also the pillars on which your Commonwealth standeth, and by which the authority of your supreme Magistracy is sustained, will be shaken. For these two are so knit together by a mutual bond, that the one cannot be overthrown, but the other also must fall down.

Your authority was struck, at through the side of Religion; and in the foundations of the Church, the foundations of the common-wealth were undermined. Your power therefore will be found safe, when obedience due to princes, shall be thought to be a part of piety: and when the Pastors of the Church shall train up, by the word of God, the people to perform obedience to you. And, on the other side, the Church shall flourish when Princes shall be her nursing fathers, and shall think themselves to be set by God at the stern of the Commonwealth, that God might reign by them, and that Religion might grow up, and might carefully be manured under the shadow of the civil power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), xxi-xxii.</span></figcaption>

</figure><figure class="quote" id="q-00ec4eb6e3" data-kw="">
<blockquote><p>But as the said Jews, I say, did then refuse such waters, so the said people refusing both the said pure and simple worship of God and true Church discipline, and preferring to it that vain, frothy, pompous, human will-worship, or liturgy of Rome, somewhat refined I confess, but yet the very same in substance, therefore did the Lord bring upon them that proud prelatical, hierarchical Church government, by the means of it, the which has at length broken into England, especially, and has so overflowed and passed through it, that it is come, not only to the neck, but even to the very top of the cheeks and ears of some of the best servants of God…</p></blockquote>

</figure><figure class="quote" id="q-9cf2ae27bc" data-kw="">
<blockquote><p>Paul’s example reminds ministers of churches that they have to gear what they say to the capacity of their audience and use every means possible to win them over and call them back from their errors. Human minds come in many different shapes and sizes. Therefore, just as good teachers adapt themselves to the minds of their children, and just as trustworthy and skilled doctors (a simile that Jerome uses) pay close attention to the way their patients respond when they are trying to cure the more difficult diseases, so ministers of the Word must understand the thought pattern of their hearers in order to reach each one of them, and they should not hesitate to shout at them if they see that they are rude and uneducated. But they must be careful when doing this not to compromise the truth, because doing that is no service to anyone.

Those who are full of themselves could not be farther away from the spirit of Paul. They order people about, avoid any kind of discussion and refuse to have anything to do with those who disagree with them. At the same time, they attack people who are fine representatives of the cause of religion with sharp, or rather poisoned tracts written against them, condemn whole churches and cause trouble wherever they go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 155.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>This Sabbath is then kept holy unto the Lord, when men, after a due preparing of their hearts, and ordering of their common affairs beforehand, do not only observe an holy rest all the day from their own works, words, and thoughts, about their worldly employments and recreations (Ex 20:8; 16:23, 25-26, 29-30; 31:15-17; Isa 58:13; Neh 13:15-22); but also are taken up the whole time in the public and private exercises of his worship, and in the duties of necessity and mercy. (Isa 58:13; Mat 12:1-13)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b4efcc7444" data-kw="">
<blockquote><p>Forbidden in the 2nd part, to worship images, to set them up, to gild them, or any manner of way to serve them, Mt. 4:10; Apoc. 19:20. Also here is forbidden all additions of sacraments, as the papists made matrimony, and so gave it a sign of the wedding ring, all additions unto them, 1 Cor. 11:13. All addition of ministries in the service of the Lord, as the papists added priests to sacrifice, exorcists to conjure, etc., Lk. 20:6; Jn. 1:21-23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise upon the First Table of the Law Orderly Disposing the Principles of Religion</cite>, (1588), 2nd Commandment, no page number. Dudley was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08bf918eb7" data-kw="">
<blockquote><p>…for here [at the Jerusalem Council] that not only the doctrinal power was to be used, but beside that: 1. the schism was to be removed, and the authority of the synod to be used against the willfulness and obstinacy of those obtruders of circumcision, in rebuking them as perverters of souls. 2. For the scandal which might have been taken if the Gentiles should have eaten blood and things strangled, and meats offered to idols, and therefore the apostles and elders behoved, as a convened synod to forbid a grievous scandal and a spiritual homicide against the Law of nature, to wit, that the gentiles for fear of scandalizing weak. believers amongst the Jews, should abstain from the practice of some things at this time merely indifferent in their nature, though not indifferent in their use, such as were to eat things offered to idols, things strangled and blood:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, pp. 390-91</span></figcaption>

</figure><figure class="quote" id="q-0de849ba89" data-kw="">
<blockquote><p>So let the Prelate [John Maxwell] glory in his borrowed logic; he had it from Barclay [a Romanist]: ‘It is not in the power of the wife to repudiate her husband, though never so wicked. She is tied to him forever, and may not give to him a bill of divorcement, as by law the husband might give to her…’ Answer: …but a wife may divorce from her husband…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. 69-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood: Or a Comparison between the Truth now taught in England &amp; the Doctrine of the Romish Church</cite>, … (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.”

quotes.github.io%2Fquote%2F537c63a515.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/537c63a515.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/marriage/#:~:text=The%20very%20ground%20of%20this%20assertion,after%20a%20sort%20the%20marriage%20itself&amp;text=The%20very%20ground%20of%20this%20assertion%20of%20master&amp;text=consent%20is%20after%20a%20sort%20the%20marriage%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e387a2a2b1" data-kw="">
<blockquote><p>O but we are covetous and soul-thirsty after our own will in the matter of soul-manifestations; either I see little here, or we idol comforts, and would gladly have a Christ of created grace, rather than Christ, or his grace; and when we are thirsting for Christ, it is his comforts, the rings, jewels, bracelets of the Bridegroom, we sick after, rather than Himself; its not an unmixed, nor a poor marriage-love, to marry the riches and possessions, and not the person,</p></blockquote>

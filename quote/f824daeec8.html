<blockquote><p>The will of God as to the peculiar actings on the Father in this matter [the eternal Trinitarian covenant] is the will of the Father, and the will of God with regard unto the peculiar acts of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son. And in this respect the covenant whereof we treat differs from a pure decree; for from these distinct actions of the will of God in the Father and the Son there does arise a new habitude or relation which is not natural or necessary unto them, but freely taken on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f06aaa25f" data-kw="">
<blockquote><p>Thesis XVII. ὁμούσια (homousia) or ὁμοούσια (homoousia)… And so this term was adopted for divine phenomena in order to refute the Arians, who claimed that the Son was from the Father—not begotten from the Father’s substance but made ex nihilo. Consequently, they claim, the Son is God by participating in his power, not by nature. Therefore, against such men it was decided that the Son is ὁμούσιον (homousion) or ὁμοούσιον (homoousion) with the Father. They did not, however, intend by this term merely that the essence of the Father and of the Son is similar, as is the case in natural phenomena (this is how two essences numerically would be taken, and thus there would be numerically two gods, which is anathema). Instead, they wished to describe two realities: first, that the Son is not different from the Father in essence, not because he was made ex nihilo, but as he was begotten from the Father himself, and so from eternity. This distinction they marked by another term, coeternal. Second, that he is from the Father insofar as he is the Son, such that he is one with the Father insofar as he is God. That is to say, that the Son’s essence is not somehow a derivative essence which took its origin from another principal. The heretics called this notion ex traduce, and today some men advance this idea under the term essentiation. But we assert that the actual, complete essence—by which the Father is God—is the Son by begetting, as the essence has been shared with him by the Father. As a result, Father and Son—insofar as they subsist in one and the same essence, or are of one and the same essence numerically, with respect to essence—are the one and same God, although, nevertheless the Father is not the Son. … Thesis XX. The ancients used these formulas [such as homoousios and homousios] not to convey the notion of a plurality of essences but to show that there was identity of essence in the relations of the persons, against those who said that Christ was made ex nihilo and in fact made in time. For statements of the Arians like the following lead to that understanding: “there was a time when he was not” and, “he was created from things that were not.” In other words, that he was established from things that did not exist. Therefore the Fathers added to the Creed the phrase “true God from true God” to show that God from whom God exists, i.e., the Father, and God who is from God, i.e., the Son, are by reason of essence one God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beza on the Trinity</cite>, 21 Theses’ from Tractationes Theologicae Bezae, Volumen I (Geneva: Jean Crespin, 1570), p. 651 trans. David Noe</span></figcaption>

<blockquote><p>VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions.

VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/o-p-cardinal-tommaso-maria-zigliara.html">O.P. Cardinal Tommaso Maria Zigliara</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa philosophica in usum scholarum</cite>, vol. 2, Theologia naturalis, De simpliciatate Divinae naturae, pp. 414–16 Zigliara (1833–1893), as quoted in Fanatic Thomist, “Personal God &amp; Classical Theism: Friends or Foes?”</span></figcaption>

<div class="actions"><button class="copy" data-copy="“VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions.

VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.”

— O.P. Cardinal Tommaso Maria Zigliara, Summa philosophica in usum scholarum, vol. 2, Theologia naturalis, De simpliciatate Divinae naturae, pp. 414–16 Zigliara (1833–1893), as quoted in Fanatic Thomist, “Personal God &amp; Classical Theism: Friends or Foes?”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVI.+On+the+Personality+of+God.+The+use+has+spread+among+pantheists+of+denying+God%E2%80%99s+true+and+real+personality%2C+so+that+those+who+defend+a+personal+God+are+accused+by+them+of+anthropomorphism%2C+as+if+the+notion+of+personality+cannot+apply+to+God+without+anthropomorphizing+Him%2C+or+constituting+Him+in+the+image+and+likeness+of+humans.+These+views+are+widely+disseminated+in+Hegelian+philosophy%2C+as+can+be+seen+in+Vera%E2%80%99s+Introduction+%C3%A0+la+philosophie+de+Hegel.+Avant-propos%2C+p.+20%2C+and+the+following+%282nd+edition%29.+However%2C+to+deny+the+existence+of+a+personal+God+is+tantamount+to+denying+God+Himself%2C+nor+does+asserting+the+personal+nature+of+God+lead+to+anthropomorphism.+Let+us+prove+both+assertions.+VII.+The+Admission+of+a+Personal+God.+We+defined+elsewhere+a+suppositum%2C+which+is+a+perfectly+subsistent+substance%2C+self-owned+and+incommunicable+to+another.+From+this+it+follows+that+since+substantiality%2C+by+virtue+of+its+subsistence%2C+is+the+perfection+by+which+substance+exceeds+accidents%2C+a+fortiori%2C+perfect+subsistence%2C+by+which+a+substance+becomes+self-owned+and+incommunicable+to+another%2C+exhibits+true+and+real+perfection.+And+because+a+spiritual+nature+is+the+most+perfect+among+beings%2C+a+subsisting+complete+subsistence+%28which+is+therefore+called+a+person%2C+as+we+stated+in+Ontology+loc.+cit.%29%2C+implies+something+supremely+perfect.+Or%2C+as+St.+Thomas+says+in+STh.+I%2C+q.+29%2C+a.+3%2C+%E2%80%9CPerson+signifies+what+is+most+perfect+in+all+nature+%E2%80%94+that+is%2C+a+subsistent+individual+of+a+rational+nature.%E2%80%9D+We+have+indeed+proved+the+truly+and+really+existing+First+Efficient+Cause+of+all+substances%2C+the+Most+Perfect+Being%2C+the+Supreme+Reason+ordering+all+created+things+towards+their+end%3B+therefore%2C+the+first+Substance+truly+exists%2C+most+perfect+in+the+notion+of+subsistence%2C+and+therefore+fully+self-owned+and+incommunicable%2C+supremely+intelligent%2C+most+notably+endowed+with+the+requisites+for+the+notion+of+personality%3B+and+this+first+substance+is+called+God.+Consequently%2C+God+is+truly+a+person%2C+with+a+personality+distinct+from+other+things%2C+as+proven+against+pantheists.+However%2C+the+term+%E2%80%9Cperson%E2%80%9D+is+not+applied+to+God+in+the+same+way+as+it+is+to+creatures+but+in+a+more+excellent+manner%2C+just+as+other+names+are+attributed+to+God+in+a+more+excellent+manner+than+to+creatures.+Those+who+wish+to+deny+a+personal+God+should+indeed+be+considered+atheists.+For+without+a+doubt%2C+they+either+concede+that+God+is+a+real+substance%2C+perfectly+subsistent+and+intelligent+in+Himself%2C+and+by+this+admission%2C+they+must+acknowledge+God+as+personal%2C+as+is+evident+from+what+has+been+said%2C+or+they+deny+to+God+proper+perfect+substantiality+and+intelligence%2C+and+in+this+second+hypothesis%2C+God+becomes+something+abstract+or+indeterminate%2C+like+every+universal%2C+as+the+adversaries+indeed+contend.+However%2C+what+is+abstract%2C+as+abstract%2C+and+what+is+indeterminate%2C+as+indeterminate%2C+etc.%2C+exists+not+in+reality+outside+the+mind+but+in+the+mind+itself%2C+without+its+proper+actions%3B+for+they+do+not+act+unless+through+singulars.+Therefore%2C+an+impersonal+God+is+merely+a+concept+of+reason%2C+and+thus+by+word+only+God+is+left%2C+while+in+reality+God+is+removed.+Moreover%2C+not+only+are+the+assertions+about+anthropomorphism+absurd+but+also+blatantly+ridiculous.+For+they+suppose+that+the+notion+of+personality+requires+a+body%2C+or+that+real+infinity+is+incompatible+with+personality%3B+yet+they+fail+to+realize+that+if+personality+is+a+perfection+derived+uniquely+from+a+spiritual+nature%2C+then+to+any+subsisting+substance%2C+the+notion+of+personality+must+correspond+to+the+extent+to+which+it+is+more+spiritual%2C+dissociated+from+and+independent+of+the+body%2C+and+possesses+the+most+perfect+nature.+Now%2C+God+is+in+the+highest+degree+of+spirituality+and+infinite+perfection.+Therefore%2C+He+is+in+the+highest+degree+of+personality%2C+so+that+personality+in+God+not+only+does+not+imply+anthropomorphism+but+essentially+excludes+it.%E2%80%9D%0A%0A%E2%80%94+O.P.+Cardinal+Tommaso+Maria+Zigliara%2C+Summa+philosophica+in+usum+scholarum%2C+vol.+2%2C+Theologia+naturalis%2C+De+simpliciatate+Divinae+naturae%2C+pp.+414%E2%80%9316+Zigliara+%281833%E2%80%931893%29%2C+as+quoted+in+Fanatic+Thomist%2C+%E2%80%9CPersonal+God+%26+Classical+Theism%3A+Friends+or+Foes%3F%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F810bff375c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/810bff375c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=VI.%20On%20the%20Personality%20of%20God,imply%20anthropomorphism%20but%20essentially%20excludes%20it&amp;text=VI.%20On%20the%20Personality%20of%20God.%20The%20use&amp;text=does%20not%20imply%20anthropomorphism%20but%20essentially%20excludes%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

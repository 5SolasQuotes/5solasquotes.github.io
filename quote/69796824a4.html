<blockquote><p>The Scripture tells us how man comes four ways into the world… 4. Of a woman without a man, and so was Christ born. Of the Virgin Mary.] Where the mother of Christ is described by her Name, ‘Mary’; surename, ‘Virgin’. The new Jesuits and old Friers have many wonderful extravagant conceits of this name: let it suffice that it is added in the Gospel and Creed to show that Christ came of the lineage of David: and that therefore He was the true Messias, as God had promised and prophesied by the mouths of all his holy servants. Virgin] A perpetual Virgin: Before, In, After Christ’s birth. Before his birth, against 1. Jews, 2. Gentiles, 3. Cerinthians. Unto the first [the Jews] we say with Cyril: Pariet Aaronis virga sine semine, et non pariet virgo sine semine? aut vtrum[que] negate aut vtrum[que] concedite. Against the second [the gentiles], we have: Ficta: Qui enim e Iouis cerebro Mineruam, et ex eiusdem femore Bacchum, falso prognatum esse fabulamini: quomodo ex vtero virginali Christum nasci dicitis impossibile? Facta: Quoniam animalia multas sine commistione generantur. And Plutarch in the life of Numa spake like an angel: Incredibilo non est, ut spiritus Dei cum muliere coeat, ei[que] sobolis quaedam principia ingoneret. 3. The Cerinthians, Ebionites, and Carpocratian heretics held that Christ was the natural son of Joseph: et verus, et merus homo [both true and merely man]. Contrary to text, Mt. 1:25; Lk. 3:23. See the Gospel, Dom. l, post Epiphan. In his birth, against: Jovinian, Durandus. Unto these that of Isa. 7 is opposed, ‘Ecce 〈…〉, &amp; pariet filium.’ The which words are to be construed: ‘in censu composito, non diuiso: scilicet integra perman•e•• et conceptura, et paritura: nam quale signum vel prodigium esset ut quae fuit virgo conciperet, et corrupta pareret?’ ‘Hic si ratio quaeritur, non erit mirabile. Si poscitur exemplum, non erit singulare. Demus Deum aliquid posse, quod nos fateamur inuestigare non posse.’ ‘Fides adsit, et nulla quaestio remanebit.’ See the Gospel of the purification. After his birth against the Old Helvidians, [and] New Antidicomarianites: holding it a point of zeal to disgrace this holy Virgin: whereas it is our duty rather highly to reverence her, as being the Mother of our Lord; a prophetess on earth, a saint in heaven, (as the Fathers usually) the window of heaven, through which it pleased the light of the world to illuminate such as sit in darkness and in the shadow of death. Of such estimation in the Church, that whereas the first General Council was assembled against Arius, to maintain the honor of the Son, and so by consequence of the Father: The second against Macedonius, to maintain the honor of the Holy Ghost: The third was assembled against Nestorius, to maintain the dignity of the blessed Virgin. And therefore let not us give her too little, though the Papists have given her too much. See Gospel on the Annunciation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of all the Principal Scriptures used in our English Liturgy</cite>, … (London, 1610), pp. 37-8</span></figcaption>

</figure><figure class="quote" id="q-5466316c74" data-kw="">
<blockquote><p>Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.</p></blockquote>

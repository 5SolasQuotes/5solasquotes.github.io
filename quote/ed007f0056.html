<blockquote><p>The argument of this thesis is that the explanatory power of the doctrine of divine simplicity has significant ramifications on our understanding of other doctrines of God. I argue that these ramifications can be seen in four distinct theological areas: the doctrine of divine aseity, the doctrine of divine immutability, God’s relationship with moral goodness, and in perfect being theology.</p></blockquote>

<blockquote><p>Fifth [objection], [there must be composition in God] because in God there are very many attributes really distinct from Him and among themselves – at least distinct in such a way that they are not God Himself, therefore… Response: We deny the antecedent. They are God Himself, nor do they really differ, e.g. goodness, justice, power, intellect, will. There are some who concede that they are distinguished from the nature of the thing formally, as Scotus with his followers, because although they are the same simple thing, nevertheless from the nature of the thing they are distinct formal notions; for the formal notion and definition of one, e.g. of intellect or justice, is not the definition and formal notion of the other, e.g. of will or mercy – which opinion Rada, Bishop of Patti, subtly defends against all the Thomists out of the more recent authors in the cited place. But others, such as the Thomists and most of the more recent Papists (with whom I think the Reformed philosophers and Theologians side), more truly and accurately establish here a distinction of reasoning reason and reasoned reason [i.e. a purely rational distinction]. The former indeed on the part of our intellect, both on account of the most eminent perfection of God which cannot be represented by a single notion, and on account of the finitude and narrowness of our intellect, which cannot adequately conceive the whole perfection of God by a single concept, but needs many inadequate concepts to conceive it – hence it happens that it conceives one and the same thing separately by many formal concepts really distinct, concepts, I say, analogically taken from created things which through many distinct qualities furnish those things which the divine essence [furnishes] through itself. But the latter [distinction] on the part of the thing, because there are various objective concepts not really, actually, in themselves, but virtually or eminently distinct in effects, emanations, and terminations. This distinction they properly call virtual or eminent [distinction] of reasoned reason; or (to adapt it to Scotistic terms) from the nature of the thing formal not in act, but in power or eminently. So that there is some foundation of this latter distinction on the part of the thing, not indeed in God Himself, but in the effects of God. For although the divine essence and perfection is one and simple, nevertheless it does not operate according to its adequate notion. Whence we say that God punishes the wicked according to the notion of justice, saves his own [people] according to the notion of mercy, produces Bucephalus to the idea of a horse, not of a man; but Alexander to the idea of a man, not of a horse. The attributes of justice and mercy, as well as the ideas of man and horse, are indeed not multiplied or distinguished in God Himself in act; but they are distinguished only virtually in the effects themselves, or in termination to such and such a work or effect. Let the more immature learn the nature of this distinction from the common metaphysical and logical authors and apply it to the present matter. Two examples are usually adduced, of the soul and of solar light. The soul, really one in man, is virtually or eminently threefold: vegetative, sensitive, rational; because that one form furnishes in man what the vegetative [furnishes] in plants, the sensitive in brutes. The light of the sun, although it is one, nevertheless virtually or as to its effects contains in itself a drying and heating force. But when it illuminates or heats or dries, it does not operate according to its whole notion. For by the action of illuminating as such, it does not dry or heat, although the drying or heating force is not separated from the illuminative force, but they hold themselves accidentally to illumination; because light does not operate according to its whole notion, but only according to the notion of illuminating. … Instance 2, which is Walter’s: The attributes are in diverse predicaments, e.g. essence in substance, goodness in quality. Response: Now boys in the schools know that God is in a predicament analogically. Instance 3: Things which cannot be predicated of each other and of the essence in the abstract, in the nominative case, and by synonymous predication, are not really the same. But the former is true. Therefore… Response: There is a fallacy of figure of speech; for the identical sense is changed into the formal sense. Something is predicated of another either in the identical sense or in the formal sense. The attributes as they are considered on the part of the thing and insofar as they are in God and thus are entirely the same as the essence and among themselves, can be predicated of each other in the identical sense; thus you will rightly and most truly say: The essence on the part of the thing is life, will on the part of the thing is intellect, and vice versa, and so in others. But as the attributes are conceived by us, and as they are in our concepts, they cannot be truly and properly predicated of each other, namely in the formal sense; the reason is, because thus they are not entirely the same but are distinguished by reasoning reason and reasoned reason (namely virtual). For there are many objective concepts virtually distinct which correspond to many formal concepts really distinct. Therefore it cannot be said: The objective concept of will is the objective concept of intellect, or, the attribute of mercy is the attribute of punitive justice. It must nevertheless be noted that there are some propositions which can be taken in both senses, namely those which consist of the copula “is”, e.g. Intellect is will; to understand is to will; mercy is justice – which taken in the abstract and in the identical sense are true, but in the formal sense false. There are also others which are always taken in the formal sense, and thus under those terms are absolutely and always false, in which essential or notional acts are signified. Essential: as intellect understands, will wills. Notional: as the Father begets, the Son is begotten, the Holy Spirit proceeds – which are only true when something is signified to be appropriate to God according to that notion according to which it is truly appropriate; but they are false when something is signified to be appropriate to God according to another notion which holds itself accidentally and according to which it is not truly appropriate, e.g. intellect wills, will understands, justice shows mercy, mercy punishes – which nevertheless can be true under other terms, namely taken in the abstract, in themselves, as they are on the part of the thing in God, but not as they are attended to in distinct effects as principles of diverse productions or according to the diverse emanations of God, as, that thing which is will understands, that thing which is mercy punishes.</p></blockquote>

lly+taken+from+created+things+which+through+many+distinct+qualities+furnish+those+things+which+the+divine+essence+%5Bfurnishes%5D+through+itself.+But+the+latter+%5Bdistinction%5D+on+the+part+of+the+thing%2C+because+there+are+various+objective+concepts+not+really%2C+actually%2C+in+themselves%2C+but+virtually+or+eminently+distinct+in+effects%2C+emanations%2C+and+terminations.+This+distinction+they+properly+call+virtual+or+eminent+%5Bdistinction%5D+of+reasoned+reason%3B+or+%28to+adapt+it+to+Scotistic+terms%29+from+the+nature+of+the+thing+formal+not+in+act%2C+but+in+power+or+eminently.+So+that+there+is+some+foundation+of+this+latter+distinction+on+the+part+of+the+thing%2C+not+indeed+in+God+Himself%2C+but+in+the+effects+of+God.+For+although+the+divine+essence+and+perfection+is+one+and+simple%2C+nevertheless+it+does+not+operate+according+to+its+adequate+notion.+Whence+we+say+that+God+punishes+the+wicked+according+to+the+notion+of+justice%2C+saves+his+own+%5Bpeople%5D+according+to+the+notion+of+mercy%2C+produces+Bucephalus+to+the+idea+of+a+horse%2C+not+of+a+man%3B+but+Alexander+to+the+idea+of+a+man%2C+not+of+a+horse.+The+attributes+of+justice+and+mercy%2C+as+well+as+the+ideas+of+man+and+horse%2C+are+indeed+not+multiplied+or+distinguished+in+God+Himself+in+act%3B+but+they+are+distinguished+only+virtually+in+the+effects+themselves%2C+or+in+termination+to+such+and+such+a+work+or+effect.+Let+the+more+immature+learn+the+nature+of+this+distinction+from+the+common+metaphysical+and+logical+authors+and+apply+it+to+the+present+matter.+Two+examples+are+usually+adduced%2C+of+the+soul+and+of+solar+light.+The+soul%2C+really+one+in+man%2C+is+virtually+or+eminently+threefold%3A+vegetative%2C+sensitive%2C+rational%3B+because+that+one+form+furnishes+in+man+what+the+vegetative+%5Bfurnishes%5D+in+plants%2C+the+sensitive+in+brutes.+The+light+of+the+sun%2C+although+it+is+one%2C+nevertheless+virtually+or+as+to+its+effects+contains+in+itself+a+drying+and+heating+force.+But+when+it+illuminates+or+ tribute+of+mercy+is+the+attribute+of+punitive+justice.+It+must+nevertheless+be+noted+that+there+are+some+propositions+which+can+be+taken+in+both+senses%2C+namely+those+which+consist+of+the+copula+%E2%80%9Cis%E2%80%9D%2C+e.g.+Intellect+is+will%3B+to+understand+is+to+will%3B+mercy+is+justice+%E2%80%93+which+taken+in+the+abstract+and+in+the+identical+sense+are+true%2C+but+in+the+formal+sense+false.+There+are+also+others+which+are+always+taken+in+the+formal+sense%2C+and+thus+under+those+terms+are+absolutely+and+always+false%2C+in+which+essential+or+notional+acts+are+signified.+Essential%3A+as+intellect+understands%2C+will+wills.+Notional%3A+as+the+Father+begets%2C+the+Son+is+begotten%2C+the+Holy+Spirit+proceeds+%E2%80%93+which+are+only+true+when+something+is+signified+to+be+appropriate+to+God+according+to+that+notion+according+to+which+it+is+truly+appropriate%3B+but+they+are+false+when+something+is+signified+to+be+appropriate+to+God+according+to+another+notion+which+holds+itself+accidentally+and+according+to+which+it+is+not+truly+appropriate%2C+e.g.+intellect+wills%2C+will+understands%2C+justice+shows+mercy%2C+mercy+punishes+%E2%80%93+which+nevertheless+can+be+true+under+other+terms%2C+namely+taken+in+the+abstract%2C+in+themselves%2C+as+they+are+on+the+part+of+the+thing+in+God%2C+but+not+as+they+are+attended+to+in+distinct+effects+as+principles+of+diverse+productions+or+according+to+the+diverse+emanations+of+God%2C+as%2C+that+thing+which+is+will+understands%2C+that+thing+which+is+mercy+punishes.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1+Latin+%7C+On+the+One+%26+Most+Simple+Essence+of+God%2C+pp.+225-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97cd3b6464.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97cd3b6464.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=Fifth%20%5Bobjection%5D%2C%20%5Bthere%20must%20be%20composition,that%20thing%20which%20is%20mercy%20punishes&amp;text=Fifth%20%5Bobjection%5D%2C%20%5Bthere%20must%20be%20composition%20in%20God&amp;text=will%20understands%2C%20that%20thing%20which%20is%20mercy%20punishes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…Grim’s objection also seems to assume a model of divine knowledge which would be rejected by those who hold (as, again, Scholastic realists do) that God is absolutely simple or noncomposite. In particular, it seems to assume that the truths God knows correspond to discrete ideas in the divine intellect, which together form a set. But given divine simplicity, what we describe in terms of such discrete ideas is really one and the same thing in God. There is in God something analogous to what we call, in the case of our own intellects, a grasp of the proposition that all men are mortal, something analogous to what we call a grasp of the proposition that Socrates is a man, and so forth. But these are different ways of describing what, in God, is really one and the same thing.</p></blockquote>

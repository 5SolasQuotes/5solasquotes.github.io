<main class="wrap"><figure class="quote" id="q-9b8424ba7a" data-kw="">
<blockquote><p>Now, in the meanwhile, we ought to note the meaning of these “high places,” for they served as substitutes for worship. It wasn’t so much that the Jews intended openly to reject God or his services. Rather, not content with possessing the Temple alone, they set up numerous chapels and altars. There were scarcely a nook or cranny that did not house some religious paraphernalia. Everywhere one spoke of worshipping God. But we know what Jeremiah thought of all this. “Did God command you to do these things? No! For God does not wish to be worshipped in accordance with human fancy” [see Jeremiah 6:19-20; 7:21]. Hence, whenever we insist on approaching God in a manner that we find good, we must not suppose that God is required to accept it. For anything that God has not commanded us to do, or put his stamp of approval upon, results in wages that can be collected only in hell.

Therefore, let us not be as blind as we were in the days of our ignorance. For so long as humanity is inclined towards this vice, with all its abominations, then so much the more must we note with diligence these passages, in which our Lord rejects everything forged along human lines. If we sincerely want to adopt the true order of worship that pleases God, then we have to pay heed to what God has commanded us. For if we follow only what seems best to us, without basing it on God’s Word, it will result in nothing but vanity and will constitute a true abomination on our part. […]

What we have here, then, is a general standard by means of which God condemns anything of human invention that mankind introduce as a means of worshipping God. As we have just seen in Jeremiah, if God has not required such a form or act, he will reject it as an abomination. […]

In truth, humanity abuses the name of God. For, while worshipping their idols, mankind completely reject what the living God himself has ordained. For we cannot invent forms of worship, based on our fantasies, without at the same time inventing a new god. And that such is the case, consider the papists. They think they are genuinely pleasing God by going on their pilgrimages, muttering before their idols, and abstaining from meat on certain days. In addition, they establish masses in honor of different saints, attend matins, and observe certain feast days. That is the kind of worship the papists have invented! And in doing so, would you not agree that they transform God into something carnal like themselves? Certainly, when we stop to think about it, we see how empty such worship is. For it reduces God to an infant, who has to be entertained by tricks and toys and rattles to pacify him. Now, can we transform God by the power of such imagination? No! Never! Rather, as I have said, we are simply creating new gods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the book of Micah</cite>, trans. and ed. B. W. Farley (1551; Phillipsburg, 2003), pp 35-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c009570fd8" data-kw="">
<blockquote><p>There may be therefore two heads of superstition. §5.

1. Negative, when men abstain from some things under a notion of religion, or worship of God, which are not forbidden by God, but left free and indifferent: either not forbidden, or, if once they were, now [they are] antiquated, or outdated… And of this sort was that, Col. 2:21, ‘Touch not, taste not, handle not;’ which was superstitious negative will-worship. §6.

2. Positive, when men of their own hearts and heads set up ways of religion, to worship God by, which He never commanded; and this (as was said) may be committed against any of the four first Commandments… Now this positive superstition may be exemplified in many particulars…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Diatribe triplex</cite>, … (London: Wright, 1654), ‘Of Superstition,’, p. 6</span></figcaption>

<blockquote><p>117. Q. Must not your obedience be yielded from right principles and motives?

A. Yes: if my principles and motives are worldly, impure, or condemned in Scripture, it is evident that the actions flowing from them cannot be acceptable to God. My obedience must proceed, not from a desire to “be seen of men,” or to “make gain of godliness,” but from a profound regard to the authority and glory of God, from a sincere attachment to my Lord and Saviour, from a serious view to the rewards and punishments of a future state, and from other considerations of a similar kind.</p></blockquote>

<blockquote><p>Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, (London, 1684), Of Divine Worship, pt. 1, §16. ‘Of Time &amp; Place considered as Adjuncts, or as Matter of Worship’, pp. 184-85.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.”

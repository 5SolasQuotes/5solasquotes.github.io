<blockquote><p>by way of precept there is an absolute necessity of uniting laid upon the Church, so that it falls not under debate whether a Church should continue divided or united in these [in thesis]… seeing that union is both commanded as a duty and commanded as eminently tending to the edification of the Church, and therefore is so frequently joined with edification? Nor is it to be asked by a Church what is to be done for the Church’s good in a divided way, thereby supposing a dispensation, as it were, to be given to division and a forbearing of the use of means for the attaining thereof; or rather supposing a stating or fixing of division, and yet notwithstanding thereof, thinking to carry on edification?</p></blockquote>

<blockquote><p>7. To wave a little that which concerns private and particular persons, we offer it to consideration whether inferior Kirk-judicatories are subordinate to the greater and superior simply and absolutely, because they are greater and superior, or, because the inferior have no intrinsical power given them by Jesus Christ, but in, and with subordination to the greater, because greater. If so, it would seem that all the inferior Judicatories of the Kirk, Congregational-Elderships, Presbyteries, and Provincial Synods must be fenced and act in the name, and by virtue of the authority derived from the General Assembly, as all those Civil Courts that have no intrinsic power in themselves, but in, and with subordination to the supreme Civil Magistrate are fenced in his name and act by virtue of his authority. Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto. 8. What is denied jure to ecomenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecomenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an Angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>

</figure><figure class="quote" id="q-36cd623f61" data-kw="">
<blockquote><p>It has been lately announced that the Synod of Philadelphia… adopted, and proceeded at once to enforce, a doctrine in reference to ecclesiastical proceedings, which appears to some altogether novel, and truly extraordinary. The doctrine is this,—’That no complaint, appeal, or protest, can be admitted by any judicatory, except in judicial cases.’… It never occurred to us, however, as possible, that it [the new doctrine] should receive countenance from gentlemen of experience and reflection… It is of more practical importance to show that the doctrine here assumed, cannot in our opinion, stand the test of a moment’s examination… In the Presbyterian Church in the United States, it is manifest that appeals, complaints and protests, have ever been allowed in all sorts of cases. Whenever a judicatory has decided any question which came before it by a vote, —whether the question were legislative, declarative, executive or strictly judicial—in any and every such case, both theory and practice allow of appeal, complaint and protest, at the pleasure of the party wishing to offer either. …more than thirty years before that time [1821], when the General Assembly was first organized, the following article appears in the system of Rules adopted for the government of that body: ‘Any member who may think himself aggrieved by a decision of the General Assembly, shall have his dissent or protest, with his reasons, entered on the records of the Assembly, or filed among their papers, if given in before the rising of the Assembly.’ … We have been in the constant habit of attending on the judicatories of the church, in all their grades, for more than forty years; and we never knew or heard of an in- dividual who doubted the right of appeal, complaint, and protest, in all sorts of cases… many a time, and on a great variety of occasions, we have participated in protests, etc. in all sorts of cases, without dreaming that any one ever thought of confining the privilege to cases of process only… The archives of the church are better than cursory assertions. Litera scripta manet. Let us, therefore, appeal to public records, which cannot lead us astray. In the year 1826, the General Assembly… determined, by a vote, to postpone fixing the location [of Western Theological Seminary] for another year. Against this decision the Reverend Joshua L. Wilson, of Cincinnati, entered his solemn protest, accompanied with five reasons, which still remain on permanent record. In the very same General Assembly, (of 1826)… Against this decision to receive Mr. B, forty-two members of the Assembly entered their solemn protest, supported by three reasons… In the General Assembly of 1828… In opposition to this act a solemn protest was presented and read, by a minority of the Assembly… Again, in the General Assembly of 1831… Against this decision a formal protest was entered by sixty-seven of the minority. And it is worthy of notice, that among the subscribers to this protest, the following names are found… the Reverend Robert J. Breckinridge… Alexander Boyd, Ashbel Green… At the same General Assembly, (1831)… Against this expression of opinion, a protest was offered, accepted, and recorded, signed by thirty members of the minority… Let us now attend–Secondly, to the dictates of reason on this subject…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Biblical Repertory &amp; Theological Review</cite>, no. 1, vol. 7 (Jan. 1835), article 5, ‘New Ecclesiastical Law’, pp. 89-97</span></figcaption>

tories+of+the+church%2C+in+all+their+grades%2C+for+more+than+forty+years%3B+and+we+never+knew+or+heard+of+an+in-+dividual+who+doubted+the+right+of+appeal%2C+complaint%2C+and+protest%2C+in+all+sorts+of+cases%E2%80%A6+many+a+time%2C+and+on+a+great+variety+of+occasions%2C+we+have+participated+in+protests%2C+etc.+in+all+sorts+of+cases%2C+without+dreaming+that+any+one+ever+thought+of+confining+the+privilege+to+cases+of+process+only%E2%80%A6+The+archives+of+the+church+are+better+than+cursory+assertions.+Litera+scripta+manet.+Let+us%2C+therefore%2C+appeal+to+public+records%2C+which+cannot+lead+us+astray.+In+the+year+1826%2C+the+General+Assembly%E2%80%A6+determined%2C+by+a+vote%2C+to+postpone+fixing+the+location+%5Bof+Western+Theological+Seminary%5D+for+another+year.+Against+this+decision+the+Reverend+Joshua+L.+Wilson%2C+of+Cincinnati%2C+entered+his+solemn+protest%2C+accompanied+with+five+reasons%2C+which+still+remain+on+permanent+record.+In+the+very+same+General+Assembly%2C+%28of+1826%29%E2%80%A6+Against+this+decision+to+receive+Mr.+B%2C+forty-two+members+of+the+Assembly+entered+their+solemn+protest%2C+supported+by+three+reasons%E2%80%A6+In+the+General+Assembly+of+1828%E2%80%A6+In+opposition+to+this+act+a+solemn+protest+was+presented+and+read%2C+by+a+minority+of+the+Assembly%E2%80%A6+Again%2C+in+the+General+Assembly+of+1831%E2%80%A6+Against+this+decision+a+formal+protest+was+entered+by+sixty-seven+of+the+minority.+And+it+is+worthy+of+notice%2C+that+among+the+subscribers+to+this+protest%2C+the+following+names+are+found%E2%80%A6+the+Reverend+Robert+J.+Breckinridge%E2%80%A6+Alexander+Boyd%2C+Ashbel+Green%E2%80%A6+At+the+same+General+Assembly%2C+%281831%29%E2%80%A6+Against+this+expression+of+opinion%2C+a+protest+was+offered%2C+accepted%2C+and+recorded%2C+signed+by+thirty+members+of+the+minority%E2%80%A6+Let+us+now+attend%E2%80%93Secondly%2C+to+the+dictates+of+reason+on+this+subject%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+The+Biblical+Repertory+%26+Theological+Review+ <blockquote><p>Controversy in religion is a hateful thing. It is hard enough to fight the devil, the world, and the flesh without private differences in our own camp. But there is one thing which is even worse than controversy, and that is false doctrine tolerated, allowed, and permitted without protest or molestation. It was controversy that won the battle of Protestant Reformation. If the views that some men hold were correct, it is plain we never ought to have had any Reformation at all! For the sake of peace, we ought to have gone on worshiping the Virgin and bowing down to images and relics to this very day! Away with such trifling! There are times when controversy is not only a duty but a benefit. Give me the mighty thunderstorm rather than the pestilential malaria. The one walks in darkness and poisons us in silence, and we are never safe. The other frightens and alarms for a little season. But it is soon over, and it clears the air. It is a plain Scriptural duty to “contend (Jude 3). I am quite aware that the things I have said are exceedingly distasteful to many minds. I believe many are content with teaching which is not the whole truth and fancy it will be “all the same” in the end. I am sorry for them. I am convinced that nothing but the whole truth is likely, as a general rule, to do good to souls. I am satisfied that those who willfully put up with anything short of the whole truth will find at last that their souls have received much damage. Three things there are which men never ought to trifle with—a little poison, a little false doctrine, and a little sin. I am quite aware that when a man expresses such opinions as those I have just brought forward there are many ready to say, “He is no Churchman.” I hear such accusations unmoved. The day of judgment will show who were the true friends of the Church of England and who were not. I have learned in the last thirty-two years that if a clergyman leads a quiet life, lets alone the unconverted part of the world, and preaches so as to offend none and edify none, he will be called by many “a good Churchman.” And I have also learned that if a man studies the Articles and Homilies, labors continually for the conversion of souls, adheres closely to the great principles of the Reformation, bears a faithful testimony against popery, and preaches as Jewell and Latimer used to preach, he will probably be thought a firebrand and “troubler of Israel,” and called no Churchman at all! But I can see plainly that they are not the best Churchmen who talk most loudly about Churchmanship. I remember that none cried “Treason” so loudly as Athaliah (2 Kings 11:14). Yet she was a traitor herself. I have observed that many who once talked most about Churchmanship have ended by forsaking the Church of England and going over to Rome. Let men say what they will. They are the truest friends of the Church of England who labor most for the preservation of truth. I lay these things before the readers of this paper and invite their serious attention to them. I charge them never to forget that truth is of more importance to a Church than peace. I ask them to be ready to carry out the principles I have laid down, and to contend zealously, if needs be, for the truth. If we do this we shall have learned something from Antioch [Acts 15].</p></blockquote>

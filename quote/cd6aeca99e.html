<main class="wrap"><figure class="quote" id="q-cd6aeca99e" data-kw="">
<blockquote><p>XXIII. Hence is easily gathered the reason why God wished to recall that [natural] law by Moses, to deliver it to his people viva voce, and proclaimed it in a solemn manner, committing it to writing and comprehending it in the decalogue. For although in upright nature there was no need of such a promulgation, still (after sin) so great was the blindness of mind, such the perversity of will and disturbance of the affections that only remains of this law survived in the hearts of all (like rubbed pictures of the same, which on that account ought to be retouched by the voice and hand of God as by a new brush).

Hence there were weighty causes for that promulgation. (1) That the natural law might be confirmed more and more, lest the remaining traces might gradually be obliterated by the vanity and wickedness of men or be considered as their uncertain and doubtful opinions. (2) That it might be corrected in those things in which it had been corrupted by the fall. (3) That it might be supplemented in those things which were wanting in it and had been obliterated. (4) That the necessity of a mediator might be understood and a desire for him to be enkindled more strongly every day on account of the weakness of man and of the law in the flesh (Rom. 3:20; 8:3; 10:4). (5) That the people of Israel might be joined by this law into one republic and be separated from all other nations (Dt. 4:6, 7; Ps. 147:19, 20; Rom. 9:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.23.</span></figcaption>

<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>

</figure><figure class="quote" id="q-dd4a748d56" data-kw="">
<blockquote><p>For it is written that Abraham had two sons, one by a slave and the other by a free woman. (Galatians 4:22)

V. 22. That Abraham) the meaning is, that as in Abraham’s family there were two mothers, and two kinds of issues, the one of bondage, and the other free, and the heir: so amongst those that have the knowledge of the true God, and make profession of serving him, there are two kinds according to the two doctrines or covenants propounded by God unto men, namely, the Law and the Gospel: those which hold themselves to the Law to obtain righteousness and life are slaves to sin and to the curse, and are finally excluded from the heavenly inheritance: those that embrace the Gospel are heirs and free.

V. 23. After the flesh) in a mere natural way: A figure of them who are out of Christ’s grace, and do of themselves endeavour to obtain life, and righteousness by the Law. By the promise) namely, by a free gift, and by a miraculous operation of God, out of the course of nature. A figure of Believers who are made sons and heirs of God, by his only grace and power.

V. 24. Are an allegory, the Italian, have an allegorical sense) namely, besides the historical and literal sense, may be taken for a figure of God’s great family. Are the two) that is to say, they signify and represent the two, &amp;c. The one) namely, that of the Law which was given in mount Sinai. Gendreth) of it self it may make those who are its followers to be part of God’s people by knowledge, profession, and worship; but in the mean time it cannot free them from their natural bondage, nor bring them into God’s grace, nor obtain the inheritance of heavenly life for them. Which is] namely, this covenant was figured by Agar.

V. 25. Agar is] namely, in this similitude of Abraham’s family with Gods family; Agar first is correspondent to Sinai, because that as Agar was a stranger, not of the blessed progeny, so Sinai was in Arabia in the Ishmaelite’s land, out of the bounds of the Land of Promise. And secondly, to the earthly Jerusalem of this age which makes profession of seeking life and righteousness in the Law, whereby all those which follow it do lose all right in the adoption and grace of God, and do remain subject to sin and malediction.

V. 26. But Jerusalem] there is also another body which is correspondent to Sara; namely, the Christian Church, which God himself hath created by his Word and Spirit, whose state shall also be perfect in Heaven, and that is freed by God from all spiritual bondage; and in it, and by it God gendreth and bringeth up all his true children.</p></blockquote>

<blockquote><p>TO WHAT USE THE LAW WAS GIVEN.

First, that is should declare unto us the will of God, how we ought to live, and what works we ought to do, that we may please the Lord our God. …

Secondly, that is should reveal and open unto us our sin and wickedness, while we consider how unable we be of ourselves to do that which the holy, righteous, and good law of God requireth of us to be done. …

Thirdly, after we have learned our weakness, our wretchedness, our sin, our wickedness, by comparing our strength and life with the law of God, which proveth us all sinners and worthy of eternal damnation, lest we should fall into desperation, and so be damned, the law was given of God to be a school-master unto us to lead us unto Christ, the alone end and perfect fulfiller of all the laws of God; that we, through faith taking upon us his righteousness, and his fulfilling of the law, might be found blameless through him in the sight of God, and so be made inheritors of everlasting glory.</p></blockquote>

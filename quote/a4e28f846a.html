<main class="wrap"><figure class="quote" id="q-a4e28f846a" data-kw="">
<blockquote><p>OBJECTION: By God’s predestination men are compelled to sin and driven to death by a sort of fatal necessity.

ANSWER: No Christian who is a Catholic denies God’s predestination. But fatalism many, even non-Christians, reject. Sin, indeed, leads to death, but God compels no one to sin. For He hath commanded no man to do wicked. And: Thou hatest, Lord, all the workers of iniquity; thou wilt destroy all that speak a lie. Accordingly, one who preaches fatalism under cover of predestination is no less worthy of disapproval than one who censures predestination on the plea of fatalism.

Fatalism as a theory is groundless and born from falsehood. But faith in predestination is based on many texts of Holy Scripture. And it is altogether wrong to attribute to predestination the evil deeds of men. Their propensity to evil does not come from God’s creation but from the sin of their first parent. And no one is freed from the punishment of this sin except by the grace of our Lord Jesus Christ, which was prepared and predestined in God’s eternal design before the creation of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/prosper-of-aquitaine.html">Prosper of Aquitaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Objections of the Gauls (c. 431-32), Art. 1 in Defense of St. Augustine, trans. P. De Letter, Ancient Christian Writers, no. 32 (Westminster MD: Newman Press, 1963), p. 140.</cite></span></figcaption>

<blockquote><p>IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man.</p></blockquote>

</figure><figure class="quote" id="q-272d4de2a7" data-kw="">
<blockquote><p>But we teach that Faith, Works, and Perseverance are posterior to Election; that this is the cause, root, fountain, whence all grace in us does flow; that our Election hath no Antecedent cause, condition, or good quality on our part, but flows merely from God’s good pleasure, and mercy looking upon us, lying in our blood, corrupted with original sin, and in that case choosing us of his free mercy to be members of his Son, to whom he will give grace and glory, though others as good and nothing worse than we are permitted to lie still in the mass of corruption for the glory of his mercy to us and justice towards them, without any ground of gloriation to the one, or complaint to the other, as if any wrong were done them, when they are past by.</p></blockquote>

</figure><figure class="quote" id="q-d88e89822c" data-kw="">
<blockquote><p>16. God’s providence extensively is occupied concerning all both entities and acts of entities, and intensively is partly effective, partly permissive, partly directive.

17. Works of grace are either preparatory of it [i.e. decrees] or applicatory.

18. Secondary preparatory works of grace [such as infra decrees] can be given; primary ones [such as supra decrees] cannot be given.

19. Secondary preparatory works of grace are the eternal destination of the Mediator, and his temporal mission, and the obedience of the one sent, consisting both in his appearance and in the execution of the threefold office undertaken by him. …

24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word partly of law, partly of gospel, and the sealing of those called through sacraments.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-05eeb40900" data-kw="">
<blockquote><p>To speak more plainly: the word of God at this day, is twofold in the Church of God, 1. immediate. 2. mediate. I call that the immediate word of God, which doth proceed immediately out of God’s own mouth: and that I call mediate, which the Lord speaks by his preacher or Minister. We hold then and avouch, that the holy Scripture is that immediate and primary word of God, and to be unto us in steed of that first, immediate, and lively voice of God himself: yea, that it serves us in place not only of that lively voice of God, but also of the secret and insearchable mind of God, and of God’s unspeakable mysteries.

Our arguments are these: 1. For that this is the very will of God. They have Moses (saith he) and the prophets, that is, the books of Moses and the Prophets, Luk. 16. 29. 2. If we had nothing to supply the defect of the lively voice of God, then doubtless our state were worse then that of the old Church of the Jews, which had the oracles of God: but it is against all light of reason so to affirm.

3. Our third reason is this: The first ground of our faith must be, either the lively voice of God, or the very mind and counsel of God, or something to supply the want of God’s lively voice, and of the secret mind of God, which must also be unto us no less certain and firm, then if we heard God himself speak, or did behold and read the very mind of God; yea the very divine oracles written in God’s own breast: but now we have not the lively voice of God; now we see not the secret mind of God: therefore it must follow that we have something to supply the want of the lively voice of God, even means to reveal unto us the secret mind of God: and nothing can do this, but the sacred Scripture: therefore God’s holy written word is, and must be unto us as the very voice, and as the very mind or will of God himself manifested unto us.

The fourth reason. The Scripture contains all those things which God hath spoken in elder ages, and what God himself hath decreed in his secret counsel (so far as is meet for us to know) concerning our life and salvation: Ergo, &amp;c. Thus far of the immediate word of God. The mediate voice of God, we call the voice of the holy and true Church of God: for albeit men speak, yet the word spoken, is the word of God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), pp 42-43.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cde84f7fbd" data-kw="">
<blockquote><p>For my part I have often truly professed, that I look at many liturgies which I have read as I do at the prayers of some honest men who use little method, nor very meet words and often toss God’s name through weakness; who put that last which should be first, and that first which should be last, but yet the matter is honest and good. I would not prefer such a man in a congregation before an abler man who will speak more composedly and agreeable to the matter: But yet I would not be so peevish as utterly to refuse to join with such a one. But as God does not reject his prayers notwithstanding all his weakness, no more would I. And I had rather have such prayers than none at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 32, p. 186</span></figcaption>

<blockquote><p>40. I have before proved how faulty the priests’ calling was in Christ’s time, and the Temple and synagogue worship, and the Pharisees’ long liturgies, on pretence whereof they devoured widows’ houses, and their corrupt doctrine, and how great the faults were in the Churches of Corinth, Galatia, Ephesus, Sardis, Laodicea, Thyatira, Pergamos [Rev. 2-3], and those that James wrote to, from which none were commanded to depart;¹ And to condemn Christ or his apostles as favoring or using sinful communion is worse in Christians than it was in the Pharisees.</p></blockquote>

<blockquote><p>4. When a man, finding that God is a free and intellectual Agent, and sees, as he may by natural reason, everything ordered to a suitable end to his Being, and by a suitable means or rule conducing to that end, and finds a higher degree of being in himself than in other creatures, and consequently an higher end, and consequently an higher rule conducing to that end, he does most naturally resolve this rule into that law, which by the will of God is given to man conducing to that end, the subject of which rule must be all his internal and external actions, both in reference to God, to himself and to others: but here then is the next question, and the next degree of ignorance in men, viz. What that law or will of God is concerning man? and from hence grow those varieties and errors in worship of God. And though haply most men, knowing the true God, may by the same Light of Nature concur in the general and fundamentals of worship, viz. That God is to be feared with all reverence, loved with all intention, obeyed with all sincerity, cheerfulness and exactness: all which are but natural conclusions from the nature of God, the nature of Man, and the relation that he bears to God, as his Creator, Lord, and Preserver…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-hale.html">Matthew Hale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of God, &amp; of Ourselves I. by the Light of Nature, II. by the Sacred Scriptures</cite>, (London: 1688), pt. 1, ‘By the Light of Nature’, ch. 5, pp. 87-88</span></figcaption>

<blockquote><p>God has forbidden two things [ cf. Exodus 20:4-5]. First, the making of any picture of Him…. The other is, that no image may be worshipped…. The setting up of images in churches, is a defiling . . . By and by, folk go and kneel down to it. . . . The Papists . . . paint and portray ‘Jesus Christ’ – Who (as we know) is not only man but also God manifested in the flesh. He is God’s eternal Son, in Whom the fullness of the Godhead dwells – yes, even substantially . . . Should we have portraitures and images, whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ – that is, to wit, of His Divine Majesty? Yes! And therefore, whensoever a crucifix stands moping and mowing in the church – it is all one as if the Devil had defaced the Son of God. You see, then, that the Papists are destitute of all excuse . . . They abuse their puppets and pictures, after that fashion.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“God has forbidden two things [ cf. Exodus 20:4-5]. First, the making of any picture of Him…. The other is, that no image may be worshipped…. The setting up of images in churches, is a defiling . . . By and by, folk go and kneel down to it. . . . The Papists . . . paint and portray ‘Jesus Christ’ – Who (as we know) is not only man but also God manifested in the flesh. He is God’s eternal Son, in Whom the fullness of the Godhead dwells – yes, even substantially . . . Should we have portraitures and images, whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ – that is, to wit, of His Divine Majesty? Yes! And therefore, whensoever a crucifix stands moping and mowing in the church – it is all one as if the Devil had defaced the Son of God. You see, then, that the Papists are destitute of all excuse . . . They abuse their puppets and pictures, after that fashion.”

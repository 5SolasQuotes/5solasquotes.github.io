<main class="wrap"><figure class="quote" id="q-4d340c9605" data-kw="">
<blockquote><p>By the way, we may here take notice of St Paul’s great and entire respect which he bare to his countrymen the Hebrews, in that he opens unto them the mysteries of salvation in the most friendly manner that could be, by writing an epistle unto them in particular; and sweetly persuading them to abide constant in the faith, that they might be the rather induced thereto. And this he doth not only by general instructions and exhortations in common to all of all sorts, but also by a familiar and friendly epistle in special directed to them.

St Paul planted not any church of the Hebrews alone, as he did of the Corinthians, Galatians, Ephesians, and other Grecians, for he was after an especial manner the apostle of the Gentiles, Rom. xi. 18, yet he took all occasions to gain and establish the Jews; thereupon he saith, 1 Cor. vi. 20, ‘Unto the Jews I became as a Jew, that I might gain the Jews.’ Hereby he giveth proof of that which he professeth: Rom. x. 1, ‘My heart’s desire and prayer to God for Israel is, that they might be saved;’ and Rom. ix. 4, ‘I could wish that myself were accursed from Christ for my brethren, my kinsmen after the flesh, who were Israelites.’

Oh that this mind were in all Christians towards their brethren, their kindred, their countrymen, and others to whom by any special bonds of relation they are knit? This is the best use that can be made of such bonds, and the most principal end that we ought therein to aim at, namely, a mutual, spiritual edification. Happy are those countries that have many such countrymen, who, though they have charges over other countries, yet cannot be unmindful of their own country; but being absent from them, will notwithstanding write to them of the common salvation; and that though the more abundantly they love them, the less they are loved of them; yea, though they persecuted them with all eagerness wheresoever they met them. Thus Paul manifested a true Christian spirit, by overcoming evil with goodness. Behold a pattern worthy of all imitation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Whole Epistle to the Hebrews. Being the Substance of Thirty Years’ Wednesday’s Lectures at Blackfriars, London</cite>, Nichol’s Series of Commentaries (1655; 3 vols, Edinburgh: James Nichol, 1866-67), 1: 5-6.</span></figcaption>

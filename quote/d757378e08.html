<blockquote><p>The Shorter Catechism agreed upon by the Assembly of divines at Westminster, and presented to the honorable Houses of Parliament then sitting, and by them ordered to be printed and published, but no man enjoined to use it, or punishable if he made use of any other to instruct his people in. This little book for the comprehensiveness of it, as also exactness of order and expression, has (as it deserves) a great esteem with many learned men, notwithstanding to be the one and only book for all capacities that are to be instructed in principles throughout the nation, is a perfection not to be expected from any common gift, nor is this for such purpose the fittest in its kind, as we shall endeavor to show in this dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light</cite>, Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662., pp. 10-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-38ea01de78" data-kw="Decrees of councils">
<blockquote><p>Neither are all the decrees of all councils to be esteemed divine, but those which are supported by the authority of scripture, as we shall shew hereafter in its fitting place.</p></blockquote>

</figure><figure class="quote" id="q-f2bf9595a9" data-kw="">
<blockquote><p>… Many other moderate passages I could show in our Assembly’s Confession to some that have need to imitate them, and the Antinomians may see their doctrine subverted in their excellent definition of saving faith, in both Catechisms and in the Confession; in their determination of the natural effects of sin in whomsoever, ch. 6, sect. 6, in their determination of the necessity of repentance (as sine qua non) to remission, ch. 15:3, with more the like. And now if they have any standing rule to know a Papist or Arminian, I think I have acquit myself from their accusation; But if there be no rule of the orthodox doctrine and for rejection of error but the giddy distracted brains of Libertines that know not where to fix themselves, then I am content to bear the name of Jesuit, Papist or what these men shall please to call me. Yet let me add this, lest my seeking to satisfy the offended may draw me into guilt; Though I have voluntarily myself professed my consent to these several canons and confessions of faith, yet, for the Synod of Dort, the Confession of our Assembly; yea, or the larger Catechism, without some correction, I do hereby protest my dissent against the so imposing them to a word upon all ministers, that no man that cannot subscribe to them shall be permitted in the Church: Whether our Confession were intended for such a necessary test, I know not well; But that the Synod of Dort was, is expressed in the end. I abhor unlimited liberty of conscience, so called, that is, of divulging intolerable doctrines; and I lament also that instead of moderation, the Churches for 1,300 years [since 300 AD] have been so guilty of proud and cruel tyranny. There is singular use for a full body of theology, or a profession concluded on by such reverend assemblies, that the younger ministers may be taught by it, and the reverence of it may restrain them from rash contradicting it: And there is a necessity of exercising power in ministerial assemblies, for the actual restraint of such as shall teach things intolerably unsound: and all ministers should be there accountable for their doctrine. But before any forms be tendered us to subscribe, we must have them reduced into a narrower room, and into phrase so clearly rational or Scriptural, as no sober, studious, competent, godly divine shall scruple: Call it Socinian, or what name soever imperious faction shall put upon it, yet tender consciences will expect this, and the Churches shall never have peace in any other way, unless I be a false prophet; and the contrary course does but tend to do the same in doctrine, as the Common Prayer Book did in worship, even to ensnare the most conscientious, and work them out of the ministry by degrees, and to create us insensibly a lazy formal ministry that will take all upon trust and run to the authority of their confession instead of their Bible. I have long feared that the toleration threatened in these times for all is a judgment of God for our running into the tyrannical extreme so long; and I withal hope that He will turn this judgment to a mercy. Though I dislike too much liberty in the commonwealth more than too little (and in the Church much more such toleration is intolerable, in cases of clear duty or sin), yet I fear tyranny more than too much toleration:

1. For experience sadly tells me that tyrannical usurpation of dominion over men’s faith has distracted the Church, even beyond any visible probability of recovery; and it has been the cause of its misery for 1,300 years; but the experience of the mischiefs of toleration is nothing so great.

2. And I know that man’s nature is so prone to proud domineering, and so idolatrously inclined to have all men of their mind, and to dance after their pipe, that it will be still by assing rulers to that extreme: So that it’s easy without a spirit of prophesy to foretell that unlimited tolerations will not long be granted by anyone except a mere infidel, that having no religion himself, cares for nothing but his own politic ends; or a Julian that is contriving the extirpation of religion, and intends by the tailing of foxes to fire the field of Christ rather than by the yoking of oxen to plow and sow it. And policy will never long work that way neither, without some persecution intermixed. It’s easy to prognosticate this to him that knows what the heart of man is. So that for my part, I think the cause of God’s permission of too much looseness in these times, is to cure our former rigor and our being righteous and orthodox overmuch, by suffering men to go as much too far into the contrary extremes. Little do some men lay this to heart, who only continue exclamations (though deserved) against toleration, when it is but their own disease and what they have caused, that God is curing by this sad remedy. They should rather see their sin in this glass and be humbled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: R.W., 1655), ch. 2, sect. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

ering%2C+and+so+idolatrously+inclined+to+have+all+men+of+their+mind%2C+and+to+dance+after+their+pipe%2C+that+it+will+be+still+by+assing+rulers+to+that+extreme%3A+So+that+it%E2%80%99s+easy+without+a+spirit+of+prophesy+to+foretell+that+unlimited+tolerations+will+not+long+be+granted+by+anyone+except+a+mere+infidel%2C+that+having+no+religion+himself%2C+cares+for+nothing+but+his+own+politic+ends%3B+or+a+Julian+that+is+contriving+the+extirpation+of+religion%2C+and+intends+by+the+tailing+of+foxes+to+fire+the+field+of+Christ+rather+than+by+the+yoking+of+oxen+to+plow+and+sow+it.+And+policy+will+never+long+work+that+way+neither%2C+without+some+persecution+intermixed.+It%E2%80%99s+easy+to+prognosticate+this+to+him+that+knows+what+the+heart+of+man+is.+So+that+for+my+part%2C+I+think+the+cause+of+God%E2%80%99s+permission+of+too+much+looseness+in+these+times%2C+is+to+cure+our+former+rigor+and+our+being+righteous+and+orthodox+overmuch%2C+by+suffering+men+to+go+as+much+too+far+into+the+contrary+extremes.+Little+do+some+men+lay+this+to+heart%2C+who+only+continue+exclamations+%28though+deserved%29+against+toleration%2C+when+it+is+but+their+own+disease+and+what+they+have+caused%2C+that+God+is+curing+by+this+sad+remedy.+They+should+rather+see+their+sin+in+this+glass+and+be+humbled.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%2C+%E2%80%A6+%28London%3A+R.W.%2C+1655%29%2C+ch.+2%2C+sect.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2bf9595a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2bf9595a9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Many%20other%20moderate%20passages%20I%20could,in%20this%20glass%20and%20be%20humbled&amp;text=Many%20other%20moderate%20passages%20I%20could%20show%20in&amp;text=their%20sin%20in%20this%20glass%20and%20be%20humbled" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d21fb44e30" data-kw="">
<blockquote><p>We must for the honor of all those of either persuasion, with whom we have confered, declare that the professions and desires of all for the advancement of piety and true godliness are the same, their professions of zeal for the peace of the Church the same, of affection and duty to us the same; they all approve episcopacy;¹ they all approve a set form of liturgy; and they all disapprove and dislike the sin of sacrilege, and the alienation of the revenue of the Church. And if upon these excellent foundations, in submission to which there is such an harmony of affections, any superstructure should be raised to the shaking of these foundations, and to the contracting and lessening of the blessed gift of charity, which is a vital part of Christian religion, we shall think ourself very unfortunate, and even suspect that we are defective in that administration of government with which God has entrusted us.</p></blockquote>

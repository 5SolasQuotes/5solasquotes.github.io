</figure><figure class="quote" id="q-6867dcfd5e" data-kw="">
<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved: 1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law. 2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock. 3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">Degrees of Impurities</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London Ministers | A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop.</cite>, p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

0corrupt%20thing%20and%20abominable%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c5030f757" data-kw="">
<blockquote><p>III. Unto this catholick visible church Christ hath given the ministry, oracles, and ordinances of God, for the gathering and perfecting of the saints in this life, to the end of the world; and doth by his own presence and Spirit, according to his promise, make them effectual thereunto.[g] [g] 1 Cor. 12:28. Eph. 4:11-13. Matt. 28:19,20. Isa. 59:21. IV. This catholick church hath been sometimes more, sometimes less visible.[h] And particular churches, which are members thereof, are more or less pure, according as the doctrine of the gospel is taught and embraced, ordinances administered, and publick worship performed more or less purely in them.[i] [h] Rom. 11:3,4. Rev. 12:6,14. [i] Rev. 2-3. 1 Cor. 5:6,7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 25, ‘Of the Church’</span></figcaption>

</figure><figure class="quote" id="q-bcb0b77408" data-kw="">
<blockquote><p>I deny not but a private Christian may dislike the corruptions that are allowed and practiced by a whole Church, he may refuse to subscribe or yield his consent unto them, he may by prayer and all other good means seek the reformation of them: but that any one private Christian or some few several assemblies [such as, of the Separatists] wherein also there are some learned men may account all the churches that are in an whole nation to be either as heathens (that is, such as are destitute of the Word and sacraments and service of God) or as publicans (that is, such as with whom they may not lawfully communicate and join in the said service of God), that do I utterly deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 5</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

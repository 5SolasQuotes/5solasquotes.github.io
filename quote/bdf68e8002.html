<blockquote><p>Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other.” [Historical Theology, vol. 2, p. 333] And it is but natural that this should be so. If Christ was to save an elect race, gradually called out of the world of humanity in the course of centuries, it became necessary for God to exercise forbearance, to check the course of evil, to promote the development of the natural powers of man, to keep alive within the hearts of men a desire for civil righteousness, for external morality and good order in society, and to shower untold blessings upon mankind in general. Dr. [Charles] Hodge expresses it thus: ‘It is very plain that any plan designed to secure the salvation of an elect portion of a race propagated by generation and living in association, as is the case with mankind, cannot secure its end without greatly affecting, for better or for worse, the character and destiny of all the rest of the race not elected.’ He quotes Dr. [Robert] Candlish to the effect that ‘the entire history of the human race, from the apostasy to the final judgment, is a dispensation of forbearance in respect to the reprobate, in which many blessings, physical and moral, affecting their characters and destinies forever, accrue even to the heathen, and many more to the educated and refined citizens of Christian communities. These come to them through the mediation of Christ, and coming to them now, must have been designed for them from the beginning.’ [The Atonement, pp. 358 ff.] These general blessings of mankind, indirectly resulting from the atoning work of Christ, were not only foreseen by God, but designed by Him as blessings for all concerned. It is perfectly true, of course, that the design of God in the work of Christ pertained primarily and directly, not to the temporal well-being of men in general, but to the redemption of the elect; but secondarily and indirectly it also included the natural blessings bestowed on mankind indiscriminately. All that the natural man receives other than curse and death is an indirect result of the redemptive work of Christ. [Cf Turretin, Opera, Locus XIV, Q. XIV, par. XI; Witsius, De Verbonden, B. II, Kap. 9, s. 4; Cunningham, Hist. Theol. II, p. 332; Symington, Atonement and Intercession, p. 255; Bavinck, Geref. Dogm. III, p. 535; Vos, Ger. Dogm. III, p. 150.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1950) | “C. COMMON GRACE AND THE ATONING WORK OF CHRIST. | Reformed theologians generally hesitate to say that Christ by His atoning blood merited these blessings for the impenitent and reprobate. At the same time they do believe that important natural benefits accrue to the whole human race from the death of Christ, and that in these benefits the unbelieving, the impenitent, and the reprobate also share. In every covenant transaction recorded in Scripture it appears that the covenant of grace carries with it not only spiritual but also material blessings, and those material blessings are generally of such a kind that they are naturally shared also by unbelievers. Says [William] Cunningham:</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67c096ad66" data-kw="">
<blockquote><p>In point of fact, the Old Testament has a great deal to teach on the benevolent side of God’s self-revelation to the world at large. The strongest of terms are used on occasion to emphasize this truth. Even the covenant conception is not deemed too sacred to be employed for the purpose of describing the solemn manner in which God pledged to the whole of creation, in the day of Noah, His abundant, ever-flowing kindness in the sphere of natural life, His longsuffering in the view of universal sin, His common grace working for the restraint of sin. It is attributed to His righteousness, universally revealed, that He keeps this covenant and preserves man and beast. As Jonah took pity on his gourd, so He pities and spares the Ninevites and their cattle. His mercy is wider and deeper than the ocean of human misery.</p></blockquote>

<blockquote><p>Dr. Preston answered that Christ was in himself sufficient to save all; and might be said to be provided for that end and use; as a medicine is to cure infected poison, though it cures none actually but those that drink it. “Habet in se quod omnibus prosit, sed, si non bibitur, non,” as in 1 John 5:11-12. But many did not thus apply Christ, because they had him not so offered and exhibited as others had, Matt 11:21; Luke 10:13, for God gave some faith and repentance, as I have showed. The serpent (Moses was commanded to make), was in itself sufficient to cure those that were bitten, Num. 21:8-9, yet cured none but only those who looked on it. “So, as Moses lifted up the Serpent in the wilderness, shall the Son of Man be lifted up, that whosoever believed in Him should not perish but have everlasting life,” John 3:14-15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This is John Ball’s</cite>, (1590-1659) narrative of Preston’s debate with the Arminian Francis White (1564-1638). From Ball’s, The Life of the Renowned Doctor Preston, ed. by E. W. Harcourt (London: Parker &amp; Co., 1885), p. 135. This quote was compiled by Tony Byrne.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Dr. Preston answered that Christ was in himself sufficient to save all; and might be said to be provided for that end and use; as a medicine is to cure infected poison, though it cures none actually but those that drink it. “Habet in se quod omnibus prosit, sed, si non bibitur, non,” as in 1 John 5:11-12. But many did not thus apply Christ, because they had him not so offered and exhibited as others had, Matt 11:21; Luke 10:13, for God gave some faith and repentance, as I have showed. The serpent (Moses was commanded to make), was in itself sufficient to cure those that were bitten, Num. 21:8-9, yet cured none but only those who looked on it. “So, as Moses lifted up the Serpent in the wilderness, shall the Son of Man be lifted up, that whosoever believed in Him should not perish but have everlasting life,” John 3:14-15.”

— John Preston, This is John Ball’s (1590-1659) narrative of Preston’s debate with the Arminian Francis White (1564-1638). From Ball’s, The Life of the Renowned Doctor Preston, ed. by E. W. Harcourt (London: Parker &amp; Co., 1885), p. 135. This quote was compiled by Tony Byrne.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDr.+Preston+answered+that+Christ+was+in+himself+sufficient+to+save+all%3B+and+might+be+said+to+be+provided+for+that+end+and+use%3B+as+a+medicine+is+to+cure+infected+poison%2C+though+it+cures+none+actually+but+those+that+drink+it.+%E2%80%9CHabet+in+se+quod+omnibus+prosit%2C+sed%2C+si+non+bibitur%2C+non%2C%E2%80%9D+as+in+1+John+5%3A11-12.+But+many+did+not+thus+apply+Christ%2C+because+they+had+him+not+so+offered+and+exhibited+as+others+had%2C+Matt+11%3A21%3B+Luke+10%3A13%2C+for+God+gave+some+faith+and+repentance%2C+as+I+have+showed.+The+serpent+%28Moses+was+commanded+to+make%29%2C+was+in+itself+sufficient+to+cure+those+that+were+bitten%2C+Num.+21%3A8-9%2C+yet+cured+none+but+only+those+who+looked+on+it.+%E2%80%9CSo%2C+as+Moses+lifted+up+the+Serpent+in+the+wilderness%2C+shall+the+Son+of+Man+be+lifted+up%2C+that+whosoever+believed+in+Him+should+not+perish+but+have+everlasting+life%2C%E2%80%9D+John+3%3A14-15.%E2%80%9D%0A%0A%E2%80%94+John+Preston%2C+This+is+John+Ball%E2%80%99s+%281590-1659%29+narrative+of+Preston%E2%80%99s+debate+with+the+Arminian+Francis+White+%281564-1638%29.+From+Ball%E2%80%99s%2C+The+Life+of+the+Renowned+Doctor+Preston%2C+ed.+by+E.+W.+Harcourt+%28London%3A+Parker+%26+Co.%2C+1885%29%2C+p.+135.+This+quote+was+compiled+by+Tony+Byrne.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed4087ec9b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed4087ec9b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/atonement/redemptive-benefits-for-the-reprobate/#:~:text=Dr.%20Preston%20answered%20that%20Christ%20was,but

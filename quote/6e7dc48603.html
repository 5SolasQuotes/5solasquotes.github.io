<main class="wrap"><figure class="quote" id="q-6e7dc48603" data-kw="">
<blockquote><p>That which is lawful for them to do… that is lawful for others to join with them in: for that which is no sin in the principal is none in the accessory, ceteris paribus [other things being equal]. And it cannot be simply unlawful to join in any action that is lawful, quatenus talis [so far as it is such].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to John Robinson’</cite>, (1611) in The Works of John Robinson (London: Snow, 1851), 3.86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-a54fce382a" data-kw="">
<blockquote><p>3. It is an untrue supposition and but a begging of the question that our presence with anything obtruded unlawfully is a prejudice to that fundamental of the sovereignty of Christ. All men that sin do sin against his soveraignty: And all that obtrude anything unlawfully sin against it by that obtrusion. But if you obtrude a rash and passionate prayer on the people, or an erroneous or disorderly prayer, or an ill-composed hymn or psalm, their presence is no approbation of your error, nor denying of Christ’s sovereignty. Do you, or can you believe and make all your followers believe that the synagogue-worship and the Temple-worship were kept so pure by the priests, Levites and Pharisees in Christ’s days, as that there was nothing of human tradition obtruded? Or nothing but what God commanded? Can you believe this? Or can you believe that Christ was not usually or often present there? See Luke 4:16. At Nazareth where he had been brought up, as his custom was, he went into the synagogue on the Sabbath day—And of Paul its said, Acts 17:2. As his manner was, he went in to them, and three Sabbath dayes reasoned—Or do you believe, that Christ was a sinner? and that He contradicted his own sovereignty? What! and yet be a perfect Saviour? Who is it now that prejudices fundamentals?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London: Simmons, 1671), pp. 116-17</span></figcaption>

upposition,is%20it%20now%20that%20prejudices%20fundamentals&amp;text=3.%20It%20is%20an%20untrue%20supposition%20and%20but&amp;text=Saviour%3F%20Who%20is%20it%20now%20that%20prejudices%20fundamentals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-9e932db576" data-kw="">
<blockquote><p>It shall be no grief of heart to you afterward that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Acts 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’</p></blockquote>

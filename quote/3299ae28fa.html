<blockquote><p>Question: But how could he [Paul] wish this [to be accursed from Christ for his brethren’s sake, in Rom. 9:3], seeing it imports a diminution of the love of God… Answer: If ye will consider this petition by itself, it was neither sin nor dimunition of this love: but if ye will consider the consequents of this wish, if indeed he had been excluded from the Kingdome of heaven, then it had been a sin for him to have wished it. One may wish a thing simply without sin, yet to wish it vestitum omnibus circumstantiis [clothed with all circumstances] it may be sin. Example: a woman has her husband to be executed for some capital offence, the woman wished her husband to live, as her husband and a father to her children to provide for them; but if she should desire her husband to live as an enemy to the commonwealth contrary to the law, then her wish were a sinful wish: So for Paul to wish this to testify his earnest love to the Church, it was no sin; but if he had wished it vestitum ominibus circumstantiis, with a diminution of the love of God and want of eternal happiness, then his wish had been sin. Again we wish a thing antecedente voluntate vel consequente voluntate, ‘with an antecedent or consequent will.’ Example: a judge by his antecedent will wishes that all the subjects may live; but by his consequent will, he wishes the malefactor to die. So Paul wished this by his antecedent will, but not considering it with all the consequents that might follow upon it. Fourthly, Paul wished not this absolutely, but in comparison: as the natural mother who pleaded before Solomon chose rather that the child should be given to her who was not the mother of it than that the child should be cut in two, 1 Kn. 3:26. If ye consider Paul’s wish here, it was only in comparison; rather than they should die, he wishes this to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Moral Law, or Ten Commandments</cite>, ... (London: Cotes, 1632), bk. 1, Commandment 1, Exercitation 7, pp. 50-51</span></figcaption>

<blockquote><p>Three things are to be observed in this speech:

1. God’s resolution not always to strive with man by his Spirit. My Spirit has striven a great while; it shall strive yet a little longer; but it shall not strive always. The Holy Spirit is a striving Spirit with the children of men; striving them away from sin, and to bring them to God; striving by the checks of their own consciences, but the ministry of the Word, by the rebukes of Providence; striving by one fair warning after another to reclaim the sinner. Have not we ourselves experienced these strivings?—something within us that has whispered in an hour of temptation, “Do not this abominable thing which the Lord hates?” ‘Twill be our wisdom to hearken to such whispers, and to close with them, striving against sin. Heb 12:4. If the Spirit of God be resisted in its strivings, and quenched in its motions, though it may strive long, yet it will not strive always. ‘Tis a principle with men not to be always persuading those with whom they cannot prevail; neither will the blessed Spirit do so. If Ephraim be joined to idols, is it not a righteous thing with God to say, Strive no more with him, let him alone? Hosea 4:17. What guest will stay long there where he is not welcome? Is it not wisdom then to improve these strivings while we have them?

2. The reason of that resolution: For that he also is flesh; carnal, earthly, sensual, corrupted, depraved, defiled; and therefore ‘tis to no purpose to strive with him; ‘tis but labor lost. It is as good to go about to change the Ethiopian’s skin or the leopard’s spots, as to reclaim and reform these impenitent sinners. Flesh, in scripture, is frequently opposed to spirit. It is the corrupt nature that renders the strivings of the blessed Spirit ineffectual. ‘Tis the law in the members that wars against the law of the mind. Rom. 7:23. The flesh and the spirit are sworn enemies one to another, and between them there is a constant conflict. Gal. 5:17. Now where the flesh, the carnal part, is so far suffered to prevail, as that the man may be denominated flesh, there the Spirit will not always, will not long strive. Those therefore that would enjoy the Spirit’s strivings, must curb and restrain, and not gratify and encourage, the corrupt motions and carnal desires of the flesh and of the mind. Eph. 2:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-henry.html">Philip Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the First 11 Chapters of Genesis</cite>, (d. 1696; London: Nisbet &amp; Co., 1839), pp. 166-67 on Gen. 6:3, “And the Lord said, My Spirit shall not always strive with man, for that he also is flesh.”</span></figcaption>

<blockquote><p>Further, there are some which interpret these words of the apostle [1 Tim. 4:2, “God will have all men to be saved”], of the will of the sign or of the antecedent, that all men are invited, for that preaching is indifferently set forth to all men. Neither is there any, in a manner, which inwardly feels not some prick whereby he is oftimes stirred up to live well. So that if we respect this will of God, we easily grant that He will have all men to be saved. But they will not have it to be understood of the hidden and effectual will, which they call consequent: and after this manner may those kinds of speech be understood: ‘God lightens every man which comes into this world;’ (Jn. 1:9) ‘Come unto Me all ye which labor, and are laden.’ (Mt. 11:21) For all men are provoked by the oracles of God, and all men are inwardly moved by some provoking. All these interpretations are doubtless very likely, and also apt… 46. They object also a sentence of Christ, ‘How often would I have gathered together thy children, as a hen gathers together her chickens, and thou wouldest not?’ (Mt. 23:37) But here also is meant of the antecedent will of the sign, whereby God by his prophets, preachers, apostles and scriptures, many times invited the Jews to fly unto Him by repentance: which yet they refused to do. But yet God, by his effectual will, which they call consequent, perpetually drew to Him those that were his: neither was there ever any age wherein He gathered not together as many of the Hebrews as He had predestinated. Therefore Augustine said, ‘Those which I would, I have gathered together, although thou wouldest not.&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bd5ab9a36a" data-kw="">
<blockquote><p>“We teach not that the prophet ought to compel any, nor that the sword is an ordinance of God to convert oppressors and murderers to turn meek and righteous judges; co-action by fire and sword in Old or New Testament can convert none to Christ; the word and the Spirit must ever do the turn: [but] by accident God can change the nature of the rod and sanctify it to Manasseh, for to bring him to humiliation and repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London: R.I. for Andrew Crook, 1649), ch. 26, p. 341</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f49e77fc1" data-kw="">
<blockquote><p>47. The matter may further be thus illustrated: There is almost the like respect and consideration of the Magistrate as he is occupied about the outward things of the Church, and of the ecclesiastic ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience. It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the Word of God, and out of it to show to the Magistrate his duty, to wit, how he ought to govern the commonwealth and in what manner he ought to use the sword. The former is proper and peculiar to the Magistrate (neither does the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers. … 63. The same sin therefore in the same man may be punished one way by the civil, another way by the ecclesiastical power; by the civil power under the formality of a crime, with corporal or pecuniary punishment; By the ecclesiastical power, under the notion and nature of scandal, with a spiritual censure, even as also the same civil question is one way deliberate upon and handled by the Magistrate in the Senate or place of Judgment; another way by the minister of the Church, in the presbytery or synod; by the magistrate so far as it pertains to the government of the commonwealth, by the minister, so far as it respects the conscience; for the ecclesiastical ministry also is exercised about civil things spiritually, in so far as it teaches and admonishes the magistrate out of the Word of God what is best and most acceptable unto God, or as it reproves freely unjust judgments, unjust wars, and the like, and out of the Scripture threatens the wrath of God to be revealed against all unrighteousness of men; So also is the magistrate said to be occupied civilly about spiritual things.</p></blockquote>

<blockquote><p>3. There is also a difference betwixt a war raised of purpose to force the supreme magistrate to be of the same religion with the subject, or else to dethrone him, and a war raised to defend that religion which both magistrate and subject owns…</p></blockquote>

</figure><figure class="quote" id="q-9e6ae97590" data-kw="">
<blockquote><p>Of the promises it is evident, that to lawful powers is given the sword for punishment of malefactors, for maintenance of innocents, and for the profit and utility of their subjects. Now let us consider, whether the reformation of religion fallen in decay, and punishment of false teachers, do pertain to the Civil Magistrate and Nobility of any realm. I am not ignorant that Satan of old time, for maintenance of his darkness, has obtained of the blind world two chief points: Former, he has persuaded to Princes, Rulers, and Magistrates, that the feeding of Christ’s flock appertains nothing to their charge, but that it is rejected [i.e., devolved] upon the bishops and estate ecclesiastical: and secondarily, that the reformation of religion, be it never so corrupt, and the punishment of such as be sworn soldiers in their kingdom, are exempted from all civil power [per Romanism, for the clergy], and are reserved to themselves and to their own cognition. But that no offender can justly be exempted from punishment, and that the ordering and reformation of religion, with the instruction of subjects, does especially pertain to the Civil Magistrate, shall God’s perfect ordinance, his plain Word, and the facts and examples of those that of God are highly praised, most evidently declare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Appellation, to the Nobility and Estates of Scotland</cite>, …’ (1558)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).”

— London Presbyterians, Jus Divinum, the Divine Right of Church Government… (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPapists+exempt+their+clergy+from+the+judgment+of+the+civil+power+%28though+they+be+delinquents+against+it%29+and+their+%5Be%5Dstates%2C+both+civil+and+spiritual%2C+from+civil+taxes%2C+tributes%2C+and+penalties%2C+both+which+%5Bpapal+positions%5D+we+deny+to+ours%2C+for%3A+%281%29+This+is+repugnant+to+the+law+of+nature%2C+that+church+officers+and+members%2C+as+parts+and+members+of+the+commonwealth%2C+should+not+be+subject+to+the+government+of+that+commonwealth+whereof+they+are+parts.+%282%29+%5BThis+is%5D+repugnant+to+the+laws+and+practices+of+the+Old+Testament%2C+under+which+we+read+of+no+such+exemptions.+Yea%2C+we+have+instance+of+Abiathar+the+highpriest%2C+who%2C+for+his+partnership+with+Adonijah+in+his+rebellion%2C+was+exiled+by+king+Solomon%2C+and+so+consequently+deprived+of+the+exercise+of+his+office+%281+Kings+2%3A26-27%29.+%283%29+%5BThis+is%5D+inconsistent+with+our+Savior%E2%80%99s+example%2C+who%2C+as+subject+to+the+law%2C+held+himself+obliged+to+pay+tribute+to+avoid+offence+%28Mt.+17%3A26%29%2C+which+was+an+active+scandal%3B+and+He+confesses+Pilate%E2%80%99s+power+to+condemn+or+release+Him+was+given+Him+from+above+%28John+19%3A11%29.+%284%29+And+finally%2C+%5Bthis+is%5D+contrary+to+the+apostolical+precepts%2C+enjoining+all+to+be+subject+to+superior+powers+%28Rom.+13%3A1-4%3B+1+Pet.+2%3A13-15%29.%E2%80%9D%0A%0A%E2%80%94+London+Presbyterians%2C+Jus+Divinum%2C+the+Divine+Right+of+Church+Government%E2%80%A6+%281646%2C+1647%2C+1654%3B+NY%3A+Robert+Martin+%26+Co.%2C+1844%29%2C+pt.+2%2C+ch.+9%2C+section+1%2C+%E2%80%98Of+the+Proper+Receptacle+%26+Distinct+Subject+

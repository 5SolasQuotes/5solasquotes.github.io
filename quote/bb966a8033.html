<blockquote><p>§98. If you ask what did the ministers all this while, I answer: they preached and prayed against disloyalty. They drew up a writing to the Lord General declaring their abhorrence of all violence against the person of the king [Charles I], and urging him and his army to take heed of such an unlawful act. They present it to the General when they saw the king in danger: But Pride prevailed against their counsels. §99. The king being thus taken out of the way, Cromwell takes on him to be for a commonwealth (but all in order to the security of the good people) till he had removed the other impediments which were yet to be removed: so that the Rump [Parliament] presently drew up a form of Engagement, to be put upon all men, viz. ‘I do promise to be true and faithful to the commonwealth as it is now established without a king or House of Lords.’ So we must take the Rump for an established commonwealth and promise fidelity to them. This the sectarian party [of Independents and sects] swallowed easily, and so did the king’s old cavaliers, so far as I was acquainted with them or could hear of them (not heartily, no doubt, but there were very few of them sick of the disease called tenderness of conscience or scrupulosity: But the presbyterians and the moderate episcopal men refused it (and I believe so did the prelatical divines of the king’s party for the most part; though the gentlemen had greater necessities [to preserve by the Engagement]). Without this Engagement no man must have the benefit of suing another at law (which kept men a little from contention and would have marred the lawyers’ trade); nor must they have any masterships in the universities, nor travel above so many miles from their houses, and more such penalties, which I remember not (so short lived a commonwealth deserved no long remembrance): Mr. [Richard] Vines and Dr. Rainbow and many more were hereupon put out of their headships in the universities, and Mr. Sidrach Sympson, and Mr. John Sadler and such others put in; yea, such a man as Mr. Dell, the chaplain of the army, who, I think, neither understood himself nor was understood by others any farther than to be one who took reason, sound doctrine, order and concord to be the intolerable maladies of Church and State, because they were the greatest strangers to his mind. But poor Dr. Edward Reynolds had the hardest measure; for when he refused to take the Engagement, his place was forfeited; and afterwards they drew him to take it, in hopes to keep his place (which was no less than the deanery of Christ’s-Church) and then turned him out of all, and offered his place to Mr. Joseph Caryl; but he refusing it, it was conferred on Dr. [John] Owen, to whom it was continued from year to year. And because the presbyterians still urged the [Solemn League and] Covenant against killing the king, and pulling down the parliament, and setting up a commonwealth, and taking the Engagement, some of the Independent brethren maintained that its obligation ceased, because it was a league, and the occasion of it ceased: And some of the Rump said it was like an almanac out of date; and some of the soldiers said they never took it; and others of them railed at it as a Scottish snare: So that when their interest would not suffer them to keep so solemn a vow, their wills would not suffer their judgments to confess it to be obligatory, at least as to the part which they must violate. §100. For my own part, though I kept the town and parish of Kidderminster from taking the Covenant (and seeing how it might become a snare to their consciences) yea, and most of Worcestershire besides, by keeping the ministers from offering it in any of the congregations to the people (except in Worcester City, where I had no great interest and know not what they did); yet I could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath, as if the bonds of national and personal vows were as easily shaked off as Sampson‘s cords. Therefore I spake and preached against the Engagement and dissuaded men from taking it. The first hour that I heard of it, being in company with some gentlemen of Worcestershire, I presently wrote down above twenty queries against it, intending as many more almost against the obligation as those were about the sense and circumstances. And one that was present got the copy of them, and shortly after I met with them verbatim in a book of Mr. Henry Hall‘s as his own (one that was long imprisoned for writing against Cromwell). Some episcopal divines that were not so scrupulous it seems as we, did write for it (private manuscripts which I have seen) and plead the irresistibility of the imposers, and they found starting holes in the terms, viz. that by “the commonwealth” they will mean the present commonwealth in genere, and by “established” they will mean only de facto and not de jure, and by “without a king, etc.” they mean not quatenus [as far as] but etsi [although], and that only de facto pro tempore [in point of fact for the time], quasi dicat [“as if to say”]: ‘I will be true to the government of England, though at the present the king and House of Lords are put out of the exercise of their power.’ These were the expositions of many episcopal men, and others that took it: But I endeavored to evince that this is mere juggling and jesting with matters too great to be jested with: And that as they might easily know that the imposers had another sense, so as easily might they know that the words in their own obvious usual sense among men must be taken as the promise or engagement of a subject as such to a form of government now pretended to be established: And that the subjects’ allegiance or fidelity to his rulers can be acknowledged and given in no plainer words: And that by such interpretations and stretchings of conscience, any treasonable oath or promise may be taken, and no bonds of society can signify much with such interpreters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times</cite>, (London: Parkhurst, 1696), pp. 64-65</span></figcaption>

sers+had+another+sense%2C+so+as+easily+might+they+know+that+the+words+in+their+own+obvious+usual+sense+among+men+must+be+taken+as+the+promise+or+engagement+of+a+subject+as+such+to+a+form+of+government+now+pretended+to+be+established%3A+And+that+the+subjects%E2%80%99+allegiance+or+fidelity+to+his+rulers+can+be+acknowledged+and+given+in+no+plainer+words%3A+And+that+by+such+interpretations+and+stretchings+of+conscience%2C+any+treasonable+oath+or+promise+may+be+taken%2C+and+no+bonds+of+society+can+signify+much+with+such+interpreters.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reliqui%C3%A6+Baxterian%C3%A6+%28London%3A+Parkhurst%2C+1696%29%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7d4c7a910.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7d4c7a910.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=98.%20If%20you%20ask%20what%20did,can%20signify%20much%20with%20such%20interpreters&amp;text=98.%20If%20you%20ask%20what%20did%20the%20ministers&amp;text=of%20society%20can%20signify%20much%20with%20such%20interpreters" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these:

1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place.

2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>

<blockquote><p>Some that live in countries where none in twenty miles openly use the New [translation of Scripture, the KJV] one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that:

1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit.

2. That when they have no public church or worship to join with, but what uses the Old [faulty] one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit.

3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says:

1. That it is a cursed thing to offer God a worse [worship] while we have better.

2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.]

3. That it is false worship and obeying man before God.

4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them.

5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers:

I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice.

II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C.]</p></blockquote>

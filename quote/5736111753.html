<main class="wrap"><figure class="quote" id="q-5736111753" data-kw="">
<blockquote><p>§26. Direction 15. It is ever unseasonable to perform a lesser duty of worship when a greater should be done: Therefore it much concerns you to be able to discern when two duties are inconsistent which is then the greater and to be preferred: In which the interest of the end must much direct you: that being usually the greatest which has the greatest tendency to the greatest good.</p></blockquote>

</figure><figure class="quote" id="q-83d617c07a" data-kw="">
<blockquote><p>Also, they [civil magistrates] might constrain them [spiritual seducers] to follow some lawful occupation, and to be diligent therein; both these are well consistent with ordering of a State, and yet it is such busy bodies (as the apostle speaks) and vagabonds, that go without their station, that often prove most hurtful to the Church, and instrumental to the Devil, as being apostles to him in such a business.</p></blockquote>

</figure><figure class="quote" id="q-eaa8ad3c22" data-kw="">
<blockquote><p>It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, p. 211</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.”

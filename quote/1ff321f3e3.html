<main class="wrap"><figure class="quote" id="q-1ff321f3e3" data-kw="">
<blockquote><p>Forgetting what we hear. If a Scholar have his Rules laid before him, and he forgets them as fast as he reads them, he will never learn. Aristotle calls the Memory, the Scribe of the Soul; and Bernard calls it the Stomach of the Soul, because it hath a retentive faculty, and turns heavenly food into blood and spirits.

We have great memories in other things; we remember that which is vain. Cyrus could remember the name of every Soldier in his huge Army; we remember injuries. This is to fill a precious Cabinet with dung; but, quàm facilis oblivio boni? as Jerome saith, how soon doe we forget the sacred truths of God? We are apt to forget three things, our faults, our friends, our instructions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Autarkeia, or, The art of divine contentment</cite>, (2nd edn, London: Ralph Smith, 1654), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf179d3ba9" data-kw="">
<blockquote><p>Her ministry should be learned and pious. Without the former, they will only betray, through ignorance, their cause into the hands of the enemy; without the latter, they will pollute the sacred sanctuary.

Consider, for a moment, what a ridiculous figure the ambassador sent to negotiate with a foreign nation would make, who could not read his master’s commission. Would such an one be qualified to be an ambassador to an earthly potentate? Is not the negotiation of the King of kings much more important than the adjustment of the differences between states and empires?

When Christ called his ministers in an extraordinary manner, he gave them extraordinary qualifications: and among these we find the gift of tongues. In 1 Tim. 1:7, those are severely reprehended, who presume to enter on an office without due qualifications: “desiring to be teachers of the law, yet understanding neither what they say, nor whereof they affirm.” Such are the clouds of illiterate, methodistic locusts which darken the horizon of these States. Without abilities, natural or acquired, they pour forth like torrents, over the face of the earth, and lead aside the simple and unwary. The infuriated zeal with which they propagate their poisonous doctrines, resembles much the character of the Scribes and Pharisees, mentioned, Matt. 23:15: “Who compass sea and land to make one proselyte, and when he is made, he is rendered twofold more the child of hell than themselves.”

Without a due measure of learning, how can they meet the cavillings of deists and crafty impostors, and so act the part of an evangelist, required, Tit. 1:9, namely, to be able to convince the gainsayers, and put adversaries to silence?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 30-1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-4fb0f1e51d" data-kw="">

</figure><figure class="quote" id="q-c888c44880" data-kw="">
<blockquote><p>The author with the Scriptures makes a pastor, a bishop, a preaching elder, to be altogether one and in nothing to differ, but as three synonymous names of one and the same officer, which by divine right is indeed superior to a ruling elder, or presbyter; this no man ever did question, but no way superior to a preaching elder [as presbyterians hold], of whom alone is all the present question [with episcopacy].</p></blockquote>

</figure><figure class="quote" id="q-9f507a876f" data-kw="">
<blockquote><p>Nor is the right of examination founded in this—that we ought to believe ourselves wiser and more sagacious than entire synods and the whole true church; but in this—that since the privilege of infallibility has been granted by God to no church or pastor, nor are we certain whether they who compose ecclesiastical assemblies are members of the true church and faithful servants of God, who are partakers of the Holy Spirit and follow his guidance; nay, it can happen (and it has too often happened) that such assemblies have erred in their decisions. Hence no other means is left for the believer to know the legitimate authority of these assemblies and the decisions made by them with the certainty of faith, than a comparison and examination of them with the word of God, which he not only permits as possible and lawful, but commands as just and necessary.</p></blockquote>

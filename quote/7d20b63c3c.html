<main class="wrap"><figure class="quote" id="q-7d20b63c3c" data-kw="">
<blockquote><p>Something of this work ought to be done every day; no day must pass without some solemn acts of religious worship, both morning and evening; when we address ourselves to the work of the day, and when we compose ourselves to the rest of the night, we ought actually to acknowledge God, both by our prayers and praises, as our Protector, Guide, and Benefactor. “Six days shalt thou labour, and do all thy work” (Exodus 20:9); and is this no part of our work? Is it not the most needful and excellent work we have to do? Those who live without daily worship live without God in the world. As God allows us time for works of necessity and mercy out of His day, so we ought to allow time for works of piety and devotion out of our days; else we are not only undutiful, but very ungrateful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath: A Serious Address to those that Profane the Lord’s Day</cite>, (1713; Grand Rapids MI: Torwood Press, 2013), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>We knew that these psalms, and hymns and spiritual songs, though in other languages (and consequently so in other poetical measures) were inspired by the Holy-Ghost, to holy men of old for the edification and comfort of the Church and people of God in all ensuing ages to the end of the world. And for these holy ends we have with special care &amp; diligence translated them into such meters as are most usual and suitable for such holy poems, in our own language, having a special eye to the gravity of the phrase of sacred writ and sweetness of the verse.</p></blockquote>

</figure><figure class="quote" id="q-2a4b49c03e" data-kw="">
<blockquote><p>There was a tumultuous company of women this day to the Parliament Houses, and cried for peace, and they would have peace, whatsoever came on it. But they parted without any hurt. …

<blockquote><p>That the Sabbath of the Decalogue was not a ceremonial command is proved by the fact that its violation was made a capital offence. (See Ex. 31: 14.) No ceremonial command was thus enforced. Even circumcision, fundamental as it was to the whole economy, was not thus fenced up. Its neglect of course excluded a man from the Church, but it incurred no capital penalty.</p></blockquote>

<blockquote><p>§41.

2. And for kneeling at the sacrament, I doubt not at all but the imposing it, and that on such rigorous terms, tying all to it and casting all out of the communion of the Church or from the participation of the sacrament that durst not use it, was a very grievous sin and tended to persecution, injustice and Church-dividing. It is certainly in a doubtful case the safest way to do as Christ and his apostles, and the universal Church did for many hundred years. That none should kneel in public worship on the Lord’s Day, no not in prayer, much less in receiving the eucharist, was a Custom so ancient and universal in the Church, that it was everywhere observed before general councils were made use of; and in the first general Council of Nicea it was made the last canon; and other general councils afterward renewed it; so that I know not how any ceremony can possibly pretend to greater ecclesiastical authority than this had. And to cast out all from Church communion in sacraments that dare not go against the examples of Christ and his apostles, and all the primitive Church (who long received the eucharist in another gesture) and against the canons of the first and most famous, and other succeeding general councils, this is a most inhumane part. Either the gesture is indifferent in itself or not: If it be, how dare they thus divide the Church by it and cast out Christians that scruple it when they have these and many other reasons of their scruples (which for brevity I omit). If they say that kneeling is of itself necessary, and not indifferent, because it is reverent etc. then:

1. They make Christ an imperfect Lawgiver:

2. They make Himself or his apostles, or both to have been sinners.

3. They condemn the catholic Church of sin.

4. They condemn the canons of the chief general councils.

5. And then if the bishops themselves in council should change the gesture, it were unlawful to obey them. All which are consequents that I suppose they will disown. What a perverse preposterous reverence is this? when they have leave to lie in the dust before and after the very act of receiving, through all their confessions and prayers, yet they will at other times stand, and many of them sit at prayer, and sit at singing Psalms of Prayer and Praise to God, and yet when Christ doth invite them to a feast, they dare not imitate his apostles and universal Church in their gesture, lest they should be sinfully unreverent. §42. But yet, as sinfully as this gesture was imposed, for my part I did obey the imposer and would do if it were to do again, rather than disturb the peace of the Church, or be deprived of its communion. For God having made some gesture necessary and confined me to none, but left it to humane determination, I shall submit to magistrates in their proper work, even when they miss it in the manner. I am not sure that Christ intended the example of Himself and his apostles as obligatory to us that shall succeed. I am sure it proves sitting lawful: but I am not sure that it proves it necessary: (though very convenient). But I am sure He has commanded me obedience and peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 410-11</span></figcaption>

5. And then if the bishops themselves in council should change the gesture, it were unlawful to obey them. All which are consequents that I suppose they will disown. What a perverse preposterous reverence is this? when they have leave to lie in the dust before and after the very act of receiving, through all their confessions and prayers, yet they will at other times stand, and many of them sit at prayer, and sit at singing Psalms of Prayer and Praise to God, and yet when Christ doth invite them to a feast, they dare not imitate his apostles and universal Church in their gesture, lest they should be sinfully unreverent. §42. But yet, as sinfully as this gesture was imposed, for my part I did obey the imposer and would do if it were to do again, rather than disturb the peace of the Church, or be deprived of its communion. For God having made some gesture necessary and confined me to none, but left it to humane determination, I shall submit to magistrates in their proper work, even when they miss it in the manner. I am not sure that Christ intended the example of Himself and his apostles as obligatory to us that shall succeed. I am sure it proves sitting lawful: but I am not sure that it proves it necessary: (though very convenient). But I am sure He has commanded me obedience and peace.”

emn+the+catholic+Church+of+sin.+4.+They+condemn+the+canons+of+the+chief+general+councils.+5.+And+then+if+the+bishops+themselves+in+council+should+change+the+gesture%2C+it+were+unlawful+to+obey+them.+All+which+are+consequents+that+I+suppose+they+will+disown.+What+a+perverse+preposterous+reverence+is+this%3F+when+they+have+leave+to+lie+in+the+dust+before+and+after+the+very+act+of+receiving%2C+through+all+their+confessions+and+prayers%2C+yet+they+will+at+other+times+stand%2C+and+many+of+them+sit+at+prayer%2C+and+sit+at+singing+Psalms+of+Prayer+and+Praise+to+God%2C+and+yet+when+Christ+doth+invite+them+to+a+feast%2C+they+dare+not+imitate+his+apostles+and+universal+Church+in+their+gesture%2C+lest+they+should+be+sinfully+unreverent.+%C2%A742.+But+yet%2C+as+sinfully+as+this+gesture+was+imposed%2C+for+my+part+I+did+obey+the+imposer+and+would+do+if+it+were+to+do+again%2C+rather+than+disturb+the+peace+of+the+Church%2C+or+be+deprived+of+its+communion.+For+God+having+made+some+gesture+necessary+and+confined+me+to+none%2C+but+left+it+to+humane+determination%2C+I+shall+submit+to+magistrates+in+their+proper+work%2C+even+when+they+miss+it+in+the+manner.+I+am+not+sure+that+Christ+intended+the+example+of+Himself+and+his+apostles+as+obligatory+to+us+that+shall+succeed.+I+am+sure+it+proves+sitting+lawful%3A+but+I+am+not+sure+that+it+proves+it+necessary%3A+%28though+very+convenient%29.+But+I+am+sure+He+has+commanded+me+obedience+and+peace.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship%2C+%28London%3A+R.W.%2C+1659%29%2C+5th+Disputation%2C+ch.+2%2C+pp.+410-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa287d627c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a287d627c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=41.%202.%20And%20for%20kneeling%20at,has%20commanded%20me%20obedience%20and%20peace&amp;

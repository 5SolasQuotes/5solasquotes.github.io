<blockquote><p>Fourthly, [it is superstition] that he who is a member only of the universal Church may not in transitu be admitted to communion with particular churches unless he bring a certificate from a particular church of which he sometime was a member.</p></blockquote>

</figure><figure class="quote" id="q-ddc2983088" data-kw="">
<blockquote><p>1. But come we to your [congregationalist] particulars: First, ‘by way of participation of the Lord’s Supper, the members of one church coming to another church, etc.’ But: 1. Why do you instance in this ordinance only? Have not their children, occasionally born there, a liberty also of baptisme? The rather, because baptism is not administred with respect to this or that church, but to the general visible Church: Unless you hold that a man or child is baptized to no church but that particular, and [is] an infidel to all the rest. Yet some of your brethren will hardly baptize a child of any but a member of their own church, which is next door to Anabaptism. … …4. But your reason I like very well: ‘For we receive the Lord’s Supper, not only as a seal of our communion with the Lord Jesus, and with his members in our own church, but also in all the churches of the saints’: Whence I infer, then, it is not any favour dispensed by you to a member of another church, but a dignity or privilege common to every member of that body, by virtue of that membership, and not with respect to his particular church membership. And I pray, is not baptism also a seal of our communion with all the members of Christ’s body? Why then may you not admit the children of the members of any church to be baptized by your pastors upon just occasion, as well as to admit the parents to the Lord’s Supper? Nay further: If the sacraments be seals of our communion with all the members of Christ, why do you not admit any true Christian, and his children, to the communion of the sacraments, though they be not as yet admitted members of any particular congregation? How dare you deny any member of that Body communion with its fellow-members, when it has union and communion with the Head? Consider it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s… (1645), ch. 4, pp. 39-41 Cawdrey was an English presbyterian and Westminster divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-d81995a250" data-kw="">
<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14</cite>, pp. 56-57</span></figcaption>

ime+may+create+an+habitual+experience%2C+for+the+same+very+day+they+were+baptized+%28Acts+2%3A41%29.+%283%29+Mr.+Hooker+should+prove+that+the+apostles+found+this+practical+reformation+in+all%2C+Ananias%2C+Saphira%2C+and+the+whole+3000%3B+and+that+the+apostles+tried+and+smelled+the+savouriness+of+saving+grace+in+all%3B+in+Saphira%3B+the+text+giveth+not+the+least+jot+of+this%2C+we+must+take+it+upon+the+naked+assertion+of+Mr.+Hooker+%284%29+That+this+practical+reformation+gave+to+the+apostles%E2%80%99+judgement+of+charity+ground+of+hope+that+there+was+something+real%2C+that+is%2C+the+whole+number%2C+about+three+thousand+%28none+excepted%2C+for+all+were+made+Church-saints+visible%29+gave+grounds+of+hope+that+they+were+all+really+%28otherwise+their+speaking+and+hearing+the+word+was+real%2C+that+is%2C+not+imaginary%29+internally+and+effectually+called%2C+and+born+over+again+of+the+spirit%2C+and+so+chosen+to+life+eternal+from+eternity%2C+before+the+apostles+durst%2C+without+the+offending+of+God%2C+admit+them+to+Church-fellowship+and+visible+communion%3B+those+%5Bthings%5D+%28I+say%29+must+be+proven.+If+I+durst+%5Bdare%5D%2C+I+am+not+far+from+judging+the+godly+and+judicious+in+cold-blood%2C+free+of+heat+of+dispute%2C+dare+not+so+judge+of+the+text%2C+Acts+2+or+Acts+8.+%285%29+There+is+no+shadow%2C+Acts+8%2C+that+Peter+%28Mr.+Hooker+should+say+Philip%29+admitted+not+Magus+while+he+saw+such+grounds+of+the+sorcerer%E2%80%99s+real+conversion+and+real+predestination+to+glory.+%286%29+Peter+said+that+Magus+had+no+share+in+Christ.+True%2C+but+said+he+that+he+was+an+unbaptized+man+who+had+no+share+in+the+visible+Church%3F+No.+%287%29+But+he+would+not+suffer+Magus+to+share+in+the+privileges+of+communion%2C+he+persisting+without+repentance.+True%2C+but+it+is+no+answer+to+the+argument+from+the+manner+of+receiving+in%2C+this+is+something+to+the+casting+out%2C+%288%29+that+Peter+reproveth+him+in+the+gall+of+bitterness+%5Band%5D+2.+Exhorts+him+to+repent%2C+to+pray+for+pardon%2C+%5Bthese+last+two+things%5D+were+great+privileges+of+Church-communion+bestowed+upon+Magus.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+penned+by+Mr.+Thomas+Hooker%E2%80%A6+wherein+the+way+of+the+churches+of+N.+England+is+now+re-examined+%28London%2C+1658%29%2C+Book+1%2C+ch.+14%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd81995a250.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d81995a250.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=First%20Argument%20%5Bof%20Rutherford%5D%3A%20In%20the,privileges%20of%20Church%2Dcommunion%20bestowed%20upon%20Magus&amp;text=First%20Argument%20%5Bof%20Rutherford%5D%3A%20In%20the%20first%20receiving&amp;text=were%20great%20privileges%20of%20Church%2Dcommunion%20bestowed%20upon%20Magus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…that such who were known to be godly might not come to the sacrament of the Lord’s Supper, unless they were members of some particular congregation, and so, in their partaking with you, they must yield that grand Brownistical principle, the foundation of other errors among the Separatists, namely, that sacraments belong not to visible believers, but as they are members of some particular congregation… And let me entreat you, in your reply you [will] give to this answer, to give me a Scripture to prove that all men who come to the Lord’s Supper must profess their membership and their retaining to such a particular congregation: I profess myself of another judgement, and cast the glove to any of you five, or to you all; That it is lawful for the ministers of Christ to receive such whom they know to be godly to the Lord’s Supper, though they be not members of a particular church, and to receive those who are members without any [of them] professing themselves to be so: Suppose some godly merchants or marriners, who all their days travel and never stay long in any one place, yet in all places where they come, desire to join in the ordinances, ought not such to be received? The standing rule of coming to the Lord’s Supper will be found to be faith and godliness shown forth, rather than the formality of membership: …so I find Mr. Batchelour (one of you) writing from Rotterdam of your churches, that they will not keep back the sacrament from any of the godly of such churches in England, as Mr. Goodwin’s and Mr. Calamy’s are (always provided that their own pastors do consent unto it). Now the godly who are gone into Holland, and especially to New-England, not finding any such word in Scripture of bringing a ticket from their ministers, and so coming into those countries without it, may be long kept from the sacrament of the Lord’s Supper till they either go [back] into England and fetch it, or till they send for it over, and have a return back of the consent of their own pastors (which may be, was the reason, that though you offered to receive into the Communion of the Lord’s Supper some godly that came to visit you in your exile, yet for want of bringing their pastor’s consent unto it, returned into England without partaking in the Lord’s Supper with you). Which (by the way) will be a good warning for all that henceforth go over into Holland or New-England, to carry their minister’s consents over with them, lest otherwise they be not admitted to the Lord’s Supper…</p></blockquote>

+who+are+gone+into+Holland%2C+and+especially+to+New-England%2C+not+finding+any+such+word+in+Scripture+of+bringing+a+ticket+from+their+ministers%2C+and+so+coming+into+those+countries+without+it%2C+may+be+long+kept+from+the+sacrament+of+the+Lord%E2%80%99s+Supper+till+they+either+go+%5Bback%5D+into+England+and+fetch+it%2C+or+till+they+send+for+it+over%2C+and+have+a+return+back+of+the+consent+of+their+own+pastors+%28which+may+be%2C+was+the+reason%2C+that+though+you+offered+to+receive+into+the+Communion+of+the+Lord%E2%80%99s+Supper+some+godly+that+came+to+visit+you+in+your+exile%2C+yet+for+want+of+bringing+their+pastor%E2%80%99s+consent+unto+it%2C+returned+into+England+without+partaking+in+the+Lord%E2%80%99s+Supper+with+you%29.+Which+%28by+the+way%29+will+be+a+good+warning+for+all+that+henceforth+go+over+into+Holland+or+New-England%2C+to+carry+their+minister%E2%80%99s+consents+over+with+them%2C+lest+otherwise+they+be+not+admitted+to+the+Lord%E2%80%99s+Supper%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or+a+Full+Answer+to+the+Apologetical+Narration+of+Mr.+Goodwin%2C+Mr.+Nye%2C+Mr.+Sympson%2C+Mr.+Burroughs%2C+Mr.+Bridge%E2%80%A6+%28London%2C+1644%29%2C+p.+52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb884325095.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b884325095.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=that%20such%20who%20were%20known%20to,not%20admitted%20to%20the%20Lord%E2%80%99s%20Supper&amp;text=that%20such%20who%20were%20known%20to%20be%20godly&amp;text=they%20be%20not%20admitted%20to%20the%20Lord%E2%80%99s%20Supper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

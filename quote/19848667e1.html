<blockquote><p>3. Nor does it belong to the essence of Presbyterial Government, that all members of this Church, and inferior judicatures, should so submit to the superior respective judicatures, that if they be grieved with the sentence, they ought to acquiesce thereunto, and not to contra-act, but only appeal, until there shall be a general assembly to determine the matter. This never was, and I trust, nor shall ever be their mind who are for presbyterial government; nor do our brethren justly father it upon the general Assembly, 1648, Session 30. For our Church acknowledges no subjection nor subordination of inferior judicatures unto superiors, but in the Lord, and so to submit to any sentence, and to forbear a duty of preaching the Gospel, praying, visiting, exhorting, catechizing pastorally in families, to abstain from the Lord’s Supper, and from acts of due censure necessary for the flock upon the known unjust sentence of a synod, until a general Assembly (which possibly cannot be convened in an age to determine) is to:

1. Obey men unjustly forbidding a called minister of Christ to preach in season, and out of season, rather than God; for they unjustly forbid, and the Lord justly commands; therefore the called minister must act and contra-act to their unjust sentence, and not forbear for an hour, as the Scripture clears, 2 Tim. 4:1-2; Acts 20:17-20; 1 Cor. 9:16; Isa. 58:1; Jer. 1:17; Eze. 2:3-5 &amp; 3:10,17; Acts 5:28-29; and so this is unjust.

2. It is to make synods and ecclesiastical judicatures lords of our faith, which the Reformed Churches detest in popish councils; for all men and councils most lawful can challenge only limited obedience and submission in the Lord to their determinations, if they speak and command ‘according to the Law and the Testimony’, Isa. 8:20, ‘otherwise there is no sight in them.’ And so it is popish.

3. We conceive in performing acts of that government which Christ owns in his Word, we do not sin; for no authority of a judicature can make that to be the word of God, and obedience to God, which was not, as to the matter, obedience to God before that authority, nor on the contrary. Now to abstain from preaching, praying, eating and drinking as the Lord’s Supper in a called minister, and in a visible professor, duly called and fitted, is sin; then cannot the authority of the Church, far less their known unjust sentence make it lawful.

4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Epistle to the Reader</span></figcaption>

<blockquote><p>For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion</cite>, ed. (1706; Edinburgh: William Gray, 1747) 154 pp. no ToC, pp. v-vi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>The Brownists did not difler from the Church of England in any articles of faith, but were very rigid and narrow in points of discipline. They denied the Church of England to be a true Church and her ministers to be rightly ordained. They maintained the discipline of the Church of England to be Popish and antichristian, and all her ordinances and sacraments invalid. Hence they forbade their people to join with them in prayer, in hearing, or in any part of public worship; nay, they not only renounced communion with the Church of England, but with all other reformed Churches, except such as should be of their own model. They apprehended, according to Scripture, that every church ought to be confined within the limits of a single congregation and that the government should be democratical. When a church was to be gathered, such as desired to be members made a confession of their faith in the presence of each other, and signed a covenant, obliging themselves to walk together in the order of the gospel, according to certain rules and agreements therein contained. The whole power of admitting and excluding members, with the deciding of all controversies, was in the brotherhood. Their church-officers, for preaching the Word and taking care of the poor, were chosen from among themselves, and separated to their several offices by fasting and prayer and imposition of the hands of some of the brethren. They did not allow the priesthood to be a distinct order, or to give a man an indelible character; but as the vote of the brotherhood made him an officer and gave him authority to preach and administer the sacraments among them, so the same power could discharge him from his office and reduce him to the state of a private member. When the number of communicants was larger than could meet in one place, the church divided and chose new officers from among themselves as before, living together as sister-churches and giving each other the right hand of fellowship, or the privilege of communion with either. One church might not exercise jurisdiction or authority over another, but each might give the other counsel, advice, or admonition if they walked disorderly or abandoned the capital truths of religion; and if the offending church did not receive the admonition, the others were to withdraw and publicly disown them as a church of Christ. The powers of their church-officers were confined within the narrow limits of their own society; the pastor of one church might not administer the sacrament of baptism or the Lord’s supper to any but those of his own communion and their immediate children. They declared against all prescribed forms of prayer. Any lay-brother had the liberty of prophesying or giving a word of exhortation in their church assemblies; and it was usual after sermon for some of the members to ask questions and confer with each other upon the doctrines that had been delivered; but as for church-censures, they were for an entire separation of the ecclesiastical and civil sword. In short, every church, or society of Christians meeting in one place, was, according to the Brownists, a body corporate, having full power within itself to admit and exclude members, to choose and ordain officers; and, when the good of the society required it, to depose them, without being accountable to classes, convocations, synods, councils or any jurisdiction whatsoever. Some of their reasons for withdrawing from the Church are not easily answered: they alleged that the laws of the realm and the queen’s injunctions had made several unwarrantable additions to the institutions of Christ. That there were several gross errors in the Church-service. That these additions and errors were imposed and made necessary to communion. That if persecution for conscience’ sake was the mark of a false church, they could not believe the Church of England to be a true one. They apprehended farther that the constitution of the hierarchy was too bad to be mended; that the very pillars of it were rotten and that the structure must be begun anew. Since therefore all Christians are obliged to preserve the ordinances of Christ pure and undefiled, they resolved to lay a new foundation and keep as near as they could to the primitive pattern, though it were with the hazard of all that was dear to them in the world.</p></blockquote>

— About Separatists, The Tenets of the English Brownists | Daniel Neal, The History of the Puritans… (London, 1822), vol. 1, ch. 6, From Parker to Grindal, pp. 303-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Brownists+did+not+difler+from+the+Church+of+England+in+any+articles+of+faith%2C+but+were+very+rigid+and+narrow+in+points+of+discipline.+They+denied+the+Church+of+England+to+be+a+true+Church+and+her+ministers+to+be+rightly+ordained.+They+maintained+the+discipline+of+the+Church+of+England+to+be+Popish+and+antichristian%2C+and+all+her+ordinances+and+sacraments+invalid.+Hence+they+forbade+their+people+to+join+with+them+in+prayer%2C+in+hearing%2C+or+in+any+part+of+public+worship%3B+nay%2C+they+not+only+renounced+communion+with+the+Church+of+England%2C+but+with+all+other+reformed+Churches%2C+except+such+as+should+be+of+their+own+model.+They+apprehended%2C+according+to+Scripture%2C+that+every+church+ought+to+be+confined+within+the+limits+of+a+single+congregation+and+that+the+government+should+be+democratical.+When+a+church+was+to+be+gathered%2C+such+as+desired+to+be+members+made+a+confession+of+their+faith+in+the+presence+of+each+other%2C+and+signed+a+covenant%2C+obliging+themselves+to+walk+together+in+the+order+of+the+gospel%2C+according+to+certain+rules+and+agreements+therein+contained.+The+whole+power+of+admitting+and+excluding+members%2C+with+the+deciding+of+all+controversies%2C+was+in+the+brotherhood.+Their+church-officers%2C+for+preaching+the+Word+and+taking+care+of+the+poor%2C+were+chosen+from+among+themselves%2C+and+separated+to+their+several+offices+by+fasting+and+prayer+and+imposition+of+the+hands+of+some+of+the+brethren.+They+did+not+allow+the+priesthood+to+be+a+distinct+order%2C+or+to+give+a+man+an+indelible+character%3B+but+as+the+vote+of+the+brotherhood+made+him+an+officer+and+gave+him+authority+to+preach+and+administer+the+sacraments+among+them%2C+so+the+same+power+could+discharge+him+from+his+office+and+reduce+him+to+the+state+of+a+private+member.+When+the+number+of+communicants+was+larger+than+could+meet+in+one+place%2C+the+church+divided+and+chose+new+officers+from+among+themselves+as+before%2C+living+together+as+sister-churches+and+giving+each+other+the+right+hand+of+fellowship%2C+or+the+privilege+of+communion+with+either.+One+church+might+not+exercise+jurisdiction+or+authority+over+another%2C+but+each+might+give+the+other+counsel%2C+advice%2C+or+admonition+if+they+walked+disorderly+or+abandoned+the+capital+truths+of+religion%3B+and+if+the+offending+church+did+not+receive+the+admonition%2C+the+others+were+to+withdraw+and+publicly+disown+them+as+a+church+of+Christ.+The+powers+of+their+church-officers+were+confined+within+the+narrow+limits+of+their+own+society%3B+the+pastor+of+one+church+might+not+administer+the+sacrament+of+baptism+or+the+Lord%E2%80%99s+supper+to+any+but+those+of+his+own+communion+and+their+immediate+children.+They+declared+against+all+prescribed+forms+of+prayer.+Any+lay-brother+had+the+liberty+of+prophesying+or+giving+a+word+of+exhortation+in+their+church+assemblies%3B+and+it+was+usual+after+sermon+for+some+of+the+members+to+ask+questions+and+confer+with+each+other+upon+the+doctrines+that+had+been+delivered%3B+but+as+for+church-censures%2C+they+were+for+an+entire+separation+of+the+ecclesiastical+and+civil+sword.+In+short%2C+every+church%2C+or+society+of+Christians+meeting+in+one+place%2C+was%2C+according+to+the+Brownists%2C+a+body+corporate%2C+having+full+power+within+itself+to+admit+and+exclude+members%2C+to+choose+and+ordain+officers%3B+and%2C+when+the+good+of+the+society+required+it%2C+to+depose+them%2C+without+being+accountable+to+classes%2C+convocations%2C+synods%2C+councils+or+any+jurisdiction+whatsoever.+Some+of+their+reasons+for+withdrawing+from+the+Church+are+not+easily+answered%3A+they+alleged+that+the+laws+of+the+realm+and+the+queen%E2%80%99s+injunctions+had+made+several+unwarrantable+additions+to+the+institutions+of+Christ.+That+there+were+several+gross+errors+in+the+Church-service.+That+these+additions+and+errors+were+imposed+and+made+necessary+to+communion.+That+if+persecution+for+conscience%E2%80%99+sake+was+the+mark+of+a+false+church%2C+they+could+not+believe+the+Church+of+England+to+be+a+true+one.+They+apprehended+farther+that+the+constitution+of+the+hierarchy+was+too+bad+to+be+mended%3B+that+the+very+pillars+of+it+were+rotten+and+that+the+structure+must+be+begun+anew.+Since+therefore+all+Christians+are+obliged+to+preserve+the+ordinances+of+Christ+pure+and+undefiled%2C+they+resolved+to+lay+a+new+foundation+and+keep+as+near+as+they+could+to+the+primitive+pattern%2C+though+it+were+with+the+hazard+of+all+that+was+dear+to+them+in+the+world.%E2%80%9D%0A%0A%E2%80%94+About+Separatists%2C+The+Tenets+of+the+English+Brownists+%7C+Daniel+Neal%2C+The+History+of+the+Puritans%E2%80%A6+%28London%2C+1822%29%2C+vol.+1%2C+ch.+6%2C+From+Parker+to+Grindal%2C+pp.+303-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5105eb4e3e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5105eb4e3e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=The%20Brownists%20did%20not%20difler%20from,dear%20to%20them%20in%20the%20world&amp;text=The%20Brownists%20did%20not%20difler%20from%20the%20Church&amp;text=that%20was%20dear%20to%20them%20in%20the%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

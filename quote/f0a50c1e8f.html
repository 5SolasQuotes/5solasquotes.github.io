<blockquote><p>226. But we are more able to love or will aright, than to work and do aright, because here [in the latter] both must concur, which requires more power than one alone. E.g. to [actually] rule the thoughts aright requires more power than to be willing to rule them.</p></blockquote>

</figure><figure class="quote" id="q-64238780e6" data-kw="">
<blockquote><p>XX. But, you might say, the apostle himself implies that some are perfect, and includes himself among them. For he adds, “All of us, then, who are mature should take such a view of things” (Phil. 3:15). And in 1 Cor. 2, he says, “We do, however, speak a message of wisdom among the mature.” Many holy men in Scripture are also testified to be perfect. Thus, it is said of Noah, “Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God” (Gen. 6:9). And God Himself, speaking to Satan about Job, says, “Have you considered my servant Job? There is no one on earth like him; he is blameless and upright, a man who fears God and shuns evil” (Job 1:8). Indeed, David in Ps. 18 does not hesitate to attribute such perfection to himself. He says, “I have been blameless before him and have kept myself from sin. The Lord has rewarded me according to my righteousness, according to the cleanness of my hands in his sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses in which the Doctrine of the Roman School concerning the Division of Grace into Sufficient &amp; Efficent, and the Harmony of Human Freedom with the Efficacy of Grace are set forth</cite>, tr. AI by Inquisitor (@WesternCatholik on Twitter) (d. 1675), pp. 76-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>21. The effects of justification, or its necessary consequences, are:

1. Actual adoption, Eph. I.5.

2. Peace of conscience, Rom. V.1.

3. Love, Luke VII.47; and other spiritual charismata [gifts] of that kind, which the Spirit of adoption works in the hearts of the justified. For justification is to be conjoined with sanctification by an inseparable and perpetual bond, yet not to be confounded with it; and to those for whom Christ has been made δικαιοσύνη [dikaiosynē, righteousness], to them He has also been made ἁγιασμός [hagiasmos, sanctification], 1 Cor. I.30.

4. Life and glory, Rom. VIII.30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

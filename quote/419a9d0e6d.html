<main class="wrap"><figure class="quote" id="q-419a9d0e6d" data-kw="">
<blockquote><p>[T]he Scripture stops with this, that she was a virgin before and at the birth of Christ;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Jesus Christ Was Born a Jew</cite>, 1523, tr. Walther I. Brandt, in Luther’s Works, 45.206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“[T]he Scripture stops with this, that she was a virgin before and at the birth of Christ;”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9df0142ce" data-kw="">
<blockquote><p>There have been certain strange folk who have wished to suggest from this passage [Mt. 1:24-25] that the Virgin Mary had other children than the Son of God, and that Joseph had then dwelt with her later; but what folly this is! for the gospel writer did not wish to record what happened afterwards; he simply wished to make clear Joseph’s obedience [to the angel in Mt. 1:24] and to show also that Joseph had been well and truly assured that it was God who had sent His angel to Mary. He had therefore never dwelt with her nor had he shared her company. There we see that he had never known her person for he was separated from his wife. He could marry another all the more because he could not enjoy the woman to whom he was betrothed; but he rather desired to forfeit his rights and abstain from marriage [for the time?], being yet always married: he preferred, I say, to remain thus in the service of God rather than to consider what he might still feel that he could come to. He had forsaken everything in order that he might subject himself fully to the will of God. And besides this, our Lord Jesus Christ is called the first-born. This is not because there was a second or a third, but because the gospel writer is paying regard to the precedence. Scripture speaks thus of naming the first-born whether or no there was any question of the second. Thus we see the intention of the Holy Spirit. This is why to lend ourselves to foolish subtleties would be to abuse Holy Scripture, which is, as St. Paul says, “to be used for our edification.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 22 on Matthew 1:22-25</cite>, (1562), from Corpus Reformatorum, vol. 46, pp. 259-272 (not currently on the net) as given in Max Thurian (a Protestant), Mary: Mother of All Christians, trans. Nevill B. Cryer (New York: Herder &amp; Herder, 1963), pp. 39-40. The French and this English excerpt, along with another larger translation of the French, has been provided by the Roman apologist Dave Armstrong, ‘John Calvin: Sermon 22 on Matthew 1:22-25 (Mary’s Perpetual Virginity)’.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-475301f5c2" data-kw="">
<blockquote><p>If the question brought before the Vatican Council had been of a purely spiritual nature, had the bishops been only required to affirm such a doctrine as the Assumption of the Virgin Mary—that is to say, to assert a historical fact without a particle of evidence—I do not think many would have rebelled. It was because the doctrine of the Pope&#x27;s personal Infallibility had bearings on the practical business of this world; because its assertion was supposed to be intended for the preservation or recovery of the Pope&#x27;s temporal sovereignty; because the claim would enable him to interfere with more effect on questions of toleration, civil liberty, marriage, and education, that so much difficulty was made about conceding it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture VI</span></figcaption>

</figure><figure class="quote" id="q-5b26d3fb42" data-kw="Mary Idolatry">
<blockquote><p>More than this cannot be sought at the hands of God or Christ. The Virgin Mary is to her worshippers what Christ is to us. She is the object of all religious affections; the ground of confidence; and the source whence all the blessings of salvation are expected and sought.</p></blockquote>

</figure><figure class="quote" id="q-7432244373" data-kw="">

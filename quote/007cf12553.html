<blockquote><p>There are two main views. One of them has come to be called corruptionism, and it holds that at death the human being ceases to exist (unless and until God resurrects him), even though the soul carries on. The other view is called survivalism, and it hold that the human being persists in existence after death and even before any resurrection, though only as constituted by his soul… …the position I favor is the survivalist one. For I have said that after death the human being persists, albeit in a severely reduced or incomplete state. Now the survivalist view is characterized as the view that after death but before the resurrection, the soul constitutes the human being… a form qua [as] form exists only together with the substance of which it is the form. However, since the substance of which the human soul is the form is not entirely coporeal, that substance subsists and continues beyond the death of the body because the death of the body involves the cessation of only the corporeal aspect of said substance, not the incorporeal aspect. Hence, because the substance that the human soul is the form of persists beyond the death of the body, the soul persists beyond the death of the body… this thing that exists beyond the death of the body is also a substance–albeit an incomplete one–and, since this incomplete substance just is the human being in a radically impaired state, it is quite natural to say that the soul that survives death just is the human being surviving death (again, in a radically incomplete state)… …For the corruptionist position holds, again, that at death the human being cease to exist, even though the soul carries on. Yet the human being is the substance of which the soul is a form. So, if the human being ceases to exist at death, then that means that the substance of which the soul is the form ceases to exist at death. And in that case, how could the soul carry on? How could a form exist apart from the substance of which it is the form?… There are two further important arguments for survivalism, one philosophical and one theological. The first is this… just as it is the human being who sees, and not the eye, it is the human being who thinks, and not the intellect. The eye sees only in a loose sense, and the intellect thinks only in a loose sense. Now, on both the survivalist view and the corruptionist view, the intellect survives the death of the body and thought occurs as well. But if thought occurs and if on Aquinas’s own principles it is strictly speaking only the human being, and not the intellect, which thinks, then it follows that there must be a sense in which the human being survives as well. The second, theological argument is this. Being a Christian theologian, Aquinas holds that, after death, the soul is rewarded, punished, or purged in light of the deeds of this present life. But it makes sense to reward, punish, or purge only perons, not mere parts of persons. It makes no sense, for example, to speak of rewarding or punishing Bob’s foot or hi pancreas for Bob’s good or bad deeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, pp. 497-502 in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</span></figcaption>

tance+of+which+the+soul+is+a+form.+So%2C+if+the+human+being+ceases+to+exist+at+death%2C+then+that+means+that+the+substance+of+which+the+soul+is+the+form+ceases+to+exist+at+death.+And+in+that+case%2C+how+could+the+soul+carry+on%3F+How+could+a+form+exist+apart+from+the+substance+of+which+it+is+the+form%3F%E2%80%A6+There+are+two+further+important+arguments+for+survivalism%2C+one+philosophical+and+one+theological.+The+first+is+this%E2%80%A6+just+as+it+is+the+human+being+who+sees%2C+and+not+the+eye%2C+it+is+the+human+being+who+thinks%2C+and+not+the+intellect.+The+eye+sees+only+in+a+loose+sense%2C+and+the+intellect+thinks+only+in+a+loose+sense.+Now%2C+on+both+the+survivalist+view+and+the+corruptionist+view%2C+the+intellect+survives+the+death+of+the+body+and+thought+occurs+as+well.+But+if+thought+occurs+and+if+on+Aquinas%E2%80%99s+own+principles+it+is+strictly+speaking+only+the+human+being%2C+and+not+the+intellect%2C+which+thinks%2C+then+it+follows+that+there+must+be+a+sense+in+which+the+human+being+survives+as+well.+The+second%2C+theological+argument+is+this.+Being+a+Christian+theologian%2C+Aquinas+holds+that%2C+after+death%2C+the+soul+is+rewarded%2C+punished%2C+or+purged+in+light+of+the+deeds+of+this+present+life.+But+it+makes+sense+to+reward%2C+punish%2C+or+purge+only+perons%2C+not+mere+parts+of+persons.+It+makes+no+sense%2C+for+example%2C+to+speak+of+rewarding+or+punishing+Bob%E2%80%99s+foot+or+hi+pancreas+for+Bob%E2%80%99s+good+or+bad+deeds.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+pp.+497-502+in+Immortal+Souls%3A+a+Treatise+on+Human+Nature+Ref+%28Editiones+Scholastica%2C+2024%29%2C+pt.+4%2C+ch.+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F007cf12553.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/007cf12553.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/heaven#:~:text=There%20are%20two%20main%20views.%20One,for%20Bob%E2%80%99s%20good%20or%20bad%20deeds&amp;text=There%20are%20two%20main%20views.%20One%20of%20them&amp;text=hi%20pancreas%20for%20Bob%E2%80%99s%20good%20or%20bad%20deeds" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d42c671d0" data-kw="">
<blockquote><p>But Paul would say all his excellency was from free grace. Were any indifferent beholder up in the highest Jerusalem after the Day of Judgement to see the company of the Lamb and his court, so many thousand pieces of clay then clothed with highest grace smiling on the face of Him that sits on the throne, made eternal kings, that for glory and robes of grace and the weighty crown you cannot see a bit of clay, and yet originally all these are but glistering bits of clay and graced dust; it should tire the beholder with admiration. O but the second Creation is a rare piece of workmanship. But again come and see that heaven of wonders, the Man-Christ, who as man has: 1. Flesh and blood, and a man’s soul as we have; but O so incomparably wonderful, as the grace of God without merit has made the man-Christ. Grace has exalted this man to a high throne, the Godhead, in person dwells in this clay tent of endless glory and God speaks personally out of this man; and this Emmanuel is God, and the man is so weighted with glory as all that are there (and they be a fair and numerous company) are upon one continued act of admiring, enjoying, praising, loving Him for no less date than endless eternity, and they can never be able to pull their eyes off Him. And then grace seen, enjoyed as it grows at the well-head up in Emmanuel’s highest and newest land is of another strain, sweeter and more glorious than down here in the earth, which is not the element of grace, they are but glimpses, borrowed shaddows, chips and drops of grace that are here. That is a world of nothing but graoe;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 238-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>The goal of this article is to provide an introduction to the doctrine of the beatific vision… we start with some general reflections on the biblical material, and move from that into a broad overview of some of the key theological trajectories in the tradition, with particular focus on the Reformed tradition…</p></blockquote>

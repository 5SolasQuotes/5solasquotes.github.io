</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e084c3061a" data-kw="">
<blockquote><p>IV. We say it is a universal apostasy from true Christianity or of the truth of the gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency. V… it be committed against the knowledge of the truth not only legal, but especially gospel; not only theoretical and historical (for whoever sins against knowledge would sin against the Holy Spirit), but practical and convictive (although not persuasive). Conviction is when anyone knows the truth of the gospel, but is also convinced in his own mind of its goodness, so that he cannot even mutter against it (although he may wish to)… IX. Second, to constitute this sin is required a total defection from the truth and its wicked rejection and denial; not from fear simply and the weakness of the flesh… that denial of the truth should proceed from pure wickedness and petulance (arising from deadly hatred and obstinate contempt of it)…

XI. The third mark is not only the denial of the recognized truth, but also a pertinacious opposition to it. For as they persecute it with the deepest hatred, it is no wonder that they endeavor with all their might to overturn it… This is evident in the Pharisees…

XII. Finally, the fourth mark is stubbornness of mind and perseverance in wickedness even unto the end…

XIII. And hence the unpardonableness of that sin, which is its inseparable adjunct… XV… it rises from the very nature of the sin, which is such that it excludes the very condition requisite to pardon (viz., repentance…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1992), vol. 1, 9th Topic, ‘In what consists the formal reason of the sin against the Holy Spirit? Also why is it unpardonable?’, sections 4-5, 9, 11-12, 15, pp. 647-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><figure class="quote" id="q-47a1623368" data-kw="">
<blockquote><p>14. The inward offer is a spiritual enlightening, whereby those promises are propounded to the hearts of men, as it were by an inward word. John 6:45, Whosoever has heard of the Father and has learned, comes to me. Eph. 1:17. That He might give unto you the spirit of wisdom and revelation, the eyes of your mind being enlightened, that ye may know what is that hope of your calling.

15. This also is sometime, and in a certain manner granted to those that are not elected. Hebrews 6:4 &amp; 10:29; Mat. 13:20.

16. If anyone oppose himself out of malice to this illumination, he commits a sin against the Holy Ghost, which is called unpardonable, or unto death. Heb.6:6 &amp; 10:29; 1 John 5:16; Matt 12:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (d. 1633), bk 1, ch. 26</span></figcaption>

</figure><figure class="quote" id="q-542411a48a" data-kw="degrees">
<blockquote><p>Hence it appears that the question does not concern the equality of sins or gradual inequality, but their essential demerit. The question is not whether all sins are equal to each other (the paradox of the ancient Stoics and falsely charged upon us by our opponents). If all sins agree in being mortal, it does not follow that they are equal in all things because they can differ from each other as to degree of demerit, so as to deserve a greater or lesser punishment. Rather the question is only whether they are equally mortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a> › <a href="../topics/sin/degrees-of-sin/great-and-small.html">Great and small</a></span></div>

</figure><figure class="quote" id="q-430dc08f14" data-kw="">
<blockquote><p>…the work of the Spirit, or the Holy Ghost, [is] to sanctify. And hereupon some have thought that opposition unto holiness is the sin against the Holy Ghost: But you find here it is a ‘blasphemy,’ therefore not every opposition [is such]. And if you look into Acts 7, you find that Stephen speaking of the Jews says at verse 51, ‘Ye stiff-necked and uncircumcised in heart and ear, ye do always resist the Holy Ghost;’ yet they did not sin this sin against the Holy Ghost. Why? For Stephen prays for them, at the last verse, ‘Lord, lay not this sin to their charge.’ But now says the apostle John, in 1 John, 5:16, ‘There is a sin unto death, I do not say that ye shall pray for it.’ Had they in Stephen’s account sinned this sin unto death, he would not have prayed for them; but he did pray for them. So that this sin against the Holy Ghost does not consist in every opposition unto the work of the Holy Ghost, as it is distinct from the Father and the Son.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a0bf0ad744" data-kw="supralapsarian">
<blockquote><p>They who ascend above the fall (supra Lapsum) or creation to determine the object of predestination think … the decree of predestination should be made to precede the decree of creation and the permission of the fall. … Although this order contains nothing absolutely repugnant to the foundation of salvation and the analogy of faith … yet various objections hinder its reception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.4–5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/order-of-the-decrees.html">Order of the Decrees</a> › <a href="../topics/the-decrees-of-god/order-of-the-decrees/supralapsarian-infralapsarian-sublapsarian.html">Supralapsarian, infralapsarian, sublapsarian</a></span><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14ba01d57f" data-kw="Hardening Justice">
<blockquote><p>God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §20</span></figcaption>

</figure><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin">
<blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</span></figcaption>

</figure><figure class="quote" id="q-f4f7b0edf2" data-kw="Author of sin Depravity">
<blockquote><p>The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite></span></figcaption>

</figure><figure class="quote" id="q-7826d6ff7b" data-kw="Author of sin Temptation">
<blockquote><p>For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.</p></blockquote>

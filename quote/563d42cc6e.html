<main class="wrap"><figure class="quote" id="q-563d42cc6e" data-kw="miracles nature">
<blockquote><p>Miracles surpassing the power of all nature. For as nature can do nothing beyond its power (and not only the Scriptures record, but both Jews and Gentiles confess that many miracles have often been wrought in the world), we must necessarily suppose a most perfect being, greater and more excellent than all nature, to whose power they must be ascribed (who can be no other than God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.1.19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/miracles.html">Miracles</a> › <a href="../topics/providence/miracles/nature-and-use-of-miracles.html">Nature and use of miracles</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7df9615162" data-kw="Permission Author of sin">
<blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>

</figure><figure class="quote" id="q-87ae96c457" data-kw="lots contingency">
<blockquote><p>As all things are foreseen by an infallible foreknowledge (Acts 15:18; Heb. 4:13), so they must necessarily happen infallibly. They are certainly predicted as future so that the word of God cannot fail. Therefore they must happen necessarily, if not as to the mode of production (which is often contingent), still as to the certainty of the event—even of lots (Prov. 16:33), of the sparrows and the hairs of our heads (Mt. 10:29, 30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.4</span></figcaption>

</figure><figure class="quote" id="q-8a099d7ada" data-kw="Sovereignty Free Will">
<blockquote><p>God brings about every man&#x27;s lot, and all the parts of it. He sits at the helm of human affairs, and turns them about in whatever way he lists. &quot;Whatever the Lord pleased, that He did in heaven and in earth, in the seas and all deep places.&quot; There is not anything whatever befalls us without his overruling hand. The same providence that brought us out of the womb, brings us to, and fixes us in the condition and place allotted for us, by him who &quot;has determined the times and the bounds of our habitation.&quot; It overrules the smallest and most casual things about us, such as &quot;hairs of our head being all numbered;&quot; a &quot;lot cast into the lap.&quot; Yea, the free acts of our will, by which we choose for ourselves: for even &quot;the king&#x27;s heart is in the hand of the Lord, as rivers of water.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, head II (the crook is of God&#x27;s making)</span></figcaption>

</figure><figure class="quote" id="q-41d7db1dae" data-kw="Author of sin">
<blockquote><p>God does not infuse malice into the wills of evil men, as He infuses goodness into the hearts of the godly.—In one and the same work of the godly what is a good and just action proper to God is to be distinguished from the defect and vice of the ungodly. The sin of the wicked is their own; their doing this or that by sinning is of God’s power,—and so in the same work God is ascertained to be righteous, man to be guilty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion</cite>, 19.11 (as quoted in Heinrich Heppe, Reformed Dogmatics)</span></figcaption>

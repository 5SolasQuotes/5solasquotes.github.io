<main class="wrap"><figure class="quote" id="q-4e1d6a9df0" data-kw="">
<blockquote><p>1 Cor. 11:16, ‘We have no such custom, nor the churches of Christ’… the apostle is there speaking of things wherein custom is indeed the rule, as having the head bare, or covered, wearing long or short hair: it does not thence follow (if the apostle did there make it the rule) that it must also be the rule in other things… he [the episcopalian opponent] pretends to convince us further, that Augustine distinguished the custom of the universal Church from the custom of particular places, and he makes the one mutable, the other not so. He needed not be at pains to convince us of that distinction. I know nobody that doubts of it, nor that reject the customs that are truly universal, unless they clash with Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … wherein the Divine Right of the Government of the Church by Presbyters acting in Parity, is Asserted… (Edinburgh, 1697) Rule was a leading father of the Revolution Church of Scotland who wrote numerous works at that time for the divine right of presbyterianism. | section 6, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95f09a7369" data-kw="">
<blockquote><p>Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 3, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-2f1d9a78bd" data-kw="">
<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mary-fellman.html">Mary Fellman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Social Context Of Tertullian’s ‘On The Veiling Of Virgins” MA thesis</cite>, (Cornell Univ., 2009) 55, pp. no pictures</span></figcaption>

</figure><figure class="quote" id="q-31c09df0bd" data-kw="">
<blockquote><p>How can we deprive the Church of this liberty that it may not signify some thing by her actions and rites, the same being done, without placing any worship of God therein, modestly and in few things, so as the people of Christ be not burthened with ceremonies, and that better things be not letted [prevented]. But you will say [with respect to a white vestment], let them [ministers] show themselves to be angels, let them not signify it. I hear what you say. But the self same might have been answered unto Paul when he decreed unto the Corinthians that the woman should have her head covered, and the man uncovered, for he only urges a reason of the signification. For any man of the Church of Corinth might have answered: let the man show himself to be head of the woman, and let the woman in her deeds and life show herself to be subject unto the man, let them not contend to show this by signs. But the apostle saw this also to be a profitable thing, that we should not only live well, but that also we should by words and tokens be admonished of our duty. But and if hereby there be given an occasion of error unto the weak, let them be warned how they should believe these indifferent things, let them be taught by sermons that they judge not the worshipping of God to consist herein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, (d. 1562; London, 1583) | Theological Epistles, Epistle to John Hooper, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-f0cb989893" data-kw="">
<blockquote><p>That the Sabbath of the Decalogue was not a ceremonial command is proved by the fact that its violation was made a capital offence. (See Ex. 31: 14.) No ceremonial command was thus enforced. Even circumcision, fundamental as it was to the whole economy, was not thus fenced up. Its neglect of course excluded a man from the Church, but it incurred no capital penalty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Sabbath: Its Nature, Design and Proper Observance</cite>, (Philadelphia: Presbyterian Board of Publication, 1882), pp 21-22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Sundry religious ordinances are appointed in the New Testament: that there should be every Lord’s Day a collection for the poor: that the man being after a more excellent manner the image of God should pray bare-headed, not being ashamed to show his head, but having a kind of headship over the woman; and the woman should cover her head, when she prays… no Christian Church can consist without some external rites and ceremonies, which if they be not repugnant to the Word of God, are to be observed by us, as these ordinances of religion were by the Jews. …In these indifferent things which in their own nature are neither good, nor evil, we must not contend, breaking the peace and unity of the Church.</p></blockquote>

<blockquote><p>QUESTION CLIV. What are the outward means whereby Christ communicates to us the benefits of his mediation? ANSWER. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation. …It is farther objected that those arguments which have been taken from the practice of the Old Testament church, to prove singing an ordinance, may, with equal justice, be alleged to prove the use of instrumental music in religious worship; since we very often read of their praising God with ‘the sound of the trumpet, psaltery, harp, organ,’ and other musical instruments. This is the principal argument brought for the use of musical instruments by those who defend it and conclude it an help to devotion. But, though we often read of music being used in singing the praises of God under the Old Testament; yet if what has been said concerning its being a type of that spiritual joy which attends our praising God for the privilege of that redemption which Christ has purchased, the objection will appear to have no weight, the type being now abolished, together with the ceremonial law. Besides, though we read of the use of music in the temple-service, yet it does not sufficiently appear that it was ever used in the Jewish synagogues; the mode of worship observed in which more resembled that which is at present performed by us in our public assemblies. But what may sufficiently determine this matter, is that we have no precept nor precedent for it in the New Testament, either from the practice of Christ, or his apostles. Some, indeed, allege that the absence of any such precept or precedent overthrows the ordinance of singing, and pretend that this ought to be no more used by us than the harp, organ, or other musical instruments. But it might as well be objected that, because incense, which was used under the ceremonial law, together with prayer in the temple,n is not now to be offered by us, prayer ought to be laid aside; which is, as all own, a duty founded on the moral law. …Again, when the psalmist makes use of those phrases which are adapted to the ceremonial law, as when he speaks of ‘binding the sacrifice with cords, even unto the horns of the altar,’ or of ‘offering bullocks upon it;’z the language cannot be taken in a literal sense, when applied to the gospel-state. And when we are exhorted to ‘praise God with the psaltery,’ &amp;c., we are to express those acts of faith which are agreeable to the gospel-dispensation. The general rule, indeed, which is applicable to all psalms of a similar nature, is that with the same frame of spirit with which we read them, we ought to sing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, 2 vol. (London, 1733; repr. New York: Robert Carter &amp; Brothers, 1855), 2.433, 437, 438.</span></figcaption>

</figure><figure class="quote" id="q-27045c28fe" data-kw="">
<blockquote><p>It is known to you all when the whore of Babylon was cast out of the church, that she left behind her a gold ring, and some lover tokens, I mean Episcopacy, and human ceremonies. This was the whore’s policy to leave a token behind her that she might find an errand in the house again. And she was indeed returning to the house to demand her love token again, but it shall be heavenly wisdom to make a perfect reformation; keep nothing that belongs to Babylon, and let not a stone to be a cornerstone or a foundation be taken out of Babylon for building of the Lord’s house, for they are cursed stones [cf. Jer. 50.]</p></blockquote>

<blockquote><p>[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), pp. 214-215</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.”

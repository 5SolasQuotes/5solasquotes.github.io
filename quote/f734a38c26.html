<main class="wrap"><figure class="quote" id="q-f734a38c26" data-kw="">
<blockquote><p>[1.] Now the active obedience of Christ falls under a twofold consideration: 1. As the man-Christ’s perfect conformity to the Law of God, so as man he was obliged to do and suffer all that He did and suffered, even to lay down his life for man. But had He been only man his righteousness had neither been by condignity meritorious, nor yet satisfactory for us. But: 2. The whole course of Christ’s obedience from his birth to the grave, by doing and suffering, is to be considered as the doing and suffering of so excellent a Person, his being born, his praying, preaching, dying, coming from a Person, God-man. Now the Law required not praying, preaching of God-man, the blood of God, or the dying of Him who was God-Man. And so all these being both so excellent, and then so undue, have respect of satisfaction to God. 2. The active obedience of Christ and all that Christ did and suffered were performed by Him in his state of humiliation: in which he was poor, [Greek], 2 Cor. 8:9, for us, so also by the same ground a weeping man, hungry, thirsty, weary for us, made lower then the angels by the suffering of death, Heb. 2:9, humbled by partaking of flesh and blood, because of the children, Heb. 2:14, emptied Himself for us, Phil. 2. This was, as [David] Pareus well says: perpetua quaedam passio et paena peccatorum nostrorum, fuit tota vita Christi [‘The whole life of Christ was a certain perpetual suffering and punishment for our sins’]: All these have a respect of punishment and suffering. For since Christ was both a viator [pilgrim] and a comprehensor [one attaining glory], and such a holy sinless person, He ought to have had the actual possession of the crown of glory from the womb, and so should have been free of weeping, hunger, thirst, weariness, groaning, sighing, sadnesse, persecution, reproaches, etc., all which adhered to all his active holiness, and therefore, in that, his actions were satisfactory passions. For satisfaction is defined [as] a voluntary restoring of the equivalent, and as good in the place of what is taken away; and the good restored must be: 1. Undue. 2. The proper good of the restorer, which agrees to the active and passive obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; pp. 226-27</span></figcaption>

<blockquote><p>Inveni igitur in Epistolis tuis in lucem editis Epistolas duas 35 et 45 in quarum illa controversiam hanc paucis attingis. In ista vero copiosius et plenius edisseris. In 35 igitur epistola ‘Quid vanius est, inquis, quam justum arbitrari qui Legem non impleverit?’ At, inquam, justicia Evangelii a justicia Legis, prudenter discernenda est, Justicia qua nos justi censemur a Deo ac proinde ab eodem justificamur seu absolvimur, non est justicia Legis, neque enim Deus ideo nos justificat, quod Legem vel ipsi nos impleverimus, vel Christus pro nobis impleverit. Sed est justicia Evangelii, id est quam Deus nobis per Evangelium donat, nempe remissio peccatorum sanguine Christi parta. Vitam igitur petimus a Deo non jure impletae Legis seu obedientiae Legi praestitae sed jure adoptionis, quam Christus sua morte nobis peperit.</p></blockquote>

8393.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99a2a68393.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Inveni%20igitur%20in%20Epistolis%20tuis%20in,quam%20Christus%20sua%20morte%20nobis%20peperit&amp;text=Inveni%20igitur%20in%20Epistolis%20tuis%20in%20lucem%20editis&amp;text=jure%20adoptionis%2C%20quam%20Christus%20sua%20morte%20nobis%20peperit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), p. 34</span></figcaption>

<blockquote><p>Q. What place has Christ’s righteousness here? Answer: [David] Pareus with some others distinguish between [1] the righteousness of Christ’s Person, which contains his essential righteousness as God, [2] the habitual and actual conformity of the man-Christ, and the perfect holiness of the man-Christ. Such a High Priest became us, as is holy, harmless, etc. Heb. 7:26. And [3] the righteousness of his merit, in the satisfaction of his suffering: the satisfaction is the formal cause of our justification, which is counted ours: this latter righteousness is acquired, the former is essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; p. 226</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Q. What place has Christ’s righteousness here? Answer: [David] Pareus with some others distinguish between [1] the righteousness of Christ’s Person, which contains his essential righteousness as God, [2] the habitual and actual conformity of the man-Christ, and the perfect holiness of the man-Christ. Such a High Priest became us, as is holy, harmless, etc. Heb. 7:26. And [3] the righteousness of his merit, in the satisfaction of his suffering: the satisfaction is the formal cause of our justification, which is counted ours: this latter righteousness is acquired, the former is essential.”

<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no [legal] suffering [by the saint] for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

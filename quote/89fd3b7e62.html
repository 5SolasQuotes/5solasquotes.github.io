<main class="wrap"><figure class="quote" id="q-89fd3b7e62" data-kw="">
<blockquote><p>Why do we say that he permits, but just because he wills? Nor, indeed, is there any probability in the thing itself--viz. that man brought death upon himself merely by the permission, and not by the ordination of God; as if God had not determined what he wished the condition of the chief of his creatures to be. I will not hesitate, therefore, simply to confess with Augustine that the will of God is necessity, and that every thing is necessary which he has willed; just as those things will certainly happen which he has foreseen (August. de Gen. ad Lit., Lib. 6, cap. 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/permission-of-sin.html">Permission of sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/necessity-and-contingency.html">Necessity and Contingency</a> › <a href="../topics/the-decrees-of-god/necessity-and-contingency/necessity-of-the-consequence-and-of-the-consequent.html">Necessity of the consequence and of the consequent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f0eaba27e" data-kw="Author of sin">
<blockquote><p>God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §32</span></figcaption>

</figure><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin Hardening Justice Depravity">
<blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin Author of sin Holiness Justice">
<blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</span></figcaption>

</figure><figure class="quote" id="q-dda3160a8c" data-kw="Hardening Free Will Justice">
<blockquote><p>For in those people God did not make the common sins but found them there, as we have noted before. And although God, in his just but to us hidden judgment, does abandon and harden them more and more (Romans 9:18), yet it is they who by their own free choice first become hardened (Romans 11:7) and abandon the benefits of general providence; they abuse God’s longsuffering, as Paul testifies in Romans 1:18, 26, and 28.</p></blockquote>

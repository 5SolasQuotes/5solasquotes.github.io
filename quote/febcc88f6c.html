<blockquote><p>And as for those ancient and modern divines whom the Antinomians have corrupted and misrepresented, the reader may see them all vindicated, and their concurrence with those I have named evidenced by that learned and pious Mr. John Graile, in his Modest Vindication of the doctrine of conditions in the covenant of grace, from p. 58 onward; a man whose name and memory is precious with me, not only upon the account of that excellent sermon he preached, and those fervent prayers he poured out many years since at my ordination; but for that learned and judicious treatise of his against Mr. Eyre [above], wherein he hath cast great light upon this controversy, as excellent Mr. Baxter and Mr. Woodbridge have also done. But alas! what evidence is sufficient to satisfy ignorant and obstinate men!” – Works, vol. 3, Appendix, Vindicarum Vindex, p. 530-1 Fisher, Edward – The Marrow of Modern Divinity… with notes by the Rev. Thomas Boston (d. 1655; Philadelphia: Presbyterian Board, 1850) Roberts, Francis – Mysterium &amp; Medulla Bibliorum: The Mystery and Marrow of the Bible, viz. God’s Covenant with Man in the First Adam before the fall, and in the last Adam, Jesus Christ, after the Fall, from the beginning to the end of the world: unfolded &amp; illustrated in positive aphorisms &amp; their explanation… (London, 1657) This was the 1,700 page puritan magnum opus on covenant theology. For a summary of it, see Won Taek Lim, The Covenant Theology of Francis Roberts (2000, Ph.D. diss., Calvin Theological Seminary). For the life of Roberts, see Lim, pp. 29-38. Blake, Thomas – Vindiciæ Foederis, or, A Treatise of the Covenant of God entered with mankind in the several kinds and degrees of it, in which the agreement and respective differences of the Covenant of Works and the Covenant of Grace, of the Old and New Covenant are Discussed (London, 1658) ToC Blake (c.1596-1657) was an English Puritan clergyman and controversialist of moderate Presbyterian sympathies. Younge, Richard – A Short and Sure Way to Grace and Salvation, being a necessary and profitable tract upon three fundamental principles of Christian religion: how man was at first created, how he is now corrupted, how he may be again restored: together with the conditions of the covenant of grace, and to whom the promises of the Gospel belong… (London, 1658) This work of Younge’s appears to be orthodox. For his treatment of conditions of the Covenant, see Section 20. As he speaks of faith as ‘the condition’ of the covenant, and repentance being a fruit thereof, it appears that when he speaks of conditions of keeping God’s commandments, he is speaking of them as consequent conditions of being in God’s Covenant. Gillespie, Patrick – The Ark of the Testament Opened, a Treatise of the Covenant of Grace… (1661) Only Ch. 8 is online. P. Gillespie (1617-1675) was a Scottish covenanter and the younger brother of George Gillespie. This work, coming later in the 1600’s, was perhaps the fullest puritan discussion of the Covenant of Grace, analyzing all the significant works that came before it. Sedgwick, Obadiah – The Bowels of Tender Mercy Sealed in the Everlasting Convenant (London, 1661) Sedgwick was a Westminster divine. Bridge, William – Christ and the Covenant; the Work and Way of Meditation: Gods Return to the Soul, Or Nation; Together with His Preventing Mercy. Delivered in Ten Sermons (London, 1667) Nevay, John – The Nature, Properties, Blessings and Saving Graces of the Covenant of Grace: Opened and Applied, in 52 Sermons on 2 Sam. 23:5 (Glasgow, 1748) Nevay was a Scottish covenanter. Flavel, John The Fountain of Life Opened, or, A Display of Christ in his Essential and Mediatorial Glory wherein the Impetration of our Redemption by Jesus Christ is Orderly Unfolded as it was Begun, Carried on &amp; Finished… (London, 1673) Vindiciæ Legis &amp; Fœderis: or, A Reply to Mr. Philip Cary’s Solemn Call, wherein he pretends to answer all the arguments of Mr. Allen, Mr. Baxter, Mr. Sydenham, Mr. Sedgwick, Mr. Roberts, and Dr. Burthogge for the right of believers’ infants to baptism, by proving the Law at Sinai, and the Covenant of Circumcision with Abraham, were the very same with Adam’s Covenant of Works, and that because the Gospel-Covenant is Absolute (London, 1690) Part 2 of the Reply is entitled, ‘Of the Conditionality of the New Covenant’ The Balm of the Covenant Applied to the Bleeding Wounds of Afflicted Saints, First composed for the relief of a pious and worthy family, mourning over the deaths of their hopeful children; and now made public for the support of all Christians, sorrowing on the same or any other account… (London, 1688) on 2 Sam. 23:5 Strong, William – A Discourse of the Two Covenants: wherein the Nature, Differences and Effects of the Covenant of Works and of Grace are Distinctly, Rationally, Spiritually and Practically Discussed; together with a Considerable Quantity of Practical Cases Dependent Thereon (London, 1678) Strong (d. 1654) was an English, Independent divine. Alleine, Richard – Heaven Opened; or, a Brief and Plain discovery of the riches of God’s Covenant of Grace (d. 1681; New York : American Tract Society, 1852) 385 pp. Alleine (c.1610-1681) was an English, puritan divine. Saller, William – The Two Covenants of Works and of Grace, described and opened for the enlightening and comfort of the present generation (London, 1682) 46 pp. Saller (d. c. 1680) was reformed, and was amidst the puritans, though he held to and published defenses of 7th Day Sabbatarianism. Willard, Samuel – Covenant-Keeping the Way to Blessedness, or, A Brief Discourse wherein is shown the connexion which there is between the promise on God’s part and duty on our part in the Covenant of Grace: as it was delivered in several sermons, preached in order to solemn renewing of covenant (Boston, 1682) Willard was a New England puritan. Vlak, Johannes – Dissertation 2, On the Eternal Covenant of Peace, or Testament of Grace in General in A Triad of Dissertations: on the Covenants of God of Works &amp; of Peace, &amp; on Justification in Response to Leydekker (1689), pp. 170-253 trans. AI Latin Vlak (c.1635-1690) appears to have leaned towards Cocceius, contra Leydekker who was a Voetian. Hopkins, Ezekiel – The Doctrine of the Two Covenants, wherein the Nature of Original Sin is at large explained… with a discourse of glorifying God in his attributes (d. 1690; London, 1712) Table of Contents This is also in vol. 2 of his Works. Hopkins (1634-1690) was a reformed, Anglican divine in the Church of Ireland. Wedderburn, Alexander – David’s Testament Opened up in Forty Sermons upon 2 Samuel 23:5, Wherein the nature, properties, and effects of the Covenant of Grace are clearly held forth (Edinburgh, 1691) Wedderburn (c.1620-1678) was reformed. Watson, Thomas – Q. 20, ‘Of the Covenant of Grace’ &amp; ‘Christ the Mediator of the Covenant’ in A Body of Practical Divinity in a Series of Sermons on the Shorter Catechism (Glasgow &amp; Edinburgh: Blackie &amp; Son, 1859), pp. 91-102 Cross, Walter – Kelaʻ le-dor: a Compend of the Covenant of Grace as the most solid Support under the most Terrible Conflicts of Death, though Armed with Desertion, Decay of Grace, and Sense of Guilt (London, 1693) Cross (fl.1692-1698) was reformed. Heywood, Oliver – The Best Entail, or Dying Parents’ Living Hopes for their Surviving children, grounded upon the covenant of God’s grace, with believers and their seed 1693 in Works, vol. 4, pp. 419-504 Mence, Francis – Vindiciae Foederis, or, A Vindication of the Interest that the Children of Believers, as such, have in the Covenant of Grace, with their parents, under the gospel-dispensation: being the substance of two sermons, with addition, preached to a congregation in Wapping: also some seasonable reflections upon various unsound, and cruel passages taken forth of two furious books of Mr. Hercules Collins, printed against infants’-baptism (London, 1694) on Acts 2:39 Mence (c.1639-1696) was a reformed, English pastor near London. . 1700’s Witsius, Herman – The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity, vols. 1, 2, 3 Buy d. 1708 Witsius took a mediating position between that of Voetius and Cocceius. Vlak, Johannes – Eternal Gospel, or the Doctrine of Salvation, contained in a Post-Reading over the Promises to the Fathers, Law by Moses &amp; Truth in Christ (1708) 165 pp. Dutch Vlak (c.1635-1690) appears to have leaned towards Cocceius, contra Leydekker who was a Voetian. His work is organized around the redemptive-historical unfolding of the Biblical covenants. Hog, James – Some Select Notes Towards Detecting a Covered Mixture of the Covenant of Works, and of Grace: With the Danger of that Evil; and a Few Advices for Remedying Thereof. Contained in a Letter to a Friend Upon the Head Ref 1718 20 pp. Hog (c.1658-1734) was a Scottish minister at Carnock, known for his role in the Marrow Controversy within the Church of Scotland. Taylor, Richard – Discourses on the Fall and Misery of Man: and on the Covenant of Grace (London: John Clark, 1725) 379 pp. Herman Witsius footnotes this work under the statement: “The formularies of the Protestant Churches in general, and the writings of the most eminent Reformed Divines…” – On the Apostles’ Creed, Note XII, p. 386 Lampe, Friedrich A. – The Mystery of the Covenant of Grace for the Service of Youth… who are to be admitted to the Holy Supper 3rd ed. (d. 1729; Maastricht, 1767) 135 pp. This is in question and answer format. tr. AI by Monergism Dutch Wells, Edward – An Help for the Right Understanding of the Several Divine Laws &amp; Covenants, whereby Man has been Obliged through the Several Ages of the World to Guide Himself in Order to Eternal Salvation (1729) Wells (1667-1727) was an Anglican. Myseras, Lambert – The Cabinet of the Covenant of Grace (1734) 195 pp. About tr. AI by Monergism Dutch Willison, John – A Sacramental Catechism; or a Familiar Instructor for young communicants. Plainly unfolding the Nature of the Covenant of Grace, with the Two Seals Thereof… (Pittsburgh, 1794/1830) d. 1750 Willison was an evangelical Church of Scotland minister, known for his works on the Lord’s Supper. Wilson, David – Palæmon’s Creed Reviewed and Examined: wherein several gross and dangerous errors, advanced by the author of the Letters on Theron and Aspasio, are detected and refuted; and the Protestant doctrine concerning the Covenant of Works and the Covenant of Grace, Conviction of Sin, Regeneration, Faith, Justification, Inherent Grace, etc., vindicated from the cavils and exceptions of that Author, and shown to be entirely conformable to the Apostolic Doctrine concerning the several points afore-mentioned, vol. 1, 2 (London, 1762) Wikipedia: “Theron and Aspasio, or a series of Letters upon the most important and interesting Subjects [by James Hervey, 1724-58, an Anglican clergyman], which appeared in 1755, and was equally well received, called forth some adverse criticism even from Calvinists, on account of tendencies which were considered to lead to antinomianism, and was strongly objected to by Wesley in his Preservative against unsettled Notions in Religion. Besides carrying into England the theological disputes to which the Marrow of Modern Divinity had given rise in Scotland (the Marrow Controversy), it also led to what is known as the Sandemanian controversy as to the nature of saving faith.</p></blockquote>

<blockquote><p>From all this it follows: First, that all the faithful are of the same faith with Abraham. The father and the sons-spiritual are of the same belief: as they do partake of the same spiritual privileges. It is one God that justifies the circumcision and the uncircumcision, and it is the same faith whereby the promises of mercy are embraced. Zaccheus is called the son of Abraham, and he believed in Christ as did Abraham.

2. Not only promises of temporal good things, but of spiritual and eternal were made to the patriarchs in the Covenant of Grace, and sought and obtained by them. They looked for a city whose builder and maker the Lord is. (Heb. 11:11-12) Remission of sins and life everlasting was preached in the Covenant, sealed in the sacrament, and typified by the land of Canaan. To conceive the fathers to be an assembly of brute beasts, which looked to be fed with earthly blessings alone, is highly to dishonor them, and lessen the grace and mercy of God towards them.

3. Sacramental phrases, wherein the name of the thing signified is given to the sign, are ancient and familiar; as circumcision is called the Covenant, and the rock Christ. Why then should our adversaries stumble at this, that in the sacrament of the Supper the bread is called the body of Christ?

4. In this expression of the Covenant, the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>

<blockquote><p>It follows not that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more than the apple goes before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.</p></blockquote>

<blockquote><p>VIII. Divines explain themselves differently as to the conditions of the covenant of grace. We, for our part, agree with those who think that the covenant of grace, to speak accurately, with respect to us has no conditions, properly so called; which sentiment we shall explain and establish in the following manner.

IX. A condition of a covenant, properly so called, is that action which, being performed, gives a man a right to the reward. But that such a condition cannot be required of us in the covenant of grace, is self-evident: because a right to life neither is nor indeed can be founded on any action of ours, but on the righteousness of our Lord alone; who having perfectly fulfilled the righteousness of the law for us, nothing can, in justice, be required of us to perform, in order to acquire a right already fully purchased for us. And, indeed, in this all the orthodox readily agree.

X. Further, the apostle more than once sets forth the covenant of grace under the appellation of a testament, which is God’s immutable purpose, not suspended on any one condition: and as it is founded on the unchangeable counsel of God, and ratified by the death of the testator, so it is not possible it should be made void by any unbelief of the elect, nor acquire its stability from any faith of man; for in this very testament God has immutably determined concerning faith, as salvation. Thus, Gal. 3:15, we see the covenant of God with Abraham is called a testament; the ratification of which must also be the same with that of a testament. And the covenant to be made with Israel, Jer. 31 has the same appellation, Heb. 8:10; as also that covenant with Israel mentioned by Moses, Exod. 24 and the declaration of the manner of enjoying the love of God through faith in Christ, Heb. 9:15, 20. And likewise, the compact of the Father with the Son, Luke 22:39, “In which passage, first, the will of God is published, by which he decreed, that the Son should, by the divine power of the Father, obtain the inheritance of the world, and a kingdom: secondly, the will of Christ, that the apostles and others given him should, through faith, become heirs of righteousness, and of the heavenly kingdom and of that of the world.” Compare Gal. 3:8. “But why should the apostle call the covenant of Abraham, and that mentioned, Heb. 8:10, a testament, and whether it ought not to be so taken, Matt. 26:18, and in other places, shall be considered in its place.”—Cocceius de Fœder. §. 4. And, in a word, I know not whether Paul, when speaking of the covenant of grace, did at any time or in any passage give it any other name than that of a testament. “But at that time,” at least if we give in to Cocceius’s opinion, “that word signified, neither to Greeks, nor Hellenist Jews, nor to the Hebrews, any other thing but a testament.” Cocceius ad Gal. 3 §. 134. I do not assert these things, as if I wanted to confound the notions of a covenant and a testament; but to show that the covenant of grace is testamentary, and to be distinguished from a covenant founded on a compact agreement, or law. Nor do I conceal that I found this in Cocceius de Fœd. §. 87; which made me wonder that a certain learned person, who is a great admirer of Cocceius, should find fault with these things.

XI. The famous Cloppenburg, formerly the ornament of the university of Friesland, has accurately observed the same thing, whose words I shall subjoin from Disputat. 3, de Fœderibus, Thes. 29: “The other disposition of the covenant [which regards us] is testamentary, whereby the grace by which we are saved comes to us from the most perfect merit of Christ the surety. For we are reckoned to be in covenant with God by the new covenant of grace, without having superadded to the covenant confirmed with Christ, the surety, by the renewal of the old agreement, any condition by which God should transact with us, but giving a gratuitous call to the inheritance of the promises whose testament Christ ratified by his death, and whose mediator he now is in heaven; namely, of full reconciliation with God and of eternal life.” Junius, in like manner, in his Theses, Disputat. 25, §. 29, “The conditions being fulfilled by the Angel of the Covenant, the catholic church was, through and for him, constituted heir of eternal life, without any condition.</p></blockquote>

— Herman Witsius, The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, 2 vols. (London: Tegg &amp; Son, 1837), vol. 1, pp. 252–58; italics original. See also Herman Witsius, The Economy of the Covenants Between God &amp; Man, 2 vols. (1822; RHB, 2017), vol. 1, pp. 284–91">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+Divines+explain+themselves+differently+as+to+the+conditions+of+the+covenant+of+grace.+We%2C+for+our+part%2C+agree+with+those+who+think+that+the+covenant+of+grace%2C+to+speak+accurately%2C+with+respect+to+us+has+no+conditions%2C+properly+so+called%3B+which+sentiment+we+shall+explain+and+establish+in+the+following+manner.+IX.+A+condition+of+a+covenant%2C+properly+so+called%2C+is+that+action+which%2C+being+performed%2C+gives+a+man+a+right+to+the+reward.+But+that+such+a+condition+cannot+be+required+of+us+in+the+covenant+of+grace%2C+is+self-evident%3A+because+a+right+to+life+neither+is+nor+indeed+can+be+founded+on+any+action+of+ours%2C+but+on+the+righteousness+of+our+Lord+alone%3B+who+having+perfectly+fulfilled+the+righteousness+of+the+law+for+us%2C+nothing+can%2C+in+justice%2C+be+required+of+us+to+perform%2C+in+order+to+acquire+a+right+already+fully+purchased+for+us.+And%2C+indeed%2C+in+this+all+the+orthodox+readily+agree.+X.+Further%2C+the+apostle+more+than+once+sets+forth+the+covenant+of+grace+under+the+appellation+of+a+testament%2C+which+is+God%E2%80%99s+immutable+purpose%2C+not+suspended+on+any+one+condition%3A+and+as+it+is+founded+on+the+unchangeable+counsel+of+God%2C+and+ratified+by+the+death+of+the+testator%2C+so+it+is+not+possible+it+should+be+made+void+by+any+unbelief+of+the+elect%2C+nor+acquire+its+stability+from+any+faith+of+man%3B+for+in+this+very+testament+God+has+immutably+determined+concerning+faith%2C+as+salvation.+Thus%2C+Gal.+3%3A15%2C+we+see+the+covenant+of+God+with+Abraham+is+called+a+testament%3B+the+ratification+of+which+must+also+be+the+same+with+that+of+a+testament.+And+the+covenant+to+be+made+with+Israel%2C+Jer.+31+has+the+same+appellation%2C+Heb.+8%3A10%3B+as+also+that+covenant+with+Israel+mentioned+by+Moses%2C+Exod.+24+and+the+declaration+of+the+manner+of+enjoying+the+love+of+God+through+faith+in+Christ%2C+Heb.+9%3A15%2C+20.+And+likewise%2C+the+compact+of+the+Father+with+the+Son%2C+Luke+22%3A39%2C+%E2%80%9CIn+which+passage%2C+first%2C+the+will+of+God+is+published%2C+by+which+he+decreed%2C+that+the+Son+should%2C+by+the+divine+power+of+the+Father%2C+obtain+the+inheritance+of+the+world%2C+and+a+kingdom%3A+secondly%2C+the+will+of+Christ%2C+that+the+apostles+and+others+given+him+should%2C+through+faith%2C+become+heirs+of+righteousness%2C+and+of+the+heavenly+kingdom+and+of+that+of+the+world.%E2%80%9D+Compare+Gal.+3%3A8.+%E2%80%9CBut+why+should+the+apostle+call+the+covenant+of+Abraham%2C+and+that+mentioned%2C+Heb.+8%3A10%2C+a+testament%2C+and+whether+it+ought+not+to+be+so+taken%2C+Matt.+26%3A18%2C+and+in+other+places%2C+shall+be+considered+in+its+place.%E2%80%9D%E2%80%94Cocceius+de+F%C5%93der.+%C2%A7.+4.+And%2C+in+a+word%2C+I+know+not+whether+Paul%2C+when+speaking+of+the+covenant+of+grace%2C+did+at+any+time+or+in+any+passage+give+it+any+other+name+than+that+of+a+testament.+%E2%80%9CBut+at+that+time%2C%E2%80%9D+at+least+if+we+give+in+to+Cocceius%E2%80%99s+opinion%2C+%E2%80%9Cthat+word+signified%2C+neither+to+Greeks%2C+nor+Hellenist+Jews%2C+nor+to+the+Hebrews%2C+any+other+thing+but+a+testament.%E2%80%9D+Cocceius+ad+Gal.+3+%C2%A7.+134.+I+do+not+assert+these+things%2C+as+if+I+wanted+to+confound+the+notions+of+a+covenant+and+a+testament%3B+but+to+show+that+the+covenant+of+grace+is+testamentary%2C+and+to+be+distinguished+from+a+covenant+founded+on+a+compact+agreement%2C+or+law.+Nor+do+I+conceal+that+I+found+this+in+Cocceius+de+F%C5%93d.+%C2%A7.+87%3B+which+made+me+wonder+that+a+certain+learned+person%2C+who+is+a+great+admirer+of+Cocceius%2C+should+find+fault+with+these+things.+XI.+The+famous+Cloppenburg%2C+formerly+the+ornament+of+the+university+of+Friesland%2C+has+accurately+observed+the+same+thing%2C+whose+words+I+shall+subjoin+from+Disputat.+3%2C+de+F%C5%93deribus%2C+Thes.+29%3A+%E2%80%9CThe+other+disposition+of+the+covenant+%5Bwhich+regards+us%5D+is+testamentary%2C+whereby+the+grace+by+which+we+are+saved+comes+to+us+from+the+most+perfect+merit+of+Christ+the+surety.+For+we+are+reckoned+to+be+in+covenant+with+God+by+the+new+covenant+of+grace%2C+without+having+superadded+to+the+covenant+confirmed+with+Christ%2C+the+surety%2C+by+the+renewal+of+the+old+agreement%2C+any+condition+by+which+God+should+transact+with+us%2C+but+giving+a+gratuitous+call+to+the+inheritance+of+the+promises+whose+testament+Christ+ratified+by+his+death%2C+and+whose+mediator+he+now+is+in+heaven%3B+namely%2C+of+full+reconciliation+with+God+and+of+eternal+life.%E2%80%9D+Junius%2C+in+like+manner%2C+in+his+Theses%2C+Disputat.+25%2C+%C2%A7.+29%2C+%E2%80%9CThe+conditions+being+fulfilled+by+the+Angel+of+the+Covenant%2C+the+catholic+church+was%2C+through+and+for+him%2C+constituted+heir+of+eternal+life%2C+without+any+condition.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+2+vols.+%28London%3A+Tegg+%26+Son%2C+1837%29%2C+vol.+1%2C+pp.+252%E2%80%9358%3B+italics+original.+See+also+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+%26+Man%2C+2+vols.+%281822%3B+RHB%2C+2017%29%2C+vol.+1%2C+pp.+284%E2%80%9391&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F070d9b7b03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/070d9b7b03.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/in-what-respects-the-covenant-of-grace-is-condition/#:~:text=VIII.%20Divines%20explain%20themselves%20differently%20as,of%20eternal%20life%2C%20without%20any%20condition&amp;text=VIII.%20Divines%20explain%20themselves%20differently%20as%20to%20the&amp;text=constituted%20heir%20of%20eternal%20life%2C%20without%20any%20condition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in through the gates into the city.’ And lest we should think the commands are all but one only precept of believing, he addeth “for without are dogs and sorcerers, and whoremongers, and murderers, etc.” “He that hath my commandments, and keepeth them, he it is that loveth me, and he that loveth me shall be loved of my Father, and I will love him and manifest myself to him.</p></blockquote>

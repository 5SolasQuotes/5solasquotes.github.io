<main class="wrap"><figure class="quote" id="q-6ef87b084f" data-kw="">
<blockquote><p>Now, the law is a doctrine partly known by nature, teaching us that there is a God, and what God is, and what he requires us to do, binding all reasonable creatures to perfect obedience, both internal and external, promising the favour of God, and everlasting life to all those who yield perfect obedience thereunto, and denouncing the curse of God and everlasting damnation to all those who are not perfectly correspondent thereunto. But the gospel is a doctrine revealed from heaven by the Son of God, presently after the fall of mankind into sin and death, and afterwards manifested more clearly and fully to the patriarchs and prophets, to the evangelists and apostles, and by them spread abroad to others; wherein freedom from sin, from the curse of the law, the wrath of God, death, and hell, is freely promised for Christ’s sake unto all who truly believe on his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1645, modern edition, 2009).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dfc5eed2bf" data-kw="">
<blockquote><p>But you might say, “Isn’t there also much Law in the Gospels and in the Epistles of Paul, and again many promises in the books of Moses and the prophets?” Answer: There is no book in the Bible in which both are not found. God has always placed side by side both Law and promise. For He teaches by the Law what is to be done and by the promises where we are to receive that. But the New Testament is especially called “Gospel” above the other books because it was written after the coming of Christ, who fulfilled the divine promises, brought them to us, and publicly proclaimed them by oral preaching, which previously were concealed in the Scriptures. Therefore, hold to this distinction, and no matter what books you have before you, whether of the Old or of the New Testament, read them with this distinction so that you observe that when promises are made in a book, it is a Gospel book; when commandments are given, it is a Law book. But because in the New Testament the promises are found so abundantly, and in the Old Testament so many laws are found, the former is called “Gospel” and the latter, “the Book of the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Year in the Gospels with Martin Luther</cite>, (p. 64–65). Concordia Publishing. Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-874faebf03" data-kw="">
<blockquote><p>God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfill it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 93</span></figcaption>

</figure><figure class="quote" id="q-3a2e559560" data-kw="believer obedience not punishment">
<blockquote><p>In the state of grace, it binds the believer only to obedience, not to punishment because there is no condemnation to those who are in Christ (Rom. 8:1), whose transgressions are forgiven (Ps. 32:1). Rather the question concerns the state of sin—whether in it the sinner is bound to both (which we assert). First, from the twofold condition of sinful man, who is both a creature and a sinful creature. As a creature, he owes to God obedience forever and never can be discharged from it. As a sinner, he owes punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.12–13</span></figcaption>

</figure><figure class="quote" id="q-36e4c46091" data-kw="abrogation justification curse">
<blockquote><p>The question does not concern the use of the law as to justification—whether we are still bound to the law in order to acquire life. Since this is impossible after sin, in this sense it may even be said to have been abrogated: “By the deeds of the law there shall no flesh be justified” (Rom. 3:20) and “As many as are of the works of the law, are under the curse” (Gal. 3:10). Second, the question does not concern its curse because by Christ under this relation it is abrogated with respect to believers: “Christ hath redeemed us from the curse of the law, being made a curse for us” (Gal. 3:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.2</span></figcaption>

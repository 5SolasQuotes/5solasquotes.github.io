<main class="wrap"><figure class="quote" id="q-d6cb646a70" data-kw="">
<blockquote><p>XLII. As for the name ‘catholic,’ most of our [Reformed] theologians say that it is common to both the visible and invisible Church, but the invisible Church is absolutely and simply to be called catholic, that is, universal, because it encompasses all the elect from the beginning of the world. However, the visible Church is to be considered catholic in a certain respect, as it encompasses all those who together profess the true and saving religion on earth and includes all particular churches scattered in various parts of the world. In my opinion, the name Catholic is a title of that part of the Church which now militates on earth under Christ, and this name is given to it: 1. Because it is spread throughout the whole world, not restricted to one nation as the Jewish Church was in ancient times. 2. Because it embraces the entire doctrine of the apostles, not admitting part and rejecting part like heretical sects. Finally, because it has persevered the same in all times, namely, through succession and continuation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 430 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8163bee18" data-kw="">
<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, bk. 1, ch. 19, pp. 395-96 in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 402</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

t online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d76c64c47c" data-kw="catholic invisible">
<blockquote><p>Even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. This question truly belongs to another controversy, concerning the perpetual appearance and conspicuousness of the church as to external state. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>

</figure><figure class="quote" id="q-02bfdf5044" data-kw="">
<blockquote><p>…whatsoever is wanting [lacking] of that which is commanded, or remaining of that which is forbidden, is not able to put that assembly, which by faith is laid upon Christ, from the right and title of being the Church of Christ: for faith can admit no such thing which gives an utter overthrow and turning upside down of the truth. By this title of ‘the faithful,’ the apostle in his epistles notes out the Churches of God, it being all one with him to say, ‘To the faithful,’ or ‘To the saints,’ as ‘To the Church’ of such a place. Whatsoever wants unto this, or is more than enough that wants, or abounds to the disgrace or uncomeliness or to the hazard of continuance, and not to the present overthrow of the Church. Hereupon the people of Israel, which neglected for the space of forty years the holy sacrament of circumcision and the Passover also as it seems (one only time excepted), ceased not therefore to be the Churches of God and to have the Sanctuary among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, (1584), pp. 7-8 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>

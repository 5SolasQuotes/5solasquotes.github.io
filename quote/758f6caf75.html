<blockquote><p>The glory which Christ thus bears as Ruler in the temple is represented in Scripture as the fruit of his sufferings. This honour was secured to him in the Covenant of Redemption, as the stipulated reward of his obedience unto death — “He humbled himself, and became obedient unto death, even the death of the cross; wherefore God also hath highly exalted him, and given him a name which is above every name.” Thus, in the very act of laying the foundation of the temple, he earned his mediatorial right to rule in it, and thus also he earned that universal dominion which as Mediator he possesses. He who died upon the cross now sits and rules upon his throne, as “Head over all things to the Church.”

How glorious the majesty of his kingdom, and the exercise of his royal power! He stretches over his people a golden sceptre of righteousness and love. He sends forth his angels as ” ministering spirits to minister to them who shall be heirs of salvation.” With the rod of his strength he controls the hosts of hell, and sets a bound to their malignity which it cannot overpass.

He maketh the wrath of man to praise him, and the remainder thereof he restrains—nay, he maintains the very fabric of the world for the sake of the Church which he ransomed with his blood; and when the work which the text ascribes to him shall have reached its consummation, “the earth and all the works that are therein shall be burnt up.” The scaffolding shall be taken down when the building is completed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-couper.html">David Couper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the Builder and Ruler of the Temple in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>In making intercession also — in pleading our cause at the right hand of God — Christ gives himself whole and undivided to his people. For, “having come an High Priest of good things to come, not by the blood of goats and calves,” says the Apostle, “but by his own blood, Christ entered in once into the holy place, having obtained eternal redemption for us.” The ground, then, on which, in the heavenly temple, he rightfully asks and obtains from the Father every communication of good to sinners, is that very obedience unto death — that great propitiation — in which, as we have already seen, the riches, both divine and human, of his entire person, were lavished and expended for our sake. On earth the sacrifice was made, but it is presented in heaven.

There the wounds of his mortal flesh received on the cross — together with the agonies of his soul, when his God forsook him — and both these conjoined with the humiliation of his Divinity, when all its glory lay shrouded in the ignominy and woes of that insulted, persecuted, murdered man — there on High, the whole of these things together are offered before God, as the one righteous foundation — the one acceptable and precious good desert — the one prevailing, triumphant, and glorious plea, on the strength of which, he receives for his people all righteousness, grace, and salvation.

But who is capable of so bringing merits like these to hear, in the height, and depth, and length, and breadth of their own immeasurable worthiness, and in the full strength and tenderness of their hold upon the Father’s love, except that Son of God and Man alone, in the one unexampled complexity of whose person only, it was ever possible that they should be contemplated or realized? None can adequately wield such wonders, but lie that hath matchlessly achieved them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-maclagan.html">James Maclagan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Spiritually Given, in all His Fulness, to His People in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-3d88089415" data-kw="">
<blockquote><p>II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, He is the Savior of the elect only. Jn. 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Mt. 20:28, Jn. 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning He died efficaciously for all his sheep. Jn. 10:15. And in these all and alone there is a certain special universality, as is in Ambrose, bk. 1, Of the Calling of the Gentiles, ch. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.</p></blockquote>

<blockquote><p>Though I yield some degree of eﬃcacy in Christ’s death unto all; yet I conceive it far short, both of impetration [legal undertaking and payment of sins] and application of that gracious atonement, which is thereby wrought to the elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s bread is not meet for whelps; and full souls will despise honey-combs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Cotton to James Ussher</cite>, 31 May 1626 in Sargent Bush, Jr. (ed.), The Correspondence of John Cotton (Chapel Hill: University of North Carolina Press, 2001), pp. 111-12</span></figcaption>

<blockquote><p>Whether Christ suffered and died for every single man, none excepted? It is denied. Whether and in what sense the distinction between the sufficiency and efficacy of Christ’s death in this matter is to be admitted? It is explained. Whether therefore it is rightly able to be said that Christ died and satisfied as mediator and a sponsor for all sufficiently? It is denied. Whether Christ so died for all and every single man that he procured [impetrarit] for those reconciliation with God and the remission of sins? It is denied. Whether the death of Christ expiated the sin of Adam and original sin in all men, and even through that the whole human genus was assumed into the Covenant of Grace, and lastly sufficient grace was being acquired and communicated for faith and regeneration for all and every single man? It is denied, contra the Anabaptists, Puccius, Huber [a Lutheran], etc. Whether all and every single man is given from the Father to Christ? It is denied. Whether Christ on the cross bore up [in] the person of the elect ones? It is affirmed. Whether He neither was able or ought to have died for the elect? It is denied. Whether Christ was a priest for all men, even Pharaoh? It is denied. Whether the intercession of Christ is twofold, one, universal for all men, even unbelievers, the other for the particular faithful ones? It is denied. Whether Christ always achieves the end of his death? It is affirmed. Whether the proper and thus truly spoken end of Christ’s death is the application of reconciliation and the remission of sins? It is affirmed. Whether the procuring and application of reconciliation are not of equally wide extent, but are separable, so that reconciliation may not be applied to all for whom procuring has been wrought? It is denied contra the Remonstrants. … Whether the efficacy of the death of Christ in the production of faith and regeneration, or with respect to the event, stands wholly within us? It is denied. Whether God has prepared on his part to propose the word of reconciliation, secured through the death of Christ, to all and every man? It is denied. Whether the ransom (lutron) of Christ is sufficient even to redeem devils? It is denied. Whether all and every man ought to believe Christ has died for him, whether absolutely or even hypothetically? The latter is affirmed. [This might mean that every person ought to believe that Christ died for him on a certain hypothesis being posited, namely if he believes.] Whether, hence, all the impious are condemned because they did not believer Christ died for them? It is denied. Whether Christ’s death has been accomplishing out of the greatest love which He loved all those for which He died? It is affirmed. Whether the fruit of Christ’s resurrection, even of his ascension and session at the right hand, pertains to all and every one for whom He died? It is affirmed. Whether unbeleivers or impenitents are able to console themselves in the death of Christ? It is denied. Whether the Remonstrants [Arminians] in their second article defend the laud and glory of divine grace, and further, the efficacy of Christ’s merit, against us? It is denied: certainly they nowhere greatly overturn. Whether Christ fulfilled the law in our place by holy living? It is affirmed against the Socinians. Whether Christ fulfilled the law even for Himself, and was bound to fulfill, and further, hence, He merited for Himself? The former is affirmed, the latter is distinguished. … Whether the satisfaction for us being looked into is able to be the end of our faith? It is distinguished.</p></blockquote>

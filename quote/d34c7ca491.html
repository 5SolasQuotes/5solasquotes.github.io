<blockquote><p>…obstinate heretics… scandalous and incorrigible sinners, after one and another admonition are suspended from the use of the sacraments and if they persevere in their contumacy and rebellion, they are ejected from the church, so that it is not lawful for them to join with believers in the exercise of piety. This ought not to be extended to political society… or other things due and necessary from our vocation in the economic or political state, as the Romanists wish; as if wives should be prohibited from their husbands, children from parents, servants from masters, subjects from rendering obedience to excommunicated princes, to which they are bound by the law of nature. For excommunication cannot sever the natural and moral bonds by which men are mutually held together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 3, 18th Topic, ‘The Church’, 32nd Question, ‘Ecclesiastical Discipline and Excommunication’, section V</cite>, p. 294</span></figcaption>

<blockquote><p>9th Assertion…. 1. As the object of that high [civil] office is merely and purely civil and positive, relating only to a civil end, of peace: as in importing or exporting of goods, of wool, wax, moneys for the good of the commonwealth, the crying up or crying down of the value of coined gold or silver, the making of laws merely civil; as not to carry armor in the night [which is threatening] in such a city: so in war, commanders, captains and colonels are magistrates to order the battle, lay stratagems… the parliaments’ power in disposing of fowling, fishing, hunting, eating of flesh, or not eating at such a time: all these, as the Word of God does not particularly warrant the one side more than the other, are merely civil and positive. It is sure the magistrate has a supremacy, and an independency above the Church or ministers of the Gospel in all these; and as these prescind [are detached] from all morality of the First and Second Table [in that they are not inherently moral or immoral of themselves]… In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the [civil] rulers have a supremacy.</p></blockquote>

<blockquote><p>1st Conclusion: Fire and sword, or war, or the coactive power of a magistrate is not God’s way of planting the Gospel in a heathen nation which never heard of the gospel before: 1. Because the apostles were commanded by teaching the gospel to all nations, Mt. 28:19-20; Mk. 16:15; Acts 7:8; and not by war to spread the gospel; 2. Because Christ’s Kingdom is not of this world, for then his servants would fight for Him (Jn. 18:36), nor are the weapons of our warfare carnal (2 Cor. 10:4), nor is Christ’s sword any other thing than the Word of God (Rev. 19:15; Gal. 6:17). And in this meaning, and with relation to the internal acts of sound believing, have the learned taught us that, religio suaderi potest, cogi non potest [‘Religion can be persuaded; it cannot be forced.’]. If these be the Constitutions of Clement, let it go for a truth in this sense, that: ‘God has given liberty of will to men, not punishing them with temporal death, but calls them to give an account of their doings in the life to come.’ …and Athanasius meant with us, when he cites that, ‘If any will come after me, let him take up his cross,’ to prove that the will cannot be compelled; and that of Lactantius is approved by all: Defendenda tamen religio est, non occidendo, sed moriendo, non saevitia, sed sapientia, non scelere, sed fide; illa enim malorum sunt, haec bonorum; et necesse est bonum in religione versari, non malum: Nam si sanguine, si tormentis, si malo religionem defendere velis, jam non defendetur illa, sed polluetur, et violabitur. Nihil est tam voluntarium quam religio, in qua si animus sacrificantis est eversus, jam sublata, jam nulla est. (Institutes, bk. 5, ch. 19) [“Religion, however, must be defended not by killing but by dying, not by cruelty but by wisdom, not by crime but by faith; for the former belong to the wicked, the latter to the good. And it is necessary that good, not evil, should be found in religion. For if you wish to defend religion by blood, by tortures, or by evil, it will no longer be defended but polluted and profaned. Nothing is so voluntary as religion; for if the heart of the worshiper is overturned, it is already destroyed—it no longer exists.”] All which tends to this, that religion is like free-will, and free-will like a virgin which cannot be ravished. Let that of Tertullian stand, Lex nostra non se vindicat ultore gladio [‘Our Law does not avenge itself with the avenging sword.’]. Procopius says that Justinian was blamed, because he compelled the Samaritans to embrace the Christian faith. (Procopius, in Arca. Histor.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (London: 1644), pt. 2, ch. 6</cite>, p. 353</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

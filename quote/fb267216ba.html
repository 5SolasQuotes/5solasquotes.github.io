<blockquote><p>As for an instance (which has been too frequent in all this isle all these years past, saving the pleasure of God), every burgh-royal has their own times of public mercats [markets] allowed unto them by the law, and the king’s privilege; but when the plague happened in any of these towns, did not he, by proclamation, discharge the holding of the mercat at that time for fear of infection, and yet thereby did no prejudice to their privileges…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86a7216cbc" data-kw="">
<blockquote><p>But I answer, [1.] the king as king has dominion-civil of places and times, as places and times, but not of places as sacred in use, and of times as sacred and religious: for his power in Church matters being accumulative, not privative [depriving], he cannot take away a house dedicated to God’s service no more than he can take away maintenance allotted by public authority upon hospitals, schools, doctors and pastors. God has here a sort of propriety of houses and goods as men have. Places as sacred-abused are subject to regal power; he may inhibit conventions of heretics.

2. The apostles might preach in the Temple, though civil authority forbid them.

3. Kings are as much lords of places as sacred and public, as they have a dominion of civil places, in respect the king may by coactive [coercive] power hinder that false and heretical doctrine be preached, either in public, or private places, for this he ought to do as a preserver of both Tables [of the Law] and a bearer of the sword for the good of religion; and if they may command pure doctrine to be preached, and sound discipline to be exercised, they may command the same to be done in public places.</p></blockquote>

<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church.

54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

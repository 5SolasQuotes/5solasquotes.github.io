<main class="wrap"><figure class="quote" id="q-91b057788b" data-kw="">
<blockquote><p>The Church is therefore the trustee of the Gospel. To her as a Steward are committed the oracles and, the ordinances of God, for the benefit of the world. No angel appears, as once to the Virgin Mary, to make known the Saviour. No star is seen to guide the wise men of the East to the manger of Bethlehem. All is concentrated in the Church. To her alone the privilege is granted. On her alone the responsibility rests to preach among the Gentiles, as well as Jews, “the unsearchable riches of Christ.”

We are therefore “debtors.” “We are debtors both to the Greeks, and to the Barbarians; both to the wise, and to the unwise.” We owe to every unevangelized human being that Gospel, which is “the true riches, the pearl of great price.” It is only given to us in trust. Neither we, nor it, are our own.

Woe therefore is unto that Church and unto that member of the Church, who does not, directly or indirectly, by prayer, by influence, by liberal help, by co-operation, by advice, by consecrating his children, and bringing them up for God,—woe unto him who does not, as he has opportunity and ability, “preach the Gospel to every creature.” Yes, Christian, you are a light, but if that light is hid under a bushel and not set on high, so as to give light to all, what is it good for?

Yes, Christian, you are as leaven, but if that leaven is confined to your own heart, to your own family, to your own church, to your own country, instead of leavening the whole mass of humanity, what is it good for? Yes, Christian, you are salt, but if the salt has lost the power to savour, purify and preserve, what is it good for? Ah! says Christ, that professing Christian who liveth unto himself—who seeks his own things and not the things that are Christ’s, is none of His.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-smyth.html">Thomas Smyth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Her Duty and Her Danger: A Sermon Preached for the Board of Foreign Missions, of the Presbyterian Church, on Sabbath Evening, May 1, 1853, in the Church on Fifth Avenue and Nineteenth Street, New York: And also in the Central Church, Philadelphia, on Sabbath Evening, May 22, 1853 (New York</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum, or The Divine Right of Church Government (London, 1646)</cite>, Jus Divinum, the Divine Right of Church Government, … (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’</span></figcaption>

<blockquote><p>9th Assertion…. 1. As the object of that high [civil] office is merely and purely civil and positive, relating only to a civil end, of peace: as in importing or exporting of goods, of wool, wax, moneys for the good of the commonwealth, the crying up or crying down of the value of coined gold or silver, the making of laws merely civil; as not to carry armor in the night [which is threatening] in such a city: so in war, commanders, captains and colonels are magistrates to order the battle, lay stratagems… the parliaments’ power in disposing of fowling, fishing, hunting, eating of flesh, or not eating at such a time: all these, as the Word of God does not particularly warrant the one side more than the other, are merely civil and positive. It is sure the magistrate has a supremacy, and an independency above the Church or ministers of the Gospel in all these; and as these prescind [are detached] from all morality of the First and Second Table [in that they are not inherently moral or immoral of themselves]… In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the [civil] rulers have a supremacy.</p></blockquote>

<blockquote><p>Drawing on principles of contract law developed by jurists and theologians from the School of Salamanca [Spain], the Jesuit controversialist Martinus Becanus (1563–1624) argues in favor of the duty to honor promises beyond confessional boundaries [contra the normal Roman position]… In particular circumstances the toleration of religious diversity may not only prevent greater evil, but also advance the greater good, especially by stimulating a kind of pious competition between confessional communities. This first English translation… [is] a major work of one of the most prominent advocates of a permission concept of tolerance in the early modern period.</p></blockquote>

<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God.

4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>

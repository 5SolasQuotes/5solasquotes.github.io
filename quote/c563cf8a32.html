<main class="wrap"><figure class="quote" id="q-c563cf8a32" data-kw="">
<blockquote><p>But if any one alleges that the human mind which is finite cannot possibly comprehend divine things which are infinite, we must here properly distinguish–For if by the word ‘comprehend’ be meant to comprehend perfectly, we are quite agreed. For we are entirely of the opinion that a perfect and adequate knowledge of divine matters is quite inconsistent with the imperfection of the human understanding. But if by ‘comprehending’ be understood a clear and convincing knowledge, to a certain degree, the greatness of the objects in such enquiries is by no means inconsistent with this kind of knowledge. For what can the mind conceive greater than eternity? when we attempt to have a full and adequate conception of it, our understanding is quite aborbed by the idea: and yet that there is such a thing as eternity is one of the clearest and most evident truths, as we shall demonstrate in its proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General</cite>, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

<blockquote><p>Briefly, the concept of double justice posits a higher hidden justice in God which transcends the Law and could condemn even the angels. This idea appears in Calvin’s works before the sermons on Job but always grows out of his fascination with Job 4:18, namely that even the angels are not clean in God’s sight… which proved that creaturely justice cannot satisfy the justice of God… But when he tried to develop double justice as a hermeneutical key to the book of Job as a whole, the text led him in a direction he did not want to go.</p></blockquote>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: 1. Because to act voluntarily is the most noble and plainly absolute perfection of all perfections of which we have an idea, conceived with and under the ratio of the most perfect spontaneity [spontaneitas], whereby He acts spontaneously and according to His own good pleasure: for it is among all other perfections the highest, to be the most free lord of one’s own actions by a certain supreme αὐτεξουσία [self-determination], compelled by no external cause or brute necessity of nature to do anything. And accordingly that free will, or spontaneity, is pre-eminently comprehended in the idea of the supremely perfect being. … §9. According to this diversity of objects, the will of God is partly necessary, partly free. It is necessary because God, beholding Himself, takes delight in Himself in His sufficiency and absolute perfection: and it is called necessary because He has its object so intimately present to Himself in His nature that without this thought God cannot even be conceived. Free is the will of the decree, whereby He determines concerning possible things: and it is called free because it is occupied with things depending purely upon the judgment [arbitrium] of God. … §.13… 3. The will of God is also most free, inasmuch as it is determined by no cause outside God, and this on account of the independence of the divine essence. Nor does it stand in the way that we have a little before distinguished a certain necessary will from the free: since there we regard only the necessary existence of God, and that it effects that the will of God, inasmuch as it regards Himself, cannot be removed from the concept of the Deity. Otherwise, that very will of God by which He loves Himself is supremely free with the freedom of complacency and spontaneous approbation. Meanwhile it is inquired concerning the will of God tending toward creatures (which we have called free, because in them alone a possible existence can be conceived) whether God has willed and wills them with a freedom of indifference. We, if anyone by the indifference of God understands that the will of God in decreeing was not determined by the objects regarded in the decree, acknowledge that all things which are proposed to the decree as possible must in themselves be conceived as indifferent toward futurition, involving no necessity in their concept that they should be made, or compelling God to determine anything. If also by the indifference of the freedom of God anyone understands the sufficiency of God, whereby, being in need of nothing outside Himself, He did not need to seek the supply of any deficiency outside Himself, and therefore to deliberate concerning the production of creatures—in this respect also we acknowledge that God acted with a freedom of indifference. Which, however, is not to be extended so far as though, the will to manifest His glory being posited, His freedom was not determined by His own decency [decentia], which did not admit that He should will otherwise than what is consonant with His glory and virtues. But whether God was so indifferent to creation itself and the manifestation of His glory, considered antecedently to the decree, that He could decently also not create, or not will to manifest His glory, is a problem which is debated among learned men, worthy of further investigation. You may see here the celebrated Wittichius of blessed memory and the celebrated Roëllius disagreeing. 4. We also urge that the will or volition of the eternal God is eternal, because God is a pure act, by no means passing from not willing to willing—which itself also extends to the will of the decree: for unless it were eternal, a change would befall God, which is absurd; or at least a succession of thoughts and anterior and posterior acts, thoughts mutually following one another—which imperfections we have shown, under the heading on the eternity of God, must be removed from God. But if anyone objects that this opinion strips God of all indifference in willing, since the state of indifference must necessarily be conceived before the determination of things made by the decree: I reply: (a.) That indifference is still in question. (b.) Nor does the consequence proceed, since a priority of order suffices for the matter, and a priority of time is not precisely required. Indeed, the freedom of indifference suffices for us, insofar as it excludes determination by objects, or by a necessity of nature, or even by a demand of indigence—since the determination made must be conceived from the eternal good pleasure of God, willing to manifest His glory, and that in the most wise and prudent manner: without which decree we do not conceive that God existed even for a moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed… (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</cite></span></figcaption>

+since+there+we+regard+only+the+necessary+existence+of+God%2C+and+that+it+effects+that+the+will+of+God%2C+inasmuch+as+it+regards+Himself%2C+cannot+be+removed+from+the+concept+of+the+Deity.+Otherwise%2C+that+very+will+of+God+by+which+He+loves+Himself+is+supremely+free+with+the+freedom+of+complacency+and+spontaneous+approbation.+Meanwhile+it+is+inquired+concerning+the+will+of+God+tending+toward+creatures+%28which+we+have+called+free%2C+because+in+them+alone+a+possible+existence+can+be+conceived%29+whether+God+has+willed+and+wills+them+with+a+freedom+of+indifference.+We%2C+if+anyone+by+the+indifference+of+God+understands+that+the+will+of+God+in+decreeing+was+not+determined+by+the+objects+regarded+in+the+decree%2C+acknowledge+that+all+things+which+are+proposed+to+the+decree+as+possible+must+in+themselves+be+conceived+as+indifferent+toward+futurition%2C+involving+no+necessity+in+their+concept+that+they+should+be+made%2C+or+compelling+God+to+determine+anything.+If+also+by+the+indifference+of+the+freedom+of+God+anyone+understands+the+sufficiency+of+God%2C+whereby%2C+being+in+need+of+nothing+outside+Himself%2C+He+did+not+need+to+seek+the+supply+of+any+deficiency+outside+Himself%2C+and+therefore+to+deliberate+concerning+the+production+of+creatures%E2%80%94in+this+respect+also+we+acknowledge+that+God+acted+with+a+freedom+of+indifference.+Which%2C+however%2C+is+not+to+be+extended+so+far+as+though%2C+the+will+to+manifest+His+glory+being+posited%2C+His+freedom+was+not+determined+by+His+own+decency+%5Bdecentia%5D%2C+which+did+not+admit+that+He+should+will+otherwise+than+what+is+consonant+with+His+glory+and+virtues.+But+whether+God+was+so+indifferent+to+creation+itself+and+the+manifestation+of+His+glory%2C+considered+antecedently+to+the+decree%2C+that+He+could+decently+also+not+create%2C+or+not+will+to+manifest+His+glory%2C+is+a+problem+which+is+debated+among+learned+men%2C+worthy+of+further+investigation.+You+may+see+here+the+celebrated+Wittichius+of+blessed+memory+and+the+celebrated+Ro%C3%ABllius+disagreeing.+4.+We+also+urge+that+the+will+or+volition+of+the+eternal+God+is+eternal%2C+because+God+is+a+pure+act%2C+by+no+means+passing+from+not+willing+to+willing%E2%80%94which+itself+also+extends+to+the+will+of+the+decree%3A+for+unless+it+were+eternal%2C+a+change+would+befall+God%2C+which+is+absurd%3B+or+at+least+a+succession+of+thoughts+and+anterior+and+posterior+acts%2C+thoughts+mutually+following+one+another%E2%80%94which+imperfections+we+have+shown%2C+under+the+heading+on+the+eternity+of+God%2C+must+be+removed+from+God.+But+if+anyone+objects+that+this+opinion+strips+God+of+all+indifference+in+willing%2C+since+the+state+of+indifference+must+necessarily+be+conceived+before+the+determination+of+things+made+by+the+decree%3A+I+reply%3A+%28a.%29+That+indifference+is+still+in+question.+%28b.%29+Nor+does+the+consequence+proceed%2C+since+a+priority+of+order+suffices+for+the+matter%2C+and+a+priority+of+time+is+not+precisely+required.+Indeed%2C+the+freedom+of+indifference+suffices+for+us%2C+insofar+as+it+excludes+determination+by+objects%2C+or+by+a+necessity+of+nature%2C+or+even+by+a+demand+of+indigence%E2%80%94since+the+determination+made+must+be+conceived+from+the+eternal+good+pleasure+of+God%2C+willing+to+manifest+His+glory%2C+and+that+in+the+most+wise+and+prudent+manner%3A+without+which+decree+we+do+not+conceive+that+God+existed+even+for+a+moment.%E2%80%9D%0A%0A%E2%80%94+Salomon+Van+Til%2C+Compendium+of+Both+Theologies%2C+even+Natural+%26+Revealed%E2%80%A6+%281703%3B+1719%29%2C+1.+Nature+of+God%2C+subsection+4%2C+%E2%80%98On+the+Will+of+God%E2%80%99+tr.+AI+by+Roman+Prestarri+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9cf5183ee9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9cf5183ee9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/god#:~:text=3.%20That%20this%20will%20or%20volition,God%20existed%20even%20for%20a%20moment&amp;text=3.%20That%20this%2 <blockquote><p>…in the fashioning of the universe as in the general teaching of Scripture the Lord shows himself to be simply the creator. Then in the face of Christ he shows himself the Redeemer.</p></blockquote>

<blockquote><p>22. And so we must conceive of God by all these following inadequate conceptions, confessing the impropriety, but having no better: I. The essence of God, who in Scripture is called in two words “An Infinite Spirit,” is necessarily conceived of by these three conceptions: 1. [Greek], 2. Vita [life], 3. Perfectio [perfection]. The two first being the substantial conceptus of a spirit, and the third that which answers to all perfective degrees, properties, and accidents in creatures, and comprehends a multitude of perfective attributes; which I express in the abstract, being loath much to use concretes or adjectives of God. Of these, as the first answers to matter in materials and to the genus and substantia abstracte sumpta in spirits, so the second to the form and difference, when yet in God there is no composition or matter. 22. II. And the formal conceptus ‘Vita’ must itself be conceived of in this threefold inadequate conception: 1. Potentia-Actus [power-act], 2. Intellectus [understanding], 3. Voluntas [will]. I call the first Potentia-Actus to avoid concretes, and to signify that as God has no potentia passiva [passive power], so his potentia activa [active power] is not an idle, ceasing power, but in perpetual perfect act; and that act is a most powerful act: so that neither potentia alone, nor actus alone, but both together, are our best conception of this first principle in the Deity. And I take it for granted that even in man’s soul, the potentia vitalis activa [vital active power], the intellect, and the will, are not, as Thomas thought, accidents, but the formal essence of the soul, as the Scotists and Nominalists better say. And I have largely elsewhere proved this, and therefore stand not here upon it. … 25. IV. The essential immanent acts of God are three: 1. Sibi vivere [to live to Himself], or to be essential active life in Himself; 2. Se intelligere [to understand Himself], to know Himself; 3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

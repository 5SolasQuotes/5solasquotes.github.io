<main class="wrap"><figure class="quote" id="q-9a2c8ad2b1" data-kw="">
<blockquote><p>[S]ome are strongly tempted to the sin of uncleanness. But being blind regarding their desires, they think it no offence to cross boundaries regarding lustful eyes, loose speech, or secret desires. They know they are snared in this sin. But through long-standing habits they nourish their hearts in these loathsome delights; and when they become aware of their offences, they do not dislike them enough. Thus, they have brought themselves in bondage to their lusts.

Their hearts should therefore be much engaged in fighting against this sin and in observing and weighing its depravity, shame, and danger. They must heartily acknowledge the sin to God and daily offer earnest prayers to God against it, with confidence in both pardon and power to mortify and weaken it. They must use strong reasons to disgrace and renounce the sin. And they must wisely and watchfully avoid the occasions of nourishing the sin. If they do not do this, then this one sin (even if they do not offend grossly) will hold their conscience in great distress, cause them to wander in deep sorrow, and make them unfit for Christian duties.

Indeed, if they do not bestow more labour here than in other parts of their lives, it will slow down their progress and cause disorder and confusion to grow. The longer they have nourished such vain dreams, the more difficult will it be to awake out of them, even if they gladly would.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holy Helps for a Godly Life</cite>, ed. Brian G. Hedges (1603; Grand Rapids, MI: Reformation Heritage Books, 2018), pp 52-53.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b07f9bac9e" data-kw="">
<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Instruction into Christian Religion</cite>, (London: 1548), A Short Instruction Concerning the Ten Commandments, First Sermon, no page numbers</span></figcaption>

</figure><figure class="quote" id="q-d9eb87081e" data-kw="">
<blockquote><p>For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it. Hezekiah is praised for destroying the bronze serpent to which divine worship was being offered (2 Kings 10 [18:4]), and so I think they should be praised also who do away with the image of the crucifix as well, for the purpose of guarding against the same idolatry, and eliminate them from all temples and sacred places.</p></blockquote>

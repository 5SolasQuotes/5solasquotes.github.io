<main class="wrap"><figure class="quote" id="q-b585e7fdca" data-kw="">
<blockquote><p>But this must not be omitted that princes in the holy scriptures are not only called Deacons, or Ministers of God, but also Pastors: Of whom Ezechiel complaineth for many causes, for that they cruelly and perversely fed the people of God. Homer also calleth his Agamemnon the pastor of the people.

For they ought not to bear rule as thieves or hirelings, to fleece and to oppress, but to keep, nourish, and feed like Pastors. They are also called Fathers, wherefore the Senators among the Romans were called Patres conscripti, that is, appointed Fathers. Neither was there a greater or more ancient honour in the Commonweal, than to be called, The father of the Country.

Yea also a Magistrate by the law of God is comprehended under this commandment, Honour thy father and thy mother. Princes then owe unto their subjects a father love, and they ought always to remember that they are not rulers over beasts, but over men, and that themselves also are men: who yet should be far better and more excellent, than those whom they govern, otherwise they are not fit to govern them. For we make not a sheep the chief ruler over sheep, but the Bellwether, and then the Shepherd. And even as a shepherd excelleth the sheep, so ought they to whom the office of a Magistrate is committed, to excel the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes:</cite>, The Common Places, trans. Anthony Marten (2nd edn, London, 1583), 4.13.3, p. 227.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e12333728f" data-kw="">
<blockquote><p>…Whether pastors are to be believed or obeyed any farther than they show a Word of God revealing or commanding the particular thing? Divine faith and obedience is one thing, and human is another: 1. If as a preacher he say, ‘This is God’s Word, believe it and obey it as such,’ you must believe with a human faith that it is likelier that he knows what he says than you do (unless 1. you see evidence, 2. or the consent of more credible persons to be against him, and then you are not to believe him at all). Even as a child believes his teacher in order to learn the things himself, so you are so far to take his word while you are learning to know whether it be so or not. But not to rest in it as certain, nor to take your belief of him and obedience to him, to be a believing and obeying God formally, though a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, p. 889</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-7f4a9b7ead" data-kw="Succession">
<blockquote><p>Thirdly, I say that this appertains as much to all bishops and ministers as to the pope of Rome himself; because they all succeed Peter in this matter, that is, in the preaching of the word, and should imitate his diligence in feeding the sheep of Christ.</p></blockquote>

</figure><figure class="quote" id="q-b5bdf9af74" data-kw="">
<blockquote><p>The Church of Rome did not meet in one place for celebrating the worship of God, there were more holy assemblies there in diverse places; there was a Church in the house of Aquila and Priscilla, Rom. 16:5. Paul when he was at Rome had holy Church assemblies in his own house, Acts 28:23, 30, 31, which yet was not that whole (collectively taken) and famous Church of the believing Romans, whose faith was famous through the whole world, Rom. 1:8. Other examples we meet with in the Scripture of Churches duly constituted according to God’s appointment, which met not in one place for exercising the worship of God, but did in diverse places under a common presbytery of diverse pastors perform holy duties. Hence also in our Belgic Churches in some greater towns, though there be more believers than can celebrate the holy worship of God and exercise other ordinances of Christ together in one place; yet they are not divided into several Churches, but do together make one visible Church, under the common presbytery and government of diverse pastors.</p></blockquote>

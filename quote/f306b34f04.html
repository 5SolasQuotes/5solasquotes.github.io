<main class="wrap"><figure class="quote" id="q-f306b34f04" data-kw="">
<blockquote><p>Those very feasts [in the Early Church] made a composition or mixture of human institutions with divine, and therfore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day.</p></blockquote>

</figure><figure class="quote" id="q-9b54f2e462" data-kw="">
<blockquote><p>In every comparison there must be some dissimilitude. …‘Proportions are alike, but not the same.’ Christ’s body is not divided in parts as the bread; therefore there is no analogy betwixt Christ crucified and the bread? It follows not, for similitudes disagree in some things. Similitudes are not to be taken from things altogether different: as an ancient writer makes a comparison betwixt the ten plagues of Egypt and the Ten Commandments: so those who make the comparison betwixt the 70 disciples and the 70 palm trees; the 12 fountains and the 12 apostles: here the comparison is far sought. The comparison must agree in the main point, else it is not a comparison;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Synagogue</cite>, … (London, 1623), 3rd bk., ch. 2, ‘Of the Illustration of Doctrine by Comparisons’, p. 281</span></figcaption>

</figure><figure class="quote" id="q-d051acd45b" data-kw="">
<blockquote><p>As for your [Gilbert Burnet’s] demand, why in your worship [that of the Scottish non-cponformists] do you not kiss one another with a holy kiss? Seing it is nowhere commanded in worship, as you seem boldly and ignorantly to suppose, and the Christian manner of the thing, in customary civility, is only recommended by the apostle, as an allay of chastity and kindnesse in civil rencounters, the question is but a petulant extravagancy of your vain imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117</span></figcaption>

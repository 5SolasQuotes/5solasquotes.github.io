<main class="wrap"><figure class="quote" id="q-d59228e329" data-kw="">
<blockquote><p>…in hearing the Gospel? for therein we receive spiritually the body and blood of Christ, and that as truly and really as in the sacrament. Whereupon the Archbishop of Armagh [James Ussher] shows that the spiritual and inward feeding upon the body and blood of Christ is to be found out of the Sacrament, and that diverse of the Fathers do apply the sixth [chapter] of John to the hearing of the Word also, as Clemens Alexandrinus, Origen, Eusebius Caesariensis and others. Basilius Magnus likewise teaches plainly that we eat the flesh of Christ in his Word and Doctrine. This I am sure no man dare deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (Edinburgh, 1637), 3rd Part, ch. 4, pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-f4f0adf507" data-kw="">
<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, section 3, p. 443</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-8bc547c3df" data-kw="">
<blockquote><p>The Church-Government of which I here speak [and argue for], is a Church-government in its morals: To exclude those things that are merely physical and human in this government, as a pulpit of this or that matter, stone or timber, or of this timber, or of any other kind; a communion-table of this, or that form; a cup of wood, or of metal, as silver, tin, etc…. but what sort of river the water of baptism be, is merely physical, not moral.</p></blockquote>

</figure><figure class="quote" id="q-2e438c255c" data-kw="">
<blockquote><p>For even if the Word in his immeasurable essence united with the nature of man into one person, we do not imagine that he was confined therein. Here is something marvelous: the Son of God descended from heaven in such a way that, without leaving heaven, He willed to be borne in the virgin’s womb, to go about the earth, and to hang upon the cross; yet He continuously filled the world even as He had done from the beginning!</p></blockquote>

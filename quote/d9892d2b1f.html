<main class="wrap"><figure class="quote" id="q-d9892d2b1f" data-kw="">
<blockquote><p>A kind of seeming seriousness in the performance of duties, and in seeking of God, deceiveth many. They think because they are not conscious to their own dissembling, but they look upon themselves as earnest in what they do, that therefore all is well. Sayeth not Christ, that not every one that sayeth Lord, Lord, shall enter into the kingdom of God. Mat. 7: 21? that is, not every one that reneweth their suits, &amp; ingeminateth their desires, cry and cry over again, and as it were, will not give it over.

And yet they come short of their expectation: did not the foolish virgins seem earnest and serious, when they continued waiting with the rest, and at length, cried Lord, Lord open unto us; and yet they were kept at the door. Many consider not that there is a secret and close hypocrisy, that some may be under and not know it, as well as a gross hypocrisy, and dissimulation, which may be easily observed: Will not many seek to enter in, that shall not be able? Mat. 7: 13. Luk. 13. 24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the way, and the truth, and the life. Or, A short discourse pointing forth the way of making use of Christ for justification and especially and more particularly for sanctification in all its parts, from Johan. XIV: vers. VI. Wherein several cases of conscience are briefly answered, chiefly </cite>, (Rotterdam: John Cairns, 1677), pp 26-27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-4c9407c4aa" data-kw="">
<blockquote><p>Now it is certain that in the Law there is prescribed to men a rule by which they ought to regulate their life, so as to obtain salvation in the sight of God. That the Law can do nothing else than condemn, and is therefore called the doctrine of death, and is said by Paul to increase transgressions, (Rom. 7:13,) arises not from any fault of its doctrine, but because it is impossible for us to perform what it enjoins. Therefore, though no man is justified by the Law, yet the Law itself contains the highest righteousness, because it does not falsely hold out salvation to its followers, if any one fully observed all that it commands. Nor ought we to look upon this as a strange manner of teaching, that God first demands the righteousness of works, and next offers a gratuitous righteousness without works; for it is necessary that men should be convinced of their righteous condemnation, that they may betake themselves to the mercy of God. Accordingly, Paul (Rom. 10:5, 6) compares both kinds of righteousness, in order to inform us that the reason why we are freely justified by God is, that we have no righteousness of our own. Now Christ in this reply accommodated himself to the lawyer, and attended to the nature of his question; for he had inquired not how salvation must be sought, but by what works it must be obtained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, trans. William Pringle, (repr. Bellingham, WA: Logos Bible Software, 2010), 3.56–57.</span></figcaption>

<blockquote><p>Let’s examine whether we are a people in Covenant with God. I know special care has been taken that these Nations should not be God’s people in Covenant; Men are afraid of an Association, but it will do them no harm if God be not the bond of it, and his honour, and interest the great end of it: But this we may assure our selves, that if we send away our God we may as wisely disband our Forces, and lay up our Ships; we must be God’s vineyard if we expect his special protection. Isa. 27. 2, 3. In that day sing ye unto her, A vineyard of red wine: I the Lord do keep it; I will water it every moment; left any hurt it, I will keep it night and day: That is, I will neither slumber nor sleep.</p></blockquote>

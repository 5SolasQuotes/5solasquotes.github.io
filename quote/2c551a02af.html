<main class="wrap"><figure class="quote" id="q-2c551a02af" data-kw="">
<blockquote><p>‘What thy hand findeth to do, do it with all thy might.’ — in whatever sphere Providence may have appointed your lot; but in so doing, never for a moment lose sight of the grand ulterior object for which the Church was originally constituted, and spiritual rights and privileges conferred, viz. the conversion of the world. By the encouragements of Scripture prophecies, — by the specific appropriation and use of Scripture petitions, — by the binding obligation of Divine commands, — you are bound to pray and to labour for the conversion of a lost world.

The amount and direction of your actual exertions in the great cause, must of necessity vary with varying abilities, and means and opportunities of usefulness, and a thousand providential contingencies; but your eye must ever be fixed on the accomplishment of the great design, as the proper terminating object. In immediate and simultaneous action you may not, you cannot, be a cosmopolite; but in spirit, and prayer, and longing, and positive appetency, a cosmopolite you may, and ought to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-duff.html">Alexander Duff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Missions. The Chief End of the Christian Church</cite>, (New edn, Edinburgh: Andrew Elliot, 1877), p. 17n.</span></figcaption>

<blockquote><p>For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), pt. 4, ch. 10, p. 481</span></figcaption>

</figure><figure class="quote" id="q-cd38ed66ee" data-kw="">
<blockquote><p>Now let us see how both these kinds of sorrow belong unto sound repentance. That first sorrow, which is of the law, and is conceived by reason of the punishment which follows sin, I confess it is no part of this holy change and conversion unto God, for of its own nature it does rather estrange us from God, than convert us to God; and, in very deed, it does altogether alienate the wicked from God as from a terrible judge. Notwithstanding, in repentance it has his use, for it prepares the elect by giving them sense of their misery, to that grace and mercy which is propounded in the Gospel. The latter sorrow, which is according to God, and is effected by the Gospel, is properly a part of repentance, and does effect that change of the mind and reason before specified. And, therefore, the apostle says, 2 Cor. 7:10, that the sorrow which is according to God causes repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 34, ‘Of Repentance’, p. 242</span></figcaption>

nline</a></div>
</figure><figure class="quote" id="q-19f84a4aaa" data-kw="">
<blockquote><p>That repentance and faith are both essential to the attainment of eternal life. Though this has speculatively, it has not practically, been assented to by many professing Christians. Some have attached a high importance to repentance, but have at the same time almost entirely overlooked the necessity of faith. They think that if a man refrain from vicious habits, and be humane, charitable, just, and sober, he has attained the great end of all religion — he is a good man, and therefore must be held to be a good Christian; and they not unfrequently look upon and speak of those who attach a special importance to faith in Christ, as enthusiasts and visionaries, and sometimes go the length of representing them as favouring the doctrine that man may sin that grace may abound.

Others, again, have attached a high importance to faith in Christ; but at the same time have forgotten the equally high importance which belongs to repentance. They think that if a man believe the gospel, and entertain a zealous attachment to a sound creed, he must be a true Christian; and they not unfrequently look on those who insist on the necessity of repentance and good works as persons destitute of evangelical views, ignorant of the truth, attached to legal doctrine, and going about to establish their own righteousness.

Both these classes of persons proceed on erroneous principles — on partial views of the subject. The Holy Scriptures, from which alone we derive our knowledge of it, do not authorize them to give any such preference to the one grace or to the other, and far less to indulge in mutual, uncandid animadversions. A very slight acquaintance with the Scriptures may make any candid man perceive that both are equally essential, though not in the same sense.

A man without repentance, which is the principle or seed of holiness, is dead in trespasses and sins, and therefore incapable of enjoying heaven. And a man without faith, which is the uniting bond with the Saviour, is under condemnation, and has no title to the enjoyment of heaven. A well-informed Christian knows that that is truth. An experienced Christian feels that it is truth. He is not more assured that without holiness no man shall see the Lord, than that to be saved he must believe in the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-aird-thomson.html">William Aird Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Testifying Repentance Toward God, and Faith Toward our Lord Jesus Christ, to the Faithful Preaching of the Gospel in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) L

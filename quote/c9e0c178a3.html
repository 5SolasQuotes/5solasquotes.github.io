<main class="wrap"><figure class="quote" id="q-c9e0c178a3" data-kw="">
<blockquote><p>In election, believers were from all eternity given to Jesus Christ. As believers were chosen from all eternity, so Christ was from eternity chosen and appointed to be their redeemer, and he undertook the work of redeeming them. But there was a covenant about it between the Father and Son. Christ, as we have already observed, loved them. This is the account he gives of himself, how it was with him before the world, and one thing is that then he rejoiced in the habitable parts of God’s earth and his delights were with the sons of men [Proverbs 8:31].

And when he undertook for them, he knew what success he should have. God promised him a certain number, and he had their names, as it were, written in a book; and therefore the book of life is called the Lamb’s book; Revelation 21:27, “but they that are written in the Lamb’s book of life.” And he bears their names upon his heart, as the high priest of old did the names of the tribes of the children of Israel on his breastplate [Exodus 28:29].

Christ often calls the elect those that God had given him; John 17:2, “As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him”; and again, in John 17:9, “I pray not for the world, but for them which thou hast given me”; John 17:11, “Keep through thy name those whom thou hast given me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christians a Chosen Generation</cite>, (1731) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 282.</span></figcaption>

<blockquote><p>By the decree of God, for the manifestation of his glory, some men and angels are predestined unto everlasting life and others foreordained to everlasting death. These angels and men, thus predestinated and foreordained, are particularly and unchangeably designed; and their number is so certain and definite that it cannot be either increased or diminished.</p></blockquote>

</figure><figure class="quote" id="q-2e1639a41a" data-kw="">
<blockquote><p>Closely connected with this excellence of the Confession of Faith is its astonishing precision of thought and language. The whole mental training of the eminent divines of that period led to this result. They were accustomed to cast every argument into the syllogistic form, and to adjust all its terms with the utmost care and accuracy. Every one who has studied the propositions of the Confession must have remarked their extreme precision; but, without peculiar attention, he may not perceive the astonishing care which these divines must have bestowed on this part of their great work. This may be best shown by an instance. Let us select one from chapter iii., “On God’s Eternal Decree,” sections 3 and 4: “By the decree of God, for the manifestation of his glory, some men and angels are predestinated unto everlasting life, and others foreordained to everlasting death. These angels and men thus predestinated and foreordained,” &amp;c.

The expressions to which we wish to draw the reader’s attention are the words predestinated and foreordained, A hasty or superficial reader might perceive no difference between these words. But, if so, why are they both used? for there is no instance or mere tautological repetition in the concise language of the Confession. But, further, let it be well remarked that the word “predestinated” is used only in connection with “everlasting life,” and the word “foreordained” with ” everlasting death.” And when the compound form of the proposition is assumed, both terms are used to represent each its respective member in the general affirmation. Why is this the case? Because the Westminster Divines did not understand the meaning of the terms predestination and foreordination to be identical, and therefore never used these words as synonymous.

By predestination they meant a positive decree determining to confer everlasting life; and this they regarded as the basis of the whole doctrines of free grace, arising from nothing in man, but having for its divine origin the character and sovereignty of God. By foreordination, on the other hand, they meant a decree of order, or arrangement, determining that the guilty should he condemned to everlasting death; and this they regarded as the basis of judicial procedure, according to which God “ordains men to dishonour and wrath for their sin,” and having respect to man’s own character and conduct.

Let it be further remarked, that while, according to this view, the term predestination could never with propriety be applied to the lost, the term foreordination might be applied to the saved, since they also are the subjects, in one sense, of judicial procedure. Accordingly there is no instance in the Confession of Faith where the term predestination is applied to the lost, though there are several instances where the term foreordination, or a kindred term, is applied to the saved. And let this also be marked, that the term reprobation, which is so liable to be misunderstood and applied in an offensive sense to the doctrine of predestination, is not even once used in the Confession of Faith and the Larger and Shorter Catechisms.

Later writers on that doctrine have indeed employed that word, as older writers had done, and had thereby furnished occasion to the opponents of the doctrine to misrepresent it; but the Westminster Divines cautiously avoided the use of an offensive term, carefully selected such words as were best fitted to convey their meaning, and in every instance used them with the most strict and definite precision. Many other examples might be given of the remarkable accuracy of thought and language which forms a distinguished characteristic of the Confession of Faith; but we must content ourselves with suggesting the line of investigation, leaving it to every reader to prosecute it for himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay in Robert Shaw, An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite></span></figcaption>

<blockquote><p>[W]hen we hear of the promises of God made unto us in Christ, we must not content ourselves with a bare knowledge of them, but labour to believe them, and apply them to ourselves, to our souls and consciences; and so by faith make them our own. As it is said of Abraham, and in him of all the faithful, “The blessing of Abraham came on the Gentiles, through Jesus Christ, that we might receive the promise of the Spirit through faith” (Gal. 3:14).

Further observe, the Holy Ghost sets down that particular promise which God made to Abraham in his son Isaac, to whom it was said that in Isaac should his seed be called (Gen. 21:12, Rom. 9:7). In which places it is said, that in Isaac should his seed be called. The meaning whereof is plain and thus much in effect: Ishmael shall not be thy son and heir, but Isaac is the child which shall be your heir – he it is in whom I will accomplish the promises of life and salvation made to you.

From the words thus explained, first, we must observe Paul’s collection gathered from God’s dealing with those two persons (Rom. 9:7) – namely, that God before all worlds hath chosen some men to salvation in His eternal counsel, to manifest the glory of His grace and has refused and rejected others, leaving them unto themselves, to shew forth His justice upon them.

This doctrine is gathered out of this place, after this manner. Such as is God’s practice and dealing toward men in time. Such was His eternal counsel and decree (for as God before all time determined to deal with men, so in time He dealeth with them). Now God’s practice and dealing with Isaac and Ishmael is this: Ishmael is vouchsafed to be made partaker of temporal blessings; but yet he is cut off from the spiritual covenant of grace. And Isaac is the man that must receive the covenant, and by virtue thereof be made partaker of life everlasting. And so accordingly it is with others. God has decreed to choose some men to salvation, and these are admitted into the covenant. Others He has decreed to reject, and they are cut off from the covenant and from life everlasting.

These two persons, Isaac and Ishmael, are types of these two sorts of people whom God doth elect and reject. Isaac represents those that are chosen to salvation, who become the true members of God’s church; and Ishmael is a type of those who are rejected. Now in regard of this different dealing of God with mankind, choosing some and refusing others, we must all put in practice Saint Peter’s lesson with fear and trembling being very careful, and “giving all diligence to make our election sure” (2 Peter 1:10), for all be not elected to salvation, but some are rejected. All be not Isaacs, but some are Ishmaelites. If all were elected and chosen to salvation, then no man need to care for it; but seeing some are rejected, and never vouchsafed to come within the covenant indeed, therefore it standeth us greatly in hand to take the good counsel of the apostle and to give all diligence to make our election sure.

Secondly, whereas it is said, “Not in Ishmael, but in Isaac shall thy seed be called,” we may we may note the state of God’s church in this world in regard of the different sorts of men that live therein. For Abraham’s family was God’s church in those days, and therein were both Isaac and Ishmael – though both his children, yet far differing in estate before God. Ishmael indeed was born in the church, and there brought up, taught and circumcised; but yet he was without the Covenant in God’s sight.

Now Isaac was not only born and brought up in the church, and circumcised, but also received into the covenant, and herein differed far from Ishmael; for he is the son of Abraham in whom God will continue the covenant of grace unto life everlasting, to his posterity. And so it is with God’s church at this day. In it there be two sorts of men; one, which are baptised and brought up in the church, hear the Word and receive the sacraments, but yet are not saved because they have not the promise of the covenant effectually rooted in their hearts. The other sort are they which, being baptised in the church, hear the Word effectually and receive the Lord’s Supper worthily to their salvation, because God does establish His covenant in their hearts.

This difference is plain in Scripture, in the parables of the dragnet (Matthew 13), of the sower, and of the tares, as also by Christ’s behaviour at the last judgment (25:32), severing the sheep from the goats, both which live together in the church. And by Saint Paul, who speaking of those which are born and brought up in the church, saith that some are children of the flesh, and some children of the promise (Rom. 9:8).

This being so, that every one which lives in the church is not of the church – that is, is not a true member of the church and a true child of Abraham; it must make us all careful to use all holy means whereby we may be fully assured that the covenant of grace belongs unto us. For it is not enough for us to dwell in the church, to hear the Word, and to receive the sacraments (for so did Ishmael, and yet never was saved), unless therewithal we have the covenant of grace belonging to us, and the assurance thereof sealed in our consciences by God’s Holy Spirit.

Again, consider who spake these words: But in Isaac shall thy seed be called. We shall find (Gen. 21:12) that it was God Himself. “Let it not,” says God unto Abraham, “be grievous in thy sight for the child, and for the bondwoman; in all that Sarah shall say unto thee, hear her voice” – which was to “cast out the bondwoman and her son Ishmael. For (saith God) in Isaac shall thy seed be called.”

Here observe a notable practice of Abraham, as a good direction how we ought to judge of all those that live in the church, submitting themselves outwardly to the ministry and regimen thereof. Abraham here hath two sons, Isaac and Ishmael; he circumciseth them both, and instructs them both (for he “taught all his household” to know God, and to fear and obey Him [18:19]), he judgeth them both to be in one state in regards of God’s Covenant; though they were not; but that difference is made by God.

Abraham does not on his own head, and by his own will, put Ishmael out of the church, which was his family. But God bids him put him out, and then he put him out, and not before till such time he kept him in, and held him to be within the covenant, as well as Isaac was. Even so must we deal towards those that live in the church; secret judgment must be left to God; and, till God manifest the contrary, in the judgment of charity, we must hold them all elect.

This is the practice of Saint Paul in all his epistles. Writing to Corinth, he calls them “all sanctified” (1 Cor. 1:2); and to the Galatians (1:2), he calls them “all elect” – speaking so in the judgment of charity, although he knew that among them there were many profane and wicked men, and though he reprove many great errors and heinous sins amongst them.</p></blockquote>

far+differing+in+estate+before+God.+Ishmael+indeed+was+born+in+the+church%2C+and+there+brought+up%2C+taught+and+circumcised%3B+but+yet+he+was+without+the+Covenant+in+God%E2%80%99s+sight.%0A%0ANow+Isaac+was+not+only+born+and+brought+up+in+the+church%2C+and+circumcised%2C+but+also+received+into+the+covenant%2C+and+herein+differed+far+from+Ishmael%3B+for+he+is+the+son+of+Abraham+in+whom+God+will+continue+the+covenant+of+grace+unto+life+everlasting%2C+to+his+posterity.+And+so+it+is+with+God%E2%80%99s+church+at+this+day.+In+it+there+be+two+sorts+of+men%3B+one%2C+which+are+baptised+and+brought+up+in+the+church%2C+hear+the+Word+and+receive+the+sacraments%2C+but+yet+are+not+saved+because+they+have+not+the+promise+of+the+covenant+effectually+rooted+in+their+hearts.+The+other+sort+are+they+which%2C+being+baptised+in+the+church%2C+hear+the+Word+effectually+and+receive+the+Lord%E2%80%99s+Supper+worthily+to+their+salvation%2C+because+God+does+establish+His+covenant+in+their+hearts.%0A%0AThis+difference+is+plain+in+Scripture%2C+in+the+parables+of+the+dragnet+%28Matthew+13%29%2C+of+the+sower%2C+and+of+the+tares%2C+as+also+by+Christ%E2%80%99s+behaviour+at+the+last+judgment+%2825%3A32%29%2C+severing+the+sheep+from+the+goats%2C+both+which+live+together+in+the+church.+And+by+Saint+Paul%2C+who+speaking+of+those+which+are+born+and+brought+up+in+the+church%2C+saith+that+some+are+children+of+the+flesh%2C+and+some+children+of+the+promise+%28Rom.+9%3A8%29.%0A%0AThis+being+so%2C+that+every+one+which+lives+in+the+church+is+not+of+the+church+%E2%80%93+that+is%2C+is+not+a+true+member+of+the+church+and+a+true+child+of+Abraham%3B+it+must+make+us+all+careful+to+use+all+holy+means+whereby+we+may+be+fully+assured+that+the+covenant+of+grace+belongs+unto+us.+For+it+is+not+enough+for+us+to+dwell+in+the+church%2C+to+hear+the+Word%2C+and+to+receive+the+sacraments+%28for+so+did+Ishmael%2C+and+yet+never+was+saved%29%2C+unless+therewithal+we+have+the+covenant+of+grace+belonging+to+us%2C+and+the+assurance+thereof+sealed+in+our+consciences+by+God%E2%80%99s+Holy+Spirit.%0A%0AAgain%2C+consider+who+spake+these+words%3A+But+in+Isaac+shall+thy+seed+be+called.+We+shall+find+%28Gen.+21%3A12%29+that+it+was+God+Himself.+%E2%80%9CLet+it+not%2C%E2%80%9D+says+God+unto+Abraham%2C+%E2%80%9Cbe+grievous+in+thy+sight+for+the+child%2C+and+for+the+bondwoman%3B+in+all+that+Sarah+shall+say+unto+thee%2C+hear+her+voice%E2%80%9D+%E2%80%93+which+was+to+%E2%80%9Ccast+out+the+bondwoman+and+her+son+Ishmael.+For+%28saith+God%29+in+Isaac+shall+thy+seed+be+called.%E2%80%9D%0A%0AHere+observe+a+notable+practice+of+Abraham%2C+as+a+good+direction+how+we+ought+to+judge+of+all+those+that+live+in+the+church%2C+submitting+themselves+outwardly+to+the+ministry+and+regimen+thereof.+Abraham+here+hath+two+sons%2C+Isaac+and+Ishmael%3B+he+circumciseth+them+both%2C+and+instructs+them+both+%28for+he+%E2%80%9Ctaught+all+his+household%E2%80%9D+to+know+God%2C+and+to+fear+and+obey+Him+%5B18%3A19%5D%29%2C+he+judgeth+them+both+to+be+in+one+state+in+regards+of+God%E2%80%99s+Covenant%3B+though+they+were+not%3B+but+that+difference+is+made+by+God.%0A%0AAbraham+does+not+on+his+own+head%2C+and+by+his+own+will%2C+put+Ishmael+out+of+the+church%2C+which+was+his+family.+But+God+bids+him+put+him+out%2C+and+then+he+put+him+out%2C+and+not+before+till+such+time+he+kept+him+in%2C+and+held+him+to+be+within+the+covenant%2C+as+well+as+Isaac+was.+Even+so+must+we+deal+towards+those+that+live+in+the+church%3B+secret+judgment+must+be+left+to+God%3B+and%2C+till+God+manifest+the+contrary%2C+in+the+judgment+of+charity%2C+we+must+hold+them+all+elect.%0A%0AThis+is+the+practice+of+Saint+Paul+in+all+his+epistles.+Writing+to+Corinth%2C+he+calls+them+%E2%80%9Call+sanctified%E2%80%9D+%281+Cor.+1%3A2%29%3B+and+to+the+Galatians+%281%3A2%29%2C+he+calls+them+%E2%80%9Call+elect%E2%80%9D+%E2%80%93+speaking+so+in+the+judgment+of+charity%2C+although+he+knew+that+among+them+there+were+many+profane+and+wicked+men%2C+and+though+he+reprove+many+great+errors+and+heinous+sins+amongst+them.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Cloud+of+Faithful+Witnesses%2C+Leading+to+the+Heavenly+Canaan%3A+Or%2C+A+Commentary+upon+the+11th+Chapter+to+the+Hebrews%2C+%281609%29+in+The+Works+of+William+Perkins%3A+Volume+3%2C+eds+Randall+J.+Pederson+and+Ryan+M.+Hurd+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+2017%29%2C+pp+235-37.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F73eb21e456.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/73eb21e456.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/25/william-perkins-on-the-covenant-election-and-the-visible-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

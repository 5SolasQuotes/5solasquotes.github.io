<main class="wrap"><figure class="quote" id="q-a52386c558" data-kw="">
<blockquote><p>It appears that this was a politic law serving only for the circumstances of the time that Paul lived in, by this reason, because in these our day, for a man to speak bare-headed in an assembly, is a sign of subjection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Testament of our Lord Jesus Christ: translated out of Greek by Theodore Beza</cite>, translated out of Greek by Beza, with Brief Summaries &amp; Expositions upon the Hard Places... (1599), on 1 Cor. 11 | v. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c45fd1b41c" data-kw="">
<blockquote><p>He passes on now to another subject-to instruct the Corinthians what decorum ought to be observed in the sacred assemblies… … Thus Paul, the first founder of the Corinthian Church, had also framed for its regulation pious and seemly enactments — that all things might be done decently and in order, as he afterwards enjoins, (1 Cor. 14:40).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, | v. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

— John Calvin, Commentary on 1 Cor. 11, | v. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+passes+on+now+to+another+subject-to+instruct+the+Corinthians+what+decorum+ought+to+be+observed+in+the+sacred+assemblies%E2%80%A6+%E2%80%A6+Thus+Paul%2C+the+first+founder+of+the+Corinthian+Church%2C+had+also+framed+for+its+regulation+pious+and+seemly+enactments+%E2%80%94+that+all+things+might+be+done+decently+and+in+order%2C+as+he+afterwards+enjoins%2C+%281+Cor.+14%3A40%29.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+1+Cor.+11%2C+%7C+v.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc45fd1b41c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c45fd1b41c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=He%20passes%20on%20now%20to%20another,he%20afterwards%20enjoins%2C%20%281%20Cor.%2014%3A40&amp;text=He%20passes%20on%20now%20to%20another%20subject%2Dto%20instruct&amp;text=order%2C%20as%20he%20afterwards%20enjoins%2C%20%281%20Cor.%2014%3A40" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7ebfafd06a" data-kw="">
<blockquote><p>The evangelical ceremonies [in the NT] are either natural or instituted. The natural either common or proper. The common natural ceremonies of religion, are such as are equally used in civil and in religious matters, as bowing the knee, uncovering the head, and some other things which respect that civil order, reverence, and decency, which ought to be observed in the external (and especially in the public) worship of God. The proper are such as are not used but in the matters of religion. The instituted ceremonies of the Gospel strictly and properly taken in contradistinction to natural, and which are designed to be of perpetual use, are only the two Sacraments… yet in a large sense even natural ceremonies, and matters of real decency and order, that is such things as are ex natura rei, pro hic et nunc [from the nature of the thing, here and now], necessary hereunto, and acceptable in the worship of God, are instituted too, i.e. commanded either implicitly or explicitly; for nothing offered by man, especially in worship, which is not in obedience to God, by virtue of some command, is honorable or acceptable to God; but what God has commanded, He has thereby instituted. So then, the matter in hand will fall under the notion of a common, natural ceremony of religion, pertaining to the decency or reverence of God’s worship in the public assemblies of his saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative. (London: Maxwell, 1682) 56 pp. ToC, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-023d25eed8" data-kw="">
<blockquote><p>…but he [Paul] says that the church has no such custom as that any man should be contentious, but rather that all should preserve the common peace. But if any one be contentious, he is a stranger to the church of God… he says, that the churches of God have no custom of allowing any man to be contentious. Thus he represses contentious spirits by the authority of the church, and does not confirm the dogma by mere custom. Now that custom of avoiding contention in the church is abundantly sanctioned by testimonies of scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, (1588; Cambridge: Parker Society, 1849), p. 559</span></figcaption>

</figure><figure class="quote" id="q-9eb32ae152" data-kw="">
<blockquote><p>‘nature’ here some understand the law of nature, according to which it would have an intrinsic evil in it, which it is plain it has not; for then neither must the Nazarites have used it (as they did), neither would it be lawful for the sake of men’s health or life. Others understand by nature the law of nations; but neither is this true, for in many nations men wear hair at the utmost length. Others understand common sense, or the light and judgment of that natural reason which since the fall is left in man; but this must be the same in all men, and we know that all men do not judge this shameful. Others therefore by nature here understand a common custom, which (as they say) makes as it were a second nature; so the term is taken, Rom. 11:24; but it cannot so signify here; for there neither is, nor ever was, such a universal custom in any place, that none in it wore long hair. Others by nature here understand natural inclination; but neither can this be the sense, for there is in some men, as well as in women, a natural propension and inclination to wear their hair at excessive lengths. Others here by nature understand the difference of the sex, as they take this word to be used, Rom. 1:26; the distinction of the sexes teaches us this: and this seems to be the most probable sense of this text. The apostle arguing, that as the male and female sex are artificially distinguished by garments, and it was the will of God they should be so, so they should also be distinguished by the wearing of their hair; and it was no less shame for a man to wear his hair like a woman, than to wear garments like a woman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

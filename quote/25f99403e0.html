<main class="wrap"><figure class="quote" id="q-25f99403e0" data-kw="">
<blockquote><p>Now to the next verse: The words are plain. He makes this more clear, to wit, That they were examples to them of Macedonia &amp; Achaia. And he says, For from you sounded out the word of the Lord, not in Macedonia and Achaia only. Even as, at the beginning this blessed Gospel sounded out from Zion (for they that preached it came from Zion, which is Jerusalem) and spread it abroad through the whole world. So from the Thessalonians the word sounded out, &amp; spread to Macedonia &amp; Achaia. Who were these that sounded the word to Macedonia? Now certainly it appears well, even travelling men, so journeys, passengers, merchants, traffiquers, that had travelling in Macedonia (as men that would go out of Edinburgh to other parts of this Realm) &amp; so from Macedonia to Achaia.

These men as they so journeyed they so journeyed not with close mouths, but they ever sounded as Heralds and Trumpeters sounding, and where ever they found occasion, they spake of Christ, and of that grace which was in him, to them that knew him not. So that they had conference ever of spiritual things. Then ye who travels from town to town, &amp; from Country to Country, ye have your lesson here, ye should not travel with a close[d] mouth, &amp; all your speech should not be of merchandise and traffique; but of some grace ye have gotten at home, disperse and speak of it.

Ye think of duty ye should seek your advantage &amp; merchandise: the Lord has bound your consciences as it were with bonds to speak &amp; open the grace of God, &amp; going to places where there is freedom to speak the Lord bids you speak, he bids you be lamps &amp; lights to blind people, where ever ye resort: for besides all other means, the Lord has appointed this as a mean to win souls to Christ, that ye who travels and have heard of grace should communicate that grace, and have conference thereof to all persons where ye come, that you may win your poor brother &amp; sister that have not heard of it. Alas, our consciences may accuse us very sore for the neglect of our duty herein: And I trow, because when men are abroad travelling, they travel with close mouths, never speaking of the grace they got at home, the Lord has begun to close the mouths of the preachers of grace in this Town here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), pp 31-32.</span></figcaption>

<blockquote><p>Answer. First, we hold that by a calling or ordination he is made a pastor; by election he is restricted to be ordinarily the pastor of his flock. Secondly, a pastor is a pastor of the catholic Church, but he is not a catholic pastor of the catholic Church, as were the apostles. Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits, we may with better reason say it of our selves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case]. …but a pastoral care for the Churches is not proper to apostles only, but only such a pastoral care by special direction from Christ immediately to preach to all, 2. Backed with the gift of tongues and of miracles; and this essentially differences the apostle from the ordinary pastor; but the former pastoral care to preach the Gospel to all nations, and to convert, is common both to the apostle and pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, p. 204</span></figcaption>

</figure><figure class="quote" id="q-091e61afe4" data-kw="">
<blockquote><p>Our judgement is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4. It is certain from the Word of God that God enjoins all believers to exhort, comfort, reprove, and edify one another, Heb. 3:13; 1 Thess. 4:18 &amp; 5:14, but it is from the common duty of charity, and the law of nature that they are thus bound: and therefore the Word which they declare to their neighbours does not by the authority of any special office bind to obedience those that hear it, but by virtue of the subject or matter contained in that Word. But the Church’s ministers declare the Word of God as Christ’s ambassadors, with authority of special office, and power to bind and loose, 1 Cor. 4:1-2; 2 Cor. 5:20; Jn. 20:21-22. There is therefore a many-fold difference between the charitative admonitions of private Christians and the authoritative preaching of God’s ministers. For:

1. The admonitions of ordinary Christians are to our neighbor privately, and as joined to us by the bond of charity and the law of nature: The ministers of churchs do publicly preach the Word of God with pastoral charge of souls, and God’s authority, to the Church, as a Church, over which God has made them watchmen and overseers.

2. The ministers’ authoritative preaching the Word has joined with it the ecclesiastical power of binding and loosing sinners, remitting and retaining sins, Mt. 16:18-19; Jn. 20:21-22, which authority is not affixed to the charitative admonitions of private Christians.

3. There is not so absolute and strict an obligation on private Christians for that brotherly correction which is performed by them, as the obligation on the pastors of the Church of God for their office of preaching, who may not involve themselves in the affairs of this world, to the end that they may wholly attend upon the office of preaching, 2 Tim. 2. 4. and who are in a special manner to give an account of the salvation of their hearers committed to them, Heb. 13:17; Eze. 3:18 &amp; 33:18, which do not concern private Christians in the exercise of charitative admonition.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our judgement is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4. It is certain from the Word of God that God enjoins all believers to exhort, comfort, reprove, and edify one another, Heb. 3:13; 1 Thess. 4:18 &amp; 5:14, but it is from the common duty of charity, and the law of nature that they are thus bound: and therefore the Word which they declare to their neighbours does not by the authority of any special office bind to obedience those that hear it, but by virtue of the subject or matter contained in that Word. But the Church’s ministers declare the Word of God as Christ’s ambassadors, with authority of special office, and power to bind and loose, 1 Cor. 4:1-2; 2 Cor. 5:20; Jn. 20:21-22. There is therefore a many-fold difference between the charitative admonitions of private Christians and the authoritative preaching of God’s ministers. For:

1. The admonitions of ordinary Christians are to our neighbor privately, and as joined to us by the bond of charity and the law of nature: The ministers of churchs do publicly preach the Word of God with pastoral charge of souls, and God’s authority, to the Church, as a Church, over which God has made them watchmen and overseers.

2. The ministers’ authoritative preaching the Word has joined with it the ecclesiastical power of binding and loosing sinners, remitting and retaining sins, Mt. 16:18-19; Jn. 20:21-22, which authority is not affixed to the charitative admonitions of private Christians.

3. There is not so absolute and strict an obligation on private Christians for that brotherly correction which is performed by them, as the obligation on the pastors of the Church of God for their office of preaching, who may not involve themselves in the affairs of this world, to the end that they may wholly attend upon the office of preaching, 2 Tim. 2. 4. and who are in a special manner to give an account of the salvation of their hearers committed to them, Heb. 13:17; Eze. 3:18 &amp; 33:18, which do not concern private Christians in the exercise of charitative admonition.”

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+judgement+is+that+none+may+publicly+in+the+church+assembly+of+the+faithful+preach+the+Word+of+God+in+the+Name+of+Christ+and+of+God%2C+but+he+who+is+sent+by+a+divine+calling+for+that+work%3B+as+the+Protestants+demonstrate+against+the+Socinians+and+Anabaptists+from+Rom.+10%3A14-15%3B+Heb.+5%3A4-5%3B+Acts+13%3A1-2+%26+14%3A22%3B+Tit.+1%3A5%3B+2+Tim.+2%3A2%2C+and+other+places+and+arguments%3B+and+from+the+examples+of+all+those%2C+who+either+in+an+extraordinary+or+ordinary+manner+were+sent+to+preach+the+Word.+Which+mission%2C+or+sending%2C+consists+not+only+in+conferring+gifts%2C+whereby+an+ability%2C+%5BGreek%5D%2C+is+given+by+God%3B+but+in+conferring+a+power%2C+whereby+is+given+an+authority%2C+%5BLatin%5D%2C+to+preach+the+Word+of+God%3B+which+authority+is+oft-times+not+conferred+on+those%2C+on+whom+yet+God+bestows+gifts+and+ability.+For+it+is+by+the+Word+of+God+denied+to+women%2C+in+whose+lips+is+the+Law+of+God%2C+Prov.+31%3A26%2C+and+a+fitness+to+teach+the+yonger+women%2C+Tit.+2%3A3-4.+It+is+certain+from+the+Word+of+God+that+God+enjoins+all+believers+to+exhort%2C+comfort%2C+reprove%2C+and+edify+one+another%2C+Heb.+3%3A13%3B+1+Thess.+4%3A18+%26+5%3A14%2C+but+it+is+from+the+common+duty+of+charity%2C+and+the+law+of+nature+that+they+are+thus+bound%3A+and+therefore+the+Word+which+they+declare+to+their+neighbours+does+not+by+the+authority+of+any+special+office+bind+to+obedience+those+that+hear+it%2C+but+by+virtue+of+the+subject+or+matter+contained+in+that+Word.+But+the+Church%E2%80%99s+ministers+declare+the+Word+of+God+as+Christ%E2%80%99s+ambassadors%2C+with+authority+of+special+office%2C+and+power+to+bind+and+loose%2C+1+Cor.+4%3A1-2%3B+2+Cor.+5%3A20%3B+Jn.+20%3A21-22.+There+is+therefore+a+many-fold+difference+between+the+charitative+admonitions+of+private+Christians+and+the+authoritative+preaching+of+God%E2%80%99s+ministers.+For%3A%0A%0A1.+The+admonitions+of+ordinary+Christians+are+to+our+neighbor+privately%2C+and+as+joined+to+us+by+the+bond+of+charity+and+the+law+of+nature%3A+The+ministers+of+churchs+do+publicly+preach+the+Word+of+God+with+pastoral+charge+of+souls%2C+and+God%E2%80%99s+authority%2C+to+the+Church%2C+as+a+Church%2C+over+which+God+has+made+them+watchmen+and+overseers.%0A%0A2.+The+ministers%E2%80%99+authoritative+preaching+the+Word+has+joined+with+it+the+ecclesiastical+power+of+binding+and+loosing+sinners%2C+remitting+and+retaining+sins%2C+Mt.+16%3A18-19%3B+Jn.+20%3A21-22%2C+which+authority+is+not+affixed+to+the+charitative+admonitions+of+private+Christians.%0A%0A3.+There+is+not+so+absolute+and+strict+an+obligation+on+private+Christians+for+that+brotherly+correction+which+is+performed+by+them%2C+as+the+obligation+on+the+pastors+of+the+Church+of+God+for+their+office+of+preaching%2C+who+may+not+involve+themselves+in+the+affairs+of+this+world%2C+to+the+end+that+they+may+wholly+attend+upon+the+office+of+preaching%2C+2+Tim.+2.+4.+and+who+are+in+a+special+manner+to+give+an+account+of+the+salvation+of+their+hearers+committed+to+them%2C+Heb.+13%3A17%3B+Eze.+3%3A18+%26+33%3A18%2C+which+do+not+concern+private+Christians+in+the+exercise+of+charitative+admonition.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+75-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F091e61afe4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/091e61afe4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=Our%20judgement%20is%20that%20none%20may,in%20the%20exercise%20of%20charitative%20admonition&amp;text=O

<main class="wrap"><figure class="quote" id="q-a30b6d27e6" data-kw="">
<blockquote><p>The laws punish sacrilege horribly in public, but it is a greater sacrilege to strip the Church of the knowledge of languages than of golden or silver ornaments. For these heavenly gifts bring light to the Gospel, and they are more truly ornaments of the Church than any golden object. And there is no doubt that God has added the gift of languages to the Gospel for the purpose that they call us and that they lead to an explanation of the Holy Scriptures.

Therefore consider those contemptuous of languages sacrilegious, who once rushed at the altars and into the temples with great rage and threatened the devastation and ruin of religion and of the noble arts, and do not doubt that they will have to pay God their penalty. If we, however, strive to be pleasing to God and loyal towards the Church, let us recognise the favour of God and protect and conserve it for the use of the Church. If someone is deterred from these studies by the fact that the prizes do not appear to be adequate to the toil, then he does not have sufficient religious feeling for God.

For if God promises prodigious recompense for piety in every case, His trustworthiness is not to be doubted. Elsewhere He promises vast crops of fruits of the earth, if the people generously joined together for the use of the temple. Therefore the recompense will not be lacking for us, if we join our efforts for the use of the Church; and it is piety to have regard for the Church in expectation of that promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/veit-dietrich.html">Veit Dietrich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the study of languages (1533) in Orations on Philosophy and Education</cite></span></figcaption>

</figure><figure class="quote" id="q-01ef5fc07c" data-kw="">
<blockquote><p>A second sort of action lawful on the Sabbath day, are such as are necessary to preserve the being or well-being of creatures. Thus it is lawful for Physicians [medical doctors], or Surgeons to apply medicines to their patients. Our Saviour abundantly vindicates this, Joh. 3.5, 9. Luk. 13.12, 13. Luk. 6.10. Joh. 9.6. Mat. 12.10. And so for nurses to attend those that are sick, or young children, to go for a Physician; to prepare physic [medicine], let blood, &amp;c. To save the life of another, to endeavour to preserve our own lives, by fighting in opposition to an enemy, by fleeing from an enemy, to be in arms for the defence of our Prince, or Country, 1 Kings 20.9. 2 Kings 11.5, 6. For the Magistrate to commit malefactors, Numb. 15.34.

To dress meat, (our Saviour justified the disciples rubbing ears of Corn, Mat. 12, 1, 2, 3.) We find our Saviour at a feast on the Sabbath day, Luk. 14.1, 2, 3. and others were bidden, v. 7. To feed and water cattle justified by our Saviour, Luk. 13.15. To keep our goods from being lost, upon which our Saviour Job. 5. justified the lame man carrying of his bed. Undoubtedly actions that tend to preserve the being or usefulness of a thing, of which we have a moral certainty, that without such labour on the Sabbath, the creature would perish, or be useful, and corrupt, are lawful on the Lord’s day. This all stands upon that principle: That God loves mercy rather than sacrifice. And upon that principle,

… Actions also of mercy and charity, are by all Determined lawful. Such as are visiting the sick, &amp;c. Many of those which come under the Schoolmen’s two verses,

Visito, poto, cibo, redimo, tego, colligo, condo.

Giving bread to the hungry, beer to the thirsty, burying the dead, relieving the captives, &amp;c.

So as we find the rest commanded in the fourth commandment limited by these exceptions, and it must remain unlawful in any other causes to labour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), pp 95-97.</span></figcaption>

<blockquote><p>…the purpose of Christ while he said to the Pharisees, ‘The Law and the prophets were until John: from that time the Kingdom of God is preached.’ [Lk. 16:16] He had in the parable of the unjust steward, and in the application of the same, spoken somewhat contemptibly of riches: Which when the Pharisees heard, they derided him, and that for this pretended reason (as is evident from the answer which is returned unto them) because the Law promises the world’s goods, as rewards and blessings to the people of God, that by the temporal things, which are set forth for types and shadows of eternal things, they might be instructed, helped and lead as it were by the hand, to the contemplation, desire and expectation of those heavenly and eternal things, which are not seen. Now, Christ did not only rip up the hypocrisy of their hearts, verse 15, but also gave a formal answer to their pretended reason, by showing them how the Law is by Him perfected, verse 16, yet not destroyed, Verse 17. Then, will we observe how He teaches that the Law and the prophets are perfected, and so our point shall be plain. The Law and the prophets were until John. i.e. they did typify and prophesy concerning the things of the Kingdom of God until John, for before that time the faithful only saw those things afar off, and by types, shadows and figures, and the rudiments of the world were taught to know them; But from that time the Kingdom of God is preached. i.e. the people of God are no longer to be instructed concerning the things of the Kingdom of God by outward signs or visible shadows and figure, but only by the plain Word of the Gospel, for now the Kingdome of God [Greek], is not typified as before, but plainly preached, as a thing exhibited to us and present with us. Thus we see, that to us in the days of the Gospel the Word only is appointed to teach the things belonging to the Kingdom of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the purpose of Christ while he said to the Pharisees, ‘The Law and the prophets were until John: from that time the Kingdom of God is preached.’ [Lk. 16:16] He had in the parable of the unjust steward, and in the application of the same, spoken somewhat contemptibly of riches: Which when the Pharisees heard, they derided him, and that for this pretended reason (as is evident from the answer which is returned unto them) because the Law promises the world’s goods, as rewards and blessings to the people of God, that by the temporal things, which are set forth for types and shadows of eternal things, they might be instructed, helped and lead as it were by the hand, to the contemplation, desire and expectation of those heavenly and eternal things, which are not seen. Now, Christ did not only rip up the hypocrisy of their hearts, verse 15, but also gave a formal answer to their pretended reason, by showing them how the Law is by Him perfected, verse 16, yet not destroyed, Verse 17. Then, will we observe how He teaches that the Law and the prophets are perfected, and so our point shall be plain. The Law and the prophets were until John. i.e. they did typify and prophesy concerning the things of the Kingdom of God until John, for before that time the faithful only saw those things afar off, and by types, shadows and figures, and the rudiments of the world were taught to know them; But from that time the Kingdom of God is preached. i.e. the people of God are no longer to be instructed concerning the things of the Kingdom of God by outward signs or visible shadows and figure, but only by the plain Word of the Gospel, for now the Kingdome of God [Greek], is not typified as before, but plainly preached, as a thing exhibited to us and present with us. Thus we see, that to us in the days of the Gospel the Word only is appointed to teach the things belonging to the Kingdom of God.”

— George Gillespie, English Popish Ceremonies, (1637), pt. 3, ch. 5, pp. 83-84">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+purpose+of+Christ+while+he+said+to+the+Pharisees%2C+%E2%80%98The+Law+and+the+prophets+were+until+John%3A+from+that+time+the+Kingdom+of+God+is+preached.%E2%80%99+%5BLk.+16%3A16%5D+He+had+in+the+parable+of+the+unjust+steward%2C+and+in+the+application+of+the+same%2C+spoken+somewhat+contemptibly+of+riches%3A+Which+when+the+Pharisees+heard%2C+they+derided+him%2C+and+that+for+this+pretended+reason+%28as+is+evident+from+the+answer+which+is+returned+unto+them%29+because+the+Law+promises+the+world%E2%80%99s+goods%2C+as+rewards+and+blessings+to+the+people+of+God%2C+that+by+the+temporal+things%2C+which+are+set+forth+for+types+and+shadows+of+eternal+things%2C+they+might+be+instructed%2C+helped+and+lead+as+it+were+by+the+hand%2C+to+the+contemplation%2C+desire+and+expectation+of+those+heavenly+and+eternal+things%2C+which+are+not+seen.+Now%2C+Christ+did+not+only+rip+up+the+hypocrisy+of+their+hearts%2C+verse+15%2C+but+also+gave+a+formal+answer+to+their+pretended+reason%2C+by+showing+them+how+the+Law+is+by+Him+perfected%2C+verse+16%2C+yet+not+destroyed%2C+Verse+17.+Then%2C+will+we+observe+how+He+teaches+that+the+Law+and+the+prophets+are+perfected%2C+and+so+our+point+shall+be+plain.+The+Law+and+the+prophets+were+until+John.+i.e.+they+did+typify+and+prophesy+concerning+the+things+of+the+Kingdom+of+God+until+John%2C+for+before+that+time+the+faithful+only+saw+those+things+afar+off%2C+and+by+types%2C+shadows+and+figures%2C+and+the+rudiments+of+the+world+were+taught+to+know+them%3B+But+from+that+time+the+Kingdom+of+God+is+preached.+i.e.+the+people+of+God+are+no+longer+to+be+instructed+concerning+the+things+of+the+Kingdom+of+God+by+outward+signs+or+visible+shadows+and+figure%2C+but+only+by+the+plain+Word+of+the+Gospel%2C+for+now+the+Kingdome+of+God+%5BGreek%5D%2C+is+not+typified+as+before%2C+but+plainly+preached%2C+as+a+thi

<blockquote><p>But as public baptism is that which is now performed in the public place, where public ordinances are usually administered, the accustomed signs being given for the assembling of the congregation there, at such time when it is to be celebrated, so private baptism, on the contrary, is that which is done either in the place of public assembly when no public notice is duly given for the congregation to resort thither, or in a private house, where although many are present, yet it is not free, or at least its generally supposed it would not be civil for any Christian that will, though uninvited, to come to the ordinance of baptism there administered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-langley.html">Samuel Langley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether (or if at all in what cases) Baptism may be now Administered Privately, not Publicly?’ 20 pp. being the bottom 2/3rds of the Epistle Dedicatory of Suspension Reviewed, Stated, Cleared &amp; Settled upon Plain Scripture-Proof: Agreeable to the former &amp; late constitutions of the Protestant Church of England &amp; other Reformed Churches… (London, 1658) no page numbers</cite></span></figcaption>

#:~:text=But%20as%20public%20baptism%20is%20that,the%20ordinance%20of%20baptism%20there%20administered&amp;text=But%20as%20public%20baptism%20is%20that%20which%20is&amp;text=come%20to%20the%20ordinance%20of%20baptism%20there%20administered" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1233e8e1e" data-kw="">
<blockquote><p>Furthermore, did Christ deliver his Last Supper to all his disciples that were present? Did none stand by, and gaze on while other received? Then hereby fall to the ground the private communions of the popish Church, where all is devoured by the priest, nothing delivered to the people. For whereas the ordinance of Christ and ancient order of the church was for the minister and people to receive the sacrament together: among them the priest accompanied with his boy to make answer, receives the sacrament himself alone, without distribution made to others, yea although the whole congregation be present and look upon him, whereby God is dishonored, the communion is abolished, the people of God are there by deprived and robbed of all comfort. How is this a feast which the priest prepares for himself, not for others: receives by himself, not with his brethren: he speaks to himself, and not to the assembly: he uses a strange tongue, and no man knows what he means: the people is taught nothing, they understand nothing, they hear nothing, they receive nothing; and a few childish, apish, foolish, and unseemly gestures excepted, they see nothing: they taste nothing, they partake nothing, neither comfort of heart, nor memory of Christ, nor benefit of his passion. But Christ in his Last Supper, did not eat up all alone, but after the disciples had supped as Mathew sets it down, He took bread and blessed He brake and gave it to them, saying, ‘Take ye, eat ye:’ neither did He drink alone of the fruit of the vine, but taking the cup He gave thanks, and gave to them all, saying, ‘Drink ye all of this.’ So then, albeit a certain number of communicants are not limited and determined: yet Christ in these words appoints a company to be present, as appears by the number, ‘take ye, eat ye,’ ‘drink ye all,’ ‘divide ye it among yourselves,’ ‘do ye this in my remembrance,’ ‘ye set forth the Lord’s death,’ ‘when ye come together to eat,’ ‘tarry ye one for another,’ ‘as often as ye shall eat this bread.’ These words cannot be understood of one particular man, but necessarily import a greater number of men: nay, the Philosopher teaches that the word ‘all’ must be verified at the least of the number of three, which is the least and lowest number that would be admitted to this supper. Neither do we read that so soon as one was gained to the faith, that the apostles administered this sacrament to him, much less would they minister to themselves alone, when none were converted in a nation or city.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments… (London, 1606), bk. 3, ‘Of the Lord’s Supper’</cite>, pp. 276-77</span></figcaption>

<blockquote><p>III. …The instrumental cause [of baptism] is a legitimately called minister. IV. Therefore we do not regard baptism by a layman [privatus], or by a woman, as valid, as the papists do. If there is no circumstance in a worldly government when a private citizen may do anything without authoization, how much less could such a corruption in his Church please Christ?</p></blockquote>

<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments: 1. Christ only administered the Supper in the assembly of the disciples. 2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33). 3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections: 1. Christ performed it in private houses. Reply: But the Church gathered there. 2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments: 1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either. 2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread. 3. There is no example or institution of it in the Word of God. Objections: 1. It is the body of Christ. Reply: No. The body of Christ is not bread. 2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>

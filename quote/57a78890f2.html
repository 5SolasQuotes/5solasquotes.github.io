<main class="wrap"><figure class="quote" id="q-57a78890f2" data-kw="">
<blockquote><p>Now although the nature of God be marvellously one and simple, so it is that according to our manner of conception, we distinguish his virtues and properties from his essence. Concerning his properties, we conceive them under very different respects, and pretend not when we say that he is merciful, to beget an apprehension in the minds of those that hear us, that He is just, or when we say that He is wise, to give occasion to think of his power and might, as his attributes have very different objects, so we comprehend them in our understandings under very different ideas: But then when we speak of his essence, we make a kind of abstraction of it from his properties, and represent it as a single and simple thing, in which all his attributes exist as in a common subject. As to what concerns his attributes, we see them in some sort in this life, in that we understand at least in some degree what is the nature of those operations by which they display themselves upon their objects. For we are not perfectly ignorant what may be that inclination in God of pardoning sins to the penitent, and punishing the obstinate and impenitent and things of like nature. But as to his essence, there is no man that does not acknowledge that we understand it not at all in this life; that is to say, we are not able to form any conception in our minds which has any respect to the nature of his essence, only some think that when we shall be received into the heavens, our supreme happiness will consist in the vision of this essence, which certainly seems extremely difficult to be imagined…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evidence of Things Not Seen, or Diverse Scriptural &amp; Philosophical Discourses concerning the State of Good &amp; Holy Men after Death... (d. 1664; London: Cockerill, 1700), 4th Discourse, Concerning the Happiness of Believers after the Resurrection</cite>, pp. 172-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96d45ff267" data-kw="">
<blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>

<blockquote><p>As the term God is more distinctly expressive of majesty, so the term ‘Father’ conveys the idea of clemency and benevolent disposition. It becomes us to contemplate both as existing in God, that his majesty may inspire us with fear and reverence, and that his fatherly love may secure our full confidence. Hence it is not without good reason that Paul has conjoined these two things… At the same time there will be no inconsistency in saying, that he contents himself with the single term, ‘Father’. Farther, as it is necessary that his incomparable grace should be expressed by the term ‘Father’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, 1:12</span></figcaption>

</figure><figure class="quote" id="q-5592ef0e54" data-kw="">
<blockquote><p>I answer that, There is will in God, as there is intellect: since will follows upon intellect. For as natural things have actual existence by their form, so the intellect is actually intelligent by its intelligible form. Now everything has this aptitude towards its natural form, that when it has it not, it tends towards it; and when it has it, it is at rest therein. It is the same with every natural perfection, which is a natural good. This aptitude to good in things without knowledge is called natural appetite. Whence also intellectual natures have a like aptitude as apprehended through its intelligible form; so as to rest therein when possessed, and when not possessed to seek to possess it, both of which pertain to the will. Hence in every intellectual being there is will, just as in every sensible being there is animal appetite. And so there must be will in God, since there is intellect in Him. And as His intellect is His own existence, so is His will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 | quest. 19 | art. 1, Whether there is will in God</cite></span></figcaption>

</figure><figure class="quote" id="q-926453abbc" data-kw="">
<blockquote><p>Chapter 11 – Seeing it is not possible that the reprobate should receive this grace and live, and also seeing this is infallibly foreseen of God; and again, seeing God has fore-determined to suffer it so to be: Why does He yet will and command that the Gospel, and so grace in the general tenders [offers] thereof, should be proffered unto them? That God is willing to save even those that perish forever, is apparent, both from the consideration of the goodness of his nature, of man’s being his creature, and indeed in a miserable state. But I say, as I have also said already, there is a great difference between his being willing to save them, through their complying with these his reasonable terms, and his being resolved to save them, whether they, as men, will close therewith, or no: So only He saves the elect themselves, even according to the riches of his Grace, even according to his riches in glory, by Christ Jesus working effectually in them what the Gospel, as a condition, calls for from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reprobation Asserted (1688)</cite></span></figcaption>

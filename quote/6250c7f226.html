<main class="wrap"><figure class="quote" id="q-6250c7f226" data-kw="">
<blockquote><p>The reason of this assertion [by opponents] is given to be this, that a bodily gesture being necessary, God not determining man upon any one, leaves him at plain liberty. Answer: Whether we be left at plain liberty in all things which being in the general necessary, and are not particularly determined in God’s Word; it shall be treated of elsewhere in this Dispute. In the meantime, whatsoever liberty God leaves man in bodily gestures, he leaves him no liberty of an unlawful and idolatrous gesture, such as kneeling in the instant of receiving a sacrament, when not only we have the outward sign purposely before us, and our minds and senses fastened upon it, for discerning the signification thereof and the analogy betwixt it and the thing signified, but also look upon it as an image of Christ or as a vicarious sign standing there in Christ’s stead. The indifferency of such a gesture in such a mediate worship should have been proved before such a rule (as this here given us for a reason) had been applied to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 4</cite>, pp. 72-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a09b631be" data-kw="">
<blockquote><p>This gesture (says the Rejoinder [of the opponent]) may before, or by occasion of any of God’s ordinances, be performed lawfully to God. By occasion, I grant: but ‘before’ importes more: Might the Jews kneel before the cherubims of the vail, as they might before the ark? Might they kneel before the brazen-serpent? Might they before every ephod? May we before every pastor? When the Rejoinder has resolved these questions, we shall further consider.</p></blockquote>

<blockquote><p>…all natural ceremonies, such as: bowing of the body before superiors, embracing of those who are dear unto us, lifting up the hands and eyes to heaven in ordinary worship, which nature itself does teach all nations to observe without any institution, though not without some government of counsel, nor without such variety, as nature itself is subject unto…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in Worship… (1633)</cite>, p. 27</span></figcaption>

</figure><figure class="quote" id="q-0bda0d2a28" data-kw="">
<blockquote><p>The gesture of Christ at preaching and prayer was variable; and therefore we may vary. His gesture at the Paschal suppers, and at this last Supper was one, and in a ritual action, requiring some competent gesture.</p></blockquote>

</figure><figure class="quote" id="q-e11ed65781" data-kw="">
<blockquote><p>Though a penitentiary kneel to God purposely in the presence and sight of the congregation, that he may make known to them his repentance for the sin whereby he has scandalized them, yet is the confessing of his sin to God kneeling there upon his knees, an immediate worship, neither does the congregation come betwixt him and God as belonging to the substance of this worship, for he kneels to God as well and makes confession of his sin when the congregation is not before him. But I suppose our kneelers themselves will confess that the elements come so betwixt God and them when they kneel that they belong to the essence of the worship in hand, and that they would not, nor could not worship the flesh and blood of Christ in the sacrament if the elements were not before them. To be short, the case of a penitentiary stands thus, that not in his kneeling simpliciter, but in his kneeling publicly and in sight of the congregation, he sets them before him, purposely and with a respect to them: Whereas our kneelers do kneel in such sort that their kneeling simpliciter, and without an adjection or adjunct, has a respect to the elements purposely set before them, neither would they at all kneel, for that end and purpose for which they do kneel, namely, for worshipping the flesh and blood of Christ in the sacrament, except the elements were before the eyes both of their minds and bodies; as the penitentiary does kneel, for making confession of his sin to God, when the congregation is not before him. … For the very kneeling itself (simply considered) before the elements, respects them as then purposely set in our sight, that we may kneel before them: whereas in the case of the penitentiary, it is not his kneeling to confess his sin to God, which has a respect to the congregation as set in his sight for that purpose; But some circumstances of his kneeling only, to wit, When? At that time when the congregation is assembled; and where? Publicly in sight of the congregation. In regard of these circumstances, he has the congregation purposely in his sight, and so respects them; But in regard of the kneeling itself simply, the presence of the congregation is but accidental to him who kneels, and confesses his sin before God. As touching giving thanks before the meat set on our common tables, though a man should do it kneeling, yet this speaks not home to the point now in controversy, except a man so kneel before his meat, that he have a religious respect to it, as a thing separated from a common use and made holy, and likewise have both his mind and his external senses of seeing, touching, and tasting fastened upon it in the act of his kneeling. And if a man should thus kneel before his meat, he were an idolater. Lastly, giving thanks before the elements of bread and wine in the beginning of the holy action, is as far from the purpose: For this giving of thanks is an immediate worship of God wherein we have our minds and senses not upon the bread &amp; wine, as upon things which have a state in that worship of the Lord’s Supper, and belong to the substance of the same (for the very consecration of them to this use, is but then in fieri), but we worship God immediately by prayer and giving of thanks: Which is all otherwise in the act of receiving [the bread and wine].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 3, ch. 4</cite>, pp. 70-71</span></figcaption>

o+the+congregation+as+set+in+his+sight+for+that+purpose%3B+But+some+circumstances+of+his+kneeling+only%2C+to+wit%2C+When%3F+At+that+time+when+the+congregation+is+assembled%3B+and+where%3F+Publicly+in+sight+of+the+congregation.+In+regard+of+these+circumstances%2C+he+has+the+congregation+purposely+in+his+sight%2C+and+so+respects+them%3B+But+in+regard+of+the+kneeling+itself+simply%2C+the+presence+of+the+congregation+is+but+accidental+to+him+who+kneels%2C+and+confesses+his+sin+before+God.+As+touching+giving+thanks+before+the+meat+set+on+our+common+tables%2C+though+a+man+should+do+it+kneeling%2C+yet+this+speaks+not+home+to+the+point+now+in+controversy%2C+except+a+man+so+kneel+before+his+meat%2C+that+he+have+a+religious+respect+to+it%2C+as+a+thing+separated+from+a+common+use+and+made+holy%2C+and+likewise+have+both+his+mind+and+his+external+senses+of+seeing%2C+touching%2C+and+tasting+fastened+upon+it+in+the+act+of+his+kneeling.+And+if+a+man+should+thus+kneel+before+his+meat%2C+he+were+an+idolater.+Lastly%2C+giving+thanks+before+the+elements+of+bread+and+wine+in+the+beginning+of+the+holy+action%2C+is+as+far+from+the+purpose%3A+For+this+giving+of+thanks+is+an+immediate+worship+of+God+wherein+we+have+our+minds+and+senses+not+upon+the+bread+%26+wine%2C+as+upon+things+which+have+a+state+in+that+worship+of+the+Lord%E2%80%99s+Supper%2C+and+belong+to+the+substance+of+the+same+%28for+the+very+consecration+of+them+to+this+use%2C+is+but+then+in+fieri%29%2C+but+we+worship+God+immediately+by+prayer+and+giving+of+thanks%3A+Which+is+all+otherwise+in+the+act+of+receiving+%5Bthe+bread+and+wine%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29+%7C+pt.+3%2C+ch.+4%2C+pp.+70-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe11ed65781.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e11ed65781.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=Though%20a%20penitentiary%20kneel%20to%20God,of%20receiving%20%5Bthe%20bread%20and%20wine&amp;text=Though%20a%20penitentiary%20kneel%20to%20God%20purposely%20in&amp;text=the%20act%20of%20receiving%20%5Bthe%20bread%20and%20wine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-d5b17f75ff" data-kw="">
<blockquote><p>Bruce Winter has developed a case that elite Roman ‘new women’ brought into the church at Corinth a style of dress that was offensive and disruptive to church unity, as well as an affront to Rome itself. As a response to this avantgarde feminine independence, Winter situates the άγγέλοι of 1 Cor. 11.10 and the ίδιώται of 1 Cor. 14.23-24 as agents of the State who are sent to investigate the behavior of such Christian women at worship. This study considers Winter’s novel claim and concludes that the evidence does not justify such an interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Meaning of κατακαλυπτω [covered] and κατα κεϕαλης εχων [hanging down from the head] in 1 Corinthians 11.2–16’ Ref New Testament Studies, vol. 53, issue 4 (Oct. 2007)</cite>, pp. 502-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7eca285d24" data-kw="">
<blockquote><p>All adult women would have had long hair, the only exceptions being women who habitually wore wigs, slaves who had had their own hair cut off to provide the hair for such wigs and possibly some priestesses, as well as women who had been ill… Women would not have appeared in public with short hair from choice. The hair was always worn pinned up, unless the woman wanted to show distress by not taking care of her appearance, such as at funerals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexandra-t-croom.html">Alexandra T. Croom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre (Stroud: Tempus, 2000), pp. 139-55</cite>, p. 141</span></figcaption>

</figure><figure class="quote" id="q-b55a47f3a4" data-kw="">
<blockquote><p>Of the Church of the New Testament, it was prophesied that God would give them one way, as well as one heart, Jer. 32:39, that there shall not only be one Lord, but his Name one, Zech. 14:9. We are exhorted to walk by the same rule, so far as we have attained, that is, to study uniformity, not diversity in those things which are agreed upon to be good and right, Phil. 3:16. Does not the apostle plainly intimate and commend a uniformity in the worship of God, 1 Cor. 14:27… verse 33, for God is not the author of confusion, but of peace, as in all the Churches of the saints, verse 40, ‘Let all things be done decently and in order.’ He limits the prophets to that same number, of two or three, even as he limits those that had the gift of tongues, verse 29. And was it not a great uniformity that he would have every man who prayed or prophesied, to have his head uncovered, and every woman covered, 1 Cor. 11? Does not the same apostle, besides the doctrine of faith and practical duties of a Christian life, deliver several canons to be observed in the ordination and admission of elders and deacons, concerning widows, concerning accusations, admonitions, censures and other things belonging to Church policy, as appears especially from the epistles to Timothy and Titus?… In the ancient Church, although there was not an uniformity in all particulars among all the churches, for instance in the point of fasting: some fasting on the Sabbath, some not, some taking the Lord’s Supper fasting, some after meals, which differences in fasting, gave occasion to the old rule: dissonantia jejunii non dissolvit consonantiam fidei [The dissonance of fasting does not dissolve the concord of the faith]. Although likewise, there was a great difference between the custom of one church and another in the time and manner of celebrating the Lords Supper and in other particulars, as Augustine, Socrates and the author of the Tripartite History record unto us. Yet the Centuries and other ecclesiastical historians show us in every century, a great uniformity in those ancient times, even in very many things belonging to Church government and form of worship.</p></blockquote>

</figure><figure class="quote" id="q-7ebfafd06a" data-kw="">
<blockquote><p>The evangelical ceremonies [in the NT] are either natural or instituted. The natural either common or proper. The common natural ceremonies of religion, are such as are equally used in civil and in religious matters, as bowing the knee, uncovering the head, and some other things which respect that civil order, reverence, and decency, which ought to be observed in the external (and especially in the public) worship of God. The proper are such as are not used but in the matters of religion. The instituted ceremonies of the Gospel strictly and properly taken in contradistinction to natural, and which are designed to be of perpetual use, are only the two Sacraments… yet in a large sense even natural ceremonies, and matters of real decency and order, that is such things as are ex natura rei, pro hic et nunc [from the nature of the thing, here and now], necessary hereunto, and acceptable in the worship of God, are instituted too, i.e. commanded either implicitly or explicitly; for nothing offered by man, especially in worship, which is not in obedience to God, by virtue of some command, is honorable or acceptable to God; but what God has commanded, He has thereby instituted. So then, the matter in hand will fall under the notion of a common, natural ceremony of religion, pertaining to the decency or reverence of God’s worship in the public assemblies of his saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative. (London: Maxwell, 1682) 56 pp. ToC</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The evangelical ceremonies [in the NT] are either natural or instituted. The natural either common or proper. The common natural ceremonies of religion, are such as are equally used in civil and in religious matters, as bowing the knee, uncovering the head, and some other things which respect that civil order, reverence, and decency, which ought to be observed in the external (and especially in the public) worship of God. The proper are such as are not used but in the matters of religion. The instituted ceremonies of the Gospel strictly and properly taken in contradistinction to natural, and which are designed to be of perpetual use, are only the two Sacraments… yet in a large sense even natural ceremonies, and matters of real decency and order, that is such things as are ex natura rei, pro hic et nunc [from the nature of the thing, here and now], necessary hereunto, and acceptable in the worship of God, are instituted too, i.e. commanded either implicitly or explicitly; for nothing offered by man, especially in worship, which is not in obedience to God, by virtue of some command, is honorable or acceptable to God; but what God has commanded, He has thereby instituted. So then, the matter in hand will fall under the notion of a common, natural ceremony of religion, pertaining to the decency or reverence of God’s worship in the public assemblies of his saints.”

— Samuel Stoddon, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative. (London: Maxwell, 1682) 56 pp. ToC, pp. 3-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+evangelical+ceremonies+%5Bin+the+NT%5D+are+either+natural+or+instituted.+The+natural+either+common+or+proper.+The+common+natural+ceremonies+of+religion%2C+are+such+as+are+equally+used+in+civil+and+in+religious+matters%2C+as+bowing+the+knee%2C+uncovering+the+head%2C+and+some+other+things+which+respect+that+civil+order%2C+reverence%2C+and+decency%2C+which+ought+to+be+observed+in+the+external+%28and+especially+in+the+public%29+worship+of+God.+The+proper+are+such+as+are+not+used+but+in+the+matters+of+religion.+The+instituted+ceremonies+of+the+Gospel+strictly+and+properly+taken+in+contradistinction+to+natural%2C+and+which+are+designed+to+be+of+perpetual+use%2C+are+only+the+two+Sacraments%E2%80%A6+yet+in+a+large+sense+even+natural+ceremonies%2C+and+matters+of+real+decency+and+order%2C+that+is+such+things+as+are+ex+natura+rei%2C+pro+hic+et+nunc+%5Bfrom+the+nature+of+the+thing%2C+here+and+now%5D%2C+necessary+hereunto%2C+and+acceptable+in+the+worship+of+God%2C+are+instituted+too%2C+i.e.+commanded+either+implicitly+or+explicitly%3B+for+nothing+offered+by+man%2C+especially+in+worship%2C+which+is+not+in+obedience+to+God%2C+by+virtue+of+some+command%2C+is+honorable+or+acceptable+to+God%3B+but+what+God+has+commanded%2C+He+has+thereby+instituted.+So+then%2C+the+matter+in+hand+will+fall+under+the+notion+of+a+common%2C+natural+ceremony+of+religion%2C+pertaining+to+the+decency+or+reverence+of+God%E2%80%99s+worship+in+the+public+assemblies+of+his+saints.%E2%80%9D%0A%0A%E2%80%94+Samuel+Stoddon%2C+An+Essay+on+a+Question+Relating+to+Divine+Worship+viz.+Whether+it+be+Contrary+to+the+Apostolical+Laws+of+Decency+%26+Reverence+for+a+Man+to+have+his+Head+Covered+in+the+Time+%26+Place+of+God%E2%80%99s+Solemn+Public+Worship%3F%3A+Affirmative.+%28London%3A+Maxwell%2C+1682%29+56+pp.+ToC%2C+pp.+3-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ebfafd06a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ebfafd06a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=The%20evangelical%20ceremonies%20%5Bin%20the%20NT,the%20public%20assemblies%20of%20his%20saints&amp;text=The%20evangelical%20ceremonies%20%5Bin%20the%20NT%5D%20are%20either&amp;text=worship%20in%20the%20public%20assemblies%20of%20his%20saints" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

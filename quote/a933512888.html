<main class="wrap"><figure class="quote" id="q-a933512888" data-kw="">
<blockquote><p>The effect or manner of God’s love is, that God makes the person happy whom he loves. For he doth amply reward that joy and delight which he takes in the holiness and obedience of the Elect, while he pours plentifully upon them all gifts, both of grace and of glory [1 John 4:16; John 3:35; Rom 5:8; Mal. 1:2]. This love of God to the elect is (1) Free, Hos. 5:15. He was moved with nothing but his own goodness [1 John 4:10, 19]. (2) Sure, firm, and unchangeable, Rom. 5:8, 10; 1 John 4:10; John 13:1 and 13:3. Infinite and Eternal, which shall never alter, John 3:16. (3) Effectual, as is declared both by his temporal and eternal blessings, 1 John 3:1. (4) Great and ardent, John 3:16 and 15:13; Rom. 5:6, 7. God bestows pledges of his love and favor upon them whom he has chosen, and sometimes he sheds the sense of his love abroad in their hearts [cf. Rom. 5:5; 8:1, 2]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Of Divinity Consisting Of Three Books</cite>, (London, 1646), II.viii quoted in Richard A. Muller, Post-Reformation Reformed Dogmatics: The Rise and Development of Reformed Orthodoxy; Volume 3: The Divine Essence and Attributes (Grand Rapids, MI: Baker Academic, 2003), 568.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-82db385220" data-kw="">
<blockquote><p>Mercy is, God willing, to succor the creature in misery. Mercy in God is either essential: namely that which is in Him by necessity of nature, and had been in Him though He had never willed the manifestation thereof by showing mercy to any; this is God’s sufficiency to show mercy. Or, Relative, namely, that which is in Him with respect to the creature, and is his will to manifest mercy to whom He pleases; Ex. 33:19; Rom. 9:18. Mercy is increated, viz. the attribute of God: or created, viz. a transient act of God in time, or the effects of such transient acts: so vocation is said to be an act of mercy, Rom. 11:30, 32; 1 Pet. 2:10. Remission of sin, Lk. 1:78; Mt. 18:33; Salvation, Jud. 21. Increated mercy is God’s will to show mercy. Created mercy is God’s actual showing mercy according to his will. The effects of mercy are either special: proper to the elect, as flowing from special grace, Rom. 9:23. The elect are called (and by effectual calling so made) vessels of mercy. Or common, extended to those who are not elected, Lk. 6:35-36. Unto the beasts of the field, Ps. 104:27; Yea, over all his works, Ps. 145:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ... (London: 1654), ch. 1, Of the Divine Essence, p. 14</span></figcaption>

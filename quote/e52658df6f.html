<main class="wrap"><figure class="quote" id="q-e52658df6f" data-kw="">
<blockquote><p>For if the man be a back-slider in heart, and a servant of sin, Christ never touched his pulse. He hath as yet sure grounds to question, whether he be loved of God, or be in Christ, or no; for except you prove the man to be loved with an everlasting love, you can prove nothing: And your argument will not conclude any thing for the man’s peace, except you will prove him to be chosen of God; which is his only question.

But say that he is loved from everlasting, and that he is in Christ, by faith, it’s easy to prove, that his sins cannot change everlasting love, nor make him less beloved of God nor separate him from the love of God. You must then either remove the man’s doubting, from signs inherent in the man, (and if he be a back-slider in heart, you fetch fire and water from beyond the Moon to cure him;) or you must fetch warrants to convince him, from the mind, eternal counsels of love and free grace within God; and that is all the question between the poor man and you.

You cannot prove God hath loved him from everlasting, because he hath loved him from everlasting. If Libertines in this Argument intend to prove, that a chosen convert in Christ hath no ground to question, that he is not beloved of God, and not in Christ 1. That is nothing to the Thesis of Antinomians, maintained by all, that sinners, as sinners, are to believe God’s eternal love in Christ to them; and so all sinners, elect or reprobate, are to believe the same.

2. Its nothing to the universal commandment, that all and every one in the visible Church, wearied and loaden with sin, or not wearied and loaden, are immediately to come to Christ and rest on him, as made of God to them their righteousness, sanctification, and redemption, without any inherent qualification in them.

3. It’s nothing to the point of freeing all, and building a golden bridge to deliver all who are obliged to believe, elect or reprobate, from doubting whether they be in Christ or not, that they may easily come to Christ, and believe his eternal love and redemption in him, though they be in the gall of bitterness, and bonds of iniquity, and that immediately. Which golden Paradise to heaven and Christ, Antinomians liberally promise to all sinners, as sinners. I cannot believe that it’s so easy a step to Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself</cite>, (London: Andrew Crooke, 1647), I., pp 73-74.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57639e2c3f" data-kw="">
<blockquote><p>VII… a divine and infallible certainty which exists or can ordinarily exist in every believer… from the grace of the Spirit by the energy (energeian) of faith, which, resting upon the external promises of the Word and the internal testimony of the Holy Spirit, exerts itself in all more or less, but as much as suffices for true consolation. (2) The question is not whether that certainty can be in the believer without the use of means (i.e., the desire for holiness and the exercise of repentance and the actual purpose of living piously… Fir we hold that these are not to be wrested apart from each other and that persuasion cannot proceed into act without the desire of holiness. For He gave his promises to those walking in that way alone, and there are the indubitable effects and signs (gnorismata) of true faith and justification. VIII… For since it does not exist in us… without the use of means, it is certain that when these means are not used or when the contrary are used, the act itself cannot be put forth… But this does not prevent the foundation from always being in the believer and the principle from which (if he rightly considers his own state and the divine promise) he can deduce this actual full confidence (plerophorian).</p></blockquote>

</figure><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

</figure><figure class="quote" id="q-b8ba812231" data-kw="">
<blockquote><p>Assurance is a jewel of that worth, a pearl of that price, that he who will have it must work, and sweat, and weep, and wait to obtain it. He must not only use diligence—but he must use all diligence; not only dig—but he must dig deep, before he can come to this golden mine. Assurance is that &quot;white stone,&quot; that &quot;new name,&quot; that hidden manna, which none can obtain but such as labor for it as for life. Assurance is such precious gold, that a man must win it before he can wear it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 34</span></figcaption>

</figure><figure class="quote" id="q-5939d6249e" data-kw="">
<blockquote><p>This [lack of spiritual comfort] may arise from the prevalence of a natural melancholy [depression] in the body, whereby the understanding may be darkened, the fancy troubled, reason perverted, and the soul saddened. Melancholy is the mother of discomfort and the nurse of doubting. It was (as some think) depth of melancholy that prevailed upon Nebuchadnezzar, so that he did not know, he was a man or a beast. And in the like manner this bodily melancholy may so far distemper your soul that you who have grace yet may not know whether you are a child of God or a child of the devil. It is not more wonder to see a melancholy man doubt and question his spiritual condition than it is to see a child cry when beaten or to hear a sick man groan.

You may silence a melancholy man when you are not able to comfort him; and though you may resolve his doubts and scruples by evident and convincing answers and arguments, yet let such a man retire alone and brood over his melancholy thoughts, and by the prevalence of this perturbing humour all is forgotten, and he is as unsatisfied as if you had said nothing to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: The Truth, Growth, and Different Degrees</cite>, ed. Don Kistler (Morgan PA: Soli Deo Gloria, 1997), pp 114-15.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This [lack of spiritual comfort] may arise from the prevalence of a natural melancholy [depression] in the body, whereby the understanding may be darkened, the fancy troubled, reason perverted, and the soul saddened. Melancholy is the mother of discomfort and the nurse of doubting. It was (as some think) depth of melancholy that prevailed upon Nebuchadnezzar, so that he did not know, he was a man or a beast. And in the like manner this bodily melancholy may so far distemper your soul that you who have grace yet may not know whether you are a child of God or a child of the devil. It is not more wonder to see a melancholy man doubt and question his spiritual condition than it is to see a child cry when beaten or to hear a sick man groan.

You may silence a melancholy man when you are not able to comfort him; and though you may resolve his doubts and scruples by evident and convincing answers and arguments, yet let such a man retire alone and brood over his melancholy thoughts, and by the prevalence of this perturbing humour all is forgotten, and he is as unsatisfied as if you had said nothing to him.”

— Christopher Love, Grace: The Truth, Growth, and Different Degrees, ed. Don Kistler (Morgan PA: Soli Deo Gloria, 1997), pp 114-15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+%5Black+of+spiritual+comfort%5D+may+arise+from+the+prevalence+of+a+natural+melancholy+%5Bdepression%5D+in+the+body%2C+whereby+the+understanding+may+be+darkened%2C+the+fancy+troubled%2C+reason+perverted%2C+and+the+soul+saddened.+Melancholy+is+the+mother+of+discomfort+and+the+nurse+of+doubting.+It+was+%28as+some+think%29+depth+of+melancholy+that+prevailed+upon+Nebuchadnezzar%2C+so+that+he+did+not+know%2C+he+was+a+man+or+a+beast.+And+in+the+like+manner+this+bodily+melancholy+may+so+far+distemper+your+soul+that+you+who+have+grace+yet+may+not+know+whether+you+are+a+child+of+God+or+a+child+of+the+devil.+It+is+not+more+wonder+to+see+a+melancholy+man+doubt+and+question+his+spiritual+condition+than+it+is+to+see+a+child+cry+when+beaten+or+to+hear+a+sick+man+groan.%0A%0AYou+may+silence+a+melancholy+man+when+you+are+not+able+to+comfort+him%3B+and+though+you+may+resolve+his+doubts+and+scruples+by+evident+and+convincing+answers+and+arguments%2C+yet+let+such+a+man+retire+alone+and+brood+over+his+melancholy+thoughts%2C+and+by+the+prevalence+of+this+perturbing+humour+all+is+forgotten%2C+and+he+is+as+unsatisfied+as+if+you+had+said+nothing+to+him.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+Grace%3A+The+Truth%2C+Growth%2C+and+Different+Degrees%2C+ed.+Don+Kistler+%28Morgan+PA%3A+Soli+Deo+Gloria%2C+1997%29%2C+pp+114-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5939d6249e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5939d6249e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/17/christopher-love-on-depression-and-a-lack-of-assurance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-38c0a45750" data-kw="">
<blockquote><p>2. Though it be not simply unlawful to express in painting the visible shapes that were showed in vision to the prophets, if it be only for use and signification of the history, or if there be any other commendable use: yet to make those shapes for any use of religion, or service of God, is abominable idolatry. Fulke, ibid.: Epiphanius saw in a Church at Anablatha, an image painted in a table, as it had been of Christ or a saint; he took it down and cut it in pieces: affirming that it was contrary to the Scripture for any image of a man to hang in the Church of Christ. The Elibertine Council, Canon 36 decreed that no pictures should be made in Churches. If no pictures, much less carved images, which are a more strong provocation to idolatry. Augustine renders a reason why it is dangerous to have images in Churches, where there is yea but the least fear of superstition: Quis orat intuens simulachrum, qui non sic afficitur, vt ab eo se exaudiri putet, nec ab eo sibi praestari, quod desideret, putet? Who (sayth he) prayeth beholding an image, and is not so affected as though he were heard of it, and hopeth not to have that performed by it which he desireth? Ps. 113.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 349-50 of ‘Whether it be lawful to have the images of the Trinity, of Christ, or of the Angels’ in Synopsis Papismi (London, 1592), Controversies Concerning the Church Triumphant, 9th Controversy: concerning Saints Departed, 2nd Part, 5th Question, Part 1, Second Article</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>

<blockquote><p>if any man go about to express God’s Majesty by any shape: he does Him wrong, and it is high treason to Him, because He is uncomprehensible in his glory… Now we see that the Papists have gone about to express God by shapes: therefore it follows that they have marred all religion. And whereas they allege that there were cherubins painted upon the vail of the Temple, and that two likewise did cover the ark: it serves to condemn them the more. When the Papists pretend that men may make any manner of image: What, say they? Has not God permitted it? No: but the imagery that was set there, served to put the Jews in mind that they ought to abstain from all counterfeiting of God, insomuch that it was a mean to confirm them the better, that it was not lawful for them to represent God’s Majesty, or to make any resemblance thereof.</p></blockquote>

</figure><figure class="quote" id="q-fa58b92034" data-kw="">
<blockquote><p>…God was immediately present in and with the ark, the temple, the holy mountain, the bush, the cloud and the fire which came from heaven, speaking and manifesting Himself to his people by his own immediate voice and miraculous extraordinary presence: So that worshipping before these things had the same reason which makes the 24 elders in heaven worship before the throne. For in these things God did immediately manifest his presence, as well as in heaven. Though there be a difference in the degrees of the immediate manifestation of his presence in earth and in heaven, yet magne et minus non variant speciem [greater and less do not vary the species]. Now God is present in the sacrament, not extraordinarily, but in the way of an ordinary dispensation, not immediately but mediately. [While pictures of the ark, temple and Mt. Sinai might be lawfully made, because those things only extraordinarily revealed God’s presence at extraordinary times, and apart from that they did not but only revealed God’s presence in an ordinary manner (as like the sacraments, which pictures may be made of), yet there were no times at which the burning bush and the pillar and cloud of fire did not extraordinarily reveal God’s presence.] Yet to no better purpose they [formalist opponents] tell us that when God spake Abraham fell on his face. And when the fire came down at Elijah’s prayer, the people fell on their faces. What is this to the purpose? And how shall kneeling in a mediate and ordinary worship [such as in receiving the Supper] be warranted by kneeling in the hearing of God’s own immediate voice, or in seeing the miraculous signs of his extraordinary presence?… Moreover it is objected out of Lev. 9:24; 2 Chron. 7:3; Mic. 6:6; 2 Chron. 29:28-30, that all the people fell on their faces before the legal sacrifices when the fire consumed the burnt-offering. Whereunto it may be answered that the fire which came from God and consumed the burnt offerings was one of the miraculous signs of God’s extraordinary and immediate presence… But if we will particularly consider all these places, we find in the first two, that beside the fire, the glory of the Lord did also appear in a more miraculous and extraordinary manner, Lev. 9:23, ‘The glory of the Lord appeared to all the people,’ 2 Chron. 7:1, 12, ‘The glory of the Lord filled the house.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, p. 69</span></figcaption>

 burnt offerings was one of the miraculous signs of God’s extraordinary and immediate presence… But if we will particularly consider all these places, we find in the first two, that beside the fire, the glory of the Lord did also appear in a more miraculous and extraordinary manner, Lev. 9:23, ‘The glory of the Lord appeared to all the people,’ 2 Chron. 7:1, 12, ‘The glory of the Lord filled the house.’”

— George Gillespie, English-Popish Ceremonies (1637), pt. 3, ch. 4, p. 69">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6God+was+immediately+present+in+and+with+the+ark%2C+the+temple%2C+the+holy+mountain%2C+the+bush%2C+the+cloud+and+the+fire+which+came+from+heaven%2C+speaking+and+manifesting+Himself+to+his+people+by+his+own+immediate+voice+and+miraculous+extraordinary+presence%3A+So+that+worshipping+before+these+things+had+the+same+reason+which+makes+the+24+elders+in+heaven+worship+before+the+throne.+For+in+these+things+God+did+immediately+manifest+his+presence%2C+as+well+as+in+heaven.+Though+there+be+a+difference+in+the+degrees+of+the+immediate+manifestation+of+his+presence+in+earth+and+in+heaven%2C+yet+magne+et+minus+non+variant+speciem+%5Bgreater+and+less+do+not+vary+the+species%5D.+Now+God+is+present+in+the+sacrament%2C+not+extraordinarily%2C+but+in+the+way+of+an+ordinary+dispensation%2C+not+immediately+but+mediately.+%5BWhile+pictures+of+the+ark%2C+temple+and+Mt.+Sinai+might+be+lawfully+made%2C+because+those+things+only+extraordinarily+revealed+God%E2%80%99s+presence+at+extraordinary+times%2C+and+apart+from+that+they+did+not+but+only+revealed+God%E2%80%99s+presence+in+an+ordinary+manner+%28as+like+the+sacraments%2C+which+pictures+may+be+made+of%29%2C+yet+there+were+no+times+at+which+the+burning+bush+and+the+pillar+and+cloud+of+fire+did+not+extraordinarily+reveal+God%E2%80%99s+presence.%5D+Yet+to+no+better+purpose+they+%5Bformalist+opponents%5D+tell+us+that+when+God+spake+Abraham+fell+on+his+face.+And+when+the+fire+came+down+at+Elijah%E2%80%99s+prayer%2C+the+people+fell+on+their+faces.+What+is+this+to+the+purpose%3F+And+how+shall+kneeling+in+a+mediate+and+ordinary+worship+%5Bsuch+as+in+receiving+the+Supper%5D+be+warranted+by+kneeling+in+the+hearing+of+God%E2%80%99s+own+immediate+voice%2C+or+in+seeing+the+miraculous+signs+of+his+extraordinary+presence%3F%E2%80%A6+Moreover+it+is+objected+out+of+Lev.+9%3A24%3B+2+Chron.+7%3A3%3B+Mic.+6%3A6%3B+2+Chron.+29%3A28-30%2C+that+all+the+people+fell+on+their+faces+before+the+legal+sacrifices+when+the+fire+consumed+the+burnt-offering.+Whereunto+it+may+be+answered+that+the+fire+which+came+from+God+and+consumed+the+burnt+offerings+was+one+of+the+miraculous+signs+of+God%E2%80%99s+extraordinary+and+immediate+presence%E2%80%A6+But+if+we+will+particularly+consider+all+these+places%2C+we+find+in+the+first+two%2C+that+beside+the+fire%2C+the+glory+of+the+Lord+did+also+appear+in+a+more+miraculous+and+extraordinary+manner%2C+Lev.+9%3A23%2C+%E2%80%98The+glory+of+the+Lord+appeared+to+all+the+people%2C%E2%80%99+2+Chron.+7%3A1%2C+12%2C+%E2%80%98The+glory+of+the+Lord+filled+the+house.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+pt.+3%2C+ch.+4%2C+p.+69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa58b92034.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa58b92034.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=God%20was%20immediately%20present%20in%20and,of%20the%20Lord%20filled%20the%20house&amp;text=God%20was%20immediately%20present%20in%20and%20with%20the&amp;text=The%20glory%20of%20the%20Lord%20filled%20the%20house" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

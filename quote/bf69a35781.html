<blockquote><p>…the angels, as God made man a little lower than them (Ps. 8:5), and they seem to be called sons of God (Job 38:7), and are instructed with wisdom in the intellect and holiness and righteousness in the will, the chief points of the divine image, as much or even more so than men, and thus bear the image of God at least no less than man…</p></blockquote>

</figure><figure class="quote" id="q-bf53d697a1" data-kw="">
<blockquote><p>But when I say that God can without respect of sin, inflict any torment upon his creature, this is delivered of power absolute. This power the Lord did execute upon his own Son: for what was his sin? Was He not the spotless lamb of God? Yet what agonies did He suffer in the garden, what torments and terrors upon the cross, when He cried out ‘My God, my God, Why hast thou forsaken Me?’ But the like power He does not execute on us, only He gives us authority to exercise the like power over other creatures: If the powder of an hare [rabbit] burnt alive in an oven, be found to be wholesome for us, He gives us leave thus to deal with him, and the like: yet have not these creatures sinned either against God, or against us. Of this absolute power of God I have discoursed more sparingly in the place cited by him, bk. 1, pt. 2, De Electione, digression 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath</cite>, … (Oxford: L.L., 1653), pt. 2, 2nd Sort of Arguments, sect. 3, pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-e4336db82b" data-kw="">
<blockquote><p>All these principles are the principles of our natural intelligence. They are first manifested in that spontaneous form of intelligence which we call common sense, that is, the natural aptitude of intelligence, before all philosophic culture, to judge things sanely. Common sense, natural reason, seizes these self-evident principles from its notion of intelligible reality. But this natural common sense could not yet give these principles an exact and universal formulation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950), ch. 4, ‘Intelligible Being &amp; First Principles’, p. 35 Lagrange was a Neo-Thomist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-2e7bfd0106" data-kw="">
<blockquote><p>The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, [Edward] Feser’ (RBO, 2025) | 12. ‘Gradation of Principles &amp; Practices’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

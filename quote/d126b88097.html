</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da71c1ee94" data-kw="">
<blockquote><p>That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ch. 1, §§ 9–10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.”

</figure><figure class="quote" id="q-38e6700b84" data-kw="">
<blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question III, ch. 10</span></figcaption>

</figure><figure class="quote" id="q-01d018d5b8" data-kw="">
<blockquote><p>The Scripture we own as the only rule of our faith, as the only treasury of all sacred truths. … The sole inquiry is, whether this supreme teacher be the Spirit of God instructing us in and by the Scripture, or whether it be the authority of this or that, any or all of the churches in the world, which either are so or pretend to be so.</p></blockquote>

<blockquote><p>Many persons are willing to admit that the hand of God is in the great events of nature and of human history. When the pestilence is on the air and thousands are falling victims, when some great earthquake has engulphed cities, or some furious tempest at sea has carried down strong ships with their hardy seamen and their terror-stricken passengers, there are few who believe in a God at all who do not recognize his hand, and say, “Surely God is here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/t-d-witherspoon.html">T.D. Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Not One Forgotten’ in Southern Presbyterian Pulpit</cite>, (1896), p. 377 on Lk. 12:6 For background to this sermon, see Andrew Myers, ”Not One Forgotten’ – A Sermon by T.D. Witherspoon’.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36868917c7" data-kw="">
<blockquote><p>Omnipotency with nine heavy plagues cannot get the people of God freed out of the hands of a tyrant. God must step in with immediate omnipotence in the tenth plague to pull out his people with a stretched out arm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached before the Right Honorable House of Lords, in the Abbey Church at Westminster, Wednesday the 25th day of June</cite>, 1645. Being the day appointed for a solemn and public humiliation., p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-25ae8b54ef" data-kw="">
<blockquote><p>And truly, I do marvel that those who without exception do condemn going aside, as being of it self repugnant unto charity, do not consider, that charity doth less require that we provide for the whole, than that we help those that are taken with that sickness. Finally, They say that as many as fly the plague, do that which no Christian ever did, when as there is no example thereof in the holy Histories. I answer, That this is too deceitful an argument, when as it is apparent that in the holy Scriptures is not set down what every one hath done; and that in many the general rules of doctrine, there is sufficient to determine those things whereof we have no commandment, nor any particular example; and that it is without doubt that it is not set down how often the people hath been visited with the plague, neither yet how every man behaved himself in the plague. But they say they have altogether contrary counsel in the holy Scriptures; for that David doth call us back unto the Tabernacle of the Most Highest, Ps. 91, as though he fled not unto God, which lawfully useth going aside: But yet, say they, David did not fly that very sore plague whereof mention is made, 2 Sam. 24, neither removed his household unto any other place. I grant this; but how many peculiar circumstances do forbid us to make of that a general conclusion? for he himself was the cause of that plague, and deservedly so far forth troubled, that he is ready even with his own destruction to redeem the public calamity; further, when as this plague continued not above three days at the most, what place was there left him to take advice or to fly unto? whither should he have fled, when the plague was hot in all his dominion, and yet is said not at all, or very little, to have touched the chief city itself? Again, they say Isaiah fled not from Hezekiah being sick of the plague: As if we held, that the shepherds with a good conscience, might willingly, and of their own accord, leave their sheep; Yea, and what if I should take exception that Isaiah came not to Hezekiah but by the special command of God? for so doth the History bear record. But, say they, Jeremiah also and Baruch, with other godly men, fled not out of the city being besieged of the Chaldees, though a great part of the people died as well of the plague as of famine; Neither do we say that we may worthily shun the plague by going aside, if we depart from that which we owe unto God, our country, and every of our neighbors: But I cannot but wonder, that those which allege this example of Jeremiah have forgotten that he was taken at the gate of the city, when he assayed to get out, Jer. 37:12. Last of all, they bring a notable example of the Church of Alexandria, out of the seventh Book of Eusebius, Ch. 20, as though we did allow the going aside either of all, or in all places, and times, or do not teach that such constancy and charity ought both to be praised, and also followed, so that a general rule be not made thereof; for Eusebius doth not say that every one, but that very many of the Christians did it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Learned &amp; Pithy Treatise of the Plague, Wherein are Handled These Two Questions: the One, Whether the Plague Be Infectious, Or No: the Other, Whether and How Far it May of Christians Be Shunned by Going Aside</cite>, (1580; London, 1665), pp. 15-16</span></figcaption>

</figure><figure class="quote" id="q-d279c3545e" data-kw="">
<blockquote><p>There must also an order be set down [by the magistrates] among the citizens, to avoid public assemblies, games, feasts, drinkings, marriages, dancings, fairs, schools, churches, and public baths; for besides that in many of these there is great offence committed, not only against the body, but also against the soul, there is also no small danger of getting and scattering the infection. Wherefore, wise men give counsel that at such times we should very seldom come into great companies of men. For there is no man so unskillful but he knows that where as all things are done without consideration, as it were in a mingle mangle, that there the infection is spread farthest and infects many. As when the taverns and typling houses whither they go to drink are open unto all daily, the market also, the shambles, public places also in which linen is washed, and diverse sorts of people are wont [accustomed] to be mixed together, are haunted [frequented by the plague]. In this case, therefore, laws must be made by the Preservers [civil health officials appointed specifically for the plague] whereby such meetings may be forbidden, or else severed into diverse places and times. … If marriages are to be made (albeit whom can these contracts like in such an estate of things, in which if at any time else, the counsel of the apostle ought to prevail, that for the present necessity it were better to remain single) let them be kept with a very small number of persons and without all pomp. As for drunkenness and gormandize, dancings and other not necessary or rather dangerous and hurtful ceremonies and fashions, which for the most part are wont to be used: let them be sent packing far away, lest (as it is in the proverb) this sweet meat have sour sauce (Tob. 2; Amos 8; 1. Mach. 1; Prov. 14), and lest they bewail the next day the oversight committed the day before. … Now concerning houses of learning and schools in which children come together, what shall I say? Else than that it seems very convenient and in manner necessary, if we will avoid the spreading of the infection, that those which cannot be brought unto a place more commodious, be for a time shut up and that the youth be rather taught at home, albeit with never so small profit, and give themselves to private readings than with so great danger by heaps to come together. For the age of children and lads, as being given to feeding, intemperate, tender, thin, unwary, is wont to be more subject unto this sickness [bubonic plague] than those that are elder and of more years. Wherefore, Rhases, the chief of the Arabian physicians, and after him Franciscus Valleriola, physician of Arles, give counsel that infants and children be with speed removed from infectious places into another country where they need fear no danger of infection, The like may be judged of common and yearly fairs, also of funerals or burials… Unto this chapter, let the Preservers [civil health officials appointed for the plague] add this, and earnestly advise upon it with all the magistrates, namely, whether it were better for certain poor people, which get their living by begging from door to door, and by reason of their needy life feeding on everything, are more in danger of this disease than others, go unto and run about all streets, and chiefly such houses where dead corpses are, and seek unto all men (for cruel necessity drives them out of their own poor cottages); let them I say consider whether it were better to send them some whither else, or to maintain them by the common charge at their own houses so long until the sickness slack, that by this means occasion may be taken from them of running up and down, of receiving and scattering the infection. For it can scarce be said how great and present danger does hereby grow unto the whole city. … For this way it shall come to pass that the less multitude of people there is, so much the less infection there shall be: and the less infection there is, so much less dying and more speedy deliverance is to be hoped for. For like as when the rot is gotten into an heap of apples, the more lie gathered together, the more it increases and the longer the rotting endures: so also here it comes to pass that if once the plague be crept into a city that is populous, we see the sickness daily to be increased and cherished a great while, which thing is not wont in such sort to happen in a place less peopled…</p></blockquote>

 together, what shall I say? Else than that it seems very convenient and in manner necessary, if we will avoid the spreading of the infection, that those which cannot be brought unto a place more commodious, be for a time shut up and that the youth be rather taught at home, albeit with never so small profit, and give themselves to private readings than with so great danger by heaps to come together. For the age of children and lads, as being given to feeding, intemperate, tender, thin, unwary, is wont to be more subject unto this sickness [bubonic plague] than those that are elder and of more years. Wherefore, Rhases, the chief of the Arabian physicians, and after him Franciscus Valleriola, physician of Arles, give counsel that infants and children be with speed removed from infectious places into another country where they need fear no danger of infection, The like may be judged of common and yearly fairs, also of funerals or burials… Unto this chapter, let the Preservers [civil health officials appointed for the plague] add this, and earnestly advise upon it with all the magistrates, namely, whether it were better for certain poor people, which get their living by begging from door to door, and by reason of their needy life feeding on everything, are more in danger of this disease than others, go unto and run about all streets, and chiefly such houses where dead corpses are, and seek unto all men (for cruel necessity drives them out of their own poor cottages); let them I say consider whether it were better to send them some whither else, or to maintain them by the common charge at their own houses so long until the sickness slack, that by this means occasion may be taken from them of running up and down, of receiving and scattering the infection. For it can scarce be said how great and present danger does hereby grow unto the whole city. … For this way it shall come to pass that the less multitude of people there is, so much the less infection there shall be: and the less infection there is, so much less dying and more speedy deliverance is to be hoped for. For like as when the rot is gotten into an heap of apples, the more lie gathered together, the more it increases and the longer the rotting endures: so also here it comes to pass that if once the plague be crept into a city that is populous, we see the sickness daily to be increased and cherished a great while, which thing is not wont in such sort to happen in a place less peopled…”

— Johann von Ewich, The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books (London, 1583) | ch. 6, ‘Of Order to be Appointed Among the Citizens, and of Leaving of Public Meetings &amp; Assemblies’, pp. 26-7 ff.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+must+also+an+order+be+set+down+%5Bby+the+magistrates%5D+among+the+citizens%2C+to+avoid+public+assemblies%2C+games%2C+feasts%2C+drinkings%2C+marriages%2C+dancings%2C+fairs%2C+schools%2C+churches%2C+and+public+baths%3B+for+besides+that+in+many+of+these+there+is+great+offence+committed%2C+not+only+against+the+body%2C+but+also+against+the+soul%2C+there+is+also+no+small+danger+of+getting+and+scattering+the+infection.+Wherefore%2C+wise+men+give+counsel+that+at+such+times+we+should+very+seldom+come+into+great+companies+of+men.+For+there+is+no+man+so+unskillful+but+he+knows+that+where+as+all+things+are+done+without+consideration%2C+as+it+were+in+a+mingle+mangle%2C+that+there+the+infection+is+spread+farthest+and+infects+many.+As+when+the+taverns+and+typling+houses+whither+they+go+to+drink+are+open+unto+all+daily%2C+the+market+also%2C+the+shambles%2C+public+places+also+in+which+linen+is+washed%2C+and+diverse+sorts+of+people+are+wont+%5Baccustomed%5D+to+be+mixed+together%2C+are+haunted+%5Bfrequented+by+the+plague%5D.+In+this+case%2C+therefore%2C+laws+must+be+made+by+the+Preservers+%5Bcivil+health+officials+appointed+specifically+for+the+plague%5D+whereby+such+meetings+may+be+forbidden%2C+or+else+severed+into+diverse+places+and+times.+%E2%80%A6+If+marriages+are+to+be+made+%28albeit+whom+can+these+contracts+like+in+such+an+estate+of+things%2C+in+which+if+at+any+time+else%2C+the+counsel+of+the+apostle+ought+to+prevail%2C+that+for+the+present+necessity+it+were+better+to+remain+single%29+let+them+be+kept+with+a+very+small+number+of+persons+and+without+all+pomp.+As+for+drunkenness+and+gormandize%2C+dancings+and+other+not+necessary+or+rather+dangerous+and+hurtful+ceremonies+and+fashions%2C+which+for+the+most+part+are+wont+to+be+used%3A+let+them+be+sent+packing+far+away%2C+lest+%28as+it+is+in+the+proverb%29+this+sweet+meat+have+sour+sauce+%28Tob.+2%3B+Amos+8%3B+1.+Mach.+1%3B+Prov.+14%29%2C+and+lest+they+bewail+the+next+day+the+oversight+committed+the+day+before.+%E2%80%A6+Now+concerning+houses+of+learning+and+schools+in+which+children+come+together%2C+what+shall+I+say%3F+Else+than+that+it+seems+very+convenient+and+in+manner+necessary%2C+if+we+will+avoid+the+spreading+of+the+infection%2C+that+those+which+cannot+be+brought+unto+a+place+more+commodious%2C+be+for+a+time+shut+up+and+that+the+youth+be+rather+taught+at+home%2C+albeit+with+never+so+small+profit%2C+and+give+themselves+to+private+readings+than+with+so+great+danger+by+heaps+to+come+together.+For+the+age+of+children+and+lads%2C+as+being+given+to+feeding%2C+intemperate%2C+tender%2C+thin%2C+unwary%2C+is+wont+to+be+more+subject+unto+this+sickness+%5Bbubonic+plague%5D+than+those+that+are+elder+and+of+more+years.+Wherefore%2C+Rhases%2C+the+chief+of+the+Arabian+physicians%2C+and+after+him+Franciscus+Valleriola%2C+physician+of+Arles%2C+give+counsel+that+infants+and+children+be+with+speed+removed+from+infectious+places+into+another+country+where+they+need+fear+no+danger+of+infection%2C+The+like+may+be+judged+of+common+and+yearly+fairs%2C+also+of+funerals+or+burials%E2%80%A6+Unto+this+chapter%2C+let+the+Preservers+%5Bcivil+health+officials+appointed+for+the+plague%5D+add+this%2C+and+earnestly+advise+upon+it+with+all+the+magistrates%2C+namely%2C+whether+it+were+better+for+certain+poor+people%2C+which+get+their+living+by+begging+from+door+to+door%2C+and+by+reason+of+their+needy+life+feeding+on+everything%2C+are+more+in+danger+of+this+disease+than+others%2C+go+unto+and+run+about+all+streets%2C+and+chiefly+such+houses+where+dead+corpses+are%2C+and+seek+unto+all+men+%28for+cruel+necessity+drives+them+out+of+their+own+poor+cottages%29%3B+let+them+I+say+consider+whether+it+were+better+to+send+them+some+whither+else%2C+or+to+maintain+them+by+the+common+charge+at+their+own+houses+so+long+until+the+sickness+slack%2C+that+by+this+means+occasion+may+be+taken+from+them+of+running+up+and+down%2C+of+receiving+and+scattering+the+infection.+For+it+can+scarce+be+said+how+great+and+present+danger+does+hereby+grow+unto+the+whole+city.+%E2%80%A6+For+this+way+it+shall+come+to+pass+that+the+less+multitude+of+people+there+is%2C+so+much+the+less+infection+there+shall+be%3A+and+the+less+infection+there+is%2C+so+much+less+dying+and+more+speedy+deliverance+is+to+be+hoped+for.+For+like+as+when+the+rot+is+gotten+into+an+heap+of+apples%2C+the+more+lie+gathered+together%2C+the+more+it+increases+and+the+longer+the+rotting+endures%3A+so+also+here+it+comes+to+pass+that+if+once+the+plague+be+crept+into+a+city+that+is+populous%2C+we+see+the+sickness+daily+to+be+increased+and+cherished+a+great+while%2C+which+thing+is+not+wont+in+such+sort+to+happen+in+a+place+less+peopled%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johann+von+Ewich%2C+The+Duty+of+a+Faithful+and+Wise+Magistrate+in+Preserving+and+Delivering+of+the+Commonwealth+from+Infection+in+the+Time+of+the+Plague+or+Pestilence%2C+Two+Books+%28London%2C+1583%29+%7C+ch.+6%2C+%E2%80%98Of+Order+to+be+Appointed+Among+the+Citizens%2C+and+of+Leaving+of+Public+Meetings+%26+Assemblies%E2%80%99%2C+pp.+26-7+ff.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd279c3545e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d279c3545e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=There%20must%20also%20an%20order%20be,happen%20in%20a%20place%20less%20peopled&amp;text=There%20must%20also%20an%20order%20be%20set%20down&amp;text=sort%20to%20happen%20in <blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church. 54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

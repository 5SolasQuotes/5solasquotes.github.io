<blockquote><p>But we desire to see your commandment why for every particular act, that in a large sense is idolatrous, adjoined to the true worship of God, we should forbear our presence at the worship itself, or be said to communicate in the sin there committed? For then no man might present himself with good conscience at any public worship of God where anything is done amiss, for matter or manner, which is in effect to say, he cannot be present at any at all. 4. To communicate in the ordinances of God with the ministers of the Church of England is not to like, approve or reverence the institutions of men in the exercises of religion, nor to communicate with the teacher in his sin, nor in ought else that is amiss. For the worship is of God both for matter and manner. … To eat of meats sacrificed unto idols in the idol temple is to communicate with idolaters. These things are evident and freely granted. But the assembly met to call upon God, in the mediation of Jesus Christ alone, to hear the doctrine of salvation,soundly and purely preached, to receive the sacrament rightly administered, is not a false idolatrous assembly: they that repair unto it be not idolatrous or false worshippers. If you esteem of them as they show themselves by outward signs, you must esteem them to be of the true religion, and the true worshippers of God according to his will; the ministry in that assembly to be true, sound and faithful and of God for substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, (1642), pp. 105-6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-688bda96f3" data-kw="">
<blockquote><p>Q. 138, ‘How may we know the Fundamentals, Essentials, or what parts are necessary to Salvation? And is the Papists way allowable that (some of them) deny that distinction, and make the difference to be only in the degrees of men’s opportunities of knowledge?’ …And whereas they [Papists] would make all the parts of Christian faith and practice equally necessary, where men have a capacity and ability to know, believe and practice them, it is a gross deceit… And thereby they make all sins and errors as equal as all duties and truths (James 3:2; 1 John 1, end). Whereas:

1. There is no man that has not some error and some sin.

2. There is no man that does all that ever he was able to do to understand all the truth.

3. Therefore there is no man whose errors themselves are not (many of them at least) culpable or sinful.

4. And they that distinguish between mortal and venial sins, and yet will not distinguish between mortal and venial errors, are either blind or would keep others blind. As it is not so damning a sin for a man to think a vain thought, or to speak a vain word, as not to love God or holiness (no though he was more able to have forborne that idle word than to have loved God), so it is not so mortal a sin (that is, inconsistent with a justified state) to mistake in a small matter (as who was the Father of Arphaxad, or what year the world was drowned in, etc.) as to blaspheme the Holy Ghost or deny Jesus Christ to be the Savior of the world, or to deny that there is a God or everlasting life, or a difference between good and evil. All sins are not equal in magnitude or danger. Therefore all errors are not equal in magnitude sinfulness or danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 3, Christian Ecclesiastics, p. 895</span></figcaption>

</figure><figure class="quote" id="q-3b792111be" data-kw="">
<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Leviticus</cite>, 10</span></figcaption>

</figure><figure class="quote" id="q-72239b2dfd" data-kw="">
<blockquote><p>Superstition is an offering somewhat as pleasing to God, which is not pleasing to Him. All Christians have some degree of this in matter or manner; for we know but in part, and prophesy in part, etc. And so [it is the logical consequence of separatistic principles that] no Christians must join with others. But must they not give over all religious duty themselves, seeing their own defects more defile them than other men’s [defects]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>

</figure><figure class="quote" id="q-d8d0ceedf7" data-kw="">
<blockquote><p>…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.”

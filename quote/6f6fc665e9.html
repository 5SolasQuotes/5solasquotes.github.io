<main class="wrap"><figure class="quote" id="q-6f6fc665e9" data-kw="">
<blockquote><p>The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>

<blockquote><p>We must look to Paul&#x27;s design. He intends to shew that we have brought nothing to God, by which he might be laid under obligations to us; and he shews that even the good works which we perform have come from God. Hence it follows, that we are nothing, except through the pure exercise of his kindness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:10</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3163c0e2b3" data-kw="">
<blockquote><p>I have hesitated till the present time, not through lack of ability to refute the falsehood or bear testimony for the truth, but from fear and apprehension that I might seem to some to be making additions to the doctrines or precepts of the Gospel of the New Testament, which it is impossible for one who has chosen to live according to the Gospel, either to increase or to diminish. But being recently in Ancyra in Galatia, I found the church there greatly agitated by this novelty, not prophecy, as they call it, but rather false prophecy, as will be shown. Therefore, to the best of our ability, with the Lord’s help, we disputed in the church many days concerning these and other matters separately brought forward by them, so that the church rejoiced and was strengthened in the truth, and those of the opposite side were for the time confounded, and the adversaries were grieved… Their opposition and their recent heresy which has separated them from the Church arose on the following account… a recent convert, Montanus [fl. 157-172] by name… And he became beside himself, and being suddenly in a sort of frenzy and ecstasy, he raved, and began to babble and utter strange things, prophesying in a manner contrary to the constant custom of the Church handed down by tradition from the beginning. Some of those who heard his spurious utterances at that time were indignant, and they rebuked him as one that was possessed, and that was under the control of a demon, and was led by a deceitful spirit, and was distracting the multitude; and they forbade him to talk, remembering the distinction drawn by the Lord and his warning to guard watchfully against the coming of false prophets… For the faithful in Asia met often in many places throughout Asia to consider this matter, and examined the novel utterances and pronounced them profane, and rejected the heresy, and thus these persons were expelled from the Church and debarred from communion. Since, therefore, they called us slayers of the prophets because we did not receive their loquacious prophets, who, they say, are those that the Lord promised to send to the people…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84ec5d0c24" data-kw="">
<blockquote><p>This whole place is very obscure: but the obscurity is produced by our ignorance of the facts referred to and by their cessation, being such as then used to occur but now no longer take place. And why do they not happen now? Why look now, the cause too of the obscurity has produced us again another question: namely, why did they then happen, and now do so no more? …Well, what did happen then? Whoever was baptized he straightway spake with tongues and not with tongues only, but many also prophesied, and some also performed many other wonderful works.</p></blockquote>

</figure><figure class="quote" id="q-d0667ba983" data-kw="">
<blockquote><p>I. Whether regeneration of the intellect through illumination, both in the first and in the second act, whose terminus or formal effect is knowledge and assent to truth, theological wisdom, ecclesiastical prudence, etc., differs in species and form from that more common aid of illumination which also befalls certain reprobate, or the elect before actual conversion? Response: Affirmatively, from 1 Jn. 5:19–20; Phil. 1:9–10; Col. 1:9; Eph. 1:17–18; Jm. 3:13, 15, 17, where distinctly ἡ ἄνωθεν σοφία [hē anōthen sophia, the wisdom from above]; and Lk. 1:17, φρόνησις δικαίων [phronēsis dikaiōn, the prudence of the righteous]. Concerning which [see] in the Disputation on Simplicity and Hypocrisy. By equal reasoning we think a distinction should be made here, as concerning faith of miracles and other charisms in the regenerate, which are materially common, formally peculiar and proper in the regenerate and truly faithful, Mk. 16:16–17; Jn. 7:28[?]; Acts 19:4–6. Compare the Disputations on Miracles and on Charisms. But whether the habit of theological wisdom or ecclesiastical prudence in the unregenerate ought properly and specifically to be called infused, or indeed acquired, could be inquired. We incline to the latter affirmative, so that we regard such habits in the same estimation as their philosophical, medical, historical, poetic habits, etc.</p></blockquote>

</figure><figure class="quote" id="q-5b319948f7" data-kw="">
<blockquote><p>But that gift of healing, like the rest of the miracles, which the Lord willed to be brought forth for a time, has vanished away in order to make the new preaching of the gospel marvelous forever. Therefore, even if we grant to the full that anointing was a sacrament of those powers which were then administered by the hands of the apostles, it now has nothing to do with us, to whom the administering of such powers has not been committed. … Therefore, they make themselves ridiculous when they boast that they are endowed with the gift of healing. The Lord is indeed present with his people in every age; and He heals their weaknesses as often as necessary, no less than of old; still He does not put forth these manifest powers, nor dispense miracles through the apostles’ hands. For that was a temporary gift, and also quickly perished partly on account of men’s ungratefulness.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But that gift of healing, like the rest of the miracles, which the Lord willed to be brought forth for a time, has vanished away in order to make the new preaching of the gospel marvelous forever. Therefore, even if we grant to the full that anointing was a sacrament of those powers which were then administered by the hands of the apostles, it now has nothing to do with us, to whom the administering of such powers has not been committed. … Therefore, they make themselves ridiculous when they boast that they are endowed with the gift of healing. The Lord is indeed present with his people in every age; and He heals their weaknesses as often as necessary, no less than of old; still He does not put forth these manifest powers, nor dispense miracles through the apostles’ hands. For that was a temporary gift, and also quickly perished partly on account of men’s ungratefulness.”

— John Calvin, Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4, ch. 19, sections 18-19, p. 1467">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+that+gift+of+healing%2C+like+the+rest+of+the+miracles%2C+which+the+Lord+willed+to+be+brought+forth+for+a+time%2C+has+vanished+away+in+order+to+make+the+new+preaching+of+the+gospel+marvelous+forever.+Therefore%2C+even+if+we+grant+to+the+full+that+anointing+was+a+sacrament+of+those+powers+which+were+then+administered+by+the+hands+of+the+apostles%2C+it+now+has+nothing+to+do+with+us%2C+to+whom+the+administering+of+such+powers+has+not+been+committed.+%E2%80%A6+Therefore%2C+they+make+themselves+ridiculous+when+they+boast+that+they+are+endowed+with+the+gift+of+healing.+The+Lord+is+indeed+present+with+his+people+in+every+age%3B+and+He+heals+their+weaknesses+as+often+as+necessary%2C+no+less+than+of+old%3B+still+He+does+not+put+forth+these+manifest+powers%2C+nor+dispense+miracles+through+the+apostles%E2%80%99+hands.+For+that+was+a+temporary+gift%2C+and+also+quickly+perished+partly+on+account+of+men%E2%80%99s+ungratefulness.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Calvin%3A+Institutes+of+the+Christian+Religion%2C+ed.+John+T.+McNeill%2C+trans.+Ford+Lewis+Battles+in+The+Library+of+Christian+Classics%2C+vol.+21+%28Philadelphia%3A+Westminster+Press%2C+1960%29%2C+vol.+2%2C+bk.+4%2C+ch.+19%2C+sections+18-19%2C+p.+1467&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b319948f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b319948f7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-miracles-the-cessation-of-the-gift-of-miracles/#:~:text=But%20that%20gift%20of%20healing%2C%20like,partly%20on%20account%20of%20men%E2%80%99s%20ungratefulness&amp;text=But%20that%20gift%20of%20healing%2C%20l

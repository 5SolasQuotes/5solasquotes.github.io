<main class="wrap"><figure class="quote" id="q-5d84881ba5" data-kw="">
<blockquote><p>It is also worthy of observation, that none but the citizens of the Church enjoy this privilege [of salvation]; for, apart from the body of Christ and the fellowship of the godly, there can be no hope of reconciliation with God. Hence, in the Creed we profess to believe in “The Catholic Church and the forgiveness of sins;” for God does not include among the objects of his love any but those whom he reckons among the members of his only begotten Son, and, in like manner, does not extend to any who do not belong to his body the free imputation of righteousness. Hence it follows, that strangers who separate themselves from the Church have nothing left for them but to rot amidst their curse. Hence, also, a departure from the Church is an open renouncement of eternal salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), viii, 42-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5a2ff4eef" data-kw="">
<blockquote><p>3. We must hold that the Covenant of Grace, though it take not away the obligation of the Law, yet it takes away the rigor, or severity and terribleness of that obligation. For though it set before our eyes an universal perfection of righteousness, as to be affected and endeavored to our utmost strength, yet does it not strictly and precisely require it on the pain of eternal damnation. Indeed to a certain measure of obedience, to wit, such as by ordinary grace is possible, it does strictly and precisely oblige us, that is, on pain of eternal damnation, requiring that we actually have it. But to a farther measure, which by the power of ordinary grace we cannot attain, it obliges us less strictly, to wit, requiring that we have it in desire and endeavor, v.g. to the perfection of parts, as they call it, it obliges precisely: For it does no otherwise promise eternal life, but on this condition, that we actually have this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on Mortal &amp; Venial Sin</cite>, pp. 24-25 in Richard Baxter, Richard Baxter’s Confession (1655), ch. 10, sect. 3, p. 401</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9fa3c7f40f" data-kw="">
<blockquote><p>We have covenanted to endeavour a reformation of church government and discipline, “according to the word of God and the example of the best reformed churches.” Now both the word of God and the example of the best reformed churches, leadeth us to a church government distinct from civil government; and the example of the best reformed churches doth undeniably lead us to a church discipline, even where the magistrate is Christian; neither doth the word make any exception of Christian states, but contrariwise chargeth us to keep the commandment and ordinances till Christ come again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, the Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh, 1844), p. 150.</span></figcaption>

</figure><figure class="quote" id="q-0334c1e215" data-kw="warning means not final loss">
<blockquote><p>It is one thing to be delivered to Satan with the feaster for eternal torment; another to be delivered with the incestuous Corinthian for the destruction of the flesh that the Spirit may be saved in the day of the Lord (1 Cor. 5:5). The believer can be delivered up in the latter, not in the former way. Excommunication does not simply exclude the fallen from the kingdom of heaven, but with this condition—unless they repent. Hence the excommunicated does not cease in secret to be a member of Christ, although as to external discipline for a time he may be cut off from the external body of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.40</span></figcaption>

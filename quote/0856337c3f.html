<main class="wrap"><figure class="quote" id="q-0856337c3f" data-kw="">
<blockquote><p>That to scandalize, is not merely to displease or grieve another: For many a man is displeased through his folly and vice, by that which tends to his good: and many a man is tempted (that is, scandalized) by that which pleases him… The most censorious and humorous sort of men have got a notion, that what ever offends or displeases them is scandalous! And they think that no man must do any thing which grieves or displeases them, lest he be guilty of scandal: And by this trick who ever can purchase impatiency and peevishness enough to be always displeased with the actions of others, shall rule the world. But the truth is, the ordinary way of scandalizing these men is by pleasing them. §. 4. I will give you one instance of scandal in Scripture, which may help this sort of people better to understand it. Gal. 2:10-16, Peter there gives true scandal to the Jews and Gentiles: He walked not uprightly according to the truth of the Gospel, but laid a stumbling block before the Jews and Gentiles: And this was not by displeasing the Jews, but by pleasing them… Peter knew the contrary, but for fear of them of the circumcision, lest they should be offended at him as a sinner, he withdrew and separated himself. This scandal tended to harden the Jews… and to seduce the Gentiles into a conceit… and Barnabas was carried away with the dissimulation… We scandalize them [Baxter’s opponents] and others even by pleasing them, and by avoiding that which they falsely called scandalous. And if we would not scandalize them, we must do that which is just, and not by our practice hide the sound doctrine which is contrary to their separating error. … And this [scandalizing] is done more seldom by committing open disgraceful sins and doing that which will make the doer evil spoken of: For by that means others are the more assisted against the temptation of imitating him: But scandal is most commonly found in those actions, which are under least reproach among men, or which have the most plausible appearance of good in them, when they are evil! For these are apter to deceive and overthrow another. §6. 3. And it is also apparent, that it is no sinful scandalizing to do a duty or necessary action which I have not power to forbear, though I know that another will be offended, or fall by it into sin. If God have made it my duty, even at this time, I must not disobey Him and omit my duty because another will make it an occasion of his sin. It must be either a sinful or an indifferent action that is scandal, or something that is in my own power to do or to forbear… § 7. III. …Those that are careless of the consequent of their actions, and contemn the souls of other men, and will go their own way, come of it what will, and say ‘Let other men look to themselves,’ are the commonest sort of scandalizers; and are as culpable as a servant that would leave hot water or fire when the children are like[ly] to fall into it; or that would leave straw or gunpowder near the fire, or would leave open the doors, though not of purpose to let in the thieves. §8. 2. Scandal is that which tends to another’s fall, either directly or indirectly, immediately or remotely! The former may easily be foreseen; but the latter requires a large foreseeing comparing understanding: Yet this kind of scandal also must be avoided; and wise-men that would not undo men’s souls while they think no harm, must look far before them and foresee what is like[ly] to be the consequent of their actions at the greatest distance and at many removes. 3. Scandals also are Aptitudinal or Actual: Many things are apt to tempt and occasion the ruin of another which yet never attain so bad an end, because God disappoints them: But that is no thanks to them that give the scandal.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac19291742" data-kw="">
<blockquote><p>VI. A passive scandal, which is taken and not given, is not only faulty when it proceeds of malice, but also, when it proceeds of ignorance and infirmity: and scandalum pusillorum [a scandal of weak ones], may be scandalum acceptum, on the part of the offended faulty, as well as scandalum Pharisaeorum [the scandal of the Pharisees]. When weak ones are offended at me for the use of a lawful thing, before I know of their weakness and their taking of offence, the scandal is only passive, and so we see that weak ones may take offence where none is given, as well as the malicious. Now, their taking of offence, though it proceed of weakness, yet is sinful, for their weakness and ignorance is a fault, and does not excuse them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, p. 32</span></figcaption>

<blockquote><p>Now Papists confirm many of their superstitions by the English ceremonies… It will be said that Papists have no ground nor reason to confirm any of their superstitions by the English ceremonies. But I answer: 1. If it were so, yet forasmuch as Papists draw them to a confirmation of their superstitions, we should abstain from them as appearances of evil. Eating (at a private banquet) of that which was sacrificed to idols, did confirm an idolater and infidel in his religion, as Pareus notes (Commentary on 1 Cor. 10:28): yet from this the idolater had no reason to confirm himself in his idolatry; but because the idolater seeing it, might draw it to a confirmation, the apostle will have it for that respect foreborn. When the Arians abused trine [three-fold] immersion in baptism to signify three natures of the three persons, Pope Gregory and the Fourth Council of Toledo ordained that in Spain, thrice washing should no longer be used in baptism, but once only. The Arians had no just reason to draw such a signification from the ceremony of trine-immersion: yet was it abolished when those heretics did so abuse it. If any say that we are saved by the blood of the son of man, the phrase is orthodox, because of the communication or rather communion of properties, and the Nestorians cannot with good reason by it confirm their heresy, yet are we to abstain from this form of speech, in Zanchius his judgment, when it is drawn to the confirmation of that error.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now Papists confirm many of their superstitions by the English ceremonies… It will be said that Papists have no ground nor reason to confirm any of their superstitions by the English ceremonies. But I answer: 1. If it were so, yet forasmuch as Papists draw them to a confirmation of their superstitions, we should abstain from them as appearances of evil. Eating (at a private banquet) of that which was sacrificed to idols, did confirm an idolater and infidel in his religion, as Pareus notes (Commentary on 1 Cor. 10:28): yet from this the idolater had no reason to confirm himself in his idolatry; but because the idolater seeing it, might draw it to a confirmation, the apostle will have it for that respect foreborn. When the Arians abused trine [three-fold] immersion in baptism to signify three natures of the three persons, Pope Gregory and the Fourth Council of Toledo ordained that in Spain, thrice washing should no longer be used in baptism, but once only. The Arians had no just reason to draw such a signification from the ceremony of trine-immersion: yet was it abolished when those heretics did so abuse it. If any say that we are saved by the blood of the son of man, the phrase is orthodox, because of the communication or rather communion of properties, and the Nestorians cannot with good reason by it confirm their heresy, yet are we to abstain from this form of speech, in Zanchius his judgment, when it is drawn to the confirmation of that error.”

— George Gillespie, English Popish Ceremonies (1637), pt. 2, ch. 9, p. 36-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+Papists+confirm+many+of+their+superstitions+by+the+English+ceremonies%E2%80%A6+It+will+be+said+that+Papists+have+no+ground+nor+reason+to+confirm+any+of+their+superstitions+by+the+English+ceremonies.+But+I+answer%3A+1.+If+it+were+so%2C+yet+forasmuch+as+Papists+draw+them+to+a+confirmation+of+their+superstitions%2C+we+should+abstain+from+them+as+appearances+of+evil.+Eating+%28at+a+private+banquet%29+of+that+which+was+sacrificed+to+idols%2C+did+confirm+an+idolater+and+infidel+in+his+religion%2C+as+Pareus+notes+%28Commentary+on+1+Cor.+10%3A28%29%3A+yet+from+this+the+idolater+had+no+reason+to+confirm+himself+in+his+idolatry%3B+but+because+the+idolater+seeing+it%2C+might+draw+it+to+a+confirmation%2C+the+apostle+will+have+it+for+that+respect+foreborn.+When+the+Arians+abused+trine+%5Bthree-fold%5D+immersion+in+baptism+to+signify+three+natures+of+the+three+persons%2C+Pope+Gregory+and+the+Fourth+Council+of+Toledo+ordained+that+in+Spain%2C+thrice+washing+should+no+longer+be+used+in+baptism%2C+but+once+only.+The+Arians+had+no+just+reason+to+draw+such+a+signification+from+the+ceremony+of+trine-immersion%3A+yet+was+it+abolished+when+those+heretics+did+so+abuse+it.+If+any+say+that+we+are+saved+by+the+blood+of+the+son+of+man%2C+the+phrase+is+orthodox%2C+because+of+the+communication+or+rather+communion+of+properties%2C+and+the+Nestorians+cannot+with+good+reason+by+it+confirm+their+heresy%2C+yet+are+we+to+abstain+from+this+form+of+speech%2C+in+Zanchius+his+judgment%2C+when+it+is+drawn+to+the+confirmation+of+that+error.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+2%2C+ch.+9%2C+p.+36-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe154ab4537.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e154ab4537.html">Permalink</a><a class="src <blockquote><p>5th Rule: To do any good action, or lawful, or indifferent, when I probably foresee a scandal will follow, is an active scandal, for I prefer my own will to my brother’s salvation (says Antoninus, and Navarret), and therefore says Antoninus: ‘A virgin going abroad, without just necessity, where her beauty shall be a snare to young men, or to go out upon a necessary cause with a whorish attire, is an active scandal,’ her feet ‘abideth not in her house,’ says Solomon (Prov. 7). And Navarre says, ‘It is to sin mortally’ and Silvester says: ‘If the Pope’s commandment do but smell of venial [light] sin, and if by giving audience thereunto it be presumed that the state of the Church shall be troubled, or a scandal shall arise, though the commandment go out under the pain of excommunication, it is not to be obeyed.’ Vasques and Suarez say to sell, gift or dispose of any things indifferent, when we foresee they shall abuse them, is to commit the sin of active scandalizing. Yea, the form of an idol, though he never adore it, does highly scandalize, and Antoninus, Silvester, Corduba, Metina [and] the Jesuit Zanches teach that to contribute to that which we see shall induce any to sin, is to be guilty of scandalizing. And the reasons be these: 1. We are not to prefer our will to the salvation of our brother. 2. Things less necessary than our brother’s salvation, in that case, become not necessary, and so fruitless and idl. 3. Charity infers that we hinder, so far as we can, the ruin of our brother’s soul; scandal is spiritual homicide. 4. To contribute any moral help and influence to our brother’s fall and soul-ruin, is to be accessary to his sin. Hence ceremonies and things not necessary to salvation may be omitted altogether in their specialities when the practicing of them does scandalize, and so though kneeling in God’s worship cannot well be universally omitted, yet kneeling appropriate to such an act of worship may be omitted, and ought to be omitted if it scandalize; and ceremonies which scandalize universally, seeing they are not in their very kind necessary to salvation, are to be abolished. Yet I may add one caution here. To contribute help for the doing of that which of itself is necessary, which I know another, in respect of human frailty, will abuse to sin is no active scandal. So to lay hands on a qualified pastor is not sin, though I foresee through human frailty [that] he will abuse his power in some things to sin. So for an artificer to make swords, though he know some shall abuse them to murdering the innocent, is no scandalous work. I take not on me to prescribe rules for eschewing scandal in all occurrences of providence. The godly-learned can see more than I can do in this matter, where love should be wary to lay a straw in the way of any weak traveler.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, pp. 13-14 of Question 2 in An Introduction to the Doctrine of Scandal in The Divine Right of Church Government (1646)</span></figcaption>

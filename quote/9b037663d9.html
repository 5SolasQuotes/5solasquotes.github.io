<main class="wrap"><figure class="quote" id="q-9b037663d9" data-kw="">
<blockquote><p>But the statute does require belief of every one of these [39] Articles, when it enjoins not only subscription, but an assent unto them, punishing all with deprivation that shall affirm, and maintain any doctrine repugnant to them; which every man must do, if they be found contrariant to the Word; or, he must be false to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons showing the Necessity of Reformation</cite>, … (London: Cotrel, 1660), I. ‘Of Doctrine,’ | p. 6 (Notice Burges does not hold subscription to be equal with assent.)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“But the statute does require belief of every one of these [39] Articles, when it enjoins not only subscription, but an assent unto them, punishing all with deprivation that shall affirm, and maintain any doctrine repugnant to them; which every man must do, if they be found contrariant to the Word; or, he must be false to God.”

— Cornelius Burges, Reasons showing the Necessity of Reformation… (London: Cotrel, 1660), I. ‘Of Doctrine,’ | p. 6 (Notice Burges does not hold subscription to be equal with assent.)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+statute+does+require+belief+of+every+one+of+these+%5B39%5D+Articles%2C+when+it+enjoins+not+only+subscription%2C+but+an+assent+unto+them%2C+punishing+all+with+deprivation+that+shall+affirm%2C+and+maintain+any+doctrine+repugnant+to+them%3B+which+every+man+must+do%2C+if+they+be+found+contrariant+to+the+Word%3B+or%2C+he+must+be+false+to+God.%E2%80%9D%0A%0A%E2%80%94+Cornelius+Burges%2C+Reasons+showing+the+Necessity+of+Reformation%E2%80%A6+%28London%3A+Cotrel%2C+1660%29%2C+I.+%E2%80%98Of+Doctrine%2C%E2%80%99+%7C+p.+6+%28Notice+Burges+does+not+hold+subscription+to+be+equal+with+assent.%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b037663d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b037663d9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=But%20the%20statute%20does%20require%20belief,he%20must%20be%20false%20to%20God&amp;text=But%20the%20statute%20does%20require%20belief%20of%20every&amp;text=Word%3B%20or%2C%20he%20must%20be%20false%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-34c9e5e9b1" data-kw="">

</figure><figure class="quote" id="q-984762b173" data-kw="">
<blockquote><p>Neither has this variety [of catechisms] been looked upon as hurtful, for if so, then holy men would have kept to what they found, and have made conscience of increasing this evil by adding to the number; ‘I find’ (says Dr. Gouge, Epistle to his Catechism): ‘in all ages of the Church, God has stirred up many of his servants to publish several forms, all agreeable in the substance, and I observe among many other, these two good uses to arise from thence, etc.’ which there he specifies; nay, since this of the [Westminster] Assembly, composed by a synod of holy and learned men, approved of, and commended to the nation by the parliament then sitting, and received and settled in Scotland, yet men’s consciences have not been satisfied in this, as the only catechism fit to be used, as appears in the great number and variety of catechisms composed and printed since this was published, a greater number then in so short a time were ever published before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light</cite>, Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662., pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Neither has this variety [of catechisms] been looked upon as hurtful, for if so, then holy men would have kept to what they found, and have made conscience of increasing this evil by adding to the number; ‘I find’ (says Dr. Gouge, Epistle to his Catechism): ‘in all ages of the Church, God has stirred up many of his servants to publish several forms, all agreeable in the substance, and I observe among many other, these two good uses to arise from thence, etc.’ which there he specifies; nay, since this of the [Westminster] Assembly, composed by a synod of holy and learned men, approved of, and commended to the nation by the parliament then sitting, and received and settled in Scotland, yet men’s consciences have not been satisfied in this, as the only catechism fit to be used, as appears in the great number and variety of catechisms composed and printed since this was published, a greater number then in so short a time were ever published before.”

b173.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Neither%20has%20this%20variety%20%5Bof%20catechisms,a%20time%20were%20ever%20published%20before&amp;text=Neither%20has%20this%20variety%20%5Bof%20catechisms%5D%20been%20looked&amp;text=so%20short%20a%20time%20were%20ever%20published%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a> › <a href="../topics/church-government-and-the-ministry/synods-and-assemblies/authority-of-synods.html">Authority of synods</a></span><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span></div>

</figure><figure class="quote" id="q-a912bc63b5" data-kw="">
<blockquote><p>For, indeed, in the most considerable councils of the bishops, as I hear, it has been decreed that they who come from heresy should first be trained in catholic doctrine, and then should be cleansed by baptism from the filth of the old and impure leaven.</p></blockquote>

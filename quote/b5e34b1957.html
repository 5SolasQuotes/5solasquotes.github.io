<main class="wrap"><figure class="quote" id="q-b5e34b1957" data-kw="">
<blockquote><p>The framing, forming and miraculous conception of the body of Christ in the womb of the blessed Virgin was the peculiar and especial work of the Holy Ghost… He took upon Him a body and soul, entire human nature, as the children, or all believers, have the same, synecdochically expressed by ‘flesh and blood.’ Verse 16, ‘He took on Him the seed of Abraham.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3</cite>, ch. 3, pp. 162-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-681c25bdf4" data-kw="">
<blockquote><p>At the Creation the Spirit of God moved upon the face of the waters, Gen. 1.1. So that He was at the framing of this world; and because of that, must be concluded to exist before the world: for when a man in verity can be said to subsist without a soul, the eternity of God shall be allowed, granting Him to abide without his Spirit; which here brooded over the world’s embryo, animating the same for production, infusing such vivifying heat as might capacitate the first confused mass, to bring forth the several forms of things we behold…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doxologia; or Glory to the Father… (London, 1672), Doxologia; or Glory to the Holy Ghost, Reduced to Practice, section 1</cite>, p. 124</span></figcaption>

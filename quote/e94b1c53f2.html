<main class="wrap"><figure class="quote" id="q-e94b1c53f2" data-kw="">
<blockquote><p>The unquestionable duty of all men, who cannot pay just Debt, is at least to acknowledge it; specially where the Debt is so great that the Debtor is not responsible: when I remember the good hand of God upon me, in bringing me to such a refuge as Glasgow; through so many difficulties and dangers; having stayed in Derry until the second day of its Siege, could not get out of the Gates without great difficulty, and forced to leave the half of my Family within the Walls, by the violence of Soldiers; and the next day was taken and Robbed by the Enemies: yet coming unto you in grief, for the lamentable State of this Nation, and particular relations: found no less affectionate tenderness and care, than if I had come among so many near Relations, being suffered to want nothing necessary for this life.

Many others also of this Nation do, and have reason to remember gratefully your labour of love, in their destitute condition; I can see no reason, why such seasonable compassions should be buried in oblivion; but rather should be published according to many Scriptural precedents; rendering fragrant, and perpetuating the memory of such Christian Sympathy. And though in point of modesty, some find it difficult to commend Benefactors to their face, yet find no less difficult to be ungrate.

Your friendly reception of me at first was not all, for after ye were pleased to call me for a season, to labour in Gospel-work, your acceptance of my poor labours was yet a greater comfort; and the testimonies I had of affection from Magistrates, Ministers, and People, were really surprising, being conferred on so worthless a Creature: and that which added yet more to render my lot comfortable at that time, was the exemplary conversation of many Christians, whose knowledge and experience in godliness was such, as gave occasion for my own edification every day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to communicants for necessary preparation and profitable improvement of the great and comfortable ordinance of the Lord’s Supper that therein true spiritual communion with Christ may be obtained, and the eternal enjoyment of God sealed (Edinburgh: William Dickie, 1695), epistle dedicatory.</cite></span></figcaption>

<blockquote><p>It has sometimes been assumed that the Westminster divines formulated the Lex Triplex, or, the threefold division of the law into the moral, judicial, and ceremonial categories. This is not the case, as Henry Bullinger affirmed such a division long before the Westminster Assembly met (I have heard it said that the idea actually comes from the medieval theologian, Thomas Aquinas):

This law is divided into the moral, ceremonial, and judicial laws: all which parts, and every point whereof, Moses hath very exquisitely written, and diligently expounded. The moral law is that which teacheth men manners, and layeth down before us the shape of virtue; declaring therewithal how great righteousness, godliness, obedience, and perfectness God looketh for at the hands of us mortal men. The ceremonial laws are they which are given concerning the order of holy and ecclesiastical rites and ceremonies, and also touching the ministers and things assigned to the ministry and other holy uses. Last of all, the judicial laws give rules concerning matters to be judged between man and man, for the preservation of public peace, equity, and civil honesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 210.</span></figcaption>

<blockquote><p>But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.</p></blockquote>

<blockquote><p>7. The Nature of Natural Law – A law is natural and common if common reason produces it for the common necessity and welfare of human social life in general. Therefore, it is called natural law.

8. The Nature of Civil Law – A law is civil or individual if individual right reason introduces and establishes it because of the necessity and welfare of the social life of some specific place. Therefore, it is called individual law or the civil law of some place. …

11. Common Law – Therefore, common law is that which has been inscribed on human hearts by nature or by God from birth and that by which human beings are moved either to act or avoid actions, whichever is sufficient for preserving the common good of human society, convicts wrongdoers of evil, or excuses the innocent.

12. The Knowledge of and Tendency toward Natural Law in Human Beings – Thus, there is a knowledge and natural inclination for this law in the human heart. Because of it, a person knows what is just and is urged by the hidden impulse of nature to do what is just and to not do what is unjust.

13. Different terms for Natural Law – This law is designated with different names. Sometimes it is called natural law. Other times, it is called the law of nature. It is also called natural reason, the silent law, the law that nature provides to the human race, the rule or law of God, or the immutable law.

14. Where the Foundations of Law Lie – Moreover, God teaches and inscribes on human hearts general principles of fairness and justice and unfairness and injustice; he binds, urges, and incites all people either to do or avoid these things; and by means of their internal consciences he accuses those who fail in these things and excuses those who do them. Therefore, he urges people toward good and calls them back from evil. If someone follows his leading to good, that person is excused. Whoever does not, he accuses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dicaeologicae libri tres, totum et universum Jus</cite>, (1618), 1.13.7-8, 11-14 in On Law and Power, trans. Jeffrey J. Veenstra (Grand Rapids MI: Christian’s Library Press, 2013), pp 8-9.</span></figcaption>

— Johannes Althusius, Dicaeologicae libri tres, totum et universum Jus, (1618), 1.13.7-8, 11-14 in On Law and Power, trans. Jeffrey J. Veenstra (Grand Rapids MI: Christian’s Library Press, 2013), pp 8-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+The+Nature+of+Natural+Law+%E2%80%93+A+law+is+natural+and+common+if+common+reason+produces+it+for+the+common+necessity+and+welfare+of+human+social+life+in+general.+Therefore%2C+it+is+called+natural+law.%0A%0A8.+The+Nature+of+Civil+Law+%E2%80%93+A+law+is+civil+or+individual+if+individual+right+reason+introduces+and+establishes+it+because+of+the+necessity+and+welfare+of+the+social+life+of+some+specific+place.+Therefore%2C+it+is+called+individual+law+or+the+civil+law+of+some+place.+%E2%80%A6%0A%0A11.+Common+Law+%E2%80%93+Therefore%2C+common+law+is+that+which+has+been+inscribed+on+human+hearts+by+nature+or+by+God+from+birth+and+that+by+which+human+beings+are+moved+either+to+act+or+avoid+actions%2C+whichever+is+sufficient+for+preserving+the+common+good+of+human+society%2C+convicts+wrongdoers+of+evil%2C+or+excuses+the+innocent.%0A%0A12.+The+Knowledge+of+and+Tendency+toward+Natural+Law+in+Human+Beings+%E2%80%93+Thus%2C+there+is+a+knowledge+and+natural+inclination+for+this+law+in+the+human+heart.+Because+of+it%2C+a+person+knows+what+is+just+and+is+urged+by+the+hidden+impulse+of+nature+to+do+what+is+just+and+to+not+do+what+is+unjust.%0A%0A13.+Different+terms+for+Natural+Law+%E2%80%93+This+law+is+designated+with+different+names.+Sometimes+it+is+called+natural+law.+Other+times%2C+it+is+called+the+law+of+nature.+It+is+also+called+natural+reason%2C+the+silent+law%2C+the+law+that+nature+provides+to+the+human+race%2C+the+rule+or+law+of+God%2C+or+the+immutable+law.%0A%0A14.+Where+the+Foundations+of+Law+Lie+%E2%80%93+Moreover%2C+God+teaches+and+inscribes+on+human+hearts+general+principles+of+fairness+and+justice+and+unfairness+and+injustice%3B+he+binds%2C+urges%2C+and+incites+all+people+either+to+do+or+avoid+these+things%3B+and+by+means+of+their+internal+consciences+he+accuses+those+who+fail+in+these+things+and+excuses+those+who+do+them.+Therefore%2C+he+urges+people+toward+good+and+calls+them+back+from+evil.+If+someone+follows+his+leading+to+good%2C+that+person+is+excused.+Whoever+does+not%2C+he+accuses.%E2%80%9D%0A%0A%E2%80%94+Johannes+Althusius%2C+Dicaeologicae+libri+tres%2C+totum+et+universum+Jus%2C+%281618%29%2C+1.13.7-8%2C+11-14+in+On+Law+and+Power%2C+trans.+Jeffrey+J.+Veenstra+%28Grand+Rapids+MI%3A+Christian%E2%80%99s+Library+Press%2C+2013%29%2C+pp+8-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F323089a77f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/323089a77f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/16/johannes-althusius-on-natural-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Since Thou hast commanded us to pray for kings and princes, and for all who are placed in authority, we pray, among others, for those governments whose theological professors are present in this solemn ecclesiastical assembly, as well as for those who are yet expected; and for his royal majesty of Great Britain, James I, who is a courageous and conscientious protector of the true faith. We pray for his son-in-law, the illustrious Prince Elector of the Roman Empire and Palatinate on the Rhine, and for the Chief Magistrate of the Empire. We pray for the illustrious Duke and Elector of Brandenburg, for the illustrious Count of Hesse, for the United Cantons in Switzerland, for the high-borne counts of Nassau and Wetteravia, and for the honourable and worthy Council, the Republics of Geneva, Bremen, and Emden.

Especially we pray for those whom Thou hast placed over us in the Reformed Netherlands: for the exalted lords the States General, and for their exalted deputies to this Synod; for the illustrious and warlike hero, the Prince of Orange, and for the entire house of Nassau; for the noble-minded lords states of Holland and West Friesland; for the most wise noble-minded lords, the Presidents and Counselors of both of the Courts of Justice; and for the respectable Council of this city, the Lord Sheriff, Mayor, Aldermen, and the eight judges.

Grant that each and every one of them might serve Thee with reverence and rejoice with trembling. Confirm their scepter and secure their throne in ever-increasing measure, that they might remain faithful, nurturing fathers of Thy church in these regions.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a14377ed13" data-kw="">
<blockquote><p>That doctrine which maintains a change of the substance of bread and wine, into the substance of Christ&#x27;s body and blood (commonly called transubstantiation) by consecration of a priest, or by any other way, is repugnant, not to Scripture alone, but even to common sense, and reason; overthroweth the nature of the sacrament, and hath been, and is, the cause of manifold superstitions; yea, of gross idolatries.</p></blockquote>
<figcaption>— <a href="../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 29.6</figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/presence-of-christ.html">Presence of Christ</a> › <a href="../topics/the-lords-supper/presence-of-christ/against-transubstantiation.html">Against transubstantiation</a></span><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a> › <a href="../topics/the-lords-supper/the-mass/adoration-of-the-host.html">Adoration of the host</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/transubstantiation.html">Transubstantiation</a></span></div>

<main class="wrap"><figure class="quote" id="q-a78acd081f" data-kw="">
<blockquote><p>‘Whether water is to be used for baptizing? It is affirmed. Whether by urgent necessity, in the place of water some other liquor may be allowed, yet such as by which the body is washed, so whether by wine, rose water, milk, etc.? An absurd question. … Whether, if an infant is languishing and water is not present, it may be allowed to baptize with body lotion [etc.]… not differing much from water? An absurd question. For the rest, see in the Ecclesiastical Politics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, … (Utrecht, 1643), 2nd Section, ‘Of Redemption’, Tract 5, ‘Of Signs’, VII. ‘Of the Sacraments’, 4. ‘Of Baptism’, ‘On the Elements, Rites &amp; Circumstances of Baptism’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘Whether water is to be used for baptizing? It is affirmed. Whether by urgent necessity, in the place of water some other liquor may be allowed, yet such as by which the body is washed, so whether by wine, rose water, milk, etc.? An absurd question. … Whether, if an infant is languishing and water is not present, it may be allowed to baptize with body lotion [etc.]… not differing much from water? An absurd question. For the rest, see in the Ecclesiastical Politics.”

— Gisbertus Voetius, A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations… (Utrecht, 1643), 2nd Section, ‘Of Redemption’, Tract 5, ‘Of Signs’, VII. ‘Of the Sacraments’, 4. ‘Of Baptism’, ‘On the Elements, Rites &amp; Circumstances of Baptism’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Whether+water+is+to+be+used+for+baptizing%3F+It+is+affirmed.+Whether+by+urgent+necessity%2C+in+the+place+of+water+some+other+liquor+may+be+allowed%2C+yet+such+as+by+which+the+body+is+washed%2C+so+whether+by+wine%2C+rose+water%2C+milk%2C+etc.%3F+An+absurd+question.+%E2%80%A6+Whether%2C+if+an+infant+is+languishing+and+water+is+not+present%2C+it+may+be+allowed+to+baptize+with+body+lotion+%5Betc.%5D%E2%80%A6+not+differing+much+from+water%3F+An+absurd+question.+For+the+rest%2C+see+in+the+Ecclesiastical+Politics.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+A+Syllabus+of+Theological+Problems%2C+which%2C+for+the+Needed+Thing+to+be+Proposed+or+Pressed%2C+are+Accustomed+to+be+Used+in+Private+%26+Public+Exercises+of+Disputations%2C+Examinations%2C+Gatherings+%26+Consultations%E2%80%A6+%28Utrecht%2C+1643%29%2C+2nd+Section%2C+%E2%80%98Of+Redemption%E2%80%99%2C+Tract+5%2C+%E2%80%98Of+Signs%E2%80%99%2C+VII.+%E2%80%98Of+the+Sacraments%E2%80%99%2C+4.+%E2%80%98Of+Baptism%E2%80%99%2C+%E2%80%98On+the+Elements%2C+Rites+%26+Circumstances+of+Baptism%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa78acd081f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a78acd081f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sacraments-in-extra-ordinary-circumstances/#:~:text=Whether%20water%20is%20to%20be%20used,rest%2C%20see%20in%20the%20Ecclesiastical%20Politics&amp;text=Whether%20water%20is%20to%20be%20used%20for%20baptizing&amp;text=For%20the%20rest%2C%20see%20in%20the%20Ecclesiastical%20Politics" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76a94a8e0b" data-kw="">
<blockquote><p>The women’s preparation, verse 20, ‘And Miriam the prophetess the sister of Aaron, took a timbrel in her hand, and all the women went out after her with timbrels and dances’… Question. Is this practice now imitable in the Church? Answer: No, for:

1. This was done by a prophetical and extraordinary instinct.

2. It was a service suitable to that legal constitution at that time.

3. The Gospel only requires spiritual sacrifices of praise and singing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hughes.html">George Hughes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of the Whole First Book of Moses, called Genesis</cite>, … (1672), on Ex. 15, verse 20</span></figcaption>

</figure><figure class="quote" id="q-d051acd45b" data-kw="">
<blockquote><p>As for your [Gilbert Burnet’s] demand, why in your worship [that of the Scottish non-cponformists] do you not kiss one another with a holy kiss? Seing it is nowhere commanded in worship, as you seem boldly and ignorantly to suppose, and the Christian manner of the thing, in customary civility, is only recommended by the apostle, as an allay of chastity and kindnesse in civil rencounters, the question is but a petulant extravagancy of your vain imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117</span></figcaption>

</figure><figure class="quote" id="q-90cb9f2deb" data-kw="">

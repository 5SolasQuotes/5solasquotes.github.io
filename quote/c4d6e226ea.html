<main class="wrap"><figure class="quote" id="q-c4d6e226ea" data-kw="">
<blockquote><p>So then in this article [of the Creed] we confess that all the faithful dispersed throughout the whole compass of the earth, and they also that at this time live in Heaven, as many, I say, as are already saved, or shall even until the very end of the world be born to be saved, are one body, having gotten fellowship and participation with God and a mutual communion among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, p. 162</span></figcaption>

</figure><figure class="quote" id="q-e792054384" data-kw="">
<blockquote><p>How vast the fellowship! With the saints of all ages in the past! With the saints of all ages in the future! With the church eternal in glory! How comforting! We are not alone in our work, in our trials, in our hopes! Millions uncounted have been working for us, praying for us, rejoicing over us! Millions uncounted of hearts are now beating in unison with ours! Millions uncounted are to follow us, for whom we are even now transmitting the riches of grace.</p></blockquote>

</figure><figure class="quote" id="q-6549f3b241" data-kw="">
<blockquote><p>There is now no national membership in the Church of Christ, limited to one hereditary family or favored race; but in the fellowship of one faith and one spirit, all, of whatever tribe or tongue or nation, are one with Christ, and one with each other. The narrow barriers of former economy have been thrown down; and in the gift of the Spirit to all believers, and in the fellowship of the Spirit coextensive with all, there is laid the foundation of a Church, no longer confined to one nation as before under the law, but worldwide and universal… Earthly and outward causes of separation are overborne and controlled by this higher principle of unity. Separation in race or tongue is no separation to be accounted of among the followers of Christ, who are joined together in that one Spirit. Distance on the earth is no distance to be regarded between those who are partakers together of the same Holy Ghost. Local churches or societies, divided in place and outward worship, become merged in the oneness of a higher fellowship. Separated in the outward act of worship, they are joined in the communion of the same Spirit. The assemblies of Christians in every quarter of the globe, who worship God in sincerity and truth, are one in such a sense as their distance from one another admits of; and they must all be regarded as branches of the universal Church of Christ throughout the world, the great community of believers, separated by distance and kindred and tongue, who cannot meet together in the body, but who really meet together in the Spirit. The invisible Church of Christ on earth is local, but it is also catholic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ... (Edinburgh: T&amp;T Clark, 1868), vol. 1, pt. 1, ‘Nature of the Church’, ch. 4, ‘The Church in its Twofold Character as Catholic &amp; Local’, pp. 43-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-c4f841cb25" data-kw="">
<blockquote><p>Now this communion consists in the following things, 1st, That having one God and one Savior, and animated by the same Spirit, they constitute one body, whose parts are indeed widely separated from each other with regard to distance of local situation, but maintained in close mutual connection by the same Spirit of Christ. 2ndly, That the souls of the blessed, although they be entirely ignorant of the particular persons of believers on earth, and of their necessities, yet by their earnest prayers unite with us in soliciting, and, so to speak, accelerating, the day of the complete redemption of the Church; whilst the saints on earth are associated with those in heaven, in spirit, affection, and desire, having their conversation in heaven. XLV. But we are chiefly to attend to the communion which believers have with each other on the earth… 1st, That intimate union, by which, how far removed soever as to place, they are mutually joined together by the Spirit; not merely as brethren, but, what we have already often inculcated, as members of one mystical body… That we recognize and celebrate the admirable power of God, which unites believers of every nation, age, condition and sex, often separated from one another by such vast intervening spaces of land and sea, of such disimilar capacities and tempers, and engaged in such diversified pursuits; and so closely conjoins them by one Spirit, that they most harmoniously concur in the same sentiments and feelings respecting God and Christ, and in the same devout prayers and praises, and discern in each other, with mutual congratulation and applause, the same effects of the same divine grace; so that, even at their first meeting, a most delightful interchange of love arises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser (1681; Glasgow, 1823), vol. 2, Dissertation 24, ‘On the Church &amp; the Communion of Saints…’, pp. 380-81</span></figcaption>

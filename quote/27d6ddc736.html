<main class="wrap"><figure class="quote" id="q-27d6ddc736" data-kw="">
<blockquote><p>Having my warrant therefore out of the word of God, I dare boldly avow, that those kings shall flourish and be in happy case, which wholly give and submit themselves and their kingdoms to Jesus Christ, the only-begotten Son of God, being King of kings, and Lord of lords; acknowledging him to be the mightiest prince and monarch of all, and themselves his vassals, subjects, and servants: which, finally, do not follow in all their affairs their own mind and judgment, the laws of men that are contrary to God’s commandments, or the good intents of mortal men; but do both themselves follow the very laws of the mightiest king and monarch, and also cause them to be followed throughout all their kingdom, reforming both themselves and all theirs at and by the rule of God’s holy word. For in so doing the kingdom shall flourish in peace and tranquillity, and the kings thereof shall be most wealthy, victorious, long-lived, and happy. For thus speaketh the mouth of the Lord, which cannot possibly lie: “When the king sitteth upon the seat of his kingdom, he shall take the book of the law of God, that he may read in it all the days of his life, that he may do it, and not decline from it either to the right hand or to the left; but that he may prolong the days in his kingdom both of his own life and of his children.” [Deuteronomy 17] And again, “Let not the book of this law depart out of thy mouth,” (Josue [sic], or thou, whatsoever thou art that hast a kingdom), “but occupy thy mind therein day and night, that thou mayest observe and do according to all that is written therein: for then shalt thou make thy way prosperous, and then shalt thou be happy.” It is assuredly true, therefore, confirmed by the testimony of the most true God, and in express words pronounced, that the prosperity of kings and kingdoms consisteth in true faith, diligent hearing, and faithful obeying the word or law of God: whereas their calamity and utter overthrow doth follow the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), ii, 4-5.</span></figcaption>

</figure><figure class="quote" id="q-6bc1d79ef0" data-kw="">
<blockquote><p>Engaged in the very same conflict by which Christ acquired his own sense of infirmity, they may rest assured that he can thoroughly appreciate theirs. With what kind or degree of infirmity can they be tried of which he had not experience? Toil, pain, poverty, disappointment, reproach and calumny, the strife of tongues, the violence of hostile deeds, oppression, mockery, murder, were his portion more than any man’s.

His tender feelings were wounded by the death of friends—by the anguish of a mother with the sword in her soul—by the treachery of false disciples—by the desertion, in his time of utmost need, of those who were sincerely devoted to him—by the eternal ruin of many whom “beholding he loved,” and amongst them his own unbelieving kindred.

The mysterious powers of hell were let loose upon him. The hand of God touched him. These things, and more, came upon him lo the uttermost. “He was tempted in all points even as we are.” Then what could we wish for besides? He is with us to relieve every one of our afflictions with the united skill of God and of a fellowman who has experienced the same; so long as we do not willingly yield ourselves to the influences of sin, but are found like good soldiers enduring hardness for his sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-maclagan.html">James Maclagan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sympathy of Christ in Reformed Presbyterian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>45. The second difference [between civil and church power] is in the object, or matter about which: The power politic or civil is occupied about the outward man and civil or earthly things, about war, peace, conservation of justice and good order in the commonwealth; also about the outward business or external things of the Church, which are indeed necessary to the Church, or profitable, as touching the outward man, yet not properly and purely spiritual, for they do not reach unto the soul, but only to the external state and condition of the ministers and members of the Church.

46. For the better understanding whereof, tis to be observed that so far as the ministers and members of the Church are citizens, subjects or members of the commonwealth, it is in the power of the Magistrate to judge, determine and give sentence concerning the disposing of their bodies or goods; As also concerning the maintenance of the poor, sick, the banished and of others in the Church which are afflicted; To regulate (so far as concerns the civil order) marriages, burials, and other circumstances which are common both to holy and also to honest civil societies; to afford places fit for holy assemblies and other external helps by which the sacred matters of the Lord may be more safely, commodiously and more easily in the Church performed: To remove the external impediments of divine worship or of ecclesiastical peace, and to repress those which exalt themselves against the true Church and her Ministers, and do raise up trouble against them. … 66. Fourthly, they [the Church and magistrate] differ in the[ir] end [design]: The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and counsel of judges; or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured, and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (Edinburgh, 1647), #45-46</span></figcaption>

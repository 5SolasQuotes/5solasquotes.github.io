<main class="wrap"><figure class="quote" id="q-1d7adda540" data-kw="">
<blockquote><p>Christ, as king of his church, hath appointed a government in her, and committed to office-bearers, under him, a power to execute his laws, and pronounce judgment according to them, for the preservation of order and peace, and the promoting of the interests of truth and holiness to his glory. …

The overlooking of the important ends to be served by the church as a visible society, is a capital error, or at least has been the source of many hurtful mistakes in our own, as well as in former times. Many seem to confine their views entirely to what is necessary for training up a number of individuals for eternal life; the only wise God hath combined this with the maintenance of a public cause, to the advancement of his glory on earth; and for this purpose has erected and maintains an organized and permanent association, which he has constituted the depositary of his truths, laws, and ordinances.

Those institutions which tend directly to promote personal salvation and holiness, such as the word, sacraments, and prayer, could not be preserved in purity, or practised to edification, without the external administration of laws. Church members are not all true saints; and such of them as are so, being renewed but in part, stand in need of counsel, restraint, and correction.

But there is a higher reason than even this for ecclesiastical judicature; it belongs to the administration of that kingdom which was given to Christ as Mediator, and constitutes an essential part of his glory as the lawgiver, judge, and king of the church. The divine government of the universe is conducted by laws adapted to the various orders of created beings. Though sin had not entered into our world, mankind would have lived under the external regimen of law, if there had been no other reason for it than this, that an exhibition of the moral government of God might be preserved among them.

In our law the sovereign is called the Grand Justiciar, and earthly kings, in general, rule and dispense justice in the remotest parts of their dominions, by means of the subordinate governors and judges whom they appoint. And in like manner, the authority of the church’s king is exercised, and his glory illustrated, by the instrumentality of those who, in his name, dispense his ordinances, and execute his laws. “He that heareth you, heareth me; and he that despiseth you, despiseth me; and he that despiseth me, despiseth him that sent me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>

<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that… 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word going before or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>

<blockquote><p>The analogy which I understand is to hold between the Jewish and Christian Church is this: As profane persons were forbidden to enter into the Temple because of the sacramental and typical holiness thereof (for the Temple was a type of Christ), so profane persons are now much more to be kept back from the sacrament of the Lord’s Supper, which has more of sacramental signification, mystery and holiness in it than the temple of Jerusalem had, and whereby more ample evangelical promises are set forth and sealed unto us. And as profane persons might of old come into the court of the gentiles, and there hear the Word preached in Solomon’s porch (where both Christ and his apostles did preach, Jn. 10:23; Acts 3:11; 5:12, which porch was in the utmost court, that is, the court of the gentiles: of which elsewhere out of Josephus), but might not come into the court of Israel, nor have communion in the sacrifices: so profane, obstinate sinners are to be excluded for their impiety from the Church-communion of saints, though they may hear the Word, as heathens also may do.</p></blockquote>

<blockquote><p>The Jewish subordinations, being no temple ordnances, nor typical or ceremonial, do in the moral equity of them concern us as well as them; at least we may with much more reason urge an argument, a pari ratione [from the reason of parity], from subordinations in the Jewish Church to prove a subordination still; then our brethren can argue from thence against it: For the grounds of that subordination being from moral equity; and the ends and necessity of it being the same, now as then (viz. revolving difficult cases, ordering matters of common concernment, reforming offences in inferior societies, receiving appeals, redressing of injuries and neglect in mal-administration, etc.) the same reason still remains, that for the same ends and purposes, there should be subordinations now in the Chrisitan Church that was then in the Jewish.</p></blockquote>

<blockquote><p>PATRONAGE is usually defined to be the exercise of a power of presentation to a Church, which power is held solely in virtue of some secular qualification, such as inheritance or purchase. … In a matter relating to the appointment of the office-bearers of the Church, our ultimate appeal must be “to the law and to the testimony.” Were it true, as some allege, that Scripture lays down no general principles or definite rule, for the guidance of the Church in the election of her office bearers, this matter would fall to be regulated by an enlightened regard to utility; but we trust to make it plain in the course of the following observations, that we are not left by Scripture altogether in the dark, in a matter which so nearly concerns the interests of the Church.

Amid much that is distressing and painful in the circumstances in which the Church of Scotland is now placed in its relations with the Civil Power, it is matter of sincere gratification that these very circumstances are forcing her office-bearers and members back upon first principles—constraining them to abandon all temporizing shifts and expedients, and to take their stand upon the broad and sure basis of the everlasting and unchangeable word of God.

It was a great step in advance towards right principles which the General Assembly made in 1834, when the old doctrine of Non-intrusion was asserted, and effective steps taken to have that principle carried into operation in every case of settlement. It was a still further and more gratifying advance in the same direction, when, five years thereafter, the Assembly took up the language, and resumed the tone of the ancient Assemblies of the Church, and declared the free and unfettered prerogatives which the Lord Jesus Christ, as King and Head of his Church, had conferred upon her.

It is impossible to attach too much importance to this declaration, whether we regard it merely in the light of a testimony in behalf of a great scriptural truth, or as the most healthful indication which could have been afforded, that the Church of Scotland, after a long and dreary period of defalcation, had rid herself of the notion, which lay upon her like an incubus, and paralysed her energies, that she was a mere civil corporation, existing for civil ends.

This idea, fostered under the reign of Moderatism, and forming indeed the very essence of it, had wrought most deadly mischief, not only as regarded the matter of settlement, in which the great thing to be considered was, not the “perfecting of the Saints,” but the following out of the will of the patron; but also as regarded the matter of preaching, in which the great thing to be considered was, not the winning of souls to Christ, but the rearing up of good citizens, on the basis of a cold and secular Morality.

One thing only remains, so far as regards the assertion of principles, to set the Church upon the platform of her ancient standards, and that is, to re-declare the indefeasible right of the members of the Church to elect their own office-bearers. This principle appears necessarily to flow from that of the spiritual independence of the Church, and it is practically one of the most important consequences which result from it.</p></blockquote>

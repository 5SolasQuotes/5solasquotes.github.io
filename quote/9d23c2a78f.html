<main class="wrap"><figure class="quote" id="q-9d23c2a78f" data-kw="">
<blockquote><p>That our Conversations must be such as is beyond such as live under the Law, for the Law of God goes higher than the light of Nature, for there’s more revealed there than in the light of Nature. It’s true, that that you call the moral Law, the light of Nature, if it be clear it is suitable to it, to the most part of it, only there is some part that is positive, but most part is but suitable to the principles of Nature if they were clear and pure; but now because, since the fall of Man, the light of Nature is darkened, and the principles of Nature are much corrupted, therefore God hath given His Law, that is as it were a glass of His Will, that is, the clear glass of what was written in the heart of man in Innocence, that’s the Law: Only there is that of the limitation of the seventh Day particularly from the Creation that hath somewhat positive in it, but take all the other and (I say) it is nothing but as a glass of what was written in the heart of man in the time of Innocency:

There was written in man’s heart to keep some solemn time for the worship of God, only the specification was by revelation, but the substance of all those ten Commandments (I say) is the glass of what was written in the heart of man in Innocency: And because God saw that this writing was so much blotted out, almost all obliterated, therefore God wrote it in Tables of stone, whereas it was written in the Table of man’s heart at first; But now when He comes to bring men to the Gospel there He writes over that Law again in the Tables of their hearts: At first it was written in the heart of Adam, but he falling, doth blot it out in a great measure, then God writes it over fair again, but how? He writes it over in a fair Copy, but it is in Tables of stone: but when God receives any soul in the Gospel He writes it over again in the Tables of their hearts[.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), p. 41.</span></figcaption>

</figure><figure class="quote" id="q-09a8066301" data-kw="">
<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects.

1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ.

2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction.

3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), pp. 12-14</span></figcaption>

</figure><figure class="quote" id="q-42eb1b733f" data-kw="">
<blockquote><p>And as touching the binding power of their [magistrates’] laws, be they never so just, they cannot bind you any other way, nor [except] in respect of the general end of them: For per se they cannot bind more than the Churches’ laws can. Which things Dr. Forbes also has told you out of Calvin [Irenicum, bk. 2, ch. 4, §3]. And hence it follows, that whensoever you may omit that which princes enjoin, without violating the law of charity, you are not holden to obey them, [even] for the majesty of princely authority. … whatsoever princes can commendably either do by themselves, or command to be done by others in such matters as anyway pertain to the external worship of God, must be both lawful in the nature of it, and expedient in the use of it, which conditions if they be wanting [lacking], their commandments cannot bind to obedience. … 3. We are bound by the Law of God to do nothing which is not good and profitable or edifying, 1 Cor. 6:12 &amp; 14:26. This Law of Charity is of a higher and straighter bound than the Law of any prince in the world… Therefore it is most necessary as well for princes to permit, as for subjects to take liberty to try and examine by the judgement of discretion, everything which authority enjoins whether it be agreeable or repugnant to the rules of the Word, and if after trial it be found repugnant to abstain from the doing of the same.</p></blockquote>

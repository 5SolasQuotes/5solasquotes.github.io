<blockquote><p>Moreover, [Iain] Murray thinks God’s universal love necessarily entails that God desires the highest good (i.e. the eternal salvation) of all men in the revealed will… this also answers the Gillite [from John Gill] position that God loves all merely in a temporal sense, but doesn’t desire their highest good, or in the sense of their eternal salvation.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0496fb5986" data-kw="">
<blockquote><p>The Reformed, although they do not at all deny that words that express affections, just as words that express body parts, are employed to speak of God in the Scriptures, and although likewise they acknowledge that when every imperfection is removed from the affections, the substance of those words is in God, even so do not dare to allow in God these disturbances, in which almost the whole nature of affections consists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB) | section 32, ‘5. Do affections properly belong to God?’, vol. 2, bk. 2, ch. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-9de6a468f0" data-kw="">
<blockquote><p>Device [of Satan] (4). By suggesting to a sinner Christ’s unwillingness to save. It is true, says Satan, Christ is able to save you, but is He willing? Surely, though He is able, yet He is not willing to save such a wretch as you are, that has trampled his blood under your feet, and that has been in open rebellion against Him all thy days, etc. The remedy against this device of Satan is, briefly to consider these few things: Remedy (1). First, The great journey that He has taken, from heaven to earth, on purpose to save sinners, does strongly demonstrate his willingness to save them. Mt. 9:13, ‘I came not to call the righteous, but sinners to repentance.’ 1 Tim. 1:15, ‘This is a faithful saying, and worthy of all acceptation, that Jesus Christ came into the world to save sinners, of whom I am chief.’ Secondly, His divesting Himself of his glory in order to sinners’ salvation, speaks out his willingness to save them. He leaves his Father’s bosom, He puts off his glorious robes, and lays aside his glorious crown, and bids adieu to his glistering courtiers the angels; and all this He does, that He may accomplish sinners’ salvation. Thirdly, That sea of sin, that sea of wrath, that sea of trouble, that sea of blood that Jesus Christ waded through, that sinners might be pardoned, justified, reconciled and saved does strongly evidence his willingness to save sinners, 1 Cor. 5:19,20. Fourthly, His sending his ambassadors, early and late, to woo and entreat sinners to be reconciled to Him, does with open mouth show his readiness and willingness to save sinners. Fifthly, His complaints against such as refuse Him, and that turn their backs upon Him, and that will not be saved by Him, does strongly declare his willingness to save them: Jn. 1:11, ‘He came to his own, and his own received Him not.’ So in Jn. 5:40, ‘But ye will not come to me, that ye may have life.’ Sixthly, The joy and delight that He takes at the conversion of sinners, does demonstrate his willingness that they should be saved: Lk. 15:7, ‘I say unto you, That likewise joy shall be in heaven over one sinner that repents, more than over ninety and nine just persons that need no repentance.’ God the Father rejoices at the return of his prodigal son: Christ rejoices to see the travail of his soul: the Spirit rejoices that He has another temple to dwell in…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 1, Precious Remedies Against Satan’s Devices, Appendix, pp. 146-48</span></figcaption>

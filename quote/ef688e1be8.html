<blockquote><p>Doct. 2. By virtue of this [seventh] command we are bound to study all cleanness of soul and body, that belongs unto procreation.

This is commanded in the same words, that the contrary faults are forbidden by, according to the constant use of speech in the decalogue.

Reas. 1. Because this cleaness is a part of our inward sanctification.

Reas. 2. Because from this part of our sanctification a special sort of honour ariseth, 1 Thes. 4. 4. While our bodies are not made drudges for the fulfilling the base and vile affections of the flesh, but are applied unto nobler uses.

Reas. 3. Because this purity is needful, that we may be fit to worship God, as we should. For carnal impurity where it prevails and gets the dominion, it not only presses down and burthens the mind, so that it cannot raise up it self unto spiritual thoughts and affections, but also it infecteth with contagion, and pollutes those very thoughts and endeavours, whereby we seek after and breath for spiritual life.

Use, Of Admonition, that we indulge not, nor allow the inclinations of our corrupt natures in these things, nor suffer our selves to be carried away with the evil manners and examples of the vulgar sort, who in this kind, are more beasts often, than Christians; but let us always be thinking, how we may keep our selves clean, as well from these lusts of the flesh, as from other sins: This cleanness is maintained by modesty and temperance. Modesty is herein kept, if neither by words, nor by gestures, nor by any other such way, we uncover as it were without reverence, what nature tells us should be covered and hid, and be ashamed of the uncovering. Temperance or sobriety consists in the keeping a moderation or measure in the pleasures of the flesh or body, especially in meat and drink.

The cleanness or chastity, as to the diversity of manner, is divided into chastity of single life, and chastity of marriage. For marriage is appointed now since the fall, by God, to be a means of keeping this cleanness or chastity, in things that belongs to the generation of mankind. We ought therefore to have a care, 1. That we so marry as that it be in such cleanness; that is, with such a person, in such a manner, for such an end, that from a good conscience it may be said, that the contract or bargain was made in the Lord, and in his fear. 2. That it be used and exercised in this cleanness; that is, that neither the end of it may be broken, nor it self be drawn beyond the bounds of modesty and temperance; nor that it be any way from a remedy of sin and lust, turned into a cover for uncleanness and wantonness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XLI, pp 249-51.</span></figcaption>

<blockquote><p>He loved us in our creation, for he made us men, but more in our redemption, for he made us saints: he created us with a word of his mouth, he redeemed us by the blood of his son: he created us when we were nothing, he redeemed us when we were worse then nothing: he created us to live before him on earth, he redeemed us to live with him in heaven. He created us, and so did he others, he redeemed us, but did not redeem others. He hath not dealt so with every nation, neither have the heathen knowledge of his laws.

If there were in us, either Nobility of birth, or comeliness of beauty, or correspondence of virtue, or abundance of riches, our God might love &amp; like us for these, as men do affect and follow us for these. But since, by descent we are Canaanites, by deformity polluted in our own blood, by sin, there is none that doth good, no not one, &amp; that our poverty is such, that we are poor, naked, and miserable creatures, it is not our old birth, but the new birth, not our own beauty, but God’s bounty, not our virtue, but God’s grace, not our goods, but God’s goodness, by which we become God’s children.</p></blockquote>

<blockquote><p>Moreover, as God is to be felt sensibly in every man’s conscience, so is he to be seen visibly, if I may so speak, in the creation of the world, and of all things therein contained; for that this world had a beginning, all the excellent philosophers that ever were, have agreed, except Aristotle for a time, who held a fancy, that this world had no beginning, but was from all eternity but at last in his old age, he confessed and held the contrary, in his book De Mundo, which he wrote to king Alexander (which book Justin Martyr esteemed greatly, and called it the epitome of all Aristotle’s true philosophy). This then being so, that the world had a beginning, it must needs follow, that it had an efficient cause or maker thereof. I demand, then, who it was that made it? If you say it made itself, it is absurd; for how could it make itself before itself was made, and when it had no being at all?

If you say that something within the world made the world, that is, that some one part of the world made the whole, that is more absurd; for it is as much as if a man should say that the finger (and this before it was a finger or part of the body) did make the whole body. Wherefore it may be convinced by force of this argument (which is plainly demonstrative), that a greater and more excellent thing than is the whole world put together, yea, that something which was before heaven and earth were made, was and must needs be the maker and framer of this world; and this can be nothing else but God, the creator of all things, who was before all his creatures, and is termed in the sacred writings, ‘Alpha and Omega, the first and the last,’ for that he only was without beginning himself, and shall be and remain without ending. For he is eternal, being the primus motor; and the only Almighty Creator of all things.

So true it is which Paul the apostle doth testify, when he saith, that ‘the invisible things of God (that is, his eternal power and divine essence), are seen perfectly in the creation of the world, being perceived by his works which he hath made,’ Rom. i. 20. If, therefore, men would but cast up their eyes to heaven, and from thence look down again upon the earth, and so behold the excellent beauty and building of this world, they cannot be so sottish or dull conceited, but they must know there was and is a God, which was the maker of them; and be moved in some sort to glorify so incomparable and excellent a Creator.

Yea, the poets and others have affirmed of God, that he is Pater hominum, the Father of men, to shew that men have their original and creation from him; so that if we should draw our eyes from the beholding of the great world, and consider but man (who for his beauty and excellency is called in Greek Microcosmos, the little world), still we shall be enforced to acknowledge God the author of us, the Father and Creator of us.

So true is that which Paul the apostle noteth out of the poet Aratus, which saith that ejus progenies sumus, we are the issue or offspring of God, Acts xvii. 29. And as true it is, which he further saith in that place, that ‘in him we live, move, and have our being.’ And therefore we owe all dutiful obedience and subjection unto him, which duty and nature commands us to perform in regard of our creation. For the son honoureth his father by natural duty, and all men are naturally carried to be grateful to their founders, to whom they are specially bound, a.nd whom they ought not to forget, neither will, except they be extreme unthankful and dissolute.</p></blockquote>

ngs%2C+%E2%80%98Alpha+and+Omega%2C+the+first+and+the+last%2C%E2%80%99+for+that+he+only+was+without+beginning+himself%2C+and+shall+be+and+remain+without+ending.+For+he+is+eternal%2C+being+the+primus+motor%3B+and+the+only+Almighty+Creator+of+all+things.%0A%0ASo+true+it+is+which+Paul+the+apostle+doth+testify%2C+when+he+saith%2C+that+%E2%80%98the+invisible+things+of+God+%28that+is%2C+his+eternal+power+and+divine+essence%29%2C+are+seen+perfectly+in+the+creation+of+the+world%2C+being+perceived+by+his+works+which+he+hath+made%2C%E2%80%99+Rom.+i.+20.+If%2C+therefore%2C+men+would+but+cast+up+their+eyes+to+heaven%2C+and+from+thence+look+down+again+upon+the+earth%2C+and+so+behold+the+excellent+beauty+and+building+of+this+world%2C+they+cannot+be+so+sottish+or+dull+conceited%2C+but+they+must+know+there+was+and+is+a+God%2C+which+was+the+maker+of+them%3B+and+be+moved+in+some+sort+to+glorify+so+incomparable+and+excellent+a+Creator.%0A%0AYea%2C+the+poets+and+others+have+affirmed+of+God%2C+that+he+is+Pater+hominum%2C+the+Father+of+men%2C+to+shew+that+men+have+their+original+and+creation+from+him%3B+so+that+if+we+should+draw+our+eyes+from+the+beholding+of+the+great+world%2C+and+consider+but+man+%28who+for+his+beauty+and+excellency+is+called+in+Greek+Microcosmos%2C+the+little+world%29%2C+still+we+shall+be+enforced+to+acknowledge+God+the+author+of+us%2C+the+Father+and+Creator+of+us.%0A%0ASo+true+is+that+which+Paul+the+apostle+noteth+out+of+the+poet+Aratus%2C+which+saith+that+ejus+progenies+sumus%2C+we+are+the+issue+or+offspring+of+God%2C+Acts+xvii.+29.+And+as+true+it+is%2C+which+he+further+saith+in+that+place%2C+that+%E2%80%98in+him+we+live%2C+move%2C+and+have+our+being.%E2%80%99+And+therefore+we+owe+all+dutiful+obedience+and+subjection+unto+him%2C+which+duty+and+nature+commands+us+to+perform+in+regard+of+our+creation.+For+the+son+honoureth+his+father+by+natural+duty%2C+and+all+men+are+naturally+carried+to+be+grateful+to+their+founders%2C+to+whom+they+are+specially+bound%2C+a.nd+whom+they+ought+not+to+forget%2C+neither+will%2C+except+they+be+extreme+unthankful+and+dissolute.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+God%E2%80%99s+Arrow+Against+Atheism+and+Irreligion%2C+%281593%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A+368-70.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc251b7ec41.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c251b7ec41.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/12/henry-smith-on-the-argument-from-creation-for-the-existence-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4b53c8f067" data-kw="">
<blockquote><p>Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate.</p></blockquote>

</figure><figure class="quote" id="q-c5d6acafa6" data-kw="">
<blockquote><p>The majority of the Reformed state that they [the angels] were created on the first day, with the empyrean heaven (Gen. 1:1 with 2:1). At least that they were created before the creation of the earth seems to be spoken of clearly enough in Job 38:7. Yet that they preexisted or could have preexisted this whole world they constantly deny, because: (1) Scripture has not even one whit of it; in fact rather, in the six days was created the whole world, with all its host (Gen. 2:1–2), through which angels are signified (Luke 2:13, 15), and also, all things which are contained in the world were created in the six days (Ex. 20:11).

(2) Before the world there was nothing except eternity, and according to the style of Scripture, to be from eternity, and to be before the foundations of the world were laid, have the same force (Ps. 90:2; Prov. 8:22; Eph. 1:4; 1 Peter 1:20; John 17:24; Acts 15:18). Reason assists here, because (3) before the beginning of time there was nothing except sheer eternity, in which there is no before and after; therefore, from the contrary hypothesis, the angels would be in eternity and eternal, and thus infinite in duration, existence, and essence, which is proper to God alone. (4) Every creature, being finite, is bounded by its own where, such that whatever is not in a where is nowhere, and thus does not exist at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man</cite>, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.7.24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

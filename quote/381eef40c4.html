<blockquote><p>The greatest of the philosophers was John Duns Scotus, but there were others such as John Ireland, John Mair of Haddington and George Lokert of Ayr. Focusing on the concepts of will, intellect and faith… Broadie investigates the philosophy of these men and the relationships between their ideas. He places them within the framework of the medieval dispute between nominalists and realists which so characterised philosophy and theology in the Middle Ages. Scotus’ account of the primacy of will over intellect was demonstrably influenced by his Franciscan inheritance.” – Blurb . 2000’s A Companion to the Theology of John Mair eds. John T. Slotemaker &amp; Jeffrey C. Witt (Brill, 2015) 390 pp. ToC This work discusses the legacy of Scotus. . . In the Post-Reformation General Article Hoenen, Maarten J.F.M. – ‘Scotus &amp; the Scotist School: the Tradition of Scotist thought in the Medieval &amp; Early Modern Period’ in John Duns Scotus (1265/6–1308): Renewal of Philosophy, ed. Egbert P. Bos (Amsterdam: Rodopi, 1998), pp. 197-210 . Book Burton, Simon J.G. – Ramism &amp; the Reformation of Method: The Franciscan Legacy in Early Modernity in Oxford Studies in Historical Theology (Oxford Univ. Press, 2024) Blurb: “Reveals the deep roots of Ramism in medieval and Renaissance thought and its connection to a wider Franciscan reformation of method.</p></blockquote>

<blockquote><p>As I have emphasized, the Aristotelian position acknowledges that sensory experience, mental imagery, emotion, and other mental attributes we share with non-human animals are entirely corporeal or bodily. It also holds that the intellect depends on the senses, and thus the body and brain, for informational input. It also holds that the intellect depends on the senses, and thus the body and brain, for informational input. Moreover, the Aristotelian allows that even when concepts have been abstracted from mental imagery, the intellect still, in the normal course of things, makes use of imagery when entertaining even the most abstract ideas and lines of reasoning. That too depends on brain activity. And it cannot be emphasized too strongly that these are not concessions the Aristotelian has been forced to make in light of modern neuroscientific findings. On the contrary, these are things that Aristotelians have been saying for centuries. Hence there is nothing in what modern neuroscience has discovered about the mind that need be remotely troubling to the Aristotelian. Indeed it is precisely the sort of thing Aristotelian philosophy of mind would lead us to expect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 3, ‘What is a human being?’ | ch. 9, ‘Neither computers nor brains’, ‘Arguments from neuroscience’, p. 440</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>

<blockquote><p>Another issue concerned substantial forms. Here, Voetius and others defended a neo-Aristotelian concept because they found it to be more compatible with the Physica Mosaica [Mosaic physics] than early modern alternatives. The substantial forms could not only explain the classification of ‘kinds’ in the biblical creation account, but also constituted the internal principles of activity in secondary causes. In contrast, the Cartesian mechanistic worldview with its rejection of substantial form seemed to create more difficulties than it might solve. In particular, it implied a denial of genuine secondary causality, leading either to occasionalism or Spinozistic pantheism, as Voetius noted with remarkable foresight (Van Ruler 1995; Goudriaan 2006, 113-33; Beck 2007, 65-69).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-beck.html">Andreas Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘God, Creation &amp; Providence in Post-Reformation Reformed Theology’, p. 206 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Another issue concerned substantial forms. Here, Voetius and others defended a neo-Aristotelian concept because they found it to be more compatible with the Physica Mosaica [Mosaic physics] than early modern alternatives. The substantial forms could not only explain the classification of ‘kinds’ in the biblical creation account, but also constituted the internal principles of activity in secondary causes. In contrast, the Cartesian mechanistic worldview with its rejection of substantial form seemed to create more difficulties than it might solve. In particular, it implied a denial of genuine secondary causality, leading either to occasionalism or Spinozistic pantheism, as Voetius noted with remarkable foresight (Van Ruler 1995; Goudriaan 2006, 113-33; Beck 2007, 65-69).”

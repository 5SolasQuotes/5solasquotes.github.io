<main class="wrap"><figure class="quote" id="q-4c8f9f5b3c" data-kw="">
<blockquote><p>The law in general, is that part of God’s Word, which commands things just, honest, and godly, and being thus conceived, it is threefold: ceremonial, judicial, and moral. The ceremonial law, is that part of God’s Word, which prescribed to the Jews, ceremonies, rites, and orders, to be performed in the worship of God. This law is laid down in the books of Moses, especially in Leviticus. The judicial law, is that part of God’s Word, which prescribed ordinances for the government of the Jews’ commonwealth, and the civil punishment offenders. The ceremonial law concerned the Jews only. The judicial law did indeed principally concern them, but yet so far forth as it tends to the establishing of the moral law, having in it common equity,* it concerns all people, in all times and places. What the moral law is, I will describe in three points: first, it is that part of God’s Word, concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature, in regard whereof, it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection, and outward in speech and action. Thirdly, it binds to the curse and punishment everyone that fails in the least duty thereof, though but once, and that in thought only: ‘Cursed is every one that continueth not in all things that are written in the law to do them’ (Gal. 3:10). The sum of the moral law is propound in the Decalogue or Ten Commandments, which many can repeat, but few do understand. That we may further conceive aright the moral law, we must make a difference between it and the gospel, for the gospel is that part of the Word which promises righteousness and life everlasting to all that believe in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, (1:243–44).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>4. Distinguish between the Moral, and Ceremonial, and Judicial Law: [1.] The first concerns manners, and the right ordering of a godly conversation; and because these things are of perpetual equity and rectitude, the obligation of this Law as to that is perpetual; and therefore in the expounding of it, these two terms, Moral, and of Perpetual Authority, are all one, and to be taken so.

2. The Judical Law is for regulating outward society, and for government, and does generally (excepting what was peculiar to the people of Israel) agree with the Moral Law; this as given to them is not perpetual, their policy being at an end.

3. The Ceremonial Law is in ceremonies, types, and shadows, pointing at a Savior to come; this is also abrogate[d], the substance being come; but there is this difference, that the Judicial Law is but mortua, ‘dead’; and may, where ’tis thought fit, with the foregoing caution, be used under the New Testament; but the Ceremonial Law is mortifera, ‘deadly’, and cannot without falling from grace, Gal. 5:2,4, be revived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed</cite>, (1676), Preface, pp. 4-5</span></figcaption>

<blockquote><p>Answer:

1. Show a law of nature that the father might enslave his children; by a divine positive law, presupposing sin, the father might do that; and yet I think that may be questioned, whether it was not a permission rather than a law, as was the bill of divorce; but a law of nature it was not;

2. The Popish Prelate [John Maxwell] can see no law but the law of nature here; but it is because he is blind or will not see. His reason is, It was not by mutual and voluntary contract of children and fathers, therefore it was by the law of nature; so he that cursed his father was to die by God’s law. This law was not made by mutual consent betwixt the father and the son, therefore it was a law of nature: the Prelate will see no better. Nature will teach a man to enslave himself to redeem himself from death, but that it is a dictate of nature that a man should enslave his son, I conceive not.</p></blockquote>

<blockquote><p>And here comes in the way that general bond wherewith man is especially bound unto man, and that without taking away of humanity itself, cannot be broken; There is also another bond binding every citizen unto his country and city. But both these bonds I affirm to be natural and universal, that everyone must have regard of his estate, and calling; for some serve in public offices, either civil, or the ministry; the rest are private persons… …yet, lest in this case [of flight], any man by flattering of himself, might sin against his neighbour [in neglecting his duty towards him], it is the duty of a Christian magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing…</p></blockquote>

<blockquote><p>VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…”

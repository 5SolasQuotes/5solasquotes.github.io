<main class="wrap"><figure class="quote" id="q-be53d476ea" data-kw="">
<blockquote><p>The personal union of the two natures in Christ is the substantial copulation of them by which the specificness of the assumed human nature does not have subsistence in itself [but] the substance of the Logos has been communicated, so that the two natures in Christ may be one person. The essential form of the personal union in Christ, in which that subsists, is not the communication of the attributes of deity, but the communication of the subsistence of the Word with the assumed human nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 72 (top paragraph) of ‘What follows is on his State’ in The Divisions of Theology Framed according to a Natural Orderly Method (Basil, 1590; Geneva, 1623) trans. T. Fentiman</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55b3c85c6b" data-kw="">
<blockquote><p>XIII. A second rock to be avoided here is Eutychianism… who… confounded the two natures into one… one nature is neither changed nor converted by the hypostatical union into the other. Nor are the natures so confounded or mixed with each other that each of them does not retain its own properties and conditions.

XIV. The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6-7, 11); (2) two wills are ascribed to Him (‘not my will, but thine, be done,’ Lk. 22:42). Nor does it follow that there are two [persons] willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will. (3) Contraries are ascribed to Christ, which could not be if there were not two natures in Him (as that He would depart from the world and remain with us forever; that a child was born, who is the Father of eternity; that He suffered death and was made alive; in the form of God and in the form of a servant, etc.).

XV. Although the efficient cause of the operations of Christ is one alone, still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 13th Topic, Q. 7, ‘Was the hypostatical union of the two natures of Christ such that neither the person is divided nor the natures confounded? We affirm against Nestorius &amp; Eutyches., pp. 320-21</span></figcaption>

</figure><figure class="quote" id="q-c52fb8e7b4" data-kw="">
<blockquote><p>I… The occasion for this calumny [by Romanists] is taken from Calvin’s words in Mt. 26, found in his Harmony of the Gospels. There, Calvin, writing about Christ’s prayer, “My Father, if it is possible, let this cup pass from me; yet not as I will, but as you will,” includes these words among others: ‘He was struck with fear and constricted by anxiety, so that it was necessary for him to vacillate, as it were, with alternating prayers amidst the violent waves of temptations. This is the reason why, having prayed for the cup to pass, He immediately reins Himself in, and submitting his prayer to the Father’s command, He chastises and recalls the request that had just slipped out. And there, He says, ‘This was not a deliberate prayer of Christ, but the force and sudden impulse of grief extorted the words, to which correction was immediately added; the same vehemence also took away the immediate memory of the heavenly decree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on the Impeccability of Christ, p. 570 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“I… The occasion for this calumny [by Romanists] is taken from Calvin’s words in Mt. 26, found in his Harmony of the Gospels. There, Calvin, writing about Christ’s prayer, “My Father, if it is possible, let this cup pass from me; yet not as I will, but as you will,” includes these words among others: ‘He was struck with fear and constricted by anxiety, so that it was necessary for him to vacillate, as it were, with alternating prayers amidst the violent waves of temptations. This is the reason why, having prayed for the cup to pass, He immediately reins Himself in, and submitting his prayer to the Father’s command, He chastises and recalls the request that had just slipped out. And there, He says, ‘This was not a deliberate prayer of Christ, but the force and sudden impulse of grief extorted the words, to which correction was immediately added; the same vehemence also took away the immediate memory of the heavenly decree.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on the Impeccability of Christ, p. 570 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI%E2%80%A6+The+occasion+for+this+calumny+%5Bby+Romanists%5D+is+taken+from+Calvin%E2%80%99s+words+in+Mt.+26%2C+found+in+his+Harmony+of+the+Gospels.+There%2C+Calvin%2C+writing+about+Christ%E2%80%99s+prayer%2C+%E2%80%9CMy+Father%2C+if+it+is+possible%2C+let+this+cup+pass+from+me%3B+yet+not+as+I+will%2C+but+as+you+will%2C%E2%80%9D+includes+these+words+among+others%3A+%E2%80%98He+was+struck+with+fear+and+constricted+by+anxiety%2C+so+that+it+was+necessary+for+him+to+vacillate%2C+as+it+were%2C+with+alternating+prayers+amidst+the+violent+waves+of+temptations.+This+is+the+reason+why%2C+having+prayed+for+the+cup+to+pass%2C+He+immediately+reins+Himself+in%2C+and+submitting+his+prayer+to+the+Father%E2%80%99s+command%2C+He+chastises+and+recalls+the+request+that+had+just+slipped+out.+And+there%2C+He+says%2C+%E2%80%98This+was+not+a+deliberate+prayer+of+Christ%2C+but+the+force+and+sudden+impulse+of+grief+extorted+the+words%2C+to+which+correction+was+immediately+added%3B+the+same+vehemence+also+took+away+the+immediate+memory+of+the+heavenly+decree.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+on+the+Impeccability+of+Christ%2C+p.+570+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc52fb8e7b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c52fb8e7b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-human-nature-of-christ/#:~:text=The%20occasion%20for%20this%20calumny%20%5Bby,i <blockquote><p>Keckermann 323f.: (2) ‘Of the seed and blood of the Virgin Mary was formed Christ’s flesh, the Holy Spirit adding quickening force to this material. Of course the seed and blood of the Virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the Holy Spirit’s extraordinary shadowing and quickening were added: whence also it is said to have been conceived of the Holy Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate.–(3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the Virgin Mary, extraordinary as regards the formative force added to this material…&#x27;</p></blockquote>

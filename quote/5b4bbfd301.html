<blockquote><p>1. The name and profession of a Christian and a Protestant, with going to church, and a heartless lip-service or saying their prayers, is the cloak of all ungodly Protestants.

2. Others, discerning the thinness of this cloak, do think to make themselves a better: and they take up the strictest opinions in religion, and own those which they account the strictest party, and own that which they esteem the purest and most spiritual worship: the cloak of these men is their opinions, party, and way of worship, while their carnal lives detect their hypocrisy.</p></blockquote>

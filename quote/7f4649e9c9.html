<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

<blockquote><p>[Margin note:] Which be the principal points of the catholic Faith or religion? Now, because I see some [persons] (not yielding unto these things which we have spoken in general concerning the fundamental or principal points of our religion) again to demand what those should be: I answer: That these articles are to be called grounds or principles, which being laid, the whole building remains: and which being overthrown, all things builded thereupon fall to the ground. And all these things we profess to have been described with great shortness and plainness out of the Word of God in the Creed which they call the Apostles’. Which thing ought to be added to the Ten Commandments and the Lord’s prayer, of the which, that, to wit, the Ten Commandments do very compendiously set out the order of Christian life: and this, that is, the Lord’s Prayer, does very briefly also set out, right invocation and prayer. This (I say) is that fundamental, true and perpetual mark of the catholic Church, which shall never be blotted out unto the world’s end: but which nevertheless ought to be expounded out of the writings of the prophets and apostles, from whence it is taken, that all men may understand it and keep it as much as in them lies.</p></blockquote>

<blockquote><p>Thesis 1… Therefore, I was on the point of bidding farewell to this subject, casting away my pen, and choosing another equal to my powers and more suitable, had not the authority of those who hold the helm of my studies constrained me and prescribed this subject for me to bring, as it were, under the hammer. Wherefore, to prove my obedience to them, I shall approach the matter itself with God (σύν θεῷ). Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin (Bern: Fabricius, 1637), p. 2 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thesis 1… Therefore, I was on the point of bidding farewell to this subject, casting away my pen, and choosing another equal to my powers and more suitable, had not the authority of those who hold the helm of my studies constrained me and prescribed this subject for me to bring, as it were, under the hammer. Wherefore, to prove my obedience to them, I shall approach the matter itself with God (σύν θεῷ). Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.”

<blockquote><p>Why truly, after all other means have been used, and costly experiments tried, I believe none will be found more successful, than to maintain the established [Anglican] Church in all its rights, privileges and revenues, keeping close to the constitution which has been so long settled and naturalized to us, supporting it on its ancient basis, without making any material alteration, and hereby sapping the foundation on which ’tis built; but taking care that those who differ from it really on principle, they shall be easy, by granting them such a limited toleration and liberty that they may rest secure [that] they shall not suffer merely for conscience sake, whilst they behave themselves peaceably under the government, and do not make use of any pretended difference in opinion to disturb the peace of the State or the established Church.</p></blockquote>

<blockquote><p>That however your judgment stand in the matter contraverted (for we are to impose upon nobody’s judgment, but to leave everyone to their own light), yet ye who are… fomenters of the division, consider, though ye be but few, yet the stir ye make is great, and one man will easily raise more fire than twenty will be able to extinguish. Therefore be exhorted in the fear of God to carry the difference more soberly. Are your brethren willing to let you enjoy your judgments and serve your light in your own practice? and to live in peace with you, notwithstanding the difference? And as to things wherein ye and they are agreed to join with you therein, till God in his time clear up the mistake that is betwixt you, and show upon whose side it is? and will not ye be content unless ye impose your apprehensions upon them and have them conform unto, and lackey after your opinion and practice? must your judgment be the standard and canon to everybody else? and all be anathematized that differ in the least from you? Can there be no peace with you unless ye have leave to trail them at your heels? will ye agree with none that are not of your mind in everything? then Actum est de pace, peace is gone foever on this side of time; for, Non datur intellectus Averroisticus, men’s minds to jump to an ace in all things is hardly to be expected. While we know only in part, will there not be perpetually different measures of light? and diversity of apprehensions in many things? Theology has its own problems, even in greater points than this, which calls for sobriety and mutual tolerance. As we are not for skepticism, nor sinful syncritisms, so we tremble at the vanity of dogmatizing in things of this nature. But whatever ye deem it, treat not your brethren indiscreetly. Speak or write to them, rather than of them. Argue the case with them, convince them if ye can, Lk. 19:17, but usurp not a magistery over them; presume not to be dictators to them more, than ye would take it well they should impose on you, Jam. 3:1. Remember they must serve their own consciences, and be guided by their own light, and not yours, Rom. 14:12. Ye think them wrong, so do they, no doubt, you: But how would ye take it if they served you as ye do them, with outrageous out-cries, virulent epistles and Philippic declamations? What if they did preach against you, your divisive principles and unbrotherly practices, as Erroneous and Donatistical (if not worse), as ye call theirs Erastian? What a pitiful taking would ye and they be in by such Contradictions and invectives? Do therefore no otherwise than ye would be done unto, Mt. 7:12. Think ye are but men fallible, and may be mistaken in not a few of your confident notions; and that it is possible they may have as much of the mind of Christ as you. Therefore reverence their judgments, so far at least as not lightly to trample upon the same: Or, if ye were sure they were in the wrong, yet think, surely they mind honestly (as they judge ye do) and have not wickedly departed from the Lord, Ps. 18:21. If they be stepped aside, it is but for want [lack] of light, which ye (who think ye see more) should pity and bemoan to God, and labor to discover their mistake unto them (for as yet ye cannot charge them with contumacy, sufficient conviction never being yet held forth unto them). But, O! reproach them not; rate them not behind their backs; go not to preach them down, nor out of the hearts of honest people, much less to preach their own people from them! What service were that to Christ, or his Kingdom? or what edification unto people? Sure ye do more hurt than ye are aware of by this course, staggering and unsettling people, weakening your honest brethren’s hands in the Gospel, and marring the success of their labors what ye can. See Jam. 3:16; Gal. 5:14-15. But what? are not ye and they agreed in chiefest principles and theses? What’s your difference then but about the application of principles to some hypotheses or particular cases and practices? The intricacy whereof, with the sense of your short-sightedness, may teach you to think, speak and act more soberly and with all due respect to them that differ from you. O fall not into a stated schism upon so small and disputable a matter! nor lift up yourselves in conceit above your fellows! Are ye preachers of Christ? so are they: Have ye the seal of your labors, so have they; and that they have not more is perhaps through your fault, your contending with them, thereby confounding and distracting their people and taking them off their souls’ ease, by your perplexing controversies and exceptions against their ministers. And if ye continue by this contending to discourage your brethren and enervate the work of God in their hands, fear lest ye be found guilty of destroying so much of the Kingdom of Jesus Christ, [be] and countable for the blood of these souls whose edification ye mar, by abusing and amusing them with your bartering at their ministers and bringing them and their preaching into disesteem, so far as ye can, as Zech. 13:7, ‘Smite the shepherd, and the sheep shall be scattered.’ And what have ye gained when this is done? What advantage is it to the Gospel, to break so many faithful men’s ministry? And what peace will it yield you when accomplished? Bella geri placuit, nullos habitura triumphos. It were but a Cadmean victory. What! may still the old question be put unto you: Does your piety and zeal lie all in negatives? (as theirs in Col. 2:21) Are ye only skillful to destroy? and bold to treat the friends of Christ like foes? Preach the Gospel and propagate real godliness as much as ye can: but O! beware of hurting the Lord’s work and vineyard in your brethren’s hands! Will it not be but a poor vassalage to preach down your brethren, while ye should preach up Christ? and to propagate your private opinions more than the power of piety? or to draw disciples after you more than after Christ? Were it not better make one real Christian than proselyte twenty to your side and party? Ye complain of your brethren’s want [lack] of success, as Peninnah upbraided Hannah with her barrenness; but do not ye much mar their fruitfulness? O be tender of them, for the Gospel’s sake! Go, we pray you, convert the profane to piety rather than preach professors into faction and parties. Mind the great interest of the Gospel more than your particular debates or personal interests. Away with selfish designs under a spiritual mask! Beware of giving ground for that old complaint, Faciunt causam suam, causam publicam. Let not your excellent parts, fervor, zeal and spirits be spent upon so unprofitable a task as this of jangling, plunging, and confounding is. And tempt not people to any unhappy courses, which yourselves may repent of in the end, and come off with that inconsiderate warrior’s word in your mouth, Non putarum— It is easy to kindle a fire, but not so easy to set bounds unto it when and where ye list, saying, ‘Hitherto shalt thou come, but no further.’ Nay, once kindled, it may rage whither soever the winds and aptness of the matter to take with it may carry it, till all be burned down to ashes. And finally, let not your brethren have cause to take up that sad regrate of the psalmists, Ps. 55:12-14, ‘Had it been an enemy,’ etc. How bitter is this? Were it rampant Romanists, or inimical Prelatists, or foul mouthed sectaries who thus battered at honest ministers, it were more tolerable? But to see brethren at such odds, tearing the flesh (as it were) off the bones of their brethren by bitter railings and reproaches (which are as drawn swords, Ps. 57:4), how incongruous and unkindly is that? and may not the world wonder at it? What! shall all your edge and sting be turned against them, no less upright than yourselves? Shall they have no such adversaries as you whom they love and desire to be at peace with? and with whom they agree in all things (almost) else? Will ye do the Prelates work for them, in breaking that little liberty which at first they trembled at, till they saw you made it a bone of contention? and so more likely to break yourselves and it both than to hurt them, while ye stumble so upon it. What thanks will ye get for joining issues with them? See Obad. vv. 10-14. And will ye so positively condemn your brethren unheard (Jn. 7:51) and persecute them as apostates before ever ye wair an admonition on them? It is our admiration and astonishment, that some of you (as is informed) takes the confidence to baffle them in sermons, letters and private discourses to the people and others; and yet to this day never used the brotherliness to write or speak unto themselves what might have sufficed to convince them of their error, if any be. The grossest of heretics are not allowed by the rules of the Word to be so hardly dealt with, Tit. 3:10. Pronounce no anathema upon them till ye first take pains sufficient to reclaim them and find them obstinate. Shall ye be sharper scourges in their sides and thorns in their eyes than any others? Do ye like it, to put them to cry to God against you and (like Job) to complain of their friends mockage, injustice and cruel usage? Shall not God visit for these things? Zeph. 2:8; Obad. vv. 10-14. Beware of inventing or venting stories and reproaches of such friends of Christ! And make not calumnies the strongest arguments you plead against them with. Monopolize not the reputation of honesty to yourselves; give your brethren charity, and treat them not disrespectively. To stigmatize your brethren with black characters and odious imputations, consider again and again what spirit it comes from, Jam. 3:9-12. Upon all these grounds and many more which might be added, be intreated (in the bowels of Christ) to remit and relent of your acrid fervor and bring your dispositions and differences to some temper, and manage your discord with more sobriety. We think we may say the two part of your differences lies more in the acrimony of your spirits and alienation of affection than in the distance of your principles. Would ye let go the misunderstanding and prejudices that are between you, and God heal your dispositions and distempers, the two parts of your disease were away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, pp. 141-48</span></figcaption>

— John Bairdie, Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681), pp. 141-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+however+your+judgment+stand+in+the+matter+contraverted+%28for+we+are+to+impose+upon+nobody%E2%80%99s+judgment%2C+but+to+leave+everyone+to+their+own+light%29%2C+yet+ye+who+are%E2%80%A6+fomenters+of+the+division%2C+consider%2C+though+ye+be+but+few%2C+yet+the+stir+ye+make+is+great%2C+and+one+man+will+easily+raise+more+fire+than+twenty+will+be+able+to+extinguish.+Therefore+be+exhorted+in+the+fear+of+God+to+carry+the+difference+more+soberly.+Are+your+brethren+willing+to+let+you+enjoy+your+judgments+and+serve+your+light+in+your+own+practice%3F+and+to+live+in+peace+with+you%2C+notwithstanding+the+difference%3F+And+as+to+things+wherein+ye+and+they+are+agreed+to+join+with+you+therein%2C+till+God+in+his+time+clear+up+the+mistake+that+is+betwixt+you%2C+and+show+upon+whose+side+it+is%3F+and+will+not+ye+be+content+unless+ye+impose+your+apprehensions+upon+them+and+have+them+conform+unto%2C+and+lackey+after+your+opinion+and+practice%3F+must+your+judgment+be+the+standard+and+canon+to+everybody+else%3F+and+all+be+anathematized+that+differ+in+the+least+from+you%3F+Can+there+be+no+peace+with+you+unless+ye+have+leave+to+trail+them+at+your+heels%3F+will+ye+agree+with+none+that+are+not+of+your+mind+in+everything%3F+then+Actum+est+de+pace%2C+peace+is+gone+foever+on+this+side+of+time%3B+for%2C+Non+datur+intellectus+Averroisticus%2C+men%E2%80%99s+minds+to+jump+to+an+ace+in+all+things+is+hardly+to+be+expected.+While+we+know+only+in+part%2C+will+there+not+be+perpetually+different+measures+of+light%3F+and+diversity+of+apprehensions+in+many+things%3F+Theology+has+its+own+problems%2C+even+in+greater+points+than+this%2C+which+calls+for+sobriety+and+mutual+tolerance.+As+we+are+not+for+skepticism%2C+nor+sinful+syncritisms%2C+so+we+tremble+at+the+vanity+of+dogmatizing+in+things+of+this+nature.+But+whatever+ye+deem+it%2C+treat+not+your+brethren+indiscreetly.+Speak+or+write+to+them%2C+rather+than+of+them.+Argue+the+case+with+them%2C+convince+them+if+ye+can%2C+Lk.+19%3A17%2C+but+usurp+not+a+magistery+over+them%3B+presume+not+to+be+dictators+to+them+more%2C+than+ye+would+take+it+well+they+should+impose+on+you%2C+Jam.+3%3A1.+Remember+they+must+serve+their+own+consciences%2C+and+be+guided+by+their+own+light%2C+and+not+yours%2C+Rom.+14%3A12.+Ye+think+them+wrong%2C+so+do+they%2C+no+doubt%2C+you%3A+But+how+would+ye+take+it+if+they+served+you+as+ye+do+them%2C+with+outrageous+out-cries%2C+virulent+epistles+and+Philippic+declamations%3F+What+if+they+did+preach+against+you%2C+your+divisive+principles+and+unbrotherly+practices%2C+as+Erroneous+and+Donatistical+%28if+not+worse%29%2C+as+ye+call+theirs+Erastian%3F+What+a+pitiful+taking+would+ye+and+they+be+in+by+such+Contradictions+and+invectives%3F+Do+therefore+no+otherwise+than+ye+would+be+done+unto%2C+Mt.+7%3A12.+Think+ye+are+but+men+fallible%2C+and+may+be+mistaken+in+not+a+few+of+your+confident+notions%3B+and+that+it+is+possible+they+may+have+as+much+of+the+mind+of+Christ+as+you.+Therefore+reverence+their+judgments%2C+so+far+at+least+as+not+lightly+to+trample+upon+the+same%3A+Or%2C+if+ye+were+sure+they+were+in+the+wrong%2C+yet+think%2C+surely+they+mind+honestly+%28as+they+judge+ye+do%29+and+have+not+wickedly+departed+from+the+Lord%2C+Ps.+18%3A21.+If+they+be+stepped+aside%2C+it+is+but+for+want+%5Black%5D+of+light%2C+which+ye+%28who+think+ye+see+more%29+should+pity+and+bemoan+to+God%2C+and+labor+to+discover+their+mistake+unto+them+%28for+as+yet+ye+cannot+charge+them+with+contumacy%2C+sufficient+conviction+never+being+yet+held+forth+unto+them%29.+But%2C+O%21+reproach+them+not%3B+rate+them+not+behind+their+backs%3B+go+not+to+preach+them+down%2C+nor+out+of+the+hearts+of+honest+people%2C+much+less+to+preach+their+own+people+from+them%21+What+service+were+that+to+Christ%2C+or+his+Kingdom%3F+or+what+edification+unto+people%3F+Sure+ye+do+more+hurt+than+ye+are+aware+of+by+this+course%2C+staggering+and+unsettling+people%2C+weakening+your+honest+brethren%E2%80%99s+hands+in+the+Gospel%2C+and+marring+the+success+of+their+labors+what+ye+can.+See+Jam.+3%3A16%3B+Gal.+5%3A14-15.+But+what%3F+are+not+ye+and+they+agreed+in+chiefest+principles+and+theses%3F+What%E2%80%99s+your+difference+then+but+about+the+application+of+principles+to+some+hypotheses+or+particular+cases+and+practices%3F+The+intricacy+whereof%2C+with+the+sense+of+your+short-sightedness%2C+may+teach+you+to+think%2C+speak+and+act+more+soberly+and+with+all+due+respect+to+them+that+differ+from+you.+O+fall+not+into+a+stated+schism+upon+so+small+and+disputable+a+matter%21+nor+lift+up+yourselves+in+conceit+above+your+fellows%21+Are+ye+preachers+of+Christ%3F+so+are+they%3A+Have+ye+the+seal+of+your+labors%2C+so+have+they%3B+and+that+they+have+not+more+is+perhaps+through+your+fault%2C+your+contending+with+them%2C+thereby+confounding+and+distracting+their+people+and+taking+them+off+their+souls%E2%80%99+ease%2C+by+your+perplexing+controversies+and+exceptions+against+their+ministers.+And+if+ye+continue+by+this+contending+to+discourage+your+brethren+and+enervate+the+work+of+God+in+their+hands%2C+fear+lest+ye+be+found+guilty+of+destroying+so+much+of+the+Kingdom+of+Jesus+Christ%2C+%5Bbe%5D+and+countable+for+the+blood+of+these+souls+whose+edification+ye+mar%2C+by+abusing+and+amusing+them+with+your+bartering+at+their+ministers+and+bringing+them+and+their+preaching+into+disesteem%2C+so+far+as+ye+can%2C+as+Zech.+13%3A7%2C+%E2%80%98Smite+the+shepherd%2C+and+the+sheep+shall+be+scattered.%E2%80%99+And+what+have+ye+gained+when+this+is+done%3F+What+advantage+is+it+to+the+Gospel%2C+to+break+so+many+faithful+men%E2%80%99s+ministry%3F+And+what+peace+will+it+yield+you+when+accomplished%3F+Bella+geri+placuit%2C+nullos+habitura+triumphos.+It+were+but+a+Cadmean+victory.+What%21+may+still+the+old+question+be+put+unto+you%3A+Does+your+piety+and+zeal+lie+all+in+negatives%3F+%28as+theirs+in+Col.+2%3A21%29+Are+ye+only+skillful+to+destroy%3F+and+bold+to+treat+the+friends+of+Christ+like+foes%3F+Preach+the+Gospel+and+propagate+real+godliness+as+much+as+ye+can%3A+but+O%21+beware+of+hurting+the+Lord%E2%80%99s+work+and+vineyard+in+your+brethren%E2%80%99s+hands%21+Will+it+not+be+but+a+poor+vassalage+to+preach+down+your+brethren%2C+while+ye+should+preach+up+Christ%3F+and+to+propagate+your+private+opinions+more+than+the+power+of+piety%3F+or+to+draw+disciples+after+you+more+than+after+Christ%3F+Were+it+not+better+make+one+real+Christian+than+proselyte+twenty+to+your+side+and+party%3F+Ye+complain+of+your+brethren%E2%80%99s+want+%5Black%5D+of+success%2C+as+Peninnah+upbraided+Hannah+with+her+barrenness%3B+but+do+not+ye+much+mar+their+fruitfulness%3F+O+be+tender+of+them%2C+for+the+Gospel%E2%80%99s+sake%21+Go%2C+we+pray+you%2C+convert+the+profane+to+piety+rather+than+preach+professors+into+faction+and+parties.+Mind+the+great+interest+of+the+Gospel+more+than+your+particular+debates+or+personal+interests.+Away+with+selfish+designs+under+a+spiritual+mask%21+Beware+of+giving+ground+for+that+old+complaint%2C+Faciunt+causam+suam%2C+causam+publicam.+Let+not+your+excellent+parts%2C+fervor%2C+zeal+and+spirits+be+spent+upon+so+unprofitable+a+task+as+this+of+jangling%2C+plunging%2C+and+confounding+is.+And+tempt+not+people+to+any+unhappy+courses%2C+which+yourselves+may+repent+of+in+the+end%2C+and+come+off+with+that+inconsiderate+warrior%E2%80%99s+word+in+your+mouth%2C+Non+putarum%E2%80%94+It+is+easy+to+kindle+a+fire%2C+but+not+so+easy+to+set+bounds+unto+it+when+and+where+ye+list%2C+saying%2C+%E2%80%98Hitherto+shalt+thou+come%2C+but+no+further.%E2%80%99+Nay%2C+once+kindled%2C+it+may+rage+whither+soever+the+winds+and+aptness+of+the+matter+to+take+with+it+may+carry+it%2C+till+all+be+burned+down+to+ashes.+And+finally%2C+let+not+your+brethren+have+cause+to+take+up+that+sad+regrate+of+the+psalmists%2C+Ps.+55%3A12-14%2C+%E2%80%98Had+it+been+an+enemy%2C%E2%80%99+etc.+How+bitter+is+this%3F+Were+it+rampant+Romanists%2C+or+inimical+Prelatists%2C+or+foul+mouthed+sectaries+who+thus+battered+at+honest+ministers%2C+it+were+more+tolerable%3F+But+to+see+brethren+at+such+odds%2C+tearing+the+flesh+%28as+it+were%29+off+the+bones+of+their+brethren+by+bitter+railings+and+reproaches+%28which+are+as+drawn+swords%2C+Ps.+57%3A4%29%2C+how+incongruous+and+unkindly+is+that%3F+and+may+not+the+world+wonder+at+it%3F+What%21+shall+all+your+edge+and+sting+be+turned+against+them%2C+no+less+upright+than+yourselves%3F+Shall+they+have+no+such+adversaries+as+you+whom+they+love+and+desire+to+be+at+peace+with%3F+and+with+whom+they+agree+in+all+things+%28almost%29+else%3F+Will+ye+do+the+Prelates+work+for+them%2C+in+breaking+that+little+liberty+which+at+first+they+trembled+at%2C+till+they+saw+you+made+it+a+bone+of+contention%3F+and+so+more+likely+to+break+yourselves+and+it+both+than+to+hurt+them%2C+while+ye+stumble+so+upon+it.+What+thanks+will+ye+get+for+joining+issues+with+them%3F+See+Obad.+vv.+10-14.+And+will+ye+so+positively+condemn+your+brethren+unheard+%28Jn.+7%3A51%29+and+persecute+them+as+apostates+before+ever+ye+wair+an+admonition+on+them%3F+It+is+our+admiration+and+astonishment%2C+that+some+of+you+%28as+is+informed%29+takes+the+confidence+to+baffle+them+in+sermons%2C+letters+and+private+discourses+to+the+people+and+others%3B+and+yet+to+this+day+never+used+the+brotherliness+to+write+or+speak+unto+themselves+what+might+have+sufficed+to+convince+them+of+their+error%2C+if+any+be.+The+grossest+of+heretics+are+not+allowed+by+the+rules+of+the+Word+to+be+so+hardly+dealt+with%2C+Tit.+3%3A10.+Pronounce+no+anathema+upon+them+till+ye+first+take+pains+sufficient+to+reclaim+them+and+find+them+obstinate.+Shall+ye+be+sharper+scourges+in+their+sides+and+thorns+in+their+eyes+than+any+others%3F+Do+ye+like+it%2C+to+put+them+to+cry+to+God+against+you+and+%28like+Job%29+to+complain+of+their+friends+mockage%2C+injustice+and+cruel+usage%3F+Shall+not+God+visit+for+these+things%3F+Zeph.+2%3A8%3B+Obad.+vv.+10-14.+Beware+of+inventing+or+venting+stories+and+reproaches+of+such+friends+of+Christ%21+And+make+not+calumnies+the+strongest+arguments+you+plead+against+them+with.+Monopolize+not+the+reputation+of+honesty+to+yourselves%3B+give+your+brethren+charity%2C+and+treat+them+not+disrespectively.+To+stigmatize+your+brethren+with+black+characters+and+odious+imputations%2C+consider+again+and+again+what+spirit+it+comes+from%2C+Jam.+3%3A9-12.+Upon+all+these+grounds+and+many+more+which+might+be+added%2C+be+intreated+%28in+the+bowels+of+Christ%29+to+remit+and+relent+of+your+acrid+fervor+and+bring+your+dispositions+and+differences+to+some+temper%2C+and+manage+your+discord+with+more+sobriety.+We+think+we+may+say+the+two+part+of+your+differences+lies+more+in+the+acrimony+of+your+spirits+and+alienation+of+affection+than+in+the+distance+of+your+principles.+Would+ye+let+go+the+misunderstanding+and+prejudices+that+are+between+you%2C+and+God+heal+your+dispositions+and+distempers%2C+the+two+parts+of+your+disease+were+away.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%2C+1681%29%2C+pp.+141-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0201af1316.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0201af1316.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=That%20however%20your%20judgment%20stand%20in,parts%20of%20your%20disease%20were%20away&amp;text=That%20however%20your%20judgment%20stand%20in%20the%20matter&amp;text=the%20two%20parts%20of%20your%20disease%20were%20away" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

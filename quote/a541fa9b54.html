<main class="wrap"><figure class="quote" id="q-a541fa9b54" data-kw="">
<blockquote><p>It is true that people, through corruption of nature, are averse to submit to governors ‘for conscience sake, as unto the Lord,’ because the natural man, remaining in the state of nature, can do nothing that is truly good, but it is false that men have no active moral power to submit to superiors, but only a passive capacity to be governed. He [John Maxwell] quite contradicts himself; for he said before (ch. 4, p. 49) that there is an ‘innate fear and reverence in the hearts of all men naturally, even in heathens, toward their sovereign;’ yea, as we have a natural moral active power to love our parents and superiors (though it be not evangelically, or legally in God’s court, good) and so to obey their commandments, only we are averse to penal laws of superiors. But this proves no way that we have only by nature a passive capacity to government; for heathens have, by instinct of nature, both made laws morally good, submitted to them, and set kings and judges over them, which clearly proves that men have an active power of government by nature. Yea, what difference makes the Prelate betwixt men and beasts? for beasts have a capacity to be governed, even lions and tigers; but here is the matter, if men have any natural power of government, the Popish Prelate would have it, with his brethren the Jesuits and Arminians, to be not natural, but done by the help of universal grace; for so do they confound nature and grace. But it is certain our power to submit to rulers and kings, as to rectors, and guides, and fathers, is natural;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, 1</span></figcaption>

</figure><figure class="quote" id="q-ff4234ad2b" data-kw="">
<blockquote><p>The Disposition of Man to Grace l. Since the necessary conditions for salvation are impossible for the reprobates, God does not intend to give them salvation, conditionally if they believe and repent, unless one supposes that there is in God some vain, frustrated, and useless intention and will. 2. A good use of natural light, either subjective or objective, cannot lead man to salvation, nor obtain from God any other degree of light destined to salvation. Rejection of the error of those:

1. Who teach a universal and common call to all men to salvation and to the author of salvation, and that each and every man can believe and be saved if he wants.

2. Who teach that God, by his revealed will, wants the salvation of each and everyone.</p></blockquote>

</figure><figure class="quote" id="q-a9b5a185f1" data-kw="">
<blockquote><p>I willingly grant that the determination of the end does necessarily involve the means, that not only precede but procure the end. But I will utterly deny that sin is the means of damnation; we say rather that permission of sin is the means, whence notwithstanding it follows not that sin shall come to pass unavoidably, but rather avoidably, whether we consider the free will of man or the decree of God; for every particular sinful act is a natural thing, and undoubtedly man has free will as to do, so to abstain from doing, any particular act. And albeit God has determined that these particular sinful acts (instance the particular outrages committed against the holy Son of God by Herod, Pontius Pilate, together with the Gentiles and people of Israel) shall come to pass by his permission; yet seeing withal He has ordained them to come to pass contingently, that follows that they shall come to pass in such a manner as joined with a possibility of not coming to pass; otherwise they should come to pass not contingently but necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, (Oxford, 1653), bk. 1, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

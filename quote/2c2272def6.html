<main class="wrap"><figure class="quote" id="q-2c2272def6" data-kw="">
<blockquote><p>We do make &amp; gather the fourth argument upon the strength &amp; force of circumcision, in stead whereof, baptism is in the church of Christ. As many as were the servants of God, did afore all things, labour &amp; endeavour themselves, to circumcise their children. Josu. v. Exo. iiii. The Apostles were the most faithful ministers of god: Then did not they omit or leave the thing, that was not brought in, in stead of the circumcision, Ergo, they did baptise, not only them that were of age, but also children.

Fifthly we do thus reason upon the use &amp; custom of the Apostles. The Apostles of Christ did direct all their doings to the conveniency &amp; example of the old testament.

This we do prove by the iiii. Evangelists, the Acts of the apostles, by the epistles of the Apostles, Rom. xv. ii. Cor. ii. ii. Tim. iii. ii. Peter i. chap. Ergo, they did order baptism after the Analogy and figure of the old Testament. The going through the red sea, was a type &amp; figure of the baptism that was to come i. Cor. x. cha. Children were in the figure (for both men and women went through with their children). Ergo the apostles did not deny baptism unto the children. The custom &amp; manner of the scripture (which custom and manner is used almost among all nations) is not to rehearse by name, women &amp; children, and yet nevertheless it doth include them, for in the name of the father of the family, or of the good man of the house, all his whole family is comprehended, as in the chief or head. If this were not, women should be in no small jeopardy, if therefore they were not of god, because that they be not circumcised. All these things are done, by the means &amp; help of a figure that is called Synecdoche.

The sixth argument shall be taken out of the manifest and express testimonies of the apostles. The apostles did baptise all whole households and families, ergo they did baptise children also, for the children are in the number of the family or household. This we do prove by the xvii of Gene. For Abraham doth circumcise all the male children that were in his house. For he understood the promise of God, that saith. I shall be thy God, &amp; the God of thy seed. Likewise in the new Testament, when the goodman of the house, had herd &amp; believed the gospel, that is to say, that God was his God, &amp; the God of his seed also, he caused all them that were in his house both great and small, to be baptized.

Thus the apostles did baptize whole households and families. That the children do pertain unto the father’s household &amp; family, it is plain &amp; manifest by the xii. of Exodus &amp; ii. of the Acts: this do I inculcate &amp; beat the oftener into men’s heads, because that I see the Anabaptists to be at this point that they do exclude the children from the family &amp; household. for they can not deny but the whole households were baptized by the Apostles. But who doth not see, that this cometh of mere contention?

For though they could prove that there were no children at all in the families &amp; households, that the apostles did baptise, yet had they not proved that all families or households were, or be without children: wherefore we do make again our argument after this manner. The Apostles baptized all whole households, ergo, they did baptise children, saith the children are the principal &amp; chief part of the family &amp; household.

But let us put the case, that there were no children in those families &amp; households, that the Apostles did baptise, yet do they pertain &amp; belong to the household, &amp; are reckoned in it, and if there had been any, they would have baptized them. For they did baptise the whole household. The fault then should not have been in the Apostles nor in the children, that their were not baptized: but this had been the cause that they had been baptized, because that there were none: For if they had had children they would have baptized them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>

<blockquote><p>8th Distinction… yet will it not follow that these few fundamentals [such as in the Apostles’ Creed] received by all Christians, Papists, Lutherans, Arians, Verstians, Sabellians, Macedonians, Nestorians, Eutychanes, Socinians, Anabaptists, Treithitae, Antitrinitarii (for all these be Christians and validly baptized) do essentially constitute a true Church, and a true Religion. Because all Christians agree that the Old and New Testament is the truth and Word of God, and the whole faith of Christian Religion is to be found in the Old Testament, acknowledged both by Jews and Christians; for that is not the Word of God indeed in the Old Testament which the Jews say is the Word of God in the Old Testament. Yea the Old and New Testament, and these few uncontroverted points received universally by all Christians, are not God’s Word as all these Christians expone them, but [rather are] the dreams and fancies of the Jews saying that the Old Testament teaches that Christ the Messiah is not yet come in the flesh, the Treithitae [Tritheists] say there be three Gods, yet are the Treithitae Christians in the sense of Doctor [Christopher] Potter [a Laudian Anglican]: So that one principal as that, There is one God, and Christ is God and man, and God is only to be adored, not one of these are uncontraverted, in [the] respect [that] every society of sectaries have contrary expositions upon these common fundamentals, and so [they have] contrary religions. Who doubts but all Christians will subscribe and swear with us Protestants the Apostolic Creed, but will it follow that all Christians are of one true Religion, and do believe the same fundamentals? [2.] Now these fundamentals are the object of faith according as they signify things. To us and to the Treithitae this first article, ‘I believe in God’, as I conceive, does not signify one and the same thing; now join this, ‘I believe in God’ with holy obedience, as we expone it, and as the Treithitae expone it: it could never be a step to everlasting salvation; for it should have this meaning: ‘I believe there is one only true God, and that there be also three Gods,’ and what kind of obedience joined with a faith made up of contradictions can be available to salvation? 3. One general catechism and confession of faith made up of the commonly received and agreed upon fundamentals would not make us nearer peace, though all Christians should swear and subscribe this common Christian catechism, no more than if they should swear and subscribe the Old and New Testament, as all Christians will do, and this day do.</p></blockquote>

<blockquote><p>Certainly, then, its [baptism’s] advantage is not small. And first, as respects pious parents, to whom it cannot but be most agreeable that their dear children enjoying the blessing of newness of life and consecrated by the washing of the mysterious font, should be established in God and his Christ, and that as persons united to the fellowship of the church they should be solemnly admitted to the participation of all saving benefits and publicly sealed as belonging to God in Christ.

Thus, through the manifestation of the great mercy of God, they will be furnished in the first place with the amplest ground for exalting his glory, and led to take no mean delight in piety, while at the same time they will be powerfully excited to return the affection of a pious parent, whom they find making his children, for their own sake, the objects of so much solicitude.

And certainly were there no other advantage arising from infant baptism, all prudent persons will acknowledge this to be exceedingly important: that it imposes upon parents the most sacred obligations to take heed that their children, whom they have so deliberately devoted to God, shall by instruction, correction, and example be carefully educated in the mysteries of the Christian religion and in true holiness of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 170.</span></figcaption>

ml&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1231f8e8f6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/18/herman-witsius-on-baptism-and-the-duty-to-raise-children-for-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister</cite></span></figcaption>

</figure><figure class="quote" id="q-674765a0e8" data-kw="">
<blockquote><p>But now, having run through these various arguments, to what conclusion do we come? Are they sufficient to set aside our reasoned conviction, derived from some such argument as Dr. Hodge’s, that infants are to be baptized? A thousand times no. So long as it remains true that Paul represents the Church of the Living God to be one, founded on one covenant (which the law could not set aside) from Abraham to to-day, so long it remains true that the promise is to us and our children and that the members of the visible Church consist of believers and their children—all of whom have a right to all the ordinances of the visible Church, each in its appointed season. The argument in a nutshell is simply this: God established His Church in the days of Abraham and put children into it. They must remain there until He puts them out. He has nowhere put them out. They are still then members of His Church and as such entitled to its ordinances. Among these ordinances is baptism, which standing in similar place in the New Dispensation to circumcision in the Old, is like it to be given to children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 9 (Bellingham, WA: Logos Bible Software, 2008), 408.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

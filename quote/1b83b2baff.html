<main class="wrap"><figure class="quote" id="q-1b83b2baff" data-kw="">
<blockquote><p>For if that were true, That the presence of wicked Men did defile the Worship to Thee, then Christians would be in a very hard condition: For there was never a Church so pure, but there were some admitted to it, whom a Man truly tender would think should not be there; There was never a Church so pure but a tender Man zealously strict would find some to challenge; And so according to that Doctrine there should be no Church that a tender Christian could join with; And so he should be forced to serve God apart and by himself alone:

And this hath been the Separatists way, They have Separated from one Church to another, till at last they could get none to join with; And so turned Seekers, that is, A Sect who think there are None they can join with; And therefore, they cast off all Public Duties, and serve God by themselves alone; Because they can see none so Holy as themselves.

And therefore ye would suspect Zeal when joined with Error; And fear Error most when it is covered over with Zeal: For Error is never so dangerous, as when it gets on the mask of Zeal, It being then most cruel and most impudent: People then have no will to meddle with it, lest they should seem to be Enemies to True Piety; And therefore because it is suffered and born with, it turns impudent until it undo all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors toleration, Erastianism, Independency and separation delivered in some sermons from I Joh. 4. I, preached in the year 1652: to which are added four sermons preached on several occasions</cite>, (Edinburgh: George Mosman, 1692), pp 233-34.</span></figcaption>

<blockquote><p>3. Every man (especially experienced Christians) have more sense and knowledge of what is profitable and congruous to them than standers-by have, how learned soever: As ignorance makes a few, short, plain, oft repeated words in a familiar style more profitable to low-bred persons than an accurate learned discourse would be, so men’s several tempers and vices makes that matter and manner of preaching profitable to them which to others seems otherwise; And as a nice lady must not tie her family of laboring persons to the matter and measure of her diet, nor revile them as gluttons or fools if they like it not. No more must learned men confine plain people to wordy orations (whether learned or pedantic) and say, ‘This is best for them’. Much less must they silence causlessly such teachers as truly profit them, or tie them to homilies or liturgies only and say, ‘Here is as much as is necessary to salvation.’ Nor is it any schism in the people if they refuse to be so confined by them and denied such helps to their salvation as God has sent them and made their due.</p></blockquote>

_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1ae744ad4b" data-kw="">
<blockquote><p>And we must also add that whatever be their original and constitution, if all their governors were as the apostles, yet have they no power but what is for edification, and not for destruction; If they do or shall appoint and impose on men what tends unto the destruction of their souls, and not unto their edification, as it is fallen out in the Church of Rome; not only particular churches, but every individual believer is warranted to withdraw from their communion… Let none mistake themselves herein, believers are not made for churches, but churches are appointed for believers. Their edification, their guidance and direction in the profession of the faith and performance of divine worship in assemblies according to the mind of God, is their use and end; without which they are of no signification. The end of Christ in the constitution of his churches, was not the molding of his disciples into such ecclesiastical shapes, as might be subservient unto the power, interest, advantages and dignity of them that may in any season come to be over them; but to constitute a way and order of giving such officers unto them, as might be in all things useful and subservient unto their edification; as is expresly affirmed, Eph. 4:11-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Vindication of the Non-Conformists from the Charge of Schism</cite>, … (1680), p. 18</span></figcaption>

so%20add%20that%20whatever%20be&amp;text=their%20edification%3B%20as%20is%20expresly%20affirmed%2C%20Eph.%204%3A11%2D14" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5dbfab2b4a" data-kw="">
<blockquote><p>For hardliners like Hamilton, the ‘under-hand-dealings’ of Shields, Linning and Boyd and the Societies’ connivance in the Revolution settlement broke their Covenanted obligations and diluted the Societies’ testimony which they had so faithfully maintained. In 1691, Hamilton and some societies revived the Societies’ general correspondence or convention to maintain their former testimony in every ‘pendicule’ and to stand ‘alone’ until their cause was vindicated. Later known as the MAcmillanites, the continuing Societies would go on to form the Cameronian or Reformed Presbyterian Presbyterian Church. The continuing Societies’ formed part of a patchwork with other existing fragments of the wider militant movement which rejected the Revolution settlement. They included the rump of the Cameronian Russellites, who maintained their split from the Societies after the reunion of 1688, and the non-Cameronian Hebronites, the followers of John Hepburn… All those sects originated in the schisms of the United Societies and, like the post-Revolution Church, laid claim to the Societies’ heritage…. …Their response to the Revolution, in particular, reveals that persecution was a major factor in shaping their militancy. When persecution was removed at the Revolution, the majority of the Societies were able to moderate their demands and co-ordinate their actions with other presbyterians… The Societies were… one of the midwives of the Revolution. Even though the Revolution sidelined their Covenanted platform, the leadership and majority of the Societies accepted and supported it in the hope that it would place Scotland on a better path than it had been under the Catholic King James and the Restoration regime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies</cite>, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 243</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For hardliners like Hamilton, the ‘under-hand-dealings’ of Shields, Linning and Boyd and the Societies’ connivance in the Revolution settlement broke their Covenanted obligations and diluted the Societies’ testimony which they had so faithfully maintained. In 1691, Hamilton and some societies revived the Societies’ general correspondence or convention to maintain their former testimony in every ‘pendicule’ and to stand ‘alone’ until their cause was vindicated. Later known as the MAcmillanites, the continuing Societies would go on to form the Cameronian or Reformed Presbyterian Presbyterian Church. The continuing Societies’ formed part of a patchwork with other existing fragments of the wider militant movement which rejected the Revolution settlement. They included the rump of the Cameronian Russellites, who maintained their split from the Societies after the reunion of 1688, and the non-Cameronian Hebronites, the followers of John Hepburn… All those sects originated in the schisms of the United Societies and, like the post-Revolution Church, laid claim to the Societies’ heritage…. …Their response to the Revolution, in particular, reveals that persecution was a major factor in shaping their militancy. When persecution was removed at the Revolution, the majority of the Societies were able to moderate their demands and co-ordinate their actions with other presbyterians… The Societies were… one of the midwives of the Revolution. Even though the Revolution sidelined their Covenanted platform, the leadership and majority of the Societies accepted and supported it in the hope that it would place Scotland on a better path than it had been under the Catholic King James and the Restoration regime.”

<blockquote><p>Suppose an apparently strong and healthy man should apply to you for relief, and, when asked why he did not labor for his subsistence, should reply, Because I can find no one to employ me. If you wished to know whether this or indolence were the true reason, you would offer him employment; and if he then refused to labor, you would feel satisfied that he was slothful and undeserving of your charity. So, when God puts into the hands of sinners a price to get wisdom, and they do not improve it, it becomes evident that they do not wish, that they are not willing, to become religious.</p></blockquote>

<blockquote><p>But now the nature of Gospel-righteousness is not to put us upon anything that is impossible for us to do, but only to believe and confess, v. 9. Don’t entertain such vile thoughts, as if God required anything of you in order to your Justification, that you could not perform, though never so desirous to do it.</p></blockquote>

<blockquote><p>203. He therefore that is so far disposed to any good act, and whose indisposition, or disposition to the contrary, is but such, as that in his present state, without any more help than he has, he can move his own will to the said act, and the difficulty is not so great but that such power sometime does overcome it, is said to have a moral power. But he that wants [lacks] not natural force or power, but only a right disposition of his will, and so far wants it, as that none in his case do ever change their own acts to good, without more help and power than he has, is said to be morally unable or impotent: and not only to want the habit. 204… Unbelievers want not that natural power or faculty, which can believe and repent if duly suscitated and disposed: But through an ill disposition and contrary course of action, and want of due excitation, that power will not act, without God’s special grace. Which ‘will not’ signifies: 1. the undisposedness, 2. the non-agency. And in strictest speech, the former is best expressed by, ‘The will is undisposed and averse to believe, etc.’ and the latter by ‘The will does not consent.’ But the first may be expressed by, ‘It cannot’ because it will not come to pass, though it is no such ‘cannot’ as is distinct from ‘will not,’ but the very same. And as ‘power’ is distinct fom ‘will’ and a man is said to be able to do that which ‘he can do if he will,’ so no doubt but he that will believe and repent, can do it, so far as he is willing. And this is it that [which] Augustine so much pleads for, when he would have us distinguish ‘cannot’ and ‘will not,’ and when he says that Posse credere est omnium; Credere autem fidelium. [To be able to believe is common to all; but actually to believe is the mark of the faithful.] …

213. A man may be able mediately to do that which he is not able immediately to do: I mean he that can write with a pen, or move things with an engine, and so act but as a partial, though principal cause, may not be able to write without a pen, nor to do the same alone as a total cause.

214. And a man may have power to do that mediately and hypothetically hereafter, which he cannot do immediately, that is, at the present time. He can learn to write, and after can write, who cannot write till he hath learned. Thus infants have a remote power of speaking, and infidels of believing.</p></blockquote>

<blockquote><p>§XXXIV. Scotus and the Scotists, after Hales, Bonaventure, and Richard, also rightly state that the will, with respect to its acts, is more excellent than the intellect, for:

1. The Intellect is a merely natural and necessary faculty, which only represents and shows to the will things to be done and chosen, but does not command them; whereas the will determines the intellect to speculate on this or that, and often commands it to consider this and not that, and to judge in this way and not another. But it is more noble to command than to do or execute what is commanded.

2. Liberty, which is the highest perfection of an intellectual nature, inheres in the will, at whose nod the other faculties act or cease; from this, then, shines the nobility of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), p. 17</span></figcaption>

</figure><figure class="quote" id="q-5b6fc015ca" data-kw="">
<blockquote><p>52. Because nothing is done without a sufficient Reason (sect. 1), also liberty in election cannot act without reason, we therefore define the same as that faculty of the mind to elect or choose out of more possible things what one pleases, agreeable to proposed reasons. Hence all coaction [coercion] by which man is compelled thorugh extrinsical violence is at a great distance from liberty; metaphysical necessity, where there is but one only object possible, and consequently election ceases, has nothing to do with liberty; also physical necessity (i.e. natural necessity), when there is no knowledge of the objects, is far distant from liberty (or is utterly inconsistent with the very nature of it); but there is only a moral necessity, which is no more than a certainty so that man is sweetly and willingly inclined or moved to this or that thing from these or other motives, namely because he sees what things are best.

53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?</p></blockquote>

53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?”

— Daniel Wyttenbach, Theological Theses, containing the Chief Heads of the Christian Doctrine, Deduced from Axioms, … (1747; NY: Samuel Brown, 1766), pp. 24-25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C52.+Because+nothing+is+done+without+a+sufficient+Reason+%28sect.+1%29%2C+also+liberty+in+election+cannot+act+without+reason%2C+we+therefore+define+the+same+as+that+faculty+of+the+mind+to+elect+or+choose+out+of+more+possible+things+what+one+pleases%2C+agreeable+to+proposed+reasons.+Hence+all+coaction+%5Bcoercion%5D+by+which+man+is+compelled+thorugh+extrinsical+violence+is+at+a+great+distance+from+liberty%3B+metaphysical+necessity%2C+where+there+is+but+one+only+object+possible%2C+and+consequently+election+ceases%2C+has+nothing+to+do+with+liberty%3B+also+physical+necessity+%28i.e.+natural+necessity%29%2C+when+there+is+no+knowledge+of+the+objects%2C+is+far+distant+from+liberty+%28or+is+utterly+inconsistent+with+the+very+nature+of+it%29%3B+but+there+is+only+a+moral+necessity%2C+which+is+no+more+than+a+certainty+so+that+man+is+sweetly+and+willingly+inclined+or+moved+to+this+or+that+thing+from+these+or+other+motives%2C+namely+because+he+sees+what+things+are+best.+53.+Hence+since+liberty+of+indifference+is+repugnant+to+the+principle+of+a+sufficient+reason%2C+it+is+utterly+impossible+%28i.e.+there+is+no+liberty+of+indifference%29%3B+it+is+a+chimera+%28or+a+groundless+and+vain+imagination+which+has+no+foundation+in+reason+or+nature%29%3B+it+is+nothing+but+the+mere+inaction+of+the+will%3B+besides+let+those+who+maintain+an+indifference+of+the+equilibrium+in+liberty+%28or+those+who+place+the+essence+of+liberty+in+the+indifference+of+the+will%29%2C+let+them+answer+us+%28let+them+reply+to+the+following+queries%2C+viz.%29%2C+Whether+God%2C+the+%28holy%29+angels+and+all+the+inhabitants+of+heaven+are+not+most+free%2C+or+act+with+the+most+perfect+liberty%3F+and+whether+they+are+indifferent+about+good+and+evil%3F%E2%80%9D%0A%0A%E2%80%94+Daniel+Wyttenbach%2C+Theological+Theses%2C+containing+the+Chief+Heads+of+the+Christian+Doctrine%2C+Deduced+from+Axioms%2C+%E2%80%A6+%281747%3B+NY%3A+Samuel+Brown%2C+1766%29%2C+pp.+24-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b6fc015ca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b6fc015ca.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=52.%20Because%20nothing%20is%20done%20without,are%20indifferent%20about%20good%20and%20evil&amp;text=52.%20Because%20nothing%20is%20done%20without%20a%20sufficient&amp;text=whether%20they%20are%20indifferent%20about%20good%20and%20evil" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

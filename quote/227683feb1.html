</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-022283fb47" data-kw="">
<blockquote><p>The passage where God declares, “The son shall not bear the iniquity of the father, but the soul that sinneth, it shall die” (Ezk. 18:20) is not to be absolutely and simply understood as it sounds. Otherwise there would be a contradiction to the law and a denial of the substitution of Christ in our place. Rather it ought to be explained: (1) of adult sons who depart from the iniquity of parents and do not imitate them (as appears from v. 19—“Why? doth not the son bear the iniquity of the father? When the son hath done that which is lawful and right, he shall surely live.” Now such are not the sons of Adam, who are transgressors from the womb). (2) Of personal and particular sins, not of common and general, which can involve many, such as the sin of Adam. (3) There is not established here a general rule of providence and justice in accordance with which God either before always acted or will hereafter conform all his judgments. For He ordained in the Law otherwise and proceeded in examples. Rather it treats of a business peculiar to the Jews on whom God bestowed this by a special concession; not to act with them in that strictness of justice which he could observe (as to impute others’ sins to them), but to punish their own sins in themselves, that in this way their mouth might be entirely closed. On this pretext, the Jews carped at the divine judgments that the undeserving were punished for the sins of their parents, as is evident from the proverb they used: “The fathers have eaten sour grapes and the children’s teeth are set on edge.” God answers that He would not deal with them thus in the least, but would punish each one for his own sins, as we read in v. 30. Therefore He wishes in the present affair to draw and to bring them to this confession—to acknowledge God to be just in his judgments and that there was no need for Him to seek sins in the fathers in order to punish the sons; that there was sufficient criminality in themselves (even apart from the imputation of the sins of others) to justify the infliction of the punishment they had already suffered and even greater still. So there is not here any definition of right, but only the declaration of a special agreement. He does not say what He can rightly do, but against the complaints of the people, what he wills to do. The scope of the prophet and the connection of the words lead us to this. Finally, the highest right differs from the forbearing (epieikeia) right. In accordance with the former, God can visit the sins of parents upon their children, but in accordance with the latter He extends the punishment no further than to sinners themselves. Thus the prophet, speaking of the New Testament times, says among other things: “In those days they shall say no more, the fathers have eaten a sour grape, and the children’s teeth are set on edge. But every one shall die for his own iniquity” (Jer. 31:29, 30*). He says this to teach that God would deal with them more gently than before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 1</cite>, p. 624</span></figcaption>

</figure><figure class="quote" id="q-86433cdd3c" data-kw="">
<blockquote><p>God as the supreme Lord has true right over the actions of all men, both internal and external, that they may serve his glory and obedience be rendered to him in all things (Luke 17:10), which obedience moreover he as ruler has commanded and sanctioned under the gravest threats (Gen 2:17, Deut 27:26). When man violates this right and denies this obedience to God, he commits two things: 1) he does not acknowledge the lordship of his master over himself, 2) he despises him, even by disdaining his laws before his sight, who pays heed to all the ways of men. Hence this wickedness is so great that none greater can be given; by it man turns away from the infinite good, and consequently merits for himself the privation of the highest good; whence he has been handed over by his Lord, whose obedience he refused, into servitude to the Devil and his servants, that he may be tormented by them in [God’s] name and experience the gravity of the lordship he despised (Jude 5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’ tr. Onku with AI (Utrecht, 1650) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><figure class="quote" id="q-d7537e3755" data-kw="Original Sin">

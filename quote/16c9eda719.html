<main class="wrap"><figure class="quote" id="q-16c9eda719" data-kw="">
<blockquote><p>5. The abuse of kneeling in the idolatrous action of elevation proceeds not from the nature of the action, but from the opinion of the agent, or rather from his will (for principium actionum humanarum [the principle of human actions], is not opinion, but will choosing that which opinion conceits to be chosen, or voluntas praeeunte luce intellectus). It is the will of the agent only which both makes the action of elevation to be idolatrous, and likewise kneeling in this action to receive the contagion of idolatry. For the elevation of the bread materialiter [materially], is not idolatrous (more than the lifting up of the bread among us by elders or deacons, when in taking it off the table, or setting it on, they lift it above the heads of the communicants), but formaliter [formally] only, as it is elevated with a will and intention to place it in state of worship. So likewise kneeling to the bread, materialiter [materially], is not idolatry (else a man were a idolater who should be against his will thrust down and holden by violence kneeling on his knees when the bread is elevated), but formaliter [formally], as it proceeds from a will and intention in men to give to the bread-elevated a state in that worship, and out of that respect to kneel before it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, p. 28</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3aa0c37dcc" data-kw="">
<blockquote><p>The communion, or supper of the Lord, is frequently to be celebrated; but how often, may be considered and determined by the ministers, and other church-governors of each congregation, as they shall find most convenient for the comfort and edification of the people committed to their charge. And, when it shall be administered, we judge it convenient to be done after the morning sermon… Where this sacrament cannot with convenience be frequently administered, it is requisite that publick warning be given the sabbath-day before the administration thereof: and that either then, or on some day of that week, something concerning that ordinance, and the due preparation thereunto, and participation thereof, be taught; that, by the diligent use of all means sanctified of God to that end, both in publick and private, all may come better prepared to that heavenly feast.</p></blockquote>

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), ch. 6, p. 121</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<main class="wrap"><figure class="quote" id="q-915e624165" data-kw="">
<blockquote><p>Things inconvenient even in matters of religion may be commanded in some cases (Circumcision was a burden, Acts 15:10, and these burdens called ‘necessary things,’ v. 28, and they were said to do well if they observe them, v. 29.): as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to preuent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, pp. 586-98 on 1 Pet. 2:13 in A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), pp. 590-91</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebc7ade868" data-kw="">
<blockquote><p>Next you [Gilbert Burnet] inquire, Why do you [Scottish non-conformists] not anoint the sick with oil? I answer, though you address this demand to a non-conformist, yet it is evident that your conclusion of deformity to the Scripture pattern thence inferred, is equally levelled against the whole Protestant Church, wherein this ceremony is universally disused, and that not from your vain warrant of the Church’s authority in and over things expressly commanded, as you judge this rite to be; No, this is a presumption so high, and lax, that even the grossest Papists are unwilling to avouch it; But the sound answer of all the Churches is that, as the custom of anointing might have been occasioned from an observance then in use in these parts, where anointings were much more ordinary than in our parts of the world, so it is mentioned in the Scripture by the apostle James, not by way of command, but as the accustomed symbol adhibite[d] in the exercise of the gift of healing, which being then ordinary in the Church, is commanded to be applied by the prayer of faith, whereunto the effect is solely referred, and only with the formality of anointing, as being then customary in the like cases. Seeing then that the text runs clearly thus, ‘Is any sick? Let him call the elders, and let them pray over him anointing him with oil in the name of the Lord, and the prayer of faith shall save the sick;’ and that the application of the extraordinary gift of healing by prayer, with the then us […]all circumstance of anointing […] is here only enjoined, how can you make this text binding as to the manner and circumstance, when you cannot but acknowledge that the substance, viz. the power of healing, is ceased? But having made your non-conformist say that the apostle promises recovery upon the anointing, you turn to fight with your own shadow, and tell him there is no such matter, that the recovery is promised to prayer, and also forgiveness; and seing we pray by all for their raising up, and that they may be forgiven, why do we not as well anoint? But, what logic can make out this consequence inasmuch as anointing, being there only spoken of as the concomitant rite used in the application of the gift of healing, it is manifest that without the existence and exercise of the gift itself, it is not now to be repeated; and therefore though prayer be principally commanded as the special mean, by which even the gift of miracles was actuate[d] and made effectual, and to this day does remain as the great one by which all the promises either for raising up or remission are drawn out unto effect; yet thence to infer that anointing, a peculiar solemnity in the gift of healing, should still continue, notwitstanding the gift itself be ceased, is very absurd: Now, that anointing was an ordinary observance in the exercise of the gift of healing, you may read it clearly in the disciples’ practice, Mk. 6:13. And they anointed with oil many that were sick and healed them. This being then the just and true account, not only of our practice, but also of that of the whole reformed Churches, how vain and ridiculous are you to tell us, that our pretence of Scripture is but to impose on women and simple people, and all our persuasion, grave nods and big words: but leaving you to puff petulantly where you can prove nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117-19</span></figcaption>

</figure><figure class="quote" id="q-51d687d320" data-kw="">
<blockquote><p>‘Why then’ (say they) ‘have we cast out all the significant ceremonies of Popery?’ Not for their significancy barely, but for their weight and measure. They are not to them only as outward garnishments of worship, but as proper worship, efficacious and meritorious. Their number stifles devotion and fills it with shows without substance. A cup of water refreshes, but a whole well of water chokes. Yea, an hundred sermons weekly would not edify; they would eat out our conscience in our particular callings. Much more would an hundred ceremonies eat out the substance of our general callings, when a few may much refresh and profit, if judgment overpower fancy and affection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15, p. 207 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-0e132c236f" data-kw="">
<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 497 Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.”

— Jacob Andreae, Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 497 Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+was+a+certain+Count+of+your+%5BReformed%5D+confession+who+possessed+common+jurisdiction+in+a+certain+church+with+a+certain+Prince+of+our+%5BLutheran%5D+religion.+Therefore+since+the+Associate+was+judging+that+he+%5Bthe+reformed+Count%5D+had+more+of+right+in+that+church%2C+he+made+sure+that+the+altar+was+destroyed+and+that+a+table+be+built+%5Bfor+the+Lord%E2%80%99s+Supper%5D+in+the+temple+%5Bchurch+building%5D.+The+Prince+found+out+later+about+this%2C+and+ordered+that+the+table+be+removed+and+an+altar+be+constructed+again.+The+Count+in+return+took+care+a+second+time+in+return+that+the+altar+be+destroyed%2C+and+the+table+restored.+The+Prince+likewise+a+second+time+ordered+that+the+table+be+taken+away+and+the+altar+restored.+I+do+not+know+whether+this+happened+a+third+time.+But+the+%5Breformed%5D+Count+later+heeded+the+%5BLutheran%5D+Prince%E2%80%99s+strictness%2C+and+left+off+from+his+course%2C+such+that+the+altar+remained+in+the+temple+in+place+of+the+table.%E2%80%9D%0A%0A%E2%80%94+Jacob+Andreae%2C+Lutheranism+vs.+Calvinism%3A+The+Classic+Debate+at+the+Colloquy+of+Montbeliard+1586+%28Concordia+Publishing+House%2C+2017%29%2C+ch.+4%2C+%E2%80%98On+the+Reformation+of+Temples%2C+Images+%26+Organs%E2%80%99%2C+p.+497+Andreae+%281528%E2%80%931590%29+was+a+leading+Lutheran+theologian+debating+Theodore+Beza.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0e132c236f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0e132c236f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=There%20was%20a%20certain%20Count%20of,temple%2

<main class="wrap"><figure class="quote" id="q-31fa497d99" data-kw="Councils contradict councils">
<blockquote><p>Nor is there any ground for whispering to me, that when councils are at variance, one or other of them is not a lawful council. For how shall we ascertain this? Just, if I mistake not, by judging from Scripture that the decrees are not orthodox. For this alone is the sure law of discrimination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/synods.html">Synods</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a> › <a href="../topics/church-government-and-the-ministry/synods-and-assemblies/authority-of-synods.html">Authority of synods</a></span></div>

<blockquote><p>Accordingly we see that the Councils to which this specious coloring is given, are no other than six or seven spurious Councils held after the light of sound doctrine was extinguished, and discipline had decayed, and when the merest dolts were present — Councils which exhibit no appearance of ancient dignity, but smack of the Gothic tyranny of the Roman See.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>

</figure><figure class="quote" id="q-ac32f176d6" data-kw="">
<blockquote><p>The Supreme Judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Spirit speaking in the Scripture.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Supreme Judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Spirit speaking in the Scripture.”

— Westminster Assembly, Westminster Confession of Faith, 1.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Supreme+Judge%2C+by+which+all+controversies+of+religion+are+to+be+determined%2C+and+all+decrees+of+councils%2C+opinions+of+ancient+writers%2C+doctrines+of+men%2C+and+private+spirits%2C+are+to+be+examined%2C+and+in+whose+sentence+we+are+to+rest%2C+can+be+no+other+but+the+Holy+Spirit+speaking+in+the+Scripture.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Confession+of+Faith%2C+1.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac32f176d6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac32f176d6.html">Permalink</a><a class="src" href="https://www.pcaac.org/resources/wcf/" rel="noopener" target="_blank">Read it online · PCA</a></div>
</figure><figure class="quote" id="q-4caaa5bee8" data-kw="">
<blockquote><p>So far then as the Council proveth the determination and commandment that it giveth by the plain word of God, so soon do we reverence and embrace the same. But if men, under the name of a Council, pretend to forge unto us new articles of our faith, or to make constitutions repugnant to the word of God, then utterly we must refuse the same, as the doctrine of devils, which draweth our souls from the voice of our only God, to follow the doctrine and constitutions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-reformers.html">Scottish Reformers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scots Confession</cite>, 1560, Art. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

— Scottish Reformers, The Scots Confession, 1560, Art. 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+far+then+as+the+Council+proveth+the+determination+and+commandment+that+it+giveth+by+the+plain+word+of+God%2C+so+soon+do+we+reverence+and+embrace+the+same.+But+if+men%2C+under+the+name+of+a+Council%2C+pretend+to+forge+unto+us+new+articles+of+our+faith%2C+or+to+make+constitutions+repugnant+to+the+word+of+God%2C+then+utterly+we+must+refuse+the+same%2C+as+the+doctrine+of+devils%2C+which+draweth+our+souls+from+the+voice+of+our+only+God%2C+to+follow+the+doctrine+and+constitutions+of+men.%E2%80%9D%0A%0A%E2%80%94+Scottish+Reformers%2C+The+Scots+Confession%2C+1560%2C+Art.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4caaa5bee8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4caaa5bee8.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

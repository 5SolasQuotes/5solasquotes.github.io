<main class="wrap"><figure class="quote" id="q-8f810e3226" data-kw="">
<blockquote><p>It is the duty of the civil government to uphold not only the second table of the law, but also the first. It must see to it that God is honoured. It may not tolerate any idolatry, worship of images, or any false religion within her jurisdiction, but must rather eradicate these. It must prevent the vain use of God’s Name practiced by cursing, swearing, and blasphemy. It must prevent the desecration of the Sabbath, punish violators of this commandment, and see to it that the gospel is proclaimed everywhere within its jurisdiction.

It must see to it that the church as the darling of the Lord Jesus is protected and preserved and that neither internal dissension nor any external oppression disturb or destroy the church, but that instead she be safely preserved in the use of the privileges and liberties which her King Jesus has given her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 2: 179.</span></figcaption>

<blockquote><p>…an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. [That is, a magistrate not doing these ennumerated things is still a valid magistrate.] For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [from the nature of the magisterial work], and operantium [from the nature of the persons working by the office]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither from the nature or the intention of the work of magistracy, nor from the nature of the magistrate working]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London: 1646), ch. 24, pp. 547-48</span></figcaption>

<blockquote><p>At a soiree to the Revd Dr Samuel B. Wylie held at Belfast in October 1845, the Revd Isaac Nelson of Donegall Street Presbyterian Church spoke of his admiration for Dr Wylie. Dr Wylie then addressed the gathering, which was chaired by Counsellor James Gibson, on the steps that Covenanters in America had taken against the abomination of chattel slavery:

The CHAIRMAN then called upon the Rev. Isaac Nelson, to address the meeting on union among christians of all denominations, for the suppression of slavery as a system repugnant to liberty, and the spirit of the Gospel. Mr. Nelson responded to the sentiment in an eloquent and energetic speech, in which he denounced slavery as hateful in the sight of God, and disgraceful to humanity. – He hoped the mantle of Dr. Wylie, and men like him, who had contended for the liberty of their fellow-man, would fall upon others, who would never cease their efforts until the foul stain of slavery would be not only banished from churches, but from every nation under heaven. (Hear, hear, and cheers.) All sections of the church would unite to free the slave, indeed, on that subject of slavery, and the conclusion to which he had come was, that no slaveholder should be allowed to sit down at the Lord’s table, or be recognised as a member of the Christian Church. He did not take his opinions from any man, and, were he to stand alone in the Church to which he had the honour to belong, he would maintain his opinion that slave-holding was a sin, and that the slave-holder should be excluded from the church. (Cheers.)

THE CHAIRMAN then introduced Dr. Wylie to the meeting, and he gave a detailed account of what he had done himself and of what had been done in his day for the abolition of slavery in America, as regarded the Reformed Presbyterian Church, the end of which was that all slaveholders were banished from her communion. For many years that church had maintained the high and holy stand she had taken, though in some places her members had suffered much on account of their opposition to slavery. The Covenanting Church in America would as soon allow a sheep-stealer to sit down at the table of the Lord, as they would a slave-holder. (This statement was received with the most enthusiastic applause.) Dr. Wylie then congratulated the various churches in this country on the stand which they had taken in opposition to slavery […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belfast-commerical-chronicle.html">Belfast Commerical Chronicle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commerical Chronicle</cite>, 27 Oct. 1845</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

<blockquote><p>IX. Although the care of religion belongs to the magistrate, political and ecclesiastical power are not on this account confounded. They are concerned with it in a different way; some are the duties of that, others of this. The former is concerned only about extrinsic things, as to their external disposition and order (which belong to the worship of God); the latter, however, about internal things (to wit, the administration of those things which pertain to the worship of God). He does not exercise the ministry of the word who admonishes and corrects a minister erring in doctrine or delinquent in life and removes an obstinate or scandalous one. He does not baptize who prohibits the profanation of baptism, who takes care that holy things should be done in a holy manner.

X. As it is not lawful for bishops to draw the sword, so neither is it lawful for princes and civilians to handle the thurible [sic]; as to the preaching of the word, the administration of the sacraments and other things which formally belong to pastors and are of the essential reason of their office. But it does not thence follow that the other functions concerning the government of the church do not belong to the believing magistrate. Although it is not lawful for bishops to engage in politics or to plead in court, still it is lawful and incumbent upon them to admonish and to exhort magistrates to do their duty. And if they at any time fall in it, they are to rebuke and to denounce the judgment of God against them. So, in turn, although the preaching of the word does not pertain to magistrates, still it is lawful for them to admonish and rebuke bishops and pastors neglecting or wandering from their office; nay, also to bring to order transgressors and to take care that the ministry be not corrupted and religion to suffer no harm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), iii, 318-19.</span></figcaption>

<blockquote><p>[T]he special statute designed to prevent this crime, “He that stealeth a man and selleth him, or if he be found in his hand, he shall surely be put to death,” forever brands with the stamp of God’s reprobation and curse American slavery, and rendered the practice of such an iniquity in the Jewish Commonwealth impossible. The law does not read, he that stealeth a slave and selleth him, nor he that stealeth a servant even, and selleth him, but he that stealeth a man. It was the crime of stealing a man from himself, of removing him from a condition of freedom to a condition of bondage, as our slaves were stolen in the first instance from Africa, against which this law was directed; the very grossest outrage that can be perpetrated on humanity, a crime in God’s sight of the deepest dye, and therefore adjudged worthy of the severest punishment known to the divine law, namely, death.

Dare Mr. Van Dyke deny this? So have said all the churches; – his own included, in its testimony of 1801 – previous to its enlightenment and sanctification by the price of cotton, sugar, and tobacco! So have all the civilized nations of the world agreed, by declaring the foreign slave-trade murder and piracy, words all too mild to express the enormity of its guilt. There was no such crime as slave-stealing known in Israel, for the simple reason that there were no slaves to steal. However criminal helping a man to freedom may be, it is not forbidden in the divine word; on the contrary … it is highly commended. But the crime of man-stealing was known in the heathen nations round about Israel; and against the practice of such enormity, God guarded his chosen people by the fiery sword of this express and unqualified enactment. Can any man deny that American slavery originated in man-stealing? If so, does it not stand condemned and cursed in its very root, by the law of that God whose judgment is according to truth? Moreover, as if the Spirit designed to anticipate all subterfuges, it is added, “and if he be found in his hand, he shall surely be put to death.” Had it been made for our system, and designed to meet the argument with which it is attempted to be supported, it could not have been more specific.

How many transfers then, I ask, in the name of all that is sacred, does it require to transform this vice into a virtue? – this crime, against which the judgments of Heaven are denounced, into a grand missionary enterprise, and its practice into the highest exercise of a heavenly beneficence and piety? …</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9527c70aca" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

</figure><figure class="quote" id="q-a4670b4bbd" data-kw="">
<blockquote><p>…the last place, 2 Chron. 29, out of which no more can be drawn but that the people worshipped whiles the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, (though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4; p. 72</span></figcaption>

</figure><figure class="quote" id="q-f84e1e20f2" data-kw="">
<blockquote><p>For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect): 1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given. 2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object. 3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh, 1658), ch. 1, ‘Concerning the Holy Trinity &amp; Object of Worship’, p. 12</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect): 1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given. 2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object. 3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:”

— James Durham, A Commentary upon the Book of the Revelation… (Edinburgh, 1658), ch. 1, ‘Concerning the Holy Trinity &amp; Object of Worship’, p. 12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+answering%E2%80%A6+how+the+Mediator+is+the+object+of+divine+worship%3A+we+shall+first+distinguish+this+title+%E2%80%98object%2C%E2%80%99+then+answer.+By+divines+there+is+in+this+case+a+threefold+object+acknowledged+%28all+agreeing+to+the+Mediator+in+some+respect%29%3A+1.+There+is+objectum+materiale%2C+or%2C+quod+%5B%E2%80%98that%E2%80%99%5D%2C+that+is%2C+the+object%2C+or+Person+to+whom+worship+is+given.+2.+There+is+objectum+formale%2C+or%2C+quo%2C+that+is%2C+the+account+upon+which+it+is+given+to+that+Person%2C+or+object.+3.+There+is+objectum+considerationis%2C+that+is%2C+the+consideration+that+the+worshipper+has+of+that+object+in+worshipping+of+Him%2C+and+is+as+a+motive+thereto%2C+or+is+%28as+the+learned+Voetius+calls+it%2C+specificatio+objecti%29+%E2%80%98the+specification+of+the+object%2C%E2%80%99+whereby+the+heart+of+the+worshipper%2C+by+taking+up+the+object+worshipped+under+such+a+consideration%2C+is+warmed+with+love+and+thankfulness%2C+and+strengthened+in+his+confidence%2C+to+worship+that+object.+Thus%2C+the+relations+that+God+took+on+Him+to+be+the+redeemer+of+His+people+from+Egypt%2C+and+from+the+land+of+the+North%2C+did+give+no+new+object+of+worship%2C+yet+did+they+give+some+external+denominations%2C+or+specifications%2C+of+that+object%2C+God%2C+to+them%3A+the+consideration+whereof+in+their+worshipping+did+much+qualify+the+object+to+them%2C+so+that+with+the+more+thankfulness+and+confidence+they+might+approach+to+Him%3A+and+thus+we+distinguish+between+the+object+worshipped%2C+and+the+consideration+which+may+be+had+of+Him+in+our+worship.+And+this+does+not+make+Him+adorable+simply+and+in+Himself%2C+because+He+was+so+naturally%3B+but%2C+it+is+the+ground+upon+which+He+is+accessible+to+us%2C+who+are+sinners+and+enemies%3A%E2%80%9D%0A%0A%E2

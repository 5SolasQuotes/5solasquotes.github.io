<main class="wrap"><figure class="quote" id="q-9705ea056a" data-kw="">
<blockquote><p>…The lawyer, accustomed to the persuasion of law righteousness, blinded himself with confidence in works. Then he sought only what were works of righteousness whereby salvation is acquired. Therefore he is rightly sent back to the law wherein there is a perfect mirror of righteousness. With a clear voice we too proclaim that these commandments are to be kept if one seeks life in works. And Christians must know this doctrine, for how could they flee to Christ unless they recognized that they had plunged from the way of life over the brink of death? How could they realize how far they had wandered from the way of life unless they first understood what that way is like? Only, therefore, when they distinguish how great is the difference between their life and divine righteousness that consists in accepting the law are they made aware that, in order to recover salvation, their refuge is in Christ. To sum up, if we seek salvation in works, we must keep the commandments by which we are instructed unto perfect righteousness. But we must not stop here unless we wish to fail in mid-course, for none of us is capable of keeping the commandments. Therefore, since we are barred from law righteousness, we must betake ourselves to another help, that is, to faith in Christ. For this reason, as the Lord in this passage recalls to the law a teacher of the law whom he knew to be puffed up with empty confidence in works, in order that he may learn he is a sinner, subject to the dreadful judgment of eternal death, so elsewhere he comforts with the promise of grace without any mention of the law others who have already been humbled by this sort of knowledge: “Come to me all who labor and are heavy-laden, and I will refresh you… and you will find rest for your souls</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.9 (Battles edition)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f635f317d4" data-kw="">
<blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-piper.html">John Piper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This Momentary Marriage</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-fb7cd482f8" data-kw="">
<blockquote><p>. . . we must here observe the opposition between the law and the free promise of God in the justification of a sinner. “For if life come by the law, it comes not by the promise,” says Paul. And, “If they which are of the law are heirs, the promise is of none effect” (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.</p></blockquote>

</figure><figure class="quote" id="q-093b114c3a" data-kw="">
<blockquote><p>There is yet something more required; it is not enough that we are not guilty, we must also be actually righteous,—not only all sin is to be answered for, but all righteousness is to be fulfilled. By taking away the guilt of sin, we are as persons innocent; but something more is required to make us to be considered as persons obedient. I know nothing to teach me that an innocent person shall go to heaven, be rewarded, if he be no more but so. Adam was innocent at his first creation, but he was to ‘do this,’ to ‘to keep the commandments,’ before he entered into ‘life:’ he had no title to life by innocency. This, then, moreover, is required, that the whole law be fulfilled, and all the obedience performed that God requires at our hands. This is the soul;s second inquiry; and it finds a resolution only in the Lord Christ: “For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life,’ Rom v. 10. His death reconciled us; then we are saved by his life. The actual obedience which he yielded to the whole law of God, is that righteousness whereby we are saved; if so be we found in him, not having on our own righteousness which is of the law, but the righteousness which is of God by faith. Phil. iii. 9. This I shall have occasion to hand more at large hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 2.105.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-86d39f2348" data-kw="">
<blockquote><p>1. That righteouseness whereby we are justified before God is the fulfilling of God’s law.

2. Legal justice is the fulfilling of the law, performed by him which is named just.

3. Evangelical justice is the punnishment of our sins, which Christ endured for us, freely imputed by God to them that believe.

4. Since the fall of man no man besides Christ alone in this life is justified before God by the righteouseness of the law.

5. We are justified only by faith in Christ.

6. And yet the righteousness of the law must in this life be begun in all that will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rules &amp; Axions of Certain Chief Points of Christianity in A Collection of Certain Learned Discourses</cite>, … (d. 1587; Oxford, 1600), 22. ‘Of Man’s Justification before God’, pp. 271-72</span></figcaption>

<main class="wrap"><figure class="quote" id="q-50619c436b" data-kw="">
<blockquote><p>Then said David, O Lord God of Israel, thy servant hath certainly heard that Saul seeketh to come to Keilah, to destroy the city for my sake. Will the men of Keilah deliver me up into his hand? will Saul come down, as thy servant hath heard?… And the Lord said, He will come down. Then said David, Will the men of Keilah deliver me and my men into the hand of Saul? And the Lord said, They will deliver thee up. Then David and his men, which were about six hundred, arose and departed out of Keilah, and went whithersoever they could go. And it was told Saul that David was escaped from Keilah; and he forbare to go forth. And David abode in the wilderness in strong holds, and remained in a mountain in the wilderness of Ziph. And Saul sought him every day, but God delivered him not into his hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Sam., 23:10-14</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e53b90bc25" data-kw="">
<blockquote><p>But this negative will in God is nothing other than that act of the will by which, most perfectly willing himself, he is averse to everything adverse to him and to his glory, which is the only end of all things… He does this so thoroughly, that by most perfectly willing his own goodness, he is also most perfectly averse to whatever is adverse to him… Thus, God’s negative will is occupied with what is evil in its own nature, not only because it is adverse to the norm of acting set before it by God, but also [insofar as it has not been decreed] because it could not be directed by the power of the creatures to a truly good end… Even if an evil does not exist, or never will, God is still adverse to it, as it is inimical to his nature, since he would abolish and destroy it if it existed, just as he loves a good that will never exist, because, as it is congruent to his own goodness, if it existed he would conserve it, cherish it, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 15, section 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-0fece944ba" data-kw="">
<blockquote><p>potentia absoluta: absolute power; the omnipotence of God limited only be the law of noncontradiction. According to his potentia absoluta, God can effect all possibility, constrained only by his own nature. Things which are by nature evil and either impossible or noncompossible things (like square circles) fall outside of the realm of God’s power. The term emphasizes the transcendence and omnipotence of God by setting God even above and beyond the laws he has ordained for the operation of his universe…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, (Baker, 1985), p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-ff0bb50d01" data-kw="">
<blockquote><p>Furthermore, one ought to know that the Arminians have fabricated a third category in the divine knowledge; they call this knowledge middle or conditioned knowledge according to which God knows a certain event He has never decreed. But this is absurd. Because nothing happens what God did not decree, Thr 3,37 [Lam. 3:37].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. van Asselt, Bell, van den Brink, Ferwerda, Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn, 2009), ch. 4, ‘On God’, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“Furthermore, one ought to know that the Arminians have fabricated a third category in the divine knowledge; they call this knowledge middle or conditioned knowledge according to which God knows a certain event He has never decreed. But this is absurd. Because nothing happens what God did not decree, Thr 3,37 [Lam. 3:37].”

— Johannes Maccovius, ed. van Asselt, Bell, van den Brink, Ferwerda, Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn, 2009), ch. 4, ‘On God’, p. 119">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFurthermore%2C+one+ought+to+know+that+the+Arminians+have+fabricated+a+third+category+in+the+divine+knowledge%3B+they+call+this+knowledge+middle+or+conditioned+knowledge+according+to+which+God+knows+a+certain+event+He+has+never+decreed.+But+this+is+absurd.+Because+nothing+happens+what+God+did+not+decree%2C+Thr+3%2C37+%5BLam.+3%3A37%5D.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+ed.+van+Asselt%2C+Bell%2C+van+den+Brink%2C+Ferwerda%2C+Scholastic+Discourse%3A+Johannes+Maccovius+%281588%E2%80%931644%29+on+Theological+and+Philosophical+Distinctions+and+Rules+%28Apeldoorn%2C+2009%29%2C+ch.+4%2C+%E2%80%98On+God%E2%80%99%2C+p.+119&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff0bb50d01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff0bb50d01.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/middle-knowledge/#:~:text=Furthermore%2C%20one%20ought%20to%20know%20that,not%20decree%2C%20Thr%203%2C37%20%5BLam.%203%3A37&amp;text=Furthermore%2C%20one%20ought%20to%20know%20that%20the%20Arminians&amp;text=God%20did%20not%20decree%2C%20Thr%203%2C37%20%5BLam.%203%3A37" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-75b8794a35" data-kw="">
<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect</cite>, [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.”

— Johann F. Stapfer, ‘On the Attributes Dependent upon the Divine Intellect [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7CCCXXII.+God%2C+in+knowing+Himself%2C+also+knows+whatever+involves+no+contradiction%2C+that+is%2C+what+is+possible+in+itself%3B+for+that+is+called+possible+which+involves+no+contradiction.+%C2%A7CCCXXIII.+Things+are+therefore+possible+because+God+represents+to+Himself+in+His+intellect+that+they+involve+no+contradiction%3B+consequently%2C+something+is+possible+because+God+represents+it+to+Himself+in+His+intellect+as+such.+%C2%A7CCCXXIV.+Hence+it+is+evident+that+all+possibility+of+things+is+from+God%2C+and+that+His+intellect+is+the+fountain+or+root+of+all+possibility.%E2%80%9D%0A%0A%E2%80%94+Johann+F.+Stapfer%2C+%E2%80%98On+the+Attributes+Dependent+upon+the+Divine+Intellect+%5Bon+God+as+the+Source+of+Possibility%5D%E2%80%99+in+Universal+Institutes+of+Polemical+Theology%2C+vol.+1+4th+ed.+%281757%29%2C+section+3%2C+propositions+321-70%2C+pp.+78-90+trans.+AI+at+Reformed+Sources+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75b8794a35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75b8794a35.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-possibilities-hypotheticals/#:~:text=CCCXXII.%20God%2C%20in%20knowing%20Himself%2C%20also,fountain%20or%20root%20of%20all%20possibility&amp;text=CCCXXII.%20God%2C%20in%20knowing%20Himself%2C%20also%20knows%20whatever&amp;text=is%20the%20fountain%20or%20root%20of%20all%20possibility" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

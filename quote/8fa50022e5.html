<main class="wrap"><figure class="quote" id="q-8fa50022e5" data-kw="">
<blockquote><p>If I am not mistaken, the uniqueness of the Reformed doctrine of the sacraments, both of the Lord’s Supper and of baptism, is often not understood clearly. Certainly the sacrament is not a sealing of [something in] the recipient, but of the promises of God. The questions facing us, however, are: What are those promises and what do they contain? This refers not simply in general to the forgiveness of sins and eternal life in Christ the Saviour of sinners. Rather, more pointedly it is this: The Lord says, I will be your God and the God of your descendants forever.

Therefore the objective, certain, and to that degree also rich comfort residing in the covenant seals is frequently misperceived. The sacraments were instituted for believers, for covenant recipients, and they confirm and strengthen with visible signs that in Christ God is and eternally will remain their God. The expressions in our Confessions may not be weakened, which state that we thus truly receive Christ’s body and blood when we eat of the bread and drink of the wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin s Doctrine of the Lord’s Supper’, trans. Nelson D. Kloosterman in Mid-American Journal of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56e591a277" data-kw="">
<blockquote><p>A second general attribution of the Lord’s Supper, from whence it is endeavored [by opponents] to conclude to the sinfulness of giving it, in any case, unto such as are known by the minister to be unworthy receivers [though they have not been convicted by the Session of elders], is, its being a seal of the Covenant of Grace, the righteousnesse of faith. For hence think some, it follows that administration of the Lord’s Supper unto known scandalous and wicked persons, is a practical and visible lie, a confirmation of an untruth, because it seals the Covenant and promises to those who have visibly no share in them. For answer: The Lord’s Supper may be said to be a seal of the Covenant, or promise of grace, either absolutely, or conditionally. The truth of the Covenant and promises in themselves, our obligation to gratitude and obedience, are sealed absolutely by the Lord’s Supper; but interest in the Covenant and promises of grace, the Lord’s Supper seals unto those that partake thereof, but conditionally, so they believe: Unto wicked men the promises are as propounded, so sealed but conditionally. Sacramenta (says [William] Ames) non sunt testimonia completa et absoluta nisi credentibus. They are (says Rutherford) seals unto the wicked, not in actu secundo [by the following act of exercised power], but only in actu primo [in their first act of being, apart from that being exercised]. See Mr. [Stephen] Marshall in his Defence of Infant Baptism Against Tombs, [1646,] pp. 117-8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650), p. 60 Jeanes was an English presbyterian.</span></figcaption>

</figure><figure class="quote" id="q-467f7d5ce5" data-kw="">
<blockquote><p>Pastors cannot excommunicate those of another congregation, or heathen; Therefore, [according to a congregationalist] they cannot teach them as pastors. It follows not, ex negatione speciei, non sequitur negatio generis [out of the negation of a species the negation of a genus does not follow]: This is not a man, therefore this is not a living creature. So:

1. A single pastor, he alone cannot excommunicate an offender of his own congregation; for one man is not a Church, therefore he cannot preach as a pastor to this offender. The consequence is most false…

2. Paul and Barnabas preach as sent pastors authorized both by God, and the laying on of hands, and praying of the prophets at Antioch, Acts 13; but they have no power to excommunicate the gentiles, who are yet no members of the Church, nor baptized. Paul, Acts 16:15, is sent to preach to Macedonia, without their choosing him to be their pastor; and yet Paul could not cast out those that were no members until they should be member.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 10, p. 470</span></figcaption>

ntil%20they%20should%20be%20member" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c14575093b" data-kw="">
<blockquote><p>But as public baptism is that which is now performed in the public place, where public ordinances are usually administered, the accustomed signs being given for the assembling of the congregation there, at such time when it is to be celebrated, so private baptism, on the contrary, is that which is done either in the place of public assembly when no public notice is duly given for the congregation to resort thither, or in a private house, where although many are present, yet it is not free, or at least its generally supposed it would not be civil for any Christian that will, though uninvited, to come to the ordinance of baptism there administered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-langley.html">Samuel Langley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether</cite>, (or if at all in what cases) Baptism may be now Administered Privately, not Publicly?’ 20 pp. being the bottom 2/3rds of the Epistle Dedicatory of Suspension Reviewed, Stated, Cleared &amp; Settled upon Plain Scripture-Proof: Agreeable to the former &amp; late constitutions of the Protestant Church of England &amp; other Reformed Churches… (London, 1658) no page numbers</span></figcaption>

</figure><figure class="quote" id="q-4acd1df203" data-kw="">
<blockquote><p>The same prelate pleads for the expediency of giving the Communion to the sick in private houses, because he thinks they should not want [lack] this mean of comfort: As if the wanting of the sacramental signs, not procured by a man’s own negligence or contempt, could stop or stay the comforts of the Holy Spirit. Nay, it is not so: we have seen some who received not the Communion in time of their sickness, end more gloriously and comfortably than ever we heard of any who received the sacrament for their viaticum [journey] when they were a dying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 2, 14</span></figcaption>

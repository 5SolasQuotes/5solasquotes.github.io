<main class="wrap"><figure class="quote" id="q-8c322100d5" data-kw="">
<blockquote><p>It is agreed on by all real Christians that man being made an intelligent, free agent, not under bruitish necessitating determination by objects, is governed by God by the moral way of law; that is by the signification of his Ruler’s will, making his duty, and not by mere natural or forcible motion: And it is agreed that God Himself is his only absolute Universal Ruler, and his laws given in nature and by revelation are the only universal laws, which no human power can abrogate or dispense with: And that kings and magistrates are his ministers for men’s good, and have no power but from Him, and none against Him or his laws; and that it is not man but God, by whom we must all be judged to everlasting reward or punishment: And therefore that all men must obey God before men, and must not fear them that can but kill the body, but Him who is able to cast both soul and body into Hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London: Parkhurst, 1689), Preface</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e381f417c" data-kw="">
<blockquote><p>But a king, by a sort of contingency, succeeds to kings; for nature does not ascertain us there must be kings to the world’s end, because the essence of governors is kept safe in aristocracy and democracy, though there were no kings; and that kings should necessarily have been in the world, if man had never fallen in sin, I am not, by any cogent argument, induced to believe. I conceive there should have been no government but those of fathers and children, husband and wife, and (which is improperly government) some more gifted with supervenient additions to nature, as gifts and excellencies of engines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 79 lt col top</span></figcaption>

</figure><figure class="quote" id="q-eeac0e8f62" data-kw="">
<blockquote><p>§12. Question 7. May a true man promise money to a robber for the saving of his life or of a greater sum or more precious commodity? Answer: Yes, in case of necessity, when his life or estate cannot better be preserved: And so taxes may be paid to an enemy in arms, or to a plundering soldier (supposing that it do no other hurt which is greater than the good). Any man may part with a lesser good to preserve a greater: And it is no more voluntary or imputable to our wills than the casting of our goods into the sea to save the vessel and our lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, (London, 1673), pt. 4, ch. 19, title 2, p. 116</span></figcaption>

</figure><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>

</figure><figure class="quote" id="q-7fcc491e11" data-kw="">
<blockquote><p>Wherever there is a choice between candidates, where one of those candidates, if elected, will clearly do more to uphold the moral law of God to protect the good and punish evil, you have a moral obligation before God to vote for that candidate. That is how you exercise your God-given authoritative position as voter, to protect the good and punish the evil… Now no one exercises authority perfectly: no parent, police officer, professor, or president. But when you are in any of these or other positions of authority, you are obligated, in every instance, to do what is most good and least evil…. the raison d’être of all authorities: punishing the evil and protecting the good…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ray-e-heiple-jr.html">Ray E. Heiple Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Biblical Case for the Christian Principles of Voting: Everyone in authority is accountable to God to do what they can, according to their power and position, to uphold the moral law of God’</cite>, (2024) at The Aquila Report</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

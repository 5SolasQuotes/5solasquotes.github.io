<main class="wrap"><figure class="quote" id="q-25c214506e" data-kw="">
<blockquote><p>There is a great difference between inimical segregation, like sedition in a commonwealth; and a going severally upon weighty reasons and without breach of charity. And among other weighty reasons [for this,] this may be one: That all Christians of sound faith and good life, that are dissatisfied about some human injunctions and orders in a Church, may not for lack of tender regard towards them be utterly abandoned and exposed to be led aside into the errors of the wicked, as to heresy, apostasy or a course of irreligion. It is in the power of rulers to grant this indulgence to such dissenters, when it is not in the power of dissenters to change their judgments. And this is not to set up Church against Church, or according to an ancient manner of speaking, altar against altar, but only either occasional and temporary assemblies, or at the most but diverse churches distinguished by their several places of assembling, as one parish-church from another; and by diversity of external order, as the allowed congregations of foreigners in London from the parish churches. The same true religion for the substance thereof, is exercised; and the same holy ends are pursued in the one and the other. And there will be no opposition between them but what an unchristian enmity, proceeding from worldly lusts and interests, will produce. … After such [a] Comprehension [be] setled, the toleration of all tolerable dissenters within such limits as will secure public peace and safety, is more agreeable to the wisdom and clemency of rulers, and the charity of Christians, than the rigorous constraining of the said dissenters to what they cannot bear and the restraining of them from the liberty of serving God according to their consciences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683) | A Defense of my Endeavors for the Work of the Ministry, pp. 26-27</span></figcaption>

<blockquote><p>VII. An example is [the Lutheran] Matthias Flacius Illyricus, who, in a dispute against Victorinus Strigelius in the sixties of the last century, asserted that original sin is substantial and continued to assert it. He did not realize this implied that God, if not the author of sin as he denied, was not the Creator of all substances and things, thus implying two creators and two gods. Flacius did not understand or admit that this followed from his premises. It is unjust to say that Flacius held there were two gods, although this could be deduced from his opinions by sound consequences.</p></blockquote>

</figure><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-496ce9c6e7" data-kw="">
<blockquote><p>Although Covenanters have traditionally dissented from recognising immoral civil governments as the ordinance of God for our good, nevertheless, they have always sought the prosperity of their nations. For this reason the American Covenanter, R. J. George, reasoned that secret societies should be avoided by Christians partly because they are a danger to the good of the state. His comments are very relevant to organisations such as the Freemasons and the Orange Order:

(5) The secrecy of the lodge is prejudicial to the State.

It is frequently said in defense of secretism that the State itself has secrets: that there could be no diplomacy without secrecy: that it would be impossible to conduct a successful war without secrecy. So far as the privacy is that of true statesmanship, dealing with genuine State secrets, it is inherent in the State as a divine institution, and, just as in the case of the family, the secrecy of the lodge is its deadly enemy, because it invades that privacy and, for sinister ends, betrays it. The argument from the secret councils of war is an unfortunate one for the advocates of the lodge, because it calls attention to the fact that they are at war with human society and are using against their unoffending fellow citizens the stratagem which war justifies only against an enemy. But the secrecy of the lodge is perilous to the State. Scarcely a government of the old world but has been shaken by them. At the present time they endanger the stability of our own government. They manipulate our elections; they tamper with our courts of justice; they invade the jury box and turn aside righteous judgment; they engender strikes and riots and endanger life; and are a constant menace to the peace and good order of society. In time of war their ramifications may bind them by oath to citizens of our enemy country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-j-george.html">R. J. George</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures in pastoral theology</cite>, (3 vols, New York, 1917), iii, 276-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1fef4139b" data-kw="">
<blockquote><p>Though sin be forgiven, yet there may be the sense of God’s displeasure still; for, as though God doth forgive, there are many calamities and pressures upon the godly: so though Christ hath born the agonies that do belong unto sin, yet some scalding drops of them do fall upon the godly; not that the godly is by these to satisfy the justice of God, but that hereby we might feel the bitterness of sin, what wormwood and gall is in it, that so we may take heed for the future, and that we may by some proportion think on, and admire the great love of Christ to us, in undergoing such wrath.

Didst thou not judge the least of his anger falling upon thee more terrible, then all the pains and miseries that ever thou wast plunged into? And by this then, thou mayest stand amazed, and wondering at this infinite love of Christ to stand under this burden for thee. David is a pregnant instance for the truth of this. As when Saul was angry with Jonathan, and run a Javelin at him, he escaped, and that run into the wall; so the wrath of God, which was violently to fall upon thee, missed thee, and ran into Christ. But the sense of God’s displeasure for sin, may be retained in us two ways;

1. Servilely and slavishly whereby we run from the promise and Christ, and have secret grudgings and repinings against God: this is sinful for us to do.

2. There is a filial apprehending of God’s displeasure, though we are persuaded of the pardon; this is good and necessary, as we see in David, who made that Psalm of Repentance, Psal. 51. though he had his absolution from his sin. Tears in the soul by the former way, are like the water of the Sea, salt and brackish; but those in the latter are sweet, like the rain of the Clouds falling down on the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-2cba7293f0" data-kw="">
<blockquote><p>The Lutherans teach, and that rightly, that in death the soul of Christ was truly and really separated from His body, and that locally (although some expressly deny the same: as I have shown in the Exercitation). At the same time, they also teach, that, because of the personal union, His soul and body were necessarily wherever His divinity was. Graver in the supplement to article 3 of the Confessionis Augustanæ. Whence it follows, that His soul was not able to be separated locally from His body. For, as His divinity was not able to be separated from His body or soul: because it was everywhere: so neither was His body absent from His soul, nor His soul from His body, locally, that is, distant by an interval of space: because the soul of Christ was no less everywhere, than His divinity, nor was His body any less everywhere. But from this net Meisner attempt to extricate himself, Quæstionibus Vexatis 2, §32. Christ, says he, was truly dead, and so, where His body was, there His soul was not, on account of the natural separation made: but, nevertheless, these two, of which the one was physically and locally distant from the other, were not distant from each other hyperphysically and in the λόγῳ/Logos: since His hypostasis is infinite, illocal, indivisible, indistant. He says that this is a great mystery. Whence he orders the Calvinists to learn, that the mode of natural presence is one thing, of personal presence another: and that one thing is able to be present with another and to be absent from it in different respects, without ἀντιφάσει/contradiction. The argument, whereby he concludes this great mystery, and in the answering of which he wishes us to be exercised, is of this sort: Whatever things in the altogether simple λόγῳ/Logos are indistantly (ἀδιαστάτως, without distance, from each other) united; those in that third, in which (ἀδιαστάτως, without distance, from each other) they are united and subsist, are altogether present to each other. But the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, in the perfectly simple and indistant λόγῳ/Logos, were united (ἀδιαστάτως, without distance, from each other). Therefore, the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, were altogether present to each other in the hypostasis of the λόγου/Logos. And so the body and soul were able to be separated, although each was everywhere. Response: No laborious exercise is needed. We deny the minor, which Meisner was obliged clearly to prove, not to assume without demonstration. Indeed, the body and soul of Christ, at the time of His death, were united to the λόγῳ/Logos, but were not united with each other ἀδιαστάτως, without distance: seeing that they were at an incredible distance from each other. But, says our opponent, what things are united to a single, altogether simple, indivisible, and indistant third thing; those are united and present to each other (ἀδιαστάτως, without distance). Response: If that third altogether simple and indivisible thing be finite, we grant what our opponent maintains: but, if it be infinite and omnipresent, united to which were the body and soul of Christ at the time of His death, we do not at all grant it. The falsity is perfectly evident. Elijah and I are united to a third, altogether simple, indivisible, indistant, namely, God. But, who would say, that I, existing on the earth, am present by substantial proximity to Elijah, existing, not on earth, but in heaven? Therefore, the mystery vanishes. That personal presence, whereby body and soul, being locally separated by the whole heaven, were nevertheless altogether present to each other ἀδιαστάτως, without distance, in the λόγῳ/Logos, is not a great mystery, but a great and contradictory fiction. We turn that argument back upon our opponents. What in substance is everywhere, that is absent from no place with respect to essence or substance. But the soul of Christ, in the death of Christ, because of the union with the λόγῳ/Logos (according to the Lutheran hypothesis), in substance was everwhere. Therefore, the soul of Christ was absent from no place with respect to its substance: and by consequence, it was also in its body, and was united to it ἀδιαστάτως, without distance, and so was not separated from it: which the Suebi maintain: but Meisner with other Lutherans does not maintain it, against the Lutheran hypotheses.</p></blockquote>

— Marcus F. Wendelin, Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Lutherans+teach%2C+and+that+rightly%2C+that+in+death+the+soul+of+Christ+was+truly+and+really+separated+from+His+body%2C+and+that+locally+%28although+some+expressly+deny+the+same%3A+as+I+have+shown+in+the+Exercitation%29.+At+the+same+time%2C+they+also+teach%2C+that%2C+because+of+the+personal+union%2C+His+soul+and+body+were+necessarily+wherever+His+divinity+was.+Graver+in+the+supplement+to+article+3+of+the+Confessionis+Augustan%C3%A6.+Whence+it+follows%2C+that+His+soul+was+not+able+to+be+separated+locally+from+His+body.+For%2C+as+His+divinity+was+not+able+to+be+separated+from+His+body+or+soul%3A+because+it+was+everywhere%3A+so+neither+was+His+body+absent+from+His+soul%2C+nor+His+soul+from+His+body%2C+locally%2C+that+is%2C+distant+by+an+interval+of+space%3A+because+the+soul+of+Christ+was+no+less+everywhere%2C+than+His+divinity%2C+nor+was+His+body+any+less+everywhere.+But+from+this+net+Meisner+attempt+to+extricate+himself%2C+Qu%C3%A6stionibus+Vexatis+2%2C+%C2%A732.+Christ%2C+says+he%2C+was+truly+dead%2C+and+so%2C+where+His+body+was%2C+there+His+soul+was+not%2C+on+account+of+the+natural+separation+made%3A+but%2C+nevertheless%2C+these+two%2C+of+which+the+one+was+physically+and+locally+distant+from+the+other%2C+were+not+distant+from+each+other+hyperphysically+and+in+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%3A+since+His+hypostasis+is+infinite%2C+illocal%2C+indivisible%2C+indistant.+He+says+that+this+is+a+great+mystery.+Whence+he+orders+the+Calvinists+to+learn%2C+that+the+mode+of+natural+presence+is+one+thing%2C+of+personal+presence+another%3A+and+that+one+thing+is+able+to+be+present+with+another+and+to+be+absent+from+it+in+different+respects%2C+without+%E1%BC%80%CE%BD%CF%84%CE%B9%CF%86%CE%AC%CF%83%CE%B5%CE%B9%2Fcontradiction.+The+argument%2C+whereby+he+concludes+this+great+mystery%2C+and+in+the+answering+of+which+he+wishes+us+to+be+exercised%2C+is+of+this+sort%3A+Whatever+things+in+the+altogether+simple+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos+are+indistantly+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+from+each+other%29+united%3B+those+in+that+third%2C+in+which+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+from+each+other%29+they+are+united+and+subsist%2C+are+altogether+present+to+each+other.+But+the+soul+of+Christ+in+the+heavens%2C+and+the+body+of+Christ+on+earth%2C+which+are+naturally+and+locally+most+distant%2C+in+the+perfectly+simple+and+indistant+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%2C+were+united+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+from+each+other%29.+Therefore%2C+the+soul+of+Christ+in+the+heavens%2C+and+the+body+of+Christ+on+earth%2C+which+are+naturally+and+locally+most+distant%2C+were+altogether+present+to+each+other+in+the+hypostasis+of+the+%CE%BB%CF%8C%CE%B3%CE%BF%CF%85%2FLogos.+And+so+the+body+and+soul+were+able+to+be+separated%2C+although+each+was+everywhere.+Response%3A+No+laborious+exercise+is+needed.+We+deny+the+minor%2C+which+Meisner+was+obliged+clearly+to+prove%2C+not+to+assume+without+demonstration.+Indeed%2C+the+body+and+soul+of+Christ%2C+at+the+time+of+His+death%2C+were+united+to+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%2C+but+were+not+united+with+each+other+%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%3A+seeing+that+they+were+at+an+incredible+distance+from+each+other.+But%2C+says+our+opponent%2C+what+things+are+united+to+a+single%2C+altogether+simple%2C+indivisible%2C+and+indistant+third+thing%3B+those+are+united+and+present+to+each+other+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%29.+Response%3A+If+that+third+altogether+simple+and+indivisible+thing+be+finite%2C+we+grant+what+our+opponent+maintains%3A+but%2C+if+it+be+infinite+and+omnipresent%2C+united+to+which+were+the+body+and+soul+of+Christ+at+the+time+of+His+death%2C+we+do+not+at+all+grant+it.+The+falsity+is+perfectly+evident.+Elijah+and+I+are+united+to+a+third%2C+altogether+simple%2C+indivisible%2C+indistant%2C+namely%2C+God.+But%2C+who+would+say%2C+that+I%2C+existing+on+the+earth%2C+am+present+by+substantial+proximity+to+Elijah%2C+existing%2C+not+on+earth%2C+but+in+heaven%3F+Therefore%2C+the+mystery+vanishes.+That+personal+presence%2C+whereby+body+and+soul%2C+being+locally+separated+by+the+whole+heaven%2C+were+nevertheless+altogether+present+to+each+other+%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+in+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%2C+is+not+a+great+mystery%2C+but+a+great+and+contradictory+fiction.+We+turn+that+argument+back+upon+our+opponents.+What+in+substance+is+everywhere%2C+that+is+absent+from+no+place+with+respect+to+essence+or+substance.+But+the+soul+of+Christ%2C+in+the+death+of+Christ%2C+because+of+the+union+with+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos+%28according+to+the+Lutheran+hypothesis%29%2C+in+substance+was+everwhere.+Therefore%2C+the+soul+of+Christ+was+absent+from+no+place+with+respect+to+its+substance%3A+and+by+consequence%2C+it+was+also+in+its+body%2C+and+was+united+to+it+%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+and+so+was+not+separated+from+it%3A+which+the+Suebi+maintain%3A+but+Meisner+with+other+Lutherans+does+not+maintain+it%2C+against+the+Lutheran+hypotheses.%E2%80%9D%0A%0A%E2%80%94+Marcus+F.+Wendelin%2C+Christian+Theology+3rd+ed.+%281634%29%2C+Species+of+the+Office+of+Christ%2C+pt.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2cba7293f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2cba7293f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/#:~:text=The%20Lutherans%20teach%2C%20and%20that%20rightly,maintain%20it%2C%20against%20the%20Lutheran%20hypotheses&amp;text=The%20Lutherans%20teach%2C%20and%20that%20rightly%2C%20that%20in&amp;text=does%20not%20maintain%20it%2C%20against%20the%20Lutheran%20hypotheses" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

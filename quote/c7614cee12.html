<main class="wrap"><figure class="quote" id="q-c7614cee12" data-kw="">
<blockquote><p>There is a twofold trial of doctrine, private and public. The private trial is that by which every one settles his own faith, when he wholly acquiesces in that doctrine which he knows has come from God. … Public trial refers to the common consent and polity of the Church; for as there is danger lest fanatics should rise up, who may presumptuously boast that they are endued with the Spirit of God, it is a necessary remedy, that the faithful meet together and seek a way by which they may agree in a holy and godly manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af1d9fc9d0" data-kw="">
<blockquote><p>We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 5 (pp. 433–34)</span></figcaption>

</figure><figure class="quote" id="q-12c2017005" data-kw="">
<blockquote><p>The fact that all the true people of God in every age and in every part of the Church, in the exercise of their private judgment, in accordance with the simple rules above stated, agree as to the meaning of Scripture in all things necessary either in faith or practice, is a decisive proof of the perspicuity of the Bible, and of the safety of allowing the people the enjoyment of the divine right of private judgment.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-80a0035d97" data-kw="">
<blockquote><p>God hath made it the duty of men to spend their appointed time in the world, in his Service &amp; to his Glory, And indeed it is most just and reasonable that it should be so; for God is a Being of infinite Dignity &amp; Excellency, and all men have received their life &amp; being from Him, and he sustains them day and night and keeps them every moment: He is the Fountain of all that good that they enjoy or hope for. Upon God men have an absolute and entire dependence for all that they have, and for all that they need, &amp; that both for time &amp; eternity; and to Him they are under the highest Obligations: And therefore by the very law of their Creation, &amp; by all the laws &amp; rules of Reason &amp; equity, of Gratitude Piety, Prudence &amp; Self-interest, they are bound to serve and glorify God.

And indeed that men should spend their whole time, &amp; improve all their opportunities &amp; talents for that God who is a Being of all possible Perfection, whose Creatures they are, and whose Service and Glory is the very end of their being, &amp; of all that they are &amp; have, is a duty so reasonable, that there can be no just Objection against it, nor any good Excuse made for the neglect of it. Deut. 10.12. And now, Israel, what doth the Lord thy God require of thee, but to fear the Lord thy God, &amp; to walk in his ways, &amp; to love him, &amp; to serve the Lord thy God, with all thy heart, and with all thy soul?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-edwards.html">Timothy Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All the living must surely die, and go to judgment. A sermon (with some little, and but little enlargement in a few particulars) preached before the General Assembly of the colony of Connecticut at Hartford, on the day of election there, on May 11th. 1732</cite>, (New London CN: T. Green, 1732), pp 9-10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86a8512fe1" data-kw="">
<blockquote><p>In Dr. [Alexander] Whyte’s opinion, at no time has any land for its size, save Palestine, produced “so many men and women of a profoundly spiritual experience, and of an adoring and heavenly mind, as Scotland possessed in the sixteenth and seventeenth centuries”.

In his ecstasy he exclaims, “What minds and what hearts those men and women had! And how they gave up their whole mind and heart to the life of godliness in the land, and to the life of God in their own hearts! How thin and poor our religious life appears beside theirs!”

To the causes which he suggests for this superiority — the persecution, the new Reformation doctrines, the masculine and Pauline preaching — other two at least may be added, the solid and serious books then in favour, and the place assigned to the inspired psalms, now too often usurped by frothy hymns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dr Whyte and Samuel Rutherford (1894) in Critical Reviews Relating Chiefly to Scotland</cite></span></figcaption>

</figure><figure class="quote" id="q-8e788fe5f2" data-kw="">
<blockquote><p>Our fathers worshipped in this mountain. The Samaritans at that time did, as we learn from the words of the woman, what is customary with those who have revolted from true godliness, to seek to shield themselves by the examples of the Fathers. It is certain that this was not the reason which induced them to offer sacrifices there, but after that they had framed a false and perverse worship, obstinacy followed, which was ingenious in contriving excuses. I acknowledge, indeed, that unsteady and thoughtless men are sometimes excited by foolish zeal, as if they had been bitten by a gad-fly, so that when they learn that any thing has been done by the Saints, they instantly seize on the example without any exercise of judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, trans. William Pringle (repr. Bellingham, WA: Logos Bible Software, 2010), 155.</span></figcaption>

<blockquote><p>God hath made us for mutual society; He hath made us so that continual strain on body or mind without recreation is destructive to our health and usefulness. No enlightened conscience will see any inconsistency between healthful and happy recreation, on the one hand, and glorifying God, on the other. These very recreations, and whatsoever he doeth, the enlarged and free-hearted believer can do — to the glory of God.

Only let this principle really rule, — ‘How may I best and to the utmost degree glorify God?’ — and all narrow, creeping, bondage-ridden questions, and all symptoms of a timid, hampered, unmanly, faltering, unfree walk with God, will disappear. And without a free, holy, cordial, open, ingenuous walk with God, all minute and accurate and verbal and mechanical rules might most mechanically and accurately and minutely be observed, but the soul of man be not any more trained to the exalted dignity of a free companionship and unfettered friendship with Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prophet Jonah: His Character and Mission to Nineveh</cite>, (London: Alexander Strahan, 1866), p. 179.</span></figcaption>

<blockquote><p>See here: a Christian must not think or undertake to arrange his affairs so that he is praised and blessed by the people of this world. No, it is already decided that he must expect shame and cursing, and submit to it and yield. He can expect no blessing other than from Simeon in the temple. Scripture is our comfort. It praises and blesses all who are cursed by the world for Christ’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Year in the Gospels with Martin Luther</cite>, (p. 185). Concordia Publishing. Kindle Edition.</span></figcaption>

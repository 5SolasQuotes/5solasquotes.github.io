<blockquote><p>II. God made Man in his own Image in respect of Intellect and Understanding, Knowledge and Wisdom.

God is the Only-wise perfect in Knowledge, and his Understanding is infinite. So his Word speaks of Him, and his Works declare it of Him. He that formeth the Eye, shall He not see? and He that teacheth Man Knowledge shall He not know? There is not a Soul so brutish as not to allow this.

Man, in his Soul and Body is the most eminent Display of the Knowledge and Wisdom of God here on Earth. The Mind and Eye of Man survey the Heavens, Earth, Seas and all the Creatures, and see how in Wisdom God hath made them all. Then we behold our Selves alone, among all the Creatures here on Earth, capable of this Understanding, and are led to say unto our Selves and unto God, Where is God my Maker! that teacheth me more than the Beasts of the Earth, and maketh me wiser than the Fowl of Heaven.

Man in his first State was happy and glorious in a Perfection of Knowledge and Wisdom, proper for an imbodied Spirit. He had not the Knowledge of Angels, for he was made lower than they; but he was wise as an Angel in Flesh should be. He was created with a due Knowledge of God his Maker, of Himself, and of the Creatures about him. God spake to our first Parents, and they to each other in an admirable manner, as is related by Moses. Their Minds were full of Light, the Law of God was in their Heart, and they were in the Possession of their own Souls and of Intellectual Happiness. They wanted no more Knowledge of Good at the Time, and to be sure needed no Knowledge of Evil.

This Understanding of Man was a Beam from the Light of the Knowledge and Glory of God upon him. God made him like Himself an Intellect, an Intelligence; the Inspiration of the Almighty gave him his Understanding. In his Light Man saw Light. And now Souls are renewed in Knowledge after the Image of God. They are renewed into the Likeness, in part, wherein they were first created. As they grow in holy Knowledge, they are changed more and more into the Divine Image from Glory to Glory.

The Devil tempted our Parents to aspire after more Knowledge, and so they fell. The Father of Light had given them as much of this perfect Gift as was good and fitting for them. This should have highly contented them, and filled ’em with Delight and Thankfulness. And so it did, until the false Fiend persuaded them to think, that GOD forbid ’em the Tree of Knowledge left it should make ’em wiser and better than they were.

Alas! they found nothing by it but the Knowledge of Sin and Misery, of which it was their Happiness to be ignorant; and they lost the Knowledge of all the Good which they before enjoyed. We remain miserable, and perish in our Ignorance of God, unless we are renewed after Him in Knowledge. True spiritual Wisdom is restored in the Regeneration of Souls. God gives the Light of the Knowledge of his Glory in the Face of JESUS CHRIST. They who were sometimes Darkness, are made Light in the Lord. They are full of Goodness, filled with all Knowledge.

That the Soul be without Knowledge, is not good. It is very evil to it to be so. What is a dark and blind Soul good for! the Light that is in it is Darkness. The Light of Life is from the Father of Glory, the Father of Christ, the Eyes of our Understanding being-enlightned, to know the Hope of his Calling. God gives the Spirit of Wisdom and Revelation in the Knowledge of his Son. This is the Image of the Father restored in his Elect. So they become again the Children of God; filled with the Knowledge of his Will, in all Wisdom and spiritual Understanding.

What a bright Account is this, given by the Holy Ghost, of the Image of God on the Soul of Man, in respect of Knowledge! Not only has Man an Understanding which reflects on its own Acquirements, and (as an excellent Divine of our own says) “reads its own Knowledge, and communicates it to others; but the true and high Glory of this created Intellect is,” that it is capable of knowing God unto Eternal Life; for this is Life Eternal to know Him the only true God and Jesus Christ whom be has sent. And if Souls regenerated by the Spirit of God receive from him a sanctified Mind, a spiritual Discerning of Things relating to their own Duty and Happiness; how much more must we suppose our first Parents in their state of Integrity and Perfection to be bless’d with a most holy Knowledge and spiritual Discerning?</p></blockquote>

<blockquote><p>§XXVII. With respect to Duration, the human soul is immortal, which Christian Religion teaches against the Sadducees, Epicureans, and Atheists, who think that souls are extinguished with their bodies. This is contradicted by: 1. Scripture, Eccl. 12:7, “The dust returns to its earth from whence it was, and the Spirit returns to God who gave it.” Mt. 10:28, “Fear not them which kill the body, but are not able to kill the soul: but rather fear him, which is able to destroy both soul and body in Hell.” Mt. 22:32, “I am the God of Abraham, and the God of Isaac, and the God of Jacob: God is not the God of the dead, but of the living.” Lk. 16:23, “The rich man in torments saw Abraham afar off, and Lazarus in his bosom,” etc. Lk. 23:43, Christ to the converted thief: “Today you will be with me in Paradise.” v. 46, Christ, expiring, cried out: “Father, into your hands I commend my Spirit.” 2 Cor. 5:8, Paul says: “We are willing rather to be absent from the body, and to be present with the Lord.” Phil. 1:23, “I have a desire to depart, and to be with Christ.” 1 Pet. 3:19, “By which also he went and preached unto the spirits in prison,” etc. add Ps. 49:15, “God will redeem my soul from the power of the grave: for He shall receive me.” 2 Sam. 12:23, “But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.” 1 Kn. 17:21, “O Lord my God, I pray thee, let this child’s soul come into him again.</p></blockquote>

<blockquote><p>V. The Romanists hold original righteousness to be a supernatural gift, super-added to the native gifts and powers of the entire man. [Robert] Bellarmine explains the reason why they determine this to be so. There was in man naturally a contest between the flesh and the spirit, the reason and the appetite [lower desirous part], from which flowed a certain disease and languor of nature, arising from the condition of the material. Therefore God added original righteousness as a ‘golden bridle,’ to repress that conflict and to cover like a precious garment their nakedness, and as a remedy to heal that weakness (‘De gratia primi hominis,’ 5, 6 in Opera [1858], 4:23-29) This is the more common opinion among them, although the Jansenists and others exclaim loudly against it. Whence arose this expression of the [Medieval] Scholastics: ‘Naturals remained untouched, but the supernaturals only were lost.&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“V. The Romanists hold original righteousness to be a supernatural gift, super-added to the native gifts and powers of the entire man. [Robert] Bellarmine explains the reason why they determine this to be so. There was in man naturally a contest between the flesh and the spirit, the reason and the appetite [lower desirous part], from which flowed a certain disease and languor of nature, arising from the condition of the material. Therefore God added original righteousness as a ‘golden bridle,’ to repress that conflict and to cover like a precious garment their nakedness, and as a remedy to heal that weakness (‘De gratia primi hominis,’ 5, 6 in Opera [1858], 4:23-29) This is the more common opinion among them, although the Jansenists and others exclaim loudly against it. Whence arose this expression of the [Medieval] Scholastics: ‘Naturals remained untouched, but the supernaturals only were lost.&#x27;”

— Francis Turretin, The Reformed View, The Common View of Romanism, p. 471">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+The+Romanists+hold+original+righteousness+to+be+a+supernatural+gift%2C+super-added+to+the+native+gifts+and+powers+of+the+entire+man.+%5BRobert%5D+Bellarmine+explains+the+reason+why+they+determine+this+to+be+so.+There+was+in+man+naturally+a+contest+between+the+flesh+and+the+spirit%2C+the+reason+and+the+appetite+%5Blower+desirous+part%5D%2C+from+which+flowed+a+certain+disease+and+languor+of+nature%2C+arising+from+the+condition+of+the+material.+Therefore+God+added+original+righteousness+as+a+%E2%80%98golden+bridle%2C%E2%80%99+to+repress+that+conflict+and+to+cover+like+a+precious+garment+their+nakedness%2C+and+as+a+remedy+to+heal+that+weakness+%28%E2%80%98De+gratia+primi+hominis%2C%E2%80%99+5%2C+6+in+Opera+%5B1858%5D%2C+4%3A23-29%29+This+is+the+more+common+opinion+among+them%2C+although+the+Jansenists+and+others+exclaim+loudly+against+it.+Whence+arose+this+expression+of+the+%5BMedieval%5D+Scholastics%3A+%E2%80%98Naturals+remained+untouched%2C+but+the+supernaturals+only+were+lost.%27%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+The+Reformed+View%2C+The+Common+View+of+Romanism%2C+p.+471&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17814f72ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17814f72ff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/man-the-image-of-god#:~:text=V.%20The%20Romanists%20hold%20original%20righteousness,but%20the%20supernaturals%20only%20were%20lost&amp;text=V.%20The%20Romanists%20hold%20original%20righteousness%20to%20be&amp;text=remained%20untouched%2C%20but%20the%20supernaturals%20only%20were%20lost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6ff5893400" data-kw="">
<blockquote><p>V… From this habitual righteousness, like a fountain, actual holiness arose in the lower faculties and the entire composite. The harmony (συμμετρία) of the sensitive appetite, both in desire (ἐπιθυμία) and passion (πάθος), was conformed to the superior faculties and right reason. This assembly of habits (commonly called Original Righteousness) constituted this image of God, particularly as its highest point (καρυφαῖον)…</p></blockquote>

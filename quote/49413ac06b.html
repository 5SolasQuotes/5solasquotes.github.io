<main class="wrap"><figure class="quote" id="q-49413ac06b" data-kw="">
<blockquote><p>There is obviously much to be learned from both successful CEOs and also great generals, but both models can quickly become toxic. When either becomes the primary model for Christian leadership, is it any wonder that domineering pastors result? The pastor-as-CEO approach might foster entrepreneurialism and risk-taking, but it easily becomes results-oriented. The pastor-as-general approach might foster perseverance and grit, but it easily becomes task-oriented. One produces swagger: Their word is law because they’re economically indispensable to the church. The other produces presumption: Orders must be followed because the general ‘knows’ what is best for every person. In each case we either tolerate or fail to see traits of bullying, because ministry ends justify ministry means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sam-allberry.html">Sam Allberry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How Do Churches End Up with Domineering Bullies for Pastors?’</cite>, (2019) 17 paragrpahs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

<blockquote><p>In the sixth petition (which is, ‘And lead us not into temptation, but deliver us from evil’) acknowledging, that… we… are not only subject to be tempted, and forward to expose ourselves unto temptations,[l] but also of ourselves unable and unwilling to resist them, to recover out of them, and to improve them;[m] and worthy to be left under the power of them:[n] we pray, that God would so over-rule the world and all in it,[o] subdue the flesh,[p] and restrain Satan,[q] order all things,[r] bestow and bless all means of grace,[s] and quicken us to watchfulness in the use of them, that we and all his people may by his providence be kept from being tempted to sin;[t] or, if tempted, that by his Spirit we may be powerfully supported and enabled to stand in the hour of temptation;[v] or when fallen, raised again and recovered out of it,[w] and have a sanctified use and improvement thereof:[x] that our sanctification and salvation may be perfected,[y] Satan trodden under our feet,[z] and we fully freed from sin, temptation, and all evil, for ever.[a] [l] Matt. 26:69-72. Gal. 2:11-14. 2 Chron. 18:3 compared with 2 Chron. 19:2. [m] Rom. 7:23,24. 1 Chron. 21:1-4. 2 Chron. 16:7-10. [n] Ps. 81:11,12. [o] John 17:15. [p] Ps. 51:10. Ps. 119:133. [q] 2 Cor. 12:7,8. [r] 1 Cor. 10:12,13. [s] Heb. 13:20,21. [t] Matt. 26:41. Ps. 19:13. [v] Eph. 3:14-17. 1 Thess. 3:13. Jude 24. [w] Ps. 51:12. [x] 1 Pet. 5:8-10. [y] 2 Cor. 13:7,9. [z] Rom. 16:20. Zech. 3:2. Luke 22:31,32. [a] John 17:15. 1 Thess. 5:23.</p></blockquote>

%3A%2F%2F5solasquotes.github.io%2Fquote%2F561d6a751d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/561d6a751d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hyper-spirituality/#:~:text=In%20the%20sixth%20petition%20%28which%20is,a%5D%20John%2017%3A15.%201%20Thess.%205%3A23&amp;text=In%20the%20sixth%20petition%20%28which%20is%2C%20%E2%80%98And%20lead&amp;text=Luke%2022%3A31%2C32.%20%5Ba%5D%20John%2017%3A15.%201%20Thess.%205%3A23" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ea82d63427" data-kw="">
<blockquote><p>You will say, ‘Yet it seems more happy to depart sooner out of this wretched life unto the heavenly rest than by long living to abide continual trouble and to lack that wished quiet the longer.’ I answer, If life of itself is the gift of God, then it is certainly good. If it be good, surely it is good of itself to enjoy it long. And for that, that sometimes in this life chances to come afflictions and many troubles, it is to be referred unto the accidents, and not to the substance itself of this goodness. Neither is the gift of God to be wished away, wherein He grants us to live and to tarry long in this life: and I speak not of the rest of the benefits wherewith God does both spiritually and corporally augment and garnish this our present life with all. Neither it follows that it is therefore evil to live because it is better to live in heaven than in earth. This present state, and the state of our life to come be not contraries, but of subordinate things one to another, as earth is also and heaven. The earth is good; heaven is better. It is in a sort good of itself to live; it is better if a man live honestly and uprightly; it is best of all, if it be given us to live in best sort and most happily, as we shall live in the country of Heaven. It takes not away that which is chiefly good, but does accomplish the goodness of those things which be of an inferior order [are] and conveniently set in order by God’s ordinance. The condition and nature of our soul is more noble than that of our body. And yet he must be worthy to have not body, nor soul whosoever will say the body is evil because the soul is better. Gold passes silver, yet silver is good, though gold be better. He is not worthy to have silver that in respect of gold sets nothing by silver. So likewise we must judge of our life. Let us acknowledge the gift of God, not only in the life to come, but also in this present life and in the long continuance thereof, if it come by the benefit of God. Let us not be wayward in God’s gifts, but kind. It is the part of a grateful mind so to commend the chief and best benefits, that withal he despise not the meaner and inferior. It is the voice of holy, not of carnal men that says, We have life, bless the Lord. And the Scripture rehearses among the benefits of God bestowed upon Abraham the father of the believers that he died in a good age, old and full of days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion</cite>, (1560; London, 1563) | 5th Commandment, fol. 75.a-b</span></figcaption>

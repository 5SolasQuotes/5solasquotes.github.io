<main class="wrap"><figure class="quote" id="q-8cc0c0b6f2" data-kw="">
<blockquote><p>For as no man receives that general justification which discharges from the guilt of all foregoing sins, but on the concurrence of repentance, faith, a purpose of a new life, and other actions of the same kind; so no man retains a state free from guilt in respect of following sins, but by means of the same actions of believing in God, calling on God, mortifying the flesh, daily repenting and sorrowing for sins daily committed. The reason why all these are required on our part is this: Because these cannot be still absent, but their opposites will be present, which are contrary to the nature of a justified man—As therefore to the conservation of natural life it is necessarily required that a man carefully avoid fire, water, precipices, poisons and other things destructive to the health of the body; so to the conserving of spiritual life, it is necessarily required that a man avoid incredulity, impenitency and other things that are destructive and contrary to the salvation of souls; which cannot be avoided unless the opposite and contrary actions be exercised. And these actions do not conserve the life of grace properly and of themselves by touching the very effect of conservation, but improperly and by accident, by excluding and removing the cause of destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 10, sect. 3, pp. 322-23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc9dff461e" data-kw="">
<blockquote><p>The Discourse of Albertus Pighius… shall be once again repeated, both for its Worth and Truth…: ‘…God therefore does justify us by his free grace or goodness wherewith he embraces us in Christ Jesus, when he clothes us with his innocency and righteousness as we are ingrafted into Him; for as that alone is true and perfect which only can endure in the sight of God, so that alone ought to be presented and pleaded for us before the divine tribunal, as the advocate of, or plea in our cause; resting hereon, we here obtain the daily pardon of sin; with whose purity being covered, our filth and the uncleanness of our imperfections are not imputed unto us, but are covered as if they were buried, that they may not come into the Jugdment of God; until the old man being destroyed and slain in us, divine Goodness receives us into peace with the second Adam.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677)</span></figcaption>

</figure><figure class="quote" id="q-a6e7e6bf5f" data-kw="">
<blockquote><p>the word ‘justify’ has two meanings, the first signifies to absolve anyone from crimes… and to pronounce him just, and is opposed to the word ‘to condemn;’ and this signification is altogether forensic. The other meaning of the word is, that a man is made just from being unjust, as also to be sanctified is, to be made holy from being profane; in which signication the apostle has said, ‘And such were some of you, etc. [1 Cor. 6:11]’, i.e. you have been made, from being unclean, clean, holy from being profane, just from being unjust, by the Holy Ghost, on account of Christ, in whom you believe. To which meaning relates that passage also, which we read in the Revelation, ‘He that is just, let him be justified still more,’ i.e. let him become in truth, from being just, still more just, viz., in the same way as from being unjust, he had been made just. And the Fathers and especially S. Augustine, have interpreted the word in this sense… These are two certain meanings of this word ‘to justify’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, vol. 6, thesis 13, p. 81 [or 84?] in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-ebd9cd8cc4" data-kw="">
<blockquote><p>A double accusation may be brought against man before the tribunal of God: that he is a sinner, and so guilty of the breach of the first covenant [of Works]; or that he is no sound believer, having not fulfilled the condition [i.e. faith] of the second [covenant, i.e. of grace]. As to the first accusation, we are justified by faith; as to the second, by works; and so James and Paul are reconciled (Rom. 3:24; Jm. 2:24): “A man is justified by faith without the deeds of the law,” and “a man is justified by works and not by faith only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 16, on 2 Cor. 5:10 in A Second Volume of Sermons</cite>, … (London: Astwood, 1684), pp. 97-103 See especially, p. 100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>779. Now besides this justification of the sinner which has its place in the first conversion of the sinner to God and which is renewed so long as he repents (for the faithful life is the continual exercise of faith), he is also given a justification of the just which is by works, which James discusses. 780. By this we understand the declaration of God with respect to the accusation of Satan, since in the regenerated sinner are true, colored, and indubitable signs and proofs of true faith which are pleasing to Him, and which are required among the heirs of the goods of grace. 781. This second justification is necessarily connected with the first (it is necessary to distinguish this from the variation of the Papists) so that it cannot be separated from it for any reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamentals of Sacred Theology Pre</cite>, (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 186 Note Vitringa does not clearly join these two justifications as one, and it is said by the editor in a footnote that he later dropped the language of a “second” justification.</span></figcaption>

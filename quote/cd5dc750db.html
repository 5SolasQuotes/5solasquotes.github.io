<main class="wrap"><figure class="quote" id="q-cd5dc750db" data-kw="">
<blockquote><p>It may be observed, in passing, that there is a double sense in which we may speak of Christ’s purchase; First, Strictly and properly, when we regard Him as purchasing men; and secondly, More improperly, when we consider Him as purchasing benefits for men. This last view [the second], as we have hinted, is rather figurative and metaphorical than real and literal; for the idea of his purchasing benefits from the Father for mankind, must ever be understood in consistency with the Father’s sovereignty, and his pre-existing love to the children of men. The Father is not induced or persuaded to bestow benefits on men by a price paid to Him; but being antecedently full of compassion to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Completeness &amp; Extent of the Atonement, with Especial Reference to the Universal Offer of the Gospel &amp; the Universal Obligation to Believe</cite>, (1845), pp. 4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f272c40d97" data-kw="">
<blockquote><p>Common grace is great and undeserved mercy to a sinner, and would save him if he did not resist and frustrate it. In and by it, ‘God commandeth all men everywhere to repent,’ and whoever repents will find mercy… Scripture denies that God is under obligation to follow up his defeated common grace with his irresistible special grace. It asserts his just liberty to do as He pleases in regard to imparting that measure of grace which produces the new birth, and makes the sinner ‘willing in the day of God’s power.’… God sincerely desires that the sinner would hear his outward call, and that his common grace might succeed with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 5, pp. 48-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-ff35eaf9cf" data-kw="">
<blockquote><p>We must not view these ways of talking about the love of God as independent, compartmentalized, loves of God… as if each were hermetically sealed off from the other… If you absolutize any one of these ways in which the Bible speaks of the love of God, you will generate a false system that squeezes out other important things the Bible says, thus finally distorting your vision of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-a-carson.html">D.A. Carson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Difficult Doctrine of the Love of God</cite>, (Crossway, 2000), pp. 23, 75, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love (n.d.), p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

— D.A. Carson, The Difficult Doctrine of the Love of God (Crossway, 2000), pp. 23, 75, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love (n.d.), p. 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+not+view+these+ways+of+talking+about+the+love+of+God+as+independent%2C+compartmentalized%2C+loves+of+God%E2%80%A6+as+if+each+were+hermetically+sealed+off+from+the+other%E2%80%A6+If+you+absolutize+any+one+of+these+ways+in+which+the+Bible+speaks+of+the+love+of+God%2C+you+will+generate+a+false+system+that+squeezes+out+other+important+things+the+Bible+says%2C+thus+finally+distorting+your+vision+of+God.%E2%80%9D%0A%0A%E2%80%94+D.A.+Carson%2C+The+Difficult+Doctrine+of+the+Love+of+God+%28Crossway%2C+2000%29%2C+pp.+23%2C+75%2C+as+quoted+by+Ian+Murray%2C+The+Cross%3A+the+Pulpit+of+God%E2%80%99s+Love+%28n.d.%29%2C+p.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff35eaf9cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff35eaf9cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/common-grace#:~:text=We%20must%20not%20view%20these%20ways,finally%20distorting%20your%20vision%20of%20God&amp;text=We%20must%20not%20view%20these%20ways%20of%20talking&amp;text=says%2C%20thus%20finally%20distorting%20your%20vision%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…ye do always resist the Holy Ghost…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>

— Matthew Henry, Commentary on the Bible">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6ye+do+always+resist+the+Holy+Ghost%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Matthew+Henry%2C+Commentary+on+the+Bible&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5a5ae2bda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5a5ae2bda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/#:~:text=ye%20do%20always%20resist%20the%20Holy%20Ghost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-17f9255f8e" data-kw="">
<blockquote><p>Secondly, we must from hence be exhorted to take heed of usurping Christ’s honor to our selves, of being our own rule or way. The Lord is a jealous God, and will not suffer any to be a self mover, or a God unto himself. It is one of God’s extremest judgments to give men over to themselves, and leave them to follow their own rules. When He has first woo’d men by his Spirit, and that is resisted; enticed them by his mercies, and they are abused; threatened them with his judgments, and they are mis-attributed to second causes; cried unto them by his prophets, and they are reviled; sent his own Son to persuade them, and He is trampled on and despised: when He offers to teach them, and they stop their ears; to lead them, and they pull away their shoulder; to convert them, and they hardened their heart; when they set up mounds against the Gospel, as it were to non-plus and pose the mercies of God, that there may be no remedy left; then after all these indignities to the Spirit of Grace, this is the judgement with which God uses to revenge the quarrel of his Grace and Covenant, to leave them to the hardness and impenitency of their own hearts, to be a rule and way unto themselves. My people would not hearken to my voice, and Israel would none of me. … [Reynolds below is describing Christ’s offers, wooings and entreaties both before and after conversion, which is clear from the beginning and end of the quote] We see then, to conclude all, what an absolute necessity lies upon us of having Christ, because with Him we have All things, and can do all things: without Him we are poor and can do nothing. And the more necessary the duty, the more sinful the neglect: especially considering that Christ withholds not Himself, but is ready to meet, to prevent, to attend every heart that in truth desires Him. If a man have a serious, simple, sincere will, to come wholly to Christ, not to be held back from him by His dearest and closest corruptions, by the sweetest pleasures, or strongest temptations, which can allure or assault him, he may draw near unto Him with boldness, and assurance of acceptation: he has a call, Christ invites [Margin Note: Rev. 22:17], yea entreats him, and therefore he may come: he has a command, Christ requires it of him, and therefore he must come. And now when we have Christ, how careful should we be to keep Him; how tender and watchful over all our behaviors towards Him, lest He be grieved and depart again. The Spirit of the Lord is a delicate spirit, most sensible of those injuries which his friends do Him. Let us therefore take heed of violating, afflicting, discouraging, grieving this Spirit (which is the bond of all our union and interest with Christ) in any of those his sacred breathings and operations upon the Soul. But when He teaches, let us submit and obey, receive the belief and the love of His Truth: when He promises, let us neither distrust nor despise, but embrace as true, and admire as precious, all the offers which He makes to us: when He contends with our lusts in His Word and secret suggestions, let him not always strive, but let us give up our fleshly affections to be crucified by Him: when He woos and invites us, when He offers to lead and to draw us, let us not stop the ear, or pull away the shoulder, or draw backward like froward children, or cast cold water in the face of Grace, by thwarting the motions, and rebelling against the dictates thereof, but let us yield our selves unto Him, captivate all our lusts, and consecrate all our powers, and submit all our desires to His rule and government; and then when He has been a Spirit of union, to incorporate us into Christ’s Body; and a Spirit of unction, to sanctify us with His Grace, He will undoubtedly be a Spirit of comfort and assurance, to seal us unto the day of our full redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Christ, from his Three Treatises</cite></span></figcaption>

<blockquote><p>…and if Brownism be a bitter error and way, then the way of the Apologists [who are congregationalists] is not very sweet, their way being but Brown’s younger brother, agreeing with the Brownists in the nature and definition of the visible Church, in the independent power of a particular congregation, in the way of making officers, in the way of their ordinances, as prophesying, in the way of forms of prayer, in the sacraments, none to be admitted but church members, cum multis alijs [with many other things], and I desire the Apologists to give any material difference (however their grounds are different, and they do not go so far in consequences, nor are not so gross) between their churches and the Brownists:</p></blockquote>

</figure><figure class="quote" id="q-20a88fffc5" data-kw="">
<blockquote><p>Last of all, we are to distinguish between the condition of the primitive churches, before the division of parishes, and the state of our churches now after such division. At the first, when the multitude of Christians in those great cities of Rome, Corinth, Ephesus, etc. was not divided into several parishes, the common presbytery in the city did suffice for the government of the whole [as described in the N.T.], and there was no need of a particular consistory [session] of elders for every assembly and congregation of Christians within the city, except perhaps to admonish, rebuke or exhort, or to take notice of such things as were to be brought into the common presbytery. But after that parishes were divided, and Christian congregations planted in the rural villages, as well as in the cities, from henceforth it was necessary that every congregation should have at hand, within itself, a certain consistory, for some acts of church government, though still those of greater importance were reserved to the greater presbytery… If it be said that I seem to deny the divine right of the same, or that they have any warrant from the pattern of the apostolic Church, I answer: I acknowledge the conformity of the same with the pattern thus far:

1. It is to be suposed that in some small cities (especially the same not being wholly converted to the Christian faith) there was but one Christian congregation, the eldership whereof did manage matters of jurisdiction proper thereto.

2. Even in the great cities, at the first there was but one congregation of Christians, and so but one particular eldership.

3. After that the Gospel had spread, and Christians were multiplied in those great cities, it is true, they were all governed by a common presbytery, but that presbytery was not remote, but ready at hand among themselves. Now in this we keep ourselves as close to the pattern, as the alteration of the Church’s condition by the division of parishes will suffer us, that is to say, we have a common presbytery for governing the congregations within a convenient circuit, but withal our congregations have, ad manum, among themselves, an inferior eldership for lesser acts of government; though in respect of the distance of the seat of the common presbytery from sundry of our parishes, they cannot have that ease and benefit of neareness which the apostolic Churches had, yet by the particular elderships they have as great ease of this kind as conveniently can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, ... (Edinburgh: 1641), pt. 2, ch. 2, 128-30</span></figcaption>

</figure><figure class="quote" id="q-4a9baf2d85" data-kw="">
<blockquote><p>The exercise of the keys to preach and administer the seals of grace, to open and shut Heaven by the keys, is given to the rulers in some things as they are scattered and single men, as to preach and administer the sacraments, without consent in special to every singular act: in some things, as to exercise power of jurisdiction, the exercise and the power is given to a community, not to one, unitati, non uni [a unity is not one], as Gerson observes from Augustine, and Augustine from the Word, Mt. 16; for the Church, not one single man, has power of discipline:</p></blockquote>

<blockquote><p>2. We deny also that by such a church-covenant [of the Independents] that right is obtained which the members of a Church in ecclesiastical communion have to the sacraments of grace, the privileges of the ecclesiastical ministry and other benefits which Christ has given to his Churches. The reasons of our denial are these:

1. Because the apostles have not ordained any such church-covenant between the members and the pastors of a church; neither in the admission of members into the Church did require such a covenant as necessary: but by the sacrament of baptism they received such as professed the truth and holiness into the Church-visible, and joined in the same exercises of divine worship with those who were without any such covenant received into an ecclesiastical body with themselves. See Acts 2:42,47; 5:13; 8:12; 9:6 &amp; 18:8.

2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithful of the whole national Church renewed their Covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant.

3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God hath not enjoined; without damnable will-worship. But God has not enjoined such a Covenant on the consciences of men as absolutely necessary: for there is no law of God wherein He has enjoined a necessity of this covenant as the essential form of Church-communion, so as that without it no man can be [a] member of a visible Church, or have right to the seals of the Covenant: Therefore the necessity of this covenant is a will-worship and so to be rejected.

4. The means whereby the members of a Church-visible are associated and united into external ecclesiastical communion, are baptism under the New Testament, as circumcision was under the Old Testament, 1 Cor. 12:13, as Cornelius, Acts 10:47, Lydia, Acts 16:15 and others, were by baptism engrafted into the body of the Church visible: which in those of years is joined with an embracing and profession of sound doctrine and subjection to the ordinances of God; as appears in the believers, Acts 2:41, the Bereans, Acts 17:10, and by Christ’s commandment, Mt. 28:19. Hence say the Professors of Leiden, that beside the primary uses of the sacrament of baptism, there are other secondary uses of it: to wit, the external engrafting them into a particular visible Church, Acts 2:41, the uniting of Christs members amongst themselves and into one body: 1 Cor. 12:12, and consequently upon these, a signification of our profession; and a distinction and separation from all other assemblies of unbelievers. This Church-covenant therefore is not the formal reason of our ecclesiastical communion in the Church-visible. Hence also our churches of the Netherlands in admitting of pastors or Church members do not enter into any such Church-covenant: which yet are true visible Churches of God; whose members have all essential requisites necessary to Church communion in the visible-Church. … 3. We reject also the opinion of those who affirm that the sacraments of the Old and New Testament are signs and seals to confirm this Church-covenant, and so instituted by God for the ratifying of it; that they are to be administered to those only, who are by such a Church-covenant united amongst themselves; but to be denied to others, though known to be godly, who be not in such a Church-communion and strict fellowship. Whereas it does most clearly appear out of the holy Scriptures that the sacraments were instituted by God in his Church, chiefly and in the first place to be signs and seals of the Covenant of Grace, and of the benefits promised in the Covenant of Grace, and of salvation procured by Christ for us, as is manifest by the sacrament of circumcision, Gen. 17:7,10; Rom. 4:11, of the Passover, 1 Cor. 5, of Baptism, Mark 1:4; Acts 2:38-39 and 22:16; Rom. 6:3-4; Titus 3:5, and of the Lord’s Supper, Mt. 26:26-28; 1 Cor. 11:24-26. But in a secondary respect we acknowledge the Sacraments to be seals of our outward engrafting into the Church-visible, and our conjunction into one body of the Church, Acts 2:41; 1 Cor. 12:12-13, and that, as we conceive, of the catholic Church; so that he that is baptized is not baptized into the communion only of this or that particular, or parochial Church, but is joined into that one body of the Church catholic and universal: as the whole ministry of the Church is given by Christ to men, to bring them to the unity and conjunction of the Church catholic and universal, and to engraft them as members into it, Eph. 4:11-12; 1 Cor. 12:28; Rom. 12:5-7. And as by Excommunication duly performed the person excommunicate is not cast out of this or that particular Church only, but is bound all the world over, and shut out from the brotherly communion of the Church universal, Mt. 18:17-18, so the sacraments of baptism and the Lord’s Supper are seals to a man of ecclesiastical communion, not only in a particular Church, but in the Church universal. And therefore we hold that these sacraments are to be administered not to those only who by a Church Covenant have joined themselves to some particular Church, but to all the members of the Church catholic, who have duly prepared themselves for the partaking of them. Thus our Belgic churches deny not the seal of Baptism to the children of those parents, who have not by a confession of faith and submission to ecclesiastical discipline, joined themselves to any particular church; according to the practice of the Jewish Church, Josh. 5:4-6, as neither do we deny the participation of the Lord’s Supper to those who by reason of the necessity of their calling cannot join themselves to any particular Church, but are forced to travel through diverse parochial churches.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. We deny also that by such a church-covenant [of the Independents] that right is obtained which the members of a Church in ecclesiastical communion have to the sacraments of grace, the privileges of the ecclesiastical ministry and other benefits which Christ has given to his Churches. The reasons of our denial are these:

1. Because the apostles have not ordained any such church-covenant between the members and the pastors of a church; neither in the admission of members into the Church did require such a covenant as necessary: but by the sacrament of baptism they received such as professed the truth and holiness into the Church-visible, and joined in the same exercises of divine worship with those who were without any such covenant received into an ecclesiastical body with themselves. See Acts 2:42,47; 5:13; 8:12; 9:6 &amp; 18:8.

2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithful of the whole national Church renewed their Covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant.

3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God hath not enjoined; without damnable will-worship. But God has not enjoined such a Covenant on the consciences of men as absolutely necessary: for there is no law of God wherein He has enjoined a necessity of this covenant as the essential form of Church-communion, so as that without it no man can be [a] member of a visible Church, or have right to the seals of the Covenant: Therefore the necessity of this covenant is a will-worship and so to be rejected.

4. The means whereby the members of a Church-visible are associated and united into external ecclesiastical communion, are baptism under the New Testament, as circumcision was under the Old Testament, 1 Cor. 12:13, as Cornelius, Acts 10:47, Lydia, Acts 16:15 and others, were by baptism engrafted into the body of the Church visible: which in those of years is joined with an embracing and profession of sound doctrine and subjection to the ordinances of God; as appears in the believers, Acts 2:41, the Bereans, Acts 17:10, and by Christ’s commandment, Mt. 28:19. Hence say the Professors of Leiden, that beside the primary uses of the sacrament of baptism, there are other secondary uses of it: to wit, the external engrafting them into a particular visible Church, Acts 2:41, the uniting of Christs members amongst themselves and into one body: 1 Cor. 12:12, and consequently upon these, a signification of our profession; and a distinction and separation from all other assemblies of unbelievers. This Church-covenant therefore is not the formal reason of our ecclesiastical communion in the Church-visible. Hence also our churches of the Netherlands in admitting of pastors or Church members do not enter into any such Church-covenant: which yet are true visible Churches of God; whose members have all essential requisites necessary to Church communion in the visible-Church. … 3. We reject also the opinion of those who affirm that the sacraments of the Old and New Testament are signs and seals to confirm this Church-covenant, and so instituted by God for the ratifying of it; that they are to be administered to those only, who are by such a Church-covenant united amongst themselves; but to be denied to others, though known to be godly, who be not in such a Church-communion and strict fellowship. Whereas it does most clearly appear out of the holy Scriptures that the sacraments were instituted by God in his Church, chiefly and in the first place to be signs and seals of the Covenant of Grace, and of the benefits promised in the Covenant of Grace, and of salvation procured by Christ for us, as is manifest by the sacrament of circumcision, Gen. 17:7,10; Rom. 4:11, of the Passover, 1 Cor. 5, of Baptism, Mark 1:4; Acts 2:38-39 and 22:16; Rom. 6:3-4; Titus 3:5, and of the Lord’s Supper, Mt. 26:26-28; 1 Cor. 11:24-26. But in a secondary respect we acknowledge the Sacraments to be seals of our outward engrafting into the Church-visible, and our conjunction into one body of the Church, Acts 2:41; 1 Cor. 12:12-13, and that, as we conceive, of the catholic Church; so that he that is baptized is not baptized into the communion only of this or that particular, or parochial Church, but is joined into that one body of the Church catholic and universal: as the whole ministry of the Church is given by Christ to men, to bring them to the unity and conjunction of the Church catholic and universal, and to engraft them as members into it, Eph. 4:11-12; 1 Cor. 12:28; Rom. 12:5-7. And as by Excommunication duly performed the person excommunicate is not cast out of this or that particular Church only, but is bound all the world over, and shut out from the brotherly communion of the Church universal, Mt. 18:17-18, so the sacraments of baptism and the Lord’s Supper are seals to a man of ecclesiastical communion, not only in a particular Church, but in the Church universal. And therefore we hold that these sacraments are to be administered not to those only who by a Church Covenant have joined themselves to some particular Church, but to all the members of the Church catholic, who have duly prepared themselves for the partaking of them. Thus our Belgic churches deny not the seal of Baptism to the children of those parents, who have not by a confession of faith and submission to ecclesiastical discipline, joined themselves to any particular church; according to the practice of the Jewish Church, Josh. 5:4-6, as neither do we deny the participation of the Lord’s Supper to those who by reason of the necessity of their calling cannot join themselves to any particular Church, but are forced to travel through diverse parochial churches.”

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God. Written at the Command and appointment of the, [Dutch] Walachrian Classis [Presbytery] (London, 1645), ch. 2, ‘Of a Church Covenant’, pp. 17-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+We+deny+also+that+by+such+a+church-covenant+%5Bof+the+Independents%5D+that+right+is+obtained+which+the+members+of+a+Church+in+ecclesiastical+communion+have+to+the+sacraments+of+grace%2C+the+privileges+of+the+ecclesiastical+ministry+and+other+benefits+which+Christ+has+given+to+his+Churches.+The+reasons+of+our+denial+are+these%3A+1.+Because+the+apostles+have+not+ordained+any+such+church-covenant+between+the+members+and+the+pastors+of+a+church%3B+neither+in+the+admission+of+members+into+the+Church+did+require+such+a+covenant+as+necessary%3A+but+by+the+sacrament+of+baptism+they+received+such+as+professed+the+truth+and+holiness+into+the+Church-visible%2C+and+joined+in+the+same+exercises+of+divine+worship+with+those+who+were+without+any+such+covenant+received+into+an+ecclesiastical+body+with+themselves.+See+Acts+2%3A42%2C47%3B+5%3A13%3B+8%3A12%3B+9%3A6+%26+18%3A8.+2.+Under+the+Old+Testament+the+particular+churches+in+the+synagogues+entered+not+into+any+solemn+church-covenant+in+the+admission+of+members%3A+but+only+on+extraordinary+occasions%2C+when+they+had+made+defection+from+God%2C+all+the+faithful+of+the+whole+national+Church+renewed+their+Covenant+with+God%2C+for+restoring+the+decayed+worship+of+God%3B+or+when+they+were+by+some+other+necessity+called+upon+for+renewing+such+a+covenant.+3.+No+man+can+enjoin+anything+upon+the+consciences+of+men+%28as+absolutely+necessary+to+enjoying+the+sacraments+of+divine+grace+and+the+benefits+of+the+ministry+of+the+Church%29+which+God+hath+not+enjoined%3B+without+damnable+will-worship.+But+God+has+not+enjoined+such+a+Covenant+on+the+consciences+of+men+as+absolutely+necessary%3A+for+there+is+no+law+of+God+wherein+He+has+enjoined+a+necessity+of+this+covenant+as+the+essential+form+of+Church-communion%2C+so+as+that+without+it+no+man+can+be+%5Ba%5D+member+of+a+visible+Church%2C+or+have+right+to+the+seals+of+the+Covenant%3A+Therefore+the+necessity+of+this+covenant+is+a+will-worship+and+so+to+be+rejected.+4.+The+means+whereby+the+members+of+a+Church-visible+are+associated+and+united+into+external+ecclesiastical+communion%2C+are+baptism+under+the+New+Testament%2C+as+circumcision+was+under+the+Old+Testament%2C+1+Cor.+12%3A13%2C+as+Cornelius%2C+Acts+10%3A47%2C+Lydia%2C+Acts+16%3A15+and+others%2C+were+by+baptism+engrafted+into+the+body+of+the+Church+visible%3A+which+in+those+of+years+is+joined+with+an+embracing+and+profession+of+sound+doctrine+and+subjection+to+the+ordinances+of+God%3B+as+appears+in+the+believers%2C+Acts+2%3A41%2C+the+Bereans%2C+Acts+17%3A10%2C+and+by+Christ%E2%80%99s+commandment%2C+Mt.+28%3A19.+Hence+say+the+Professors+of+Leiden%2C+that+beside+the+primary+uses+of+the+sacrament+of+baptism%2C+there+are+other+secondary+uses+of+it%3A+to+wit%2C+the+external+engrafting+them+into+a+particular+visible+Church%2C+Acts+2%3A41%2C+the+uniting+of+Christs+members+amongst+themselves+and+into+one+body%3A+1+Cor.+12%3A12%2C+and+consequently+upon+these%2C+a+signification+of+our+profession%3B+and+a+distinction+and+separation+from+all+other+assemblies+of+unbelievers.+This+Church-covenant+therefore+is+not+the+formal+reason+of+our+ecclesiastical+communion+in+the+Church-visible.+Hence+also+our+churches+of+the+Netherlands+in+admitting+of+pastors+or+Church+members+do+not+enter+into+any+such+Church-covenant%3A+which+yet+are+true+visible+Churches+of+God%3B+whose+members+have+all+essential+requisites+necessary+to+Church+communion+in+the+visible-Church.+%E2%80%A6+3.+We+reject+also+the+opinion+of+those+who+affirm+that+the+sacraments+of+the+Old+and+New+Testament+are+signs+and+seals+to+confirm+this+Church-covenant%2C+and+so+instituted+by+God+for+the+ratifying+of+it%3B+that+they+are+to+be+administered+to+those+only%2C+who+are+by+such+a+Church-covenant+united+amongst+themselves%3B+but+to+be+denied+to+others%2C+though+known+to+be+godly%2C+who+be+not+in+such+a+Church-communion+and+strict+fellowship.+Whereas+it+does+most+clearly+appear+out+of+the+holy+Scriptures+that+the+sacraments+were+instituted+by+God+in+his+Church%2C+chiefly+and+in+the+first+place+to+be+signs+and+seals+of+the+Covenant+of+Grace%2C+and+of+the+benefits+promised+in+the+Covenant+of+Grace%2C+and+of+salvation+procured+by+Christ+for+us%2C+as+is+manifest+by+the+sacrament+of+circumcision%2C+Gen.+17%3A7%2C10%3B+Rom.+4%3A11%2C+of+the+Passover%2C+1+Cor.+5%2C+of+Baptism%2C+Mark+1%3A4%3B+Acts+2%3A38-39+and+22%3A16%3B+Rom.+6%3A3-4%3B+Titus+3%3A5%2C+and+of+the+Lord%E2%80%99s+Supper%2C+Mt.+26%3A26-28%3B+1+Cor.+11%3A24-26.+But+in+a+secondary+respect+we+acknowledge+the+Sacraments+to+be+seals+of+our+outward+engrafting+into+the+Church-visible%2C+and+our+conjunction+into+one+body+of+the+Church%2C+Acts+2%3A41%3B+1+Cor.+12%3A12-13%2C+and+that%2C+as+we+conceive%2C+of+the+catholic+Church%3B+so+that+he+that+is+baptized+is+not+baptized+into+the+communion+only+of+this+or+that+particular%2C+or+parochial+Church%2C+but+is+joined+into+that+one+body+of+the+Church+catholic+and+universal%3A+as+the+whole+ministry+of+the+Church+is+given+by+Christ+to+men%2C+to+bring+them+to+the+unity+and+conjunction+of+the+Church+catholic+and+universal%2C+and+to+engraft+them+as+members+into+it%2C+Eph.+4%3A11-12%3B+1+Cor.+12%3A28%3B+Rom.+12%3A5-7.+And+as+by+Excommunication+duly+performed+the+person+excommunicate+is+not+cast+out+of+this+or+that+particular+Church+only%2C+but+is+bound+all+the+world+over%2C+and+shut+out+from+the+brotherly+communion+of+the+Church+universal%2C+Mt.+18%3A17-18%2C+so+the+sacraments+of+baptism+and+the+Lord%E2%80%99s+Supper+are+seals+to+a+man+of+ecclesiastical+communion%2C+not+only+in+a+particular+Church%2C+but+in+the+Church+universal.+And+therefore+we+hold+that+these+sacraments+are+to+be+administered+not+to+those+only+who+by+a+Church+Covenant+have+joined+themselves+to+some+particular+Church%2C+but+to+all+the+members+of+the+Church+catholic%2C+who+have+duly+prepared+themselves+for+the+partaking+of+them.+Thus+our+Belgic+churches+deny+not+the+seal+of+Baptism+to+the+children+of+those+parents%2C+who+have+not+by+a+confession+of+faith+and+submission+to+ecclesiastical+discipline%2C+joined+themselves+to+any+particular+church%3B+according+to+the+practice+of+the+Jewish+Church%2C+Josh.+5%3A4-6%2C+as+neither+do+we+deny+the+participation+of+the+Lord%E2%80%99s+Supper+to+those+who+by+reason+of+the+necessity+of+their+calling+cannot+join+themselves+to+any+particular+Church%2C+but+are+forced+to+travel+through+diverse+parochial+churches.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England%2C+concerning+the+Government+of+the+Church+of+God.+Written+at+the+Command+and+appointment+of+the%2C+%5BDutch%5D+Walachrian+Classis+%5BPresbytery%5D+%28London%2C+1645%29%2C+ch.+2%2C+%E2%80%98Of+a+Church+Covenant%E2%80%99%2C+pp.+17-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7cce06371c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7cce06371c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=2.%20We%20deny%20also%20that%20by,to%20travel%20through%20diverse%20parochial%20churches&amp;text=2.%20We%20deny%20also%20that%20by%20such%20a&amp;text=are%20forced%20to%20travel%20through%20diverse%20parochial%20churches" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

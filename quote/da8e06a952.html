<main class="wrap"><figure class="quote" id="q-da8e06a952" data-kw="">
<blockquote><p>As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished, they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first, being almost, if not quite forgotten by those that use them, and are become but as civil customs that have no state in religious worship, experience shows, that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it; but to exasperate rulers and make opposites more violent in their way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667), ch. 7, sect. 16, pp. 263-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9be409335" data-kw="">
<blockquote><p>Wherefore they are called upon to declare their joy and gladness by ‘clapping their hands’; which is a gesture expressive of exultation and joy; see Psalm 98:8, Nahum 3:19. It was used at the unction and coronation of a king, 2 Kings 11:12; and so very proper to be used on occasion of the Messiah being made or declared Lord and Christ, as he was at his ascension, Acts 2:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 47, verse 1</span></figcaption>

<blockquote><p>13. It [prayer] is likewise held forth by several expressions, pointing forth the posture and gesture of the body, such as ‘spreading forth of the hands’ (Ex. 9:29), ‘stretching out of the hands,’ (Job 11:13) ‘lifting up of the hands’ (Ex. 17:11; 1 Tim. 2:8; Ps. 28:2 and 63:4), ‘bowing the knee’ (Eph. 3:14), and ‘falling down’ (Dt. 9:18), mainly to point forth thereby the frame of the soul, and of the whole man, in prayer, to wit, that we should approach in humility, self-loathing, prostrating ourselves before the Lord, and in faith, earnestness, single dependence, hope, etc.</p></blockquote>

</figure><figure class="quote" id="q-5302f036bd" data-kw="">
<blockquote><p>We observe comely circumstances in the celebration of the sacrament, but we justly condemn those who have added such things unto which they have fancied mysteries, and proper significations, and that of those effects which appertain unto the water of baptism: As though the work should be twice or thrice done, and that either nothing, or that was not sufficient which was done by divine appointment, unless human rashness should have added supply.</p></blockquote>

</figure><figure class="quote" id="q-a916fff20e" data-kw="">
<blockquote><p>What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures: 1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified. 2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (1606), p. 416</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

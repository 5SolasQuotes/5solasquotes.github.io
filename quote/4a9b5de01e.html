<blockquote><p>XXXI. The sentence of absolution will be entirely gracious according to the Gospel strictly so called. “The Lord grant unto him that he may find mercy of p 289 the Lord in that day.” This is manifest, 1st, From the consideration of the works,—which, though stained by numerous blemishes, will receive so high a commendation from the Judge, that the saints themselves will not hear it without being astonished, that God should put so great a value on services which to themselves appeared so very inconsiderable. 2dly, From the consideration of the reward,—which is not founded on any worthiness either of the works or the persons, but on election, the love of the Father, and adoption, which are all gratuitous. 3dly, From the consideration of the connexion betwixt the good works of believers and the reward. Their good works will be mentioned, As proofs of the faith of believers, their union to Christ, their adoption, their friendship with God, and of that holiness without which no man shall see the Lord. As evidences of that activity and earnestness with which, undervaluing the advantages of this world, and despising the pleasures of the flesh, they have sought the kingdom of God and his righteousness. A pursuit so worthy of God, it is not worthy of God to disappoint As effects of Divine grace, with which, according to a proportion most wisely adjusted, the communication of Divine glory will correspond, when he shall come to crown his own gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser 2 vol. (London: Khull, Blackie &amp; Co., 1823), 2.288–89.</span></figcaption>

— River Devereux, ‘A History of Alternative Views of Hell in the Church of England’ (2025)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+1690%2C+John+Tillotson%2C+the+Archbishop+of+Canterbury%2C+preached+before+Queen+Mary+II+on+the+subject+of+hell+where+he+showed+an+awareness+of+annihilationism+and+the+arguments+used+by+its+proponents.+While+Tillotson+ultimately+defended+eternal+conscious+torment%2C+he+left+the+door+open+for+other+possibilities%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+River+Devereux%2C+%E2%80%98A+History+of+Alternative+Views+of+Hell+in+the+Church+of+England%E2%80%99+%282025%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd630214200.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d630214200.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/hell#:~:text=In%201690%2C%20John%20Tillotson%2C%20the%20Archbishop,the%20door%20open%20for%20other%20possibilities&amp;text=In%201690%2C%20John%20Tillotson%2C%20the%20Archbishop%20of%20Canterbury&amp;text=he%20left%20the%20door%20open%20for%20other%20possibilities" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e51aa60dd1" data-kw="">
<blockquote><p>It is a question: An sancti fruantur beatitudine ante ultimum judicium? [Whether the saints enjoy blessedness before the Last Judgment?] It was a current opinion among most of the Fathers, if not all that the souls of men after their death do not go immediately to heaven, but are in a receptacle or mansion-place till the day of Judgement, and some of late have followed it, especially the Anabaptists. The souls immediately departed have not the compleat fullness of that happiness which they shall have, yet they are not excluded from the enjoying of God, Lk. 23:43; 2 Cor. 5:1; Phil. 1:23. Some say there is a difference of those that are raised again, as Lazarus and some others; for it is likely (say they) that their souls went not into heaven, but were detained by God, who would unite them again to show forth his glory. The accidental joy of the saints (say the [Medieval] Schoolmen) shall be greater, both extensively, because it shall be in soul and body, and intensively, because the soul shall rejoyce to see the body glorified. 2. The essential glory shall increase extensively, because it shall redound unto the body. The souls of the godly immediately after their departure hence from the body are said to be in rest, Heb. 4:11 in consolation, Lk. 16:25, in security, Jn. 11:15,18, therefore they presently go to heaven, to God and Christ. Consider the names given to the state of glory: it is called Life, ‘These shall enter into life’; Rest, find rest, go to rest; our home, our Fathers’ house; a purchased and glorious inheritance; A Kingdom, the Kingdom of heaven; Joy, our Master’s joy, everlasting joy; Glory, weight of glory, eternal weight of glory; The City of our God. The Scripture calls it Paradise, a place of all delight and pleasure, alluding to that Paradise planted by God’s own hand, to make it a delight for the innocent state of man, and Abrahams bosom, wherein the Saints receive refreshing, which is a borrowed speech taken from fathers carrying and cherishing their little one, in their bosome, so the elect are cherished in the bosom of the father of all the faithful. There is perfection, perpetuity, immutability, there is Foelix securitas, secura foelicitas. Bernard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 10, ch. 4, ‘Of Everlasting Life’, pp. 869-70</span></figcaption>

<blockquote><p>§VIII. The blessedness of heaven consists in the glorification of soul and body. This glorification consists in a perfect vision and love of God and a rejoicing in God who communicates Himself in the most perfect mode of communication to His creatures.</p></blockquote>

</figure><figure class="quote" id="q-1b13e7cb51" data-kw="">
<blockquote><p>Whether the blessed saints after the end of this world shall inhabit this earth, or at least often visit it, Curiose quaeritur &amp; docte ignoratur ‘It is carefully examined, shrewdly passed over’. Voet, Bibliotheca Studiosi Theologiae, bk. 1, ch. 9 [p. 87]. Dr. [Andrew] Willet upon the Romans holds the affirmative (as I remember) and grounds it on that place of Mt. 5:5. Some urge that place in Peter, ‘A new heaven and earth wherein dwelleth righteousnesse’, that is, righteous persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, bk. 10, ‘Of Glorification…’, ch. 4, ‘Of Everlasting Life’ of A System or Body of Divinity (London, 1654), p. 873</span></figcaption>

<main class="wrap"><figure class="quote" id="q-76e3df8a2d" data-kw="">
<blockquote><p>The irregularities they were guilty of in this solemnity. The substance was well managed, and with a great deal of devotion… 2. Many were permitted to eat the passover who were not purified according to the strictness of the law, 2 Chron. 30:18. This was the second month, and there was not warrant to put them off further to the third month… And they were loth to forbid them communicating at all, lest they should discourage new converts, and send those away complaining whom they desired to send away rejoicing. [Hugo] Grotius observes from this that ritual institutions must give way, not only to a public necessity, but to a public benefit and advantage… ‘The good Lord pardon every one’ in the congregation that has fixed, engaged, or ‘prepared, his heart’ to those services, though the ceremonial preparation be wanting. Note: (1) The great thing required in our attendance upon God in solemn ordinances is that we prepare our hearts to seek Him, that we be sincere and upright in all we do, that the inward man be engaged and employed in it, and that we make heart-work of it, it is all nothing without this. ‘Behold, thou desirest truth in the inward part.’… For this is the ‘one thing needful,’ that we ‘seek God,’ his favour, his honour, and that we set our hearts to do it. (2) Where this sincerity and fixedness of heart are there may still be many defects and infirmities, both the frame of the spirit and the performance of the service may be short of ‘the purification of the sanctuary.’ Corruptions may not be so fully conquered, thoughts not so closely fixed, affections not so lively, faith not so operative, as they should be. Here is a defect in sanctuary purification. There is nothing perfect under the sun, nor ‘a just man that doeth good, and sinneth not.’ (3) These defects need pardoning healing grace; for omissions in duty are sins as well as omissions of duty. If God should deal with us in strict justice according to the best of our performances, we should be undone. (4) The way to obtain pardon for our deficiencies in duty, and all the iniquities of our holy things, is to seek it of God by prayer; it is not so a pardon of course but that it must be obtained by petition through the blood of Christ. (5) In this prayer we must take encouragement from the goodness of God: ‘The good Lord pardon;’ for, when He proclaimed his goodness, He insisted most upon this branch of it, ‘forgiving iniquity, transgression, and sin.’… 2. A successful prayer… not only [He] did not lay their sin to their charge, but graciously accepted their services notwithstanding; for healing denotes not only forgiveness (Isa. 6:10; Ps. 103:3), but comfort and peace, Isa. 57:18; Mal. 4:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible</cite>, on 2 Chron. 30, vv. 13-20</span></figcaption>

<blockquote><p>The Reformed acknowledge that the error of the Lutherans [consubstantiation], although it is quite crass, yet is not fundamental (like that of the papists is in their Mass), nor is it such that it ought to impede ecclesiastical communion among themselves and them, because it is acknowledged on both sides that all those communicating according to Christ’s precept receive spiritual communion with the whole Christ.</p></blockquote>

<blockquote><p>Distinction 2. If the sins be against the worship of God, as idolatry, or sins of a wicked conversation, the worship of God remaining pure and sound, at least in professed fundamentals. 3. If the idolatry be essential idolatry, as the adoring of the work of men’s hands, or only idolatry by participation, as Popish ceremonies, the surplice and cross, being as means of worship, but not adored, and so being idols by participation, as [William] Ames and Mr. [John] Ball do well distinguish (Fresh Suit Against Ceremonies [pt. 2, ch. 2, sect. 10-14, p. 207, says 107]; Answer to Mr. Cann, pt. 2, p. 23), and before them, so does the learned [John] Reynolds (De [romanae ecclesiae] idololatria, bk. 2, ch. 2) and [Thomas] Bilson (of Chri. Ar. Subject., part 4, pp. 321-22) make use of the distinction. …

5. Diverse degrees of separation are to be considered: hence these considerations: … 2. If the whole and most part of the Church turn idolatrous and worship idols (which is essential idolatry), we are to separate from that Church: the Levites and the two tribes did well, as Mr. Ball says, to make a separation from Jeroboam’s calves; and the godly, laudably, 2 Kings 16:11, did not separate from the Israel and Church of God because the altar of Damascus was set up, and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34 [vv. 14, 28], idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10 [v. 21]. Paul does not command separation from the Church of Corinth and the Table of the Lord there. … 5th Consideration. I see not but we may¹ separate from the Lord’s Supper where bread is adored and from baptism where the sign of the Cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the Word, and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. ¹ [Note that Rutherford says we “may”, and not that it is a necessity. As Samuel Bolton says on this page, one might be physially forced to attend the mass, yet this is without guilt. Baxter, also on this page, argues that one may submit to one’s baby being baptized with the sign of the cross in certain necessary conditions.]

6. We may well hold that [Pseudo?] Ambrose says well that a Church wanting the foundation of the apostles, is to be forsaken (Commentary on Luke, bk. 6, ch. 1 [This work is not in Patrologia Latina vols. 14-17 and may not be rightly attributed, yet see this reference for it]). …

8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews though they rejected Christ, till they openly blasphemed, Acts 13:44-46; Acts 18:6. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean; from henceforth I will go to the Gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews who denied the Messiah and persecuted his servants, Acts 4; Acts 5, seeing there was a cleaner Church to which converts might join themselves, Acts 2:40-42.

9. There is no just cause to leave a less clean Church (if it be a true Church) and to go to a purer and cleaner, though one who is a member of no Church have liberty of election to join to that Church which he conceives to be purest and cleanest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644) | pt. 2, ch. 4, sect. 5, pp. 252-55</span></figcaption>

5. Diverse degrees of separation are to be considered: hence these considerations: … 2. If the whole and most part of the Church turn idolatrous and worship idols (which is essential idolatry), we are to separate from that Church: the Levites and the two tribes did well, as Mr. Ball says, to make a separation from Jeroboam’s calves; and the godly, laudably, 2 Kings 16:11, did not separate from the Israel and Church of God because the altar of Damascus was set up, and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34 [vv. 14, 28], idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10 [v. 21]. Paul does not command separation from the Church of Corinth and the Table of the Lord there. … 5th Consideration. I see not but we may¹ separate from the Lord’s Supper where bread is adored and from baptism where the sign of the Cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the Word, and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. ¹ [Note that Rutherford says we “may”, and not that it is a necessity. As Samuel Bolton says on this page, one might be physially forced to attend the mass, yet this is without guilt. Baxter, also on this page, argues that one may submit to one’s baby being baptized with the sign of the cross in certain necessary conditions.]

6. We may well hold that [Pseudo?] Ambrose says well that a Church wanting the foundation of the apostles, is to be forsaken (Commentary on Luke, bk. 6, ch. 1 [This work is not in Patrologia Latina vols. 14-17 and may not be rightly attributed, yet see this reference for it]). …

8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews though they rejected Christ, till they openly blasphemed, Acts 13:44-46; Acts 18:6. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean; from henceforth I will go to the Gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews who denied the Messiah and persecuted his servants, Acts 4; Acts 5, seeing there was a cleaner Church to which converts might join themselves, Acts 2:40-42.

9. There is no just cause to leave a less clean Church (if it be a true Church) and to go to a purer and cleaner, though one who is a member of no Church have liberty of election to join to that Church which he conceives to be purest and cleanest.”

— Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, … (1644) | pt. 2, ch. 4, sect. 5, pp. 252-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDistinction+2.+If+the+sins+be+against+the+worship+of+God%2C+as+idolatry%2C+or+sins+of+a+wicked+conversation%2C+the+worship+of+God+remaining+pure+and+sound%2C+at+least+in+professed+fundamentals.+3.+If+the+idolatry+be+essential+idolatry%2C+as+the+adoring+of+the+work+of+men%E2%80%99s+hands%2C+or+only+idolatry+by+participation%2C+as+Popish+ceremonies%2C+the+surplice+and+cross%2C+being+as+means+of+worship%2C+but+not+adored%2C+and+so+being+idols+by+participation%2C+as+%5BWilliam%5D+Ames+and+Mr.+%5BJohn%5D+Ball+do+well+distinguish+%28Fresh+Suit+Against+Ceremonies+%5Bpt.+2%2C+ch.+2%2C+sect.+10-14%2C+p.+207%2C+says+107%5D%3B+Answer+to+Mr.+Cann%2C+pt.+2%2C+p.+23%29%2C+and+before+them%2C+so+does+the+learned+%5BJohn%5D+Reynolds+%28De+%5Bromanae+ecclesiae%5D+idololatria%2C+bk.+2%2C+ch.+2%29+and+%5BThomas%5D+Bilson+%28of+Chri.+Ar.+Subject.%2C+part+4%2C+pp.+321-22%29+make+use+of+the+distinction.+%E2%80%A6+5.+Diverse+degrees+of+separation+are+to+be+considered%3A+hence+these+considerations%3A+%E2%80%A6+2.+If+the+whole+and+most+part+of+the+Church+turn+idolatrous+and+worship+idols+%28which+is+essential+idolatry%29%2C+we+are+to+separate+from+that+Church%3A+the+Levites+and+the+two+tribes+did+well%2C+as+Mr.+Ball+says%2C+to+make+a+separation+from+Jeroboam%E2%80%99s+calves%3B+and+the+godly%2C+laudably%2C+2+Kings+16%3A11%2C+did+not+separate+from+the+Israel+and+Church+of+God+because+the+altar+of+Damascus+was+set+up%2C+and+because+of+the+high+places.+Things+dedicated+unto+idols%2C+as+Lutheran+images%2C+may+be+called%2C+and+are+called%2C+1+Cor.+10%3A34+%5Bvv.+14%2C+28%5D%2C+idolatry%2C+yet+are+they+idolatry+by+participation%2C+and+so+the+cup+of+devils%2C+1+Cor.+10+%5Bv.+21%5D.+Paul+does+not+command+separation+from+the+Church+of+Corinth+and+the+Table+of+the+Lord+there.+%E2%80%A6+5th+Consideration.+I+see+not+but+we+may%C2%B9+separate+from+the+Lord%E2%80%99s+Supper+where+bread+is+adored+and+from+baptism+where+the+sign+of+the+Cross+is+added+to+Christ%E2%80%99s+ordinances%2C+and+yet+are+we+not+separated+from+the+Church%2C+for+we+professedly+hear+the+Word%2C+and+visibly+allow+truth+of+the+doctrine+maintained+by+that+Church%2C+which+do+pollute+the+sacraments%2C+and+we+are+ready+to+seal+it+with+our+blood%2C+and+it+is+an+act+of+visible+profession+of+a+Church+to+suffer+for+the+doctrine+mentioned+by+that+Church.+%C2%B9+%5BNote+that+Rutherford+says+we+%E2%80%9Cmay%E2%80%9D%2C+and+not+that+it+is+a+necessity.+As+Samuel+Bolton+says+on+this+page%2C+one+might+be+physially+forced+to+attend+the+mass%2C+yet+this+is+without+guilt.+Baxter%2C+also+on+this+page%2C+argues+that+one+may+submit+to+one%E2%80%99s+baby+being+baptized+with+the+sign+of+the+cross+in+certain+necessary+conditions.%5D+6.+We+may+well+hold+that+%5BPseudo%3F%5D+Ambrose+says+well+that+a+Church+wanting+the+foundation+of+the+apostles%2C+is+to+be+forsaken+%28Commentary+on+Luke%2C+bk.+6%2C+ch.+1+%5BThis+work+is+not+in+Patrologia+Latina+vols.+14-17+and+may+not+be+rightly+attributed%2C+yet+see+this+reference+for+it%5D%29.+%E2%80%A6+8.+There+may+be+causes+of+non-union+with+a+Church%2C+which+are+not+sufficient+causes+of+separation%3A+Paul+would+not+separate+from+the+Church+of+the+Jews+though+they+rejected+Christ%2C+till+they+openly+blasphemed%2C+Acts+13%3A44-46%3B+Acts+18%3A6.+And+when+they+opposed+themselves+and+blasphemed%2C+Paul+shook+his+raiment+and+said+unto+them%2C+%E2%80%98Your+blood+be+upon+your+own+heads%2C+I+am+clean%3B+from+henceforth+I+will+go+to+the+Gentiles.%E2%80%99+There+is+a+lawful+separation%2C+and+yet+before+the+Jews+came+to+this%2C+there+was+no+just+cause+why+any+should+have+joined+to+the+Church+of+the+Jews+who+denied+the+Messiah+and+persecuted+his+servants%2C+Acts+4%3B+Acts+5%2C+seeing+there+was+a+cleaner+Church+to+which+converts+might+join+themselves%2C+Acts+2%3A40-42.+9.+There+is+no+just+cause+to+leave+a+less+clean+Church+%28if+it+be+a+true+Church%29+and+to+go+to+a+purer+and+cleaner%2C+though+one+who+is+a+member+of+no+Church+have+liberty+of+election+to+join+to+that+Church+which+he+conceives+to+be+purest+and+cleanest.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%E2%80%A6+%281644%29+%7C+pt.+2%2C+ch.+4%2C+sect.+5%2C+pp.+252-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe61baa87e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe61baa87e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Distinction%202.%20If%20the%20sins%20be,conceives%20to%20be%20purest%20and%20cleanest&amp;text=Distinction%202.%20If%20the%20sins%20be%20against%20the&amp;text=which%20he%20conceives%20to%20be%20purest%20and%20cleanest" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Such as the worship is in Popery, where they teach and do many things contrary to the principles of faith, placing holiness and the worship of God in their own inventions, and seeking remission of sins, and the merit of eternal life in every beggarly superstitious observation and ceremony. But if by false manner of worship you understand every error, fault and corruption in matters of religion, which though they be evil and to be condemned, yet overthrow not the faith, nor the very essence of God’s true worship, but be in circumstances, or in parts that may be maimed, and yet the life remain: then I deny the proposition as most erroneous, false and heretical…</p></blockquote>

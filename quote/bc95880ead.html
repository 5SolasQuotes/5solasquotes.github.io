<main class="wrap"><figure class="quote" id="q-bc95880ead" data-kw="">
<blockquote><p>XXXVI. As the certainty of perseverance is the consolation of the laboring, not the mother of security… since it can be granted only to those walking in the path of holiness… This is properly the fruit of the soul confirmed in the Lord and of the exercised senses. Therefore those who are not as yet confirmed must press forward by degrees and perceptibly in the ways of the Lord… XXXVII… Such is the holy security of the pious, which not only does not exclude watchfulness and the desire for piety, but necessarily supposes them as the certain means of their own preservation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James Dennison, Jr. (Presbyterian &amp; Reformed, 1994), vol. 2, 15th Topic, question 17, ‘Whether the believer can and ought to be certain of his faith and justification by a divine and not merely conjectural certainty. We affirm…’ | sections 36-37, pp. 630-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-1ef2c0c632" data-kw="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>

</figure><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

<blockquote><p>Doctrine of the Covenant directly Scriptural.

It may seem unnecessary to say that this is a doctrine which has express verbal warrant in Holy Scripture. We have been led to this topic in connexion with the doctrine of the Atonement; and, it may be in point, therefore, to call to mind the significant phrase, “The blood of the everlasting covenant” (Heb. xiii. 20). Surely that single Divine form of speech is sufficient to set forth an organic connexion between the Covenant of Grace and the sacrifice of Jesus. Take again the memorable promise: “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. ix. 11); and our Lord’s own affecting utterance in instituting the sacrament of the Supper: “This cup is the new covenant in my blood.”

Surely these Divine expressions are very express; and they are sufficient to show that no man discusses the doctrine of Christ’s death who severs it from the considerations presented by the Covenant of Grace. It is the “blood” that maketh “atonement;” but in this case the “blood” is the “blood of the Covenant.” Men may therefore discuss as long as they please an abstract theory of an abstract atonement; but if they give not heed to this atonement which the Covenant of Grace conditions and explains, they are not any more dealing with true theology, than men should deal with real astronomy who should speculate on central forces in the abstract and pretermit the actual law of gravitation —the law of the inverse square of the distance — which rules in the starry heavens.

It is scarcely necessary to refer to the express assertion of the covenant between the Father and the Son in the proposition: “The counsel of peace shall be between them both” (Zech. vi. 13). Our Lord is designated at once the “Mediator of the Covenant” (Heb. viii. 6.; xii. 24), and the “Surety of the Covenant” (Heb. vii. 22). Nay, He is represented as the substance of the Covenant: “I the Lord have called Thee in righteousness, and will hold thine hand, and will keep Thee, and give Thee for a covenant of the people, for a light to the Gentiles” (Isa. xlii. 6; xlix. 8).

The work of Christ is thus in express terms affirmed to be a covenant work — a work having immediate respect to a covenant. The work of the Spirit is spoken of in similar connexion with a covenant: “As for me, this is my covenant with them, saith the Lord; My Spirit that is upon thee, and my words that are in thy mouth, shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed’s seed, saith the Lord, from henceforth and for ever ” (Isa. lix. 21).

When the Lord invites lost sinners to Himself, it is in terms like these: “Incline your ear, and come unto me: hear, and your souls shall live; and I will make with you an everlasting covenant, even the sure mercies of David” (Isa. lv. 3). When, moved by such entreaties, sinners ask the way to Zion, with their faces thitherward, it is with the mutual exhortation: “Come, and let us join ourselves to the Lord in a perpetual covenant that shall not be forgotten” (Jer. i. 5). When, after entering on this blessed relation with God, they would express their full satisfaction with it in the midst of all life’s troubles and afflictions, they are wont to say: “Though my house be not so with God; yet He hath made with me an everlasting covenant, ordered in all things and sure: this is all my salvation, and all my desire” (2 Sam. xxiii. 5).

For in the midst of all troubles by which their sins are chastised and their spirit chastened, the Lord sustains their faith by the gracious declaration: “My covenant will I not break, nor alter the word that hath gone out of my mouth” (Ps. lxxxix. 34). And when grieved in the view of the “cruelty” that obtains in the “dark places of the earth,” the Church’s strongest appeal to God on their behalf is this: “Have respect unto Thy covenant” (Ps. lxxiv. 20).

These are some of the more express verbal assertions of the reality and fact of a Covenant of Grace. Intelligent piety is familiar with them as with household words; and we quote them simply to show that the federal theology is no product of mere human ingenuity — no merely artificial structure — but a Scriptural theme, the terminology of which is directly furnished by Scripture itself. It is no roundabout result of mere theologising, but one of the immediate data of Divine inspiration.</p></blockquote>

<blockquote><p>This passage [Galatians 2:6] reminds us that we should not condemn or reject people on the basis of their former life. Just as the apostles were no better than Paul merely because they had known Christ personally during his earthly life, so he was no worse or inferior to them merely because he had lived his life from childhood according to the whims of the Pharisees and had been a persecutor of the church.

The radiance of God’s grace could not have shone more brightly in him and (as he writes about himself) his only boast was Jesus Christ. He wanted to show that all mercy was found in him and be an example to those who would in the future believe in eternal life. God does not look on people as they once were but only as they now are.…

Again, and on the other end of the spectrum, God does not spare anyone merely because of his former virtues and achievements if they take a turn for the worse, abandon the station in which God has placed them and move over to the devil’s camp. Their condition is worse and their ingratitude detestable, because they have ignominiously trampled on the free gifts of God.</p></blockquote>

<blockquote><p>Meditate upon the mercy of God; mercy is an innate disposition in God to do good; as the Sun hath an innate property to shine, Psalm 86.5. Thou Lord art good, and ready to forgive, and plenteous in mercy to all them that call upon thee. God’s mercy is so sweet, that it makes all his other attributes sweet. Holiness without mercy, and Justice without mercy were dreadful. Geographers write that the City of Syracuse in Sicily is so curiously situated, that the Sun is never out of sight; though the children of God are under some clouds of affliction, yet the Sun of mercy is never quite out of fight. God’s justice reacheth to the clouds, his mercy reacheth above the clouds. How slow is God to anger.

He was longer in destroying Jericho, than in making the world; He made the world in six days, but he was seven days in demolishing the walls of Jericho. How many warning-pieces did God shoot against Jerusalem, before he shot off his murdering-piece? Justice goes a foot-pace, Gen. 18.21. mercy hath wings; the sword of justice oft lies a long time in the scabbard, and rusts, till sin doth draw it out and whet it against a Nation; God’s justice is like the widow’s oil, which ran a while, and ceased, 1 Kings 4.6. God’s mercy is like Aaron’s oil, which rested not on his head, but ran down to the skirts of his garment, Psalm 133.2. So the golden oil of God’s mercy doth not rest upon the head of a good parent, but is poured on his children, and so runs down, to the third and fourth generation, even the borders of a religious seed. Often meditate upon the mercy of God.

The meditation of mercy would be a powerful loadstone to draw sinners to God by repentance. It would be as a cork to the net to keep the heart from sinking in despair; behold a City of refuge to fly to; God is the Father of mercies, 2 Cor. 1.3. mercy doth as naturally issue from him, as the child from the parent. God delights in mercy, Micah 7.18. Chrysostom saith, ’tis delightful to the mother to have her breasts drawn; and how delightful is it to God to have the breasts of mercy drawn; mercy finds out the worst sinner, mercy comes not only with salvation in its hand, but with healing under its wings.

The meditation of God’s mercy would melt a sinner into tears; One reading a pardon sent him from the King, fell a weeping, and burst out into these words, A pardon hath done that which death could not do, it hath made my heart relent.</p></blockquote>

<blockquote><p>Now although God does not at all intend the salvation of the non-elect, yet he deals with the greatest truth and seriousness when he calls them, nor can any charge of mockery or deceit be brought against him. All that are called by the gospel, says the Synod of Dort, are seriously called, for God seriously and truly shews in his word what is acceptable to him, and also seriously promises rest for their souls, and eternal life, to all that come to him by faith.

Those who reject the word are very severely reproved in scripture, and will be punished for that rejection, (Isaiah 1. 2, 3; Ixv 2, 3; Matt. xi. 16; John v. 40; Proverbs i. 24-1 26); whereas those who obey the divine calling and receive the word, are commended, and will be rewarded. (John xiv. 21; Acts xvii. ii.)</p></blockquote>

</figure><figure class="quote" id="q-db6ca67493" data-kw="">
<blockquote><p>The necessity for His death is brought out with an unusual illustration in Hebrews 9, that of a man’s last will and testament. When a man makes a will, it is necessary for his death to occur before the terms of the will become operative. As long as he lives, nothing happens. Now the Greek word διαθήκη, which the writer employs for ‘will’, is used in the Greek Old Testament to translate the Hebrew word בְּרִית, meaning ‘covenant’. It is unmistakably the usual Greek word for a ‘will’. But there is an air of finality about a will. You cannot dicker with a testator. You accept what he leaves you on the conditions he lays down, or you reject it. You have no other line of action.

The one-sidedness of this process seems to have appealed to those who translated the Old Testament into Greek as a better way of characterizing the covenants God makes with men than συνθήκη, the usual word for ‘agreement’. This word might be taken as suggesting a relative equality, an ability on man’s side to make conditions. This is totally false. Man accepts the covenant on God’s terms or he rejects it. He has no other option. Thus the word in Greek at large means a will, and in the Old Testament it means a covenant.

In Hebrews 9:16f. it seems that the writer is playing on the double meaning of the word. Jesus establishes the new διαθήκη, or ‘covenant’, and His death is necessary to establish it, just as necessary as is the death of any testator to establish his διαθήκη, his ‘will’. No διαθήκη is of force without a death. The line of reasoning is perhaps one that we would not have employed. But we are dealing with a first-century writing, not one from the twentieth century. And the point the writer is making is that the death of Christ is an absolute necessity. A ‘will’ is completely inoperative until the testator dies. And Christ’s new ‘covenant’ is likewise inoperative until the death of Christ. Without that the whole Christian system would be impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leon-morris.html">Leon Morris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross in the New Testament</cite>, (Grand Rapids MI; Eerdmans, 1965), pp 278-79.</span></figcaption>

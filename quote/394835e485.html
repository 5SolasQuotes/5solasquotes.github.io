<blockquote><p>1224. Rom. 9:18, ‘God has mercy on whom He will have mercy, and whom He will He hardens.’ Ch. 11:32, ‘God has concluded them all in unbelief, that He might have mercy upon all.’ The first place is concerning the most free will and power of God, who may have mercy on whom He please; his antecedent will reaches to all men, his consequent will is restrained to the believers and unbelievers, and so He will have mercy of the faithful, that they may be saved, but he justly punishes and hardens the unbelievers and wicked men who resist his grace freely offered unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible</cite>, … (London: Miller, 1662) | Romans</span></figcaption>

<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin</cite>, (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2, p. 357</span></figcaption>

</figure><figure class="quote" id="q-3299ae28fa" data-kw="">
<blockquote><p>Question: But how could he [Paul] wish this [to be accursed from Christ for his brethren’s sake, in Rom. 9:3], seeing it imports a diminution of the love of God… Answer: If ye will consider this petition by itself, it was neither sin nor dimunition of this love: but if ye will consider the consequents of this wish, if indeed he had been excluded from the Kingdome of heaven, then it had been a sin for him to have wished it. One may wish a thing simply without sin, yet to wish it vestitum omnibus circumstantiis [clothed with all circumstances] it may be sin. Example: a woman has her husband to be executed for some capital offence, the woman wished her husband to live, as her husband and a father to her children to provide for them; but if she should desire her husband to live as an enemy to the commonwealth contrary to the law, then her wish were a sinful wish: So for Paul to wish this to testify his earnest love to the Church, it was no sin; but if he had wished it vestitum ominibus circumstantiis, with a diminution of the love of God and want of eternal happiness, then his wish had been sin. Again we wish a thing antecedente voluntate vel consequente voluntate, ‘with an antecedent or consequent will.’ Example: a judge by his antecedent will wishes that all the subjects may live; but by his consequent will, he wishes the malefactor to die. So Paul wished this by his antecedent will, but not considering it with all the consequents that might follow upon it. Fourthly, Paul wished not this absolutely, but in comparison: as the natural mother who pleaded before Solomon chose rather that the child should be given to her who was not the mother of it than that the child should be cut in two, 1 Kn. 3:26. If ye consider Paul’s wish here, it was only in comparison; rather than they should die, he wishes this to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Moral Law, or Ten Commandments</cite>, ... (London: Cotes, 1632), bk. 1, Commandment 1, Exercitation 7, pp. 50-51</span></figcaption>

</figure><figure class="quote" id="q-c12cd13863" data-kw="">
<blockquote><p>Query 3. Whether the will of God touching conversion be always accomplished therein?… God may be said to will the conversion of men two ways; either by such a will as is effective, and determinative of the event, or by such as is only virtual, and ordinative of the means tending thereunto: both parts of this distinction are bottomed upon scripture… …[W]herefore, in respect of that ordination, God may be truly said, by a kind of virtual and ordinative will, to will the turning and salvation of all men… 1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26). They have the gospel preached unto them: there we have God spreading out his hands all the day, standing and knocking at the door of the heart, crying out with redoubled calls, “Turn ye, turn ye, why will ye die?” Wooing and beseeching men, be ye reconciled unto me; making his salvation bringing grace appear unto all men, even to the non-elect themselves… what is the meaning of all this, if God no way will their conversion?… Neither will it salve the business, to say, there is a voluntas signi in all this; for what is voluntas signi, if it be not signum voluntatis? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart?… the true end of his call is their conversion, and that that end is not attained, the only reason lies within themselves, in their own corrupt, unbelieving hearts. Moreover, it is worthy of our consideration, that those scriptures (which the Remonstrants urge, to prove that all the operations of grace, even those in the very elect who actually turn unto God, are resistible) do signally set forth this ordinative will of God… wherefore, this will is God’s ordinative will, imported in the ministry of Christ and the prophets, the proper end and tendency whereof was to gather them into the bosom of his grace… Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction; it is the place where God records his name… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Matt. iii. 11). Gospel-preaching is not a mere sound or voice of words, but it importeth God’s ordinative counsel to turn men unto himself… Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls… but it proves that the proper end and tendency of the means afforded to the Jewish church, was that they might bring forth good fruits to God; and in respect of that ordination, God is said to expect those good fruits from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill</cite>, (Morgan, PA.: Soli Deo Gloria Publications, 1998), pp. 131-32, 164 &amp; 208-10 | ‘Edward Polhill (1622-1694) on Matthew 23:37’</span></figcaption>

9s+heart%3F%E2%80%A6+the+true+end+of+his+call+is+their+conversion%2C+and+that+that+end+is+not+attained%2C+the+only+reason+lies+within+themselves%2C+in+their+own+corrupt%2C+unbelieving+hearts.+Moreover%2C+it+is+worthy+of+our+consideration%2C+that+those+scriptures+%28which+the+Remonstrants+urge%2C+to+prove+that+all+the+operations+of+grace%2C+even+those+in+the+very+elect+who+actually+turn+unto+God%2C+are+resistible%29+do+signally+set+forth+this+ordinative+will+of+God%E2%80%A6+wherefore%2C+this+will+is+God%E2%80%99s+ordinative+will%2C+imported+in+the+ministry+of+Christ+and+the+prophets%2C+the+proper+end+and+tendency+whereof+was+to+gather+them+into+the+bosom+of+his+grace%E2%80%A6+Every+ordinance+is+an+ordinance+from+the+will+of+God%3B+it+is+an+appointment+dropped+down+from+heaven%3B+it+is+divinely+destinated+eis+oikodomen%2C+for+edification+and+not+for+destruction%3B+it+is+the+place+where+God+records+his+name%E2%80%A6+John%E2%80%99s+baptism+was+not+a+mere+external+sign+or+shadow%2C+but+imported+God%E2%80%99s+ordinative+counsel+to+bring+men+to+repentance%3B+it+was+eis+matanoian%2C+to+repentance%2C+as+its+proper+end%2C+%28Matt.+iii.+11%29.+Gospel-preaching+is+not+a+mere+sound+or+voice+of+words%2C+but+it+importeth+God%E2%80%99s+ordinative+counsel+to+turn+men+unto+himself%E2%80%A6+Every+ordinance+speaks+an+ordinative+counsel+for+some+spiritual+end%2C+a+serious+ordination+for+the+good+of+souls%E2%80%A6+but+it+proves+that+the+proper+end+and+tendency+of+the+means+afforded+to+the+Jewish+church%2C+was+that+they+might+bring+forth+good+fruits+to+God%3B+and+in+respect+of+that+ordination%2C+God+is+said+to+expect+those+good+fruits+from+them.%E2%80%9D%0A%0A%E2%80%94+Edward+Polhill%2C+%E2%80%9CThe+Divine+Will+Considered+in+its+Eternal+Decrees%E2%80%9D+in+The+Works+of+Edward+Polhill+%28Morgan%2C+PA.%3A+Soli+Deo+Gloria+Publications%2C+1998%29%2C+pp.+131-32%2C+164+%26+208-10+%7C+%E2%80%98Edward+Polhill+%281622-1694%29+on+Matthew+23%3A37%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io <blockquote><p>The term voluntas signi, literally, the will of the sign [the revealed will], is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’—thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded. This signified or perceptive will moreover, does not contradict the will of the divine good pleasure, although the relationship between the two may sometimes be difficult to establish immediately. The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>

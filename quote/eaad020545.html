<blockquote><p>Injustice — Jurisdiction is not given for the sake of the judge, but for that of the litigant.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36cd623f61" data-kw="">
<blockquote><p>It has been lately announced that the Synod of Philadelphia… adopted, and proceeded at once to enforce, a doctrine in reference to ecclesiastical proceedings, which appears to some altogether novel, and truly extraordinary. The doctrine is this,—’That no complaint, appeal, or protest, can be admitted by any judicatory, except in judicial cases.’… It never occurred to us, however, as possible, that it [the new doctrine] should receive countenance from gentlemen of experience and reflection… It is of more practical importance to show that the doctrine here assumed, cannot in our opinion, stand the test of a moment’s examination… In the Presbyterian Church in the United States, it is manifest that appeals, complaints and protests, have ever been allowed in all sorts of cases. Whenever a judicatory has decided any question which came before it by a vote, —whether the question were legislative, declarative, executive or strictly judicial—in any and every such case, both theory and practice allow of appeal, complaint and protest, at the pleasure of the party wishing to offer either. …more than thirty years before that time [1821], when the General Assembly was first organized, the following article appears in the system of Rules adopted for the government of that body: ‘Any member who may think himself aggrieved by a decision of the General Assembly, shall have his dissent or protest, with his reasons, entered on the records of the Assembly, or filed among their papers, if given in before the rising of the Assembly.’ … We have been in the constant habit of attending on the judicatories of the church, in all their grades, for more than forty years; and we never knew or heard of an in- dividual who doubted the right of appeal, complaint, and protest, in all sorts of cases… many a time, and on a great variety of occasions, we have participated in protests, etc. in all sorts of cases, without dreaming that any one ever thought of confining the privilege to cases of process only… The archives of the church are better than cursory assertions. Litera scripta manet. Let us, therefore, appeal to public records, which cannot lead us astray. In the year 1826, the General Assembly… determined, by a vote, to postpone fixing the location [of Western Theological Seminary] for another year. Against this decision the Reverend Joshua L. Wilson, of Cincinnati, entered his solemn protest, accompanied with five reasons, which still remain on permanent record. In the very same General Assembly, (of 1826)… Against this decision to receive Mr. B, forty-two members of the Assembly entered their solemn protest, supported by three reasons… In the General Assembly of 1828… In opposition to this act a solemn protest was presented and read, by a minority of the Assembly… Again, in the General Assembly of 1831… Against this decision a formal protest was entered by sixty-seven of the minority. And it is worthy of notice, that among the subscribers to this protest, the following names are found… the Reverend Robert J. Breckinridge… Alexander Boyd, Ashbel Green… At the same General Assembly, (1831)… Against this expression of opinion, a protest was offered, accepted, and recorded, signed by thirty members of the minority… Let us now attend–Secondly, to the dictates of reason on this subject…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Biblical Repertory &amp; Theological Review</cite>, no. 1, vol. 7 (Jan. 1835), article 5, ‘New Ecclesiastical Law’, pp. 89-97</span></figcaption>

</figure><figure class="quote" id="q-b4b1a3481d" data-kw="">
<blockquote><p>Moral obligation can be created only by some intimation of the will of God. God alone can bind the conscience. The will of God can be made known to us only in one of two ways: either by the ‘light of nature’ or by revelation. The light of nature becomes manifest either through the constitution and consciousness of the individual man, or through those of the human race expressed in the ‘consensus populorum.’ [popular consensus] That which has been believed always and everywhere and by all is very apt to be true: and that which has been felt to be binding upon the conscience, with the same universality of times, places and persons, may be concluded to be of moral obligation. The voice of the people in this sense may be regarded as the voice of God. The moral sense may be undeveloped, or it may be perverted in its judgments by ignorance, prejudice, passion, and habits of wickedness; but where it has a fair opportunity to be heard, and especially upon questions upon which its judgments are opposed to the desires and appetites of man, sinful and selfish, it would seem to speak with the authority of man’s Maker and Ruler. It is conscience, the ‘categorical imperative,’ against what is voluntary in man. It is an authority which man feels cannot be resisted with impunity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Moral Obligation of the Tithe’</cite>, (1890) in Miscellanies, vol. 1, p. 146. Peck was an American, Southern presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

ooksonline.com/topics/natural-law/#:~:text=Moral%20obligation%20can%20be%20created%20only,feels%20cannot%20be%20resisted%20with%20impunity&amp;text=Moral%20obligation%20can%20be%20created%20only%20by%20some&amp;text=which%20man%20feels%20cannot%20be%20resisted%20with%20impunity" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-38a59f0360" data-kw="">
<blockquote><p>Only thus much I should advise, that if it be known that any person is guilty of a capital crime (as for example of adultery) though we be not bound alway to accuse them openly, or to bring them to such a confession or self-accusation as may hazard their lives, yet: 1. The pastor may suspend them and in some cases require the people to avoid them when the fact is publicly known (though the party not prosecuted) and give but a general intimation of the fault, as known already; though perhaps the evidence will not hold in law. (As I have known persons that openly confess adultery at home, but denying it before the judge, come off as if they were innocent; and yet confess it again when they come home.) And I should think that such persons should not be re-admitted to Communion, till they do manifest public serious penitence in the congregation: but only in general terms (seeing they are not bound to accuse themselves, so as to expose their lives to danger), as thus: ‘I confess before God and this congregation that I am a heinous sinner, and unworthy of communion with the Church: the particulars I need not express, seeing the congregation may easily know my meaning, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 3-4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Only thus much I should advise, that if it be known that any person is guilty of a capital crime (as for example of adultery) though we be not bound alway to accuse them openly, or to bring them to such a confession or self-accusation as may hazard their lives, yet: 1. The pastor may suspend them and in some cases require the people to avoid them when the fact is publicly known (though the party not prosecuted) and give but a general intimation of the fault, as known already; though perhaps the evidence will not hold in law. (As I have known persons that openly confess adultery at home, but denying it before the judge, come off as if they were innocent; and yet confess it again when they come home.) And I should think that such persons should not be re-admitted to Communion, till they do manifest public serious penitence in the congregation: but only in general terms (seeing they are not bound to accuse themselves, so as to expose their lives to danger), as thus: ‘I confess before God and this congregation that I am a heinous sinner, and unworthy of communion with the Church: the particulars I need not express, seeing the congregation may easily know my meaning, etc.&#x27;”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 3-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COnly+thus+much+I+should+advise%2C+that+if+it+be+known+that+any+person+is+guilty+of+a+capital+crime+%28as+for+example+of+adultery%29+though+we+be+not+bound+alway+to+accuse+them+openly%2C+or+to+bring+them+to+such+a+confession+or+self-accusation+as+may+hazard+their+lives%2C+yet%3A+1.+The+pastor+may+suspend+them+and+in+some+cases+require+the+people+to+avoid+them+when+the+fact+is+publicly+known+%28though+the+party+not+prosecuted%29+and+give+but+a+general+intimation+of+the+fault%2C+as+known+already%3B+though+perhaps+the+evidence+will+not+hold+in+law.+%28As+I+have+known+persons+that+openly+confess+adultery+at+home%2C+but+denying+it+before+the+judge%2C+come+off+as+if+they+were+innocent%3B+and+yet+confess+it+again+when+they+come+home.%29+And+I+should+think+that+such+persons+should+not+be+re-admitted+to+Communion%2C+till+they+do+manifest+public+serious+penitence+in+the+congregation%3A+but+only+in+general+terms+%28seeing+they+are+not+bound+to+accuse+themselves%2C+so+as+to+expose+their+lives+to+danger%29%2C+as+thus%3A+%E2%80%98I+confess+before+God+and+this+congregation+that+I+am+a+heinous+sinner%2C+and+unworthy+of+communion+with+the+Church%3A+the+particulars+I+need+not+express%2C+seeing+the+congregation+may+easily+know+my+meaning%2C+etc.%27%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98An+Explication+of+some+Passages+in+the+foregoing+Propositions%E2%80%99%2C+pp.+3-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38a59f0360.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38a59f0360.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=Only%20thus%20much%20I%20should%20advise,may%20easily%20know%20my%20meaning%2C%20etc&amp;text=Only%20thus%20much%20I%20should%20advise%2C%20that%20if&amp;text=the%20congregation%20may%20easily%20know%20my%20meaning%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

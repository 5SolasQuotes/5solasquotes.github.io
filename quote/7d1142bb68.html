<main class="wrap"><figure class="quote" id="q-7d1142bb68" data-kw="">
<blockquote><p>Paley’s argument presupposes that teleology is extrinsic; Aquinas follows Aristotle in holding that it is immanent to the natural order. Paley therefore focuses on complex phenomena, especially biological phenomena, as uniquely indicative of teleology; Aquinas takes all natural phenomena, however simple or complex and whether organic or inorganic, to manifest teleology. Paley is presenting a cumulative and probabilistic “argument to the best explanation”; Aquinas is putting forward a metaphysical demonstration… But Paley is at least seriously threatened by it [Darwinian evolution], while the Fifth Way is not threatened by it at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147</cite>, p. 82</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-094b574bde" data-kw="">
<blockquote><p>…the Fifth Way, at least as developed by later Thomists, does indeed plausibly get us to a divine intelligence. By contrast, Paley’s argument is often acknowledged to get us at best to a designer who is extremely powerful and and intelligent, but who for all we know may yet be finite and, thus non-divine. But it is not just that Paley’ s designer may be something other than God as Aquinas understands Him. There is reason to think that Paley’s designer could not be God as Aquinas understands Him. For Aquinas, when we predicate attributes of God, we necessarily do so analogously rather than univocally. But Paley is evidently predicating attributes to his designer and to us in a univocal way, which (for the Thomist at least) entails a radically deficient conception of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147</cite>, p. 83</span></figcaption>

<blockquote><p>…this very ignorance of God being connected in such people with the most extreme barbarity, is a pretty strong evidence that the knowledge of Him is natural to the mind. Some have been met with among these savage nations who could not reckon farther than the number ten; could any one hence deny that arithmetical ideas are not natural to mankind?</p></blockquote>

</figure><figure class="quote" id="q-fd689867fb" data-kw="">
<blockquote><p>It [theology] is called doctrine, not to separate it from understanding, knowledge, wisdom, art or prudence–for these go with every exact discipline, and most of all with theology–but to mark it as a discipline which derives not from nature and human inquiry like others, but from divine revelation and appointment. Isa. 51:4, ‘Doctrine shall go forth from Me;’ Mt. 21:25, ‘From heaven… Why then did you not believe him?’; Jn. 9:29, ‘We know that God has spoken to Moses;’ Gal. 1:11-12, ‘The gospel… is not according to man. For I neither received it from man, nor was I taught it, but it came through a revelation;’ Jn. 6:45. 3. The principles of other arts, since they are inborn in us, can be developed through sense perception, observation, experience and induction, and so brought to perfection. But the basic principles of theology, though they be advanced by study and industry, are not in us by nature. Matt. 16:17, ‘Flesh and blood has not revealed this to you.’ 4. Every art has its rules to which the work of the person practicing it corresponds. Since living is the noblest work of all, there cannot be any more proper study than the art of living well. 5. Since the highest kind of life for a human being is that which approaches most closely the living and life-giving God, the nature of theological life is living to God. … 8. Although it is within the compass of this life to live both happily and well, euzoia, living well, is more excellent than eudaimonia, living happily. What chiefly and finally ought to be striven for is not happiness which has to do with our own pleasure, but goodness which looks to God’s glory… … 10. Now since this life so willed is truly and properly our most important practice, it is self-evident that theology is not a speculative discipline but a practical one–not only in the common respect that all disciplines have eupraxia, good practice, as their end, but in a special and peculiar manner compared with all others. 11. Nor is there anything in theology which does not refer to the final end or to the means related to that end–all of which refer directly to practice. 12. This practice of life is so perfectly reflected in theology that there is no precept of universal truth relevant to living well in domestic economy, morality, political life or law-making which does not rightly pertain to theology. 13. Theology, therefore, is to us the ultimate and noblest of all exact teaching arts. It is a guide and master plan for our hightest end, sent in a special manner from God, treating of divine things, tending towards God, and leading man to God. It may therefore not incorrectly be called theozoia, a living to God, theourgia, a working towards God, as well as theology.</p></blockquote>

asure%2C+but+goodness+which+looks+to+God%E2%80%99s+glory%E2%80%A6+%E2%80%A6+10.+Now+since+this+life+so+willed+is+truly+and+properly+our+most+important+practice%2C+it+is+self-evident+that+theology+is+not+a+speculative+discipline+but+a+practical+one%E2%80%93not+only+in+the+common+respect+that+all+disciplines+have+eupraxia%2C+good+practice%2C+as+their+end%2C+but+in+a+special+and+peculiar+manner+compared+with+all+others.+11.+Nor+is+there+anything+in+theology+which+does+not+refer+to+the+final+end+or+to+the+means+related+to+that+end%E2%80%93all+of+which+refer+directly+to+practice.+12.+This+practice+of+life+is+so+perfectly+reflected+in+theology+that+there+is+no+precept+of+universal+truth+relevant+to+living+well+in+domestic+economy%2C+morality%2C+political+life+or+law-making+which+does+not+rightly+pertain+to+theology.+13.+Theology%2C+therefore%2C+is+to+us+the+ultimate+and+noblest+of+all+exact+teaching+arts.+It+is+a+guide+and+master+plan+for+our+hightest+end%2C+sent+in+a+special+manner+from+God%2C+treating+of+divine+things%2C+tending+towards+God%2C+and+leading+man+to+God.+It+may+therefore+not+incorrectly+be+called+theozoia%2C+a+living+to+God%2C+theourgia%2C+a+working+towards+God%2C+as+well+as+theology.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Theology+trans.+John+D.+Eusden+%281623%3B+Baker%2C+1997%29%2C+ch.+1%2C+%E2%80%98The+Definition+or+Nature+of+Theology%E2%80%99%2C+p.+77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd689867fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fd689867fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=It%20%5Btheology%5D%20is%20called%20doctrine%2C%20not,towards%20God%2C%20as%20well%20as%20theology." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b89b78d223" data-kw="">
<blockquote><p>The Law of Nature cannot direct us unto a supernatural end, as is acknowledged not only by our divines (Junius, De Politia Mosaica, ch. 1; Paraeus, Commentary on Rom. 1:19), but by Aquinas also (1a, 2a, q. 91, article 4). It only teaches us to seek and to do bonum, velut finem naturae, ‘such a good as is an end proportioned to Nature’ (Junius). All those precepts of the Law of Nature which we have spoken of, could never lead men to a supernatural good (Junius). It is only the Divine Law, revealed from God, which informs the minds of men with such notions as are supra naturam [above nature], and which may guide them ad finem supernaturalem [to a supernatural end].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies... (1637), pt. 3, ch. 9, ‘That the Lawfulness of the Ceremonies Cannot be Warranted by the Law of Nature’</cite>, p. 200</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Law of Nature cannot direct us unto a supernatural end, as is acknowledged not only by our divines (Junius, De Politia Mosaica, ch. 1; Paraeus, Commentary on Rom. 1:19), but by Aquinas also (1a, 2a, q. 91, article 4). It only teaches us to seek and to do bonum, velut finem naturae, ‘such a good as is an end proportioned to Nature’ (Junius). All those precepts of the Law of Nature which we have spoken of, could never lead men to a supernatural good (Junius). It is only the Divine Law, revealed from God, which informs the minds of men with such notions as are supra naturam [above nature], and which may guide them ad finem supernaturalem [to a supernatural end].”

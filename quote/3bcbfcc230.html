<main class="wrap"><figure class="quote" id="q-3bcbfcc230" data-kw="">
<blockquote><p>For the priesthood being changed, of necessity there is also a change of the law. (Hebrews 7:12)

When preaching on the above text (around the time of the Westminster Assembly) William Gouge, the important Westminster divine, gave the following directions for making sense of the Mosaic judicials (hence, this is an important source for understanding Westminster Confession 19:4-5):

Sec. 69. Of the judicial law of the Jews.

Besides the ceremonial law, the Jews had a judicial law, proper and peculiar to that polity. This law concerned especially their civil estate. Many branches of that law appertained to the Jewish priesthood; as, the particular laws about the cities of refuge, wither such as slew any unawares fled, and there abode till the death of the high priest, Num. xxxv. 25. And laws about lepers, which the priest was to judge, Lev. xiv. 3. And sundry other cases which the priest was to judge of, Deut. xvii. 9. So also the laws of distinguishing tribes, Num. xxxvi. 7; of reserving inheritances to special tribes and families, of selling them to the next of kin, Ruth iv. 4; of raising seed to a brother that died without issue, Gen. xxxviii. 8, 9; of all manner of freedoms at the year of jubilee, Lev. xxv. 13, &amp;c.

There were other branches of the judicial law which rested upon common equity, and were means of keeping the moral law: as putting to death idolaters and such as enticed others thereunto; and witches, and wilful murderers, and other notorious malefactors. So likewise laws against incest and incestuous marriages; laws of reverencing and obeying superiors and governors; and of dealing justly in borrowing, restoring, buying, selling, and all manner of contracts, Exod. xxii. 20; Deut. xiii. 9; Exod. xx. 18; Num. xxxv. 30; Lev. xx. 11, &amp;c., xix. 32, 35.

The former sort were abolished together with the priesthood.

The latter remain as good directions to order even Christian polities accordingly.

1. By these kinds of laws the wisdom of God was manifested in observing what was fit for the particular kind and condition of people; and in giving them answerable laws, and yet not tying all nations and states thereunto.

2. That liberty which God affordeth to others to have laws most agreeable to their own country, so as they be not contrary to equity and piety, bindeth them more obediently to submit themselves to their own wholesome laws, and to keep peace, unity, and amity among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary on the whole epistle of the Hebrews. Being the substance of thirty years’ Wednesday’s lectures at Blackfriars,</cite>, London (1655; 3 vols, Edinburgh, 1866), 2: 123.</span></figcaption>

<blockquote><p>One reason why Reformed Presbyterians have historically rejected the United States’ Constitution and the constitution of the individual states as immoral is because of their rejection of biblical law:

2. Another objection we have [to the American system of government] is, that most, if not all, of the State constitutions contain positive immorality. Witness their recognition of such rights of conscience as sanction every blasphemy which a depraved heart may believe to be true. Moreover, the State constitutions necessarily bind to the support of the federal, as the bond of national existence; and hence the immorality contained in that instrument becomes common to them all.

The recognition of such rights of conscience is insulting to the Majesty of Heaven, and repugnant to the express letter of God’s word. Deut. 17:18. God prescribes to the magistrate the divine law as the supreme standard of all his administrations; and which obliges men in every station to conduct themselves accordingly. Deut. 12:32: “What thing soever I command you, observe to do it: thou shalt not add to it, nor diminish from it.” But, in the framing of these constitutions, the revealed law of God is not attended to; though even the law of nature requires the adoption of every new communication which God in mercy may be pleased to reveal.

The rejection of the divine law, as revealed in the Scriptures of truth, we consider as a contempt of the beneficence of Heaven, and an obstinate drawing back to heathenism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>In this post, the Philadelphia Covenanter lands another blow against the New Perspective on Moses by pointing out that Christ upheld the true meaning of the so-called law of retaliation (Matthew 5:38-42) and the penal sanction against rebellious children (Matthew 15:4). Although advocates of the New Perspective on Moses are quick to accuse Judicial Calvinists with being legalists, the irony is that their position is actually that of the Pharisees rather than that of Jesus Christ:

The law of retaliation would seem to be taught by the light of nature […] It is evidently founded on the principles of immutable justice. It appears, however, to have been grossly abused by the Jews, for the purpose of private revenge. This the Redeemer forbids; but in no instance did he interfere with the province of the civil magistrate farther than to command his disciples to obey the laws which God had given to Moses. Matt. xxiii. 1. Could it be proved that Christ abrogated the law of retaliation, the same reasoning would prove that he had abrogated all law, and, consequently, all civil government. Moses commanded – “And he that curseth his father, or his mother, shall surely be put to death.” Exod. xxi. 17. This command the Scribes and Pharisees had set aside, probably under the pretence of its being a cruel law; but, for so doing, the Redeemer calls them hypocrites, and blind leaders of the blind. Matt. xx. 1-9, and 14. Mark vii. 6-13. Think of that ye advocated for the murderer – ye falsely merciful – ye vilifers of the law of Moses. Do ye pretend to be more compassionate than the Son of God? Do you understand, better than he, the demerit of crime, and the manner in which it should be punished? Do our pseudo-philanthropists know that there is such a passage in the gospel?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, pp 164-5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-dd63164b87" data-kw="">
<blockquote><p>I. Original sin is the depravation of man’s nature, contracted and drawn from the very generation it self, and derived from Adam into all mankind; consisting of the privation or want of original righteousness, and the proneness to evil.

II. These two things, to wit, the privation or want of original righteousness, and the inclinableness to evil, are in original sin. For as sickness is not only a privation of health, but also an evil affection of the body from the distemper of the humours: so this hereditary blot, is not only the want of righteousness, but also the inclinableness to unrighteousness.

III. The last of these proceeds from the former. For the soul, which by original sin hath ceased to be good, is necessarily evil; and the soul being instructed by the will, which cannot be idle, holiness and righteousness being lost, must needs turn to the contrary part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 8.1-3, p. 45.</span></figcaption>

<blockquote><p>2. The apostle, 1 Jn. 5:16, speaks of a sin unto death, that we are not to pray for one guilty of that; This has much troubled the learned; The ancients, they thought it was not an absolute prohibition of all [persons] to pray for such, but only that eminent men might do it; They thought for an ordinary Christian to pray for such sinners, it would be high presumption; As it’s not for everyone in the court to speak for some heinous offender but a special favourite; When God said, though Noah, Job and Daniel should pray for that people, He would not hear them (Eze. 14:14); This implied that they were nearer to God’s ear and might prevail sooner than others; Though this exposition be old, yet the text seems to be absolutely prohibitive; and so Augustine said that if we knew who had sinned that unpardonable sin against the Holy Ghost, we were no more to pray for him than for one damned in hell:</p></blockquote>

</figure><figure class="quote" id="q-0d13a27ddd" data-kw="">
<blockquote><p>It is impossible for the sins of the nearer ancestors, or even any other but the first sin of our first parent to be transmitted by way of origin. The reason is that a man begets his like in species but not in individual. Consequently those things that pertain directly to the individual, such as personal actions and matters affecting them, are not transmitted by parents to their children: for a grammarian does not transmit to his son the knowledge of grammar that he has acquired by his own studies. On the other hand, those things that concern the nature of the species, are transmitted by parents to their children, unless there be a defect of nature: thus a man with eyes begets a son having eyes, unless nature fails. And if nature be strong, even certain accidents of the individual pertaining to natural disposition, are transmitted to the children, e.g. fleetness of body, acuteness of intellect… Other actual sins, however, whether of the first parent or of others, do not corrupt the nature as nature, but only as the nature of that person, i.e. in respect of the proneness to sin: and consequently other sins are not transmitted. According to Augustine in his letter to Avitus [Ep. ad Auxilium ccl.], children are never inflicted with spiritual punishment on account of their parents, unless they share in their guilt, either in their origin, or by imitation, because every soul is God’s immediate property, as stated in Ezekiel 18:4. A man can more easily transmit that which he has of himself, provided it be transmissible. But the actual sins of our nearer ancestors are not transmissible, because they are purely personal, as stated above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, Part 2, Q. 81, A. 2</span></figcaption>

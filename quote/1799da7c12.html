<main class="wrap"><figure class="quote" id="q-1799da7c12" data-kw="">
<blockquote><p>Righteousness, in the fallen state, is twofold according to the demands of the law. Hence, Christ’s vicarious righteousness also needs to be twofold. He merits for us both deliverance from punishment and right to eternal life. None can be to Him alone for He is not liable to the first and [He is] entitled to the second due to the hypostatical union. Covenantally, however, he assumes the role of representative viator [wayfarer] in order to obtain the covenant promises for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heber-carlos-de-campos-jr.html">Heber Carlos de Campos Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Piscator</cite>, (1546-1625) and the Consequent Development of the Doctrine of the Imputation of Christ’s Active Obedience PhD diss. (Calvin Theological Seminary, 2009), p. 294</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-66e59fb3f6" data-kw="">
<blockquote><p>Merit of Condignity removed, they clamor and vociferate until they are hoarse that all the glory of good works is obscured, the necessity of doing good is taken away, and a license for perpetrating every kind of wickedness is indulged to men. But what (in heaven&#x27;s name!) does this itch for lying mean? For we have so proved this to be a notable and transparent lie from the candid confessions of the Papists themselves.</p></blockquote>

</figure><figure class="quote" id="q-764e523b54" data-kw="">
<blockquote><p>It is one thing to speak of the merit of the person, another of the merit of the work; and again, one thing to speak of eternal life as it is an inheritance, another as it is a reward, wages, a prize. For from the fact that someone is a son of God by grace, he merits ex condigno the inheritance of eternal life without any other pact, but by the merit of the person, not by the merit of the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-86e2524294" data-kw="">
<blockquote><p>Though we do good works, we do not found our salvation upon them; for we can do no work but what is polluted by our flesh, and also punishable; and although we could perform such works, still the remembrance of one sin is sufficient to make God reject them. Thus, then, we would always be in doubt, tossed to and fro without any certainty, and our poor consciences would be continually vexed if they relied not on the merits of the suffering and death of our Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 24</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8f1e9dcb57" data-kw="">
<blockquote><p>Concerning the story and benefit of our Lord’s Resurrection… so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… Now the wicked being utterly void and destitute of faith which justifies, how should they, I pray you, partake in any of these blessings… who belong not unto Christ, neither are heirs of the kingdom, who neither have title nor right in Christ Jesus, nor to Christ Jesus (as the lawyers use to speak), how should Christ appertain unto them? How should the benefits be extended unto them? Nay rather all these are by the mouth of the Son of God Himself far removed and debarred these treasures, and are adjudged unto eternal malediction and everlasting death… Yea but, say you, Christ died for the sins of all. Therefore He rose again for the justification of all. The answer hereunto is twofold… First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Christ therefore is thus said to be dead for all: that is, for all the faithful and elect; for whom alone He also prayed, and in whom alone He finds the end and fruit of his death. But to extend the benefits of Christ’s death unto infidels and reprobates, for whom He never prayed, whom He never knew, or took for his own, and on whom the wrath of God abides forever; what else is this but against his express commandment to give holy things unto dogs… Howbeit there is an other answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving… and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all 〈…〉 and reprobate. But here some men… spew out on us their stinking 〈…〉 open mouth, taking it grievously, that 〈…〉not those heavenly treasures and jewels equally to the godly, and ungodly; to the faithful, and unfaithful; to the elect and reprobate; to Christ’s members and the Devil’s vassals; to the sheep and to the swine. They make loud outcries on us for denying that Christ died for all… And first the holy Scripture itself teaches us plainly this kind of distinction, and forces us thereunto. For you shall find it in Scripture sometimes absolutely spoken that Christ tasted of death for all men: that He gave Himself a ransom for all men: that he is the reconciliation for the sins of the whole world… These places carry some show of contrariety, were it not that the former are understood by us of the sufficiency of satisfaction, and the latter [about Christ laying down his life for the sheep] of the efficacy and working virtue thereof. Furthermore other places occur which seem to impart unto the wicked the benefit of redemption; as when Peter says that they deny even the Lord which has bought them… all which the Scripture elsewhere enforces us to interpret either of the vain glorying of hypocrites of their redemption and sanctification: or else to understand them no otherwise than of the extent and sufficiency of Christ’s satisfaction: whereas it simply excludes the unfaithful and unrepentant from the benefit of redemption… lastly that Christ never knew them, much less redeemed them. … What comfort can there be more contemptible than that thou art redeemed by Christ’s death, reduced into amity and friendship with Him; whereas many thousands of those, which have been in like sort restored, notwithstanding perish everlastingly. … Christ died and prayed for all that believe. But I believe. Therefore He prayed, and died for me. Now they are cold comforters who teach afflicted consciences to reason on this manner: Christ died for all men. But I am a man. Therefore Christ died for me.</p></blockquote>

et="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbf177cc5d" data-kw="">
<blockquote><p>The Confession, therefore, must be regarded as teaching, that it is not true of any but the elect only that they are redeemed by Christ, any more than it is true that any others are called, justified, or saved. Here I may remark by the way, that though many modern defenders of a universal atonement regard the word redemption as including the application as well as the impetration of pardon and reconciliation, — and, in this sense, disclaim the doctrine of universal redemption, — yet a different phraseology was commonly used in theological discussions about the period at which the Confession was prepared, and in the seventeenth century generally. Then the defenders of a universal atonement generally maintained, without any hesitation, the doctrine of universal redemption, — using the word, of course, to describe only the impetration, and not the application, of spiritual and saving blessings; and this holds true, both of those who admitted, and of those who denied, the Calvinistic doctrine of election. Of the first of these cases (the Calvinists) we have an instance in Richard Baxter’s work, which he entitled Universal Redemption of Mankind by the Lord Jesus Christ; and of the second (the Arminians) in Dr. Isaac Barrow’s sermons, entitled The Doctrine of Universal Redemption Asserted and Explained.</p></blockquote>

<blockquote><p>That disease is curable for which a sovereign medicine may be found, but cured it is not till the medicine be applied to the patient; and if it so fall out, that the medicine being not applied, the party miscarries, we say he was lost, not because his sickness was incurable, but because there wanted a care to apply that to him that might have helped him.</p></blockquote>

</figure><figure class="quote" id="q-87bc282954" data-kw="">
<blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</span></figcaption>

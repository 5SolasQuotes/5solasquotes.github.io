<blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Delight</cite>, (London: T.R., 1657), “Christ’s Loveliness”, pp. 353-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-576d817df9" data-kw="">
<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aqua cœlestis, or a Sovereign Cordial extracted from the Sufficiency of Divine Grace &amp; Strength made Perfect in Weakness</cite>, … (London: Sawbridge, 1663), pp. 54-56</span></figcaption>

<blockquote><p>20. Behold, I stand ever ready knocking at the door of your conscience: whoso yields unto mine admonitions and opens his heart and mind by penitence and remorse, I will certainly dwell in him and will communicate all things with him, and he with Me.</p></blockquote>

<blockquote><p>‘Behold I stand at the door and knock, etc.’ Here is yet further kindness declared: the Lord stands at the door knocking to be let in. He is the Good Shepherd, He seeks up that which goes astray, He stands knocking at the door of man’s heart to enter and to make it his temple to dwell in. Mark here diverse things: As first that the Lord does not only knock and call at the door of man’s heart, but continues the same: for He stands at the door, and has stood at the door, as the word imports. This is much that He must wait upon us, moving us to receive Him: but the truth is, we never have any mind of Him but when He does stand knocking at the door of our heart. Then further behold how difficult a thing it is for the heart of man to receive Christ and to be turned to God… we are so fast asleep that He may knock and knock again, we regard Him not. But let us take heed, for albeit his kindness is marvellous, yet He will not always offer Himself, nor always be found… Be not therefore too bold with Him: if He have by his Word and by the motions of his Spirit, stood daily knocking at the door of thy heart, showing thy sins and moving thee to repentance, and thou hast made light thereof, take heed lest those knockings of his cease and thine heart be more hardened, so that there is no feeling of any godly sorrow unto repentance. Make much of this knocking, make much of these motions of the Spirit, for many that have had great remorse and beginnings for to repent, are now hardened and boldened in sin. Most miserable are they which despise his knocking and drive Him away. On the contrary part, they be a thousand times blessed which open unto Him, and so receive Him. For mark what He says, ‘If any do hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ What more happy guest can be received in? what good thing can be wanting where He is? If Christ dwell in the heart by faith, if the graces and power of Christ be received in, all evil and misery is driven out, and all goodness and felicity do succeed. Darkness is driven out, the Devil is expelled, sin is destroyed and horror of the dreadful judgment does vanish away. There is light, there is God, there is righteousness, and peace and joy of the Holy Ghost. Full notably does the prophet David set forth this, Ps. 24, when he says: ‘Lift up your heads ye gates, and be ye lift up ye everlasting doors, and the king of glory shall come in. Who is the king of glory? The Lord strong and mighty, the Lord mighty in battle.’ …He sets it forth that we shall receive all good things by Him, in these words, that ‘if any open the door, He will come in and sup with him, etc.’ He brings all the dainties with Him, and compares it unto a supper, for we shall be fed with them: we shall be even filled abundantly with all sweet joys: this supper shall never be ended. … If any man will say then, how are those former speeches to be construed? Thus you must understand: First, that God works upon the hearts of men, not as men work upon blocks or stones, which have no sense nor understanding: for man has understanding, he has a will, he has affections. Then secondly, that free is opposed to bond, and free is opposed to compelled. In respect of the [latter] one, man has free will, in respect of the other he has not. Man naturally loves and delights in evil, his will not forced or compelled, does choose the same: man despises and rejects the Gospel of his own will. In this respect his will is free unto all evil, that is, he wills evil not compelled, but carried thereunto with pleasure. …The mark what Christ says, ‘No man comes unto Me, unless the Father that sent Me draw him, John 6. This drawing is not by force, but God reforms the will and the affections, so that a man joyfully receives Christ and therefore is said to open the doors of his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Whole Book of the Revelation</cite>, (London: Field, 1599), Sermon 10, pp. 109-11 Gifford (1547-1600) was a partially-conforming puritan.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘Behold I stand at the door and knock, etc.’ Here is yet further kindness declared: the Lord stands at the door knocking to be let in. He is the Good Shepherd, He seeks up that which goes astray, He stands knocking at the door of man’s heart to enter and to make it his temple to dwell in. Mark here diverse things: As first that the Lord does not only knock and call at the door of man’s heart, but continues the same: for He stands at the door, and has stood at the door, as the word imports. This is much that He must wait upon us, moving us to receive Him: but the truth is, we never have any mind of Him but when He does stand knocking at the door of our heart. Then further behold how difficult a thing it is for the heart of man to receive Christ and to be turned to God… we are so fast asleep that He may knock and knock again, we regard Him not. But let us take heed, for albeit his kindness is marvellous, yet He will not always offer Himself, nor always be found… Be not therefore too bold with Him: if He have by his Word and by the motions of his Spirit, stood daily knocking at the door of thy heart, showing thy sins and moving thee to repentance, and thou hast made light thereof, take heed lest those knockings of his cease and thine heart be more hardened, so that there is no feeling of any godly sorrow unto repentance. Make much of this knocking, make much of these motions of the Spirit, for many that have had great remorse and beginnings for to repent, are now hardened and boldened in sin. Most miserable are they which despise his knocking and drive Him away. On the contrary part, they be a thousand times blessed which open unto Him, and so receive Him. For mark what He says, ‘If any do hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ What more happy guest can be received in? what good thing can be wanting where He is? If Christ dwell in the heart by faith, if the graces and power of Christ be received in, all evil and misery is driven out, and all goodness and felicity do succeed. Darkness is driven out, the Devil is expelled, sin is destroyed and horror of the dreadful judgment does vanish away. There is light, there is God, there is righteousness, and peace and joy of the Holy Ghost. Full notably does the prophet David set forth this, Ps. 24, when he says: ‘Lift up your heads ye gates, and be ye lift up ye everlasting doors, and the king of glory shall come in. Who is the king of glory? The Lord strong and mighty, the Lord mighty in battle.’ …He sets it forth that we shall receive all good things by Him, in these words, that ‘if any open the door, He will come in and sup with him, etc.’ He brings all the dainties with Him, and compares it unto a supper, for we shall be fed with them: we shall be even filled abundantly with all sweet joys: this supper shall never be ended. … If any man will say then, how are those former speeches to be construed? Thus you must understand: First, that God works upon the hearts of men, not as men work upon blocks or stones, which have no sense nor understanding: for man has understanding, he has a will, he has affections. Then secondly, that free is opposed to bond, and free is opposed to compelled. In respect of the [latter] one, man has free will, in respect of the other he has not. Man naturally loves and delights in evil, his will not forced or compelled, does choose the same: man despises and rejects the Gospel of his own will. In this respect his will is free unto all evil, that is, he wills evil not compelled, but carried thereunto with pleasure. …The mark what Christ says, ‘No man comes unto Me, unless the Father that sent Me draw him, John 6. This drawing is not by force, but God reforms the will and the affections, so that a man joyfully receives Christ and therefore is said to open the doors of his heart.”

— George Gifford, Sermons upon the Whole Book of the Revelation (London: Field, 1599), Sermon 10, pp. 109-11 Gifford (1547-1600) was a partially-conforming puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Behold+I+stand+at+the+door+and+knock%2C+etc.%E2%80%99+Here+is+yet+further+kindness+declared%3A+the+Lord+stands+at+the+door+knocking+to+be+let+in.+He+is+the+Good+Shepherd%2C+He+seeks+up+that+which+goes+astray%2C+He+stands+knocking+at+the+door+of+man%E2%80%99s+heart+to+enter+and+to+make+it+his+temple+to+dwell+in.+Mark+here+diverse+things%3A+As+first+that+the+Lord+does+not+only+knock+and+call+at+the+door+of+man%E2%80%99s+heart%2C+but+continues+the+same%3A+for+He+stands+at+the+door%2C+and+has+stood+at+the+door%2C+as+the+word+imports.+This+is+much+that+He+must+wait+upon+us%2C+moving+us+to+receive+Him%3A+but+the+truth+is%2C+we+never+have+any+mind+of+Him+but+when+He+does+stand+knocking+at+the+door+of+our+heart.+Then+further+behold+how+difficult+a+thing+it+is+for+the+heart+of+man+to+receive+Christ+and+to+be+turned+to+God%E2%80%A6+we+are+so+fast+asleep+that+He+may+knock+and+knock+again%2C+we+regard+Him+not.+But+let+us+take+heed%2C+for+albeit+his+kindness+is+marvellous%2C+yet+He+will+not+always+offer+Himself%2C+nor+always+be+found%E2%80%A6+Be+not+therefore+too+bold+with+Him%3A+if+He+have+by+his+Word+and+by+the+motions+of+his+Spirit%2C+stood+daily+knocking+at+the+door+of+thy+heart%2C+showing+thy+sins+and+moving+thee+to+repentance%2C+and+thou+hast+made+light+thereof%2C+take+heed+lest+those+knockings+of+his+cease+and+thine+heart+be+more+hardened%2C+so+that+there+is+no+feeling+of+any+godly+sorrow+unto+repentance.+Make+much+of+this+knocking%2C+make+much+of+these+motions+of+the+Spirit%2C+for+many+that+have+had+great+remorse+and+beginnings+for+to+repent%2C+are+now+hardened+and+boldened+in+sin.+Most+miserable+are+they+which+despise+his+knocking+and+drive+Him+away.+On+the+contrary+part%2C+they+be+a+thousand+times+blessed+which+open+unto+Him%2C+and+so+receive+Him.+For+mark+what+He+says%2C+%E2%80%98If+any+do+hear+my+voice%2C+and+open+the+door%2C+I+will+come+in+to+him%2C+and+will+sup+with+him%2C+and+he+with+Me.%E2%80%99+What+more+happy+guest+can+be+received+in%3F+what+good+thing+can+be+wanting+where+He+is%3F+If+Christ+dwell+in+the+heart+by+faith%2C+if+the+graces+and+power+of+Christ+be+received+in%2C+all+evil+and+misery+is+driven+out%2C+and+all+goodness+and+felicity+do+succeed.+Darkness+is+driven+out%2C+the+Devil+is+expelled%2C+sin+is+destroyed+and+horror+of+the+dreadful+judgment+does+vanish+away.+There+is+light%2C+there+is+God%2C+there+is+righteousness%2C+and+peace+and+joy+of+the+Holy+Ghost.+Full+notably+does+the+prophet+David+set+forth+this%2C+Ps.+24%2C+when+he+says%3A+%E2%80%98Lift+up+your+heads+ye+gates%2C+and+be+ye+lift+up+ye+everlasting+doors%2C+and+the+king+of+glory+shall+come+in.+Who+is+the+king+of+glory%3F+The+Lord+strong+and+mighty%2C+the+Lord+mighty+in+battle.%E2%80%99+%E2%80%A6He+sets+it+forth+that+we+shall+receive+all+good+things+by+Him%2C+in+these+words%2C+that+%E2%80%98if+any+open+the+door%2C+He+will+come+in+and+sup+with+him%2C+etc.%E2%80%99+He+brings+all+the+dainties+with+Him%2C+and+compares+it+unto+a+supper%2C+for+we+shall+be+fed+with+them%3A+we+shall+be+even+filled+abundantly+with+all+sweet+joys%3A+this+supper+shall+never+be+ended.+%E2%80%A6+If+any+man+will+say+then%2C+how+are+those+former+speeches+to+be+construed%3F+Thus+you+must+understand%3A+First%2C+that+God+works+upon+the+hearts+of+men%2C+not+as+men+work+upon+blocks+or+stones%2C+which+have+no+sense+nor+understanding%3A+for+man+has+understanding%2C+he+has+a+will%2C+he+has+affections.+Then+secondly%2C+that+free+is+opposed+to+bond%2C+and+free+is+opposed+to+compelled.+In+respect+of+the+%5Blatter%5D+one%2C+man+has+free+will%2C+in+respect+of+the+other+he+has+not.+Man+naturally+loves+and+delights+in+evil%2C+his+will+not+forced+or+compelled%2C+does+choose+the+same%3A+man+despises+and+rejects+the+Gospel+of+his+own+will.+In+this+respect+his+will+is+free+unto+all+evil%2C+that+is%2C+he+wills+evil+not+compelled%2C+but+carried+thereunto+with+pleasure.+%E2%80%A6The+mark+what+Christ+says%2C+%E2%80%98No+man+comes+unto+Me%2C+unless+the+Father+that+sent+Me+draw+him%2C+John+6.+This+drawing+is+not+by+force%2C+but+God+reforms+the+will+and+the+affections%2C+so+that+a+man+joyfully+receives+Christ+and+therefore+is+said+to+open+the+doors+of+his+heart.%E2%80%9D%0A%0A%E2%80%94+George+Gifford%2C+Sermons+upon+the+Whole+Book+of+the+Revelation+%28London%3A+Field%2C+1599%29%2C+Sermon+10%2C+pp.+109-11+Gifford+%281547-1600%29+was+a+partially-conforming+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f6e4a9720.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f6e4a9720.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Behold%20I%20stand%20at%20the%20door,open%20the%20doors%20of%20his%20heart&amp;text=Behold%20I%20stand%20at%20the%20door%20and%20knock&amp;text=said%20to%20open%20the%20doors%20of%20his%20heart" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2) If they would comply with his admonitions, he was ready to make them good to their souls: Behold, I stand at the door and knock, etc., v. 20. Here observe, [1.] Christ is graciously pleased by his Word and Spirit to come to the door of the heart of sinners; He draws near to them in a way of mercy, ready to make them a kind visit. [2.] He finds this door shut against Him; the heart of man is by nature shut up against Christ by ignorance, unbelief, sinful prejudices. [3.] When He finds the heart shut, He does not immediately withdraw, but He waits to be gracious, even till his head be filled with the dew. [4.] He uses all proper means to awaken sinners, and to cause them to open to Him: He calls by his Word, He knocks by the impulses of his Spirit upon their conscience.</p></blockquote>

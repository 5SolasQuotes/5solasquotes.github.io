<main class="wrap"><figure class="quote" id="q-4ac2ef1636" data-kw="">
<blockquote><p>But goodness signifies perfection which is desirable; and consequently of ultimate perfection. Hence that which has ultimate perfection is said to be simply good; but that which has not the ultimate perfection it ought to have (although, in so far as it is at all actual, it has some perfection), is not said to be perfect simply nor good simply, but only relatively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 105</cite>, art. 1, Whether goodness differs really from being?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

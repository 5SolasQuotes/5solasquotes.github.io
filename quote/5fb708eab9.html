<main class="wrap"><figure class="quote" id="q-5fb708eab9" data-kw="">
<blockquote><p>The secession of those good people from the idolatry erected by Jeroboam to worship at Jerusalem is allowed, 2 Chron. 11:16. The negative separation, or the not communicating in the worship of Baal, not so much as by knees or lips of those seven thousand in Israel, is liked of by the Lord, 1 Kings 19:18… The flying of God’s people out of Babylon [Rev. 18:4], where idolatry is maintained by force of tyranny is called for and required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, (London: 1657), ch. 20, p. 246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-682ade5ace" data-kw="">
<blockquote><p>… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this [singing of a human-composed doxology]… It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially, and to our edification, joined with them, and yet partake in none of these: nor is so much of these among them as he [the episcopal opponent] would make us believe.</p></blockquote>

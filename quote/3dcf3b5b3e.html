<main class="wrap"><figure class="quote" id="q-3dcf3b5b3e" data-kw="">
<blockquote><p>Thirdly, in Reformation do not make reason your rule, nor line you go by; it is the line of all the Papists: God (say they) hath not less care of his Church in the New, then he had in the Old Testament; there he gave them one high Priest, who should infallibly determine all controversies; and therefore now there should be one Bishop, who should have the same light and power. You shall never read in Scripture where any man walked after the imaginations of his own heart, but by and by you shall read he did do wickedly:

In the point of worship of God the Text saith clearly, Exod. 20.4. thou shalt not make unto thy self, that is, by thy own wit, any thing which may as an image be like to what God hath appointed, as an image is to the person; any thing which may keep God in mind, or keep or stir up affection to him, as a picture doth to him it represents; nay it reacheth further then that; the greatest reason in the world of any obedience is God’s nature: if he be God that gives being to all things, all things must depend on him by faith; if all things come from him, all things must return to him as the utmost end; he ought to be served with all a man hath, because all a man hath is from him.

This the nature of God teacheth a man; but the nature of God is not the reason, but his will is the reason of his outward worship: it doth not follow, if God be God he must be served with Sacraments, or such Ministers, but because he hath set it down and appointed it: the second Commandment doth forbid not only reason, but all divine reason, that is not sanctified by institution in the worship of God: I say not only all human, but all divine: Reason may be considered two ways; first, as it is a disposer and placer of all things in their order, and so it belongs to all knowledge and science: secondly, as it imports a Principle of doing any thing, and so God’s outward worship, hath no ground in any reason, but God’s will.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7a833fcf1" data-kw="">
<blockquote><p>Note the words “let him be silent in the church” in verse 30, and compare them with “let them he silent in the churches” in [1 Corinthians 14] verse 34. The prohibition of women speaking covers thus all public church meetings – it is the publicity, not the formality of it, which is the point. And he tells us repeatedly that this is the universal law of the church. He does more than that. He tells us that it is the commandment of the Lord, and emphasizes the word “Lord” (verse 37).

The passage in 1 Timothy 2:11ff. is just as strong, although it is more particularly directed to the specific case of public teaching or ruling in the church. The apostle had already in this context (verse 8, “the men,” in contrast with “women” of verse 9) pointedly confined public praying to men, and now continues: “Let a woman learn in silence in all subjection; but I do not permit the woman to teach, neither to rule over the man, but to be in silence.” Neither the teaching nor the ruling function is permitted to woman. The apostle says here, “I do not permit,” instead of as in 1 Corinthians 14:33ff., “it is not permitted,” because he is here giving his personal instructions to Timothy, his subordinate, while there he was announcing to the Corinthians the general law of the church. What he instructs Timothy, however, is the general law of the church. And so he goes on and grounds his prohibition in a universal reason which affects the entire race equally.

In the face of these two absolutely plain and emphatic passages, what is said in 1 Corinthians 11:5 cannot be appealed to in mitigation or modification. Precisely what is meant in 1 Corinthians 11:5, nobody quite knows. What is said there is that every woman praying or prophesying unveiled dishonors her head. It seems fair to infer that if she prays or prophesies veiled she does not dishonor her head. And it seems fair still further to infer that she may properly pray or prophesy if only she does it veiled. We are piling up a chain of inferences. And they have not carried us very far. We cannot infer that it would be proper for her to pray or prophesy in church if only she were veiled.

There is nothing said about church in the passage or in the context. The word “church” does not occur until the 16th verse, and then not as ruling the reference of the passage, but only as supplying support for the injunction of the passage. There is no reason whatever for believing that “praying and prophesying” in church is meant. Neither was an exercise confined to the church. If, as in 1 Corinthians 14:14, the “praying” spoken of was an ecstatic exercise – as its place by “prophesying” may suggest – then there would be the divine inspiration superceding all ordinary laws to be reckoned with. And there has already been occasion to observe that prayer in public is forbidden to women in 1 Timothy 2:8, 9 – unless mere attendance at prayer is meant, in which case this passage is a close parallel of 1 Timothy 2:9.</p></blockquote>

<blockquote><p>Ma. Now remaineth the last Commmandment?

Sch. Thou shalt not cover thy Neighbour’s house. Thou shalt not covet thy Neighbour’s wife, nor his servant, nor his Maid, nor his Ox, nor his Ass, nor any thing that is his.

Ma. What is more commanded here than was before?

Sch. God hath before forbidden evil doings &amp; corrupt affectations of the mind; but now he requireth of us a more precise pureness, that we suffer not any desire, be it never so light, nor any thought, be it never so small, in any wise swerving from right, once to creep into our heart. For it is meet that even in our very hearts and minds, should shine before God most perfect pureness and cleanness. For no innocency and righteousness, but that which is most perfect, can please him: whereof he hath also set before us this Law as a most perfect Rule.</p></blockquote>

<blockquote><p>The Sabbath is a commemorative institution; designed to be a monument against Atheism, and to afford time for the creature to meditate on the works, and adore the character of the great Creator. How venerable is the Sabbath, considered simply as an institution that has existed since the dawn of time! How many convulsions has it survived!

The fall came and shook the blossoms of the tree of life, and withered all the hues of Eden, – the flood came and swept away the men and the monuments of the preceding eras: since then, the tide of time has effaced the impressions made upon the world, as the ocean waves obliterate the prints upon the sand; empires have risen and fallen — cities been built and destroyed — civil codes enacted and repealed — systems of philosophy been popular and perished — the institutions of Numa, and the laws of Lycurgus exist only in history — the hieroglyphics of Egyptian wisdom are worn out — the days of Thor, Saturn, and Woden are no more sacred; — even the divinely appointed economy of Judah is terminated – the Urim and Thummim are departed — the mantle of prophecy, and the robe of priesthood, have descended upon no successor; but notwithstanding all these changes, the Sabbath still exists, and still is the “Holy of the Lord and honourable.”

Time is the mighty spoiler of every thing frivolous, and the infallible detector of fraud. The Sabbath being time tried, and time warranted, has the testimony of experience to its value, and a guarantee that it will not be subverted, by the ephemeral opposition of modern infidelity. It is possible, that institutions con genial to some of the master feelings of the human mind, when sanctioned by law, and shielded by power, may survive many a century, and still be of the “earth earthy.”

The observance of Sabbath is not congenial to the natural feelings of the heart; much opposition has been made to it in the world; yet it has weathered all the storms and withstood all the changes of time. Is not its preservation then a proof that the Sabbath is divine? the gates of hell have not prevailed against it, because it was appointed by the wisdom, and is defended by the power of God. Such an institution demands our reverence, were it for nothing else than its age. Ye worshippers of antiquity! Ye fond adorers of the times and things of old! Behold in the Sabbath, an institution older than all the monuments of antiquity, at the sight of which, your eyes brighten and your hearts swell! Here is a relict of Paradise: on it, lavish a portion of your veneration, and for once you may be both rational and pious.</p></blockquote>

<blockquote><p>Although there is much evidence for the practice of female veiling in the Classical world it has for the most part been ignored. Evidence for the veiling of Roman women is found in many sources. Ancient lexicographers list many names for veils that these women wore. Each of these veils was particular to the context in which they were worn and by whom they were worn. The plenitude of veiling terminology as well as the specialized nature of these veils alerts the reader to the importance that the Romans attributed to the veil, suggesting that it formed an important part of their culture and this is described in visual and literary terms by ancient artists and writers. … The practice of veiling is therefore viewed by the Romans in a positive light, and its disruption is understood by them as a cause for concern. This concern was especially apparent during the late republic. The dissolution of the traditional forms of government was in some ways problematized in terms of gender, with women’s abandonment of their traditional roles and their incursion into the public sphere being of specific importance. In order to remedy this, attempts were made by the new regime of Augustus to promote a return to what were seen to be traditional gender relations. This programme of moral reform made use of both formal, legalistic decree (the Julian marriage laws) and more propagandistic constructions (the public works of art). In this process traditional symbols assumed a high degree of salience. Because of its power to signify the beneficial and appropriate status of the female body, one of the most important of these symbols was the veil.</p></blockquote>

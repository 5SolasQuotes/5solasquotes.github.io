<main class="wrap"><figure class="quote" id="q-0a7bc34e4b" data-kw="">
<blockquote><p>Adultery is judged to be a sin worthy of death and endless infamy. For the Lord in the law doth not say only, “Thou shalt not commit adultery;” but in another place also goeth on, and addeth, “And he that committeth adultery with another man’s wife, even he that committeth adultery with his neighbour’s wife, let both the adulterer and the adulteress be slain.” Levit. xx. And this punishment of adultery by death was not abrogated or changed by the very Gentiles; for the Roman law Lex Julia is very well known, how it commanded adulterers to be put to death: which law was of force in the time of St Hierome [Jerome], as we may gather by the history which he wrote of an adulteress, at the chopping off of whose head seven strokes were given.

Neither is it marvel, undoubedly, that adultery was among them of old, and is yet to this day, according to the laws, to be punished by death; for upon that one many sins do depend. […] Since therefore that it is a serpent with so many heads, both the laws of God and men do rightly punish adulterers with loss of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 412-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>The traditional Covenanter view of the Old Testament’s penal sanctions is that the majority of them remain binding today, as they have not been abrogated in the New Testament. Samuel B. Wylie, an American Reformed Presbyterian, explains this position below:

It may perhaps be inquired, what are those things which he [the civil magistrate] may lawfully command? To this I answer, he may lawfully command whatever is contained in the constitution prescribed by him whom he represents. Deut. 17:18, we are told what this is, namely, the Divine Law. Whatever penalties are specified in that law, and nowhere either repealed or mitigated, should be duly inflicted, in case of disobedience. Where the law is silent or indefinite, with respect to particular crimes, against any precept of the Decalogue, and the punishment due thereto, great prudence and discretion will be necessary to ascertain whether said crimes are punishable by civil pains, as there are many violations of the moral law to which no particular civil penalty can attach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>…about a law there are these affections (if I may call them so): There is an interpretation, a dispensation, or relaxation; and these differ from an abrogation. For the former do suppose the law still standing in force, though mitigated; but Abrogation is then properly, when a Law is totally taken away. And this abrogation arises sometimes from the express constitution at first, which did limit and prescribe the time of the law’s continuance: sometimes by an express revoking and repealing of it by that authority which made it, sometimes by adding to that repeal an express law commanding the contrary. Now it may be easily proved that the Ceremonial and Judicial laws, they are abrogated by express repeal. The Judicial Law: 1 Pet. 2:13, where they are commanded to be subject to every ordination of man: and this was long foretold Gen. 49:10. The Lawgiver shall be taken from Judah. The Ceremonial Law that is also expressly repealed Acts 15 and in other places… In the second place, if we would speak exactly and properly, we cannot say, in any good sense, that the Moral Law is abrogated at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), pp. 211-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

%20Law%20is%20abrogated%20at%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7a7bfa6eef" data-kw="">
<blockquote><p>In reality there are two, and only two, foundations of law; and they are both of them conditions without which nothing can give it any force; I mean equity and utility. With respect to the former, it grows out of the great rule of equality, which is grounded upon our common nature, and which Philo, with propriety and beauty, calls the mother of justice. All human laws are, properly speaking, only declaratory; they may alter the mode and application, but have no power over the substance of original justice. The other foundation of law, which is utility, connected in the same manner with, and derived directly from, our rational nature; for any other utility may be the utility of a robber, but cannot be that of a citizen; the interest of the domestic enemy, and not that of a member of the commonwealth. This present equality can never be the foundation of statues which create an artificial difference between men, as the laws before us [under consideration in his time] do, in order to induce a consequential inequality in the distribution of justice. Law is a mode of human action respecting society, and must be governed by the same rules of equity which govern every private action; and so Tully [Cicero?] considers it in his Offices as the only utility [being a utility to all commonly] agreeable to that [common] nature…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works &amp; Correspondence of the Right Honourable Edmund Burke. A New Edition</cite>, vol. 6 (d. 1797; London, 1852), p. 17. See also the larger context from pp. 14-18, which includes helpful Latin quotes from Suarez. Burke is opposing certain laws contrary to Romanists in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Ye would know that the law here intended is the moral law of the ten commandments, at first engraven upon the hearts of our first parents at their creation, and afterwards, because that edition or copy of it was much obliterated and defaced by the fall, published to Israel from the mouth of God upon Mount Sinai, and written upon tables of stone, and laid up in the ark for the use of Israel. This, I say, is the law here intended. The ceremonial and judicial laws were things peculiar unto the Jews, or commonwealth of Israel; but the moral law had a being so soon as man was created, and is binding upon all nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The broken law magnified and made honourable (first sermon) in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

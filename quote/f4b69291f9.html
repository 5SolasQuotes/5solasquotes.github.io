<main class="wrap"><figure class="quote" id="q-f4b69291f9" data-kw="">
<blockquote><p>To ascertain the true sense of the Scriptures, interpretation is needed. … It is not to be sought by each man&#x27;s private judgment (which is the idia epilysis condemned by Peter), but is to be gathered from the Scriptures themselves as their own best and surest interpreter (Neh. 8:8; Acts 17:11). But for this, after fervent prayer to God, there is need of an inspection of the sources, the knowledge of languages, … collation of passages, … and conformity of the interpretation to the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.18</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d69ee4f244" data-kw="">
<blockquote><p>That the obligations to faith and obedience are personal. Every man is responsible for his religious faith and his moral conduct. He cannot transfer that responsibility to others; nor can others assume it in his stead. He must answer for himself; and if he must answer for himself, he must judge for himself. It will not avail him in the day of judgment to say that his parents or his Church taught him wrong. He should have listened to God, and obeyed Him rather than men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>

<div class="actions"><button class="copy" data-copy="“That the obligations to faith and obedience are personal. Every man is responsible for his religious faith and his moral conduct. He cannot transfer that responsibility to others; nor can others assume it in his stead. He must answer for himself; and if he must answer for himself, he must judge for himself. It will not avail him in the day of judgment to say that his parents or his Church taught him wrong. He should have listened to God, and obeyed Him rather than men.”

</figure><figure class="quote" id="q-93e36ab959" data-kw="">
<blockquote><p>If the Scriptures be what they claim to be, the word of God, they are the work of one mind, and that mind divine. From this it follows that Scripture cannot contradict Scripture. God cannot teach in one place anything which is inconsistent with what He teaches in another. Hence Scripture must explain Scripture. If a passage admits of different interpretations, that only can be the true one which agrees with what the Bible teaches elsewhere on the same subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>

</figure><figure class="quote" id="q-1164379e79" data-kw="">

<main class="wrap"><figure class="quote" id="q-dc2c6dae08" data-kw="">
<blockquote><p>The method of our salvation; it was not sufficient to obtain salvation once, unless it could be perpetually preserved and applied. Christ obtained the former by his satisfaction, but the ladder he should procure by his intercession. By the former, he obtained salvation; by the latter he preserves it. By the former, he purchased the right to life and reconciled us to God; by the latter, he actually admits us to a participation of life and continually keeps us when once established in the grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, 14.15.3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-99e73a55f3" data-kw="intercession necessary">
<blockquote><p>Various arguments prove the necessity of his intercession. (1) The institution of God, who wished two parts to be in the priesthood—satisfaction and intercession; just as under the Old Testament the high priest was bound to do two things in virtue of his office—first, to offer a victim upon the altar of whole burnt offerings; second, to carry the blood of the offered victim into the holy place and to burn incense upon the altar of incense. Having finished his sacrifice on earth upon the cross, Christ must intercede in heaven. Hence Paul testifies if he were on earth, he should not be a priest (Heb. 8:4).</p></blockquote>

</figure><figure class="quote" id="q-1aeb2dfe15" data-kw="">
<blockquote><p>Whereas Paul says that “the promise is given to believers,” [Gal. 3:22] it is manifest that the promise is not universal in respect of all mankind, but only indefinite and universal in respect of believers. Wherefore their doctrine is not sound that teach the redemption wrought by Christ to be as general as the sin wrought by Adam. Indeed, if we regard the value and sufficiency of the death of Christ, it is so; but if we respect the communication and donation of this benefit, it is not. For though all be shut under sin, yet the promise is only given “to them that believe.” It is objected that “God was in Christ reconciling the world to Himself” (2 Cor. 5:19). Answer. The text in hand shows that by “the world” we are to understand all believers through the whole world. And whereas Paul says, “God shut up all under unbelief, that he might have mercy upon all” (Rom. 11:32), his meaning is here set down, that He shut both Jews and Gentiles under unbelief that He might have mercy upon all that believe, both Jews and Gentiles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 201.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

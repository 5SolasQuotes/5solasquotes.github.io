<blockquote><p>(2) Believing is the soul’s receiving Christ. St. Paul says, “Ye have received Christ Jesus the Lord.” (Col. 2:6) Christ offers to come into man’s heart with pardon, mercy, and grace, and to dwell there as its Peace-maker and King. He says, ‘I stand at the door and knock.’ (Rev. 3:20) The believer hears his voice, opens the door and admits Christ as his Master, Priest and King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, (London: Charles J. Thynne, 1898), pp. 376–402</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1aa5655632" data-kw="">
<blockquote><p>He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his Word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, Sermon 1, pp. 463-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-994f18c156" data-kw="">
<blockquote><p>There is a double interpretation of this text, each of them claiming under very valuable interpreters; some making it a declaration of Christ’s readiness to come in to souls, and to give them a spiritual fellowship and communion with Himself; others interpreting it of Christ’s readiness to come to the Last Judgment, and to take his saints into an eternal joyful fellowship and communion with Himself: hence there is a different interpretation of every sentence in the text. I stand at the door; either, in my gospel dispensations, I stand at the door of sinners’ hearts; or, I am ready to come to judge the world. And knock, by the inward monitions and impressions of my Spirit, or my ministers more externally; or, I am about to knock, that is, I am ready to have the last trump sounded. If any man hear my voice, and open the door; that is, if any man will hearken to the counsels and exhortations of my ministers, and to the monitions of my Spirit, and not resist my Holy Spirit; or, if any man has heard my voice, and opened his heart to Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible. Collinges was one of the men who finished Poole’s Commentary after he died, having gotten to Isa. 58</cite>, Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

ote%2F994f18c156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/994f18c156.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=There%20is%20a%20double%20interpretation%20of,and%20opened%20his%20heart%20to%20Me&amp;text=There%20is%20a%20double%20interpretation%20of%20this%20text&amp;text=my%20voice%2C%20and%20opened%20his%20heart%20to%20Me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. This Day of Grace is not passed when the sinner sets open the door of his heart that Christ the Lord may enter. That promise is most sure, ‘If any man hear my voice and open the door, I will come into him, and sup with him, and he shall sup with Me,’ Rev. 3:20. Christ complains of the Jews that they would not come to him that they might have life; but if any are made willing to come, the waters of life are open, and none that desire shall be denied them, Rev. 22:17, ‘Let him that is a thirst come, and whoever will, let him drink of the waters of life freely.’ Doest thou know Christ? Art thou acquainted with his kingdom as well as his priesthood? and art thou willing to have his kingdom set up in thy heart, and thy very thoughts and affections brought into obedience and captivity? Art thou willing thus to receive Him? Certainly thou shalt be received by Him and have power to become a child of God, Jn. 1:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day of Grace in which the Chief of Sinners may be Turned &amp; Healed</cite>, (London: Parkhurst, 1669), ‘The Day of Grace’ on Lk. 19:41-42, pp. 98-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

Books Online</a></div>
</figure><figure class="quote" id="q-12412e837b" data-kw="">
<blockquote><p>For if we give not entrance to Christ, all this will be a further aggravation of our damnation. How will this justify the sentence upon us hereafter, when Christ shall set us on the left hand (Mt. 25) and say: ‘Depart from Me [Mt. 7], for I invited you to come to Me, I knocked at the door of your hearts, and you would give Me no entrance. ‘Depart from us,’ said you; Therefore now depart you from Me.’ What do profane persons in the Church, but bid Christ depart from them, especially in the motions of his Spirit; they entertain Him in the outward room, the brain; they know a little of Christ, but in the heart, the secret room, He must not come there to rule. Is it not equal that He should bid us (Mt. 23:41), ‘Depart ye cursed I know you not? You would not give entrance to Me, I will not now to you.’ As to the foolish virgins He speaks and, Prov. 1:28, wisdom knocks and has no entrance, therefore in times of danger, they call upon her, but she rejoices at their destruction; Where God magnifies his mercy in this kind in sweet allurements and inviting by judgments, mercies, ministry and Spirit, He will magnify his judgment after. Those that have neglected Heaven with the prerogatives, and advantages in this kind, they shall be cast into Hell. ‘Woe to thee Chorazin,’ etc. as you know in the Gospel (Mt. 11:21). This is one thing that may humble us of this place and nation, that Christ has no further entrance, nor better entertainment after so long knocking? For the entertaining of his Word is the welcoming of Himself, as it is, Col. 3:16, ‘Let the word of God dwell plentifully in you,’ and ‘Let Christ dwell in your hearts by faith.’ Eph. 3:17. Compare those places, Let the Word dwell plenteously in you by wisdom, and let Christ dwell in your hearts by faith. For then does Christ dwell in the heart when the truth dwells in us. Therefore what entertainment we give to his truth, we give to Himself. Now what means of knocking has He not used among us a long time? For works of all sorts, He has drawn us by the cords of a man, by all kind of favors. For mercies, How many deliverances have we had (No nation the like; we are a miracle of the Christian world) from foreign invasion and domestical conspiracies at home? How many mercies do we enjoy? Abundance together with long peace, and plenty. Besides, if this would not do, God has added corrections with all these, in every element, in every manner, infection in the air, judgments in inundations; we have had rumors of wars, etc. threatenings, shakings of the rod only, but such as might have awaked us; And then He has knocked at our hearts by the example of other nations. By what He has done to them, He has showed us what He might justly have done to us; we are no better then they.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, (London: G.M., 1639) | 5th Sermon, pp. 153-55</span></figcaption>

ng has He not used among us a long time? For works of all sorts, He has drawn us by the cords of a man, by all kind of favors. For mercies, How many deliverances have we had (No nation the like; we are a miracle of the Christian world) from foreign invasion and domestical conspiracies at home? How many mercies do we enjoy? Abundance together with long peace, and plenty. Besides, if this would not do, God has added corrections with all these, in every element, in every manner, infection in the air, judgments in inundations; we have had rumors of wars, etc. threatenings, shakings of the rod only, but such as might have awaked us; And then He has knocked at our hearts by the example of other nations. By what He has done to them, He has showed us what He might justly have done to us; we are no better then they.”

— Richard Sibbes, Bowels Opened, or a Discovery of the Near &amp; Dear Love, Union &amp; Communion betwixt Christ &amp; the Church (London: G.M., 1639) | 5th Sermon, pp. 153-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+if+we+give+not+entrance+to+Christ%2C+all+this+will+be+a+further+aggravation+of+our+damnation.+How+will+this+justify+the+sentence+upon+us+hereafter%2C+when+Christ+shall+set+us+on+the+left+hand+%28Mt.+25%29+and+say%3A+%E2%80%98Depart+from+Me+%5BMt.+7%5D%2C+for+I+invited+you+to+come+to+Me%2C+I+knocked+at+the+door+of+your+hearts%2C+and+you+would+give+Me+no+entrance.+%E2%80%98Depart+from+us%2C%E2%80%99+said+you%3B+Therefore+now+depart+you+from+Me.%E2%80%99+What+do+profane+persons+in+the+Church%2C+but+bid+Christ+depart+from+them%2C+especially+in+the+motions+of+his+Spirit%3B+they+entertain+Him+in+the+outward+room%2C+the+brain%3B+they+know+a+little+of+Christ%2C+but+in+the+heart%2C+the+secret+room%2C+He+must+not+come+there+to+rule.+Is+it+not+equal+that+He+should+bid+us+%28Mt.+23%3A41%29%2C+%E2%80%98Depart+ye+cursed+I+know+you+not%3F+You+would+not+give+entrance+to+Me%2C+I+will+not+now+to+you.%E2%80%99+As+to+the+foolish+virgins+He+speaks+and%2C+Prov.+1%3A28%2C+wisdom+knocks+and+has+no+entrance%2C+therefore+in+times+of+danger%2C+they+call+upon+her%2C+but+she+rejoices+at+their+destruction%3B+Where+God+magnifies+his+mercy+in+this+kind+in+sweet+allurements+and+inviting+by+judgments%2C+mercies%2C+ministry+and+Spirit%2C+He+will+magnify+his+judgment+after.+Those+that+have+neglected+Heaven+with+the+prerogatives%2C+and+advantages+in+this+kind%2C+they+shall+be+cast+into+Hell.+%E2%80%98Woe+to+thee+Chorazin%2C%E2%80%99+etc.+as+you+know+in+the+Gospel+%28Mt.+11%3A21%29.+This+is+one+thing+that+may+humble+us+of+this+place+and+nation%2C+that+Christ+has+no+further+entrance%2C+nor+better+entertainment+after+so+long+knocking%3F+For+the+entertaining+of+his+Word+is+the+welcoming+of+Himself%2C+as+it+is%2C+Col.+3%3A16%2C+%E2%80%98Let+the+word+of+G

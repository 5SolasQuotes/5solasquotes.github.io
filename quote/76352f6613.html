<blockquote><p>Vers. 1. Now of the things which we have spoken, this is the sum: we have such an High-priest, who is set on the right hand of the Throne of the Majesty in the heavens.

Arg. 1. Christ our High-priest is such, and of so great dignity, that he sits King at the right hand of the Throne of the Majesty of God the Father in the heavens, equal to the Father in power and glory; He leaves us the other part of the Comparison, as sufficiently clear, concerning the Levitical Priest, that he is not such an one: Therefore the Priest-hood of Christ is more excellent than the Levitical.

Vers. 2. A Minister of the Sanctuary, and of the true Tabernacle, which the Lord pitched, and not man.

Arg. 2. Christ is the Minister of that Sanctuary in the heavens, where he sits King in his Throne, and all holy things which appertain to the worship of God, and the salvation of man, not faintly, but effectually acting the part of a Priest in Heaven, although he is a Royal Priest as to the dignity of his Person, and the manner of his Administration, yet as a Minister as pertaining to his Mediatory Office: Such are not the Levitical Priests on earth, but only Ministers: Therefore the Priest-hood of Christ is more excellent than the Levitical.

Of the true Tabernacle] Arg. 3. Christ is in heaven the Minister of that true Tabernacle which the Lord hath pitched, and not man, viz. of his body (which Christ himself compared to a Tabernacle) and is figured by the typical Tabernacle: which true Tabernacle of his body, the Holy Ghost miraculously formed and prepared for him in the womb of the Virgin: And Christ now ministering in Heaven, represents that body to the Father; and his Humanity wherein he suffered, and offers to him continually interceding for us in the same body. But the Levitical Priests are only Ministers of the typical Tabernacle which man hath built: Therefore, &amp;c.

Vers. 3. For every High-priest is ordained to offer gifts and sacrifices; wherefore it is of necessity that this man have somewhat also to offer.

He proves that Christ doth constantly offer up the true Tabernacle of his body to God the Father, by three Reasons:

Reas. 1. Because seeing that every Priest is ordained to offer up gifts and sacrifices, it is necessary that Christ have somewhat to offer; But besides his intercession, and the presenting of his sacrificed body to the Father, Christ hath nothing in Heaven which may reconcile God: Therefore the true Tabernacle of his body is that only which Christ offers to God in the Celestial Sanctuary.

Vers. 4. For if he were on earth, he should not be a Priest, seeing that there are Priests that offer gifts according to the Law:

Reas. 2. Because if he was on earth, he could not be a Priest by the Law, to offer, to wit, those things which the Law prescribes to the Priests, viz. Gifts, and typical Sacrifices: Therefore that true Tabernacle of his body only remains, which Christ offers in his heavenly Sanctuary.

Vers. 5. Who serve unto the example and shadow of heavenly things, as Moses was admonished of God, when he was about to make the Tabernacle. For see (saith he) that thou make all things according to the pattern shewed to thee in the Mount.

Reas. 3. Confirming the former, because Priests according to the Law, serve on earth, only unto the example and shadow of heavenly things, for their Ministry was bound to the Tabernacle, or the Temple of Jerusalem, and is employed in the administration of figures and typical Ceremonies, as it appears by the Levitical Law:

Therefore Christ, seeing he cannot offer up any typical Sacrifices by the Law, and if he was upon earth, neither could he bee a Priest by the Law, and seeing now he is in heaven, and therein exercises his Priest-hood, it is necessary that he administer about those heavenly things, figured by those Legal shadows, to wit, the body and substance of all Ceremonies, which he also doth, representing constantly the true Tabernacle of his body unto God, and dispensing unto us spiritual benefits procured for us, by the offering of his body. The testimony proving the former is Exod. 25.40. from whence under the name of a Tabernacle, God will not only have the Tabernacle, but all things appertaining to the Levitical Priest-hood, to be representations of heavenly things, viz. Of Christs Priest-hood, and his benefits.</p></blockquote>

<blockquote><p>In the point of excellency, no other form of psalmody can bear a comparison with the songs of inspiration. Imperfection is stamped upon all the works of man; the most highly finished pieces of sacred poetry frequently discover weakness of sentiment, or are marred by improper figures and allusion. Of the Psalms alone, it can be truly declared that they are perfect. The Holy Spirit has transcribed his own character of purity, wisdom and love, in these unrivalled compositions. This excellence they claim above every rival, that, as the words of God, they are of tried power to enlighten the mind, purify the affections, subjugate the will, and transform the whole inner man. It accords with the experience of the saints in every age to believe that the Spirit’s hallowed influences descend most copiously upon his own words: the most sensible relief, encouraging counsel, and abounding comfort are experienced in calling them to remembrance, and by faith applying them. As the design of singing praise is evidently to elevate the affections, and to excite the hope and peace and joy, the believer has reason to expect that, in using the inspired Psalms, which are the immediate productions of the Holy Spirit, these spiritual emotions will be awakened, and the enjoyment of their appropriate objects realized; the same confidence, in an equal measure, he has no ground to entertain from the use of uninspired psalmody.</p></blockquote>

<blockquote><p>This thesis will examine the literary evidence of the cultural significance of head-coverings, particularly with reference to the Corinthian congregation addressed by Paul in 1 Cor. 11:2-16. There are two main objectives of the thesis: to produce a coherent interpretation of 1 Cor. 11:2-16 and to establish Paul’s view of gender in the text. …The first part investigates the significance of ‘the veil’ for the ancient Greeks and Romans respectively and compares certain aspects of gender in Greco-Roman culture and the letters of Paul… Paul’s view of gender in the text shows a degree of consistency with the culture…</p></blockquote>

<blockquote><p>Objection [of opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side, nor for the other, what rulers think good, is to be followed, there being no evil nor impiety in that which they command. Answer 1: This is to make rulers in matters of salvation liable to the Scriptures of God; but in matters which men call indifferent to make them Popes, and to hang our consciences upon their sleeve, which is most absurd:

1. Because Paul in matters most indifferent, of days and meats, would not have the Romans to hang upon his judgment, but will rule both their practice and his own by the Law of nature: ‘Murder not,’ ‘Scandalize not.’

2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if in matters that they call of salvation, not thoughts, but the Word of God should rule and square canon-makers, but in matters indifferent, their thoughts should be a law.

3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is conventent in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters, which they call fundamental; yea, the Scripture shall be imperfect in the duties of the Second Table, if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship.</p></blockquote>

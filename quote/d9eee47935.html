<main class="wrap"><figure class="quote" id="q-d9eee47935" data-kw="">
<blockquote><p>2. God’s gracious invitation of lost sinners to Christ, which properly is his calling them, is either external or internal; external by the word, internal by his Spirit. [1.] External, by the commands and promises of the word, requiring such duties from them, and assuring them of such blessings upon obedience. Thus Wisdom’s maidens are sent forth to invite guests to her palace, Prov. 4:2; and the king’s servants to call them to the marriage-feast, Matt 22:9; and so far they prevail in their message, that many present themselves. God would not leave us to a book, but has appointed a living ministry, 2 Cor. 6:10. [2.] Internal, not only by the word, but by his Spirit, and the checks of their own conscience, which is a nearer approach of his grace and power to us. By the motions of his Spirit; how else could it be said, Gen. 6:3, ‘My Spirit shall not always strive with man’? and Acts 7:51, ‘Ye do always resist the Holy Ghost’? And also by their consciences soliciting them to the performance of their duty, and challenging them for the neglect of it. It is natural duty: Rom. 2:14,15, ‘The Gentiles do by nature the things contained in the law; these, having not the law, are a law to themselves, which show the works of the law written in their hearts; their consciences also bearing witness, and their thoughts in the meanwhile accusing or excusing one another.’ And for acceptance of the gospel-covenant: 1 John 3:20,21, ‘If our heart condemn us, God is greater than our heart and knows all things; if our heart condemn us not, then have we confidence towards God.’ 3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works (d. 1677; London: J. Nisbet, 1870), vol. 12, Sermons Upon Romans 8, Sermon 8</cite>, p. 288</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85efbc18ea" data-kw="">
<blockquote><p>Q. 1. What makes the difference between effectual and ineffectual calling? A. Ineffectual calling is when men have nothing but the external sound of the Gospel. Mt. 20:16, ‘For many be called, and few chosen.’ Effectual is, when the Spirit works in conjunction with the Word. Jn. 6:45: ‘It is written in the prophets, ‘And they shall be all taught of God;’ every man therefore that has heard, and has learned of the Father, comes unto Me.’ … Q. 11. What is the third instruction? A. It is dangerous to refuse God’s call. Prov. 1:24, ‘Because I have called, and ye refused; I have stretched out my hand and no man regarded.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the [Westminster] Assembly’s Catechism... (London: Cockerill, 1682), ‘Of Effectual Calling’</cite>, pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-099f204dae" data-kw="">
<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>

</figure><figure class="quote" id="q-199882bcc3" data-kw="faith response to call">
<blockquote><p>For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise. The Scriptures often introduce this colloquy: “I will say, It is my people; and they shall say, The Lord is my God” (Hos. 2:23; Zech. 13:9; cf. Ps. 27:8; Jer. 3:22; Rom. 8:15, 16).</p></blockquote>

<blockquote><p>The promise of the gospel is that whosoever believes in Christ crucified shall not perish, but have eternal life. This promise, together with the command to repent and believe, ought to be declared and published to all nations, and to all persons promiscuously and without distinction, to whom God out of His good pleasure sends the gospel.</p></blockquote>

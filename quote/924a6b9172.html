<main class="wrap"><figure class="quote" id="q-924a6b9172" data-kw="">
<blockquote><p>Those who go to their shops and exercise their trades openly or secretly on the Lord’s Day, thereby show that they mind the world more than God, and that they are more solicitous for the meat that perishes, than for that which endures to eternal life; and those who go to the ale-house, or follow their sports, and divert themselves or others with idle walking and talking, show that they mind the flesh more than God, and that they are wholly taken up with the mere animal life, and wretchedly estranged from the principles, powers, and pleasures of the spiritual and divine life.

If any pretend that they can perform the work of the Lord’s Day well enough, though they do not observe the rest of the day, they suppose themselves wiser than God, who has instituted the Sabbath rest in order to the better and more solemn management of the Sabbath work, both public and private.

We find now who are chargeable with the sin of profaning the Lord’s Day; let the conscience of everyone that is guilty herein deal faithfully with him in the reading of this, and say, “Thou art the man” (2 Samuel 12:7); thou art the man, the woman, that makest the Day of the Lord either a day of idleness, or a day of worldly business, and dost not spend it in the service of God and communion with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath: A Serious Address to those that Profane the Lord’s Day</cite>, (1713; Grand Rapids MI: Torwood Press, 2013), p. 8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10c5bf7df6" data-kw="">
<blockquote><p>Obs. IV. That our utmost care and diligence in the consideration of the mind of God are required in all that we do about his worship.—There is nothing wherein men for the most part are more careless. Some suppose it belongs unto their own wisdom to order things in the worship of God as it seems most meet unto them;—an apprehension that I shall leave this world in admiration of, that ever it should befall the minds of so many good and honest men as it hath done. But the power of prejudice is inexpressible. Some think they are no further concerned in these things than only to follow the traditions of their fathers. This unto the community of Christians is the only rule of divine worship. To suppose that it is their duty to inquire into the way and manner of the worship of God, the grounds and reasons of what they practise therein, is most remote from them. ‘It was Moses that had the command to take care about the making of the tabernacle, and not the people. There was nothing left unto them but to do and observe what he had appointed.’ And it is true; when God first reveals the way of his worship immediately from himself, as he did first by Moses, and last of all by his Son Jesus Christ, the people have nothing to do therewith, but only to observe and do what is appointed, as our Saviour expressly declares, Matt. 28:20: but when his worship is so revealed and declared, there is not the meanest person, who professeth obedience unto him, who is exempted from this command of taking most diligent care about the due discharge of his duty herein. And this care and diligence are necessary,—</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 42–43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Question: Why, but do you think it simply unlawful to play for money? Answer: Surely no. For when either so litle is played as no way inables me to any duty of my calling, or the money (not much) is bestowed in some meeting, for the increase of love, or that which is won is a reward appointed to that exercise, then think I, with others, that it is lawful.</p></blockquote>

<blockquote><p>Mercy and truth are met together, righteousness and peace have kissed each other. When God made heaven and earth out of nothing, he made them by a word, without any other ceremony; but, when he made man, there was some particular solemnity, a grand council, as it were, of the glorious Trinity called; Come, let us make man after our image. But now man having unmade himself, if God hath a mind for the praise of his own glorious grace to make him up again, by a new creation in Christ Jesus, there must be a more glorious solemnity yet; not only a council of the adorable Trinity, but a grand meeting of all the attributes of God, to consult their own glory that was marred, and reconcile their own interests, and seemingly contradictory claims:

For the sin of man had brought real confusion among all the creatures of God on earth, yea, and seeming war among all the attributes of God in heaven, concerning the execution of the sentence of the law upon mankind, the transgressor thereof; some of these attributes, such as Mercy, saying, if the sentence of death be executed upon them, how shall I be glorified? Others, such as Truth, saying, if the sentence be not executed, how shall I be glorified? Is it to be expected that such opposites can meet together? Or, if they meet, that they will agree together cordially? Yea, tho’ it be beyond the expectation of men and angels, yet behold, it is here celebrated with a song? Mercy and truth are met together, righteousness and peace have kissed each other. …

But now, if we would know what sort of glory it is that appears when Christ is revealed, why it is even the glorious harmony of all the divine attributes illustriously shining in him, who is both our salvation and our glory; Mercy and truth are met together; righteousness and peace have kissed each other. Now, tho’ these words may be applied to the happy meeting of graces in men, upon the revelation of Christ in the soul, which I may afterwards observe in the sequel, and in which sense some interpreters understand it, yet I take it mainly to import the happy meeting of perfections in God to be glorified in the sinner’s salvation by Jesus Christ, which is a gloss that no interpreter I have had occasion to consult does neglect or omit; and, if any of them should miss it, I think they would miss the very ground-work and foundation of all other happy meetings: Mercy and truth are met together, righteousness and peace have kissed each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper</cite>, (1723; Boston: S. Kneeland and T. Green, 1748), pp 4, 5-6.</span></figcaption>

E2%80%A6%0A%0ABut+now%2C+if+we+would+know+what+sort+of+glory+it+is+that+appears+when+Christ+is+revealed%2C+why+it+is+even+the+glorious+harmony+of+all+the+divine+attributes+illustriously+shining+in+him%2C+who+is+both+our+salvation+and+our+glory%3B+Mercy+and+truth+are+met+together%3B+righteousness+and+peace+have+kissed+each+other.+Now%2C+tho%E2%80%99+these+words+may+be+applied+to+the+happy+meeting+of+graces+in+men%2C+upon+the+revelation+of+Christ+in+the+soul%2C+which+I+may+afterwards+observe+in+the+sequel%2C+and+in+which+sense+some+interpreters+understand+it%2C+yet+I+take+it+mainly+to+import+the+happy+meeting+of+perfections+in+God+to+be+glorified+in+the+sinner%E2%80%99s+salvation+by+Jesus+Christ%2C+which+is+a+gloss+that+no+interpreter+I+have+had+occasion+to+consult+does+neglect+or+omit%3B+and%2C+if+any+of+them+should+miss+it%2C+I+think+they+would+miss+the+very+ground-work+and+foundation+of+all+other+happy+meetings%3A+Mercy+and+truth+are+met+together%2C+righteousness+and+peace+have+kissed+each+other.%E2%80%9D%0A%0A%E2%80%94+Ralph+Erskine%2C+The+harmony+of+the+divine+attributes+displayed%3B+in+the+redemption+%26+salvation+of+sinners+by+Jesus+Christ.+Being+a+sermon+preached+at+Dunfermline+on+the+20th+of+September+1723%3B+immediately+after+the+celebration+of+the+Lord%E2%80%99s+Supper%2C+%281723%3B+Boston%3A+S.+Kneeland+and+T.+Green%2C+1748%29%2C+pp+4%2C+5-6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F265e68f485.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/265e68f485.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/18/ralph-erskine-on-mercy-and-truth-meeting-each-other/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>All delight arising from suitableness between the mind and the object; a mind that is truly great cannot please it self in these low things that others do: To eat and drink, gather riches, build houses, and delight themselves in these contentments of the flesh. As Sueton reports of Domitian: Who had the great affaires of the Empire to busy himself in; yet he did constantly spend some time every day in catching of flies:

But a truly noble spirit is with David considering how he may lay out himself in some great service for the glory of God, the advancement of his Ordinances, and the enlargement of the Kingdom of his dear Son. As for other things he looks upon Them as beneath him, As Themistocles after a great victory won against the Persians, walked up and down among the slain, and saw here &amp; there some great &amp; rich spoils, which he disdained to stoop for, but said to one that stood by him, Tolle haec, tu qui Themistocles non es. Let such take care of these things that have spirits fit for no higher things.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-085c832adc" data-kw="">
<blockquote><p>Nor do I wish the philosophical‑theological exercises to be omitted or neglected by those approaching theology. For although philosophy is often abused — from which the Apostle found it necessary to warn us: “See that no one takes you captive through philosophy and empty deceit” (Col. 2:8) — yet both the ancients and the moderns, by their example and use, have shown that its right use is of great help, not only in all other sciences, arts, and the whole life of man, but also in theological doctrine.

Here, as in all things, there are limits, beyond which or short of which it is not right to stand. He who measures matters of faith by the principles of philosophy, who thinks its rules hold in theology as in nature, or who uses its acuteness, subtleties, and distinctions for barren and cold speculation, for contention and vain glory — such a man, by understanding, comes to understand nothing. Meanwhile, he who does not think the mind ought to be adorned by philosophy as the tongue is by literature, who does not wish the inner speech of the mind, as well as the outward speech of the mouth, to be directed and polished by art, or who thinks something sounds ill merely because it comes from philosophy — such a man seems to me no less in error.

For although philosophy does not have the same rule, dignity, or necessity as theology, yet in forming and expressing concepts, in penetrating the subtleties of things and questions, in refuting the evasions of adversaries, it greatly helps not to be entirely without it. We require a moderate use of philosophy in theological matters; we entirely forbid its dominion.

Luther said aptly in his Disputation on the Simplicity of God and the Trinity of Persons: “When dialectic argues that something does not square with its rules, we must say to it, ‘Let the woman keep silence in the Church.’” The Fathers use a similar image of Hagar the handmaid, who is commanded to be cast out of the house when she behaves too wantonly and wishes to rule her mistress at her own pleasure.

When philosophy rises too imperiously against theology, seeks a dictatorship, or tries to confine the most august truth within its own bars and rules, it must be expelled; and where it tends toward contention, it must be modestly avoided. For truth, wherever it is, has this first: that it is chaste; then that it is peaceable (James 3:17). But that which has bitter zeal and strife may be called “wisdom,” but it is earthly, sensual, and demonic, says the Apostle.</p></blockquote>

<blockquote><p>But you may say that there were musical instruments in the Old Testament, as well as vocal song. Therefore, why does the Church dismiss those but accept these? A twofold mystical meaning is given, because they were figurative. According to this, the reason is that God is praised by mind and voice but not by instruments. Another reason comes from the words of the Philosopher [Aristotle], who said that it is against wisdom that men be instructed in lyric songs and music, since they would occupy their souls in these works, but there should be simple music so that they may be drawn from bodily things and brought to the divine praises.” (On Ps. 32, sect. 308) Beza, at some length, debating with Jacob Andreae (a leading Lutheran theologian), held instruments, as used by the churches in worship, to be essentially indifferent, some of the reformed finding them profitable (and using them), and some not finding them so (and not using them). (Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586, Concordia, 2017, pp. 458, 464, 479-83, 493-95) Leigh, after referencing certain reformed divines and numerous of their arguments for musical instruments in worship, says, “Not only Dr. Ames opposes it, but Aquinas, Rivet, Zanchius, Zepperus, Altingius and others’ dislike of organs and such like music in churches, and they do generally rather hinder edification.” (System of Divinity, p. 610) Ames: “Thomas Aquinas… opposes thus: ‘The Church uses no [instruments of] music for divine praises, lest it should seem to Judaize,’ and answers thus: ‘Musical instruments do more stir up the mind to delight than frame it to a right disposition. In the Old Testament there was some need of them, both, etc. and also because they did figure [signify] out something.&#x27;” (Fresh Suit, p. 405) For more of the Reformed: ‘Musical Instruments in Worship’. . Images Agreements Nature of Idolatry Owen, speaking of idolatry: “We know it to be… ‘Any religious worship of that which by nature is not God;’ and so does your Thomas grant it to be.” (14:216; Turretin, Institutes 2.44) Rutherford, in examining the nature of idolatry, approves of Thomas teaching that “the heathen acknowledged a Godhead to dwell in the images.” (Divine Right, ch. 1, question 5, p. 152) . Disagreements Images of God &amp; Christ are Not to be Made Thomas: “…images of the Trinity and of Christ should be worshiped with the same adoration with which the prototypes are worshiped…” (Summa, pt. 3, q. 25, art. 3) Vermigli: “And Thomas Aquinas is also to be wondered at, who says that God forbade the Jews that they should not make images, because at that time the Word had not taken upon it the nature of man. What is this to the purpose; seeing we speak at this present of the images and pictures of the very nature of God, which by art, colors and lineaments cannot be described? Wherefore there is all one reason, as well of the old Hebrews as of the Christians…” (Common Places, pt. 2, ch. 5, p. 340) For more of the Reformed: ‘Images of God are Forbidden’ ‘Images of Christ’ . Divine Worship Not to be Given to Images Turretin denies Thomas (Summa, pt. 3, q. 25, art. 4) on giving the worship of latria (divine worship) to the cross itself (2:53), saying “the orthodox impugn it.</p></blockquote>

<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10).

2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6).

3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment.

4. No glory to God could arise from this but rather the dishonor of a tyrannical lord.

5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing.

2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself.

3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such.

4. We are permitted to kill innocent creatures. Reply.

1. Not rational ones.

2. Irrational ones (bruta) for our use (2 Pet. 2:12).

3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10).

2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6).

3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment.

4. No glory to God could arise from this but rather the dishonor of a tyrannical lord.

5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing.

2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself.

3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such.

4. We are permitted to kill innocent creatures. Reply.

1. Not rational ones.

2. Irrational ones (bruta) for our use (2 Pet. 2:12).

3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.”

— Leonard Riissen, A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, pp. 84-85, 112-13, 121-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CControversy+%E2%80%93+Is+God+able+not+only+to+deprive+an+innocent+creature+of+life+but+also+to+condemn+them+to+the+eternal+tortures+of+hell%3F+We+deny+against+certain+Scholastics.+Arguments+1.+All+the+ways+of+God+should+be+mercy+and+truth+to+those+who+keep+covenant+%28Ps.+25%3A10%29.+2.+Anyone+approaching+God+should+believe+that+He+will+reward+their+obedience+with+a+reward+not+condemn+them+%28Heb.+11%3A6%29.+3.+In+an+innocent+creature+there+can+be+no+consciousness+of+guilt+or+the+just+judgment+of+God%2C+which+is+the+meaning+of+punishment.+4.+No+glory+to+God+could+arise+from+this+but+rather+the+dishonor+of+a+tyrannical+lord.+5.+The+righteousness+of+God+demands+that+He+acquit+the+holy%2C+but+it+does+not+permit+him+to+condemn+someone+who+has+not+merited+it+%28Ps.+18%3A26-27%2C+Gen.+18%3A25%2C+Ps.+7%3A11%29.+Objections+1.+He+can+reduce+the+innocent+to+nothing.+Reply.+Then+he+only+takes+away+what+He+gave%2C+but+punishment+would+be+to+do+injury+to+someone+while+existing.+2.+He+acts+this+way+with+Christ.+Reply.+He+was+our+surety%2C+who+took+our+debts+on+Himself.+3.+God+can+impute+to+us+the+sin+of+Adam.+Reply.+That+is+imputed+to+be+ours+which+is+truly+ours+just+as+the+children+of+slaves+are+slaves+and+the+sons+of+citizens+are+citizens+and+are+reputed+to+be+such.+4.+We+are+permitted+to+kill+innocent+creatures.+Reply.+1.+Not+rational+ones.+2.+Irrational+ones+%28bruta%29+for+our+use+%282+Pet.+2%3A12%29.+3.+It+is+one+thing+to+kill%2C+another+to+give+to+the+living+the+highest+punishment+according+to+one%E2%80%99s+pleasure.%E2%80%9D%0A%0A%E2%80%94+Leonard+Riissen%2C+A+Complete+Summary+of+Elenctic+Theology+%26+of+as+Much+Didactic+Theology+as+is+Necessary%2C+trans.+J.+Wesley+White+MTh+thesis+%28 <blockquote><p>7. In Corollary 1 I had said that the opinion of Taurellus and Gorlaeus about man as a being per accidens stumbles in many ways. The argument by which they are moved is such. Two beings or complete substances make one per accidens and not per se: but the body and soul of man are two complete substances. Therefore. I respond: The major is not universally true; and the minor is denied. That in the presence of the disputation itself it may be aired to many and to the end, we now cursorily indicate these hypotheses:

I. That man is a species of substance and animal created into one essence or nature from soul and body, we think is implied in Gen. 3:7, 1 Cor. 15:45, compared with Gen. 1:26-27.

II. Christ-Theanthropos [God-man] (in whom there are two natures or complete substances) is one per se and not per accidens: for the union of natures was made into one suppositum, [Greek]. See the theologians on the person of Christ: Much more therefore substantially and per se the union was made between the soul and body of man, which indeed are not so far distant, nor are they such complete substances as divinity and humanity.

III. The true human nature of Christ would not be more one substance through itself than in the death of the same … [These articles are about Christ, man, the soul and angels] …

IX. This opinion even impinges on many metaphysical dogmas… …

      5. That man is not a substance nor does he directly pertain to the predication of substance: but only indirectly, and per accidens is referred to it, since he is a being per accidens and collective.

      6. That one man is no more one per se, than an army, a city, etc. where there are many men collectively.

      7. That consequently man cannot be defined by an essential and perfect definition.

      8. That the matter and form of a composite are properly matter, and its form is the union, that is an accident, or pure mode, namely a relation. See Gorlaeus, Exercit. 14, p. 266.

      9. That the union of the human soul with its body is to be sought in some mere accident from those five, and indeed in position or posture: as some seem to concede.

      10. That the body is not the nature of man, but only his instrument, through which the soul existing in the body operates.</p></blockquote>

<blockquote><p>The systems for mechanization of brain function that were introduced by Descartes, Leibniz, Spinoza and Willis in the 17th century have served well for the design and development of the measurement systems and tools providing new data, but the machine metaphors of computation, representation, and information processing are incompatible with these data… The philosophical system that most clearly and unequivocally conforms to this experimental finding is that of Thomas Aquinas.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-552156c1a1" data-kw="">
<blockquote><p>The Holy Spirit repudiates this question, Rom. 6:14 to the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>V. “Whether reigning sin may occur in the regenerate?”</cite>, [No] in Johannes Maccovius Revived, or Manuscripts of his… ed. Nicolaas Arnoldi (Amsterdam, 1659), Anti-Eckhardus, ch. 10, Of Sin, p. 657</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Holy Spirit repudiates this question, Rom. 6:14 to the end.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ea1d869d0" data-kw="">
<blockquote><p>3… Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this [faith] man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colloquy-of-regensburg.html">Colloquy of Regensburg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anthony Lane, Justification by Faith in Catholic-Protestant Dialogue. An Evangelical Assessment</cite>, tr. Anthony Lane (London: 2002), Appendix 1, pp. 233-34 This statement was affirmed by both the Reformed and Romanist sides.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

tion%20of%20righteousness%20and%20countless%20other%20gifts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7eb7a116a2" data-kw="">
<blockquote><p>…in which the Father has promised that He wishes to forgive, that for Christ’s sake He wishes to be reconciled. This promise, however, is received by faith alone, as Paul testifies, Rom. 4:13. This faith alone receives remission of sins, justifies and regenerates. Then love and other good fruits follow.</p></blockquote>

</figure><figure class="quote" id="q-8b63e4de11" data-kw="">
<blockquote><p>Faith puts us into Christ, and our title to the crown comes in by Christ. By faith we are born of God, and so we become children of the blood-royal. By faith our hearts are purified, Acts 15:9, and so we are made fit for a Kingdom…</p></blockquote>

</figure><figure class="quote" id="q-5a847d7410" data-kw="">
<blockquote><p>So here (if it may be lawful to conjecture the like) the laver is left uncovered and always open to the eyes of the people, that it might be a lively representation of God’s grace in Christ, continuing and opened as an ever-springing fountain: that by the washing of the new birth, by repentance and faith in the blood of Christ, we may in all our travels, at all times, cleanse our hands and feet (our works and ways) as the sacrificers did from the laver, Ex. 30:19-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Five Books of Moses</cite>, … (d. 1622; London: Bellamie, 1627), on Numbers, ch. 4, v. 14., p. 22</span></figcaption>

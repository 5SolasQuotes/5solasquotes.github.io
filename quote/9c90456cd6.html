<blockquote><p>The fourth argument is derived, not only from the construction of the human body, admired by every one, though enough by no one, but also from our soul; for it is either eternal, or produced out of matter, or created by some other Being; no one will now say that it is eternal. To say that it is produced from matter is most absurd; for the effect is not more noble than its cause, and who can believe that out of matter, which is extended, gross, and inanimate, there could have been produced a spiritual and thinking essence, one of so excellent a nature, that it comprehends the whole universe in its thoughts, beholds the present, remembers the past, and looks forward to the future: — one, which invents and cultivates so many arts, performs so many wonderful things; which, not content with this world and sublunary objects, aspires to God and to eternity, and runs through heaven, and earth, and the seas, although lying concealed in a single corner of the world.

Such an essence then must have an author; but who it is, if it is not God, no one can point out. Add to this the wonderful union of the soul with the body, which union is so close and intimate, that certain motions take place in the body, in obedience to certain thoughts of the soul; and, on the contrary, some thoughts take place in the soul, in compliance with some motions of the body, although the soul is ignorant in what way the members are set in motion according to its will, and how it is that at the motion of these members various thoughts are raised within it.

The fifth argument is taken from the agreement of almost all nations, even the most barbarous, upon this subject. For how is it that men of almost every country in the earth, differing in education, customs, manners, and habits, believe in any thing as a God, rather than believe in no God? and that the proudest of mankind had rather bow down to wood and stone, than be without any deity at all? ‘What nation is there,’ says Cicero, ‘or what race of men, which has not, without any previous instruction, some idea of the gods? Now that in which all men agree must necessarily be true.’ ‘If you go through the earth,’ says Plutarch, ‘you will perhaps observe cities without walls, without letters, sunk in the greatest ignorance; but we shall see not one which does not worship the Deity. But even if, as some assert, there are some nations to be found, among whom no traces of religion are discovered, it ought not to seem strange that barbarians, who have in some measure thrown aside the human nature, and assumed a kind of brutal wildness, have lost that which is peculiar to man. Without understanding, there is no notion of a Deity, and no sense of religion, and therefore these cannot apply to the brutes, and consequently not to those who have almost degenerated into brutes.’

The last argument may be sought from the power of conscience, which is the inseparable attendant on crime that has been, or is about to be, committed, and the feeling of which cannot be blunted, nor its judgment be avoided, nor its accusation eluded, nor its testimony corrupted, nor its bail deserted , nothing being more tenacious than its grasp, nothing more bitter than its torment. Whence is it that conscience is stung when a crime is committed, even though no witnesses are present, and no danger threatens from others? Silence is it that the transgressor secretly trembles at his guilt, and is afraid even of the most trifling noise?

Nor is there any exception to this fact in the case of those who acknowledged no superior on earth, and to whom their subjects did not blush to offer incense as unto gods. Caligula, for example — who, although no one is said to have carried his contempt of Deity further than he did, yet trembled exceedingly when he heard the noise of thunder. Whence all this, I ask, but from the consciousness of there being some Judge, whom the offender, although he sees him not, yet every where dreads? We wave other arguments, which might be added: I shall only subjoin this remark, that, while the atheistical doctrine gives a license to every crime, the opposite doctrine influences men to the practice of every Christian and moral virtue.</p></blockquote>

<blockquote><p>But the errors of philosophers are not the dictates of philosophy, any more than the mistakes of artificers are to be imputed to the art itself. ‘Philosophy,’ says Clement of Alexandria, ‘is not to be called Stoic, nor Platonic, nor Epicurean, nor Aristotelian, but whatever has been properly spoken by these sects–this, gathered into one whole, is to be called philosophy’ (Stromata 1.7 [ANF 2:308; PG 8.731]).</p></blockquote>

</figure><figure class="quote" id="q-d3ac0acce9" data-kw="">
<blockquote><p>This way of proceeding [in metaphysics] from what is simply posterior, namely from real being as we experience it, namely as contingent, caused, transient, etc. to things that are necessarily required as conditions sine qua non of its existence, can be called a sort of metaphysical reduction. It is called ‘reduction’ because the mind is as it were led back from the data of immediate experience to the conditions and hidden causes on which they depend. ‘Metaphysical’ is added because this reduction seems to differ from the reduction that the natural sciences use. For a reduction is found in these [sciences] too, namely to theories and hypotheses from which, as from conjectured conditions and causes, the effects that are empirically observed can follow. This method of the natural sciences, which is called hypothetico-deductive insofar as it regards the verification of theories, is also called ‘inventive induction’ insofar as the cultivators of the sciences create a certain theoretical law or explanation from their own mental fertility. But none of their theories is so certain that no other theory or hypothesis can be thought up, and so all such theories, although they are often not far distant from at least a practical certainty, do not go beyond probability. In metaphysics, on the contrary, when once it is conceded, for example, that some finite being is not sufficient to itself for its existence but requires some explanation outside itself, then it follows that no other theoretical explanation can be found save in something non-finite. Likewise, a caused being can be explained only by an uncaused being, a transient being by something permanent, a contingent being by something necessary, and so on through the other disjunctive attributes that are contradictorily opposed with respect to being. For although ‘caused being’ and ‘uncaused being’ are not contradictories (for there could be a third between them, namely ‘non-being’), nevertheless ‘caused’ and ‘uncaused’ are mutually contradictory in respect of the same subject, just as ‘white’ and ‘non-white’ are mutually contradictory in respect of the same man. Hence to deny that all beings are caused is the same as to assert that some being is uncaused. And in this sense there is given by metaphysical reduction not just one theory among many possible explanations, as is the case with the natural sciences, but rather, once the necessity is conceded for some explanation of the existence of observed things in something other than themselves, metaphysical reduction gives, by virtue of the law of contradiction and excluded middle, only one possible theoretical solution. And in this sense metaphysical conclusions exceed the probability found in the theories of the natural sciences. So the certitude that the metaphysician can have seems to be the highest that the human intellect can naturally achieve in any theoretical science about real [i.e. non-mental] things.</p></blockquote>

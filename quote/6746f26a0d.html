<blockquote><p>Three things about the worship of God are to be considered:

1. The kinds of it…

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>…for when the Word determines not, conscience (though misinformed) casts the balance to the side which it judges to be necessary; As for instance, if a man think it a sin to hear the Word with the head uncovered, he is oblidged to cover his head, and contrarily; For conscience there casts the balance: but when the thing is unlawful on the matter, it may bind him up, while it remains in an error, so as he cannot without sin counteract its dictate; but it never oblidges him to sin.</p></blockquote>

<blockquote><p>As penitent sinners of various kinds were ordered to sit in the church ”bare-heidit all the tyme of the sermons,’¹ it would appear that the members of the congregation kept their hats on during that time. This is also implied by Knox’s statement that the Earl of Huntly pulled down his bonnet over his eyes when the preacher denounced certain vices.² In 1637, George Gillespie says: ‘A man coming into one of our churches in time of public worship, if he see the hearers covered, he knows, by this customable sign, that sermon is begun.”‘³ Thomas Kirk, an Englishman, who visited Dundee in 1677, says: “We heard a sermon at the greatest church; they first sing a psalm, and then the minister begins his prayer, and as soon as he has taken his text they all put on their hats.’† By the beginning of the eighteenth century many Scottish Presbyterians uncovered their heads during sermon.° The custom survived in the Scottish Church at Rotterdam until at least the last quarter of the nineteenth century. At one time the ministers of Scotland may have kept their hats on while preaching, as French and Dutch Protestant preachers did.ª ¹ Booke of the Universall Kirk, 2:692. ² Laing’s Knox, 2:362. ³ Dispute Against the English-Popish Ceremonies, 1637, part 3, p. 86. † Kirk and Thoresby’s Tours in Scotland, p. 19. — In England, during part of the seventeenth century, it was customary for the people to sit in church with their hats on, and to take them off when they sang the Psalms (Brand’s Popular Antiquities, Bohn’s ed., 2:323). Some lifted them at the name of Jesus [according to the Anglican custom] (Marsden’s Early Puritans, 1853, p. 347). ° An Examination of Three Prelatical Pamphlets, 1703, p. 18. ª “He [i.e. Alix] was bold and brisk in the pulpit, and when he read his text, he cocked his hatt; but Claud, when he put on his hat, slipped it on, and drew down the sides of it” (Wodrow’s Analecta, 2:273). ‘The ministers’ of the Church of Holland ‘are covered in the time of sermon’ (Lieut. -Col. Erskine to Wodrow in 1728, Edinburgh Christian Instructor, xxvii, 265). This custom was approved by at least one eminent English [Independent] Puritan. “Mr. [Philip] Nye told us his private judgement, that in preaching he thinks the minister should be covered, and the people discovered; but in the sacrament, the minister should be discovered, as a servant, and the guests all covered.” (Laing’s Baillie’s Letters, 2:149).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformation in Scotland</cite>, … (London: Hodder &amp; Stoughton, 1910), pp. 301-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>He lets them know that both these kinds of disorders are repugnant to the institution of God and the dictates of reason. But especially the latter of these practices is confuted here by an appeal to nature, which is a comprehensive topic, and you may understand by it the general dictate of natural reason, and the particular law of nature concerning distinction of sexes, as also usage and custom, which is a second nature… In a word, a man must not be like a woman either as to her veil and covering or as to her long and dressed hair, because he is taught otherwise by the law of reason, and by that of the sex, and even by the practice and custom of the soberest part of the world, which are all comprised in the large extent of the word ‘nature’ in this place of the apostle.</p></blockquote>

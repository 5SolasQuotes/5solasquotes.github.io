<main class="wrap"><figure class="quote" id="q-bb081b1995" data-kw="">
<blockquote><p>Whilst the unutterable misery, into which all the children of Adam, by transgression, fell, was the occasion of God’s making another covenant, for the redemption of elect sinners; his own sovereign, distinguishing grace, was the cause or source of it. Hence it is usually styled THE COVENANT OR GRACE. It originated from the boundless grace, or sovereign good pleasure of God; and everything settled in it, is, and ever will be, “to the praise of the glory of his grace.”

In and by this covenant, God hath manifested, the unfathomable depths of his manifold wisdom, the unsearchable riches of his glorious grace, and the transcendent greatness of his astonishing love, far more clearly, than if man himself had performed the condition, and had been adjudged to eternal life, according to the tenor of the covenant of works.

The eternal Father, in the amazing depth of his infinite wisdom, and according to the predetermination of his sovereign will, devised this method of displaying his glory, and of manifesting his mercy, that amiable attribute of the Divine nature; which could not have shone forth with such transcendent lustre, if man had not been permitted to render himself miserable.

The covenant of grace, for the redemption of sinners of mankind, was concerted and entered into, between Jehovah the eternal Father, and his co-eternal Son as the last Adam, with the approbation of the Holy Spirit, long before it began to be published and offered to them, for their consent and acceptance:—which directs us to two different views of this august contract; first, as it is established between God and the Mediator; and next, as it is exhibited in the Gospel, to sinners for their approbation and consent. In the former view, it was made from eternity; in the latter, it was manifested in time: in that view, it is a federal transaction, or covenant properly so called, between Jehovah the Father, and his only begotten Son; in this, it is a testamentary deed or disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 6-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb0e36da0c" data-kw="">
<blockquote><p>The Scriptures of truth give no uncertain sound; there is nothing indefinite or ambiguous in them, no collision between the statements and descriptions of one inspired writer and another. The goodness of which they speak is a goodness which they describe in all its parts, and all its principles, and all its manifestations, with the most perfect harmony and mutual agreement—a goodness which is the same in every age and under every dispensation, in every rank of life and every state of society.

When they speak of Joseph of Arimathea, and Barnabas, and others, and say of them that they were “good” men, they use the epithet in a sense which they themselves have unfolded with the utmost clearness and precision; they speak of the goodness of these men of God according to that standard of truth and righteousness which is immutable as the throne of the Almighty, eternal as the character and attributes of Jehovah—of goodness manifested, not in one or a few particulars of life and conduct, but in all the dispositions, and graces, and conduct of the children of God. They speak of it, not as existing perfect and immaculately pure in this lower world, but as the goodness of the saints, the excellent ones of the earth, the sons of God and the followers of Christ, in contradistinction from those specious appearances which attract the notice and admiration of men, but are “abomination in the sight of God.”

In common conversation we are accustomed to use the epithet “bad,” as applicable only to men of the most abandoned character, but we ought never to forget that before God the whole world is divided into two classes, the good and the bad, the righteous and the wicked; the former comprehending in it the children of God in all the degrees of moral excellence to which they have attained, and the latter, the children of the wicked one, from the mere moralist on the one hand, to the most profligate and abandoned criminal on the other.

Goodness, in the Scripture sense of the word, is holiness; it is the goodness which God enjoins, and of which he himself presents the most perfect pattern—the goodness which, begun on earth in the regeneration of the true Christian, is accepted and approved through Christ Jesus, and which, increasing with the increase of God, is perfected at last in his presence in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-macfarlan.html">Patrick MacFarlan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Goodness in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-fa41277d16" data-kw="">
<blockquote><p>The communication of grace effectual, producing infallibly the good things proposed and promised in the minds and hearts of men, belonged not unto that covenant. If, therefore, there be no more in the making of the new covenant but only the adding of more forcible outward means and motives, more suitable unto our reasons, and meet to work on our affections, it differs only in some unassignable degrees from the former. But this is directly contrary unto the promise in the prophet, that it shall not be according unto it, or of the same kind.</p></blockquote>

<blockquote><p>8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee.

9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God.

10. Wouldst thou have more tokens of his will yet? See Him dying, hanging upon the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners should run in to Him, breathing out the breath of free grace in his very last act upon a thief that had not an hour to live; Who shall despair? who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth! corrupt heart say thou art not willing to be saved.

11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee.

9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God.

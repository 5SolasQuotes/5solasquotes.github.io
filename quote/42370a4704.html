<main class="wrap"><figure class="quote" id="q-42370a4704" data-kw="">
<blockquote><p>It is a shame for a woman to speak in the Church: the word ‘Church’ cannot be in that place restricted to the one single congregation supposed to meet all in one house at one time in Corinth [as per the congregationalists], because it is a shame for a woman to preach in all the churches of the world, as is clear, 1 Tim. 2:11-12 and Ex. 12:47[?].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-63ffae41b2" data-kw="">
<blockquote><p>Answer: To distribute in a civil and natural way requires not a man full of the Holy Ghost, but to distribute in simplicity and with the grace of heavenly cheerfulness, Rom. 12:8, and with the qualities of a complete deacon, 1 Tim. 3:[9,] 12-14, requires the Holy Ghost [Acts 6:3-5], though they may be good deacons who are not full of the Holy Ghost; but such [persons full of the Holy Ghost] were chosen:

1. Because this was to be a rule to all deacons to the world’s end, and the rule should be as straight and perfect as can be;

2. Because there were choice of such men as those in the apostolic Church, and [there is] reason that God be served with the best of his own;

3. The Holy Ghost is required for sanctification, as well as for gifts of preaching, Luke 1:15; Mt. 10:20.

4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman, who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165</span></figcaption>

<blockquote><p>4th Conclusion is this… Now if a church should be in a remote island, not consociate with other churches, and yet wanting guides [officers], our [congregationalist] brethren say in this case, the power of the keys should be seen to be in believers, and they might choose and ordain their own officers. I grant they have great [Romanist] schoolmen to say with them… But I say in this case necessity is an unbooked and naughty lawyer, and God extraordinarily should supply the want of ordination, as He can do the defect of second causes: so that if God send some pastors to a congregation that were unwilling to choose their own eldership, pastors might ordain themselves pastors in that case to these people, and God should supply their want of popular election…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 5-7</span></figcaption>

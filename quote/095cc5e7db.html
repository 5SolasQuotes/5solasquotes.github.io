<main class="wrap"><figure class="quote" id="q-095cc5e7db" data-kw="">
<blockquote><p>The redemption of sinners originated in the free and sovereign love of God, the Father, Son and Holy Spirit, whose love is one, though exerted variously, according to the order of their subsistence, in the voluntarily established economy of grace. The love of the Father has been justly called “the eternal disposing cause of redemption,” and to it accordingly is ascribed in Scripture the purpose of saving sinners, the selection of the objects of mercy, the appointment of the means, and the predestinating of the elect, in the Mediator, to the enjoyment of eternal life.

The love of the Son is the eternal spring of all that God did in the impetration of redemption; as the love of the Spirit is the spring of its application. And in the manifestation of the love of Christ we see also that of the Father and of the Spirit. While we are warranted to take a distinct view of divine love as displayed by each person of the adorable Trinity, we can thus view it as the love of one glorious being. We do not detract from the love of the Father and Spirit, when we say, “Unto him that loved us, and washed us from our sins in his own blood—be glory and dominion for ever and ever. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ in Sermons</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6a6dcb745" data-kw="begot necessarily willingly">
<blockquote><p>Arius vexed the Orthodox by asking whether the Father begot the Son by necessity or by will. To this, the response must be that the Father begot the Son not out of necessity but necessarily, for He did not beget contingently. However, whatever this necessity is, it is voluntary and natural and lacks coercion. The Father did not beget the Son by will, but He begot willingly, for He is not compelled by any external or superior cause to beget.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXIV</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/eternal-generation.html">Eternal generation</a></span><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/order-and-subordination.html">Order and subordination</a></span></div>

</figure><figure class="quote" id="q-d2091c082d" data-kw="">
<blockquote><p>In the first book-length treatment of this doctrine, Adonis Vidu… engaging with recent and historical objections. Taking aim at a common ‘soft’ interpretation of the inseparability rule, according to which the divine persons merely cooperate and work in concert with one another, Vidu argues for the retrieval of ‘hard inseparability,’ which emphasizes the unity of divine action, primarily drawing from the patristic and medieval traditions. Having probed the biblical foundations of the rule and recounted the story of its emergence in nascent Trinitarianism and its neglect in modern theology, Vidu builds a constructive case for its retrieval. The rule is then tested precisely on the battlegrounds that were thought to have witnessed its defeat: the doctrines of creation, incarnation, atonement, ascension, and the indwelling of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adonis-vidu.html">Adonis Vidu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Same God Who Works All Things</cite></span></figcaption>

</figure><figure class="quote" id="q-9c5edb9e5b" data-kw="">
<blockquote><p>Thesis XIV… For because divine essence is infinite, most simple, and eternal, therefore the three hypostases subsisting in it—although they are truly three in number—because these individual hypostases are distinguished by their own incommunicable properties, they are nevertheless not three gods nor are they said to be three gods in the same way that there are three men… But instead, in the divine this happens by an indescribable communication of the whole essence from eternity, in which no point of beginning, middle, or end can be stated.† † dari, i.e., cannot be stated or supplied because it does not exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beza on the Trinity</cite>, 21 Theses’ from Tractationes Theologicae Bezae, Volumen I (Geneva: Jean Crespin, 1570), p. 651 tr. David Noe</span></figcaption>

</figure><figure class="quote" id="q-698d53b4a3" data-kw="">
<blockquote><p>The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-beck.html">Andreas Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘God, Creation, and Providence in Post-Reformation Reformed Theology’, p. 205 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

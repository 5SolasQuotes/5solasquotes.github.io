<main class="wrap"><figure class="quote" id="q-57db1848de" data-kw="">
<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter</cite>, trans. Johnson &amp; Fentiman (RBO, 2019) | Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’, pp. 57-58, ch. 2, ‘On God’; pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.”

.github.io%2Fquote%2F57db1848de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57db1848de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=1.%20Because%20out%20of%20the%20amiable,it%20will%20not%20come%20to%20be&amp;text=1.%20Because%20out%20of%20the%20amiable%20invitation%2C%20this&amp;text=of%20men%2C%20it%20will%20not%20come%20to%20be" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb47c23da1" data-kw="">
<blockquote><p>First, ‘God’ (say they [Arminians]), ‘considering all mankind as fallen from that grace and favor in Adam where they were created, and excluded utterly from the attainment of salvation by virtue of the covenant of works which was at the first made with him, yet by his infinite goodness was inclined to desire the happiness of them all and every one, that they might be delivered from misery and be brought unto Himself, which inclination of his they call his universal love and antecedent will, whereby He would desirously have them all to be saved, out of which love He sends Christ.’ [Owen:] That God has any natural or necessary inclination by his goodness or any other property to do good to us or any of his creatures, we do deny: everything that concerns us is an act of his free will and good pleasure, and not a natural necessary act of his Deity, as shall be declared. Secondly, the ascribing an antecedent conditional will unto God, whose fulfilling and accomplishment should depend on any free contingent act or work of ours, is injurious to his wisdom, power and sovereignty, and cannot well be excused from blasphemy, and is contrary to Rom. 9:19, ‘Who hath resisted his will? I say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu, or the Death of Death in the Death of Christ</cite>, … (London: W.W., 1648), bk. 2, ch. 4, pp. 91-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

=First%2C%20%E2%80%98God%E2%80%99%20%28say%20they%20%5BArminians%5D%29%2C%20%E2%80%98considering,hath%20resisted%20his%20will%3F%20I%20say&amp;text=First%2C%20%E2%80%98God%E2%80%99%20%28say%20they%20%5BArminians%5D%29%2C%20%E2%80%98considering%20all%20mankind&amp;text=9%3A19%2C%20%E2%80%98Who%20hath%20resisted%20his%20will%3F%20I%20say" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b26fb3dc36" data-kw="">
<blockquote><p>From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercise 2, ‘Of Notions of the Divine Will’</cite>, ch. 1, ‘Of God’s Revealed Will [Signi] and His Will of Good-pleasure’ in Apologetic Exercises for Divine Grace (Amsterdam, 1636; 1651), pp. 213-238, p. 232-233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.”

</figure><figure class="quote" id="q-064de38f6e" data-kw="">
<blockquote><p>This law is eternal and divine, and therefore the universal principle and exemplar of all other rules. This law is immutable, and accordingly (as we should say with the scholastics) it is never ruled by any other law… the law is nothing other than the very wisdom of God that determines the rationale of what is lawful and unlawful in all things created according to his own image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, (Sources in Early Modern Economics, Ethics, and Law) (CLP Academic, 2015), thesis 2, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-1ef4dac9cd" data-kw="">
<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 40, art. 3, On Divine Election, quest. 1, ‘Whether election is in God from eternity, or in time.’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

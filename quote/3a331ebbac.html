<main class="wrap"><figure class="quote" id="q-3a331ebbac" data-kw="">
<blockquote><p>VIII. Although our justification will be fully declared on the last day (our good works also being brought forward as the sign and proof its truth, Mt. 25:34–40), still falsely would anyone maintain from this a twofold gospel justification—one from faith in this life (which is the first); the other (and second) from works on the day of judgment (as some hold, agreeing too much with Romanists on this point). The sentence to be pronounced by the supreme Judge will not be so much a new justification, as the solemn and public declaration of a sentence once passed and its execution by the assignment of the life promised with respect to an innocent person from the preceding justification. Thus it is nothing else than an adjudicatory sentence of the possession of the kingdom of heaven from the right given before through justification. And if works are then brought forward, they are not adduced as the foundation of a new justification to be obtained then, but as signs, marks and effects of our true faith and of our justification solely by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.10.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4530eb6855" data-kw="">
<blockquote><p>In the law-court of God, then, the justification of man as sinner is the judgment of God whereby He pronounces righteous the person who is unholy and of himself a sinner subject to God’s wrath. He does so out of his own mere grace and mercy, for the sake of the perfect obedience and righteousness of Christ that was offered on our behalf and that is received by faith. That is, He pardons the sinner from sin and the curse, and imputes to him the righteousness of his Son and so awards to him life eternal, for the salvation of the believing person and the glory of the merciful and just God. Nearly every part of this definition is included by the apostle in Romans 3:24–26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacobus-arnoldi-ditsius.html">Jacobus Arnoldi Ditsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1599–1662) in Synopsis of a Purer Theology: Latin Text and English Translation</cite>, 2.307</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-7d7e242940" data-kw="">
<blockquote><p>XXII… (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed, such that for the first constitution of justification, besides faith, not even the presence of good works is necessary, just as for the first constitution of fleshly marriage nothing is required but a consent of the spouses, because God justifies the ungodly (Rom. 4:5); then for its continuation their coexistence is required, just as for the continuation of marriage a coexistence of marriage duties is required, because faith working through love is required (Gal. 5:6); and finally for the consummation (insofar as the possession of eternal life is pronounced), the preexistence of good works is also required for the possession of eternal life (Mt. 25:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 128</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

e</a></div>
</figure><figure class="quote" id="q-b7f7f8b773" data-kw="">
<blockquote><p>They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on Canon 10</span></figcaption>

</figure><figure class="quote" id="q-e120f7bfe8" data-kw="">
<blockquote><p>Adoption, that also is a privilege we receive in this life; yea a learned man ([William] Forbes in his book where he handles the order of God’s graces [Modest Considerations...]) makes adoption (as I take it) to be the first, and to go before justification; yet the apostle, Rom. 8:23, calls the Last Day, the day of adoption. Hence 1 Jn. 3:2, the apostle, though he says, ‘We are now the sons of God,’ yet he says ‘it does not appear what we shall be,’ because the glory God at the Last Day will put upon us is so far transcendent and superlative to what now we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 256</span></figcaption>

<main class="wrap"><figure class="quote" id="q-38b08187c6" data-kw="">
<blockquote><p>However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant</cite>, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1052</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Conclusion 1. The appearing-holiness of those who hold an opinion is not enough to demonstrate it a truth. A man may be in a dangerous (I had like to have said, damning) error, and yet to the view of men appearingly-holy. Many men have put on a form of godliness, and shew of holiness, till they have gotten strength and power enough to back them in their opinions, and then they have discovered the venom of their spirits, and let loose their spirits to those corrupt ways which their erroneous understandings did lead them to.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 164</span></figcaption>

<blockquote><p>And concerning the bounds and limits of this forbearance, all will undeniably acknowledge that it ought not to be extended indifferently unto all persons, opinions and practises, but that these four propositions are agreeable to the truth of Christianity: … Secondly, that it is not the mind of Christ that any of his servants should profess themselves willing or obliged to bear with any person which does endeavour, and with any doctrine or practice which does tend to overthrow the faith in his name, which is delivered to the saints (Jude 3), or to destroy the life and power of godliness either in the private or publick profession of religion (Tit. 1:10-11; 2 Tim. 3:5-8; Gal. 5:7-13), or to dissolve the bonds of holy communion amongst Christian brethren (Phil. 3:2; Jud. 19; Rom. 16:17-18), or to abolish the orderly relations and obligations natural and moral, without which human societies cannot stand (1 Tim. 5:8; Mt. 15:4-6; 1 Tim. 4:3), or to put down the authority which God has set up in and over human societies for the administration of justice therein (2 Pet. 2:10; Rom. 13:1-8). … Fourthly, that in matters of greater weight, which are not merely circumstantial, but are conceived to be determined by the Word, yet so, as that it is differently understood: in this case the mind of Christ is that the rules of Christian charity and mutual edification, be inviolably observed with all long suffering and forbearance. And this course ought to be continued so long, either as there is hope to gain the advantage of loving conferences, whereby differences may be reconciled, and mistakes and scandals prevented and taken out of the way; or so long as there is cause to think that God may reveal his profitable truths to such as err not wilfully, but through weakeness of judgment and harmlessly, Phil. 3:15-16 and 2 Tim. 2:22-26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator: Endeavoring a Full Composure &amp; Quiet Settlement of those many Differences both in Doctrine &amp; Discipline, which have so long disturbed the peace and welfare of this commonwealth</cite>, … (London: Bellamy, 1652), ch. 8, pp. 57-58 Caryl was a congregationalist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors</cite>, ... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

n, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-98d5b59ac8" data-kw="">
<blockquote><p>I would have wanted to expound this in a more detailed and careful way, because all the ministers of the church are reminded by Paul’s example what they must do and how they must understand the purpose and goal of their ministry in order to be able to defend their teaching with similar confidence against whoever may come along. The essential point is that we preach God, not people. All human beings are liars, and so whatever they make up in their own mind is uncertain, dubious and unstable. In his own being, God is eternal, and so he always stays the same and does not change.…

Paul challenges the Galatians by appealing to their consciences in a way that those who are sure of themselves often do because they know that their self-confidence will also be perceived by their enemies. What he says here served his purpose very well. Those who want to please people have to say things that are pleasing to them, and so they keep quiet about things that they know others will find offensive. They are therefore forced to hide a great deal and to express many things in ways that are quite different from the way God reveals them in his Word. Paul says that he is not the kind of person who wants to please people, and by using that argument he attacks the false apostles, whom he accuses of pleasing the Jews, who were the most bitter persecutors of the gospel, by adding circumcision and the other ceremonies of the law to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>This command, as all the rest of the decalogue, was written twice by the finger of God in tables of stone. And hereof there was a double reason:- First, That it was a stable renovation and objective representation of that law, which being implanted on the heart of man, and communicated unto him in his creation, was variously defaced; partly by the corruption and loss of that light, through the entrance of sin, which should have guided us in the right apprehension and understanding of its dictates, and of the obedience that it required; partly through a long course of a corrupt conversation, which the world had, in the pursuit of the first apostasy, and according to the principles of it, plunged itself into.

God now again fixed that law objectively, in a way of durable preservation, which in its primitive seat and subject was so impaired and defaced. And hereof the additions mentioned, with peculiar respect unto the application of the whole, or any part of it, unto that people, were no impeachment, as is acknowledged in the preface given unto them all containing a motive unto their dutiful observance of the whole. And hence this law must necessarily be esteemed a part of the antecedent law of nature; neither can any other reason be given why God wrote it himself with those and only those that are so, in tables of stone.

Secondly, This was done as an emblem that the whole decalogue was a representation of that law which, by his Spirit, he would write in the fleshy tables of the hearts of his elect. And this is well observed by the church of England, which, after the reading of the whole decalogue, the fourth command among the rest, directs the people to pray that God would write all these laws in their hearts.

Now, this concerneth only the moral law; for although obedience unto all God’s ceremonial and typical institutions, whilst they were in force, was moral, and a part of the law written in the heart, or required in general in the precepts of the first table of the decalogue, yet those laws themselves had no place in the promise of the covenant that they should be written in our hearts; for if it should be so, especial grace would be yet administered for the observation of those laws now they are abolished, which would not only be vain and useless, but contradictory to the whole design of the grace bestowed upon us, which is to be improved in a due and genuine exercise of it. Neither doth God bestow any grace upon men but withal he requires the exercise of it at their hands. If, then, this law was written in tables of stone together with the other nine, that we might pray and endeavour to have it written in our hearts, according to the promise of the covenant, it is, and must be, of the nature of the rest, that is, moral, and everlastingly obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. William H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 367-68 (emphasis added).</span></figcaption>

</figure><figure class="quote" id="q-055366a403" data-kw="">
<blockquote><p>The Lord Christ Jesus takes delight in his own day. He delights to honour it. He delights to meet with and manifest himself to his disciples on it, as he showed before his ascension by appearing to them from time to time on this day. He delights to give his Holy Spirit on this day, as he intimated by choosing of it to pour it out on the primitive church in so remarkable a manner upon it, and by giving his Spirit to the apostle John on this day.

God blessed the seventh day of old, or appointed it to be a day wherein he especially would bestow blessings on his people as an expression, as it were, of his own joyful remembrance of that day and of the rest and refreshment he had on it; Exodus 31:16–17, “Wherefore the children of Israel shall keep the sabbath … for in six days the Lord made heaven and earth, and on the seventh day he rested, and was refreshed,” as princes give gifts on their birthday, on their marriage days, and the like.

But how much more reason has Christ to bless the day of his resurrection, and to delight to honour it, and to be conferring his graces and blessed gifts on his people on this day. It was a day wherein Christ rested and was refreshed in a literal sense. It was a day of great refreshment and joy to Christ, being the day of his deliverance from the chains of death, the day of his finishing that great and difficult work of redemption that had been upon his heart from all eternity, the day of his justification of the Father, the day of the beginning of his exaltation and the fulfilment of the promises of his Father, the day when he had eternal life, which he had purchased, put into his hands. And Christ does delight to distribute gifts and blessings and joy and happiness on this day, and will to the end of the world.

O, therefore, how well is it worth our while to improve this day, to call upon God and seek Jesus Christ on it!

Let awakened sinners be stirred up by these things to improve the sabbath day, as they would lay themselves most in the way of the Spirit of God. Improve the sabbath day to call upon God, for then he is near. Improve the sabbath day for reading the holy Scriptures and diligently attending his Word preached, for then is the likeliest time to have the Spirit accompanying of it. Let the saints that are desirous of growing in grace and enjoying communion with Christ improve the sabbath in order to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 246.</span></figcaption>

rchased%2C+put+into+his+hands.+And+Christ+does+delight+to+distribute+gifts+and+blessings+and+joy+and+happiness+on+this+day%2C+and+will+to+the+end+of+the+world.%0A%0AO%2C+therefore%2C+how+well+is+it+worth+our+while+to+improve+this+day%2C+to+call+upon+God+and+seek+Jesus+Christ+on+it%21%0A%0ALet+awakened+sinners+be+stirred+up+by+these+things+to+improve+the+sabbath+day%2C+as+they+would+lay+themselves+most+in+the+way+of+the+Spirit+of+God.+Improve+the+sabbath+day+to+call+upon+God%2C+for+then+he+is+near.+Improve+the+sabbath+day+for+reading+the+holy+Scriptures+and+diligently+attending+his+Word+preached%2C+for+then+is+the+likeliest+time+to+have+the+Spirit+accompanying+of+it.+Let+the+saints+that+are+desirous+of+growing+in+grace+and+enjoying+communion+with+Christ+improve+the+sabbath+in+order+to+it.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+Perpetuity+and+Change+of+the+Sabbath%2C+%281730-31%29+in+Mark+Valeri+%28ed.%29%2C+Sermons+and+Discourses%2C+1730-1733%3A+The+Works+of+Jonathan+Edwards+Volume+17+%28New+Haven+CN%3A+Yale+University+Press%2C+2000%29%2C+p.+246.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F055366a403.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/055366a403.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/27/jonathan-edwards-on-christs-delight-in-the-lords-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-528533c5d0" data-kw="">
<blockquote><p>But they say immediately, ‘We teach that these images are not to be worshipped.’ As if, in fact, says [Jerome] Zanchius (De Imagin., col. 402), ‘God had not once rather diligently done the same thing through Moses and the prophets, that we are doing. So then why did He even want all images abolished? Because it is not enough to teach by word that an evil thing must not be done; but the slight obstacles, the incentives, the causes, the occasions of evil doing must be abolished.’ It is not enough, with the scribes and Pharisees, to teach out of Moses’ chair what the people should do, but all occasions, yea, appearances of evil, are to be taken out of their sight. ‘Those things affect more powerfully, and affect more, which fall upon the eyes than those which fell upon the ears. And so Hezekiah had been able to warn the people not to worship the serpent, but he preferred to break it in pieces and completely remove it from visibility,’ says one well to this purpose. (Thomas Naogeorgus [Kirchmeyer] in 1 Jn 5:21)</p></blockquote>

<blockquote><p>Nay thou worshippest them, who makest them that they may be worshipped. But in all other senses the making a picture is not making an idol; and therefore that severe sense of the commandment, though as it is most probable it did oblige the Jews, and all persons in equal danger; yet because the reason may cease, and the danger be secured, when it is ceased, the obligation also is null; and therefore though that was in the commandment, yet it is no part of its morality; but that excepted, every other clause [of the Second Commandment] is moral and eternal.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83af03d9b1" data-kw="">
<blockquote><p>V. That what God forbids, is at no time to be done; what He commands, is always our duty, and yet every particular duty is not to be done at all times. Thus sin is, under no pretense, to be committed. Accordingly, Moses, when he was in a prosperous condition in Pharaoh’s court, though he might have pretended that his greatness and the advantages which Israel might have expected from it, would be an excuse for his continuing to enjoy the pleasures of sin there; yet he was sensible that these considerations would not exempt him from guilt. Hence, ‘he forsook Egypt, and chose rather to suffer affliction with the people of God, than to enjoy the pleasures of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity… (New York: Robert Carter, 1855), vol. 2</cite>, p. 313</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-0bce3d4602" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil112 (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

d Books Online</a></div>
</figure><figure class="quote" id="q-bd3e2f5fb8" data-kw="">
<blockquote><p>Provided always, That the clause in the Directory, of the administration of the Lord’s Supper, which metions the communicants sitting about the table, or at it, be not interpreted as if, in the judgment of this kirk, it were indifferent, and free for any of the communicants not to come to, and receive at the table; or as if we did approve the distributing of the elements by the minister to each communicant, and not by the communicants among themselves…</p></blockquote>

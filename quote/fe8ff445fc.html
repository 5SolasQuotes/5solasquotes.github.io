<blockquote><p>That the person who only is in case to make use of Christ for Sanctification, is one, that hath made use of Him already for Righteousness &amp; justification: for one who is a stranger to Christ, and is living in nature, hath no access to Christ for sanctification. He must be a believer and within the covenant, ere he can make use of the grounds of sanctification, laid down in the covenant.

One must first be united to Christ, and justified by faith in Him, before he can draw any virtue from Him for perfecting holiness. He must first be in Him before he can grow up in Him, or bring forth fruit in Him. And therefore the first thing that souls would go about, should be to get an union made up with Christ, and be clothed with his righteousness by faith; and then they have a right to all his benefits: first they should labour to get their state changed from enmity, to peace &amp; reconciliation with God, through faith in Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the way, and the truth, and the life. Or, A short discourse pointing forth the way of making use of Christ for justification and especially and more particularly for sanctification in all its parts, from Johan. XIV: vers. VI. Wherein several cases of conscience are briefly answered, chiefly </cite>, (Rotterdam: John Cairns, 1677), p. 73.</span></figcaption>

445fc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/03/john-brown-of-wamphray-a-man-must-be-justified-before-he-can-be-sanctified/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3eaa37cff6" data-kw="">
<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

</figure><figure class="quote" id="q-8254a3fea0" data-kw="">
<blockquote><p>Justification in order goeth before sanctification…Sanctification presupposeth justification: they who are sanctified may rest upon it, that they are cleansed and justified. For sanctification is a fruit of justification…Admirable is the comfort, which the Saints in this world reap hereby. For their sanctification being imperfect, and the flesh abiding in them, and lusting against the spirit: yea sin being present with them when they would do good, they are oft forced to complain and cry, O wretched man that we are: who shall deliver us from this body of death(Rom 7:24)? If they had no other ground to fasten the anchor of their hope upon but their sanctification, it could not hold them fast enough against the tempest of Satan’s temptations. But in that their sanctification is a fruit and evidence of their justification, they take heart to themselves, and thank God that with the mind they themselves serve the Law of God, though with the flesh the Law of sin. And thus upheld and comforted, they continue to strive against sin, till it be clean rooted out of them, as well as remitted.</p></blockquote>

<blockquote><p>He who errs in this doctrine errs to his eternal destruction. The devil is therefore continually engaged in denying, perverting, and obscuring the truth expressed in this chapter and, if he does not accomplish this, to prevent exercise concerning this truth. When new errors appear on the horizon, even when they initially do not pertain to justification at all, they in time will eventually culminate in affecting this doctrine. One must therefore be all the more earnest to properly understand, defend, and meditate upon this doctrine.</p></blockquote>

</figure><figure class="quote" id="q-e560c5d9a6" data-kw="">
<blockquote><p>If he knows not the difference between the law and the gospel, he will be apt, especially in the affair of justification, to confound the one with the other. The consequence will be that in his painful experience, bondage will be mixed with liberty of spirit, fear with hope, sorrow with joy, and death with life. If he cannot so distinguish the gospel from the law as to expect all his salvation from the grace of the gospel and nothing of it from the works of the law, he will easily be induced to connect his own works with the righteousness of Jesus Christ in the affair of his justification. This was the great error of the Judaizing teachers in the churches of Galatia. They mingled the law with the gospel in the business of justification, and thereby they so corrupted the gospel as to alter the very nature of it and make it another gospel. They taught that except men were circumcised and kept the law of Moses, they could not be justified or saved (Acts 15:1-5). They informed the people that while the righteousness of Christ received by faith was necessary, their own works of obedience were also requisite in connection with it to entitle them to justification before God. This is a fundamental error and such a one that, if even an angel from heaven would publish it, he should be accursed. Accordingly, the apostle boldly affirmed to the Galatians, and he deliberately and earnestly repeated his declaration that though he himself or even an angel from heaven were to preach any other gospel to them than that which he had preached unto them, he should be accursed (Gal. 1:8-9). To mingle, then, the law with the gospel or to teach men to join the works of the law to the perfect righteousness of Jesus Christ as the ground of a sinner’s title to justification in the sight of God is, according to our apostle, to preach “another gospel” (Gal. 1:6). As this is a great error, so it is a very dangerous error. If a man attempts to add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2-4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 127–28.</span></figcaption>

add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2-4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.”

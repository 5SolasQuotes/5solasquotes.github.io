<main class="wrap"><figure class="quote" id="q-b9d7f68c1a" data-kw="">
<blockquote><p>(1) All covenanted with God are to be baptized. But the children too are included in the covenant of grace, 1 Cor. 7:14 (the unbelieving husband is sanctified in the wife, and the unbelieving wife is sanctified in the brother: else were your children unclean; but now are they holy). The universal command to baptize all those covenanted with God includes the particular command regarding the baptism of children who are within the covenant. What belongs equally to all is not to be restricted to the adult pert of the seed;–and (2) even under the old covenant children were circumcised.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-576f4001d4" data-kw="">
<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, section 50</cite>, p. 167</span></figcaption>

not%20therefore%20exclude,church%20always%20have%20considered%20beyond%20debate&amp;text=However%2C%20we%20do%20not%20therefore%20exclude%20form%20the&amp;text=early%20Christian%20church%20always%20have%20considered%20beyond%20debate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-14dc9f6d20" data-kw="">
<blockquote><p>But where I added, that in the name of Jesus Christ we baptize, though I said no more than the Scripture says [i.e. Acts 2:38; 8:12,16; 19:5], yet he [Mr. Hussey] is pleased to object against me… I cited plain texts to prove that baptism is done in the name of Christ… But how does baptizing in the name of Christ, as Mediator, agree with the commission to baptize in the name of the Father, Son and Holy Ghost?… First, I say, the question is of things or actions, not of words. Mr. Hussey (it seems) did apprehend my meaning, as if I had intended an expression to be made in the act of baptizing, thus: ‘I baptize thee in the name of Jesus Christ.’ But [on the contrary] I speak of the action, not of the expression, even as in another instance I gave: our assembling together is in the name of Christ, though we do not say in terminis [in the very terms], ‘We are now assembled in the name of Christ.’ In baptism Christ does not command us to say either these words, ‘I baptize thee in the name of Christ;’ or these, ‘I baptize thee in the name of the Father, Son and Holy Ghost:’ but we are commanded to do the thing, both in the name of Christ as Mediator, and in the name of the Father, Son and Holy Ghost; but in different respects. A minister of Christ does both preach and baptize in the name of Christ, as Mediator; that is, vice Christi, in Christ’s stead [see 2 Cor. 5:20], and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our commission to preach and baptize, by Mr. Hussey’s confession. So that to preach and baptize epi to onomati Iesou Christou [in the name of Jesus Christ] (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38), comprehends a formal commission, power and authority, given and derived from Christ. I say not that it comprehends no more, but this it does comprehend. But when Christ bids us baptize eis ta onoma, ‘unto’, or ‘into’, or ‘in the name’ of the Father, Son and Holy Ghost, Mt. 28:19, this does relate to the end and effect of baptism, or the good of the baptized (if we understand the words properly), not the authority of the baptizer, as if a formal commission were there given him from the Father, Son and Holy Ghost. So that to baptize on ‘in’ or ‘unto’ the name of the Father, Son and Holy Ghost, is properly meant both of sealing the parties’ right and title to the enjoyment of God Himself, as their God by covenant, and their interest in the love of God, the grace of Christ, and of the communion of the Holy Ghost; and of dedicating the party to the knowledge, profession, faith, love, and obedience of God the Father, Son and Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, p. 110-111</span></figcaption>

<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

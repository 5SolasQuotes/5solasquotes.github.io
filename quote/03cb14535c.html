<main class="wrap"><figure class="quote" id="q-03cb14535c" data-kw="">
<blockquote><p>The Irish Presbyterian theologian, Professor Richard Smyth believed that the Liberals in the Church of England should have followed the example of the Irish Unitarians led by Henry Montgomery, who left the Synod of Ulster rather than falsely subscribe to a confession that they rejected:

If the rationalistic party in the Anglican Establishment could only persuade themselves (as Dr Montgomery and his associates did honestly persuade themselves), that it is inconsistent in them to profess outward adhesion to the thirty-nine Articles and the Athanasian Creed whilst ridiculing the very documents they have signed; and if they were to secede with the same honesty as Dr Montgomery and his party did in Ireland, it would soon be found that Anglican rationalism has in it no elements of vitality, and that its present importance is incidental to its privileged position.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-smyth.html">Richard Smyth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and times of Dr Henry Cooke in British and Foreign Evangelical Review</cite></span></figcaption>

</figure><figure class="quote" id="q-c3372a7714" data-kw="">
<blockquote><p>The great offence, which makes us look like grim persecutors in Moderate eyes, is our offer of the ministrations of the Free Church to all the inhabitants of the land. They have got our temporalities — our churches, our schools, our manses, our gardens, our glebes, and our salaries — and their sufferings consist in the circumstance that they have not yet got our people — are not likely to get them — and that the poorer classes of our countrymen are generally espousing our cause, and accepting our services.

This is the head and front of our offending. They are persecuted, because the Free Church ministers, wicked set that they are, won’t agree to be banished from the kingdom — or, at all events, won’t surrender their offices as well as their livings — or refrain from preaching the gospel wherever there are persons that are willing to hear them. They are persecuted, because, having left the old places of worship in their hands, we are trying to build new ones for ourselves, and for those who adhere to us!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Persecution. The Lairds, the Lawyers, and the Moderate Clergy, against the Free Church of Scotland: Being the Substance of a Speech Delivered before the Free Presbytery of Perth, on Wednesday, 30th August, 1843</cite>, (Perth: W. Belford, 1843), p. 9.</span></figcaption>

edcovenanter.wordpress.com/2020/11/11/andrew-gray-on-the-sufferings-of-the-free-church-of-scotland/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-f3cf654479" data-kw="">
<blockquote><p>The ignorance of fundamentals condemns, which is to be understood [in] two ways:

1. The ignorance of fundamentals such as are supernatural fundamentals, condemns all within the visible church as a sin, but it does not formally condemn those who are [outside] the visible church (John 15:22). It only makes those who are without the church incurable, but does not formally condemn them, as medicine not known, and so not refused, makes sick men incurable, as a loss, but does not kill them as a sin.

2. Superstructures, which by consequence arise from fundamentals, are fundamental by consequence, and secondarily, as the second rank of stones that are immediately laid upon the foundation, are a foundation in respect of the higher parts of the wall, and therefore are materially fundamental. And the ignorance of these virtually condemns, and the denying of such, by consequence, is a denying of the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, The Due Right of Presbyteries, … (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 2 Distinctions about Ignorance of Fundamentals</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

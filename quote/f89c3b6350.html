<blockquote><p>Though there is nothing more natural to man, then to seek after happiness, yet there is nothing that the nature of man is less able to find out then his happiness. Man’s hungering desire to attain happiness is not abated, though his ability for the attainment thereof (as of and by himself) be quite lost, Since he did eat the forbidden fruit, that is, since he sinned, ever since he was banished from the well-watered Garden of God; he (poor man!) hath wandered up and down like a fugitive and a vagabond in the land of Nod, seeking rest, in dry places, but findeth none.

Alas, how is poor silly man bewildered in the pursuit of his chiefest good! he walks in darkness, and knows not whither he goes, he stumbles and falls, yea, in seeking to save, he loseth himself. It is with him, as it was with the blind Sodomites, who groping to find the door, went further from it, then they were at first: Or like the Dove, when it left the Ark, always upon the wing, ever flying and fluttering up and down, but never found where to fix the sole of her foot; just thus ’tis with man since he left God, he knows not where to rest the foot of his soul; Nunc hîc, nunc vertitur illîc, he goes forward and then back again, to the right hand and to the left, (as Job in another, and Solomon in this case) to see if he can find out what is that good for the souls of the sons of men, which they should do under the Heaven all the days of their life, that after this life of days is ended, they may enjoy life eternal with God in Heaven. But alas! I must say it again, Man is still at a loss.

Now man being in this pitifully sad and miserable condition it pleased God, (who is a lover of the souls, and the Preserver of men) in tender mercy to mankind, to speak at sundry times, (or by piece-meal,) and in divers manners unto the Fathers by the Prophets, but in the fulness of time to send, and in these last days to speak to us by his Son; he hath discovered his Will fully and wholly by him, so that we may not look for another; there being no name under heaven but him by which we can be saved, whither then should we go for the discovery (seeing he only hath the words,) of eternal life? him I say hath God sent to guide our feet into the way of peace, yea, that he might be the way, and the truth, and the life unto us. He sent Christ from Heaven to earth, that Christ might send men from earth to Heaven.

Accordingly Christ hath acquitted himself like a faithful Steward; he hath finished the work which his Father gave him to do; He hath done and suffered all that was commanded him for the good of men; so that he is pure from the blood of all men, having declared unto them the whole counsel of God, and chalked out the way wherein they are to walk, that they may be happy.</p></blockquote>

<blockquote><p>Yea, he had power over the angel, and prevailed: he wept, and made supplication unto him: he found him in Bethel, and there he spake with us;

He; your famous progenitor of whom you boast. Had power; behaved himself as a prince with God, Genesis 32:28. Over; with: the angel was willing to be conquered, or Jacob could not have gotten the victory. The angel; called God, Hosea 12:3, and, Hosea 12:5, is Jehovah, Lord of hosts. He was no created angel, but the uncreated Angel Christ, the Messiah, eternal God by nature and essence, angel by office and voluntary undertaking.

And prevailed; got the victory, went out of the field a conqueror, but not by such arms and methods as you use. You are conquered by man because of your sins, he conquered with God by faith and prayer. He, not the angel, as some through mistake, but your father Jacob, wept: by this we know he prayed with tears, though the story say not so, with sense of his own unworthiness, with earnestness for the mercy he desired, and apprehensive of the majesty of him with whom he wrestled. But you, quite contrary, proud as if worthy, regardless of the best part of the blessing, and earnest only for the meaner part, seek it not of God, but idols.

And made supplication unto him: it is Christ who is here intended; it was no mere creature, Jacob might not have prayed to such, but it was the Creator of angels and the Redeemer of man, the blessed Jesus, to whom every knee ought to bow, Philippians 2:10.

He, God, found him, Jacob, full of weariness, fears, and solicitude on his journey to Laban, Genesis 28:12,20, when prayers obtained a blessing; but with this, and more directly, when on his return after this wrestling bout, Genesis 35:1, &amp;c., God appeared to him, Genesis 35:7-15, and blessed him. Bethel; formerly called Luz, but by Jacob new named and called Bethel, Genesis 28:19.

There he, God, spake, renewed his promise and confirmed the blessing, with us: by the current of the words in their grammatical order it should be, he spake to him; but it is, not without good reason, changed to the plural first person, us, as posterity were in Jacob’s loins, and blessed with him. Yet more, where God appeared to Jacob he commanded him to build an altar there to God, to restore religion and reform his family from idolatry, which he did, Genesis 35:4. But you, children of this Jacob by natural descent, are of another and far different humour; though you have been called and exhorted to leave your idols, yet these two hundred years you have kept them, and will, I see, keep them: this is your sin, and in it you are obstinate, and I will punish such a Jacob as you.

Even the LORD God of hosts; the LORD is his memorial.

Even, or and, he that appeared and spake, who promised the blessing, and commanded the reformation at Beth-el, was the Lord, Jehovah, the eternal and unchangeable God, who still promiseth with like commands. God of hosts; who can both perform his promise and execute his threat, who is a most terrible enemy and most desirable friend, all being to us as he is. The Lord, Jehovah, repeated for confirmation, is his memorial; by this he will be known, by this name, by such methods of his sovereignty and grace, Exodus 3:15.

Therefore turn thou to thy God: keep mercy and judgment, and wait on thy God continually.

Therefore; no more vainly boast of Jacob; but, as he, do you approve yourselves to God. Turn thou to thy God; repent, leave idols, and all sins. He worshipped God alone, do you so; he cast idols out of his family, do you so too, be Jacob’s children herein. Keep mercy; show kindness to all who need it, cast off cruelty and inhumanity, and be merciful to the afflicted: this contains all the duties we owe to any that are in straits.

And judgment; wrong none, but with justice in dealings, in judicatures, and public offices, render to every one their due. Acquit the innocent, and condemn the guilty, and let none have just cause to complain of injuries. Wait on thy God; in public worship, and private duties of prayer, and seeking God, him only serve and, trust, let not idols have either sacrifice, prayer, praise, or trust from you.

Continually: and let your hope and worship be perpetuated, for ever continued towards God, till he save and rescue; trust, pray, and resign yourselves to him, who will be yours as he was Jacob’s God, on these terms and no other. This short phrase, wait on they God, includes all duties of the first table of the law, all religions worship of the true God; do this, and the Lord will be to you. as to Jacob, defence against danger and fullness in your wants.</p></blockquote>

urn+after+this+wrestling+bout%2C+Genesis+35%3A1%2C+%26c.%2C+God+appeared+to+him%2C+Genesis+35%3A7-15%2C+and+blessed+him.+Bethel%3B+formerly+called+Luz%2C+but+by+Jacob+new+named+and+called+Bethel%2C+Genesis+28%3A19.%0A%0AThere+he%2C+God%2C+spake%2C+renewed+his+promise+and+confirmed+the+blessing%2C+with+us%3A+by+the+current+of+the+words+in+their+grammatical+order+it+should+be%2C+he+spake+to+him%3B+but+it+is%2C+not+without+good+reason%2C+changed+to+the+plural+first+person%2C+us%2C+as+posterity+were+in+Jacob%E2%80%99s+loins%2C+and+blessed+with+him.+Yet+more%2C+where+God+appeared+to+Jacob+he+commanded+him+to+build+an+altar+there+to+God%2C+to+restore+religion+and+reform+his+family+from+idolatry%2C+which+he+did%2C+Genesis+35%3A4.+But+you%2C+children+of+this+Jacob+by+natural+descent%2C+are+of+another+and+far+different+humour%3B+though+you+have+been+called+and+exhorted+to+leave+your+idols%2C+yet+these+two+hundred+years+you+have+kept+them%2C+and+will%2C+I+see%2C+keep+them%3A+this+is+your+sin%2C+and+in+it+you+are+obstinate%2C+and+I+will+punish+such+a+Jacob+as+you.%0A%0AEven+the+LORD+God+of+hosts%3B+the+LORD+is+his+memorial.%0A%0AEven%2C+or+and%2C+he+that+appeared+and+spake%2C+who+promised+the+blessing%2C+and+commanded+the+reformation+at+Beth-el%2C+was+the+Lord%2C+Jehovah%2C+the+eternal+and+unchangeable+God%2C+who+still+promiseth+with+like+commands.+God+of+hosts%3B+who+can+both+perform+his+promise+and+execute+his+threat%2C+who+is+a+most+terrible+enemy+and+most+desirable+friend%2C+all+being+to+us+as+he+is.+The+Lord%2C+Jehovah%2C+repeated+for+confirmation%2C+is+his+memorial%3B+by+this+he+will+be+known%2C+by+this+name%2C+by+such+methods+of+his+sovereignty+and+grace%2C+Exodus+3%3A15.%0A%0ATherefore+turn+thou+to+thy+God%3A+keep+mercy+and+judgment%2C+and+wait+on+thy+God+continually.%0A%0ATherefore%3B+no+more+vainly+boast+of+Jacob%3B+but%2C+as+he%2C+do+you+approve+yourselves+to+God.+Turn+thou+to+thy+God%3B+repent%2C+leave+idols%2C+and+all+sins.+He+worshipped+God+alone%2C+do+you+so%3B+ <blockquote><p>Christianity will indeed accomplish many useful things in this world, but if it is accepted in order to accomplish those useful things it is not Christianity. Christianity will combat Bolshevism; but if it is accepted in order to combat Bolshevism, it is not Christianity: Christianity will produce a unified nation, in a slow but satisfactory way; but if it is accepted in order to produce a unified nation, it is not Christianity: Christianity will produce a healthy community; but if it is accepted in order to produce a healthy community, it is not Christianity: Christianity will promote international peace; but if it is accepted in order to promote international peace, it is not Christianity. Our Lord said: “Seek ye first the Kingdom of God and His righteousness, and all these things shall be added unto you.” But if you seek first the Kingdom of God and His righteousness in order that all those other things may be added unto you, you will miss both those other things and the Kingdom of God as well.</p></blockquote>

<blockquote><p>How few be they in our times, who by observing this distance do declare that they believe the Church to be God’s house, how many that come in without preparing themselves at first by devotion and prayer? How many who clap on their hats when God is speaking to them by his Word, I mean in the time when the very text is reading? Nay the servant who will be uncovered before this master in his own house, will many times be covered before him in God’s house; all which bewrays that many men do either take the Church not to be ‘my house’ [Mt. 21:13], that is, God’s; or (which is worse) God’s house not to be so good as their own.</p></blockquote>

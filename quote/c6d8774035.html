<blockquote><p>III. And the pretense of holiness, or a blind practical zeal, and superstitious religion, both in hypocrites and many honest, ignorant people, has not a little hand in the distractions of Christ’s Church. It was the appearance of more spirituality and strictness which drew Tertullian to the Montanists, and which promoted a great part of the heresies which have torn the Churches. This bore up the cause of the Priscillianists, and of those that Bernard and Cluniacensis so much inveigh against (I suppose Manichees with some better persons mixed). This kept up the Donatists; but above all the Novatians long in great reputation: This was the strength of the Anabaptists in Germany and the Low Countries, as their adversaries confess, says G. Wicelius, Method of Concord, ch. 12, p. 42: Retinctores hac una parte duntaxat sapiunt, tenentes doctrinam Ecclesiae Catholicae [The Re-dyers are wise in this one respect only, in that they hold to the doctrine of the catholic Church], speaking of the necessity of a holy life: This is the strength of the Quakers among us now, and of almost all the separating and censorious sects: And were not so excellent a thing as godliness the motive, abundance of good people durst never have done the great evils which we have seen done in this age, to the great shame of our profession and the sad calamities of Church and State. (And if I myself have formerly in my unexperienced youth, promoted any dividing or unwarrantable ways, it was upon this and the former mistake; which I beg daily of God to discover to me to the full and beg the pardon of the miscarriages which I know and which yet I know not of.) … And if you consider these things following, you will not wonder that mistaken godliness should cause divisions: …

      5. He that mistakingly thinks anything is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him.

      6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes.

      7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. …

      18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct].

      19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.</p></blockquote>

<blockquote><p>$19. 4. Although the [Lord’s] day be wholly to be dedicated to the ends of a sacred rest before insisted on, yet, 1. Duties in their performance drawn out to such a length as to beget wearisomeness and satiety, tend not to edification, nor do any way promote the sanctification of the name of God in the worship itself. Regard, therefore, in all such performances is to be had:

1. Unto the weakness of the natural constitution of some, the infirmities and indispositions of others, who are not able to abide in the outward part of duties, as others can. And there is no wise shepherd but will rather suffer the stronger sheep of his flock to lose somewhat of what they might reach to in his guidance of them, than to compel the weaker to keep pace with them to their hurt, and it may be their ruin. Better a great number should complain of the shortness of some duties, who have strength and desires for a longer continuance in them, than that a few who are sincere should be really discouraged by being overburdened, and have the service thereby made useless unto them. I always loved in sacred duties that observation of Seneca concerning the orations of Cassius Severus, when they heard him, ‘Timebamus ne desineret,’ ‘We were afraid that he would end.’

2. To the spiritual edge of the affections of men, which ought to be whetted, and not through tediousness in duties abated and taken off.</p></blockquote>

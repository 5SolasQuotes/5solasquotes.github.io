<main class="wrap"><figure class="quote" id="q-c4b9695639" data-kw="">
<blockquote><p>Yet God tempers the severity of this spiritual slavery, first inwardly, by certain remaining shards of the divine image and original righteousness (James 3:9): first with respect to wisdom in the intellect, when he leaves to it certain principles of truth, through which man’s judgment, both theoretical and practical, is directed, the prior through the knowledge of what is speculatively true and false, for example, that God exists, and so forth, which we observed in all people who are not thoroughly demented (Rom. 1:19–21, 32; 2:14–15), but the latter through the knowledge of what is upright and fair, and what is unfair, for example, that God must be worshipped, that to each must be rendered his own, that to another must not be done what you do not want done to yourself (Rom. 2:15), from which things the natural conscience receives some force (Rom. 2:15). Then with respect to some inclination and propensity to good in the will, one that is indeed frail and dead, but yet not absolutely non-existent, and indeed such a one as that at least the appearances of virtues are approved and honored by all (2 Tim. 3:5). In addition to these things, with regard to both intellect and will, there is, internally, restraining grace, by which sin itself is not removed or diminished, but its action is curbed so that it would not burst its restraint, a grace also by which the more upright at least abhor more atrocious sins (1 Cor. 5:1); then externally, through certain political, ecclesiastical, economic, and academic remedies, by which in some measure the license of sin is restrained, and indeed there is added a stimulus to perform upright deeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), vol. 3, bk. 4, ch. 4, ‘The Penalty of Sin’, section 12</cite>, p. 528</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a82b885b5" data-kw="">
<blockquote><p>When God (Deut. 17) forbids them [Israel] to choose a stranger [as king], He presupposes they may choose a stranger; for God’s law now given to man in the state of sin, presupposes he has corruption of nature to do contrary to God’s law. Now if God did hold forth that their setting a king over them was but the people’s approving the man whom God shall both constitute and design to be king, then he [John Maxwell] should presuppose that God was to design a stranger to be the lawful king of Israel, and the people should be interdicted to approve and consent that the man should be king whom God should choose; for it was impossible that the people should make a stranger king (God is the only immediate king-creator), the people should only approve and consent that a stranger should be king; yet, upon supposition that God first constituted and designed the stranger king, it was not in the people’s power that the king should be a brother rather than a stranger, for if the people have no power to make a king, but do only approve him or consent to him, when he is both made and designed of God to be king, it is not in their power that he be either brother or stranger, and so God commands what is simply impossible.</p></blockquote>

<blockquote><p>…for as the love of Christ, our prayers, humility, are not formally sins, but only concomitantly, in regard that sin adheres to them, as muddy water is not formally clay and mud, but in mixture it’s clay and muddy, so our faith is concomitantly sinful; both because often it’s weak, and so wanting [lacking] many degrees and mixed with sin, deserves a curse, as well as works of sanctification, but it apprehends Christ and righteousness in Him and so it bottoms our assurance.</p></blockquote>

</figure><figure class="quote" id="q-636552f25c" data-kw="">
<blockquote><p>They say natural or physical necessity takes away liberty, but moral necessity does not; at the same time, they explain moral necessity so as to make it truly physical or natural.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 116-17 in Lectures of Divinity, Lecture 13, ‘Of the Decrees of God’, in Works (d. 1794), vol. 8</cite></span></figcaption>

</figure><figure class="quote" id="q-6428ca8b93" data-kw="">
<blockquote><p>As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions</cite>, sect. 7, p. 101</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.”

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, sect. 7, p. 101">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+all+other+sins+which+we+call+actual%2C+they+are%2C+as+I+said%2C+natural+only%2C+and+not+supernatural%3B+and+therefore+no+man+wants+%5Blacks%5D+liberty%2C+as+to+do+them%2C+so+to+abstain+from+them%3B+Only+he+wants+a+moral+and+spiritual+liberty+to+abstain+from+them+in+a+gracious+manner%2C+according+to+that+of+Aquinas+%28Summa%2C+pt.+1%2C+q.+23%2C+art.+7%2C+to+the+3rd%29%3A+Licet+aliquis+non+possit+gratiam+adipisci+qui+reprobatur+a+Deo%2C+tamen+quod+in+hoc+peccatum+vel+illud+labatur%2C+ex+ejus+libero+arbitrio+contingit.+Though+a+man+who+is+reprobated+of+God+cannot+obtain+grace%2C+yet+that+he+falls+into+this+or+that+sin%2C+it+comes+to+pass+of+his+own+free+will.+It+is+true+also+even+in+God%E2%80%99s+providence+concerning+acts+natural%2C+there+is+a+great+mystery.+For+as+God+foretold+David+that+his+neighbor+should+lie+with+his+wives+%282+Sam.+12%3A11-12%29%3B+and+though+he+sinned+secretly%2C+yet+the+Lord+would+do+this+openly.+So+he+foretold+that+upon+that+altar+which+Jeroboam+erected%2C+a+child+that+should+be+born+of+the+house+of+David%2C+Josiah+by+name%2C+should+burn+the+prophets%E2%80%99+bones.+And+that+Cyrus+also+should+build+him+a+city+and+let+go+his+captives.+%281+Kn.+13%3A2%3B+Isa.+45%3A13%3B+Ezra+1%3B+2+Kn.+23%3A16%3B+2+Sam.+16%3A22%29+Yet+who+doubts+but+that+Cyrus+did+freely+deliver+the+Jews+out+of+Babylon%3F+and+Josiah+did+as+freely+burn+the+prophets%E2%80%99+bones+upon+the+altar+in+Bethel%2C+as+ever+they+did+%5Bany%5D+action+in+their+lives%3F+So+Absalom+did+as+freely+defile+his+father%E2%80%99s+concubines.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29%2C+bk.+2%2C+An+Examination+of+Certain+Passages+inserted+into+Mr.+Hord%E2%80%99s+Discourse%2C+Answer+to+the+Additions%2C+sect.+7%2C+p.+101&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6428ca8b93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6428ca8b93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/#:~:text=As%20for%20all%20other%20sins%20which,as%20freely%20defile%20his%20father%E2%80%99s%20concubines&amp;text=As%20for%20all%20other%20sins%20which%20we%20call&amp;text=Absalom%20did%20as%20freely%20defile%20his%20father%E2%80%99s%20concubines" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-43ae23943d" data-kw="">
<blockquote><p>Reformed Christians have often been divided on whether or not the apostle Paul was referring to Nero in Romans 13. The Revd Samuel Simms of Loughbrickland Reformed Presbyterian Church answered in the negative (arguably, Simms goes too far in some things that he says, though we agree that the passage does not refer to Nero as a persecuting tyrant):

The Seceding view is based, I am fully persuaded, on a misinterpretation of Rom. xiii. 1-7. That passage states that there is “no power but of God.” What does the Seceder say of this? He says, that every power that exists is of God! What does the Covenanter say of it? He says that if a power is not a God-power, it is no power, but a tyranny? …

Let us read the passage in dispute. What sort of a power does Paul describe? Seven things are said about it. (1) It is not a terror to good works. (2) It is a terror to the evil. (3) It praises what is good. (4) It is (or he is) the minister of God for good. (5) It (or he) beareth not the sword in vain. (6) It (or he) is a revenger to execute wrath upon him that doeth evil. (7) Men are to be subject to it (or to him) for conscience sake.

Now, can all this be applied to Nero? Of course, it cannot. Nero was a monstrous butcher, who murdered his own mother and his own wife, and who made flambeaux of the Christians to illuminate his gardens: how could he be the minister of God for good to men? How could Elagabalus, acting the tom-fool the whole day long among his Syrian dancing wenches, be the minister of God for good to men? Ah, no; it may not be, it cannot be, that such a precious gem as Rom. xiii. 1-7, should be allowed to sparkle on the harlot brow of the selfish, cruel, monstrous, Divine Right theory!

But again – how will the notion of Seceders, that the government of Nero was just as much an ordinance of God as was that of David, the man after God’s own heart, agree with other portions of the Divine Word? In Hosea viii. 4, it is stated – “They have set up kings, but not by me: they have made princes, and I knew it not.” In Ezek. xxi. 27, we have the threat – “I will overturn, overturn, overturn it,” &amp;c.; but on the existence theory principle, how can we acquiesce in this decision or turn this prediction into a prayer; for the power to be overturned was, on Seceding principles, as much the ordinance of God as any other power that could be! It is well known that the fox is a cunning and destructive animal; and yet, the Omniscient Redeemer, plainly and bluntly, called Herod “that fox” (Luke xiii. 32). The Apostle Paul calls the Roman magistrates at Corinth, “the unjust;” now, if they were the unjust at Corinth, how could they be the ordinance of God for good to man at Rome?

And once more; are not Christians commanded to wrestle “against the rulers of the darkness of this world, against spiritual wickedness in high places?” Who are “rulers of the darkness of this world?” Evil angels, of course, primarily; but undoubtedly also, wicked rulers who legislate by evil or satanic principles. It is not, therefore, true as Seceders virtually teach, that “whatever is is right,” as regards civil government. No, for we must take unto ourselves the whole armour of God and fight manfully against all devilish principles in high places; and this we are to do, not by swearing to devilish principles, nor by voting for men to swear to support devilish principles; but by taking up a position of manful, peaceable, but determined protest and dissent with regard to all devilish principles.</p></blockquote>

<blockquote><p>No adventitious circumstance can equitably be made a qualification for the enjoyment of political rights. Such for example as property, or the color of a man’s skin! These do not confer upon their possessors either peculiarity of claim or fitness for the exercise of political rights. Property does not make a man either wiser or better: nor does the color of his skin or the shade of his complexion. An aristocracy based on the principle of education and mental superiority would be perfect wisdom in comparison of an aristocracy based on the principle of property or of color! This is so intuitively evident that I am afraid the man who docs not admit it as a first principle in the science of government is not to be convinced by argument, nor reached by any conclusion however legitimately drawn from the principles of equity.

The pretence that property gives its possessor a greater interest in the welfare of a state, and therefore a right to greater weight and influence in the government, is too superficial to satisfy any one, except such as are in possession of the assumed qualification, or those whose prejudices are enlisted already in its favor. […]

It is impossible to establish the equity of imposing taxation upon a citizen, and at the same time deny him the right of elective suffrage; thus subjecting him to the operation of laws which he has no power, directly or indirectly, of making. The fact that a man is to be made the subject of a law, is a sufficient reason on grounds of equity why he should have a voice in making that law; unless he may be disqualified by vice or by incompetence. But keeping out of view such exceptions as are necessary to preserve equity, and secure the objects for which civil society has been instituted, justice requires that every man should have a right to say by what laws he is to be governed, irrespective of any adventitious circumstance. Property furnishes no security to society that political rights will be properly exercised. A poor but virtuous man may take a deeper interest in the welfare of the state than his rich but wicked neighbor; and will most certainly promote its welfare incomparably more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 247-9.</span></figcaption>

<blockquote><p>2. Elections of governors would be performed as in the sight of God, and, in my weak apprehension, the person coming nearest to God’s judge, fearing God, hating covetousness, and to Moses’ king (Deut. 17), one who shall read in the book of the law; and it would seem now that gracious morals are to us instead of God’s immediate designation.

— Samuel Rutherford, Lex Rex, ... (1644; Edinburgh: Ogle, 1843), p. 44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Elections+of+governors+would+be+performed+as+in+the+sight+of+God%2C+and%2C+in+my+weak+apprehension%2C+the+person+coming+nearest+to+God%E2%80%99s+judge%2C+fearing+God%2C+hating+covetousness%2C+and+to+Moses%E2%80%99+king+%28Deut.+17%29%2C+one+who+shall+read+in+the+book+of+the+law%3B+and+it+would+seem+now+that+gracious+morals+are+to+us+instead+of+God%E2%80%99s+immediate+designation.+3.+The+genuine+and+intrinsical+end+of+making+kings+is+not+simply+governing%2C+but+governing+the+best+way%2C+in+peace%2C+honesty%2C+and+godliness+%281+Tim.+2%29%2C+therefore%2C+these+are+to+be+made+kings+who+may+most+expeditely+procure+this+end.+Neither+is+it+my+purpose+to+make+him+no+king+who+is+not+a+gracious+man%2C+only+here+I+compare+title+with+title.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa623de481.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa623de481.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-civil-voting/#:~:text=2.%20Elections%20of%20governors%20would%20be,here%20I%20compare%20title%20with%20title&amp;text=2.%20Elections%20of%20governors%20would%20be%20performed%20as&amp;text=man%2C%20only%20here%20I%20compare%20title%20with%20title" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>From whence we take the freedom to entreat you for God’s sake, strictly to inspect into vocations and employments, that they be not mixed nor confounded to the detriment both of the one and other. The ministerial function is expressly limited by the Word of God as to its laws, ends, means and actings, it being altogether different from, yea and totally contrary to the secular government; And we conceive that there is no such difficulty in the matter, but that ministers may be kept within the inviolable bounds of their most holy calling, and yet be useful unto the public without glorying in those little arts of subtilties and surprisals, which abutt at no other mark than temporal and carnal profit. Besides that ’tis a very rare thing to find a man capable both of the one and other calling, there is this grand mischief in it, that flesh and blood seeing in the holy ministry nothing but what is mean and humble, despicable, and painful, difficult and dangerous, and contrariwise meeting in the management of secular affairs with food and fuel enough for pride, ambition and covetousness (the ground of all envies and jealousies), and with the means and helps to carry on designs of self-advancement and domination, as tricks, craft and dissimulation; It will be almost impossible to hinder the spreading of this contagion, which creeps insensibly into the greatest wits, and seizes upon them at unawares, and not as an affected and approved vice. We know very well, that necessity, the law of the present day, is pleaded and urged on behalf of this practice, too too much in use among you to vindicate and justify it. But for God’s sake, most dear brethren, we beseech you to consider, whether it were not better that your temporal affair should suffer some inconveniencies, than your spiritual ones to be contaminated; And whether the great risk you run in ruining and depraving your pastors should be preferred unto your temporal interests. And whether it were not better to have a reserve among you of some pure and savory salt against the general corruption, rather than to hazard all in this universal overthrow by the world, upon which theater we see the most valiant champions to be foiled. If the necessity be absolute, peremptory and indispensable, then let them go about such secular political affairs with regret and grief, troubled at their enforced distraction from their heavenly calling, lamenting as the spouse in the Canticles that they have made me the keeper of the vineyard, but mine own vineyard have I not kept. Let them go, but then only, when your businesses are in extreme danger, as it were at the last gasp, when you need the greatest circumspection, a most immovable fidelity, and unchangeable integrity, and without any affectation or introduction of ambition, or hidden, disguised interests. No man going to war entangles himself with the world, that so he may the better please his Captain that has listed him. That commination is very dreadful, the priest shall be as the people, and that lamentation exceeding doleful, All this evil and mischief is from the prophets, and the stones of the sanctuary are lying at the four corners of the streets. Let us, most dear and honored brethren, give up and resign ourselves to the conduct of true wisdom, speaking to us from the Word of God, which is, to forsake our own. This also, most honored brethren should be endeavored, that all persons whatsoever in the ministry, when called forth unto those secondary employments of the Church, do retain in their deportments and conversations the marks and characters of their first and most sacred vocation. Let their devotion, piety, gravity, self-denial, and sequestration from worldly pleasures, used with too great a liberty by many Christian statesmen serve to maintain the sweet odor and reputation of our Church government, and to keep up inviolably the authority of their most holy ministry, and to bind the souls and consciences of men by religious humility to an everlasting dependance on the majesty of their great Lord, whose holiness and sovereign wisdom shines forth most resplendently in the order of his service, as the Queen of Sheba saw and admired it in the Court of Solomon. Impiety and impudence are too much in vogue everywhere. But let the sanctuary, the Church of God be at least the receptacle and habitation of true and unfeigned piety, where it may act and breath freely at in the open air, with an uplifted countenance, in a courageous demonstration of the Spirit, and evidence of Truth, convincing and condemning the unfruitful works of darkness, and awakening with its bright shining flambeau the drowzy consciences of a perverse generation, it may encourage the faithful unto perseverance, and preserve the remnant of Jacob in this day of dispersions and desolations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, pp. 441-42</span></figcaption>

<blockquote><p>If it be said, that God hath forbidden such a forcible resistance by Rom. 13. 1, 2, 3. or the like Scriptures, then it must be affirmed that the Parliament are not the higher powers, which Dr Ferne granteth: for if the Parliament come within the compass of those words (higher Powers) then that Scripture Rom. 13. doth not reach them, but rather requires others to be obedient to them; yea, if by the higher powers is understood only the King, then the two Houses may not make any forcible resistance against any petty Constable that comes in the K[ing’s] authority to do violence to the two Houses.

Surely therefore this and the like Scriptures are much abused, the meaning being only to command obedience to authority in all things that tend to the encouragement of good, and punishment of evil; and therefore there is such a power in the subjects, both by the law of nature, and constitution of the kingdom, to take up Arms when the State or two Houses express it; notwithstanding the expression of any one man to the contrary.</p></blockquote>

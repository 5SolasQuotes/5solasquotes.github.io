<main class="wrap"><figure class="quote" id="q-3b1b27c588" data-kw="">
<blockquote><p>Hence forth will I now touch certain points what I would have in your common assemblies observed and kept, and what I would were avoided, that in them nothing be done either unorderly, or contentiously, or riotously… One thing more must I tell you, which is yet of no great importance, nor [is] much weighty, but such as may, if the time and place so require, be changed… Lesse hurt were it, if ye in such points agreed, since they be but externe matters, nor make so much to the furtherance of Gospel-like godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus.html">Erasmus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Tome or Volume of the Paraphrase of Erasmus upon the New Testament</cite>, … (London, 1549), on 1 Cor. 11, pp. xxx-xxxi</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-023d25eed8" data-kw="">
<blockquote><p>…but he [Paul] says that the church has no such custom as that any man should be contentious, but rather that all should preserve the common peace. But if any one be contentious, he is a stranger to the church of God… he says, that the churches of God have no custom of allowing any man to be contentious. Thus he represses contentious spirits by the authority of the church, and does not confirm the dogma by mere custom. Now that custom of avoiding contention in the church is abundantly sanctioned by testimonies of scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, (1588; Cambridge: Parker Society, 1849), p. 559</span></figcaption>

</figure><figure class="quote" id="q-fa459e7ca9" data-kw="">
<blockquote><p>But their [the Independents’] main difference from all the Reformed, and greatest consonancy with the Brownists [separatist Independents], is in this, that as they teach all outward signs of worship in the time of the celebration to be idolatry [such as the societal customs the Scots practiced], and hereupon declare the necessity of all men who will follow the example of the first communicants, to keep on their hats all the time of this holy action; so likewise the Independents begin to teach their disciples; For however at Amsterdam this day the named doctrine be not fully practiced, the men there covering their heads in the time of the celebration, but every one uncovering, during the time of their own personal participation of the elements, yet we are now taught at London that covering is most requisite at the time of participation. That this act is a rite significant to the communicants of their table-honor and fellowship with Christ, also that the minister in all his celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, [who are] sitting covered when they eat of their Father’s meat.† † I have heard some of their chief men discourse publicly enough to this purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (London, 1645) | ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122 &amp; 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“But their [the Independents’] main difference from all the Reformed, and greatest consonancy with the Brownists [separatist Independents], is in this, that as they teach all outward signs of worship in the time of the celebration to be idolatry [such as the societal customs the Scots practiced], and hereupon declare the necessity of all men who will follow the example of the first communicants, to keep on their hats all the time of this holy action; so likewise the Independents begin to teach their disciples; For however at Amsterdam this day the named doctrine be not fully practiced, the men there covering their heads in the time of the celebration, but every one uncovering, during the time of their own personal participation of the elements, yet we are now taught at London that covering is most requisite at the time of participation. That this act is a rite significant to the communicants of their table-honor and fellowship with Christ, also that the minister in all his celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, [who are] sitting covered when they eat of their Father’s meat.† † I have heard some of their chief men discourse publicly enough to this purpose.”

<blockquote><p>That either in Scotland, or anywhere else in the world, the hair of any person is commanded to be cut by any Church judicatory, for disgrace and punishment, is (as I take it) but a foolish fable.</p></blockquote>

</figure><figure class="quote" id="q-3256f8381d" data-kw="">
<blockquote><p>…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (d. 1656; 1660), ‘The Women’s Vail: or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… upon 1 Cor. 11:10, Occasioned by an offence unjustly taken at a Modest Dress’, p. 237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

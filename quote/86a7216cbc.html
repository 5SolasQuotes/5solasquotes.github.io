<main class="wrap"><figure class="quote" id="q-86a7216cbc" data-kw="">
<blockquote><p>But I answer, [1.] the king as king has dominion-civil of places and times, as places and times, but not of places as sacred in use, and of times as sacred and religious: for his power in Church matters being accumulative, not privative [depriving], he cannot take away a house dedicated to God’s service no more than he can take away maintenance allotted by public authority upon hospitals, schools, doctors and pastors. God has here a sort of propriety of houses and goods as men have. Places as sacred-abused are subject to regal power; he may inhibit conventions of heretics. 2. The apostles might preach in the Temple, though civil authority forbid them. 3. Kings are as much lords of places as sacred and public, as they have a dominion of civil places, in respect the king may by coactive [coercive] power hinder that false and heretical doctrine be preached, either in public, or private places, for this he ought to do as a preserver of both Tables [of the Law] and a bearer of the sword for the good of religion; and if they may command pure doctrine to be preached, and sound discipline to be exercised, they may command the same to be done in public places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 430-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-612767d253" data-kw="">
<blockquote><p>It is their [the magistrates’] duty therefore to remove all such things for which, as is before showed, the Lord sends the pestilence and other grievous diseases; they must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9): for it is greatly to be feared that there be many which never consider what are, or may be, the causes of any calamity, nor seek any means how to pacify God. The magistrates also at such times must make good laws and see them faithfully executed. They must remove all disorders whereby God has been offended, they must punish and suppress the wicked which are indeed the very botches and sores, and contagion of the commonwealth. They must as David speaks of himself ‘destroy betimes all the workers of iniquity, and cut off the wicked from the city of the Lord’ (Ps. 101:8). They must also have a diligent care to remove such things which impoverish the country, as wicked gaming, luxuriousness in meat, drink and apparel, and such like. Such [consuming] caterpillars must be looked unto before all be consumed, for then it will be too late to spare when such devourers have swallowed up all after such manner, and then must men be put to many very wicked shifts to maintain their [immoral] bravery and to feed their greedy paunch, whereof we have lamentable experience at this day. For what is the cause of such robbing and spoiling both by land and sea, and of such horrible oppression and extortion everywhere but only this, that men having been long acquainted with bravery and dainty morsels, can hardly forego it, they had rather put a thousand wicked shifts in practice, yea they had rather hazard their lives everyday than that they would abate anything of their stately port, which under a show of wealth and great substance (although but being beggars indeed) they have long maintained, and from hence has sprung all kind[s] of cousonage and devilish deceit, whereby men overreach one another daily in their bargains and contracts. In times past they had good laws, even among the heathen people, to bridle all idle expenses and such as lavished their goods willfully. It were to be wished that such laws were now in use to take away the wonderful prodigality of this time. Usurers also, brokers, badgers and hucksters, and such like locusts that eat up the poor and cause the markets to be inhaunted [infrequented] should be bridled to the end [that] the poor may have things better cheap, and to the end [that] magistrates may perform these things and all other duties that belong unto them in time of war, pestilence and famine. … …The common treasure of cities also must sometimes serve for the relieving of the poor, which thing has been done in many famous cities, etc., it were far better that it should be so employed, than as it is many times upon feasting and vain shows… These things, therefore, if magistrates carefully perform, they shall offer an acceptable sacrifice to God, as David did at this time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cupper.html">William Cupper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 341-47 of Sermon 10 in Certain Sermons Concerning God’s Late Visitation in the City of London and other parts of the land, teaching all men to make use thereof, that mean to profit by God’s fatherly chastisements… (London, 1592)</span></figcaption>

</figure><figure class="quote" id="q-e46c98e15d" data-kw="">
<blockquote><p>Can there be any more willing to help us than Christ? whose whole head was sick, and whose heart was heavy for our sakes? yea, in whose body, from the sole of the foot to the crown of the head, was nothing but wounds and swellings, and sores? but alas this was nothing to that He suffered for our sakes. He was compassed about with fears and horrors, till his sweat was drops of blood, and his bones bruised in the flesh: he was whipped, and scourged, and chastised with sorrows, till He cried out in the bitterness of his soul: ‘O Lord, if it be possible let this cup pass from Me.’ The heavy hand of God was so grievous upon Him, that it bruised his very bones and rent his reigns asunder: he could find no health in his flesh, but was wounded, yea, wounded to the death, even the most bitter death upon the cross. His tender fingers were nailed to the cross, his face was wrinkled with weeping and wailing, his sides embrued and gored with his own blood. spurting and gushing fresh from his ribs, the shadow of death was upon his eyes. O what grief could be like to this, or what condemnation could be so heavy, since there was no wickedness in his hands? since He was the brightness of his father’s glory, and the son of righteousness that shined in the world: as to see his days at an end, to see such throbing, sighs, and careful thoughts (without cause of his) so deeply engraven in the tables of his breast. But was this all? No my brethren, since his excellency was such above all creatures, that the world was not worthy to give Him breath, it was a greater grief unto Him, to see Himself made a worm and not a man, a shame of men, and contempt of the people; to see his life shut up in shame and reproaches, how could it but shake his bones out of joint, and make his heart melt in midst of his bowels: who was ever so full of woe? and whoever been brought so low into the dust of death? upon whom did the malice of Satan ever get so great a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Can there be any more willing to help us than Christ? whose whole head was sick, and whose heart was heavy for our sakes? yea, in whose body, from the sole of the foot to the crown of the head, was nothing but wounds and swellings, and sores? but alas this was nothing to that He suffered for our sakes. He was compassed about with fears and horrors, till his sweat was drops of blood, and his bones bruised in the flesh: he was whipped, and scourged, and chastised with sorrows, till He cried out in the bitterness of his soul: ‘O Lord, if it be possible let this cup pass from Me.’ The heavy hand of God was so grievous upon Him, that it bruised his very bones and rent his reigns asunder: he could find no health in his flesh, but was wounded, yea, wounded to the death, even the most bitter death upon the cross. His tender fingers were nailed to the cross, his face was wrinkled with weeping and wailing, his sides embrued and gored with his own blood. spurting and gushing fresh from his ribs, the shadow of death was upon his eyes. O what grief could be like to this, or what condemnation could be so heavy, since there was no wickedness in his hands? since He was the brightness of his father’s glory, and the son of righteousness that shined in the world: as to see his days at an end, to see such throbing, sighs, and careful thoughts (without cause of his) so deeply engraven in the tables of his breast. But was this all? No my brethren, since his excellency was such above all creatures, that the world was not worthy to give Him breath, it was a greater grief unto Him, to see Himself made a worm and not a man, a shame of men, and contempt of the people; to see his life shut up in shame and reproaches, how could it but shake his bones out of joint, and make his heart melt in midst of his bowels: who was ever so full of woe? and whoever been brought so low into the dust of death? upon whom did the malice of Satan ever get so great a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?”

<blockquote><p>2. And you will hinder the great benefit which the world may get, by their vain attire: For (though it be no thanks to them that intend it not) yet it is a very great commodity that comes to mankind by these people’s sin: that fools should go about in fools-coats, and that empty brains, and proud and wanton hearts should be so openly detected in the streets and churches: that sober people may avoid them; and that wise, and chaste, and civil people may not be deceived by such in marriage to their undoing: As the different clothing of the different sexes is necessary to chastity and order; so it is a matter of great convenience in a commonwealth, that sots, and swaggerers, and phrenetics, and Idiots, and proud, and wanton lustful persons should be openly distinguished from others: As in a plague-time the doors of infected houses are marked with a ‘Lord have mercy on us’: And the wisest magistrate knew not how to have accomplished this himself by a law, as the wretches themselves do by their voluntary choice: For if it were not voluntary, it would be no distinguishing badge of their profession. Now for any honest civil people to join with them and take up their livery, and the habit of their Order, is to profess themselves such as they, and so to encourage and approve them, or else to confound the proud and humble, the vain and the sober, the wanton and the chaste, and destroy the benefit of distinction.</p></blockquote>

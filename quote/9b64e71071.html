<main class="wrap"><figure class="quote" id="q-9b64e71071" data-kw="">
<blockquote><p>Wherefore, since the Word Himself has come to us from heaven, we need not, I reckon, go any more in search of human learning to Athens and the rest of Greece, and to Ionia. For if we have as our teacher Him that filled the universe with His holy energies in creation, salvation, beneficence, legislation, prophecy, teaching, we have the Teacher from whom all instruction comes; and the whole world, with Athens and Greece, has already become the domain of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-alexandria.html">Clement of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exhortation to the Heathen</cite>, (c. 195), 11 in Ante-Nicene Fathers, 2: 203.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3ba685ad66" data-kw="">
<blockquote><p>The fourth commandment corresponds to the transition from heaven to earth. That is, it enjoins sabbath observance as first of all a responsibility to God, and in this sense involves heavenly responsibility. But it also involves responsibilities downward to other human beings, sons, daughters, servants, aliens and even animals (Exodus 20:10). Because it involves observance of a periodic seven-day pattern, and because the pattern of day and night is controlled by the heavenly bodies (Genesis 1:14), it also reminds us of Israel’s relation to the visible heavens as the good creation of God. Thus it corresponds in some ways to the Holy Place, where the seven lamps correspond to the light of seven days of the week. It forms a transition between the invisible heavens of the Most Holy Place and the earthly space of the tabernacle courtyard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vern-s-poythress.html">Vern S. Poythress</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Christ in the Law of Moses</cite>, (Phillipsburg NJ: P&amp;R, 1991), p. 91.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-5052115699" data-kw="">
<blockquote><p>It is therefore a great practical doctrine—that Jesus is not simply a Redeemer from sin, but the Founder and Head of a Kingdom. He has not only taught men a system of opinions concerning God, but instituted also, and rules over, a community. He hath given not simply a precept to be obeyed—a rule for the government of life—an opinion to be held by each individual separately—the body of his followers, like those of Socrates or Plato, combining merely by accidental agreement in opinion: far beyond all this.

He hath constructed a Society; his followers are made members of a community with new social relations. To believe in Jesus is not merely the adoption of an opinion. The very act of faith whereby his followers receive his doctrine, unites them also to Him as members of his mystical body, and through Him to one another. They become a combination of men who are members of one spiritual body—brethren of one holy family. And this is the Kingdom of Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855</cite>, (New York: Edward O. Jenkins, 1855), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

ner" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4ad15fa0e7" data-kw="">
<blockquote><p>Heaven is that place alone where is to [be] obtained our highest end, and highest good. God hath made us for himself: “of God, and through God, and to God are all things” (Romans 11:36). Therefore then do we attain to our highest end, when we are brought to God. But that is by being brought to heaven, for that is God’s throne; that is the place of his special presence, and of his glorious residence. There is but a very imperfect union with God to be had in this world: a very imperfect knowledge of God in the midst of abundance of darkness, a very imperfect conformity to God, mingled with abundance of enmity and estrangement. Here we can serve and glorify God but in an exceeding imperfect manner, our service being mingled with much sin and dishonouring to God.

But when we get to heaven, if ever that be, there we shall be brought to a perfect union with God. There we shall have the clear views of God’s glory: we shall see face to face, and know as we are known [1 Corinthians 13:12]. There we shall be fully conformed to God, without any remains of sin: “we shall be like him; for we shall see him as he is” [1 John 3:2]. There we shall serve God perfectly. We shall glorify him in an exalted manner, and to the utmost of the powers and capacity of our nature. Then we shall perfectly give up ourselves to God; then will our hearts be wholly a pure and holy offering to God, offered all in the flame of divine love.

In heaven alone is attainment of our highest good. God is the highest good of the reasonable creature. The enjoyment of him is our proper happiness, and is the only happiness with which our souls can be satisfied. To go to heaven, fully to enjoy God, is infinitely better than the most pleasant accommodations here: better than fathers and mothers, husbands, wives, or children, or the company of any or all earthly friends. These are but shadows; but God is the substance. These are but scattered beams; but God is the sun. These are but streams; but God is the fountain. These are but drops; but God is the ocean.

Therefore, it becomes us to spend this life only as a journey towards heaven, as it becomes us to make the seeking of our highest end, and proper good, the whole work of our lives; and we should subordinate all the other concerns of life to it. Why should we labour for anything else, or set our hearts on anything else, but that which is our proper end, and true happiness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Christian’s Life a Journey Towards Heaven</cite>, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.</span></figcaption>

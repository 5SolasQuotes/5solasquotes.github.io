<blockquote><p>First, we need to keep in mind the Fregean point that a difference in sense does not entail a difference in reference. To use Frege’s famous example, the sense of the expression “the morning star” is different from the sense of the expression “the evening star.” But these two expressions refer to one and the same thing, viz. the planet Venus. Similarly, expressions like “the God of the Christians” and “the God of the Muslims” differ in sense, but it doesn’t follow from that alone that they don’t refer to the same God… Second, even a speaker’s erroneous beliefs don’t entail that he is not referring to the same thing that speakers with correct beliefs are referring to… Similarly, the fact that Muslims have what Christians regard as a number of erroneous beliefs about God does not by itself entail that Muslims and Christians are not referring to the same thing when they use the expression “God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Christians, Muslims &amp; the Reference of ‘God”</cite>, (2015) 40 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

<blockquote><p>Whether a prince or magistrate may tolerate Jews in his city or province? Three things may be considered in the Jews. First, the sect and Jewish exercise. Second, usury. Third, hatred toward Christians. All these are evil and prohibited. The question is therefore whether a prince or magistrate may permit or tolerate these evils; and what may be a legitimate cause for permitting and tolerating them? I answer through the following conclusions: First Conclusion. A magistrate may permit the rites and exercises of the Jews if a sufficient cause is present. The Pope of Rome does this, as do many princes in their provinces. The cause may be threefold. First, that through Jewish rites the Christian truth may be shadowed forth and confirmed: St. Augustine, Of the City of God, bk. 18, ch. 46 and St. Thomas in pt. 2 of 2, quest. 10, art. 11, approve this cause. Second, that Jews who practice their rites and understand from the Christians among whom they dwell that those rites were merely shadows and figures of the Christian religion may more easily be converted to the Faith of Christ. St. Thomas, in the cited place, also approves this. Third, that Christian princes or magistrates, under the pretext of permission, may receive money and other gifts from the Jews to whom they permit the exercise. This is not lawful. For public sins, by which God is offended, cannot be permitted for the sake of temporal gain alone, which is hoped for from the permission. Second Conclusion. A magistrate may permit the usuries of the Jews if a sufficient cause is present. The Pope and other Christian princes also do this. The cause may be twofold. One, to prevent a greater evil. For if, as I said above, usuries were not permitted, many thefts, robberies, oppressions of the poor and similar inconveniences would occur. Therefore, to avoid these evils, usuries may be permitted as a lesser evil. The other, that Christian princes and magistrates who permit the usuries of the Jews may be participants in the profit. This is not lawful. For it is certain that usury is prohibited by natural and divine law; and the profit that is acquired through usury is mere theft. Just as, therefore, the Jews sin against justice by receiving usurious profit, so do the Christians who are participants in that profit. They are considered to be participants, however, when they permit usuries for the purpose of being able to receive profit therefrom. This conclusion must be limited in two ways: First, that common usuries may be permitted which do not exceed the profit permitted by law and custom, but not exorbitant usuries, of which I shall speak shortly. Second, that a Christian magistrate may not receive profit from usuries on account of the mere permission of usuries: although they may receive it under another title. And indeed under a double title: First, the title of punishment; because he may punish the Jews on account of usuries; and the profit that has been unjustly acquired from usuries he may either restore to its owners or convert to public utility. Then, the title of exaction; because he may exact an annual tribute or tax from the Jews, not by reason of the permission of usuries, but by reason of the granted habitation in a Christian place. Third Conclusion. A Christian magistrate or prince cannot with a good conscience permit or leave unpunished the hatred of Jews toward Christians. Note: Hatred is twofold: The one is internal; because since it is hidden, the magistrate cannot punish it. The other is external, which breaks out into open injury. This ought to be coerced by the magistrate. We say, therefore, that such hatred, when it is exercised by Jews against Christians, can in no way be permitted or tolerated, but must be severely punished: and the prince sins gravely if he does not punish those who commit offenses. The reason is that a prince is bound by his office to punish every public injury, if he is able, so that justice may be preserved: therefore, he is also bound to punish the injury which the Jews commit against Christians. This is, indeed, manifold: First, because they exact immoderate and intolerable usury from citizens, country folk, and the poor. Whatever they exact beyond the principal is theft. Therefore, they commit intolerable theft. Second, by exacting such usury, they harm the republic or the community greatly. For a republic cannot stand or flourish when the people are oppressed and exhausted by usury. Third, besides usury, another injury is added. For whatever is for sale in the market, the Jews snatch away from the Christians by offering a higher price to the sellers than other buyers are accustomed to offer; and afterwards, which is most iniquitous, Christians are forced to pay double the price to the Jews if they wish to buy what is necessary for feeding their families. Fourth, so that they may do all these things with impunity, they distribute gifts to the officials of princes so that they may be protected by them. Fifth, from this it happens that the people, who bear such injuries with difficulty, become prone to inciting sedition, both against the Jews themselves and against their defenders and patrons. Against the Jews, indeed, because they are thieves and plunderers; against the patrons, because they are partners of thieves and plunderers. If a prince or magistrate does not prevent or punish these great evils (to say nothing of the rest), he is a participant in the crime and is bound to restitution. He can, however, prevent them in three ways. First, if he expels the Jews entirely from his province or city. Second, if he does not indeed expel them, but forces them to agriculture, or to mechanical arts, or to exercise other works; and does not allow them to live in idleness and luxury, as they now live. Third, if he deprives them of all the money and wealth which they have received through usury. Would that these things were brought into practice. You will say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Manual of Controversies of this Time</cite>, (Wurzburg, 1623), bk. 5, ch. 18, ‘Is a prince or magistrate able to tolerate Jews in his city or province?’ tr. AI by The Faith Received Becanus (1563–1624) was a Dutch-born, Roman Catholic, Jesuit priest, known as a theologian and controversialist.</span></figcaption>

+The+other+is+external%2C+which+breaks+out+into+open+injury.+This+ought+to+be+coerced+by+the+magistrate.+We+say%2C+therefore%2C+that+such+hatred%2C+when+it+is+exercised+by+Jews+against+Christians%2C+can+in+no+way+be+permitted+or+tolerated%2C+but+must+be+severely+punished%3A+and+the+prince+sins+gravely+if+he+does+not+punish+those+who+commit+offenses.+The+reason+is+that+a+prince+is+bound+by+his+office+to+punish+every+public+injury%2C+if+he+is+able%2C+so+that+justice+may+be+preserved%3A+therefore%2C+he+is+also+bound+to+punish+the+injury+which+the+Jews+commit+against+Christians.+This+is%2C+indeed%2C+manifold%3A+First%2C+because+they+exact+immoderate+and+intolerable+usury+from+citizens%2C+country+folk%2C+and+the+poor.+Whatever+they+exact+beyond+the+principal+is+theft.+Therefore%2C+they+commit+intolerable+theft.+Second%2C+by+exacting+such+usury%2C+they+harm+the+republic+or+the+community+greatly.+For+a+republic+cannot+stand+or+flourish+when+the+people+are+oppressed+and+exhausted+by+usury.+Third%2C+besides+usury%2C+another+injury+is+added.+For+whatever+is+for+sale+in+the+market%2C+the+Jews+snatch+away+from+the+Christians+by+offering+a+higher+price+to+the+sellers+than+other+buyers+are+accustomed+to+offer%3B+and+afterwards%2C+which+is+most+iniquitous%2C+Christians+are+forced+to+pay+double+the+price+to+the+Jews+if+they+wish+to+buy+what+is+necessary+for+feeding+their+families.+Fourth%2C+so+that+they+may+do+all+these+things+with+impunity%2C+they+distribute+gifts+to+the+officials+of+princes+so+that+they+may+be+protected+by+them.+Fifth%2C+from+this+it+happens+that+the+people%2C+who+bear+such+injuries+with+difficulty%2C+become+prone+to+inciting+sedition%2C+both+against+the+Jews+themselves+and+against+their+defenders+and+patrons.+Against+the+Jews%2C+indeed%2C+because+they+are+thieves+and+plunderers%3B+against+the+patrons%2C+because+they+are+partners+of+thieves+and+plunderers.+If+a+prince+or+magistrate+does+not+prevent+or+punish+these+great+evils+%28to+say+nothing+of+the+rest%29%2C+he+is+a+participant+in+the+crime+and+is+bound+to+restitution.+He+can%2C+however%2C+prevent+them+in+three+ways.+First%2C+if+he+expels+the+Jews+entirely+from+his+province+or+city.+Second%2C+if+he+does+not+indeed+expel+them%2C+but+forces+them+to+agriculture%2C+or+to+mechanical+arts%2C+or+to+exercise+other+works%3B+and+does+not+allow+them+to+live+in+idleness+and+luxury%2C+as+they+now+live.+Third%2C+if+he+deprives+them+of+all+the+money+and+wealth+which+they+have+received+through+usury.+Would+that+these+things+were+brought+into+practice.+You+will+say%2C+if+the+Jews+are+either+expelled+or+do+not+accept+usury%2C+two+inconveniences+will+follow%3A+First%2C+because+Christian+princes+in+time+of+necessity+will+not+have+money+for+war.+For+they+are+accustomed+to+seek+this+from+the+Jews.+Then%2C+the+subjects+of+the+princes%2C+who+are+in+need+of+money%2C+will+not+be+able+to+borrow.+I+respond%3A+The+contrary+follows%3A+First%2C+because+once+the+Jews+are+expelled%2C+the+citizens+will+be+able+to+contribute+more+support+than+the+Jews+are+accustomed+to.+For+whatever+the+Jews+contribute%2C+they+receive+from+the+citizens+through+unjust+usury.+And+not+only+this%2C+but+also+whatever+is+necessary+for+them+to+sustain+their+lives.+Therefore%2C+they+take+two+portions+from+the+citizens%3A+one%2C+which+they+give+to+the+prince%3B+the+other%2C+by+which+they+live.+Certainly%2C+if+the+Jews+were+expelled%2C+the+citizens+would+be+prepared+to+give+either+both+portions+to+their+prince%2C+or+at+least+no+less+than+they+give+to+the+Jews.+Next%2C+the+subjects+of+princes+are+in+greater+need+of+money+when+the+Jews+are+present+than+when+they+are+absent.+For+when+they+are+present+and+demanding+intolerable+usury%2C+they+are+completely+drained.+If+they+were+absent%2C+or+at+least+did+not+demand+such+immoderate+usury%2C+the+subjects+would+be+less+drained%2C+and+consequently+would+be+in+less+need+of+money.+Our+Adam+Contzen+has+written+extensively+on+this+subject+in+his+Politics.%E2%80%9D%0A%0A%E2%80%94+Martin+Becanus%2C+Manual+of+Controversies+of+this+Time+%28Wurzburg%2C+1623%29%2C+bk.+5%2C+ch.+18%2C+%E2%80%98Is+a+prince+or+magistrate+able+to+tolerate+Jews+in+his+city+or+province%3F%E2%80%99+tr.+AI+by+The+Faith+Received+Becanus+%281563%E2%80%931624%29+was+a+Dutch-born%2C+Roman+Catholic%2C+Jesuit+priest%2C+known+as+a+theologian+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ca8f987c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ca8f987c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Whether%20a%20prince%20or%20magistrate%20may,on%20this%20subject%20in%20his%20Politics&amp;text=Whether%20a%20prince%20or%20magistrate%20may%20tolerate%20Jews&amp;text=written%20extensively%20on%20this%20subject%20in%20his%20Politics" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Question 9, Whether Jews in a Christian magistracy are to be tolerated, and how are they to be dealt with? There are extreme opinions concerning this question. The first sentence is of those who absolutely deny that Jews ought to be at all tolerated in a Christian commonwealth. The moments of their assertion they advance are these: (1) Jews are extremely blasphemous; for at the name of Jesus, if they alone be present, thy cry out and say: “Let his name be blotted out”; they call the Holy Trinity nonsense and foolishness, they call Christ a spurious one; they call Mary, the blessed mother of the Savior, dung; they curse every Christian magistrate, they reckon Christians among the most lost and damned men; they think it lawful to despoil and kill Christians and treat Christian rites as obscene. (2) They think Christians to be plainly objects of hatred and enemies to God; they bring accusations against secular and principal Christian commonwealths and so separate themselves. The second judgment, plainly contrary to the first, proposes causes of hope and arguments and proofs of foundations: (3) From those things themselves is Christ made according to the flesh, Rom. 9:2, 5. A corrupt religion is extremely blasphemous: to be possessed of the habitation of the Jews within the commonwealth yields very many benefits to Christians: for they show spectacles and thereby furnish a divine mirror against the contemners of the Gospel, and they can serve for the restoration of the integrity of the monuments of the Old Testament, and confirm the truth among the images of divine predictions, Rom. 1:22. They enrich the commonwealth with money, with trade, they make it opulent and wealthy. (4) The ejection of the Jews out of the republic would carry with it many inconveniences: for being utterly expelled from Christian dominions they are more difficult to be converted and more free to blaspheme, and the Turkish kingdom would be augmented by their resources. (5) It is necessary therefore that Jews live somewhere, if any political use proper to them be by them entirely prescribed: wherefore it is preferable that they live under a Christian magistracy, as under which the hope of a more abundant conversion would shine forth than that living under a gentile magistracy they either persevere in their idolatry or pass over to the blasphemy of the gentiles. The third opinion is intermediate, since it concedes indeed that Jews may be tolerated in a Christian republic, but under certain cautions and conditions. In these conditions to be prescribed, the sentiment is not the same of the Pontiffs and the Lutheran doctors. Becanus the Jesuit, in the Manual of Controversies, bk. 3, ch. 18, pp. 728–29, 1–3, etc., embraces by three conclusions the opinion of the Pontiffs. The summary of the dissertation is that the magistrate can permit the vices and exercises of the Jews if there be a sufficient cause; that the magistrate can also permit usages of theirs, if sufficient cause be known; that the Christian magistrate cannot in good conscience permit, nor leave unpunished the external hatred of the Jews toward Christians. The Lutherans, however, concede to Jews dwelling in a Christian republic under other cautions and conditions, namely:

1. That a free exercise of religion be not conceded to them: circumcision is forbidden to them: polygamy is not permitted.

2. Blasphemy is to be punished in them very severely and restrained by most grave punishments.

3. No public office is to be entrusted to them.

4. That that monstrous usury, by which they drive Christians out, be not permitted.

5. That they be compelled to attend Christian sacred assemblies.

6. That care be taken lest they lead Christians away to the Jewish religion. Which and similar conditions and cautions about tolerating Jews in a Christian republic are required by: D. Helvicus in his System of Judaical Controversies, list of Jews 8, or the last; D. Hutterus in L.C., article 32.9.6, p. 1,037. Dn. D. Gerhardus, tome. 6, thesis 223 of Common Places, article on the Political Magistrate, pp. 890–91 ff., and the theologians of the Jena Academy in their counsel on this matter in the year 1611, and the Theological Faculty of the Academy of Frankfurt on the Oder in the year 1613, reported by Dedekennus, vol. 2, pt. 2, p. 139 ff. &amp; 146 ff. Those conditions were conceived and prescribed piously and prudently, yet they are such that they are more easily desired than obtained. For who indeed could obtain this from the Jews, that they refrain from blasphemies against Christ and from unjust and biting usuries? For if they do not blaspheme Christ openly, yet privately they do not cease to be vexatious with shameful dealings. And he takes away a Jew’s life who prohibits usury to him; for he cannot do without it any more than he can do without common air. But how grave a sin it is to draw the yoke with unbelievers, or to grant them hospitality and the right of citizenship, since they hold a doctrine different from the doctrine of Christ, is more evident from the Scriptures than to require proof. Therefore Luther also, in Disput. Fratr., 8, in Epist., fol. 94 ff., judges with more deliberation concerning the Jews.</p></blockquote>

dictions%2C+Rom.+1%3A22.+They+enrich+the+commonwealth+with+money%2C+with+trade%2C+they+make+it+opulent+and+wealthy.+%284%29+The+ejection+of+the+Jews+out+of+the+republic+would+carry+with+it+many+inconveniences%3A+for+being+utterly+expelled+from+Christian+dominions+they+are+more+difficult+to+be+converted+and+more+free+to+blaspheme%2C+and+the+Turkish+kingdom+would+be+augmented+by+their+resources.+%285%29+It+is+necessary+therefore+that+Jews+live+somewhere%2C+if+any+political+use+proper+to+them+be+by+them+entirely+prescribed%3A+wherefore+it+is+preferable+that+they+live+under+a+Christian+magistracy%2C+as+under+which+the+hope+of+a+more+abundant+conversion+would+shine+forth+than+that+living+under+a+gentile+magistracy+they+either+persevere+in+their+idolatry+or+pass+over+to+the+blasphemy+of+the+gentiles.+The+third+opinion+is+intermediate%2C+since+it+concedes+indeed+that+Jews+may+be+tolerated+in+a+Christian+republic%2C+but+under+certain+cautions+and+conditions.+In+these+conditions+to+be+prescribed%2C+the+sentiment+is+not+the+same+of+the+Pontiffs+and+the+Lutheran+doctors.+Becanus+the+Jesuit%2C+in+the+Manual+of+Controversies%2C+bk.+3%2C+ch.+18%2C+pp.+728%E2%80%9329%2C+1%E2%80%933%2C+etc.%2C+embraces+by+three+conclusions+the+opinion+of+the+Pontiffs.+The+summary+of+the+dissertation+is+that+the+magistrate+can+permit+the+vices+and+exercises+of+the+Jews+if+there+be+a+sufficient+cause%3B+that+the+magistrate+can+also+permit+usages+of+theirs%2C+if+sufficient+cause+be+known%3B+that+the+Christian+magistrate+cannot+in+good+conscience+permit%2C+nor+leave+unpunished+the+external+hatred+of+the+Jews+toward+Christians.+The+Lutherans%2C+however%2C+concede+to+Jews+dwelling+in+a+Christian+republic+under+other+cautions+and+conditions%2C+namely%3A+1.+That+a+free+exercise+of+religion+be+not+conceded+to+them%3A+circumcision+is+forbidden+to+them%3A+polygamy+is+not+permitted.+2.+Blasphemy+is+to+be+punished+in+them+very+severely+and+restrained+by+most+grave+punishments.+3.+No+public+office+is+to+be+entru <blockquote><p>On the other hand [in contrast to Christianity], those who introduced the errors of the sects proceeded in contrary fashion, as is clear from Mohammed, who enticed peoples with the promise of carnal pleasures, to the desire of which the concupiscence of the flesh instigates. He also delivered commandments in keeping with his promises, by giving the reins to carnal pleasure, in which it is easy for carnal men to obey. Also, the lessons of truth which he inculcated were only such as can be easily known to any man of average wisdom by his natural powers—in fact, he mingled the truths which he taught with many fables and most false doctrines. Nor did he add any signs of supernatural agency, which alone are a fitting witness to divine inspiration, since a visible work that can only be from God proves the teacher of truth to be invisibly inspired, but he asserted that he was sent in the power of arms, which sign is not lacking even to robbers and tyrants. Again, those who believed in him from the outset were not wise men practiced in things divine and human, but bestial men who dwelt in the deserts, utterly ignorant of all divine teaching, and it was by a multitude of such men and the force of arms that he compelled others to submit to his law. Lastly, no divine oracles of prophets in a previous age bore witness to him; rather, he corrupted almost all the teaching of the Old and New Testaments by a narrative replete with fables, as one may see by a perusal of his law. Hence, by a cunning device, he did not commit the reading of the Old and New Testament books to his followers, lest he should thereby be convicted of falsehood. Thus it is evident that those who believe his words believe lightly.</p></blockquote>

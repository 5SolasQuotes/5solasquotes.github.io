<main class="wrap"><figure class="quote" id="q-f84e1e20f2" data-kw="">
<blockquote><p>For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect):

1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given.

2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object.

3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh, 1658), ch. 1, ‘Concerning the Holy Trinity &amp; Object of Worship’, p. 12</span></figcaption>

<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>

<blockquote><p>The worship (or service) of God is a work commanded of God, wrought through faith (principally) to the setting forth of the glory of God. In this definition there be three things, which in the true worship of God are necessarily joined together: First: The matter (or material part), which is a work commanded of God. Secondly: The cause, namely that the same work be done of faith, in Jesus Christ. Thirdly: The end, namely the glory of God, which the worker respects, that by this means he may declare himself obedient to his heavenly father.</p></blockquote>

<blockquote><p>There is a civil worship mentioned in Scripture, as well as divine worship. Civil worship may be given to men. And there is a twofold civil worship (spoken of in Scripture). There is a civil worship of duty, and there is a civil worship of courtesy. That of duty is from inferiors to their superiors, from children to their parents, from servants to their masters, from subjects to kings and magistrates. These gods must have civil worship. As Gen. 48:11, when Joseph came into the presence of Jacob his father, he bowed down to the ground; this was a civil worship, and a worship of duty from an inferior to a superior. And it is said of the brethren of Judah, Gen. 49:8, when Jacob on his death-bed blessed the 12 Tribes, ‘Thy brethren shall worship thee or bow down to thee.’ It is the same word used here in this text. Judah’s honor was to wield the scepter, the government was laid upon his shoulders; now he being the chief magistrate, all the rest of the tribes, all his brethren must worship him or give civil honor unto him. Secondly, There is likewise a worship of courtesy, which is from equals, when one equal will bow to another, or when a superior (as sometimes in courtesy he will) bows down or worships his inferior: As it is noted concerning Abraham, that when he came before the men of the country of Heth, he bowed himself; Now Abraham was the superior, he was a prince and a great man, yet coming before the men of the country, he bowed himself, and it is the same word. So then this civil worship may lawfully be given unto men. But as for divine worship that is proper and peculiar unto God, that glory He will not give to graven images, man or angel, and therefore we must not. Hence we find that when Cornelius and John did act their civil worship a little too far, they were presently taken oft for they should entrench upon the divine worship. Civil worship when it is excessive and goes too far is sinful, as in Acts 10.25, Luke relates that as soon as Peter came in, Cornelius met him and fell at his feet and worshipped him; the worship was to Peter, for we are not to think that Cornelius was so grossly ignorant as to take Peter for a god, and to give him divine worship; but the meaning of it is, that he fell down at his feet and gave him an honor and respect beyond what he ought to have done, he was excessive in it: therefore Peter takes him off, ‘Stand up’ (says he): ‘I myself also am a man, I am a man as thou art, though an apostle give me such respect as becomes a minister of Christ, take heed that you give me no more than belongs to a man.’ So the angel, Rev. 22:8, when John falls down at his feet and worships, he takes him up, ‘See thou do it not,’ says he, ‘for I am thy fellow servant:’ This is too much for man, ‘worship God,’ as it is in the end of the verse; such worship belongs properly and peculiarly unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London: Miller, 1643), 2nd half of Job 1, on Job 1:20-21, pp. 192-93</span></figcaption>

— Joseph Caryl, An Exposition with Practical Observations upon the Three First Chapters of the Book of Job, Delivered in 21 Lectures… (London: Miller, 1643), 2nd half of Job 1, on Job 1:20-21, pp. 192-93">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+civil+worship+mentioned+in+Scripture%2C+as+well+as+divine+worship.+Civil+worship+may+be+given+to+men.+And+there+is+a+twofold+civil+worship+%28spoken+of+in+Scripture%29.+There+is+a+civil+worship+of+duty%2C+and+there+is+a+civil+worship+of+courtesy.+That+of+duty+is+from+inferiors+to+their+superiors%2C+from+children+to+their+parents%2C+from+servants+to+their+masters%2C+from+subjects+to+kings+and+magistrates.+These+gods+must+have+civil+worship.+As+Gen.+48%3A11%2C+when+Joseph+came+into+the+presence+of+Jacob+his+father%2C+he+bowed+down+to+the+ground%3B+this+was+a+civil+worship%2C+and+a+worship+of+duty+from+an+inferior+to+a+superior.+And+it+is+said+of+the+brethren+of+Judah%2C+Gen.+49%3A8%2C+when+Jacob+on+his+death-bed+blessed+the+12+Tribes%2C+%E2%80%98Thy+brethren+shall+worship+thee+or+bow+down+to+thee.%E2%80%99+It+is+the+same+word+used+here+in+this+text.+Judah%E2%80%99s+honor+was+to+wield+the+scepter%2C+the+government+was+laid+upon+his+shoulders%3B+now+he+being+the+chief+magistrate%2C+all+the+rest+of+the+tribes%2C+all+his+brethren+must+worship+him+or+give+civil+honor+unto+him.+Secondly%2C+There+is+likewise+a+worship+of+courtesy%2C+which+is+from+equals%2C+when+one+equal+will+bow+to+another%2C+or+when+a+superior+%28as+sometimes+in+courtesy+he+will%29+bows+down+or+worships+his+inferior%3A+As+it+is+noted+concerning+Abraham%2C+that+when+he+came+before+the+men+of+the+country+of+Heth%2C+he+bowed+himself%3B+Now+Abraham+was+the+superior%2C+he+was+a+prince+and+a+great+man%2C+yet+coming+before+the+men+of+the+country%2C+he+bowed+himself%2C+and+it+is+the+same+word.+So+then+this+civil+worship+may+lawfully+be+given+unto+men.+But+as+for+divine+worship+that+is+proper+and+peculiar+unto+God%2C+that+glory+He+will+not+give+to+graven+images%2C+man+or+angel%2C+and+therefore+we+must+not.+Hence+we+find+that+when+Cornelius+and+John+did+act+their+civil+worship+a+little+too+far%2C+they+were+presently+taken+oft+for+they+should+entrench+upon+the+divine+worship.+Civil+worship+when+it+is+excessive+and+goes+too+far+is+sinful%2C+as+in+Acts+10.25%2C+Luke+relates+that+as+soon+as+Peter+came+in%2C+Cornelius+met+him+and+fell+at+his+feet+and+worshipped+him%3B+the+worship+was+to+Peter%2C+for+we+are+not+to+think+that+Cornelius+was+so+grossly+ignorant+as+to+take+Peter+for+a+god%2C+and+to+give+him+divine+worship%3B+but+the+meaning+of+it+is%2C+that+he+fell+down+at+his+feet+and+gave+him+an+honor+and+respect+beyond+what+he+ought+to+have+done%2C+he+was+excessive+in+it%3A+therefore+Peter+takes+him+off%2C+%E2%80%98Stand+up%E2%80%99+%28says+he%29%3A+%E2%80%98I+myself+also+am+a+man%2C+I+am+a+man+as+thou+art%2C+though+an+apostle+give+me+such+respect+as+becomes+a+minister+of+Christ%2C+take+heed+that+you+give+me+no+more+than+belongs+to+a+man.%E2%80%99+So+the+angel%2C+Rev.+22%3A8%2C+when+John+falls+down+at+his+feet+and+worships%2C+he+takes+him+up%2C+%E2%80%98See+thou+do+it+not%2C%E2%80%99+says+he%2C+%E2%80%98for+I+am+thy+fellow+servant%3A%E2%80%99+This+is+too+much+for+man%2C+%E2%80%98worship+God%2C%E2%80%99+as+it+is+in+the+end+of+the+verse%3B+such+worship+belongs+properly+and+peculiarly+unto+God.%E2%80%9D%0A%0A%E2%80%94+Joseph+Caryl%2C+An+Exposition+with+Practical+Observations+upon+the+Three+First+Chapters+of+the+Book+of+Job%2C+Delivered+in+21+Lectures%E2%80%A6+%28London%3A+Miller%2C+1643%29%2C+2nd+half+of+Job+1%2C+on+Job+1%3A20-21%2C+pp.+192-93&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd3504b9d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd3504b9d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=There%20is%20a%20civil%20worship%20mentioned,belongs%20properly%20and%20peculi

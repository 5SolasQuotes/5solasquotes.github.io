<blockquote><p>Amyraut intended to soften the edges of the traditional Reformed view and thus to relieve difficulties in the controversy with Roman Catholics and facilitate a reunion of Protestants in which Reformed and Lutheran could join ranks… [it] tended to weaken the unity of Reformed thought and to open the door to increasing departures from Reformed orthodoxy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-r-nicole.html">Roger R. Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Amyraldism’ in eds. Sinclair B. Ferguson &amp; David F. Wright, New Dictionary of Theology</cite>, (Leicester: IVP, 1988), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

— Roger R. Nicole, ‘Amyraldism’ in eds. Sinclair B. Ferguson &amp; David F. Wright, New Dictionary of Theology (Leicester: IVP, 1988), p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAmyraut+intended+to+soften+the+edges+of+the+traditional+Reformed+view+and+thus+to+relieve+difficulties+in+the+controversy+with+Roman+Catholics+and+facilitate+a+reunion+of+Protestants+in+which+Reformed+and+Lutheran+could+join+ranks%E2%80%A6+%5Bit%5D+tended+to+weaken+the+unity+of+Reformed+thought+and+to+open+the+door+to+increasing+departures+from+Reformed+orthodoxy.%E2%80%9D%0A%0A%E2%80%94+Roger+R.+Nicole%2C+%E2%80%98Amyraldism%E2%80%99+in+eds.+Sinclair+B.+Ferguson+%26+David+F.+Wright%2C+New+Dictionary+of+Theology+%28Leicester%3A+IVP%2C+1988%29%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bf94214ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bf94214ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Amyraut%20intended%20to%20soften%20the%20edges,to%20increasing%20departures%20from%20Reformed%20orthodoxy&amp;text=Amyraut%20intended%20to%20soften%20the%20edges%20of%20the&amp;text=the%20door%20to%20increasing%20departures%20from%20Reformed%20orthodoxy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d33ddd19d4" data-kw="">
<blockquote><p>Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Tale of Two Wills</cite>, (2009): 211-25, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>…the Westminster Assembly consistently maintains particularism. I deny that the universalists at Westminster ‘were able to restrain the final codification sufficiently for there to be some significant ambiguity at crucial places’ (148). I do not deny that the issue of particularism versus universalism was debated at Westminster nor that contemporary universalists claimed their teaching compatible and remained active at the synod. But the mere presence of a plurality of views in session does not imply a plurality of views in confession. Clearly, the final formulation should interpret (the outcome of) the earlier discussion and not the earlier discussion the final formulation. Although WCF could be ambiguous or alternatively rendered on this subject (as on some other ones), it is actually precise and clear about the strictly particular divine intention.” – Rehnman . Quotes 1800’s Robert Shaw Exposition of the Westminster Confession, pp. 112-113, commenting on WCF 8.8, “To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same:</p></blockquote>

<blockquote><p>Together with his brother-in-law, Pierre du Moulin, professor of theology at Sedan, and Spanheim, first professor at Geneva and thereafter at Leiden, he [Rivet] sharpened his theological knife in order to combat Amyraut. For this purpose, he also used an abstract of Amyraut’s ideas, which he had composed in 1635 at The Hague. It contained fifty theses and was followed by his comments on them, divided into ten chapters, and then a conclusion (Synopsis doctrinae de natura et gratia, excerpta ex Mosis Amyraldis… in Riveti Opera Theologica, 3:830-851).” – van Asselt in Theology of the French Reformed Churches, p. 270 Maresius, Samuel – A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) 913 pp. ToC Daille’s Apology is above. Table of Contents Dedication Prolegomena Epistle of Blondel to Maresius Response of Maresius Exercitation 1. The First Part of the Apology [of John Daille], in which is viewed: Jn. 3:16 is weighed, then 1 Tim. 2:3, in which kinds of individuals ought to be understood; The Objections of the Apology to the contrary are satisfied; 2 Pet. 3:9 is weighed, to the effect that Calvin in no way favors universalism; also Eze. 33:11, in which the common explanation is vindicated; refutations to the contrary are opposed 1 Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58 Exercitation 3. Proceeds to other places for universal redemption, the judgment of the Arminians on this head; the disparity of the affection of Christ towards the elect and reprobates to die for both (2 Cor. 5:14-15; Rom. 14:8-9; Mt. 18:11; Mk. 11:17; Lk. 5; 1 Tim. 1:15; Lk. 9:56, and many others are viewed) to placate the Father through the blood of Christ; Tit. 2:11, the testimony of Gomarus is elucidated and vindicated. What of this dogma the reformed churches and schools of Belgium judge. The judgment of Twisse on Molina. The judgment of the Rev. Apologist, by which he differs from Remonstrantism, and by which inconvenient things he draws away from them. The Janists, on the view of the Apology and some on Blondel 102 Exercitation 4. The Second Part of the Apology, in which is viewed: Whether God wills all them to be saved to whom his Word is externally announced: the first reason for the affirmative is weighed and refuted: on the end and means: the command made to Abraham; the precept of the Law ought to save; it ought to work repentance and belief. That command to Pharaoh, also God having willed the slaying of his Son, or his will to save the reprobate hearers of the Gospel: various places of Scripture having been brought on that, and similar ones customarily brought by Remonstrants and Jesuits are weighed; and the genuine sense of them is profusely expounded 147 Exercitation 5 proceeds in an examination of the first argument; Prov. 1:5 &amp; Lk. 7:30 are weighed; the twofold counsel of God is taken up; in what way that is resisted, out of Acts 7:51; on that most vexed place, Mt. 23:37 which is discussed by many; the reasons by which the Apologist seeks to prove that God always intends that to be that which He commands to men, are clearly refuted; the whole conclusion of the first argument 217 Exercitation 6. The refutation of the Second Argument of the Apologist from the divine promisses; it concides with the first; the third from divine calling; the fourth from the parable of the marriage feast; the fifth from the invitation to the perishing unto repentance and faith; places specially brought to that effect are disected, namely Isa. 55:1-3; Jn. 7:37; Prov. 9:4-6; Mt. 11:18-19; on the Galatians out of Gal. 3:1; the place Jn. 6:32, Christ is really offered to the unbelieving, and whether that of the minister is to be distinguished from God; the sixth argument from that which is incumbent upon ministers from the command of God; the means unto salvation, of what kind and how far they are admitted with respect to reprobates; the end of pastors in preaching the gospel; whether reprobates are called through that which is falling out [accidens] 253 Exercitation 7. The remaining arguments of the revered man are dissected; the seventh from the foolishness of the unruly; it is falsely supposed that they are minimally called; the penitence of demons and the damned; what and in what way it is offered to reprobates. Eighth, on times assigned to sinners. Ninth, in what way we may hold to the first thing of the Gospel, whether the hearing or the preaching; Tenth, ‘Do this and you will live’. The Principles in which we come together. So to proceed onto the Arminian disputation, the judgment of Cameron 323 Exercitation 8. The second member of the second part of the Apology, on the universality of the death of Christ. What of Cameron on that? The first argument of the apology is disected out of Rom. 14:15 &amp; 1 Cor. 8:10-11. The second taken out of 1 Pet. 2:1, and so proceeding to sieze it from the Remonstrants, and sufficiently refute them from [Daniel] Chamier. Gomarus and Calvin on this place. Third, out of Heb. 10:29. A sacramental sanctification is there denoted, so it is proved by multitudes. The fourth and fifth grasp at a false supposition [sophisma] of the Remonstrants, that whatever one holds to believe, that is true. The absurd supposition of the Apologist, whether he implicates a contradiction? This sophism is accurately refuted 361 Exercitation 9. The sixth argument from absurdities and the play-acted Catechism, which, through the Jesuit and Remonstrant slander, is attributed to our reformed Apologist. Repentance, whether it is prior to faith? The seventh dissected, and it is showed in what way unbelief is the cause of damnation. The eighth and ninth are of the same sort with the seventh. The tenth is far more absurd, from the salvation of believers. The eleventh, of the same scaly stuff. The twelvth, out of which the Apologist wills for no one to believe that Jesus is the Christ, except that he would believe that He died for him. The thirteenth and fourteenth contain a seventh Cocceianism 430 Exercitation 10. Of the salvation of adults which are destitute of the Word, and of Christ’s death for them. The doctrine of the Apologist fights in many ways with the Synod of Alencon: many places of Scripture are examined, having been brought forth by it, out of Acts 17:26-27; 14:16-17; Rom. 2:4; 1:18-21. The same reason from the examples. Whether to that end the knowledge of God is from Himself manifested to pagans, so that through it they may repent and be saved? It is proved that God has intended their inexcusability, and this from the distinct end of the thing, from the end of God, as the event of it shows from this having been intended. Christ did not die for the ethnics without the Word. God does not will their premature infants, having been snatched away in death, to have been saved, nor did Christ redeem them 493 Brief Strictures upon the Most Verbose Vindications of John Daille, recently opposing the first three of the preceeding exercitations, for the defense of their errors on Universal Grace &amp; Redemption 568 ToC of the Exercitations 908 Omissions that ought to be Adjoined 914 Errata 915 Grebenitz, Elias – A Theological Tract on the Denial of Universal, Divine Grace (Frankfurt, 1665) 87 pp. Grebenitz (1627-1689) was a reformed professor of logic, metaphysics and theology at Frankfurt, Germany. Burman, Francis – 17. ‘Of the Subject of the Covenant of Grace. Where is Treated of its Latitude &amp; of Universal Grace’, pp. 499-506 in A Synopsis of Theology, and especially of the Economy of the Covenant of God, from the beginning of ages to the consummation of all things, vol. 1 (Utrecht, 1671) Burman (1628-79) . 1700’s Vitringa, Sr., Campegius – Ch. 19, ‘Of the Covenant of Grace, which has an Eternal Superstructure &amp; Various Dispensations of it’, ‘Of the Extent of the Covenant of Grace’, pp. 247-249 in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 4 (d. 1722) Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition, the former from a federalist, the latter from a nonfederalist perspective.</p></blockquote>

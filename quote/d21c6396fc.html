<blockquote><p>16… This can be illustrated by the likeness of the soul. For the soul, which is whole in the whole body and whole in each part of the body, as to essence, is not more in the heart or brain than in the feet; for equally, as far as essence is concerned, it is in each part of the human body: yet it is said to be especially in the head, as to the effects which it produces more excellently and preeminently in the head than in the rest of the body. For indeed it diffuses the power of sensing throughout the whole body: but in the head, it effects the power of hearing, seeing, smelling, tasting: indeed, also of speaking, thinking, remembering, understanding, which powers it does not exert in other members.</p></blockquote>

<blockquote><p>Though Christian dogma cannot be explained in terms of Greek philosophy, it also did not come into being apart from it. There is as yet no dogma and theology, strictly speaking, in Scripture. As long as revelation itself was still in progress, it could not become the object of scientific reflection. Inspiration had to be complete before reflection could begin. To speak of “Mosaic”, “Pauline”, or the “Bible’s” theology and dogmatics therefore, is not advisable; the word theology, for that matter, does not occur in Scripture and has only gradually acquired its present meaning. Theology first arose in the Christian community after the naïveté of childhood lay behind it and the adult thinking mind had awakened. Gradually a need arose to think through the ideas of revelation, to link it with other knowledge and to defend it against various forms of attack. For this purpose people needed philosophy. Scientific theology was born with its help. This did not, however, happen accidentally. The church was not the victim of deception. In the formation and development of the dogmas, the church fathers made generous use of philosophy. They did that, however, in the full awareness of and with clear insight into the dangers connected with that enterprise; they were conscious of the grounds on which they did it with express recognition of the word of the apostles as the only rule of faith and conduct. For that reason also they did not utilize the whole of Greek philosophy but made a choice; they only utilized the philosophy that was most suited to help them think through and defend the truth of God. They went to work eclectically and did not take over any single philosophical system, be it either from Plato or from Aristotle, but with the aid of Greek philosophy produced a Christian philosophy of their own. Furthermore, they only used that philosophy as a means. Just as Hagar was the servant of Sarah, as the treasures of Egypt were employed by the Israelites for the adornment of the tabernacle, as the wise men from the East placed their gifts at the feed of the child in Bethlehem, so, in the opinion of the church fathers, philosophy was the servant of theology. From everything it is clearly evident that the use of philosophy in theology was based, not on a mistake, but on firm and clear conviction. The church fathers knew what they were doing. Mind you, this does not rule out the possibility that at some points the influence of philosophy was too strong. But in that connection we must make a distinction between the theology of the fathers and the dogmas of the church. The church was at all times alert against the misuse of philosophy; it not only rejected Gnosticism but also condemned Origenism. And up until now no one has succeeded in explaining the dogmas materially in terms of philosophy; however often this has been attempted, in the end the scriptural character of orthodoxy has been vindicated. Initially the Reformation assumed a hostile posture toward scholasticism and philosophy. But it soon changed its mind. Because it was not, nor wanted to be, a sect, it could not do without theology. Even Luther and Melanchton, therefore, already resumed the use of philosophy and recognized its usefulness. Calvin assumed this high position from the start, saw in philosophy an “outstanding gift of God”, and was followed in this assessment by all Reformed theologians. The question here is not whether theology should make use of a specific philosophical system. Christian theology has never taken over any philosophical system without criticism and given it the stamp of approval. Neither Plato’s nor Aristotle’s philosophy has been held to be the true one by any theologian. That theologians nevertheless preferred these two philosophical systems was due to the fact that these systems best lent themselves to the development and defense of the truth. Present also was the idea that the Greeks and Romans had been accorded a special calling and gift for the life of culture. Still to this day, in fact, our whole civilization is built upon that of Greece and Rome.</p></blockquote>

<blockquote><p>A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63) which was called in reaction against it. Thomas de Vio, also known as Cardinal Cajetan (1469-1534), produced a major commentary on the Summa Theologiae that would have a decisive influence upon the general understanding of Aquinas’s doctrines. Cajetan’s emphasis on continuity with Aquinas’s own positions was followed by later commentators such as Dominic Banez (1528-1604), and John Poinsot (1589-1644), who would come to be known as John of St. Thomas. This contrasted with the tendency of thinkers from the new Jesuit order, such as Luis de Molina (1535-1600) and Francisco Suarez (1548-1617), to combine Aquinas’s thought with various non-Thomistic elements. These different tendencies, roughly associated with Dominicans and Jesuits respectively, gave rise to sometimes heated doctrinal disputes, the most famous being the controversy over grace, free will, and divine foreknowledge. Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63) which was called in reaction against it. Thomas de Vio, also known as Cardinal Cajetan (1469-1534), produced a major commentary on the Summa Theologiae that would have a decisive influence upon the general understanding of Aquinas’s doctrines. Cajetan’s emphasis on continuity with Aquinas’s own positions was followed by later commentators such as Dominic Banez (1528-1604), and John Poinsot (1589-1644), who would come to be known as John of St. Thomas. This contrasted with the tendency of thinkers from the new Jesuit order, such as Luis de Molina (1535-1600) and Francisco Suarez (1548-1617), to combine Aquinas’s thought with various non-Thomistic elements. These different tendencies, roughly associated with Dominicans and Jesuits respectively, gave rise to sometimes heated doctrinal disputes, the most famous being the controversy over grace, free will, and divine foreknowledge. Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).”

— Edward Feser, ‘The Thomistic tradition, Part I’ (2009)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+second+period+in+the+history+of+Thomism+is+sometimes+dated+roughly+from+the+period+of+the+Protestant+Reformation+and+the+Council+of+Trent+%281545-63%29+which+was+called+in+reaction+against+it.+Thomas+de+Vio%2C+also+known+as+Cardinal+Cajetan+%281469-1534%29%2C+produced+a+major+commentary+on+the+Summa+Theologiae+that+would+have+a+decisive+influence+upon+the+general+understanding+of+Aquinas%E2%80%99s+doctrines.+Cajetan%E2%80%99s+emphasis+on+continuity+with+Aquinas%E2%80%99s+own+positions+was+followed+by+later+commentators+such+as+Dominic+Banez+%281528-1604%29%2C+and+John+Poinsot+%281589-1644%29%2C+who+would+come+to+be+known+as+John+of+St.+Thomas.+This+contrasted+with+the+tendency+of+thinkers+from+the+new+Jesuit+order%2C+such+as+Luis+de+Molina+%281535-1600%29+and+Francisco+Suarez+%281548-1617%29%2C+to+combine+Aquinas%E2%80%99s+thought+with+various+non-Thomistic+elements.+These+different+tendencies%2C+roughly+associated+with+Dominicans+and+Jesuits+respectively%2C+gave+rise+to+sometimes+heated+doctrinal+disputes%2C+the+most+famous+being+the+controversy+over+grace%2C+free+will%2C+and+divine+foreknowledge.+Ancient+and+medieval+philosophy+in+general%2C+and+Thomism+in+particular%2C+emphasized+metaphysics+over+epistemology%2C+and+objective+reality+over+our+subjective+awareness+of+it.+The+right+order+of+inquiry%2C+from+this+point+of+view%2C+is+first+to+determine+the+nature+of+the+world+and+the+place+of+human+beings+within+it%2C+and+then+on+that+basis+to+investigate+how+human+beings+come+to+acquire+knowledge+of+the+world.+Modern+philosophy%2C+beginning+with+Rene+Descartes+%281596-1650%29%2C+reverses+this+approach%2C+tending+as+it+does+to+start+with+questions+about+how+we+can+come+to+have+knowledge+of+the+world+and+only+then+going+on+to+consider+what+the+world+must+be+like%2C+based+on+an+account+of+our+knowledge+of+it.+In+particular%2C+both+Desca <blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>

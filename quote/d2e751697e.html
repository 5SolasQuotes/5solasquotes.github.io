<main class="wrap"><figure class="quote" id="q-d2e751697e" data-kw="">
<blockquote><p>The crown of Jesus Christ, or any part, privilege, or pendicle thereof, must needs be a noble and excellent subject. This truth, that Jesus Christ is a king, and hath a kingdom and government in his church distinct from the kingdoms of this world, and from the civil government, hath this commendation and character above all other truths, that Christ himself suffered to the death for it, and sealed it with his blood […] The controversy is not about taking from the magistrate what is his, but about giving to Christ that which is his. We hold a reciprocal subordination of persons, but a co-ordination of powers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s rod blossoming; or, the divine ordinance of church government vindicated</cite>, (1646; Edinburgh, 1844), preface to the reader.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbf3704f54" data-kw="">
<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God; the power that ‘is’ [Rom. 13:1], must be from God; the magistrate as magistrate, is good, in nature of office, and the intrinsecal end of his office, Rom. 13:4, for he is the minister of God for thy good; and therefore a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power, and is no more from God (but from sinful nature, and the old serpent) than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 34</span></figcaption>

</figure><figure class="quote" id="q-3552d56983" data-kw="">
<blockquote><p>Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations: 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment; for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son; if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did Gods precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination-natural in a father to preserve the life of the child. So the positive command of the Father, that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (1647), p. 140</span></figcaption>

13. ‘Being, the Good, and the Guise of the Good’ 297 Feser is a Romanist professor of philosophy and is an Analytical Thomist. Here he shows how morals derive from what exists, a la natural law.

14. ‘Classical Natural Law Theory, Property Rights &amp; Taxation’ 321 15. ‘Self-Ownership, Libertarianism, and Impartiality’ 357 16. In Defense of the Perverted Faculty Argument 378 Feser here argues against contraception, but lays a lot of groundwork in natural law before hand. To see that Feser is wrong about contraception, see Fentiman, ‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to Feser’ (RBO, 2025). VanDrunen, David ‘Natural Law in Reformed Theology: Historical Reflections a&amp; Biblical Suggestions’ (2012) 24 paragraphs Note: While we do not agree with VanDrunen’s conclusions on the modern ‘Reformed Two Kingdom’ (R2K) position, his work on natural law is a good introduction to the topic, with which the Westminster divines and puritans agreed. For something faithfully, historically reformed on the topic of how Christ’s two kingdoms (one by divine, natural right, the other as Mediator over the Church) relate, see our section on the Establishment Principle. ‘Why Protestant Christianity Needs a Theology of Natural Law’ (2019) at The Davenant Institute Feser, Edward – ch. 16, ‘In Defense of the Perverted Faculty Argument’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 378-415 Feser in this chapter (whatever one thinks about his view against contraception, which this chapter is in defense of) has an excellent summary exposition of natural law and how ethics derives from existence and the teleological designs therein. Haines, David – ‘The Role of Natural Knowledge in Biblical Interpretation as Key to Solving the Protestant Problem’ (2018) This is the rough draft of the author’s presentation at the Davenant Convivium in 2018. Abstract: “This, then, is the protestant problem: How can we “infallibly” determine which doctrines are necessary for a person to be considered orthodox if the only authority for Protestant theology is the Bible, as interpreted by the individual reader? I will argue that natural knowledge of man, God, and the universe is necessary for biblical interpretation, and is a key element in a well-rounded solution to the protestant problem.</p></blockquote>

<blockquote><p>Unlike many today, the Scottish Reformers saw no incongruency between church discipline and the state’s implementation of biblical penology:

Marriage once lawfully contracted, may not be dissolved at man’s pleasure, as our master Christ Jesus does witness, only [if] adultery be committed; which being sufficiently proven in presence of the Civil Magistrate, the innocent (if they so require) ought to be pronounced free, and the offender ought to suffer the death as God hath commanded. If the Civil sword foolishly spare the life of the offender, yet may not the Church be negligent in their office, which is to excommunicate the wicked, and to repute them as dead members, and to pronounce the innocent party to be at freedom, be they never so honourable before the world. If the life be spared (as it ought not to be) to the offenders, and if the fruits of repentance of long time appear the same, and if they earnestly desire to be reconciled with the Church, we judge that they may be received to participation of the Sacraments, and of the other benefits of the Church, (for we would not that the Church should hold those excommunicant whom God absolved, that is, the Penitent.)</p></blockquote>

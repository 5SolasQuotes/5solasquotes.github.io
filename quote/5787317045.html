<blockquote><p>While Augustine of Hippo did not use the exact phrase “covenant of works” in the below extract, he clearly believed in the substance of the doctrine. It is interesting that he makes the below statement in his polemics with the Pelagians, which gives the lie to the Shepherdite/Federal Visionist slander that the doctrine is Pelagian:

If Adam by his great sin condemned all the human race in common, can an infant be born otherwise than condemned? And through whom except Christ is he freed from this condemnation? And if even in Lazarus he says that mortality, cast out from eternity, loved the world of the dead, who of mortals is not touched by this fault and mischance by which the first man fell from everlasting life, which he would have received if he had not sinned? If the Devil made mortal all who could have been immortal, why do even infants die if they are not subject to the sin of the first man? And even infants be saved from the power of death except through Him in whom all shall be made to live?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Julian</cite>, (c. 420), 1.6.24 in The Fathers of the Church: A New Translation, 35: 28-29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-efc3c1fb98" data-kw="">
<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>

</figure><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.”

<blockquote><p>Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts x. 43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. …

Upon the whole we may see; that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we most cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all?

There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon.

And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Questions</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 87-88.</span></figcaption>

<blockquote><p>Christ crucified, by satisfying the justice of God, brake the thunders of the law, and dissolved the frame of all its anathemas: ‘Being made a curse for us, he hath redeemed us from the curse of the law,’ Gal. iii. 13, i.e. from the sentence of the lawgiver, denounced in his law against the transgressors of it; so that ‘now there is no condemnation to them that are in Christ Jesus,’ Rom. viii. 1, because they are ‘dead to the law by the body of Christ,’ Rom. vii. 4. By the body of Christ as slain and raised again: for this ‘handwriting of ordinances, which was contrary to us, is taken out of the way by God, being nailed to his cross,’ Col. ii. 14.

He hath abolished the obligation of the moral law, as to any condemning power, it being the custom to cancel bonds anciently by piercing the writing with a nail. The ceremonial law was abolished in every regard, since the substance of it was come, and that which it tended to was accomplished; and so one understands ver. 15, ‘Having spoiled principalities and powers, he made a show of them openly,’ of the ceremonies of the law, called principalities and powers in regard of the divine authority whereby they were instituted. These he spoiled; the word ἀπεκδυσάμενος signifies unclothing, or unstripping; he unveiled them, and shewed them to be misty figures that were accomplished in his own person.

The flower falls when the fruit comes to appear; grace and truth came by Jesus Christ, grace to obey the precepts, and truth to take away the types. But it is also meant of the condemning power of the moral law, which was nulled by the death of Christ, who, upon his cross sealing another covenant, repealed the former. The settling a new covenant implies the dissolution of the old. That was nailed to his cross which was contrary to us, a law that was a charge against us, and by virtue whereof we were sued; and this was the law as sentencing us to death, which was pierced and torn by those nails, that did discover that debt and denounce the sentence, which cannot be meant so properly of the ceremonial as the moral law.

The ceremonial law of sacrifices was the gospel in shadows, and appointed for the relief of men, and as a ground whereon to exercise their faith till the appearance of the substance, and therefore cannot be said to be contrary to us, but an amicable discovery, that we are to have that relief in another which we wanted in ourselves; and that we were to be freed from the sentence of death by some grand sacrifice represented by those sacrifices of animals.

Besides, the apostle writes this as a cordial, issuing out of the blood of Christ to the Gentile Colossians, who never were under the obligations of the ceremonial law, that being appropriated to the Jews. The apostle brings it to back his assertion, that their trespasses were forgiven. This argument had been of no use to the Gentiles, who sinned not against the ceremonial law, but the moral law; and if one only had been cancelled, and not the other, the Jews themselves, whose offences were most against the moral law, had had little or no comfort in having the fewest of their sins forgiven.

Our Saviour died by the power and force of the moral law: that brought him to the cross for the fulfilling it in its penalty, as well as he had done in his life by his obedience; and he receiving the full execution of its sentence upon himself on the cross, as a substitute in our place, nulled that sentence as to any force upon those that believe in him. The plea against it is, that it hath already been executed, though not upon our persons, yet upon our surety; so that, being nailed to his cross, the virtue of his cross must cease before the killing power of the law can revive. This crucified Christ, who disarmed the law of its thunders, defaced the obligation of it as a covenant, and, as it were, ground the stones upon which it was writ to powder, is worth our exact knowledge and studious inquiry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 499-500.</span></figcaption>

t+sentence+as+to+any+force+upon+those+that+believe+in+him.+The+plea+against+it+is%2C+that+it+hath+already+been+executed%2C+though+not+upon+our+persons%2C+yet+upon+our+surety%3B+so+that%2C+being+nailed+to+his+cross%2C+the+virtue+of+his+cross+must+cease+before+the+killing+power+of+the+law+can+revive.+This+crucified+Christ%2C+who+disarmed+the+law+of+its+thunders%2C+defaced+the+obligation+of+it+as+a+covenant%2C+and%2C+as+it+were%2C+ground+the+stones+upon+which+it+was+writ+to+powder%2C+is+worth+our+exact+knowledge+and+studious+inquiry.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+A+Discourse+of+the+Knowledge+of+Christ+Crucified%2C+%281684%29+in+The+Complete+Works+of+Stephen+Charnock%2C+B.D.+%285+vols%2C+Edinburgh%3A+James+Nichol%2C+1865%29%2C+4%3A+499-500.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F445fbd9bcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/445fbd9bcb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/22/stephen-charnock-on-christ-abolishing-the-condemning-power-of-the-law-as-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

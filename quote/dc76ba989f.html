<main class="wrap"><figure class="quote" id="q-dc76ba989f" data-kw="">
<blockquote><p>Zanchi: In things indifferent something is to be yielded to the weaker, and that for a time; namely, until they be taught the truth. For if after that the truth is sufficiently and clearly laide abroad unto them so as being convicted they have nothing more what they may object and yet will notwithstanding stick in doubt; sure their infirmity is not to be nourished by their dissembling with them or winking at them. For this is rather strong obstinacy then weakness; Of Redemption, ch. 17, fol. 493. Beza in a case of [the threat of] deprivation [of one’s office as minister] advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire:) We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires:) they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, p. 196</span></figcaption>

<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. …

2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse.

3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity.

4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’

5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>

<blockquote><p>We commend also the more frequent reading of such scriptures as he that readeth shall think best for edification of his hearers, as the book of Psalms, and such like. When the minister who readeth shall judge it necessary to expound any part of what is read, let it not be done until the whole chapter or psalm be ended; and regard is always to be had unto the time, that neither preaching, nor other ordinances be straitened, or rendered tedious. Which rule is to be observed in all other publick performances.</p></blockquote>

</figure><figure class="quote" id="q-153252dd43" data-kw="">
<blockquote><p>These [formerly mentioned] separations are duty, and unto duty, but for a Corinthian to separate from God’s Church and God’s ordinance because some come unworthily to the Lord’s Table is no duty; because there is no command, it is no duty; and therefore we read not this word, ‘Come forth,’ in any of those epistles written to the seven Churches, Rev. 2-3, against which Christ says He ‘hath such and such things;’ they that lived in the impurer [church] are not called forth into the purer [church], but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part, for we may not make these churches and Babylon all one, nor make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s presence because Satan came also amongst them? Job 1:6. Must Shem and Japhet leap out of Noah’s Ark, because there is a Ham there? Would not our Savior rather have sent for John Baptist to have baptized Him rather than Himself have come from Nazareth to Bethabara, which some compute fourteen Dutch miles, that’s of ours fifty six? If that generation of vipers that came also to John’s baptism had either polluted the water, or the ordinance unto Christ? Mt. 3:7, 14. The abuses reproved were such as depraved the ordinance, and the corruptions [were] such as put themselves forth in the communicants at the very time of their participation. The Lord’s Supper was so intermeddled with their festival cheer as the difference between the Lord’s body and their own repast [meal] was not truly made. They discerned not the Lord’s body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, (London: 1657), ch. 2, pp. 31-32</span></figcaption>

<blockquote><p>29. Such use of godly public ministers [in the parish churches] may well stand with the best improvement we can make of the private help of others.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-41ef010fee" data-kw="">
<blockquote><p>But the example of him whose eyes are put out as a punishment for a crime, and who cannot justly be commanded to see, is inept and foreign to the present matter. Because a blind man is not bound to see; but one born in original sin is bound to be just and without sin, for from this obligation a rational creature is never released. Add to this that he who has been deprived of his eyes by a judge is blind involuntarily, and would wish for the recovery of his sight at a great price. But men born in sin are voluntarily evil, and rejoice in their own vice, and hate remedies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, p. 13 trans. AI Latin</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-21e37df4ec" data-kw="">
<blockquote><p>…by reason of original sin it is, that a natural man cannot perform anything in a gracious manner, to wit, for want [lack] of the love of God: Original sin being an habitual aversion from God and conversion unto the creature, or more briefly an inordinate conversing with the creature, either in enjoying it, whereas he should only use it, God alone being to be enjoyed; or in using it, but not in a gracious manner, that is, not for God;s sake; to wit, through want of the love of God, which is brought upon us by the sin of Adam, as whereby our natures were bereaved of the Spirit of God. Thus in prosecuting mine answer unto a devised argument, I have made bold to open my mind concerning original sin: A point that has seemed unto me of such difficulty that I have been wont to range it amongst those three [things] whereabouts I could not expect to be satisfied whilst I lived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646), 3rd Doubt, p. 148</span></figcaption>

</figure><figure class="quote" id="q-5b465ec368" data-kw="">
<blockquote><p>Thesis 1… For, as Augustine himself testifies [about original sin] in On the Morals of the Church, “nothing is more known for preaching, nothing more secret for understanding, than original sin.” And how difficult this doctrine of original sin is, the most learned of English theologians warns in bk. 1, On Original Sin, when he says: ‘how it was propagated from Adam to posterity should be believed rather than inquired into; and it can be inquired into more easily than it can be understood; and it is better understood than it is explained.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 2 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>

</figure><figure class="quote" id="q-7db9fe6fcc" data-kw="">
<blockquote><p>Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections [properties] of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion</cite>, (1560; London, 1563), The Tenth Precept, fol. 103.a – 104.a</span></figcaption>

</figure><figure class="quote" id="q-6ea58232d5" data-kw="">
<blockquote><p>4. Papists indeed seem to reject the negative [of the question whether original sin exists], yet they foster such opinions concerning this sin as in fact overturn that sin while they teach it to be less than any venial sin, with Aquinas the prince of their school and his other sectaries, and thus not to merit eternal death; indeed they want this to be only punishment, not guilt before the free assent of the will. Add the ὕπουλα [treacherous] dogmas:

1. That concupiscence is not sin formally, but only originally and effectively so called, or terminatively, because it is from sin, and from it sin [comes]. Nor does it have anything of the character of sin formally, except what is voluntary [in persons sinning].

2. That naturals [natural powers] remained whole after the Fall, and thus free will is given even in the unregenerate in order to spiritual good. See Bellarmine, bk. 1, On the Loss of Grace, ch. 12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous theological Disputations, pt. 1</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Disputation on Original Sin’ trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

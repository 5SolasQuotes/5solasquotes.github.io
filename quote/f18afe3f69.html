<main class="wrap"><figure class="quote" id="q-f18afe3f69" data-kw="">
<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh, 1655), pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df04ad4eee" data-kw="">
<blockquote><p>God, to whom belongs the world and the fulness thereof, disponed to Abraham and his seed the land of Canaan for their inheritance and ordained that they should use their bow and their sword for the actual possession thereof; and the like divine right had David to the Edomites and Ammonites, though the occasion of David’s taking possession of these kingdoms by his sword did arise from particular and occasional exigencies and injuries; but it follows in no sort that, therefore, kings now wanting any word of promise, and so of divine right to any lands, may ascend to the thrones of other kingdoms than their own by no other title than the bloody sword. That God’s will was the chief patent here is clear, in that God forbade his people to conquer Edom, or Esau’s possession, when as He gave them command to conquer the Amorites. I doubt not to say, if Joshua and David had no better title than their bloody sword, though provoked by injuries, they could have had no right to any kingly power over these kingdoms; and if only success by the sword be a right of providence, it is no right of precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 49 rt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>

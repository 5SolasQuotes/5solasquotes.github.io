<main class="wrap"><figure class="quote" id="q-e9375b3858" data-kw="">
<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church. 54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (Edinburgh, 1647), #53-54, 79, 81</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-292947d1fe" data-kw="">
<blockquote><p>From the Council Registers we see that the plague made its appearance at Geneva in 1542, and that during several years it made great ravages in the town and throughout the whole territory of Savoy. The number of sick was immense. It was almost certain death to visit them. Three ministers offered spontaneously to discharge that duty: Calvin, Sebastian Castalio, and Blanchet. Castalio, who was the first person designated by lot, appears to have declined that perilous honour. Banchet generously made the sacrifice of his life; and the urgent solicitations of the Seigneury of Geneva, who were afraid to expose the valuable life of the Reformer, could alone determine Calvin to desist from undertaking the charge which he bad himself solicited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geneva.html">Geneva</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. Jules Bonnet, Letters of John Calvin… (Pres. Board of Publication), vol. 1, Letter 99, p. 364, fn. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>

<blockquote><p>Believe if ye will [as it is claimed by Romanists] that [Emperor] Constantine gave to the Popes of Rome freedom and immunity from the imperial laws… we teach no such kingly power given to Church-men, and judge this Donation [of Constantine] to be a forged lie, invented by Papists… 6. We do not teach that Church-men are loosed from the positive laws of emperors and kings. [The Romanist, Robert] Bellarmine says that the Magistrate can neither punish Church-men, nor convene them before the tribunal… And as he says, by divine law the Pope is eximed [exempt] from all laws of princes… And what they allege for Peter’s exemption from paying tribute, will exime all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they) by a divine positive law are eximed from the laws of Magistrates… Paul will have every soul subject to superior powers, and except the Roman clergy want [lack] souls, they must also be subject. Solomon punished [the priest] Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected Himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Ceasar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil, as many as are in danger of resisting the power, are to be subject, Rom. 13:4. 2. but Church-men are such, therefore they are subject.</p></blockquote>

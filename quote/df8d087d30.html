<main class="wrap"><figure class="quote" id="q-df8d087d30" data-kw="">
<blockquote><p>That which can make the man of God perfect, and thoroughly furnish him to all good works, that is, make him perfect in all the duties of their callings: that same word is sufficient to salvation. But Scripture serves for all these uses: and therefore it is sufficient: and unwritten traditions are superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, Of Traditions</span></figcaption>

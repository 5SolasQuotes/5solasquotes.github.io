<main class="wrap"><figure class="quote" id="q-792cfe5dde" data-kw="">
<blockquote><p>What shall it profit a man, if he gain the whole world, and lose his own soul? said our Saviour, who was to lay down a ransom for it, and knew well that it would cost infinitely more than the world was worth. Yet, the most of men value their own souls at a far lower rate than the whole world, losing them for broken morsels of it: yea, many times for vain hopes that are never accomplished. And as these men make a miserable bargain, so on the contrary, they that lose the world, or any thing worldly, yea, though it were the whole, to save their souls, make a profitable loss of it.

Nature teaches men to hazard and lose all for the life of the body rather than lose it, (although it proves many times very uncomfortable by the loss of these outward things,) and yet, the most part of men pass their whole life-time without one serious thought of the excellency and importance of their souls, whose life and happiness is of a higher nature, and neither consists in, nor depends upon, any thing here below. Hence it is, that while they use the helps of this present life, and the defences of it when it is in danger, and use them with so much diligence and attention, the means of that better life of their better part, their souls, they either use not at all, or so slightly and coldly that they never find salvation in them.

You may find it some way in yourselves: the threatenings and preparations of men against you, have awakened and roused you more to think upon means of your temporal safety; but how few are sensible and afraid of the wrath of God, who, as our Saviour tells us, can kill both body and soul, and cast them into hell! You want not frequent advertisement from the word of God, so plentifully preached, that many are perishing, one part in gross ignorance of God, another in profane and licentious living, and the greatest part in a formal and lifeless profession of religion, without the power of it; and yet, where are they who lay it to heart, and bestir themselves to rescue their souls from destruction?

Certainly, whatsoever men profess, it is unbelief that is the cause of impenitence. Men are not convinced of the purity of God’s nature, nor sensible of the impurity of their own; therefore they apply not themselves in good earnest to the work of repentance, and to reformation, the liveliest part of it. Labour, then, for a more active and practical knowledge of God and Divine truths, such as may humble and renew your souls; not only that you may be delivered from outward troubles that threaten you, but much more, that you may escape the wrath to come.

And because neither the word preached, nor judgments, nor mercies that are set before you, are sufficient to quicken a dead soul, or soften a hard heart, without the effectual concurrence of the Spirit of God, let us have recour.se to the throne of grace, by humble and earnest prayer, in the name and mediation of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 93-94.</span></figcaption>

<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>

<blockquote><p>Good natural children will not only become obedient to the commandment of their parents, but also have a diligent eye to their doings, and gladly follow the same. So, if we will be the children of our heavenly Father, we must be careful to keep the Christian Sabbath day, which is the Sunday; not only for that it is God’s express commandment, but also to declare ourselves to be loving children in following the example of our gracious Lord and Father. Thus it may plainly appear, that God’s will and commandment was to have a solemn time and standing day in the week, wherein the people should come together and have in remembrance his wonderful benefits, and to render him thanks for them, as appertaineth to loving, kind, and obedient people.

This example and commandment of God the godly Christian people began to follow immediately after the ascension of our Lord Christ, and began to choose them a standing day in the week to come together in; yet not the seventh day, which the Jews kept, but the Lord’s day, the day of the Lord’s resurrection, the day after the seventh day, which is the first of the week. Of the which day mention is made by St. Paul on this wise: In the first day of the sabbath let every man lay up what he thinketh good, meaning for the poor. By the first day of the sabbath is meant our Sunday, which is the first day after the Jews’ seventh day.

And in the Apocalypse it is more plain, where as St. John saith, I was in the Spirit upon the Sunday. Sithence [sic] which time God’s people hath always in all ages without gainsaying used to come together upon the Sunday, to celebrate and honour the Lord’s blessed Name, and carefully to keep that day in holy rest and quietness, both men, women, child, servant, and stranger. For the transgression and breach of which day God hath declared himself much to be grieved, as it may appear by him who for gathering of sticks on the Sabbath day was stoned to death.

But, alas, all these notwithstanding, it is lamentable to see the wicked boldness of those that will be counted God’s people, who pass nothing at all of keeping and hallowing the Sunday. And these people are of two sorts. The one sort, if they have any business to do, though there be no extreme need, they must not spare for the Sunday; they must ride and journey on the Sunday; they must drive and carry on the Sunday; they must row and ferry on the Sunday; they must buy and sell on the Sunday; they must keep markets and fairs on the Sunday: finally, they use all days alike; workdays and holy days are all one.

The other sort yet is worse. For, although they will not travail nor labour on the Sunday as they do on the week day, yet they will not rest in holiness, as God commandeth; but they rest in ungodliness and in filthiness, prancing in their pride, pranking and pricking, pointing and painting themselves, to be gorgeous and gay; they rest in excess and superfluity, in gluttony and drunkenness, like rats and swine; they rest in brawling and railing, in quarrelling and fighting; they rest in wantonness, in toyish talking, in filthy fleshliness; so that it doth too evidently appear that God is more dishonoured and the devil better served on the Sunday than upon all the days in the week beside.

And, I assure you, the beasts, which are commanded to rest on the Sunday, honour God better than this kind of people; for they offend not God, they break not their holy day. Wherefore, O ye people of God, lay your hands upon your hearts; repent and amend this grievous and dangerous wickedness; stand in awe of the commandment of God; gladly follow the example of God himself; be not disobedient to the godly order of Christ’s Church, used and kept from the Apostles’ time until this day; fear the displeasure and just plagues of Almighty God, if ye be negligent and forbear not labouring and travailing on the Sabbath day or Sunday, and do not resort together to celebrate and magnify God’s blessed Name in quiet holiness and godly reverence.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Good natural children will not only become obedient to the commandment of their parents, but also have a diligent eye to their doings, and gladly follow the same. So, if we will be the children of our heavenly Father, we must be careful to keep the Christian Sabbath day, which is the Sunday; not only for that it is God’s express commandment, but also to declare ourselves to be loving children in following the example of our gracious Lord and Father. Thus it may plainly appear, that God’s will and commandment was to have a solemn time and standing day in the week, wherein the people should come together and have in remembrance his wonderful benefits, and to render him thanks for them, as appertaineth to loving, kind, and obedient people.

This example and commandment of God the godly Christian people began to follow immediately after the ascension of our Lord Christ, and began to choose them a standing day in the week to come together in; yet not the seventh day, which the Jews kept, but the Lord’s day, the day of the Lord’s resurrection, the day after the seventh day, which is the first of the week. Of the which day mention is made by St. Paul on this wise: In the first day of the sabbath let every man lay up what he thinketh good, meaning for the poor. By the first day of the sabbath is meant our Sunday, which is the first day after the Jews’ seventh day.

And in the Apocalypse it is more plain, where as St. John saith, I was in the Spirit upon the Sunday. Sithence [sic] which time God’s people hath always in all ages without gainsaying used to come together upon the Sunday, to celebrate and honour the Lord’s blessed Name, and carefully to keep that day in holy rest and quietness, both men, women, child, servant, and stranger. For the transgression and breach of which day God hath declared himself much to be grieved, as it may appear by him who for gathering of sticks on the Sabbath day was stoned to death.

But, alas, all these notwithstanding, it is lamentable to see the wicked boldness of those that will be counted God’s people, who pass nothing at all of keeping and hallowing the Sunday. And these people are of two sorts. The one sort, if they have any business to do, though there be no extreme need, they must not spare for the Sunday; they must ride and journey on the Sunday; they must drive and carry on the Sunday; they must row and ferry on the Sunday; they must buy and sell on the Sunday; they must keep markets and fairs on the Sunday: finally, they use all days alike; workdays and holy days are all one.

The other sort yet is worse. For, although they will not travail nor labour on the Sunday as they do on the week day, yet they will not rest in holiness, as God commandeth; but they rest in ungodliness and in filthiness, prancing in their pride, pranking and pricking, pointing and painting themselves, to be gorgeous and gay; they rest in excess and superfluity, in gluttony and drunkenness, like rats and swine; they rest in brawling and railing, in quarrelling and fighting; they rest in wantonness, in toyish talking, in filthy fleshliness; so that it doth too evidently appear that God is more dishonoured and the devil better served on the Sunday than upon all the days in the week beside.

And, I assure you, the beasts, which are commanded to rest on the Sunday, honour God better than this kind of people; for they offend not God, they break not their holy day. Wherefore, O ye people of God, lay your hands upon your hearts; repent and amend this grievous and dangerous wickedness; stand in awe of the commandment of God; gladly follow the example of God himself; be not disobedient to the godly order of Christ’s Church, used and kept from the Apostles’ time until this day; fear the displeasure and just plagues of Almighty God, if ye be negligent and forbear not labouring and travailing on the Sabbath day or Sunday, and do not resort together to celebrate and magnify God’s blessed Name in quiet holiness and godly reverence.”

— John Jewell, An Homily on the Place and Time of Prayer in Thomas Cranmer and John Jewell, The Two Books of Homilies Appointed to be Read in Churches">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGood+natural+children+will+not+only+become+obedient+to+the+commandment+of+their+parents%2C+but+also+have+a+diligent+eye+to+their+doings%2C+and+gladly+follow+the+same.+So%2C+if+we+will+be+the+children+of+our+heavenly+Father%2C+we+must+be+careful+to+keep+the+Christian+Sabbath+day%2C+which+is+the+Sunday%3B+not+only+for+that+it+is+God%E2%80%99s+express+commandment%2C+but+also+to+declare+ourselves+to+be+loving+children+in+following+the+example+of+our+gracious+Lord+and+Father.+Thus+it+may+plainly+appear%2C+that+God%E2%80%99s+will+and+commandment+was+to+have+a+solemn+time+and+standing+day+in+the+week%2C+wherein+the+people+should+come+together+and+have+in+remembrance+his+wonderful+benefits%2C+and+to+render+him+thanks+for+them%2C+as+appertaineth+to+loving%2C+kind%2C+and+obedient+people.%0A%0AThis+example+and+commandment+of+God+the+godly+Christian+people+began+to+follow+immediately+after+the+ascension+of+our+Lord+Christ%2C+and+began+to+choose+them+a+standing+day+in+the+week+to+come+together+in%3B+yet+not+the+seventh+day%2C+which+the+Jews+kept%2C+but+the+Lord%E2%80%99s+day%2C+the+day+of+the+Lord%E2%80%99s+resurrection%2C+the+day+after+the+seventh+day%2C+which+is+the+first+of+the+week.+Of+the+which+day+mention+is+made+by+St.+Paul+on+this+wise%3A+In+the+first+day+of+the+sabbath+let+every+man+lay+up+what+he+thinketh+good%2C+meaning+for+the+poor.+By+the+first+day+of+the+sabbath+is+meant+our+Sunday%2C+which+is+the+first+day+after+the+Jews%E2%80%99+seventh+day.%0A%0AAnd+in+the+Apocalypse+it+is+more+plain%2C+where+as+St.+John+saith%2C+I+was+in+the+Spirit+upon+the+Sunday.+Sithence+%5Bsic%5D+which+time+God%E2%80%99s+people+hath+always+in+all+ages+without+gainsaying+used+to+come+together+upon+the+Sunday%2C+to+celebrate+and+honour+the+Lord%E2%80%99s+blessed+Name%2C+and+carefully+to+keep+that+day+in+holy+rest+and+quietness%2C+both+men%2C+women%2C+child%2C+servant%2C+and+stranger.+For+the+transgression+and+breach+of+which+day+God+hath+declared+himself+much+to+be+grieved%2C+as+it+may+appear+by+him+who+for+gathering+of+sticks+on+the+Sabbath+day+was+stoned+to+death.%0A%0ABut%2C+alas%2C+all+these+notwithstanding%2C+it+is+lamentable+to+see+the+wicked+boldness+of+those+that+will+be+counted+God%E2%80%99s+people%2C+who+pass+nothing+at+all+of+keeping+and+hallowing+the+Sunday.+And+these+people+are+of+two+sorts.+The+one+sort%2C+if+they+have+any+business+to+do%2C+though+there+be+no+extreme+need%2C+they+must+not+spare+for+the+Sunday%3B+they+must+ride+and+journey+on+the+Sunday%3B+they+must+drive+and+carry+on+the+Sunday%3B+they+must+row+and+ferry+on+the+Sunday%3B+they+must+buy+and+sell+on+the+Sunday%3B+they+must+keep+markets+and+fairs+on+the+Sunday%3A+finally%2C+they+use+all+days+alike%3B+workdays+and+holy+days+are+all+one.%0A%0AThe+other+sort+yet+is+worse.+For%2C+although+they+will+not+travail+nor+labour+on+the+Sunday+as+they+do+on+the+week+day%2C+yet+they+will+not+rest+in+holiness%2C+as+God+commandeth%3B+but+they+rest+in+ungodliness+and+in+filthiness%2C+prancing+in+their+pride%2C+pranking+and+pricking%2C+pointing+and+painting+themselves%2C+to+be+gorgeous+and+gay%3B+they+rest+in+excess+and+superfluity%2C+in+gluttony+and+drunkenness%2C+like+rats+and+swine%3B+they+rest+in+brawling+and+railing%2C+in+quarrelling+and+fighting%3B+they+rest+in+wantonness%2C+in+toyish+talking%2C+in+filthy+fleshliness%3B+so+that+it+doth+too+evidently+appear+that+God+is+more+dishonoured+and+the+devil+better+served+on+the+Sunday+than+upon+all+the+days+in+the+week+beside.%0A%0AAnd%2C+I+assure+you%2C+the+beasts%2C+which+are+commanded+to+rest+on+the+Sunday%2C+honour+God+better+than+this+kind+of+people%3B+for+they+offend+not+God%2C+they+break+not+their+holy+day.+Wherefore%2C+O+ye+people+of+God%2C+lay+your+hands+upon+your+hearts%3B+repent+and+amend+this+grievous+and+dangerous+wickedness%3B+stand+in+awe+of+the+commandment+of+God%3B+gladly+follow+the+example+of+God+himself%3B+be+not+disobedient+to+the+godly+order+of+Christ%E2%80%99s+Church%2C+used+and+kept+from+the+Apostles%E2%80%99+time+until+this+day%3B+fear+the+displeasure+and+just+plagues+of+Almighty+God%2C+if+ye+be+negligent+and+forbear+not+labouring+and+travailing+on+the+Sabbath+day+or+Sunday%2C+and+do+not+resort+together+to+celebrate+and+magnify+God%E2%80%99s+blessed+Name+in+quiet+holiness+and+godly+reverence.%E2%80%9D%0A%0A%E2%80%94+John+Jewell%2C+An+Homily+on+the+Place+and+Time+of+Prayer+in+Thomas+Cranmer+and+John+Jewell%2C+The+Two+Books+of+Homilies+Appointed+to+be+Read+in+Churches&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f3c9c8355.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f3c9c8355.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/08/the-second-book-of-homilies-on-the-evil-of-profaning-the-christian-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

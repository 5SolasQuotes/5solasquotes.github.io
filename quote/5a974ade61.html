<main class="wrap"><figure class="quote" id="q-5a974ade61" data-kw="">
<blockquote><p>Now this Captivity of the people of the Jews, as it was res gesta, a thing real and done, an affliction brought upon them for their sinning against the Lord: So I find it in Scripture applied to three things, as a resemblance and type thereof. First, It is applied to the natural estate of all men, who were at first created free, being subject to none, but only to him who is Lord over all, but are now by sin like the Jews in an estate of bondage. This application I find made by the Apostle, 2 Cor. 6.17. Come out from among them, touch no unclean thing. Which words were first spoken to and of the Jews, in Esay 52. ver. 4.11. calling them out of their Captivity. But the Apostle applies them to all, whether Jews or Gentiles in their natural uncleanness, calling upon them to come out of the sinful pollution of the world.

Secondly, It is applied to the state of the Church under the tyranny of Antichrist; for as that Eastern Babel did afflict and oppress the Jews, which were then the Church of God; so Rome the Western Babel doth keep under the Church of God now, and long time hath done, and therefore the people of God are called to come out of her, as the Jews were called to come forth from the Eastern Babel, Jer. 51.6.8. Jeremie speaks it of Eastern Babel, John applies it to the Western, yet not mis-applying, because the one was a type of the other.

Thirdly, It is applied to the present miserable forsaken condition of the Jews, in which they now lie, they being now a refuse people, cast off by God, for their casting off of Christ. He came to his own, but his own received him not; he would have gathered them, but they would not be gathered, they rejected him, therefore he also rejected them: so that they are now scattered abroad again, and become a vassal, a captive people, having no free State of their own, but living under the dominion of other people. This estate of theirs, Esay [Isaiah] sets forth in words not much differing from my text; This people (saith he) is robbed and spoiled, and shall be snared in dungeons; they shall be hid in prison-houses; they shall be for a prey, and none shall deliver, for a spoil, and none shall say, restore.

And this their present bondage is typed out by their captivity in Babylon; as we may see by comparing Rom. 11.26. with Esay 59.20. That which was in the letter of it, spoken of their deliverance out of Babylon, from under the Chaldeans, the same doth the Apostle apply to their last deliverance, which is yet to come. The redeemer shall come to Sion, and turn ungodliness from Jacob. As their captivity in Babel, resembled their present captive condition now, so their deliverance out of Babel then, typed out their deliverance which shall come unto them out of their present misery, when the Redeemer shall again come unto Sion, and turn away ungodliness from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-bulkeley.html">Peter Bulkeley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The gospel-covenant; or The covenant of grace opened</cite>, (London: Benjamin Allen, 1646), pp 2-3.</span></figcaption>

<blockquote><p>Yet 2. we assert, That by this rest all sort of actions are not condemned, but only such as are inconsistent with the end and scope of this command; as by other Scriptures, and the practice of Christ and the Saints is clear: we conceive therefore these to be permitted: …

5. Works of necessity, such as… much more preparing honestly sober allowance for the sustaining of the body, as the disciples plucked the ears of corn, Mt. 12, and the Jews, Ex. 16:23, dressed the manna on the Sabbath, though they were not to gather it, yet on the sixth day to bake and seethe a part, and to keep a part till the morrow, but not till the day following, and therefore they behoved to dress it also; yea, Jesus Christ went Himself to a feast on the Sabbath, Lk. 14 (that He might take that opportunity by his spiritual discourse to edify the company as He did notably) which He would not have done had it been unlawful to dress any meat on the Sabbath, yet his carriage was such at that feast most remarkably, that it would be followed as a pattern by such as may be invited by others to eat with them, and shall be disposed to go on the Sabbath: And if this were the design of the inviters and invited, men’s eating together on that day would not readily prejudice the sanctification of it, as very often it does…

6. Works of comliness, tending to honest or decent walking, as putting on of clothes honestly, making the house clean from any uncleanness that may fall in it throughout the Sabbath, etc. By all which believers have allowance, 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord hath not streightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will He have their consciences to be festered with inextricable scruples: He leaves it to men on other days, how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but men would look, 1 to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (d. 1658; London: 1675), 4th Commandment, Sanctification of the Sabbath, p. 277, 279-80</span></figcaption>

<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 140. This has been lately practiced in London among some of the Sectaries, that love-feasts, or feasts of love (with which the Lord’s Supper is to be administered also) is a perpetual ordinance of Christ, at which only Church-members are to be present, and to partake.</p></blockquote>

<blockquote><p>This command, as all the rest of the decalogue, was written twice by the finger of God in tables of stone. And hereof there was a double reason:- First, That it was a stable renovation and objective representation of that law, which being implanted on the heart of man, and communicated unto him in his creation, was variously defaced; partly by the corruption and loss of that light, through the entrance of sin, which should have guided us in the right apprehension and understanding of its dictates, and of the obedience that it required; partly through a long course of a corrupt conversation, which the world had, in the pursuit of the first apostasy, and according to the principles of it, plunged itself into.

God now again fixed that law objectively, in a way of durable preservation, which in its primitive seat and subject was so impaired and defaced. And hereof the additions mentioned, with peculiar respect unto the application of the whole, or any part of it, unto that people, were no impeachment, as is acknowledged in the preface given unto them all containing a motive unto their dutiful observance of the whole. And hence this law must necessarily be esteemed a part of the antecedent law of nature; neither can any other reason be given why God wrote it himself with those and only those that are so, in tables of stone.

Secondly, This was done as an emblem that the whole decalogue was a representation of that law which, by his Spirit, he would write in the fleshy tables of the hearts of his elect. And this is well observed by the church of England, which, after the reading of the whole decalogue, the fourth command among the rest, directs the people to pray that God would write all these laws in their hearts.

Now, this concerneth only the moral law; for although obedience unto all God’s ceremonial and typical institutions, whilst they were in force, was moral, and a part of the law written in the heart, or required in general in the precepts of the first table of the decalogue, yet those laws themselves had no place in the promise of the covenant that they should be written in our hearts; for if it should be so, especial grace would be yet administered for the observation of those laws now they are abolished, which would not only be vain and useless, but contradictory to the whole design of the grace bestowed upon us, which is to be improved in a due and genuine exercise of it. Neither doth God bestow any grace upon men but withal he requires the exercise of it at their hands. If, then, this law was written in tables of stone together with the other nine, that we might pray and endeavour to have it written in our hearts, according to the promise of the covenant, it is, and must be, of the nature of the rest, that is, moral, and everlastingly obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. William H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 367-68 (emphasis added).</span></figcaption>

<blockquote><p>The precept of the Sabbath observance is moral in one respect, insofar as it commands man to give some time to the things of God, according to Ps. 45:11: ‘Be still and see that I am God.’ In this respect it is placed among the precepts of the decalogue: but not as to the fixing of the time, in which respect it is a ceremonial precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, of 2, quest. 100, article 3, reply to Objection 2</span></figcaption>

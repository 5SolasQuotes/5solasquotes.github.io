<blockquote><p>True Christians are elect according to the foreknowledge of God the Father; they are such whom God, according to the counsel of His own will, according to His own purpose and grace, chose from all eternity to be a holy and peculiar people to Himself, to glorify Him here on earth that they might be glorified by Him hereafter in heaven. And this election evidences itself in the sanctification of the Spirit.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9caac3001" data-kw="">
<blockquote><p>For God, who made man, did himself prepare in his predestination, both the gift of illumination to believe, and the gift of perseverance to profit and persevere, and the gift of glorification to reign, tor such to whom he pleased to give it: who also doth not any otherways perform in deed than was ordained by his unchangeable will.

The truth of which predestination, whereby the apostle witnesseth we were predestinated in Christ before the foundation of the world, if any one refuse to receive with the belief of the heart, or to utter with the confession of the mouth, if, before the last day of this present life, he lay not aside the obstinacy of his impiety, whereby as a rebel he withstandeth the true and living God, it is manifest that he doth not belong to the number of those which God did before the foundation of the world freely choose in Christ, and predestinated unto the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Incarnatione et Gratia Christi</cite>, Quoted in William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 346.</span></figcaption>

</figure><figure class="quote" id="q-06f4f04b52" data-kw="">
<blockquote><p>The Church of England believeth, that Predestination unto life is the eternal purpose of God, whereby before the foundations of the world were laid, he constantly decreed by his counsel unto us unknown to deliver from the curse &amp; destruction them whom he chose in Christ out of mankind, &amp; (as vessels made unto honour) through Christ to bring them to eternal salvation. Whereupon they who are endowed with so excellent benefit of God, are called according to his purpose, and that by his spirit working in a fit time.

But you Mai. [Richard] Hoo[ker]. seem to vs, to affirm contrary, when you say: If any man doubt how God should accept such prayers in case they be opposite to his will, or not grant them, if they be according to that him self willeth: Our answer is, that such suits God accepteth, in that they are conformable to his general inclination, which is that all men might be saved: yet always he granteth them not, for so much as there is in God a more private occasioned will, which determineth the contrary. Here we beg your aide to make manifest unto us, how God eternally predestinateth by a constant decree, them whom he calleth and saveth (as our Church professeth) and yet hath, as you say, a general inclination that all men might be saved:

Whether he foresaw not something that occasioned his will otherwise; so that he elected not all, but only them whom he calleth and saveth, or that of his general inclination he elected all men, but some more privately occasioned him in time to alter his will, and to refuse them; or that some men gave God occasion that he saveth them, though he never decreed it before the foundations of the world. What meant the blessed Apostle where he sayeth: Whom he predestinated them also he called: and whom he called them also he justified. &amp;c.

Is this to be understood of a constant decree, as we say, or of an inclination? He sayeth: God worketh all things after the counsel of his own will. Is this to be understood, that upon occasion sometimes he either altereth his counsel, or decreeth something which he had not thought upon before. Saint James saith, that in God there is no variableness nor shadow of turning. Is not this more then a variableness or shadow of turning to incline one way, and upon occasion to decree another.

Do not these words of yours give some place unto chance and fortune: Do they not make GOD as a man not of an all-sufficient knowledge, wisdom, and counsel, but inclinable some one way, till by occasion he find a more better way. Where is that God you speak of in your first book, of whom and through whom and for whom are all things. And where is that law by which he worketh, which you there call aeternall, and therefore can have no shew or colour of mutability.

Have we not cause to fear that the witty schoolmen have seduced you, and by their conceited distinctions made you forget, That you are neither able nor worthy to open and look into the book of God’s law, by which he guideth the world. And yet you will say, There is in God an occasioned will. Good Mai. Hoo[ker]. help us here, and shew us how we may think, that you incline not to the error of popery touching works foreseen, and that you favour our church’s belief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 15-17.</span></figcaption>

<blockquote><p>III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent</cite>, … ed. Seth Ward trans. AI (d. 1643; Gallibrand, 1658), pp. 152-53</span></figcaption>

<div class="actions"><button class="copy" data-copy="“III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.”

aith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For the increasing also of your Inward Peace, Spiritual Joy and Comfort, Give all diligence to make your Calling and Election sure; Examining your selves frequently and seriously, whether Jesus Christ be in you yea or no. But how shall this be done? By comparing your Hearts, Lives and Experiences with the written Word of God, through the assistance and guidance of Gods Holy Spirit. For, to this End the Word of God was written to us, and the Spirit of God is given to us, that we may know the things that are freely given to us of God, and that we may know that we have eternal life.</p></blockquote>

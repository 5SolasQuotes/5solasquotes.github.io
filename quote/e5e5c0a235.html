<main class="wrap"><figure class="quote" id="q-e5e5c0a235" data-kw="">
<blockquote><p>It has sometimes been argued that George Gillespie modified his strongly theonomic views in Wholesome severity reconciled with Christian liberty (1644/5) when he wrote his famous work Aaron’s rod blossoming (1646). This assumption is based on an aside comment in the opening chapter of the latter book, where he merely expresses sympathy with those who hold that the penal sanctions of the Mosaic judicials remain valid (posted here). On its own, this is a very weak basis upon which to build a thesis of radical discontinuity in the thought of George Gillespie. It is, however, fundamentally refuted by a close examination of the main text of Aaron’s rod blossoming. In it, Gillespie states that the capital punishments are part of the law of nature and are common to all nations. Thus they are in no way abrogated in the New Testament:

As touching the capital punishment of malefactors by the hand of the magistrate, it being founded upon the very law of nature, and common to all nations without as well as within the church (so that very often those from whom a malefactor is cut off are not so much as by profession the church and people of God), it cannot so fitly resemble the separation of casting out of a man from having part or portion of the inheritance of the saints in light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s rod blossoming; or, the divine ordinance of church government vindicated</cite>, (1646; Edinburgh, 1844), p. 29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Here, however, where God compares polygamy with divorce, he says that polygamy is the worse and more detestable crime; for the husband impurely connects himself with another woman, and then, not only deals unfaithfully with his wife to whom he is bound, but also forcibly detains her: thus his crime is doubled. For if he replies and says that he keeps the wife to whom he is bound, he is yet an adulterer as to the second wife: thus he blends, as they say, holy with profane things; and then to adultery and lasciviousness he adds cruelty, for he holds under his authority a miserable woman, who would prefer death to such a condition; for we know what power jealousy has over women. And when any one introduces a harlot, how can a lawful wife bear such an indignity without being miserably tormented?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-0104e6a85c" data-kw="">
<blockquote><p>Gentlemen, and Fellow Soldiers,

IT is not a little satisfaction to me, That having an Army composed of so many different Nations; I do notwithstanding find them unanimously bent to maintain and prosecute, to the utmost, the Cause I have now undertaken. And though by several Declarations, I have (as I believe) sufficiently satisfied both you, and all England, of the Sincerity, as well as the necessity of these my Actions and Designs. I shall not, however, think it unnecessary, or superfluous, briefly to repeat and Sum up some things which may serve you for satisfaction, as to matters past, as well as Encouragement for the Future.

That England, and the United Provinces, are the Two main Pillars, whereon all the Reformed Churches of Europe seem to depend, is to us rather the Envy than the Doubt of our Adversaries now at the Court of Rome, and lately of England, not only to weaken, but wholly to root out even the Name of Protestant, each Man’s private Diurnal, as well as our public Annals, do sufficiently Testify; nor is that Breach made by the restless Malice of our Enemies (urged by a late Opportunity) in the Laws and Liberties of these Kingdoms, so effectually made up as to free us from the Suspicion and Fear of a more dangerous Relapse.

What therefore remains, but that we apply such Remedies, as shall not only for the present Ease us, but for the future Secure us. Lenitives have, to our cost, been too long thrown away on the Cankered Hearts of our Irreconcilable Enemies. God’s Providence, not our Swords, proving the only Antidote against their Poison. The present Persecution of the poor Protestants in Ireland, is but as a Prologue to their intended Miseries, had it not by Providence been timely prevented: nor did the Laws and Liberties of the People of England, seem a sufficient Sacrifice to their Hungry Zeal for the present, unless by Methods as Sophistical as their Doctrine, they might bind and secure them to Posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-william-iii.html">King William III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prince of Orange. His speech, in defence of the Protestant religion</cite>, (London: G. R., 1688), unpaginated.</span></figcaption>

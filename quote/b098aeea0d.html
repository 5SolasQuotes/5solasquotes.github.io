<main class="wrap"><figure class="quote" id="q-b098aeea0d" data-kw="">
<blockquote><p>Yea the Church does never wholly cease to be visible, for although sometime there scarce appear a Church anywhere so pure that one may fly unto it in communion of the same worship in all things: yet the Church does in some sort abide visible in that very impurity of worship and profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, (London, 1642), bk. 1, ch. 31, sect. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<blockquote><p>The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>

</figure><figure class="quote" id="q-93305f02b0" data-kw="">
<blockquote><p>By the root he [Paul] understands not their nearest parents, who perhaps were wicked; but those first fathers of the Jewish people, Abraham, Isaac, and Jacob, to whom was made and confirmed the promise and covenant, that God would be their God, and the God of their whole seed, by a perpetual covenant. Therefore all their posterity, who had not altogether apostatized to the gods of the Gentiles, were, I say they all were, in the covenant, and they were judged holy by reason of covenant holiness, foederis sanctitate sancti judicabantur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 227, as quoted by Thomas Boston, Miscellaneous Questions, Question 6, in Works, vol. 6, p.145. The larger context is about New Testament Baptism. | Rom. 11:16 “If the root be holy, so are the branches.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“By the root he [Paul] understands not their nearest parents, who perhaps were wicked; but those first fathers of the Jewish people, Abraham, Isaac, and Jacob, to whom was made and confirmed the promise and covenant, that God would be their God, and the God of their whole seed, by a perpetual covenant. Therefore all their posterity, who had not altogether apostatized to the gods of the Gentiles, were, I say they all were, in the covenant, and they were judged holy by reason of covenant holiness, foederis sanctitate sancti judicabantur.”

</figure><figure class="quote" id="q-5eb1da003c" data-kw="">
<blockquote><p>III. …the church can be regarded either as to its external or its internal state. The external answers to the external call by the Word, upon which depends the external form of the church, placed in a profession of faith or an external and sensible communion of the same sacred things… The question [Turretin addresses] is not whether the reprobate belong to the external state (which we do not deny)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, 3rd Question, ‘Besides the elect, are reprobates and infidels (whether secret or open) also true members of the church of Christ? We deny against the Romanists., p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-5e10d988a6" data-kw="">
<blockquote><p>I distinguish between the Church and her external polity: That which is essential to the Church’s being never ceases, but that which is essential to her outward polity may, because polity itself is not essential. The Church, for being, like Christ as God, never dies; but in her external order, like Christ as man, she dies and rises again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lazarus-seaman.html">Lazarus Seaman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Diatribe Proved to be Paradiatribe</cite>, ... (London: T.R., 1647), ‘Answer to the Tract bearing title, The Judgment of the Reformed Churches’, p. 49 Seaman (d. 1675) was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“I distinguish between the Church and her external polity: That which is essential to the Church’s being never ceases, but that which is essential to her outward polity may, because polity itself is not essential. The Church, for being, like Christ as God, never dies; but in her external order, like Christ as man, she dies and rises again.”

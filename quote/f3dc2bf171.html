<blockquote><p>[On Ps. 51] Verse 5 [” in sin has my mother conceived me”] From the moment, my God, of this poor creature’s conception, even already had coruption catched hold: from that time, I say, that my mother having conceived me, did give me living heat in her womb, vice was come within me, as the root which sithence has brought forth those sour and venemous fruits…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Meditations upon Eight Psalms</cite>, ... (London: 1582), on Ps. 51, verse 5</span></figcaption>

</figure><figure class="quote" id="q-4fa34fcbb3" data-kw="">
<blockquote><p>III. The union of pastor and flock in relation makes that which is a form-aptitudinal (as the soul to the body) to be the form in act (as the union of soul and body)… IV. Union is in order to communion, which is primary by the exercise of the formal powers on the matter, and secondary by the action of all the parts according to their several capacities and offices. … VI. These several degrees of union are found in bodies natural and politic: 1. The union of soul and body makes a man, and an embryo before it be organized. 2. The union of the body makes it capable of the soul’s further operation. 3. The union of the organical, chief parts (as heart, lungs, etc.) to the rest make it a true human body completed to the nutriment and action of life. 4. That it have hands and fingers, feet and toes, and all integral parts, makes it an entire body. 5. The due site, temperament and qualities of each part make it a sound body. 6. Comely color, hair, action, going, speech, etc. make it a comely body. 7. To have all parts of equal quantity and office would make it uncomely: and to have the same hair, color, etc. is unnecessary at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

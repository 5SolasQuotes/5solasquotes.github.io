<main class="wrap"><figure class="quote" id="q-ce1af2953d" data-kw="">
<blockquote><p>He that thinketh to be saved by his works calleth him self Christ

For he calleth him self his saviour which pertaineth to Christ only. What is a saviour but he that saveth, &amp; he sayeth I save my self, which is as much to say as I am Christ for Christ only is the saviour of the world we should do no good works for ye intend to get the inheritance of heaven or remission of sin. For who so ever believeth to get the inheritance of heaven or remission of sin through works, he believeth not to get that for Christ’s sake. And they that believe not that their sins are forgiven them and that they shall be saved for Christ’s sake, they believe not the gospel. For the gospel sayeth, you shall be saved for Christ’s sake, your sins are forgiven for Christ’s sake. He that believeth not the gospel believeth not God.

So it followeth that they which believe to be saved by their works, or to get remission of their sins by their own deeds believe not God: but recount him as a liar &amp; so utterly deny him to be God. Thou wilt say, shall we then do no good deeds? I say not so but I say we should do no good works for the intent to get the inheritance of heaven or remission of sin. For if we believe to get the inheritance of heaven through good works, then we believe not to get it through the promise of God: or if we think to get remission of our sin the we believe not that they are forgiven us, &amp; so we count God a liar. For God sayeth, thou shalt have the inheritance of heaven for my son’s sake, thy sins are forgiven that for his son’s sake &amp; you say it is not so, but I will win it through my works. So I condemn not good deeds. But I condemn the false trust in any works, for all the works that a man putteth confidence in are therewith poisoned &amp; become evil.

Therefore do ye good works but beware you do then not to get any good through that, for if thou do, thou receivest the good not as the gift of God but as debt to the and makest thy self fellow with God because thou wilt take nothing of him for nought. What needeth he any thing of thine which giveth all thing &amp; is not the poorer? Therefore do nothing to him but take of him, for he is a gentle lord, &amp; with a gladder will giveth us all that we need, then we take it of him, therefore if we wait ought let us with our selves. Press not then to the inheritance of heaven through presumption of thy good works for if thou do, thou countest thy self holy and equal to him because thou wilt take nothing of him for nought: &amp; so shalt thou fall as Lucifer fell for his pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-hamilton.html">Patrick Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Patrick’s Places</cite>, trans. John Frith (Antwerp: S. Cock, [1531]), unpaginated.</span></figcaption>

<blockquote><p>Justification is opposed to condemnation: “Who shall lay anything to the charge of God’s elect? It is God that justifieth. Who is he that condemneth?” (Rom. 8:33, 34). As therefore accusation and condemnation occur only in a trial, so also justification. Nor can it be conceived how God can be said to condemn or to justify, unless either by adjudging to punishment or absolving us from it judicially.</p></blockquote>

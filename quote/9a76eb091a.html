<main class="wrap"><figure class="quote" id="q-9a76eb091a" data-kw="">
<blockquote><p>Your long silence hath made us speak, to utter to you our own troubles, and the sighs and groans of your helpless Flocks. We cannot inform you, but have only writ to stir you up by way of remembrance, and humbly to put you in mind, that you stir up the gift of God that is in you, and suffer not your worthy Talents to be buried in the Napkin, now the sinking Church and dying Religion hath such pressing need for their utmost improvement.

These Letters are to you in behalf of the poor Flocks, like the man of Macedonia crying to you, Come and help us: or, a Call to Archippus, to take heed to the Ministry that he hath received, that he fulfil it.

Fathers and Brethren, we unfeignedly reverence you, we magnify the grace of God in and unto you. Did not we reverence your Parts, Gifts and Graces, and esteem them every way so useful to the Churches, we should contentedly see you sit still, and never be at the pains to excite you. But our high value of you, hath made us humbly bold to expostulate the case a little with you, and passionately to beseech you, to remember how great a work it is that lies upon you, and to set your hands to it in this time of difficulty.

Some of yours were the holy hands by which we were called to our Office, when you made us publicly promise (according to the obligation of our Office) that we would never, for fear of any persecution, desist from preaching the Gospel; and far be it from our Fathers to withdraw, as soon as persecution begins. Suffer us with all modesty and submission, to reason with you. Hath not God said, Necessity is laid on you, and WO unto you if you preach not the Gospel? Who shall free you from that Wo, or loose your bonds of that necessity, if yet you sit still in silence?

Shall we mind you of Paul’s example and charge? No bonds nor afflictions could move him, nor make him shun to declare the whole counsel of God. And how strict is the command, That you take heed to your selves, and all the Flock, over whom the holy Ghost hath made you Bishops? And let it be noted, how pertinent the motive is, Because grievous Wolves are entered in, not sparing the Flock: And will you, at such a time, give over your care for the Flock? Are we not most dreadfully charged, before God, and our Lord Jesus Christ, and the elect Angels, to observe these things, and to preach the Word, and be instant, and reprove, rebuke, exhort with all LONG SUFFERING? and shall we flinch at the beginning of any Suffering? Are we not required to continue in Doctrine, as ever we would save our selves, or them that hear us? Hath not our Lord told us, That he that hath set his hand to the Plough, and looketh back, is not fit for the Kingdom of God?

Let us call upon your Bowels. Where there is no Vision, the People perish: and can you see them perish, when you have bread enough, and to spare? Further, Are not you they, that are set for the defence and confirmation of the Gospel? and will not you stand to your work, against the contradictions of men, that would make the work of the Lord to cease? Besides, now is the time for you to approve your selves to be Ministers of God, in much patience, affliction, necessity, distress, imprisonment, labour, watchings, fastings; by long-suffering, by kindness, by the Holy Ghost, by Love unfeigned, Word of Truth, Power of God, Armour of Righteousness, on the right hand and on the left.

Is not this the Work of your Office and Calling, To watch in all things, to suffer afflictions, and thereby to make full proof of your Ministry, and, as good Soldiers of Jesus Christ, to endure hardness? Shall you with Jonah, fly to Tarshish, when the Lord sends you about your work? will you not rather say, with resolution, as holy Nehemiah, Shall such a man as I flee? Who is there, that being as I am, would flee? &amp;c. And as the Apostles, your Leaders, when in your case; And now, Lord, behold their threatnings, and grant unto thy Servants, that with all boldness they may speak thy Word.</p></blockquote>

<blockquote><p>The charge and duty of Ministers is chiefly to preach the Gospel, and to announce and teach the Word of God to their people. They are therefore to be exhorted to forbear, and abstain from all manner of teaching that is either strange, or unfit, and not convenient or meet for edification, and to apply and conform themselves to the simplicity and ordinary stile of the Spirit of God, being most careful to bring and insert nothing into their preachings or Sermons that may cause the least prejudice to the honour &amp; authority of the holy Scripture; never preaching without taking for the Subject of their whole discourse a Text out of the holy Scripture, which they are to follow usually and punctually, exposing thereof as much as they shall be able, abstaining from all unnecessary amplifications, from all long, extravagant and not occasioned digressions, from a heap and number of common places and passages of the Scripture that are not needful, and from a vain recital or narration of divers, several fruit less expositions: not often, but very temperately and advisedly alleging the writings of the ancient Doctors; and less yet of prophane Authors and Histories: not handling their doctrine in a Scholastical manner, nor with mingling and mincing in of languages: In a word, they are to shun all that may serve for, or give the least suspicion or shew of ostentation. All which things that they may the better be observed, all Consistories, Colloquies, or Assemblies, and Synods, are to be very careful.</p></blockquote>

<blockquote><p>…a minister of the gospel may often preach the law to his hearers and yet not deserve to be called a legal preacher. He cannot preach the gospel faithfully and successfully unless he preaches the law in subservience to it. If he is a faithful and able minister of the New Testament, he will preach the law as a covenant of works and will press it on the consciences of secure sinners and self-righteous formalists. He will denounce the tremendous curse of it on those who continue under it and who rely securely on their own works for a title to eternal life in order to tear away every pillow of carnal security on which they repose themselves and to show them the vanity of every lying refuge. In proportion also as he is faithful, he will preach the law as a rule of life to them who believe. He will press on them the spiritual performance of every duty and a holy abhorrence of every sin. He will exhort them to perform all their duties from evangelical principles in a holy manner and to holy ends. Now if he preach the law in that manner, no man will be disposed to fix the odious character of a legal preacher on him but one who either is grossly ignorant or is an enemy both of the law and of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 121–22.</span></figcaption>

</figure><figure class="quote" id="q-d26ddcee72" data-kw="">
<blockquote><p>YOU have arrived at an important era in your history, an occasion when you are specially called upon to search and try your ways, to realise your responsibility to God, your entire dependence upon the Author of every good and perfect gift, to look steadily and deliberately both behind you and before you, and to adopt resolutions suited to your present circumstances, and fitted to bear extensively and permanently upon your future studies and labours. Your studies have hitherto been directed principally to the improvement of your intellectual powers, and the acquisition of secular knowledge.

They are now to be directed to the acquisition of the knowledge of God and of his revealed will. Hitherto, probably, your leading and immediate motives in the prosecution of your studies have been the mere pleasure of intellectual exertion and of the acquisition of knowledge, or, perhaps, the desire of distinction, or a wish to make a creditable preparation for what you had chosen as your future profession in life.

Now it may be expected that you have taken a closer and fuller view of the office of the Christian ministry to which you have professedly devoted yourselves, and of the purposes it was designed to serve, and that you feel that it is with God you have to do in this matter, that it is with him you are to Hold communion, and to him you are to have respect in all your studies and preparations connected with entering upon his more immediate service.

You have ere this time, I trust, been led to some serious reflection upon the end for which you were created, and the objects to which your powers and faculties ought to be devoted. You have been already giving some measure of serious and humble attention to the study of the word of God, and have been enabled to discern and apprehend the views unfolded there of your relation to God as his creatures, his subjects, and the transgressors of his law, and of the scheme of mercy which God devised and executed by sending his Son into the world to suffer and die for us. Through the knowledge and belief of these truths, you have been led, I trust, to flee for refuge to the hope set before you, to embrace Christ as all your salvation and all your desire.

Under the influence of these views, and under the guidance of the Holy Ghost, you have not only received Christ as the Way, the Truth, and the Life, for your own personal salvation, but you have resolved to devote your lives to the service of God in the gospel of his Son, to the great object of making God and Christ and salvation known to your fellow-men. Animated by this desire, and determined by God’s grace to carry this resolution into effect, you have come to this place in order that you may acquire the necessary knowledge, and make other necessary preparations for entering upon this important work.

This is the position you now occupy; these, I trust, are the motives by which you are animated, and the objects on which your desires are set; and if so, it may be reasonably expected that you will engage in the studies that now lie before you with an activity and a zeal, a seriousness and sense of responsibility, and at the same time with a cheerfulness and alacrity, which you have never known before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture I, pp 1-2.</span></figcaption>

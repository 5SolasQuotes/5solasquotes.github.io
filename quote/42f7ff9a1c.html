<main class="wrap"><figure class="quote" id="q-42f7ff9a1c" data-kw="">
<blockquote><p>Position 1. As there is no merit, good deserving, work or hire in the miserable sinner dying in his blood, dead in sins, out of his wit and disobedient, deceived and serving diverse lusts, Eze. 16:4-8; Eph. 2:1-4; Tit. 3:3-4, so there is as much love, man-kindness and free grace in heaven in the breast of Christ as would save all in hell, or out of hell. I speak this in regard, not of the Lord’s intention, as if He did bear all and every one of mankind a good will, purposing to save them. But because their lies and flows such a sea and ocean of infinite love about the heart and in the bowels of Jesus Christ as would over-save and out-love infinite worlds of sinners (so all could come and draw and drink, and suck the breasts of overflowings of Christ’s free grace) in regard of the intrinsical weight and magnitude of this love, that if you appoint banks to channel or marches to bound this free love, God should not be God, nor the Redeemer the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f94b0cc77a" data-kw="">
<blockquote><p>To all these we may add that the Lord in commanding reprobates to rest on Christ for salvation, though no salvation be purchased for them, deals sincerely and candidly with them: for first He commands them to believe no intention in God to save them by the death of his Son, nor says He any such thing to them, but only commands them to rely on Christ as an all-sufficient Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 419</span></figcaption>

</figure><figure class="quote" id="q-38fdad974a" data-kw="">
<blockquote><p>I. What was the will and intention of the Father and the Son in undergoing the death of the cross? Arminians: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that reconciliation and remission of sins might be obtained for all and every one, both those that perish and those that are to be saved, but applied only to believers. Therefore, although those things are obtained for all and every one, yet they are applied only to believers. Censure: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that the Son, through the ransom of his precious blood, might both obtain and apply remission of sins and eternal life to those whom the Father gave to him from eternity. Matthew 20:28; Hebrews 9:28; 1 Peter 2:24; Romans 3:25; 2 Corinthians 5:19; Colossians 1:21-22. To this pertain also those passages of Scripture, where Christ is said to have laid down his life for his sheep, to have given himself for his Church, to have redeemed the Church with his own blood. John 10:15; Ephesians 5:23, 25; Matthew 1:21; Acts 20:28.

II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, he is the Savior of the elect only. John 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Matt. 20:28, John 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning he died efficaciously for all his sheep. John 10:15. And in these all and alone there is a certain special universality, as is in Ambrose lib. 1 de vocat. gent. c. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.

III. Whether the death of Christ and his resurrection, and also his intercession, are of equal extent? Arminians: Christ died adequately for all sinners, he rose again and intercedes with the intention of saving adequately for believers. Censure: As Christ died adequately for all and only the elect, so for them alone did he intercede in his state of humiliation, for them alone he rose again, and for them alone he now intercedes in heaven. Isaiah 53:17; John 10:15; 17:9; Hebrews 9:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Polemical Theology</cite>, (1627), pt. 6, section 1, article 2, pp. 679-80 tr. Onku with AI</span></figcaption>

<blockquote><p>Is not Christ the Redeemer of all men? No: for He is a Redeemer neither to Pharaoh, nor Judas, neither unto Ciaphas, nor Herod, neither unto Julian, not in brief to all those that are damned or without hope, for whom they neither He died. Did Christ die for all men? His death was sufficient for all, say the Schoolmen, but effectual only for the Elect and them that are faithful. If we respect the virtue and force of Christ’s blood, it is sufficient for the redemption of all: but if we look upon the purpose and eternal counsel of God, and the goodwill of the Mediator, he died for the elect only. John 10:15, I lay down my life for my sheep, says Christ, and 17:9, I pray not for the world, but I pray for them whom thou have given me. Therefore He neither offered sacrifice for it, neither did He redeem it. And verse 19, For their sakes who believe, and whom the Father has given Me, I sanctify Myself. And Matt 26:28, My blood which is shed for many for the remission of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), pp. 433-34</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Is not Christ the Redeemer of all men? No: for He is a Redeemer neither to Pharaoh, nor Judas, neither unto Ciaphas, nor Herod, neither unto Julian, not in brief to all those that are damned or without hope, for whom they neither He died. Did Christ die for all men? His death was sufficient for all, say the Schoolmen, but effectual only for the Elect and them that are faithful. If we respect the virtue and force of Christ’s blood, it is sufficient for the redemption of all: but if we look upon the purpose and eternal counsel of God, and the goodwill of the Mediator, he died for the elect only. John 10:15, I lay down my life for my sheep, says Christ, and 17:9, I pray not for the world, but I pray for them whom thou have given me. Therefore He neither offered sacrifice for it, neither did He redeem it. And verse 19, For their sakes who believe, and whom the Father has given Me, I sanctify Myself. And Matt 26:28, My blood which is shed for many for the remission of sins.”

— William Bucanus, Institutions of Christian Religion (London, 1606), pp. 433-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs+not+Christ+the+Redeemer+of+all+men%3F+No%3A+for+He+is+a+Redeemer+neither+to+Pharaoh%2C+nor+Judas%2C+neither+unto+Ciaphas%2C+nor+Herod%2C+neither+unto+Julian%2C+not+in+brief+to+all+those+that+are+damned+or+without+hope%2C+for+whom+they+neither+He+died.+Did+Christ+die+for+all+men%3F+His+death+was+sufficient+for+all%2C+say+the+Schoolmen%2C+but+effectual+only+for+the+Elect+and+them+that+are+faithful.+If+we+respect+the+virtue+and+force+of+Christ%E2%80%99s+blood%2C+it+is+sufficient+for+the+redemption+of+all%3A+but+if+we+look+upon+the+purpose+and+eternal+counsel+of+God%2C+and+the+goodwill+of+the+Mediator%2C+he+died+for+the+elect+only.+John+10%3A15%2C+I+lay+down+my+life+for+my+sheep%2C+says+Christ%2C+and+17%3A9%2C+I+pray+not+for+the+world%2C+but+I+pray+for+them+whom+thou+have+given+me.+Therefore+He+neither+offered+sacrifice+for+it%2C+neither+did+He+redeem+it.+And+verse+19%2C+For+their+sakes+who+believe%2C+and+whom+the+Father+has+given+Me%2C+I+sanctify+Myself.+And+Matt+26%3A28%2C+My+blood+which+is+shed+for+many+for+the+remission+of+sins.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion+%28London%2C+1606%29%2C+pp.+433-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb7c5b46b9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb7c5b46b9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=Is%20not%20Christ%20the%20Redeemer%20of,many%20for%20the%20remission%20of%20sins&amp;text=Is%20not%20Christ%20the%20Redeemer%20of%20all%20men&amp;text=shed%20for%20many%20for%20the%20remission%20of%20sins" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

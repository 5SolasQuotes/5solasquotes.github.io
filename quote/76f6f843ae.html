<main class="wrap"><figure class="quote" id="q-76f6f843ae" data-kw="">
<blockquote><p>Now we must not at all imagine that God knows things in the same manner as men, who understands the same thing sometimes imperfectly, at other times clearly, and who, from things known, proceed to things unknown. The divine knowledge is of such a nature, as not to admit of indistinctness of apprehension, or labour of investigation and recollection, or difficulty of application. God comprehends all things by one single and individual act of mind, surveys them, as it were, with a single glance, and sees them distinctly, certainly, and therefore perfectly.

Nevertheless the weakness of our conceptions obliges us to attribute to God a knowledge of two kinds; the one, by which he knows things that are possible, called by the schoolmen the knowledge of two kinds; the one, by which he knows things that are possible, called by the schoolmen the knowledge of natural and simple apprehensions, the other, by which he knows things that will take place, called by them the knowledge of liberty and vision. The first kind of knowledge is founded on the power of God, the second has for its foundation the decree of God, who knows future things, because he has decreed that they shall take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 2.4, p. 80.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7141a93579" data-kw="">
<blockquote><p>Whoever does not think that the knowledge of Christ as a man should be distinguished from the knowledge of that same one as God, such men for sure, though unawares, will slip little by little into the camp of Apollinaris. For as the substance of the divine person does not take away the truth of the human mind in our Savior (as Apollinaris thought), so that divine knowledge, which is an essential property of deity in the person of Christ, does not remove that knowledge which is a property of His humanity. But both types of knowledge come together in the unity of the subject, and each preserves its own truth in the same Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology: With the Life of Franciscus Junius</cite>, trans. David C. Noe (1613; Grand Rapids: Reformation Heritage Books, 2014), p. 123.</span></figcaption>

</figure><figure class="quote" id="q-90dbf3bc5d" data-kw="">
<blockquote><p>It is asked: Whether because God indeclinably determines the will to one thing, He therefore overturns liberty? The Remonstrants affirm. We deny.

1. Because God infinitely wise and omnipotent does not overturn the nature of second causes, except in the case of the miraculous transmutation of substances; as when He converted water into wine and the staff of Moses into a serpent. But conversion is not such a miraculous transmutation of substances; But of qualities of the same substance remaining in its nature.

2. Because God so moves the free will that it most freely moves itself to the same thing to which it is premoved by God.

3. Because if certain created infallibilizing motives infallibly bend the will, with liberty remaining unharmed, much more can the Creator of wills Himself accomplish this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 11, On the Mode of Conversion, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-466404936c" data-kw="">
<blockquote><p>It appears, therefore, what the mode is by which the first cause moves and determines the secondary cause, without necessity and with the freedom of the secondary cause entirely unimpaired — through that priority of nature of the concurrence as it is from God as first cause, subordinating to itself in the very operation the secondary cause, and retaining by priority of nature its dignity in causing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, p. 410</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-f2cadb35b6" data-kw="">
<blockquote><p>And if it is true that there are no miracles at all, and that nothing ever occurs or has occurred in the world apart from natural causes, then by this logic there is no more proof of the Christian religion in the miracles of Christ and the apostles than in the rising and the setting of the sun.

Indeed, these miracles were nothing but snares set for the gullible. This is to adore Mother Nature and to consign the Father God to oblivion. Indeed at bottom, if this is not a wicked attempt to confuse nature with God, it nonetheless thoughtlessly aids such attempts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henricus-pontanus.html">Henricus Pontanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Funeral Oration on the Death of Pieter van Mastricht, 24 February 1706 in Pieter van Mastricht, Theoretical-Practical Theology Volume 1: Prolegomena</cite></span></figcaption>

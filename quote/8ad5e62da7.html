<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. …

9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’…

10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition…

11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>

<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)…

3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery…

4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>

<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature:

1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin.

2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually.

3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.)

4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>

<blockquote><p>Of the Anabaptists’ arguments against the authority of masters, and subjection of servants. … 2. Objection. It is against nature for one to be servant, especially a bond-servant to another. Answer. To grant that it is against that absolute and perfect nature wherein at first God created man, and that it came in by sin, yet is it not against that order and course of nature wherein God has now settled man. God has turned many punishments of sin to be bounden duties: as subjection of wife to husband and man’s eating bread in the sweat of his brow.</p></blockquote>

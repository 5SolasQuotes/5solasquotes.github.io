<blockquote><p>For 1. Though we offer Christ and Church-membership with Him, to all, yet we do not admit all to be church-members: For we admit not them that either refuse Christ or refuse to be members on his terms. Nor do we admit all that will make this profession barely with the tongue: For we have agreed, for those that understand not the foundations, to catechize them first: And those that are notorious or proved scandalous sinners, we shall first require their serious profession of repentance and promise of reformation. 2. We desire to know what you would require of men more than we do? on Scripture grounds? Are not all the fundamentals in our profession? Dare you refuse him that owns them all, as not believing truths enough to salvation? And to know the sincerity of his heart, what can you require more than we do in our Profession of Consent? Can any but a true Christian make that Profession sincerely? I know you dare not affirm it. Will you devise means of your own head to shut out hypocrites, as if you had more care of the purity of the Church than Christ had that purchased it with his blood? You will say: ‘Men may profess all this by rote as a form.’ I answer: 1. Bless God if truth have so much friendship as to be professed: I know many professors that were contemptuously unthankful for this mercy who have not so much left themselves as a bare profession of the fundamentals, but are given up to the open denial of them and to profess opposition to them. It would be taken for a mercy in India, yea in Italy or Spain, yea in France, if all could but be brought to an open profession of God’s pure truth, though with most it were but formal. 2. But I would know how you will do to know men’s hearts? Will you require an account of the manner of their conversion? Alas, you require them but to delude you, or themselves, or to do an impossibility. May not any man of knowledge tell a fair tale of conversion that never had it? Is there not many a thousand Christians that never knew the time or manner of their conversion? And are there not many that do know much of the workings of God’s Spirit on their hearts, that have not words of their own to utter it? If you say, you would hear them give some testimony or signs, at least as at present, of the work of grace on them, I answer: What better signs can they give you than our Profession does contain? Sure I am there is the true description of a Christian. I have lately seen a book of the experiences of Church-members given in (its like not all at the first admittance, and its like made the best of) but yet I am sure sadly defective to an understanding eye (many of them). Pretend not to more then your part in searching men’s hearts. If you say, ‘These are but words put into their mouths.’ I answer: 1. Prove that they come not from the heart if you can. 2. And are not the words of your church-members learned before hand? Somebody taught them, or they could not express their minds. 3. Doubtless our way is full as strict as we can find any Scripture to warrant us (and we again desire you, if you will go further, to prove it by Scripture). But if any pastors will be careless in the execution, we cannot fully remedy that. Peruse our Propositions well, and tell us what you would have more herein? If any pastor among yourselves will be careless in examining members, and admit men on bare words, you will not blame your own principles for that. I could never see but the brethren of the Classical way do come up to as much strictness for the qualification of members as your own principles do require, or as you can desire them, so be it the execution be but answerable: And that will lie on the persons that manage the work and not so much on the principles. 4. I pray you observe how easy Christ is in Scripture in admitting men to Him and taking members into his Church: the Acts of the Apostles throughout will tell you. How suddenly after conversion they were baptized, even thousands. But with those that are in his Church Christ is more strict, and requires that their lives be answerable to their profession. At first He admits them without any further trial, the same day that they profess repentance and faith: But afterwards he will cast them out again if they deny him by their works. If therefore you cannot blame us in our Propositions for casting out the scandalous, you have less reason to blame us for want of strictness in the admission. Remember also the freeness of grace, and let not your pulpit sound with the name of free-grace when your practice contradicts it by shutting the door against those that offer to come in on Christ’s own terms. If Christ question you for this, it will be but a cold answer to say, ‘Lord, we could not perceive that they spoke sincerely,’ for you must prove the contrary before you exclude him. All that ever I could hear to the contrary was but this much: ‘All men must prove their claim to privileges and not put another to disprove it.’ To which I say: Suppose that rule had no exceptions: They prove it thus, ‘I am engaged to Christ by my baptismal Covenant; I stand to that Covenant, believing what is mentioned in this Profession, and consenting to what is here mentioned; therefore I expect the church-privileges of a Christian.’ When he has thus laid his claim, and shown his title, you must have something to prove it insufficient, or you must not dare to deny him his privilege. If you can prove that there is no probability that he is sincere in this profession, it must be either from his gross ignorance of the meaning of the words which he utters, or else by his wicked life: in both which cases we agree with you. But in the name of God brethren, take heed as of polluting the Church by loose admissions, so much more of cruelty to poor souls. Remember how ill this beseems them that have tasted so much mercy as we ourselves have done: and how prone they should be to cover their brethren’s infirmities who are conscious of so many of their own; and how backward to uncover their nakedness and to make the worst of their case that have need of such gentle handling ourselves. Remember Paul’s command, Rom. 14:1, ‘Him that is weak in the faith receive, but not to doubtful disputations.’ See Gal. 6:1-3. Remember how oft Christ was accused for being a friend or companion to publicans and sinners? and by whom he was so accused? and how oft He showed lenity and how seldom severity? and how dreadfully He judges rash judgers? and how unmeet it is that the servant should be stricter in keeping out than the Master is; and that man should pretend to be more righteous than God. Remember also that good Christians must have a great desire of the largeness as well as of the purity of Christ’s Church. Of thirty parts which the world may be divided into, nineteen are said to be pagan-idolaters, and six parts Mohammedans, and but five parts Christians. And of these Christians, when you have counted, the Abyssinians, the Greeks, the Papists, of all which (with the other smaller parties, as the Coptics, the Jacobines, etc.) it is hard to say which are the more ignorant and defective; how few are the Reformed Churches! And does it beseem you with this poor handful to go so near the quick and to pare away more than Christ allows you? One seven years converse with Indians and Turks would make some men more charitable to weaker common Protestants while they lived. Above all take heed (in the name of Christ I warn you) that you be not cruel to Christ’s lambs: that you shut not them out for want of mere words. Experience has ascertained me that there are Christians that are much with God, powerful in secret groans and strivings, and do understand the substance of the fundamentals and much more, nay that are very able to help the ignorant, and great promoters of God’s work in their places, who yet are not able to give a minister or understanding friend any considerable account of their faith: partly through bashfulness, but most through some secret, natural unreadiness of speech and disability to express their minds. Take heed what you do with poor ignorant men and women that live well and show a fear of offending God. He that gently drives and carries his lambs in his arms will not thank you for shutting them out or casting them in the ditch. I know there is need of caution, also for avoiding the looser extreme: but I am now speaking to you. Remember one thing more, and again I say remember it: Whether the fearful scandals, blasphemies and apostasies of professors in this age, when many stand fast and fear God, that were accounted but common, civil, ignorant people, be not a warning and testimony from heaven against our over-valuing mere gifts and words, and our under-valuing poor weak Christians that want [lack] them, and yet are as loath to sin as others. … For 1. Protestants have taken the [Apostles’] Creed, Lord’s Prayer and Ten Commandments for a sufficient test of Christian doctrine, so far as to discern who are Christians and [are] to be communicated with; at least taking them with that explication which an ordinary believer may easily and certainly find out in the rest of the Scriptures. They take those to be no fundamentals which so many hundreds of men, yea the most learned and godly on earth cannot yet agree in or find out the sense of.</p></blockquote>

dare+to+deny+him+his+privilege.+If+you+can+prove+that+there+is+no+probability+that+he+is+sincere+in+this+profession%2C+it+must+be+either+from+his+gross+ignorance+of+the+meaning+of+the+words+which+he+utters%2C+or+else+by+his+wicked+life%3A+in+both+which+cases+we+agree+with+you.+But+in+the+name+of+God+brethren%2C+take+heed+as+of+polluting+the+Church+by+loose+admissions%2C+so+much+more+of+cruelty+to+poor+souls.+Remember+how+ill+this+beseems+them+that+have+tasted+so+much+mercy+as+we+ourselves+have+done%3A+and+how+prone+they+should+be+to+cover+their+brethren%E2%80%99s+infirmities+who+are+conscious+of+so+many+of+their+own%3B+and+how+backward+to+uncover+their+nakedness+and+to+make+the+worst+of+their+case+that+have+need+of+such+gentle+handling+ourselves.+Remember+Paul%E2%80%99s+command%2C+Rom.+14%3A1%2C+%E2%80%98Him+that+is+weak+in+the+faith+receive%2C+but+not+to+doubtful+disputations.%E2%80%99+See+Gal.+6%3A1-3.+Remember+how+oft+Christ+was+accused+for+being+a+friend+or+companion+to+publicans+and+sinners%3F+and+by+whom+he+was+so+accused%3F+and+how+oft+He+showed+lenity+and+how+seldom+severity%3F+and+how+dreadfully+He+judges+rash+judgers%3F+and+how+unmeet+it+is+that+the+servant+should+be+stricter+in+keeping+out+than+the+Master+is%3B+and+that+man+should+pretend+to+be+more+righteous+than+God.+Remember+also+that+good+Christians+must+have+a+great+desire+of+the+largeness+as+well+as+of+the+purity+of+Christ%E2%80%99s+Church.+Of+thirty+parts+which+the+world+may+be+divided+into%2C+nineteen+are+said+to+be+pagan-idolaters%2C+and+six+parts+Mohammedans%2C+and+but+five+parts+Christians.+And+of+these+Christians%2C+when+you+have+counted%2C+the+Abyssinians%2C+the+Greeks%2C+the+Papists%2C+of+all+which+%28with+the+other+smaller+parties%2C+as+the+Coptics%2C+the+Jacobines%2C+etc.%29+it+is+hard+to+say+which+are+the+more+ignorant+and+defective%3B+how+few+are+the+Reformed+Churches%21+And+does+it+beseem+you+with+this+poor+handful+to+go+so+near+the+quick+and+to+pare+away+more+than+Christ+allows+you%3F+One+seven+years+converse+with+Indians+and+Turks+would+make+some+men+more+charitable+to+weaker+common+Protestants+while+they+lived.+Above+all+take+heed+%28in+the+name+of+Christ+I+warn+you%29+that+you+be+not+cruel+to+Christ%E2%80%99s+lambs%3A+that+you+shut+not+them+out+for+want+of+mere+words.+Experience+has+ascertained+me+that+there+are+Christians+that+are+much+with+God%2C+powerful+in+secret+groans+and+strivings%2C+and+do+understand+the+substance+of+the+fundamentals+and+much+more%2C+nay+that+are+very+able+to+help+the+ignorant%2C+and+great+promoters+of+God%E2%80%99s+work+in+their+places%2C+who+yet+are+not+able+to+give+a+minister+or+understanding+friend+any+considerable+account+of+their+faith%3A+partly+through+bashfulness%2C+but+most+through+some+secret%2C+natural+unreadiness+of+speech+and+disability+to+express+their+minds.+Take+heed+what+you+do+with+poor+ignorant+men+and+women+that+live+well+and+show+a+fear+of+offending+God.+He+that+gently+drives+and+carries+his+lambs+in+his+arms+will+not+thank+you+for+shutting+them+out+or+casting+them+in+the+ditch.+I+know+there+is+need+of+caution%2C+also+for+avoiding+the+looser+extreme%3A+but+I+am+now+speaking+to+you.+Remember+one+thing+more%2C+and+again+I+say+remember+it%3A+Whether+the+fearful+scandals%2C+blasphemies+and+apostasies+of+professors+in+this+age%2C+when+many+stand+fast+and+fear+God%2C+that+were+accounted+but+common%2C+civil%2C+ignorant+people%2C+be+not+a+warning+and+testimony+from+heaven+against+our+over-valuing+mere+gifts+and+words%2C+and+our+under-valuing+poor+weak+Christians+that+want+%5Black%5D+them%2C+and+yet+are+as+loath+to+sin+as+others.+%E2%80%A6+For+1.+Protestants+have+taken+the+%5BApostles%E2%80%99%5D+Creed%2C+Lord%E2%80%99s+Prayer+and+Ten+Commandments+for+a+sufficient+test+of+Christian+doctrine%2C+so+far+as+to+discern+who+are+Christians+and+%5Bare%5D+to+be+communicated+with%3B+at+least+taking+them+with+that+explication+which+an+ordinary+believer+may+easily+and+certainly+find+out+in+the+rest+of+the+Scriptures.+T

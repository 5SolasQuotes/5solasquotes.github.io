<blockquote><p>Question 3 Is this book, or theology, for the sake of contemplation, or for the purpose of us becoming good, i.e., is it a speculative or a practical science?

[Arguments Pro] Third, it is asked about the final cause. And since it has been said that this book is for the purpose of revealing the mysteries, it is asked whether this work is for the sake of contemplation or for the purpose of improving us. And it seems that it is for the sake of us becoming good, for the following reasons:

a. Any teaching about those things, without whose knowledge we cannot live righteously, serves the purpose of us becoming good. But this book is precisely for the sake of learning the true faith, without which it is “impossible to please God” or live righteously, as is said in Hebrews 11:6; therefore, this book is for the sake of our improvement.

b. Also, any teaching whose object is the same as that of a virtue is for the purpose of our improvement: this is obvious in itself. But the object of this teaching is the same as that of faith, for it is about matters of belief, something that faith also deals with; therefore, etc.

c. Also, the end of a subdivision of a discipline coincides with the end of the discipline as a whole; but the end of sacred Scripture as a whole is not only us becoming good, but also us becoming blessed; blessedness is the best thing; therefore the end of this discipline is [for sure] our improvement. …

In order to make sense of the aforesaid things it must be noted that it is our intellect or understanding that is perfected by a science. And it [i.e., the intellect] should be understood in three different ways: in itself, insofar as it extends towards affection, or insofar as it extends towards action (and our intellect extends itself by way of command or control). According to this threefold condition, because it has a tendency to err, the intellect possesses three ways of regulating itself through a habit or disposition [such as a science].

For if we consider the intellect in itself, in this way it is properly speaking speculative and is perfected by a habit which serves the purpose of contemplation and is called speculative science. Now if we consider the intellect as naturally capable of extending itself toward action, in this way it is perfected by a habit that serves the purpose of our improvement: which is practical or moral science. But if one considers it from an intermediate point of view, insofar as it is naturally capable of extending itself towards affection, in this way it is perfected by a habit that occupies an intermediate position between purely speculative and practical, and which embraces both.

And this habit is called wisdom, which implies both cognition (or knowledge) and affection at the same time … Whence this [habit] is for the sake of both contemplation and our improvement, but mainly for the purpose of our improvement. Such is the sort of cognition that is treated in this book. For this sort of cognition or knowledge helps faith, and faith is positioned in the intellect in such a way that, insofar as it contains its elements (or principles), it is naturally capable of moving our affection. This is quite clear. Indeed, the knowledge of the type ‘Christ died for us’ and the like—unless the person is an inveterate sinner—moves one to love, unlike this one: ‘the diameter is incommensurate with the semicircle [based on this diameter].’ Therefore we must concede that it is for the sake of our improvement.</p></blockquote>

<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>

<blockquote><p>First then, Deists object, that the excellent light of reason, derived from God, common to all men and wrought into the inmost frame of their constitution, is quite sufficient for the purpose of instruction and of directing our practice, and consequently any new light, any new revelation, is unnecessary.

Answer. We acknowledge that reason is the gift of God and an excellent gift, nor are we of the number of those who depreciate and vilify it. But this we say, that mankind were inattentive to the light of nature, and that they miserably abused it, as plainly appears from the experience of heathen nations, ancient and modern. That the light of nature was exceedingly obscured by the mistakes and immoral practices of men, so as to be almost extinguished, was a matter well known to the heathens. …

But they say, may we not collect from reason the chief and most important truths of religion, viz. “The existence and perfections of God; the laws of justice, the laws of temperance, &amp;c. Finally, the rewards and punishments of a future state.”

Ans. First, reason may teach some, but not all these truths; revelation adds others very momentous, as we have already demonstrated. Secondly, our present enquiry is not concerning reason, considered in itself, but of reason, such as it was in men, destitute of the aids of revelation. The enquiry is not, what mankind might have known, had they made a proper use of reason, but, whether they had a clear perception of divine things, whether this perception was free from uncertainty, whether it was easily acquired, whether it was not corrupted by any mixture of error? Long experience has evidently evinced the truth of the contrary position.

With respect to us, who by the kindness of Deity, have been enlightened by revelation, the eyes of the whole understanding have been opened by the gospel, we easily deduce the knowledge of divine things from the light of reason. But were we still involved amidst heathenish darkness, Gracious God! How much more imperfectly, how much more indistinctly, entangled in how many errors and absurdities, would we philosophise, concerning all these points? We hence deduce, that the very advantages we receive from the exercise of reason are to be ascribed to the light of revelation.</p></blockquote>

h+of+the+contrary+position.%0A%0AWith+respect+to+us%2C+who+by+the+kindness+of+Deity%2C+have+been+enlightened+by+revelation%2C+the+eyes+of+the+whole+understanding+have+been+opened+by+the+gospel%2C+we+easily+deduce+the+knowledge+of+divine+things+from+the+light+of+reason.+But+were+we+still+involved+amidst+heathenish+darkness%2C+Gracious+God%21+How+much+more+imperfectly%2C+how+much+more+indistinctly%2C+entangled+in+how+many+errors+and+absurdities%2C+would+we+philosophise%2C+concerning+all+these+points%3F+We+hence+deduce%2C+that+the+very+advantages+we+receive+from+the+exercise+of+reason+are+to+be+ascribed+to+the+light+of+revelation.%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+Dissertations+on+Revealed+Religion%2C+trans.+William+Crawford+%281737%3B+Belfast%3A+James+Magee%2C+1778%29%2C+%C2%A7+1%2C+pp+35%2C+36-37.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe29b05b142.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e29b05b142.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/20/jean-alphonse-turretin-on-deism-and-the-light-of-reason/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Indeed no one can sufficiently deplore the lot of the Christian church in those ages, when such barbarous words were used for the explanation of Christian doctrines, and every thing was so wrapped up in obscure questions, that a period of nine years was not enough for the proper understanding of the single preface of Scotus to Lombard, and when the most futile and even impious questions were discussed, to the neglect of scripture.

This was the reason why the wisest Reformers of the church have entirely banished the Scholastic Theology from its territories; together with its curious, vain, and often impious questions, and devoted themselves entirely to the exposition of God’s word. Nevertheless, after the example of the schoolmen, or following rather the method of those who teach the arts and sciences, they were willing to reduce Theology to certain rules, and that with the greatest propriety; but then the divinity which they taught, was not derived from Aristotle and Plato, but from those purer sources – the sacred writings.</p></blockquote>

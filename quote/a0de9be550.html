<main class="wrap"><figure class="quote" id="q-a0de9be550" data-kw="">
<blockquote><p>…the first administration of the Lord’s Supper by our Savior, which was a pattern of all after-administrations, and therefore most exact and perfect in point of essentials. It wanted [lacked] nothing essentially belonging unto the administration of the Lord’s Supper… But now it was by Christ administred unto a Church which was not presbyterated (if we understand the term in regard of ruling elders). And therefore to have ruling elders in a church is not essential, but accidental unto the administration of the Lord’s Supper. And therefore the mere absence or want of them (especially when it is by the default of others only) is no sufficient bar against administration of the Lord’s Supper… as because Christ gave the Lord’s Supper only unto men; therefore it follows that it is lawful to administer the Lord’s Supper unto a congregation made up only of men, which is a thing usual in ships at sea and amongst merchants trading in remote parts: even so because Christ gave the Lord’s Supper unto a Church destitute of ruling elders; therefore the administration of it unto a Church that now is destitute of ruling elders is lawful, as being agreeable unto the practice of Christ in the first administration thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650) Jeanes (1611–1662) was a presbyterian minister in London., p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca2ec41da4" data-kw="">
<blockquote><p>If it be demanded how the worship of God should be a sin in any man, considering it is so commanded, I answer sins be of two sorts: The first is when something is done that is flat contrary to the commandment of God; the second is when that is done which God commands, but not in that manner God commands.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-374878614f" data-kw="">
<blockquote><p>About receiving the Lord’s Supper with inconvenient ceremonies and persons in differing doctrine: Peter Martyr, when he came into England first, and the opinion of the corporal presence of Christ in the Lord’s Supper was in force, and when the ministers, albeit differing from him in judgment, yet did not refuse to admit him with open confession of [the] contrary judgment, he joined with them and received the Lord’s Supper, Non obstantibus illorum ceremonijs sibilicet ipsi molestis, ‘notwithstanding the ceremonies, though very much troubling him.’ This counsel did P. Martyr give to [Zachary] Ursinus and to other Christians in Germany; Ursinus, Exercitat., lib 2, fol. 840.</p></blockquote>

</figure><figure class="quote" id="q-fab792f8a8" data-kw="">
<blockquote><p>You [the opponent] suggest that nonconformists think they may quit the communion of the Church if [the Church is defective] in their opinion, nor in the truth in every point… [McWard responds:]… in [the] name of all true nonconformists… it is not every real difference in profession or practice that they hold to be a sufficient cause; Nor do they judge that, even the cause being sufficient, the separation should be always carried to the extremity; but the sound and clear rule which they propose for Christian practice in this matter is that where the controverted difference is such as would render a conjunction therein either sinful or contagious [Mt. 16:6; 1 Cor. 5:6; 15:33; Rev. 18:4], then a just and proportionate separation, precisely and with all tenderness, commensurate to the exigence, is the safer course.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contagiousness</cite>, The True Non-Conformist... (Amsterdam, 1671), Dialogue 1, pp. 6-7 McWard was a resisting Scottish covenanter, and a disciple of Samuel Rutherford. | Separation from Contagious Corruptions</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

%20course" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c256e08276" data-kw="">
<blockquote><p>We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9bb9848495" data-kw="">
<blockquote><p>Therefore, since schism stands so justly chargeable as leveling a most forcible battery for the ruin and supplantation of these dearest concerns of Christianity, it’s hardly conceivable what miserable inconsideration acts those men who make so light of the Spirit of Unity: and ’tis certain that nothing less than the most incurable and fundamental overturnings can warrant a separation or rupture: And it’s a matter next to a miracle there should be any thing in the world (if not condemned by Scripture in the plainest and most down-right terms) maligned which is any way fitted for the preservation of unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached before the</cite>, … Lords Commissioners, of his Majesty’s most honourable Privy Counsel, at Glasgow (Glasgow, 1684), p. 34 This Ross (1647?-1720) was bishop of Edinburgh, the second son of Alexander Ross (d. 1678).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore, since schism stands so justly chargeable as leveling a most forcible battery for the ruin and supplantation of these dearest concerns of Christianity, it’s hardly conceivable what miserable inconsideration acts those men who make so light of the Spirit of Unity: and ’tis certain that nothing less than the most incurable and fundamental overturnings can warrant a separation or rupture: And it’s a matter next to a miracle there should be any thing in the world (if not condemned by Scripture in the plainest and most down-right terms) maligned which is any way fitted for the preservation of unity.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-825af369d0" data-kw="">
<blockquote><p>The second means for healing divisions in the church is to have… some fundamental doctrines wherein all agree: this is the basis of unity and concord in the church. The ancients call it the rule of faith, seed of doctrine, the catholic faith, the character of the church, that which is common to small and great (Irenaeus, [Against Heresies] bk. 1, ch. 3; Nazianzen, Orations 14, 40; Augustine, Enchiridion, ch. 7; Tertullian, Of the Prescription, ch. 13–14; Of the Veiling of Virgins, ch. 1; Athanasian Creed; Irenaeus, bk. 1, ch. 1 [Preface]; Augustine, Epistle 57; see [Robert] Parker, Of the Descent [1611], bk. 4, §3. 1 Cor. 3:10–11; 2 Tim. 1:13; Col. 1:23; Eph. 4:13; 1 Tim. 3:16; Gal. 1:6; Rom. 6:17; 12:6; 2 Tim. 1:13–14; 1 Cor. 2:2; 1 Tim. 6:3; Tit. 1:1; Phil. 1:27; Rev. 14:1)… 2. Where there is this agreement in fundamentals, there ought to be mutual and fraternal affections, notwithstanding differences in other things; no reproaches, no exasperations, no individuous consequences, no odious imputations, no uncharitable digladiations; but an owning of one another as brethren and discussing and ventilating of the points in difference with the spirit of love and meekness, saying to one another, as Abraham to Lot, ‘Let there be no strife between thee and me, for we are brethren.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works</cite>, … (London: Holdsworth, 1826), sermon 14, “Brotherly Reconciliation” (1657/1659), pp. 155-57</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irene-dingel.html">Irene Dingel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 19, ‘Christian Ecumenical Efforts’ in eds. Appold &amp; Minnich, The Cambridge History of Reformation Era Theology (Cambridge University Press, 2023), pp. 372-84, p. 379</span></figcaption>

<blockquote><p>Let them also see how they can answer it, who pretend to acknowledge the Church of England and her assemblies to be true Churches and yet separate themselves from the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-jenison.html">Robert Jenison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Faithful Depositaty</cite>, [sic] of Sound Doctrine &amp; Ancient Truths maintained against all oppositions of science, falsely so called… (Newcastle: S.B., 1649), p. 22 Jenison (1584?–1652) was an English puritan cleric and academic.</span></figcaption>

</figure><figure class="quote" id="q-587b900ea0" data-kw="">
<blockquote><p>For profession brings a Church into outward fellowship with Christ’s body (as bad servants with a good master) and so into the way of being savingly of the body of Christ if they resist not, grieve not, quench not, or despise not the Spirit of grace. Secondly, for the form of a true Church, that is Christ united unto the persons professing his saving truth. For as the form of a man is his soul united to his body, so the form of a Church, which is the body of Christ, is Christ united unto it. Now, that Christ is united unto our Church is proved thus: because He gives the law of union to us as to the body, and makes it effectuall for conviction, or conversion, to serve the living and true God. As a king is united to his subjects by his laws, and executions of them for rewards and punishments: so is Jesus Christ to our Church. As the head united gives laws to the body for safety: so does Christ give laws to us for our salvation in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639) Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., sect. 6; pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>XXIV. All these [previous] things are not therefore spoken that we should reject this distinction of the will of God into his antecedent and consequent will: For we know that among the decrees of God, some are before and some are after in order. But we deny that there are two decrees of God, between which man’s will steps in, as if man’s will came between the decree of creating man and the decree of condemning certain men. But we deny that the will of man does so come between the two decrees of God that the first, or antecedent decree, is broken off by the will of man and that God is compelled to absist from that end which He had propounded to Himselfe and which He did seriously intend: We deny also in the work of our election, the precise will of God to depend on the foreseeing of any power or action of man’s free-will, or the consequent will of God to be suspended on man’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 5, ‘Of the Antecedent &amp; Consequent Will of God’ in The Anatomy of Arminianism… (London: Snodham, 1620), pp. 27-41, pp. 40-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b72859a83" data-kw="">
<blockquote><p>The second conclusion pretended to be drawn from this [Rev. 2:21] is that the Lord has a universal will to have all men saved, seeing He gives her time to repent. This we say does not follow hence: For: … 4. It will not follow Christ wills persons to repent; therefore He wills their salvation: because He may be said to will them to repent when He requires it of them as their duty: and thus their duty of repenting is the immediate object of his revealed and preceptive will: but a person’s salvation is the proper object of his will of good-pleasure, or of his decreeing and purposing will. And no otherways can He be said to will such persons’ salvation (because He commands them to repent) than this, to wit, that in His Word He has signified repentance to be such a person’s duty, and that He has appointed a connection between repentance and salvation; which still relates to his revealed will: even as when God made the first Covenant with Adam, it might be said that He willed Adam to be holy, and that by that Covenant He had made a connection between holiness and life; yet it is not proper to say that the Lord willed life to Adam upon that condition, because that looks to the event and respects the Lord’s will of purpose: which cannot but be effectual. And if the Lord’s willing of men (at least such as are under his ordinances) to be saved be thus understood as including only the duty which God lays upon men and the connection that He has made between it and salvation in his Word, it may be admitted: but if it be extended to any antecedent will in God Himself, distinct from that which is called His revealed will, this place and such like will give no ground for such an assertion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 2, Lecture 6, on vv. 18-29, pp. 169-70</span></figcaption>

</figure><figure class="quote" id="q-e4510cda04" data-kw="">
<blockquote><p>The term voluntas signi, literally, the will of the sign [the revealed will], is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’—thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded. This signified or perceptive will moreover, does not contradict the will of the divine good pleasure, although the relationship between the two may sometimes be difficult to establish immediately. The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker, 2003), vol. 3 | ch. 5.4, Will and Freedom, E. The Ad Intra–Ad Extra Distinctions, 1. Voluntas beneplaciti and voluntas signi, p. 458</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-4e40a5d205" data-kw="">
<blockquote><p>And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity</cite>, section 15 in The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory, pp. 11-12, p. 12</span></figcaption>

<blockquote><p>549. Prov. 1:26, ‘I will mock at your trouble; and laugh when your destruction comes.’ Eze. 18:32, ‘I will not the death of a sinner, for I take no pleasure in the destruction of a sinner.’ God is delighted in his justice, when He punishes those which despise his grace, and that will not hearken to his fatherly vocation; but of his mercy He will not the death of sinners, as death is the destruction of nature. The former place belongs to God’s consequent will; the latter to his antecedent will; that is ruled by justice, this by mercy.</p></blockquote>

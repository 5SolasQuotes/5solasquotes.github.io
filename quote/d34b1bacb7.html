<main class="wrap"><figure class="quote" id="q-d34b1bacb7" data-kw="">
<blockquote><p>Do you see how he makes this the distinction between law and gospel: that the former attributes righteousness to works, the latter bestows free righteousness apart from the help of works? This is an important passage, and one that can extricate us from many difficulties if we understand that righteousness which is given us through the gospel has been freed of all conditions of the law. (Calvin commenting on Romans 10:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2699ea0f28" data-kw="">
<blockquote><p>Under this [Mosaic] Covenant, the natural seed of Abraham bore the face of the Church and state, and God had promised abundance of temporals, and of spiritual, a scantling; But all under the outward administration of the Covenant were not in like manner partakers of the blessings promised in Covenant. For some had their part in temporal blessings only, and the outward ordinances; others were partakers of the spiritual blessings promised. But whatever good thing any of them enjoyed either temporal or spiritual, it was conferred upon them freely according to the Covenant of Grace, and not for the dignity of their works. It is true, the promise is conditional, if they obey, they shall reap the good things of the Land: but obedience was not a causal condition, why they should inherit the Land… So that herein there appears no intexture of the Covenant of works with the Covenant of Grace, nor any moderation of the Law to the strength and power of nature for the obtaining of outward blessings. But rather that God out of his abundant goodness is pleased freely to confer outward blessings promised in the Covenant upon some that did not cleave to him unfeignedly [purely], that he might make good his promise unto the spiritual seed, which by word and oath he had confirmed unto the Fathers.</p></blockquote>

</figure><figure class="quote" id="q-900bb6b6ed" data-kw="third use rule of life">
<blockquote><p>It not only antecedently prepares the elect man for Christ, but consequently also directs him already renewed through Christ in the ways of the Lord; serving him as a standard and rule of the most perfect life, to which he knows he is called by Christ and which he ought diligently to pursue (1 Tim. 1:5).</p></blockquote>

</figure><figure class="quote" id="q-61e1b01320" data-kw="">
<blockquote><p>We, on the other hand, declare with Paul that no law, whether it is human or divine, justifies or makes alive. Therefore we distinguish the Law from righteousness as sharply as death from life or hell from heaven. We are prompted to declare this by the clear statement of Paul: “The Law was not given in order to justify, make live, or save, but merely in order to condemn, kill, and destroy, contrary to the opinion of all men, who naturally suppose that the Law was given in order to obtain righteousness, life, and salvation.” Such a proper distinction between the function of the Law and that of the Gospel keeps all genuine theology in its correct use. It also establishes us believers in a position as judges over all styles of life and over all the laws and dogmas of men. Finally it provides us with a faculty for testing all the spirits (1 John 4:1). By contrast, because the papists have completely intermingled and confused the doctrine of the Law and that of the Gospel, they have been unable to teach anything certain either about faith or about works or about styles of life or about judging the spirits. And the same thing is happening to the sectarians today. After these refutations and arguments, therefore, Paul teaches, at some length and with considerable beauty, that if you consider the true and best use of the Law, it is nothing but some sort of discipline toward righteousness. It humbles men and makes them ready for the righteousness of Christ, if it performs its proper function, that is, if it makes them guilty, terrifies them, makes them conscious of sin, wrath, death, and hell. When this has happened, the presumption of their own righteousness and holiness disappears, and Christ, with His blessings, begins to become sweet. Therefore the Law is not against the promises of God; it is for them. Although it does not fulfill the promise and does not grant righteousness, still, in its use and function, it humbles us and thus makes us ready for the grace and blessing of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 331.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-a0ff0d7b1d" data-kw="">
<blockquote><p>The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on Christ’s Sermon on the Mount, in Works</cite>, 1:244–45.</span></figcaption>

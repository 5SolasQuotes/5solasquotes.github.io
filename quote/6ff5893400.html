<blockquote><p>V… From this habitual righteousness, like a fountain, actual holiness arose in the lower faculties and the entire composite. The harmony (συμμετρία) of the sensitive appetite, both in desire (ἐπιθυμία) and passion (πάθος), was conformed to the superior faculties and right reason. This assembly of habits (commonly called Original Righteousness) constituted this image of God, particularly as its highest point (καρυφαῖον)…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a67b3992d" data-kw="">
<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it [reason] can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Use of Reason in Matters of Faith’ in Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, pp. 226-27</span></figcaption>

<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>

<blockquote><p>V. The Romanists hold original righteousness to be a supernatural gift, super-added to the native gifts and powers of the entire man. [Robert] Bellarmine explains the reason why they determine this to be so. There was in man naturally a contest between the flesh and the spirit, the reason and the appetite [lower desirous part], from which flowed a certain disease and languor of nature, arising from the condition of the material. Therefore God added original righteousness as a ‘golden bridle,’ to repress that conflict and to cover like a precious garment their nakedness, and as a remedy to heal that weakness (‘De gratia primi hominis,’ 5, 6 in Opera [1858], 4:23-29) This is the more common opinion among them, although the Jansenists and others exclaim loudly against it. Whence arose this expression of the [Medieval] Scholastics: ‘Naturals remained untouched, but the supernaturals only were lost.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed View</cite>, The Common View of Romanism, p. 471</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“V. The Romanists hold original righteousness to be a supernatural gift, super-added to the native gifts and powers of the entire man. [Robert] Bellarmine explains the reason why they determine this to be so. There was in man naturally a contest between the flesh and the spirit, the reason and the appetite [lower desirous part], from which flowed a certain disease and languor of nature, arising from the condition of the material. Therefore God added original righteousness as a ‘golden bridle,’ to repress that conflict and to cover like a precious garment their nakedness, and as a remedy to heal that weakness (‘De gratia primi hominis,’ 5, 6 in Opera [1858], 4:23-29) This is the more common opinion among them, although the Jansenists and others exclaim loudly against it. Whence arose this expression of the [Medieval] Scholastics: ‘Naturals remained untouched, but the supernaturals only were lost.&#x27;”

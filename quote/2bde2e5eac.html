<main class="wrap"><figure class="quote" id="q-2bde2e5eac" data-kw="">
<blockquote><p>We can briefly recapitulate the essentials of the preceding proofs and complete them in the following demonstration of the existence of one God. Beginning from the necessary and evident proposition that ‘it is possible that something exists’, we lay down three conclusions: first, that some being from-itself actually exists; second, that such a being is infinitely perfect; third, that only a single being infinitely perfect can exist. Conclusion 1: Some being from-itself actually exists. I prove this conclusion summarily as follows: if something can exist, this something is either a being from-itself altogether independent or a being from another and so dependent with respect to its continued existence. If it is from another there is required at the same time a cause conserving it in existence. If this cause is not a being from-itself there is either a) an infinite regress in conserving causes, or b) a circle in such causes, or c) there is an ultimate stand in some being simply first, namely in a first conserver that is not conserved by anything because it is a being from-itself.¹ ¹ [Wolter speaks on p. 81 of ‘Ockham’s proof from conservation (see Boehner, ‘Zu Ockhams Beweis der Existenz Gottes’, Franz. Stud. 32, 1950, 50ff)’.] But an infinite regress in conserving causes is impossible, for such causes must be simultaneous.¹ The like must be said of a circle in conserving causes. Therefore in either case, in order that something be able to exist, there is required as a condition sine qua non some other being that exists from-itself. But if a being from-itself did not actually exist, it could not exist. ¹ [“But what of the reason that a being persists? Either it is something that depends on another with respect to its existence and permanence or it is not… An infinite series of things existing simultaneously is impossible, because such a series would be simultaneously dependent and independent: dependent because it would be indifferent to existing and would not have in itself a reason for existing; independent because nothing would exist outside the series for it to depend on, otherwise it would not be an infinite series since limited and brought to an end in the being on which it depends. By such a series then cannot be explained why something exists. This argument is confirmed by an example. Who would say that a sufficient reason for the suspension of the whole of a chain could be found in the length itself of the chain even though it could not be found in any ring of the chain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, ch. 1, article 1, ‘On the Existence of a Single God’, pp. 77-81 Wolter (d. 2006) was a Scotus scholar. The below continues from Wolter’s section in ‘From ‘Something is Finite”., pp. 34-35]</span></figcaption>

e</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db2b631032" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The second way is from the nature of the efficient cause. In the world of sense we find there is an order of efficient causes. There is no case known (neither is it, indeed, possible) in which a thing is found to be the efficient cause of itself; for so it would be prior to itself, which is impossible. Now in efficient causes it is not possible to go on to infinity, because in all efficient causes following in order, the first is the cause of the intermediate cause, and the intermediate is the cause of the ultimate cause, whether the intermediate cause be several, or only one. Now to take away the cause is to take away the effect. Therefore, if there be no first cause among efficient causes, there will be no ultimate, nor any intermediate cause. But if in efficient causes it is possible to go on to infinity, there will be no first efficient cause, neither will there be an ultimate effect, nor any intermediate efficient causes; all of which is plainly false. Therefore it is necessary to admit a first efficient cause, to which everyone gives the name of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>

<blockquote><p>1. There is something which exists 2. Something has existed eternally. 3. Something has been eternally self-existent. 4. What is self-existent must have all the perfections that anywhere exist, or in any subject. 5. What is self-existent must have all possible perfections, and every perfection in an infinite measure. 6. What has all possible perfection, and every perfection in an infinite measure, is God. If I can show that these propositions are founded on certain and evident truth, and that there is a necessary connection between them, the inference I would draw from them is clear and undeniable. … 2. Something has existed eternally… For if something had not always existed, nothing could ever have existed. To suppose any being to begin to exist antecedentaly to all other beings is to suppose it the cause of its own existence, and by necessary consequence to act before it is; but since there can be no operation either in order of time, or of human conception, previous to the subject of it, to say, a thing may act before it is, is in other words to say that a thing may be and may not be at the same time… there cannot be a more express and flaming contradiction.</p></blockquote>

<blockquote><p>Whether God is able to be proved and demonstrated from the light of nature? It is affirmed against the Socinians. Whether one is able to prove the deity most fullly, expeditiously, sufficiently and by a sole rule against atheists and amidst all men whoever they may ultimately be, provided they are not devoid of a reasoning and sane mind, by the revealed facts in the Old and New Testament? It is denied against the Remonstrants. … Whether it is lawful and expedient unto edification to dispute to prove God exists? It is distinguished.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a88c881c42" data-kw="">
<blockquote><p>3. We are much in the dark concerning the degree of infants’ glory: And therefore we can as little know what degree of grace is necessary to prepare them for their glory.

4. It is certain that infants before they are glorified, shall have all that grace that is prerequisite to their preparation and fruition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-d1a8abb219" data-kw="">
<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London, 1644), pt. 2, ch. 5, sections 1 &amp; 2, Question 2, “Whether or not all gifted persons may preach the Word of God publicly and ordinarily, for the gathering in of souls to Christ, though they be destitute of all official authority, or Church calling to that ministry? [No]”, pp. 280-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

paration&amp;text=8.%20All%20prophets%20are%20either%20ordinary%20or%20extraordinary&amp;text=a%20gift%20is%20a%20token%20of%20Gods%20separation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c783d685b9" data-kw="">
<blockquote><p>All courts are governed, and should, to a great extent, be governed by precedent. Long-established usage has the authority of law. People have the right to depend upon it. It works manifest injustice, when a party avails himself of a remedy, which a court for years and generations has recognized as appropriate, and he is suddenly and unexpectedly, by a new construction of the constitution, refused a hearing because he has put his case in a wrong form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, b. ‘Review of a Decision that Appeals cannot lie except in Judicial Cases’, p. 486</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“All courts are governed, and should, to a great extent, be governed by precedent. Long-established usage has the authority of law. People have the right to depend upon it. It works manifest injustice, when a party avails himself of a remedy, which a court for years and generations has recognized as appropriate, and he is suddenly and unexpectedly, by a new construction of the constitution, refused a hearing because he has put his case in a wrong form.”

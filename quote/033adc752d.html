<main class="wrap"><figure class="quote" id="q-033adc752d" data-kw="">
<blockquote><p>Obedience is no longer a task to be done for a reward; it is the joyful expression of filial love. … Though we have no works to perform in order to justification, we have everything to do in order to manifest our gratitude and love.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Justification, the Law, and the Righteousness of Christ</cite>, VI.C, “The Necessities of Man”</figcaption>
<div class="meta"><span class="t">Merit and Reward</span><span class="t">Nature of Adoption</span></div>

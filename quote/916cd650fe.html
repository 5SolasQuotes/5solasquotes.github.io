<main class="wrap"><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-75a06d547d" data-kw="">
<blockquote><p>John Baptist and the apostles, Acts 8; Jn. 3, after a confession never asked for their conversion, but baptized, for straightway without delay, even in the night (for so the Word notes, Mt. 21:19; Luke 4:39 &amp; 5:25 &amp; 8:44) the jailor and his house, Acts 16, Cornelius and his house, Acts 10, the eunuch, the multitude of John Baptist’s hearers were baptized members of the universal Church, 1 Cor. 12:12-13, where there was no particular congregation to receive and admit them as members, as Mr. Richard Baxter solidly observes. Nor is it worthy the refuting that the apostles, by an extraordinary power, might baptize them, though to no certain church, but pastors now have not that power: for the apostles baptizing and preaching, and administering the other seal differ not. The apostles preached and baptized in all places as ordinary officers by the same command, Mt. 28:19, by which we teach and baptize in species and nature, from the ordinary pastoral acts of an ordinary minister; they speak with tongues, [and] work miracles as apostles, but they preach and baptize hic &amp; nunc as ordinary officers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum… (London, 1658) | bk. 3, ch. 2, ‘Of the First Subject of the Power of the Keys’</cite>, p. 293</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

ic%20%26%20nunc%20as%20ordinary%20officers&amp;text=John%20Baptist%20and%20the%20apostles%2C%20Acts%208%3B%20Jn&amp;text=and%20baptize%20hic%20%26%20nunc%20as%20ordinary%20officers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0d733f2d51" data-kw="">
<blockquote><p>We may consider a visible Church either metaphysically or politically. It is one thing to consider men as living creatures endued with reason; another thing to consider them as magistrates, masters, fathers, children, servants, etc. So is it one thing to consider a visible Church as a society of men and women separated from the blind world by divine vocation [calling], and professing together the gospel of Jesus Christ; and another thing to consider it as a political body, in which the power of spiritual government and jurisdiction is exercised–some governing and some governed. These are very different considerations; for first, a visible Church being taken entitatively or metaphysically, her members do ordinarily communicate together in those holy things which fall under the power of order, which I may call sacra mystica [sacred, mystical rites]; but being taken politically, her members communicate together in such holy things as fall within the compass of the power of jurisdiction, which I may call sacra politica [sacred politics]. Secondly, infants under age, being initiated in baptism, are actually members of the Church in the former consideration, but potentially only in the latter; for they neither govern, nor yet have the use of reason to be subject and obedient to those that do govern.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (1641; Edinburgh, 1646), 2nd part, ch. 11</cite>, p. 62</span></figcaption>

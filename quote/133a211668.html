<blockquote><p>There is another thing that confirms that the fourth commandment will reach God’s resting from the new creation as well as the old, because the Scripture does expressly speak of one as parallel with the other; i.e. Christ resting from the work of redemption is expressly spoken of as being parallel with God’s resting from the work of creation; and that, in Hebrews 4:10, “For he that is entered into his rest, he also hath ceased from his own works, as God did from his.” Now, Christ rested from his works when he rose from the dead on the first day of the week. When he rose from the dead, then he finished his work of redemption; his humiliation was at an end. He rested from his labours and was refreshed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 234.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69c66ee42b" data-kw="">
<blockquote><p>Since Theology is the doctrine which treats of God and divine things, it must, first of all, be inquired, – Whether a God really exists, that is, whether there be allowed to exist a Being who is infinite, all-perfect, supreme, and the cause of the existence of all other beings. I confess, indeed, that this principle is so evident, that we ought rather to take it for granted, than attempt to prove it; but the treating of this subject is rendered necessary by the infatuation of many persons, who labour to persuade themselves and others that there is no Deity. Now men of this character, or rather, I should say, these monsters of men, may be refuted by many arguments, I shall bring forth the principal arguments which appear to me the most unexceptionable.

The first argument is drawn from the extensive, goodly, and orderly fabric of the universe, and from the beautiful harmony of all created things, destined, as they are, to the use and service of each other; all which could have proceeded only from a most wise and perfect Being, as every one must admit who is willing to exercise his reason. For, to maintain that these things were united by an accidental concurrence of atoms, or indivisible particles, is to show a want, not merely of understanding, but almost of sense itself ‘ I cannot conceive,’ says Cicero (de Nat. Deor. lib. II.) ‘why the man who thinks this possible, should not also imagine that, if innumerable forms of letters, whether of gold, or of any other kind, should be thrown together into some receptacle, there could be accidentally made out of these, when shaken out upon the ground, annals capable of being read; whereas I doubt whether chance could effect any thing of the kind, even as far as a single verse. But if a concurrence of atoms can produce a world, why not a portico, a house, or a temple? which would be less laborious, and indeed far easier.’

The second argument is derived from this fact, that all things in the world have, as it were, certain ends which they keep in view, although those ends are not always known to us. But who has so directed, or indeed could possibly so direct, all things to certain ends, but an all-perfect and infinite Being? It cannot be said that every individual thing sets before itself such ends, for we know that the greater part of them are destitute of reason; and if some are capable of design, yet they perform many things without design. For not even man purposes within himself how he shall digest his food, and distribute its parts through the different members of his body. Some cause, therefore, must be laid down, which directs all these things. To say that nature does all this, is absurd, unless by nature is meant a substance or essence distinct from natural things, and which is most wise and powerful, which, in fact, is God himself.

The third argument is drawn from the consideration of the matter of which the world is made, and of motion, which has been given to matter. For matter is either eternal and self-existent, or it was produced out of nothing by another and a supreme Being. That it is not eternal or self-existent, clearly appears from the very great absurdity of ascribing to a most imperfect being or existence, such as matter is, what is the greatest of all perfections, namely, eternity and self-existence. If on the contrary, it was produced out of nothing, by another and a supreme Being, that Being can be no other than God, since infinite power is necessary to produce any thing out of nothing; which infinite power belongs to that Being only, whom we call God.

Again, either motion is of the essence of matter, or some one has impressed motion upon it. Now, that motion is of the essence of matter, no one, I think, in his senses will believe; at least no one will maintain that such regular motion as that to which the world owes its origin, essentially belongs to matter. We must needs therefore confess that some Being impressed motion upon matter, or, at least, directed motion to the formation of a world, rather than a rude disordered mass. Now every one, who is not wilfully blind, can perceive that such a Being is no other than the all-perfect Being whom we call God.</p></blockquote>

<blockquote><p>…in taking up the language of ‘the space of six days,’ the Westminster Assembly declared that it stood with previous theologians in affirming a literal six-day creation. The expression of has its roots in at least four previous theologians whom the Westminster divines knew. As we have seen, the words ‘in the space of six days’ appear in the writings of Bonaventure, Calvin, Zanchi, and Ussher.² ² Bonaventure, Commentaries on the Four Books of Sentences, book 2, distinction 12, art. 1, question 2; Calvin, Commentaries on Genesis, 1:78; Zanchius, Confession of Christian Religion, 21 [5.1]; De Operibus Dei intra Spacium Sex Dierum Creatis; Ussher, Works, 11:183.</p></blockquote>

<blockquote><p>1. Man is to be considered as a creature [and] 2. as such a creature, to wit, endued with reason and the Image of God; in either considerations, especially in the former, all that are created are obliged to do and suffer the will of God though they never sinned. It’s not enough to say that sun, moon, trees, herbs, vines, earth, beasts, birds and fishes cannot suffer the ill of punishment which is relative to the break of a Law, for the whole creation is subject to vanity for our sins, Rom. 8:20-21. The servant is smitten and sickened for the master’s sake, and God may take from them what He gave them, [even] their lives without sense of pain and dolor, for all beings, yea [even] defects and privations, are debtors to the glory-declarative of God, Prov. 16:4; Rom. 11:36; yea, and no-beings [things that could be, but are not,] are under this debt.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de69b506c5" data-kw="">
<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectarum Disputationum Theologicarum Pars Prima</cite>, (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).”

darily&amp;text=Therefore%2C%20our%20doctrine%20is%20that%20in%20elenctic%20theology&amp;text=and%20also%20from%20the%20light%20of%20nature%20secondarily" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 146</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-e063197d4a" data-kw="">
<blockquote><p>Efficient causality is nothing else but the realization or actualization of something which did not previously exist. It is clear that this realization, defined in terms of its immediate relation to potential and actual being, is perceived by the intellect, the faculty of being, under the appearances of color, heat, etc., which are perceived by the senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God: his Existence &amp; his Nature</cite>, vol. 1 (B. Herder: 1945), pp. 131-32</span></figcaption>

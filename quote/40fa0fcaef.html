<main class="wrap"><figure class="quote" id="q-40fa0fcaef" data-kw="">
<blockquote><p>It was the love of Christ which brought Him down from heaven, which veiled His divinity in a human soul and body, which put upon Him the form of a servant, which exposed Him to contempt, reproach, and many indignities. It was love which made Him subject to hunger, thirst, sorrow, and many human infirmities, which humbled Him unto death, even the painful and ignominious death of the cross.

And when out of love He had finished the work of redemption on earth, as to what was needful by way of satisfaction, it was His love which carried Him back to heaven where He was before, so that He might make application of what He had purchased; that there He might make intercession for those whom He had redeemed, and prepare a place for them, even glorious mansions with Himself in the house not made with hands, which is eternal in the heavens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Work Begun in the Day of Grace Performed Until the Day of Christ</cite>, ed. Don Kistler (1672; Morgan PA: Soli Deo Gloria, 1998), p. 115.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51cc54e121" data-kw="">
<blockquote><p>What are the fruits of this free grace of God with respect to the gift of Christ for us and to us, as related in this scripture-testimony… [3.] That God had made Him a little lower than the angels, in his being made man, that He might suffer and humble Himself to death. [4.] That God crowned the human nature of Christ with glory and honour… that by his sufferings He might make satisfaction, tasting death for every man, sensibly feeling and undergoing the bitter agonies of that shameful, painful, and cursed death of the cross, hereby putting all mankind into a new state of trial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tong.html">William Tong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Henry’s Commentary, on Hebrews 2</cite>, verse 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-87e64bbc95" data-kw="">
<blockquote><p>An intention or a conscious goal is that which an agent aims to accomplish and the means are that which is used for attaining the intention. When the agent acts according to its nature, then the end of the action and the end of the agent is one and the same. But when the means are not fitted for the intentional end, then a distinction must be inferred between the end of the action and the end of the agent; between the intention and the intender. Now, the doctrine of divine simplicity implies that in God intention and Intender—act and Agent—cannot be other than one and the same. In humans intention and intender—acts and agents—may not be one and the same. In God the means for attaining the salvation of the elect are not, indeed cannot, be disproportionate to that end. There cannot be conditions—conditional redemption—to God. For according to the doctrine of divine simplicity, each thing is related to God, but God is not (reciprocally) related to anything. Yet, universalism anthropomorphically pictures God as using means that are not proportionate to the end and assumes that there is one intention in some salvific act and another intention in some other salvific act. Particularism upholds the doctrine of simplicity and consistently maintains the otherness of God in intending to save humans in Christ. Every salvific action of God is particular in intention, since in God intention and Intender cannot be other than one and the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Journal of Reformed Theology</cite>, vol. 6, issue 1 (2012), pp. 24–34</span></figcaption>

</figure><figure class="quote" id="q-a7f4afc517" data-kw="priesthood satisfaction intercession">
<blockquote><p>The priesthood of Christ is the function of the mediatorial office according to which he performs those things with God which must be performed for sinners; both by offering himself up once as a victim for them and by interceding for them always with the Father. The great excellence of this function appears from the fact that no mystery was either predicted by clearer prophecies or adumbrated by more frequent types.</p></blockquote>

</figure><figure class="quote" id="q-47507b6785" data-kw="">
<blockquote><p>For justice being a virtue of God and all the divine virtues which are in God exist perfectly to an infinite degree, it was necessary that God’s justice demand a retribution in the fullest measure since Man’s sin was specifically committed against an infinite majesty … And it is impossible that He would reestablish man in a state of integrity and virtue without a previous satisfaction of His righteous justice. …

Man therefore not being able to provide his own satisfaction to God and no other creature being capable of such a great feat, God ordained to send his Son into the world and caused Him to put on our human nature for two purposes: the first is to satisfy the justice of God by the suffering of the penalties which we alone deserved, and by this, establishing our guarantee. …

Therefore, since He became man, He was capable of actually suffering dead, and, in fact – it having been so decided by the commandment of His Father – Christ willing submitted to death. Further, in that He was also eternally Holy God, He was able by His suffering to take the punishment for our offences equal to their demerit, and by this means to satisfy, by His infinite worth, God’s perfect justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise Concerning Predestination and its Dependent Principles</cite>, trans. Matthew Harding, ed. Alan C. Clifford (1634; Norwich: Charenton Reformed Publishing, 2017), pp 95-96.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

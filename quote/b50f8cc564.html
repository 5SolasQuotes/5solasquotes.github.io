<blockquote><p>§45. 5. And for organs or other instruments of music in God’s worship, they being a help partly natural and partly artificial, to the exhilarating of the spirits for the praise of God, I know no argument to prove them simply unlawful, but what would prove a cup of wine unlawful, or the tune and meter, and melody of singing unlawful. But yet if any would abuse it, by turning God’s worship into carnal pomp, and levity, especially by such non-intelligible singing, or bleating as some of our choristers used, the common people would have very great reason to be weary of it as accidentally evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 412</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d31aac66d3" data-kw="">
<blockquote><p>There are many who consider the use of instruments as merely an aid to singing. If Christians are commanded to sing in worship, what is wrong with using an instrument to assist the voice in carrying the tune? After all, it is argued, without an instrument to assist, many would not be able to sing the tunes properly. In other words, instruments have become a necessary aid to the practice of a Scriptural element of worship, as if congregational singing is impossible or impractical without mechanical help. Looking at it this way, some argue that instruments are a circumstance to worship, not an element regulated by Scripture, much like the building, what pulpit is used, and other things common to any kind of meeting. Even if instrumental music could be considered as an aid to worship, the Lord still strictly controls what aids are allowed in His worship. The Israelites, in their zeal to offer to the Lord true worship, nevertheless committed idolatry when they forged the golden calf at Sinai to magnify the great power of God. They weren’t blind pagans; they intended to worship the God of Israel, not some pagan deity. But in their desire for an aid to worship, they sinned and instead provoked the wrath of God. To them the golden calf was an aid to worship that they thought the Lord would have allowed, but to the Lord it was an unauthorized aid that He abhorred. In matters of worship, both reason and the will of man is a fatal guide. We would do well to remember the words of Solomon in Prov. 16:25, “There is a way that seemeth right unto a man, but the end thereof are the ways of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brad-freeman.html">Brad Freeman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Freeman is a Presbyterian Reformed Church minister. Why Not Instruments In Worship?</cite>, V. A Common Reason Answered</span></figcaption>

</figure><figure class="quote" id="q-f988c5ccbc" data-kw="">
<blockquote><p>The specific element, then, in the part of worship we are considering is singing. Now it is pleaded that the church has discretionary power to employ instrumental music, as one of the circumstances allowed by our Standards. Let us submit it to the test of the criteria by which these circumstances are determined: First, they are not parts of the acts of worship by which they are modified; but this circumstance is a part of the act of singing praise by which it is performed. Secondly, these circumstances are common to the acts of human societies, not peculiar to, and distinctive of, those of the church. It is very certain that instrumental music is not such a circumstance. It will hardly be said that all societies play on instruments as well as the church. Thirdly, these circumstances are conditions necessary to the performance of the acts of worship, without which they either cannot be done at all, or not done decently and in order. That the singing of praise cannot be performed at all without instrumental music will be affirmed by none. But it may be affirmed that it cannot without it be performed decently and in order. Let it be noticed that the question is not whether it may be performed in an indecent and disorderly manner. Granted; but so may instrumental music. The question is, whether it cannot be done decently and in order without instrumental accompaniment. The question can only be determined by reference of the practice to a permanent and universal standard of propriety and decorum. And to say that the simple singing of God’s praise in His house is indecent and disorderly is to say, that for twelve centuries the church of Christ was guilty of this impropriety; for it is a matter of history that for that period not even the Church of Rome knew anything of instruments in her worship. To say that the simple singing of God’s praise violates the standard of decency and order of this age is to censure the glorious Free Church of Scotland and the Irish Presbyterian Church for an indecent and disorderly conduct of this part of divine worship. The ground, therefore, that instrumental music in public worship is one of those circumstances required by the rule that all things be done decently and in order cannot be maintained without a spirit of arrogance and censoriousness which would itself violate the higher principle of Christian charity. It is submitted, with all modesty, that this line of argument ought to be conclusive with Presbyterians, at least, against ranking instrumental music in public worship as one of the circumstances common to human actions and societies which fall under the discretion of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Discretionary Power of the Church, Matt 28:20’</cite>, (1875) in Sermons, ed. George A. Blackburn (1907).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

+the+Church+of+Rome+knew+anything+of+instruments+in+her+worship.+To+say+that+the+simple+singing+of+God%E2%80%99s+praise+violates+the+standard+of+decency+and+order+of+this+age+is+to+censure+the+glorious+Free+Church+of+Scotland+and+the+Irish+Presbyterian+Church+for+an+indecent+and+disorderly+conduct+of+this+part+of+divine+worship.+The+ground%2C+therefore%2C+that+instrumental+music+in+public+worship+is+one+of+those+circumstances+required+by+the+rule+that+all+things+be+done+decently+and+in+order+cannot+be+maintained+without+a+spirit+of+arrogance+and+censoriousness+which+would+itself+violate+the+higher+principle+of+Christian+charity.+It+is+submitted%2C+with+all+modesty%2C+that+this+line+of+argument+ought+to+be+conclusive+with+Presbyterians%2C+at+least%2C+against+ranking+instrumental+music+in+public+worship+as+one+of+the+circumstances+common+to+human+actions+and+societies+which+fall+under+the+discretion+of+the+church.%E2%80%9D%0A%0A%E2%80%94+John+L.+Girardeau%2C+%E2%80%98The+Discretionary+Power+of+the+Church%2C+Matt+28%3A20%E2%80%99+%281875%29+in+Sermons%2C+ed.+George+A.+Blackburn+%281907%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff988c5ccbc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f988c5ccbc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/are-musical-instruments-circumstances-of-worship/#:~:text=The%20specific%20element%2C%20then%2C%20in%20the,under%20the%20discretion%20of%20the%20church&amp;text=The%20specific%20element%2C%20then%2C%20in%20the%20part%20of&amp;text=which%20fall%20under%20the%20discretion%20of%20the%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

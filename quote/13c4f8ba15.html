<main class="wrap"><figure class="quote" id="q-13c4f8ba15" data-kw="">
<blockquote><p>The Office. The death of Jesus Christ, as being every way powerful for reconcilement and union, did not only break down the partition-wall of guiltiness that stood betwixt God and man, but the wall of ceremonies that stood betwixt the Jews and the Gentiles: it made all that believe one with God, and made of both one, as the Apostle speaks —united them one to another.

The way of salvation was made known, not to one nation only, but to all people: so that whereas the knowledge of God was before confined to one little corner, it is now diffused through the nations; and whereas the dignity of their priesthood staid in a few persons, all they who believe are now thus dignified to be priests unto God the Father.

And this was signified by the rending of the vail of the Temple at his death; not only that those ceremonies and sacrifices were to cease, as being all fulfilled in him, but that the people of God, who were before by that vail held out in the outer court, were to be admitted into the Holy Place, as being all of them priests, and fitted to offer sacrifices.

The Priesthood of the Law was holy, and its holiness was signified by many outward things suitable to their manner, by anointings, and washings, and vestments; but in this spiritual priesthood of the Gospel, holiness itself is instead of all those, as being the substance of all. The children of God are all anointed, and purified, and clothed with holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 236.</span></figcaption>

</figure><figure class="quote" id="q-37b7869dbb" data-kw="">
<blockquote><p>Thirdly, Deut. 18. 18. to 22. I will raise them up a Prophet from among their brethren like unto thee, and I will put my words into his mouth, and he shall speak unto them all that I shall command him &amp;c. But the Prophet which shall presume to speak a word in my name, which I have not commanded him to speak; or that shall speak in the name of other gods, even that Prophet SHALL DIE: he hath spoken presumptuously, thou shalt not be afraid of him.

From whence I infer: First, that false Prophets who presume to preach any dangerous Errors, or Heresies contrary to the Word of God, to draw men unto Error, Heresy, or False-Worship, are by the express Command of God to be put to death by the civil Magistrate, as well as such prophets who speak in the name of other gods: For this phrase SHALL DIE, here, is not intended of a NATURAL DEATH COMMON TO ALL MEN; for then it were no special Punishment, threatened unto, and to be inflicted upon such; but a PENAL DEATH judicially inflicted by men, as is clear by comparing it with Deut, 13. 5. c. 17. 5. Zech. 13. 3. &amp; Jer. 26. 8. 11. 16. 23. Exod. 21. 12. 14. Num. 35. 30.

Secondly, this precept relates principally to false Teachers, and Prophets under the Gospel, and is not confined only to the times of the Law, since the next Verses preceding, to which it is subjoined, relate only to Christ himself and his Prophesying in the Flesh, as is evident by comparing them with Joh. 1. 45. Act. 3. 22. &amp; 7. 37. and because it is seconded by Zech. [1]3. 2, 3 &amp;c. which relates only to the times of the Gospel (as I shall prove anon) under which False Prophets are to be put to death as well as under the Law. These three Precepts we find seconded with exemplary Executions approved and commanded by God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The sword of Christian magistracy supported, or, A vindication of the Christian magistrate’s authority under the Gospel, to punish idolatry, apostacy, heresy, blasphemy, and obstinate schism, with corporal, and in some cases with capital punishments</cite>, (London: John Bellamy, 1653), pp 6-7.</span></figcaption>

</figure><figure class="quote" id="q-a00299d99b" data-kw="">
<blockquote><p>Espouse sober principles; for men are, as their principles are. In these avoid extremes; and in the less weighty matters of the law, keep the mean, that you may reserve your zeal for the great things of God, the things that belong to your everlasting peace. Take heed on the one hand of bigotry in the circumstantials of religion, and on the other hand of lukewarmness and indifferency in the essentials of it.

Fix such principles as these to yourselves with reference to the main matter:—that God’s favour is better than life, and his displeasure worse than death; that sin is the greatest evil; that the soul is the man, and that is best for us that is best for our souls; that Jesus Christ is all in all to us, and we are undone without an interest in him; that it is as much our wisdom, as it is our duty, to be religious; that the world has not that in it, which will make us happy; that time, and the things of time, are nothing in comparison with eternity, and the things of eternity.

These, and such as these, are principles of eternal truth, and our firm belief of them, and adherence to them, will be to us of eternal consequence. And as to other things, let your principle be, that “God is no respecter of persons, but in every nation, he that fears God, and works righteousness, is accepted of him;” and therefore ought to be so of us: “that the kingdom of God is not meat and drink, but righteousness and peace, and joy in the Holy Ghost; and he that in these things serveth Christ, is acceptable to God, and approved of men.” By such principles as these, keep up moderation and sober-mindedness in your profession of religion, which will contribute much to the promoting of it in everything else.</p></blockquote>

— Matthew Henry, Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 80-81.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEspouse+sober+principles%3B+for+men+are%2C+as+their+principles+are.+In+these+avoid+extremes%3B+and+in+the+less+weighty+matters+of+the+law%2C+keep+the+mean%2C+that+you+may+reserve+your+zeal+for+the+great+things+of+God%2C+the+things+that+belong+to+your+everlasting+peace.+Take+heed+on+the+one+hand+of+bigotry+in+the+circumstantials+of+religion%2C+and+on+the+other+hand+of+lukewarmness+and+indifferency+in+the+essentials+of+it.%0A%0AFix+such+principles+as+these+to+yourselves+with+reference+to+the+main+matter%3A%E2%80%94that+God%E2%80%99s+favour+is+better+than+life%2C+and+his+displeasure+worse+than+death%3B+that+sin+is+the+greatest+evil%3B+that+the+soul+is+the+man%2C+and+that+is+best+for+us+that+is+best+for+our+souls%3B+that+Jesus+Christ+is+all+in+all+to+us%2C+and+we+are+undone+without+an+interest+in+him%3B+that+it+is+as+much+our+wisdom%2C+as+it+is+our+duty%2C+to+be+religious%3B+that+the+world+has+not+that+in+it%2C+which+will+make+us+happy%3B+that+time%2C+and+the+things+of+time%2C+are+nothing+in+comparison+with+eternity%2C+and+the+things+of+eternity.%0A%0AThese%2C+and+such+as+these%2C+are+principles+of+eternal+truth%2C+and+our+firm+belief+of+them%2C+and+adherence+to+them%2C+will+be+to+us+of+eternal+consequence.+And+as+to+other+things%2C+let+your+principle+be%2C+that+%E2%80%9CGod+is+no+respecter+of+persons%2C+but+in+every+nation%2C+he+that+fears+God%2C+and+works+righteousness%2C+is+accepted+of+him%3B%E2%80%9D+and+therefore+ought+to+be+so+of+us%3A+%E2%80%9Cthat+the+kingdom+of+God+is+not+meat+and+drink%2C+but+righteousness+and+peace%2C+and+joy+in+the+Holy+Ghost%3B+and+he+that+in+these+thin

<blockquote><p>Everyone will have to agree that for Adam, perfect keeping of the law for a fixed period of time was the means to acquire eternal beatitude that cannot be lost. When the covenant of works was broken, God could have rescinded this promise. He was no longer bound to honor it. Nevertheless, He allowed the promise and the condition to stand and repeatedly be published anew, especially by the proclamation of the Sinaitic law (Lev 18:5, “The one who does them will live by them”; cf. Rom 10:5, “For Moses describes the righteousness that is by the law,” etc.; Gal 3:12). Fulfillment of this condition from man’s side was no longer conceivable; thus the repetition must have had a different significance. This significance can only be that after the fall God gave His covenant of grace, in which the same demand and promise are fulfilled in the Mediator.</p></blockquote>

<blockquote><p>1. Of God’s Covenant of Works, with the First Adam, and his natural seed before the fall. APHORISM I. GOD was pleased to enter into covenant with the first Adam, before his fall. Under the term, Adam, Scripture sometimes comprehends both sexes, both Adam and his wife. And if any shall contend that God entered into covenant with both Adam and we at once, as the complete root of mankind, I shall not much gainsay: and yet this will not so easily be proved, nor know I any inconvenience that would follow, should it be denied, the woman coming of Adam as well as any of his posterity. Nor am I ignorant that some are of opinion, that Adam received the covenant alone, and was to teach it, and did teach it to his wife, which opinion hath the more weight, because when God forbids the Eating of the tree of knowledge under pain of death, (wherein the promise of life contrariwise is implied,) he speaks only in the singular number, viz. to Adam only. But how may it be evidenced, That God entered into covenant with the first Adam, even into a Covenant of Works, before the Fall? Answ. Though it be not positively and plainly said in Scripture, that God gave Adam a Covenant of Works, before his fall: and though the characters and footsteps of this covenant are not so expressly discovered in Holy Writ, as of some others; yet notwithstanding, upon sundry Scripture-grounds and considerations, it may be evinced sufficiently. As, From the Inscription of the Covenant of Works in Adam’s heart. Before the Fall God wrote the Covenant of Works, viz. The Substance of the Moral Law, perfectly in Adam’s heart; and in so doing, entered into Covenant with him. Here are three thing in this Position to be cleared; viz. That the Moral Law is the Covenant of Works. That this Moral Law was perfectly written in Adams heart before the Fall. That God in Writing the Moral Law in his heart, entered into Covenant of Works with him.

1. That the Moral Law (abstractly and precisely in its self considered, without the additionals, viz. the preface, ceremonial law, &amp;c. jointly promulgated with it in Horeb) is the Covenant of Works is manifest; (1) Because, the Moral Law (by which is the knowledge of sin, and which works wrath) is styled by the Apostle “The Law of works,” and is set in opposition to “The Law of Faith.” Now this Law of Works, and Law of Faith, amount in effect to as much as the Covenant of works, and Covenant of Faith. (2) Because Righteousness and life were at first by the Moral Law, and should have been so still, had not the Law become unable to give Righteousness and life, in that it was weak through the flesh, man through Sin being unable to keep it. Now the Law, requiring obedience, and promising life upon that condition, must needs be a covenant, and that a Covenant of Works: Works being the proper Condition of it.

2. That this Moral Law for Substance was perfectly written in Adams heart before the Fall, is certain; (1) Because, Man was made in God’s image upright, and perfect. And consequently was thoroughly furnished with all accomplishments of upright and perfect Humane nature: and particularly with the Moral Law, that Law of Nature; The substance whereof was engraved both in his mind, by natural light, knowing it; and in his will, by natural integrity conforming unto it. (2) Because, The Work of the Law remains imperfectly written in some dim characters in the very hearts of pagans and heathens since the fall; They doing by nature the things contained in the Law, and being a Law unto themselves, without the Law of God written. Whence we may strongly conclude that much more before the fall the Moral Law was perfectly written in Adam’s heart, there being in him no sin to deface it in the least degree.

3. That, God, in writing the Moral Law in Adam’s heart, entered into Covenant of Works with him. viz. by real impressions upon his heart: though not by verbal expressions to the ear. For by this Law written in Adam’s heart, he had laid before him, what obedience was required and assented to on Adam’s part: And what recompense should be performed on God’s part. And this was at least an implicit, if not an explicit, covenanting. 2. From God’s express prescription of a positive Law unto Adam in his innocent State. God’s positive Law is laid down in these words, “And the LORD God commanded the man, saying, of every Tree of the Garden you may freely eat: But of the Tree of the Knowledge of good and evil, you shall not eat of it; for in the day that you eat thereof thou shall surely die.” Here are parties covenanting, and agreeing upon terms, viz. God and Adam: Here are also terms agreed upon and matters covenanted reciprocally by these parties; Adam on his part was to be obedient to God, in forbearing to Eat of the Tree of Knowledge only: God on his part, for present, permits Adam to eat of all other Trees of the Garden; And for future (in his explicit threatening of death in case of disobedience,) implicitly promises life in case of obedience herein. Now where there are parties covenanting and agreeing upon terms: And terms mutually agreed upon by those parties, as here; there’s the substance of an express covenant, though it be not formally and in express words called a covenant.</p></blockquote>

<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.”

— John Owen, The Works of John Owen, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 44–45.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+can+never+state+our+thoughts+aright+in+this+matter%2C+unless+we+have+a+clear+apprehension+of%2C+and+satisfaction+in%2C+the+introduction+of+grace+by+Jesus+Christ+into+the+whole+of+our+relation+unto+God%2C+with+its+respect+unto+all+parts+of+our+obedience.+There+was+no+such+thing%2C+nothing+of+that+nature+or+kind%2C+in+the+first+constitution+of+that+relation+and+obedience+by+the+law+of+our+creation.+We+were+made+in+a+state+of+immediate+relation+unto+God+in+our+own+persons%2C+as+our+creator%2C+preserver%2C+and+rewarder.+There+was+no+mystery+of+grace+in+the+covenant+of+works.+No+more+was+required+unto+the+consummation+of+that+state+but+what+was+given+us+in+our+creation%2C+enabling+us+unto+rewardable+obedience.+%E2%80%9CDo+this%2C+and+live%2C%E2%80%9D+was+the+sole+rule+of+our+relation+unto+God.+There+was+nothing+in+religion+originally+of+that+which+the+gospel+celebrates+under+the+name+of+the+grace%2C+kindness%2C+and+love+of+God%2C+whence+all+our+favourable+relation+unto+God+doth+now+proceed%2C+and+whereinto+it+is+resolved%3B+nothing+of+the+interposition+of+a+mediator+with+respect+unto+our+righteousness+before+God%2C+and+acceptance+with+him%3B%E2%80%94which+is+at+present+the+life+and+soul+of+religion%2C+the+substance+of+the+gospel%2C+and+the+centre+of+all+the+truths+revealed+in+it.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+5+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+44%E2%80%9345.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F762b7e58fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/762b7e58fd.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/owen-no-mystery-of-grace-in-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>3. In the special matter of the Covenants [they differ], and that both in respect of the promise and stipulation. … In that, life eternal and most blessed is promised, but only animal, to be enjoyed in Paradise, or continuance in that good estate wherein he was set at first of the rich bounty of God: but in the other, translation out of ignominy and death into eternal happiness and glory in Heaven.</p></blockquote>

<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Covenant of Works</cite>, 5</span></figcaption>

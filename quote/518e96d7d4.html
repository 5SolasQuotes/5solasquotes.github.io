</figure><figure class="quote" id="q-c84d53d055" data-kw="">
<blockquote><p>In conforming to the righteousness and holiness enjoined in God’s Word men cannot be too strict and precise; But when men out of an opiniative confidence in their own judgment shall be violently bent upon the doing of anything which by the Word of God they are no way bound to do, or shall scruple that which the Word of God does nowhere forbid, though they may do it conscientiously and upon opinion of duty, then they are overwise and righteous overmuch. That which therefore Solomon here enjoins God’s people is a prudent and pious moderation of their behavior in all things that they should be wise unto sobriety, not resting too much upon their own understanding and judgement, but advising with others, Rom. 12:3, and that they should temper their zeal with godly wisdom and prudence, according to that, Phil. 4:5, ‘Let your moderation be known unto all men;’ And the reason whereby this is pressed is, lest by doing otherwise men should involve themselves in desperate dangers, as by such courses men often do: ‘Why shouldest thou destroy thyself?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon Job, the Psalms, the Proverbs, Ecclesiastes &amp; the Song of Solomon (1658), ch. 7</cite>, p. 67</span></figcaption>

</figure><figure class="quote" id="q-ae38a93a6e" data-kw="">
<blockquote><p>The duties required in the ninth commandment are… appearing and standing for the truth;[d] and from the heart,[e] sincerely,[f] freely,[g] clearly,[h] and fully,[i]… a charitable esteem of our neighbours;[m]… defending their innocency;[r] a ready receiving of a good report,[s] and unwillingness to admit of an evil report,[t] concerning them; discouraging… flatterers,[w]… love and care of our own good name, and defending it when need requireth;[y]… studying and practising of whatsoever things are true, honest, lovely, and of good report.[a] [d] Prov. 31:8,9. [e] Ps. 15:2. [f] 2 Chron. 19:9. [g] 1 Sam. 19:4,5. [h] Josh. 7:19. [i] 2 Sam. 14:18-20. [m] Heb. 6:9. 1 Cor. 13:7. [r] 1 Sam. 22:14. [s] 1 Cor. 13:6,7. [t] Ps. 15:3. [w] Prov. 26:24,25. [y] Prov. 22:1. John 8:49. [a] Phil. 4:8.</p></blockquote>

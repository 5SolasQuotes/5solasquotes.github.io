<main class="wrap"><figure class="quote" id="q-e55b8e106f" data-kw="">
<blockquote><p>Indeed we must remember that the love, election and predestination of God are ordered among themselves and follow on one another for a certain reason. First, all men in their unhappy estate are presented to the knowledge of God, as needy and miserable, then those of whom God of his pure and simple mercy loves and for whom He wills the good are distinguished from those He passes over, who are not comprehended within his benevolence: by this distinction they are said to be elect; the elect, truly, are appointed toward their end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>trans. Richard Muller, Christ &amp; the Decree, p. 65, from Common Places, III.i.10, p. 449. See Muller’s discussion generally for the other infralapsarian characteristics of Vermigli’s view.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a0bf0ad744" data-kw="supralapsarian">
<blockquote><p>They who ascend above the fall (supra Lapsum) or creation to determine the object of predestination think … the decree of predestination should be made to precede the decree of creation and the permission of the fall. … Although this order contains nothing absolutely repugnant to the foundation of salvation and the analogy of faith … yet various objections hinder its reception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.4–5</span></figcaption>

</figure><figure class="quote" id="q-26b513cea7" data-kw="">
<blockquote><p>Paul … alludes to the creation of Adam, and rises up to the eternal purpose of God, who, before he created mankind, decreed of his own mere will and pleasure, to manifest his glory, both in saving of some whom he knew, in a way of mercy, and in destroying others, whom he also knew, in righteous judgment. And verily, unless we judge this to be the case, God will be greatly injured; because he will not be sufficiently wise, who first creates men, and looks upon them corrupt, and then appoints to what purpose he has created them: nor sufficiently powerful, if when he has taken up a purpose concerning them, he is hindered by another, so that he obtains not what he willed; nor sufficiently constant, if willingly and freely he takes up a new purpose, after his workmanship is corrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Complete Tract on the Doctrine &amp; True Use of Predestination, out of the Lectures of Theodore Beza on Chapter 9 of the Epistle to the Romans… adjoined are some places taken out of the book of Dr. Luther on the Bound Will Against Erasmus, from which appears that his judgment on Predestination was in everyway consonant with ours 2nd ed. ed. Raphael Eglin (Eustathius Vignon, 1583) 182</cite>, pp. no ToC Table</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>…when folk begin to cast at just distinguishing and separating the precious from the vile as mere notional and metaphysical abstractions unfit for Christians or men (as some of you are pleased to talk), we fear they be found builders of Babel, not of Salem [Peace], but love [those] who will to be masters of confusion…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-595686e025" data-kw="">
<blockquote><p>Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665; 2024) at Translationes Lyncei</span></figcaption>

</figure><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology: A Response to Brian Mattson &amp; Richard Gaffin’</cite>, (2024)</span></figcaption>

<blockquote><p>Treatments of the history of and various schools of thought within Thomism can be found in: Romanus Cessario, A Short History of Thomism (Catholic University of America Press, 2003); Helen James John, The Thomist Spectrum (Fordham University Press, 1966); Fergus Kerr, After Aquinas: Versions of Thomism (Blackwell, 2002); Ralph M. McInerny, Thomism in an Age of Renewal (University of Notre Dame Press, 1968); and Brian J. Shanley, The Thomist Tradition (Kluwer, 2002). Useful collections of essays can be found in: Victor Brezik, ed., One Hundred Years of Thomism: Aeterni Patris and Afterwards, A Symposium (Center for Thomistic Studies, 1981); Deal W. Hudson and Dennis Wm. Moran, eds., The Future of Thomism (American Maritain Association, 1992); and the series Thomistic Papers published by the Center for Thomistic Studies at the University of St. Thomas in Houston, Texas. Jacques Maritain, St. Thomas Aquinas (Meridian Books, 1958) contains a useful collection of papal statements on the significance of Aquinas for Roman Catholic thought. Gerald A. McCool has developed a controversial interpretation of the recent history of Thomism in a series of books; see his Nineteenth-Century Scholasticism: The Search for a Unitary Method (Fordham University Press, 1989); From Unity to Pluralism: The Internal Evolution of Thomism (Fordham University Press, 1989); and The Neo-Thomists (Marquette University Press, 1994). His interpretation is debated in John F. X. Knasas, ed., Thomistic Papers VI (Center for Thomistic Studies, 1994). The Neo-Scholastic approach to Aquinas is summarized in Reginald Garrigou-Lagrange, Reality: A Synthesis of Thomistic Thought (B. Herder Co., 1950; reprinted by Ex Fontibus Co., 2006). A recent treatment of Garrigou-Lagrange’s thought is Richard Peddicord, The Sacred Monster of Thomism: An Introduction to the Life and Legacy of Reginald Garrigou-Lagrange, O. P. (St. Augustine’s Press, 2005). Presentations of existential Thomism can be found in Etienne Gilson, Being and Some Philosophers (Pontifical Institute of Medieval Studies, 1952) and Jacques Maritain, Existence and the Existent (Vintage Books, 1966). John F. X. Knasas, Being and Some Twentieth-Century Thomists (Fordham University Press, 2003) is a recent defense and Ralph McInerny, Praeambula Fidei: Thomism and the God of the Philosophers (Catholic University of America Press, 2006) a recent critique. Two recent introductions to Laval/River Forest Thomism are The Writings of Charles De Koninck, Volume 1, edited and translated by Ralph McInerny (University of Notre Dame Press, 2008) and Benedict M. Ashley, The Way toward Wisdom: An Interdisciplinary and Intercultural Introduction to Metaphysics (University of Notre Dame Press, 2006). For transcendental Thomism, see Joseph Donceel, ed., A Marechal Reader (Herder and Herder, 1970). For Lublin Thomism, see Rocco Buttiglione, Karol Wojtyla: The Thought of the Man Who Became Pope John Paul II (Eerdmans, 1997). For analytical Thomism, see the chapter on Aquinas in G. E. M. Anscombe and P. T. Geach, Three Philosophers (Basil Blackwell, 1961); John Haldane, ed., Mind, Metaphysics, and Value in the Thomistic and Analytical Traditions (University of Notre Dame Press, 2002); The Monist, Vol. 80, No. 4 (1997), a special issue on Analytical Thomism edited by Haldane; and Craig Paterson and Matthew S. Pugh, eds., Analytical Thomism: Traditions in Dialogue (Ashgate, 2006).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3794c1024c" data-kw="">
<blockquote><p>…the [German] Elector of Brandenburg, John Sigismund, who celebrated Christmas in 1613 by converting from Lutheranism to the Reformed faith. This plunged his land into crisis, since most of his subjects were Lutheran and unwilling to follow their prince’s religious wanderings. John Sigismund refrained from ordering them to do so, but did impose several measures aimed at reducing Lutheran-Reformed animus. Among these were requirements for confessional parity at Brandenburg’s flagship university at Frankfurt, Oder, as well as stringent prohibitions against confessional polemicizing in sermons. This was a kind of forced ecumenism, and it set important precedents. In time, Brandenburg, which eventually became Prussia, created the first Reformed-Lutheran “united” church. It, too, was ordered from on high. In 1817, two centuries after his forefather’s momentous conversion, King Frederick William III of Prussia ordered Lutherans and Reformed to form one single church body, the Prussian Union of Churches. As the rising Prussia swallowed more and more of its neighboring German territories, its union model expanded as well, soon covering roughly half the Protestant territories in Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-g-appold.html">Kenneth G. Appold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Lutheran-Reformed Relations: A Brief Historical</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af725b8991" data-kw="">
<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession, the former, known specifically as the Reformed, have always tried to reconcile with those of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups. II. Although these latter ones [the Lutherans] have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues. III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book “Northern Olive Branch,” and George Calixtus, professor of theology at the University of Helmstedt, in his book “Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683)</cite>, pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-f9804783ca" data-kw="">
<blockquote><p>My design is to indicate how slowly the process ran out its course, by which a Lutheran and a Reformed Church arose in Germany in the sixteenth century… These [Lutheran and Reformed] reformations are then [popularly] thought of as like two circles, which merely touch each other; or, according to others, which really intersect, and have large segments in common, but which yetnever cover exactly the same space, or were drawn from one center… It is easy to refute this false opinion…</p></blockquote>

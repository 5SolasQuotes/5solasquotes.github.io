<main class="wrap"><figure class="quote" id="q-54f4978133" data-kw="">
<blockquote><p>Scarcely can we hold any meeting with them without polluting ourselves with open idolatry. Their principal bond of communion is undoubtedly in the Mass, which we abominate as the greatest sacrilege.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5af9981654" data-kw="">
<blockquote><p>But the head of this horrid abomination was, when he raised a sign by which it was not only obscured and perverted, but altogether obliterated and abolished, vanished away and disappeared from the memory of man—namely, when, with most pestilential error, he blinded almost the whole world into the belief that the Mass was a sacrifice and oblation for obtaining the remission of sins.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.18.1</figcaption>

<blockquote><p>This is that shocking idolatry which is practiced in the Popish mass, which is doubtless so displeasing in the sight of God, that it were better for us to suffer a thousand deaths, than that we should ever be guilty of it.</p></blockquote>

</figure><figure class="quote" id="q-c204f63b4a" data-kw="">
<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>
<figcaption>— <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper (the Mass)</figcaption>

</figure><figure class="quote" id="q-89510b8bf5" data-kw="">
<blockquote><p>So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 59</figcaption>

<main class="wrap"><figure class="quote" id="q-e9bbff3ec9" data-kw="">
<blockquote><p>If they are truly slaves, as slaves formerly were, I would not deny it; for we read that it was commanded to Abraham that he should circumcise all his servants. But such as we have as servants today—since for the most part they are truly free—I do not think they should be treated in that way. Nor indeed those who by right of war become subjects to princes; for this kind of subject nevertheless remains free. Therefore, with respect to those born of unbelieving parents yet free, if the parents consent, I think a distinction should be made. For they consent either after they themselves have become believers, and then there is no difficulty, etc.; or they persist in unbelief, and then I do not think they are to be baptized, etc.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Panstratiae, vol. 4, bk. 5, ch. 11, section 2, as quoted in Latin by Giles Firmin, A Sober Reply to the Sober Answer of Reverend Mr. Cawdrey… (London, 1653)</cite>, p. 42, trans. by ChatGPT4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-e695624f3c" data-kw="infants are not to be baptized">
<blockquote><p>Because they baptized Proselytes both Men, Women and Children, must Christians do so too? Sure the Custom of the Romish Church in baptizing of Infants, as a human Tradition, is every way of as good Authority to warrant us so to do, as the Custom of the unbelieving Jews. But pray take what a Learned Pedo-Baptist, and a Son of the Church of England, hath said in answer to this vain Conceit; &#x27;tis Sir Norton Knatchbull, in his Animadversiones in lib. Novi Testamenti, pag. 313. Ac cum videam summi judicii viros in his temporibus ex Rabbinis fundamenta petere veritatis, &amp;c. But when I see in these times some Men of the greatest Judgment to fetch the Foundation of Truth from the Rabbins, I cannot but stick at it: for whence was the Talmud sent to us, (they are the words (saith he) of Buxtorf in his Synagoga Judaica) that we should give so, much Credit thereto, that we should believe that the Mosaic Law either was or ought to be understood therefrom, much less the Gospel, to which they are professed Enemies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-47557be10b" data-kw="">
<blockquote><p>15. But when and in what sort and degree Christ gives the actual operations of the Spirit to all covenanted infants, it is wonderful hard for us to know. But this much seems clear: 1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason. 2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: 1673) | Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’</cite>, p. 819</span></figcaption>

<main class="wrap"><figure class="quote" id="q-024d666a76" data-kw="">
<blockquote><p>But frantic fellows do both unskillfully and also wickedly impugn baptizing of infants under colour hereof. Why was it meet that faith should go before baptism in the eunuch? To wit, because seeing that Christ marketh those alone which are of the household of the Church with this note and mark, they must be ingrafted unto the Church who are to be baptized.

And as it is certain that those who are grown up are ingrafted by faith, so I say that the children of the godly are born the children of the Church, and that they are accounted members of Christ from the womb, because God adopteth us upon this condition, that he may be also the Father of our seed. Therefore, though faith be requisite in those which are grown up, yet this is untruly translated unto infants whose estate is far unlike. …

I believe that Jesus Christ. As baptism is grounded in Christ, and as the truth and force thereof is contained there, so the eunuch setteth Christ alone before his eyes. The eunuch knew before that there was one God, who had made the covenant with Abraham, who gave the law by the hand of Moses, which separated one people from the other nations, who promised Christ, through whom he would be merciful to the world. Now he confesseth that Jesus Christ is that Redeemer of the world, and the Son of God; under which title he comprehendeth briefly all those things which the Scripture attributeth to Christ.

This is the perfect faith whereof Philip spake of late, which receiveth Christ, both as he was promised in times past, and also showed at length, and that with the earnest affection of the heart, as Paul will not have this faith to be feigned. Whosoever hath not this when he is grown up, in vain doth he boast of the baptism of his infancy. For to this end doth Christ admit infants by baptism, that so soon as the capacity of their age shall suffer, they may addict themselves to be his disciples, and that being baptized with the Holy Ghost, they may comprehend, with the understanding of faith, his power which baptism doth prefigure.</p></blockquote>

<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are:

1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause.

2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism.

3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>

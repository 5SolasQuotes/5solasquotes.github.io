<main class="wrap"><figure class="quote" id="q-033263c571" data-kw="">
<blockquote><p>…For I am of no other mind than Prosper [in the early Church] was: Habet populus Dei plenitudinem suam, et quamvis magna pars hominum salvantis gratiam aut repellat aut negligat, in electis tamen et praescitis atque ab omni generalitate discretis, specialis quaedam censetur universitas, ut de toto mundo, totus mundus liberatus, et de omnibus hominibus, omnes homines videantur assumpti. [“The people of God possess their own fullness; and although a great part of mankind either rejects or neglects saving grace, yet in the elect and foreknown, and those distinguished from the whole generality [of mankind], there is reckoned a certain special universality, so that, from the whole world, the whole world may be said to have been liberated, and from among all men, all men may appear to have been taken up.”] That Christ died for his apostles, for his sheep, for his friends, for his Church, may make peradventure against those who make all men to have a share alike in the death of our Savior: but I profess myself to hold fully with him who said: Etsi Christus pro omnibus mortuus est, tamen specialiter pro nobis passus est, quia pro Ecclesia passus est. [“Although Christ died for all, yet He suffered especially for us, because He suffered for the Church.”] Yea, and in my former writing I did directly conclude, that as in one respect Christ might have been said to die for all, so in another respect truly said not to have died for all; and my belief is, that the principal end of the Lord’s death, was, ‘that He might gather together in one the children of God scattered abroad,’ and, that for their sakes He did specially sanctify Himself, that they ‘also might be sanctified through the truth.’ And therefore it may be well concluded that Christ in a special manner died for these; but to infer from hence, that in no manner of respect He died for any others, is but a very weak collection, especially the respect by me expressed being so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, pp. 567-68</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbbb3afe59" data-kw="">
<blockquote><p>Now the general satisfaction of Christ, which was the first act of his priestly office, prepares the way for God’s mercy, by making the sins of all mankind pardonable, the interposition of any bar from God’s justice notwithstanding, and so puts the sons of men only in a possibility of being justified, a thing denied to the nature of fallen angels, which the Son was not pleased to assume; but the special application of this satisfaction vouchsafed by Christ unto those persons only whom his Father has given Him out of the world, which is an appendant, or appertains to the second act of his priesthood, viz. his intercession, produces this potentia in actum, that is, procures an actual discharge from God’s anger; and makes justification, which before was a part of our possibility, to be a part of our present possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, p. 569</span></figcaption>

<blockquote><p>[Amyrauldianism] is not… an acceptable form of Calvinism, or even a tenable form of Calvinism. For one thing, it is a logically inconsistent form of Calvinism and therefore an unstable form of Calvinism… …it is impossible to contend that God intends the gift of his Son for all men alike and equally and at the same time intends that it shall not actually save all but only a select body which He Himself provides for it. The schematization of the order of decrees presented by the Amyraldians, in a word, necessarily implies a chronological relation of precedence and subsequence among the decrees, the assumption of which abolishes God, and this can be escaped only by altering the nature of the atonement. And therefore the nature of the atonement is altered by them, and Christianity is wounded at its very heart… A conditional substitution being an absurdity, because the condition is no condition to God, if you grant him even so much as the poor attribute of foreknowledge, they necessarily turn away from a substitutive atonement altogether…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Plan of Salvation</cite>, (USA: Simpson Publishing Company, rep. 1989), pp. 96-97</span></figcaption>

<blockquote><p>For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, pp. 554-55</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.”

— James Ussher, The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, pp. 554-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+finding+out+of+this+middle+course%E2%80%A6+the+former+%5Bsatisfaction+of+Christ%5D+was+once+done+for+all%2C+the+other+%5Bapplication+thereof%5D+is+still+in+doing%3A+the+former+brings+with+it+sufficiency%2C+abundant+to+discharge+the+whole+debt%3B+the+other+adds+to+it+efficacy.+The+satisfaction+of+Christ+only+makes+the+sins+of+mankind+fit+for+pardon%2C+which+without+it+could+not+well+be%3B+the+injury+done+to+God%E2%80%99s+majesty+being+so+great%2C+that+it+could+not+stand+with+his+honour+to+put+it+up+without+amends+made.+The+particular+application+makes+the+sins+of+those+to+whom+that+mercy+is+vouchsafed+to+be+actually+pardoned%E2%80%A6+Hence%2C+we+infer+against+the+first+extremity%2C+that+by+the+virtue+of+this+blessed+oblation%2C+God+is+made+placable+unto+our+nature+%28which+He+never+will+be+unto+the+angelical+nature+offending%29+but+not+actually+appeased+with+any%2C+until+He+has+received+his+Son%2C+and+put+on+the+Lord+Jesus.+As+also+against+the+latter+extremity%2C+that+all+men+may+be+truly+said+to+have+interest+in+the+merits+of+Christ%2C+as+in+a+common%2C+though+all+do+not+enjoy+the+benefit+thereof%2C+because+they+have+no+will+to+take+it.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Whole+Works+of+the+Most+Rev.+James+Ussher%E2%80%A6+17+vols.+%28Dublin%3A+Hodges+%26+Smith%2C+1864%29%2C+vol.+12+%7C+%E2%80%98Of+the+True+Intent+%26+Extent+of+Christ%E2%80%99s+Death+%26+Satisfaction+upon+the+Cross%E2%80%99+%281617%29%2C+pp.+552-60%2C+pp.+554-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa225b91a4d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a225b91a4d.html">Permalink</a><a class="src" href="https

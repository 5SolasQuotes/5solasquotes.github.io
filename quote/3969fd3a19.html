%20in%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d31aac66d3" data-kw="">
<blockquote><p>There are many who consider the use of instruments as merely an aid to singing. If Christians are commanded to sing in worship, what is wrong with using an instrument to assist the voice in carrying the tune? After all, it is argued, without an instrument to assist, many would not be able to sing the tunes properly. In other words, instruments have become a necessary aid to the practice of a Scriptural element of worship, as if congregational singing is impossible or impractical without mechanical help. Looking at it this way, some argue that instruments are a circumstance to worship, not an element regulated by Scripture, much like the building, what pulpit is used, and other things common to any kind of meeting. Even if instrumental music could be considered as an aid to worship, the Lord still strictly controls what aids are allowed in His worship. The Israelites, in their zeal to offer to the Lord true worship, nevertheless committed idolatry when they forged the golden calf at Sinai to magnify the great power of God. They weren’t blind pagans; they intended to worship the God of Israel, not some pagan deity. But in their desire for an aid to worship, they sinned and instead provoked the wrath of God. To them the golden calf was an aid to worship that they thought the Lord would have allowed, but to the Lord it was an unauthorized aid that He abhorred. In matters of worship, both reason and the will of man is a fatal guide. We would do well to remember the words of Solomon in Prov. 16:25, “There is a way that seemeth right unto a man, but the end thereof are the ways of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brad-freeman.html">Brad Freeman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Freeman is a Presbyterian Reformed Church minister. Why Not Instruments In Worship?, V. A Common Reason Answered</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-6ceaa3133c" data-kw="">
<blockquote><p>Objection: These gracious effects and fruits of singing Psalms, do plead as much for singing and playing with instruments, as for singing with voices. Answer 1: This last effect of singing to the glory of God with our glory is peculiar only to singing with our tongues. Answer 2: Suppose it were true that these effects of singing Psalms did plead as much for singing and playing with instruments, as singing with voices; yet evident it is that singing with voices had the preeminence, as that which uttering the Word of God did chiefly utter the Spirit of God breathing in it. And withal evident likewise it is that it is no impeachment to an ordinance that the outward dispensing of it may be performed by Nature and Art; but notwithstanding that it may be accompanied of God with a spiritual blessing. Answer 3: Singing with instruments was typical, and so a ceremonial worship and therefore is ceased. But singing with heart and voice is a moral worship such as it written in the hearts of all men by Nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, p. 5</span></figcaption>

<blockquote><p>II. A Voluntate Dei, ‘from the will of God’. This is the other reason: ‘For the Father seeks such to worship Him.’ [Jn. 4:23] God requires such worship and worshippers. The foundation of this reason is this: The rule of worship is not mans fancy, but God’s will: Men’s fancies and wills are infinitely various, and therefore those that have gone that way, have been divided into a thousand varieties; they worship they know not what, as v. 22. Only God’s will is the stable rule: None knows the mind of God but the Spirit of God: Now this is the worship God requires in Gospel times. Argument Second: From the end [design] of worship. Look what the ends of worship are, such must the worship be: And that was the reason why the Jewish worship was so much typical, because the end of it was to represent Christ; And that end being now attained, and Christ exhibited [revealed], we must consider what were and are the further ends of worship. Now the ends are of two sorts. 1. In reference to God. 2. In reference to men. And both will show us that the worship must be spiritual. I. In relation to God; so it is double: 1. To please God: this is finis operis &amp; operantis too [‘the end of the work, and of working’], (if a man be sincere) Ps. 19:14, ‘Let the words of my mouth and the meditation of my heart be acceptable in thy sight.’ Now it is only spiritual worship that can please God: That man does but little consider the nature of God, that thinks God is pleased with the bowing of the knee to an altar, no, it is the bending of the heart that God respects. It is not an organ in a church, but the organ of a gracious heart, and melody in the heart that pleases God. 2. To exalt God amongst men, to render Him glorious in the eyes of the world: Now how is that done? Do you think that it makes God glorious, when men seek to honor Him with bodily and external services? No, you cannot dishonor God more than by giving Him such a worship as begets a carnal representation of God, etc. And when God would set Himself forth in his glory, He represents Himself in a spiritual manner, and He takes them off from all corporeal thoughts and fancies: ‘God is a Spirit.’ ‘To whom will you liken Me?’ ‘You saw no shape.’ ‘God dwells not in temples made with hands.’ II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon (1660), pp. 13-14 Poole was an English puritan.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-f29b709d88" data-kw="">
<blockquote><p>God intended a Law-dispensation but for a time.

2. Adam, how he was ordained for a Law-life.

3. How predestinated to glory in Christ, how not.

4. That the heathens have no more universal grace than devils.

5. No ground for such grace. It is apparent that God intended not a Law-dispensation in paradise to stand for ever. For nothing is spoken of Adam, after the fall, but of his procreating of children, of the patriarchs, of Adam’s dying and of his acts before the fall, the place of paradise being scarce well known, which says the Lord had a farther design to lay aside the transient Law-dispensation and to set up Christ. The Lord, of purpose, gave a positive Law, forbidding eating of such a tree, added a threatening thereunto particularly, suffered the serpent to tempt, and foresaw what frail nature would do, that he might deal with man, in a dispensation of free grace. Object. Did not God ordain that Adam should have life and righteousness, if he should continue in obedience. Answ. That was a decree conditional of things, (“the man that does these things shall live”) and shows the equity and holiness of the Law, but it was not a decree of persons, by which God predestinated Adam to a Law-glory, as the end, and to Law-obedience as the effectual means leading to that end. Q. Was not Adam chosen? Ans. Adam, according to the Lord’s design, finaliter and objective (finally and objectively) was created in the state of predestination to glory and grace in Christ, as touching [his] person, but according to his inherent condition, he was created in a legal dispensation, which was a gracious inlet to Christ; And according to his Law-state as he represented all mankind, he was created as a lubric [slippery] and frail copy of weak nature. Many who are such as are not chosen are created and live under a covenant of works, having only some concomitant favors of the Gospel, as the preaching thereof.

2. Common grace, inward warnings.

3. Protections of providence and forbearance, in regard they are mixed with the elect. The heathen cannot be said to have any inward calling to grace and glory, because there be some remnants of the image of God left in them, which no more can be called universal grace, then the same sparkles that are left in devils can be called Gospel grace, for they believe, “There is one God and confess the Son of God,” (Jam. 2:19; Luk. 4:34. Mark 1:24). Only if this be called grace, that the nature of man is so capable of Gospel mercy, and the nature of the fallen angels morally not so.

2. The offer is made to them of Christ; not so to devils, we shall not contend. Reason may seem to say that all should have a share of Gospel-grace, but it may be replied to reason, why should it seem to be a part of the goodness and bounty of God to will and desire all and every one to be saved, and not to institute such a dispensation, as all and every one should actually be saved?

2. How should that stand, (“he has mercy on whom he will”) if free-will of the creature absolutely dispose of salvation and damnation?

3. How is it that the calling, adoption, and the offer of mercy is restricted to few, and was confined to the Jews only of old? But we are more ready to call the Lord to a reckoning, for his dispensation of grace to others, then to use our own, as becomes us.

2. We cannot judge aright of God and of his goodness, except he be God our very way.

3. It is a matter of no small difficulty to make right use of the Lord’s freedom of grace, and for clay humbly to adore Sovereignty, and not to stumble at the highness of his ways, who, in these points, has ways and thoughts above ours, “as the heavens are above the earth” (Isa. 55).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (Edinburgh, 1654), 13–15 [Spelling and punctuation modernized].</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aafc608860" data-kw="">
<blockquote><p>As to his legal relations, the Scriptures clearly teach that, at his creation, he was put under the equitable Covenant of Works for a certain probationary period. This just constitution provided (a) everlasting well-being on condition of perfect obedience, and (b) everlasting ill-being on condition of disobedience. Now, although under that covenant man failed, it is evident that, nevertheless, both of these conditions must be maintained in their integrity. To relax them would be to violate the word of God, to dishonour his law, and to render his promises and his threatenings alike unworthy of respect. The penalty, when once incurred, can be preserved inviolate only by being executed. The promise of everlasting well-being can be truthfully granted only when the condition of perfect obedience has been fulfilled. Suffering a righteous penalty entitles no criminal to a reward; and to offer eternal blessedness to such, on terms denied to unfallen Adam and to all angels, would be placing a premium on sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement</cite>, (Philadelphia, PA: Presbyterian Board of Publication, 1867), 26.</span></figcaption>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

</figure><figure class="quote" id="q-ef5dce598c" data-kw="">
<blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation</cite>, ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.”

— Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+present+there+is+gneral+agreement+that+the+doctrine+of+the+covenants+is+a+peculiarly+Reformed+doctrine.+It+emerged+in+Reformed+theology+where+it+was+assured+of+a+permanent+place+and+in+a+way+that+has+also+remained+confined+within+these+bounds.+It+is+true+that+towards+the+end+fo+the+seventeenth+century+this+doctrine+was+taken+over+by+several+Lutheran+theologians%2C%C2%B9+but+this+apparently+took+place+by+way+of+imitation%2C+the+doctrine+being+unknown+within+the+genuine+Lutheran+framework.+%C2%B9+Diestel+%28Jahrbucher+fur+Deutsche+Theologie%2C+10%2C+266%29+lists+those+Lutheran+theologians+who+gave+a+place+to+the+covenant+in+their+system%2C+viz.%2C+Calixtus%2C+Wolfgang+Jager+of+Tubingen%2C+Caspar%2C+Exner%2C+Reuter%2C+and+others.+Cocceius+enjoyed+a+good+reputation+in+Germany%2C+especially+as+an+exegete%2C+even+among+the+Lutherans.+The+covenant+of+works+was+emphasized.+This+is+strange+since+there+is+no+place+for+it+in+a+consistent+Lutheran+system.+Federal+and+natural+unity+were+placed+side+by+side+in+the+covenant+of+works+without+subordinating+the+one+to+the+other.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99+in+Redemptive+History+%26+Biblical+Interpretation%3A+the+Shorter+Writings+of+Geerhardus+Vos+ed.+Richard+Gaffin+%28d.+1949%3B+Presbyterian+%26+Reformed%2C+1980%29%2C+p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef5dce598c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef5dce598c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=At%20present%20there%20is%20gneral%20agreement,su <blockquote><p>A sacrament, is an outward sign, which God joins to his covenant, which he hath made with men. And that is either of an eternal, or temporal covenant. A sacrament of an eternal covenant, is a sacrament, whereby God confirms the promise of eternal life. And that is either of the covenant of works, or of the covenant of grace. The sacrament of the covenant of works, is a sacrament, which God gave our first parents in the state of their first integrity. And that was twofold: the tree of life, and the tree of the knowledge of good and evil. The tree of life was a sacrament of the covenant of works, whereby that life was signified, which man should have lived, if he had stood in the obedience of God. Gen. 2. 9. The tree of the knowledge of good and evil, was a sacrament by which was signified to man, in how good estate he was while he performed obedience to God his creator: and into how evil and miserable estate he should cast himself if he obeyed not God. Gen. 2. 17 &amp; 3. 7. 8. 9. 10. 11.</p></blockquote>

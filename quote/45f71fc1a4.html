<main class="wrap"><figure class="quote" id="q-45f71fc1a4" data-kw="">
<blockquote><p>2. Rulers may not make laws of things having no necessity of goodness, decency and aptness to edify, and [they are] only [deemed] good because they will, when they see, of necessity, these laws shall inevitably ruin many souls; for that is to have more regard to their own will than to the salvation of people’s souls, whereas even Christ pleased not Himself.</p></blockquote>

</figure><figure class="quote" id="q-aaf93bec2a" data-kw="">
<blockquote><p>How shall we hold and keep fast the letter of Scripture, when there are so many Greek copies of the New Testament? and these diverse from one another? Yes, well: for though there are many received copies of the New Testament; yet there is not material difference between them. The four Evangelists do vary in the relation of the same thing; yet because there is no contradiction or material variation, we do adhere to all of them, and deny none. In the times of the Jews before Christ, they had but one original of the Old Testament; yet that has several readings: there is a marginal reading and a line reading, and they differ no less than eight hundred times the one from the other; yet the Jews did adhere to both and denied neither; Why? Because there was no material difference. And so now, though there be many copies of the New Testament; yet seeing that there is no material difference between them, we may adhere to all:</p></blockquote>

<blockquote><p>2. How does [Richard] Hooker prove that the vessels made for Baal are in their own nature more incurable than the sign of the cross? You may remove the superstitious intention and idolatrous use of any vessel and turn it to a good use; yet Josiah burnt them to ashes. The like may be said of the groves which he stamped to powder and cast in the brook Kidron, and of the chariots five of the sun which he burnt with fire, and of the bones of dead men, not any of these being of their own nature more indifferent and innocent creatures of God, [nor] were of their own nature more scandalous and more incurable than the sign of the cross. The like may be said of altars…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty</cite>, pp. 91-92</span></figcaption>

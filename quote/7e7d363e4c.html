<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government and Excommunication</cite>, … (London, 1646), ch. 27, p. 615</span></figcaption>

</figure><figure class="quote" id="q-af834b5bd2" data-kw="">
<blockquote><p>Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labor in it more diligently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, (1550)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labor in it more diligently.”

— John Calvin, Commentary on Isaiah (1550)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+it+ought+to+be+observed+that+something+remarkable+is+here+demanded+from+princes%2C+besides+an+ordinary+profession+of+faith%3B+for+the+Lord+has+bestowed+on+them+authority+and+power+to+defend+the+Church+and+to+promote+the+glory+of+God.+This+is+indeed+the+duty+of+all%3B+but+kings%2C+in+proportion+as+their+power+is+greater%2C+ought+to+devote+themselves+to+it+more+earnestly%2C+and+to+labor+in+it+more+diligently.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Isaiah+%281550%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf834b5bd2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af834b5bd2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=Hence%20it%20ought%20to%20be%20observed,to%20labor%20in%20it%20more%20diligently&amp;text=Hence%20it%20ought%20to%20be%20observed%20that%20something&amp;text=earnestly%2C%20and%20to%20labor%20in%20it%20more%20diligently" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a337650820" data-kw="">
<blockquote><p>I offer (Worthy Reader) to your impartial and ingenuous censure these my ensuing thoughts against Liberty of Conscience, from which way, looking to me with a face of atheism, I call the adversaries, Libertines, not intending to reach a blow to any godly man, or to wound those who out of weakness are captivated with that error, but to breed in the hearts of the godly a detestation of that way, which in truth has its rise from Libertinism, and savors rankly of wide, loose and bold atheistical thoughts of the majesty of God, as if our conscience had a Prerogative Royal beside[s] a rule… and our faith and hope [according to it] must be resolved in the first principle of skepticism. So it seems to me, for the young daughters of the mind, the simplest acts of apprehending, knowing, believing God and divine truths are innocent, harmless ill-less soul-works, being from under all dominion of either free-will or a divine Law; and the mind [according to it, being] a free-born absolute Princess, can no more incur guiltiness in its operations about an infinite Sovereign God and his revealed will by this lawless way, than the fire in burning, the sun in enlightening, the stone in moving downward, be arraigned of any breach of Law, if toleration have place. All certainty of believing, all steadfastness, rooting and unmovable establishing in the truth, all life of consolations and comforts in the Scriptures, all peace of heavenly confidence, all joy unspeakable and full of glory, all lively hope, all patient and submissive waiting for the fruits of the harvest, all wrestling in prayer, all gloriation in tribulation and all triumphing in praising, all rejoicing in the Spirit, being bottomed on fallible opinions, on doubtful disputations of skeptics, may be the reelings of windmills, fair fancies and dreams; for who (say they) is infallible? and who hath known the mind of the Lord? so as the truth must be monopolized to any one sect or way? Who in faith or fullness of assurance can convince or rebuke gainsayers, heretics, or such as bring another doctrine, as those whom you so labor to convince and rebuke? 3. Conscience is hereby made every man’s rule, umpire, judge, Bible, and his God, which if he follow, he is but at the worst, a godly, pious, holy heretic, who fears his conscience more than his Creator, and is to be judged of you a saint. 4. Hence conscience being deified, all rebuking, exhorting, counter-arguing, yea all the ministry of the Gospel must be laid aside; no man must judge [a] brother [an] idolater, or brother Familist, or saints to be Socinians, or men of corrupt minds, perverse disputers, vain-janglers, wresters, rackers or torturers of Scripture, whose words eat as a canker, who subvert whole houses, who speak the visions of their own head and see false burdens, for all these who were of old, but are now quite gone out of the world; for who can make a window in any man’s soul and see there heart-obstinacy which only does essentially constitute the heretic, the blasphemer, the false prophet [according to them]? But is not brotherly forbearance, Christian indulgence a debt we owe to brethren, saints, and the truly godly in errors, and mind infirmities, which by a natural emanation or resultance get the fore-start of freewill? To which I shall speak in these few considerations: 1. It is much to be desired with the prayers and suits of the children of God that where there are two opinions, there may be one heart, that the Father of Spirits would unite the hearts of all the children of one Father and the heirs of one house. 2. Papists here have exceeded in boundless domination and tyranny over the consciences of men: and what ever is contrary to the lawless decrees of their councils and popes is an unexpiable heresy and cannot be purged but by fire and fagot. 2. Whoever refuse subjection of conscience to that enemy of Christ, and to that woman-mistress of witchcrafts, on whose skirts is found the blood of the martyrs of Jesus, is presently an heretic, and his arguments answered with burning-quick [alive]: this tyranny over conscience we disclaim; yet for that, ought not the other extremity of wild toleration be embraced. 3. We cannot think but all saints in this side of glory carry to Heaven with them errors, mistakes and prophesying in part [1 Cor. 13], and the fairest stars and lights in this lower firmament of the Church are clouded, and the benefit of the moon serves to enlighten the under garden of lillies, where ‘Christ feedeth, till the day break, and the shadows flee away.’ And here brotherly indulgence and reciprocation of the debt of compassionate forbearance of the infirmities one of another must have place. 4. Yet so, as there can be no conflict of grace against grace, nor can the taking off the foxes which destroy the vines be contrary to the gentleness and meekness of the saints in fulfilling the law of love and bearing one another’s burdens, nor can love seated essentially in a new born child of the second birth be contrary to the zeal of God in withstanding to the face a Saint looking awry, and walking not with a straight foot according to the truth of the gospel; which way if heeded in sincerity, should breed more union of hearts, and be a greater testimony of faithfulness to a straying sheep than our cruel meekness and bloody gentleness in a pretended bearing with tender consciences under a color of paying the debt of bastard love, while as we suffer millions to perish, through silence and merciless condolency with them in their sinful depraving of the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (London, 1649) | ‘To the Godly &amp; Impartial Reader’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

skirts is found the blood of the martyrs of Jesus, is presently an heretic, and his arguments answered with burning-quick [alive]: this tyranny over conscience we disclaim; yet for that, ought not the other extremity of wild toleration be embraced. 3. We cannot think but all saints in this side of glory carry to Heaven with them errors, mistakes and prophesying in part [1 Cor. 13], and the fairest stars and lights in this lower firmament of the Church are clouded, and the benefit of the moon serves to enlighten the under garden of lillies, where ‘Christ feedeth, till the day break, and the shadows flee away.’ And here brotherly indulgence and reciprocation of the debt of compassionate forbearance of the infirmities one of another must have place. 4. Yet so, as there can be no conflict of grace against grace, nor can the taking off the foxes which destroy the vines be contrary to the gentleness and meekness of the saints in fulfilling the law of love and bearing one another’s burdens, nor can love seated essentially in a new born child of the second birth be contrary to the zeal of God in withstanding to the face a Saint looking awry, and walking not with a straight foot according to the truth of the gospel; which way if heeded in sincerity, should breed more union of hearts, and be a greater testimony of faithfulness to a straying sheep than our cruel meekness and bloody gentleness in a pretended bearing with tender consciences under a color of paying the debt of bastard love, while as we suffer millions to perish, through silence and merciless condolency with them in their sinful depraving of the truth.”

g+bottomed+on+fallible+opinions%2C+on+doubtful+disputations+of+skeptics%2C+may+be+the+reelings+of+windmills%2C+fair+fancies+and+dreams%3B+for+who+%28say+they%29+is+infallible%3F+and+who+hath+known+the+mind+of+the+Lord%3F+so+as+the+truth+must+be+monopolized+to+any+one+sect+or+way%3F+Who+in+faith+or+fullness+of+assurance+can+convince+or+rebuke+gainsayers%2C+heretics%2C+or+such+as+bring+another+doctrine%2C+as+those+whom+you+so+labor+to+convince+and+rebuke%3F+3.+Conscience+is+hereby+made+every+man%E2%80%99s+rule%2C+umpire%2C+judge%2C+Bible%2C+and+his+God%2C+which+if+he+follow%2C+he+is+but+at+the+worst%2C+a+godly%2C+pious%2C+holy+heretic%2C+who+fears+his+conscience+more+than+his+Creator%2C+and+is+to+be+judged+of+you+a+saint.+4.+Hence+conscience+being+deified%2C+all+rebuking%2C+exhorting%2C+counter-arguing%2C+yea+all+the+ministry+of+the+Gospel+must+be+laid+aside%3B+no+man+must+judge+%5Ba%5D+brother+%5Ban%5D+idolater%2C+or+brother+Familist%2C+or+saints+to+be+Socinians%2C+or+men+of+corrupt+minds%2C+perverse+disputers%2C+vain-janglers%2C+wresters%2C+rackers+or+torturers+of+Scripture%2C+whose+words+eat+as+a+canker%2C+who+subvert+whole+houses%2C+who+speak+the+visions+of+their+own+head+and+see+false+burdens%2C+for+all+these+who+were+of+old%2C+but+are+now+quite+gone+out+of+the+world%3B+for+who+can+make+a+window+in+any+man%E2%80%99s+soul+and+see+there+heart-obstinacy+which+only+does+essentially+constitute+the+heretic%2C+the+blasphemer%2C+the+false+prophet+%5Baccording+to+them%5D%3F+But+is+not+brotherly+forbearance%2C+Christian+indulgence+a+debt+we+owe+to+brethren%2C+saints%2C+and+the+truly+godly+in+errors%2C+and+mind+infirmities%2C+which+by+a+natural+emanation+or+resultance+get+the+fore-start+of+freewill%3F+To+which+I+shall+speak+in+these+few+considerations%3A+1.+It+is+much+to+be+desired+with+the+prayers+and+suits+of+the+children+of+God+that+where+there+are+two+opinions%2C+there+may+be+one+heart%2C+that+the+Father+of+Spirits+would+unite+the+hearts+of+all+the+children+of+one+Father+and+the+heirs+of+one+house.+2.+Papists+here+have+exceeded+in+boundless+domination+and+tyranny+over+the+consciences+of+men%3A+and+what+ever+is+contrary+to+the+lawless+decrees+of+their+councils+and+popes+is+an+unexpiable+heresy+and+cannot+be+purged+but+by+fire+and+fagot.+2.+Whoever+refuse+subjection+of+conscience+to+that+enemy+of+Christ%2C+and+to+that+woman-mistress+of+witchcrafts%2C+on+whose+skirts+is+found+the+blood+of+the+martyrs+of+Jesus%2C+is+presently+an+heretic%2C+and+his+arguments+answered+with+burning-quick+%5Balive%5D%3A+this+tyranny+over+conscience+we+disclaim%3B+yet+for+that%2C+ought+not+the+other+extremity+of+wild+toleration+be+embraced.+3.+We+cannot+think+but+all+saints+in+this+side+of+glory+carry+to+Heaven+with+them+errors%2C+mistakes+and+prophesying+in+part+%5B1+Cor.+13%5D%2C+and+the+fairest+stars+and+lights+in+this+lower+firmament+of+the+Church+are+clouded%2C+and+the+benefit+of+the+moon+serves+to+enlighten+the+under+garden+of+lillies%2C+where+%E2%80%98Christ+feedeth%2C+till+the+day+break%2C+and+the+shadows+flee+away.%E2%80%99+And+here+brotherly+indulgence+and+reciprocation+of+the+debt+of+compassionate+forbearance+of+the+infirmities+one+of+another+must+have+place.+4.+Yet+so%2C+as+there+can+be+no+conflict+of+grace+against+grace%2C+nor+can+the+taking+off+the+foxes+which+destroy+the+vines+be+contrary+to+the+gentleness+and+meekness+of+the+saints+in+fulfilling+the+law+of+love+and+bearing+one+another%E2%80%99s+burdens%2C+nor+can+love+seated+essentially+in+a+new+born+child+of+the+second+birth+be+contrary+to+the+zeal+of+God+in+withstanding+to+the+face+a+Saint+looking+awry%2C+and+walking+not+with+a+straight+foot+according+to+the+truth+of+the+gospel%3B+which+way+if+heeded+in+sincerity%2C+should+breed+more+union+of+hearts%2C+and+be+a+greater+testimony+of+faithfulness+to+a+straying+sheep+than+our+cruel+meekness+and+bloody+gentleness+in+a+pretended+bearing+with+tender+consciences+under+a+color+of+paying+the+debt+of+bastard+love%2C+while+as+we+suffer+millions+to+perish%2C+through+silence+and+merciless+condolency+with+them+in+their+sinful+depraving+of+the+truth.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience+%28London%2C+1649%29+%7C+%E2%80%98To+the+Godly+%26+Impartial+Reader%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa337650820.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a337650820.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=I%20offer%20%28Worthy%20Reader%29%20to%20your,their%20sinful%20depraving%20of%20the%20truth&amp;text=I%20offer%20%28Worthy%20Reader%29%20to%20your%20impartial%20and&amp;text=them%20in%20their%20sinful%20depraving%20of%20the%20truth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

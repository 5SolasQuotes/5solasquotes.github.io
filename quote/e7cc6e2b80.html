<main class="wrap"><figure class="quote" id="q-e7cc6e2b80" data-kw="">
<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. 1 | PRRD, vol. 3, p. 470</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cd60dd626" data-kw="">
<blockquote><p>Hence is that, Aquinas, Valentia, Durandus and Suarez† want the will of God divided thus: it is the will improperly and the division is by a homonym in homonyms, so that the will of sign is the will improperly. Thus Durand, on folio 13, ‘A command,’ he says, ‘is not directly and always a sign that the one commanding wants the thing commanded to be, but only that He wants to oblige the subject.’ † Aquinas, in pt. 2, q. 9, art. 11; Valentia, tome 1, disp. 1, q. 19, punc. 2; Durandus, bk. 1, dist. 48, q. 3; Suarez, tome 1, Of the Attributes of God, bk. 3, ch. 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apologetic Exercitations for Divine Grace, Exercitation 2</cite>, ch. 1, pp. 201-2</span></figcaption>

</figure><figure class="quote" id="q-03bc725315" data-kw="">
<blockquote><p>3. Above, indeed, we proved that there is not in God a conditioned will properly so called, although rewards and punishments are proposed to us conditionally: For these differ as much as heaven from earth. Eternal life is conditional, but the sacred oracles do not know of a will of God to give eternal life that is conditional. For there was in God a will by which these things were concatenated, the establishment of Saul’s kingdom and the obedience of Saul, just as the vision of miracles and the conversion of the Tyrians are concatenated, as I mentioned above. Would the establishment of the kingdom have followed the obedience of Saul in this sense, but God had both decreed and long before predicted through the patriarch Jacob, Gen. 49:10, that royal power would be with the tribe of Judah, and that Shiloh, that is, Christ, would arise from him? What? Would that promise have been false if Saul had obeyed? What kind of dreams are these? Corvinus will say (in the cited location), if God had established the kingdom for Saul on the condition that he obeyed, then He would have wished to establish it. ‘For if’ (he says) ‘God had done that, the condition being posited, He surely wished to do it before the condition was fulfilled, under that law, if it were fulfilled.’ A conditional will includes two things (Alvarez, disp. 22, ad fig. 8):

1. Formally and expressly, an affection of simple complacency.

2. Eminently and implicitly, [there is] an efficacious and absolute will, which indeed does not actually exist, but nevertheless would exist if the condition were fulfilled; but insofar as it is turned into an absolute [will] through the fulfillment of the condition, it is called conditional. Response:

1. There is no consequence [in the argument]. If God had established Saul’s kingdom on the hypothesis of obedience, Corvinus, according to his custom, fraudulently assumes this, but does not prove it. Would that he had brought forward an argument! For this alone follows: ‘Therefore He would have willed and decreed to establish it, if He had established it,’ which is most true and by us in no way denied. But because God sends a Savior if men are sinners, it in no way follows: ‘Therefore He decreed to send a Savior on the hypothesis that men are sinners.’ For God’s eternal decree in no way depends upon a temporal condition to be fulfilled by men, for otherwise it would not be eternal.

2. If God had established Saul’s kingdom, He would have decreed to establish it; if He had decreed to establish it, He would also have decreed to work obedience in Saul by efficacious grace, just as He provided this in David. Therefore, from the condition having been fulfilled, there would have followed the temporal and external act of God, but in no way from the same would there have followed the eternal and immanent act. What? Would it be in the power of the creature that there should be eternal acts and eternal volitions in God? Then it would be in the power of the creature that God’s will should exist, and consequently that God Himself should exist; for God’s volitions are the same as God Himself.

3. He says that the conditional will comprises an affection of simple complacency, that is, an absolute volition. Does God therefore absolutely love and will eternal life for Judas, and also conditionally will eternal life for Judas? But these are contradictory. For if God [wills] salvation of the Jew simply, then He would also effect that (Alvarez, disp. 22, ad fig. 8); and therefore he still begs the question.

4. He says that a conditional will eminently contains the absolute will of God, which is not in act, yet would be if the condition were fulfilled, but he foreknows from eternity that the condition will never be fulfilled. How, therefore, does a conditional will, either eminently or formally, contain such an efficacious will, which God both foreknows and decrees will never be? This is a dream.

5. Is not the condition to be fulfilled such a thing upon which the absolute will of God depends? The Arminians deny this, for they do not wish for the first cause to be suspended from the second.

6. “According as it is turned into the absolute,” he says, “it is called conditional.” But truly, change the word “turned” into the word “changed,” and then the eternal conditional will of God is changed into an absolute one. Is the will of God so mutable? But how is the natural desire of God turned into an absolute decree, and then the same will of God will be both natural and free, that is, free and not free? If God has now ceased to will the salvation of the believing elect by an antecedent will, and now absolutely wills them to be saved because they believe, then an end is given to the eternal desire of God. But truly, since He desires the salvation of the elect because He is good toward His creatures, if that desire has now vanished as having been changed into an absolute will, He ceases to be good toward believers.

7. This absolute will, once the condition has been fulfilled, either follows necessarily or contingently. If necessarily, then the efficacious decree of God concerning the salvation of believers is not free, but follows necessarily, by a necessity of nature, from the act of man; and yet Arminius himself concedes that election is a free decree. But if it follows contingently, or freely, from the decree, then God decreed to decree, He willed to will absolutely the salvation of believers. How absurd it is that He should first decree to decree, before He decrees! But this is to posit a progression to infinity. (Alvarez, disp. 22, ad fig. 8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apologetic Exercitations for Divine Grace, Exercitation 2</cite>, (Amsterdam: Laurentius, 1636), Exercise 2, ch. 4, ‘On the Antecedent &amp; Consequent Will of God’, pp. 323-63 tr. AI by The Faith Received Latin</span></figcaption>

then+He+would+also+effect+that+%28Alvarez%2C+disp.+22%2C+ad+fig.+8%29%3B+and+therefore+he+still+begs+the+question.+4.+He+says+that+a+conditional+will+eminently+contains+the+absolute+will+of+God%2C+which+is+not+in+act%2C+yet+would+be+if+the+condition+were+fulfilled%2C+but+he+foreknows+from+eternity+that+the+condition+will+never+be+fulfilled.+How%2C+therefore%2C+does+a+conditional+will%2C+either+eminently+or+formally%2C+contain+such+an+efficacious+will%2C+which+God+both+foreknows+and+decrees+will+never+be%3F+This+is+a+dream.+5.+Is+not+the+condition+to+be+fulfilled+such+a+thing+upon+which+the+absolute+will+of+God+depends%3F+The+Arminians+deny+this%2C+for+they+do+not+wish+for+the+first+cause+to+be+suspended+from+the+second.+6.+%E2%80%9CAccording+as+it+is+turned+into+the+absolute%2C%E2%80%9D+he+says%2C+%E2%80%9Cit+is+called+conditional.%E2%80%9D+But+truly%2C+change+the+word+%E2%80%9Cturned%E2%80%9D+into+the+word+%E2%80%9Cchanged%2C%E2%80%9D+and+then+the+eternal+conditional+will+of+God+is+changed+into+an+absolute+one.+Is+the+will+of+God+so+mutable%3F+But+how+is+the+natural+desire+of+God+turned+into+an+absolute+decree%2C+and+then+the+same+will+of+God+will+be+both+natural+and+free%2C+that+is%2C+free+and+not+free%3F+If+God+has+now+ceased+to+will+the+salvation+of+the+believing+elect+by+an+antecedent+will%2C+and+now+absolutely+wills+them+to+be+saved+because+they+believe%2C+then+an+end+is+given+to+the+eternal+desire+of+God.+But+truly%2C+since+He+desires+the+salvation+of+the+elect+because+He+is+good+toward+His+creatures%2C+if+that+desire+has+now+vanished+as+having+been+changed+into+an+absolute+will%2C+He+ceases+to+be+good+toward+believers.+7.+This+absolute+will%2C+once+the+condition+has+been+fulfilled%2C+either+follows+necessarily+or+contingently.+If+necessarily%2C+then+the+efficacious+decree+of+God+concerning+the+salvation+of+believers+is+not+free%2C+but+follows+necessarily%2C+by+a+necessity+of+nature%2C+from+the+act+of+man%3B+and+yet+Arminius+himself+concedes+that+election+is+a+free+decree.+But+if+it+follows+contingently%2C+or+freely%2C+from+the+decree%2C+then+God+decreed+to+decree%2C+He+willed+to+will+absolutely+the+salvation+of+believers.+How+absurd+it+is+that+He+should+first+decree+to+decree%2C+before+He+decrees%21+But+this+is+to+posit+a+progression+to+infinity.+%28Alvarez%2C+disp.+22%2C+ad+fig.+8%29%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Apologetic+Exercitations+for+Divine+Grace%2C+Exercitation+2%2C+%28Amsterdam%3A+Laurentius%2C+1636%29%2C+Exercise+2%2C+ch.+4%2C+%E2%80%98On+the+Antecedent+%26+Consequent+Will+of+God%E2%80%99%2C+pp.+323-63+tr.+AI+by+The+Faith+Received+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03bc725315.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03bc725315.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=3.%20Above%2C%20indeed%2C%20we%20proved%20that,Alvarez%2C%20disp.%2022%2C%20ad%20fig.%208&amp;text=3.%20Above%2C%20indeed%2C%20we%20proved%20that%20there%20is&amp;text=to%20infinity.%20%28Alvarez%2C%20disp.%2022%2C%20ad%20fig.%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The will of God,¹ as to all things, must always be fulfilled, – because as the Almighty can do everything possible, so, when the divine will is determined for positing something in being with final determination, it will be; but to will that with will of being well-pleased is to will it with the last determination that can be posited on the part of the omnipotent will willing the effect into being; therefore, in respect of whatever effect God is thus willing, it will be. ¹ The Vatican editors say this is against Scotus’ doctrine, and they refer to Rep. IA d. 46 nn. 17-18, 12-14, and to nn. 7-8 here below. …

7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation.

8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>

<blockquote><p>6. Next it must be noted how peremptorily he [a Romish adversary] charges me with ignorance for saying this antecedent will is not simply, properly and formally in God. But he should have considered that when I said so, I spoke in the words of Durand (Durand, bk. 1, dist. 46, quest. 1), one of his own side, whom I alleged in the margin: that, if it were false I said, yet the ignorance should not be fathered on me, but on them that begot it. For I said the truth, and himself is ignorant of the doctrine of his own Church. For Thomas handling this antecedent will, says (pt. 1, quest. 19, art. 6, to obj. 1), ‘We do not simply will what we will antecedently; and therefore this antecedent will may rather be called a velleity than an absolute will. (magis dici potest velleitas quam absoluta voluntas) A velleity, that is to say as Gregory of Valence expounds him (Commentary on Thomas, pt. 1, disp. 1, quest. 19, point 2), ‘a certain conditionated will; when that only can be said simply to be willed, that is willed consequently.’ Where we see that Thomas reduces this antecedent will to an imperfect kind of willing, which he calls a velleity, which is not a simple, proper or formal will: and the most Schoolmen follow him upon this ground, because there cannot be a formal will in God which is not fulfilled, as the salvation of all men is not. Hence it is says Suarez (Tract on Predestination, bk. 4, ch. 2, no. 2), that some have inferred that this of God whereby He would the salvation of all men, is no proper and formal act of willing in God: because He has no imperfect act of willing, as they call velleity, but only a signification of will (voluntatem signi), which only is metaphorical and interpretative, in that He carries Himself towards men, as if He had that act of willing. Thus think Cajetan and Marsilius. Others say, the formal and proper will of God reaches not to the salvation of all men, for that cause because it is not fulfilled, but only to the giving of sufficient means: which will, only to appoint sufficient means, is formal in God, and thereof God is said to will the salvation of all men: and of this mind are many Schoolmen. This will of God, says Vasquez (in pt. 1 of Thomas, disp. 83, no. 22), whereby He would the salvation of all men, even of the reprobate, very many Schoolmen, especially the newer, think to be only a conditionated will, which they call a velleity: whose act is not absolute and perfect, but under condition. Now the probabler opinion, says Dominicus Bannes (Commentary, pt. 1, quest. 19, art. 6, conclusion 2), is that there is formally no will in God which is signified by the name of velleity. Whence it follows that since by the doctrine of Thomas and many others, this antecedent will is but a velleity, it cannot be formally in God. But to take down this raw student yet a little more, Soto Major says (in tome above, p. 274): This word, God will the salvation of all men, by the good leave of so many ancient authors, we will not only expound of will properly so called, which is God’s good pleasure, but of his antecedent will; that is to say, an imaginary and metaphorical will: according to the which, it is no inconvenience to say, God will have all men to be saved: of which antecedent will, or will improperly so called, Damascene speaks (p. 279). And again: Damascene’s antecedent will is but a general, metaphorical and improper will, which they call a velleity. Here you see that Damascene and Thomas’s antecedent will is but a velleity, and this velleity is no will simply or formally in God; and therefore I spoke not ignorantly, but after the mind of the best Schoolmen that write when I said out of Durand that this antecedent will is not simply, properly and formally the will of God, but knew well enough what I said: and such as hold the contrary, that this antecedent will whereby God is said to will the salvation of all men, is simply, properly or formally the will of God, are driven to hold a paradox, that God’s absolute will, which is defined to be the will of his good pleasure, may be defeated and not accomplished (Opus est fateri non omnem voluntatem Beneplaciti semper impleri. Magal. in Tim., p. 252): which is a desperate shift and contrary to the doctrine of the best ancient divines in the Church of Rome (Thomas, pt. 1, quest. 19, art. 6; Master [of the Sentences, Lombard], bk. 1, dist. 46, where Scotus, Ockham, Dionysius Capreollus, dist. 45, quest. unic. art. 2, concl. 5; Cajetan on 1. Tim. 2:4; Dominic Banez, pt. 1, quest. 19, art. 6, concl. 2, in sum. text. Perer., Select Disputations on Jn. 1, no. 73); and directly against the Scripture, which says, ‘Our God has done whatsoever pleased Him in heaven and earth.’ (Ps. 135:6) ‘Who has resisted his will?’ (Rom. 9:19) ‘Who works all things according to the counsel of his own will.’ (Eph. 1:11)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“6. Next it must be noted how peremptorily he [a Romish adversary] charges me with ignorance for saying this antecedent will is not simply, properly and formally in God. But he should have considered that when I said so, I spoke in the words of Durand (Durand, bk. 1, dist. 46, quest. 1), one of his own side, whom I alleged in the margin: that, if it were false I said, yet the ignorance should not be fathered on me, but on them that begot it. For I said the truth, and himself is ignorant of the doctrine of his own Church. For Thomas handling this antecedent will, says (pt. 1, quest. 19, art. 6, to obj. 1), ‘We do not simply will what we will antecedently; and therefore this antecedent will may rather be called a velleity than an absolute will. (magis dici potest velleitas quam absoluta voluntas) A velleity, that is to say as Gregory of Valence expounds him (Commentary on Thomas, pt. 1, disp. 1, quest. 19, point 2), ‘a certain conditionated will; when that only can be said simply to be willed, that is willed consequently.’ Where we see that Thomas reduces this antecedent will to an imperfect kind of willing, which he calls a velleity, which is not a simple, proper or formal will: and the most Schoolmen follow him upon this ground, because there cannot be a formal will in God which is not fulfilled, as the salvation of all men is not. Hence it is says Suarez (Tract on Predestination, bk. 4, ch. 2, no. 2), that some have inferred that this of God whereby He would the salvation of all men, is no proper and formal act of willing in God: because He has no imperfect act of willing, as they call velleity, but only a signification of will (voluntatem signi), which only is metaphorical and interpretative, in that He carries Himself towards men, as if He had that act of willing. Thus think Cajetan and Marsilius. Others say, the formal and proper will of God reaches not to the salvation of all men, for that cause because it is not fulfilled, but only to the giving of sufficient means: which will, only to appoint sufficient means, is formal in God, and thereof God is said to will the salvation of all men: and of this mind are many Schoolmen. This will of God, says Vasquez (in pt. 1 of Thomas, disp. 83, no. 22), whereby He would the salvation of all men, even of the reprobate, very many Schoolmen, especially the newer, think to be only a conditionated will, which they call a velleity: whose act is not absolute and perfect, but under condition. Now the probabler opinion, says Dominicus Bannes (Commentary, pt. 1, quest. 19, art. 6, conclusion 2), is that there is formally no will in God which is signified by the name of velleity. Whence it follows that since by the doctrine of Thomas and many others, this antecedent will is but a velleity, it cannot be formally in God. But to take down this raw student yet a little more, Soto Major says (in tome above, p. 274): This word, God will the salvation of all men, by the good leave of so many ancient authors, we will not only expound of will properly so called, which is God’s good pleasure, but of his antecedent will; that is to say, an imaginary and metaphorical will: according to the which, it is no inconvenience to say, God will have all men to be saved: of which antecedent will, or will improperly so called, Damascene speaks (p. 279). And again: Damascene’s antecedent will is but a general, metaphorical and improper will, which they call a velleity. Here you see that Damascene and Thomas’s antecedent will is but a velleity, and this velleity is no will simply or formally in God; and therefore I spoke not ignorantly, but after the mind of the best Schoolmen that write when I said out of Durand that this antecedent will is not simply, properly and formally the will of God, but knew well enough what I said: and such as hold the contrary, that this antecedent will whereby God is said to will the salvation of all men, is simply, properly or formally the will of God, are driven to hold a paradox, that God’s absolute will, which is defined to be the will of his good pleasure, may be defeated and not accomplished (Opus est fateri non omnem voluntatem Beneplaciti semper impleri. Magal. in Tim., p. 252): which is a desperate shift and contrary to the doctrine of the best ancient divines in the Church of Rome (Thomas, pt. 1, quest. 19, art. 6; Master [of the Sentences, Lombard], bk. 1, dist. 46, where Scotus, Ockham, Dionysius Capreollus, dist. 45, quest. unic. art. 2, concl. 5; Cajetan on 1. Tim. 2:4; Dominic Banez, pt. 1, quest. 19, art. 6, concl. 2, in sum. text. Perer., Select Disputations on Jn. 1, no. 73); and directly against the Scripture, which says, ‘Our God has done whatsoever pleased Him in heaven and earth.’ (Ps. 135:6) ‘Who has resisted his will?’ (Rom. 9:19) ‘Who works all things according to the counsel of his own will.’ (Eph. 1:11)”

— John White, A Defence of the Way to the True Church… wherein the motives leading to papistry… are handled and fully disputed (London: Field, 1614), ch. 25, pp. 212-14 White (1570–1615) was an English clergyman, a royal chaplain and controversialist.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+Next+it+must+be+noted+how+peremptorily+he+%5Ba+Romish+adversary%5D+charges+me+with+ignorance+for+saying+this+antecedent+will+is+not+simply%2C+properly+and+formally+in+God.+But+he+should+have+considered+that+when+I+said+so%2C+I+spoke+in+the+words+of+Durand+%28Durand%2C+bk.+1%2C+dist.+46%2C+quest.+1%29%2C+one+of+his+own+side%2C+whom+I+alleged+in+the+margin%3A+that%2C+if+it+were+false+I+said%2C+yet+the+ignorance+should+not+be+fathered+on+me%2C+but+on+them+that+begot+it.+For+I+said+the+truth%2C+and+himself+is+ignorant+of+the+doctrine+of+his+own+Church.+For+Thomas+handling+this+antecedent+will%2C+says+%28pt.+1%2C+quest.+19%2C+art.+6%2C+to+obj.+1%29%2C+%E2%80%98We+do+not+simply+will+what+we+will+antecedently%3B+and+therefore+this+antecedent+will+may+rather+be+called+a+velleity+than+an+absolute+will.+%28magis+dici+potest+velleitas+quam+absoluta+voluntas%29+A+velleity%2C+that+is+to+say+as+Gregory+of+Valence+expounds+him+%28Commentary+on+Thomas%2C+pt.+1%2C+disp.+1%2C+quest.+19%2C+point+2%29%2C+%E2%80%98a+certain+conditionated+will%3B+when+that+only+can+be+said+simply+to+be+willed%2C+that+is+willed+consequently.%E2%80%99+Where+we+see+that+Thomas+reduces+this+antecedent+will+to+an+imperfect+kind+of+willing%2C+which+he+calls+a+velleity%2C+which+is+not+a+simple%2C+proper+or+formal+will%3A+and+the+most+Schoolmen+follow+him+upon+this+ground%2C+because+there+cannot+be+a+formal+will+in+God+which+is+not+fulfilled%2C+as+the+salvation+of+all+men+is+not.+Hence+it+is+says+Suarez+%28Tract+on+Predestination%2C+bk.+4%2C+ch.+2%2C+no.+2%29%2C+that+some+have+inferred+that+this+of+God+whereby+He+would+the+salvation+of+all+men%2C+is+no+proper+and+formal+act+of+willing+in+God%3A+because+He+has+no+imperfect+act+of+willing%2C+as+they+call+velleity%2C+but+only+a+signification+of+will+%28voluntatem+signi%29%2C+which+only+is+metaphorical+and+interpretative%2C+in+that+He+carries+Himself+towards+men%2C+as+if+He+had+that+act+of+willing.+Thus+think+Cajetan+and+Marsilius.+Others+say%2C+the+formal+and+proper+will+of+God+reaches+not+to+the+salvation+of+all+men%2C+for+that+cause+because+it+is+not+fulfilled%2C+but+only+to+the+giving+of+sufficient+means%3A+which+will%2C+only+to+appoint+sufficient+means%2C+is+formal+in+God%2C+and+thereof+God+is+said+to+will+the+salvation+of+all+men%3A+and+of+this+mind+are+many+Schoolmen.+This+will+of+God%2C+says+Vasquez+%28in+pt.+1+of+Thomas%2C+disp.+83%2C+no.+22%29%2C+whereby+He+would+the+salvation+of+all+men%2C+even+of+the+reprobate%2C+very+many+Schoolmen%2C+especially+the+newer%2C+think+to+be+only+a+conditionated+will%2C+which+they+call+a+velleity%3A+whose+act+is+not+absolute+and+perfect%2C+but+under+condition.+Now+the+probabler+opinion%2C+says+Dominicus+Bannes+%28Commentary%2C+pt.+1%2C+quest.+19%2C+art.+6%2C+conclusion+2%29%2C+is+that+there+is+formally+no+will+in+God+which+is+signified+by+the+name+of+velleity.+Whence+it+follows+that+since+by+the+doctrine+of+Thomas+and+many+others%2C+this+antecedent+will+is+but+a+velleity%2C+it+cannot+be+formally+in+God.+But+to+take+down+this+raw+student+yet+a+little+more%2C+Soto+Major+says+%28in+tome+above%2C+p.+274%29%3A+This+word%2C+God+will+the+salvation+of+all+men%2C+by+the+good+leave+of+so+many+ancient+authors%2C+we+will+not+only+expound+of+will+properly+so+called%2C+which+is+God%E2%80%99s+good+pleasure%2C+but+of+his+antecedent+will%3B+that+is+to+say%2C+an+imaginary+and+metaphorical+will%3A+according+to+the+which%2C+it+is+no+inconvenience+to+say%2C+God+will+have+all+men+to+be+saved%3A+of+which+antecedent+will%2C+or+will+improperly+so+called%2C+Damascene+speaks+%28p.+279%29.+And+again%3A+Damascene%E2%80%99s+antecedent+will+is+but+a+general%2C+metaphorical+and+improper+will%2C+which+they+call+a+velleity.+Here+you+see+that+Damascene+and+Thomas%E2%80%99s+antecedent+will+is+but+a+velleity%2C+and+this+velleity+is+no+will+simply+or+formally+in+God%3B+and+therefore+I+spoke+not+ignorantly%2C+but+after+the+mind+of+the+best+Schoolmen+that+write+when+I+said+out+of+Durand+that+this+antecedent+will+is+not+simply%2C+properly+and+formally+the+will+of+God%2C+but+knew+well+enough+what+I+said%3A+and+such+as+hold+the+contrary%2C+that+this+antecedent+will+whereby+God+is+said+to+will+the+salvation+of+all+men%2C+is+simply%2C+properly+or+formally+the+will+of+God%2C+are+driven+to+hold+a+paradox%2C+that+God%E2%80%99s+absolute+will%2C+which+is+defined+to+be+the+will+of+his+good+pleasure%2C+may+be+defeated+and+not+accomplished+%28Opus+est+fateri+non+omnem+voluntatem+Beneplaciti+semper+impleri.+Magal.+in+Tim.%2C+p.+252%29%3A+which+is+a+desperate+shift+and+contrary+to+the+doctrine+of+the+best+ancient+divines+in+the+Church+of+Rome+%28Thomas%2C+pt.+1%2C+quest.+19%2C+art.+6%3B+Master+%5Bof+the+Sentences%2C+Lombard%5D%2C+bk.+1%2C+dist.+46%2C+where+Scotus%2C+Ockham%2C+Dionysius+Capreollus%2C+dist.+45%2C+quest.+unic.+art.+2%2C+concl.+5%3B+Cajetan+on+1.+Tim.+2%3A4%3B+Dominic+Banez%2C+pt.+1%2C+quest.+19%2C+art.+6%2C+concl.+2%2C+in+sum.+text.+Perer.%2C+Select+Disputations+on+Jn.+1%2C+no.+73%29%3B+and+directly+against+the+Scripture%2C+which+says%2C+%E2%80%98Our+God+has+done+whatsoever+pleased+Him+in+heaven+and+earth.%E2%80%99+%28Ps.+135%3A6%29+%E2%80%98Who+has+resisted+his+will%3F%E2%80%99+%28Rom.+9%3A19%29+%E2%80%98Who+works+all+things+according+to+the+counsel+of+his+own+will.%E2%80%99+%28Eph.+1%3A11%29%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Defence+of+the+Way+to+the+True+Church%E2%80%A6+wherein+the+motives+leading+to+papistry%E2%80%A6+are+handled+and+fully+disputed+%28London%3A+Field%2C+1614%29%2C+ch.+25%2C+pp.+212-14+White+%281570%E2%80%931615%29+was+an+English+clergyman%2C+a+royal+chaplain+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc

<blockquote><p>For the three early centuries the Church was entirely without it. The members of the Church made a profession of their faith at baptism. But this was in the simplest form; it was not a precautionary assent to a variety of intellectual propositions, but a profession of service under a new Master, and of entrance into a new life. No deacon, no presbyter, no bishop, made any subsequent profession. The distinction between the requirements of belief from clergy and from laity was as yet wholly unknown. The first subscription to a series of dogmatical propositions as such, was that enforced by Constantine at the Council of Nicea. It was the natural but rude expedient of a half-educated soldier to enforce unanimity in the Church, as he had by the sword enforced it in the empire. It was accompanied then by the same casuistry, by the same ambiguity, by the same inoperative results as at present [in the Church of England]. At each [subsequent] council the same process was repeated by the bishops who were present. But the practice, as far as appears, never extended to the clergy generally or to the laity; and, as it was then in the Ancient Church, so on the whole has it been in those portions of Christendom which have clung most tenaciously to Catholic usages, and been most steadfast in the defence of Orthodoxy. The Roman Catholic clergy and the clergy of the Eastern Church neither formerly nor now are bound by any definite forms of subscription. The unity of the State is preserved everywhere, not by preliminary promises or oaths, but by the general laws of discipline and order, and by the general public sentiment of the whole community.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription in the Church of England and in the University of Oxford</cite>, (Oxford: Henry &amp; Parker, 1863), pp. 35-36</span></figcaption>

<blockquote><p>6. I have perused over all the Articles or Decrees of the Synod of Dort, and unfeignedly honor them, as containing sound and moderate doctrine, and heartily lament that some late divines have to the great detriment of the Church and truth, forsaken the moderate way of that Synod, and laid the weight of the Anti-Arminian cause so much upon higher points not owned by them. And there is nothing that I have observed in it all that my judgment does contradict, if I be allowed these few expositions following: Where it is said, article 1, sect. 12, De hac aeterna electione, electi suo tempore variis licet gradibus, et dispari mensura, certiores redduntur, non arcana, etc. [“The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, etc.”], I understand it as showing only what way the elect do attain assurance, who more or less do attain it, and not as affirming that all the elect do more or less attain a certainty of their election. For as I think that doctrine uncomfortable to many poor Christians, so I think it cannot he proved of all the elect. 2. In the 3rd Article, sect. 12, it’s plain by the annexed words that persuasionem moralem [“by moral suasion”] they mean external suasion, and do not determine whether the name of suasion be agreeable or not to the internal work of the Spirit, which for my part I am certain is beyond my reach to know and, I am confident, [is] beyond the reach of all men on earth, even those that most pretend to know it. But that this grace of the Spirit is necessary to sanctify both the understanding and will, and that it is an act of omnipotency, and infallibly effectual (commonly called ‘irresistible’) on all the elect, I am ready against all Pelagians to defend. 3. Where it is said, sect. 15, that, Qui illam non accipit, is aut haec spiritualia omnino non curat, et in suo sibi placet: aut securus se habere inaniter gloriatur, quod non habet [‘Whoever is not made partaker thereof, is either altogether regardless of these spiritual gifts and satisfied with his own condition, or is in no apprehension of danger and vainly boasts the possession of that which he has not’]: I understand it as spoken of the ordinary sort of graceless unregenerate men, and not of all; for I doubt not but it’s possible for a wicked man to know that he is wicked, and be afraid of Hell, yea, and to despair. I am loth to think desparation is a mark of grace, and that none are graceless but the secure and confident. 4. In the 5th Article, sections 9-10, where it is said that believers may be, and are certain of their perseverance, according to the measure of their faith, I understand that word, ‘are certain pro mensura fidei’: 1. As supposing the certainty of their sincerity; for a man must be certain that he has grace, before he can be certain to persevere in it. 2. As supposing a certain understanding of the truth of the doctrine that all true believers shall infallibly persevere: for none can be certain to persevere merely as a believer, that is not first certain that all believers shall persevere. 3. I suppose therefore that this is not spoken of all believers, but of some, for: 1. All are not certain that they are sincere. 2. All are not certain that the doctrine of infallible perseverance is true; for to conclude that all the Lutheran Churches that deny this, and all the Arminians and Anabaptists that deny it, and all the ancient fathers and Churches that denied it, besides Musculus and others of our own, were certainly graceless and unbelievers, were not only inconsistent with the faith and charity, but with the reason of a Christian; and [this is] no less than an inhumane charge. 5. Where it is said, sect. 11, that God per Spiritum Sanctum perseverantiae certudinem in iisdem rursus excitat [‘by the Holy Spirit again inspires them with the comfortable assurance of persevering’], I understand it as true of some, but not of all; for I dare not pronounce damnation on all that die unassured of their sincerity, much less on all that are unassured of perseverance. 6. To the 13th section, I doubt not but the meaning is that certainty of perseverance does not of itself, and of its own nature beget carelessness or negligence; and so I believe it’s true. Nay, I think that love and gratitude are ordained to be the master ruling graces in the Kingdom of Christ (under faith); and that fear is but to supply the defects of our yet-imperfect love. And therefore the more any man loves, the more he will obey: and the more he is assured of God’s love, the greater advantage he has to love Him again. But yet I doubt not, but the remnants of our corruption, by the strength of temptation, may make assurance an occasion, or accidental cause of negligence and actual sin: which I suppose this section does not deny. These are all the limiting expositions which I desire liberty to make use of, and with which I do, as is aforesaid, profess my consent to the Canons or Decrees of the Synod of Dort. And how far any of these are from favoring Arminianism, they that will see, need not to be ignorant. Yea, in the very article of perseverance, which some were pleased to quarrel with me about, I subscribe to the Synod: Yea, in the article of the extent of redemption, wherein I am most suspected and accused (and was fain to use a limiting exposition in my consent to our Assembly’s Confession of Faith) I do subscribe to the Synod of Dort, without any exception, limitation or exposition of any word as doubtful and obscure. I do also freely consent to the rejections, with the liberty of three or four the like explications, which I will not mention, lest I seem quarelsome, or be further tedious, because they are about smaller matters than those I have mentioned, and no way touching the quick of the controverted articles, and I am persuaded that my sense of them is the same with the Synod’s. And because it is, this Synod [was] purposely called against Arminianism, that is the best discovery what is to be accounted Arminian or Anti-Arminian doctrine, as I think, by consenting to it: I do clear myself from that calumny with all men of conscience and reason that know it, so I shall think that those who go as much on the other hand, and differ from the Synod one way, as much as the Arminians did the other way, remain censurable as well as they, till somebody shall convince me that there is but one extreme, in this case, and that a man may hold what he will without danger, so he be but sure it go far enough from Arminianism. A man that holds to the moderation of the Synod of Dort, need not say that Christ did not die or satisfy for all men, nor need he trouble himself with presumptuous determinations about many mysteries in the decrees of God, which many volumes are guilty of; Nor does he need to aver the necessity of immediate, physical, efficient predetermination by God (as the First Cause) of every second cause natural and free, as without which they cannot act: Nor need he say, that God so predetermines to the act which is sin, and not to the sinfulness of the act: Nor need he subscribe to all that Dr. [William] Twisse or Mr. [Samuel] Rutherford, or such like, have written on these points. Nay, as this Synod, so our own [Westminster] Assembly gave an example of modesty in these points, to them that will follow it, not only silencing many things which others make the pillars of Anti-Arminianism, but expressing that the will is endued by God with that natural liberty, that is neither forced, nor by any absolute necessity of nature determined to do good or evil, and therefore they never tell you that God as the First Cause must of natural necessity determine man’s will by physical, immediate premotion, before it can act either good or evil: But they reserve the honor of determining man’s will to special grace, renewing the will, and by almighty power determining it to that which is good, ch. 10, sect. 1 and ch. 9, sect. 1.</p></blockquote>

tency%2C+and+infallibly+effectual+%28commonly+called+%E2%80%98irresistible%E2%80%99%29+on+all+the+elect%2C+I+am+ready+against+all+Pelagians+to+defend.+3.+Where+it+is+said%2C+sect.+15%2C+that%2C+Qui+illam+non+accipit%2C+is+aut+haec+spiritualia+omnino+non+curat%2C+et+in+suo+sibi+placet%3A+aut+securus+se+habere+inaniter+gloriatur%2C+quod+non+habet+%5B%E2%80%98Whoever+is+not+made+partaker+thereof%2C+is+either+altogether+regardless+of+these+spiritual+gifts+and+satisfied+with+his+own+condition%2C+or+is+in+no+apprehension+of+danger+and+vainly+boasts+the+possession+of+that+which+he+has+not%E2%80%99%5D%3A+I+understand+it+as+spoken+of+the+ordinary+sort+of+graceless+unregenerate+men%2C+and+not+of+all%3B+for+I+doubt+not+but+it%E2%80%99s+possible+for+a+wicked+man+to+know+that+he+is+wicked%2C+and+be+afraid+of+Hell%2C+yea%2C+and+to+despair.+I+am+loth+to+think+desparation+is+a+mark+of+grace%2C+and+that+none+are+graceless+but+the+secure+and+confident.+4.+In+the+5th+Article%2C+sections+9-10%2C+where+it+is+said+that+believers+may+be%2C+and+are+certain+of+their+perseverance%2C+according+to+the+measure+of+their+faith%2C+I+understand+that+word%2C+%E2%80%98are+certain+pro+mensura+fidei%E2%80%99%3A+1.+As+supposing+the+certainty+of+their+sincerity%3B+for+a+man+must+be+certain+that+he+has+grace%2C+before+he+can+be+certain+to+persevere+in+it.+2.+As+supposing+a+certain+understanding+of+the+truth+of+the+doctrine+that+all+true+believers+shall+infallibly+persevere%3A+for+none+can+be+certain+to+persevere+merely+as+a+believer%2C+that+is+not+first+certain+that+all+believers+shall+persevere.+3.+I+suppose+therefore+that+this+is+not+spoken+of+all+believers%2C+but+of+some%2C+for%3A+1.+All+are+not+certain+that+they+are+sincere.+2.+All+are+not+certain+that+the+doctrine+of+infallible+perseverance+is+true%3B+for+to+conclude+that+all+the+Lutheran+Churches+that+deny+this%2C+and+all+the+Arminians+and+Anabaptists+that+deny+it%2C+and+all+the+ancient+fathers+and+Churches+that+denied+it%2C+besides+Musculus+and+others+of+our+own%2C+were+certainly+graceless+and+unbelievers%2C+were+not+only+inconsistent+with+the+faith+and+charity%2C+but+with+the+reason+of+a+Christian%3B+and+%5Bthis+is%5D+no+less+than+an+inhumane+charge.+5.+Where+it+is+said%2C+sect.+11%2C+that+God+per+Spiritum+Sanctum+perseverantiae+certudinem+in+iisdem+rursus+excitat+%5B%E2%80%98by+the+Holy+Spirit+again+inspires+them+with+the+comfortable+assurance+of+persevering%E2%80%99%5D%2C+I+understand+it+as+true+of+some%2C+but+not+of+all%3B+for+I+dare+not+pronounce+damnation+on+all+that+die+unassured+of+their+sincerity%2C+much+less+on+all+that+are+unassured+of+perseverance.+6.+To+the+13th+section%2C+I+doubt+not+but+the+meaning+is+that+certainty+of+perseverance+does+not+of+itself%2C+and+of+its+own+nature+beget+carelessness+or+negligence%3B+and+so+I+believe+it%E2%80%99s+true.+Nay%2C+I+think+that+love+and+gratitude+are+ordained+to+be+the+master+ruling+graces+in+the+Kingdom+of+Christ+%28under+faith%29%3B+and+that+fear+is+but+to+supply+the+defects+of+our+yet-imperfect+love.+And+therefore+the+more+any+man+loves%2C+the+more+he+will+obey%3A+and+the+more+he+is+assured+of+God%E2%80%99s+love%2C+the+greater+advantage+he+has+to+love+Him+again.+But+yet+I+doubt+not%2C+but+the+remnants+of+our+corruption%2C+by+the+strength+of+temptation%2C+may+make+assurance+an+occasion%2C+or+accidental+cause+of+negligence+and+actual+sin%3A+which+I+suppose+this+section+does+not+deny.+These+are+all+the+limiting+expositions+which+I+desire+liberty+to+make+use+of%2C+and+with+which+I+do%2C+as+is+aforesaid%2C+profess+my+consent+to+the+Canons+or+Decrees+of+the+Synod+of+Dort.+And+how+far+any+of+these+are+from+favoring+Arminianism%2C+they+that+will+see%2C+need+not+to+be+ignorant.+Yea%2C+in+the+very+article+of+perseverance%2C+which+some+were+pleased+to+quarrel+with+me+about%2C+I+subscribe+to+the+Synod%3A+Yea%2C+in+the+article+of+the+extent+of+redemption%2C+wherein+I+am+most+suspected+and+accused+%28and+was+fain+to+use+a+limiting+exposition+in+my+consent+to+our+Assembly%E2%80%99s+Confession+of+Faith%29+I+do+subscribe+to+the+Synod+of+Dort%2C+without+any+exception%2C+limitation+or+exposition+of+any+word+as+doubtful+and+obscure.+I+do+also+freely+consent+to+the+rejections%2C+with+the+liberty+of+three+or+four+the+like+explications%2C+which+I+will+not+mention%2C+lest+I+seem+quarelsome%2C+or+be+further+tedious%2C+because+they+are+about+smaller+matters+than+those+I+have+mentioned%2C+and+no+way+touching+the+quick+of+the+controverted+articles%2C+and+I+am+persuaded+that+my+sense+of+them+is+the+same+with+the+Synod%E2%80%99s.+And+because+it+is%2C+this+Synod+%5Bwas%5D+purposely+called+against+Arminianism%2C+that+is+the+best+discovery+what+is+to+be+accounted+Arminian+or+Anti-Arminian+doctrine%2C+as+I+think%2C+by+consenting+to+it%3A+I+do+clear+myself+from+that+calumny+with+all+men+of+conscience+and+reason+that+know+it%2C+so+I+shall+think+that+those+who+go+as+much+on+the+other+hand%2C+and+differ+from+the+Synod+one+way%2C+as+much+as+the+Arminians+did+the+other+way%2C+remain+censurable+as+well+as+they%2C+till+somebody+shall+convince+me+that+there+is+but+one+extreme%2C+in+this+case%2C+and+that+a+man+may+hold+what+he+will+without+danger%2C+so+he+be+but+sure+it+go+far+enough+from+Arminianism.+A+man+that+holds+to+the+moderation+of+the+Synod+of+Dort%2C+need+not+say+that+Christ+did+not+die+or+satisfy+for+all+men%2C+nor+need+he+trouble+himself+with+presumptuous+determinations+about+many+mysteries+in+the+decrees+of+God%2C+which+many+volumes+are+guilty+of%3B+Nor+does+he+need+to+aver+the+necessity+of+immediate%2C+physical%2C+efficient+predetermination+by+God+%28as+the+First+Cause%29+of+every+second+cause+natural+and+free%2C+as+without+which+they+cannot+act%3A+Nor+need+he+say%2C+that+God+so+predetermines+to+the+act+which+is+sin%2C+and+not+to+the+sinfulness+of+the+act%3A+Nor+need+he+subscribe+to+all+that+Dr.+%5BWilliam%5D+Twisse+or+Mr.+%5BSamuel%5D+Rutherford%2C+or+such+like%2C+have+written+on+these+points.+Nay%2C+as+this+Synod%2C+so+our+own+%5BWestminster%5D+Assembly+gave+an+example+of+modesty+in+these+points%2C+to+them+that+will+follow+it%2C+not+only+silencing+many+things+which+others+make+the+pillars+of+Anti-Arminianism%2C+but+expressing+that+the+will+is+endued+by+God+with+that+natural+liberty%2C+that+is+neither+forced%2C+nor+by+any+absolute+necessity+of+nature+determined+to+do+good+or+evil%2C+and+therefore+they+never+tell+you+that+God+as+the+First+Cause+must+of+natural+necessity+determine+man%E2%80%99s+will+by+physical%2C+immediate+premotion%2C+before+it+can+act+either+good+or+evil%3A+But+they+reserve+the+honor+of+determining+man%E2%80%99s+will+to+special+grace%2C+renewing+the+will%2C+and+by+almighty+power+determining+it+to+that+which+is+good%2C+ch.+10%2C+sect.+1+and+ch.+9%2C+sect.+1.%E2%80%9D%0A%0A%E2%80%94+Netherlands%2C+Baxter+on+the+Canons+of+Dort+%7C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+R.W.%2C+1655%29%2C+ch.+2%2C+sect.+6%2C+pp.+23-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c6a49f814.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c6a49f814.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=6.%20I%20have%20perused%20over%20all,1%20and%20ch.%209%2C%20sect.%201&amp;text=6.%20I%20have%20perused%20over%20all%20the%20Articles&amp;text=10%2C%20sect.%201%20and%20ch.%209%2C%20sect.%201" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Zeeland form for ministers reads: ‘We the undersigned ministers of the Word declare by this subscription, that we heartily believe and are persuaded that all the articles and points of doctrine contained and explained in this Confession and Catechism, from greatest to least, do fully conform (in alles conform syn) to the Word of God, and we also hereby solemnly promise, as the occasion requires, to teach and advocate all these points of doctrine publicly and privately. And if at any time we should have any sentiment or objection against any article or point of doctrine, contained in the aforesaid Confession and Catechism, we promise that we will neither publicly nor privately present the same except properly in classical or synodical assemblies, under the penalty of being censured as schismatics. And if at any time the classis or synod may deem it proper, to maintain unity in doctrine, to require of us our further sentiments and explanation of any article of the aforesaid Confession or Catechism, we also hereby promise to be always ready and willing to do so, without refusal, under the penalty above mentioned.&#x27;</p></blockquote>

<blockquote><p>Doctrine. For we do take the same to be the pure doctrine of the Church, which comes from Christ, conveyed unto us by the apostles, which appointed us nothing of their own choice, but did faithfully prefer unto all nations the discipline which they received of Christ: in which is not heard the voice of any man, but of the only begotten of God, the true and only shepherd and teacher… The pure preaching of Christ’s Gospel does aright bear the first sign and token of the true Church… and so where the Gospel of Christ our Savior is taught, there is declared to be the Christian Church.</p></blockquote>

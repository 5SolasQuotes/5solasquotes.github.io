<blockquote><p>Writing on behalf of American Synod to the moderator of the remnant of Old Light Reformed Presbyterians in Scotland, Samuel O. Wylie argued that those in the Scottish Synod who had voted for the removal of ecclesiastical censure from those who voted in British elections had defecting from the covenanting position and were guilty of schism:

[…] It is well known to us that for several years past, you have been enduring a great fight of affliction. The conflicts in opinion and judgment that have marked the meetings of your supreme Judicatory, for some time past, have not been unnoticed by us, not have we failed to observe in the published speeches and arguments of many of your ministers and members evidence of a radical and growing dereliction from a Covenanted faith and practice. We have watched with absorbed and painful interest the progress of events among you, and from the first dreaded the result.

The deliverance of your late Synod touching the Overture, and the political relations of its members and the people under its jurisdiction, though anticipated by us, has filled our hearts with unaffected sorrow. We mourn for the division in our Covenanted Zion, and we mourn, most of all, for the falling away of the Covenanted witnesses, and the dishonour done thereby to truth, and to the memory of a faithful and venerated ancestry. The defection scarcely perceptible in its incipient stages, in the progress of a natural development open and manifest of late to all, has culminated in actual schism, and in avowed departure from the distinctive article and feature in the faith and practice of the Reformed Presbyterian Church. Another dark page in Scotland’s history has been written.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-o-wylie.html">S. O. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Anderson, 3 June 1863 in Covenanter, vii, no. 9 (Sep. 1863), pp 232-3.</cite></span></figcaption>

<blockquote><p>Question. And if it be questioned how can any truth be kept [back], or any duty forborne? Should not all sin be reproved and can we be truthful to God and the people and not reprove sin or in forbearing any necessary duty, suppose it be to censure and maintaining authority of adjudications? Answer. The question is not wither duty should be forborne or if all sin should be reproved, but of the right means how to get such a sin taken with and how to get such duty done rightly. [2.] The speaking of all truth and doing of all duty is not a duty simply lying on ministers at all times, for that which may not edify is not a duty. Besides that, all ministers know not all truth; therefore speaking of truth and doing of duty must be so gone about as they preach such and such a particular truth, to convince of this or that sin, or bring to the doing of such a duty, principally to edify the body of Christ, [and for] the saving of people’s souls. And if the forbearing of such a truth or the not pressing such a duty for a time gain the soul sooner, is he not bound to make his practice subservient to that end? To clear it in a similitude: a man gets a commission to take in a strong city, but he is not obliged to take it in at such a strong port that is strongly fortified and at no other, but he is left to skill how to go about it or where to assault it. Will not wisdom say it were better to go to a part that is weaker or a part where either is more easy access and entry to be had, his commission being principally to take in the town and not that port now? A minister’s work is to cast out Satan, and all lusts out of the soul, and to bring every thought in subjection to Christ, and whither is it wisdom to batter at one door of the soul that is strongly fortified against such a truth, or to look to win in by another that is less controverted, wisdom would say it is best to labor to win in on the soul by a truth that is less controverted and then it is far more easy to win that sort the sinner, keeps and gains the city. This was the way Paul took, and directs ministers to use this holy wisdom and prudence, not stinting them to one gate [way] of pressing to duty or proponing [setting forth] truths, or convincing of sin, but leaving room to them to follow that way which may most edify, and to choose matter and method of proceeding as may be most subservient to that end. For when folks are confirmed in a thing and have a prejudice at that [which] may be spoken against it, it is a double work to a minister to set on a sin that is both in the affection and judgment. It is far better going in at another port than were the prejudice is fixed. Hence Paul leaves controverted questions of the law and is less preaching down those, but is more in positive truths and sins unquestioned, [and on] principles acknowledged by those he dealt with, and with idolaters and superstitious Samaritans beginning with preaching Christ, and not first falling on their idols, which might mar the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Sermons of James Durham</cite>, pp. 921-2 of 7. ‘A Sermon on Ephesians 4:11-12’ in Collected Sermons of James Durham…, vol. 1 (Naphtali &amp; RHB, 2017)</span></figcaption>

<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as:

1. Unwritten traditions—not necessary, not written.

2. Human mystical, symbolical signs and ceremonies—not necessary, not written.

3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written.

4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>

<blockquote><p>This distinct form of episcopacy appeared to correspond roughly with the superintendents of the post-reformation kirk, who Baillie argued, were temporary and subject to the jurisdiction of presbyteries. This form of episcopacy, for instance, was distinct from the ‘reduced’ episcopacy of James Ussher, which Baillie denounced because it would have established a permanent episcopate… The only ecclesiological tenet that Baillie deemed to be ‘immutable’ was the division of church officers into ministers, elders and deacons. Baillie thus could argue that particulars of an ecclesiological settlement beyond this framework were not explicitly against Goďs word, albeit, as mentioned above, experience may deem particular arrangements inexpedient. Christians could err in ‘the particulars about the nature of Episcopacie, of Presbyteries, Synods, Sessions, ruling Elders,’ as such elements of ecclesiology were unclear in scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“This distinct form of episcopacy appeared to correspond roughly with the superintendents of the post-reformation kirk, who Baillie argued, were temporary and subject to the jurisdiction of presbyteries. This form of episcopacy, for instance, was distinct from the ‘reduced’ episcopacy of James Ussher, which Baillie denounced because it would have established a permanent episcopate… The only ecclesiological tenet that Baillie deemed to be ‘immutable’ was the division of church officers into ministers, elders and deacons. Baillie thus could argue that particulars of an ecclesiological settlement beyond this framework were not explicitly against Goďs word, albeit, as mentioned above, experience may deem particular arrangements inexpedient. Christians could err in ‘the particulars about the nature of Episcopacie, of Presbyteries, Synods, Sessions, ruling Elders,’ as such elements of ecclesiology were unclear in scripture.”

<blockquote><p>The presbyter is the same as the bishop, and before parties had been raised up in religion by the provocations of Satan, the churches were governed by the Senate of the presbyters. But as each one sought to appropriate to himself those whom he had baptized, instead of leading them to Christ, it was appointed that one of the presbyters, elected by his colleagues, should be set over all the others, and have chief supervision over the general well-being of the community. . . Without doubt it is the duty of the presbyters to bear in mind that by the discipline of the Church they are subordinated to him who has been given them as their head, but it is fitting that the bishops, on their side, do not forget that if they are set over the presbyters, it is the result of tradition, and not by the fact of a particular institution by the Lord.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-82485833f0" data-kw="">
<blockquote><p>We do not deny (as the Papists falsely slander us) all inherent righteousness, 2 Cor. 5:17, nor all justification before God by inherent righteousness, 1 Kn. 8:32 [“Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.”]. But this we teach, that this inherent righteousness is not that righteousness whereby any poor sinner in this life can be justified before God’s Tribunal, for which he is pronounced to be innocent, absolved from death and condemnation, and adjudged unto eternal life. … Whether inherent justice be actual or habitual? Bishop Davenant, ch. 3, Of Habitual Righteousness, says a certain habitual or inherent justice is infused into all that are justified, Jn. 1:13; 2 Cor. 5:17; Gal. 6:15; 1 Cor. 6:11, 19; 2 Pet. 1:4. All those that are justified do supernatural works; Therefore, it is certain that they are endued with supernatural grace and holiness. We are said to be righteous, from this inherent justice we are said to be just, and that by God Himself, Gen. 6:9; Heb. 11:4; Lk. 1:61 &amp; 2:25; 1 Pet. 4:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, A.M., 1654), bk. 7, ch. 6, Of Justification, pp. 517-18 Leigh, though he says what he says below, nor Davenant, who is referenced, evidences a twofold justification as such.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cc0c0b6f2" data-kw="">
<blockquote><p>For as no man receives that general justification which discharges from the guilt of all foregoing sins, but on the concurrence of repentance, faith, a purpose of a new life, and other actions of the same kind; so no man retains a state free from guilt in respect of following sins, but by means of the same actions of believing in God, calling on God, mortifying the flesh, daily repenting and sorrowing for sins daily committed. The reason why all these are required on our part is this: Because these cannot be still absent, but their opposites will be present, which are contrary to the nature of a justified man—As therefore to the conservation of natural life it is necessarily required that a man carefully avoid fire, water, precipices, poisons and other things destructive to the health of the body; so to the conserving of spiritual life, it is necessarily required that a man avoid incredulity, impenitency and other things that are destructive and contrary to the salvation of souls; which cannot be avoided unless the opposite and contrary actions be exercised. And these actions do not conserve the life of grace properly and of themselves by touching the very effect of conservation, but improperly and by accident, by excluding and removing the cause of destruction.</p></blockquote>

</figure><figure class="quote" id="q-cb9a80134c" data-kw="">
<blockquote><p>3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bedford.html">Thomas Bedford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of the Chief Points of Antinomianism… (London: Field, 1647), ch. 3, ‘A Brief Answer to the Arguments of H. D. by him brought to prove Justification before Faith, i.e. before the act of Believing’, pp. 32-33 Bedford and Ambrose were sharing some notes one way or the other.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-ae8014cdae" data-kw="">
<blockquote><p>2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. … I. The nature of this freedom from sin. I told you before, it is an exemption from the dominion and reign of sin. 1. We quit the evil disposition and temper of our souls… 2. We renounce our former course of living, after the habits we are free from the acts, we do not, and durst not to live in sin, the former conversation [conduct] is cast off as well as the former lusts… Now this freedom is expressed by a word that signifies justification, and fitly: 1. Because of the nature of justification, in which there are two branches; liberatio a poena [liberation from punishment], and acceptatio ad vitam [acceptance to life]. The punishment incurred by the Fall is poena damni and poena sensus, the loss and the pain: Both may be considered as in this life, or the life to come… But in this life we must also consider the loss and pain. The pains are all those miseries and afflictive evils, which came into the world by reason of sin. The loss is loss of God’s image: that threatening, ‘Thou shalt die the death,’ Gen. 2:17, implied spiritual death as well as temporal and eternal. Now we are justified when we are freed from punishment, and among other punishments from the punishment of loss, when God giveth us the blessing, which sin had deprived us of: As for instance, when He gives us the sanctifying Spirit [Rom. 5:5], this is called a receiving the atonement, Rom. 5:11. We had forfeited it by sin, and God being pacified in Christ, does restore it to us. Man brought upon himself spiritual death by sin, and the gift of the sanctifying Spirit is the great and first act of God’s pardoning mercy, and a means to qualify us for other parts of pardon. Though the thing be plain of itself, yet to make it more clear to us: 2. Let us distinguish of the kinds of justification. There is a twofold justification, it is either constitutive or executive. First, constitutive justification is by the new Covenant, when those who submit to the terms are constituted or made righteous: Jn. 5:24, ‘He that hears my word, and believes in Him that sent Me, has everlasting life, and shall not come into condemnation; but is passed from death to life.’ There is God’s grant, and whosoever can make good his claim, has a right to justification by God’s own grant, according to the law of grace, he is one freed from sin. Secondly, executive, when God accordingly takes off all penalties and evils, and gives us all the good which belongs to the righteous or justified: as in the case in hand, when God gives us the Spirit to break the power and reign of sin: And therefore so often in Scripture is God said to sanctify us as a God of peace, or as a God pacified and reconciled to us in Jesus Christ: Heb. 13:20-21, ‘Now the God of peace that brought again from the dead our Lord Jesus, that great Shepherd of the sheep, through the blood of the everlasting covenant, make you perfect in every good work to do his will, working in you that which is well-pleasing in his sight.’ 1 Thess. 5:23, ‘And the very God of peace sanctify ye wholly, etc.’ 2 Cor. 5:18, ‘And all things are of God, who hath reconciled us to Himself by Jesus Christ.’ This God does as a Judge, acting according to the rules of government constituted in the new Covenant, upon the account of the merit of Christ, and our actual interest in Him. II. As to the degree, how far we are freed from sin. 1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit. 2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (d. 1677; London: Astwood, 1684) | Sermons on Rom. 6, Sermon 6, pp. 36-41 on Rom. 6:7, “For he that is dead is freed [δεδικαιωται, justified] from sin.”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. … I. The nature of this freedom from sin. I told you before, it is an exemption from the dominion and reign of sin. 1. We quit the evil disposition and temper of our souls… 2. We renounce our former course of living, after the habits we are free from the acts, we do not, and durst not to live in sin, the former conversation [conduct] is cast off as well as the former lusts… Now this freedom is expressed by a word that signifies justification, and fitly: 1. Because of the nature of justification, in which there are two branches; liberatio a poena [liberation from punishment], and acceptatio ad vitam [acceptance to life]. The punishment incurred by the Fall is poena damni and poena sensus, the loss and the pain: Both may be considered as in this life, or the life to come… But in this life we must also consider the loss and pain. The pains are all those miseries and afflictive evils, which came into the world by reason of sin. The loss is loss of God’s image: that threatening, ‘Thou shalt die the death,’ Gen. 2:17, implied spiritual death as well as temporal and eternal. Now we are justified when we are freed from punishment, and among other punishments from the punishment of loss, when God giveth us the blessing, which sin had deprived us of: As for instance, when He gives us the sanctifying Spirit [Rom. 5:5], this is called a receiving the atonement, Rom. 5:11. We had forfeited it by sin, and God being pacified in Christ, does restore it to us. Man brought upon himself spiritual death by sin, and the gift of the sanctifying Spirit is the great and first act of God’s pardoning mercy, and a means to qualify us for other parts of pardon. Though the thing be plain of itself, yet to make it more clear to us: 2. Let us distinguish of the kinds of justification. There is a twofold justification, it is either constitutive or executive. First, constitutive justification is by the new Covenant, when those who submit to the terms are constituted or made righteous: Jn. 5:24, ‘He that hears my word, and believes in Him that sent Me, has everlasting life, and shall not come into condemnation; but is passed from death to life.’ There is God’s grant, and whosoever can make good his claim, has a right to justification by God’s own grant, according to the law of grace, he is one freed from sin. Secondly, executive, when God accordingly takes off all penalties and evils, and gives us all the good which belongs to the righteous or justified: as in the case in hand, when God gives us the Spirit to break the power and reign of sin: And therefore so often in Scripture is God said to sanctify us as a God of peace, or as a God pacified and reconciled to us in Jesus Christ: Heb. 13:20-21, ‘Now the God of peace that brought again from the dead our Lord Jesus, that great Shepherd of the sheep, through the blood of the everlasting covenant, make you perfect in every good work to do his will, working in you that which is well-pleasing in his sight.’ 1 Thess. 5:23, ‘And the very God of peace sanctify ye wholly, etc.’ 2 Cor. 5:18, ‘And all things are of God, who hath reconciled us to Himself by Jesus Christ.’ This God does as a Judge, acting according to the rules of government constituted in the new Covenant, upon the account of the merit of Christ, and our actual interest in Him. II. As to the degree, how far we are freed from sin. 1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit. 2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.”

— Thomas Manton, A Second Volume of Sermons… (d. 1677; London: Astwood, 1684) | Sermons on Rom. 6, Sermon 6, pp. 36-41 on Rom. 6:7, “For he that is dead is freed [δεδικαιωται, justified] from sin.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+predicate+%5Bof+the+verse+Rom.+6%3A7+is%5D%2C+%E2%80%98is+freed+from+sin.%E2%80%99+The+word+%5Bfor+%E2%80%9Cfreed%E2%80%9D%5D+%CE%B4%CE%B5%CE%B4%CE%B9%CE%BA%CE%B1%CE%B9%CF%89%CF%84%CE%B1%CE%B9%2C+the+Vulgar+%5BVulgate%5D+has%2C+justificatus+est+a+peccato+%5Bis+justified+from+sin%5D%3A+Beza%2C+with+many+of+the+ancients%2C+liberatus+est+%5Bis+liberated%5D.+Our+translation+has+both+in+the+text%2C+%E2%80%9Cfreed%2C%E2%80%9D+in+the+margin%2C+%E2%80%9Cjustified%E2%80%9D.+Whether+you+take+one+or+the+other+word%2C+it+imports+deliverance+from+the+yoke+and+dominion+of+sin%2C+so+as+not+to+obey+its+motions+and+commands.+For+the+apostle+does+not+speak+here+of+the+forgiveness+of+sin%2C+but+the+abolition+of+its+power+and+dominion%3B+for+it+is+brought+as+a+reason+why+those+whose+old+man+is+crucified+with+Christ+should+not+serve+sin%3B+and+the+word+%E2%80%9Cjustified%E2%80%9D+is+the+rather+used%2C+because+one+justified+and+absolved+by+his+judge%2C+is+also+released+and+set+free+from+his+bonds%3B+so+are+we.+%E2%80%A6+I.+The+nature+of+this+freedom+from+sin.+I+told+you+before%2C+it+is+an+exemption+from+the+dominion+and+reign+of+sin.+1.+We+quit+the+evil+disposition+and+temper+of+our+souls%E2%80%A6+2.+We+renounce+our+former+course+of+living%2C+after+the+habits+we+are+free+from+the+acts%2C+we+do+not%2C+and+durst+not+to+live+in+sin%2C+the+former+conversation+%5Bconduct%5D+is+cast+off+as+well+as+the+former+lusts%E2%80%A6+Now+this+freedom+is+expressed+by+a+word+that+signifies+justification%2C+and+fitly%3A+1.+Because+of+the+nature+of+justification%2C+in+which+there+are+two+branches%3B+liberatio+a+poena+%5Bliberation+from+punishment%5D%2C+and+acceptatio+ad+vitam+%5Bacceptance+to+life%5D.+The+punishment+incurred+by+the+Fall+is+poena+damni+and+poena+sensus%2C+the+loss+and+the+pain%3A+Both+may+be+considered+as+in+this+life%2C+or+the+life+to+come%E2%80%A6+But+in+this+life+we+must+also+consider+the+loss+and+pain.+The+pains+are+all+those+miseries+and+afflictive+evils%2C+which+came+into+the+world+by+reason+of+sin.+The+loss+is+loss+of+God%E2%80%99s+image%3A+that+threatening%2C+%E2%80%98Thou+shalt+die+the+death%2C%E2%80%99+Gen.+2%3A17%2C+implied+spiritual+death+as+well+as+temporal+and+eternal.+Now+we+are+justified+when+we+are+freed+from+punishment%2C+and+among+other+punishments+from+the+punishment+of+loss%2C+when+God+giveth+us+the+blessing%2C+which+sin+had+deprived+us+of%3A+As+for+instance%2C+when+He+gives+us+the+sanctifying+Spirit+%5BRom.+5%3A5%5D%2C+this+is+called+a+receiving+the+atonement%2C+Rom.+5%3A11.+We+had+forfeited+it+by+sin%2C+and+God+being+pacified+in+Christ%2C+does+restore+it+to+us.+Man+brought+upon+himself+spiritual+death+by+sin%2C+and+the+gift+of+the+sanctifying+Spirit+is+the+great+and+first+act+of+God%E2%80%99s+pardoning+mercy%2C+and+a+means+to+qualify+us+for+other+parts+of+pardon.+Though+the+thing+be+plain+of+itself%2C+yet+to+make+it+more+clear+to+us%3A+2.+Let+us+distinguish+of+the+kinds+of+justification.+There+is+a+twofold+justification%2C+it+is+either+constitutive+or+executive.+First%2C+constitutive+justification+is+by+the+new+Covenant%2C+when+those+who+submit+to+the+terms+are+constituted+or+made+righteous%3A+Jn.+5%3A24%2C+%E2%80%98He+that+hears+my+word%2C+and+believes+in+Him+that+sent+Me%2C+has+everlasting+life%2C+and+shall+not+come+into+condemnation%3B+but+is+passed+from+death+to+life.%E2%80%99+There+is+God%E2%80%99s+grant%2C+and+whosoever+can+make+good+his+claim%2C+has+a+right+to+justification+by+God%E2%80%99s+own+grant%2C+according+to+the+law+of+grace%2C+he+is+one+freed+from+sin.+Secondly%2C+executive%2C+when+God+accordingly+takes+off+all+penalties+and+evils%2C+and+gives+us+all+the+good+which+belongs+to+the+righteous+or+justified%3A+as+in+the+case+in+hand%2C+when+God+gives+us+the+Spirit+to+break+the+power+and+reign+of+sin%3A+And+therefore+so+often+in+Scripture+is+God+said+to+sanctify+us+as+a+God+of+peace%2C+or+as+a+God+pacified+and+reconciled+to+us+in+Jesus+Christ%3A+Heb.+13%3A20-21%2C+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+Shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+covenant%2C+make+you+perfect+in+every+good+work+to+do+his+will%2C+working+in+you+that+which+is+well-pleasing+in+his+sight.%E2%80%99+1+Thess.+5%3A23%2C+%E2%80%98And+the+very+God+of+peace+sanctify+ye+wholly%2C+etc.%E2%80%99+2+Cor.+5%3A18%2C+%E2%80%98And+all+things+are+of+God%2C+who+hath+reconciled+us+to+Himself+by+Jesus+Christ.%E2%80%99+This+God+does+as+a+Judge%2C+acting+according+to+the+rules+of+government+constituted+in+the+new+Covenant%2C+upon+the+account+of+the+merit+of+Christ%2C+and+our+actual+interest+in+Him.+II.+As+to+the+degree%2C+how+far+we+are+freed+from+sin.+1.+All+the+justified+and+converted+to+God+are+freed+from+the+Reign+of+it.+The+flesh%2C+though+it+remaineth%2C+is+made+subject+to+the+Spirit%2C+which+by+degrees+doth+destroy+the+reliques+of+sin%3A+For+it+is+said+of+the+justified%2C+Rom.+8.1.+There+is+no+condemnation+to+them+that+are+in+Christ+Jesus%2C+who+walk+not+after+the+flesh%2C+but+after+the+Spirit.+2.+The+more+obedient+we+are+to+the+motions+of+the+sanctifying+Spirit%2C+the+more+power+we+have+against+sin%3A+Gal.+5.18.+If+ye+be+led+by+the+Spirit%2C+ye+are+not+under+the+Law%2C+under+the+irritating+Power+and+Curse+of+it.+Many+sins+are+in+a+great+measure+left+uncured+as+a+part+of+our+punishment.+%E2%80%A6+4.+Where+the+work+is+really+begun+and+duly+submitted+unto%2C+we+have+hopes+of+a+better+estate%2C+it+still+increases+towards+that+perfect+blessedness%2C+when+we+shall+be+without+spot+and+blemish%2C+or+any+such+thing%2C+Eph.+5%3A27.+What+a+life+do+God%E2%80%99s+holy+ones+live+in+Heaven%2C+who+are+wholly+freed+from+sin%3F%E2%80%A6+There+is+none+in+Heaven+by+the+first+Covenant+%5Bof+Words%5D%3B+all+that+are+there+come+thither+as+sanctified+and+justified+by+Jesus+Christ%2C+and+in+the+way+of+his+pardoning+grace.+Surely+since+we+have+the+same+Redeemer%2C+depend+upon+the+merit+of+the+same+sacrifice%2C+and+wait+for+the+same+Spirit+in+the+use+of+all+holy+means+and+endeavours%2C+He+will+not+be+strange+to+us%E2%80%A6+%E2%80%A6+IV.+How+is+it+a+consequent+of+our+dying+with+Christ%3F%E2%80%A6+%E2%80%A6+2.+It+is+his+privilege%2C+being+crucified+with+Christ%3B+he+has+a+right%2C+and+not+a+right+only%2C+but+his+justification+is+executed+and+applied+to+him+by+the+gift+of+the+sanctifying+Spirit%2C+which+is+the+surest+token+of+God%E2%80%99s+love%2C+and+the+true+effect+of+his+approbation%E2%80%A6+%E2%80%A6+Use+1.+To+inform+us+of+the+intimate+connection+between+all+the+parts+and+branches+of+the+grace+of+the+Gospel.+We+are+absolved+and+discharged+from+the+power+of+sin+as+well+as+from+the+guilt+of+it.+All+will+grant+that+justification+respects+the+guilt+of+sin%3B+but+the+apostle+tells+us+here+that+justification+respects+the+power+of+sin+also.+The+penalty+was+the+loss+of+God%E2%80%99s+image+as+well+as+of+his+favor%3A+so+that+pardon+is+executed+and+applied+when+our+natures+are+sanctified+and+healed.+The+privation+of+the+Spirit+being+the+great+punishment%2C+the+gift+of+the+Spirit+is+a+great+branch+of+our+absolution%2C+and+so+Christ%E2%80%99s+reconciling+and+renewing+grace+fairly+accord+and+agree.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29+%7C+Sermons+on+Rom.+6%2C+Sermon+6%2C+pp.+36-41+on+Rom.+6%3A7%2C+%E2%80%9CFor+he+that+is+dead+is+freed+%5B%CE%B4%CE%B5%CE%B4%CE%B9%CE%BA%CE%B1%CE%B9%CF%89%CF%84%CE%B1%CE%B9%2C+justified%5D+from+sin.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae8014cdae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae8014cdae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=2.%20The%20predicate%20%5Bof%20the%20verse,renewing%20grace%20fairly%20accord%20and%20agree&amp;text=2.%20The%20predicate%20%5Bof%20the%20verse%20Rom.%206%3A7&amp;text=reconciling%20and%20renewing%20grace%20fairly%20accord%20and%20agree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We feel that this inchoate righteousness is indeed a true and living righteousness, a splendid and excellent gift of God, and that the new life in Christ consists in this righteousness, and that all saints are just by this very righteousness also, both before God and before men; and on account of it the saints are also justified by God with a justification of works, that is, they are approved by God, praised and rewarded. However, although this righteousness is true and living, and in its own way also justifying, yet it is not of such a kind, not so true, living, and solid, that any of the saints could be justified by it with the justification of life, much less that it be the righteousness or justification of life itself.</p></blockquote>

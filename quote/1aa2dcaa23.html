<main class="wrap"><figure class="quote" id="q-1aa2dcaa23" data-kw="">
<blockquote><p>Seek to have in lively exercise an abiding recollection of the deliverance which he has already wrought out for you, freeing you from the curse of the law, from the lashings of an aroused conscience, from the fear of coming wrath, and delivering you at the same time from the bondage of divers lusts and passions. These things call to remembrance, that you may be stirred up to greater zeal and stedfastness, and that you may ever seek to be enabled to press toward the mark for the prize of the high calling of God in Christ Jesus.

Salvation is yours, if you are Christ’s. Saved from the power of sin here, you will here, too, be saved from the punishment which invariably follows sin, even in this world. And in the world to come, when you there awake, you will be satisfied, for you will behold his face in righteousness — in his presence there is fulness of joy, at his right hand there are pleasures for evermore.

But if we are Christ’s — if we are indeed members of his mystical body, heirs of God, joint-heirs with him — then, not only are we in possession of an abiding joy, of which we cannot be deprived by aught that is earthly, but we are — with reverence be it spoken — the inciting cause of joy in the bosom of Immanuel. Joy must and will thrill the soul of the believer, when he remembers what has been done for him, and when, with the eye of faith, he anticipates that which is awaiting him …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reid-ormond.html">John Reid Ormond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ s Joy in His People’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>In matter of hearing, it is not so hard to discern who are to be accounted to speak without God’s commission: because ordinarily, such have either no warrantable call at all (no not in the outward form; and so cannot be accounted but to run unsent) or, by palpable defection from the truth, and commission given them in that call, they have forfeited their commission, and so no more are to be accounted ambassadors to Christ, or watchmen of His flock, than a watchman of the city, is to be accounted an observer thereof, when he has publicly made defection to the enemy, and taken on with him. For we are here to rest in the external call, and not to dispute that which is inward: because it passes our reach; and Christ has furnished his House with external ordinances, for the warranting of his people’s peace in reference to these things: there is therefore great difference to be placed here between one that is called, and one whom we think not worthy to be called: it’s the first that warrants hearing…</p></blockquote>

</figure><figure class="quote" id="q-d085134a35" data-kw="">
<blockquote><p>I know there are some, that lay it unto our charge, as the false apostles did unto Paul, that we use the word of God deceitfully; they find fault with our translations of the Scriptures; they spare not to say there be a thousand faults in the New Testament; yet would they never set down five hundred, or one hundred, or fifty, or twenty-five, or five.

If there be errors in the translation, I know they were men which translated it, and they might err like men. May no translation be allowed that is not altogether perfect? as if the Greek translation were without fault, or as if many faults were not in the common vulgar translation in Latin, or in the translation of Jerome. What then? Must the Greek translation be forbidden? must Jerome’s translation, or the vulgar translation, be forbidden? As for the old Latin common translation, though many learned men have shewed the gross errors thereof; yet have they well provided for it in the council of Trent.

”Let no man dare or presume (say they) by any manner of colour to refuse the old common translation of the Bible.” Yet is no translation of ours so corrupt, as that which they have thus privileged. But if it were true, which they falsely report, reason would they did correct the errors, and so set it abroad. But thus they bear you in hand, that they may bring you in hatred of it, and pull you from the reading of the Scriptures. I will not say in what sort they abuse the word of God. What speak I of abusing? Nay, they do manifestly against and contrary to the word.</p></blockquote>

</figure><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>

<blockquote><p>Second it is useful and necessary that in our invocation of God we know what God we are invoking—that true God with whom we have entered into a covenant of faith, who has testified to us in an eternal covenant that He will be our God, and who has sealed that to us with the seal of baptism. This is so that the we might distinguish our invocation from that o f the pagans, the Turks, and such like, who invoke gods that are really not gods at all but fabrications by the father of lies. For it is in no way tolerable to God that any fellowship with false deities hinder His covenant partners in their invocation and worship, s the Holy Spirit eloquently proclaims in 2 Corinthians 6:14–15. The apostle also sets before our eyes the magnitude of this danger—unless we cling to the living God, whose covenant partners we are, by the true of obedience of faith, and wholly abstain from all idolatrous worship and invocation—in 1 Corinthians 10: [20–21]: “The things which the Gentiles sacrifice they sacrifice to demons and not to God, and I do not want you to have fellowship with demons. You cannot drink the cup of the Lord and the cup of demons; you cannot partake of the Lord’s Table and the table of demons.” For κοινωνιαν with the table demons with be followed also by κοινωνια in eternal punishment (Rev. 14:9–12; Luke 11:49–52).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Apostles’ Creed</cite>, trans. Lyle D. Bierma, Classic Reformed Theology, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books, 2009), 38–39.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Second it is useful and necessary that in our invocation of God we know what God we are invoking—that true God with whom we have entered into a covenant of faith, who has testified to us in an eternal covenant that He will be our God, and who has sealed that to us with the seal of baptism. This is so that the we might distinguish our invocation from that o f the pagans, the Turks, and such like, who invoke gods that are really not gods at all but fabrications by the father of lies. For it is in no way tolerable to God that any fellowship with false deities hinder His covenant partners in their invocation and worship, s the Holy Spirit eloquently proclaims in 2 Corinthians 6:14–15. The apostle also sets before our eyes the magnitude of this danger—unless we cling to the living God, whose covenant partners we are, by the true of obedience of faith, and wholly abstain from all idolatrous worship and invocation—in 1 Corinthians 10: [20–21]: “The things which the Gentiles sacrifice they sacrifice to demons and not to God, and I do not want you to have fellowship with demons. You cannot drink the cup of the Lord and the cup of demons; you cannot partake of the Lord’s Table and the table of demons.” For κοινωνιαν with the table demons with be followed also by κοινωνια in eternal punishment (Rev. 14:9–12; Luke 11:49–52).”

<main class="wrap"><figure class="quote" id="q-ac42065a3f" data-kw="Penance Satisfaction">
<blockquote><p>For while they require three things in repentance--viz. compunction of heart, confession of the mouth, and satisfaction of work --they at the same time teach that these are necessary to obtain the pardon of sins. … But if forgiveness of sins depends on the conditions to which they bind it, nothing can be more wretched and deplorable than our situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.4.2</span></figcaption>

</figure><figure class="quote" id="q-19a2e6f8a1" data-kw="">
<blockquote><p>What remains but for the blind to see, the deaf to hear, children even to perceive this abomination of the mass, which, held forth in a golden cup, has so intoxicated all the kings and nations of the earth, from the highest to the lowest; so struck them with stupor and giddiness, that, duller than the lower animals, they have placed the vessel of their salvation in this fatal vortex. Certainly Satan never employed a more powerful engine to assail and storm the kingdom of Christ.</p></blockquote>

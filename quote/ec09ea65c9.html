<main class="wrap"><figure class="quote" id="q-ec09ea65c9" data-kw="">
<blockquote><p>I have some parts of Mohammed’s Koran which in German might be called a book of sermons or doctrines of the kind that we call pope’s decretals. When I have time I must translate it into German so that everyone may see what a foul and shameful book it is.

In the first place, he greatly praises Christ and Mary as being the only ones without sin, and yet he believes nothing more of Christ than that he is a holy prophet, like Jeremiah or Jonah, and denies that he is God’s Son and true God. Furthermore, he does not believe that Christ is the Saviour of the world who died for our sins, but that he preached to his own time and completed his work before his death, just like any other prophet.

On the other hand, Mohammed highly exalts and praises himself and boasts that he has talked with God and the angels, and that since Christ’s office of prophet is now complete, he has been commanded to bring the world to his faith, and if the world is not willing to compel it or punish it with the sword; there is much glorification of the sword in it. Therefore the Turks think that their Mohammed is much higher and greater than Christ, for the office of Christ has come to an end and Mohammed’s office is still in force.

From this anyone can easily see that Mohammed is a destroyer of our Lord Christ and his kingdom, and if anyone denies the articles concerning Christ, that he is God’s Son, that he died for us and still lives and reigns at the right hand of God, what has he left of Christ? Father, Son, Holy Ghost, baptism, the sacrament, gospel, faith, and all Christian doctrine and life are gone, and instead of Christ only Mohammed with his doctrine of works and especially of the sword is left. That is the chief doctrines of the Turkish faith in which all abominations, all errors, all devils are piled up in one heap.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On War Against the Turk</cite>, (1528), trans. Charles M. Jacobs in Luther’s Works, 46: 176-77.</span></figcaption>

<blockquote><p>3. A magistrate may compel a heathen nation to the negative reverence of Christ in a indirect way, and that with the sword, though he cannot compel to the positive worshipping of Him: if a Christian prince subdue a pagan nation, he cannot force them with the sword to a positive receiving of the doctrine of the Gospel, but if it be a nation expressly blaspheming Christ, as the nation of the Jews now do, he may compel them to an abstinence from a professed blaspheming of Christ, because he is to use the sword against blasphemy.

4. The weapons of the Church as the Church are not carnal, but spiritual and mighty through God.</p></blockquote>

</figure><figure class="quote" id="q-e12af2cb1f" data-kw="">
<blockquote><p>As for the first, the Miracles which Jesus performed, were so great in themselves, so notorious in the sight of his enemies, so consonant to this Prophecy [Isaiah 35:5], that none can with any shadow of verity question that this Prophecy was accomplished in him. For he gave sight to the blind, he healed such as were impotent from the womb, he raised the dead, opened the ears of the deaf, loosened the tongue of the dumb, commanded the winds and the Sea and they obeyed him, and surpassed as well in number as magnificence of his miracles all the Prophets that came before him.

‘Tis true, there are some Jews who accuse him of having done the same by Magic. But then their Ancestors who condemned him, would have bethought themselves to make this a part of his Indictment, and insert it into the sentence of his condemnation. For what law is more severe then theirs in constituting terrible penalties for Sorcerers, and all such as addict themselves to Magic? And nevertheless he did these wonders before their Eyes, under the view and cognisance of all the world; in the City and the Country, in the house and the street, and for the most part in the presence of the greatest multitudes. Yet they never accused him of Sorcery.

Some Pharisees indeed, whose eyes were perstringed by the lustre of his deeds, accused him of effecting them by Beelzebub the Prince of Devils. But their own followers did not believe them, and the Answer he gave them was perfectly convincing; That his Doctrine wholly tending to the subversion of the Empire of Satan, the Devil would never have confederated with and assisted him that went about thus to undermine the foundations of his Kingdom.

And truly what diabolical art or what sleight of Magic could be employed in restoring life to the deceased, and sight to those which never had any, to heal persons desperately sick at a great distance from him and by his Word alone, and to stop a continued flux of blood of twelve years only by the touching of his garments, to reinfuse decayed strength in a moment, and rectify crippled members after long impotence? For what are the works of Magicians usually but illusions, and feats of juggling, rather than actions surpassing the power of Nature?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise concerning religions, in refutation of the opinion which accounts all indifferent. Wherein is also evinced the necessity of a particular revelation, and the verity and preeminence of the Christian religion above the pagan, Mahometan, and Jewish rationally demonstrated</cite>, (London: Will. Nealand, 1660), Part 3.9, pp 497-98.</span></figcaption>

<blockquote><p>Secondly it is asked whether Jews or pagans can be over Christians or not. And it seems that yes:

1. From the fact that the apostle says, 1 Tim. 6:1: Let all who are under the yoke of slavery deem their masters worthy of all honor. Gloss: ‘Under the yoke of infidels.’ Therefore the apostle does not deny that infidels were able to be over the faithful.

2. Likewise, Extra, Of Many: Because to be cultivated. Therefore Jews can be over Christians. They have clung more longly to their lands, as owing to a contract of the place, let them remain for the cultivation of fields, rendering the customary payments to the aforesaid Christian men.

3. Likewise, they are able to receive a price for Christian slaves that have been purchased; which would not be the case unless they were able in some way to be over them, as is found in dist. 54, Fraternitatem.

4. It also seems so from what Gelasius says, XVII, question 4, where it is said that diligently. From this it seems that your care should faithfully examine the truth of affairs, so that neither religion may seem violated, nor a slave lying by this objection, strive to decline the rights of the rightful master, whom it is not certain to be a Christian, from the dominion of his master is not to be exempted. But the contrary seems true: a. From what is said in the Decretals, Multorum, where it is said: To no Jew. And it says that it is lawful to retain a Christian slave in his dominion, but, if any are found among them, let their freedom be preserved for them. Gregory: Whatever Christian slaves a Jew is found to have purchased, bring them without ambiguity to freedom according to the precepts of the laws, lest, God forbid, the Christian religion, made subject to the Jews, be polluted. b. Likewise, in dist. 54: No public offices are to be imposed on Jews by which they may be granted the punishment of inflicting upon Christians; let Christians have Jews as masters. But this was done so that to the Jews c. Likewise, it is found in the Decretals, On the Jews, where it is prohibited, To these things for all Christians. And this same thing is found there, when they expose themselves for some wage to the service of the Jews, as is continually said: Jews or Saracens, etc. But what reason is there that, on account of the Christian faith, the right over a slave should be taken away from him, since servitude was introduced by divine law and approved also by canon law? But the Christian religion does no wrong to anyone. [Solution]: To this it must be said that a Christian is not permitted to serve a Jew, on account of avoiding damage to the Christian religion, as is found in the Decretals, On the Jews, To these things for all, where it is said: The customs of the Jews and ours in no way agree. For this same reason also, if some, because of continual conversation and assiduous familiarity, are easily able to incline the minds of the simple to their superstition and faithlessness, and they themselves should be their slaves, let them be freed from their service, sometimes at a price being given, sometimes at no price being given. For a slave of a Jew is either homeborn or purchased. If homeborn, if he is or wishes to become a Christian, he is immediately snatched away into freedom, with no price given, as is found in the Code, On bishops, and dist. 54, Fraternitatem. But if he is purchased, either he was a Christian when he was bought or a pagan. If a Christian, he becomes free, with no price given; as is found in dist. 54, Mancipia, trade in Christians is forbidden to Jews, both by the law of the land and by the law of the forum. But if he was a pagan, either he was bought for the sake of service or for the sake of commerce. If for the sake of service, and he wishes to become a Christian, he becomes free without price, dist. 54, Fraternitatem. But in the second case, if within three months afterward he has not put him up for sale if he wishes to become a Christian, he is freed without price, because it is presumed that he bought him in order to serve. But if he has put him up for sale within that term and he wishes to become a Christian then or afterward, provided that the fault did not rest with the master so that he did not sell him, he is freed, the price of twelve solidi being returned by some Christian, dist. 54, Frater, and nitatem. Decretals, In the present council: If, however, a Jew shall circumcise one wishing to become a Christian, or shall imprint the mark of another sect, he is freed without price for the injury of his own body, dist. 54, Nulla, where it is said that if certain Christians have been defiled by them in Jewish rite or even circumcised, without the price being returned let them return to freedom and the Christian religion, but human law inflicts a heavier punishment. But what has been said about the slaves of the Jews can be said about the slaves of the Saracens: for the same suspicion and the same danger can exist in both. [To the objections]:

1. To the objection, however, on the contrary it must be said that that of the apostle is understood for the state of the primitive Church and so that unbelieving masters might be enticed to the conversion of faith through the services of faithful slaves. Hence the Gloss says: Rather, unbelieving masters are converted through the services of faithful slaves. But there is added there in the text: Lest the name of the Lord and doctrine be blasphemed. The Gloss: ‘As though of one invading what is another’s.’ According to that reasoning, it will seem to someone, and Christian doctrine will seem as if unjust, that it is also now so to be done. But to this it must be answered that another reason restores the pact. For now they ought not to serve, lest the name of the Lord be blasphemed; for thus Jews and pagans are inclined to this, that they may draw the faithful into faithlessness or apostasy. On account of which cohabitation with Jews and pagans, unless for the sake of preaching, is forbidden, lest the name of the Lord be blasphemed. Nor ought Christian doctrine on this account to seem unjust, since the caution of faith must be preferred to all.

2. To the second, however, it must be said that, although Christians may cultivate the landed estates of Jews, they ought not nevertheless to serve Jews in their house, lest bad familiarity be contracted. And from this they are not said rightly to be over them as over slaves, because they cannot transfer them to another place or to another service, as is said in the Decretals, On the Jews. And this was done in favor of Christians, not of Jews, that they may cultivate the landed estates or lands bought from Jews, because they had formerly lived in those lands.

3. To the third, however, it must be said that, although they may receive the price of servitude, nevertheless not for Christians already existing, but for pagans who wish to become Christians. For by the law of the land Christian slaves are freed from the service of Jews, lest there be danger to the Christian faith. In favor also of the Christian faith, to certain men wishing to receive Christianity freedom is granted.

4. But that which is said in XVII, question 4, does not expressly give to understand that he was a Christian, but that he said that he had been a Christian from infancy, and that the mark of circumcision had been impressed on him by the aforesaid lord, he would be freed. But if he was not a Christian, he is not to be freed from servitude by the fact that he has fled to the church, unless he wishes to become a Christian, and this canon seems to say this. Hence it is not introduced for the dominion of Jews, but for the dominion of Christians: for some wished to defraud their master of his own right, fleeing to the enclosures of the Church.

5. To the last it must be said that the catholic Church intends to do injury to no one, but has ordered this so that no injury be done to God; but injury would be done to God if faith in something were endangered on account of the observance of temporal justice.</p></blockquote>

dden+to+Jews%2C+both+by+the+law+of+the+land+and+by+the+law+of+the+forum.+But+if+he+was+a+pagan%2C+either+he+was+bought+for+the+sake+of+service+or+for+the+sake+of+commerce.+If+for+the+sake+of+service%2C+and+he+wishes+to+become+a+Christian%2C+he+becomes+free+without+price%2C+dist.+54%2C+Fraternitatem.+But+in+the+second+case%2C+if+within+three+months+afterward+he+has+not+put+him+up+for+sale+if+he+wishes+to+become+a+Christian%2C+he+is+freed+without+price%2C+because+it+is+presumed+that+he+bought+him+in+order+to+serve.+But+if+he+has+put+him+up+for+sale+within+that+term+and+he+wishes+to+become+a+Christian+then+or+afterward%2C+provided+that+the+fault+did+not+rest+with+the+master+so+that+he+did+not+sell+him%2C+he+is+freed%2C+the+price+of+twelve+solidi+being+returned+by+some+Christian%2C+dist.+54%2C+Frater%2C+and+nitatem.+Decretals%2C+In+the+present+council%3A+If%2C+however%2C+a+Jew+shall+circumcise+one+wishing+to+become+a+Christian%2C+or+shall+imprint+the+mark+of+another+sect%2C+he+is+freed+without+price+for+the+injury+of+his+own+body%2C+dist.+54%2C+Nulla%2C+where+it+is+said+that+if+certain+Christians+have+been+defiled+by+them+in+Jewish+rite+or+even+circumcised%2C+without+the+price+being+returned+let+them+return+to+freedom+and+the+Christian+religion%2C+but+human+law+inflicts+a+heavier+punishment.+But+what+has+been+said+about+the+slaves+of+the+Jews+can+be+said+about+the+slaves+of+the+Saracens%3A+for+the+same+suspicion+and+the+same+danger+can+exist+in+both.+%5BTo+the+objections%5D%3A+1.+To+the+objection%2C+however%2C+on+the+contrary+it+must+be+said+that+that+of+the+apostle+is+understood+for+the+state+of+the+primitive+Church+and+so+that+unbelieving+masters+might+be+enticed+to+the+conversion+of+faith+through+the+services+of+faithful+slaves.+Hence+the+Gloss+says%3A+Rather%2C+unbelieving+masters+are+converted+through+the+services+of+faithful+slaves.+But+there+is+added+there+in+the+text%3A+Lest+the+name+of+the+Lord+and+doctrine+be+blasphemed.+The+Gloss%3A+%E2%80%98As+though+of+one+invading+what+is+another%E2%80%99s.%E2%80%99+According+to+that+reasoning%2C+it+will+seem+to+someone%2C+and+Christian+doctrine+will+seem+as+if+unjust%2C+that+it+is+also+now+so+to+be+done.+But+to+this+it+must+be+answered+that+another+reason+restores+the+pact.+For+now+they+ought+not+to+serve%2C+lest+the+name+of+the+Lord+be+blasphemed%3B+for+thus+Jews+and+pagans+are+inclined+to+this%2C+that+they+may+draw+the+faithful+into+faithlessness+or+apostasy.+On+account+of+which+cohabitation+with+Jews+and+pagans%2C+unless+for+the+sake+of+preaching%2C+is+forbidden%2C+lest+the+name+of+the+Lord+be+blasphemed.+Nor+ought+Christian+doctrine+on+this+account+to+seem+unjust%2C+since+the+caution+of+faith+must+be+preferred+to+all.+2.+To+the+second%2C+however%2C+it+must+be+said+that%2C+although+Christians+may+cultivate+the+landed+estates+of+Jews%2C+they+ought+not+nevertheless+to+serve+Jews+in+their+house%2C+lest+bad+familiarity+be+contracted.+And+from+this+they+are+not+said+rightly+to+be+over+them+as+over+slaves%2C+because+they+cannot+transfer+them+to+another+place+or+to+another+service%2C+as+is+said+in+the+Decretals%2C+On+the+Jews.+And+this+was+done+in+favor+of+Christians%2C+not+of+Jews%2C+that+they+may+cultivate+the+landed+estates+or+lands+bought+from+Jews%2C+because+they+had+formerly+lived+in+those+lands.+3.+To+the+third%2C+however%2C+it+must+be+said+that%2C+although+they+may+receive+the+price+of+servitude%2C+nevertheless+not+for+Christians+already+existing%2C+but+for+pagans+who+wish+to+become+Christians.+For+by+the+law+of+the+land+Christian+slaves+are+freed+from+the+service+of+Jews%2C+lest+there+be+danger+to+the+Christian+faith.+In+favor+also+of+the+Christian+faith%2C+to+certain+men+wishing+to+receive+Christianity+freedom+is+granted.+4.+But+that+which+is+said+in+XVII%2C+question+4%2C+does+not+expressly+give+to+understand+that+he+was+a+Christian%2C+but+that+he+said+that+he+had+been+a+Christian+from+infancy%2C+and+that+the+mark+of+circumcision+had+been+impressed+on+him+by+the+aforesaid+lord%2C+he+would+be+freed.+But+if+he+was+not+a+Christian%2C+he+is+not+to+be+freed+from+servitude+by+the+fact+that+he+has+fled+to+the+church%2C+unless+he+wishes+to+become+a+Christian%2C+and+this+canon+seems+to+say+this.+Hence+it+is+not+introduced+for+the+dominion+of+Jews%2C+but+for+the+dominion+of+Christians%3A+for+some+wished+to+defraud+their+master+of+his+own+right%2C+fleeing+to+the+enclosures+of+the+Church.+5.+To+the+last+it+must+be+said+that+the+catholic+Church+intends+to+do+injury+to+no+one%2C+but+has+ordered+this+so+that+no+injury+be+done+to+God%3B+but+injury+would+be+done+to+God+if+faith+in+something+were+endangered+on+account+of+the+observance+of+temporal+justice.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+2+%7C+ch.+2%2C+%E2%80%98Whether+Jews+or+Pagans+can+Preside+over+Christians%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd0aac9ca2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d0aac9ca2b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Secondly%20it%20is%20asked%20whether%20Jews,of%20the%20observance%20of%20temporal%20justice&amp;text=Secondly%20it%20is%20asked%20whether%20Jews%20or%20pagans&amp;text=on%20account%20of%20the%20observance%20of%20temporal%20justice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

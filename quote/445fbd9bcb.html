<main class="wrap"><figure class="quote" id="q-445fbd9bcb" data-kw="">
<blockquote><p>Christ crucified, by satisfying the justice of God, brake the thunders of the law, and dissolved the frame of all its anathemas: ‘Being made a curse for us, he hath redeemed us from the curse of the law,’ Gal. iii. 13, i.e. from the sentence of the lawgiver, denounced in his law against the transgressors of it; so that ‘now there is no condemnation to them that are in Christ Jesus,’ Rom. viii. 1, because they are ‘dead to the law by the body of Christ,’ Rom. vii. 4. By the body of Christ as slain and raised again: for this ‘handwriting of ordinances, which was contrary to us, is taken out of the way by God, being nailed to his cross,’ Col. ii. 14.

He hath abolished the obligation of the moral law, as to any condemning power, it being the custom to cancel bonds anciently by piercing the writing with a nail. The ceremonial law was abolished in every regard, since the substance of it was come, and that which it tended to was accomplished; and so one understands ver. 15, ‘Having spoiled principalities and powers, he made a show of them openly,’ of the ceremonies of the law, called principalities and powers in regard of the divine authority whereby they were instituted. These he spoiled; the word ἀπεκδυσάμενος signifies unclothing, or unstripping; he unveiled them, and shewed them to be misty figures that were accomplished in his own person.

The flower falls when the fruit comes to appear; grace and truth came by Jesus Christ, grace to obey the precepts, and truth to take away the types. But it is also meant of the condemning power of the moral law, which was nulled by the death of Christ, who, upon his cross sealing another covenant, repealed the former. The settling a new covenant implies the dissolution of the old. That was nailed to his cross which was contrary to us, a law that was a charge against us, and by virtue whereof we were sued; and this was the law as sentencing us to death, which was pierced and torn by those nails, that did discover that debt and denounce the sentence, which cannot be meant so properly of the ceremonial as the moral law.

The ceremonial law of sacrifices was the gospel in shadows, and appointed for the relief of men, and as a ground whereon to exercise their faith till the appearance of the substance, and therefore cannot be said to be contrary to us, but an amicable discovery, that we are to have that relief in another which we wanted in ourselves; and that we were to be freed from the sentence of death by some grand sacrifice represented by those sacrifices of animals.

Besides, the apostle writes this as a cordial, issuing out of the blood of Christ to the Gentile Colossians, who never were under the obligations of the ceremonial law, that being appropriated to the Jews. The apostle brings it to back his assertion, that their trespasses were forgiven. This argument had been of no use to the Gentiles, who sinned not against the ceremonial law, but the moral law; and if one only had been cancelled, and not the other, the Jews themselves, whose offences were most against the moral law, had had little or no comfort in having the fewest of their sins forgiven.

Our Saviour died by the power and force of the moral law: that brought him to the cross for the fulfilling it in its penalty, as well as he had done in his life by his obedience; and he receiving the full execution of its sentence upon himself on the cross, as a substitute in our place, nulled that sentence as to any force upon those that believe in him. The plea against it is, that it hath already been executed, though not upon our persons, yet upon our surety; so that, being nailed to his cross, the virtue of his cross must cease before the killing power of the law can revive. This crucified Christ, who disarmed the law of its thunders, defaced the obligation of it as a covenant, and, as it were, ground the stones upon which it was writ to powder, is worth our exact knowledge and studious inquiry.</p></blockquote>

<blockquote><p>The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.</p></blockquote>

<blockquote><p>Therefore the nature of the human race, generated from the flesh of the one transgressor, if it is self-sufficient for fulfilling the law and for perfecting righteousness, ought to be sure of its reward, that is, of everlasting life, even if in any nation or at any former time faith in the blood of Christ was unknown to it. For God is not so unjust as to defraud righteous persons of the reward of righteousness… Man’s nature, indeed, was created at first faultless and without any sin; but that nature of man in which every one is born from Adam, now wants the Physician, because it is not sound. … This grace, however, of Christ, without which neither infants nor adults can be saved, is not rendered for any merits, but is given gratis, on account of which it is also called grace. ‘Being justified,’ says the apostle, ‘freely through His blood.&#x27;</p></blockquote>

<blockquote><p>All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life &amp; Death</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (Grand Rapids: Reformation Heritage Books and Dutch Reformed Translation Society, 2016), Lord’s Day 32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.”

— Theodorus VanderGroe, The Christian’s Only Comfort in Life &amp; Death, trans. Bartel Elshout, ed. Joel R. Beeke (Grand Rapids: Reformation Heritage Books and Dutch Reformed Translation Society, 2016), Lord’s Day 32.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+natural+and+unregenerate+men+function+entirely+within+the+context+of+the+covenant+of+works%2C+and+regardless+of+what+their+religious+mindset+may+be%2C+their+singular+objective+is+to+be+justified+before+God+by+their+own+merits+and+by+the+works+of+the+law.+Therefore%2C+if+they+hear+any+mention+made+of+a+covenant+that+is+purely+and+freely+gracious+in+and+through+the+crucified+surety+and+mediator+Christ+Jesus%2C+or+if+they+are+directed+to+anything+other+than+this+covenant+of+grace+and+to+this+mediator%2C+being+called+upon+to+lay+aside+and+fully+to+forsake+all+their+own+strength+and+righteousness%2C+and+admonished+from+the+Holy+Scriptures+that+they+are+to+believe+alone+in+Him+who+justifies+the+ungodly+because+they+are+unable+to+accomplish+anything+themselves%E2%80%94I+say%2C+the+moment+this+occurs%2C+these+people+are+of+the+opinion+that+such+a+faith+will+render+them+careless%2C+whereby+sin+will+then+necessarily+have+dominion+over+them.+Natural+men+have+always+thus+judged+the+doctrine+of+salvation+by+grace+alone.%E2%80%9D%0A%0A%E2%80%94+Theodorus+VanderGroe%2C+The+Christian%E2%80%99s+Only+Comfort+in+Life+%26+Death%2C+trans.+Bartel+Elshout%2C+ed.+Joel+R.+Beeke+%28Grand+Rapids%3A+Reformation+Heritage+Books+and+Dutch+Reformed+Translation+Society%2C+2016%29%2C+Lord%E2%80%99s+Day+32.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ab7421dd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ab7421dd5.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/12/natural-man-and-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

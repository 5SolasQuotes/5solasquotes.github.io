<main class="wrap"><figure class="quote" id="q-9153c34eaf" data-kw="">
<blockquote><p>The first is, that he hath reserved a remnant among us that do make use of this space and season to apply themselves unto the throne of grace, and to cry mightily for mercy. God hath not taken his Holy Spirit from us. God hath not said, by any open work or secret intimation of providence, “Pray no more for this people; my heart shall not be toward them.” He hath not said so; and, therefore, there are yet among us precious souls who do lift up prayers to God night and day, not only for themselves and families, not only for the church of God, but for this poor land of our nativity, that, if it were the will of God, we may not see it soaked in blood;—that God would not come forth to destroy it with a curse;—that God would pity, and spare, and have mercy upon it;—that he would not make it an “Aceldama,”—a field of blood. There are many cries to God to this purpose. So that there are some by whom this space and season God hath given us is made use of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seasonable Words for English Protestants in William H. Goold (ed.), The Works of John Owen, D.D.</cite></span></figcaption>

<blockquote><p>…If any person on Sunday shall himself be found labouring at his own or any other trade or calling, or shall employ his apprentices, servants or slaves in labour, or other business, except it be in the ordinary household offices of daily necessity, or other work of necessity or charity, he shall forfeit the sum of ten shillings for every such offence, deeming every apprentice, servant, or slave so employed, and every day he shall be so employed as constituting a distinct offence.† † Report, p. 59. Text of Act as adopted is in Hening, xii, 336–7. Bill was presented by Madison 31 Oct. 1785 and on 14 Dec. postponed to next session; at the Oct. 1786 session it was brought up again, amended by both House and Senate, and passed on 27 Nov. (JHD, Oct. 1785, 1828 edn., p. 12–15, 92; same, Oct. 1786, p. 16–17, 49, 52, 64, 127). The Act as adopted and the Bill as proposed agree except as noted below; Act was suspended until 1 July 1787 (Hening, xii, 410–11).</p></blockquote>

<blockquote><p>Quest. IV. Did the Lord by Moses give to the Jews, as a Body Politick, sundry Judicial Laws, which expired together with their state? Yes. Do they oblige any other now, further than the general equity thereof may require. No. Exod. 21. from the first to the last ver. Exod. 22. 1. to verse 29. Gen. 49. 10. 1 Cor. 9. 8, 9, 10. 1 Peter 2. 13. 14. Matth. 5. 17. 38. 39. Well then, do not some err, though otherwise Orthodox, who maintain, that the whole Judicial Law of the Jews is yet alive, and binding all of us, who are Christian Gentiles? Yes. By what reasons are they confuted? (1) Because, the Judicial Law, was delivered by Moses to the Israelites to be observed, as to a Body Politick; Exod. 21 chapter. (2) Because, this Law, in many things, which are of particular right, was accommodated, to the Common-wealth of the Jews, and not to other Nations also; Exod. 22. 3. Exod. 21. 2. Lev. 25. 2, 3. Deut: 24. 1, 2, 3. Deut. 25. 5, 6, 7. (3) Because, in other things, which are not of particular right, it is neither from the Law of Nature, obliging by Reason; neither is it pressed upon Believers under the Gospel, to be observed. (4) Because, Believers are appointed under the Gospel to obey the civil Laws, and commands of those under whose Government they live, providing they be just, and that for Conscience sake. Rom. 13. 1. 1 Peter 2. 13, 14. Titus 3. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error</cite>, (Edinburgh, 1684), 144–45.</span></figcaption>

<blockquote><p>III. …the formation of the body, which was completed at once, and not over a period of time, like the bodies of other men; and in the breathing in of a rational soul. Whereas in ordinary generation the time required for formation of the body is forty days, the body of Christ was absolutely completed in a moment. Otherwise Christ would have been conceived not a man but as an embryo.</p></blockquote>

<blockquote><p>4. Personal power in man is the first; family power is the next; city and kingdom power supposes these and cannot destroy them. Hence subjects that are not mere slaves stand up to plead for their personal and domestic property, liberty and power, if my money, and limbs and life be not at the patron’s or the prince’s will, much less my soul. He is trusted with my estate and life; but I am first and more trusted with them. He may keep out ill physicians from the land, and encourage the good, but he has no power to tie me to an ill physician, nor to an ill diet, nor to ill servants, etc. The choice of these belongs to myself… I will not believe that the patron loves me and all the parish better than we love ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Answer to Dr. Edward Stillingfleet’s Charge of Separation</cite>, … (London: 1680), ‘A Reply to Dr. Stillingfleet’s Letter’, p. 16</span></figcaption>

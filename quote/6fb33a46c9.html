<main class="wrap"><figure class="quote" id="q-6fb33a46c9" data-kw="">
<blockquote><p>Indeed you must suffer the mortification of your flesh, you must endure the pain of the death of your lusts, the cutting off your right hand, and plucking out your right eye, which would make you offend and stumble in the way; but let the remembrance of the life to come sweeten it all.

When men undergo the hazard of losing life for a little pleasure, when, for a poor petty advantage, men will endure so much pains and trouble; O! how should eternal life,—and such a life as the best life here is but death to it;—how should it mitigate and sweeten the bitterness of mortification! How should it fortify our spirits to much endurance and patience!

A battle we must have for these lusts that we disengage from the devil; and the world besides, will lay wait for us in this way; but when for such small and inconsiderable advantages, men will endure all the disadvantages of war, of a long war; O how should the expectation of this peace, which incloses and comprehends all felicity, all well being, animate and strengthen us to fight into the city of life and peace eternal!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary: Being Sermons on the Eighth Chapter of the Epistle to the Romans</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 29.</span></figcaption>

</figure><figure class="quote" id="q-0964889a91" data-kw="">
<blockquote><p>In the preface to a printed version of James Begg’s speech before the General Assembly of the Free Church of Scotland in 1868 on the subject of Irish disestablishment, he attributed Ulster’s prosperity partly to its Protestantism and warned of the evils of the British government disowning Protestantism in Ireland:

The vast importance of the subject to which it relates can scarcely be over-estimated, and although a singular amount of delusion is abroad in regard to it, it is hoped that wiser counsels may yet prevail. That any one who, having read history, has travelled over Ireland, and had an opportunity of comparing that fertile but unhappy country with other lands, can have any serious doubt as to the leading cause of its social degradation, seems incredible. Other causes, no doubt, there are, but let any one compare Belfast with Galway, Protestant Ulster with the Popish south and west of Ireland, and it seems impossible to deny that the same cause which has degraded Mexico and Spain, Austria and Italy, has visibly stamped its impress on Ireland. …

That the question of Ireland involves peculiar difficulties, especially when considered cursorily, and from a Scotch point of view, without regard to the broad issues raised, may be readily admitted. But these difficulties are not new; and what is now proposed is that the Government should, instead of reforming, not only disendow but disestablish or disown Protestantism in Ireland; in other words, virtually hand over that unhappy country to the management of the Romish priests. How such a man as Dr [Thomas] Chalmers would have acted in present circumstances cannot be doubtful; and a mere change of position cannot affect unalterable principles, founded on the Word of God.

At the present moment parties are manifestly acting in concert whose objects are totally different, and never, perhaps, was the political craft of Rome more conspicuous than in getting so many opposite classes to do her work, and that too upon pretence of seeking to destroy her influence.

The questions now raised, however, should be considered apart from individuals or parties, and we commend the following facts and considerations to the Christian people of Britain, who must think and act for themselves. They have now, to an extent greater than has probably existed since the Reformation, the power of influencing the proceedings of statesmen and of parliaments.

No such crisis as the present has occurred since the Revolution; no more important parliament than that about to assemble has been convened in modern times. And we trust the result will prove that the Protestant spirit of the country is still unbroken, and that whilst fully prepared for every measure of true reform, the Parliament of Britain will resist revolution, and maintain to the uttermost that truth and righteousness by which alone a nation can be exalted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 3, 4.</span></figcaption>

</figure><figure class="quote" id="q-ed1b322854" data-kw="">
<blockquote><p>What an effect would be produced on an unbelieving world if a better spirit were more prevalent; if Churches, though distinguished by trivial peculiarities, regarded each other with brotherly affection; if one form of polity, admitting of fraternal correspondence, were embraced by all true Christians; and if the soldiers of the cross presented the appearance of one great army, all trained in the discipline of integrity and truth, all animated by the same spirit, and all displaying a united front to the common foe!

Now the Church is split up into countless sections; her divisions are fitted to make a most unfavourable impression on all who are without; her visible appearance, instead of being an inviting, and instructive, and edifying spectacle, is rather fitted to discourage, to puzzle, and to repel. She is now as a house divided against itself; her most valiant men of war, instead of bearing down with all their might on the enemy, often turn their arms against each other; and thus her energies are frequently expended in the strife of internal discord. No wonder, under these circumstances, that Christianity, in relation to the world lying in wickedness, has been so little aggressive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Framework of the Church. A Treatise on Church Government</cite>, (Edinburgh: T &amp; T Clark, 1890), pp 28-29.</span></figcaption>

<blockquote><p>…I intend not in this relation to set down all things which they [the New England churches] hold or practice in discipline or church-government, but such things only or for the most part, wherein there lies some difference between them and us, or other the best Reformed Churches. Neither do I intend to wrap up all and every one of the elders (much less members) of the New England churches in the same imputations: Forasmuch as it is most certain that though in practice they act generally all alike, yet in their opinion of things practiced, much more in the grounds and reasons thereof, some of them do not only differ from the rest but have stiffly opposed the rest therein, which I write to preserve the just repute of some eminent persons there from such censures and hard opinions as others of them, perhaps, may seem to merit and incur.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…I intend not in this relation to set down all things which they [the New England churches] hold or practice in discipline or church-government, but such things only or for the most part, wherein there lies some difference between them and us, or other the best Reformed Churches. Neither do I intend to wrap up all and every one of the elders (much less members) of the New England churches in the same imputations: Forasmuch as it is most certain that though in practice they act generally all alike, yet in their opinion of things practiced, much more in the grounds and reasons thereof, some of them do not only differ from the rest but have stiffly opposed the rest therein, which I write to preserve the just repute of some eminent persons there from such censures and hard opinions as others of them, perhaps, may seem to merit and incur.”

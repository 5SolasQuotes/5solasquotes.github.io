<main class="wrap"><figure class="quote" id="q-273e5c17f4" data-kw="Jehovah self-existent">
<blockquote><p>God is both a being singular in the highest sense, and in his own nature distinct from every thing whatsoever. He is Jehovah, independent of any other, self-existent—“I am that I am” (Ex. 3:14). Hence he is called simply the being, as the ancient philosophers and Plato especially acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.4.1</span></figcaption>

</figure><figure class="quote" id="q-a243bfa1f6" data-kw="repentance anthropopathism">
<blockquote><p>Repentance is attributed to God after the manner of men (anthrōpopathōs) but must be understood after the manner of God (theoprepōs): not with respect to his counsel, but to the event; not in reference to his will, but to the thing willed; not to affection and internal grief, but to the effect and external work because he does what a penitent man usually does.</p></blockquote>

</figure><figure class="quote" id="q-434f3c8a49" data-kw="eternal life vision">
<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

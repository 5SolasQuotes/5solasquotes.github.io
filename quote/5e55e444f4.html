<main class="wrap"><figure class="quote" id="q-5e55e444f4" data-kw="">
<blockquote><p>Whether God is able to be proved and demonstrated from the light of nature? It is affirmed against the Socinians. Whether one is able to prove the deity most fullly, expeditiously, sufficiently and by a sole rule against atheists and amidst all men whoever they may ultimately be, provided they are not devoid of a reasoning and sane mind, by the revealed facts in the Old and New Testament? It is denied against the Remonstrants. … Whether it is lawful and expedient unto edification to dispute to prove God exists? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, sect. 1, tract 2, I. ‘Of God’, 1. ‘Whether there may be a God?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether God is able to be proved and demonstrated from the light of nature? It is affirmed against the Socinians. Whether one is able to prove the deity most fullly, expeditiously, sufficiently and by a sole rule against atheists and amidst all men whoever they may ultimately be, provided they are not devoid of a reasoning and sane mind, by the revealed facts in the Old and New Testament? It is denied against the Remonstrants. … Whether it is lawful and expedient unto edification to dispute to prove God exists? It is distinguished.”

— Gisbertus Voetius, Syllabus of Theological Problems (Utrecht, 1643), pt. 1, sect. 1, tract 2, I. ‘Of God’, 1. ‘Whether there may be a God?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+God+is+able+to+be+proved+and+demonstrated+from+the+light+of+nature%3F+It+is+affirmed+against+the+Socinians.+Whether+one+is+able+to+prove+the+deity+most+fullly%2C+expeditiously%2C+sufficiently+and+by+a+sole+rule+against+atheists+and+amidst+all+men+whoever+they+may+ultimately+be%2C+provided+they+are+not+devoid+of+a+reasoning+and+sane+mind%2C+by+the+revealed+facts+in+the+Old+and+New+Testament%3F+It+is+denied+against+the+Remonstrants.+%E2%80%A6+Whether+it+is+lawful+and+expedient+unto+edification+to+dispute+to+prove+God+exists%3F+It+is+distinguished.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Syllabus+of+Theological+Problems+%28Utrecht%2C+1643%29%2C+pt.+1%2C+sect.+1%2C+tract+2%2C+I.+%E2%80%98Of+God%E2%80%99%2C+1.+%E2%80%98Whether+there+may+be+a+God%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e55e444f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e55e444f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Whether%20God%20is%20able%20to%20be,prove%20God%20exists%3F%20It%20is%20distinguished&amp;text=Whether%20God%20is%20able%20to%20be%20proved%20and&amp;text=dispute%20to%20prove%20God%20exists%3F%20It%20is%20distinguished" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-77dd121d1c" data-kw="">
<blockquote><p>It also teaches things existing in the world, all of which are from another, to another, or on account of another. For bodies are not sufficient to exist in themselves and lack the power of motion, and those that consist without support and that are born from things unaware of themselves must be astonishing. Nor can spirits, differing entirely from bodies, be produced by either bodies or other finite spirits, and they cannot be satisfied in any created thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, tr. Casey Carmichael in Classic Reformed Theology, vol. 4 (RHB, 2019), Locus 3, ‘On the Existence &amp; Divinity of God’, sect. 1, ‘The Existence of God’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“It also teaches things existing in the world, all of which are from another, to another, or on account of another. For bodies are not sufficient to exist in themselves and lack the power of motion, and those that consist without support and that are born from things unaware of themselves must be astonishing. Nor can spirits, differing entirely from bodies, be produced by either bodies or other finite spirits, and they cannot be satisfied in any created thing.”

— Johann H. Heidegger, The Concise Marrow of Theology tr. Casey Carmichael in Classic Reformed Theology, vol. 4 (RHB, 2019), Locus 3, ‘On the Existence &amp; Divinity of God’, sect. 1, ‘The Existence of God’, p. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+also+teaches+things+existing+in+the+world%2C+all+of+which+are+from+another%2C+to+another%2C+or+on+account+of+another.+For+bodies+are+not+sufficient+to+exist+in+themselves+and+lack+the+power+of+motion%2C+and+those+that+consist+without+support+and+that+are+born+from+things+unaware+of+themselves+must+be+astonishing.+Nor+can+spirits%2C+differing+entirely+from+bodies%2C+be+produced+by+either+bodies+or+other+finite+spirits%2C+and+they+cannot+be+satisfied+in+any+created+thing.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Heidegger%2C+The+Concise+Marrow+of+Theology+tr.+Casey+Carmichael+in+Classic+Reformed+Theology%2C+vol.+4+%28RHB%2C+2019%29%2C+Locus+3%2C+%E2%80%98On+the+Existence+%26+Divinity+of+God%E2%80%99%2C+sect.+1%2C+%E2%80%98The+Existence+of+God%E2%80%99%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F77dd121d1c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/77dd121d1c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=It%20also%20teaches%20things%20existing%20in,be%20satisfied%20in%20any%20created%20thing&amp;text=It%20also%20teaches%20things%20existing%20in%20the%20world&amp;text=they%20cannot%20be%20satisfied%20in%20any%20created%20thing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-56b58094aa" data-kw="">
<blockquote><p>1. There is something which exists 2. Something has existed eternally.

3. Something has been eternally self-existent.

4. What is self-existent must have all the perfections that anywhere exist, or in any subject.

5. What is self-existent must have all possible perfections, and every perfection in an infinite measure.

6. What has all possible perfection, and every perfection in an infinite measure, is God. If I can show that these propositions are founded on certain and evident truth, and that there is a necessary connection between them, the inference I would draw from them is clear and undeniable. … 2. Something has existed eternally… For if something had not always existed, nothing could ever have existed. To suppose any being to begin to exist antecedentaly to all other beings is to suppose it the cause of its own existence, and by necessary consequence to act before it is; but since there can be no operation either in order of time, or of human conception, previous to the subject of it, to say, a thing may act before it is, is in other words to say that a thing may be and may not be at the same time… there cannot be a more express and flaming contradiction.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

ion+%28London%2C+1718%29%2C+vol.+1%2C+bk.+1%2C+%E2%80%98Of+the+Existence+%26+Attributes+of+God%E2%80%99%2C+pt.+1%2C+%E2%80%98Of+the+Existence+of+God%E2%80%99%2C+pp.+11-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56b58094aa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56b58094aa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=1.%20There%20is%20something%20which%20exists,a%20more%20express%20and%20flaming%20contradiction&amp;text=1.%20There%20is%20something%20which%20exists%202.%20Something&amp;text=cannot%20be%20a%20more%20express%20and%20flaming%20contradiction" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dbc2bfaf22" data-kw="">
<blockquote><p>In support, however, of this kind of truth [i.e. of things of faith which cannot be known by reason alone], certain probable arguments must be adduced for the practice and help of the faithful, but not for the conviction of our opponents, because the very insufficiency of these arguments would rather confirm them in their error if they thought that we assented to the truth of faith on account of such weak reasonings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 9</span></figcaption>

</figure><figure class="quote" id="q-334c77873e" data-kw="">
<blockquote><p>…there is more than one way in which a thing is said in the heart or conceived. For, in one sense, an object is conceived, when the word signifying it is conceived; and in another, when the very entity, which the object is, is understood. In the former sense, then, God can be conceived not to exist; but in the latter, not at all. For no one who understands what fire and water are can conceived fire to be water, in accordance with the nature of the facts themselves, although this is possible according to the words. So then, no one who understands what God is can conceive that God does not exist; although he says these words in his heart, either without any or with some foreign signification. For, God is that than which a greater cannot be conceived. And he who thoroughly understands this, assuredly understands that this being so truly exists, that not even in concept can it be non-existent. Therefore, he who understans that God so exists, cannot conceive that he does not exist. I thank thee, gracious Lord, I thank thee; because what I formerly believed by thy bounty, I now so understand by thine illumination, that if I were unwilling to believe that thou does exist, I should not be able not to understand this to be true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), ch. 4, p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

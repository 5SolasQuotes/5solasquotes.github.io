<main class="wrap"><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (1637), p. 420</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db30a8cf5e" data-kw="">
<blockquote><p>True worship of God may be defined generally thus: Worship of God is the true honor shown to God from a sense of his kindness and power towards us, as resulting from his Word. But this honor is not civil, but divine and religious and is seated mainly in the heart and mind. Thus worship arises from the sense of God’s power and kindness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Isagogue</cite>, p. 110, as quoted in Heinrich Heppe, Reformed Dogmatics, ch. 1, section 8, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“True worship of God may be defined generally thus: Worship of God is the true honor shown to God from a sense of his kindness and power towards us, as resulting from his Word. But this honor is not civil, but divine and religious and is seated mainly in the heart and mind. Thus worship arises from the sense of God’s power and kindness.”

</figure><figure class="quote" id="q-447a4bfa17" data-kw="">
<blockquote><p>Too high an estimation of any peculiar way of worship is apt to entice the minds of some into a hurtful confidence in these things. Having an apprehension that they alone have attained unto the right way of gospel worship and the administration of its ordinances, and that, perhaps, on such accounts as wherein they are eminently deceived, they begin first greatly to value themselves, and then to despise all others, and, if they can, to persecute them. This insensibly works them into a trust in that which they esteem so excellent, and that unto an open neglect of things of a greater weight and moment. Thus is it not unusual to see persons who are under the power of some singular opinion and practice in religion to make one thing almost their whole business, the measure of other things and persons, the rule of communion and of all sincere love;—to value and esteem themselves and others according unto their embracing or not embracing of that opinion… Wherefore, although we ought greatly to prize and to endeavour after the true order of the church of Christ, the purity of worship, and regular administration of ordinances, yet let us take heed that we prize not ourselves too much on what we have attained; for if we do so, we shall be very apt to countenance ourselves in other neglects thereby, which will certainly bring us into a spiritual sickness and declension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, (NY: Robert Carter, 1852), vol. 7, Nature &amp; Causes of Apostasy from the Gospel, ch. 12, pp. 252-53</span></figcaption>

17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=Too%20high%20an%20estimation%20of%20any,into%20a%20spiritual%20sickness%20and%20declension&amp;text=Too%20high%20an%20estimation%20of%20any%20peculiar%20way&amp;text=bring%20us%20into%20a%20spiritual%20sickness%20and%20declension" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ee9c14edcf" data-kw="">
<blockquote><p>Herein it [the 2nd Commandment] differs from the First Commandment, that commanded the worship of God which is natural, this the worship which is by divine institution. Downame Sum of Divinity. Cultus naturalis [natural worship] is that which nature directs all people to, or which arises from the nature of God. This belongs to all reasonable creatures. He that acknowledges there is a God, will acknowledge that He is to be be believed, feared, trusted, loved and prayed to: this was performed by Adam in Paradise and by the angels in Heaven, Isa. 6:3; Heb. 1:6. Cultus institutus, ‘instituted worship’ depends on the revelation of the will of God, this was commanded Adam in his innocency, as the Tree of Knowledge of Good and Evil, and the Tree of Life show. Natural worship is the chief, instituted worship may be interrupted. A time of worship is juris naturalis [of the law of nature], the seventh day juris positivi [of positive law]. Some in these days say all institutions are mere forms, and men may use or not use them at their pleasure according to their light: Qui non est religiosus non est Christianus. Cultus institutus est medium ex Dei voluntate ordinatum, ad cultum naturalem exercendum et pro nov•ndum. indica•tur hujusmodi media omnia à Deo instituta, in secundò praecepto per prohibitionem oppositorum mediorum omnium cultus ab hominibus excogitatorum, sub titulo sculptilis et imaginis, que cum praecipua fuerunt olim▪ hominum inventa, cultum Dei depravantia, aptissimè proponuntur (per Syn••dochen in Decalogo praecipuam) loco omnium humani ingenii commentorum ad cu••um spectantium. Ames, Marrow of Theology, bk. 2, ch. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: A.M., 1654), bk. 9, ch. 3, ‘2nd Commandment’, p. 767 margin note on Dt., 4:15-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-a8a43c2c29" data-kw="">
<blockquote><p>To worship is to give to anyone the honor due unto him: So the rendering unto God that love, that fear, that service, that honor which is due unto him is the worshipping of God, that’s the Scripture definition, Ps. 29:2, ‘Give unto the Lord the honor due unto his name;’ then follows by way of exposition, ‘Worship the Lord in the beauty of holiness,’ that is, in his holy Temple, in his beautiful sanctuary, or in the comely honor of his sanctuary. So that worship is the tendering of honor to the Lord, in a way honorable to Him, namely according to his own will and laws of worship: which is intimated by coming to worship Him in his beautiful sanctuary, where all things about the service of God were exactly prescribed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London [1643]), Job 1:13-14, pp. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“To worship is to give to anyone the honor due unto him: So the rendering unto God that love, that fear, that service, that honor which is due unto him is the worshipping of God, that’s the Scripture definition, Ps. 29:2, ‘Give unto the Lord the honor due unto his name;’ then follows by way of exposition, ‘Worship the Lord in the beauty of holiness,’ that is, in his holy Temple, in his beautiful sanctuary, or in the comely honor of his sanctuary. So that worship is the tendering of honor to the Lord, in a way honorable to Him, namely according to his own will and laws of worship: which is intimated by coming to worship Him in his beautiful sanctuary, where all things about the service of God were exactly prescribed by God.”

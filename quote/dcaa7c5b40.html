<main class="wrap"><figure class="quote" id="q-dcaa7c5b40" data-kw="">
<blockquote><p>First, It is of great consequence to have this Doctrine kept pure. Luther called it Articulus stantis aut cadentis Ecclesiae, as if this were the soul and pillar of Christianity. Pighius, though a Papist, calleth this the chief part of Christian Doctrine, confessing that it had been obscured rather then cleared by their own Writers: yea, this Doctrine about Justification is that which discerneth the Orthodox from Pagans, Papists, Socinians and Arminians.

Now there are divers reasons why we should keep the Philistines from throwing in earth to stop up this pleasant spring: As 1. because herein is the grace and good favour of God especially revealed. Therefore the Gospel is called glorious, because God did not so much exalt, and manifest his excellency in creating the world, as he did in providing of a Saviour, and pardon for a poor sinner: Hence it’s called the riches of his grace, rather then of power or righteousness.

We are therefore solicitous (whatsoever the Antinomians say to the contrary) that the doctrine of God’s grace in Justification may be fully improved to the uttermost, and that every broken heart may be put into a ravishment and admiration of it. We bewail those times of Popery, when the name and efficacy of Christ and his Grace, were obscured by the works and pretended righteousness of men.

2. It is very necessary to keep this pure, because of the manifold truths that must fall if this fall; if you err in this, the whole truth about Original sin, Free-will, and Obligation of the Law will likewise perish.

3. It is of great influence into practice; for what doth the heart smitten for sin, and filled with the displeasure of God, but run to this Doctrine, as the City of refuge? This is the water that their souls pant after, this is the bread that their fainting stomachs would gladly feed on: now if this water be turned into mud, if this bread be made into stones by the corrupt Doctrines of men, how must the soul perish for want of sustenance?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 3-4.</span></figcaption>

<blockquote><p>It is one thing to speak of the merit of the person, another of the merit of the work; and again, one thing to speak of eternal life as it is an inheritance, another as it is a reward, wages, a prize. For from the fact that someone is a son of God by grace, he merits ex condigno the inheritance of eternal life without any other pact, but by the merit of the person, not by the merit of the work.</p></blockquote>

</figure><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>

</figure><figure class="quote" id="q-f1ffe7d20c" data-kw="">
<blockquote><p>Whereof to make some good use to our selves, we may note and mark first, the truth of God’s promise made to Abraham in the 15. of Gen. when he bad him look up to the stars of heaven, and number them, if he could, assuring him then, that even so would he make his posterity and offspring a mighty people, and a great kindred, which we all see here was fulfilled. So assuredly true are all other of Gods promises, and therefore think of what you will, your faith and comfort shall not fail you. That sweet promise, that, at what time soever a sinner repenteth truly of his sins, God in mercy will forgive him, it shall never fail. He may as soon cease to be God, as cease to be true in any thing which he hath spoken.

And for this particular he hath not only spoken it, but sworn it, that, as he liveth he will not the death of any true penitent and sorrowful sinner. We may not therefore do him wrong, and doubt of it. It is no pride to take fast hold of this word, but it is duty due from us to confess his truth, and to be thankful. An other promise he hath made to us, that, if we seek the kingdom and the righteousness thereof, these worldly wants of ours shall ever be supplied, as shall be fit and good for us. This also will he as assuredly keep, as he is God, to the great quietness of our hearts, if we will believe him.

In a word, that promise of all promises, that, if we believe in his Son, we shall never perish, but have eternal life, he will perform. So, both for this life, and that to come, we have his word: and, no more than he failed Abraham in multiplying his seed, will he fail us in any promise. Only his time we must tarry, and hasty minds learn humble patience. He knoweth when is best both for him, and us. Tarry he may, but come he will. Never untruth passed from him, never any that believed in him was disappointed of his hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), pp 3-4.</span></figcaption>

<blockquote><p>Ought it not be a terror to us, to cut off a lap of Christ’s garment, or clip it so short, as to think that it cannot cover us completely, without some rags of our own rotten righteousness sewed into it? Again, it is this legal principle, that makes believers themselves think it cannot be that they are accepted as righteous, perfectly righteous in the sight of God, through the righteousness of Christ imputed; why, because they want a feeling of that righteousness in themselves, which the legal heart is ready to make the foundation of pardon and acceptance: But as Luther said, we must not feel, but believe, that we are thus righteous; yea, it is his hidden principle of self righteousness, that will make a minister preach Christ alone for righteousness, as if he were as much for exalting Christ, as any that ever preached; and yet, before ever you know well where you are, you will find him bringing in some legal duty of qualification, in order to your being justified.</p></blockquote>

<blockquote><p>Parishioner: Although I admit, sir, that man is depraved, yet I have been inclined to believe that he was not entirely disabled to do good. I have supposed that his moral and not his natural faculties were affected by the fall, and hence that his inability referred merely to the will, and was manifested in his indisposition to receive the gospel. And the reference of Scripture appears to be to this kind of inability, when it is said, “we are made willing in the day of God’s power,” [Ps. 110] and in that other passage “ye will not come unto Me that ye may have life.” [John 5] Do not these passages imply that a sinner possess a natural, but not a moral ability to believe, and that he can if he will repent? Pastor: If the distinction between natural and moral ability contemplates no more than this, that in our natural condition, we possess all the faculties of mind, which a regenerated man employs in the service of God, I am ready to admit it. The same natural faculties characterize both the regenerate and the unregenerate, and the work of the Spirit on the mind does not increase the number of these faculties. But if the distinction implies that these natural faculties are not disabled by the fall, this I deny, as being contrary to fact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-engles.html">William Engles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Caution Against Prevailing Errors, Being a Conversation Between a Presbyterian and his Parishoner’, p. 23, being p. 25 of Presbyterian Tracts, vol. 2. The fuller title of the book this tract is contained in is: A Series of Tracts on the Doctrines, Order and Polity of the Presbyterian Church in the United States of America Embracing Several on Practical Subjects, vol. 2. This series of tracts was printed by the Presbyterian Board of Publication and includes tracts in it by Archibald Alexander, William Symington, Samuel Miller, Jonathan Edwards, Samuel Davies and others.</cite></span></figcaption>

<blockquote><p>God has implanted two accounts [rationes] in the first matter, namely, causal or obediential principles whereby all things are naturally apt to obey God, such that whatever might please him would come to be from them. He has also implanted seedlike principles—that is, active principles whereby natural effects are brought about; and he is sometimes said to act contrary to these in the miracles that he performs. But properly speaking, even then he does not act contrary to them, but alongside them, or above them. He acts above them when he brings about an effect to which nature can in no way reach, like the form of glory for the glorified bodies. He acts alongside them when he produces without the service of natural causes an effect that nature can bring about, like when in John 2 he converts water into wine. But he does not act contrary to them, since he does not make it that an active natural cause, while remaining the same in species, has a different essential effect, such as that a fire, while remaining a fire, might cool something, just as it cannot simultaneously be the same thing and different. But he can indeed destroy one nature and make another, remove one form from matter and induce another; for in this way fire acts contrary to the nature of air when it corrupts it.</p></blockquote>

<blockquote><p>5. Augustine professes, bk. 1, De Gen. contr. Manich., ch. 3, that all men may believe if they will, and justifies it in his Retractations. But if the will of man be corrupt, and averse from believing, we justly say such a man cannot believe, as our Savior says, ‘How can you believe that receive honor one of another, and seek not the honor that comes of God alone.’ Jn. 5:44 Yet this is an impotency moral only, which is to be distinguished from impotency natural. For notwithstanding this, it may be truly said that, All men may believe if they will, and herein consists the natural liberty of the will. The moral liberty consists, rather in a sanctified inclination unto that which is good, whereby it is freed from the power of sin and Satan; then in a power to do good if they will, and not otherwise. But I never find that Arminians do distinguish these.</p></blockquote>

<blockquote><p>All the Reformed exclude from free choice a natural necessity, by which man is by his own nature determined to the thing he wills, as for example the sun, to shine, but nevertheless they admit the necessity: of dependence upon God, as the first cause; of infallibility, from the eternal decree; of predetermination, from governing providence; of slavery, from sin.</p></blockquote>

</figure><figure class="quote" id="q-2e40be86f2" data-kw="">
<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations. 4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”] 5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>

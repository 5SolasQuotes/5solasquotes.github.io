<main class="wrap"><figure class="quote" id="q-6e8bda2314" data-kw="">
<blockquote><p>Evangelicals responded similarly to the Scottish cholera epidemic of 1832, organizing weekly, and even nightly, prayer meetings in the hope of arresting the advance of the disease. These meetings supplemented the fast days called by the government at the request of the Church of Scotland… As a result, Evangelicals also saw these public prayer meetings as a suitable context in which to ask God to send religious revival. This latter purpose prevailed after the threat of the epidemic passed away, at least among groups in the parish of Kilsyth, which continued to meet during the remainder of the 1830’s, asking God ‘to awaken a spirit of earnest and vital religion among them, and throughout the Christian Church generally’ .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-alan-currie.html">David Alan Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Growth of Evangelicalism in the Church of Scotland</cite>, 1793-1843 PhD diss. (Univ. of St. Andrews, 1991)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-833ea0c68f" data-kw="">
<blockquote><p>They that shall adventure to bring into the city and to sell things forbidden are worthily to be punished with the loss of the things themselves. The same punishment is to be laid upon the buyers, if they yet now have with them the things whole and untouched: otherwise let the punishment be equal unto the price of the things. He that is found selling of profitable things, as meats or drinks, in any other place than in the place appointed, let him bear the loss of all that he sets to sale. Whosoever of his own private authority shall covetously increase the price of things sellable above that [which] is reasonable or above the appointed rate, let him be under the punishment of unlawful usuries, and for a time forbidden to occupy any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, (London, 1583), bk. 2, ch. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-3914f57ffb" data-kw="">
<blockquote><p>…hereafter provision must be made for spiritual ministers, who may instruct the sick in faith towards God, and comfort them up with hope of salvation, and take care of their souls, whom the Preservers [specially appointed civil officials for the plague] shall so choose in every parish, that they take not to so weighty a matter, whosoever comes first to hand, but such as they shall have known to be singularly given unto godliness, holiness, sobriety, and chastity… But if, peradventure, there can no such be found among the ordinary ministers, out of the rest of the people there must be chosen such, which come unto the next degrees of the foresaid virtues. For in this miserable time the things of most perfection come not always to be had. Therefore, as they say, ‘As we can, when as we would we may not.’ When such at length are chosen, whom the Preservers shall have judged meet and sufficient for every parish, it may not by any means be suffered that they go to any other than such as being taken with the plague, require their help. For I have said before, and say still, that not only the outward and common infectious air, but also contagious breaths and infectious breathings, or blowings, which are gathered and afterwards imparted to the whole: and others that are sick by the keepers, by such as sit by them, by the ministers of the church going hither and thither and standing by the infected, yea many times also by them that are dead, ought specially to be avoided. Which thing, when as by daily experience we are taught, and have proved also unto us to be true, by all means we have to take heed, lest that we leave the cause of this so great a disease in others, whom with all diligence we have, for fear of infection, put apart. Hereunto you may add, which we have oftentimes no less experience of, that many sick persons also (I speak not of such as are infected with the plague), albeit they be not infected with the company of such ministers, yet they will nevertheless refuse their presence for fear of the infection. Whereupon also this inconvenience will arise, yet they had rather receive never so simple comfort at the hands either of some of their own household, who for the most part are unmeet for this purpose, or else die alone than to undergo a double mischief…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, … (London, 1583), bk. 1, ch. 5, ‘Of the Ministers of the Church’, pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

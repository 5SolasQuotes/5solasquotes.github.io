<main class="wrap"><figure class="quote" id="q-8d5cf3a7cf" data-kw="Spirit of both Filioque">
<blockquote><p>Scripture teaches that the Spirit proceeds from both the Father and the Son, in passages where He is called the Spirit of both. In Romans 8:9, He is called both the Spirit of God and the Spirit of Christ in the same verse. The Spirit is said to be sent by both the Father and the Son (John 15:26): &quot;The Comforter, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father.&quot; And in John 16:14: &quot;He will take what is mine and declare it to you.&quot; Reason also supports this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXVII</span></figcaption>

</figure><figure class="quote" id="q-d8a938995a" data-kw="Spirit proceeds Filioque deity">
<blockquote><p>The Holy Spirit proceeds from the Father and the Son, and the reason is that He is called the Spirit of the Son in Galatians 4:6 and Romans 8. He who is called the Spirit of God is the same who is also called the Spirit of Christ. The second reason is that He is so the Spirit of the Son that He is sent by the Son (John 16:7, 14). But if one is sent, he is sent either by authority, or by counsel, or by natural production. He is not sent by authority, since He is God; nor by counsel, since He is also God—for one who is such is instructed by one wiser than himself. Therefore He is sent by natural procession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputations on the Holy Spirit</cite>, II</span></figcaption>

</figure><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 8, “The Holy Spirit”</span></figcaption>

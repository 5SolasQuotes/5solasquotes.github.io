<blockquote><p>Augustine following the Word says all of Jews and Gentiles in covenant are the visible Church. (Augustine, de Unit. Eccles., ch. 6 &amp; 7, ‘Quid in prophetis quā multa, &amp; quam manifesta sunt testimonia ecclesiae per omnes Gentes toto orbe terrarum diffusae?’ Ch. 5, ‘Quare (O Donatistae) vos irritum facitis testamentum Dei, dicendo, nec in omnibus Gentibus completum esse, &amp; periisse jam de Gentibus, in quibus erat semen Abrahae?’</p></blockquote>

</figure><figure class="quote" id="q-f5a2ff4eef" data-kw="">
<blockquote><p>3. We must hold that the Covenant of Grace, though it take not away the obligation of the Law, yet it takes away the rigor, or severity and terribleness of that obligation. For though it set before our eyes an universal perfection of righteousness, as to be affected and endeavored to our utmost strength, yet does it not strictly and precisely require it on the pain of eternal damnation. Indeed to a certain measure of obedience, to wit, such as by ordinary grace is possible, it does strictly and precisely oblige us, that is, on pain of eternal damnation, requiring that we actually have it. But to a farther measure, which by the power of ordinary grace we cannot attain, it obliges us less strictly, to wit, requiring that we have it in desire and endeavor, v.g. to the perfection of parts, as they call it, it obliges precisely: For it does no otherwise promise eternal life, but on this condition, that we actually have this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on Mortal &amp; Venial Sin, pp. 24-25 in Richard Baxter, Richard Baxter’s Confession (1655), ch. 10, sect. 3</cite>, p. 401</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-a185c24136" data-kw="">
<blockquote><p>Thus on the basis of the ecumenical Creeds the Reformers outline a doctrine of the ecumenical Church, laying stress on the avoidance of schism where the Word and scriptural sacraments are honored. In all this they were profoundly indebted to the Church Fathes. They were also in a large sense the heirs of the Conciliarists, who demanded that ecclesiastical authority be representative. Conciliarism was a frustrated revolution; but its principle remained in many minds, both as a potential danger to papal claims and as a potential influence in doctrine and polity in an age of reform. The Conciliarist emphasis upon the Headship of Christ was renewed in the Reformation. It was, of course, a doctrine derived from Scripture and employed by the Fathers. (Tota ecclesia ejus, quae ubique diffusa est, cujus est ipse caput. Augustine, Enarratio in Psalmos, lii, Sermo 2. CF. lxv, Sermo 1) But the doctrine is rather assumed than strongly emphasized by the Fathers, while it is frequently stressed by the Conciliarists, and constantly affirmed in Reformation statements. It was a doctrinal basis of attack upon the headship claimed by the Pope. The word-wide Church of which Christ is Head could, said the Conciliarists, through its representatives in a council, restrain or depose a Pope. No human monarch of the Church, said the Reformers, was either necessary for government or authorized in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/medieval-precedent.html">Medieval Precedent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967)</cite>, pp. 32-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-e8163bee18" data-kw="">
<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-wendelin.html">Francis Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology, bk. 1, ch. 19, pp. 395-96 in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3</cite>, p. 402</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b7a08b602c" data-kw="">
<blockquote><p>18. That imputation of the righteousness of Christ is neither fictitious, nor ideal, nor absurd; nor does it overthrow the δικαιοκρισία [dikaiokrisia, righteous judgment] of God, nor does it clash with human reason or practice. Nay, it is established by the Pontificals themselves through the trafficking of papal indulgences and the market of satisfactions and pardons, where the λογισμός [logismos, reckoning/imputation] and communication of another’s righteousness — albeit fictitious — is manifestly taught. It is no wonder, however, that the imputation of the righteousness of Christ is denied and opposed in this matter by those who neither know nor feel the union of ourselves with Christ and the power and efficacy thereof, and who prefer the means of salvation to be profitable to themselves [as independent workers] rather than gratuitous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04a4146caa" data-kw="">
<blockquote><p>It is a clear case, that these three [belief, fear and love] are the only means, yea a perfectly sufficient means to make the solder and the union between God and man, and to bring a man to the possession and fruition of God (for this comprehends the whole man), so that the whole man is possessed of God, and inflamed by God, when his understanding knows Him, and sees the excellency that is in Him, and when the affections of his heart cleave to Him, and close with the most sovereign affections of fear and love, and then when all his whole man is at the command of this, etc.</p></blockquote>

</figure><figure class="quote" id="q-9def8be007" data-kw="">
<blockquote><p>To be justified means more than to be declared “not guilty.” It actually means to be declared righteous before God. It means God has imputed or charged the guilt of our sin to His Son, Jesus Christ, and has imputed or credited Christ’s righteousness to us.</p></blockquote>

</figure><figure class="quote" id="q-efe1da18ef" data-kw="">
<blockquote><p>XIV… “And so that you may do this, we must distinguish between passive and active justification. In passive justification, we are persuaded that we are justified by God, or from it we conclude that we are justified by God. In this way it certainly can be said that we are justified by faith as an instrument, insofar as in the practical syllogism, by means of which we conclude that we are infallibly justified, faith stands as the middle term: “The one who believes is justified; I believe; therefore, I am justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, sect. 14, ‘How faith influences justification: How it does not influence’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-739f9ec4ab" data-kw="">
<blockquote><p>18th Objection [by Osiander]: Christ has brought us eternal justice. This applied justice is not eternal: Therefore this is not our justice, but God Himself is our justice. Answer: The Lord is our justice, that is, our Justifier. But that our applied justice is eternal, has been showed before; because the imputation thereof is continued to all eternity. That justice also of the Law which is begun in us in this life, shall be continued, and perfected in the life to come. But that justice which is God Himself is not in us: because so God should be an accident to his creature, and become justice in man. For justice and virtue are things created in us, not the essence of God. Moreover Osiander, who obiects this, does not discern the cause from the effect. As we live not, or are wise by the essence of God (for this is all one, as to say, that we are as wise as God) so also we are not just by the essence of God. Wherefore nothing is more impious than to say that the essential justice of the Creator is the justice of the creatures: for thereof it would follow, that we have the justice of God, yea the very essence of God. The cause must be discerned from the effect, increate iustice from created justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’</cite>, p. 691</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<main class="wrap"><figure class="quote" id="q-acbf53f3f1" data-kw="">
<blockquote><p>Fallen, sinful man stands in need of the utmost encouragement that divine condescension can extend unto, to prevail with him to receive and lay hold of the promise of grace and mercy by Jesus Christ. There is nothing that we are so prone unto, as to distrust the promises of God; nothing that we are with more difficulty won over unto, than to mix them with faith. To evidence this we may consider,— 1. That the first entrance of sinto the world was by a disbelief of the truth of God; yea, that very sin formally consisted in an apprehension that God, in his promises and threatenings, had a mind to deceive us, Gen. 3:4–6. And as sin thus laid its foundation by the craft of Satan, so it endeavours to carry on its building. It continually suggests to the hearts and minds of men that they shall certainly be deceived in trusting to God’s promises. For,— (1.) Secret thoughts there are in the hearts of men,—which are “deceitful above all things, and desperately wicked,”—that neither the promises nor threatenings of God are true, in the terms and sense wherein they are proposed unto them. They neither think that it shall be so bad with any as he threateneth, nor so well as he promiseth. Did men believe the threatenings of God as to the fearful and eternal ruin of sinners, it were not possible they should live in sin as they do, without any endeavour of amendment, so to flee from the wrath to come. Nor do they think in their hearts that it shall be with them that believe according as God hath promised. They say in their hearts, “The Lord will not do good, neither will he do evil,” Zeph. 1:12,—namely, as he hath either promised or threatened. (2.) Men think that there are still some reserves and latent conditions in the promises and threatenings of God, and that God knows it shall be otherwise than they seem to portend. By this imagination Satan deceived our first parents as to the truth of God in his threatening. He persuaded them that there was a reserve therein, that was directly contrary unto what the words of it declared; and that by transgressing of his command they should not die, but be wise and like himself. And still men suppose that the promises propose a fair ground, indeed, but that if they should go to build upon it, there is a mine under it, which would be sprung at one time or another, unto their ruin. They cannot apprehend that it shall be with them according unto and as the promise doth declare. If they should attempt to believe, yet one latent condition or other would defeat them of obtaining it; whereas, indeed, the whole and entire condition of enjoying the promise is faith alone. (3.) Whatever may be the truth of the promise, yet they cannot conceive that God intends them therein; whereas yet there is no declaration or intention of God, whereby our duty is to be regulated and whereon we shall be judged, but what is contained and expressed in the proposal of the promise itself. On these and the like grounds, the great contest in the world, between God and man, is whether God be true or a liar in his promise. It is not thus directly stated in the minds of men, for they have many other pretences why they do not believe; but this is that which it is resolved into. For “he that receiveth not the testimony of God, maketh him a liar.</p></blockquote>

<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mr-smallwood.html">Mr. Smallwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations</cite>, 3rd ed. (1658) As the end of the quote demonstrates, Smallwood is speaking of conversion. | Song 5:2 – “…it is the voice of my beloved that knocketh, saying, Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, and my locks with the drops of the night.”</span></figcaption>

<blockquote><p>Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, ... (London: E.G., 1641), on 2 Pet. 1:10-11, p. 164</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.”

</figure><figure class="quote" id="q-f0de67ec8a" data-kw="">
<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Words of Advice to Young Men delivered in Two Sermons</cite>, … (London: Parkhurst, 1668), sermon 1, sect. 5, pp. 25-26</span></figcaption>

<blockquote><p>Nebuchadnezzar… was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven… And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation. And all the inhabitants of the earth are reputed as nothing: and He doeth according to his will in the army of heaven, and among the inhabitants of the earth… At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-142dc16efd" data-kw="">
<blockquote><p>Further, the law of God regarding the true sanctification of religious days singularly consecrated to God will have to be restored (Ex. 31:12-27; 35:2-3; Num. 15:32-36).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6867dcfd5e" data-kw="">
<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved:

1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law.

2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock.

3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters</cite>, (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved:

1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law.

</figure><figure class="quote" id="q-ad4eab2bd8" data-kw="">

</figure><figure class="quote" id="q-d06e37b0a5" data-kw="">
<blockquote><p>…these were to be offered continually as a burnt offering upon the altar, which law was not to take place until they came into the [Promised] Land, as we heard before in the like case, [Num.] ch. 15:2, because in the desert they wanted many things necessary, Dt. 12:8, which was a sufficient dispensation for the omitting of them: For when God does require anything, He gives means to perform it; and did never impute it as a sin unto them when an inevitable necessity did hinder them, and the desire to obey is no less accepted than obedience itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London: 1618), on Num. 28, v. 6, p. 1137</span></figcaption>

</figure><figure class="quote" id="q-9fcc17b889" data-kw="">
<blockquote><p>But as far as the law itself is concerned, ‘You will not make for yourself a graven image, nor any likeness of anything under heaven above, etc.’ the Lord forbids two things: the one, that they be made; the other, that they be worshipped. Nevertheless this was not imposed on concsciences except by reason of divine worship, namely lest they be made with this goal in mind, and lest those things that have been fashioned be adored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, p. 486</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

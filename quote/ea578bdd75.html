<blockquote><p>It is lawful, but is it wise? Is God’s wisdom simply a form of law? What are the differences between law and wisdom in the Bible, and what is their relationship to each other? These are some of the questions to ponder when reading Scripture. Consider, for example, Psalm 119:97-98, which identifies God’s law making the psalmist wiser than his enemies; or Psalm 111:10 (repeated in Proverbs 9:10) that teaches the fear of the Lord is the beginning of wisdom. Besides the fact that wisdom and law are closely related to each other because God is their source, there are differences between them. Wisdom sayings and admonitions are not law commands per se, although keeping God’s law is surely wise. Mostly, we prefer laws since they tell us what to do. Wisdom, on the other hand, takes more effort, so we tend to shy away from learning how the world works and the reasons, benefits, and purposes of living wisely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Wisdom Versus Law—What’s the Difference?”</cite>, October 14, 2022</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>If any man before the time prescribed shall go out of his house without license and thrust himself into the company of others, he shall be bound to begin afresh the time of shutting in and be punished beside[s] with an arbitrary [appointed] punishment. But if the same part being infected before and yet scarce well recovered, or but meetly recovered, shall adventure to do the like, he is to be accused of great unthankfulness and to be deprived of all benefits usual to be done unto him, and besides [this] to be restrained with [a] longer keeping in. But if being now in very deed infected with the plague, he shall be found to have committed this heinous offence upon notorious and wicked boldness, as a murderer after the loss of his goods [being set to die and having nothing further to lose], if he be without children, let him be delivered over unto the hangman.</p></blockquote>

r%20unto%20the%20hangman" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now then, so many ways and no more as a thing may be known to come from God with an intention to oblige all perpetually, a thing may be said to be of an unalterable divine right; and those can be no more than these two: either by the Law of Nature, or by some positive Law of God. Nothing else can bind universally and perpetually but one of these two, or by virtue of them, as shall be made appear. I begin with the Law of Nature. The Law of Nature binds indispensably, as it depends not upon any arbitrary constitutions, but is founded upon the intrinsical nature of good and evil in the things themselves, antecedently to any positive declaration of God’s will. So that till the nature of good and evil be changed, that Law is unalterable as to its obligation. When I say the Law of Nature is indispensable, my meaning is, that in those things which immediately flow from that Law by way of precept, as the three first Commands of the Moral Law, no man can by any positive law be exempted from his obligation to do them, neither by any abrogation of the laws themselves, nor by derogation from them, nor interpretation of them, nor change in the object, matter, or circumstance whatsoever it be. Now although the formal reason of man’s obedience to the precepts of this Law be the conformity which the things commanded have to the divine nature and goodness, yet I conceive the efficient cause of man’s obligation to these things is to be fetched from the will, command and pleasure of God: Not as it is taken for an arbitrary positive will, but as it is executive of divine purposes, and as it engraves such a Law upon the hearts of men. For notwithstanding man’s reason, considered in itself, be the chiefest instrument of discovery what are these necessary duties of human nature (in which sense Aristotle defines a natural law to be that which [Greek] has everywhere the same force and strength (Ethics, bk. 5, ch. 10), i.e. as Andronicus Rhodius very well interprets it, [Greek], among all that have the free use of their reason and faculties), yet I say it is not bare reason which binds men to the doing of those things commanded in that Law, but as it is expressive of an eternal Law, and deduces its obligation from thence. And so this Law, if we respect the rise, extent and immutability of it, may be called deservedly the Law of Nature (V. Selden, De jure Nat. apud▪ Ebrae, bk. 1, ch. 7-8); but if we look at the emanation, efflux and original of it, it is a divine Law, and so it is called by Molina, Alphonsus à Castr••, and others (Mol., De Just et Jur., p. 1, Disputation 3; Alphons., De leg. pur▪, bk. 2, ch. 14). For the sanction of this Law of Nature, as well as others, depends upon the will of God, and therefore the obligation must come from Him, it being in the power of no other to punish for the breach of a law, but those who had the legislative power to cause the obligation to it. It appears then from hence that whatever by just consequence can be deduced from the preceptive Law of Nature, is of divine right, because from the very nature of that Law (it being indispensable), it appears that God had an intent to oblige all persons in the world by it.</p></blockquote>

<blockquote><p>There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.</p></blockquote>

<blockquote><p>Doct. 3. Christ underwent this death by his Father’s command.

It is in the Text; This command I received of my Father. And this command was neither any of the law of nature, nor of the moral, ceremonial, or judicial; but it was a peculiar condition of the mediatory office, that was laid upon Christ by the Father, and of his own free consent. It was therefore a command to the Messias alone, as he was our Mediator.

Reas. 1. Because as by disobedience of the first Adam sin and death entered into the world; so by the obedience of the second Adam, righteousness and salvation should be brought us; and as the disobedience of Adam was the breach of the command given to him; so also the obedience of Christ, was to be in the keeping of that command that was given him with his office of mediatorship, or whereby the office it self was also imposed upon him.

Reas. 2. Because in Christ we were to have such an example of obedience, as was most perfect in keeping the commandments of God.

Use 1. Of Refutation against the superstition &amp; presumption of popish Monks, who have devised a kind of perfection in obedience of councils, beside and beyond that, which stands in keeping of the commandments of God; when yet Christ himself, that hath given us the whole portrait and pattern of perfect obedience, confesses, that he went no further than to obey that, which the Father commanded him.

Use 2. Of Admonition, that we may set our selves to follow Christ in this point, that we may even unto death it self, cleave fast unto the commandments of God.

Doct. 4. God the Father loveth Christ for this obedience.

This is in the Text; Therefore the Father loveth me; that is, is delighted with this obedience, and so delighted, that he commends it to be looked upon by every Christian, and all such as are Christ’s.

Reas. 1. Because by Christ’s death, God was most glorified by Christ, Joh. 12. 18. and 17. 4.

Reas. 2. Because by that death of Christ, the counsel of God was fulfilled, whereby he had from eternity appointed in himself to communicate his grace and glorious good will unto men, Ephes. 1. 5, 6, 7, 9.

Use 1. Of Refutation, against such as use to conclude from such phrases, whereby God is said to love men for this, and not for that; that such men’s works were the first causes of God’s love. For Christ was the Son of God beloved of him from all eternity; and yet the Father is said to have loved him also for his obedience.

Use 2. Of Consolation, to all such as are in Christ by Faith. For as the Father loveth Christ, so will he also love them, that are in Christ.

Use 3. Of Exhortation, that with all cheerfulness we stir up our selves to obey God; because God loveth such as obey him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XVI, pp 115-16.</span></figcaption>

<blockquote><p>The Westminster divine, Stephen Marshall, helpfully distinguishes between what a civil magistrate may and may not do in coercing his subjects to support true religion. He argues that while the magistrate cannot convert anyone with the sword, nevertheless, he can compel his subjects to attend public worship:

Nor do I find a warrant for Magistrates to compel any to profession of truth, Psal. 110. His people a willing people. To Order what men shall believe, is to exercise Dominion over men’s Consciences: It is One thing to cause the people to attend the means, and another to make them believe the truth, the first they must do, but not the second: Faith is God’s gift. It is one thing to hinder Idolatry and blasphemy spreading, another thing to make people renounce an opinion, and embrace the truth. …

They may Command and Order the people to come and attend upon the Ministry of the Word, as the means instituted by Christ for their instruction to salvation. It is one thing to order them what they shall believe, another thing to order them to wait upon the means. All grant the civil Magistrate may call public Assemblies, to hear their Proclamations, and Statutes, &amp;c. read: if they may call a whole Town to hear a Law, then much more may they call them to hear God’s Laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The power of the magistrate in matters of religion, vindicated. The extent of his power determined. In a sermon preached before parliament on a monthly fast day</cite>, (London, 1657), pp 5, 7-8.</span></figcaption>

<blockquote><p>The Free Church of Scotland’s George Smeaton explained how the Voluntaryist Seceders differed with the advocates of the Original Secession testimony (especially the elder Thomas McCrie) with respect to the relevance of Old Testament Israel to the establishment principle:

A second charge against the protesting brethren is, that although the New Testimony decidedly expressed the opinion that the connection between Church and State was unlawful, they would not exercise forbearance where, it is alleged, forbearance is not only warrantable but demanded. But it was not a question of forbearance. It was a question that related to the lawfulness and propriety of dropping all confession to the great truth of national religion. The discussion turned largely on the peculiar attitude which was to be taken to the Old Testament Economy.

The advocates of the new opinions denied on two well defined grounds the validity of the argument drawn from the Old Testament. It was held, in the first place, that the Jewish nation but typically prefigured the Christian Church; and, in the second place, the spirituality of the new Economy was held up as the absolute contrast of the previous carnal Economy. In a word, the typical character of Judaism and a carnal or non-spiritual service were represented very incorrectly as the marked peculiarities of the Jewish nation. These allegations were the ostensible plea on which a Presbyterian Church, making a transition to the narrow principles and misconceptions of the Sectaries, sought to explode every argument drawn from the Old Testament Scriptures.

The separating Brethren maintained the very reverse, as will be seen from all their publications. They asserted, first, that Israel was not the type of the Church of God, but the church of God itself, under a different dispensation. This was the ground asserted by Wendelinus and all Protestant divines. As to the element of spirituality, they held that the two Economies did not differ in kind, but only in degree and outward form.

When the advocates of the new principles came to apply the typical theory to Jewish rulers, whose function was at once moral and permanent, the self-contradictory nature of their principle became apparent. Mr Turnbull, in his acute and lively manner, triumphantly exposed the absurdity of attempting to explain the exercise of magistratical authority and influence among the Jews, in behalf of religion, on the alleged ground that the office was typical of Christ. Dr M’Crie does the same thing, in his own lucid and argumentative way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Difference Between the Profession of the Reformed Church of Scotland, as Adopted by Seceders, and the Profession Contained in the New Testimony and other Acts, Lately Adopted by the General Associate Synod; Particularly, on the Power of Civil Magistrates Respecting Religion, Nationa</cite>, (1807; Edinburgh: C. F. Lyon, 1871), xviii-xix.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

Sectaries%2C+sought+to+explode+every+argument+drawn+from+the+Old+Testament+Scriptures.%0A%0AThe+separating+Brethren+maintained+the+very+reverse%2C+as+will+be+seen+from+all+their+publications.+They+asserted%2C+first%2C+that+Israel+was+not+the+type+of+the+Church+of+God%2C+but+the+church+of+God+itself%2C+under+a+different+dispensation.+This+was+the+ground+asserted+by+Wendelinus+and+all+Protestant+divines.+As+to+the+element+of+spirituality%2C+they+held+that+the+two+Economies+did+not+differ+in+kind%2C+but+only+in+degree+and+outward+form.%0A%0AWhen+the+advocates+of+the+new+principles+came+to+apply+the+typical+theory+to+Jewish+rulers%2C+whose+function+was+at+once+moral+and+permanent%2C+the+self-contradictory+nature+of+their+principle+became+apparent.+Mr+Turnbull%2C+in+his+acute+and+lively+manner%2C+triumphantly+exposed+the+absurdity+of+attempting+to+explain+the+exercise+of+magistratical+authority+and+influence+among+the+Jews%2C+in+behalf+of+religion%2C+on+the+alleged+ground+that+the+office+was+typical+of+Christ.+Dr+M%E2%80%99Crie+does+the+same+thing%2C+in+his+own+lucid+and+argumentative+way.%E2%80%9D%0A%0A%E2%80%94+George+Smeaton%2C+Statement+of+the+Difference+Between+the+Profession+of+the+Reformed+Church+of+Scotland%2C+as+Adopted+by+Seceders%2C+and+the+Profession+Contained+in+the+New+Testimony+and+other+Acts%2C+Lately+Adopted+by+the+General+Associate+Synod%3B+Particularly%2C+on+the+Power+of+Civil+Magistrates+Respecting+Religion%2C+Nationa%2C+%281807%3B+Edinburgh%3A+C.+F.+Lyon%2C+1871%29%2C+xviii-xix.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72c6357b23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72c6357b23.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/17/george-smeaton-on-the-relevance-of-old-testament-israel-to-the-establishment-principle/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f7df69ce10" data-kw="">
<blockquote><p>In discriminating between works that are morally good or evil, or between those which should be encouraged and those which should be suppressed, Covenanters imagine – that it is the duty of civil magistrates, or of nations acting by their rulers, to profess, establish, and support the true religion; to exert their influence and authority, that it may be received and professed by all within their dominions; to enact wise and salutary laws for its encouragement and protection; and to see that its ministers be suitably supported, and its ordinances regularly dispensed.

This is the true way, as they conceive, to make evil-doers of every description afraid, and to praise and encourage them that to do well. They consider it quite unreasonable and absurd, to prefer the temporal interests of society to the glory of God, so that the magistrate should restrain and punish gross violations of the second table of the law, as murder, adultery, robbery, theft, &amp;c.; but should allow idolatry, blasphemy, sabbath-profanation, and the like, to pass with impunity, since these latter crimes are no less detrimental to the interests of society than the former.

Is not the wrath of God revealed from heaven against all unrighteousness of men? Do not sins of the first table, no less than those of the second, bring down Divine judgments on guilty nations, and shall rulers do nothing to check the prevailing inquities, and to avert the merited vengeance of heaven? Was it commendable in Artaxerxes, a heathen prince, to promote a work of reformation at Jerusalem, and to see that the commands of God should be carefully performed, lest wrath might fall upon his dominions; and shall Christian princes do nothing in such cases? Is God less holy, his law less strict, or sin less displeasing to him now, than during the Mosaic dispensation?

Why should a Christian magistrate encourage, by indulgence, what was to be rigorously punished under the law? Has the Lord Jesus Christ destroyed the law, or become the minister of sin? Surely those who plead the typical nature of the Jewish civil institutions, and who respect the doctrine of the Westminster Standards, respecting the magistrate’s power in being a terror to evil-doers, and a praise to them that do well, are not aware of the consequences resulting from such innovations!</p></blockquote>

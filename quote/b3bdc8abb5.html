<main class="wrap"><figure class="quote" id="q-b3bdc8abb5" data-kw="">
<blockquote><p>V. If any Doctrine be contumelious against God, this is, accusing him of folly, putting upon him human affections, &amp; falsely attributing to him wishes of no strength, and a desire of no force: as if they should bring in God speaking us: I do indeed earnestly desire to save you, but ye hinder, that I cannot do what I desire; I would if you would: therefore seeing by you I am frustrated of my intent, I will change my purpose of saving you, and my will being other wise bent, I have determined to destroy you for ever.

It is certainly plain, that this Antecedent will of God, is not a will; but a desire and wish, which God doth obtain only be entreaty, and as much as he may, by man’s good pleasure. Therefore Arminius doth oftentimes call this will, a desire and natural affection, and it is common to these sectaries to take those places, Psal. 81.14. Esa. 48.18. where God is brought in speaking, as one wishing and desiring, and disappointed of his wish, as if they were properly spoken, when these things are spoken by an Anthropopathy, and after the manner of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 5.5, pp 25-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><figure class="quote" id="q-66bdb9a034" data-kw="">
<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ... (d. 1629; London: Mabb, 1660), bk. 1, ch. 3, Concerning the Works of God &amp; the Decrees of God in General, The Rules, pp. 33-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

— Samuel Rutherford, A Survey of the Spiritual Antichrist… (1648), pt. 2, ch. 64, p. 121">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+As+an+arbitrary+command+is+not+properly+a+command%2C+but+rather+a+will-counsel+and+free+advice+that+one+friend+gives+to+another%2C+so+that+the+friend+refusing+the+counsel%2C+sins+against+no+Law%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Spiritual+Antichrist%E2%80%A6+%281648%29%2C+pt.+2%2C+ch.+64%2C+p.+121&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1971731440.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1971731440.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-the-mere-will-determination-judgment-or-saying-so-of-authorities-is-in-insufficient-ground-of-faith-obedience-that-authorities-are-never-to-act-or-require-something-without-a-naturally-mo/#:~:text=1.%20As%20an%20arbitrary%20command%20is,the%20counsel%2C%20sins%20against%20no%20Law&amp;text=1.%20As%20an%20arbitrary%20command%20is%20not%20properly&amp;text=friend%20refusing%20the%20counsel%2C%20sins%20against%20no%20Law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-84e5bda01e" data-kw="">
<blockquote><p>This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676), Vol. 4, pt. 3, bk. 4, Tract 1, ‘Of Ecclesiastical Power’, 7. Of the Legislative Power of the Churches, 5th Question, Response 2, p. 796</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

— Gisbertus Voetius, Ecclesiastical Politics (Amsterdam, 1663-1676), Vol. 4, pt. 3, bk. 4, Tract 1, ‘Of Ecclesiastical Power’, 7. Of the Legislative Power of the Churches, 5th Question, Response 2, p. 796">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+is+brought+forth+in+that+text+of+the+apostle%2C+2+Thess.+2%3A13%2C+%E2%80%98because%2C+when+ye+received+the+word+of+God+which+ye+heard+of+us%2C+ye+received+it+not+as+the+word+of+men%2C+but+as+it+is+in+truth%2C+the+word+of+God%2C+which+effectually+worketh+also+in+you+that+believe.%E2%80%99+%5BPower+of+rule+and+discipline+is%5D+to+ministers+%5Bantecessoribus%2C+those+who+come+before%5D+because+in+the+name+and+power+of+Christ+they+manifest+themselves+amidst+consciences%2C+and+they+are+ministers+to+consciences+of+laws+broad+and+fixed%2C+and+of+laws+of+faith+and+obedience%2C+by+which+laws+they+are+taken+hold+of%3B+and+they+%5Bthe+ministers%5D+are+%CF%83%CF%8D%CE%BD%CE%B5%CF%81%CE%B3%CE%BF%CE%B9+%5B%E2%80%98laborers+together%E2%80%99%5D+and+%CF%83%CF%85%CE%BD%CE%B5%CF%81%CE%B3%CE%BF%E1%BF%A6%CE%BD%CF%84%CE%B5%CF%82+%5B%E2%80%98workers+together%E2%80%99%5D+of+God+%281+Cor.+3%3A9+%26+2+Cor.+6%3A1%29+in+laws+written+on+the+heart%2C+and+on+the+mind+%28Heb.+10%3A16%29%E2%80%A6+Therefore%2C+they+bear%2C+impose+and+manifest+divine+laws+to+consciences%2C+inasmuch+as+God%2C+through+ministers%2C+may+bear%2C+impose+and+manifest+them.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Ecclesiastical+Politics+%28Amsterdam%2C+1663-1676%29%2C+Vol.+4%2C+pt.+3%2C+bk.+4%2C+Tract+1%2C+%E2%80%98Of+Ecclesiastical+Power%E2%80%99%2C+7.+Of+the+Legislative+Power+of+the+Churches%2C+5th+Question%2C+Response+2%2C+p.+796&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84e5bda01e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84e5bda01e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-the-mere-will-determination-judgment-or-saying-so-of-authorities-is-in-insufficient-ground-of-faith-obedience-that-authorities-are-never-to-act-or-require-something-without-a-naturally-mo/#:~:text=This%20is%20brought%20forth%20in%20that,may%20bear%2C%20impose%20and%20manifest%20them&amp;text=This%20is%20brought%20forth%20in%20that%20text%20of&amp;text=through%20ministers%2C%20may%20bear%2C%20impose%20and%20manifest%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Appendix, Question 1, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.”

— Samuel Rutherford, The Divine Right of Church Government… (London, 1646), Appendix, Question 1, pp. 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1+Cor.+6%3A12%2C+%E2%80%98All+things+%28indifferent%29+are+lawful+in+themselves%2C+but+they+are+not+expedient%2C%E2%80%99+if+we+be+brought+under+the+power+or+band+of+them+by+law.+Therefore%2C+in+the+means+of+worship%2C+not+only+must+we+see+what+is+lawful%2C+but+also+what+is+profitable+and+conducing+to+the+end%E2%80%A6+1+Cor.+7%3A6%2C+%E2%80%98But+this+I+speak+by+permission%2C+not+of+commandment.%E2%80%99+Therefore+in+things+in+which+God+has+granted+us+liberty%2C+to+do+or+not+to+do%2C+permission+has+place%2C+not+obliging+necessity+or+penal+laws.+13th+Proposition.+There+cannot+be+commanding+laws+in+things+that+are+politicly+good+or+evil+according+to+the+individual+complexion%2C+temperature%2C+or+gifts+of+singular+men%3A+%5Bfor+example%5D+to+marry+or+not+to+marry%2C+cannot+be+commanded%2C+for+where+God+looses%2C+no+power+on+earth+can+bind%2C+v.+33.+1+Cor.+8%3A7%2C+Paul+condemns+them+in+the+use+of+their+Christian+liberty%2C+%E2%80%98Howbeit+there+be+not+in+every+man+this+knowledge%3B%E2%80%99+then+that+rulers+may+make+laws+in+things+indifferent%2C+without+scandal%2C+they+must+remove+ignorance.+2.+If+there+be+but+one+person+weak+in+knowledge+%28there+is+not+in+every+man+that+knowledge%29%2C+a+law+obliging+all+in+things+indifferent+cannot+be+made.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%28London%2C+1646%29%2C+Appendix%2C+Question+1%2C+pp.+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e1630c6fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e1630c6fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-socialism-communism-etc/#:~:text=1%20Cor.%206%3A12%2C%20%E2%80%98All%20things%20%28indifferent,in%20things%20indifferent%20cannot%20be%20made&amp;text=1%20Cor.%206%3A12%2C%20%E2%80%98All%20things%20%28indifferent%29%20are%20lawful&amp;text=obliging%20all%20in%20things%20indifferent%20cannot%20be%20made" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39255d67dc" data-kw="">
<blockquote><p>However, we think that no proper lawmaking (nomothetiken) power was given to the church by which she can make laws directly and by themselves binding the conscience; but only an ordaining power (diataktiken), which can form constitutions and canons for the preservation of peace and good order (eutaxias), which on this account do not bind the conscience by themselves and directly, but only indirectly in case of scandal; that these are… only an order by ministers; not of the essentials of Christ’s kingdom, but only of the external accidents and things indifferent; nor are they good per se, but only on account of circumstances and their relation (schesin) to the end. … IV. (2) …[Moral] Laws bind the conscience per se and directly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly and mediately in case of scandal and contempt. Hence the guilt arising from their violation is not properly on account of the violation of the constitution, but on account of the neglect of the authority which God ordained, and on account of the scandal given. … XX. Again, in the transgression of them [church constitutions] there can be no sin except indirectly (i.e., not on account of the usurpation of the thing itself [as in homicide, fornication, etc., previously mentioned], but on account of another thing [if it is from contempt of lawful authority], for because obedience is commanded by God, there is sin in a neglect of it, if with a neglect of brotherly edification, or if from impiety and license. However, if all these are absent, there will be no sin in a transgression of them… nor is the authority of the one commanding to be so much regarded as the cause of the command.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, p. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“However, we think that no proper lawmaking (nomothetiken) power was given to the church by which she can make laws directly and by themselves binding the conscience; but only an ordaining power (diataktiken), which can form constitutions and canons for the preservation of peace and good order (eutaxias), which on this account do not bind the conscience by themselves and directly, but only indirectly in case of scandal; that these are… only an order by ministers; not of the essentials of Christ’s kingdom, but only of the external accidents and things indifferent; nor are they good per se, but only on account of circumstances and their relation (schesin) to the end. … IV. (2) …[Moral] Laws bind the conscience per se and directly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly and mediately in case of scandal and contempt. Hence the guilt arising from their violation is not properly on account of the violation of the constitution, but on account of the neglect of the authority which God ordained, and on account of the scandal given. … XX. Again, in the transgression of them [church constitutions] there can be no sin except indirectly (i.e., not on account of the usurpation of the thing itself [as in homicide, fornication, etc., previously mentioned], but on account of another thing [if it is from contempt of lawful authority], for because obedience is commanded by God, there is sin in a neglect of it, if with a neglect of brotherly edification, or if from impiety and license. However, if all these are absent, there will be no sin in a transgression of them… nor is the authority of the one commanding to be so much regarded as the cause of the command.”

— Francis Turretin, p. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+we+think+that+no+proper+lawmaking+%28nomothetiken%29+power+was+given+to+the+church+by+which+she+can+make+laws+directly+and+by+themselves+binding+the+conscience%3B+but+only+an+ordaining+power+%28diataktiken%29%2C+which+can+form+constitutions+and+canons+for+the+preservation+of+peace+and+good+order+%28eutaxias%29%2C+which+on+this+account+do+not+bind+the+conscience+by+themselves+and+directly%2C+but+only+indirectly+in+case+of+scandal%3B+that+these+are%E2%80%A6+only+an+order+by+ministers%3B+not+of+the+essentials+of+Christ%E2%80%99s+kingdom%2C+but+only+of+the+external+accidents+and+things+indifferent%3B+nor+are+they+good+per+se%2C+but+only+on+account+of+circumstances+and+their+relation+%28schesin%29+to+the+end.+%E2%80%A6+IV.+%282%29+%E2%80%A6%5BMoral%5D+Laws+bind+the+conscience+per+se+and+directly%2C+and+a+violation+of+them+incurs+guilt%3B+but+constitutions+bind+the+conscience+only+indirectly%2C+and+a+violation+of+them+incurs+guilt%3B+but+constitutions+bind+the+conscience+only+indirectly+and+mediately+in+case+of+scandal+and+contempt.+Hence+the+guilt+arising+from+their+violation+is+not+properly+on+account+of+the+violation+of+the+constitution%2C+but+on+account+of+the+neglect+of+the+authority+which+God+ordained%2C+and+on+account+of+the+scandal+given.+%E2%80%A6+XX.+Again%2C+in+the+transgression+of+them+%5Bchurch+constitutions%5D+there+can+be+no+sin+except+indirectly+%28i.e.%2C+not+on+account+of+the+usurpation+of+the+thing+itself+%5Bas+in+homicide%2C+fornication%2C+etc.%

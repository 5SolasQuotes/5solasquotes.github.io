<main class="wrap"><figure class="quote" id="q-28ed2c48bb" data-kw="">
<blockquote><p>Arminians: ‘A confession is not a rule of faith; it has not the lowest place in the Church.’ [Rutherford’s] Answer: The covenant written and sealed in Nehemiah’s time was a secondary rule of faith, and a rule even so far as it agreed with the Law of Moses, for they enter in a curse and an oath to walk in God’s Law, not to give their sons and daughters in marriage to the heathen, not to buy victuals from the heathen on the Sabbath, to charge themselves to give money to maintain the service of God, Neh. 9:38, ch.10:1-3, 29-32, which written Covenant was not Scripture; and [further,] Acts 15, the decrees of the synod [of Jerusalem] were not formally Scripture, yet [were] to be observed as a secondary rule [Acts 15:28; 16:4].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, pp. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>

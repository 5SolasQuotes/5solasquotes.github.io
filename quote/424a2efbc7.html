<main class="wrap"><figure class="quote" id="q-424a2efbc7" data-kw="">
<blockquote><p>He which is true God, the same is also true man, and in this unity there is no untruth, whereas there meet together the baseness of manhood and the excellency of the Godhead. For as God is not changed by the partaking, so man (that is man’s nature in Christ) is not consumed by the dignity, for each form works with communion of the other, their own property: namely the Word works that which is proper to the Word, and the flesh performs that which is proper to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (1599) | But we believe and confess that these two natures, are truly and inseparably joined and united into one person of Christ: that yet we doubt not, but each of them remains whole and perfect, and the one truly distinct from the other, yea and that they do hold the essential properties and operations of each of them distinct: without all manner of confusion: so that as the divine nature holding the properties remains uncreated, infinite, immeasurable, simply omnipotent and simply wise: even so the human nature holding her’s remains created, comprehensible, and determined with certain limits: And as the divine nature has will and power, whereby Christ wills and works, as God, such things as are of God: so has the human nature will and power, whereby Christ as man, wills and works those things which are of man: so far forth as Christ in that He is God, He wills not nor works by human will or power: so neither as He is man, wills He or works He by divine will or power: as it has been learnedly determined by the fathers both against Eutyches and against Macarius. We therefore did always like well of that saying of Leo I [c. 400-461], Epistle 10 [28], ch. 4, writing unto Flavianus about the same thing, where he says:, ch. 11, ‘Of Christ the Redeemer’; pp. 61-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

0is%20proper%20to%20the%20flesh" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08b16872f6" data-kw="">
<blockquote><p>But we may well enough grant the proposition true, that Christ, as Mediator, is to be adored with divine worship, because as He is Mediator, He must necessarily be God, and so therein is included the ratio formalis sub quà [the formal reason which is under] of all religious worship: So that to be worshipped as Mediator, and as God, are not opposite, but one is necessarily included in the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 137, ‘How Christ</cite>, (as Mediator) had his Glory given Him, although as God He could not properly have any thing given Him, except by way of Manifestation: Against the Socinians’ in 145 Expository Sermons upon John 17 (1656) See especially, p. 667 | Burgess (d. 1664) was a Westminster divine. Burgess’ key statement is:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-7e7a95d7eb" data-kw="">
<blockquote><p>Neither can the names of Jesus and Christ prove that what is said there [in Prov. 8:15-16, 22-30] must needs be meant of Him as Mediator. Mark how well-grounded Mr. Hussey’s arguments are. Jesus sat at meat in Simon the Pharisee’s house, Luke 7:37; Jesus wept for Lazarus, because He loved him, John 11:35-36. Must we needs therefore say that, as Mediator, He sat at meat in the Pharisee’s house, and, as Mediator, He wept for Lazarus? Christ is the Son of David, Matt. 22:42. Must we therefore say that, as Mediator, He is the Son of David? Christ is “God over all, blessed forever,” Rom. 9:5. Must we therefore say that this is meant of Christ only as Mediator? What is more ordinary than to use the names of Jesus and Christ when the thing which is said is meant in reference to one of the natures?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, … (1646), pt. 2, ch. 6, p. 98, lt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-38a644c1b6" data-kw="">
<blockquote><p>And the Greek text, as also the Latin version, puts a clear difference between the person of Peter and the stone upon which the Church is founded: Tu es Petrus, et super hanc petram. Upon that Stone and ground which thou hast now laid, namely that Jesus is the Christ, the Son of the Living God, the Church is founded. For the Church is not founded upon a mortal man but upon the Son of the eternal God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, bk. 2, ch. 4</span></figcaption>

</figure><figure class="quote" id="q-9ac1204447" data-kw="Mary Queen of Heaven King">
<blockquote><p>I hear again a Jesuit crying out, &quot;You, Mother of God, CAN DO ALL THINGS in heaven and on earth.&quot; But I believe Christ, saying, (Matt. 28:18.) &quot;All power is given to me in heaven and on earth.&quot; If he had said the same of his mother, we would have given faith to him: which we rightly withdraw from those who, without God&#x27;s authority, crown a Queen, not only for themselves, but to rule over all creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</span></figcaption>

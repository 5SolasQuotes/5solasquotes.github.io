</figure><figure class="quote" id="q-ffafce369f" data-kw="">
<blockquote><p>It ought to be well understood in approaching this topic that the delineated distinctions, and further ones that will be made, are not magic solutions to ethical predicaments. Rather they are (very useful) tools that will go a long way towards working to what is righteous and pleasing before God. As with all tools, they may be used well, or irresponsibly. If through the multiplying of distinctions and terms (or the opposite, the lack of using such), a conclusion is reached that seems off or suspect, sophistry is likely being committed. Ethical conclusions reached should go with, and support an informed common sense in line with Scripture, not go against it. The purpose is to clearly understand and ground the reasons for right action, and to clear away all the mist, leaps and gymnastics of those who advocate error and manipulate truth as a wax-nose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’, ‘Extended Intro’, ‘The Beginnings of Answers: Distinctions’</cite></span></figcaption>

</figure><figure class="quote" id="q-e3840a983d" data-kw="">
<blockquote><p>I. God has planted two principles in the mind of man: the avoidance of evil and the desire of good; the irascible (to thymikon) and concupiscible appetite (to epithymetikon). Viewed in the genus of being and physically, these are neither good nor bad, but mean and indifferent, drawing all their moral goodness and evil from the quality of the objects about which they are exercised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, The Reformed View | Institutes (P&amp;R) | vol. 2, 11th Topic, Q. 21, ‘The 10th Commandment… Are the Incipient Motions Sins? We Affirm’, p. 134</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-2e96927aee" data-kw="">
<blockquote><p>John Owen (1616–83), a prominent English Reformed theologian, emphasized the importance of affections in Christian life… Affections, as opposed to turbulent emotions, are regarded as a more delicate inclination and disposition of the soul… Owen’s theology is built in a theocentric way, with a particular emphasis on the experiential and pastoral aspects. This research investigates how Owen used the concept of affections to construct his anthroposensitive theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hyeong-rae-jo.html">Hyeong Rae Jo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sensing the Divine: John Owen’s Anthroposensitive Theology &amp; Affective Spirituality PhD diss</cite>, (Vrije Universiteit Amsterdam, 2023)</span></figcaption>

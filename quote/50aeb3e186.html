<main class="wrap"><figure class="quote" id="q-50aeb3e186" data-kw="">
<blockquote><p>2. The Church of believers have no authority ecclesiastical, nor power of the keys, if all the pastors on earth were removed from the Church by death; and in that case the keys should indeed be only in Christ’s hand, and the case being extraordinary, Christ [would be] behoved extraordinarily to supply the want of ordination, which Timothy, Titus and other elders do ordinarily give, for the Church of believers could not give that which they have not…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold:

1. Common; when men are brought but to outward profession and common gifts; and so the word is used often.

2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 6-7</span></figcaption>

</figure><figure class="quote" id="q-7ac968f88a" data-kw="">
<blockquote><p>But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

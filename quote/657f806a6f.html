<main class="wrap"><figure class="quote" id="q-657f806a6f" data-kw="">
<blockquote><p>We may not be idle; We are created unto good works which God hath prepared that we might walk in them. We are redeemed and bought with a price, not to do nothing or to live as we list, but to serve him which hath redeemed us. Our Saviour could in no wise abide idleness, Why stand ye still? Saint Paul would have all men to be stirring, Let every man walk. Not one is excepted, not one can be dispensed withal, Whosoever he bee that will not labour let him not eat. For it is good that every man should eat his bread in the sweat of his brows. And work in the wise man’s judgement is even as needful for men as meat. There is no such bane to a common wealth or kingdom, no such poison to the manners of every particular man as idleness is.

Examples we have too many in all ages. Idleness in David was a cause of lewdness: so that it is not good no not for Princes to be idle. Idleness was the root of all that filth in Sodom. Israel in the absence of Moses being idle, fell to feasting, dancing, and idolatry. And therefore seeing that such as be idle are subject to so many noisome temptations: S. Jerome’s counsel is this, See thou be always doing somewhat that the devil may find thee occupied: he that is out of good exercise is easily snared of the devil. And idleness, saith S. Bernard, is the mother of toys (he might have said of vices) and the stepdame of virtues. Amasis king of Egypt made provision by Law against idleness, once a year calling every man to a reckoning what he had gotten, and what he had spent.

In this reckoning was neither the gain of carding, dicing, usury, bribery, cousinage [sic] nor extortion allowed. Let every man walk in that vocation wherewith God hath called him. God hath called no man with these vocations. Yet dare I not say, neither will I, that for any man, at any time, in any sort, to recreate himself with cards or dice is sin. I am not of that opinion. Yet it falleth out too often that these exercises are occasions of much sin. And when they are so, it were no doubt much better to be altogether idle than so ill occupied. We must not play, but walk.</p></blockquote>

<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear.

2. Between the obvious usual sense of the words and an unusual forced sense.

3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense.

4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow.

5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause.

6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is:

1. That I have no obligation to fit my words to his personal private sense.

2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words.

3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense.

4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>

<blockquote><p>It is the advice of the Psalmist, that we should converse much with ourselves: an advice, indeed, which is regarded by few; for the greatest part of mankind are no where greater strangers than at home. But it is my earnest request to you, that you would be intimately acquainted with yourselves, and, as becomes persons devoted to a studious life, be much at home, much in your own company, and very often engaged in serious conversation with yourselves.

Think gravely, to what purpose do I live? Whither am I going? Ask thyself, hast thou any fixed and determined purpose? any end thou pursuest with steadfastness? The principles I have embraced under the name of the Christian religion, the things I have so often heard about a future state, and life, and death eternal, are they true or false? If they are true, as we all absolutely profess to believe they are, then, to be sure, the greatest and most important matters of this world are vain, and even less than vanity itself: all our knowledge is but ignorance, our riches poverty, our pleasures bitterness, and our honours vile and dishonourable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. I, pp 8-9.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is the advice of the Psalmist, that we should converse much with ourselves: an advice, indeed, which is regarded by few; for the greatest part of mankind are no where greater strangers than at home. But it is my earnest request to you, that you would be intimately acquainted with yourselves, and, as becomes persons devoted to a studious life, be much at home, much in your own company, and very often engaged in serious conversation with yourselves.

Think gravely, to what purpose do I live? Whither am I going? Ask thyself, hast thou any fixed and determined purpose? any end thou pursuest with steadfastness? The principles I have embraced under the name of the Christian religion, the things I have so often heard about a future state, and life, and death eternal, are they true or false? If they are true, as we all absolutely profess to believe they are, then, to be sure, the greatest and most important matters of this world are vain, and even less than vanity itself: all our knowledge is but ignorance, our riches poverty, our pleasures bitterness, and our honours vile and dishonourable.”

— Robert Leighton, Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts, (London: Plato’s Head, 1763), Lect. I, pp 8-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+the+advice+of+the+Psalmist%2C+that+we+should+converse+much+with+ourselves%3A+an+advice%2C+indeed%2C+which+is+regarded+by+few%3B+for+the+greatest+part+of+mankind+are+no+where+greater+strangers+than+at+home.+But+it+is+my+earnest+request+to+you%2C+that+you+would+be+intimately+acquainted+with+yourselves%2C+and%2C+as+becomes+persons+devoted+to+a+studious+life%2C+be+much+at+home%2C+much+in+your+own+company%2C+and+very+often+engaged+in+serious+conversation+with+yourselves.%0A%0AThink+gravely%2C+to+what+purpose+do+I+live%3F+Whither+am+I+going%3F+Ask+thyself%2C+hast+thou+any+fixed+and+determined+purpose%3F+any+end+thou+pursuest+with+steadfastness%3F+The+principles+I+have+embraced+under+the+name+of+the+Christian+religion%2C+the+things+I+have+so+often+heard+about+a+future+state%2C+and+life%2C+and+death+eternal%2C+are+they+true+or+false%3F+If+they+are+true%2C+as+we+all+absolutely+profess+to+believe+they+are%2C+then%2C+to+be+sure%2C+the+greatest+and+most+important+matters+of+this+world+are+vain%2C+and+even+less+than+vanity+itself%3A+all+our+knowledge+is+but+ignorance%2C+our+riches+poverty%2C+our+pleasures+bitterness%2C+and+our+honours+vile+and+dishonourable.%E2%80%9D%0A%0A%E2%80%94+Robert+Leighton%2C+Theological+Lectures%2C+Read+in+the+Publick+Hall+of+the+University+of+Edinburgh.+Together+with+Exhortations+to+the+Candidates+for+the+Degree+of+Master+of+Arts%2C+%28London%3A+Plato%E2%80%99s+Head%2C+1763%29%2C+Lect.+I%2C+pp+8-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F069e1bc2f5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/069e1bc2f5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/09/robert-leighton-on-conversing-with-ourselves/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c06009f30e" data-kw="">
<blockquote><p>Assuredly, [it is clear] that peoples did not in the first instance originate from rulers, but whatever peoples desired to be ruled by a single monarch or by chief men elected by them were anterior to their rulers. Hence it follows that peoples were not created for the sake of rulers, but on the contrary the rulers for the sake of the people, even as the guardian is appointed for the ward, not the ward for the guardian, and the shepherd on account of the flock, not the flock on account of the shepherd.

This proposition is not merely obvious in itself but may be corroborated by the history of nearly all nations, So much so that God Himself, although he had elected Saul to substitute him for Samuel in accordance with the desires of the people, yet willed that he should be chosen and accepted as King by the suffrages of the people. Thus David, although he had first been chosen as king by God Himself, yet would not undertake the administration of the Kingdom except he had first been confirmed by the suffrages and unfettered concord of the tribes of Israel.

On similar grounds it happened even afterwards that though the kingship had by the will of God been granted to the family of David, yet in the last resort that one from the descendants of David should rule whom the people had approved and none other (unless perchance something irregular befell to prevent it as when now the Egyptian and then the Syrian kings ruled as tyrants over the people of God).

So much so that this kingship was hereditary as far as the family was concerned, but elective as regards the individual incumbent, i.e. dependent upon the election of the people. This may be seen from the histories of Solomon, Rehoboam, Joas, Ocias and Jehoahaz. For this reason also Absalom grasped the occasion of usurping his father’s throne. For thus Hushai the friend of David answered him: “Nay, but whom the LORD, and this people, and all the men of Israel have chosen, his will I be, and with him will I abide.”

… [T]he people existed before there was any magistrate and that the magistrates were made for the sake of the people and not vice versa, the people for the sake of the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), pp 108, 122.</span></figcaption>

<blockquote><p>Yea and the Christian king rules over men as men, and also as Christian-men; he rules over them as men, with a dominion over their bodies, lives and goods by his civil laws, he has also dominion as king over men, as Christians and members of Christ’s kingdom and Church, not over their consciences (for that is proper only to the Father of spirits), but he has a coactive [coercive] power over all men, even pastors, as to cause them do their Christian duties, he has power to compel Church-men in assemblies to determine truth, and to use the keys right, and to preach and use the sacraments according as Christ has commanded in his Word, and to punish them when they do otherwise. … I answer, the infallible rule of judging for both [Church and State] is the Word of God, which speaks home impartially to both, if they will hear, but certainly the king’s civil, kingly coactive power to compel men to do their duty remains the highest and most supreme power on earth, in genere potestatis politicae, in ‘the kind of politic-power’, and pastors and all men may by this power be compelled to do right; as for the abuse of the power, it is no part of the power; and in this kind the king has a negative-politic and kingly suffrage [vote] and voice in all Church assemblies, no ecclesiastical constitution has the force of a [civil] law without the politic suffrage of the civil judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 19, ‘…as about… the King’s Power in Things Ecclesiastical’, pp. 303-4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-aa16ffe7e7" data-kw="">
<blockquote><p>And this general Rule give me leave to assert and commend to your most serious considerations and consciences. That whatsoever Law of GOD, or Command of His, we find recorded in the Law-book, in either of the Volumes of GODS Statute, the N.T. or the Old, Remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the Statute-Law of this Nation, or of any Nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or Repealed by a latter Law. And so men (I forewarn them) shall find one day urged upon them, for all those Laws that stand upon Record in GODS sacred Volumes, however now many take Liberty to reject what they please, without any just ground, that GOD hath discharged them: And the Denial or Neglect of this (in matter of Church-Government) is the Rock that we have dashed upon formerly; and therefore we had need to take the more heed of it for time to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The glass of God’s providence towards his faithful ones</cite>, (London, 1644), p. 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ec5f76753" data-kw="">
<blockquote><p>…so neither is the prince to be obeyed, using his authority against God, in commanding impious and unhonest things: we must give unto Caesar the things that are Caesar’s and unto God the things which are God’s, we may not give unto the prince the things which are God’s, that is, the conscience. And in this case the apostles give us a rule, to obey God rather than man, Acts 4:19, when obedience then is denied in unjust and unlawful things, not the authority which is God’s ordinance, but the abuse of the authority is gainsaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … ([Cambridge] 1611), ch. 13, 3. The Questions &amp; Doubts Discussed, Question 17, ‘How far the Magistrate is to be Obeyed, and wherein not to be Obeyed?’, p. 588</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e1150b1a98" data-kw="">
<blockquote><p>These Judicial Laws were determinations of the Moral Law. A determination is either Iuris Divini [Divine law] or Humani [human]; these determinations in Moses’ Judicial Laws are Divini Juris; therefore they had greater force to bind the Jew, than any municpal law has to bind the subjects now, in respect they were given by God Himself, and these laws of men which draw nearest to them in equity, are most perfect; although particularly they cannot be fitted to every nation, no more than a shoe of one measure can serve for every foot. … Fourthly, the punishments inflicted by human laws are alterable: so were the punishments in Moses’ Judicial Law; therefore the Jews say of them, ascendunt et descendunt [ascending and desceding], which they understand, not of the greatest and highest transgressions, but of the middle sort of transgressions, which praecepta media, their middle precepts did forbid. Example, Ex. 21:29-36, If a man kept a pushing ox, knowing that he were wont [accustomed] to push, if he kill a man, then the Law ordains that the man shall die, or else to redeem himself with a sum of money; here the law ascended or descended: but if a man had willfully killed a man, that was praeceptum grave [a grave precept], the punishment neither ascended nor descended, but he was to die the death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explication of the Judicial Laws of Moses</cite>, pp. 1-3</span></figcaption>

</figure><figure class="quote" id="q-4ef9d041db" data-kw="">
<blockquote><p>The human law is that which humans, proceeding by reason, produce from the preceding laws, accommodated first to common just, honest, useful, and necessary conclusions, then to particular determinations for the condition of persons for whose good it is produced, the things or matters concerning which it is produced, and for the circumstances which occur to them. … We call determinations that part of human law that circumscribes any of those natural conclusions with specific (as we call it) boundaries, not by the authority of nature, but rather by the judgment of the wisest persons, by the common law of nature specifically accommodated to the mode of individual things. .. The objects of just proportion exist in three kinds… for the sake of producing specific determinations. For either they are [1] primary objects whose good is seen by natural, divine, and human law; or [2] they are secondary objects that are ordered to the former ones as to their own end; or, [3] finally, they are accidents, by which the previous two objects are commonly clothed in a certain way and change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, ch. 4, ‘Of the Part in Human Laws which is Mutable, and the Causes of the Mutability’ in The Mosaic Polity (1st ed. 1592; 1602; CLP Academic, 2015), pp. 54 &amp; 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-9e2bfe81dd" data-kw="">
<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-40a2bfac5d" data-kw="">
<blockquote><p>Some years ago there was a sizeable movement among the Lutherans in Germany toward religiosity. Of some we believe that it was in truth, but with the majority it was but an illusion. This counterfeit religiosity has in some places also affected those of Reformed persuasion. People of the world, due to observing that many of them turned to a godly lifestyle, called them Pietists, thinking to offend them in this way. Instead, they, being ungodly, actually condemned themselves in doing so, and placed a crown upon the head of the truly godly whom they intended to offend—for to be a Pietist means to be a godly person. In desiring to warn everyone against the Pietists and to give some direction in this respect, we do not have the truly godly in mind at all. Far, far be this from me! May the Lord bless them and give them more light to see the Lutheran error and to turn away from it. Rather, I have in view those who stimulate various fictitious notions and errors, such as mystics, Quietists, heretics, fanatics, David-Jorists, Boehmists, Quakers, and all such individuals who in our day are known as Pietists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, 4 vols. transl. Bartel Elshout (Ligonier, PA: Soli Deo Gloria Publications, 1993), 2.642‐43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8bd0c2eb1e" data-kw="">
<blockquote><p>‘Doth not even nature itself’ He [Paul] again sets forth nature as the mistress of decorum, and what was at that time in common use by universal consent and custom—even among the Greeks—he speaks of as being natural, for it was not always reckoned a disgrace for men to have long hair. Historical records bear, that in all countries in ancient times, that is, in the first ages, men wore long hair. Hence also the poets in speaking of the ancients, are accustomed to apply to them the common epithet of unshorn. It was not until a late period that barbers began to be employed at Rome—about the time of Africanus the elder. And at the time when Paul wrote these things, the practice of having the hair shorn had not yet come into use in the provinces of Gaul or Germany. Nay more, it would have been reckoned an unseemly thing for men, no less than for women, to be shorn or shaven; but as in Greece [Corinth] it was reckoned an unbecoming thing for a man to allow his hair to grow long, so that those who did were remarked as effeminate, he [Paul] reckons as nature a custom that had come to be confirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, | v. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-2ae448f943" data-kw="">
<blockquote><p>…’the way of worship not prescribed by God’ may be either when the worship is to another thing besides or with God, which alone proves idolatry… Or, ‘by another way’, is meant another ceremony or rite in which the worship of God is placed, such as was the Pharisees’ washing their hands, which may be will-worship, if to God only, but not idolatry; and so if he could prove our [Anglican] ministers guilty of this, yet should they not be proved idolaters any more than the Pharisees were, with which neither Christ nor his apostles do charge them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Sect. 3. This Authors Argument as well proves himself an Idolater as the Conformist, Ch. 7; p. 216</span></figcaption>

</figure><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>

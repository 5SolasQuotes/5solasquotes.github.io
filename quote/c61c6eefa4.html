<main class="wrap"><figure class="quote" id="q-c61c6eefa4" data-kw="">
<blockquote><p>1. I hope few will follow him in calling the decrees of God, “the Covenant,” and confounding election and the Covenant in constitution. For my part, I will not.

2. “Constitution” signifies” 1. actum Constituentis [the act of the constitutor];

2. [though] more usually: passively, statum seu rem constitutam [the state or constituted thing]: God’s eternal purpose is not properly the Covenant in constitution in either sense.

3. God’s eternal decree is nothing but his essence (for there is nothing in God but God, and nothing but God eternal) denominated as related to its connoted object (which from eternity was nothing). And the Covenant in constitution is not God, nor shall be by me so called.

4. Nor will I call the whole execution of God’s election by Christ, the Covenant in execution; nor any part of it but that which Scripture so calls.

5. I grant him that [Greek] is usually taken for a divine disposition and constitution: but that is not merely in God’s decree, but (as [Hugo] Grotius has at large opened) (Preface to his Annotations on the Gospels) as it is God’s signal revealed determination of the terms of life and death; or as it is a law and a covenant on God’s part imposed on us, before we consent. And Jer. 33:20 does not call God’s mere decree his “Covenant” (but his created course and law of nature).

6. He that will but try the texts which his concordance refers him to, and cannot find a multitude of places where the word ‘covenant’ is taken for somewhat else than God’s decrees, and their general execution, even for a law with its premiant and penal sanction, and for a free donation or promise, which yet has its proper conditions, as the moralis dispositio recipientium; and that cannot find diverse such covenants made, by God, with Christ and us, that are really distinct, and not to be confounded, must not expect that I here trouble other readers with such a task as his conviction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

<blockquote><p>…the nature of those eternal transactions… And these were carried on “per modum foederis,” “by way of covenant,” compact, and mutual agreement, between the Father and the Son; for although it should seem that because they are single acts of the same divine understanding and will, they cannot be properly federal [between different parties], yet because those properties of the divine nature are acted distinctly in the distinct persons, they have in them the nature of a covenant… And therefore are those counsels of the will of God, wherein lies the foundation of the priesthood of Christ, expressly declared as a covenant in the Scripture; for there is in them a respect unto various objects and various effects, disposed into a federal relation one to another.</p></blockquote>

<blockquote><p>11. God has made more promises, donations and covenants than one or two, which must not be confounded:

1. His Law and Covenant made to and with man in innocency is one.

2. And his Law and Covenant made to and with Christ, as Mediator, is another.

3. And his absolute promise of a Saviour to the world, with the conditional promise or Law of Grace conjunct, was the first edition of another. And the Gospel, as after the incarnation promulgated, was a more perfect edition of it (to pass by Abraham’s Covenant of Peculiarity, and the Mosaical Law, as such).

12. Though Christ be promised in one of these, and be God’s antecedent gift, He may nevertheless be the Author of another, (and so far the foundation), as well as the meritorious cause.

13. That may be of free grace which is merited by Christ; yea, and that which is annexed to the evangelical worthiness of a believer.

14. That may be a condition required of us, to be done by the help of grace, which yet is the effect of that grace, and given us by God.

15. It is a true Covenant between God the Father, Son, and Holy Ghost, and man, which is solemnly entered into in baptism: And this is a Covenant of Grace, even that proceeds purely from grace; and of grace, as given by God, and by us accepted. He that will confound these various covenants, promises, and laws, on pretense of their unity (though there is doubtless a wonderful unity of all the parts both of God’s moral (signal) means, and his physical works), shall confound much of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

<blockquote><p>Q. And what does God promise to bring the elect into in the Covenant of Grace? A. Into an estate of salvation. … Q. How does God promise to do all this? A. By a Redeemer, Isa. 53:10, ‘When Thou shalt make his soul an offering for sin, He shall see his seed, He shall prolong his days, and the pleasure of the Lord shall prosper in his hand,’ v. 11, ‘He shall see of the travail of his soul, and shall be satisfied, etc.’ And this by some learned divines is called the Covenant of Redemption. Q. What do they mean by it? A. That federal transaction that was betwixt God the Father and the Son from everlasting, about the redemption of lost and fallen men. Q. Is not this the same with the Covenant of Grace? A. This covenant is a covenant of grace, but ’tis not strictly that Covenant of Grace, which the Scripture holds out in opposition to the Covenant of works; but rather the means to it, or foundation of it. Q. Wherein do these two covenants differ? A. In the confederates, for in the Covenant of Redemption, the confederates are God and Christ, but in the Covenant of Grace, the confederates are God and believers.</p></blockquote>

<blockquote><p>4. I have perused the larger Catechism of the Assembly, and judge it a most excellent sum of divinity: and so much the more excellent, in that it is sparing in the difficult and more abstruse part, and most full in the practical part: And I find no word that I dissent from, so I may have leave but to interpret four words, as follows: 1. Where it is said, that the Covenant of Grace was made with Christ, as the second Adam, and in Him, with all the elect. I understand it of the genus of the Covenant, one species being made with Christ, and another with man, and not as if it were one and the same Covenant in specie that was made with Christ and with man: though I acknowledge that the promise made to Christ contained the salvation of his elect as the matter of it.</p></blockquote>

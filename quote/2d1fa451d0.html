<main class="wrap"><figure class="quote" id="q-2d1fa451d0" data-kw="">
<blockquote><p>…Cotton’s ‘The Way Of The Churches Of Christ In New-England’, whose manuscript was widely circulated in England even a few years before its publication in 1645…. Particularly, Cotton’s ‘The Keys Of The Kingdom Of Heaven’ (1644) was so influential in England that John Owen, a Presbyterian, became convinced that Cotton was right and, finally, supported the Congregational form of church government. Meanwhile, refuting Cotton’s works, both Robert Baillie and Daniel Cawdrey wrote ‘A Dissuasive from the Errors of the Time’ (1645) and ‘Vindicae Clavium, or a Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners’ (1645) respectively. Three years later, Cotton’s reply to Baillie and Cawdrey was published under the title, ‘The Way of Congregational Churches Cleared’ (1648).</p></blockquote>

<blockquote><p>All the power to be owned in bishops, is derived to them from the King; and, in those things wherein the King has power in church matters, in those things we may obey the bishops, as his delegates and substitutes… the law calls the King patron-general of England. His appointing me to preach [in the second indulgence], supposes I must have hearers, and those, of necessity, out of some parish or other. What we do is to serve the present necessity, and not of choice.</p></blockquote>

</figure><figure class="quote" id="q-73ce228bfb" data-kw="">
<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions n.d</cite>, ch. 12, ‘Whether a Sound Heart and an Unsound Head can Consist Together? and Vice Versa; or, Whether Truth and Holiness be not Insepararable Companions?’ in Works, vol. 2</span></figcaption>

</figure><figure class="quote" id="q-49d1b19504" data-kw="">
<blockquote><p>Rule Two. We must have a respect to the ordinance itself, that it be not made contemptible, that the discipline of Christ’s house be not rendered obnoxious to reproach and contempt; and as in the first reformation of religion, when men were coming out of popery and were ready to fear and spurn at discipline, and knew not the difference between the popish yoke and Christ’s yoke, in that case and in that time there was forbearance on this account. ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Sermons of James Durham</cite>, p. 923 of 7. ‘A Sermon on Ephesians 4:11-12’ in Collected Sermons of James Durham…, vol. 1 (Naphtali &amp; RHB, 2017)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Rule Two. We must have a respect to the ordinance itself, that it be not made contemptible, that the discipline of Christ’s house be not rendered obnoxious to reproach and contempt; and as in the first reformation of religion, when men were coming out of popery and were ready to fear and spurn at discipline, and knew not the difference between the popish yoke and Christ’s yoke, in that case and in that time there was forbearance on this account. ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.”

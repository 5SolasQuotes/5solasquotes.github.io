<main class="wrap"><figure class="quote" id="q-2c30adc8ce" data-kw="">
<blockquote><p>Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection (Mr. [William] Perkins on Revelation); therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, to signify their submission and reverence unto the ministry of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, … (London, 1654), on 1 Cor. 11 | v. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-59f66e110f" data-kw="">
<blockquote><p>Argument 8. Common sense and nature itself, or natural inclination (so he calls settled custom, and agreeable to nature, in respect to what is comely) dictates that it is unseemly for a woman to pray uncovered, or that a man should wear long hair, and the contrary is decent: Therefore you observe no decorum when you behave yourselves otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(London</cite>, 1659), on 1 Cor. 11, ‘The Seventh Article concerning Order &amp; Decency’ | On vv. 13-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Argument 8. Common sense and nature itself, or natural inclination (so he calls settled custom, and agreeable to nature, in respect to what is comely) dictates that it is unseemly for a woman to pray uncovered, or that a man should wear long hair, and the contrary is decent: Therefore you observe no decorum when you behave yourselves otherwise.”

</figure><figure class="quote" id="q-a94f7a05bf" data-kw="">
<blockquote><p>We have no such custom, of women’s praying or prophesying with their heads uncovered, or men’s praying or prophesying with their heads covered; or we have no such custom of contending for these little frivolous things; neither any of the churches of God; and good Christians, in their practices, ought, in things of this nature, to have an eye and regard to the custom of their own church, and also of other Christian churches. Thus the apostle closes this discourse, and proceeds in the next verses to tax other abuses which were crept into this famous church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 15 | v. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-f5c66c7321" data-kw="">
<blockquote><p>Honor is but the expressing of the inward respect we bear to persons by outward signs, speeches and gestures; without the outward signification of it thus, no man can tell who is honored: and as is the custom of the nation, so we express this, whether by uncovering the head, bowing the body, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Stablishing against Shaking: or a Discovery of the</cite>, … Deluded People called, Quakers… (London, 1656), p. 22 Firmin was an English clergyman with Independent, puritan leanings.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

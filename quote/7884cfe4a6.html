</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a55fd695ed" data-kw="">
<blockquote><p>Our sovereign lord and lady the king and queen’s majesties and three estates of parliament, conceiving it to be their bound duty, after the great deliverance that God has lately wrought for this country and kingdom [in 1689], in the first place to settle and secure therein the true Protestant religion according to the truth of God’s word as it has of a long time been professed within this land. As also the government of Christ’s church within this nation agreeable to the word of God and most conducive to the advancement of true piety and godliness and the establishing of peace and tranquillity within this realm… Therefore their majesties, with advice and consent of the said three estates, do hereby revive, ratify and perpetually confirm all laws, statutes and acts of parliament made against popery and papists and for the maintenance and preservation of the true reformed Protestant religion and for the true church of Christ within this kingdom, in so far as they confirm the same, or are made in favour thereof. Likewise they, by this act, ratify and establish the Confession of Faith now read in their presence and voted and approved by them as the public and avowed confession of this church, containing the sum and substance of the doctrine of the reformed churches; which Confession of Faith is subjoined to this present act; as also, they do establish, ratify and confirm the presbyterian church government and discipline…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-parliament.html">Civil Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Act of June 7</cite>, 1690, Act ratifying the Confession of Faith and settling presbyterian church government in The Records of the Parliaments of Scotland to 1707, eds. K.M. Brown et al. (St Andrews, 2007-2025) On the interpretation of this see Cooper, pp. 45-49 &amp; 50-51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our sovereign lord and lady the king and queen’s majesties and three estates of parliament, conceiving it to be their bound duty, after the great deliverance that God has lately wrought for this country and kingdom [in 1689], in the first place to settle and secure therein the true Protestant religion according to the truth of God’s word as it has of a long time been professed within this land. As also the government of Christ’s church within this nation agreeable to the word of God and most conducive to the advancement of true piety and godliness and the establishing of peace and tranquillity within this realm… Therefore their majesties, with advice and consent of the said three estates, do hereby revive, ratify and perpetually confirm all laws, statutes and acts of parliament made against popery and papists and for the maintenance and preservation of the true reformed Protestant religion and for the true church of Christ within this kingdom, in so far as they confirm the same, or are made in favour thereof. Likewise they, by this act, ratify and establish the Confession of Faith now read in their presence and voted and approved by them as the public and avowed confession of this church, containing the sum and substance of the doctrine of the reformed churches; which Confession of Faith is subjoined to this present act; as also, they do establish, ratify and confirm the presbyterian church government and discipline…”

ing+presbyterian+church+government+in+The+Records+of+the+Parliaments+of+Scotland+to+1707%2C+eds.+K.M.+Brown+et+al.+%28St+Andrews%2C+2007-2025%29+On+the+interpretation+of+this+see+Cooper%2C+pp.+45-49+%26+50-51.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa55fd695ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a55fd695ed.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-scottish-church-history/#:~:text=Our%20sovereign%20lord%20and%20lady%20the,the%20presbyterian%20church%20government%20and%20discipline&amp;text=Our%20sovereign%20lord%20and%20lady%20the%20king%20and&amp;text=and%20confirm%20the%20presbyterian%20church%20government%20and%20discipline" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ce5619f376" data-kw="">
<blockquote><p>Thirdly, true matter [of the Church] are all such [persons] as are baptized, and openly profess that Jesus the son of Mary is the Son of God, made Christ the Lord, by whom only and alone is salvation… … Thirdly, because it is the sum of the whole Gospel, and Covenant in the New Testament, in respect whereof, there is no other point of religion necessary, but as it tends either to bring men unto, or to confirm them in this main truth. Hence it is, that St. John concludes his Gospel with this scope… And therefore since such as do profess this truth do summarily and in general profess all the evangelical doctrines in God’s book, such must needs be fit matter of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610), 8th Error, p. 271</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-73f3a162aa" data-kw="">
<blockquote><p>The principles that have been learned and our rebalancing of priorities ought to not only show us that the unifying of Christ’s Church is possible, but it is obligatory and this ought to cause us to endeavor after it… The civil allowance of the more sound protestant denominations in England [in 1690]… could only tend toward facilitating and cementing those denominations into remaining separate, entering us into modern denominationalism. To seek to reverse that trend, Phil. 3:15-16, “whereto we have already attained, let us walk by the same rule, let us mind the same thing,” will be expounded and cleared from the separatistic construction often put on it. Lastly, principles of Scripture, Westminster, the Scots and the London presbyterians for unifying the Church will be laid out and recommended, versus erecting denominational white towers. The fundamentals (at least) of Christianity will be seen to be sufficient and obligatory Scriptural doctrinal grounds for organic Church union (with all due care and prudence), as the post-apostolic early Church, many of the reformed (including the leading Scottish covenanter James Durham) and the London presbyterians taught, it being no sin, but a divine obligation for the stronger to help and be united to the weaker (though they must relinquish rights and privileges for the here now to do so). Consequently, secondary teachings and practices which do not tend to overturn the fundamentals or the power of godliness will be seen to be no grounds for division, or schism. Objections will be resolved and the reform of Christ’s one Church will be encouraged and set on its way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, 4. “White Towers &amp; Unifying Christ’s Church” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 160-89, p. 160</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<main class="wrap"><figure class="quote" id="q-285b3777e4" data-kw="">
<blockquote><p>Justification does not come by keeping the whole law or any part of it, nor is it given on the basis of uncircumcision, the laws of nature or any other traditions. Here we see the opinion of those who say that before the law was given, our ancestors were justified by the laws of nature, but that after the law was given, they were justified by the laws of Moses and nowadays we are justified by the gospel and the other laws that we have.

To counter this idea, we must firmly insist that there has always been only one and the same form of justification, which consists of faith. In this verse [Galatians 5:6] Paul removes every privilege of the flesh and thus everything else as causes of righteousness, apart from faith, the promise, the gospel and so on. To express all this the apostle uses two words, circumcision and uncircumcision, in order to make Jews and Gentiles equal to one another and proclaim that both are justified for exactly the same reasons. …

Faith is effective through love. Once it has obtained righteousness, it is neither slow nor lazy in doing other good works of charity. If faith justified us through love or by the addition of love, our righteousness would be uncertain because nobody would know at what point he had loved enough to obtain righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 176.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d834afe99" data-kw="">

</figure><figure class="quote" id="q-eae9c4d386" data-kw="">
<blockquote><p>Nor have the best of our duties any other respect unto the continuation of our justification, but only as in them we are preserved from those things which are contrary unto it, and destructive of it. But the sole question is, upon what the continuation of our justification does depend, not concerning what duties are required of us in the way of our obedience.</p></blockquote>

</figure><figure class="quote" id="q-63888d76cf" data-kw="">
<blockquote><p>Whether good or bad. That is, whether he did good or evil. Each person will receive according to his deeds, whether good or bad. It is from passages such as this that some American theologians have inferred that the only benefit the believer receives from Christ is the forgiveness of sin, and that being pardoned he is dealt with according to the principles of justice. Others, especially in Germany, have drawn from the same source the conclusion that the doctrine of Paul is that the merit of Christ cleanses only from the sins committed before conversion. If a Jew or Gentile became a Christian, his sins were blotted out, and then he was rewarded or punished, saved or lost, according to his works. The merit of Christ did not bring pardon for sin committed after conversion. This is very much the ancient doctrine that there is no forgiveness for post-baptismal sins. The benefits of Christ’s work, according to many of the ancients, are conveyed to the soul in baptism, but if once forfeited by sin can never be reapplied. This gloomy doctrine, which belonged to the transition period that preceded the full development of theology of the papal church, has been revived by the Roman Catholics of the present day. But according to the Scriptures, the blood of Jesus Christ cleanses from all sin, whether committed before or after baptism or conversion. It is a fountain to which we may come every day for cleansing. He is a priest who lives forever to make intercession for us and who always presents before God the merit of his sacrifice as a perpetual offering, typified by the morning and evening sacrifice under the law. According to the anti-scriptural views mentioned above, when a person first comes to Christ his sins are forgiven, and he then begins afresh under the covenant of works and stands in the same relationship to God as Adam did before the fall. The condition of salvation is to him as it was to our first parent: “Do this and live.” Christ is of no use to him from now on. See Romans 6:14. But in truth, because of the one offering of Christ, by which those who believe are sanctified forever (that is, they are atoned for), God does not impute the penitent believer’s sins to him and condemn him. He is not judged by the law or treated according to its principles, for then no one could be saved. But he is treated as someone for all whose sins—past, present, and future—an infinite satisfaction has been made and who has a perpetual claim to that satisfaction as long as he is united to Christ by faith and the indwelling of his Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 2 Corinthians, ed. Alister McGrath, Crossway Classic Commentaries (Wheaton, IL: Crossway Books, 1995), 2 Co 5:10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

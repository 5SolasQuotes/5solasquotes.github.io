<main class="wrap"><figure class="quote" id="q-370e0c736d" data-kw="">
<blockquote><p>[…] Papists, home-born Papists, who are vipers that most unnaturally have endeavoured to eat through their mother’s bowels. Not their nature only, but their Religion also, teaches and allows them for the Good of the Catholic cause, falsely so called, not to spare their own native Country, their own kindred, Brothers, Fathers, no not of their own Religion. To blow up Parliaments, to ruin Cities, Countries, Kingdoms, is their ordinary work. Especially of those, whom they call Jesuits, the Bellows of Hell, the Incendiaries of Christendom, at this day. The Curse of God is upon them fearfully for arrogating their Name from Jesus, which signifies a Saviour, and is impropriated to the Son of God: Thou shalt call his name Jesus. These men, that call themselves Jesuits, are, by the just judgement of God upon them, Destroyers of Cities, Countries, Kingdoms, and might far better take their name from him, who is called in Hebrew Abaddon, and in Greek Apollon, but signifying a Destroyer. Revel. 9. 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The good man a public good. A sermon preached to the honourable House of Commons, at the late solemn fast:</cite>, January 31, 1643 (London, 1643), pp 28-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a18f08e0ca" data-kw="">
<blockquote><p>I seek not to obtrude unto you any private opinion of mine own; the best learned in our profession are of this judgement, that all the corruptions of the Church of Rome, do not prove her to deny the foundation directly; if they did, they should grant her simply to be no Christian Church. But I suppose, saith one, that in the Papacy some Church remaineth, a Church crased [cracked], or, if you will, broken quite in pieces, forlorn, mishapen, yet some Church: his reason is this, Antichrist must sit in the Temple of God.

Least any man should think such sentences as these to be true, only in regard of those, whom that Church is supposed to have kept by the special providence of God, as it were in the secret corners of his bosom, free from infection, and as sound in the faith, as we trust, by his mercy, we our selves are: I permit it to your wise considerations, whether it be more likely, that as frenzy, though it self take away the use of reason, doth notwithstanding prove them reasonable creatures which have it, because none can be frantic but they: so Antichristianity being the bain, and plain overthrow of Christianity, may nevertheless argue the Church wherein Antichrist sitteth, to be Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works, and how the Foundation of Faith is Overthrown</cite>, (Oxford: Joseph Barnes, 1612), p. 45.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

<blockquote><p>Now I confidently say that whosoever calls himself, or desires to be called, Universal Priest, is in his elation the precursor of Antichrist, because he proudly puts himself above all others. Nor is it by dissimilar pride that he is led into error; for, as that perverse one wishes to appear as above all men, so whosoever this one is who covets being called sole priest, he extols himself above all other priests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 7, ep. 33 (to the Emperor Maurice)</span></figcaption>

</figure><figure class="quote" id="q-030dbef600" data-kw="">
<blockquote><p>Wherefore do ye lay out your silver for that which is no bread, and your labour on that which is not to satisfy? As before he exhorted vs to come and buy freely, without money; because God is no money man, neither can any man deserve favour at his hands, but whatsoever we have of him, we have it of mercy: so now he sharply reproveth all such, as by money or merchandise; by desert, or merit seek after salvation. He dehorteth us from false teachers, crafty seducers, which offer to sell the grace and mercy of GOD for money.

Christ proposeth his heavenly treasures, remission of sins, justification, sanctification, mercy, grace and salvation freely. He that sitteth in the Temple of God, and termeth himself Christ’s Vicar, doeth in like sort offer unto the people bread, water, wine, milk, pardon of sins, grace, mercy and eternal life: but not freely, he is a merchant, he giveth nothing, and that is nothing which he selleth. For although he make large promises to the buyer, he selleth that which he hath not to deliver. Eternal life is the gift of God.

The Pope therefore selleth but wind and smoke for fire, shadows for truths: he deceiveth the buyers with false lights, false measures, false weights. Beware of this merchant; loose not your labour; cast not away your money: it is not meat but poison which he offereth you. His physique cannot heal your diseases; His holy water cannot wash away the spots of a sullied and defiled soul, as he untruly would bear you in hand; His blasphemous Masses do not appease, but provoke God’s wrath; they cannot benefit the quick, much less the dead, which either need no help, or are past al help; His rotten relics cannot comfort you; His blind, dumb, and worm-eaten Idols can do you no good; It is cast away which is spent upon his shameless pardons, they will not prevail, God will not admit them; By his Latin service ye cannot be edified, or made wiser.

Yet this trumpery they sell for money, and upon this trash they cause silly men to waste their substance, and to these to commit their souls. Thus you see a manifest difference between Christ and Antichrist, the doctrine of God and the learning of man, true teachers and false, sound and counterfeited religion. The one offereth true bread, freely; the other that which is no bread for bread, and that not freely neither, but for money.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 5.</span></figcaption>

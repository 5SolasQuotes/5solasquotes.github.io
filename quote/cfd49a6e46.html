</figure><figure class="quote" id="q-437ee5df90" data-kw="">
<blockquote><p>True, God makes us willing of unwilling, and so we resist not. But how does He make us willing? Whether by an irresistible manner of working in us, or not, this, say the opponents, is the main question. Surely so, as that, to use Aquinas his word, the will is impelled, though not compelled; so as that, though there is in the nature of the will a freedom and capacity of agreeing or dissenting, in respect of itself, yet as it is for the present moved and actuated by the effectual inclination of the Almighty, now it so sways one way as if it had for the time put off the power of refusing. What need we then trouble ourselves with these upstart terms of ‘resistible’ and ‘irresistible’? Let it content us that the gracious in-operation of God effectually draws the heart of man to will, to receive, to entertain the happy motions of his good Spirit to our renovation. If we yield not this to God, we yield nothing; and if we give Him this, He will not quarrel us for more. But what place soever these differences have found in foreign schools and pulpits, ours have reason to be free, if we shall listen to that wise and moderate voice of our [Anglican] Church, which our forecited reverend author [Bishop Overall] commends unto us, who, after the relation of the two extreme opinions, rests in this, medio tutissimus: that men are so stirred and moved by grace that they may, if they attend thereunto, obey the grace which calls and moves them; and that they may, by their free will, also resist it. But withal, that God, when He will, and to whom He will, gives such an abundant, such powerful, such congruous, otherwise effectual grace, that although the will may, in respect of the liberty thereof, resist, yet it resists not, but does certainly and infallibly obey; and that thus God deals with those whom He has chosen in Christ so far as shall be necessary to their salvation. Who so cannot sit down quietly in this decision, methinks, should be no friend to peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (d. 1656; London: Cadwel, 1660), 5th Article, ‘Of Perseverance’, pp. 383-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

<blockquote><p>LVIII. 3. The will of God is also distinguished into that by which He wills to do or to prevent something, and which is called “the will of his good pleasure,” or rather “of his pleasure” (Ps. 115:3), and into that by which He wills something to be done, or to be omitted, by creatures endued with understanding, and which is called “the will [signi] which is signified.” The latter is revealed; the former is partly revealed, and partly hidden. (Mk. 3:35; 1 Thess. 4:3; Dt. 29:29; 1 Cor. 2:11-12) The former is efficacious, for it uses power, either [tanta] so much as cannot be resisted, or [tali] such a kind as He certainly knows nothing will withstand: (Ps. 33:9; Rom. 9::19) The latter is called “inefficacious,” and resistance is frequently made to it; yet so that, when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28) To this twofold Will is opposed the remission of the Will, which is called “Permission,” and which is also two-fold. The one, which permits something to the power of a rational creature, by not circumscribing its act with a law; and this is opposed to “the revealed Will.” The other is that by which God permits something [potentiae] to the capability and will of the creature, by not interposing an efficacious hindrance; and this is opposed to “the Will of God’s pleasure” that is efficacious. (Acts 14:16; Ps. 81:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-arminius.html">James Arminius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of James Arminius</cite>, tr. James Nichols (Auburn: Derby, Miller, Orton, 1853), vol. 1, Public Disputations, Disputation 4, ‘On the Nature of God’, pp. 453-54 Arminius was a theological professor at Leiden. He tended not to go into controversial things in his Public Disputations.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“LVIII. 3. The will of God is also distinguished into that by which He wills to do or to prevent something, and which is called “the will of his good pleasure,” or rather “of his pleasure” (Ps. 115:3), and into that by which He wills something to be done, or to be omitted, by creatures endued with understanding, and which is called “the will [signi] which is signified.” The latter is revealed; the former is partly revealed, and partly hidden. (Mk. 3:35; 1 Thess. 4:3; Dt. 29:29; 1 Cor. 2:11-12) The former is efficacious, for it uses power, either [tanta] so much as cannot be resisted, or [tali] such a kind as He certainly knows nothing will withstand: (Ps. 33:9; Rom. 9::19) The latter is called “inefficacious,” and resistance is frequently made to it; yet so that, when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28) To this twofold Will is opposed the remission of the Will, which is called “Permission,” and which is also two-fold. The one, which permits something to the power of a rational creature, by not circumscribing its act with a law; and this is opposed to “the revealed Will.” The other is that by which God permits something [potentiae] to the capability and will of the creature, by not interposing an efficacious hindrance; and this is opposed to “the Will of God’s pleasure” that is efficacious. (Acts 14:16; Ps. 81:13)”

— James Arminius, The Works of James Arminius, tr. James Nichols (Auburn: Derby, Miller, Orton, 1853), vol. 1, Public Disputations, Disputation 4, ‘On the Nature of God’, pp. 453-54 Arminius was a theological professor at Leiden. He tended not to go into controversial things in his Public Disputations.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLVIII.+3.+The+will+of+God+is+also+distinguished+into+that+by+which+He+wills+to+do+or+to+prevent+something%2C+and+which+is+called+%E2%80%9Cthe+will+of+his+good+pleasure%2C%E2%80%9D+or+rather+%E2%80%9Cof+his+pleasure%E2%80%9D+%28Ps.+115%3A3%29%2C+and+into+that+by+which+He+wills+something+to+be+done%2C+or+to+be+omitted%2C+by+creatures+endued+with+understanding%2C+and+which+is+called+%E2%80%9Cthe+will+%5Bsigni%5D+which+is+signified.%E2%80%9D+The+latter+is+revealed%3B+the+former+is+partly+revealed%2C+and+partly+hidden.+%28Mk.+3%3A35%3B+1+Thess.+4%3A3%3B+Dt.+29%3A29%3B+1+Cor.+2%3A11-12%29+The+former+is+efficacious%2C+for+it+uses+power%2C+either+%5Btanta%5D+so+much+as+cannot+be+resisted%2C+or+%5Btali%5D+such+a+kind+as+He+certainly+knows+nothing+will+withstand%3A+%28Ps.+33%3A9%3B+Rom.+9%3A%3A19%29+The+latter+is+called+%E2%80%9Cinefficacious%2C%E2%80%9D+and+resistance+is+frequently+made+to+it%3B+yet+so+that%2C+when+the+creature+%5Bexcedit+ordinem%5D+transgresses+the+order+of+this+revealed+Will%2C+the+creature+by+it+may+be+reduced+to+order%2C+and+that+the+Will+of+God+may+be+done+%5Bde%5D+on+those+by+whom+his+Will+has+not+been+performed.+%282+Sam.+17%3A14%3B+Isa.+5%3A4-5%3B+Mt.+21%3A39-41%3B+Acts+5%3A4%3B+1+Cor.+7%3A28%29+To+this+twofold+Will+is+opposed+the+remission+of+the+Will%2C+which+is+called+%E2%80%9CPermission%2C%E2%80%9D+and+which+is+also+two-fold.+The+one%2C+which+permits+something+to+the+power+of+a+rational+creature%2C+by+not+circumscribing+its+act+with+a+law%3B+and+this+is+opposed+to+%E2%80%9Cthe+revealed+Will.%E2%80%9D+The+other+is+that+by+which+God+permits+something+%5Bpotentiae%5D+to+the+capability+and+will+of+the+creature%2C+by+not+interposing+an+efficacious+hindrance%3B+and+this+is+opposed+to+%E2%80%9Cthe+Will+of+God%E2%80%99s+pleasure%E2%80%9D+that+is+efficacious.+%28Acts+14%3A16%3B+Ps.+81%3A13%29%E2%80%9D%0A%0A%E2%80%94+James+Arminius%2C+The+Works+of+James+Arminius%2C+tr.+James+Nichols+%28Auburn%3A+Derby%2C+Miller%2C+Orton%2C+1853%29%2C+vol.+1%2C+Public+Disputations%2C+Disputation+4%2C+%E2%80%98On+the+Nature+of+God%E2%80%99%2C+pp.+453-54+Arminius+was+a+theological+professor+at+Leiden.+He+tended+not+to+go+into+controversial+things+in+his+Public+Disputations.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa998d1ddc8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a998d1ddc8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=LVIII.%203.%20The%20will%20of%20God,is%20efficacious.%20%28Acts%2014%3A16%3B%20Ps.%2081%3A13&amp;text=LVIII.%203.%20The%20will%20of%20God%20is%20also&amp;text=pleasure%E2%80%9D%20that%20is%20efficacious.%20%28Acts%2014%3A16%3B%20Ps.%2081%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

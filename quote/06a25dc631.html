<main class="wrap"><figure class="quote" id="q-06a25dc631" data-kw="">
<blockquote><p>Christian faith, therefore, is personal reliance upon Christ for salvation because of belief of God&#x27;s testimony as to our sinful and ruined condition, and as to what Christ has assuredly done to save us. It is based, therefore, upon the knowledge of this testimony as given by our own consciences and the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abstract of Systematic Theology</cite>, ch. 34</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-78a37f921f" data-kw="">
<blockquote><p>But it is not any one particular act or habit, nor must it be restricted to any one particular faculty of the soul, for it is a certain complex thing, consisting of various acts, which, without confusion pervade, and by a sweet and happy conjunction, mutually promote and assist one another; it imports a change of the whole man, is the spring of the whole spiritual life, and in fine, the holy energy and activity of the whole soul towards God, in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 3.7.1</span></figcaption>

</figure><figure class="quote" id="q-199882bcc3" data-kw="faith response to call">
<blockquote><p>For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise. The Scriptures often introduce this colloquy: “I will say, It is my people; and they shall say, The Lord is my God” (Hos. 2:23; Zech. 13:9; cf. Ps. 27:8; Jer. 3:22; Rom. 8:15, 16).</p></blockquote>

</figure><figure class="quote" id="q-553bd25b66" data-kw="">
<blockquote><p>The reception of that gift is faith: faith means not doing something but receiving something; it means not the earning of a reward but the acceptance of a gift. A man can never be said to obtain a thing for himself if he obtains it by faith; indeed to say that he obtains it by faith is only another way of saying that he does not obtain it for himself but permits another to obtain it for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Is Faith?</cite>, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-159631b248" data-kw="">
<blockquote><p>Faith consists not in ignorance, but in knowledge--knowledge not of God merely, but of the divine will. We do not obtain salvation either because we are prepared to embrace every dictate of the Church as true, or leave to the Church the province of inquiring and determining; but when we recognize God as a propitious Father through the reconciliation made by Christ, and Christ as given to us for righteousness, sanctification, and life.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bab3a2fca6" data-kw="">
<blockquote><p>XXIX. Therefore the end of satisfaction, to whom, or the object, is solely the elect and true believers of both the Old and New Testament. For although it could extend itself to all men with respect to the greatness, dignity, and sufficiency of the price considered in itself, nevertheless it was particularly expended for those whom the Father elected and gave to the Son, and who by God’s gift would believe in God and His Son. Whence Scripture repeatedly says that He gave Himself for His own, and for us, for the sheep, and for the Church. Mt. 20:7, 28 and 26 [i.e. Mt. 26:28]; 1 Jn. 3:16; Acts 20:28, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On the Satisfaction of Jesus Christ’ in Synopsis of Pure Theology (1625), trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-52c14a01f6" data-kw="">
<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-b2d7f4b54a" data-kw="">
<blockquote><p>52. Given the inherently diverse and manifold structure of the ordinances of civil government and the Church (not to mention their de facto material structures), in their varied subjects, authorities, objects, purposes, ends, means, adjuncts, effects, relations to each other and how they relate differently to God and Christ,† the phrases “God” and “Christ centered voting” are simplistic and unhelpful. † See ed. Fentiman, All of George Gillespie’s Writings on Christ’s Mediatorial Kingdom is the Church Only (RBO, 2014), pp. 9-10 &amp; 18-27 One can talk about “Christ centered mowing the lawn” or “plumbing,” as Christians ought to mow their lawn and do plumbing in faith to Christ and support his Church by it if possible, perhaps by mowing a church’s lawn or fixing some of their leaky pipes, but the nature, science and work of mowing the lawn and plumbing, or their immediate, nearest ends, do not center around Christ, but around mowing the lawn and plumbing. Likewise, “Christ centered voting,” or “politics,” is most directly centered around voting and politics, and “Christ centered chess” is difficult to appreciate. On the other hand, trusting Christ to save us from our sins, growing in the knowledge of Christ and worshipping Him are Christ centered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ (2024), ‘Christ Centered Voting’ at ‘On Voting’ (RBO)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

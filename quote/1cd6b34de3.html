<main class="wrap"><figure class="quote" id="q-1cd6b34de3" data-kw="unpardonable">
<blockquote><p>This was opposed by the decree of the National Synod which met at Charenton in 1644, which sanctioned and confirmed the doctrine received in our churches concerning the imputation of Adam’s first sin and the hereditary corruption flowing upon all. The words of the decree are as follows: “Whereas a report has been made to the Synod of certain writings, printed and manuscript, by which the nature of original sin is made to consist solely in the hereditary corruption, originally residing in all men, but the imputation of the first sin of Adam is denied; the Synod condemns the aforesaid doctrine so far as it restricts the nature of original sin to the mere hereditary corruption of Adam’s posterity, excluding the imputation of the first sin by which he fell; and, under the penalty of censures of all kinds, forbids all pastors, professors and others who may treat this subject, to depart from the common opinion of all Protestant churches, which, besides corruption, have always acknowledged the aforesaid imputation to the whole posterity of Adam. And commands all synods and classes, in takin</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a> › <a href="../topics/sin/degrees-of-sin/sin-against-the-holy-spirit.html">Sin against the Holy Spirit</a></span><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a> › <a href="../topics/sin/degrees-of-sin/unpardonable-sin.html">Unpardonable sin</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 9.9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis%20was%20opposed%20by%20the%20decree%20of%20the%20National%20Synod%20which%20met%20at%20Charenton%20in%201644%2C%20which%20sanctioned%20and%20confirmed%20the%20doctrine%20received%20in%20our%20churches%20concerning%20the%20imputation%20of%20Adam%E2%80%99s%20first%20sin%20and%20the%20hereditary%20corruption%20flowing%20upon%20all.%20The%20words%20of%20the%20decree%20are%20as%20follows%3A%20%E2%80%9CWhereas%20a%20report%20has%20been%20made%20to%20the%20Synod%20of%20certain%20writings%2C%20printed%20and%20manuscript%2C%20by%20which%20the%20nature%20of%20original%20sin%20is%20made%20to%20consist%20solely%20in%20the%20hereditary%20corruption%2C%20originally%20residing%20in%20all%20men%2C%20but%20the%20imputation%20of%20the%20first%20sin%20of%20Adam%20is%20denied%3B%20the%20Synod%20condemns%20the%20aforesaid%20doctrine%20so%20far%20as%20it%20restricts%20the%20nature%20of%20original%20sin%20to%20the%20mere%20hereditary%20corruption%20of%20Adam%E2%80%99s%20posterity%2C%20excluding%20the%20imputation%20of%20the%20first%20sin%20by%20which%20he%20fell%3B%20and%2C%20under%20the%20penalty%20of%20censures%20of%20all%20kinds%2C%20forbids%20all%20pastors%2C%20professors%20and%20others%20who%20may%20treat%20this%20subject%2C%20to%20depart%20from%20the%20common%20opinion%20of%20all%20Protestant%20churches%2C%20which%2C%20besides%20corruption%2C%20have%20always%20acknowledged%20the%20aforesaid%20imputation%20to%20the%20whole%20posterity%20of%20Adam.%20And%20commands%20all%20synods%20and%20classes%2C%20in%20takin%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%209.9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1cd6b34de3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1cd6b34de3.html">Permalink</a><a class="src" href="https://drive.google.com/file/d/1YcwwT0MNnEuPwYSOy3Gfw-0tA7Jvm9N8/view?usp=drivesdk" rel="noopener" target="_blank">Read it online · Drive (Nick&#x27;s copy)</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc0406b35f" data-kw="imputation">
<blockquote><p>However although this mode of general propagation is evident and is sufficient for establishing the truth of the traduction of sin; whence since Julian sought through what chinks sin could have entered, since he does not sin who is born; he does not sin who begat; he does not sin who made—Augustine answers, “Why does he seek a concealed crack, when he has a wide open gate? By one man.… What does he seek further; what clearer; what more impressive?” (On Marriage and Concupiscence 2.28 [NPNF1, 5:302; PL 44.464]). Still because the importunity of our opponents is wont to attack this mode violently as impossible (because sin can neither pass by the soul, which is created by God and is not drawn from the body, nor by the body which is brute and incapable of sin), let us see what can be said here more particularly to untie the knot which they think cannot be loosed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.12</span></figcaption>

</figure><figure class="quote" id="q-634fea95c0" data-kw="Holiness">
<blockquote><p>Observe the holiness and perfection of God&#x27;s law, which forbids the first motions and risings of sin in the heart. The laws of men take hold of actions; but the law of God goes further—it forbids not only sinful actions—but sinful desires.</p></blockquote>

</figure><figure class="quote" id="q-015fbad160" data-kw="">

<main class="wrap"><figure class="quote" id="q-cc61a43d00" data-kw="">
<blockquote><p>October 31, 1798… I have just passed through the most awful scene of epidemic sickness and mortality that I ever witnessed. The Yellow Fever has been raging in the city for more than two months past. From the middle to the 25th of this month was the most mortal time. Though the city was deserted by, perhaps, two-thirds of its regular inhabitants, more than two thousand persons fell victim to the disease. I remained with a brother — a beloved brother — a practitioner of medicine — a bachelor as well as myself. We were both mercifully borne through the raging epidemic without any serious attack. Our housekeeper died of it, and I attended her funeral between midnight and day. To attempt to describe the scenes of mourning and horror which this epidemic presented — I dare it. The task transcends my power of expression. I preached every Sabbath; but only a few attended public worship; and I know not that any sensible — certainly no conspicuous — good was done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Samuel Miller, Jr., The Life of Samuel Miller, D.D. LL.D</cite>, Vol. 1, p. 118</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-3ba91ec5ce" data-kw="">
<blockquote><p>Moreover, why should he be said to distrust the promises of God, who doth follow the ways appointed by God, to avoid evils, that notwithstanding he dependeth wholly upon God; unless peradventure we can any where find in the holy Scriptures this commandment expressly written: ‘When the plague rageth, fly not away.’ And amongst them, preservative remedies are to be reckoned; and amongst these, going aside in due time; the like also, as the very name of ‘contagion’ doth manifest. And this also is plain, That he doth not only not offend against Christian charity, neither yet tempt God, who in such manner by going aside doth avoid the plague, so that in the mean time he let pass no act of piety towards God, or of charity towards his neighbour; That on the contrary, unless he perform these duties, he may be thought to provoke the wrath of God against himself, and to be worse than an infidel, as being one that rashly puts himself in danger of deadly infection, without any care of himself, or his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Learned &amp; Pithy Treatise of the Plague, Wherein are Handled These Two Questions</cite>, (1580; London, 1665), p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“Moreover, why should he be said to distrust the promises of God, who doth follow the ways appointed by God, to avoid evils, that notwithstanding he dependeth wholly upon God; unless peradventure we can any where find in the holy Scriptures this commandment expressly written: ‘When the plague rageth, fly not away.’ And amongst them, preservative remedies are to be reckoned; and amongst these, going aside in due time; the like also, as the very name of ‘contagion’ doth manifest. And this also is plain, That he doth not only not offend against Christian charity, neither yet tempt God, who in such manner by going aside doth avoid the plague, so that in the mean time he let pass no act of piety towards God, or of charity towards his neighbour; That on the contrary, unless he perform these duties, he may be thought to provoke the wrath of God against himself, and to be worse than an infidel, as being one that rashly puts himself in danger of deadly infection, without any care of himself, or his.”

-danger/#:~:text=Moreover%2C%20why%20should%20he%20be%20said,any%20care%20of%20himself%2C%20or%20his&amp;text=Moreover%2C%20why%20should%20he%20be%20said%20to%20distrust&amp;text=infection%2C%20without%20any%20care%20of%20himself%2C%20or%20his" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f78ef9fd2e" data-kw="">
<blockquote><p>A spiritual prayer is accompanied with the use of means… When Hezekiah was sick, he did not only pray for recovery, but he laid a lump of figs to the boil, Isa. 38:21. Thus it is in case of the soul, when we pray against sin, and avoid temptations; when we pray for grace, and improve opportunities, this is the laying a fig to the boil, which will make us recover: To pray for holiness, and neglect the means, is like winding up the clock, and pulling off the weights.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Godly Man’s Picture Drawn with a Scripture Pencil</cite>, (London, 1666), p. 125</span></figcaption>

</figure><figure class="quote" id="q-4f2cfd9477" data-kw="">
<blockquote><p>…we are unworthy to lift up our eyes unto heaven and appear in thy presence, and that we ought not to presume to hope that thou wilt listen to our prayers if thou takest account of the things which we lay before thee; for we are accused by our own consciences, and our sins bear witness against us, while we know thee to be a just Judge, who justifiest not sinners and wicked men, but inflictest punishment on those who have broken thy commands. Hence it is, Lord, that when we reflect on the state of our whole life, we are ashamed of ourselves, and can do nothing but despond, just as if we were plunged into the abyss of death. And yet, Lord, since thou hast deigned, of thy boundless mercy, to command us to call upon thee, and that from the lowest hell, and the more devoid of strength we see ourselves to be to flee the more to thy supreme goodness ; since, moreover, thou hast promised that thou wilt listen to our prayers in the name of the Lord Jesus Christ, (whom thou hast appointed to be our advocate and intercessor,) and for his merit, without looking to what we have deserved, we here, renouncing all human confidence, and trusting solely to thy goodness, hesitate not to come into thy sight, and call upon thy holy name, in order to obtain mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, ‘Almighty God, heavenly Father, we acknowledge and humbly confess…’ in Forms of Prayer for the Church in ‘Forms of Prayer’ in Tracts, vol. 2</span></figcaption>

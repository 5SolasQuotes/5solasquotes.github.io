<main class="wrap"><figure class="quote" id="q-f629dc1361" data-kw="">
<blockquote><p>In regard then to the place which it occupies, it forms one of the Ten Commandments; all the rest of which are confessedly of eternal obligation, and were delivered in a very different manner, indeed, from the ceremonial law, which was to be binding on the Church only under the Mosaic dispensation.

The Ten Commandments were spoken by God himself from amidst the thunders and lightnings of mount Sinai, in the hearing of all the people; and he added no more, but wrote them once and again on two tables of stone, and delivered them unto Moses, to be by him deposited in the ark which was placed under the mercy-seat in the Holy of Holies.

It was not so with any other law or commandment enjoined upon Israel. All the rest were delivered to Moses in the mount, beyond the hearing of the Assembly of Israel: they were written by Moses in a book; and, though carefully preserved, still, as has been well observed, they were placed, not in, but by the side of the ark, as if to intimate that they might one day be separated and removed from it. But the Ten Commandments were placed in the ark under the mercy-seat, intimating that they were to receive their fulfilment in Him of whom the ark was a type, even Christ who is the “end of the law for righteousness to every one that believeth,” and without whose perfect obedience to the law there never could have been a mercy-seat for sinners to approach.

It is impossible, I think, seriously to consider all these circumstances, without being convinced that it was the purpose of God to distinguish the Fourth Commandment above all precepts and institutions of a mere positive or ceremonial nature—that, in fact, he has given to it all the weight and permanency of a moral obligation.

And, indeed, it is plain that, in substance, it is of a moral nature; for if, as God’s rational creatures, we are under an eternal obligation, in some way or other, to worship and do him homage, then some portion of time must necessarily be devoted to that duty; and though our reason might not be able to discover, in the nature of the thing, any necessity for that time being limited to one day rather than another, yet, did we understand the constitution of our nature as God understands it, or could we estimate as he estimates the tendency and the influence of his institutions, as they are calculated to affect us; I doubt not we should perceive something very different from a mere arbitrary arrangement, in his expressly appointing one whole day in seven to be a holy Sabbath to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>

<blockquote><p>Touching the time of God’s worship, it was the seventh day from the beginning of the creation, the Sabbath day. And here we must note, that the keeping of the Sabbath is moral. Some indeed do plead that it is but a ceremony; yet falsely: for it was ordained before the fall of man, at which time Ceremonies signifying sanctification had no place. Nay mark further: Adam in his innocency was not clogged with sin as we are; and yet then he had a set Sabbath to worship God his creator: and therefore much more need hath every one of us a Sabbath day, wherein we may sever our selves from the works of our callings, and the works of sin, to the worship of God in the exercise of religion, and godly meditation of our creation.

This point must be learned of us, for when no occasion is offered of business, then men will formally seem to keep the Sabbath: but if there come occasion of breaking the Sabbath, as traffic, gaming, and vain shows, then Sabbath farewell, men will have their pleasures, let them worship God that will. But let us remember in the fear of God, that whosoever continueth in the breach of this law being moral, God will no less pour forth his punishments upon them, then for the breach of any other commandment: the consideration whereof, must move every man to a reverent sanctifying of the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 238.</span></figcaption>

<blockquote><p>10 Q. What is the difference between the law and the gospel? A. The law is a doctrine that God has implanted in human nature and has repeated and renewed in His commandments. In it He holds before us, as if in a manuscript, what it is we are and are not to do, namely, obey Him perfectly both inwardly and outwardly. He also promises eternal life on the condition that I keep the law perfectly my whole life long. On the other hand, He threatens eternal damnation if I do not keep every provision of the law my whole life long but violate it in one or more of its parts. As God says in Deuteronomy 27[:26] and Galatians 3[:10], “Cursed is everyone who does not continue in all things which are written in the book of the law, to do them.” And once the law has been violated, it has no promise that by the help of the law, that is, by works of the law, our sins might be forgiven. Rather, the sentence of condemnation is imposed upon us. The gospel or good news, however, is a doctrine of which even the wisest knew nothing by nature but which is revealed from heaven. In it God does not demand but rather offers and gives us the righteousness that the law requires. This righteousness is the perfect obedience of the suffering and death of Jesus Christ, through which all sin and damnation, made manifest by the law, is pardoned and washed away (Rom. 5; Gal. 3). Furthermore, God does not give us forgiveness of sins in the gospel on the condition that we keep the law. Rather, even though we never have kept it nor will ever be able to keep it perfectly, He still has forgiven our sins and given us eternal life as an unmerited gift through faith in Jesus Christ. John 1[:17] says, “The law was given through Moses, but grace and truth come through Jesus Christ.” And Romans 8[:3, 4]: “What for the law was impossible in that it was weak through the flesh, God did by sending His Son in the likeness of sinful flesh, and condemned sin the flesh through sin, that the righteousness required by the law might be fulfilled in us, who do not walk according to the flesh but according to the Spirit.” Finally, Galatians 3:[12–14]: “The law is not of faith but ‘The man who does it shall live by it.’ Christ, however, redeemed us from the curse of the law when He became a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), that the blessing of Abraham might come upon the Gentiles in Christ Jesus and we thus might receive the promised Spirit through faith.</p></blockquote>

— Caspar Olevianus, A Firm Foundation, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 9–10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C10+Q.+What+is+the+difference+between+the+law+and+the+gospel%3F+A.+The+law+is+a+doctrine+that+God+has+implanted+in+human+nature+and+has+repeated+and+renewed+in+His+commandments.+In+it+He+holds+before+us%2C+as+if+in+a+manuscript%2C+what+it+is+we+are+and+are+not+to+do%2C+namely%2C+obey+Him+perfectly+both+inwardly+and+outwardly.+He+also+promises+eternal+life+on+the+condition+that+I+keep+the+law+perfectly+my+whole+life+long.+On+the+other+hand%2C+He+threatens+eternal+damnation+if+I+do+not+keep+every+provision+of+the+law+my+whole+life+long+but+violate+it+in+one+or+more+of+its+parts.+As+God+says+in+Deuteronomy+27%5B%3A26%5D+and+Galatians+3%5B%3A10%5D%2C+%E2%80%9CCursed+is+everyone+who+does+not+continue+in+all+things+which+are+written+in+the+book+of+the+law%2C+to+do+them.%E2%80%9D+And+once+the+law+has+been+violated%2C+it+has+no+promise+that+by+the+help+of+the+law%2C+that+is%2C+by+works+of+the+law%2C+our+sins+might+be+forgiven.+Rather%2C+the+sentence+of+condemnation+is+imposed+upon+us.+The+gospel+or+good+news%2C+however%2C+is+a+doctrine+of+which+even+the+wisest+knew+nothing+by+nature+but+which+is+revealed+from+heaven.+In+it+God+does+not+demand+but+rather+offers+and+gives+us+the+righteousness+that+the+law+requires.+This+righteousness+is+the+perfect+obedience+of+the+suffering+and+death+of+Jesus+Christ%2C+through+which+all+sin+and+damnation%2C+made+manifest+by+the+law%2C+is+pardoned+and+washed+away+%28Rom.+5%3B+Gal.+3%29.+Furthermore%2C+God+does+not+give+us+forgiveness+of+sins+in+the+gospel+on+the+condition+that+we+keep+the+law.+Rather%2C+even+though+we+never+have+kept+it+nor+will+ever+be+able+to+keep+it+perfectly%2C+He+still+has+forgiven+our+sins+and+given+us+eternal+life+as+an+unmerited+gift <blockquote><p>There are two sorts of things belonging to the church. Some which are intrinsical, and belonging to the soul or inward man, directly and primarily. Such things are not to be dispensed and administered by the civil magistrate:

I mean the word and sacraments, the keys of the kingdom of heaven, the suspension or excommunication of church officers or members, the ordination or deposition of officers, the determination and resolution from Scripture of controversies concerning the faith, the worship of God, the government of the church, cases of conscience.

These being in their nature, end, and use, merely spiritual, and belonging not to the outward man, but to the inward man or soul, are committed and entrusted to the pastors and other ruling officers of the church, and are not of civil and extrinsical, but of ecclesiastical and intrinsical cognisance and judgment.

There are other things belonging to the church, which are extrinsical, and do properly belong to the outward man, and are common to the church with other human societies or corporations: things of this kind fall within the civil jurisdiction; for the churches of Christ, being societies of men and women, and parts of commonwealths, are accountable unto and punishable by the civil magistrate, in their bodies, lives, civil liberties, and temporal estates, for trespasses against the law of God or the law of the land.

By the law of God I understand here jus divinum naturale, that is, the moral law or Decalogue, as it bindeth all nations (whether Christians or infidels), being the law of the Creator and King of nations. The magistrate, by his authority, may, and in duty ought, to keep his subjects within the bounds of external obedience to that law, and punish the external man with external punishments for external trespasses against that law.

From this obligation of the law, and subjection to the corrective power of the magistrate, Christian subjects are no more exempted than heathen subjects, but rather more straitly obliged. So that if any such trespass is committed by church officers or members, the magistrate hath power and authority to summon, examine, judge, and (after just conviction and to punish these, as well as other men. We do therefore abominate the disloyal papal tenet, that clergymen are not to be examined and judged by civil, but by ecclesiastical courts only, even in causes civil and criminal.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-867ec8f22c" data-kw="">
<blockquote><p>Now if even the Moral Law of God, the Decalogue, gives birth only to slaves—that is, does not justify but only terrifies, accuses, condemns, and brings consciences to the point of despair—how, I ask you, could the laws of the pope or human traditions justify? Therefore anyone who teaches or urges either the Law of God or human traditions as something necessary for righteousness in the sight of God does nothing other than give birth to slaves. And yet such theologians are regarded as the best; they earn the applause of the world and are the most prolific mothers, that is, have an infinite number of disciples. Since reason does not understand what faith and true godliness are, it neglects and despises them. Naturally, it is impressed by superstition and hypocrisy, that is, by the righteousness of works, which is so brilliant and successful that it is the mighty empress of the universe. Therefore those who teach the righteousness of works on the basis of the Law give birth to many sons, but all of these are slaves who will be thrown out of the house and condemned. Sarah, the free woman, on the other hand, that is, the true church, seems to be barren; for the Gospel, the Word of the cross, which the church preaches, is not as brilliant as is the teaching about the Law and works, and therefore it has few pupils who cling to it. Besides, it has the reputation of forbidding good works, making men idle and faint, stirring up heresies and sedition, and being the cause of every evil. Therefore it does not seem to have any success or prosperity; but everything seems to be filled with barrenness, waste, and despair. Hence the wicked are fully persuaded that the church will soon perish along with its doctrine. The Jews were altogether sure that the church established by the apostles would soon be deserted. To it they gave the hateful name “sect”; for so they spoke to Paul in Acts 28:22: “With regard to this sect we know that everywhere it is spoken against.” Similarly today, how often, I ask you, have our opponents rejoiced in a false hope that we would surely be crushed at this or that time? Christ and the apostles were crushed; but when they were dead, the teaching of the Gospel was spread more widely than when they were alive. Thus our opponents can crush us, but “the Word of the Lord will abide forever” (1 Peter 1:25). Regardless of how barren and deserted the church of Christ seems, therefore, or of how much it is said to teach heretical and seditious doctrine, it alone gives birth to children and heirs, through the ministry of the Word.</p></blockquote>

<blockquote><p>Whether we be justified by the passive obedience of Christ alone, or also by his active?¹ ¹ Bishop Carlton, Consens. Eccles. Cathol. contr. Trid. de Fide Justif., ch. 3; Daniel Featley in his Sacra nemesis, pp. 24, 29-30, 36-38; L’Emper. in his Theses, Article 1 and many others are for both Christ’s active and passive obedience. Etsi autem in negotio Iustificationis magno periculo erratur, prout ea de re controversia procedit inter nos et Pontificios, utrum scilicet gratiá Dei Iustificatio nobis contingat, an meritis nostris: Attamen prout inter nos &amp; Piscatorem controversia instituitur, passiváne tantum, an etiam activa Christi obedientia justificemur coram Deo, nullo prorsus erratur periculo. Utrobique enim Iustificationis causae gratiae et Christi meritis adscribuntur, non autem operibus nostris. Twisse, i• Corv. Defens. Arm. contra Tilenum Animadversio. Scriptura Christi passioni Iustificationem passim adscribit; idque eu i• locis, in quibus exprofesso argumentum istud pertractat: nulla tamen justitiae, quae in obedientia legi exhibita consistat, facti mentione vel levissima, Rom. 3:24-25 &amp; 4:24-25 &amp; 5:9-10; Gal. 3:11, 13. Gataker. Animadv. in Piscat. &amp; Lucii Scripta Adversaria, p. 2, Sect. 10. Vide plura in cjus Gomar, Disput. Elentic. de Iustif. Elench. In this controversy many learned divines of our own differ among themselves, and it does not seem to be of that importance that some others are about justification. We are justified in part by Christ’s active obedience, for by it we obtain the imputation of that perfect righteousness which gives us title to the Kingdom of Heaven. Seeing it was not possible for us to enter into life, till we had kept the commandments of God, Mt. 19:17, and we were not able to keep them ourselves, it was necessary our Surety should keep them for us, Dan. 9:24; Rom. 10:4; Rom. 3:21. (Mr. Hildersham on Ps. 51:7, Lecture 119) The Scripture seems to ascribe our redemption wholly to Christ’s bodily death, and the blood that He shed for us, Eph. 1:7; Rev. 5:9, but in these places the Holy Ghost uses a synecdoche, it puts one part of Christ’s passion for the whole: 1. Because the shedding of his blood was a sensible sign and evidence that He died for us. 2. This declared Him to be the true propitiatory sacrifice that was figured by all the sacrifices under the Law. (Idem, ibid.) Some urge this argument, By Christs active obedience imputed to them, the faithful be made perfectly righteous, what need is there then of his passive righteousness? need there anymore than to be made righteous? (See Mr. Bradshaw, Of Justification) Christ fulfilled the duty of the Law, and did undergo the penalty, that last was a satisfaction for the trespass which was as it were the forfeiture, and the fulfilling the Law was the principal, Ps. 40:4; Jer. 31:3; Gal. 4:4. Some, to avoid Christ’s active obedience, question whether Christ as man was not bound to fulfill the Law for Himself? All creatures are subject to God’s authority. Yet this detracts not from his active obedience, partly from his own free condescension, and partly because his whole person God and man obeyed.</p></blockquote>

<blockquote><p>I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8</cite>, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024), pp. 219-20 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.”

— Johannes Piscator, ‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024), pp. 219-20 ff.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+have+therefore+found+in+your+%5BBeza%E2%80%99s%5D+published+letters+two%2C+namely+Epistles+35+and+45%2C+in+the+former+of+which+you+touch+briefly+upon+this+controversy%2C+but+in+the+latter+you+discuss+it+more+fully+and+at+greater+length.+In+Epistle+35%2C+then%2C+you+say%3A+%E2%80%98What+is+more+absurd+than+to+reckon+that+man+just+who+has+not+fulfilled+the+Law%3F%E2%80%99+But+I+reply%3A+the+righteousness+of+the+Gospel+must+be+carefully+distinguished+from+the+righteousness+of+the+Law.+That+righteousness+by+which+we+are+accounted+righteous+by+God%2C+and+therefore+justified+or+absolved+by+Him%2C+is+not+the+righteousness+of+the+Law%3B+for+God+does+not+justify+us+on+the+ground+that+either+we+ourselves+have+fulfilled+the+Law%2C+or+that+Christ+has+fulfilled+it+for+us.+Rather%2C+it+is+the+righteousness+of+the+Gospel%2C+that+is%2C+that+which+God+bestows+upon+us+through+the+Gospel%E2%80%94namely%2C+the+remission+of+sins+obtained+by+the+blood+of+Christ.+Therefore+we+seek+life+from+God+not+by+the+right+of+a+fulfilled+Law+or+of+obedience+rendered+to+the+Law%2C+but+by+the+right+of+adoption%2C+which+Christ+has+procured+for+us+by+his+death.%E2%80%9D%0A%0A%E2%80%94+Johannes+Piscator%2C+%E2%80%98Examen+sententiae+Domini+Theodori+Bezae%2C+De+justificatione+Hominis+coram+Deo%2C+quae+habetur+in+annotatione+ad+Rom.+8%2C+v.+2%E2%80%99+in+Correspondance+de+Th%C3%A9odore+de+B%C3%A8ze+%281586%29%2C+eds.+Dufour%2C+Genton+%26+Nicollier-de+Weck%2C+vol.+27%2C+Travaux+d%E2%80%99human </figure><figure class="quote" id="q-f857315bb3" data-kw="">
<blockquote><p>Whether it is rightly said by Johannes Piscator on Rom. 8:4 [“That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”]: ‘Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.’ We deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomar.html">Francis Gomar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Opera omnia</cite>, vol. 2, p. 91, trans. ChatGPT-5</span></figcaption>

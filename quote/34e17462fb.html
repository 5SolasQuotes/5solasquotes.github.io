<blockquote><p>In one word, then, by repentance I understand regeneration, the only aim of which is to form in us anew the image of God, which was sullied, and all but effaced by the transgression of Adam. So the apostle teaches when he says, ‘We all with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, as by the Spirit of the Lord.’ Again, ‘Be renewed in the spirit of your mind,’ and ‘put ye on the new man, which after God is created in righteousness and true holiness.’ Again, ‘Put ye on the new man, which is renewed in knowledge after the image of him that created him.’ Accordingly, through the blessing of Christ we are renewed by that regeneration into the righteousness of God from which we had fallen through Adam, the Lord being pleased in this manner to restore the integrity of all whom He appoints to the inheritance of life. This renewal, indeed, is not accomplished in a moment, a day, or a year, but by uninterrupted, sometimes even by slow, progress God abolishes the remains of carnal corruption in his elect, cleanses them from pollution, and consecrates them as his temples, restoring all their inclinations to real purity, so that during their whole lives they may practise repentance, and know that death is the only termination to this warfare.</p></blockquote>

<blockquote><p>2nd Objection: But there is no such thing as initial regeneration, distinct from actual, as here is supposed. Wherever the Spirit is infused to regenerate, He does, in the first instant, actually regenerate: therefore there being, by your own confession (say they) no actual regeneration in any infant ordinarily at his baptism, there is then no regeneration at all, this distinction of initial and actual regeneration being but a toy and a new device, without warrant from the Scripture. Answer. If this objection contain a truth without equivocation, I confess the position to be a toy indeed. But there may lie some ambiguity in the terms of ‘initial’ and ‘actual’, which being cleared, the objection may perhaps appear as weak as they declare themselves rash and uncharitable who took upon them to confute that distinction which they never understood, nor would ever vouchsafe so much as to hear explicated by myself, either in public or private. Touching the distinction of initial and actual regeneration, I have sufficiently declared before, in my second chapter, in what sense I use it. I will therefore forbear to repeat what there I have written. The reader may view it at his pleasure. If any man demand express Scriptures for the very terms, he will soon declare of what spirit he is. But if by sufficient consequence the distinction be not clearly deduced thence, he shall then have cause to complain. Let him view the foundation on which it is built, and afterwards tell me his mind if he remain unsatisfied. In the meantime I shall only add thus much: that by initial and actual regeneration, I do not mean to insinuate two several kinds of spiritual life, for which, I acknowledge, there is no footing in Scripture: but I understand only two distinct considerations in respect of the degrees of spiritual life in the same subject, which the places of Scripture before alleged in chapter 2 do sufficiently warrant. For, by ‘life’ in Scripture is sometimes meant the soul infused as the principle of life; sometimes the very actual being and enlivening of the subject by that soul, making it actually to produce the actions of life. Hence I distinguish life into initial and actual: not as if the Spirit were not actually communicated, or did not actually work, or actually begin, from the very first instant, to dispose and prepare the soul to future actual newness of life, by infusing some potential and seminal grace; but my meaning is that the Spirit does not at that time ordinarily so plenarily change and renew the whole man as to work in him either actual faith, hope, or love, etc., or so much as the habits of these or other particular graces for the present, as afterward He does. Something the Spirit does from his first entrance toward actual regeneration; therefore we call that first work initial, thereby understanding the first disposition to, or degree of, actual regeneration. But forasmuch as that first work does not (for ought we know) extend to a present actual change of the whole man in the same manner and degree that afterward is wrought in him at his effectual calling, therefore we call that latter work actual regeneration. This ought not to seem strange to any: for just so it is in the course of nature. So soon as the reasonable soul is infused, there is in some sense (not every way, in respect of degrees) a rational life. But how? The soul is there, and in that soul are included all the principles of reason: but the soul does not send forth those principles into action (unless in some insensible manner by little and little preparing the infant unto human actions) till afterward, when the senses begin to act.¹ Before that time, the rational life cannot wholly be denied to be in an infant, because the rational soul is actually in his body: yet forasmuch as the infant has not at that time the actual use of reason, for this cause we call the further perfection of his natural principles, by tract of time attained, when reason puts itself into act, actual rational life; and we term the same life, in respect of the first degree and principles thereof, which together with the reasonable soul in the first infusion thereof it received, initial life. ¹ “He (namely God) has therefore given to the human soul a mind, in which reason and understanding in an infant are, as it were, asleep—so that they seem almost not to exist—yet are to be awakened and exercised with the advance of age, by which the mind becomes capable of knowledge and instruction, and fit for the perception of truth and the love of good.” Augustine, City of God, bk. 22, ch. 24. To the same purpose also he writes, bk. 2, Of Sin, ch. 25 and elsewhere. This is no more, in substance, than what we have learned from St. Augustine, Calvin, Peter Martyr, Junius, Daneus, Dr. Whitaker, Zanchius and sundry others, whose judgments have been at large set down in this treatise in sundry places upon sundry occasions. And shall any man think it nothing in a magisterial humor to trample so many worthies under his feet at once, as if he were wiser than all others? If it be only the terms that displease him, because perhaps the same are not found in any of these authors, he shall but show himself a caviller to quarrel them, unless he can show that the terms are used to signify that which, in substance, these authors do not allow and teach. Briefly then, this objection is grounded upon a false information and supposition: for it supposes me to use the terms of initial and actual regeneration as intending thereby to teach that there be two distinct species or kinds of regeneration; whereas my meaning is only to speak of the same spiritual life in two distinct considerations, in respect of degrees. And so the objection fights with a shadow, and not with me. But it will be replied that in regeneration there be no degrees, but that it is performed and dispatched at an instant, as natural generation is. It is true, say they, that there be degrees in renovation, which notes a growth in sanctification in a man regenerated. But regeneration is never taken for any other than for the first act of the Spirit entering into a Christian and begetting him a new man in Christ, in the very first moment of his entrance. Therefore the distinction of actual and initial regeneration cannot be admitted in any sense. I answer that those two words, ‘regeneration’ and ‘renovation’, may perhaps by some be used, the one to signify the first infusion of grace making a man actually a new creature in all parts at once, and the other to note the continual growth of a Christian in grace infused; if men will beforehand give notice of their meaning, and for the more clear expression of themselves will say: when I speak of the first infusion of grace, I will use the word ‘regeneration’ to express it by; and when I speak of continual growth from one degree unto another, I will ever call that ‘renovation’. Men may, if they please, make use of words as they do of counters in casting of accounts, wherein, of the same set and value, some counters are made to stand for pounds, some for shillings, and some for pence. And yet, as those counters which stand for pence might as well have stood for pounds as those that do stand for pounds, if it had pleased him that set them to have so disposed them, so men may put words of the same value and native signification to signify diverse things, by a liberty justifiable enough in use of speech; and yet those words may without wrong be used by others to signify other things: always provided that when a man uses a word in a sense different either from the prime signification of it, or from the common acceptation of it, he give warning that wherever he uses such a word, he would be understood in such or such a sense, and not according to the etymology of it, nor according to the common use of it. And thus I grant that, if it please any divine to say that he will ever restrain regeneration to note the first infusion of grace, and by renovation signify a daily increase of grace, in all his speeches or writings, for want of fitter terms to express himself in, he may do it. But if any man shall say that the proper meaning of the word ‘regeneration’, and of that which the Scriptures call it, is the first infusion of the Spirit actually to make a man a new creature in all parts at once, so as in this there can be no degrees; and affirm that so the Scriptures do ever use that word; and also add that by ‘renovation’ the Scripture never means the same thing that it intends by ‘regeneration’, but that ‘renovation’ is ever put for another thing, to wit, for continual growth in grace once infused, I must crave leave to dissent from him and to deny his assertion. For neither is there any such difference in the proper signification of these words but that they may both signify one and the same thing; nor is the Scripture so nice as to observe such a difference between them as the objectors would persuade us. That in the proper signification there is nothing either why ‘regeneration’ should signify only the first infusion of grace, or rather this than the daily growth of it; nor why ‘renovation’ should not signify the first beginnings of the new creature as well as the growth of it, those that are skillful in the tongues will easily bear me witness; and I take them that make this nice distinction between these two words to be better skilled than to say that these words in their proper signification will justify this conceit. Therefore they must of necessity fly to the Scriptures and prove that there ‘regeneration’ is always so restrained as that it always signifies the first infusion of grace, and not that further work of the Spirit which admits of degrees and is ever expressed by ‘renovation’; or else their conceit will prove but a fancy too weak to ruin the distinction of initial and actual regeneration. But the Holy Ghost in the Scriptures does not observe this nicety of words: for sometimes we shall find ‘regeneration’ put for sanctification expressed by obedience unto Christ and his Gospel, or else for the beginning of glory, and not for the first infusion of grace only. So in Mt. 19:28, our Saviour thus gives answer to Peter demanding of him what they should have who had forsaken all to follow Him: ‘Verily I say unto you that ye which have followed me, in the regeneration, when the Son of man shall sit in the throne of his glory, ye also shall sit upon twelve thrones, etc.’ where the word ‘regeneration’ cannot be taken for the first infusion of grace only, because it notes such a thing as Christ’s disciples did actually exercise and express in receiving of his Gospel, or else, as Beza rather thinks, it signifies the very state of glory wherewith they shall be invested at the latter day; and the words ought to be read thus: ye that have followed Me (here making the comma), in the regeneration, when the Son of man shall sit in the throne of his glory, ye shall sit, etc.; that is, you that follow me now shall hereafter, when the elect, being perfectly sanctified, begin their kingdom of glory, namely at the latter day, when I shall come again in glory, then shall ye sit upon twelve thrones. And so did Saint Augustine long before expound that text. Therefore the word is not restrained only to signify the first infusion of the Spirit and of grace by the Spirit. Again, sometimes we shall find ‘regeneration’ and ‘renovation’ put one for another, the one to explicate the other: for so Zanchi says expressly in his commentary upon Ephesians 5. And he says the truth: for so the apostle uses them, Titus 3:5, ‘according to his mercy He saved us, by the laver of regeneration and renewing of the Holy Ghost;’ where the apostle uses those two words of ‘regeneration’ and ‘renovation’ not to signify two things, but the latter declares the meaning of the former, as Beza well observes. Wherefore I conclude that, forasmuch as the Holy Scripture does not restrain the word ‘regeneration’ to the first infusion of the Spirit, or of grace by the Spirit, wherein there be no degrees, but extends it further even to that further work of the Spirit wherein (as all grant) there be degrees, the distinction of regeneration into initial and actual still stands upright without battering by this second objection, that will admit of no degrees in that which the Scripture everywhere calls by the name of ‘regeneration’.</p></blockquote>

— Cornelius Burges, Baptismal Regeneration of Elect Infants Professed by the Church of England... (Oxford: Curteyn, 1629), ch. 9, p. 239-50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2nd+Objection%3A+But+there+is+no+such+thing+as+initial+regeneration%2C+distinct+from+actual%2C+as+here+is+supposed.+Wherever+the+Spirit+is+infused+to+regenerate%2C+He+does%2C+in+the+first+instant%2C+actually+regenerate%3A+therefore+there+being%2C+by+your+own+confession+%28say+they%29+no+actual+regeneration+in+any+infant+ordinarily+at+his+baptism%2C+there+is+then+no+regeneration+at+all%2C+this+distinction+of+initial+and+actual+regeneration+being+but+a+toy+and+a+new+device%2C+without+warrant+from+the+Scripture.+Answer.+If+this+objection+contain+a+truth+without+equivocation%2C+I+confess+the+position+to+be+a+toy+indeed.+But+there+may+lie+some+ambiguity+in+the+terms+of+%E2%80%98initial%E2%80%99+and+%E2%80%98actual%E2%80%99%2C+which+being+cleared%2C+the+objection+may+perhaps+appear+as+weak+as+they+declare+themselves+rash+and+uncharitable+who+took+upon+them+to+confute+that+distinction+which+they+never+understood%2C+nor+would+ever+vouchsafe+so+much+as+to+hear+explicated+by+myself%2C+either+in+public+or+private.+Touching+the+distinction+of+initial+and+actual+regeneration%2C+I+have+sufficiently+declared+before%2C+in+my+second+chapter%2C+in+what+sense+I+use+it.+I+will+therefore+forbear+to+repeat+what+there+I+have+written.+The+reader+may+view+it+at+his+pleasure.+If+any+man+demand+express+Scriptures+for+the+very+terms%2C+he+will+soon+declare+of+what+spirit+he+is.+But+if+by+sufficient+consequence+the+distinction+be+not+clearly+deduced+thence%2C+he+shall+then+have+cause+to+complain.+Let+him+view+the+foundation+on+which+it+is+built%2C+and+afterwards+tell+me+his+mind+if+he+remain+unsatisfied.+In+the+meantime+I+shall+only+add+thus+much%3A+that+by+initial+and+actual+regeneration%2C+I+do+not+mean+to+insinuate+two+several+kinds+of+spiritual+life%2C+for+which%2C+I+acknowledge%2C+there+is+no+footing+in+Scripture%3A+but+I+understand+only+two+distinct+considerations+in+respect+of+the+degrees+of+spiritual+life+in+the+same+subject%2C+which+the+places+of+Scripture+before+alleged+in+chapter+2+do+sufficiently+warrant.+For%2C+by+%E2%80%98life%E2%80%99+in+Scripture+is+sometimes+meant+the+soul+infused+as+the+principle+of+life%3B+sometimes+the+very+actual+being+and+enlivening+of+the+subject+by+that+soul%2C+making+it+actually+to+produce+the+actions+of+life.+Hence+I+distinguish+life+into+initial+and+actual%3A+not+as+if+the+Spirit+were+not+actually+communicated%2C+or+did+not+actually+work%2C+or+actually+begin%2C+from+the+very+first+instant%2C+to+dispose+and+prepare+the+soul+to+future+actual+newness+of+life%2C+by+infusing+some+potential+and+seminal+grace%3B+but+my+meaning+is+that+the+Spirit+does+not+at+that+time+ordinarily+so+plenarily+change+and+renew+the+whole+man+as+to+work+in+him+either+actual+faith%2C+hope%2C+or+love%2C+etc.%2C+or+so+much+as+the+habits+of+these+or+other+particular+graces+for+the+present%2C+as+afterward+He+does.+Something+the+Spirit+does+from+his+first+entrance+toward+actual+regeneration%3B+therefore+we+call+that+first+work+initial%2C+thereby+understanding+the+first+disposition+to%2C+or+degree+of%2C+actual+regeneration.+But+forasmuch+as+that+first+work+does+not+%28for+ought+we+know%29+extend+to+a+present+actual+change+of+the+whole+man+in+the+same+manner+and+degree+that+afterward+is+wrought+in+him+at+his+effectual+calling%2C+therefore+we+call+that+latter+work+actual+regeneration.+This+ought+not+to+seem+strange+to+any%3A+for+just+so+it+is+in+the+course+of+nature.+So+soon+as+the+reasonable+soul+is+infused%2C+there+is+in+some+sense+%28not+every+way%2C+in+respect+of+degrees%29+a+rational+life.+But+how%3F+The+soul+is+there%2C+and+in+that+soul+are+included+all+the+principles+of+reason%3A+but+the+soul+does+not+send+forth+those+principles+into+action+%28unless+in+some+insensible+manner+by+little+and+little+preparing+the+infant+unto+human+actions%29+till+afterward%2C+when+the+senses+begin+to+act.%C2%B9+Before+that+time%2C+the+rational+life+cannot+wholly+be+denied+to+be+in+an+infant%2C+because+the+rational+soul+is+actually+in+his+body%3A+yet+forasmuch+as+the+infant+has+not+at+that+time+the+actual+use+of+reason%2C+for+this+cause+we+call+the+further+perfection+of+his+natural+principles%2C+by+tract+of+time+attained%2C+when+reason+puts+itself+into+act%2C+actual+rational+life%3B+and+we+term+the+same+life%2C+in+respect+of+the+first+degree+and+principles+thereof%2C+which+together+with+the+reasonable+soul+in+the+first+infusion+thereof+it+received%2C+initial+life.+%C2%B9+%E2%80%9CHe+%28namely+God%29+has+therefore+given+to+the+human+soul+a+mind%2C+in+which+reason+and+understanding+in+an+infant+are%2C+as+it+were%2C+asleep%E2%80%94so+that+they+seem+almost+not+to+exist%E2%80%94yet+are+to+be+awakened+and+exercised+with+the+advance+of+age%2C+by+which+the+mind+becomes+capable+of+knowledge+and+instruction%2C+and+fit+for+the+perception+of+truth+and+the+love+of+good.%E2%80%9D+Augustine%2C+City+of+God%2C+bk.+22%2C+ch.+24.+To+the+same+purpose+also+he+writes%2C+bk.+2%2C+Of+Sin%2C+ch.+25+and+elsewhere.+This+is+no+more%2C+in+substance%2C+than+what+we+have+learned+from+St.+Augustine%2C+Calvin%2C+Peter+Martyr%2C+Junius%2C+Daneus%2C+Dr.+Whitaker%2C+Zanchius+and+sundry+others%2C+whose+judgments+have+been+at+large+set+down+in+this+treatise+in+sundry+places+upon+sundry+occasions.+And+shall+any+man+think+it+nothing+in+a+magisterial+humor+to+trample+so+many+worthies+under+his+feet+at+once%2C+as+if+he+were+wiser+than+all+others%3F+If+it+be+only+the+terms+that+displease+him%2C+because+perhaps+the+same+are+not+found+in+any+of+these+authors%2C+he+shall+but+show+himself+a+caviller+to+quarrel+them%2C+unless+he+can+show+that+the+terms+are+used+to+signify+that+which%2C+in+substance%2C+these+authors+do+not+allow+and+teach.+Briefly+then%2C+this+objection+is+grounded+upon+a+false+information+and+supposition%3A+for+it+supposes+me+to+use+the+terms+of+initial+and+actual+regeneration+as+intending+thereby+to+teach+that+there+be+two+distinct+species+or+kinds+of+regeneration%3B+whereas+my+meaning+is+only+to+speak+of+the+same+spiritual+life+in+two+distinct+considerations%2C+in+respect+of+degrees.+And+so+the+objection+fights+with+a+shadow%2C+and+not+with+me.+But+it+will+be+replied+that+in+regeneration+there+be+no+degrees%2C+but+that+it+is+performed+and+dispatched+at+an+instant%2C+as+natural+generation+is.+It+is+true%2C+say+they%2C+that+there+be+degrees+in+renovation%2C+which+notes+a+growth+in+sanctification+in+a+man+regenerated.+But+regeneration+is+never+taken+for+any+other+than+for+the+first+act+of+the+Spirit+entering+into+a+Christian+and+begetting+him+a+new+man+in+Christ%2C+in+the+very+first+moment+of+his+entrance.+Therefore+the+distinction+of+actual+and+initial+regeneration+cannot+be+admitted+in+any+sense.+I+answer+that+those+two+words%2C+%E2%80%98regeneration%E2%80%99+and+%E2%80%98renovation%E2%80%99%2C+may+perhaps+by+some+be+used%2C+the+one+to+signify+the+first+infusion+of+grace+making+a+man+actually+a+new+creature+in+all+parts+at+once%2C+and+the+other+to+note+the+continual+growth+of+a+Christian+in+grace+infused%3B+if+men+will+beforehand+give+notice+of+their+meaning%2C+and+for+the+more+clear+expression+of+themselves+will+say%3A+when+I+speak+of+the+first+infusion+of+grace%2C+I+will+use+the+word+%E2%80%98regeneration%E2%80%99+to+express+it+by%3B+and+when+I+speak+of+continual+growth+from+one+degree+unto+another%2C+I+will+ever+call+that+%E2%80%98renovation%E2%80%99.+Men+may%2C+if+they+please%2C+make+use+of+words+as+they+do+of+counters+in+casting+of+accounts%2C+wherein%2C+of+the+same+set+and+value%2C+some+counters+are+made+to+stand+for+pounds%2C+some+for+shillings%2C+and+some+for+pence.+And+yet%2C+as+those+counters+which+stand+for+pence+might+as+well+have+stood+for+pounds+as+those+that+do+stand+for+pounds%2C+if+it+had+pleased+him+that+set+them+to+have+so+disposed+them%2C+so+men+may+put+words+of+the+same+value+and+native+signification+to+signify+diverse+things%2C+by+a+liberty+justifiable+enough+in+use+of+speech%3B+and+yet+those+words+may+without+wrong+be+used+by+others+to+signify+other+things%3A+always+provided+that+when+a+man+uses+a+word+in+a+sense+different+either+from+the+prime+signification+of+it%2C+or+from+the+common+acceptation+of+it%2C+he+give+warning+that+wherever+he+uses+such+a+word%2C+he+would+be+understood+in+such+or+such+a+sense%2C+and+not+according+to+the+etymology+of+it%2C+nor+according+to+the+common+use+of+it.+And+thus+I+grant+that%2C+if+it+please+any+divine+to+say+that+he+will+ever+restrain+regeneration+to+note+the+first+infusion+of+grace%2C+and+by+renovation+signify+a+daily+increase+of+grace%2C+in+all+his+speeches+or+writings%2C+for+want+of+fitter+terms+to+express+himself+in%2C+he+may+do+it.+But+if+any+man+shall+say+that+the+proper+meaning+of+the+word+%E2%80%98regeneration%E2%80%99%2C+and+of+that+which+the+Scriptures+call+it%2C+is+the+first+infusion+of+the+Spirit+actually+to+make+a+man+a+new+creature+in+all+parts+at+once%2C+so+as+in+this+there+can+be+no+degrees%3B+and+affirm+that+so+the+Scriptures+do+ever+use+that+word%3B+and+also+add+that+by+%E2%80%98renovation%E2%80%99+the+Scripture+never+means+the+same+thing+that+it+intends+by+%E2%80%98regeneration%E2%80%99%2C+but+that+%E2%80%98renovation%E2%80%99+is+ever+put+for+another+thing%2C+to+wit%2C+for+continual+growth+in+grace+once+infused%2C+I+must+crave+leave+to+dissent+from+him+and+to+deny+his+assertion.+For+neither+is+there+any+such+difference+in+the+proper+signification+of+these+words+but+that+they+may+both+signify+one+and+the+same+thing%3B+nor+is+the+Scripture+so+nice+as+to+observe+such+a+difference+between+them+as+the+objectors+would+persuade+us.+That+in+the+proper+signification+there+is+nothing+either+why+%E2%80%98regeneration%E2%80%99+should+signify+only+the+first+infusion+of+grace%2C+or+rather+this+than+the+daily+growth+of+it%3B+nor+why+%E2%80%98renovation%E2%80%99+should+not+signify+the+first+beginnings+of+the+new+creature+as+well+as+the+growth+of+it%2C+those+that+are+skillful+in+the+tongues+will+easily+bear+me+witness%3B+and+I+take+them+that+make+this+nice+distinction+between+these+two+words+to+be+better+skilled+than+to+say+that+these+words+in+their+proper+signification+will+justify+this+conceit.+Therefore+they+must+of+necessity+fly+to+the+Scriptures+and+prove+that+there+%E2%80%98regeneration%E2%80%99+is+always+so+restrained+as+that+it+always+signifies+the+first+infusion+of+grace%2C+and+not+that+further+work+of+the+Spirit+which+admits+of+degrees+and+is+ever+expressed+by+%E2%80%98renovation%E2%80%99%3B+or+else+their+conceit+will+prove+but+a+fancy+too+weak+to+ruin+the+distinction+of+initial+and+actual+regeneration.+But+the+Holy+Ghost+in+the+Scriptures+does+not+observe+this+nicety+of+words%3A+for+sometimes+we+shall+find+%E2%80%98regeneration%E2%80%99+put+for+sanctification+expressed+by+obedience+unto+Christ+and+his+Gospel%2C+or+else+for+the+beginning+of+glory%2C+and+not+for+the+first+infusion+of+grace+only.+So+in+Mt.+19%3A28%2C+our+Saviour+thus+gives+answer+to+Peter+demanding+of+him+what+they+should+have+who+had+forsaken+all+to+follow+Him%3A+%E2%80%98Verily+I+say+unto+you+that+ye+which+have+followed+me%2C+in+the+regeneration%2C+when+the+Son+of+man+shall+sit+in+the+throne+of+his+glory%2C+ye+also+shall+sit+upon+twelve+thrones%2C+etc.%E2%80%99+where+the+word+%E2%80%98regeneration%E2%80%99+cannot+be+taken+for+the+first+infusion+of+grace+only%2C+because+it+notes+such+a+thing+as+Christ%E2%80%99s+disciples+did+actually+exercise+and+express+in+receiving+of+his+Gospel%2C+or+else%2C+as+Beza+rather+thinks%2C+it+signifies+the+very+state+of+glory+wherewith+they+shall+be+invested+at+the+latter+day%3B+and+the+words+ought+to+be+read+thus%3A+ye+that+have+followed+Me+%28here+making+the+comma%29%2C+in+the+regeneration%2C+when+the+Son+of+man+shall+sit+in+the+throne+of+his+glory%2C+ye+shall+sit%2C+etc.%3B+that+is%2C+you+that+follow+me+now+shall+hereafter%2C+when+the+elect%2C+being+perfectly+sanctified%2C+begin+their+kingdom+of+glory%2C+namely+at+the+latter+day%2C+when+I+shall+come+again+in+glory%2C+then+shall+ye+sit+upon+twelve+thrones.+And+so+did+Saint+Augustine+long+before+expound+that+text.+Therefore+the+word+is+not+restrained+only+to+signify+the+first+infusion+of+the+Spirit+and+of+grace+by+the+Spirit.+Again%2C+sometimes+we+shall+find+%E2%80%98regeneration%E2%80%99+and+%E2%80%98renovation%E2%80%99+put+one+for+another%2C+the+one+to+explicate+the+other%3A+for+so+Zanchi+says+expressly+in+his+commentary+upon+Ephesians+5.+And+he+says+the+truth%3A+for+so+the+apostle+uses+them%2C+Titus+3%3A5%2C+%E2%80%98according+to+his+mercy+He+saved+us%2C+by+the+laver+of+regeneration+and+renewing+of+the+Holy+Ghost%3B%E2%80%99+where+the+apostle+uses+those+two+words+of+%E2%80%98regeneration%E2%80%99+and+%E2%80%98renovation%E2%80%99+not+to+signify+two+things%2C+but+the+latter+declares+the+meaning+of+the+former%2C+as+Beza+well+observes.+Wherefore+I+conclude+that%2C+forasmuch+as+the+Holy+Scripture+does+not+restrain+the+word+%E2%80%98regeneration%E2%80%99+to+the+first+infusion+of+the+Spirit%2C+or+of+grace+by+the+Spirit%2C+wherein+there+be+no+degrees%2C+but+extends+it+further+even+to+that+further+work+of+the+Spirit+wherein+%28as+all+grant%29+there+be+degrees%2C+the+distinction+of+regeneration+into+initial+and+actual+still+stands+upright+without+battering+by+this+second+objection%2C+that+will+admit+of+no+degrees+in+that+which+the+Scripture+everywhere+calls+by+the+name+of+%E2%80%98regeneration%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Cornelius+Burges%2C+Baptismal+Regeneration+of+Elect+Infants+Professed+by+the+Church+of+England...+%28Oxford%3A+Curteyn%2C+1629%29%2C+ch.+9%2C+p.+239-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e19e8942b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e19e8942b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=2nd%20Objection%3A%20But%20there%20is%20no,calls%20by%20the%20name%20of%20%E2%80%98regeneration&amp;text=2nd%20Objection%3A%20But%20there%20is%20no%20such%20thing&amp;text=Scripture%20everywhere%20calls%20by%20the%20name%20of%20%E2%80%98regeneration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.”

— Thomas Cole, A Discourse of Regeneration, Faith &amp; Repentance... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’, p. 73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2dly%2C+Regeneration+does+not+only+show+the+wide+difference+between+the+two+states%2C+the+regenerate+and+unregenerate%3B+but+it+comes+in+a+different+manner+upon+the+regenerate+themselves.+I+say+a+different+manner%3B+for+there+is+no+difference+in+the+nature+of+the+thing+itself%2C+that+is+the+same+in+substance%2C+essence%2C+and+principle+in+all+who+are+regenerate%3A+yet+there+are+some+circumstances+attending+regeneration+sometimes%2C+wherein+one+regenerate+person+may+greatly+differ+from+another%2C+even+in+the+first+moment+of+regeneration%2C+e.g.+some+may+be+regenerated+and+converted+into+higher+degrees+of+grace+in+the+first+moment+of+their+conversion%2C+than+some+others+%28though+as+truly+regenerate+as+they%29+may+attain+to+all+their+days%3B+all+in+regeneration+do+receive+one+and+the+same+spirit+of+grace%2C+but+not+in+the+same+measure.+Paul+was+converted+into+an+eminency+in+grace%3B+he+was+never+a+babe+in+Christ%2C+but+was+born+a+strong+man+in+Christ+the+very+first+moment+of+his+conversion.+God+had+present+use+of+Paul%3B+he+had+designed+him+for+eminent+service%2C+which+he+was+immediately+to+enter+upon%2C+and+therefore+God+furnishes+him+accordingly.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cole%2C+A+Discourse+of+Regeneration%2C+Faith+%26+Repentance...+%28London%3A+Cockerill%2C+1692%29%2C+Discourse+of+Regeneration%2C+ch.+4%2C+%E2%80%98Manner+of+Regeneration%E2%80%99%2C+p.+73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbbc82a597e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bbc82a597e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=2dly%2C%20Regeneration%20does%20not%20only%20show,and%20therefore%20God%20furnishes%20him%20accordingly&amp;text=2dly%2C%20Regeneration%20does%20not%20only%20show%20the%20wide&amp;text=enter%20upon%2C%20and%20therefore%20God%20furnishes%20him%20accordingly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-716fae5111" data-kw="">
<blockquote><p>These things cannot occur until we have been justified by faith, and, regenerated, we receive the Holy Ghost: first, because the Law cannot be kept without [the knowledge of] Christ; and likewise the Law cannot be kept without the Holy Ghost. But the Holy Ghost is received by faith, according to the declaration of Paul, Gal. 3:14, ‘That we might receive the promise of the Spirit through faith.’ … Wherefore, when Paul says, Rom. 3:31, ‘We establish the Law through faith,’ by this we ought to understand, not only that those regenerated by faith receive the Holy Ghost, and have movements agreeing with God’s Law, but it is by far of the greatest importance that we add also this, that we ought to perceive that we are far distant from the perfection of the Law.</p></blockquote>

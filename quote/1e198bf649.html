</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd99a1c389" data-kw="">
<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>

<blockquote><p>By a ‘ceremony’ I understand an external rite in or about the worship of God. By ‘significant ceremonies’ I understand rites in divine worship signifying some material point of religion. There is no controversy about those outward actions that by nature or general custom signify the reverence of the mind, as kneeling and lifting up our eyes and hands to Heaven in token of devotion to the God of Heaven, and being uncovered in prayer, etc. But the question is of those that signify merely by the force of authoritative institution or private arbitrary intention. Such significant things, though they may have some natural aptitude to signify such and such points of religion, yet they do not actually signify, but [only signify] as arbitrarily designed thereunto. It is generally received that significant ceremonies in taking an oath may lawfully be used, and that not only such as naturally signify, as lifting up the hand towards Heaven, but such also as signify by institution, as laying the hand on a book or kissing the book. Now though the end of an oath may be a civil thing, as the ending of a controversy, yet the formal of it is divine worship. And the aforesaid ceremonies are expressive of the very external part of it, and they actually signify by force of institution. Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words. The Christians heretofore, being among infidels, might lawfully have the figure of the cross somewhere visible about them to show that they were Christians. For the meaning was no more than if they had said, “We are Christians.” But it may be replied this was no act of divine worship, but an indicant or speaking sign towards men. With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution. And if instituted signs of devotion in general be lawful, I see not why signs of some special part of devotion, or mystery in religion, should be unlawful. I am more confident of the warrantableness of rites and ceremonies of worship that are used only instead of so many words pronounced, than of those that are added to words for their more solemn ratification, as seals are to a writing or federal signs to a verbal contract. Nevertheless, the forementioned ceremonies of swearing seem added to the words of the oath for more solemn ratification; and it alters not the case whether the words be read by him that administers or pronounced by him that takes the oath, for either way they are his words that takes the oath. Likewise I have more confidence of the warrantableness of those significant ceremonies that are of private arbitrary intention than of those that are of authoritative institution; also of those that are used occasionally and pro hic et nunc [for here and now], than of those that are used statedly. Furthermore I apprehend that significant ceremonies of divine worship are more apt to degenerate into superstition; and if they be multiplied, that religion is therewith loaded as with unprofitable luggage; and that it is a form of religion rather Mosaic than evangelical, wherein spiritual worship is most regarded. I think also that significant ceremonies are not necessary in genere, as those things are which are left to the determination of human authority, and so not to be instituted and imposed in the ordinary divine service. I apprehend that our Lord Christ has instituted all those stated ordinances of positive worship that are necessary to the Church universal, and therefore that more of the same nature are not to be devised by men. If any significant ceremonies be indeed necessary for some parts of the catholic Church in respect of time and place, there seems to me a fairer plea for their institution in those times and places; but the controverted ceremonies among us seem to be necessary for the whole Church in every age, if at all necessary. Significant ceremonies of the same nature and reason with those perpetual ordinances that Christ has instituted for the universal Church may not be instituted by man, and particularly such as are made symbols of the Covenant of Grace and Christianity. In matters doubted among sober Christians, superiors should take heed of strict imposing, and thereby wresting the consciences of their subjects and overstraining them to a compliance with them, in derogation to God’s authority in their consciences. If superiors command that which is above their sphere to command, namely, things not necessary in genere, yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>

— John Corbet, Of Divine Worship, pt. 3, sect. 6 in Remains (London: Parkhurst, 1684)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+a+%E2%80%98ceremony%E2%80%99+I+understand+an+external+rite+in+or+about+the+worship+of+God.+By+%E2%80%98significant+ceremonies%E2%80%99+I+understand+rites+in+divine+worship+signifying+some+material+point+of+religion.+There+is+no+controversy+about+those+outward+actions+that+by+nature+or+general+custom+signify+the+reverence+of+the+mind%2C+as+kneeling+and+lifting+up+our+eyes+and+hands+to+Heaven+in+token+of+devotion+to+the+God+of+Heaven%2C+and+being+uncovered+in+prayer%2C+etc.+But+the+question+is+of+those+that+signify+merely+by+the+force+of+authoritative+institution+or+private+arbitrary+intention.+Such+significant+things%2C+though+they+may+have+some+natural+aptitude+to+signify+such+and+such+points+of+religion%2C+yet+they+do+not+actually+signify%2C+but+%5Bonly+signify%5D+as+arbitrarily+designed+thereunto.+It+is+generally+received+that+significant+ceremonies+in+taking+an+oath+may+lawfully+be+used%2C+and+that+not+only+such+as+naturally+signify%2C+as+lifting+up+the+hand+towards+Heaven%2C+but+such+also+as+signify+by+institution%2C+as+laying+the+hand+on+a+book+or+kissing+the+book.+Now+though+the+end+of+an+oath+may+be+a+civil+thing%2C+as+the+ending+of+a+controversy%2C+yet+the+formal+of+it+is+divine+worship.+And+the+aforesaid+ceremonies+are+expressive+of+the+very+external+part+of+it%2C+and+they+actually+signify+by+force+of+institution.+Words+signify+by+general+custom%2C+and+have+the+same+sense+out+of+the+worship+of+God+as+in+it%3B+and+therefore+the+arguing+from+their+lawfulness+as+signs+of+worship+unto+the+lawfulness+of+instituted+signs+seems+liable+to+exception.+Nevertheless+it+may+be+said+that+instituted+signs+soon+become+customary+and+as+well+understood+as+words.+The+Christians+heretofore%2C+being+among+infidels%2C+might+lawfully+have+the+figure+of+the+cross+somewhere+visible+about+them+to+show+that+they+were+Christians.+For+the+meaning+was+no+more+than+if+they+had+said%2C+%E2%80%9CWe+are+Christians.%E2%80%9D+But+it+may+be+replied+this+was+no+act+of+divine+worship%2C+but+an+indicant+or+speaking+sign+towards+men.+With+acknowledgment+of+my+own+weakness%2C+I+express+my+apprehensions+of+this+matter.+God+has+allowed+words+for+signs+expressive+of+divine+worship%2C+but+I+find+not+that+He+has+allowed+words+only+and+forbidden+gestures+and+actions+for+such+an+end.+The+dumb+%5Bwho+can%E2%80%99t+speak%5D+must+express+their+internal+worship+by+gestures+and+actions+or+they+cannot+externally+worship+God+at+all.+If+signs+of+devotion+that+are+of+customary+signification+be+lawful%2C+I+see+not+why+such+as+are+of+instituted+signification+should+be+unlawful%2C+and+especially+when+they+become+as+customary%2C+as+those+that+have+been+without+institution.+And+if+instituted+signs+of+devotion+in+general+be+lawful%2C+I+see+not+why+signs+of+some+special+part+of+devotion%2C+or+mystery+in+religion%2C+should+be+unlawful.+I+am+more+confident+of+the+warrantableness+of+rites+and+ceremonies+of+worship+that+are+used+only+instead+of+so+many+words+pronounced%2C+than+of+those+that+are+added+to+words+for+their+more+solemn+ratification%2C+as+seals+are+to+a+writing+or+federal+signs+to+a+verbal+contract.+Nevertheless%2C+the+forementioned+ceremonies+of+swearing+seem+added+to+the+words+of+the+oath+for+more+solemn+ratification%3B+and+it+alters+not+the+case+whether+the+words+be+read+by+him+that+administers+or+pronounced+by+him+that+takes+the+oath%2C+for+either+way+they+are+his+words+that+takes+the+oath.+Likewise+I+have+more+confidence+of+the+warrantableness+of+those+significant+ceremonies+that+are+of+private+arbitrary+intention+than+of+those+that+are+of+authoritative+institution%3B+also+of+those+that+are+used+occasionally+and+pro+hic+et+nunc+%5Bfor+here+and+now%5D%2C+than+of+those+that+are+used+statedly.+Furthermore+I+apprehend+that+significant+ceremonies+of+divine+worship+are+more+apt+to+degenerate+into+superstition%3B+and+if+they+be+multiplied%2C+that+religion+is+therewith+loaded+as+with+unprofitable+luggage%3B+and+that+it+is+a+form+of+religion+rather+Mosaic+than+evangelical%2C+wherein+spiritual+worship+is+most+regarded.+I+think+also+that+significant+ceremonies+are+not+necessary+in+genere%2C+as+those+things+are+which+are+left+to+the+determination+of+human+authority%2C+and+so+not+to+be+instituted+and+imposed+in+the+ordinary+divine+service.+I+apprehend+that+our+Lord+Christ+has+instituted+all+those+stated+ordinances+of+positive+worship+that+are+necessary+to+the+Church+universal%2C+and+therefore+that+more+of+the+same+nature+are+not+to+be+devised+by+men.+If+any+significant+ceremonies+be+indeed+necessary+for+some+parts+of+the+catholic+Church+in+respect+of+time+and+place%2C+there+seems+to+me+a+fairer+plea+for+their+institution+in+those+times+and+places%3B+but+the+controverted+ceremonies+among+us+seem+to+be+necessary+for+the+whole+Church+in+every+age%2C+if+at+all+necessary.+Significant+ceremonies+of+the+same+nature+and+reason+with+those+perpetual+ordinances+that+Christ+has+instituted+for+the+universal+Church+may+not+be+instituted+by+man%2C+and+particularly+such+as+are+made+symbols+of+the+Covenant+of+Grace+and+Christianity.+In+matters+doubted+among+sober+Christians%2C+superiors+should+take+heed+of+strict+imposing%2C+and+thereby+wresting+the+consciences+of+their+subjects+and+overstraining+them+to+a+compliance+with+them%2C+in+derogation+to+God%E2%80%99s+authority+in+their+consciences.+If+superiors+command+that+which+is+above+their+sphere+to+command%2C+namely%2C+things+not+necessary+in+genere%2C+yet+if+they+be+not+simply+evil%2C+subjects+may+do+those+things%2C+unless+they+be+evil+in+their+consequence+to+a+higher+degree+than+the+not+doing+of+them+would+be.+In+this+case+it+is+not+formal+obedience%2C+but+they+are+done+for+the+end%E2%80%99s+sake+and+to+avoid+evil.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%2C+pt.+3%2C+sect.+6+in+Remains+%28London%3A+Parkhurst%2C+1684%29&amp;url=htt <blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>

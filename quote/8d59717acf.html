<main class="wrap"><figure class="quote" id="q-8d59717acf" data-kw="">
<blockquote><p>That the Testimony of the Senses in cases of this sort is not entirely to be rejected, it is evident: 1. Because God makes use of this means to engender Faith, Romans 10:14, 17; whence, not only is the use of this means proven, but hence also it is apparent that the Senses are not in all things and always fallible; for otherwise this means would not be suitable to engender certain knowledge.

2. The sacred text seeks arguments from the Senses to confirm Theological truths, of which sort, for example, is the Resurrection of Christ, which is confirmed by the testimony of sight, Matthew 28:6, of sight and touch together, Luke 24:39; Peter appeals to the seeing and hearing of Christ’s glory, 2 Peter 1:16-18; John appeals to hearing, seeing, and touching together in matters regarding the economy of Christ, 1 John 1:1. Now, 3. the Faithfulness of God does not allow us to believe that He has willed to make sport of men, by sending them to testimony, which was designed as uniquely apt to cheat and to deceive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 32, p. 229.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e284ea526b" data-kw="">
<blockquote><p>Therefore, a true and worthy esteem of God and other acts manifesting esteem constitute, as it were, the first matter of religion. Every honest, human act making for the honor and glory of God may be the matter or material object of religion. It is one and the same act which as submission to commandment is called obedience and as honor to God is called religion and worship.</p></blockquote>

</figure><figure class="quote" id="q-324846649c" data-kw="">
<blockquote><p>…the command to sing psalms in the name of the Lord was obeyed by everyone in every place: for the command to sing psalms is in force in all Churches which exist among the nations, not only for the Greeks but also for the Barbarians; and further, throughout the whole world, in towns and villages and in the fields also, in short, in the whole Church, the people of Christ, who are gathered from all nations, sing to the one God, whom the prophets foretold, hymns and psalms with a loud voice, so that the voice of the psalm-singers is heard by those standing outside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius-of-caesarea.html">Eusebius of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms and 1 &amp; 2 Peter</cite>, 2nd edition, trans. A. Orme and E. G. P. Wyatt (London, 1901).</span></figcaption>

</figure><figure class="quote" id="q-0bc8c102ca" data-kw="">
<blockquote><p>I propound it to you, whether some of you have not held out some other public worship than the reformed Churches hold, namely hymns and anointing the sick members of the Church with oil; as also, whether a little before your coming over into England, some members of the Church of Arnheim [Netherlands], did not propound the holy kiss, or the kiss of love, to be practiced by church-members; Nay whether by some persons in that Church, was it not begun to be used and practiced; And in this enumeration of the parts of public worship, I desire to know why you put in “etc.” and what is meant by “etc.” for that implies more parts than you enumerate. And we know, etc. is a dangerous and suspicious phrase ever since the late [Anglican] Canons and Oath, for under that “etc.” may be meant prophesying and hymns, and anointing with oil, and the kiss of love, and many other parts which the reformed Churches practice not, and so your public worship may be made up of many other parts than the worship of all other reformed Churches, and that there is great cause to speak thus, and doubt, appears, because I know not, nor cannot reckon up any other part of public worship used every Lord’s Day in the reformed Churches than the particulars mentioned by you without an etc. and therefore what you mean by under “etc.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-2fb5117e0c" data-kw="">
<blockquote><p>James Dick gives political conservatives some schooling on the pernicious nature of national constitutions that do not recognise Christ’s Lordship:‎

[A] national constitution if it be not according to the will of Christ, is, notwithstanding verbal professions to the contrary, at variance with His will, and so, being shaped in rebellion against Him and in rejection of the wise principles of His kingdom, it leads to rebellion and to the casting off, one by one, of the cords of His authority, which national traditions or national sentiment may have for a time retained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Civil rulers serving the Lord: or, the scriptural doctrine of national religion. A sermon, at the opening of the Reformed Presbyterian Synod of Scotland May 15th, 1882</cite>, (Edinburgh, 1882), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

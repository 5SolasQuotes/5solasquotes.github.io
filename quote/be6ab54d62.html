<main class="wrap"><figure class="quote" id="q-be6ab54d62" data-kw="">
<blockquote><p>(4.) Motives to keep holy the Lord’s day.

Do all the rather because there is not a clearer sign to distinguish you from one that is profane, Exod. xxxi. 13, than this, of conscientiously keeping holy the Lord’s day. Neither is there any ordinary means of gaining strength and growth of grace in the inward man, like this, of due observing the Sabbath, Ezek. xx. 12. For this is God’s great mart, or fair-day for the soul, on which you may buy of Christ, wine, milk, bread, marrow, and fatness, Isa. lv. 1-4, gold, white raiment, eye-salve, Rev. iii. 18, even all things which are necessary, and which will satisfy, and cause the soul to live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s daily walk in holy security and peace</cite>, (1627; Philadelphia, 1800), p. 93.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51ba2af284" data-kw="">
<blockquote><p>Surely that which is most sweet to the soul of God should be most sweet to our souls: You would wonder to hear a man say that he takes as much delight and he can recreate himself as much in reading, in praying, in hearing sermons, in holy conference as you can do in all your good cheer, in playing and drinking of wine in bowls: You think that men are made to say that they have as much pleasure in those things, as playing at cards, and merriment, and music, and good cheer: you call upon them to play at cards with you, or be merry, you say to them, why should you be dumpish and never be merry? They tell you again that they can be as merry and as cheerful in hearing the Word, and praying, and reading, as you in all your playing, and all that you account delightful. You say to them that they have no recreation. They tell you that those things that are your burdens, are their recreation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, ... (London: Cole, 1650), pp. 164-65. The context of this does not regard the Sabbath specifically. Burroughs was a Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-28ed2c48bb" data-kw="">
<blockquote><p>Arminians: ‘A confession is not a rule of faith; it has not the lowest place in the Church.’ [Rutherford’s] Answer: The covenant written and sealed in Nehemiah’s time was a secondary rule of faith, and a rule even so far as it agreed with the Law of Moses, for they enter in a curse and an oath to walk in God’s Law, not to give their sons and daughters in marriage to the heathen, not to buy victuals from the heathen on the Sabbath, to charge themselves to give money to maintain the service of God, Neh. 9:38, ch.10:1-3, 29-32, which written Covenant was not Scripture; and [further,] Acts 15, the decrees of the synod [of Jerusalem] were not formally Scripture, yet [were] to be observed as a secondary rule [Acts 15:28; 16:4].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, pp. 25</span></figcaption>

<blockquote><p>…and consider the reason of such rules and commandments, which carries in it the light and the life of the commandments. For where that reason holds not, there are we free from the commandment; but where the reason is in force, there are we no less bound to the substance and effect of such particular commandment than they were. So if there could be like reason as caused that commandment to the disciples, we were in such case to keep it, and where the same offence is justly to be feared in eating of meats forbidden, as was then and may be in many like cases now and to the end, there that order of the apostles binds. As for the last place out of the 1 Cor. 11, if he look better upon it, he shall find that the apostle grounds that order there prescribed upon so general and necessary reasons of the ordinance of God, the glory of our Savior Christ, the regard of angels, and the voice of nature, and the custom of all the Churches, as he has taken his level far amiss to leave it at liberty, whether a man keep it or no: provided that he understand the apostle’s meaning aright: which is that men and women, especially being present in the public assemblies of the church, should carry the mark of their creation, agreeable to the sex whereof they were: the woman wearing upon her head a vail or kerchief, or such other attire (according to the lawful custom of their country and place of abode) as declares her sex and subjection to man by such coverture of her head. And the man, by not wearing any such attire upon his head as is proper to womankind, but by want of any such upon his head, show the glory of Christ, and the honor that in the order of creation is bestowed upon men. Therefore notwithstanding his caution or anything here alleged to the contrary, it remains firm and stable that the constant and perpetual examples of the Churches, the orders, rules, and commandments of our Savior Christ and of his apostles, both for the points of doctrine to be believed, and also for such as are to be obeyed and practiced in the public government of the Church, and in the private life of everyone, do bind the conscience of all the people of God to keep and to obey them: yea the most particular rules, the like case and reason being in us that was in them to whom they were given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-travers.html">Walter Travers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Ecclesiastical Discipline ordained of God to be used</cite>, … (1588), pp. 123-4</span></figcaption>

<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.”

— London Ministers, Jus Divinum, The Divine Right of Church Government, … (1646), Appendix, ‘An Introduction to Scandal’, Question 6, ‘A Further Consideration of Things Not Necessary &amp; How They be Scandalous Objects’, pp. 62-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1st+Conclusion.+Monuments+or+instruments+of+idolatry+are+of+two+sorts%2C+either%3A+%5B1.%5D+Such+things+as+have+no+other+use+at+all+but+to+contribute+sorne+subservient+influence+in+or+unto+idolatrous+worship%2C+and+because+these+have+all+their+warrant+from+a+mere+commandment+of+man%2C+they+are+simply+not+necessary%2C+as+the+graven+image%2C+the+idols+themselves%2C+all+positive+observances+in+God%E2%80%99s+worship+destitute+of+any+command+of+God%3B+and+the+use+of+these+in+any+case+must+be+scandalous+and+so+unlawful+because%E2%80%A6+%5B2.%5D+But+there+be+other+things+that+are+instruments+of+idolatry+and+subservient+thereunto%2C+in+a+common+and+physical+influence%2C+as+a+temple+builded+to+the+honor+of+a+saint+and+for+the+adoring+of+images%2C+and+for+the+reading+and+opening+the+Word+of+God+in+the+New+and+Old+Testament%2C+though+in+a+corrupt+way%3B+these+are+not+properly+monuments+of+idolatry.+Now+the+house+or+Church%2C+as+such+is+no+monument%2C+nor+useless+instrument+in+worship%2C+such+as+is+a+surplice%2C+a+human+holy+day%2C+for+it+has%2C+as+such%2C+being+a+thing+of+walls+and+timber%2C+no+other+than+that+very+same+physical+influence+in+worshipping+either+the+true+God+or+a+saint%2C+that+it+has+in+civil+use%2C+in+our+ordinary+dwelling%2C+to+wit%2C+to+fence+our+bodies+in+religious%2C+in+natural%2C+in+civil+actions+from+injuries+of+heaven%2C+clouds%2C+and+sin.+The+adjuncts+of+the+Church%2C+as+crucifixes%2C+images%2C+altars%2C+ravels%2C+mass-clothes+and+the+like%2C+are+properly+monuments+and+instruments+of+idolaty%2C+because+these+are+not+necessary%2C+as+is+the+material+house%2C+nor+have+they+any+common+and+physical+influence+in+the+worship%2C+as+the+temple+has%2C+yea+all+the+necessity+or+influence+that+they+have+in+the+worship+is+only+religious+and+human+flowing+from+the+will+of+men%2C+without+either+necessity+from+our+natural+constitution+of+body%2C+or+any+word+of+Scripture%2C+and+therefore+they+are+to+be+removed+upon+this+ground%2C+because+they+are+unnecessary+snares+to+idolatry%E2%80%A6+%E2%80%A6An+house+for+the+worship+of+God+is+amongst+the+things+that+are+necessary+by+way+of+disjunction+in+specie%2C+not+in+individuo%3B+that+is%2C+a+house+is+necessary%2C+in+its+physical+use%2C+to+fence+off+our+bodies%2C+the+injuries+of+sun%2C+air+and+heaven%2C+but+not+this+house%2C+for+another+house+may+serve+the+turn+as+conveniently.%E2%80%9D%0A%0A%E2%80%94+London+Ministers%2C+Jus+Divinum%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+Appendix%2C+%E2%80%98An+Introduction+to+Scandal%E2%80%99%2C+Question+6%2C+%E2%80%98A+Further+Consideration+of+Things+Not+Necessary+%26+How+They+be+Scandalous+Objects%E2%80%99%2C+pp.+62-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F90b837260d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/90b837260d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-monuments-badges-of-idolatry/#:~:text=1st%20Conclusion.%20Monuments%20or%20instruments%20of,may%20serve%20the%20turn%20as%20conveniently&amp;text=1st%20Conclusion.%20Monuments%20or%20instruments%20of%20idolatry%20are&amp;text=another%20house%20may%20serve%20the%20turn%20as%20conveniently" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

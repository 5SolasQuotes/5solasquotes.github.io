<main class="wrap"><figure class="quote" id="q-d434bbd922" data-kw="">
<blockquote><p>Promises made to the Faithful and their Prerogatives l. The life, of which the promise is added to the observation of the law, is not only earthly and temporal, but also heavenly and eternal. 2. The faithful even before the birth of Christ had the same Mediator and Savior as we have, and the same spirit of adoption. Rejection of the error of those: l. Who teach that the recompense of the legal covenant was such that its function was only natural and temporal. 2. Who teach that the Fathers of the Old Testament lacked the pledge of the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism</cite>, Donald D. Grohman, The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss, (Knox College in cooperation with Toronto School of Theology. 1971), pp. 231-35 For context see ‘Donald Grohman on Dort and the 1649 Genevan Articles’ at Calvin &amp; Calvinism and Grohman.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<blockquote><p>This whole place is very obscure: but the obscurity is produced by our ignorance of the facts referred to and by their cessation, being such as then used to occur but now no longer take place. And why do they not happen now? Why look now, the cause too of the obscurity has produced us again another question: namely, why did they then happen, and now do so no more? …Well, what did happen then? Whoever was baptized he straightway spake with tongues and not with tongues only, but many also prophesied, and some also performed many other wonderful works.</p></blockquote>

</figure><figure class="quote" id="q-861d4e5588" data-kw="">
<blockquote><p>Wherefore there remaineth two rules for to judge of spirits. One is, if the opinions, as touching faith be retained perfect and pure. And this meant John when he said: ‘If any man confess the Lord Jesus,’ etc. And this confession of opinions must be examined by the holy Scriptures: the which seeing they had not in the Church at the beginning, as concerning the New Testament, they were examined by the words and doctrine of the apostles. Therefore John a little after says: ‘He that is of God heareth us, and he that heareth not us is not of God.’ Then he adds, that thus we do prove the spirit. Another rule is of manners and life: This did Christ express when he said: ‘By their fruits ye shall know them.‘ And as opinions are known by examining of them with the Scriptures, so life and manners should be tried by the discipline of the Church… In the primative Church a gift was extant whereby it might easily be known with what spirit they which did speak were led. By these means Satan was resisted when he transformed himself into an angel of light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Discerning of Spirits’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 4, ch. 4, ‘Of Ecclesiastical Laws’, pp. 45-46, p. 46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<blockquote><p>Both Roman Catholicism and liberal modernism, though fiercely opposed to each other through much of their history, draw from the same poisoned well: the exaltation of man over the Word of God. One exalts church leaders, especially the pope, as its divinely reliable guide. The other exalts human reasoning and/or feelings as the supreme judge of religion.</p></blockquote>

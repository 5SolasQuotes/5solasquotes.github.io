<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-larkham.html">Thomas Larkham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Attributes of God Unfolded &amp; Applied</cite>, ... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England., pp. 103-4</span></figcaption>

<blockquote><p>And O how He ‘travails in the greatness of his strength, mighty to save! able to save to the uttermost them that come unto God by Him.’ O His infinite willingness to save us! how deeply marked in words, in oaths, in cries, in tears, in sighs, in groans, in blood, in death of an expiring God! He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you:</p></blockquote>

<blockquote><p>Mercy and truth are necessarily found in all God’s works, if mercy be taken to mean the removal of any kind of defect. Not every defect, however, can properly be called a misery; but only defect in a rational nature whose lot is to be happy; for misery is opposed to happiness. … Now the work of divine justice always presupposes the work of mercy; and is founded thereupon. For nothing is due to creatures, except for something pre-existing in them, or foreknown. Again, if this is due to a creature, it must be due on account of something that precedes. And since we cannot go on to infinity, we must come to something that depends only on the goodness of the divine will—which is the ultimate end… In all that follows, the power of mercy remains, and works indeed with even greater force; as the influence of the first cause is more intense than that of second causes. For this reason does God out of abundance of His goodness bestow upon creatures what is due to them more bountifully than is proportionate to their deserts: since less would suffice for preserving the order of justice than what the divine goodness confers; because between creatures and God’s goodness there can be no proportion.</p></blockquote>

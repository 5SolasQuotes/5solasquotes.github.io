<main class="wrap"><figure class="quote" id="q-41c2b84fa0" data-kw="">
<blockquote><p>Is Baptism to be administered without exorcism, or conjuring out of the Devil, or blowing? To exorcise is to adjure a man by holy things, as by God, or by Christ, to do a thing, which men commonly call ‘to conjure’, as the 26th of Mathew, the high-priest says unto Christ, “I conjure thee by the living God, to tell us if thou be Christ.” And the sons of Sceva in the 19th of Acts conjured the devil by Jesus, whom Paul preached: Hence come exorcists and true exorcism: which gift was peculiar to the Holy Ghost, by which the apostles at the first, and other faithful, drave devils out of the possessed, as we read in the Acts, and Christ says, they shall cast out devils, Mark 16; but yet without baptism as Tertullian observes: Therefore it is not to be retained: First, because when Christ instituted baptism, He did not command any to exorcise; Secondly, for that the devil is driven out by Christ even in baptism, for as Cyprian says, like as scorpions and serpents, which are of force on dry land, can do no hurt, being flung into the water, so an evil spirit can inhabit no longer in whom the Spirit of God begins to dwell after baptism and sanctification. Thirdly, for that the apostles administered it without exorcism. Fourthly, neither those that are possessed, or the heathen worshippers of devils are to be baptized, but only they who are holy and partakers of the Covenant of Grace and the members of Christ, and to say that such are subject to the devils’ destroying power were very absurd. Fifthly, that gift of exorcising joined with the gift of miracles was but for a time, as that also was when many sick people were healed by the anointing of the ministers of the Church, and by invocation of the name of Christ (James 5:14), till such time as Christian religion was spread over all the world. Sixthly, for that exorcism was never used at the circumcising of infants. But whereas the heathen did bring testimony unto the Church, before their baptizing (as Tertullian witnesses) that they renounced the devil and his angels, this was a public testimony of repentance in them of years, as also that blowing, with clapped hands, which he that was to be baptized performed, did give the Church thereby to understand that he renounced Satan and his kingdom. But in the Papacy it is done by the baptizer, even [in] the face of infant to be baptized, and is therefore frivolous and to be rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion… (London, 1606), ch. 47, ‘Of Baptism’</cite>, pp. 729-30</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-531ab0edd0" data-kw="">
<blockquote><p>To proceed yet further, we are here to consider the particular remedies which they of the popish church have prescribed against the hurts that have come by witchcraft. And they are principally five. The first is the name of Jesus. We must grant that any Christian may lawfully call upon the name of Jesus in prayer, for the help and deliverance of those who are possessed and bewitched, but yet with the caveat and condition before specified, if it is the will of God, and if their recovery may make for His glory, the benefit of the church, and the good of the diseased parties. But the papist, by the use of this name, intends a further matter, to wit, that the very name uttered in so many letters and syllables is powerful to cast out devils and to help those who are bewitched. For when it is uttered, then (they say) the authority of Christ is present, that the work may be done. [This is] a flat untruth and a practice full of danger. For let this be well considered, whatsoever any man does in this case, he must do it by virtue of his calling, and have also his warrant for the doing thereof out of the Word. If he lacks this, and yet undertakes such a work, he may justly fear the like event that befell the vagabond Jews who were exorcists (Acts 19:13). Now the church of Christ has no warrant in the Word to use this name of Christ for any such purpose. Neither has any ordinary Christian a special calling from God so to do. Therefore, he may not do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft… (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’</cite>, pp. 239-40</span></figcaption>

</figure><figure class="quote" id="q-c328fa613d" data-kw="">
<blockquote><p>Sixthly, escaping of worldly pollutions is not always an argument of a renewed nature, because sin may drive out sin, even as divines say about popish exorcisms, when the priest calls out devils from men possessed, it is by collusion: the devil recedes not because those exorcismes are of divine efficacy, but because hereby he would confirm people more in believing a lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652), Section 3, Sermon 32</cite>, p. 192</span></figcaption>

</figure><figure class="quote" id="q-fd871d8b27" data-kw="">
<blockquote><p>2nd Use. If we pray God to deliver us from evil, then we must beware of all satanical practises as means of help in any distress; this is gross hypocrisy to pray against the evils of Satan and to give ourselves to the practise of them. Herein many offend, for the Papists say this prayer, but yet their religion in many things is a gross practice of magic and sorcery; for first: the consecration of their host in the mass is plain conjuration: and so are their exorcisms in halowing salt, bread, and water, their casting out of devils by certain words, by the sign of the cross, the application of relics and such like: nay, come to ourselues, what is more common among us than to use charmes and amuletts, to seek to witches and sorcerers when any strange affliction does befall us? And the setting of a figure, though it be not gross magic, yet therein is a close and privy work of the devil, his hand is deep therein: and the Church in former times has condemned it for witchcraft: for charms, characters and amulets be but the devil’s watchword and sacraments to set him a working: what though the words used be good, yet therein is Satan’s deeper policy, who turns himself into an angel of light, under fair shows working the greater mischeif. But what horrible impiety is this, that when God gives us occasion to come unto Him, we leave Him and run for help to his professed enemies.</p></blockquote>

— William Perkins, on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608), p. 315">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2nd+Use.+If+we+pray+God+to+deliver+us+from+evil%2C+then+we+must+beware+of+all+satanical+practises+as+means+of+help+in+any+distress%3B+this+is+gross+hypocrisy+to+pray+against+the+evils+of+Satan+and+to+give+ourselves+to+the+practise+of+them.+Herein+many+offend%2C+for+the+Papists+say+this+prayer%2C+but+yet+their+religion+in+many+things+is+a+gross+practice+of+magic+and+sorcery%3B+for+first%3A+the+consecration+of+their+host+in+the+mass+is+plain+conjuration%3A+and+so+are+their+exorcisms+in+halowing+salt%2C+bread%2C+and+water%2C+their+casting+out+of+devils+by+certain+words%2C+by+the+sign+of+the+cross%2C+the+application+of+relics+and+such+like%3A+nay%2C+come+to+ourselues%2C+what+is+more+common+among+us+than+to+use+charmes+and+amuletts%2C+to+seek+to+witches+and+sorcerers+when+any+strange+affliction+does+befall+us%3F+And+the+setting+of+a+figure%2C+though+it+be+not+gross+magic%2C+yet+therein+is+a+close+and+privy+work+of+the+devil%2C+his+hand+is+deep+therein%3A+and+the+Church+in+former+times+has+condemned+it+for+witchcraft%3A+for+charms%2C+characters+and+amulets+be+but+the+devil%E2%80%99s+watchword+and+sacraments+to+set+him+a+working%3A+what+though+the+words+used+be+good%2C+yet+therein+is+Satan%E2%80%99s+deeper+policy%2C+who+turns+himself+into+an+angel+of+light%2C+under+fair+shows+working+the+greater+mischeif.+But+what+horrible+impiety+is+this%2C+that+when+God+gives+us+occasion+to+come+unto+Him%2C+we+leave+Him+and+run+for+help+to+his+professed+enemies.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+on+Mt.+6%3A13+in+A+Godly+%26+Learned+Exposition+of+Christ%E2%80%99s+Sermon+in+the+Mount...+%28Cambridge%2C+1608%29%2C+p.+315&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd871d8b27.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fd871d8b27.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-exorcism/#:~:text=2nd%20Use.%20If%20we%20pray%20God,for%20help%20to%20his%20professed%20enemies&amp;text=2nd%20Use.%20If%20we%20pray%20God%20to%20deliver&amp;text=and%20run%20for%20help%20to%20his%20professed%20enemies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Until the day Dr. Peck first met the young woman called Jersey, he did not believe in the devil. In fact, as a mature, highly experienced psychiatrist, he expected that this case would resolve his ongoing effort to prove to himself, as scientifically as possible, that there were absolutely no grounds for such beliefs. Yet what he discovered could not be explained away simply as madness or by any standard clinical diagnosis… …he recounts his journey from skepticism to eventual acknowledgment of the reality of an evil spirit, even at the risk of being shunned by the medical establishment.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8a41e984e0" data-kw="">
<blockquote><p>The basic question at stake is, “What makes a doctrine biblical?” That question is of course important to Catholics, Orthodox, and Protestants alike, but it is particularly important for us Protestants, affirming as we do sola scriptura. What I would like to do here is articulate an appropriate theological method that is faithful to sola scriptura in a robustly theological and historical manner (which, by the way, is how the Reformers originally articulated the idea). In contrast to a stark biblicism that sees theology as essentially an individual project whereby the reader exegetes a handful of passages and then makes theological conclusions, this method is, I think, more careful to understand that theology is not autonomous, it is not presupposition-less, it is not a-historical, it is not merely a matter of proof-texting or collecting a handful of texts, and it is not unmoored from other Christians reflection throughout space and time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matt-emerson.html">Matt Emerson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What Makes a Doctrine “Biblical”? On Method’ (2016)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8b377bc63" data-kw="">
<blockquote><p>We hold the case thus:—that the spirits are to be tried and proved by a twofold judgment. The one, internal; by which, through the Holy Spirit, or a peculiar gift of God, any one may illustrate, and to a certainty, judge of, and determine on, the doctrines and sentiments of all men, for himself and his own personal salvation concerning which it is said. (1 Cor. ii. 15.) &quot;The spiritual man judgeth all things, but he himself is judged of no man.&quot; This belongs to faith, and is necessary for every, even private, Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>

</figure><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>

</figure><figure class="quote" id="q-f8b91c1809" data-kw="">

<main class="wrap"><figure class="quote" id="q-bfe47d0801" data-kw="">
<blockquote><p>We reject likewise the fictions of the Pelagianizers: Concerning the conditioned will, concerning the decree of velleity or desire. Concerning Middle or conditioned Knowledge, by which that desired determination is said to be foreseen. Concerning the intention of conditioned concourse concomitantly into the effect—and consequently concerning the simultaneous concourse and egress of grace and free will, which is really independence and primacy, pre-running and predetermination of the second cause. Concerning universal sufficient grace, and according to it a salvific calling, whose presupposition is the grace of universal redemption, reconciliation, and confederation. Which fictions have been sufficiently sifted by the authors just cited, partly also by the Dominican theologians and other genuine followers of Thomas, whom you will see alleged in those authors passim [throughout], and especially in Sylvius the Douai theologian, in his treatise On the Motion of the First Mover. Of our men, Ferri in his Orthodox Scholastic and its Defense against the Jesuit Perrin has rendered most useful service here. The Various Dissertations on the [End] Term of Life edited by Beverovicio can also be compared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36. 535. Leigh, Treatise, II.xiii (p. 100). 536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 572</span></figcaption>

</figure><figure class="quote" id="q-b28314cab9" data-kw="">
<blockquote><p>Hence it is commonly called a will of sign and opposed to the will of good pleasure, which is always fulfilled — as several weighty Thomists here expound: Cajetan, Bañez, Zumel, cited by González (disp. 56, sect.1)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 2. ‘General will of God concerning the salvation of all men, 1 Tim. 2:4’ in Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two… vol. 1 tr. AI by Vertias (Padua: Frambotti, 1671), bk. 1, Collation 12, pp. 841-73 A more detailed ToC is given at the beginning of the volume. | Thomas, while allowing for other interpretations, preferred taking 1 Tim. 2:4, about God willing all men to be saved, to refer to an antecedent will of God, in contrast to a consequent will of God. He also speaks of it as a conditional and imperfect will, and a velleity (disposition or willingness) in contrast to the absolute will of God. (Summa, pt. 1, q. 19, art. 6, ‘Whether the will of God is always fulfilled’ [Aquinas distinguishes]) Macedo adds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-016b0f6c72" data-kw="">
<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)”

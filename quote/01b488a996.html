<blockquote><p>Of the premises ye may gather some definition of faith, as namely that ‘love is a holy endeavor for the preservation of that which is beloved, whether God or man, with an earnest desire to be united unto it.’ For love is that bond, as the apostle speaks, whereby the members of the body are knit together. And it serves also in some sort and place to unite us unto God and Christ, notwithstanding that the communion of Christ, the head of his body the Church, be principally to be ascribed unto faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 33, ‘Of Charity or Love’, pp. 236-37</span></figcaption>

<blockquote><p>III. With these words [Col. 1:12-13], our eternal salvation is ascribed to the heavenly Father with due thanksgiving…

IV. Now, following the footsteps of the Apostle, we will first discuss thanksgiving, and then its arguments. Thanksgiving to God is the worship of God when we give Him proper praise for His benefits.

V. This thanksgiving is rendered to God in three ways: in thought, in words, and in deeds.

VI. In thought, when we truly acknowledge that whatever good we are and have, we owe it all to God the Father, through and on account of Christ, by the efficacy of the Holy Spirit, according to the gracious will and eternal benevolence of the Father, Son, and Holy Spirit towards us. Furthermore, we have perpetual gratitude in our hearts towards God.

VII. This thanksgiving, which pertains to thought, holds the first place in order and dignity, without which the other expressions of gratitude are not pleasing and acceptable to God.

VIII. In words, when we privately or publicly commemorate the benefits of God, from which they have come forth, through preaching His goodness.

IX. In deeds, when, to testify our gratitude to God, we offer ourselves and our material and spiritual possessions to Him, willingly devoting them for His glory and the use of the saints.

X. The arguments for thanksgiving are derived both from the cause that impels God to bestow benefits upon us and from the benefits themselves as effects of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:12-13) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-1ec541e6ce" data-kw="">
<blockquote><p>Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…</p></blockquote>

</figure><figure class="quote" id="q-85d2bcd06d" data-kw="">
<blockquote><p>One finds Calvin (for instance) declaiming, in his lectures, that they [French kings] are “gross and stupid.” They “think they are exempt from the law.” They are self-indulgent, “inhuman tyrants,” and “madmen.” They “despise everything divine” and wish to be worshipped in God’s place. They “rage against the church.” “We know that wherever there is cunning in the world, it reigns especially in the palaces of princes.”… Thus, the depiction of obsequious deference and obedience on the part of Geneva towards France was, in reality, a façade.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<main class="wrap"><figure class="quote" id="q-569df882a1" data-kw="">
<blockquote><p>Whether Christ was a king when He began to be Mediator? It is affirmed. Whether He was a king when He traversed in the earth? It is affirmed. Whether Christ obtained to the king of the Jews by a hereditary, temporal right? It is affirmed with a distinction. Whether He was finally made king at the time He ascended into Heaven? It is denied contra the Socinians. Whether there is a twofold kingly power in Christ? It is affirmed. Whether the kingdom of Christ the Mediator, or the economic kingdom, will be subordinated to the kingdom of the Father, or the natural kingdom of God? It is affirmed. Whether kings of this world are subordinated to the kingdom of Christ? It is distinguished. Whether He is a king according to both natures? It is affirmed. … Whether it is a spiritual kingdom of Christ, or rather worldly? The former is affirmed. Whether Christ’s kingdom is rightly distinguished between internal and external, and these two are separated after the departing of Christ out of the earth? The former is affirmed, the latter denied. … Whether Christ’s kingdom is universal and through the whole world? It is affirmed. Whether it extends to all creatures? It is affirmed. … Whether the kingdom of Christ will endure in eternity? It is affirmed with a distinction. What is to be said about the millenary reign of Christ and the error of the Chiliasts? It is explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2, tract 2 Abbr. | 4. Of the Kingship of Christ . Of Christ the Judge</span></figcaption>

</figure><figure class="quote" id="q-60948dd10c" data-kw="">
<blockquote><p>Of these natures, the necessity, and verity whereof hath been declared, there are divers operations; for there are two natures in Christ, as it were two inward, and effectual beginnings; out of which formally, Actions, and their manners, are deduced: wherefore, as all things in Christ, (his subsisting only excepted,) are two-fold, (or of two sorts) to wit, his Nature, Properties, Will, Knowledge: so are there two-fold operations; some divine, some humane, distinguished by their beginnings, manners of doing, and the particular Actions of each of them. By their beginnings: because, look how many Natures there are; so many formal beginnings of actions there are. By the manners of doing: for every beginning works according to it own manner, and condition: the God-head, after a supernatural, and divine manner: the man-hood after a Natural and Human manner. By particular Actions; for the Word works that, which is of the Word, and the Flesh, that, which is of the Flesh, without any confusion of Natures, in the unity of Person.</p></blockquote>

</figure><figure class="quote" id="q-424a2efbc7" data-kw="">
<blockquote><p>He which is true God, the same is also true man, and in this unity there is no untruth, whereas there meet together the baseness of manhood and the excellency of the Godhead. For as God is not changed by the partaking, so man (that is man’s nature in Christ) is not consumed by the dignity, for each form works with communion of the other, their own property: namely the Word works that which is proper to the Word, and the flesh performs that which is proper to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (1599) | But we believe and confess that these two natures, are truly and inseparably joined and united into one person of Christ: that yet we doubt not, but each of them remains whole and perfect, and the one truly distinct from the other, yea and that they do hold the essential properties and operations of each of them distinct: without all manner of confusion: so that as the divine nature holding the properties remains uncreated, infinite, immeasurable, simply omnipotent and simply wise: even so the human nature holding her’s remains created, comprehensible, and determined with certain limits: And as the divine nature has will and power, whereby Christ wills and works, as God, such things as are of God: so has the human nature will and power, whereby Christ as man, wills and works those things which are of man: so far forth as Christ in that He is God, He wills not nor works by human will or power: so neither as He is man, wills He or works He by divine will or power: as it has been learnedly determined by the fathers both against Eutyches and against Macarius. We therefore did always like well of that saying of Leo I [c. 400-461], Epistle 10 [28], ch. 4, writing unto Flavianus about the same thing, where he says:, ch. 11, ‘Of Christ the Redeemer’; pp. 61-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

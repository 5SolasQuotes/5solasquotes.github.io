<main class="wrap"><figure class="quote" id="q-3a49f27cc9" data-kw="">
<blockquote><p>We likeways renounce Deism, which is a Principle prevailing with many at this Day, who deny the Scriptures to be the Word of God, and pretend that natural Religion is sufficient to guide Men to Happiness, and revealed Religion is not necessary.

We likeways renounce Arianism, which is that gross Heresy denying the proper, true and supreme Deity of the Son of God, and of the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-moncrieff.html">Alexander Moncrieff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744</cite>, (Edinburgh: David Duncan, 1747), p. 77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-36de6a17d3" data-kw="">
<blockquote><p>Secondly, we must consider the certainty, and authority of this book. The Church as yet, never rejected or refused this book: but have accounted the same among those, which we call Canonical books of holy scripture, and which have Ecclesiastical, and heavenly testimonies.

Furthermore, we have our saviour Christ (as concerning this matter) a sufficient testimony and witnesses, as may appear by the xii Chapter of Mathew, where he alledgeth the example of Jonas for his resurrection, affirming, that the coming of Jonas out of the Whale’s belly, was a type of the same. Furthermore, Christ preferreth the Ninevites, before the Israelites, because the Ninevites repented at the one only sermon of Jonas, and the Israelites would not be converted unto the Lord by many sermons.

Wherefore, if ever any man did, or shall hereafter doubt of the authority, truth, and certainty of this book, Christ by his testimony, hath so confirmed the same, that though an Angel came from heaven teaching the contrary, he ought not to be believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>News from Ninive to England, brought by the prophet Jonas: which news in plainly published in the godly and learned exposition of Master John Brentius</cite>, trans. Thomas Tymme (London: Henry Denham, 1570), preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-c93bf87ff0" data-kw="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c126dbecd5" data-kw="">
<blockquote><p>3. Be it so, that at some time the fame of the Christian name and of the Gospel of Christ reached some infidel people, yet the infidel gentile is not bound universally to listen to every man saying to him: “Listen to me, for I will instruct you in the principles of that religion by which you may attain salvation.” The reason is, because that gentile has no other light than the natural. But reason does not dictate that every man is to be heard concerning doctrine about religion or the knowledge of God; therefore, he will not be bound to hear everyone. For by the same reason he would be bound to hear a heretic or a Jew, or another sectarian, who would preach a new religion to him.

4. Although a gentile hears the Gospel explicitly from some truly Christian preacher, he does not immediately commit the sin of infidelity if he does not believe, unless the preacher produces testimonies which are fit and sufficient to convince the man that what is preached is credible, and to persuade him vehemently that he is bound to believe. Hence Dominic Bannes collects that very many of the West Indians were excused from the sin of infidelity as far as the preachers are concerned. Because for those men (he says) who preached the Gospel were most cruel and greedy. Indeed, in the third place, I assert that even if a suitable preacher evidently shows the Gospel to be credible, it is not sufficient for a gentile to be immediately bound to believe, unless it is shown there to be more credible than every other sect and religion concerning the worship of the true God. This is proven:

1. Because out of two credible things, a person is not bound to believe that which is less or equally credible.

2. Because for the same reason a gentile would be bound to receive the doctrine of the heretics, or of the Jews, which can be persuaded by human reasons as probable to one who has never known the catholic Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 58-59</span></figcaption>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical.

37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense.

38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

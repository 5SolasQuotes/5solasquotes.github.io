<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In Defense of Christian Philosophy: A Response to Peter Leithart’</cite>, (2018) 22 paragraphs</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd3490fb52" data-kw="">
<blockquote><p>The first sort [of objectors] say, ‘It is to no purpose to dispute against such as deny grounded principles.’ And by this means, because one grounded principle is denied them, they break off quite and clean, as though all mean of conference were taken away. Surely this principle of theirs is very true, but yet (in my judgment) it is very ill understood. I grant it is to no purpose to dispute against such as deny grounded principles, by the same principles which they deny: That is very true. But there may be some other principles common to both sides, by the which a man may profitably dispute with them, and by those common principles oftentimes prove and verify his own principles. And that is the thing which I intend to do in this work. As for example: The Christian grounds himself upon the Gospel; the Jew denies it: and therefore it were to no purpose to allege it unto him. But both the Jew and the Christian have one common principle and ground, which is the Old Testament: By this may the Christian profitably dispute against the Jew, yea even to the verifying of the Gospel. … Likewise the Jew is grounded upon the Old Testament, which the Gentile would mock at if he should allege it unto him. But both the Gentile and the Jew have one common nature, which furnishes them both with one common philosophy, and with one common sort of principles; as that there is one God which governs all things; that He is good, and no author of evil; that He is wise, and does not anything in vain. Also that man is born to be immortal; that to be happy he ought to serve God and continue in his favor. And therewithal, that he is subject to passions, inclined to evil, weak unto good and so forth. Of these common principles, the Jew may draw necessary conclusions, which the Gentile shall not perceive at the first, like as when a man understands a proposition, but conceives not yet the drift and consequence thereof… Thus shall the Jew by common principles and conclusions, verify his own ground which is the Old Testament… And what else is all this than that which is commonly done in geometry and logic, which by two lines or by two propositions that are commonly known and certain, do gather… a third proposition (that is to say, a conclusion) that was… either doubted of or hidden, and by means of the other two is evidently found out, and necessarily proved. … To be short, the mark that our faith looks at, is the Author of Nature and principle of all principles. The rules therefore and the principles of nature which He has made cannot be contrary unto Himself. And He is also the very reason and truth itself. All other reason then, and all other truth depends upon Him, and relies upon Him, neither is there, or can there be any reason or truth but in Him: So far off is it, that the thing which is true and reasonable in nature, is or can be false in divinity, which (to speak properly) is not against nature, but against the corruption of nature, and in very deed about nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Work concerning the Trueness of the Christian Religion</cite>, … against Atheists, Epicures, Paynims, Jews, Mahumetists and other Infidels (London: Cadman, 1587), Preface, n.p.</span></figcaption>

</figure><figure class="quote" id="q-8ec835b72d" data-kw="">
<blockquote><p>The mind of man is a tabula rasa not absolutely, but relatively as to discursion and dianoetical knowledge (which is acquired necessarily by inferring one thing from another); but not as to apprehensive and intuitive knowledge. For even according to Paul, the work of the law is in such a manner written in the hearts of the Gentiles that they do by nature the things contained in the law. Hence is a twofold inscription upon the heart of man: the one of God in the remains of his image and the natural law; the other of the Devil by sin.</p></blockquote>

</figure><figure class="quote" id="q-c0b13f9fa1" data-kw="">
<blockquote><p>This paper highlights a set of objections on natural theology addressed by Descartes and Voetius to each other. It shows and expands the common ground Descartes and Voetius held within natural theology. It argues that their contrasting views revolved mainly around the limits of natural theology. For Voetius, natural theology is extrinsically limited by the revealed God, the external principle of faith. For Descartes, metaphysics or natural theology is intrinsically limited by the incomprehensible idea of the Infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vadana-mihai-dragos.html">Vadana Mihai-Dragos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Voetius on the Innate Knowledge of God &amp; the Limits of Natural Theology’ in Annals of the University of Bucharest, Philosophy Series</cite>, vol. LXV, no. 2 (2016), pp. 37-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>If the [train] car sits on a flat railway, how long will it sit there till it moves down the railroad? Of course not until something else comes and pulls it along. The flatbed has no ability or potential to move itself or to activate its own potentials. Something else has to do that. . 1.3 The Law of Causality Say two train cars sit on the railroad next to each other. Both have the potential to move. Yet the potential of the one never moves the other. Why? Because the one flatbed’s potential to move is not actual; it is not actually moving, and that is what it would take to move the second flatbed, to activate its potential to move. That one thing must be moved by another is not only a common observation all around us, it must be true for everything that has potential, precisely because something not actual cannot do anything. A possibility does not exist as anything but a possibility. These things must be true by what potentiality and actuality must be. The principle is called the Law of Causality: Something potential can only be made actual by something actual. This is not only universally true by empirical experience, but it must be true by definition from the laws that constitute nature, given change. If change occurs, it must be done by something actual. Something must bump into or pull the train car before it will move, because it has no nature or potential to move itself.</p></blockquote>

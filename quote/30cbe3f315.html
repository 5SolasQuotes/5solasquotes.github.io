<main class="wrap"><figure class="quote" id="q-30cbe3f315" data-kw="">
<blockquote><p>The third theological foundation of the Genevan Psalter was the doctrine of common grace. By this it was recognized that there are two types of divine gifts — supernatural and natural. The former are the virtues wrought in the soul by a special work of grace; the latter are those which pertain to secular matters and are distributed to all, not to saints only; as a matter of fact, often to sinners. But, wherever they were, Calvin recognized these and used them for his purposes. Skill in music is a natural rather than a supernatural skill, but Calvin was ever on the alert to capture this for the worship of God. Thus, at his Academy in Geneva, he made music required four hours each week. The choir thereby trained in this skill was to lead the people so they could, under its leadership, cultivate the same skill. Acting on this same principle, Calvin was quick to appreciate the able — though not excessively orthodox — Marot, and to stand by the gifted composer, Bourgeois, who was thrown into prison for breaking some of the rigid disciplines of Geneva of which Calvin was himself the main author. Abraham Kuyper, in his admirable Lectures on Calvinism, so aptly remarks, “Music…would flourish, henceforth, not within the narrow limitation of particular grace, but in the wide and fertile fields of common grace.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing the Words God Has Put in Our Mouths”</cite>, (originally published in The Hymn, January 1953), in John H. Gerstner: The Early Writings, vol. 1, pp. 204-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a0e2e650e" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans… followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans… believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>

</figure><figure class="quote" id="q-a14bad4793" data-kw="">
<blockquote><p>…Him that accepteth not the persons of princes, nor regardeth the rich more than the poor? for they all are the work of his hands. In a moment shall they die… For his eyes are upon the ways of man, and He seeth all his goings. There is no darkness, nor shadow of death, where the workers of iniquity may hide themselves. He shall break in pieces mighty men without number, and set others in their stead. Therefore He knoweth their works, and He overturneth them in the night… Because they turned back from Him, and would not consider any of his ways: So that they cause the cry of the poor to come unto him, and He heareth the cry of the afflicted.</p></blockquote>

</figure><figure class="quote" id="q-60a16bbd50" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind, in supplying their necessities, with the light and warmth of the sun, and with the rain; as well as a special love and favor, which He exercises only toward those that are good, and members of Christ; so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Poole’s English Annotations on the Holy Bible</span></figcaption>

<main class="wrap"><figure class="quote" id="q-01df301672" data-kw="">
<blockquote><p>None can deny natural arguments to be a part of the Word of God, as is clear, Rom. 1:19; 1 Cor. 15:36–37; 1 Cor. 11:14. Yea, Christ, Mt. 7:12, teaches that this principle of nature, ‘whatsoever ye would men should do to you, do ye so to them,’ is the Law and the prophets, because it is a great part of the Law and the prophets, and therefore they say in effect ‘As it written in the Scripture,’ when they say ‘as it is written in man’s heart by nature.’ 2. Principles of nature are made Scripture by the penmen of the Holy Ghost, and do bind as the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London: 1646), ch. 1; p. 106</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da71c1ee94" data-kw="">
<blockquote><p>That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ch. 1, §§ 9–10</span></figcaption>

</figure><figure class="quote" id="q-8eab3242bd" data-kw="">
<blockquote><p>Therefore, let this remain as a most sure maxim, that no doctrine is worthy to be believed but that which we find to be grounded in the Scriptures. The Pope will have all that received without any more ado, whatsoever he doth blunder out at his pleasure; but shall he be preferred before Paul, concerning whose preaching it was lawful for the disciples to make inquisition?</p></blockquote>

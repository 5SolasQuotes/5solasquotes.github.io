<blockquote><p>I. There is a communion of converse, and communion of affection… And there may be communion of affection, where there is no converse. Nay, there is, as it were, planted in morality, an affection of one excellent person to another. A valiant man loves a valiant man, though he never came near him. A scholar loves a scholar, that he has only heard of. Much more is such an affection planted in true Christianity in a heart truly religious, be he who he will, where he will; though he never saw him. As, ‘My delight is in the saints, and excellent on the earth,’ (Ps. 16:3) be they far off or near. II. There is communion in ‘common interest,’ where, it may be, there is not communion in coomon converse. Those that never saw or heard of one another to converse together, yet may have communion in common interest. Englishmen meeting beyond sea, that never saw each other before, yet will take parts, and side together, as in the common interest of being countrymen. There is a common interest in all the saints in the world, though at their never so great distance and separation, viz. glorifying God, and loving the Lord Jesus. As the apostle says, 1 Jn. 1:3, ‘Our fellowship is with the Father, and with his Son Jesus Christ.’… This is the special center, in which saints meet, be they never so far asunder. And in this sense, their ‘gathering together,’ is to be understood (of which there is so frequent mention); not into one place; but into this one circle of loving, fearing, serving God; Zeph. 3:9, ‘That they may call upon the name of the Lord, and serve Him with one consent.’ In the Hebrew it is, ‘with one shoulder;’ as if many were together shouldering up the same weight or burden: all in their places jointly putting-to their endeavor to bear up the name, glory and honor, of God: east, west, north, south, every saint joining in this great work, and meeting in this holy point. As the twelve oxen under the brazen sea, their face to the four quarters of heaven, but their bodies all meeting to bear up the weight. Now, III. They that are all of the same mind, all meet in this common interest towards God, cannot but love one another, though they know not one another. ‘My heart’ (says Deborah) ‘is towards the governors of Israel, that offered themselves willingly among the people.’ (Judges 5:9) Did she know all their faces and persons? Could she call them by their names? No, but she could not but love them, be they who they would, that put-to their hands and shoulders to that common cause. We see, how men are ready to affect any that they hear to be of their opinion, humor and mind, though they never saw them. Much more does a saint love a saint, that is partner with him in this holy work. Though he knew not where to find him, or name him; yet if he be for God, he must have his heart; and loving God, he cannot but love whosoever loves Him. IV. Accordingly they sympathize one with another; ‘Whether one member suffer, all the members suffer with it; or one member be honored, all the members rejoice with it.’ (1 Cor. 12:26)… It grieves a saint, if it be ill with any saint in the world; and he rejoices , if it go well with him. His heart is touched with his case, as with his own. As we are affected with the well or ill doing of any Englishman in any part of the world, for common interest of country’s sake. Neh. 1:4, “And it came to pass, when I heard these words, that I sat down, and wept, and mourned certain days, and fasted, and prayed before the God of heaven.’ ‘Why Nehemiah? thou are well enough; thou art in place of honor, pleasure, preferment.’–‘Oh! but it is ill with the people of God.’–And, Ps. 137:5-6, says the Psalmist, ‘If I forget thee, O Jerusalem, let my right hand forget her cunning. If I do not remember thee, let my tongue cleave to the roof of my mouth, if I prefer not Jerusalem above my chief joy:’ I can never forget Jerusalem. V. Answerably, they have one another’s prayers. There is not a saint in the world, but has the prayers of all the saints in the world. Any child of God makes it conscience to pray for every child of God on earth. One member cannot but do its best for another. ‘And as many as walk according to this rule, Peace be on them, and mercy, and upon the Israel of God.’ (Gal. 6:16) ‘Pray for thyself, Paul, and for thine own churches’–‘Nay, but every saint wherever is a member of the same body that I am of; and, therefore, I must pray for them also.’ So Eph. 6:24, ‘Grace be with all them, that love our Lord Jesus Christ in sincerity.’ I love Christ, and cannot but love and pray for all that love Him.</p></blockquote>

<blockquote><p>In whatsoever body life is placed, the power and strength thereof is to guide, and also by a most sure bond to unite all the parts of the whole body, by how great a space soever they be dissevered one from the other: even so the congregation of the godly, which commonly (if the believers be considered of in respect that they be earthly men) is called the Church, how much soever it be compact of sundry people, and has her parts settled a great space one from another in the world: and that, as much as the uttermost quarter of the world is distant by the spaces of regions, from the other part of the world; yet nevertheless it is joined, knit, and couched together. And for that cause it is by Paul compared to a body, and that oftentimes in his epistles unto the Ephesians and Corinthians (Eph. 4:12 and 5:23; 1 Cor. 12:12). But by what bond the Christians (who so greatly differ one from another, whether respect be to their condition, country, or language) are so strictly knit together, it is sufficiently understood, by the order which joins this latter article of our faith unto the former [about the holy, catholic Church]. For there our faith confesses the Holy Ghost, and here it treats of the body of the faithful, which with a sincere faith, embracing the doctrine of Christ, is by Him gathered together in one. …By these things therefore ye understand, that the Church is a mystical body, the which is governed by the Holy Ghost.</p></blockquote>

<blockquote><p>So then in this article [of the Creed] we confess that all the faithful dispersed throughout the whole compass of the earth, and they also that at this time live in Heaven, as many, I say, as are already saved, or shall even until the very end of the world be born to be saved, are one body, having gotten fellowship and participation with God and a mutual communion among themselves.</p></blockquote>

</figure><figure class="quote" id="q-f42aa4e4c7" data-kw="">
<blockquote><p>Saints by profession are also united in one body, and bound to maintain a holy fellowship and communion with each other. Professed saints compose the Church considered as visible… This union is not confined to those who live together, and can assemble in one place for the observance of religious ordinances, but extends to ‘all that in every place call upon the name of Jesus Christ our Lord, both theirs and ours.’ The visible bonds of this unity are specified by the Apostle Paul: ‘There is one body and one Spirit, even as ye are called in one hope of your calling; one Lord, one faith, one baptism; one God and Father of all, who is above all, and through all, and in you all.’ — Eph. iv. 4-6.</p></blockquote>

</figure><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>

<blockquote><p>There are sundry cogent arguments which are taken from external considerations of the Scripture, that evince it on rational grounds to be from God. All these are motives of credibility, or effectual persuasives to account and esteem it to be the word of God. And although they neither are, nor is it possible they ever should be, the ground and reason whereon we believe it so to be with faith divine and supernateral; yet are they necessary unto the confirmation of our faith herein against temptations, oppositions, and objections. These arguments have been pleaded by many and that usefully, and therefore it is not needful for me to insist upon them. And they are the same for the substance of them in ancient and modern writers, however managed by some with more learning, dexterity, and force of reasoning than by others. …although we plead that no man can believe the Scriptures to be the word of God with faith divine, supernatural, and infallible, but upon its own internal divine evidence and efficacy, yet we allow and make use of all those external arguments of its sacred truth and divine original which are pleaded by others, ascribing unto them as much weight and cogency as they can do, acknowledging the persuasion which they beget and effect: to be as firm as they can pretend it to be: Only we do not judge them to contain the whole of the evidence which we have for faith to rest in, or to be resolved into; yea not that at all, which renders it divine, supernatural and infallible. The rational arguments we say which are, or may be used in this matter, with the human testimonies whereby they are corroborated, may and ought to be made use of and insisted on; and it is but vainly pretended that their use is superseded by our other assertions; as though where faith is required, all the subservient use of reason were absolutely discarded, and our faith thereby rendered irrational; and the assent unto the divine original and authority of the Scriptures, which the mind ought to give upon them, we grant to be of as high a nature as is pretended to be, namely, a moral certainty. Moreover, the conclusion which unprejudiced reason will make upon these arguments, is more firm, better grounded, and more pleadable, than that which is built merely on the sole authority of any church whatever…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 28-30 of The Reason of Faith... (Glasgow, 1801), ch. 3, ‘Sundry convincing external Arguments for Divine Revelation’ also in Works, vol. 4</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4fd6cf121" data-kw="">
<blockquote><p>May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878)</cite>, pp. 438–39</span></figcaption>

<blockquote><p>Why is faith the means of justification? Simply because it is the action of union with Jesus Christ. Faith is our coming to Him, our trusting Him, our resting in Him. The moment we are united to Him, we are immediately endowed with all that He has secured for us. We are immediately justified before we have done a single good deed, because we are His and He is God’s. Just as a very poor woman is a very poor woman until the very moment that she marries a wealthy man. But at the moment that she becomes his wife, she becomes a wealthy woman. It is by means of her acceptance that she becomes a wealthy woman, but her acceptance does not make her a wealthy woman; it is her husband’s wealth that makes her so. So faith does not justify; Christ justifies. But faith is the act of union with Christ.</p></blockquote>

<blockquote><p>1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.</p></blockquote>

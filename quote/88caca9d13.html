<blockquote><p>I tell you the truth, he who believes has everlasting life. John 6:47 One could preach a hundred thousand years about these words and emphasize them again and again. Yes, one can’t speak enough about these words. Here Christ explicitly promises eternal life to the believer. He doesn’t say that if we believe in him we will have eternal life. Rather, he says that as soon as we believe in him, we already have eternal life. He is speaking, not of future gifts, but of present ones. He is saying, “If you believe in me, you are saved. You already have eternal life.” This passage is the cornerstone of our justification. With it, we can settle the disputes we’re having about how we receive God’s approval. Good works don’t lead us to heaven or help us in the sight of God. Only faith can do this. Of course, we should do good works and live holy lives in obedience to God. But these efforts won’t help us earn salvation. We already have eternal life. If we don’t receive it while here on earth, we’ll never receive it after we leave. Eternal life must be attained and received in this body. Yet how do we acquire eternal life? God becomes our teacher, for he tells us about eternal life through those who preach his Word. He convinces us that we should accept his Word and believe in him. That is how it begins. Those same words that we hear and believe will lead us to none other than the person of Christ, born of the Virgin Mary. God will take us nowhere else. If we believe in Christ and cling to him, we are redeemed from both physical and spiritual death. We already have eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone, Zondervan. Kindle Edition</cite>, 192.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6c3d9a315" data-kw="">
<blockquote><p>There are innumerable passages in Scripture in which forgiveness of sins is attributed to good works, proceeding from faith and the special aid of grace. to mot for the present that passage, St. James 2:24, where man is expressly said to be ‘justified by works, and not by faith only;’ to omit, I say, that passage, about the meaning of which there is such warm contention between the parties, and of which we will afterwards treat in its proper place, see Eze. 17:21, and 33:12, 14-16, 19; Mt. 6:14; 18:35; Lk. 6:37; James 5:19-20, etc. Nay, any one who attentively reads the Scriptures will find that there are perhaps more passages which exact the condition of good works for obtaining the pardon of sins and eternal life, than there are which require the condition of faith, simply so called (Apology for the Remonstrants’ Confession, ch. 22, p. 237 verso); although it [i.e. faith] is necessarily always understood (nay rather presupposed) in them all. Let whoever chooses consult the Collection of passages for good works taken from both Testaments by G. Wicelius (Coacervatio locorum utriusque Testamenti de absoluta necessitate bonorum operum), and others; but especially let him diligently, and without prejudice, read the Holy Scriptures themselves. Scripture also very frequently teaches that we are purged from sins by the participation of the sacraments. (Eph. 5:26; Acts 2:38; 22:16; Tit. 3:5-7; Mt. 26:27-28 and frequently others)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, pp. 39-41</span></figcaption>

<blockquote><p>XXVII. Regarding the acts of faith, many Reformed theologians usually distinguish three acts or parts of justifying faith. The first is knowledge by which we recognize and understand the Word of God, at least in terms of what is necessary for salvation. The second is assent that we give to all that has been revealed to us in the Word of God. The third is confidence by which the believer specifically applies the general promise of the word to themselves. This is the teaching of Ursinus and Pareus in the Catechetical Explanations, question 21; of Wendelinus in Christian Theology, book 2, chapter 24, Thesis 13, 14, &amp; 15; of Tilenus in a disputation on justifying faith, Thesis 20; and also of Trelcatius in the above-cited location. … XLVI. Moreover, many doctors of the Reformed school, as we saw above, count confidence among the acts of faith; but they want it to be the proper formal and specific act of faith, and its primary part. Yet, others seem to be of a different opinion; they teach that confidence is indeed an outcome and effect of faith, but not an act of faith properly said. This is among others the opinion of Garrissoles, a professor at Montauban Academy while he was alive. ‘If you ask whether faith is not confidence,’ he says: ‘I respond that confidence indeed adheres to faith with an indissoluble bond, yet, if we speak properly, it is not faith, but an effect, springing necessarily as it were from faith.’ (in the Explanation of the Catechism of Christian Religion, on the eighteenth section.) XLV. Beza held the same opinion, writing about Paul’s words in Eph. 3, where it says, ‘In whom we have boldness and access with confidence by the faith of him,’ deducing that confidence differs from faith as an effect from its cause. ‘From this passage,’ he says: ‘it is clearly apparent that confidence differs from faith as an effect from a cause, and therefore it is mistakenly substituted for faith by some, even though these two always coexist.’ Peter du Moulin also teaches the same in his Second Disputation on Justification and Justifying Faith, thesis 19 and subsequent. ‘We consider,’ he says, ‘faith and confidence to be different, and the latter to be the inseparable fruit and effect of the former.’ To which Anthony Faius adds, in Theses Disputed in Geneva, thesis 20: ‘The liberty through which access to God is easy, and the confidence through which we cry Abba Father, are effects of faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162</span></figcaption>

<blockquote><p>The grace of sanctification immediately follows the grace of justification, and it is understood under calling, as its continuous progression, under justification, as its fruit, and under glorification, as the beginning of the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 23.1. trans. Casey Carmichael.</span></figcaption>

<blockquote><p>But do not Libertines teach that no man is saved, but these that walk holily, and that sanctification is the unseparable fruit and effect of justification? Answer: They say it in words, but fraudulently: 1. Because all sanctification to them, all repentance, all mortification, all new obedience is but an apprehension that Christ has done all these for them, and that is their righteousness, and so Christ repented for them and mortified sin for them, and performed all active obedience for them.</p></blockquote>

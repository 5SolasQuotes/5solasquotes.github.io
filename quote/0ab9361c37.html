<blockquote><p>10. That all such Magistrates, or other persons that shall be trusted with this service [about the plague], may be enabled to do all other things necessary in pursuing the execution of these orders as occasion shall require, and be out of the danger of misconstruction, seeing they hazard their particular safeties to provide for the public.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95a7cc09e0" data-kw="">
<blockquote><p>50. Unto the external things of the Church belongs not only the correction of heretics and other troublers of the Church, but also that civil order and way of convocating and calling together synods, which is proper to the Magistrate; for the Magistrate ought by his authority and power both to establish the rights and liberties of synods assembling together at times appointed by the known and received law, and to indict and gather together synods occasionally as often as the necessity of the Church shall require the same; Not that all or any power to consult or determine of ecclesiastic or spiritual matters does flow or spring from the Magistrate as Head of the Church under Christ; but because in those things pertaining to the outward man, the Church needs the Magistrate’s aid and support. 51. So that the Magistrate calls together synods [as teaches WCF 31.2], not as touching those things which are proper to [ecclesiastical] synods; but in respect of the things which are common to synods with other meetings and civil public assemblies, that is, not as they are assemblies in the name of Christ, to treat of matters spiritual, but as they are public assemblies within his territories; for to the end that public conventions may be kept in any territory, the licence of the lord of that place ought to be desired. In synods therefore a respect of order, as well civil as ecclesiastical is to be had; And because of this civil order, outward defense, better accommodation, together with safe access and recess, the consent and commandment of him who is appointed to take care of, and defend human order, does intervene. … He [the magistrate] takes care also for maintaining the ministers and schools, and supplies the temporal necessities of God’s servants, by his command assembles synods, when there is need of them; and summons, calls out, and draws to trial the unwilling, which without the Magistrates strength and authority cannot be done, as has been already said; he makes synods also safe and secure, and in a civil way presides or moderates in them (if it so seem good to him), either by himself or by a substitute commissioner. In all which the power of the magistrate though occupied about spiritual things, is not for all that spiritual but civil.</p></blockquote>

</figure><figure class="quote" id="q-3eb2342fa4" data-kw="">
<blockquote><p>The king receives royal power with the states to make good laws, and power by his royalty to execute those laws, and this power the community has devolved in the hands of the king and states of parliament; but the community keeps to themselves a power to resist tyranny, and to coerce it, and eatenus, ‘in so far’ is Saul subject, that David is not to compear before him, nor to lay down Goliah’s sword, nor disband his army of defence, though the king should command him so to do.</p></blockquote>

</figure><figure class="quote" id="q-3ba91ec5ce" data-kw="">
<blockquote><p>Moreover, why should he be said to distrust the promises of God, who doth follow the ways appointed by God, to avoid evils, that notwithstanding he dependeth wholly upon God; unless peradventure we can any where find in the holy Scriptures this commandment expressly written: ‘When the plague rageth, fly not away.’ And amongst them, preservative remedies are to be reckoned; and amongst these, going aside in due time; the like also, as the very name of ‘contagion’ doth manifest. And this also is plain, That he doth not only not offend against Christian charity, neither yet tempt God, who in such manner by going aside doth avoid the plague, so that in the mean time he let pass no act of piety towards God, or of charity towards his neighbour; That on the contrary, unless he perform these duties, he may be thought to provoke the wrath of God against himself, and to be worse than an infidel, as being one that rashly puts himself in danger of deadly infection, without any care of himself, or his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Learned &amp; Pithy Treatise of the Plague, Wherein are Handled These Two Questions: the One, Whether the Plague Be Infectious, Or No: the Other, Whether and How Far it May of Christians Be Shunned by Going Aside (1580; London, 1665)</cite>, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

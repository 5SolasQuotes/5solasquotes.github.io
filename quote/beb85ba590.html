<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Commentary on Galatians</cite>, on 3:13, p. 102</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f4d3c1b67" data-kw="">
<blockquote><p>The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins, and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification is an excellent gift of God … yet we deny it to be the thing, which makes us of sinners to become righteous or just before God.</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>The Reformed Doctrine Touching the Justification of a Sinner</cite></figcaption>
<div class="meta"><span class="t">Formal Cause: Imputation</span><span class="t">Infused Righteousness</span><span class="t">Rome: Justification</span></div>

</figure><figure class="quote" id="q-780939a2cf" data-kw="">
<blockquote><p>God continues to forgive the sins of those that are justified, and although they can never fall from the state of justification, yet they may, by their sins, fall under God’s fatherly displeasure; and in that condition they usually do not have the light of his countenance restored to them, until they humble themselves, beg pardon, and renew their faith and repentance (Matt. 6:12; 1 John 1:7, 9; John 10:28; Ps. 89:31–33; Ps. 32:5; Ps. 51; Matt. 26:75).</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.5</figcaption>
<div class="meta"><span class="t">Justification and Perseverance</span><span class="t">Falls of Believers</span></div>

<main class="wrap"><figure class="quote" id="q-c3f10d3176" data-kw="">
<blockquote><p>[A]ll nations and kingdoms must in the end by subject to the Church of Christ if they want to have a gracious God and desire to be partakers of eternal life. For as the same prophet testifies (Isa. 60:12), speaking the word of the Lord: “All nations and kingdoms shall perish, and altogether be destroyed, which are unwilling to serve” the people of Christ. For forgiveness of sins is not granted, or eternal life received, except in the Church of Christ.</p></blockquote>

<blockquote><p>Recd Sept 27 U.S. Consulate Belfast September 13 1865 Hon William H. Seward Secretary of State

Sir

Will you allow me the honor and pleasure of congratulating you upon your recovery and your present ability to resume the duties of your office. I suppose that the subject of this despatch should have been sent to the Secretary of the Treasury. If however you see fit to forward it will do still better than to send it there in the first instance.

The Covenanting Synod in the US deputed three ministers Dr Wilson, Mr Wylie &amp; Mr Milligan to visit their churches in this country and collect money and clothing for the Freedmen to be dispersed through their church. The Covenanting churches here refuse Royal Bounty and wholly support their own ministers. This commends them to my approbation. They also feel more sympathy for the late slaves and are more ready to aid them than any body here except the Quakers.

In America the Covenanters held always a most firm and self sacrificing testimony against slavery. This fits them for labouring in behalf of the education and general improvement of the negroes.

Considerable though not large amounts of clothing &amp; clothing materials have been contributed through these men to supply the wants of the Freedmen. I would for these reasons most respectfully solicit the Secretary of the Treasury through you to allow these three ministers or Mr Wylie the writer of the enclosed note as one of them to pass articles free of duty that may have been contributed in this county for this benevolent object.

The enclosed note is the only other explanation that the matter seems to require.

I have the honor to be Sir your humble servant John Young</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-young.html">John Young</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William H Seward, 13 September 1865 (National Archives and Records Administration, Washington D.C., Dispatches from US Consuls in Belfast, T-368, Roll 4).</cite></span></figcaption>

<blockquote><p>Under a pretense of catholic love, a scheme is laid for uniting parties of all denominations in Church-communion, in a way destructive of any testimony for the declarative glory of Immanuel as Head and King of Zion, and for the covenanted reformation of this Church and land; for which a righteous God has justly chosen their delusions and sent forth a spirit of delusion among them, in the present awful work upon the bodies and spirits of men.</p></blockquote>

</figure><figure class="quote" id="q-825af369d0" data-kw="">
<blockquote><p>The second means for healing divisions in the church is to have… some fundamental doctrines wherein all agree: this is the basis of unity and concord in the church. The ancients call it the rule of faith, seed of doctrine, the catholic faith, the character of the church, that which is common to small and great (Irenaeus, [Against Heresies] bk. 1, ch. 3; Nazianzen, Orations 14, 40; Augustine, Enchiridion, ch. 7; Tertullian, Of the Prescription, ch. 13–14; Of the Veiling of Virgins, ch. 1; Athanasian Creed; Irenaeus, bk. 1, ch. 1 [Preface]; Augustine, Epistle 57; see [Robert] Parker, Of the Descent [1611], bk. 4, §3. 1 Cor. 3:10–11; 2 Tim. 1:13; Col. 1:23; Eph. 4:13; 1 Tim. 3:16; Gal. 1:6; Rom. 6:17; 12:6; 2 Tim. 1:13–14; 1 Cor. 2:2; 1 Tim. 6:3; Tit. 1:1; Phil. 1:27; Rev. 14:1)… 2. Where there is this agreement in fundamentals, there ought to be mutual and fraternal affections, notwithstanding differences in other things; no reproaches, no exasperations, no individuous consequences, no odious imputations, no uncharitable digladiations; but an owning of one another as brethren and discussing and ventilating of the points in difference with the spirit of love and meekness, saying to one another, as Abraham to Lot, ‘Let there be no strife between thee and me, for we are brethren.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works</cite>, … (London: Holdsworth, 1826), sermon 14, “Brotherly Reconciliation” (1657/1659), pp. 155-57</span></figcaption>

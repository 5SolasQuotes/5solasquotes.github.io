<main class="wrap"><figure class="quote" id="q-4300405dab" data-kw="">
<blockquote><p>There ever have been, and are, those in greater or less numbers, who hear the word anon with joy; who perhaps for the time soar above all others in the impassioned zeal and high-toned professions with which they appear to embrace religion; whose ardour not only faints, but expires, as soon as it ceases to be fanned by the breath of extraneous excitement which first gave it being; or, at all events, as soon as they are brought into a position in which religion involves any self-denial. As our Saviour elsewhere expresses it, when tribulation or persecution ariseth because of the word, by-and-by he is offended. This declension of multitudes, who did run well for a time, into list-less indifference, or utter apostacy, has occurred with greater or less frequency in all ages, thus wounding the hearts of the pious, and the cause of Christ in the house of his friends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon CCXCVIII. The Causes of Superficial and Transient Religious Experience in American National Preacher</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-327ff82937" data-kw="">
<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that… 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word going before or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh, 1659), pt. 2, ch. 2, p. 69</span></figcaption>

</figure><figure class="quote" id="q-a190a878ae" data-kw="">

</figure><figure class="quote" id="q-d0ceefed5c" data-kw="">
<blockquote><p>…there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, (1659), ch. 8, When Some Errors are to be Foreborne, p. 205-206:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

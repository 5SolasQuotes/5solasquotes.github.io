<main class="wrap"><figure class="quote" id="q-617c6a0947" data-kw="">
<blockquote><p>…nor they and their families [may] go so far [to church] without such inconvenience and trouble as will frustrate the end of their endeavors: As in France where the Protestants must go twenty miles or ten to a church, which the weak, children and aged cannot do, nor the rest of the family without such cost and pains, and loss of time as will deprive them of the benefit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p. 100</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-129532c924" data-kw="">
<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

%20necessities" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c487e9d890" data-kw="">
<blockquote><p>…if the work be necessarily required to the performance of the service of God, servile or not, it must be done. As circumcision on the eighth day, if it fell upon the Sabbath, it was to be done, Jn. 7:22. And the priests on the Sabbath killed the sacrifice and were blameless, Mt. 12:5. And in this respect the minister on the Sabbath is allowed to go to preach, as Christ did upon the Sabbath, Mt. 12, and the people are to go to hear. An example whereof we have in the Shunamite, that went ordinarily upon the Sabbath and new moon to the prophet: For when she demanded leave of her husband to go to the prophet, ‘Why wilt thou go’ (says he) ‘seeing it is neither Sabbath nor new moone’: intimating thereby that upon those times she went to hear him. And in this regard was the Sabbath day’s journey allowed, Acts 1:12. And therefore whosoever shall break the rest of the Sabbath in this respect is blameless. For the Sabbath was made for man, that he might keep it holy unto the Lord. Now, if it may so fall that the rest itself should any way be a let to the keeping of it holy, then the rest itself is to be broken: and they that so doe are blameless. For the end of the law in this respect is to be regarded and not the letter. For the Sabbath was made for man, that is, for the good of man; and not man for the Sabbath, that is for the rest. And this is the meaning of that place, Mk. 2:27, ‘The Sabbath was made for man, and not man for the Sabbath.’ … The conclusion then of this point is this: That no kind of ordinary or servile work may be done upon the Sabbath; neither in the house, nor in the city, nor in the fields, nor upon the seas, be they never so small, or never so meet, or never so glorious in show, except either God command it extraordinarily, or that the work tend directly to God’s worship: or be of necessity either for the preservation of life, or health, or goods; in which respects God has given us allowance upon the Sabbath to work, and not otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-widley.html">George Widley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (London, 1604), bk. 2, ch. 2, pp. 91-92, 97 Widley (b. 1566 or 1567) was an English minister in Portsmouth, England.</span></figcaption>

</figure><figure class="quote" id="q-62b6e1860c" data-kw="">
<blockquote><p>This Sabbath is then kept holy unto the Lord, when men, after a due preparing of their hearts, and ordering of their common affairs beforehand, do not only observe an holy rest all the day from their own works, words, and thoughts, about their worldly employments and recreations (Ex 20:8; 16:23, 25-26, 29-30; 31:15-17; Isa 58:13; Neh 13:15-22); but also are taken up the whole time in the public and private exercises of his worship, and in the duties of necessity and mercy. (Isa 58:13; Mat 12:1-13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1. Let Westminster Confession (WCF) 21.8 be granted, that:</span></figcaption>

</figure><figure class="quote" id="q-9a2de9f5f9" data-kw="">
<blockquote><p>The word ‘recreation’ is equivocal. Indeed there is a recreation which is mercy, (viz.) the necessary refreshment of the body, as eating, drinking, resting itself, especially to those who have wearied themselves with labor; yea, to some sickly bodies, some ordinary, moderate and inoffensive recreations may be allowed, as a learned man observes. But there is a recreation which we call sports and pastimes, when there is no necessity; and to allow this is no work of mercy; and if it be a mercy to the body, it is severity to the soul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian</cite>, … (London, 1668) Wells was an English puritan. | ch. 4, ‘That Needless Recreations are Unlawful on the Sabbath’</span></figcaption>

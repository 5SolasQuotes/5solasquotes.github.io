<main class="wrap"><figure class="quote" id="q-b21925d580" data-kw="">
<blockquote><p>Question: By what means do we receive or draw these virtues from Christ, or enjoy them in Him? Answer: This is only by faith of Him, that is, by faith receiving or going to Christ’s person, pitching on Him alone as revealed and offered in the Gospel. Doctrine: Faith in Christ’s person, name, is the only means of receiving all saving virtues from Christ, when we believe the Gospel and glad tidings offering us Christ’s person with all his benefits and virtues, and behold Him to be such a one towards us as the Gospel reveals and offers Him to us, that is, our wisdom, righteousness, sanctification, and redemption, our King, Priest, and Prophet, then is He indeed become such a one towards us, and we are made such in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/job-throckmorton.html">Job Throckmorton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Faith, as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (d. 1601; London: 1655), ch. 10, sect. 3, p. 396 Throckmorton (1545-1601) was an English puritan.</cite>, pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question: By what means do we receive or draw these virtues from Christ, or enjoy them in Him? Answer: This is only by faith of Him, that is, by faith receiving or going to Christ’s person, pitching on Him alone as revealed and offered in the Gospel. Doctrine: Faith in Christ’s person, name, is the only means of receiving all saving virtues from Christ, when we believe the Gospel and glad tidings offering us Christ’s person with all his benefits and virtues, and behold Him to be such a one towards us as the Gospel reveals and offers Him to us, that is, our wisdom, righteousness, sanctification, and redemption, our King, Priest, and Prophet, then is He indeed become such a one towards us, and we are made such in Him.”

— Job Throckmorton, Of Faith, as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (d. 1601; London: 1655), ch. 10, sect. 3, p. 396 Throckmorton (1545-1601) was an English puritan., pp. 30-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion%3A+By+what+means+do+we+receive+or+draw+these+virtues+from+Christ%2C+or+enjoy+them+in+Him%3F+Answer%3A+This+is+only+by+faith+of+Him%2C+that+is%2C+by+faith+receiving+or+going+to+Christ%E2%80%99s+person%2C+pitching+on+Him+alone+as+revealed+and+offered+in+the+Gospel.+Doctrine%3A+Faith+in+Christ%E2%80%99s+person%2C+name%2C+is+the+only+means+of+receiving+all+saving+virtues+from+Christ%2C+when+we+believe+the+Gospel+and+glad+tidings+offering+us+Christ%E2%80%99s+person+with+all+his+benefits+and+virtues%2C+and+behold+Him+to+be+such+a+one+towards+us+as+the+Gospel+reveals+and+offers+Him+to+us%2C+that+is%2C+our+wisdom%2C+righteousness%2C+sanctification%2C+and+redemption%2C+our+King%2C+Priest%2C+and+Prophet%2C+then+is+He+indeed+become+such+a+one+towards+us%2C+and+we+are+made+such+in+Him.%E2%80%9D%0A%0A%E2%80%94+Job+Throckmorton%2C+Of+Faith%2C+as+given+in+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28d.+1601%3B+London%3A+1655%29%2C+ch.+10%2C+sect.+3%2C+p.+396+Throckmorton+%281545-1601%29+was+an+English+puritan.%2C+pp.+30-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb21925d580.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b21925d580.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-being-born-again-as-subsequent-to-faith-in-receiving-christ-the-fullness-of-life-by-faith/#:~:text=Question%3A%20By%20what%20means%20do%20we,we%20are%20made%20such%20in%20Him&amp;text=Question%3A%20By%20what%20means%20do%20we%20receive%20or&amp;text=us%2C%20and%20we%20are%20made%20such%20in%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46291ff932" data-kw="">

<blockquote><p>1. In respect of its first moment regeneration comes about in another way than in respect of its progression. Regarding the first moment of regeneration man is purely passive; regarding its progression man cooperates with God. … 13. In this life regeneration is by degrees: these degrees do not only concern regeneration by itself but also the subjects. Some people are more regenerate than others; hence older people are more regenerated than the young ones.</p></blockquote>

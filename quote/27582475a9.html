<blockquote><p>Add to all these ends, this in the last place, That Christ by his nativity hath raised our human nature, the dignity of which was another end of it. Oh! how might I shew the love of Christ to transcend in this end of his nativity! Certainly believers Christ by uniting your nature to his own, did mightily dignify it. How doth the human nature shine in the luster of the divine?

How doth the pebble (man’s nature) glister in the golden (I should say the glorious) ring of the divine nature? O the transcendency of Christ love, that he would stoop so low, as to be born for this end, that thereby he might raise high the nature of his beloved ones, i.e. believers!

So that thus you see how the birth of Christ (thoroughly viewed) giveth a bright discovery of the transcendency of his love. Certainly, if you spiritually contemplate all that love which shines in the birth of the Lord Jesus, you will easily conclude, that his love to believers passeth knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-durant.html">John Durant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discovery of glorious love, or, The love of Christ to believers opened, in the truth, transcendency, and sweetness thereof together with the necessity that lies upon every believer, to strive after the spiritual and experimental knowledge of it: being the sum of VI sermons preached upon Ephesians </cite>, (London: W. Gilbertson, 1655), pp 99-100.</span></figcaption>

<blockquote><p>Of the knowledge of Christ, there be two parts, the first concerning his person, the second concerning his office. The person of Christ, is one, because Christ is one. Of the knowledge of Christ’s person, there be two parts: the first concerning the natures in the person of Christ, the other concerning his state.

There are two natures in the person of Christ, the divine, and the human nature. Therefore Jesus Christ is true God, and true man in one person. Rom. 1.3.4. and 9.5. 1. John. 4.2. 1. Timot. 3.16. Coloss. 2.9. Heb. 2.14.16. John. 1.1.

Thus far concerning the natures in the person of Christ: now concerning his state.

The state of Christ’s person is two fold: his humiliation, or exaltation. Phil. 2.7.8.9. Luke. 24.26. The humiliation of Christ is that state of his, in which he did abase himself below all creatures. Phil. 2.7.

Of his humiliation there are two parts? his incarnation, and obedience. The incarnation of Christ, is part of the humiliation of the son of God, when taking the human nature, he was manifested in the flesh. John. 1.14. 1. Tim. 3.16. The parts of the incarnation of Christ, are both his conception by the holy spirit, and the personal union of his two natures, and also his birth. The conception of Christ by the holy spirit, is the forming of the human nature of Christ, of the flesh and blood of the virgin Mary, by the miraculous working of the holy spirit. Mat. 1.18.20. Luke. 1.31.35.

The personal union of the two natures in Christ, is such a coupling of them as they might be one person. 1. Tim. 3.16. Coloss. 2.9. Gal. 4.4. Heb. 2.16. In this personal union, both the distinction of the two natures is to be considered, and also the effects of the union. In the personal union, the natures remain distinct, and not confused, whether we respect their essence, or the properties, or operations. Rom. 1.3.4. and 9.5. 1. Tim. 9.16. Heb. 9.14. 1. Pet. 3.18. and 4.1.

As therefore in that one person of Christ there be two natures: so there is a double mind, or understanding a double will, working, wisdom, strength, power, virtue, and so forth. The one heavenly and not created: the other human, and created. Luke. 2.52. Mar. 11.13. and 13.32. 1. John. 2.1.17. John. 2.25. and 6.64. and 5.20. Heb. 1.9. John. 1.33. and 4.6. Heb. 1.3. John. 2.19. and 10.18.

And each of the natures retaineth and keepeth his own essential properties, neither doth it communicate them, to the other nature, and that for two causes: the first is, least the natures should be mingled and confounded: the other, that there might forever remain a difference between the natures. Luke. 24.39. For he that confoundeth the properties, confoundeth the natures: and he that taketh away the properties, taketh away the natures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 64-66.</span></figcaption>

</figure><figure class="quote" id="q-2838d2990a" data-kw="two wills dyothelite">
<blockquote><p>The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6, 7, 11); (2) two wills are ascribed to him (“not my will, but thine, be done,” Lk. 22:42). Nor does it follow that there are two willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.7.14</span></figcaption>

<blockquote><p>4. The gospel holds forth the greatest example of self-denial that ever was in the world, and by all ways that ever God has made known his mind, He never has revealed his will in an example of self-denial so as He has done in the Gospel, and that is in the example of the Lord Jesus Christ: God evidences there such a work of self-denial as never was: and ’tis impossible to apprehend a greater example of self-denial than that is: though Christ thought it no robbery to be equal with God; read but the second of the Philippians, vv. 7-8, and there you may see what Christ was, and yet how He emptied Himself, how He denied Himself in his honor, how vile He was made in the world, though He was the brightness of his father’s glory, yet He was made of no reputation; how He denied Himself in riches. Christ that was the heir of all things, though He were rich, yet He was made poor for us; how He denied Himself in his pleasures, He was the delight of the Father from all eternity, and yet he was made a man of sorrows; He denied Himself in his life, for He was the Lord of life, and yet He subjected Himself to death, to a cursed death for us: Oh the example of Christ in self-denial is the greatest that ever was: and this seems to be one great end of the humiliation of Jesus Christ to hold forth a preaching pattern of self-denial to the world: And there’s a great deal more power in the pattern and example of self-denial, then in the commands of self-denial. I only present this to show you that it is the most unbeseeming the gospel for anyone that professes the gospel to be selfish, altogether scraping for themselves; and whatsoever service they are put upon, except self may have an oar in it, they have no mind to it; Oh ’tis becoming the gospel of Jesus Christ for men and women to be emptied of themselves, no matter what becomes of ourselves, but be willing to give up ourselves for public good, to venture your estates and lives, and all your comforts, yea to be swallowed up in the glory of God, to be nothing, that Christ may be all. In the gospel of Christ, we find that Christ, He was swallowed up with the glory of his Father; and He came not to do his own will, but the will of his father that sent Him; and though He was one that had infinitely more excellency than all men and angels in heaven and earth, yet He was content for the honor of his Father to be made as a worm and no man, to be trampled under foot, to endure the greatest extremities of all sorts; this holds out an example to us, that while we live in this world we should be taken off from ourselves: Oh this self-love sticks much in the hearts of men and women: now upon the example of Christ’s self-denial, we are required to deny ourselves, and it is the proper lesson of the Gospel, ‘He that will follow me, let him deny himself,’ you never read of such a precept in all the Old Testament;(though no question the people of God did deny themselves then), but in expresse terms so fully you have not such a thing there: and there’s no such rules among the heathens for a man to deny himself. ‘Let him deny himself;’ those that know the original, know that the word is, not only to deny, but there is that joined to it that does increase the signification, let them deny themselves, thoroughly, there is a preposition put to the word, to show that those that will come to Christ must deny themselves, and that thoroughly, it is a proper lesson of the gospel, and the first lesson. Oh when our Lord and Master has thus denied Himself, and emptied Himself for good to us, what is beseeming this gospel, but that all that are professors of it should deny themselves? It is very unbeseeming the glorious gospel, for a Christian to be selfish, to have his self-ends, and self-ways, and interests in everything, as generally almost all men in the world they are acted by self, some self-ends, or self-excellency carries them on in their actions, or else they have no heart to do anything; this is unbecoming the gospel. But now I say, one that would live as becomes the Gospel, must be wholly emptied of himself, whatsoever parts, estate, credit, or honor he has in the world, must be melted into the glory of God; Jesus Christ for the glory of His Father, was content infinitly to deny Himself more than we can; For what have we to deny ourselves of? Do you or I live as becomes the gospel? when (I say) all that we apprehend to have any excellency in, we have it all swallowed up in the glory of God, when we can dedicate and consecrate our lives, honors, liberties, estates, comforts, and all to the glory of God, and be as nothing to ourselves, and let God be all in all to us. Ministers may bring many reasons why we should deny ourselves, but all these reasons comes to nothing, till the soul comes to behold the clear light of the gospel, and there beholds the Son of God by faith, how He did empty Himself; nay then, says a believing soul, if the Son of God did deny Himself, was emptied thus for me, Oh then let me be wholly taken off from myself, and venture wholly upon God, I must not live in myself, nor live for myself, nor live to myself; but wholly live in God, and for God, and to God, and upon God: Oh this is that which becomes the gospel of Jesus Christ.</p></blockquote>

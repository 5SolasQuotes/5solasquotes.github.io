<main class="wrap"><figure class="quote" id="q-6a7a05c505" data-kw="">
<blockquote><p>The most probable explanation [of 1 Cor. 15:29] is, that the apostle here refers to the Levitical rule of Numbers 19:14-19. Were there no resurrection, a corpse would be like any other clod; and there would be no reason for treating it as a symbol of moral defilement, or for bestowing on it so religiously the rites of sepulture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 760</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— R. L. Dabney, Systematic Theology, p. 760">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+most+probable+explanation+%5Bof+1+Cor.+15%3A29%5D+is%2C+that+the+apostle+here+refers+to+the+Levitical+rule+of+Numbers+19%3A14-19.+Were+there+no+resurrection%2C+a+corpse+would+be+like+any+other+clod%3B+and+there+would+be+no+reason+for+treating+it+as+a+symbol+of+moral+defilement%2C+or+for+bestowing+on+it+so+religiously+the+rites+of+sepulture.%E2%80%9D%0A%0A%E2%80%94+R.+L.+Dabney%2C+Systematic+Theology%2C+p.+760&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a7a05c505.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a7a05c505.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/baptism-for-the-dead/#:~:text=The%20most%20probable%20explanation%20%5Bof%201,so%20religiously%20the%20rites%20of%20sepulture&amp;text=The%20most%20probable%20explanation%20%5Bof%201%20Cor.%2015%3A29&amp;text=on%20it%20so%20religiously%20the%20rites%20of%20sepulture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister</cite></span></figcaption>

</figure><figure class="quote" id="q-96da43f7dc" data-kw="">
<blockquote><p>11. ‘Then Zipporah tooke a sharpe knife and cut away the foreskin of her son.’ The two things that here might be considered (namely, that doctrine of Popery concerning the danger of children dying unbaptized, and secondly of such an absolute necessity of baptism, as that women must administer it in time of supposed need) I forbear to stand upon now: I have sufficiently touched them in my Notes upon Genesis. Therefore do but remember with yourself (touching the first) that we make a great difference betwixt want [lack] of the sacrament and contempt of the same; contempt, damning; and want, not, through the strength of God’s promise; meaning, by want, when God so prevents by death, that it cannot be had, according to the manner allowed in the Word. And, touching the second, observe, that this act of Zipporah, here, in circumcizing her child, was merely extraordinary, and does no way warrant women to baptize now-a-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable Notes upon the Books of Exodus &amp; Leviticus</cite>, … (London, 1604), on Exodus, ch. 4, p. 60</span></figcaption>

<blockquote><p>‘Cut off’; By capital punishment by the magistrate, if the fact be notorious; by excommunication if the delinquent be out of the reach of him; or by the judgement of God, if the fact be secret, Ex. 31:14; Lev. 17:4; 18:29. Now this is not to be understood of children, but of those who by their age were capable of voluntary rebellion, refusing, or contemning the use of this sacrament.</p></blockquote>

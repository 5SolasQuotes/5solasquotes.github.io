<main class="wrap"><figure class="quote" id="q-7bcd709954" data-kw="">
<blockquote><p>The end of [external] calling can be considered in two ways: either on the part of God or on the part of the thing (which is called the end of the worker [finis operantis] and the end of the work [finis operis]). Although each is conjoined in the elect, yet in others they are separated… in the gospel call, the end of the thing is the salvation of man because by its nature it tends to the bringing of him to salvation by faith and repentance; but not at once with respect to all the called is it the end of God, but only of those to whom he decreed to give faith and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, p. 504</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>3. Christ gives gifts to men now in the due use of means and not by miracle: Therefore He gives them in great diversity and by hard study and long time, Heb. 5:12, “For the time they ought to have been teachers,” etc. Therefore a novice must not be a bishop, but an elder [older person], whence the office had its name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 68</span></figcaption>

</figure><figure class="quote" id="q-a54315bb33" data-kw="">
<blockquote><p>…gifts give not the keys, nor authority to use gifts; and so that all believers, though gifted and graced also, have not power of the keys. 2. It’s certain that in a constituted Church there be no hands nor mouths to do and speak by authority, and ex officio, by virtue of an office, save only elders and pastors; and that if they do or speak, they do it extraordinarily, when Churches’ hands are lame and her eyes blind; or if they do and speak ordinarily, it is from the law of charity in a private way, not by power of the keys, and as judges and officers.</p></blockquote>

</figure><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146</cite>, (to Evangelus), §1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-32dae4c0c5" data-kw="">
<blockquote><p>The words Father, Son, and Holy Spirit, certainly indicate a real distinction, not allowing us to suppose that they are merely epithets by which God is variously designated from his works. Still they indicate distinction only, not division. The passages we have already quoted show that the Son has a distinct subsistence from the Father, because the Word could not have been with God unless he were distinct from the Father; nor but for this could he have had his glory with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/distinct-persons.html">Distinct persons</a></span></div>

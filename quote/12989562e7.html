<main class="wrap"><figure class="quote" id="q-12989562e7" data-kw="">
<blockquote><p>Nor did the Sabbath originate with Moses, or with any sinner. It was an ordinance in Eden. When, for his sins, man was driven out of paradise, God permitted him to carry with him two institutions, established for his good before his fall. Which of these institutions is the greatest mercy to our world, or which is the dearest to the heart of a good man, I will not undertake to say. One of them is marriage, the other the Sabbath-day. If he is the enemy of virtue who would abolish the former, he cannot be the friend of God or man who would set aside the latter.

By restoring marriage, as far as possible, to its original purity in Eden, that is, by confining it to the pairs and rendering it indissoluble, the Christian religion has incalculably advanced civilization, peace, and all the domestic virtues. By restoring the Sabbath, as near as possible, to its purity in Eden, that is, by the holy observance of all of it, man makes his nearest approach to primitive innocence and to future glory. There is no example of any community, large or small, ancient or modern, continuing virtuous or happy for a considerable time, if they slighted either marriage or the Sabbath-day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-abbe9fdc5b" data-kw="">
<blockquote><p>First, in that they [the Anglican ministers of Old England, arguing for set, stinted forms of prayer, as in the English Prayer Book] do confound, and make all one ordinance, Blessings, Psalms, and Prayers. … And first, it is evident, that, howsoever some kind of blessing, and prayer be all one, and so may be confounded, yet that solemn kind of blessing spoken of Num. 6, and which the patriarchs, and priests did use in their places, was clean of an other nature: In prayer the minister stands in place of the people and in their name offers up petitions and thanksgiving to God: But in blessing, the minister stands in the place of God, and in his name pronounceth a blessing, or mercy, upon the people.

2. Whereas this duty of prayer may be performed by one equal to another, by an inferior to a superior, yea by a man to himself: that other of blessing is always from the greater to the lesser: and therefore the apostle to the Hebrews, to show that the Preisthood of Melchisedek was more excellent than that of Levi, proves it by this, that Melchisedec blessed Abraham; taking this for granted without all contradiction, that the less is blessed of the greater.

3. Mr. Bernard himself in this book makes prayer one thing, and the blessing pronounced upon the people when they departed another thing: as he also makes singing of psalms a third distinct thing from them both: as there is cause he should.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism</cite>, (Amsterdam, 1610), pp. 466-67</span></figcaption>

<blockquote><p>The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … ed. Edward Hickman (London: Ball, 1840) | Types of the Messiah, p. 653, vol. 2</span></figcaption>

</figure><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>

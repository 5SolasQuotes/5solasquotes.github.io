<main class="wrap"><figure class="quote" id="q-6851cdc0bb" data-kw="">
<blockquote><p>But to celebrate solemnly the day of a man’s birth, it has been a custom of all nations: and in my judgment, it is not done amiss, so that there be used a godly modesty. Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it, and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>

<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 12-13</span></figcaption>

<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>

</figure><figure class="quote" id="q-7241c527d9" data-kw="">
<blockquote><p>Magistrates certainly have a power to appoint public days, yea, annual days of thanksgivings, for mercies never to be forgotten. Indeed they cannot make a day holy, so as it shall be a sin against God to labor in it, or to use any pleasures (as in the case of the sabbath); but they may command the public worship of God to be performed on particular days, and men ought to attend it when with convenience they can; only they ought to take care that such days be not spent in luxury and profaneness, and that they be for signal providences, and not so multiplied, and frequently renewing, as that the service of them degenerate into mere matter of form. Whether Christ went up in order to the feast [of dedication], or because of the great concourse of people he knew would be there at that time, cannot be determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on John 10</cite>, v. 22</span></figcaption>

<blockquote><p>But the hardest part of the question is whether it be lawful to keep days as holy in celebrating the memorial of Christ’s nativity, circumcision, fasting, transfiguration, ascension and such like? And the great reasons of the doubt are: 1. Because the occasions of these holy days were existent in the apostles’ days: and therefore if God would have had such days observed, he could as easily and fitly have done it by his apostles in the Scripture, as he did other the like things. 2. And this is a business that if it were necessary, [it] would be equally necessary to all ages and parts of the catholic Church. And therefore it cannot be necessary, but it must be the matter of a universal law. And God has made no such law in Scripture: and so Scripture sufficiency, as the catholic rule of Faith and universal divine obedience, is utterly overthrown: which if we grant, and turn Papists today, we shall have as strong temptations to make us turn infidels tomorrow, so poor is their evidence for the supplemental traditional Law of God. 3. And God Himself has already appointed a day for the same purposes as these are pretended for. For the Lord’s Day is to commemorate the Resurrection, as the great triumphant act of the Redeemer, implying all the rest of his works: so that though it be principally for the Resurrection above any single work of Christ, yet also for all the work of redemption: And the whole is on that day to be commemorated with holy joy and praise. Now when God Himself has set apart one day in every week to commemorate the whole work of redemption, it seems an accusing of his institutions of insufficiency, to come after Him to mend them, and say we must have an anniversary day for this or that part of the work. 4. The Fourth Commandment being one of the Decalogue, seems to be of so high a nature, that man is not to presume to make the like. Else why may we not turn the Ten Commandments into twenty or a hundred? But it seems a doing the same or of like nature to what God has done in the Fourth Commandment, if any will make a necessary stated holy day to the universal Church. 5. And it seems also that these holy days (excepting Easter and Whitsuntide and other Lord’s days) are but of later introduction. Many passages of antiquity seem to intimate that Christmas day itself was not of many hundred years after Christ. I remember not any before Gregory Nazianzene that seem to speak of it. The allegations out of spurious authors, and that of later date, such as the counterfeit Clement, Dionysius, Cyprian, etc. are brought to deceive and not to convince. 6. Yea more, the time was a matter of controversy among the Churches of the East and West, for many hundred years after Christ, Epiphanius and the Churches of Judaea and all those Eastern parts took the sixth of January to be the day (see Casaubon’s Exercitation on this and Cloppenburg more fully in this). Chrysostom says it was but ten years before he wrote that homily that the Church at Constantinople was persuaded by them at Rome to change their account of the day: And is it possible that, when for about four hundred years or more the Churches were utterly disagreed of the day, that it was then commonly kept as a holy day? The keeping of it would sure have kept a common knowledge of the day: Or at least the difference of observation would have raised contention, as the difference about Easter did: can any believe that the famous Council of Nicea and the vigilant emperor that were so exceeding impatient of a diversity of observations of Easter would have let a diverse observation of Christmas alone without once thinking or speaking of it when they were gathered about the like work if the Church had commonly observed it then as a holy day? Or was the Church of Judaea where Christ arose in any likelihood to have lost the true account of the day if it had been observed by apostolical tradition from the beginning? 7. And it seems that God did purposely deny us the observation of this day in that He has certainly kept the time unknown to the world. The confidence of some bewrays but their ignorance. Chronologers are never like to be agreed of the year, much less of the month or day; some think we are four years too late, some two years, etc. Many think that Christ was born about October (as Scaliger, Broughton, Beroaldus, etc.) and many still hold to the old Eastern opinion for the epiphany being the nativity, on Jan. 6, and others are for other times; but none are certain of the time. 8. Sure we are, where there is no Law, there is no transgression: but here is no Law of God commanding Christmas day or the other holy days; therefore there is no transgression in not keeping them. And then: 9. It is not so sure that there is no transgression in keeping them: therefore the surer side is to be taken. 10. And it seems strange that we find not so much as any ancient general Council making any mention of Christmas or such days (though of the martyrs’ days some do). All these reasons (which I run over hastily) and many more (which for brevity I pretermit) do seem to make it a very hard question whether the keeping of this sort of holy days be lawful. §47. And it is not to be much stuck at, that a day to Christ does seem more necessary and pious than a day in commemoration of a martyr, or a particular mercy: For in the highest parts of God’s worship, God has left man least to do as to legislation and decisions: and usurpations here are far most dangerous. A weekly day is somewhat more than an anniversary: And yet I think there is few of the contrary minded but would doubt whether man might impose on the Church the observation of another weekly holy day in commemoration of Christ’s nativity. The worship of God is a more excellent and necessary thing than the veneration due to a worthy person; and yet we have not so much liberty to make new ways of worshiping God as of veneration to men. So is it here, though even the days that are for the memorial of the saints are ultimately for the honor of God; yet those that are set apart directly and immediately to commemorate the work of redemption, are relatively much higher, and therefore seem to be more exempted from the determination of human laws. §. 48. By this and much more I am fully satisfied: 1. That the keeping of these days is a thing of itself unnecessary: 2. And that there being none on earth that can justly pretend to a power of universal government over the whole catholic Church, it is certain that none on earth can bind the catholic Church to such observances… 3. And even in a single church, or a province, or nation, I am satisfied that it is a great sin for magistrates or pastors to force all that scruple it to the observation of these days, and to lay the unity or peace of their churches on it, and to cast out, censure, reproach, or punish them that dare not obey such impositions for fear of sinning against God. And it is a most disingenuous thing to insinuate and put into the minds of men accusations of the impiety of the dissenters; and to persuade the world that it is irreligiousness, or humorous singularity, when it is so known a thing to all that know them that the persons that scruple or disown these days do ordinarily walk in uprightness and the fear of God in other matters, and profess that it is only a fear of breaking the laws of God that keeps them from conformity to the will of others: and that they are reproached by the multitude of the observers of these days for their spending the Lord’s Day in holy exercises, which the reproachers spend too much in idleness, sensuality or profaness; and it is not long since many of them were cast out of the ministerial service or suspended, for not reading a book authorizing dancing and other recreations on the Lord’s day. In a word, to reproach them as Precisians and puritans for the strictness of their lives, and yet at the same time to persuade men that they are ungodly for not keeping holy days, or not kneeling at the sacrament, is not ingenuous dealing, and draws too near the manners of the pagans, who called the Christians ungodly because they durst not offer their sacrifices, and when they dragged them to the judgment-seats, they cried Tollite impios [‘Take away the impious’], as if themselves were the godly men: I compare not the matter of the causes here, but only the temper of the persons and manner and justice of proceedings. §49. And yet for all this I am resolved, if I live where such holy days as these are observed, to censure no man for observing them, nor would I deny them liberty to follow their judgments, if I had the power of their liberties; provided they use not reproach and violence to others, and seek not to deprive them of their liberties. Paul has so long ago decided these cases, Rom. 14 &amp; 15, that if men would be ruled by the Word of God, the controversy were, as to the troublesome part of it, at an end. They that through weakness observe a day to the Lord that is not commanded them of God, should not judge their brethren that observe it not: and they that observe it not, should not despise or set at naught their weaker (though censorious) brethren that observe it; but everyone should be fully persuaded in his own mind. The Holy Ghost has decided the case that we should here bear with one another. §50. Yea more, I would not only give men their liberty in this, but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>

— Richard Baxter, Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 2, pp. 413-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+hardest+part+of+the+question+is+whether+it+be+lawful+to+keep+days+as+holy+in+celebrating+the+memorial+of+Christ%E2%80%99s+nativity%2C+circumcision%2C+fasting%2C+transfiguration%2C+ascension+and+such+like%3F+And+the+great+reasons+of+the+doubt+are%3A+1.+Because+the+occasions+of+these+holy+days+were+existent+in+the+apostles%E2%80%99+days%3A+and+therefore+if+God+would+have+had+such+days+observed%2C+he+could+as+easily+and+fitly+have+done+it+by+his+apostles+in+the+Scripture%2C+as+he+did+other+the+like+things.+2.+And+this+is+a+business+that+if+it+were+necessary%2C+%5Bit%5D+would+be+equally+necessary+to+all+ages+and+parts+of+the+catholic+Church.+And+therefore+it+cannot+be+necessary%2C+but+it+must+be+the+matter+of+a+universal+law.+And+God+has+made+no+such+law+in+Scripture%3A+and+so+Scripture+sufficiency%2C+as+the+catholic+rule+of+Faith+and+universal+divine+obedience%2C+is+utterly+overthrown%3A+which+if+we+grant%2C+and+turn+Papists+today%2C+we+shall+have+as+strong+temptations+to+make+us+turn+infidels+tomorrow%2C+so+poor+is+their+evidence+for+the+supplemental+traditional+Law+of+God.+3.+And+God+Himself+has+already+appointed+a+day+for+the+same+purposes+as+these+are+pretended+for.+For+the+Lord%E2%80%99s+Day+is+to+commemorate+the+Resurrection%2C+as+the+great+triumphant+act+of+the+Redeemer%2C+implying+all+the+rest+of+his+works%3A+so+that+though+it+be+principally+for+the+Resurrection+above+any+single+work+of+Christ%2C+yet+also+for+all+the+work+of+redemption%3A+And+the+whole+is+on+that+day+to+be+commemorated+with+holy+joy+and+praise.+Now+when+God+Himself+has+set+apart+one+day+in+every+week+to+commemorate+the+whole+work+of+redemption%2C+it+seems+an+accusing+of+his+institutions+of+insufficiency%2C+to+come+after+Him+to+mend+them%2C+and+say+we+must+have+an+anniversary+day+for+th hen+they+were+gathered+about+the+like+work+if+the+Church+had+commonly+observed+it+then+as+a+holy+day%3F+Or+was+the+Church+of+Judaea+where+Christ+arose+in+any+likelihood+to+have+lost+the+true+account+of+the+day+if+it+had+been+observed+by+apostolical+tradition+from+the+beginning%3F+7.+And+it+seems+that+God+did+purposely+deny+us+the+observation+of+this+day+in+that+He+has+certainly+kept+the+time+unknown+to+the+world.+The+confidence+of+some+bewrays+but+their+ignorance.+Chronologers+are+never+like+to+be+agreed+of+the+year%2C+much+less+of+the+month+or+day%3B+some+think+we+are+four+years+too+late%2C+some+two+years%2C+etc.+Many+think+that+Christ+was+born+about+October+%28as+Scaliger%2C+Broughton%2C+Beroaldus%2C+etc.%29+and+many+still+hold+to+the+old+Eastern+opinion+for+the+epiphany+being+the+nativity%2C+on+Jan.+6%2C+and+others+are+for+other+times%3B+but+none+are+certain+of+the+time.+8.+Sure+we+are%2C+where+there+is+no+Law%2C+there+is+no+transgression%3A+but+here+is+no+Law+of+God+commanding+Christmas+day+or+the+other+holy+days%3B+therefore+there+is+no+transgression+in+not+keeping+them.+And+then%3A+9.+It+is+not+so+sure+that+there+is+no+transgression+in+keeping+them%3A+therefore+the+surer+side+is+to+be+taken.+10.+And+it+seems+strange+that+we+find+not+so+much+as+any+ancient+general+Council+making+any+mention+of+Christmas+or+such+days+%28though+of+the+martyrs%E2%80%99+days+some+do%29.+All+these+reasons+%28which+I+run+over+hastily%29+and+many+more+%28which+for+brevity+I+pretermit%29+do+seem+to+make+it+a+very+hard+question+whether+the+keeping+of+this+sort+of+holy+days+be+lawful.+%C2%A747.+And+it+is+not+to+be+much+stuck+at%2C+that+a+day+to+Christ+does+seem+more+necessary+and+pious+than+a+day+in+commemoration+of+a+martyr%2C+or+a+particular+mercy%3A+For+in+the+highest+parts+of+God%E2%80%99s+worship%2C+God+has+left+man+least+to+do+as+to+legislation+and+decisions%3A+and+usurpations+here+are+far+most+dangerous.+A+weekly+day+is+somewhat+more+than+an+anniversary%3A+And+yet+I+think+there+is+few+of+the+contrary+minded+but+would+doubt+whether+man+might+impose+on+the+Church+the+observation+of+another+weekly+holy+day+in+commemoration+of+Christ%E2%80%99s+nativity.+The+worship+of+God+is+a+more+excellent+and+necessary+thing+than+the+veneration+due+to+a+worthy+person%3B+and+yet+we+have+not+so+much+liberty+to+make+new+ways+of+worshiping+God+as+of+veneration+to+men.+So+is+it+here%2C+though+even+the+days+that+are+for+the+memorial+of+the+saints+are+ultimately+for+the+honor+of+God%3B+yet+those+that+are+set+apart+directly+and+immediately+to+commemorate+the+work+of+redemption%2C+are+relatively+much+higher%2C+and+therefore+seem+to+be+more+exempted+from+the+determination+of+human+laws.+%C2%A7.+48.+By+this+and+much+more+I+am+fully+satisfied%3A+1.+That+the+keeping+of+these+days+is+a+thing+of+itself+unnecessary%3A+2.+And+that+there+being+none+on+earth+that+can+justly+pretend+to+a+power+of+universal+government+over+the+whole+catholic+Church%2C+it+is+certain+that+none+on+earth+can+bind+the+catholic+Church+to+such+observances%E2%80%A6+3.+And+even+in+a+single+church%2C+or+a+province%2C+or+nation%2C+I+am+satisfied+that+it+is+a+great+sin+for+magistrates+or+pastors+to+force+all+that+scruple+it+to+the+observation+of+these+days%2C+and+to+lay+the+unity+or+peace+of+their+churches+on+it%2C+and+to+cast+out%2C+censure%2C+reproach%2C+or+punish+them+that+dare+not+obey+such+impositions+for+fear+of+sinning+against+God.+And+it+is+a+most+disingenuous+thing+to+insinuate+and+put+into+the+minds+of+men+accusations+of+the+impiety+of+the+dissenters%3B+and+to+persuade+the+world+that+it+is+irreligiousness%2C+or+humorous+singularity%2C+when+it+is+so+known+a+thing+to+all+that+know+them+that+the+persons+that+scruple+or+disown+these+days+do+ordinarily+walk+in+uprightness+and+the+fear+of+God+in+other+matters%2C+and+profess+that+it+is+only+a+fear+of+breaking+the+laws+of+God+that+keeps+them+from+conformity+to+the+will+of+others%3A+and+that+they+are+reproached+by+the+multitude+of+the+observers+of+these+days+for+their+spending+the+Lord%E2%80%99s+Day+in+holy+exercises%2C+which+the+reproachers+spend+too+much+in+idleness%2C+sensuality+or+profaness%3B+and+it+is+not+long+since+many+of+them+were+cast+out+of+the+ministerial+service+or+suspended%2C+for+not+reading+a+book+authorizing+dancing+and+other+recreations+on+the+Lord%E2%80%99s+day.+In+a+word%2C+to+reproach+them+as+Precisians+and+puritans+for+the+strictness+of+their+lives%2C+and+yet+at+the+same+time+to+persuade+men+that+they+are+ungodly+for+not+keeping+holy+days%2C+or+not+kneeling+at+the+sacrament%2C+is+not+ingenuous+dealing%2C+and+draws+too+near+the+manners+of+the+pagans%2C+who+called+the+Christians+ungodly+because+they+durst+not+offer+their+sacrifices%2C+and+when+they+dragged+them+to+the+judgment-seats%2C+they+cried+Tollite+impios+%5B%E2%80%98Take+away+the+impious%E2%80%99%5D%2C+as+if+themselves+were+the+godly+men%3A+I+compare+not+the+matter+of+the+causes+here%2C+but+only+the+temper+of+the+persons+and+manner+and+justice+of+proceedings.+%C2%A749.+And+yet+for+all+this+I+am+resolved%2C+if+I+live+where+such+holy+days+as+these+are+observed%2C+to+censure+no+man+for+observing+them%2C+nor+would+I+deny+them+liberty+to+follow+their+judgments%2C+if+I+had+the+power+of+their+liberties%3B+provided+they+use+not+reproach+and+violence+to+others%2C+and+seek+not+to+deprive+them+of+their+liberties.+Paul+has+so+long+ago+decided+these+cases%2C+Rom.+14+%26+15%2C+that+if+men+would+be+ruled+by+the+Word+of+God%2C+the+controversy+were%2C+as+to+the+troublesome+part+of+it%2C+at+an+end.+They+that+through+weakness+observe+a+day+to+the+Lord+that+is+not+commanded+them+of+God%2C+should+not+judge+their+brethren+that+observe+it+not%3A+and+they+that+observe+it+not%2C+should+not+despise+or+set+at+naught+their+weaker+%28though+censorious%29+brethren+that+observe+it%3B+but+everyone+should+be+fully+persuaded+in+his+own+mind.+The+Holy+Ghost+has+decided+the+case+that+we+should+here+bear+with+one+another.+%C2%A750.+Yea+more%2C+I+would+not+only+give+men+their+liberty+in+this%2C+but+if+I+lived+under+a+government+that+peremptorily+commanded+it%2C+I+would+observe+the+outward+rest+of+such+a+holy+day%2C+and+I+would+preach+on+it%2C+and+join+with+the+assemblies+in+God%E2%80%99s+worship+on+it.+Yea+I+would+thus+observe+the+day%2C+rather+than+offend+a+weak+brother%2C+or+hinder+any+man%E2%80%99s+salvation%2C+much+more+rather+than+I+would+make+any+division+in+the+Church.+I+think+in+as+great+matters+as+this+did+Paul+condescend+when+he+circumcised+Timothy+and+resolved+to+eat+no+flesh+while+he+lived+rather+than+offend+his+brother%2C+and+to+become+all+things+to+all+men+for+their+good.+Where+a+thing+is+evil+but+by+accident%2C+the+greatest+accidents+must+weigh+down+the+less.+I+may+lawfully+obey+and+use+the+day%2C+when+another+does+unlawfully+command+it%3A+And+I+think+this+is+the+true+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship+%28London%3A+R.W.%2C+1659%29%2C+5th+Disputation%2C+ch.+2%2C+pp.+413-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6dda9f0ee1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6dda9f0ee1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christian-living/religious-holidays/#:~:text=But%20the%20hardest%20part%20of%20the,think%20this%20is%20the%20true%20case&amp;text=But%20the%20hardest%20part%20of%20the%20question%20is&amp;text=And%20I%20think%20this%20is%20the%20true%20case" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-c48360d4b4" data-kw="">
<blockquote><p>and that the Engagement whereinto we are entered [to the English republican government, 1648], to be ‘true and faithful to this commonwealth, as it now is (viz.) established without a king and House of Lords,’ has nothing at all inconsistent with the former engagements [such as the SL&amp;C, 1643], or does give us the least cause to carry about with us a conscience (as to these things) trembling and doubtful, because we find ourselves free from all guilt of the least intention of violating any former promises, in things which are possible and lawful to be done by us in our places, which were unalterable conditions of all human promises, at all times presupposed and implied therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Re-Proposals to Humble Proposals</cite>, … concerning the Engagement which the Parliament hath ordered to be taken (London, 1650), p. 14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-171f7303bd" data-kw="">
<blockquote><p>The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>
<div class="actions"><button class="copy" data-copy="“The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19).”

— Travis Fentiman, “Editor’s Extended Introduction”, “The 3rd Indulgence &amp; Wamphray’s Arguments” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+king+of+Babylon+sinfully+exacted+from+king+Zedekiah+of+Israel+an+oath+to+serve+him.+Zedekiah+broke+this+oath+and+would+not+serve+him+in+that+broken+and+declining+Church-state.+God+condemned+Zedekiah+for+it%2C+seeing+as+he+should+have+kept+the+sinfully+exacted+service+%28Eze.+17%3A11%E2%80%9319%29.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D%2C+%E2%80%9CThe+3rd+Indulgence+%26+Wamphray%E2%80%99s+Arguments%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F171f7303bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/171f7303bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=The%20king%20of%20Babylon%20sinfully%20exacted,the%20sinfully%20exacted%20service%20%28Eze.%2017%3A11%E2%80%9319&amp;text=The%20king%20of%20Babylon%20sinfully%20exacted%20from%20king&amp;text=have%20kept%20the%20sinfully%20exacted%20service%20%28Eze.%2017%3A11%E2%80%9319" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-59fd7dbf92" data-kw="">
<blockquote><p>It is farther observed in this Answer [of the Larger Catechism], that men take the name of God in vain by sinful lots. This subject, however, needs explanation. Let it be considered, then, that when lots were an ordinance, by which God in an extraordinary manner determined things which were before unknown, they being an instituted means of appealing to Him for that end, as in the case of Achan and others, were not to be used in a common way; for to have used them so would have been a profaning of a sacred institution. But as this extraordinary ordinance has now ceased, it does not seem unlawful, so as to be an instance of profaneness to make use of lots in civil matters, provided we do not consider them as an ordinance which God has appointed, in which we think we have ground to expect his immediate interposition and to depend upon it as if it were a divine oracle. In this view it would be unlawful, at present, to use lots in any respect whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (d. 1734; NY: Robert Carter, 1855), vol. 2, p. 340 Ridgley (c. 1667–1734) was an English dissetning minister and here wrote the first commentary on Westminster’s Larger Catechism.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-5481a13ede" data-kw="fifth commandment parents">
<blockquote><p>Among others in relation to the fifth precept, this question concerning the honoring of parents is agitated between us and the papists. In many ways, the latter weaken this precept, maintaining that children, against the consent of their parents, may not only contract marriage, but even adopt a monastic life. May children withdraw themselves from the power of their parents and marry without their consent? We deny against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.15.1</span></figcaption>

</figure><figure class="quote" id="q-8218f4a904" data-kw="">
<blockquote><p>And if the judgment of Voetius, Amesius and other learned men against all lusory [gaming] lots be of no authority, at least it should move you that even Mr. Gataker, and other that write for the lawfulness of them in that respect (as lusory lots) do yet lay down the rest of the requisites to make them lawful, which utterly condemn our common use of cards and dice, much more our gamesters: So that all the sober divines that ever I read or heard, condemn all these? And are you wiser than all of them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, … (London: White, 1673), pt. 1, ch. 10, pt. 2, ‘Directions about Sports &amp; Recreations, &amp; Against Excess &amp; Sin Therein’, p. 462 Baxter was an English congregationalist puritan.</span></figcaption>

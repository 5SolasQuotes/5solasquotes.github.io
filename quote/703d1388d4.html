<main class="wrap"><figure class="quote" id="q-703d1388d4" data-kw="">
<blockquote><p>The Divine Wisdom which found it expedient for man before the Fall, not to live alone, hath made it much more needful for man to live in Society after his weakening by sin; Woe to him that is alone, for if he fall who shall raise him up? The best wits of themselves are prone to errors and miscarriages, and left alone, are inclined to run on in any evil way they have once begun: But engagement in fellowship, especially with the Saints, is a preservative against the beginnings of evil, and a retractive therefrom when begun. Every gracious neighbour is a Counsellor and Pedagogue, the greater the incorporation is of such, the better is every Member directed and the more strengthened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), p. 196.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82b9f9c792" data-kw="">
<blockquote><p>The Book of Psalms was penned by David, Asaph, Moses and others, and in several ages and states of the church, and were appointed to be sung then, for the present state of the church in those days. It may therefore be demanded: Why then do we sing them now in our churches? The answer is: the church in all ages consists of a number of believers, and the faith is always one, and makes all that apprehend God’s promises to be alike to one another in grace, in meditations, in dispositions, in affections, in desires, in spiritual wants, in the feeling and use of afflictions, in course and conversation of life, and in performance of duties to God and man. And therefore the same psalms, prayers and meditations, are now as fit for the church in these days, and are said and sung with the same use and profit, as in the church in those days when they were first made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), pp 154-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-37ce0cf823" data-kw="">

</figure><figure class="quote" id="q-cf0f47a498" data-kw="">
<blockquote><p>Another ground of love among friends, is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship and causes love in men that never saw one another before.

3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors.

4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large</cite>, (d. 1626; 1675), 5th Commandment, p. 315</span></figcaption>

</figure><figure class="quote" id="q-0438d04e8f" data-kw="">
<blockquote><p>§.23. Of the restraint of the benefit of Christ’s headship to them only that are of his body. That none but those who are of Christ’s body shall partake of the benefit of his office is clear by other like titles of restraint, as ‘his people’, and ‘his sheep’: but especially by denying to the world the benefit of his intercession, ‘I pray not for the world,’ says He. In this respect this position (out of the Church no salvation) is without exception true: for the body is the true, catholic, invisible Church: he that is not a member of this Church, but is out of it, has not Christ to be his head and Savior, whence then can he have salvation? The former point is not more comfortable to those that have assurance that they are members of this body, then this is terrible to those that give too great evidence they are no members thereof; as all they do that have not the spirit of Christ ruling in them, but rather rebel against Him: and bear no love to the saints, but rather hate them, and do them all the spight they can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London: Haviland, 1622), 1st Treatise, §23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>

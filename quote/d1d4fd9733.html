</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b444816480" data-kw="">
<blockquote><p>XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.</p></blockquote>

<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>

<blockquote><p>The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)</p></blockquote>

t of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)”

— Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, pp. 552-53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+affections+are%2C+therefore+%5Bafter+quoting+Venema+and+Ames%5D%2C+either+inward+and+inalterable+dispositions+of+the+divine+will+or+figurative+attributions+based+on+ad+extra+manifestations.+Furthermore%2C+what+makes+the+attribution+of+an+affection+to+God+figurative+or+metaphorical+is+its+apparent+variation%2C+temporality%2C+or+alterability.+Significantly%2C+this+figurative+or+metaphorical+understanding+of+some+of+the+divine+affections+as+inward%2C+permanent+dispositions+and+others+as+ad+extra+manifestations+of+permanent+dispositions+in+no+way+lessened+the+Reformed+interest+in+the+topic%E2%80%93nor+did+it+in+any+way+undermine+the+discussion+of+the+divine+affections+in+the+works+of+popular+piety+written+during+the+era+of+orthodoxy.+It+is+even+possible+to+argue+the+opposite%2C+that+the+Reformed+orthodox+reading+of+the+biblical+language+of+divine+affections+as+not+indicating+alterations+of+the+divine+essence+but%2C+nonetheless%2C+as+descriptive+of+genuine+patterns+of+relationship+between+God+and+his+creation%2C+enhanced+the+interest+of+theologians%2C+pastors%2C+and+authors+of+treatises+of+popular+piety+in+the+divine+affections%E2%80%A6+%E2%80%A6Nor%2C+indeed%2C+has+the+basic+doctrinal+assumption+shifted%3A+like+the+Reformers%2C+the+orthodox+assume+that+God+has+affectiones+that+characterize+his+relationship+to+the+world+and+that+some+analogy+can+be+drawn+between+these+%E2%80%98divine+affections%E2%80%99+and+the+affections+that+belong+to+human+willing%E2%80%93with+the+major+qualification+that%2C+unlike+human+affections%2C+the+divine+affections+do+not+indicate+essential+change+in+God+and+that+they+are+permanent+rather+than+transient+dispositions.+Because+of+the+difficulties+inherent+in+the+term+%E2%80%98affection%2C%E2%80%99+some+of+the+Reformed+prefer+to+speak+of+the+divine+%E2%80%98virtues.%E2%80 ion+of+the+individual%E2%80%93and%2C+therefore%2C+a+loss+of+power+or+self-control.+%28Venema%2C+Inst.+theol.%2C+viii+%28p.+181%29.%29+A+virtue+is%2C+quite+simply%2C+a+moral+perfection%E2%80%93in+the+case+of+God%2C+the+perfection+of+his+understanding+and%2For+will.%C2%B9+%C2%B9+%28Ames%2C+Marrow%2C+I.iv.63%3B+note+that+this+understanding+of+affections+and+passions+reflects+the+standard+categories+of+predication%2C+in+which+action+and+passion+denote+respectively%2C+the+act+of+a+subject+and+the+subject+being+acted+upon%3A+thus%2C+the+point+of+the+theological+argument+is+that+God+act%5Bs%5D+but+is+not+acted+upon.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+pp.+552-53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7375df7539.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7375df7539.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting,act%5Bs%5D%20but%20is%20not%20acted%20upon&amp;text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting%20Venema%20and&amp;text=that%20God%20act%5Bs%5D%20but%20is%20not%20acted%20upon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

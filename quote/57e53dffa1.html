<blockquote><p>…for though the people of God deserved devastation and captivity by the heathen in regard of their sins before the throne of divine justice, yet the heathen grievously sinned in conquering them, Zech. 1:15, ‘And I am very sore displeased with the heathen that are at ease; for I was but a little displeased, and they helped forward the affliction.’ So though Judah deserved to be made captives and a conquered people because of their idolatry and other sins, as Jeremiah had prophecied, yet God was highly displeased at Babylon for their unjust and bloody conquest, Jer. 1:17-18, 33-34; 51:35, ‘The violence done to me and to my flesh be upon Babylon, shall the inhabitants of Zion say; and my blood upon the inhabitants of Chaldea, shall Jerusalem say.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc9a48e5b2" data-kw="">
<blockquote><p>Does infidelity or difference of religion make void the magistrate’s just and legal authority? No. Does it free the people from their due obedience to him? No (1 Pet. 2:13-15; Rom. 13:1-4; Titus 3:1). Well then, do not the Papists, Anabaptists and others err who maintain that subjects ought not to suffer a king that’s an infidel, or obey that king in his just commands that differs from them in religion? Yes. By what reasons are they confuted? 1. Because we are commanded to submit ourselves to every ordinance of man (1 Pet. 2:13). Namely, in all that they command us, if it be not contrary to God and his command. Otherwise (according to Acts 4:19) it is better to obey God than man. And it is said ‘for the Lord’s sake’, that is, because it is God’s will to govern us by them. 2. Because the Christians which were at Rome were commanded by the apostle to subject themselves to the higher powers, and that without exception of religion and piety, and even to that heathen, the Roman emperor (Rom. 13:1). 3. Because the same apostle, writing to Titus, bids him exhort the Cretians, his hearers, to obey magistrates, what manner of ones soever they be, not only believing ones but also those that are unbelieving, as then they were yet, most of them (Titus 3:1). 4. Because when the apostle Paul was pursued for his life and charged with matters criminal, he appealed unto Caesar (Acts 25:10-11). 5. Because the Prophet Jeremiah did own the power of Zedekiah who had turned aside to a false worship and had despised the oath which he had made to the king of Babylon (Eze. 17:16-17). ‘Now hear I pray thee (says the prophet), O my lord the king: let my supplication, I pray thee, be accepted before thee’ (Jer. 37:20). 6. Because Christ Himself paid tribute to Caesar, though he was free, being both the Son of God by nature and son of David by birth (Matt 22:21; Rom. 13:7). 7. Because Paul did own and acknowledge the power of King Agrippa (Acts 26:2).</p></blockquote>

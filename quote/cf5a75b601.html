<blockquote><p>This gospel holiness respects Christ as the Altar. It is in him and for him that his soul is well pleased with our performance, this is the Altar, upon which thou must lay thy gift, &amp; leave it, without which thy labour is lost, and whatsoever thou dost is loathed, as a corrupt thing.

As believers draw all their strength from him, so they expect acceptation only through him, and for him: they do not look for it, but in the beloved: they dare not draw near to God in duty, but by him: this is the new and living way, which is consecrate[d] for them: and if such, who offer to come to God, do no enter in hereat, in stead of being admitted to a familiar converse with God, they shall find him a consuming fire: when the saints have greatest liberty in prayer (and so of all other performances, when their hearts are most lifted up in the ways of the Lord) they abhor at thinking their prayer can any otherwise be set forth before him as incense, or the lifting up of their hands as the evening sacrifice, but as presented by the great intercessor and perfumed by the merit of his oblation.

If they could weep out the marrow of their bones, and the moisture of their body in mourning over sin; yet they durst not think of having what comes from so impure a spring, and runs through so polluted a channel, presented to God but by Jesus Christ, in order to acceptation; for as they look to the exalted Saviour, to get their repentance from him, so when by the pourings out upon them the Spirit of grace and supplication, he hath made them pour out their hearts before him, and hath melted them into true tenderness, so that their mourning is a great mourning, they carry back these tears to be washen and bathed in his blood, as knowing without this of how little worth and value with God their salt water is; but when they are thus washed, he puts them in his bottle, and then pours them out again to them in the wine of strong consolation: thus are they made glade in his house of prayer, and their sighs and groans come up with acceptance upon his Altar.

O blessed Altar, that sanctifies the gold! This is that Altar, whereto the mocking moralist hath no right. It is by him, that the poor believer offers up his sacrifice to God continually; what ever he doth, in word or deed, he desires to do all in the name of the Lord Jesus: as he knows, He lives to make intercession, and to appear in the presence of God for his poor people, both to procure influences for duty, and plead for acceptation; so he depends upon him for both, as knowing he can never otherwise hear, or have it said unto him, well done, good and faithful servant.

It may be he can do little, he hath but a mite to offer; but he puts it in the mediator’s hand to be presented to God: he hath not gold, nor silver, nor purple to bring, he can do no great things, he hath but goats hair or rams skins, but he gives them the right tincture, he makes them red in the blood of Christ, and so they are a beautiful incarnat[ion].</p></blockquote>

<blockquote><p>The author looks at the history of the use of the cassock, scarf and bands in Scotland… The scarf is reported as being worn ‘by quite a number of ministers’, its use having been revived ‘about half a century ago’. Theories regarding its origin vary and are described. James Melville writes of seeing John Knox wearing a type of forerunner. They fell into disuse after the Revolution and until ‘our own times’. Bands are medieval in origin, though whether civil or ecclesiastical is in dispute. They are the only article which distinguishes the minister from the probationer. They were worn by some of the clergy in pre-Reformation times and in Reformed circles in England as early as 1566. They appear in Scotland from the end of the 16th century and their use appears unaffected by the Revolution.</p></blockquote>

<blockquote><p>Doctrine IV. Want of power to do more, shall not mar the acceptance of what is done from a willing mind according to power. In that case, God will accept of his people’s will for the deed. Here I shall shew,

I. In what particular cases God accepts his people’s will for the deed. II. Why he does so. III. Apply. I. I am to shew in what particular cases God accepts his people’s will for the deed.

1. Where there is a sincere will to serve him in a piece of work, requiring some external abilities which are wanting. If it be hindered only by such want, the will is accepted. The disciples would fain have watched more, but the weak body could not bear up with their mind; and Christ kindly takes notice of it; Matth. xxvi. 41, “Watch and pray, that ye enter not into temptation; the Spirit indeed is willing, but the flesh is weak.” Sometimes Satan makes a rack here to God’s children; such a duty they would do, but bodily strength will not answer, and here upon they are disquieted; but that is from Satan, and their own weakness; for God does not require that external duty from us, that we have no bodily strength for. That is a sweet word, 1 Cor. vi. 13, “The body is—for the Lord, and the Lord for the body.” Peter would fain have given to the poor man, but had it not, and it was accepted in the will, Acts iii. 6.

2. When doing the best we can through grace, our work after all is attended with many blemishes; the Lord will not reject it for these blemishes, but accepts the will to do better for the deed, Cant. v. 1. There is a broad cover of Christ’s righteousness cast over the believer’s spots, that they appear not, Cant. iv. 7; and the Lord accepts of the will to that perfection they would be at.

3. Going as far as we have access in a work, but meeting with a providential stop, the will to complete it is accepted for the deed, as if it had been fully done, as in the case of Abraham’s offering up Isaac, Heb. xi. 17. There is a great difference betwixt the stops men make in these, and those which God makes; the former argues an unwilling mind, but the latter not so.

4. Services that one really desires, and fain would perform for God, but have not opportunity; the will to them is accepted for the deed, as in the case of David’s purposing to build a house for the Lord, 2 Chron. vi. 8; and the Philippians care about supplying Paul’s wants, Philip, iv. 10. Some have opportunities of usefulness, but slight them; that is their sin; others may have a heart to be so and so useful, but they cannot have the opportunity; this God accepts.

5. Lastly, In services performed with a real desire of success for God’s honour and men’s good; the Lord accepts the good will to the success denied, as if it had succeeded according to their wish, Isa. xlix.4; 2 Cor. ii. 15. The want of success may mar their present comfort, but neither the acceptance nor reward.

II. Why does God accept such will for the deed?

1. The sincere will to a work is present, which God mainly regards. The person sincerely aims at doing such a piece of service for God, but not attaining what he really desires, his good will thereto being present before the Lord, it is accepted, as if the work had been done.

2. We have a merciful High Priest to present that will for acceptance, notwithstanding all the weaknesses, blemishes, providential hindrances, want of opportunity, and failure of success, that it may be attended with, Heb. iv. 15, 16.

3. We have a merciful Father to deal with, Psalm ciii. 13, 14, who pities the weaknesses and infirmities of his people, and graciously accepts of their upright designs to serve and honour him.

Use 1. If the Lord accepts the will for the deed in his own people, then men must answer for the ill they had a will to have done, as if they had done it, Numb. xiv. 42—45. A will and intention to do an evil action, though it be not actually done, is in God’s account the same thing with doing it, and will be resented and punished accordingly.

2. God is a gracious master to his servants, taking kindly off their hands through Christ their sincere will to his service, giving them ample testimonies of his regard in all circumstances, and be¬ stowing upon them the special comforts of his grace here, as pledges of the full reward laid up for them inglory hereafter.</p></blockquote>

<blockquote><p>Worshipping Christ in a crucifix is naught in its own nature, abominable, idolatrous, condemned in God’s law, Exod. xx. 4, &amp;c. And therefore, be it done with ever so great devotion and good meaning, with ever so much popish daubing or goodly pretence whatsoever, it is still cursed and damnable.</p></blockquote>

</figure><figure class="quote" id="q-ff26b6f2f6" data-kw="">
<blockquote><p>One of the sections of the Directory is given to the Singing of Psalms, and declares it “the duty of Christians to praise God publickly by singing of psalms together in the congregation, and also privately in the family”. This rubric manifestly implied the provision of a Psalm Book, and it was made part of the function of the Assembly in preparing a basis for uniformity of worship in the churches of the three kingdoms, to supply them with a common Psalm Book. The way was prepared for this by the submitment to the Assembly by the House of Commons on Nov. 20, 1643, of the query whether “it may not be useful and profitable to the Church that the Psalms set forth by Mr. Rouse be permitted to be publicly sung”.

The result of the Assembly’s examination of Mr. Rouse’s version (first printed in 1643) was to recommend it, after it had been subjected to a thorough revision at its own hands, to Parliament as a suitable Psalm-Book for the Church (autumn of 1645). The Commons accordingly ordered the book printed in this revised form (it appeared in 1646, i. e., Feb. 1647), and (April 15, 1646) issued an order establishing it as the sole Psalm Book to be used in the Churches of England and Wales, though the House of Lords never concurred in this order.

The Scotch Assembly subjected the book to a still furthermore searching revision, and by an act passed in 1649 (ratified by the Estates of Parliament in 1650) approved it in this new form for use in the Scottish Churches. It is in this Scottish revision alone (printed in 1650) in which they can only by courtesy continue to bear the name of Francis Rouse as their author, that these Psalms have passed into wide use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Assembly and its Work in Princeton Theological Review</cite></span></figcaption>

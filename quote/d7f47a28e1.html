<main class="wrap"><figure class="quote" id="q-d7f47a28e1" data-kw="">
<blockquote><p>…it is well enough known how many heterodox doctrines are maintained by Formalists, who are most zealous for the ceremonies, about universal grace, free-will… images… etc. Their errors about those heads we will demonstrate, if need be, to such as doubt of their mind. In the meantime, it has been preached [by formalists] from our pulpits among ourselves that Christ died for all alike; that the faithful may fall away from grace… that images in churches are not to be condemned…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 2, Ch. 3, p. 77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-f1428f6aba" data-kw="">
<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>

</figure><figure class="quote" id="q-fbc7626e71" data-kw="">
<blockquote><p>…it is added by the Rejoinder that Beza says of some that retain the cross, they may use their own liberty. But in the next words he adds: ‘If they have any just causes of retaining this sign in their churches.’ So that he limits that liberty unto such causes as he was not privy to; nay [not for any use] to such as they at Geneva found to be clean contrary. As for us, we have many necessary reasons why we do no way tolerate that sign, and their causes (alleged in the 8th Epistle) were not peculiar to any time or place, but pertain as well to England as to Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>

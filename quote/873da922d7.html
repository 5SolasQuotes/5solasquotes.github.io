<blockquote><p>When God (Deut. 17) forbids them [Israel] to choose a stranger [as king], He presupposes they may choose a stranger; for God’s law now given to man in the state of sin, presupposes he has corruption of nature to do contrary to God’s law.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c3dbb6d36" data-kw="">
<blockquote><p>It is asked, sixth, whether original sin consists only in the privation of original righteousness… The papists certainly acknowledge an original righteousness, but one which was not natural to man, but a supernatural gift, like a certain golden bridle, conferred upon natural man to restrain the conflict between the flesh and the spirit. So that they may obtain that the things natural to man, among which is free choice, have remained unwounded by the fall of our first parents, and likewise so that they may hold to this conflict between the flesh and the spirit, or the concupiscence of the flesh against the spirit, and thus that, such conflict notwithstanding, in this life man can be morally perfect, they state that original sin does not consist in anything but the privation of original righteousness, through which the spirit, in the conflict with the flesh, devoid of the assistance of original righteousness, contracted a languor through which it cannot as promptly and successfully repress the attacks of the flesh. The opinion of the Reformed with their reasons. The Reformed on the contrary, because they believe that original righteousness was natural, that is, owed to a morally intact nature, state that not only was original righteousness taken away on account of the fall, but by the same stroke the entire nature of man was so morally corrupted as regards the intellect, the will, the affections, that by nature he is blind in respect to all spiritual truth, likewise incompetent for any spiritual good, and prone to all evil in respect to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, vol. 3, bk. 4, ch. 2 | section 26, pp. 463-4</span></figcaption>

</figure><figure class="quote" id="q-e052571c14" data-kw="">
<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>Something Contingent to Necessary Being [see pp. 48-50 of the Summary] 35. Whatever exists from itself (is either ineffectible or independent) is a necessary being. This point follows from the definitions. 36. Whatever exists contingently [see p. 48] not only has in another the reason for its existence, but receives existence from a cause that causes contingently and not necessarily [see pp. 48-49]. 37. Everything caused either immediately or mediately by a free cause is contingent, and conversely every contingent being is caused immediately or mediately by a free cause. 38. Every cause that causes contingently is either itself a free will or depends for its existence or its causing on a free cause. 39. If there is some contingent being, there is some necessary being. If there is something contingent, such a thing is caused (from conclusion 36), and consequently is dependent (from conclusion 38). But a dependent being implies a being from itself (from conclusion 32), and therefore a being from itself necessarily exists (from conclusion 35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>

<blockquote><p>IV… Joined to these [the soul’s faculties, such as intellect and will] is free will, or, as others prefer, liberum arbitrium, which is to be considered strictly and generically, arising from the interaction of both faculties and acting according to a natural inclination and from an intrinsic principle, which alone is free in an uncoerced manner. This freedom applies not only to man but also to beasts and some inanimate objects that act uncoercedly, though not in a state of moral freedom as man does, where actions are performed both directly and by command, with premeditated consultation, deliberation, judgment, and from the will, which gives it liberty.</p></blockquote>

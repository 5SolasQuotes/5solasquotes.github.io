<main class="wrap"><figure class="quote" id="q-6586ea429d" data-kw="">
<blockquote><p>The predicate; “They have crucified the flesh, with the affections and lusts.” By flesh we are here to understand carnal concupiscence, the workings and motions of corrupt nature; and by the affections we are to understand, not the natural, but the inordinate affections; for Christ does not abolish and destroy, but correct and regulate the affections of those that are in him:

And by crucifying the flesh, we are not to understand the total extinction or perfect subduing of corrupt nature, but only the deposing of corruption from its regency and dominion in the soul; its dominion is taken away, though its life be prolonged for a season; but yet, as death surely, though slowly, follows crucifixion, (the life of crucified persons gradually departing frown them, with their blood) it is just so in the mortification of sin; and therefore what the apostle in this place calls crucifying, he calls in Rom. 8:13. mortifying. “If ye, through the Spirit, do mortify,” … if ye put to death the deeds of the body:

But he chuses, in this place, to call it crucifying, to show not only the conformity there is betwixt the death of Christ and the death of sin, in respect of shame, pain, and lingering slowness; but to denote also the principal means and instruments of mortification, viz. the death, or cross of Jesus Christ, in the virtue whereof believers do mortify the corruptions of their flesh; the great arguments and persuasives to mortification being drawn from the sufferings of Christ for sin. In a word, he does not say, They that believe Christ was crucified for sin, are Christ’s; but they, and they only, are his, who feel as well as profess the power and efficacy of the sufferings of Christ, in the mortification and subduing of their lusts and sinful affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 369.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75ec95597a" data-kw="">
<blockquote><p>For this law, the origin of death, passed on from the first pair to their posterity, as is seen in the labour with which all men toil in the earth, and the travail of women in the pains of childbirth. For these sufferings they merited by the sentence of God, when they were convicted of sin; and we see them fulfilled not only in them, but also in their descendants, in some more, in others less, but nevertheless in all.

Whereas, however, the primaeval righteousness of the first human beings consisted in obeying God, and not having in their members the law of their own concupiscence against the law of their mind; now, since their sin, in our sinful flesh which is born of them, it is obtained by those who obey God, as a great acquisition, that they do not obey the desires of this evil concupiscence, but crucify in themselves the flesh with its affections and lusts, in order that they may be Jesus Christ’s, who on His cross symbolized this, and who gave them power through His grace to become the sons of God.

For it is not to all men, but to as many as have received Him, that He has given to be born again to God of the Spirit, after they were born to the world by the flesh. Of these indeed it is written: “But as many as received Him, to them gave He power to become the sons of God; which were born, not of the flesh, nor of blood, nor of the will of man, nor of the will of the flesh, but of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.37 in Nicene and Post-Nicene Fathers 1, 5: 59.</span></figcaption>

7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75ec95597a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/03/augustine-of-hippo-on-grace-delivering-us-from-evil-concupiscence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-06607c4dc4" data-kw="Temptation">

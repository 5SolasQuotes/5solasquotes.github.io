<blockquote><p>A consistent evolutionist could not agree that man’s chief and highest end is to glorify and enjoy God, for he must hold that the human race has evolved from a brute ancestry by a process which originated in blind chance. Therefore he must hold that the human race cannot exist for any purpose outside of itself.

There are “theistic evolutionists” who believe that evolution was God’s method of creation, but they are not consistent, for creation concerns the origin of things, while evolution starts by assuming that things already exist and seeks to show their development to other form. The consistent evolutionist cannot believe in creation by the sheer power of God, and therefore he cannot believe that the human race exists not for itself but for God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Larger Catechism of the Westminster Assembly in Blue Banner Faith and Life</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de64d941f0" data-kw="">
<blockquote><p>1st Conclusion. The relative expression of God which is in the works of God, is no formal ground of any adoration of the creatures.

1. Because adoration upon this ground, though the creatures, the host of heaven be excellent, is forbidden, Dt. 4:19.

2. [If it were the case, then] Not only images (which cannot represent God) and the sacraments, but all the creatures, even, rats, mice, flies, frogs, worms, Judas and wicked men, yea, and devils are to be worshipped, because all things having being are shadows and footsteps of God, their cause, first author and last end, Ps. 19:1; 103:22; Rom. 1:19-20; Acts 17:27-28; Prov. 16:4; Rev. 4:11; Rom. 11:36-37.

3. Because God is really, and by the diffusion of his blessed essence, present in all creatures, it follows not that we should adore them: The Formalists upon this ground, that Christ is really present in the sacrament, though the manner we know not, think that Christ should be adored in the sacrament, according to that, Verbum audimus, motum sentimus, modum nescimus. But if this be good logic, because we know not the way of the Spirit and how the bones grow in a woman with child, Eccl. 11:5, and God, where he works, is present by the immediation of essence and power, though we know not the way of his presence, we are to adore the soul of man and the bones of a young child in a woman’s belly; and though they should say that God-man Christ is in a more powerful and efficacious manner present in the sacrament than in the works of nature; yet should it follow that God is to be worshipped in the works of nature also, for magis et minus non variant speciem [greater or less does not vary the species]; for then we could not conclude any thing but this: Though there be not so real a ground of adoring lice and frogs as adoring of the sacrament, yet there is a ground, seeing God is, in the reality of his blessed essence, present in all creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) | section 2, p. 151, ch. 1, Question 5</span></figcaption>

<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>

</figure><figure class="quote" id="q-28d430f201" data-kw="">
<blockquote><p>Use 1. In that God did choose to make the world in this space of time, who could as easily have made it, as well in one moment, as in six days; this should teach us to take time for meditation on his works. He that could in one instant, at one word have brought forth heaven full of stars, the air full of fowls, the water full of fishes, the earth full of beasts, creeping things, trees, etc. was pleased to make several days works of this wonderful creation, and to proceed distinctly and orderly in his work: teaching us by the manner of his working only by his Word without instruments, that he could have done all at once, which now He did at several times… …few of us could say that of all the time we have spent, ever sith-hence we had the use of our understandings, in a serious meditation on God’s works, to this end that we might glorify the Maker, would not make up one week, not one six days, not so long as the Lord was in bringing them forth. Is not this a shame for man, who was made of purpose to glorify God in his works, that he should not in all his life spend so much time in meditating on the works of God, notwithstanding his dulness and sloth of apprehension, as the Lord was pleased to take in making of them, notwithstanding his omnipotency, which could have made them all in less than one minute, as easily as in a thousand years!… And what if I should say, it were expedient herein to follow the same order in considering of the Lord’s works, as the Lord Himself did in their creation; that is, to bind ourselves to do the work of the Day in its day, namely on the same day wherein each work was done, to meditate on the work of that Day?… …the Lord has been pleased, not only to let us know how many days He spent in the creation of all the whole, but also particularly and distinctly to acquaint us with his several days’ works; telling us what He did the first Day, what he did the second Day, etc. I dare boldly say, it is expedient even to tie ourselves to set apart some time in those several days for a more special view of those several works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maynard.html">John Maynard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty &amp; Order of the Creation Together with Natural &amp; Allegorical Meditations on the Six Days Works of the Creation</cite>, … (d. 1665; London: T.M., 1668), ch. 2, pp. 36-40</span></figcaption>

<blockquote><p>Here is our open challenge: Can those who claim that modern views, such as Day-Age or Framework, produce a catalogue of Reformed divines between 1540 and 1740 who held to their views near as weighty as this one?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7e9215f958" data-kw="">
<blockquote><p>Neither may they forbid a communion with them in good because all communion in evil is denied us. Neither to hear them preach evil or untruth is to communicate with them in evil, except we yield to, believe, or obey their evil. And so those Scriptures forbidding to hear are to be understood. For Jeremiah did hear the false prophet Hananiah and said ‘amen’ to his prayer (Jer. 28:6). That is, to that good, or to those words of his prayer which might be taken well, he answered ‘so be it, the Lord ratify they words,’ but yet he reproved the evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), 3. ‘A Reproof of Certain Schismatical Persons,’, pp. 225-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c9c1a8810b" data-kw="">
<blockquote><p>Pt. 2, ‘Of Idolatry’ §2. ‘Of Idolatry in General’ Idolatry is a species of superstition, being an excess in the object of worship. It is the giving of worship that is proper to God to that which is not God… . Pt. 3, ‘Of Superstition Less than Idolatry’ §1. ‘Of Excess in the Quantity or Measure of Religious Observances’ All superstition is an excess in religion… this excess is either in the measure or in the kind when the rule of religion is transgressed in either of these ways; and in some instances there may be an excess in both… . §2. ‘Of Excess in Religious Observances, for the Kind Thereof’ …Some kinds of religious worship may not be vicious in their nature, nor contrary to God’s holiness to command or allow, yet may be forbidden by the general precept of Scripture or other supernatural revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684) Corbet (d. 1680) was a congregationalist puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-2b43c99223" data-kw="">
<blockquote><p>Again, he [an episcopalian] argues we cannot be said to be members of a particular Church, or to hold communion with it, if we do not join in their worship, as it is established among them. This is easily answered by a plain distinction: unless we join in their established worship, as to the greatest and chief acts of it, conceditur [it is conceded]: as to all the parts of it, even to the least, negatur [I deny]. I may join with a Church in the Word and sacraments; and yet if they have a holy day or two beside the Sabbath, may forbear; yea I may, without this be a member of that Church (if they will suffer me), which all the Reformed Churches do, except the Episcopal Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., p. 257</span></figcaption>

</figure><figure class="quote" id="q-0bba6eae58" data-kw="">
<blockquote><p>Moreover, when a magistrate is not able to do some part of his office, as for example, being able to do the duties which are to be performed in peace, is insufficient for martial affair, yet no man refuses that which he is able to give because he is not able to do all that is required: Even so, endeavoring to our uttermost a sufficient ministry, I would think in the mean season that the good things they are able to give us may be taken at their hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, (1584), pp. 12-13 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

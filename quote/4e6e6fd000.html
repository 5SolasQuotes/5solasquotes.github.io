<main class="wrap"><figure class="quote" id="q-4e6e6fd000" data-kw="apocrypha">
<blockquote><p>The Apocryphal books are so called not because the authors are unknown (for there are some canonical books whose authors are unknown and some apocryphal books whose authors are known); not because they could be read only in private and not in public (for some of them may be read even in public), but either because they were removed from the crypt (apo tēs kryptēs) (that sacred place in which the holy writings were laid up) as Epiphanius and Augustine think; or because their authority was hidden and suspected, and consequently their use also was secret since the church did not apply to them to confirm the authority of ecclesiastical doctrines (as Jerome says, ‘Praefatio in libros Salomonis’ from “Hieronymi Prologus Galeatus” in Biblia Sacra Vulgata Editionis Sixti V … et Celementis VIII [1865], p. lii); or, what is more probable, because they are of an uncertain and obscure origin (as Augustine says, CG 15.23* [FC 14:474]). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a> › <a href="../topics/holy-scripture/canon/the-apocrypha.html">The Apocrypha</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/apocrypha.html">Apocrypha</a></span></div>

</figure><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>

</figure><figure class="quote" id="q-01d018d5b8" data-kw="">
<blockquote><p>The Scripture we own as the only rule of our faith, as the only treasury of all sacred truths. … The sole inquiry is, whether this supreme teacher be the Spirit of God instructing us in and by the Scripture, or whether it be the authority of this or that, any or all of the churches in the world, which either are so or pretend to be so.</p></blockquote>

</figure><figure class="quote" id="q-0a2dfef12d" data-kw="">
<blockquote><p>It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. II</span></figcaption>

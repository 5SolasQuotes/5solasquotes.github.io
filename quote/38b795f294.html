<main class="wrap"><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Question 5, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

t="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bb02d34fe" data-kw="">
<blockquote><p>Calvin, Beza, yea, all our writers condemn blind obedience as brutish… …concerns his conscience, knowing that he must do it in faith as he does all his moral actions; Ergo [Therefore], the magistrate must examine what he practices in his office, according to the Word, and must not take it upon the mere authority of the Church, else his faith in these moral acts of his office should be resolved ultimately on the authority of the Church, not on the Word of God, which no doubt is Popery; for so the warrant of the magistrate’s conscience should not be, ‘Thus saith the Lord,’ but ‘Thus saith the Church in their decrees.’ … 2. It’s against Scripture and reason that… all others, should obey the decrees of the Church with a blind faith, without inquiring in the warrants and grounds of their decrees, which is as good Popery as magistrates and all men are to believe as the Church believes with an implicit faith; so ignorance shall be the mother of devotion; Whoever impute[s] this to us, who have suffered for non-conformity, and upon this ground, that synods can err… … Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 595-9</span></figcaption>

</figure><figure class="quote" id="q-624feea60c" data-kw="">
<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that. In reference to which, these things are to be adverted to: 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word, going before, or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (1659), pt. 2, ch. 2, p. 69</span></figcaption>

</figure><figure class="quote" id="q-0c33103c99" data-kw="">
<blockquote><p>Second, there are means of a most indispensable kind to be employed in the way of explanation and instruction, counsel and persuasion, to secure the convictions and concurrence of the private members of the Church, in whatever act or declaration the rulers, in the exercise of their judicial, or legislative, or administrative functions, may find it necessary for them to perform or to adopt. Without the use of such means to carry the conscience and understanding of the members of the Church along with them in all that they do and declare, the office-bearers are not at liberty to use or enforce their peculiar power at all. And it is only when all such means have been employed and exhausted without effect, and when the members of the Church, so dealt with in the way of Christian persuasion and instruction, still refuse their concurrence, that it may be necessary and is lawful to use authority to strengthen the appeal, and to fall back upon the ultimate resource of all societies, — namely, the inherent right of the rulers to rule, and the no less inherent duty of the ruled to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1 (Edinburgh, 1868), pp. 241-3</span></figcaption>

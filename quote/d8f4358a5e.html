<main class="wrap"><figure class="quote" id="q-d8f4358a5e" data-kw="">
<blockquote><p>As God is perfect in His works, He bestowed perfection on all of them according to their capacity: God’s works are perfect (Deut 32:4). He Himself is simply perfect by the fact that all things are pre-contained in Him, not as component parts, but as united in one simple whole, as Dionysius says (Div. Nom. v); in the same way as various effects pre-exist in their cause, according to its one virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 91, art. 1, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b53c8f067" data-kw="">
<blockquote><p>Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

</figure><figure class="quote" id="q-0149af644d" data-kw="">
<blockquote><p>It is an untruth which [the Romanist] Raphael de la Torres, with other schoolmen say (tome •, in 22, question 81, article 4, the only disputation), that with the same religion by which we honor holy men, we honour God, upon this reason, because holiness in them is a participation of the divine nature; therefore God must be the intrinsical end and formal reason for which we honor the saints. For holiness in saints is a participation of the divine nature, but it is a temporary and a created participation; it is not the same very holiness that is in God, but [rather is] the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature, and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God commanded in the First Table of the Law. 2. When I bow to the gray-haired and to the king; I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man that I am then bowing to the God of heaven and worshipping God: No acts terminated upon saints, living or dead, are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in, or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) | Introduction, section 6, pp. 83-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-65c8156d37" data-kw="">
<blockquote><p>Position 4. Though it be true that grace is essentially in God, and in us by participation, yet is it false [contra antinomians] that grace is not properly in us, but that faith, hope, repentance, and the like, that are in us, are gifts, not graces. For grace in us may be called a gift, in that it is freely given us as a fruit of the grace and favor of election and free redemption, which indeed is the only saving fountain-grace of God…</p></blockquote>

</figure><figure class="quote" id="q-6048777324" data-kw="">
<blockquote><p>For He is the First immaterial Being; and as intellectuality is a result of immateriality, it follows that He is the First intelligent Being. Therefore since in each order the first is the cause of all that follows, we must conclude that from Him proceeds all intellectual power. In like manner, since He is the First Being, and all other beings pre-exist in Him as in their First Cause, it follows that they exist intelligibly in Him, after the mode of His own Nature. For as the intelligible types of everything exist first of all in God, and are derived from Him by other intellects in order that these may actually understand; so also are they derived by creatures that they may subsist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 105, Art. 3, I answer that</span></figcaption>

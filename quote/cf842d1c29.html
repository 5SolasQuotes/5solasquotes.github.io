<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 24, Question 20, pp. 547-48</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-035047e7f3" data-kw="">
<blockquote><p>Though the children of Ammon did a high injury to David, yet no injury can be recompensed in justice with the pressure of the constrained subjection of loyalty to a violent lord. If David had not had an higher warrant from God than an injury done to his messengers, he could not have conquered them. But the Ammonites were the declared enemies of the church of God, and raised forces against David when they themselves were the injurers and offenders. And if David’s conquest will prove a lawful title by the sword to all conquerors, then may all conquerors lawfully do to the conquered people as David did; that is, they may ‘put them under saws, and under harrows of iron, and under axes of iron, and cause them pass through the brick-kilne.’ But, I beseech you, will royalists say, that conquerors, who make themselves kings by their sword, and so make themselves fathers, heads, defenders, and feeders of the people, may use the most extreme tyranny in the world, such as David used against the children of Ammon, which he could not have done by the naked title of sword-conquest, if God had not laid a commandment of an higher nature on him to serve God’s enemies so? I shall then say, if a conquering king be a lawful king, because a conqueror, then has God made such a lawful king both a father, because a king, and a tyrant, and cruel and lionhearted oppressor of those whom he has conquered; for God has given him royal power by this example (2 Sam. 12:30-31) to put these, to whom he is a father and defender by office, to torment, and also to be a torturer of them by office, by bringing their backs under such instruments of cruelty as ‘saws, and harrows of iron, and axes of iron.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 50</span></figcaption>

<blockquote><p>There is no community but is major [has authority] in this, that it can appoint its own tutors; and though it cannot be without all rulers [due to the inclinations of nature], yet it may well be without this or that prince and ruler, and, therefore, may resume its power, which it gave conditionally to the ruler for its own safety and good; and in so far as this condition is violated, and power turned to the destruction of the commonwealth, it is to be esteemed as not given; and though the people be not a politic judge in their own cause, yet in case of manifest oppression, nature can teach them to oppose defensive violence against offensive. A community in its politic body is also above any ruler, and may judge what is manifestly destructive to itself.</p></blockquote>

<blockquote><p>But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.”

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience… (1649), Ch. 4, pp. 51-2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+sword+is+a+means+negatively+to+punish+acts+of+false+worship+in+those+that+are+under+the+Christian+Magistrate+and+profess+Christian+society%2C+insofar+as+these+acts+come+out+to+the+eyes+of+men+and+are+destructive+to+the+souls+of+these+in+a+Christian+religion.+Tis+even+so+%28and+not+otherwise+punishable+by+the+Magistrate%29%2C+for+he+may+punish+omissions+of+hearing+the+doctrine+of+the+Gospel+and+other+external+performances+of+worship%2C+as+these+omissions+by+ill+example+or+otherwise+are+offensive+to+the+souls+of+these+that+are+to+lead+a+quiet+and+peaceable+life+in+all+godliness+and+honesty%3B+Nor+does+it+follow+that+the+sword+is+a+kindly+means+to+force+outward+performances%2C+for+the+Magistrate+as+the+Magistrate+does+not+command+these+outward+performances+as+service+to+God%2C+but+rather+forbids+the+omissions+of+them+as+destructive+to+man.+For+example%2C+a+physician+commands+fasting%3B+pastors+after+the+example+of+James+commands+fasting+when+judgments+are+on+us%3B+the+physician+commands+it+insofar+as+eating+troubles+the+common+society+of+humors%2C+members+and+temper+of+the+body%2C+and+the+physician+forbids+eating+so+as+he+will+have+no+more+to+do+with+the+patient+if+he+will+disobey+and+so+trouble+the+temper+of+the+body%2C+which+is+the+only+object+the+physician+works+on.+Pastors+command+fasting+to+be+in+sincerity+for+afflicting+and+humbling+the+soul+under+the+mighty+hand+of+God.+So+the+Magistrate+forbids+cutting+of+a+vein+or+shedding+of+blood+as+a+thing+troubling+the+peace+of+human+society%2C+yet+his+command+is+not+a+direct+means+of+preventing+diseases+in+the+body+of+a+subject+and+for+healthy+living.+But+the+physician+commands+to+cut+a+vein+and+to+shed+blood+for+health+and+to+prevent+a+disease%2C+and+sins+neither+against+the+Magistrate+nor+God+in+so+doing%3A+so+does+the+Magistrate+not

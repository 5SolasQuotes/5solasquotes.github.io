<main class="wrap"><figure class="quote" id="q-e2e7b18d9a" data-kw="">
<blockquote><p>6. Though the law of tenths be not now necessary, as it was a ceremonious duty: but it is lawful either to keep that or any other constitution for the sufficient maintenance of the Church, whether it be more or less than the tenth part: yet we doubt not to say that this provision for the Church maintenance by paying of tithes is the most safe, indifferent and surest way, and no better can come in the place thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Concerning the Maintenance of the Church by Tithes’, ‘Whether the Payment of Tithes be Necessary?’ &amp; ‘By What Right Tithes are due to the Ministers of the Gospel?’ in Synopsis Papismi (London, 1592), First Book or Century, 5th Controversy: Concerning Spiritual Persons, 6th Question, pp. 223-31</cite>, pp. 226-227</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-749ffbefe0" data-kw="">
<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer’ in Practical Religion (Evangelical Press)</cite>, pp. 97-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-150daff956" data-kw="">
<blockquote><p>The Schoolmen are generally for the negative, and so are many able Protestant Divines: Rivet (in Gen. 28, Exercitation 125 and in his Jesuita Vapulans), Capel (in Thes. Theol. Salmur), Mr. Cartwright (Against the Rhemists, on Heb. 7:4 and in his Necessity of Discipline). Mr. [John] Dod, Bishop [George] Carleton, Dr. [John] Prideaux, Dr. [William] Sclater [I] and Mr. Whateley, were for the affirmative.</p></blockquote>

</figure><figure class="quote" id="q-b6faaee303" data-kw="">

</figure><figure class="quote" id="q-7760eefc11" data-kw="">
<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 193</span></figcaption>

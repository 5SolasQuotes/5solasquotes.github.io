<main class="wrap"><figure class="quote" id="q-61a2efa655" data-kw="Mary|Queen of Heaven|Mediator" data-pol="mary">
<blockquote><p>Except for those honorary titles which belong to God the Lord and to our only Saviour, one may give her the highest and most glorious titles. … But that we do not name her a Goddess, a Mediator between God and men, an all-knowing and almighty Queen of Heaven, a Gate of the Heavenly Paradise, a Redeemer, a Reconciler of the human race, and more suchlike honorary titles which were raised by men, comes solely therefrom, that suchlike honorary titles are adverse to the honour of God and of Our Saviour.</p></blockquote>
<figcaption>— <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a>, <cite>Short Instruction on the Holy Virgin Mary (1673)</cite>, Q. 29</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-mary.html">Rome: Mary</a><a class="tag" href="../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a><a class="tag" href="../topics/person-of-christ/mediator.html">The Mediator</a></div>

</figure><figure class="quote" id="q-9ac1204447" data-kw="Mary|Queen of Heaven|King" data-pol="mary">
<blockquote><p>I hear again a Jesuit crying out, &quot;You, Mother of God, CAN DO ALL THINGS in heaven and on earth.&quot; But I believe Christ, saying, (Matt. 28:18.) &quot;All power is given to me in heaven and on earth.&quot; If he had said the same of his mother, we would have given faith to him: which we rightly withdraw from those who, without God&#x27;s authority, crown a Queen, not only for themselves, but to rule over all creatures.</p></blockquote>
<figcaption>— <a href="../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption>

</figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary|Queen of Heaven|King" data-pol="mary">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>
<figcaption>— <a href="../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption>

</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary|Mediator|Invocation of saints|Idolatry" data-pol="mary|saints|images-and-idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>
<figcaption>— <a href="../authors/albert-barnes.html">Albert Barnes</a>, <cite>Notes on the Bible</cite>, 1 Timothy 2:5</figcaption>

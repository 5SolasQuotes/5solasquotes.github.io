<main class="wrap"><figure class="quote" id="q-fe626717c5" data-kw="">
<blockquote><p>It’s true which our Saviour told Nicodemus, Jn. 3:17, that God sent not his Son into the world to condemn the world, but that the world through Him might be saved. Christ does not knock at any man’s heart with that intent that He may have the more advantage against Him, if he let Him not in; no He comes with purpose and desire to bring in salvation with Him…</p></blockquote>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee. 4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost. 5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John... (d. 1563), ch. 3, p. 50 Bale was an Anglican reformer.</cite></span></figcaption>

</figure><figure class="quote" id="q-794dfd10d0" data-kw="">
<blockquote><p>‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-diodati.html">Jean Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations, upon the Holy Bible (London: T.B., 1643), on Song 5, verse 2</cite>, p. 201</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘That knocketh.’ moving my heart by secret inspirations, to give full admittance and entrance to his grace and virtues, Rev. 3:20. ‘Open to me.’ receive Me in thine heart, by a lively act of faith, for it is mine only place of refuge and abode upon earth, out of which I find nothing but annoyance and displeasure in the world.”

— Jean Diodati, Pious Annotations, upon the Holy Bible (London: T.B., 1643), on Song 5, verse 2, p. 201">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98That+knocketh.%E2%80%99+moving+my+heart+by+secret+inspirations%2C+to+give+full+admittance+and+entrance+to+his+grace+and+virtues%2C+Rev.+3%3A20.+%E2%80%98Open+to+me.%E2%80%99+receive+Me+in+thine+heart%2C+by+a+lively+act+of+faith%2C+for+it+is+mine+only+place+of+refuge+and+abode+upon+earth%2C+out+of+which+I+find+nothing+but+annoyance+and+displeasure+in+the+world.%E2%80%9D%0A%0A%E2%80%94+Jean+Diodati%2C+Pious+Annotations%2C+upon+the+Holy+Bible+%28London%3A+T.B.%2C+1643%29%2C+on+Song+5%2C+verse+2%2C+p.+201&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F794dfd10d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/794dfd10d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=%E2%80%98That%20knocketh.%E2%80%99%20moving%20my%20heart%20by,annoyance%20and%20displeasure%20in%20the%20world." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mr-smallwood.html">Mr. Smallwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations, 3rd ed. (1658) As the end of the quote demonstrates, Smallwood is speaking of conversion. | Song 5:2 – “…it is the voice of my beloved that knocketh, saying, Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, and my locks with the drops of the night.”</cite></span></figcaption>

</figure><figure class="quote" id="q-c6f5c835f2" data-kw="">
<blockquote><p>Here the Lord Jesus Christ stands knocking at the Laodicean’s door; He would fain have them to sup with Him, and that He might sup with them; that is, that they might have intimate communion and fellowship one with another. Now, pray tell me, what preparations or qualifications had these Laodiceans to entertain Christ? Surely none; for they were lukewarm, they were ‘neither hot nor cold,’ they were ‘wretched, and miserable, and poor, and blind, and naked’; yet Christ to show his free grace and his condescending love, invites the very worst of sinners to open to Him, though they were no ways so prepared or qualified to entertain Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices in Works, vol. 1, Appendix</cite>, pp. 147-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

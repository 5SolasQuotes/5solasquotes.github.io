<blockquote><p>…it is not only a liberty but a duty of inferiors, not to receive for a thing lawful that which is enjoined by superiors, because they account it and call it such, but by the judgment of their own discretion following the rules of the Word, to try and examine whether the same be lawful or unlawful.</p></blockquote>

</figure><figure class="quote" id="q-eff02f040a" data-kw="">
<blockquote><p>…his [Christ’s] servants, who stood firm in their opposition to Prelacy… but if they will have patience to hear me to ‘Amen’ [at the end], I may possibly convince them of a truth they, are not willing to hear; for I not only grant that they have forgotten their Master’s directions, inhibiting them to to lift up themselves above their brethren… they must have leave to put out mine and other men’s eyes besides (which we are not willing to give them; though if any man would gratify his Grace [the king], and their Lordships [the prelates], he must part with these in the first place; for an implicit faith is the basis and foundation of their Kingdom of darkness, without which it would fall about their ears and but overwhelm them in the rubbish… before this come so much as under debate, almost with indifferent men, whether God be angry at their way? His very giving of them up to persecute his people &amp; servants, says nothing, if it say not this, that whatever be their outward prosperity, he has classed them with Pharaoh, in pouring out his plagues upon their heart…</p></blockquote>

</figure><figure class="quote" id="q-722a0ddd3a" data-kw="">
<blockquote><p>Though this [Syro-Phoenician / Canaanite] woman had not been regularly educated by any teacher, yet her faith in Christ was not a notion adopted by her at random, but was formed out of the law and the prophets. It was therefore not less absurd than wicked in that dog, Servetus, to abuse this example for the purpose of proving that faith may exist without promises. I do not deny that, in this sense, there may sometimes be a sort of implicit faith, that is, a faith which is not accompanied by a full and distinct knowledge of sound doctrine; provided we also hold that faith always springs from the word of God, and takes its origin from true principles, and therefore is always found in connection with some light of knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospels</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-cc4ddf99c3" data-kw="">
<blockquote><p>Again, as sanctification is imperfect, so faith has its degrees by which it increases and grows, both as to knowledge and as to trust. In this sense, we do not deny that faith can be called in a certain sense implicit, both in children and the uninstructed (who have only an obscure knowledge) and in the more advanced (in whom the light is always mixed with darkness, who often can reach only the fact [to hoti], but do not rise to the why [to dioti]). Thus the faith of the Old Testament fathers could be called obscure and implicit with respect to ours on account of the obscurity of the revelation. But the question is whether faith in its conception included knowledge; if not a full, still a true and certain knowledge in its own order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994) | 15th Topic, 9th Question, ‘Is faith assent without knowledge and can it be defined better by ignorance than by knowledge? We deny against the Romanists.’ in vol. 2, pp. 564-68, p. 565</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

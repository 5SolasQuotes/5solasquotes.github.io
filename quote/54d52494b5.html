<blockquote><p>Ver. 5. —But to him that worketh not, but we leave it on him that justifies the ungodly, his faith is counted for righteousness. But to him that worketh not.—This is entirely misunderstood by Dr. Macknight and Mr. Stuart, as if it meant, according to Dr. MacKnight, ‘one who does not work all that he is bound to do;’ or, according to Mr. Stuart, ‘the sinner who has not exhibited perfect obedience.’ It means, however, what it literally expresses, namely, that the person who is justified does not work at all for his justification. It is not that he does not perform all the works that he ought, but that for justification he does nothing. It is true that he works, but not for justification. Mr. Tholuck, who likewise misunderstands in this place the whole of the Apostle’s argument, seems to think that the case of Abraham is only an analogy, and not an example of justification by faith. But Abraham’s faith respected the Messiah, whose day he saw afar off, and by his righteousness he was justified. Justified the ungodly.—if the expression, ‘to him that worketh not,’ needed any explanation, this term—the ungodly—would place it meaning beyond all doubt. The term ungodly is applied throughout the Scriptures to wicked men, Rom v.6; 1 Tim ii. i.9; 1 Pet.iv.18; 2 Pet. ii.5, iii.7; Jude 4, 15. Men are ungodly in themselves, though, as soon as they are justified, they cease to be ungodly. They are ungodly till they believe; but in the moment that they receive the gift of faith, they are thereby united to the savior, and are instantly invested with the robe of righteousness, and also partake, according to the measure of their faith, of all those other graces that are received out of his fullness. They then passed from death to life,—A transition in which there is no medium; they are turned from darkness to light, and from the power of Satan unto God; for till then, being without Christ, they are the children of the devil. They cannot at the same time be both dead and alive–under the power of God, and under the power of the devil; they must in every instance of their existence be either under the one or the other. In that moment, then, in which they believe, they are justified; and to justify, signifies not to treat men as if they were just or righteous, though they are not so, but because they are in truth righteous by imputation, really righteous, the law having been fulfilled in them, ch. viii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-haldane.html">Robert Haldane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Epistle to the Romans</cite>, (Edinburgh: The Banner of Truth Trust, 1996, repr. from 9th edition, 1874), 165 (on Rom 4:5).</span></figcaption>

<blockquote><p>§IV. For first, whereas justification before God is but one, wherein the Lord by imputation of Christ’s righteousness to a believing sinner does absolve him from his sins and also accepts of him as righteous in Christ, not only in the first moment of justification, wherein being a sinner in himself he was first constituted righteous in Christ: but also in the continuance of justification, wherein the believer being still a sinner in himself, is continued in the favor of God by the merits and intercession of Christ: and though a sinner in himself, yet believing in Him that justifies a sinner, is made the righteousness of God in Christ.</p></blockquote>

</figure><figure class="quote" id="q-eca3f1de29" data-kw="">
<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>

<blockquote><p>Again (in the second place), this fulfilling of the Law, or obedience towards the Law, is indeed righteousness, when it is complete; but in us it is small and impure. (For, although they have received the first-fruits of the Spirit, and the new, yea, the eternal life has begun in them, there still remains a remnant of sin and evil lust, and the Law still finds much of which it must accuse us.) Accordingly, it is not pleasing for its own sake, and is not accepted for its own sake. But although from those things which have been said above it is evident that justification signifies not only the beginning of the renewal, but the reconciliation by which also we afterwards are accepted, nevertheless it can now be seen much more clearly that the inchoate fulfilling of the Law does not justify, because it is accepted only on account of faith.</p></blockquote>

</figure><figure class="quote" id="q-c88e043db4" data-kw="">
<blockquote><p>It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>

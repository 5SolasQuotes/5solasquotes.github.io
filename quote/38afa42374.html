<main class="wrap"><figure class="quote" id="q-38afa42374" data-kw="">
<blockquote><p>…Aquinas’s conception of the resurrection… holds that the soul of a person persists between death and resurrection, so that there is continuity between the person who died and the later person whose body is indistinguishable from that of the person who died. If Socrates is ressurected, he will be Socrates and not a mere replica because the same one soul, which had informed the matter of Socrates’ body before he died, comes to inform that matter again… Another thing philoophy can tell us is that if a resurrection were to occur, only God could bring it about. That, in any event, was Aquinas’s view (Cf. Summa Theologiae, Supplement, 75.3). Natural material causes can no more reunite soul and body than they could generate a soul in the first place. Nor could even an angelic intellect reunite a soul and its body, since angels can only manipulate natural causes, even if they can do so more powerfully than we can (Cf. Summa Theologiae I.65.3-4 and I.105.1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, pp. 519-21 of Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>

<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways:

I. As God.

II. As Judge of the World.

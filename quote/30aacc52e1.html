<main class="wrap"><figure class="quote" id="q-30aacc52e1" data-kw="">
<blockquote><p>…asking the General Assembly to take such action in the case of members of the Church who remove, without certificate, or who fail, for a length of time, to attend upon the ordinances of the gospel, as will secure constitutional and uniform action throughout the Presbyterian churches… It [a session or presbyterial court] can do what it pleases, as a Church court, provided it infringes on no article of its contract with other courts, and on no principle of the Word of God. It has no need therefore to go to the General Assembly to ask power to do what from its very nature as a Church court it has the right to do. A session must have a right to say who are the members of the church over which it presides. It might as well ask for power to erase from its roll the names of the dead, as to seek authority to say that those who have left them and wandered off no one knows where, have left them, and are no longer under their watch and care… According to our view the sessions have all the power they need in this matter inherent in themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 12, section 1, ‘The Session says who are church members’ (1850), pp. 190-91</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de92034391" data-kw="">
<blockquote><p>…for an excommunicate[d] person may remain externally without the Covenant to the visible Church, when baptism remains a seal, and may be a seal of a grace or privilege, which is interrupted or removed in act, but remains in habit: as to be the eldest son of a king may be a seal of the son’s heirship, and yet he may for a fault be disherited and cast out of his place. The Church and Church-membership are relata secundum esse [related according to being], not secundum dici [according to speaking] only, or relata [Greek]: but baptism and Church-membership are not so perfect relatives, but baptism does remain and the Church-membership may be dissolved: as the burgess ticket whereby a man has right to all the city privileges may remain, when the man for some crime committed against the city has lost all his city privileges and is not now a free citizen, in which case his burgess ticket seals nothing to him: So baptism seals not actual membership in case of excommunication, yet remains baptism valid in the acts of sealing other things [such as the invisible promises of God to the elect and regenerate, the forgiveness of sins, etc.].</p></blockquote>

</figure><figure class="quote" id="q-e72ea9db60" data-kw="">
<blockquote><p>…I grant that persons grosly ignorant and notoriously scandalous and impenitent ought to be excluded from the Lord’s Supper, but it must be done by them only to whom God has given this power, and in such order and manner as the Lord has appointed. That is necessary (says Mr. [John] Ball in his Tryal of the Grounds Tending to Separation, p. 190) to them that have received commission from God, which is unlawful to them that want authority. In the commonwealth the execution of justice is necessary; but private persons must not challenge the sword of the magistrate. In a corporation no one must take that upon himself which belongs to the common-council. Holy things must not be given to prophane persons; but every one at his pleasure must not deny holy things to unholy persons, but unholy persons must be debarred from holy things in such order as God has prescribed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650), p. 46 Jeanes was an English presbyterian.</span></figcaption>

</figure><figure class="quote" id="q-5abcc2c690" data-kw="">
<blockquote><p>But for such as are excommunicated because of some particular scandal, as incest, or a particular heresy, and yet profess the truth, as to all other points, they are members cut off, and yet not cut off, in so far as they retain a profession, yea and to the knowledge of the Church, are visible converts, though in one particular scandal they lie without and give not such evidences of repentance [so] as [that] the Church can pardon them, as may be proven from the 2 Cor. 2:6-9; they are ordinary hearers of the Word, as such as must be reclaimed by the preached Word, as sick children, under the medicinal cure of [lesser] excommunication, and the preached Word that the spirit may be saved in the Day of the Lord (1 Cor. 5), but they are not ordinary hearers as visible professors [simply, who have not been excommunicated], nor are they members complete [communicant] of the Church in the inner court, admitted to the seals; 2. 2 Thess. 3:14-15, They are cut off members, yet not counted as enemies, but to be admonished as brethren. Therefore, though they be [in Greek] as heathens and publicans, Mt. 18, yet are they not simply to be counted pagans, nor occasional hearers, as pagans, but brethren: and though Mr. [John] Robinson [a Separatist], and some say the place, 2 Thess. 3, is not meant of excommunicated persons, beside that it is against the text, against the current of sound interpreters, yet it proves our point, that even such as walk disorderly, [in Greek], verse 11, and obey not the doctrine of the Gospel, and with whom we should not keep company, v. 14, and so ought to be excommunicate, by Mr. [Thomas] Hooker’s doctrine [a congregationalist], yet remain brethren, and are to be counted so by members of the Church, and are to hear the word of admonition, and so are visible professors, and so not utterly cast out of the visible Church, and Mr. Hooker doth no more refute our Protestants, than the Scripture who calls such as are fed, and the hearers of the Lord’s testimonies, the Israel of God, and the sheep of his pasture, his flock, inheritance, his vineyard his garath[?] of red vine, his spouse, and what is this but the Church visible, Ps. 147:19-20; Hos. 8:11. What? because the excommunicated who thus hear ordinarily are not members of the Church, because they are not whole and entire members, it is no more consequently spoken, than if he would say a wounded soldier, because he is wounded, and under cure, is not a member of the army and sworn to the colors, because he cannot march and fight as other soldiers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the Churches of New England is now Re-Examined (London, 1658), bk. 1, ch. 5, pp. 20-21</span></figcaption>

uch as are fed, and the hearers of the Lord’s testimonies, the Israel of God, and the sheep of his pasture, his flock, inheritance, his vineyard his garath[?] of red vine, his spouse, and what is this but the Church visible, Ps. 147:19-20; Hos. 8:11. What? because the excommunicated who thus hear ordinarily are not members of the Church, because they are not whole and entire members, it is no more consequently spoken, than if he would say a wounded soldier, because he is wounded, and under cure, is not a member of the army and sworn to the colors, because he cannot march and fight as other soldiers.”

— Samuel Rutherford, A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker… wherein the way of the Churches of New England is now Re-Examined (London, 1658), bk. 1, ch. 5, pp. 20-21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+for+such+as+are+excommunicated+because+of+some+particular+scandal%2C+as+incest%2C+or+a+particular+heresy%2C+and+yet+profess+the+truth%2C+as+to+all+other+points%2C+they+are+members+cut+off%2C+and+yet+not+cut+off%2C+in+so+far+as+they+retain+a+profession%2C+yea+and+to+the+knowledge+of+the+Church%2C+are+visible+converts%2C+though+in+one+particular+scandal+they+lie+without+and+give+not+such+evidences+of+repentance+%5Bso%5D+as+%5Bthat%5D+the+Church+can+pardon+them%2C+as+may+be+proven+from+the+2+Cor.+2%3A6-9%3B+they+are+ordinary+hearers+of+the+Word%2C+as+such+as+must+be+reclaimed+by+the+preached+Word%2C+as+sick+children%2C+under+the+medicinal+cure+of+%5Blesser%5D+excommunication%2C+and+the+preached+Word+that+the+spirit+may+be+saved+in+the+Day+of+the+Lord+%281+Cor.+5%29%2C+but+they+are+not+ordinary+hearers+as+visible+professors+%5Bsimply%2C+who+have+not+been+excommunicated%5D%2C+nor+are+they+members+complete+%5Bcommunicant%5D+of+the+Church+in+the+inner+court%2C+admitted+to+the+seals%3B+2.+2+Thess.+3%3A14-15%2C+They+are+cut+off+members%2C+yet+not+counted+as+enemies%2C+but+to+be+admonished+as+brethren.+Therefore%2C+though+they+be+%5Bin+Greek%5D+as+heathens+and+publicans%2C+Mt.+18%2C+yet+are+they+not+simply+to+be+counted+pagans%2C+nor+occasional+hearers%2C+as+pagans%2C+but+brethren%3A+and+though+Mr.+%5BJohn%5D+Robinson+%5Ba+Separatist%5D%2C+and+some+say+the+place%2C+2+Thess.+3%2C+is+not+meant+of+excommunicated+persons%2C+beside+that+it+is+against+the+text%2C+against+the+current+of+sound+interpreters%2C+yet+it+proves+our+point%2C+that+even+such+as+walk+disorderly%2C+%5Bin+Greek%5D%2C+verse+11%2C+and+obey+not+the+doctrine+of+the+Gospel%2C+and+with+whom+we+should+not+keep+company%2C+v.+14%2C+

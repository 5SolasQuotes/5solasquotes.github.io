<main class="wrap"><figure class="quote" id="q-71689aa8be" data-kw="">
<blockquote><p>The Greek word κατηχησις (catechesis) is derived from κατηχεω (catecheo), as κατχισμος (catechismos) is from κατχιζω (catechizo). Both words, according to their common signification, mean to sound, to resound, to instruct by word of mouth, and to repeat the sayings of another. κατηχεω (catecheo) more properly, however, signifies to teach the first principles and rudiments of some particular doctrine. As applied to the doctrine of the church, and as understood when thus used, it means to teach the first principles of the Christian religion, in which sense it occurs in Luke 1:4, Acts 18:25, Galatians 6:6, etc. Hence, catechesis in its most general and comprehensive sense, means the first brief and elementary instruction which is given by word of mouth in relation to the rudiments of any particular doctrine. As used by the church, however, it signifies a system of instruction relating to the first principles of the Christian religion, designed for the ignorant and unlearned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus Doctrinae Orthodoxae on Heidelberg Catechism Q. 30</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ece284cd1" data-kw="">
<blockquote><p>But seeing, as I proved, there ought to be a communion between all particular churches, not only in profession of the same faith, but also in the same specifical, and where it is possible, numerical worship, the refusing to hold this union and communion, in doctrine or worship, has the nature, and well deserves the name, of schism.</p></blockquote>

</figure><figure class="quote" id="q-53fccf7f2e" data-kw="">
<blockquote><p>…[by] the abrogation of these ceremonies [of preparing manna the day before and not kindling a fire in the wilderness on the Sabbath by the Israelites] ought not Christians to turn into surquedry [arrogance] and excess of feasting (as too many do) so abusing their christian liberty: but to be used with all sobriety, such as may not hinder, but help the holy spiritual duties of this day by a due refreshing of the body, for necessity, not for superfluity. … So that the whole worship and service of God, and his saving knowledge for man’s salvation (to speak nothing of bodily refreshing and works of charity for the relief of the poor) having a necessary dependance, as touching the external means, upon the due observation of the Fourth Commandment in the morality of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law &amp; the Gospel Reconciled</cite>, … (London: Slatter, 1631), pp. 40-41</span></figcaption>

</figure><figure class="quote" id="q-74af20edbe" data-kw="">
<blockquote><p>From this cause [native depravity] it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible. Yet even to these, the truths committed to memory are now of great utility. They are like a treasure which has been hidden, but is now discovered. Of two persons under conviction of sin, one of whom has had sound religious instruction, and the other none, the former will have an unspeakable advantage over the latter in many respects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>

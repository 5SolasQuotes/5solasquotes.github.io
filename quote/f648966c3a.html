<main class="wrap"><figure class="quote" id="q-f648966c3a" data-kw="">
<blockquote><p>Now when we hear of as strange a thing as this to have fallen out not long since in Bedfordshire; as namely, a match at Foot-ball, being appointed on the Lord’s Day in the afternoon; while two were in the Belfry, and one of them tolling a bell to call the company together, there was heard a clap of thunder and lightning, seen by some sitting in the Church-porch, as it came thorow a dark lane towards the Church and flashed in their faces who sate in the Church-porch, and seared them; thence it went into the Church, and turning into the Belfry, tripped up his heels who was tolling the bell, and struck him stark dead; and the other with him blasted in such manner, that shortly after he died; we do not call this a miracle, though we count it a remarkable judgement of God, and such as deserves to be considered, and seriously laid to heart by all, to admonish them to take heed, that they may be not found in like manner profaners of the Lord’s day.

In like sort when upon fresh relation we hear of the like sport at Foot-ball on the Lord’s day, at a place called Tidworth, after Evening prayer in the Church-yard, and that therein one had his leg broken, which thereupon gangrened, so that forthwith he died thereof; we do not call this a miracle; only it calls to our mind that of the Prophet, The Lord hath so done his marvellous works, that they ought to be had in remembrance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment, as still in force to bind Christians</cite>, (London, 1641), pp 29-30.</span></figcaption>

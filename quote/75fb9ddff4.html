<main class="wrap"><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/the-pope-as-antichrist.html">The pope as Antichrist</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-535aa9bb74" data-kw="">
<blockquote><p>Accordingly, he hesitates not to strip Christ in order that he may deck his Pope with the spoils. The Pope, he says, came a light into the world. Blasphemous mouth! will you apply to that fetid monster of yours sacred terms applicable to none but the Son of God?</p></blockquote>

</figure><figure class="quote" id="q-3691a951d9" data-kw="">
<blockquote><p>They usurp the divinity and office of Christ. The effect is the same as if they said, &quot;I am Christ; I am a Savior. I save myself and others.&quot; This is the impression the monks give out. The Pope is the Antichrist, because he is against Christ, because he takes liberties with the things of God, because he lords it over the temple of God.</p></blockquote>

</figure><figure class="quote" id="q-e515d7fb38" data-kw="">
<blockquote><p>Secondly, the pope is not infallible in doctrine or in practice. Some have been exceptionally ungodly, having been fornicators, occultists, heretics, and atheists; this has been confirmed by papal chroniclers. How can such individuals function as infallible judges in disputes that relate to doctrinal issues?</p></blockquote>

</figure><figure class="quote" id="q-44327ec6c7" data-kw="">
<blockquote><p>Has it never occurred to you that the pope, cardinals, bishops, monks, and that the whole synagogue of Satan are trouble-makers? The truth is, they are worse than false apostles. The files [sic] apostles taught that in addition to faith in Christ the works of the Law of God were necessary unto salvation. But the papists omit faith altogether and teach self-devised traditions and works that are not commanded of God, indeed are contrary to the Word of God, and for these traditions they demand preferred attention and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 22</span></figcaption>

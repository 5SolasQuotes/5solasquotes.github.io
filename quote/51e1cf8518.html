<blockquote><p>Over the coming months we will be posting a lot of quotes from the Reformer, Martin Bucer. He was a major influence on the shaping of Reformed theology, and had a very big influence upon the English Reformation. His book De Regno Christi has been translated into English, and can be purchased from here (sadly, not all chapters were translated). In this quote, Bucer upholds the Bible’s command to root out incorrigible criminals:

Thirdly, it is common to the kingdoms of this world and to the Kingdom of Christ that they should tolerate the wicked while they lie hidden among the good; but when they have done their impious misdeeds openly, and will not change their ways when corrected, it is proper to remove them from the commonwealth, as Plato indicates in his Politics. For the Lord has commanded his people quite strictly that they are to drive criminal and incorrigible men from their midst, and to burn them with fire, and thus to wipe out their offensiveness as completely as possible (Deut. 13:5 ff; 17:2-5; 19:11-21; 21:18-21; 22:13-28 and 24:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 181.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>To destroy our own lives is A SIN AGAINST GOD. That God is the Author of our existence; that he sent us into the world; and that our time and talents, as well as our persons, are his property, are self-evident propositions, which none but an atheist will deny. … But if there be a God who made us, who has a right to our services, and whose Providence extends to all his creatures and all their actions, then there is an end for which we were made, a task which we are bound to accomplish, a term of service which it is our duty to fulfil; and, of course, he alone who placed us here, has a right to decide when this task is done, to judge when this term of service ought to close, and, in a word, to dispose of the life and the talents which his power has bestowed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Guilt, Folly, and Sources of Suicide: Two Discourses, Preached in the City of New-York, February, 1805</cite>, (New York: T. and J. Swords, 1805), pp 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>[O]bserve the explanation, the origin, of persecution. It originates in the world’s hatred to Christ, and is directed against him. It must be so, seeing that Christ liveth in his people. Saul, Saul, wasting the Church, why persecutest thou me? And it is no extenuation of the world’s guilt in hating the saints, that they do not believe that Christ liveth in them—that they do not know or recognise Christ in them. Their rejection of those that are his stands exactly on the same footing with their rejection of him: “Henceforth the world knoweth us not, because it knew him not.”

Depravity blinded the world to the glory of Christ when he came in his own person, and blinds them to the measure of his glory in which he comes in the persons of his people. The bitter Ishmaelitish laugh and jest with which you, the worldling, scorn the Isaac of God, the promised seed; the hard words or hard deeds with which you, born after the flesh, persecute him that is born after the Spirit, will bear no excuse from your assertion that you did not know, you did not think, you did not see, that Christ was living in him—that it was really the promised Seed of the woman, Messiah himself, you were persecuting. For it is only your hatred and bitter prejudice that blind you. If you feared God and loved Christ, you would see him in his people: They that fear thee shall rejoice when they see me trusting in thy word; — “they shall glorify Christ in me.”

Ah ! consider, in your dislike of those that are Christ’s; in your suspicion of them; your hard thoughts and hard speeches concerning them; your discomfort in their presence when their godliness, their Christliness, comes out; your scornful joy over their infirmities and failures; —consider what a proof you have in all this of your deadly enmity to that Christ who liveth in them. You cannot but know that as yet Christ liveth in them only partially. If Christ is in them, the body is dead because of sin, though the Spirit is life because of righteousness. A body of sin and death is in them, as well as a living Christ. And that body of sin and death is a drawback on the completeness of the life and likeness of Christ in his people. They profess to give no more than a partial, though still a real, representation of Christ. They profess no more, though they long that it were far more, yea, long that it were unbroken and complete.

But were it so,—were their infirmities removed, their remaining corruption finally suppressed and extinguished; were there absolutely nothing seen or extant in them any more save Christ living in them in the unabated fulness and energy of his Holy grace and life; ah! you know that their society would be unspeakably more painful to you still; their Christliness would rebuke you more powerfully than now; your withdrawal from them, if withdrawal were possible, would be more complete: or if you could not escape their presence and their intercourse—if you found yourself in relations to them which you could not set aside—if you found them a people with whom, in their perfect righteousness, and holiness, and likeness to Christ, you could not but have to do,—ah! would not your dislike to them, your rejection of them, your resentment against them and their piety, break out in manifold strength and bitterness?

And what is this but just a proof that the more clearly Christ is revealed to you, the nearer Christ is brought to you, so much the more do you dislike him; and that were Christ, therefore, to come to you, not only in his own personal perfection in his people, but in himself, in his own perfect person, you would fully and finally reject Aim, and say, Depart from us, for we desire not thee, nor the knowledge of thy ways?” Ah! forget not that it is this, indeed, you do say, when now you reject his people. You reject, you persecute, him in them; for Christ liveth in them.

But let believers know what they are to expect at the world’s hands, and why. “Christ living in you” will not fare any better at the world’s hands than Christ sojourning in the world in the days of his flesh. The world is the same now as then. Christ in you is the same Christ as then. If they have kept his sayings, they will keep yours also; if they have persecuted him, they will persecute you. The servant is not greater than his Lord; it is enough if the servant be as his Lord. And it must be so, if his Lord liveth in him. Christ in his own person was the object of the world’s malice. Christ living in you will be so still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Treasury Pulpit. No. III. “Christ Liveth in Me. ’, Family Treasury of Sabbath Reading</cite></span></figcaption>

fection+in+his+people%2C+but+in+himself%2C+in+his+own+perfect+person%2C+you+would+fully+and+finally+reject+Aim%2C+and+say%2C+Depart+from+us%2C+for+we+desire+not+thee%2C+nor+the+knowledge+of+thy+ways%3F%E2%80%9D+Ah%21+forget+not+that+it+is+this%2C+indeed%2C+you+do+say%2C+when+now+you+reject+his+people.+You+reject%2C+you+persecute%2C+him+in+them%3B+for+Christ+liveth+in+them.%0A%0ABut+let+believers+know+what+they+are+to+expect+at+the+world%E2%80%99s+hands%2C+and+why.+%E2%80%9CChrist+living+in+you%E2%80%9D+will+not+fare+any+better+at+the+world%E2%80%99s+hands+than+Christ+sojourning+in+the+world+in+the+days+of+his+flesh.+The+world+is+the+same+now+as+then.+Christ+in+you+is+the+same+Christ+as+then.+If+they+have+kept+his+sayings%2C+they+will+keep+yours+also%3B+if+they+have+persecuted+him%2C+they+will+persecute+you.+The+servant+is+not+greater+than+his+Lord%3B+it+is+enough+if+the+servant+be+as+his+Lord.+And+it+must+be+so%2C+if+his+Lord+liveth+in+him.+Christ+in+his+own+person+was+the+object+of+the+world%E2%80%99s+malice.+Christ+living+in+you+will+be+so+still.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Treasury+Pulpit.+No.+III.+%E2%80%9CChrist+Liveth+in+Me.+%E2%80%99%2C+Family+Treasury+of+Sabbath+Reading&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23927b3519.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23927b3519.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/03/17/hugh-martin-on-the-origin-of-persecution/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>47. The matter may further be thus illustrated: there is almost the like respect and consideration of the magistrate as he is occupied about the outward things of the church, and of the ecclesiastical ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience.

It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the word of God, and out of it to show the magistrate his duty, to wit, how he ought to govern the commonwealth, and in what manner he ought to use the sword. The former is proper and peculiar to the magistrate (neither doth the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers.</p></blockquote>

</figure><figure class="quote" id="q-b57ddc9abb" data-kw="">
<blockquote><p>[T]he purity and power of religion alone, doth truly honour all honours, dignify all dignities, actuate with acceptation and life all moral virtues and endowments of art, sweeten all government, strengthen all states, settle fast all imperial crowns upon princes’ heads. It is no humorous conceit, but a matter of sound consequence, that all, either personal duties, or employments of state, are by so much the better performed, by how much the men are more religious from whose abilities the same proceed. When heaven is made too much to yield to earth, piety to policy, public good to private ends, there authority is embittered, inferiors plagued, and, too often, law and justice turned into wormwood and rapine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Directions for a Comfortable Walking with God</cite>, (1626; Ligonier PA: Soli Deo Gloria, 1991), xv-xvi.</span></figcaption>

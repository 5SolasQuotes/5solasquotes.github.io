<main class="wrap"><figure class="quote" id="q-3b81b6dfab" data-kw="silence reverence mystery">
<blockquote><p>“The begetting of God is to be honored by silence; the great thing is for you to learn he was begotten,” as Gregory Nazianzus puts a stop to our curiosity when he wishes it to be reverenced in silence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31e8f5750b" data-kw="predestination curiosity forbidden">
<blockquote><p>The subject of predestination, which in itself is attended with considerable difficulty is rendered very perplexed and hence perilous by human curiosity, which cannot be restrained from wandering into forbidden paths and climbing to the clouds determined if it can that none of the secret things of God shall remain unexplored. When we see many, some of them in other respects not bad men, every where rushing into this audacity and wickedness, it is necessary to remind them of the course of duty in this matter. First, then, when they inquire into predestination, let then remember that they are penetrating into the recesses of the divine wisdom, where he who rushes forward securely and confidently, instead of satisfying his curiosity will enter in inextricable labyrinth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.1</span></figcaption>

</figure><figure class="quote" id="q-6c89d40c2b" data-kw="reverence decrees humility">
<blockquote><p>Although Christian piety might readily spare this question, if men, content with the things revealed, would be content with knowing sensibly and would never strive to break into the secrets of God, for the purpose of rashly searching into his inscrutable counsels and minutely dividing his decrees (as if God was to be measured by the human rule); still the pertinacity of our adversaries has rendered it necessary in some degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.1</span></figcaption>

</figure><figure class="quote" id="q-44e1b8aa9a" data-kw="">
<blockquote><p>We must receive God’s promises in such wise, as they be generally set forth to us in Holy Scripture: and, in our doings that will of God is to be followed, which we have expressly declared unto us in the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 17</span></figcaption>

</figure><figure class="quote" id="q-f426fefa18" data-kw="persuaded free mercy election">
<blockquote><p>We shall never feel persuaded as we ought that our salvation flows from the free mercy of God as its fountain, until we are made acquainted with his eternal election, the grace of God being illustrated by the contrast--viz. that he does not adopt all promiscuously to the hope of salvation, but gives to some what he denies to others. It is plain how greatly ignorance of this principle detracts from the glory of God, and impairs true humility. But though thus necessary to be known, Paul declares that it cannot be known unless God, throwing works entirely out of view, elect those whom he has predestined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-19e307d759" data-kw="">
<blockquote><p>The law is the Word in which God teaches and tells us what we are to do and not to do, as in the Ten commandments. …The other word of God is not Law or commandment, nor does it require anything of us; but after the first Word, that of the Law, has done this work and distressful misery and poverty have been produced in the heart, God comes and offers his lovely, living Word, and promises, pledges, and obligates himself to give grace and help, that we may get out of this misery and that all sins not only be forgiven but also blotted out and that love and delight to fulfill the law may be given besides. See, this divine promise of his grace and of the forgiveness of his is properly called Gospel. And I say again and yet again that you should never understand Gospel to mean anything but the divine promise of his grace and of the forgiveness of sin. For this is why hitherto St. Paul’s epistles were not understood and cannot be understood by our adversaries even now; they do not know what Law and Gospel really are. For they consider Christ a Legislator and the Gospel nothing but the teaching of new laws. This is nothing else but locking up the gospel and obscuring everything. For “Gospel” is Greek and means “good news,” because in it is proclaimed the saving doctrine of life, of the divine promise, and grace and the forgiveness of sins are offered. Therefore works do not belong to the gospel; for it is not laws but faith alone, because it is nothing whatever but the promise and offer of divine grace. He, then, who believes the Gospel receives grace and the Holy Spirit. Thereby the heart becomes glad and joyful in God and then keeps the Law gladly and freely, without the fear of punishment and without the expectation of reward; for it is sated and satisfied with that grace of God by which the law has been satisfied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Sermons</cite>, trans. John Nicholas Lenker and Eugene F. A. Klug, 7 vols (Grand Rapids: Baker, 2000), 1.99</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.1</span></figcaption>

<blockquote><p>9. From this speciall and proper way of governing reasonable Creatures, there ariseth that covenant, which is between God and them. For this covenant is as it were a certaine transaction of God with the Creature, whereby God commandeth, promiseth, threatneth, fulfilleth, and the Creature doth tie it selfe in obedience to God thus covenanting. Deut. 26. 16, 17, 18, 19. This day Jehova thy God commandeth thee. &amp;c. Thou hast avouched this day the Lord to be thy God, &amp;c. Jehova hath avouched thee this day, &amp;c. To make thee high, &amp;c. And that thou mayest be an holy people, &amp;c. 10. Now because this way of entring into covenant is not between those that are equall, but between Lord and servant. Therefore it pertaines to government, whence also it is most properly called not the covenant of man, but of God, who is the author, and chiefe Executor of it. Deut. 8. 17. 18. That he may performe his covenant. 11. By vertue of this covenant the morall workes of the intelligent Creature, whilst he is in the way, have alwayes a respect, either to happinesse as a reward, of to unhappinesse as a punishment: but in the last there is meriting, but in the other not. 12. Hence the proper and highest difference of a good work and sinne doth flow, namely in that a good worke is an operation expecting happinesse of another by way of reward: as by the opposite privation of it, evill workes are made in their kind extreamly evill. 13. Hence ariseth the force &amp; reason of conscience, which is the judgement of an intelligent Creature of it selfe, as he is subjected to God. 14. Speciall government of the reasonable Creature is of Angels and men. 15. Speciall government of Angels, is either a speciall prescription, or ordering the event that followes upon it. 16. This was the same Law as touching the substance, with the morall Law which is contained in the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, (1642 edn), 51–52.</span></figcaption>

</figure><figure class="quote" id="q-ea1baf7f9a" data-kw="two tables four and six">
<blockquote><p>Some assign five precepts to each table: as Josephus, “Moses brings forward two tables containing ten written precepts, five on each,” whom Philo follows and, of the fathers, Irenaeus. But this is false because Christ comprehends the fifth precept under the second table (Mt. 19:18); and Paul also when he calls it the first commandment of the second table with promise (Eph. 6:2). For in the first table, a promise is given in the second precept. Also the nature of the thing proves it because some are duties of religion towards God (prescribed in the first table), others of love and reverence for superiors (prescribed in the second table).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.5.2</span></figcaption>

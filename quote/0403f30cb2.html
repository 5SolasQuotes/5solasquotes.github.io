<main class="wrap"><figure class="quote" id="q-0403f30cb2" data-kw="">
<blockquote><p>For we are as much obliged to believe non-fundamentals that are clear (as that there were eight persons saved in the ark, and the old world drowned with waters, Sodom burnt with fire), as to believe fundamentals, that there is no name whereby men may be saved, but by the name of Jesus, for the Authority of God speaking in his Word and his command does equally oblige to both; but there is no such necessity so absolute in believing non-fundamentals, as in believing these, without the knowledge whereof, we cannot be saved. But it never follows that errors in non-fundamentals published and taught to the ruin of the souls of many, they having such a strong connection and influence on the knowledge of fundamentals, are to be tolerated since our sinning here does as equally and strongly strike against the authority and express command of God (at least in most things of that kind) as in points fundamental; and therefore the magistrate, who is to look to the honor of God as a Christian, and peace of societies in all, is as much obliged to punish clearly opened, non-fundamental, as fundamental, false doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, ... (London, 1649), ch. 10, p. 124</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>6. They [civil magistrates] may, and ought to interpose their authority, for inhibiting the receiving and hearing, or conversing with known and manifest seducers: for, this is but to discharge, and thereby to preserve the people from running to their own hazard, even as men ought to be commanded to keep at distance with a place or person suspected to be infectious because of the pestilence; Neither could such a restraint be accounted any diminution of their just liberty, yea this were but a putting to of their sanction to the clear direction which the Lord lays upon His people, and therefore there could be no hazard to miscarry in it, especially where the application to such and such persons, might be as clearly discernable from the Word as the duty is.</p></blockquote>

<blockquote><p>XV. (8) Next is the calumny [of Papists against the Reformed] concerning independency, in the church as well as in the state, which causes us to recognize no authority in the church and to be hostile to superior powers. But nothing could be said more unjustly and be more foreign to our religion… We leave independency to those who withdraw themselves from the jurisdiction of the magistrate [such as Romanists] and think they are raised so far above kings that their crowns depend upon them, which they can confer or take away at pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.145</span></figcaption>

</figure><figure class="quote" id="q-0350d090e9" data-kw="">
<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

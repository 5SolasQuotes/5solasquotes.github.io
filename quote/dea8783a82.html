<blockquote><p>The beauty in creation all around us, the work of God, causing us great delight and marvel, this being an end in its own right, reveals that perfection of blessedness, beauty and delight that is supremely and absolutely in God Himself, the ultimate and last end.</p></blockquote>

<blockquote><p>What we call beautiful in objects, to speak in the mathematical style, seems to be in a compound ratio of uniformity and variety; so that where the uniformity of bodies is equal, the beauty is as the variety; and where the variety is equal, the beauty is as the uniformity.</p></blockquote>

<blockquote><p>This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect: 1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them. 2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.</p></blockquote>

<blockquote><p>Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.”

— Thomas Aquinas, Summa, 2nd pt. of 2nd pt., question 158, ‘Anger’, article 2, ‘Whether anger is a sin’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnger%2C+as+stated+above+%28Article+1%29%2C+is+properly+the+name+of+a+passion.+A+passion+of+the+sensitive+appetite+is+good+in+so+far+as+it+is+regulated+by+reason%2C+whereas+it+is+evil+if+it+set+the+order+of+reason+aside.+Now+the+order+of+reason%2C+in+regard+to+anger%2C+may+be+considered+in+relation+to+two+things.+First%2C+in+relation+to+the+appetible+object+to+which+anger+tends%2C+and+that+is+revenge.+Wherefore+if+one+desire+revenge+to+be+taken+in+accordance+with+the+order+of+reason%2C+the+desire+of+anger+is+praiseworthy%2C+and+is+called+%E2%80%9Czealous+anger%E2%80%9D+%5BCf.+Gregory%2C+Moral.+v%2C+45.+On+the+other+hand%2C+if+one+desire+the+taking+of+vengeance+in+any+way+whatever+contrary+to+the+order+of+reason%2C+for+instance+if+he+desire+the+punishment+of+one+who+has+not+deserved+it%2C+or+beyond+his+deserts%2C+or+again+contrary+to+the+order+prescribed+by+law%2C+or+not+for+the+due+end%2C+namely+the+maintaining+of+justice+and+the+correction+of+defaults%2C+then+the+desire+of+anger+will+be+sinful%2C+and+this+is+called+sinful+anger.+Secondly%2C+the+order+of+reason+in+regard+to+anger+may+be+considered+in+relation+to+the+mode+of+being+angry%2C+namely+that+the+movement+of+anger+should+not+be+immoderately+fierce%2C+neither+internally+nor+externally%3B+and+if+this+condition+be+disregarded%2C+anger+will+not+lack+sin%2C+even+though+just+vengeance+be+desired.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+2nd+pt.+of+2nd+pt.%2C+question+158%2C+%E2%80%98Anger%E2%80%99%2C+article+2%2C+%E2%80%98Whether+anger+is+a+sin%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4aab833104.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4aab833104.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=Anger%2

<main class="wrap"><figure class="quote" id="q-1d31dbb339" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker: ‘…But these three [qualifications are] assigned by Mr. Rutherford [in order to be accepted as a member of the Church]:

1. To profess the Faith;

2. Eagerly to desire the Seals;

3. To desire Church-fellowship, counting it a disparagement not to be born again, if not admitted to the Sacraments, [yet all this] may agree to a drunkard [according to Hooker].’ Answer: …if the [drunkard] man be a born heathen, and shall come to get these three requisites, and profess as Magus did, he is to be received a member: but if he hath not these three requisites, for he lives in sorcery, as Magus and Elymas, and opposeth the Gospel, the openly lying profession is scandalous; such a profession Mr. Rutherford saith is not his requisites: If he be a pagan, and continue in habitual drunkenness, he may be holden out while he gives evidences to others of amendment, and then he may be admitted to the outer court, as a hearer; though a profession of faith, if not belied with worshipping of false gods, can hardly consist with paganism [and hence he is part of the visible Church in some way and should therefore be a member of a church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14, Ch. 15, pp. 67-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=Mr.%20%5BThomas%5D%20Hooker,be%20a%20member%20of%20a%20church&amp;text=Mr.%20%5BThomas%5D%20Hooker&amp;text=should%20therefore%20be%20a%20member%20of%20a%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-6cbd577fcb" data-kw="">
<blockquote><p>That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr</cite>, [John] Owen… (London, 1657), ch. 5, pp. 89-90</span></figcaption>

</figure><figure class="quote" id="q-0ee44f02bd" data-kw="">
<blockquote><p>It is a common infirmity with many men to wish their opinions turned into laws. They think certain things right and expedient, and instead of being content to act on their own judgment, and allow others to act on theirs, they desire their view of the matter to be made obligatory on all their brethren… Another thinks that a regular dismission of a Church member should be given only in certain cases, and he wishes his private judgment to be turned into a public law. In an extended Church like ours, there are few evils which ought to be more sedulously avoided than excessive legislation. Leave as much liberty to all concerned as possible, if you wish to preserve peace or union. As to this question of communion, it is well known that there are two very different views arising out of different theories of the nature and design of the Church. The one view is that of the great body of the Christian world, and is the clear doctrine of our standards. It assumes that the terms of Christian communion are unalterably fixed in the Word of God, and can be neither increased nor diminished by any human authority. This is one great principle. Another is, that nothing can justly be required as a term of Christian communion, which Christ has not made necessary to admission to heaven. In other words, that we are bound to receive and treat as Christian brethren all whom Christ receives as disciples. We are not to make ourselves stricter or holier than He… Every Church must receive, in fact, all whom she regards as the true followers of Christ. Therefore, the lowest terms of salvation are the highest admissible terms of communion. If these principles are correct, it follows that however restrictive are the conditions a Church may see fit to establish as the terms of ministerial fellowship, it must recognize as a sister Church every body which holds and teaches the fundamental doctrines of the gospel, however erroneous it may be in other respects; and, therefore, it cannot with any consistency refuse either to receive members from such Church, or to dismiss them to it. That is, so far as general principles are concerned. For there may be particular cases in which, for special reasons, it is proper to refuse to receive a member from another Presbyterian church, belonging to our own body… The other radically different view of Christian communion is that which is characteristic of our Scotch brethren, and especially of the secession portion of them. They regard the Church so much as a witness for the truth, that they overlook its wider aspect as a “congregation of faithful men,” or ” the communion of saints.” They consider themselves, therefore, as joining in the testimony of any Church with which they commune; and they require all who wish to commune with them to join in their peculiar testimony, whatever it may be. Of course they cannot consistently commune themselves, nor allow their members to commune with any other than their own churches. Even some of the leaders of the Free Church of Scotland seemed, at first, in danger of falling into this false theory. They were in their zeal for cutting off all communion with the Established Church [of Scotland], lest, as they said, they should vitiate their testimony. Happily for them and the cause of Christ, this was a passing cloud. That Church has adhered to the scriptural doctrine, which has ever been held sacred by the great body of Protestants. Christian communion is communion of men as Christians, not as Presbyterians, Methodists, or Episcopalians. We recognize those with whom we commune, or to whom we dismiss our members, as Christians, and as nothing more. We give no sanction to their peculiarities, whatever they may be… We have so often heard the strongest feeling expressed by our pastors on this subject, that we are persuaded that any attempt of the General Assembly to prevent their enjoying on this subject the liberty wherewith Christ hath made them free, would be followed by the most unhappy consequences. We rejoice, therefore, in the wise disposition of this matter recorded above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 12 | section 5, ‘Dismission of Members to other Churches’ (1873) 236-39</span></figcaption>

e them free, would be followed by the most unhappy consequences. We rejoice, therefore, in the wise disposition of this matter recorded above.”

nditions+a+Church+may+see+fit+to+establish+as+the+terms+of+ministerial+fellowship%2C+it+must+recognize+as+a+sister+Church+every+body+which+holds+and+teaches+the+fundamental+doctrines+of+the+gospel%2C+however+erroneous+it+may+be+in+other+respects%3B+and%2C+therefore%2C+it+cannot+with+any+consistency+refuse+either+to+receive+members+from+such+Church%2C+or+to+dismiss+them+to+it.+That+is%2C+so+far+as+general+principles+are+concerned.+For+there+may+be+particular+cases+in+which%2C+for+special+reasons%2C+it+is+proper+to+refuse+to+receive+a+member+from+another+Presbyterian+church%2C+belonging+to+our+own+body%E2%80%A6+The+other+radically+different+view+of+Christian+communion+is+that+which+is+characteristic+of+our+Scotch+brethren%2C+and+especially+of+the+secession+portion+of+them.+They+regard+the+Church+so+much+as+a+witness+for+the+truth%2C+that+they+overlook+its+wider+aspect+as+a+%E2%80%9Ccongregation+of+faithful+men%2C%E2%80%9D+or+%E2%80%9D+the+communion+of+saints.%E2%80%9D+They+consider+themselves%2C+therefore%2C+as+joining+in+the+testimony+of+any+Church+with+which+they+commune%3B+and+they+require+all+who+wish+to+commune+with+them+to+join+in+their+peculiar+testimony%2C+whatever+it+may+be.+Of+course+they+cannot+consistently+commune+themselves%2C+nor+allow+their+members+to+commune+with+any+other+than+their+own+churches.+Even+some+of+the+leaders+of+the+Free+Church+of+Scotland+seemed%2C+at+first%2C+in+danger+of+falling+into+this+false+theory.+They+were+in+their+zeal+for+cutting+off+all+communion+with+the+Established+Church+%5Bof+Scotland%5D%2C+lest%2C+as+they+said%2C+they+should+vitiate+their+testimony.+Happily+for+them+and+the+cause+of+Christ%2C+this+was+a+passing+cloud.+That+Church+has+adhered+to+the+scriptural+doctrine%2C+which+has+ever+been+held+sacred+by+the+great+body+of+Protestants.+Christian+communion+is+communion+of+men+as+Christians%2C+not+as+Presbyterians%2C+Methodists%2C+or+Episcopalians.+We+recognize+those+with+whom+we+commune%2C+or+to+whom+we+dismiss+our+members%2C+as+Christians%2C+and+as+nothing+more.+We+give+no+sanction+to+their+peculiarities%2C+whatever+they+may+be%E2%80%A6+We+have+so+often+heard+the+strongest+feeling+expressed+by+our+pastors+on+this+subject%2C+that+we+are+persuaded+that+any+attempt+of+the+General+Assembly+to+prevent+their+enjoying+on+this+subject+the+liberty+wherewith+Christ+hath+made+them+free%2C+would+be+followed+by+the+most+unhappy+consequences.+We+rejoice%2C+therefore%2C+in+the+wise+disposition+of+this+matter+recorded+above.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+12+%7C+section+5%2C+%E2%80%98Dismission+of+Members+to+other+Churches%E2%80%99+%281873%29+236-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ee44f02bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ee44f02bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=It%20is%20a%20common%20infirmity%20with,disposition%20of%20this%20matter%20recorded%20above&amp;text=It%20is%20a%20common%20infirmity%20with%20many%20men&amp;text=the%20wise%20disposition%20of%20this%20matter%20recorded%20above" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-39f76ddc6f" data-kw="">
<blockquote><p>Till divine worship be given to a creature, it is not idolatry, although in the kind or means of worship there may be will-worship; and in the opinion of those that count their act or the object to be holy, when it is not, there may be superstition of the mind; and in the use of such things, or forbearing their use, superstition in the members…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667), ch. 7, section 15, ‘Kneeling in receiving the sacramental elements is not idolatry’</cite>, p. 259 Tombes (c. 1603–1676)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83366dc9c8" data-kw="">
<blockquote><p>The reasons the man adds of this his assertion contain the grand plea of all idolaters, heathenish and antichristian: &quot;Whatever is given to them,&quot; saith he, &quot;who are in that subordination is given to God.&quot; So said the Pagans of old, so say the Papists at this day; all redounds to the glory of God, when they worship stocks and stones, because he appoints them so to do. And so said the Israelites when they worshipped the golden calf: &quot;It is a feast to Jehovah.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae</cite>, ch. 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-bb2401ee82" data-kw="">
<blockquote><p>But as far as images are concerned, whether painted or sculpted, though we do not reject their use when sacred material or histories are represented, nevertheless we do not admit them in holy places without hesitation. Nor do we do we judge it prudent especially that sculpted images be set up in Temples, not because it is impious in and of itself, or because we think it not allowed, but rather because of the sad appearance of the Churches we see in Temples of the Papists, which took its origin from the use of Images and pictures… For this reason, though I completely concede that the use of images in which sacred things and histories are represented in temples is a matter of indifference (adiaphoron), nevertheless since people easily abuse thme when they are seen in sacred places, I think they do wisely who eliminate all these things from temples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4</cite>, pp. 469-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2</span></figcaption>

</figure><figure class="quote" id="q-e82de1bc9b" data-kw="">
<blockquote><p>But this sacred and holy image [of the glorified Christ in Rev. 1] instructs in all these points all the faithful of Christ most fully. Howbeit this image of Christ is not to be set forth with colors, since that colors cannot attain to the majesty thereof: but with the ecclesiastical doctrine, which has the promises of the Spirit of Christ: And is therefore more evident, and only meet for the true expressing thereof. Let us also print the same image, not upon any dead table with colors that will perish and fade, but in our hearts through the lively Spirit of God, which may also keep it in our minds, never to be wiped out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundred Sermons upon the Apocalypse of Jesus Christ… (London: 1561), 5th Sermon</cite>, p. 33</span></figcaption>

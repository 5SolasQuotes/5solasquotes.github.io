</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 18, ‘Understand well the necessity of your Communion with all the Universal Church, and wherein it consists, and how far to be preferred before your Communion with any particular Church’, pp. 115-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.”

</figure><figure class="quote" id="q-9a6ca930c0" data-kw="">
<blockquote><p>…I intend not in this relation to set down all things which they [the New England churches] hold or practice in discipline or church-government, but such things only or for the most part, wherein there lies some difference between them and us, or other the best Reformed Churches. Neither do I intend to wrap up all and every one of the elders (much less members) of the New England churches in the same imputations: Forasmuch as it is most certain that though in practice they act generally all alike, yet in their opinion of things practiced, much more in the grounds and reasons thereof, some of them do not only differ from the rest but have stiffly opposed the rest therein, which I write to preserve the just repute of some eminent persons there from such censures and hard opinions as others of them, perhaps, may seem to merit and incur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644) Rathband was a Westminster divine. | Preface</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4bdf077cb8" data-kw="">
<blockquote><p>…therefore all who would be saved, must join to a visible independent congregation [a congregationalist’s arguments conclude]; hence no Church has title and due right to the Word and sacraments but members of such a congregation: this is the reason why men of approved piety are denied the seales of the covenant, and their children excluded from baptism and themselves debarred from the Lord’s Supper, because they are not members of your congregation; and members they cannot be, because they find no warrant from God’s Word, to swear your church-covenant, and to your [congregationalist] church-government, which is so far against the Word of God: the seals of the covenant belong to all professing believers, as God’s Word says, Acts 10:47; 8:37; 16:31-33; 1 Cor. 11:28. Whether he be a member of a particular independent Church, or not, God the Lawgiver makes not this exception, neither should man do it.</p></blockquote>

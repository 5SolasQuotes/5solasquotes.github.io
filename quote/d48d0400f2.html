<main class="wrap"><figure class="quote" id="q-d48d0400f2" data-kw="">
<blockquote><p>3. Neither Mr. Rutherford [contra what Thomas Hooker said of him] nor any judicious man can teach that either a gift to write books, or of eminent preaching, praying, exhorting, proceeds out of a power of office; it is a sanctified gift which the Church sees and judges to be in any before they call him to office; and any gift is by order of nature and time before the office, and so proceeds not from the office;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 2, ch. 4, pp. 210-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc14d922a8" data-kw="">
<blockquote><p>2. What is essential for making a minister who is extraordinarily called of God, is not ever more essential to the making of a minister ordinarily called of God, in an island where the Gospel is: if all the pastors should die, the people might choose pastors to themselves, but they could not then make pastors; God only, without the ministry of other pastors, in that case should make pastors; but it follows not hence that pastors ordinarily have not their calling to be pastors from the ordination of pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 266-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-7bcd709954" data-kw="">
<blockquote><p>The end of [external] calling can be considered in two ways: either on the part of God or on the part of the thing (which is called the end of the worker [finis operantis] and the end of the work [finis operis]). Although each is conjoined in the elect, yet in others they are separated… in the gospel call, the end of the thing is the salvation of man because by its nature it tends to the bringing of him to salvation by faith and repentance; but not at once with respect to all the called is it the end of God, but only of those to whom he decreed to give faith and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, p. 504</span></figcaption>

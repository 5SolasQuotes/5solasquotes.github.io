<main class="wrap"><figure class="quote" id="q-fd1c7f51b5" data-kw="">
<blockquote><p>According to the view of the Scotists and the Nominalists, the reason for the meritoriousness of good works lies exclusively in God’s free acceptance so that God could have accepted as merit and rewarded with everlasting life merely naturally good works. According to the better-founded Thomistic view, the ground of the meritoriousness lies also in the intrinsic value of good works performed in the state of grace. The state of grace effects an inner equivalence (meritum de condigno) between the good actions and the eternal reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §24, 3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d975b1fe9f" data-kw="">
<blockquote><p>Absolutely, man cannot exact anything from God, since all things are his; yet, given his will and pact, by which he wills not to require our works of us gratis but to render a reward according to the proportion of the works, we can truly exact the reward from him: just as a slave cannot absolutely ask any reward of his master, since all that the slave acquires he acquires for his master; yet if it please the master to give him his works as his own, and to promise a reward for them as though they were not owed to him, he will by right ask a reward for his works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“Absolutely, man cannot exact anything from God, since all things are his; yet, given his will and pact, by which he wills not to require our works of us gratis but to render a reward according to the proportion of the works, we can truly exact the reward from him: just as a slave cannot absolutely ask any reward of his master, since all that the slave acquires he acquires for his master; yet if it please the master to give him his works as his own, and to promise a reward for them as though they were not owed to him, he will by right ask a reward for his works.”

</figure><figure class="quote" id="q-db4fc88540" data-kw="">
<blockquote><p>Nor may it be gathered from this that this is merit de condigno; for even though it is from God, yet it is not from God dwelling within through justifying grace, but from God stirring up and helping from without … and moreover it is from God beginning and initiating, not yet completing and perfecting. Hence it is a merit begun and imperfect; and it has some dignity and proportion to its end, but not so great as merit de condigno requires. Finally, there is lacking, as we said, a pact properly so called, without which there can be no merit out of justice, or de condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-1d5aa59359" data-kw="">
<blockquote><p>There remains the last question, whether God rewards good works out of mere liberality beyond what is condign. For the common opinion of theologians constantly affirms this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.19 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-8f475c5af3" data-kw="">
<blockquote><p>Moreover, sure reason persuades that no one (Christ excepted), however just and holy, can merit grace de condigno for others. For there exists no pact, no promise concerning the merit of another&#x27;s salvation; and Christ alone, as head of the whole Church, had that grace by which he might merit grace and glory for all the members. … But just as it is certain that one cannot merit grace for another ex condigno, so there is no doubt that this can be done ex congruo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.21 (translated from the Latin)</span></figcaption>

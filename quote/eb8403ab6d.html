<main class="wrap"><figure class="quote" id="q-eb8403ab6d" data-kw="">
<blockquote><p>Some works, albeit they be not works of piety, yet are lawful, in so far us they are necessary means of, and have a tendency unto works of piety: So were they allowed a Sabbath day’s journey to go to their solemn meetings and worship, and the pains that men take in needful apparelling and refreshing of their bodies, and going to the public places of worship are no violation of the Sabbath, if they be done with a Sabbath day’s heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London: Smith, 1657), ch. 7, vv. 21-23, p. 135. Hutcheson was a Scottish covenanter.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a2de9f5f9" data-kw="">
<blockquote><p>The word ‘recreation’ is equivocal. Indeed there is a recreation which is mercy, (viz.) the necessary refreshment of the body, as eating, drinking, resting itself, especially to those who have wearied themselves with labor; yea, to some sickly bodies, some ordinary, moderate and inoffensive recreations may be allowed, as a learned man observes. But there is a recreation which we call sports and pastimes, when there is no necessity; and to allow this is no work of mercy; and if it be a mercy to the body, it is severity to the soul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian</cite>, … (London, 1668) Wells was an English puritan. | ch. 4, ‘That Needless Recreations are Unlawful on the Sabbath’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-c722f2b7b9" data-kw="">
<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 77-78</span></figcaption>

</figure><figure class="quote" id="q-712e5cf219" data-kw="">
<blockquote><p>I take it we are not denied to rejoice and solace ourselues upon this day. For to some men, at some times, recreation may be more necessary than meat, in case of weakness, for present preservation of health. And though not in that regard, yet being well used, it may be a furtherance to men, in the performance of the duties of godliness, as well as in the duties of their calling. But this rejoicing must be such as was the rejoicing of the Jews, Neh. 8:12, which was only spiritual, and in the Lord. For they reioyced only for this, that they understood the law of God that was taught them. But as for the recreations and pastimes aforenamed, as bowling and such like, they are not at this time to be used…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, (Cambridge: John Legat, 1606), ch. 16, ‘How the Sabbath of the New Testament is to be observed?’, section 1, case 1, p. 460</span></figcaption>

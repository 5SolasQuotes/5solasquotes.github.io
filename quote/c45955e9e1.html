<main class="wrap"><figure class="quote" id="q-c45955e9e1" data-kw="">
<blockquote><p>A teaching correction is a branch of the covenant of grace, which God hath made in Christ for the children of promise; “All thy children shall be taught of God,” Isa. liv. 13. “They shall all know me from the least of them, to the greatest,” Jer. xxxi. 34. By virtue of Divine teaching affliction is adopted a branch in the covenant of grace. That 89th Psalm is a song of the new covenant; “I will sing of the mercies of the Lord,” ver. 1. What mercies? not providence mercies only, but promise mercies, covenant mercies; “I have made a covenant with my chosen,” ver. 3. And amongst the rest of the branches of the covenant you shall find the rod and the whip have their place; “If his children forsake my law, and walk not in my judgments, &amp;c. Then will I visit their transgression with the rod, and their iniquity with stripes,” ver. 30–32.

Behold rod and stripes standing here, not upon mount Ebal, the mount of curses, as branches of a covenant of works, but upon mount Gerizim, the mount of blessings, Deut. xi. 29. as branches of the covenant of grace. Affliction is not so much threatened as promised to Christ’s seed. “My covenant will I not break,” Psa. lxxxix. 34. When God seems even to break the bones and hearts of his people by sore and heavy strokes of correction, yet he doth not break his covenant, “My covenant will I not break.”

It is in order to the covenant when God chastiseth his children, and instructs them by his chastisements. Affliction separated from instruction is pure wrath, a blast from mount Ebal, Deut. xxviii. but by a matrimonial covenant those two scriptures, “I will visit,” &amp;c. Psa. lxxxix. 32. and “I will teach,” Isa. liv. 13. are married together, and made one spirit, as in my text, and then they are pure grace. The covenant is the Magna Charta of heaven, and contains a list of whatever God the Father hath purposed, God the Son hath purchased, and God the Holy Ghost doth apply to the heirs of promise. The breasts of the covenant run nothing but the milk of spiritual blessing to the children of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Correction, Instruction; or A Treatise of Afflictions</cite>, (1671; London: Religious Tract Society, 1836), pp 114-15.</span></figcaption>

<blockquote><p>Conditions in contracts or covenant, we observe, are of two kinds, which I think good to distinguish by names, though perhaps less proper: some are precedent, others consequent. [1] I call those precedent which cause the contract, ex formula, do ut des [‘according to the formula: I give that you may give’]; as when a man sells land for a certain sum of money. So in contracting matrimony, there is a mutual donation of bodies. Such conditions as these do not only, by the defect of them, destroy (or rescind) the contract, but also do constitute (or lay) the foundation of it, and, as I may say, the essence. [2] But the consequent are added to the precedent as depending on them. They are truly mutual between both parties, but they oblige but one party only; so that because of them the other is bound to do no more (or is no further obliged). As if one, upon the giving or selling of land, do impose an annual pension of money to be distributed to the poor. So daily in contracting marriages, the condition of a dowry is added. Now such kind of conditions as these are wont to make void the contract by their absence, but yet not to effect the contract; yea, unless the sale were already full and perfect, there would be no yearly pension (or payment) of money; and before this can be, it is requisite that the buyer have not only the right of propriety, but also that he have taken possession of the land; that is, that the seller have performed his part. Thus the Law of Works exacts the fulfilling of the Law as the antecedent condition, without which not only cannot man have possession of life-eternal, but not so much as right to life-eternal. But in this sense of a condition, the Law of Faith admits not works, but only in the other, that is, that by virtue of the life already given because of faith, works should be necessary, so that he that performs (or exhibits) no works should lose (or fall from) all that right which he had, or seemed to have, by external vocation; though otherwise works are not the cause of giving life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Panstratiae Catholicae</cite>, (Frankfurt, 1627-1629), vol. 3, Of Faith, bk. 12, ch. 4, sect. 16 trans. by Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 390-91</span></figcaption>

<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners (Acts 5:30–31; 2:36; 1 Cor. 1:22–24).</p></blockquote>

<blockquote><p>XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

<blockquote><p>It should be taken as a rule in explaining the psalms, that they exhibit the covenant of grace dispensed by the Lord Jesus Christ, the King and Head of the church. He is the subject-matter of the whole of divine revelation; but in a special manner of the psalms. This appears from his own declaration, just before his ascension: Luke 24:44, “All things must be fulfilled which were written in the law of Moses, and in the prophets and in the psalms concerning me.” They are called “the word of Christ,” Col. 3:16. And in order that it may dwell in us richly in all wisdom in singing these sacred songs, we must see Christ in them. This is to be brought out in their exposition.

In Psalm 22:22, we have further confirmation of this point: “In the midst of the congregation will I praise thee.” Jesus Christ is in the midst of his people when singing his praise and participates in the service. He presides over the devotions of the sanctuary. In Heb. 2:12 these words of the psalm are ascribed to him, and they are adduced to show the oneness between him and his people. “Both he that sanctifieth and they that are sanctified are all of one,” verse 11.

Can it be a theme less important than the salvation which he has secured to his people, in which he takes so deep an interest? The numerous quotations from the Psalms and references to them in the New Testament, clearly shows that the Psalms were designed and suited to celebrate the kingdom and glory of the Mediator. Of the former there are about seventy, and of the latter, thirty. In all these the application is more or less directly to Christ. And these are not exhaustive. They are merely specimens of what the Psalms are throughout. Christ is in the Psalms, or rather the Psalms are full of Christ, and it is the business of the expounder to bring forth these good things out of this abundant storehouse.</p></blockquote>

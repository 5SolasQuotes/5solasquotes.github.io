<main class="wrap"><figure class="quote" id="q-5930dd7363" data-kw="">
<blockquote><p>Thirdly, suffer thyself to be over-borne in things indifferent by the authority of the Church, till thou be able to prove it simply unlawful, or to prove that there is a greater scandal in the use of it than in disobeying the voice of the Church and of the Christian magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Presbyterian, humbly offering to the consideration of all pious and peaceable spirits several arguments for obedience to the Act for Unifromity, as the way to unity</cite>, As quoted in Richard Lytler, ... (London, 1662), ch. 14, p. 138. Randal (1570–1622) was a puritan minister. Robert Bolton was his pupil.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79bff9e05f" data-kw="">
<blockquote><p>4. I perceive he [Gillespie’s opponent] would say that the scandal of non-conformity is a greater scandal than the scandal of conformity; He is bold to object [that] where one is offended with our practise of kneeling, twenty, I may say ten thousand, are offended with your refusal. O adventurous arithmetique! O huge hyperbole! O desultorious declamation! O roving rhetoric! O prodigal paradox! Yet I reply: 1. Though sundry (yet not ten thousand for one) are displeased by our refusal, who can show us that any are thereby scandalized, that is, made worse and induced to ruin? …

5. We know many are grieved and displeased with our non-conformity, yet that every one who is grieved is not by and by scandalized, the Bishop of Winchester [an opponent] teaches as well as we. ‘Many times’ says he, ‘men are grieved with that which is for their good, and earnestly set on that which is not expedient for them.’ But in good earnest, what do they mean who say they are scandalized or made worse by our non-conformity? For neither do we make them condemn our lawful deed as unlawful, nor yet do we animate them by our example to do that which in their consciences they judge unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 52-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-fbb443ae3f" data-kw="">
<blockquote><p>Scandal or offence is not the grieving or displeasing of my brother; for peradventure when I grieve him or displease him, I do edify him; now edification and scandal are not compatible. But scandal is a word or deed proceeding from me which is, or may be, the occasion of another man’s halting or falling into, or swerving from the straight way of righteousness.</p></blockquote>

</figure><figure class="quote" id="q-40b59be1bf" data-kw="">
<blockquote><p>A third limitation: the forementioned rule has not place, when by the forbearance of our indifferencies, at which some wicked men are scandalized, there is incurred as great, if not a greater scandal, then that by their use: as when they are hereby confirmed, and hardened in their error, and sin; and others are hereby drawn into the like: prudenter advertendum est (says Bernard) scandalum scandalo non emendari, qualis emendatio 〈◊〉, si ut aliis scandalum tollas, alios scandalizas.</p></blockquote>

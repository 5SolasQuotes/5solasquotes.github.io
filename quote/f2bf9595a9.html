<main class="wrap"><figure class="quote" id="q-f2bf9595a9" data-kw="">
<blockquote><p>… Many other moderate passages I could show in our Assembly’s Confession to some that have need to imitate them, and the Antinomians may see their doctrine subverted in their excellent definition of saving faith, in both Catechisms and in the Confession; in their determination of the natural effects of sin in whomsoever, ch. 6, sect. 6, in their determination of the necessity of repentance (as sine qua non) to remission, ch. 15:3, with more the like. And now if they have any standing rule to know a Papist or Arminian, I think I have acquit myself from their accusation; But if there be no rule of the orthodox doctrine and for rejection of error but the giddy distracted brains of Libertines that know not where to fix themselves, then I am content to bear the name of Jesuit, Papist or what these men shall please to call me. Yet let me add this, lest my seeking to satisfy the offended may draw me into guilt; Though I have voluntarily myself professed my consent to these several canons and confessions of faith, yet, for the Synod of Dort, the Confession of our Assembly; yea, or the larger Catechism, without some correction, I do hereby protest my dissent against the so imposing them to a word upon all ministers, that no man that cannot subscribe to them shall be permitted in the Church: Whether our Confession were intended for such a necessary test, I know not well; But that the Synod of Dort was, is expressed in the end. I abhor unlimited liberty of conscience, so called, that is, of divulging intolerable doctrines; and I lament also that instead of moderation, the Churches for 1,300 years [since 300 AD] have been so guilty of proud and cruel tyranny. There is singular use for a full body of theology, or a profession concluded on by such reverend assemblies, that the younger ministers may be taught by it, and the reverence of it may restrain them from rash contradicting it: And there is a necessity of exercising power in ministerial assemblies, for the actual restraint of such as shall teach things intolerably unsound: and all ministers should be there accountable for their doctrine. But before any forms be tendered us to subscribe, we must have them reduced into a narrower room, and into phrase so clearly rational or Scriptural, as no sober, studious, competent, godly divine shall scruple: Call it Socinian, or what name soever imperious faction shall put upon it, yet tender consciences will expect this, and the Churches shall never have peace in any other way, unless I be a false prophet; and the contrary course does but tend to do the same in doctrine, as the Common Prayer Book did in worship, even to ensnare the most conscientious, and work them out of the ministry by degrees, and to create us insensibly a lazy formal ministry that will take all upon trust and run to the authority of their confession instead of their Bible. I have long feared that the toleration threatened in these times for all is a judgment of God for our running into the tyrannical extreme so long; and I withal hope that He will turn this judgment to a mercy. Though I dislike too much liberty in the commonwealth more than too little (and in the Church much more such toleration is intolerable, in cases of clear duty or sin), yet I fear tyranny more than too much toleration: 1. For experience sadly tells me that tyrannical usurpation of dominion over men’s faith has distracted the Church, even beyond any visible probability of recovery; and it has been the cause of its misery for 1,300 years; but the experience of the mischiefs of toleration is nothing so great. 2. And I know that man’s nature is so prone to proud domineering, and so idolatrously inclined to have all men of their mind, and to dance after their pipe, that it will be still by assing rulers to that extreme: So that it’s easy without a spirit of prophesy to foretell that unlimited tolerations will not long be granted by anyone except a mere infidel, that having no religion himself, cares for nothing but his own politic ends; or a Julian that is contriving the extirpation of religion, and intends by the tailing of foxes to fire the field of Christ rather than by the yoking of oxen to plow and sow it. And policy will never long work that way neither, without some persecution intermixed. It’s easy to prognosticate this to him that knows what the heart of man is. So that for my part, I think the cause of God’s permission of too much looseness in these times, is to cure our former rigor and our being righteous and orthodox overmuch, by suffering men to go as much too far into the contrary extremes. Little do some men lay this to heart, who only continue exclamations (though deserved) against toleration, when it is but their own disease and what they have caused, that God is curing by this sad remedy. They should rather see their sin in this glass and be humbled.</p></blockquote>

<blockquote><p>The question does not simply concern the invisible church of the elect or the universality of believers, whether it can err in the foundation (which our doctrine concerning the perseverance of the saints sufficiently proves is slanderously charged upon us), but whether it is to be said to be so infallible as to be exposed to no error (which we deny). The question is not properly of the collective visible church of believers, but especially of the representative church in councils and of the Roman pontiff.</p></blockquote>

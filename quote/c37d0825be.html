<blockquote><p>§ 5. I have moreover insisted on the different apprehensions the old philosophers entertain concerning those insuperable difficulties that are about predetermination, etc. thereby to intimate that the confident [Medieval] schoolmen and their several sectators do but actum agere, and consume their strength on needless controversies, to the great disadvantage of true religion. These acting in divinity, as our virtuosi do in philosophy, who, by a zealous attempt to establish their new dogmata [dogmas] (as they call them) do not walk in any untrodden paths; The Copernican Hypothesis about the motion of the earth, as also the learned fancies about the earth, and inhabitants that are said to be in the moon, as well as that solid truth about the Antipodes, so much reproached by Lactantius [early Church father, c. 250 – c. 325, in The Divine Institutes, Bk. 3, ch. 24 in ANF 7.94-95], were all known in Cicero‘s, if not in Plato‘s, or Pythagoras‘s days. For this, consult Cicero, Quaest. Acad. l. 2: ‘Habitari ait Xenophanes in Luna, eamque esse terram multarum urbium, &amp; montium. Portenta videntur: sed tamen neque ille qui dixit jurare posset ita se rem habere, neque ego. Nonne etiam dicitis, esse è regione nobis, è contraria parte terrae, qui adversis vestigiis stent contra vestigia nostra, quos Antipodas vocatis? Cur mihi magis succensetis, qui ista non aspernor, quam eis, qui quum audiunt, desipere vos arbitrantur? Nicetas Syracusius, ut ait Theophrastus, Coelum, Solem, Lunam, Stellas, supera denique omnia stare censet, neque praeter terram rem ullam in mundo moveri: quae cùm circum axem se summa celeritate convertat, &amp; torqueat, eâdem effici omnia, quae si stante terra, Coelum moveretur. Atque hoc etiam Platonem in Timaeo dicere quidam arbitrantur, sed paulò obscuriùs.’ Thus both our New Philosophers, and the Old Schoolmen, do but trace the ancient heathen in their particular fancies, concerning things not only unrevealed, but moreover, too high for vain mortals to reach unto. The New Philosophers confidently solve, as they say, the insolvable phaenomena in the natural world… for the Schoolmen are as vain, and consequently as liable unto just rebukes, as are the New Philosophers; Do the New Philosophers revive the old dogmata of the heathen? so do the schoolmen: Do the New Philosophers disturb the world with their learned folly? so do the schoolmen. And must the New Philosopher be severely checked for his presumption in philosophy? then surely, much more so must the schoolman…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-lobb.html">Stephen Lobb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory of Free Grace Displayed</cite>, … (London, 1680), pp. x-xi. Lobb (c. 1647–1699) was an English, calvinistic, indpendent minister. He was prominent in the 1680’s as a court representative of the Independents to James II, and in the 1690s in polemics between the Presbyterian and Independent groups of nonconformists. His church in London is supposed to be the successor to the congregation of Thomas Goodwin.</span></figcaption>

<blockquote><p>But let us suppose, for I shall not contradict it, that the common determination is right, that God created the world, not necessarily, but freely; not only as freedom is opposite to coaction, and to any extrinsic, imposed necessity, which are unquestionable, but also to an intrinsical necessity, so that his wisdom, and communicative nature, or glory, did not necessitate the creation of the world, but that he so willed to create it, that consideratis considerandis, he might have nilled it, and in this sense did freely create it. I say on this common ground supposed we shall proceed, though I fear such high inquiries myself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity</cite>, (London: R.W., 1655), An Advertisement Explicatory, pp. ix-x</span></figcaption>

<blockquote><p>4th Problem. Whether creatures can be similar to God? Answer: Of an accidental similitude, and by participation, Affirmed—as is manifestly proved from Gen. 1, where it treats of the creation of man to the image and likeness of God. But of an essential similitude, or one by essence, Denied. And under this distinction is to be explained, against the enthusiastic distortions, the passage 2 Pet. 1:4, where the participation of θείας φύσεως [the divine nature] is to be understood accidentally, by imitation and similitude—but not essentially according to substance, whether the same in number or in species. Hence, too, the passage Isa. 46 receives light, where God denies Himself to be similar to any thing—much less that any external image can be a picture of Him, or a formal sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin, vol. 5 (1669)</span></figcaption>

<blockquote><p>In his great work, The Hexaëdemeron (1230–35), Grossteste attempts a synthesis of all major interpretations hitherto given in the church… Here, in this medieval scholastic bishop, lie the roots of what eventually became known as the framework hypothesis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“‘In the Space of Six Days’: the Days Of Creation From Origen to the Westminster Assembly’ in Westminster Theological Journal 61:2</cite>, (Fall, 1999), pp. 149-74 | On the Framework Hypothesis:, pp. 160-61</span></figcaption>

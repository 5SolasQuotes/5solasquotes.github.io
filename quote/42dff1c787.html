<main class="wrap"><figure class="quote" id="q-42dff1c787" data-kw="">
<blockquote><p>4…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (London: Henrie Denham et al., 1583), pt. 2, ch. 5. ‘The Second Precept, which concerns Images, their Beginning, Antiquity &amp; Cause’</cite>, p. 335</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-089a20e32e" data-kw="">
<blockquote><p>Each creature is limited by place, though spirits do not fill up a place† by commensuration of parts, yet they have a certain compass (as I may call it) beyond which their essence extends not: they are so here that they are not there; so in heaven, that they are not the same time on earth. † The angels are in an ubi [where] though not in a place properly; in English we cannot so well distinguish these words: they are limited and confined to some space; an angel cannot be at the same time in heaven and earth. But God is altogether above place, he is omnipresent, not by any material extension, but after an incomprehensible and unexpressible manner. He is quite above all place, wholly without and within all and every place, and that without all local motion or mutation of place. He is every where totally and equally…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal</cite>, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/guardian-angels.html">Guardian angels</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 7.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs%20a%20particular%20angel%20assigned%20as%20a%20perpetual%20guardian%20to%20each%20believer%3F%20We%20deny.%20From%20Acts%2012%3A15%2C%20where%20mention%20is%20made%20of%20Peter%E2%80%99s%20angel%2C%20it%20can%20be%20collected%20that%20a%20certain%20angel%20was%20then%20present%20with%20Peter%2C%20but%20not%20that%20a%20particular%20and%20perpetual%20guardian%20was%20given%20to%20him.%20For%20he%20is%20said%20%E2%80%9Cto%20have%20come%20upon%20him%E2%80%9D%3B%20as%20when%20%E2%80%9Cthe%20physician%20and%20servant%20of%20the%20king%E2%80%9D%20is%20alluded%20to%2C%20not%20a%20particular%20one%20is%20understood%2C%20but%20indefinitely%20he%20who%20performs%20that%20office%20%28which%20many%20can%20perform%20successively%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%207.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F753214a097.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/753214a097.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-636b608490" data-kw="">
<blockquote><p>The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 1, ch. 11, section 3</cite>, pp. 122-23</span></figcaption>

</figure><figure class="quote" id="q-0cfc9f568c" data-kw="">
<blockquote><p>God only is properly and absolutely eternal: Angels and men’s souls are said to be eternal, à posteriori, or à parte post, God à priori et à posteriori, ex parte ante et post, since He has neither beginning, succession, nor end.</p></blockquote>

</figure><figure class="quote" id="q-ff15c33f5c" data-kw="">
<blockquote><p>Now if it could be made plain to the divided Protestant Churches, that indeed the causes of their divisions are extra-fundamental, it may be truly and hopefully concluded that for conscience sake towards God and for their mutual edification and preservation against the encroaching power of darkness, they would be moved to leave off passionate disputations and laying aside the causes of their separation to compose their differences in brotherly love.</p></blockquote>

<blockquote><p>religious differences should be managed religiously; that is, piously and charitably. This may be; it is possible; for it is prescribed and pressed: ‘Let us not therefore judge one another any more.’ (Rom.14:13) ‘But why dost thou judge thy brother? Or why dost thou set at nought thy brought?’ (Rom. 14:10) and ‘Let us therefore follow after the things which make for peace.’ (Rom. 14:19) And this should be: for charity is a grace of an universal extent; we owe it to all, – to the weak, to the ignorant, to the peevish, to the proud, to the good, and to the bad: ‘Owe no man any thing, but to love one another.’ (Rom. 13:8) And it is of that necessary connection with other saving graces, that we can neither have faith nor hope, unless we have charity; yea, ‘the greatest of these is charity’ (1 Cor. 13:13). And herein the true church of Christ hath ever excelled. The fathers of old, in their dealing with the Donatists, would account them their brethren, when they could not prevail with them for a reciprocation. And it is a golden saying of Bernard: ‘I will cleave to you against your will; I will cleave to you even against my own will: when ye are moved, I will be quiet; I will give place to anger, that I may not give place to the devil.’ And there is great reason for such a temper: for every difference in religion creates not a different religion: while men do hold the Head, they must needs be of the body. Where the same substantial doctrine is avowed, accidental variety is very tolerable, especially where the peace of God’s Church is not infringed. It was worthy bishop [Edward] Reynolds’s conclusion: ‘Where the same straight road to heaven is kept, a small difference of paths hinders not travelers from coming to the same inn at night.’ So neither should they bitterly contest about the next way, who steadily own the same Guide, the same rule, the same end; only, every one has not so clear an eye, nor such opportunity to know the more obscure points pertaining to the Christian religion, which others have. Therefore in these things Luther’s motto is best: ‘Where there is anything of Christ, there is love:’ and this love ‘will cover,’ not one or two, but ‘the multitude of sins’ and infirmities (1 Peter 4:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Various Puritans, The Morning Exercises at Cripplegate</cite>, ... vol. 4 (of 6), ed. James Nichols, 5th ed. (1659-1689; London: Tegg, 1844), pp. 222-23</span></figcaption>

</figure><figure class="quote" id="q-17d93318c3" data-kw="">
<blockquote><p>But tell me now your opinion of another matter, and that is concerning liberty of conscience, and toleration of heretics and sectaries, for which there are so many books written of late… This question about the toleration of those whose way is different from the common rule which shall be established, must be both stated and resolved, cum grano salis [with a grain of salt]. We must remember to distinguish persons from corporations or Churches, and both these from errors. Again, to distinguish persons, whether godly and gracious, or loose and libertine, whether moderate and peaceable, or factious and turbulent; whether such as have deserved well of the public, or such as have done either no service or a disservice. To distinguish corporation, whether the question be of such only as have a present existence, or of all who shall join to such a way afterward. To distinguish errors, whether practical or doctrinal only, whether fundamental, or circa-fundamental, or neither of the two. To distinguish toleration, whether absolute, or hypothetical and conditional, whether anywhere, or in some few certain places only, whether indefinite and general, or limited and bounded, and if bounded, how far and how much: Whether such toleration as may stand with the Solemn League and Covenant, or such as is inconsistent therewith; whether such as is profitable for the public peace, or such as is apparently destructive thereto.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1cb88c976c" data-kw="">
<blockquote><p>Sundry other branches there are of the abominations of these men … which may be reduced to these three corrupt and bloody fountains: — 1. That the Scripture at best, as given out from God, and as it is to us continued, was and is but a partial revelation of the will of God, the other part of it … being reserved in their magazine of traditions. 2. That the Scripture is not able to evince or manifest itself to be the Word of God … without an accession of testimony from that combination of politic, worldly-minded men that call themselves the Church of Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Divine Original of the Scriptures</cite>, Works (Goold), vol. 16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55d2775d85" data-kw="Spirit and Word">
<blockquote><p>We may now easily infer how erroneously our opponents act in vaunting of the Holy Spirit, for no other end than to give the credit of his name to strange doctrines, extraneous to the word of God, whereas he himself desires to be inseparably connected with the word of God; and Christ declares the same thing of him, when he promises him to the Church. And so indeed it is. The soberness which our Lord once prescribed to his Church, he wishes to be perpetually observed. He forbade that anything should be added to his word, and that anything should be taken from it. This is the inviolable decree of God and the Holy Spirit, a decree which our opponents endeavour to annul when they pretend that the Church is guided by the Spirit without the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><figure class="quote" id="q-0710eea5db" data-kw="">
<blockquote><p>It is not a question whether divine and apostolic traditions, that is, all teachings which were handed down by Christ or the apostles, are to be accepted; everyone readily grants this. The question is whether any such traditions are given except in Scripture. Therefore, until our adversaries can show by an unquestionable proof that their unwritten traditions truly rest on Christ and the apostles, which will never be done, we shall reject them as human work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ebe04a63e4" data-kw="">
<blockquote><p>A way of sabbath-breaking and of profaning God’s worship is a sure way to hell. Is not this a common thing amongst us? Are there not many amongst us, especially young people, that have no regard to holy time, but in their talk and actions do trample God’s sabbath under foot and make no difference between holy time and other time? I think this may be taken for a rule, that those moral evils that were capital according to the law of Moses, that at all times, they are mortal damning sins: for God, by ordering that they should be punished with death, signified that they led to destruction and eternal death. But the profaning the sabbath was so to be capitally punished.

[In] Exodus 31:14, we are told that he that defiles the sabbath shall surely be put to death; that soul shall be cut off from the congregation. They were to be stoned with stones, which sort of death seems to be appointed more especially to represent God’s wrath poured upon the head of the sinner. And how many are there that not only profane the sabbath, but profane God’s public worship on the sabbath by an irreverent, indecent, rude behaviour. All such as make this a practice are going to hell. I need to offer [no] other places to prove it, but the third commandment: “That God will not hold him guiltless that taketh his name in vain. Remember the sabbath day, to keep it holy” [Exodus 20:7–8].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Torments of Hell are Exceeding Great (1728) in Sermons and Discourses, 1723-1729</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47a93b6ff6" data-kw="">
<blockquote><p>If believers as giving Peter’s confession, and as builded upon the rock, Christ, by this place made a ministerial Church, by Christ, and gifted with the power of the keys, then the Ministry &amp; official power of preaching and binding and loosing should be made as stable and firm from defection, as the Church of elect believers, against whom the gates of hell cannot prevail: now besides that this is most untrue since, visible Churches do fall away, as these seven Churches in Asia, the Church of Corinth, Ephesus, Galatia, Thessalonica may prove, when as it is impossible that the elect Believers in Christ can fall away, it shall also give good warrant to Papists, to make such use of this place, as they do, that the Church may err in points of conversation and life, but cannot fall from the rock, nor be overcome by the powers of Hell in the definition of Articles of Faith.

So Gretser, Bellarmine, Suarez, Gregor, de Valent, Cardi, Hosius, Turrecremata, reason from this place; and the connexion must be good, if the Ministerial power not only be given to the Church as to the Object, that is, for the good and salvation of the Church, but also to the Church as to the Subject, who hath all the power of the Keys, and may use it also, because they are believers and builded upon the rock Christ; nothing hindereth, but Ministerial power should be as stable and free from being overcome with the ports of Hell, as the Christian state of perseverance in grace. Now we see, these who have Ministerial power, abuse it, and fall from the rock and perish eternally; which we cannot say of these, who by Faith are builded upon the Rock Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), pp 14-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-c9e7a0bd53" data-kw="">

</figure><figure class="quote" id="q-9b64e71071" data-kw="">
<blockquote><p>Wherefore, since the Word Himself has come to us from heaven, we need not, I reckon, go any more in search of human learning to Athens and the rest of Greece, and to Ionia. For if we have as our teacher Him that filled the universe with His holy energies in creation, salvation, beneficence, legislation, prophecy, teaching, we have the Teacher from whom all instruction comes; and the whole world, with Athens and Greece, has already become the domain of the Word.</p></blockquote>

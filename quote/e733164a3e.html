<blockquote><p>It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-woolsey.html">Andrew Woolsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unity &amp; Continuity in Covenantal Thought, pp. 531, 534</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6b2b74f2d" data-kw="">
<blockquote><p>Sovereignty is a comprehensive term. It contains several elements. First it denotes supremacy. A sovereign ruler is supreme in his dominions. All other rulers are under him. Secondly, sovereignty denotes independence. Says Woolsey, ‘In the intercourse of nations certain states have a position of entire independence of others. They have the power of self-government, that is, of independence of all other states as far as their own territory and citizens are concerned. This power of independent action in external and internal relations constitutes complete sovereignty.’ (Political Science, i., 204) Thirdly, sovereignty denotes optional power; that is, the power to act or not in a given instance. It is more particularly with reference to this latter characteristic of free alternative decision, that ‘the sovereignty of God in election’ is spoken of. In his election of a sinner to salvation, God as supreme, independent, and sovereign, acts with entire liberty of decision, and not as obliged and shut up to one course of action. This is the common understanding and definition of sovereignty as applied to decisions and acts. Says Blackstone [one of the most influential writers on English law]: ‘By the sovereign power is meant the power of making laws; for wherever that power resides all other powers must conform to, and be directed by it, whatever appearance the outward form and administration of the government may put on. For it is at any time in the option of the legislature to alter that form and administration by a new edict or rule, and put the execution of the law into whatever hands it pleases, by constituting one, or a few, or many executive magistrates.’ (Introduction, 2) Blackstone gives the same definition of sovereignty, when it is vested in a king (Book II., ch. vii.). The king has no superior to oblige or compel him to one course of action. He has independent and optional power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (1893; Banner of Truth, 1993), pp. 70-71</span></figcaption>

<blockquote><p>II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For:

      1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess.

      2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.</p></blockquote>

ld,is%20an%20objective%20cause%20as%20foreseen&amp;text=II.%20Both%20you%20and%20I%20hold%2C%20and%20must&amp;text=as%20aforesaid%2C%20is%20an%20objective%20cause%20as%20foreseen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If you say that though such righteousness in Saul was no moving cause to God to give him saving grace: in like manner I say that no sin in Pharaoh was a moving cause in God to deny him saving grace: For if it were, then either by necessity of nature, or by the constitution of God. Not by necessity of nature; for undoubtedly God could have pardoned this sin of his, and changed his heart, as well as he pardoned the sins of Manassah, the sins of the Jews in crucifying the Son of God, Acts 2, the sins of Saul in persecuting God’s saints; and changed all their hearts. Nor by any constitution of God; for show me if you can any such constitution of God. And if you would but explicate wherein the hardening of Pharaoh did consist, I presume it would clearly appear that the mere pleasure of God’s will is the cause of it; like as it is the mere pleasure of God that He does not harden others in like manner… … All confess that God is not the cause of hardness of heart in any man, but man being born in hardness of heart, Eze. 36:31[?]. God is said to harden, not infundendo malitiam, sed non infundendo gratiam [not by infusing malice, but by not infusing grace]: By leaving him thereunto, whereby it comes to pass that naturally it is increased, especially in case a man be moved to courses contrary to his corrupt humors, whether by God’s Word, or by his works, and God does not by grace correct those corrupt humors which are so contrariant to good motions; good motions, I mean such as have their course only in the way of instruction and persuasion; In this case, thus to move and to deny grace is to harden. But when God does forbear thus to move, and gives men over to follow the swing of their own lusts, this I confess is to harden in greater measure, and properly a punishment. But this was not the manner of Pharaohs hardening. For long after the ninth chapter of Exodus we read how God continued to admonish Pharaoh by his servant Moses to let his people go; neither ceased He this discipline till the ten plagues or nine of them at the least were fulfilled. And like as to shew mercy is not to move only to obedience, but effectually to work men to obedience, so the hardening of man in opposition thereunto, consists not in not moving unto obedience, but rather in not working unto obedience, although they be moved thereunto both in the way of instruction and exhortation. As for the punishing of sin with sin in the hardening of the creature, let us understand ourselves aright, and not confound ourselves when we need not. Is it a sober speech to say that God punishes his denial of grace with denial of grace? or that God punishes the sins of the heathen with the denial of that grace, which they never enjoyed? But as for the punishing of sin with sin, this is a large field of God’s providence, consisting in diverse kinds, and it is no way fit to consider them without distinction. God made the unnaturalness of Senacherib’s sons a scourge to chastise Senacherib’s unnaturalness towards God; one mans sinful act to be the punishment of another’s. Here is one kind utterly distinct from that you treat of. Again, some say (and I think justly) and Augustine acknowledges it, that every man’s sin may be a just punishment unto him in respect of a former, as Rom. 1:25. When men for their idolatry were given over to vile affections, to defile themselves in abominable manner, it is said that herein they received in themselves, such recompence of their error as was meet. So 2 Thess. 2:10-11, because men received not the truth of God with love, God is said to send them strong delusions that they should believe lies. …For to punish is either to inflict evil, which formerly they suffered not, or to withdraw some good which formerly they enjoyed… we see hereby apparently how God can punish sin with sin in this kind, not by denial of grace which they never enjoyed, but by denying some outward means of grace which formerly they enjoyed. And withal it appears that this is nothing to our present purpose, who treat of obduration as it consists in or is joined with the denial of saving grace, in proper opposition to the showing of mercy or affording saving grace… I say also that God’s punishing consists in denying, or not maintaining some kind of grace, or rather not so much to be called grace as a natural restraint, not from sin in general (for that cannot be but by saving grace), but from some sins in special, which are foul in the judgment of a natural man’s conscience; such as are those unnatural defilements the apostle speaks of, Rom. 1. Now God in a natural manner restrains men from such excess, either for fear of shame of the world or by reason of some natural detriment that may arise thereby, or by the ministry of his angels restraining the temptations of Satan in this kind; And it is found by experience that Nemo repente fit turpissimus, but they grow to extremes by degrees, and the longer a man lives, the worse he grows, if grace correct not the course of corrupt nature, according to that saying, Nemo senex metuit Jovem. Now if God shall forbear this restraint, and give them over to the power of Satan, they shall be exposed to the commission of such abominable things, and therein they shall receive in themselves a just recompence of their former errors.</p></blockquote>

bear+thus+to+move%2C+and+gives+men+over+to+follow+the+swing+of+their+own+lusts%2C+this+I+confess+is+to+harden+in+greater+measure%2C+and+properly+a+punishment.+But+this+was+not+the+manner+of+Pharaohs+hardening.+For+long+after+the+ninth+chapter+of+Exodus+we+read+how+God+continued+to+admonish+Pharaoh+by+his+servant+Moses+to+let+his+people+go%3B+neither+ceased+He+this+discipline+till+the+ten+plagues+or+nine+of+them+at+the+least+were+fulfilled.+And+like+as+to+shew+mercy+is+not+to+move+only+to+obedience%2C+but+effectually+to+work+men+to+obedience%2C+so+the+hardening+of+man+in+opposition+thereunto%2C+consists+not+in+not+moving+unto+obedience%2C+but+rather+in+not+working+unto+obedience%2C+although+they+be+moved+thereunto+both+in+the+way+of+instruction+and+exhortation.+As+for+the+punishing+of+sin+with+sin+in+the+hardening+of+the+creature%2C+let+us+understand+ourselves+aright%2C+and+not+confound+ourselves+when+we+need+not.+Is+it+a+sober+speech+to+say+that+God+punishes+his+denial+of+grace+with+denial+of+grace%3F+or+that+God+punishes+the+sins+of+the+heathen+with+the+denial+of+that+grace%2C+which+they+never+enjoyed%3F+But+as+for+the+punishing+of+sin+with+sin%2C+this+is+a+large+field+of+God%E2%80%99s+providence%2C+consisting+in+diverse+kinds%2C+and+it+is+no+way+fit+to+consider+them+without+distinction.+God+made+the+unnaturalness+of+Senacherib%E2%80%99s+sons+a+scourge+to+chastise+Senacherib%E2%80%99s+unnaturalness+towards+God%3B+one+mans+sinful+act+to+be+the+punishment+of+another%E2%80%99s.+Here+is+one+kind+utterly+distinct+from+that+you+treat+of.+Again%2C+some+say+%28and+I+think+justly%29+and+Augustine+acknowledges+it%2C+that+every+man%E2%80%99s+sin+may+be+a+just+punishment+unto+him+in+respect+of+a+former%2C+as+Rom.+1%3A25.+When+men+for+their+idolatry+were+given+over+to+vile+affections%2C+to+defile+themselves+in+abominable+manner%2C+it+is+said+that+herein+they+received+in+themselves%2C+such+recompence+of+their+error+as+was+meet.+So+2+Thess.+2%3A10-11%2C+because+men+received+not+the+truth+of+God+with+love%2C+God+is+said+to+send+them+strong+delusions+that+they+should+believe+lies.+%E2%80%A6For+to+punish+is+either+to+inflict+evil%2C+which+formerly+they+suffered+not%2C+or+to+withdraw+some+good+which+formerly+they+enjoyed%E2%80%A6+we+see+hereby+apparently+how+God+can+punish+sin+with+sin+in+this+kind%2C+not+by+denial+of+grace+which+they+never+enjoyed%2C+but+by+denying+some+outward+means+of+grace+which+formerly+they+enjoyed.+And+withal+it+appears+that+this+is+nothing+to+our+present+purpose%2C+who+treat+of+obduration+as+it+consists+in+or+is+joined+with+the+denial+of+saving+grace%2C+in+proper+opposition+to+the+showing+of+mercy+or+affording+saving+grace%E2%80%A6+I+say+also+that+God%E2%80%99s+punishing+consists+in+denying%2C+or+not+maintaining+some+kind+of+grace%2C+or+rather+not+so+much+to+be+called+grace+as+a+natural+restraint%2C+not+from+sin+in+general+%28for+that+cannot+be+but+by+saving+grace%29%2C+but+from+some+sins+in+special%2C+which+are+foul+in+the+judgment+of+a+natural+man%E2%80%99s+conscience%3B+such+as+are+those+unnatural+defilements+the+apostle+speaks+of%2C+Rom.+1.+Now+God+in+a+natural+manner+restrains+men+from+such+excess%2C+either+for+fear+of+shame+of+the+world+or+by+reason+of+some+natural+detriment+that+may+arise+thereby%2C+or+by+the+ministry+of+his+angels+restraining+the+temptations+of+Satan+in+this+kind%3B+And+it+is+found+by+experience+that+Nemo+repente+fit+turpissimus%2C+but+they+grow+to+extremes+by+degrees%2C+and+the+longer+a+man+lives%2C+the+worse+he+grows%2C+if+grace+correct+not+the+course+of+corrupt+nature%2C+according+to+that+saying%2C+Nemo+senex+metuit+Jovem.+Now+if+God+shall+forbear+this+restraint%2C+and+give+them+over+to+the+power+of+Satan%2C+they+shall+be+exposed+to+the+commission+of+such+abominable+things%2C+and+therein+they+shall+receive+in+themselves+a+just+recompence+of+their+former+errors.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Treatise+of+Mr.+Cotton%E2%80%99s+clearing+certain+doubts+concerning+Predestination+togeth

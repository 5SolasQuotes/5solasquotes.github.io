<blockquote><p>Naturally, therefore, this sign and seal belongs only to those who are the Lord’s. Or, to put it rather in the positive form, this sign and seal belongs to all those who are the Lord’s. There are no distinctions of race or station, sex or age; there is but one prerequisite—that we are the Lord’s. What it means is just this and nothing else: that we are the Lord’s. What it pledges is just this and nothing else: that the Lord will keep us as his own. We need not raise the question, then, whether infants are to be baptized. Of course they are, if infants, too, may be the Lord’s. Naturally, as with adults, it is only the infants who are the Lord’s who are to be baptized; but equally naturally as with adults, all infants that are the Lord’s are to be baptized. Being the Lord’s they have a right to the sign that they are the Lord’s and to the pledge of the Lord’s holy keeping. Circumcision, which held the place in the old covenant that baptism holds in the new, was to be given to all infants born within the covenant. Baptism must follow the same rule. This and this only can determine its conference: Is the recipient a child of the covenant, with a right therefore to the sign and seal of the covenant? We cannot withhold the sign and seal of the covenant from those who are of the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1920 | (HT: Kim Riddlebarger)</span></figcaption>

ead it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31327f343c" data-kw="">
<blockquote><p>And this is the firm tradition of the universal Church, in respect of the baptism of infants, who certainly are as yet unable “with the heart to believe unto righteousness, and with the mouth to make confession unto salvation,” as the thief could do; nay, who even, by crying and moaning when the mystery is performed upon them, raise their voices in opposition to the mysterious words, and yet no Christian will say that they are baptized to no purpose. 32. And if any one seek for divine authority in this matter, though what is held by the whole Church, and that not as instituted by Councils, but as a matter of invariable custom, is rightly held to have been handed down by apostolical authority, still we can form a true conjecture of the value of the sacrament of baptism in the case of infants, from the parallel of circumcision, which was received by God’s earlier people, and before receiving which Abraham was justified, as Cornelius also was enriched with the gift of the Holy Spirit before he was baptized.</p></blockquote>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

<blockquote><p>XII. There was no need that a particular precept concerning the baptism of infants should be given because it was known to the disciples that infants were circumcised. It therefore sufficed that there was a general command to baptize all nations, under which the particular is contained. XIII. The baptism of Christ (performed when he was in his thirtieth year) cannot overthrow infant baptism. All the acts of Christ (which do not pertain to doctrine) are not forthwith to be imitated; otherwise baptism would have to be received only in the thirtieth year (which however our opponents do not say). There was a peculiar reason for his waiting until that time; not only because only in the preceding year was the baptism of John instituted, but also on account of the type of the Levitical priests (who although received in their twenty-fifth year into the priestly college, before their thirtieth year were not admitted to the exercise of their office). Christ (not needing baptism) could safely put it off. But our case is different, we being conceived and born in sin. XIV. John admitted no one to baptism unless he confessed his sins because he was dealing with the baptism of adults and those called to the Christian church. But it does not follow that the same should be done with infants who are already in the church. XV. A sign whose virtue depends on the disposition of the receiving subject differs from one whose virtue depends on the promise of the institutor. The former sign is to no purpose applied to one not understanding it; but it is not so with the latter (such as baptism and circumcision). Again, a subject receptive of the sign differs from one perceptive of it also; infants can be the former, although not the latter. Third, a sign is useless applied to one not understanding, or about to understand (which cannot be said of an infant). XVI. Baptism is called the sacrament of repentance; not because it requires that beforehand in everyone to be baptized, but because it binds the baptized to the desire of it, whether in the present (when they are capable of it) or in the future. XVII. Sacraments without faith in the user are said to be empty ceremonies with regard to adults; not with regard to infants, in whom (for a salutary use of baptism) the promise is sufficient and the grace of the covenant (which is sealed on the part of God), even though as yet there is not an answer and restipulation on the part of the baptized (as is evident in circumcision, Gen. 17:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.12–17 (p. 418–19).</span></figcaption>

B+infants+can+be+the+former%2C+although+not+the+latter.+Third%2C+a+sign+is+useless+applied+to+one+not+understanding%2C+or+about+to+understand+%28which+cannot+be+said+of+an+infant%29.+XVI.+Baptism+is+called+the+sacrament+of+repentance%3B+not+because+it+requires+that+beforehand+in+everyone+to+be+baptized%2C+but+because+it+binds+the+baptized+to+the+desire+of+it%2C+whether+in+the+present+%28when+they+are+capable+of+it%29+or+in+the+future.+XVII.+Sacraments+without+faith+in+the+user+are+said+to+be+empty+ceremonies+with+regard+to+adults%3B+not+with+regard+to+infants%2C+in+whom+%28for+a+salutary+use+of+baptism%29+the+promise+is+sufficient+and+the+grace+of+the+covenant+%28which+is+sealed+on+the+part+of+God%29%2C+even+though+as+yet+there+is+not+an+answer+and+restipulation+on+the+part+of+the+baptized+%28as+is+evident+in+circumcision%2C+Gen.+17%3A7%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+3+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+19.20.12%E2%80%9317+%28p.+418%E2%80%9319%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41222c9eb2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41222c9eb2.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/12/turretin-answers-objections-to-infant-baptism-6/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Infants of believing parents are likewise to be baptized. The grounds of their baptism are these. First, the commandment of God, “Baptize all nations” (Matt. 28:19), in which words the baptism of infants is prescribed. For the apostles by virtue of this commission baptized whole families (Acts 16:15, 31–33). Again, circumcision of infants was commanded by God (Gen. 17:14), and baptism in the New Testament succeeds in the room of circumcision (Col. 2:11–12); therefore baptism of infants is likewise commanded. The second ground is this. Infants of believing parents are in the covenant of grace. For this is the tenor of the covenant: “I will be thy God, and the God of thy seed” (Gen. 17:7). It may be said that this promise was made in this sort only to Abraham, because he was to be the father of the faithful. Answer. It pertains to all believing parents. God promises “to show mercy to thousands of them that love Him” (Ex. 20). Peter says to the Jews that heard him preach, “The promises belong to you, and to your children” (Acts 2:39). Paul says, “If the parents believe, the children are holy” (1 Cor. 7:14). If holy, then are they in the covenant. Now they are holy because we are in the judgment of Christian charity to esteem them all as regenerate and sanctified, secret judgments (in the mean season) left to God. Now then because infants are in the covenant, they are to be baptized. For this is the reason of St. Peter. To whom the promises belong, to them belongs baptism. But to you and your children belong the promises. Therefore you and your children are to be baptized (Acts 2:38–39).</p></blockquote>

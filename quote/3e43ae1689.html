<main class="wrap"><figure class="quote" id="q-3e43ae1689" data-kw="">
<blockquote><p>Assertion 1. There is now no gift of prophesy, either for the bringing forth of any truth not formerly delivered, nor any gift to warrant one in a particular simply condemned in the Word, as to take another’s goods, life, station, etc. so as to be warranted merely by such a revelation in things otherwise unlawful, as it is like prophetical men of old in some of their practices were, which to us are no precedent for our warrant;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 469-72</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b429bc8ea1" data-kw="">
<blockquote><p>Secondly, every office necessarily supposes the corresponding gift. No man could be an apostle without the gift of infalibility; nor a prophet without the gift of inspiration; nor a healer of diseases without the gift of healing. Man may appoint men to offices for which they have not the necessary gifts, but God never does, any more than he ordains the foot to see or the hand to hear. If any man, therefore, claims to be an apostle, or prophet, or worker of miracles, without the corresponding gift, he is a false pretender. In the early church, as now, there were many false apostles, i.e. those who claimed the honor and authority of the office without its gifts. Thirdly, the fact that any office existed in the apostolic church is no evidence that it was intended to be permanent. In that age there was a plenitude of spiritual manifestations and endowments demanded for the organization and propagation of the church, which is no longer required. We have no longer prophets, nor workers of miracles, nor gifts of tongues. The only evidence that an office was intended to be permanent is the continuance of the gift of which it was the organ, and the command to appoint to the office those who are found to possess the gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, (NY: Robert Carter, 1860), on 1 Cor. 12:28, p. 263</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-dc91030cbf" data-kw="">
<blockquote><p>We do not profess to teach anything new. We consider the teaching of the Westminster Confession of Faith and other standards of the Reformed Churches to be absolutely true and sufficient, as they set forth the gracious operations of the Holy Spirit in redemption. We do hope, however, to set up and maintain the traditional view as taught in them, by treating the subject from a different point of view, and in refutation of heresies that were not prominently before the minds of those who formulated these standards. … Our aim is to ascertain and classify all the works of the Holy Spirit in all ages and dispensations, and to differentiate them one from the other by accurate definition; and also to determine, from the Scriptures, which have been permanent and universal and will be till the end of time, and which were limited and temporary. So far as we know, this ground has not been traversed, nor indeed has its importance been appreciated. Having accomplished this, as we hope and believe, we then bring the more popular claims of Modern Mysticism to the test of ascertained principles, and then consider their special pleas based on the Scriptures. … The thoughtful reader may perhaps find it profitable to read ‘Summary I’ at the close before reading the discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shearer.html">John Shearer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Modern Mysticism; or, The Covenants of the Spirit, their Scope &amp; Limitations</cite>, (Richmond, 1905) ToC</span></figcaption>

</figure><figure class="quote" id="q-8203363a8d" data-kw="">
<blockquote><p>It is not by Romanists only that it is denied, practically at least, if not theoretically. Nothing is more common among Protestants, especially in our day, than the attempt to coerce the conscience of men by public opinion; to make the opinions of men on questions of morals a rule of duty for the people, and even for the Church. If we would stand fast in the liberty wherewith Christ has made us free, we must adhere to the principle that in matters of religion and morals the Scriptures alone have authority to bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. VI, §4</span></figcaption>

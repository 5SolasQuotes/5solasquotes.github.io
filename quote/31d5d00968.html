<main class="wrap"><figure class="quote" id="q-31d5d00968" data-kw="">
<blockquote><p>Now that the prophet was ordered to offer them wine, and that they refused, a question here arises: Was their continency in this respect laudable? They seemed thus to prefer Jonadab [their forefather] to God, for they knew that Jeremiah, who offered them wine, was sent by God. But the Rechabites, no doubt, modestly excused themselves, when they said that it was not right for them to drink wine, because they had been forbidden by their father. It was not then their purpose to give more honor to their father than to God or to his prophet, but they simply answered for the sake of excusing themselves, that they had abstained from wine for three hundred years, that is, that the whole family had done so. This, then, is the solution of the question. But what the Papists do in bringing against us the Rechabites, first to support their tyrannical laws, and secondly, in order to torment miserable consciences at their pleasure, is frivolous in the extreme. As I have already said, the advice of Jonadab is not commended, as though he had rightly forbidden his sons to drink wine; but only his sons are spoken of as having reverently and humbly obeyed the command of their dead father. Then this passage gives no countenance to the Papists, as though the object of it was to bind the consciences of the faithful to their laws; for what is here spoken of is that the Rechabites proved by their obedience how base and wicked was the obduracy of the people, as they showed less reverence and honor to God than these did to a man that was dead. But the Papists, however, dwell much on another point, — that whatever has been handed down from the fathers ought to be observed; and thus they reason, “The authority of the whole Church is greater than that of a private man; now the Rechabites are commended for having followed the command of a private individual, much more then ought we to obey the laws of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, v. 7, on the Rechabites</span></figcaption>

</figure><figure class="quote" id="q-fc0918174f" data-kw="">
<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)…

3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery…

4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), question 16, pp. 64-65</span></figcaption>

<blockquote><p>If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>

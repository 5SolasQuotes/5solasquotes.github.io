<blockquote><p>CANON 6. If anyone says that God has mercy upon us when, apart from his grace, we believe, will, desire, strive, labor, pray, watch, study, seek, ask, or knock, but does not confess that it is by the infusion and inspiration of the Holy Spirit within us that we have the faith, the will, or the strength to do all these things as we ought; or if anyone makes the assistance of grace depend on the humility or obedience of man and does not agree that it is a gift of grace itself that we are obedient and humble, he contradicts the Apostle who says, “What have you that you did not receive?” (1 Cor. 4:7), and, “But by the grace of God I am what I am” (1 Cor. 15:10). CANON 7. If anyone affirms that we can form any right opinion or make any right choice which relates to the salvation of eternal life, as is expedient for us, or that we can be saved, that is, assent to the preaching of the gospel through our natural powers without the illumination and inspiration of the Holy Spirit, who makes all men gladly assent to and believe in the truth, he is led astray by a heretical spirit, and does not understand the voice of God who says in the Gospel, “For apart from me you can do nothing” (John 15:5), and the word of the Apostle, “Not that we are competent of ourselves to claim anything as coming from us; our competence is from God” (2 Cor. 3:5).1</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange, (AD 529)</cite></span></figcaption>

<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking Unto Jesus… (d. 1664; Edinburgh: Ormiston, 1723)</cite>, pp. 246–47</span></figcaption>

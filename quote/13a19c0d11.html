<main class="wrap"><figure class="quote" id="q-13a19c0d11" data-kw="">
<blockquote><p>[S]ince it is obvious that those who voluntarily give themselves over to beggary are men prone to every crime, what else do those people who foster them do but sustain and support very harmful pests of society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 258.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“[S]ince it is obvious that those who voluntarily give themselves over to beggary are men prone to every crime, what else do those people who foster them do but sustain and support very harmful pests of society.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cdb3944bc9" data-kw="">
<blockquote><p>Secondly, There is no salvation out of the Church, but there may be salvation out of the visible Church. As multitudes that are in the visible Church are not saved, so some out of it may be saved. I speak not this to encourage any to neglect being of the visible Church… Is not the greatest company in any visible Church either such open profane, or careless Christians, or downright hypocrites? Are there not ten, an hundred of such for one that truly fears God? Well, when we speak of the Holy Catholic Church, can we only think of that which is visible, as to an outward profession, in which millions perish and go to Hell forever? No, we are to think of the Church invisible; the number known to God of his faithful ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Genuine Remains of</cite>, … John Lightfoot... (d. 1675; London: R.J., 1700), Tract 3, ‘An Exposition of Two Select Articles of the Apostles’ Creed’, I. ‘I believe the Holy Catholick Church’, pp. 241-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“Secondly, There is no salvation out of the Church, but there may be salvation out of the visible Church. As multitudes that are in the visible Church are not saved, so some out of it may be saved. I speak not this to encourage any to neglect being of the visible Church… Is not the greatest company in any visible Church either such open profane, or careless Christians, or downright hypocrites? Are there not ten, an hundred of such for one that truly fears God? Well, when we speak of the Holy Catholic Church, can we only think of that which is visible, as to an outward profession, in which millions perish and go to Hell forever? No, we are to think of the Church invisible; the number known to God of his faithful ones.”

</figure><figure class="quote" id="q-049460e9ff" data-kw="">
<blockquote><p>But for our rebellion against his Majesty’s person or lawful authority, the Lord knows my soul abhors it name and thing. Loyal I have been, and wills every Christian to be so; and I was ever of this judgment to give to Caesar the things that are Caesar’s, and to God the things that are God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-e8163bee18" data-kw="">
<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, bk. 1, ch. 19, pp. 395-96 in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 402</span></figcaption>

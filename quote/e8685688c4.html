<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Government of the Church of Scotland, Article 5</cite></span></figcaption>

</figure><figure class="quote" id="q-2f55322314" data-kw="">
<blockquote><p>But that all doubt may be better cleared away, this principle should ever be kept in mind, that baptism is not conferred on children in order that they may become sons and heirs of God, but, because they are already considered by God as occupying that place and rank, the grace of adoption is sealed in their flesh by the rite of baptism. Otherwise the Anabaptists are in the right in excluding them from baptism. For unless the thing signified by the external sign can be predicated of them, it will be a mere profanation to call them to a participation of the sign itself. But if any one were inclined to refuse them baptism, we have a ready answer; they are already of the flock of Christ, of the family of God, since the covenant of salvation which God enters into with believers is common also to their children. As the words import ‘I will be thy God and the God of thy seed after thee.’ Unless this promise had preceded, certainly it would have been wrong to confer on them baptism. Now I ask whether the Word of God is sufficient by its intrinsic value for our salvation, or whether some aid must be borrowed elsewhere to supply its defect, or help its infirmity? If this promise is not believed to be efficacious in itself, not only the virtue of God, but also his grace and truth will be attached to the external sign. Thus those men, while they strive to honor baptism, cast serious ignominy on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 438–To John Clauburger in Letters of John Calvin, ed. Bonnet (Philadelphia: Presbyterian Board of Publication, 1858), vol. 3</cite>, pp. 282-283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-ad60a76b03" data-kw="">
<blockquote><p>What fruit or profit cometh of the baptizing of infants? It serveth for the parents’ comfort, for the sign being committed to the child (as by a printed seal) doth confirm the promise made to the godly parent: that the Lord, will be a God, not to him only, but to his seed also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucan.html">William Bucan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’</cite>, p. 737</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-99709e246d" data-kw="">
<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are: 1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause. 2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism. 3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 2, ‘Whether or no children be received into the visible Church by Baptism’ in The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5</cite>, pp. 210-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

9e246d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99709e246d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Hence%20baptism%20is%20a%20seal%20of,working%20and%20operation%20of%20the%20Sacraments&amp;text=Hence%20baptism%20is%20a%20seal%20of%20our%20incorporation&amp;text=the%20efficiency%2C%20working%20and%20operation%20of%20the%20Sacraments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

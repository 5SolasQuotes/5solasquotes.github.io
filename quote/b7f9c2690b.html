<main class="wrap"><figure class="quote" id="q-b7f9c2690b" data-kw="">
<blockquote><p>That it is the property of the faithful man to be fully persuaded of the truth of those things that are delivered in the holy scripture, and not to dare either to reject or add any thing thereunto . For if whatsoever is not of faith be sin, as the Apostle saith, and faith is by hearing, and hearing by the word of God; then whatsoever is without the holy scripture, being not of faith, must needs be sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">St Basil</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ethicis Regul., xvi &amp; lxxx</cite>, ch. 22</span></figcaption>

<blockquote><p>A mean or medium, as it is such, is less than the end, though the thing materially that is a mean may be more excellent. Every mean, as a mean, under that reduplication, has all its goodness and excellency in relation to the end; yet an angel that is a mean (or medium) and a ministering spirit, ordained of God for an heir of life eternal (Heb. 1:13) considered materially, is more excellent than a man (Ps. 8:5; Heb. 2:6-8).</p></blockquote>

</figure><figure class="quote" id="q-b832562738" data-kw="">
<blockquote><p>What holy invectives does Paul in his epistles make against superstitious worship? Yet how few are the men that mind the pure instituted worship of God, that would have the fountains of Israel without the mixture of any mud in them? Outward oppressions in Popery were nothing so heavy upon the godly as the corrupt mixtures in God’s worship; but if you observe the general disposition of men, they are wholly carried out to some sensible superstitious ways of worship. They love not the simplicity and purity of God’s worship. It is great proficiency in Christianity not to have our minds corrupted herein. As children delight in babies, so do men [delight] in some worships of their own that they have made. What is Popery but a mere stage-play in the worship of God? And if you ask of hundreds of ceremonies they have: ‘Whose image and superscription is upon them?’ You shall find none of God’s imprinted on them. There were the statutes of the heathens (Lev. 20) and these the people must not go in (Eze. 20). There are statutes of our fathers we must not walk in: Oh there is too much of this superstition still in men! Men by false worship manifest they have not spiritual hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652) | section 11, sermon 95, pp. 563-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

0epistles&amp;text=false%20worship%20manifest%20they%20have%20not%20spiritual%20hearts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-630b9d1cd4" data-kw="">
<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 3, sermon 19, p. 105</span></figcaption>

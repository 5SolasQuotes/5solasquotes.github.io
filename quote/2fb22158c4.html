<main class="wrap"><figure class="quote" id="q-2fb22158c4" data-kw="">
<blockquote><p>For petra (rock) is not derived from Peter, but Peter from petra; just as Christ is not called so from the Christian, but the Christian from Christ. For on this very account the Lord said, On this rock will I build my Church, because Peter had said, You are the Christ, the Son of the living God. On this rock, therefore, He said, which you have confessed, I will build my Church. For the Rock (Petra) was Christ; and on this foundation was Peter himself also built. For other foundation can no man lay than that is laid, which is Christ Jesus. The Church, therefore, which is founded in Christ received from Him the keys of the kingdom of heaven in the person of Peter, that is to say, the power of binding and loosing sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tractates on the Gospel of John</cite>, tract. 124, §5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>

</figure><figure class="quote" id="q-43f398b797" data-kw="Upon this rock">
<blockquote><p>Mt. 16:18 does not favor the primacy of Peter. First, the passage is allegorical and metaphorical, admitting of various interpretations. Assuredly, it cannot establish an ecumenical pontificate, which ought to be proved by some express passage. Second, these things are certainly said to Peter, but not about Peter. The reasons are various. (a) From the very words because Petra is expressly distinguished from Petro, both in person and in gender, as the denominating and the denominated. Yet if he had wished to indicate Peter, why did he use both? Why did he not say, “Thou art Peter and upon thee” (which would have removed all difficulty). Rather he says “and upon this rock.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/peters-primacy.html">Peter&#x27;s primacy</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/primacy-of-peter.html">Primacy of Peter</a></span></div>

</figure><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>The cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 3</span></figcaption>

</figure><figure class="quote" id="q-3691a951d9" data-kw="">
<blockquote><p>They usurp the divinity and office of Christ. The effect is the same as if they said, &quot;I am Christ; I am a Savior. I save myself and others.&quot; This is the impression the monks give out. The Pope is the Antichrist, because he is against Christ, because he takes liberties with the things of God, because he lords it over the temple of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 94</span></figcaption>

<main class="wrap"><figure class="quote" id="q-aa50068cff" data-kw="">
<blockquote><p>For will it be more difficult to get over any stop that the religion of Mahomet may lay in our inquirer’s way? Let a man seriously peruse the Alcoran [Koran], and if he has his senses about him, he cannot but there see the most pregnant evidences of the grossest, most scandalous and impudent imposture that ever was obtruded upon the world. Here he must expect no other evidence for what he is to believe but the bare assertion of one who was scandalously impious to that degree that his own followers know not how to apologise for him.

If you inquire for any other evidence, you are doomed by the Alcoran to everlasting ruin, and his slaves are ordered to destroy you. He forbids any inquiry into his religion or the grounds of it, and therefore you must either admit in bulk the entire bundle of fopperies, inconsistencies and shocking absurdities that are cast together in the Alcoran, without any trial, or reject all; and in this case, no wise man will find it hard to make a choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith and Revelation</cite>, (1714; Aberdeen: James Begg Society, 2003), pp 18-19.</span></figcaption>

<blockquote><p>Mr. Hooker, Mr. Thomas Goodwin, and Mr. Philip Nye [congregationalists] give them [the eldership of a local church] only an authoritative directing power [to ordain new elders], such as parents have in the marriage of their daughter, which is an authority extrinsic, which the magistrate and pastor in their kind have; but the virgin has the only formal and intrinsic power to consent and so to make the marriage, and to dissent so as it shall be no marriage: In which case the Fraternity only, or Male-church formally [according to congregationalists], intrinsically judges, and may judge, though there were no officers, as the maid may marry, though parents and tutors were dead; and the directive authority of the officers may be wanting [lacking], as the directive authority of the magistrate may be wanting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 3, p. 308</span></figcaption>

</figure><figure class="quote" id="q-fc0918174f" data-kw="">
<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)…

3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery…

4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), question 16, pp. 64-65</span></figcaption>

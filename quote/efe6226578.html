<blockquote><p>Let us then see what the kingdom of Christ is, which begins in the faithful in this world… The kingdom of Christ in this world is the administration of salvation, whereby Jesus Christ the king Himself, outwardly gathers to Himself through the Gospel and sacrament of baptism, a people or visible Church (in which many hypocrites are mingled) and calls them to salvation, and administers and gives Himself the same salvation to which He calls them, in those whom He accounts for his elect in this congregation…</p></blockquote>

<blockquote><p>Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 258</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

eformedbooksonline.com/the-extent-of-christs-mediatorial-kingdom-2/#:~:text=Thirdly%2C%20howsoever%20an%20absolution%20shall%20be,when%20we%20come%20to%20%E2%80%98our%20home&amp;text=Thirdly%2C%20howsoever%20an%20absolution%20shall%20be%20completed%20at&amp;text=way%2C%E2%80%99%20not%20when%20we%20come%20to%20%E2%80%98our%20home" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>

</figure><figure class="quote" id="q-6d44b6da67" data-kw="">
<blockquote><p>Second, He did not offer Himself for angels, because He is not the epilēptōr (ἐπιλήπτωρ), the undertaker and redeemer of angels (Heb. 2:16). Therefore, we think it imprudently said that Christ’s blood suffices to redeem demons (Cornelius Jansen, Augustinus, tome 3, p. 382). Third, Christ sanctified and offered Himself for the seed of Abraham, whose epilēptōr He is (Heb. 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 61, ‘On the Satisfaction of Christ’ in Sum of Theology (Geneva, 1665), trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-f819638ef1" data-kw="">
<blockquote><p>I. God as the supreme Lord has true right over the actions of all men, both internal and external, that they may serve his glory and obedience be rendered to him in all things (Luke 17:10), which obedience moreover he as ruler has commanded and sanctioned under the gravest threats (Gen 2:17, Deut 27:26). When man violates this right and denies this obedience to God, he commits two things: 1) he does not acknowledge the lordship of his master over himself, 2) he despises him, even by disdaining his laws before his sight, who pays heed to all the ways of men. Hence this wickedness is so great that none greater can be given; by it man turns away from the infinite good, and consequently merits for himself the privation of the highest good; whence he has been handed over by his Lord, whose obedience he refused, into servitude to the Devil and his servants, that he may be tormented by them in [God’s] name and experience the gravity of the lordship he despised (Jude 5-6). … III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied…. … VI. But Christ, offering himself to God (our Lord whose captives we were, by Thesis 1) as a sacrifice and victim (of the same character as the Old Testament victims) as a fragrant aroma (Eph 5:2, Heb 8:3, 9:14; cf. Gen 8:21, Lev 1), separated us from servitude to the Devil, etc. Therefore [he redeemed us]. Socinus (Praelections, ch. 9) and Volkelius (ibid.) declaim here in a rather diluted rhetorical way, hence the price had to be paid to the Devil – as if the λύτρον [ransom] were owed to the punishment or its executioner, and not to the one in whose name it is commanded and inflicted! When someone is freed from the gallows by the intervention of a payment, is it brought to the gallows or the executioner? or rather to the one who holds the right of majesty? We see here that it is not impossible to demonstrate to whom this price was paid, as Volkelius thinks (lib. 3, cap. 18). For the passages alleged teach that Christ offered himself to God as a victim for us. Christ, therefore, is such a redeemer who freed us by the intervention of a price (Acts 20:28, 1 Pet 1:18-19), which price indeed agrees in the formality of price with what is used in exchanges, like gold, silver, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. Onku with AI (Utrecht, 1650) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“I. God as the supreme Lord has true right over the actions of all men, both internal and external, that they may serve his glory and obedience be rendered to him in all things (Luke 17:10), which obedience moreover he as ruler has commanded and sanctioned under the gravest threats (Gen 2:17, Deut 27:26). When man violates this right and denies this obedience to God, he commits two things: 1) he does not acknowledge the lordship of his master over himself, 2) he despises him, even by disdaining his laws before his sight, who pays heed to all the ways of men. Hence this wickedness is so great that none greater can be given; by it man turns away from the infinite good, and consequently merits for himself the privation of the highest good; whence he has been handed over by his Lord, whose obedience he refused, into servitude to the Devil and his servants, that he may be tormented by them in [God’s] name and experience the gravity of the lordship he despised (Jude 5-6). … III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied…. … VI. But Christ, offering himself to God (our Lord whose captives we were, by Thesis 1) as a sacrifice and victim (of the same character as the Old Testament victims) as a fragrant aroma (Eph 5:2, Heb 8:3, 9:14; cf. Gen 8:21, Lev 1), separated us from servitude to the Devil, etc. Therefore [he redeemed us]. Socinus (Praelections, ch. 9) and Volkelius (ibid.) declaim here in a rather diluted rhetorical way, hence the price had to be paid to the Devil – as if the λύτρον [ransom] were owed to the punishment or its executioner, and not to the one in whose name it is commanded and inflicted! When someone is freed from the gallows by the intervention of a payment, is it brought to the gallows or the executioner? or rather to the one who holds the right of majesty? We see here that it is not impossible to demonstrate to whom this price was paid, as Volkelius thinks (lib. 3, cap. 18). For the passages alleged teach that Christ offered himself to God as a victim for us. Christ, therefore, is such a redeemer who freed us by the intervention of a price (Acts 20:28, 1 Pet 1:18-19), which price indeed agrees in the formality of price with what is used in exchanges, like gold, silver, etc.”

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’ tr. Onku with AI (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+God+as+the+supreme+Lord+has+true+right+over+the+actions+of+all+men%2C+both+internal+and+external%2C+that+they+may+serve+his+glory+and+obedience+be+rendered+to+him+in+all+things+%28Luke+17%3A10%29%2C+which+obedience+moreover+he+as+ruler+has+commanded+and+sanctioned+under+the+gravest+threats+%28Gen+2%3A17%2C+Deut+27%3A26%29.+When+man+violates+this+right+and+denies+this+obedience+to+God%2C+he+commits+two+things%3A+1%29+he+does+not+acknowledge+the+lordship+of+his+master+over+himself%2C+2%29+he+despises+him%2C+even+by+disdaining+his+laws+before+his+sight%2C+who+pays+heed+to+all+the+ways+of+men.+Hence+this+wickedness+is+so+great+that+none+greater+can+be+given%3B+by+it+man+turns+away+from+the+infinite+good%2C+and+consequently+merits+for+himself+the+privation+of+the+highest+good%3B+whence+he+has+been+handed+over+by+his+Lord%2C+whose+obedience+he+refused%2C+into+servitude+to+the+Devil+and+his+servants%2C+that+he+may+be+tormented+by+them+in+%5BGod%E2%80%99s%5D+name+and+experience+the+gravity+of+the+lordship+he+despised+%28Jude+5-6%29.+%E2%80%A6+III.+Hence+if+any+are+vindicated+from+this+servitude+%28as+it+is+certain+that+all+the+elect+have+been+and+will+be+vindicated%29%2C+it+is+necessary+that+this+acknowledgment%2C+that+is%2C+the+restitution+of+honor%2C+be+exhibited+to+the+supreme+Lord+and+Ruler+injured+and+offended+by+our+disobedience%2C+and+that+his+laws+and+exactions+be+satisfied%E2%80%A6.+%E2%80%A6+VI.+But+Christ%2C+offering+himself+to+God+%28our+Lord+whose+captives+we+were%2C+by+Thesis+1%29+as+a+sacrifice+and+victim+%28of+the+same+character+as+the+Old+Testament+victims%29+as+a+fragrant+aroma+%28Eph+5%3A2%2C+Heb+8%3A3%2C+9%3A14%3B+cf.+Gen+8%3A21%2C+Lev+1%29%2C+separated+us+from+servitude+to+the+Devil%2C+etc.+Therefore+%5Bhe+redeemed+us%5D.+Socinus+%28Praelections%2C+ch.+9%29+and+Volkelius+%28ibid.%29+declaim+here+in+a+rather+diluted+rhetorical+way%2C+hence+the+price+had+to+be+paid+to+the+Devil+%E2%80%93+as+if+the+%CE%BB%CF%8D%CF%84%CF%81%CE%BF%CE%BD+%5Bransom%5D+were+owed+to+the+punishment+or+its+executioner%2C+and+not+to+the+one+in+whose+name+it+is+commanded+and+inflicted%21+When+someone+is+freed+from+the+gallows+by+the+intervention+of+a+payment%2C+is+it+brought+to+the+gallows+or+the+executioner%3F+or+rather+to+the+one+who+holds+the+right+of+majesty%3F+We+see+here+that+it+is+not+impossible+to+demonstrate+to+whom+this+price+was+paid%2C+as+Volkelius+thinks+%28lib.+3%2C+cap.+18%29.+For+the+passages+alleged+teach+that+Christ+offered+himself+to+God+as+a+victim+for+us.+Christ%2C+therefore%2C+is+such+a+redeemer+who+freed+us+by+the+intervention+of+a+price+%28Acts+20%3A28%2C+1+Pet+1%3A18-19%29%2C+which+price+indeed+agrees+in+the+formality+of+price+with+what+is+used+in+exchanges%2C+like+gold%2C+silver%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98Theological+Disputation+on+the+Satisfaction+of+Christ%E2%80%99+tr.+Onku+with+AI+%28Utrecht%2C+1650%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff819638ef1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f819638ef1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/atonement#:~:text=I.%20God%20as%20the%20supreme%20Lord,in%20exchanges%2C%20like%20gold%2C%20silver%2C%20etc&amp;text=I.%20God%20as%20the%20supreme%20Lord%20has%20true&amp;text=is%20used%20in%20exchanges%2C%20like%20gold%2C%20silver%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

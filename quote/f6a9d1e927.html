<main class="wrap"><figure class="quote" id="q-f6a9d1e927" data-kw="">
<blockquote><p>If we would show that we are truly godly people, then we must absolutely not indulge ourselves in such things as the godless are accustomed to use. As soon as we learn how displeasing such things are to God, and if we are really serious and want to show that we are indeed godly people, we must be found fighting against them all. We should therefore deny ourselves for God’s sake, even if we loved some of these sins as much as our own right eye, yes, even if some sin seems as necessary and as profitable to us as our own right hand. Nevertheless, in such cases we must cut sin off for God’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-teellinck.html">Willem Teellinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Path of True Godliness</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke, Classics of Reformed Spirituality (1636; Grand Rapids MI: Reformation Heritage Books, 2003), p. 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d884e759d2" data-kw="">
<blockquote><p>[T]he law, Deut. 13. 6, 7, 8, 9. concerning the stoning and killing of him, who shall secretly entice people, saying, Let us go after other gods. If it be said, that this law did bind the Jews only, and is not moral nor perpetual. I answer, Jacobus Acontius, though he be of another opinion concerning this question then I am, yet he candidly and freely confesseth, that he seeth nothing in that law, which doth not belong to the New Testament, as well as the Old; for saith he, the reason and ground of the law, the use and end of it, is moral and perpetual, ver. 11. All Israel shall hear and fear, and shall doe no more any such wickedness, as this is among you.

But yet, saith Acontius, this law doth not concern Heretics, who believe and teach errors concerning the true God or his worship; but only Apostates who fall away to other gods: In this I shall not much contend with him; only thus far, if Apostates are to be stoned and killed according to that law, then surely seducing Heretics are also to receive their measure and proportion of punishment; The moral equity of the law requireth thus much at least, that if we compare Heresy and Apostasy together, look how much less the evil of sin is in Heresy, so much and no more is to be remitted of the evil of punishment, especially the danger of contagion and seducement, being as much or rather more in Heresy then in Apostasy; yea, that which is called Heresy being oftentimes a real following after other gods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity reconciled with Christian liberty, or, The true resolution of a present controversy concerning liberty of conscience here you have the question stated, the middle way betwixt popish tyranny and schismatizing liberty approved and also confirmed from Scripture and the testimonies of</cite>, (London: Christopher Meredith, 1645), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-e7d02b7932" data-kw="">
<blockquote><p>…an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. [That is, a magistrate not doing these ennumerated things is still a valid magistrate.] For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [from the nature of the magisterial work], and operantium [from the nature of the persons working by the office]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither from the nature or the intention of the work of magistracy, nor from the nature of the magistrate working]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London: 1646), ch. 24, pp. 547-48</span></figcaption>

</figure><figure class="quote" id="q-ad24e8d162" data-kw="">
<blockquote><p>Transgressions of the law of property are on this principle punished by the demand for restitution, which is compensative to him who has suffered from theft or robbery, together with such additions as are necessary to indemnify him for the loss he may have temporarily sustained, and for the trouble he may have had in obtaining redress of his wrong. Thus, by the law of God, a thief was compelled to restore fourfold.

Those offences, again, which consist in destroying the virtue, order, or happiness of society – those acts which are directed against what is essential to the well-being of all around – and for which no sacrifice of personal service, no payment of money, no loss of liberty, can compensate, are to be punished with death; that is, with the forfeiture of the power which has been so abused, that the individual may never be able to repeat the crime. Thus treason, adultery, blasphemy, &amp;c., are by the divine law visited with capital punishment, because they are directed against the very first principles of law, government, and society, whether these be human or divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craig.html">Robert Craig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theocracy or the principles of the Jewish religion and polity adapted to all nations and times</cite>, (Edinburgh, 1848), pp 282-3.</span></figcaption>

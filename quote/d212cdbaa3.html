<main class="wrap"><figure class="quote" id="q-d212cdbaa3" data-kw="">
<blockquote><p>We know that God created the world in time; but why He did not create the world millions of years before, we are ignorant of, and our reasons would be bewildred in their too much curiosity. If we ask why He did not create it before, we may as well ask why He did create it then? And may not the same question be asked, if the world had been created millions of years before it was? That He created in it six days, and not in an instant, is revealed; but why He did not do it in a moment, since we are sure He was able to do it, is not revealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682), ‘Wisdom of God’, p. 414</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-32d4291ae7" data-kw="">
<blockquote><p>[Thomas, Summa, pt. 1, quest. 25, art. 2:] Reply to second objection. ‘Even if it were to produce no effect, the power of God would not be ineffectual: because a thing is ineffectual which is ordained to an end to which it does not attain. But the power of God is not ordered toward its effect as toward an end; rather it is the end of the effect produced but it.’ St. Thomas in this reply observes that ‘the power of a univocal agent is wholly manifested in its effect. The generative power of man is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect,’ just as the power of the sun is not wholly manifested, for instance, in the ripening of the fruits of the earth. But God evidently is not a univocal agent. ‘Hence his effect is always less than his power.’ Nevertheless His infinite power is manifested in the mode of producing things, inasmuch as He produces something out of nothing, or from no presupposed subject. Analogically we say that men of great genius are superior to the works they produce; but it is, nevertheless, in the way they produce these works that their superiority is seen. On the contrary, men of ordinary ability are, so to speak, univocal agents, and the whole of their power is manifested in the effect produced. They could not do more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The One God: a Commentary on the First Part of St. Thomas’ Theological Summa</cite>, (Herder Book Co., 1943), ch. 25, p. 721</span></figcaption>

<blockquote><p>Philo Judaeus, Origen, Athanasius, Hilary, Augustine, Procopius of Gaza, Arnold of Chartres, R. Moses ben Maimonides in Moreh Nebuchim, bk. 2, ch. 30, 72, Cajetan, Bodin and Melchior Canus willed that the work of creation was accomplished in a moment, not in six days, and they thought that the six-day period of Moses should be understood allegorically. To whom we oppose: 1. The history of Creation in Gen. 1:5 ff., which relates in clear words what things were created on each day. 2. The sanctification of the Sabbath, for which this reason is given, because God created the heaven and the earth in six days and rested on the seventh day; which could not be said if the work of creation had been accomplished in a moment. Nor is the contrary opinion proved from Sirach 18:1, “He that lives for ever created all things at once (κοινῇ)”; for the little word κοινῇ refers not to “created,” but to “all things,” so that the sense is that God created all things without exception, and it is a collective of all created species, not, however, of time to a moment, and is to be taken not chronologically (χρονικῶς), but as a summary (συναγωγικῶς). Whence 3. Other fathers rightly defend the six-day creation with us, e.g., Chrysostom, Basil, Nazianzen, Ambrose, Gregory; to whom 4. Almost all the Scholastics subscribe. See Becanus, Theologia Scholastica, pt. 1, tract 4, ch. 1; Boyvin, Philosophia Scoti, pt. 1, Physics, pt. 2, disp. 1, ch. 3, sect. 1, quest. 6, p. 460-61. To the question, however: “Could not at least the works of individual days have been produced in a single moment?” we respond: The works of the first creation, or the first and immediate creation, were made in a single moment and a very brief space of time. In the mediate and second creation also [through the rest of the week], the command itself or the fiat of God was accomplished in a single moment, to which the works of the subsequent days, conformably to the nature of things, some were made without delay, at least a protracted one, some with some delay, in such a way, however, that the work of each day was completed on each day. What was disputed concerning this question between Maresius and Wittich, read in Wittich, Theologia Pacifica, ch. 7, §71-73, pp. 52-53; cf. also Burmann, Synopsis Theologiae, bk. 1, ch. 42, §6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706) Latin</span></figcaption>

0%9CCould+not+at+least+the+works+of+individual+days+have+been+produced+in+a+single+moment%3F%E2%80%9D+we+respond%3A+The+works+of+the+first+creation%2C+or+the+first+and+immediate+creation%2C+were+made+in+a+single+moment+and+a+very+brief+space+of+time.+In+the+mediate+and+second+creation+also+%5Bthrough+the+rest+of+the+week%5D%2C+the+command+itself+or+the+fiat+of+God+was+accomplished+in+a+single+moment%2C+to+which+the+works+of+the+subsequent+days%2C+conformably+to+the+nature+of+things%2C+some+were+made+without+delay%2C+at+least+a+protracted+one%2C+some+with+some+delay%2C+in+such+a+way%2C+however%2C+that+the+work+of+each+day+was+completed+on+each+day.+What+was+disputed+concerning+this+question+between+Maresius+and+Wittich%2C+read+in+Wittich%2C+Theologia+Pacifica%2C+ch.+7%2C+%C2%A771-73%2C+pp.+52-53%3B+cf.+also+Burmann%2C+Synopsis+Theologiae%2C+bk.+1%2C+ch.+42%2C+%C2%A76.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+Creation%E2%80%99+%28Frankfurt%3A+Steppinus%2C+1706%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb51e8b1a95.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b51e8b1a95.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=Philo%20Judaeus%2C%20Origen%2C%20Athanasius%2C%20Hilary%2C%20Augustine,Theologiae%2C%20bk.%201%2C%20ch.%2042%2C%20%C2%A76&amp;text=Philo%20Judaeus%2C%20Origen%2C%20Athanasius%2C%20Hilary%2C%20Augustine%2C%20Procopius%20of&amp;text=Burmann%2C%20Synopsis%20Theologiae%2C%20bk.%201%2C%20ch.%2042%2C%20%C2%A76" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. Though Christ has purchased a peculiar people to Himself, to the purpose of salvation, yet others taste of this his goodness. The world, you know, was lost in merit, and ipso facto forfeited, with all its comforts, and appurtenances. The Lord Christ has restored it, and does keep it standing; and in the interim, the worst enjoy it in common with the best, and so far, far the better for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-harris.html">Robert Harris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached to the honorable House of Commons assembled in Parliament, at a public fast, May 25</cite>, 1642 (London: for John Bartlet, 1642), p. 32 Harris (1581-1658) was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d33ddd19d4" data-kw="">
<blockquote><p>Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Tale of Two Wills</cite>, (2009): 211-25, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>‘Who has made us fit.’ Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (Jn. 10), for his Church only (Eph. 1), not for the world (Jn. 17). And therefore when the Scripture says Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the elect: for all, that is, for the elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the gentiles also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (1617), on Col. 1:12, p. 99</span></figcaption>

<blockquote><p>Now the general satisfaction of Christ, which was the first act of his priestly office, prepares the way for God’s mercy, by making the sins of all mankind pardonable, the interposition of any bar from God’s justice notwithstanding, and so puts the sons of men only in a possibility of being justified, a thing denied to the nature of fallen angels, which the Son was not pleased to assume; but the special application of this satisfaction vouchsafed by Christ unto those persons only whom his Father has given Him out of the world, which is an appendant, or appertains to the second act of his priesthood, viz. his intercession, produces this potentia in actum, that is, procures an actual discharge from God’s anger; and makes justification, which before was a part of our possibility, to be a part of our present possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, p. 569</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

on" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bd89f9854c" data-kw="">
<blockquote><p>This proves, therefore — (1.) That Christ did not die simply to make the salvation of those for whom he died possible — i.e., to remove legal obstructions to their salvation — but that he died with the design and effect of actually securing their salvation and of endowing them gratuitously with an inalienable title to heaven. (2.) It proves, in the second place, that the vicarious sufferings of Christ must have been, in design and effect, personal and definite as to their object. Salvation must be applied to all those for whom it was purchased. Since not the possibility or opportunity for reconciliation, but actual reconciliation itself was purchased: since not only reconciliation, but a title to an eternal inheritance was purchased, it follows (a.) That “to all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same.” Conf. Faith, ch. 8 § 8. And (b.) That he who never receives the inheritance, and to whom the purchased grace is never applied, is not one of the persons for whom it was purchased.</p></blockquote>

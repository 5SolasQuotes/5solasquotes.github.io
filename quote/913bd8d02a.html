<main class="wrap"><figure class="quote" id="q-913bd8d02a" data-kw="">
<blockquote><p>Or, by way of further elaboration, in the case of an event, ‘a’, God can will ‘a’ or will ‘not-a’–but he can also ‘not will ‘a” without any necessity of willing ‘not-a’ and, indeed, he can ‘not will ‘a” and in the same moment ‘not will ‘not-a”. This distinction may be yet another example of the Scotist influence found in seventeenth-century Reformed thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D, p. 456</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75f5d452aa" data-kw="">
<blockquote><p>It is pleaded as an excuse for him [Adam], that his fall was decreed by God, and therefore was unavoidable by him. But voluntary transgression is sufficient and more than sufficient to ground guilt. Nor indeed is the secret purpose of God a proper and genuine cause of sin, but the free will of man… When man discovers that the cause of his sin is within himself, what boots it for him to fetch a circuit and seek for it in heaven? The blame is obviously his own, inasmuch as he willed to sin… The reason why God knowingly and willingly permitted man to fall by his own agency may be hidden from us, but it cannot have originated in injustice. This indeed must be held without controversy, that sin has always been hateful to Him… Although I say that he ordained it [the Fall], I cannot concede that He was in a proper sense the author of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Eternal Predestination of God (Consensus Genevensis, Niemeyer’s Coll.), pp. 267-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-552e96d443" data-kw="">
<blockquote><p>So that upon supposition of God’s will to permit Adam to fall, it was necessary that Adam should fall; necessary, I say, that he should fall: But how? Not necessarily, but contingently, and freely: and no other necessity is at this day found in man for the performing of any particular sinful act, but such as is joined with liberty; and that in such sort, as that the necessity is only Secundum quid [that which follows]; the liberty is Simpliciter [essential]: so called, I say, in respect of any particular act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, [John] Cotton’s Clearing Certain Doubts Concerning Predestination together with an Examination Thereof, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-075d4894b3" data-kw="unbelief">
<blockquote><p>Hence it is evident that the beginning of sin is better referred to unbelief than to pride, although in it both are joined. There ought to be the same order in the sin that was in the temptation. Now in the temptation man was first solicited to unbelief before pride. For by his interrogation, the tempter first urges him to doubt the word of God (Gen. 3:1), then to deny it (“Ye shall not surely die,” v. 4) before he incites to pride by the promise of divinity. Pride could not have place in man except on the positing of unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.6.6-7</span></figcaption>

</figure><figure class="quote" id="q-70bf458f2a" data-kw="apostasy">
<blockquote><p>The first sin of man (from which the others flow as from a fountain) is the voluntary apostasy of the first man from God, his Creator. In eating of the tree of the knowledge of good and evil, he transgressed not only this special interdict, but also in it the whole law of nature engraved upon his heart. It is certain that we must not regard that fall as any particular sin, such as theft or adultery, but as a general apostasy and defection from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.6.1-3</span></figcaption>

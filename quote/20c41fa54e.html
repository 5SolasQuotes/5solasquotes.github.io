<main class="wrap"><figure class="quote" id="q-20c41fa54e" data-kw="">
<blockquote><p>May we not rather pray for the hastening of this day seeing there is so much need of it? For there is no effectual remedy of corruptions in government and the miseries which flow from them, but that; especially seeing that when Christ says with such asseveration. Surely I come quickly. John seems to answer in the name of the Church, Amen. Even so come Lord Jesus?

Answ. We do or should pray daily, Thy Kingdom come. And we may pray for the accomplishing of all prophesies, but more especially for promises; but we may not pray for the end but with reference to all known means ordained thereunto; and as it’s vain to imagine that times determined in God’s decree, can be changed: so is it also presumptuous to desire it. It must suffice us that Christ comes quickly; not in our imaginary due season, but in the Father’s. To this we must add our Amen.

Even so, as fully persuading our selves, that his coming shall be, even the self day as Moses speaks of God’s faithfulness in his promise to bring Israel out of Egypt. But yet the Lamb’s wife hath not made her self ready, neither is she prepared as a bride adorned for her Husband; and though the promise is exceeding comfortable which is oft repeated behold I come quickly, and the performance of it is most certain on God’s part, and desirable on ours, yet our best meanes to hasten it is to further our own and the Churches reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lazarus-seaman.html">Lazarus Seaman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The head of the church, the judge of the world. Or, The doctrine of the day of judgement briefly opened and applied: in a sermon preached before the Right Honourable, the House of Peers; in the Abby-Church at Westminster, on a public fast day, Ian. 27. 1646. By Lazarus Seaman Preacher at All hallows</cite>, (London: I. Rothwell, 1647), p. 17.</span></figcaption>

<blockquote><p>‘Doth not even nature itself’ He [Paul] again sets forth nature as the mistress of decorum, and what was at that time in common use by universal consent and custom—even among the Greeks—he speaks of as being natural, for it was not always reckoned a disgrace for men to have long hair. Historical records bear, that in all countries in ancient times, that is, in the first ages, men wore long hair. Hence also the poets in speaking of the ancients, are accustomed to apply to them the common epithet of unshorn. It was not until a late period that barbers began to be employed at Rome—about the time of Africanus the elder. And at the time when Paul wrote these things, the practice of having the hair shorn had not yet come into use in the provinces of Gaul or Germany. Nay more, it would have been reckoned an unseemly thing for men, no less than for women, to be shorn or shaven; but as in Greece [Corinth] it was reckoned an unbecoming thing for a man to allow his hair to grow long, so that those who did were remarked as effeminate, he [Paul] reckons as nature a custom that had come to be confirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, | v. 12</span></figcaption>

<blockquote><p>If all the people may lawfully join themselves with that Church which has the ablest teacher, then almost all the world must go to a few men and leave the rest. Then Barnabas may be forsaken, if Paul be the chief speaker… And God has more means than ministerial abilities to increase men’s graces: He that keeps in God’s order under a meaner [less excellent], honest minister, is like to be a more humble, thriving Christian than he that will break that order under pretense of edification. The Lord knows that I speak against my own visible carnal interests in all this… 10. Christians should not first ask, ‘Where may I have the best minister, or company, or purest Ordinances? or where may I receive most good?’ But they must first ask, ‘Where lies my duty? and where may I do most good?’ For God’s work must be done before our own. And the saving of souls and propagation of the Gospel must be preferred before our comforts. Yea let me tell you my observation: The comfort that Christians have in a suffering, self-denying course of doing good is a surer and more stable comfort than that which is drawn from the special advantages of ordinances. That man that lives among a company of poor ignorant souls, and will set himself night and day resolvedly and unweariedly to teach them, persuade them and win them to Christ, till he have bettered the imperfect church where he is, shall usually be a man of solid settled peace. When he that says, ‘These are carnal, heathens, wicked; This is a weak ministry; I will go join myself to such an excellent minister and Church, and let them alone,’ this man will likely be soon sadded with his new comforts, and weary of his precious ordinances, and be as ready to vilify them and turn to some other till in this disorder he have run himself out of breath, if not out of all appearance of grace.</p></blockquote>

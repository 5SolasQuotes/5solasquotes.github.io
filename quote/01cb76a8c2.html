<blockquote><p>Q. 75. What is sanctification? A. Sanctification is a work of God’s grace, whereby they whom God hath, before the foundation of the world, chosen to be holy, are in time, through the powerful operation of his Spirit[b] applying the death and resurrection of Christ unto them,[c] renewed in their whole man after the image of God;[d] having the seeds of repentance unto life, and all other saving graces, put into their hearts,[e] and those graces so stirred up, increased, and strengthened,[f] as that they more and more die unto sin, and rise unto newness of life.[g] [b] Eph. 1:4. 1 Cor. 6:11. 2 Thess. 2:13. [c] Rom. 6:4-6. [d] Eph. 4:23,24. [e] Acts 11:18. 1 John 3:9. [f] Jude 20. Heb. 6:11,12. Eph. 3:16-19. Col. 1:10,11. [g] Rom. 6:4,6,14. Gal. 5:24.</p></blockquote>

<blockquote><p>The divine attributes are certain essential properties, which God is pleased in Scripture to ascribe or attribute unto Himself; they are also called the perfections of God, or divine predications or titles. They are not distinguished from the essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving. All the attributes in God are one and the same perfection. It is better said of God that He is his attributes than that He has attributes: The attributes are not distinguished in God, but in our manner of understanding, who, being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. (Est inadequatus conceptus sed non falsus [It is an inadequate concept, but not false]. See Weems, Of the Image of God in Man, ch. 13) The sun, when it is perpendicular, had it an eye, would behold all that at once which we, by reason of the inadequateness and unproportionableness of our sight, are necessitated to view by parts. In God all things are one and the same, according to the nature of God; though out of God [they appear] many and diverse, according to their own proper and created nature. The same heat in the sun produces diverse effects according to the various disposition of the objects: hardness in clay, softness in wax, life in insects and plants, etc. The same lines are one in the center, but distinguished and multiplied in the circumference. Water that is the same in the sea, out of the sea is variously and diversely qualified: sweet, bitter, sulfureous, etc. The matter in the liver is the same but the four humors of blood, choller, melancholy and phlegm that proceed from thence are very diverse. The soul which is one and the same produces very differing effects, as appears in the operations of the understanding, will, and affections. The sum is: The attributes, as was said before, are not distinguished in God, that is, from the divine essence or one from another really, but only notionally or virtually in our conception and in their objects in respect of the various effects thereupon: For every and all the attributes are the divine essence itself, according to that received proposition, ‘Whatsoever is in God, is God.’ (Fenner, Theol., bk. 1, ch. 3; Alsted, Theol., sect. 3, locus 2; Zanchi, Of the Nature of God, bk. 2, ch. 5, quest. 2) And this is the reason why some well describe the attributes from the essence of God: which manner of description, besides many useful notions clearly intimated thereby, does in the describing of the relative attributes, principle and fortify the understanding against that perilous tenet of Arminianism concerning the decree passing upon good or bad foreseen, with the evil consequences following thereupon. The divine attributes, though they can neither exactly be numbered or distributed, yet for our better understanding we may consider of them as Negative, Relative, Positive. … That God is a pure and simple act without all composition, is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.</p></blockquote>

<blockquote><p>…in a man regenerate, there are two contrary qualities inherent in every faculty: 1. Grace, in a rectified holy inclination to goodness, infused into it. 2. Corruption in a vitious quality disposing it to evil. These two qualities abide in the regenerate, and oppose one another… let us proceed to declare what is a regenerate man’s resistance that he makes against the working of grace in hindering the performance of any good work: which you shall perceive by these two conclusions: 1. A man regenerate so far forth as he is Spiritual, never resists the work of grace, but is constantly most willing and forward to the performance of all holy actions. … 2. That a man regenerate, so far forth as he is carnal, does always resist the work of grace, being unwilling and backward to perform any holy action. … To conclude this point, there is in every regenerate man a possibility or power of resistence always remaining so long as any corruption abides in him, which will perpetually make some opposition more or less in the performance of every good work. But for the prevailing act of resistency whereby such good works might be quite hindered, we affirm that by the power of assisting grace effectually aiding the regenerate faculties, that act is taken away. The flesh may strive, but the Spirit does overcome… a victory indeed certain in regard of the event, but with some uncertainty in the combat, wherein Israel is sometime put unto the worst. For you are to note that albeit in the general as touching those main and principal acts of beleeving, repenting, persevering in obedience, etc. grace does work so effectually with man’s regenerate will that corruption cannot hinder it in the exercise of those acts: nevertheless, in many particular actions after his first conversion in the continued practice of sanctification, he may obey the enticings of his corrupt concupiscence, against the motions of the Spirit of grace. For many times in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.</p></blockquote>

— William Pemble, pp. 148-57 in Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 148-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6in+a+man+regenerate%2C+there+are+two+contrary+qualities+inherent+in+every+faculty%3A+1.+Grace%2C+in+a+rectified+holy+inclination+to+goodness%2C+infused+into+it.+2.+Corruption+in+a+vitious+quality+disposing+it+to+evil.+These+two+qualities+abide+in+the+regenerate%2C+and+oppose+one+another%E2%80%A6+let+us+proceed+to+declare+what+is+a+regenerate+man%E2%80%99s+resistance+that+he+makes+against+the+working+of+grace+in+hindering+the+performance+of+any+good+work%3A+which+you+shall+perceive+by+these+two+conclusions%3A+1.+A+man+regenerate+so+far+forth+as+he+is+Spiritual%2C+never+resists+the+work+of+grace%2C+but+is+constantly+most+willing+and+forward+to+the+performance+of+all+holy+actions.+%E2%80%A6+2.+That+a+man+regenerate%2C+so+far+forth+as+he+is+carnal%2C+does+always+resist+the+work+of+grace%2C+being+unwilling+and+backward+to+perform+any+holy+action.+%E2%80%A6+To+conclude+this+point%2C+there+is+in+every+regenerate+man+a+possibility+or+power+of+resistence+always+remaining+so+long+as+any+corruption+abides+in+him%2C+which+will+perpetually+make+some+opposition+more+or+less+in+the+performance+of+every+good+work.+But+for+the+prevailing+act+of+resistency+whereby+such+good+works+might+be+quite+hindered%2C+we+affirm+that+by+the+power+of+assisting+grace+effectually+aiding+the+regenerate+faculties%2C+that+act+is+taken+away.+The+flesh+may+strive%2C+but+the+Spirit+does+overcome%E2%80%A6+a+victory+indeed+certain+in+regard+of+the+event%2C+but+with+some+uncertainty+in+the+combat%2C+wherein+Israel+is+sometime+put+unto+the+worst.+For+you+are+to+note+that+albeit+in+the+general+as+touching+those+main+and+principal+acts+of+beleeving%2C+repenting%2C+persevering+in+obedience%2C+etc.+grace+does+work+so+effectually+with+man%E2%80%99s+regenerate+will+that+corruption+cannot+hinder+it+in+the+exercise+of+those+acts%3A+nevertheless%2C+in+many+particular+actions+after+his+first+conversion+in+the+continued+practice+of+sanctification%2C+he+may+obey+the+enticings+of+his+corrupt+concupiscence%2C+against+the+motions+of+the+Spirit+of+grace.+For+many+times+in+sundry+particulars+of+Christian+practice+God+is+pleased+to+deny+that+effectual+assistance+which+at+other+times+He+affords%2C+and+then+He+leaves+us+unto+our+own+strength%2C+for+experiment+to+try+what+is+in+us%2C+for+humiliation+in+discovery+of+our+weakness+unto+us%2C+for+exercise+of+Christian+watchfulness+in+making+diligent+use+of+all+gracious+helps%2C+and+the+like+good+purposes.+%E2%80%A6+But+these+desertions+are+not+perpetual%3A+corruption+may+for+a+time+let+%5Bprevent%5D+the+exercise+of+some+particular+graces%2C+but+in+all+and+always+it+shall+never+hinder%3A+God+who+has+given+unto+a+regenerate+man+a+power+to+believe+by+the+changing+of+his+will+through+the+infusion+of+a+constant+inclination+to+all+spiritual+good%2C+will+also+cause+the+act+of+believing+infallibly+to+ensue%2C+by+the+assistance+of+cooperating+grace%2C+so+powerfully+strengthening+the+regenerate+will%2C+and+so+effectually+restraining+the+rebellious+motions+of+corruption+that+the+will+shall+not+choose+but+do+that+which+above+all+things+in+the+world+it+most+desires+to+do%2C+namely%2C+believe+and+obey+the+Gospel.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+pp.+148-57+in+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+pp.+148-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b2ac2e5f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b2ac2e5f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=in%20a%20man%20regenerate%2C%20there%20are,namely%2C%20believe%20and%20obey%20the%20Gospel&amp;text=in%20a%20man%20regenerate%2C%20there%20are%20two%20contrary&amp;text=to%20do%2C%20namely%2C%20believe%20and%20obey%20the%20Gospel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-acc274196c" data-kw="Sanctification Holy Spirit">
<blockquote><p>True sanctification is the result of the soul&#x27;s union with the holy Jesus, the first and immediate receptacle of the sanctifying Spirit; out of whose fullness, his members do, by virtue of their union with him, receive sanctifying influences. The other is the mere product of the man&#x27;s own spirit, which, whatever it has, or seems to have, of the matter of true holiness—yet does not arise from the supernatural principles, nor to the high aims and ends thereof: for, as it comes from self, so it runs out into the dead sea of self again; and lies as wide of true holiness, as nature does of grace. They who have this species of holiness, are like common boatmen, who serve themselves with their own oars: whereas the ship bound for Immanuel&#x27;s land, sails by the blowings of the divine Spirit.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4beebe13c1" data-kw="">
<blockquote><p>The Crimes of persons are grievous, but those of a State are more. The corruption of a member is not so grievous as of the whole Body; and the deformity of the Body Political, is not so unpleasant to the eye of God as of the Church: this is the Body, this is the Bride of Christ; nothing so much provokes the passion of a loving Husband, as the polluting of his Spouse. Church-grievances were the first and main causes of our present Troubles; the righting of these, will open the door of our first hope of deliverance.

Whoso will observe either the spring or progress of our present Woes in all the three Kingdoms, will find that the open Oppression and secret Undermining of the Common-wealth, by the craft and tyranny of the malignant Faction, did highly provoke the wrath of God, and was a great occasion of all this Discord which hath broke out among men: Yet it is evident, that the principal cause which hath kindled the Jealousie of God, and enflamed the spirits of men to shake off and break in pieces those Yokes of Civil Slavery, which ingenuous necks were no more able to bear, was the constuprating [sic] of the Church, the bringing in upon her by violence, and daily multiplying of Errors, Superstitions, Idolatries, and other Spiritual Burdens.

The Method of our Cure, if ever it prove solid, must lead our Physicians to the fountain of our Disease. All Treaties for accommodating State-differences, will be lost, if in the first place Religion be not provided for, according to the mind of God. If once the Temple were builded, and filled with the cloud, the Difficulties would be small in making up the breaches in the house of the Kingdom, and filling it with Peace and Prosperity. So long as the Temple lies desolate, it is not possible to rear up the walls of the City. […]

Interests of private persons and particular Factions, laid over with the colour of pretended State-reasons, may procrastinate days without number, settling of Religion: yet if we trust either ancient or late experience, these States-men provide best for the welfare of their Country, who give to the God of heaven, to his Worship and House, the first and most high place in all their studies and cares.

If we behold either the former, or the later Reformers of the State of Israel; if we consider the practice of Moses, of David, of Hezekiah, of Zerubbabel, and others, it is evident the Tabernacle, the Ark, the Temple, did first and most lie at all their hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), pp 2-3.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59f824cb51" data-kw="">
<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maxwell.html">John Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacro-Sancta Regum Majestas</cite>, (1644; London: Dring, 1680) 304 pp. ToC, pp. 48-49</span></figcaption>

<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.”

— Thomas Hall, The Beauty of Magistracy in an Exposition of the 82nd Psalm, pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThen+church+and+state+are+like%5Bly%5D+to+flourish+when+Moses+and+Aaron%2C+Zerubbabel+and+Joshua%2C+Zech+4%3A14%2C+go+hand+in+hand+together.+When+the+minister+reproves+sin%2C+and+the+magistrate+punishes+it%3B+when+the+magistrate+makes+use+of+the+minister%E2%80%99s+direction%2C+and+the+minister+enjoys+the+magistrate%E2%80%99s+protection%3B+when+Joshua+joins+with+Eleazar%2C+and+David+consults+with+Nathan+and+Gad%2C+the+prophets+of+the+Lord%3B+and+Josiah+with+Huldah%2C+and+Uzziah+with+Zechariah+the+priest%2C+then%2C+and+never+till+then%2C+can+we+look+to+prosper%2C+2+Chron+26%3A5.+It+is+Aaron%E2%80%99s+office+to+speak%2C+but+it+is+Moses%E2%80%99s+rod+that+works+the+wonders.+Ministers+must+preach%2C+and+magistrates+must+punish+offenders.%E2%80%9D%0A%0A%E2%80%94+Thomas+Hall%2C+The+Beauty+of+Magistracy+in+an+Exposition+of+the+82nd+Psalm%2C+pp.+76-82+in+The+Beauty+of+Magistracy+in+an+Exposition+of+the+82nd+Psalm%2C+where+is+set+forth+the+necessity%2C+utility%2C+dignity%2C+duty%2C+and+mortality+of+magistrates%E2%80%A6+%28London%2C+1660%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdfcdf3c447.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dfcdf3c447.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=Then%20church%20and%20state%20are%20like%5Bly,preach%2C%20and%20magistrates%20must%20punish%20offenders&amp;text=Then%20church%20and%20state%20are%20like%5Bly%5D%20to%20flourish&amp;text=Ministers%20must%20preach%2C%20and%20magistrates%20must%20punish%20offenders" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In 1834 the American Old Light Covenanter Synod rejected the false notion, which was originally espoused by Erastians, Tolerationists, and Anabaptist fanatics, but has even been propagated by some who claim to stand in the covenanting tradition, that civil punishment in the Old Testament was ecclesiastical discipline. Indeed, they opposed such an idea so strongly that they even condemned it as heresy:

As the doctrine of Erastus is not very popular in the present age, and as his followers depended much for the support of their cause on arguments taken from the state of things in the Jewish church, it might seem advisable to let the dispute sink into oblivion; but when we consider that multitudes of errorists and heretics in the present day, hold the same opinions respecting the Jewish church which were held by the Erastians, the discussion of this question is of no small importance. The Erastians, in order to support their doctrine, maintained that in the Jewish church there were no rulers distinct from the civil magistrate; and no discipline distinct from civil punishment. Our present heretics hold the same opinion; but the two parties deduce very different conclusions from the same premises. The Erastians, supposing that civil and ecclesiastical rulers were the same under the Old Testament, maintained that they are so still. Our present heretics, assuming the same false premises, allege, that all which is recorded of the pious kings of Judah suppressing idolatry, was done by them as ecclesiastical rulers; and that the ancient dispensation being abolished, their example is not to be followed by the Christian magistrate. In opposition to both, we maintain that the Jewish church had a government distinct from that of the state, and a discipline distinct from civil punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/general-synod-of-the-reformed-presbyterian-church.html">General Synod of the Reformed Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the General Synod of the Reformed Presbyterian Church, session seventeenth, held in the city of Pittsburgh, October, 1834. With an appendix containing two overtures: I. on the ‘jury act,’ II. on the magistrate’s power, circa sacra (Newburgh, 1834), pp 22-3.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-6e123c82f1" data-kw="">
<blockquote><p>I A.B. do bind and oblige me to keep the public peace, and if I fail that I shall pay a year’s rent; likewise, that my tenants and men-servants shall keep the public peace, and in case they fail, I oblige myself to pay for every tenant his year’s rent, and for every servant his year’s fee. And, for the more security, I’m content their presents be registrate in the books of Council.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-e1ae6820fa" data-kw="">
<blockquote><p>Separation is one thing, and not hearing such or such a man is a far other thing. There may be many just grounds of exception against a particular person, why people may refuse to countenance him, without any hazard of separation, or joining with separatists in their principles. Separation is one thing, and refusing to attend the ministry of such a man is another thing; for a man may join with ordinances in another congregation, and so testify that he has no prejudice at the ministry, but only against such a man in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-8ce7ded970" data-kw="">
<blockquote><p>The committee of the Assembly of Westminster, in their Reply to the Independents, said, If the Church impose anything that is sinful, we must forbear to comply, yet without separation, as was the practice of the puritans in the late times. As to the charge of schism, they admit that difference in judgment, in some particular points, is not schism; nor does an inconformity to some things enjoined deserve that name. But our [Independent] Brethren desire further to set up separate communions, which is a manifest rupture of our societies into others; and is therefore a schism in the Body. This is a setting up altar against altar, allowing our churches, as Independents do, to be true churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

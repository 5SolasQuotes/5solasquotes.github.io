<blockquote><p>As an evidence that all unregenerate persons are under the dominion of the law as a covenant of works, the natural bent of their hearts in all their views respecting the means of salvation is to the way of that covenant [of works]. They all desire to be under the law of works. All who have embraced either one or another of the false religions that are in the world agree at least in this principle: it is by doing that men are to live. Hence, when the Lord opens the eyes of a man to see that horrible gulf of sin and misery into which the first Adam plunged him, he is strongly inclined to exert himself for deliverance in the way of the covenant of works. He struggles hard to forsake his sins and to perform his duties, hoping that by his own performances he will become so righteous as to pacify the wrath of God and to procure for himself eternal life. Ah, ignorant, proud, vain attempt! This, however, he resolutely persists in doing until he is made to despair of ever being able to procure salvation for himself in the way of that covenant. Indeed, this natural bent of the depraved heart toward the way of the law as a covenant, together with deep ignorance of the high demands of the law in that form, is the source of all the self-righteousness that is in the world. To take sinners off from this to a cordial reliance only on the righteousness of the second Adam for all their title to salvation is a special part of the Holy Spirit’s work in conviction and conversion, and to do it requires a greater exertion of His almighty power than even to create a world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 41–42 (emphasis added).</span></figcaption>

<blockquote><p>A Repetition of the Law of the Covenant of Works. In the ministry of Moses, there was a repetition of the doctrine concerning the law of the covenant of works. The Mosaic Covenant, then, seems to be a sort of republication of the covenant of works. Of course it is not identical to the prelapsarian covenant, but there is that condition «by which formula, the righteousness, which is of the law, is described, Rom. x. 5. And the terror of the covenant of works is increased by repeated comminations; and that voice heard, cursed be he that confirmeth not all the words of this law to do them, Deut. xxvii. as the requirement of obedience was rigid under the ministry of Moses, the promises of spiritual and saving grace were more rare and obscure, the measure of the Spirit granted to the Israelites, scanty and short, Deut. xxix. 4. and on the contrary, the denunciation of the curse frequent and express; hence the ministry of Moses is called, “the ministration of death and condemnation,” 2 Cor. iii. 7,9. doubtless because it mentioned the condemnation of the sinner, and obliged the Israelites to subscribe to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 187.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

">Read it online · Heidelblog</a></div>

<blockquote><p>God intended a Law-dispensation but for a time. 2. Adam, how he was ordained for a Law-life. 3. How predestinated to glory in Christ, how not. 4. That the heathens have no more universal grace than devils. 5. No ground for such grace. It is apparent that God intended not a Law-dispensation in paradise to stand for ever. For nothing is spoken of Adam, after the fall, but of his procreating of children, of the patriarchs, of Adam’s dying and of his acts before the fall, the place of paradise being scarce well known, which says the Lord had a farther design to lay aside the transient Law-dispensation and to set up Christ. The Lord, of purpose, gave a positive Law, forbidding eating of such a tree, added a threatening thereunto particularly, suffered the serpent to tempt, and foresaw what frail nature would do, that he might deal with man, in a dispensation of free grace. Object. Did not God ordain that Adam should have life and righteousness, if he should continue in obedience. Answ. That was a decree conditional of things, (“the man that does these things shall live”) and shows the equity and holiness of the Law, but it was not a decree of persons, by which God predestinated Adam to a Law-glory, as the end, and to Law-obedience as the effectual means leading to that end. Q. Was not Adam chosen? Ans. Adam, according to the Lord’s design, finaliter and objective (finally and objectively) was created in the state of predestination to glory and grace in Christ, as touching [his] person, but according to his inherent condition, he was created in a legal dispensation, which was a gracious inlet to Christ; And according to his Law-state as he represented all mankind, he was created as a lubric [slippery] and frail copy of weak nature. Many who are such as are not chosen are created and live under a covenant of works, having only some concomitant favors of the Gospel, as the preaching thereof. 2. Common grace, inward warnings. 3. Protections of providence and forbearance, in regard they are mixed with the elect. The heathen cannot be said to have any inward calling to grace and glory, because there be some remnants of the image of God left in them, which no more can be called universal grace, then the same sparkles that are left in devils can be called Gospel grace, for they believe, “There is one God and confess the Son of God,” (Jam. 2:19; Luk. 4:34. Mark 1:24). Only if this be called grace, that the nature of man is so capable of Gospel mercy, and the nature of the fallen angels morally not so. 2. The offer is made to them of Christ; not so to devils, we shall not contend. Reason may seem to say that all should have a share of Gospel-grace, but it may be replied to reason, why should it seem to be a part of the goodness and bounty of God to will and desire all and every one to be saved, and not to institute such a dispensation, as all and every one should actually be saved? 2. How should that stand, (“he has mercy on whom he will”) if free-will of the creature absolutely dispose of salvation and damnation? 3. How is it that the calling, adoption, and the offer of mercy is restricted to few, and was confined to the Jews only of old? But we are more ready to call the Lord to a reckoning, for his dispensation of grace to others, then to use our own, as becomes us. 2. We cannot judge aright of God and of his goodness, except he be God our very way. 3. It is a matter of no small difficulty to make right use of the Lord’s freedom of grace, and for clay humbly to adore Sovereignty, and not to stumble at the highness of his ways, who, in these points, has ways and thoughts above ours, “as the heavens are above the earth” (Isa. 55).</p></blockquote>

</figure><figure class="quote" id="q-8c2bdfc123" data-kw="">
<blockquote><p>I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall. II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise. III. They had a double use. 1. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy. IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification. V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event. VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….</p></blockquote>

</figure><figure class="quote" id="q-07fc90e93b" data-kw="">
<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promises to men some good, and requires of them again, that they perform those things which he commands. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promises men eternal life. And that is twofold: the covenant of works or the covenant of grace. The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, and also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2. 17. The repetition of the covenant of works is made by God, Exod. 19. 5. Deut. 5. 2. 1. King. 8. 21. Heb. 8. 9. and that chiefly for four causes. That God by all means might stir up men to perform obedience. That every mouth might be stopped, and all the world might be made subject to the condemnation of God for not performing perfect obedience. Rom. 3. 19. That he might manifest mans sin, and naughtiness. Rom. 3. 19. 20. and 7. 7. 8. 9. 10. 11. That he might thrust us forward to seek to be restored in the covenant of grace. Gal. 3. 22. and 5. 23.</p></blockquote>

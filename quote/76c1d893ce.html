<main class="wrap"><figure class="quote" id="q-76c1d893ce" data-kw="supererogat">
<blockquote><p>Although the sanction of the law ought necessarily to be fulfilled (and in this sense guilt can never be separated from sin), yet because a surety can be substituted in the place of the sinner (who takes his guilt upon himself), it happens that it can be separated from the person sinning (not indeed through nature or from the law [which ignores such substitution], but through grace from the gospel).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

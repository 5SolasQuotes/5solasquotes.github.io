<main class="wrap"><figure class="quote" id="q-3c3daabd84" data-kw="">
<blockquote><p>5. Having seen that the infant seed of the professing people of God were members of the church under the Old Testament economy; and having seen also that the church under that dispensation and the present is the same; we are evidently prepared to take another step, and to infer, that if infants were once members, and if the church remains the same, they undoubtedly are still members, unless some positive divine enactment excluding them can be found. As it was a positive divine enactment which brought them in, and gave them a place in the church, so it is evident that a divine enactment as direct and positive, repealing their old privilege, and excluding them from the covenanted family, must be found, or they are still in the church. But can such an act of repeal and exclusion, I ask, be produced? It cannot. It never has been, and it never can be.

The introduction of infants into the church by divine appointment, is undoubted. The identity of the church, under both dispensations, is undoubted. The perpetuity of the Abrahamic covenant, in which not merely the lineal descendants of Abraham, but “all the nations of the earth were to be blessed,” is undoubted (Gen. 18:18; 22:18; 26:4). And we find no hint in the New Testament of the high privileges granted to the infant seed of believers being withdrawn. Only concede that it has not been formally withdrawn, and it remains of course. The advocates of infant baptism are not bound to produce from the New Testament an express warrant for the membership of the children of believers. The warrant was given most expressly and formally, two thousand years before the New Testament was written; and having never been revoked remains firmly and indisputably in force.

It is deeply to be lamented that our Baptist brethren cannot be prevailed upon to recognize the length and breadth, and bearing of this great ecclesiastical fact. Here were little children eight days old, acknowledged as members of a covenanted society­ a society consecrated to God for spiritual as well as temporal benefits and stamped with a covenant seal, by which they were formally bound, as the seed of believers, to be entirely and forever the Lord’s. Can infant membership be ridiculed, as it often is, without lifting the puny arm against him who was with his “church in the wilderness” (Acts 7:38), and whose ways are all wise and righteous?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), pp 21-22.</span></figcaption>

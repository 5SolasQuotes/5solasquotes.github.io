<main class="wrap"><figure class="quote" id="q-d7a94b00e0" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the Magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15. (Circumcision was a burden, Acts 15:10, and these burthens were necessary things, v. 28, and they were said to do well if they observe them, v. 29.) And Moses may make an ordinance about the use of a bill of divorcement, which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things, and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God, except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Three First Chapters of the First Epistle General of St. Peter... (London, 1637), on 1 Tim. 2:13</cite>, pp. 434-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c738d74fb2" data-kw="">
<blockquote><p>I will but recite a limitation of Gregory de Valencia… Having laid down a rule, that for avoiding the scandal of our neighbor, which springs either from his ignorance or weakness, it behooves us, by the obligation of charity, to do or omit that which may be done, or left undone without sin, he afterwards puts this exception [in Latin]… And indeed (me thinks) he speaks reasonably. For improbable seems it that the sweet moderation which is in the yoke of divine laws should consist with so great a rigor, as in all matters whatsoever not simply unlawful, to exact not only a brotherly, but also a servile compliancy with every supposed weak one, whose weakness may be but pretended by those that are willing to speak favorably of them. For the humoring and contenting of every supposed weakling in all matters at which he takes offence, I conceive not myself bound to endanger my life to hazard my estate and fortunes, or to incur any other great or notable inconvenience…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise concerning a Christian’s Careful Abstinence from All Appearance of Evil… (Oxford: Turner, 1640), pp. 76–78 Jeanes was an English presbyterian.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

nience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-072a7423b2" data-kw="">
<blockquote><p>One may object: (1) But is not a minister leading responsive readings inducing others to do what is wrong, which is prohibited by God’s Law (WLC #99.5–8)? Besides what has been said, to put it in a bit different way: Given that the impurities in responsive readings do not so corrupt the reading of the Word as to make the hurt more than the benefit, overturning the profit and substance of the ordinance itself, so God graciously receives this worship from sincere Christians. Leading weaker brothers in substantially good and Biblical worship as their consciences will bear (Rom. 14:5), especially given public order, is to direct them to their duty, which WLC #99.5–8 also obliges us to; and the moral necessity to do the greater good ordained of God, though mixed with impurities (without morally approving them), is greater than to abstain from that substantial and greater good because of its impurities. This is not to do “what God forbids,” which “is at no time to be done,” because this is precisely what “He commands” and “is always our duty” (WLC #99.5). If one does not agree, but believes it is sinful to ever personally perform, or direct others to do good things with impurities, inconvenience, an association of evil or that which another person could take scandal at, welcome to Separatism. Our puritan authors’ Scriptural Refutation of it will be instructive to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

asquotes.github.io%2Fquote%2F072a7423b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/072a7423b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=One%20may%20object%3A%20%281%29%20But%20is,it%20will%20be%20instructive%20to%20you&amp;text=One%20may%20object%3A%20%281%29%20But%20is%20not%20a&amp;text=Refutation%20of%20it%20will%20be%20instructive%20to%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2nd Rule: If we compare a greater moral necessity with a less moral necessity, the less necessity must yield to the greater. [If] a necessity of mercy must yield to a necessity of sacrificing: If David then should not have eaten the showbread in his providential necessity of famine, [then] he should have been guilty both of [the] active scandalizing [of] the souls of others in killing himself, and should have killed himself; and the less moral necessity ceases and is no necessity when a greater moral necessity intervenes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Appendix</cite>, p. 82</span></figcaption>

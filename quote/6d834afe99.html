<main class="wrap"><figure class="quote" id="q-6d834afe99" data-kw="">
<blockquote><p>Hence on the part of God there can only be question of a gratuitous promise of reward for certain good works. For such works He owes the promised reward, not in justice or equity, but solely because He has freely bound himself, i.e., because of His own attributes of veracity and fidelity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

— Joseph Pohle, The Catholic Encyclopedia, s.v. “Merit” (1911)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%20on%20the%20part%20of%20God%20there%20can%20only%20be%20question%20of%20a%20gratuitous%20promise%20of%20reward%20for%20certain%20good%20works.%20For%20such%20works%20He%20owes%20the%20promised%20reward%2C%20not%20in%20justice%20or%20equity%2C%20but%20solely%20because%20He%20has%20freely%20bound%20himself%2C%20i.e.%2C%20because%20of%20His%20own%20attributes%20of%20veracity%20and%20fidelity.%E2%80%9D%0A%0A%E2%80%94%20Joseph%20Pohle%2C%20The%20Catholic%20Encyclopedia%2C%20s.v.%20%E2%80%9CMerit%E2%80%9D%20%281911%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d834afe99.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d834afe99.html">Permalink</a><a class="src" href="https://www.newadvent.org/cathen/10202b.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 6</span></figcaption>

</figure><figure class="quote" id="q-96e9c4f20c" data-kw="">
<blockquote><p>That objection of Durandus would have force if God rendered the reward to good works out of commutative justice; but since God has decreed to give rewards to those who work well out of distributive justice, it is not necessary that we properly give him anything. For neither do those who run for the prize give anything to the king, and yet the king is bound to give the prize to him who has outstripped the rest in the race. Let it stand, therefore, that the good works of the just merit eternal life out of justice, and so ex condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-c3573a6dea" data-kw="">
<blockquote><p>There is no definite doctrinal decision in this matter. The concept meritum de congruo is not without ambiguity, inasmuch as the claim arising from it can be greater or less, hence the opinions of theologians are divided. a) Meritum de congruo and the sinner. A person in mortal sin can merit de congruo, by his free co-operation with actual grace, further actual graces in preparation for justification, and finally the grace of justification itself. (Sent. probabilis.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §25, 2</span></figcaption>

</figure><figure class="quote" id="q-7ee8450474" data-kw="">
<blockquote><p>If any one saith, that the good works of one that is justified are in such manner the gifts of God, as that they are not also the good merits of him that is justified; or, that the said justified, by the good works which he performs through the grace of God and the merit of Jesus Christ, whose living member he is, does not truly merit increase of grace, eternal life, and the attainment of that eternal life,-if so be, however, that he depart in grace,-and also an increase of glory; let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, can. 32</span></figcaption>

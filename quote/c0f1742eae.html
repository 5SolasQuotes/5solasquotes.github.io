<main class="wrap"><figure class="quote" id="q-c0f1742eae" data-kw="">
<blockquote><p>Though, in the Law, God formerly promised to the Jews the hire of works, (Leviticus 18:5,) yet we know that this was without effect, because no man ever obtained salvation by his merits. … For strictly speaking, he owes no man any thing, and from us, who are devoted to his service, he demands, as a matter of right, all the duties which are incumbent on us. But as he freely offers to us a reward, he is said to hire the labors which, on other grounds, were due to him. This is also the reason why he gives the name of a hire to the crown which he bestows freely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 20:1-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a702a69ba8" data-kw="">
<blockquote><p>Since the initiative belongs to God in the order of grace, no one can merit the initial grace of forgiveness and justification, at the beginning of conversion. Moved by the Holy Spirit and by charity, we can then merit for ourselves and for others the graces needed for our sanctification, for the increase of grace and charity, and for the attainment of eternal life. Even temporal goods like health and friendship can be merited in accordance with God&#x27;s wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2010</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-4c0cb98b84" data-kw="">
<blockquote><p>This disputation on merits will be fourfold. First we must treat whether there are any true merits of the just. Secondly, what merit is, or what is required to constitute true merit. Thirdly, of what kind these merits are, that is, whether they are ex condigno or only ex congruo. Fourthly, for what they are merits, or what it is that properly falls under merit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 5, preface (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-6d834afe99" data-kw="">
<blockquote><p>Hence on the part of God there can only be question of a gratuitous promise of reward for certain good works. For such works He owes the promised reward, not in justice or equity, but solely because He has freely bound himself, i.e., because of His own attributes of veracity and fidelity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><figure class="quote" id="q-66e59fb3f6" data-kw="">
<blockquote><p>Merit of Condignity removed, they clamor and vociferate until they are hoarse that all the glory of good works is obscured, the necessity of doing good is taken away, and a license for perpetrating every kind of wickedness is indulged to men. But what (in heaven&#x27;s name!) does this itch for lying mean? For we have so proved this to be a notable and transparent lie from the candid confessions of the Papists themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-morton.html">Thomas Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antidote against Merit of Condignity</cite>, p. 5</span></figcaption>

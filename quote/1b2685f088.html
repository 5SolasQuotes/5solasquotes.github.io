<main class="wrap"><figure class="quote" id="q-1b2685f088" data-kw="">
<blockquote><p>The same duty is required and the same sin is forbidden, in different respects, in several and even in all the divine commands. The transgression of one precept is virtually a breach of all. They are so intimately connected together that if the divine authority is disregarded in any one of them, it is slighted in all (Col. 3:5; 1 Tim. 6:10; James 2:10; 1 John 4:20). The first commandment, for example, is so closely connected with all the other precepts that it is obeyed in all our obedience or disobeyed in all our disobedience to any one of them. Obedience or disobedience to it is virtually obedience or disobedience to the whole law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 82-83.</span></figcaption>

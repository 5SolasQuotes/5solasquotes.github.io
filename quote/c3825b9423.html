<main class="wrap"><figure class="quote" id="q-c3825b9423" data-kw="">
<blockquote><p>If what is spoken to ‘angels’ here, be to be appropriated to one bishop, then it behoved to be said that it were only the bishop that had the door opened to him in preaching, as in Philadelphia; that he only were commended for his labor and patience, as in Ephesus; that he only did convert souls, and in that peculiar sense, were said to have few unspotted persons under him, as in the epistle to Sardis, etc. And if these things cannot be astricted to bishops, so understood, but must agree to all ministers in such cases, then must the title angel be so applied in these epistles. We know these things are more fully and accurately made out by many others, to whom we refer the reader: and in particular, to that accurate piece of the ministers of the province of London, called Ius Divinum Ministerii Evangelici, and to the books that are frequently mentioned therein…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation, (Edinburgh, 1658), pp. 223-33, p. 229</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>2. A representative Church may be thought a number sent by a community and elected to give laws absolutely tying, as if believers should say, ‘We resign our faith and conscience to you, to hold good whatever you determine without repeal or trial;’ that is blind faith; that we disclaim: all our rulers’ acts in our assemblies do bind, 1. conditionally, if they be lawful and convenient, 2. matters to be enacted are first to be referred to the congregations and elderships of particular congregations before they be enacted.</p></blockquote>

</figure><figure class="quote" id="q-bf95d426e2" data-kw="">
<blockquote><p>In making laws, ministers are only heralds and envoys, who promulgate the laws of the prince and enunciate the commands of God, addressing believers in his name; but in constitutions they are directors of external worship in matters pertaining to good order (eutaxian) because although God has prescribed in general that all things should be done decently and in order, still He has sanctioned nothing in particular, but left it to the prudence of pastors, who are able to dispose of them as they see is conducive to edification. For so great is the variety in minds, so great the conflict between judgments and dispositions, that unless they are bound by certain laws as by chains and bits, they would easily disagree with each other and the unity of the church be dissolved. Since about things of this kind there was no special precept, since they are innumerable and mutable depending upon circumstances of times, places and persons, God wishes the rulers of the church to consult for its peace, edification and decorum by determining those things which seem best adapted to the habits of the people and with regard for times and places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3, pp. 285-293, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-e09ed042bc" data-kw="">
<blockquote><p>III. …acts of divine worship are twofold, some which do not differ from the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded of God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the church has no control or power over them; the latter God has thus far left to the will of the church as means and indifferent, so that a regard be always paid to divine truth., Christian simplicity and public edification. … XIX. The object of this directive power is not the doctrine itself of faith and worship (which rests upon the Word of God alone), but other things concerning which the express Word of God is not given, which are either merely indifferent and free or ambiguous and doubtful, concerning which God has delivered nothing certain in particular, such as was the case about which the apostle speaks in 1 Cor. 7:10,12, or which refer to the mode of external worship, or the determination of the circumstances, without which the precepts of the first table and the public exercises of piety in ecclesiastical assemblies scarcely and not even scarcely can be rightly observed and performed. Here pertain the time, place, form and rule of prayers, addresses, of the administration of the sacraments, fasts, alms-giving: all of which ought to be established and exercised not with confusion, but rightly and decently (euschemonos) for the edification of the church. Since these in themselves are indifferent and do not directly touch the mystery of our salvation, they do not of themselves bind the conscience, nor yet are they so fixed and immovable that they may not be reformed and changed where the use of the church shall demand.</p></blockquote>

of+God+is+not+given%2C+which+are+either+merely+indifferent+and+free+or+ambiguous+and+doubtful%2C+concerning+which+God+has+delivered+nothing+certain+in+particular%2C+such+as+was+the+case+about+which+the+apostle+speaks+in+1+Cor.+7%3A10%2C12%2C+or+which+refer+to+the+mode+of+external+worship%2C+or+the+determination+of+the+circumstances%2C+without+which+the+precepts+of+the+first+table+and+the+public+exercises+of+piety+in+ecclesiastical+assemblies+scarcely+and+not+even+scarcely+can+be+rightly+observed+and+performed.+Here+pertain+the+time%2C+place%2C+form+and+rule+of+prayers%2C+addresses%2C+of+the+administration+of+the+sacraments%2C+fasts%2C+alms-giving%3A+all+of+which+ought+to+be+established+and+exercised+not+with+confusion%2C+but+rightly+and+decently+%28euschemonos%29+for+the+edification+of+the+church.+Since+these+in+themselves+are+indifferent+and+do+not+directly+touch+the+mystery+of+our+salvation%2C+they+do+not+of+themselves+bind+the+conscience%2C+nor+yet+are+they+so+fixed+and+immovable+that+they+may+not+be+reformed+and+changed+where+the+use+of+the+church+shall+demand.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+%7C+vol.+3%2C+pp.+286+%26+290+of+Question+31%2C+%E2%80%98Does+a+legislative+power+properly+so+called%2C+of+enacting+laws+binding+the+conscience%2C+belong+to+the+church%3F+Or+only+an+ordaining+%28diataktike%29+power%2C+of+sanctioning+constitutions+and+canons+for+the+sake+of+good+order+%28eutaxian%29%3F+The+former+we+deny%3B+the+latter+we+affirm+against+the+Romanists.%E2%80%99+under+%E2%80%98Ecclesiastical+Power%E2%80%99+in+the+18th+topic%2C+%E2%80%98The+Church%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe09ed042bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e09ed042bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=acts%20of%20divine%20worship%20are%20twofold,use%20of%20the%20church%20shall%20demand&amp;text=acts%20of%20divine%20worship%20are%20twofold%2C%20some%20which&amp;text=where%20the%20use%20of%20the%20church%20shall%20demand" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

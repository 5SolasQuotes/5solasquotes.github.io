<blockquote><p>There is therefore a twofold justification. One whereby, in ourselves being sinners, we are justified before God, from without us: The other whereby being now justified before God from without us, we are justified before Him within ourselves. The first of these is the cause of the second. The second is the effect and demonstration of the first. The first is done by faith, the other by works. Both must concur that the righteousness of the Law may be fulfilled in us… Let us speak fullier of the second sort of justification. It is that whereby God, by regeneration given us, and the works of sincere faith which we performed, absolves us from the charge of hypocrisy, profaness and impiety, and no longer takes us for men dead in sin, servants of the Devil and children of the world, but for true believers, his sons restored to his image, endued with his life and translated into his Kingdom: which judgment of God, the Law also approves. Not that it [the Law] takes it self-satisfied by our works, but because being bereaved of its dominion and subjected to Christ our Lord, it cannot choose but [to] commend the works which come from faith in Christ and from his Spirit, and account them for true righteousness, though they are imperfect; and them that perform them, for truly righteous and sons pleasing to God. Let it be here enquired, seeing Scripture does often and expressly ascribe to us both these righteousnesses we speak of, and therefore we are in respect of them both to be judged righteous, not only with men, but with God, whether in the same sense as we are said to be justified by works, Jam. 2, and to be justified by words, Mt. 12, works may not be said to be imputed to us for righteousness? Not indeed as faith is imputed to righteousness: but as the fact of Phineas is said to be imputed to him for righteousness, Ps. 106:31.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, ch. 10, sect. 3, pp. 342-52 in Richard Baxter’s Confession of his Faith… (London: 1655) The page numbering is misnumbered. The whole of sect. 3 has more on this topic, as Baxter quotes 80 authors in support of his views on the necessity of works for believers in salvation., pp. 344-47</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c8a8c117d" data-kw="">
<blockquote><p>XXII… Fourth, it is asked whether good works are prerequisite for justification. … (5) Indeed, there are not lacking among recent theologians those who teach a justification of the justified that happens with works going before it, whereby the one justified justifies himself from hypocrisy, which depends upon an inherent holiness, albeit imperfect, yet sincere. … (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed…</p></blockquote>

</figure><figure class="quote" id="q-07cd49e86a" data-kw="">
<blockquote><p>Again (in the second place), this fulfilling of the Law, or obedience towards the Law, is indeed righteousness, when it is complete; but in us it is small and impure. (For, although they have received the first-fruits of the Spirit, and the new, yea, the eternal life has begun in them, there still remains a remnant of sin and evil lust, and the Law still finds much of which it must accuse us.) Accordingly, it is not pleasing for its own sake, and is not accepted for its own sake. But although from those things which have been said above it is evident that justification signifies not only the beginning of the renewal, but the reconciliation by which also we afterwards are accepted, nevertheless it can now be seen much more clearly that the inchoate fulfilling of the Law does not justify, because it is accepted only on account of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concordia Triglotta</cite>, … (St. Louis, MO: Concordia Publishing House, 1921), Apology of the Augsburg Confession, pt. 3, sect. 40, p. 166</span></figcaption>

</figure><figure class="quote" id="q-82485833f0" data-kw="">
<blockquote><p>We do not deny (as the Papists falsely slander us) all inherent righteousness, 2 Cor. 5:17, nor all justification before God by inherent righteousness, 1 Kn. 8:32 [“Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.”]. But this we teach, that this inherent righteousness is not that righteousness whereby any poor sinner in this life can be justified before God’s Tribunal, for which he is pronounced to be innocent, absolved from death and condemnation, and adjudged unto eternal life. … Whether inherent justice be actual or habitual? Bishop Davenant, ch. 3, Of Habitual Righteousness, says a certain habitual or inherent justice is infused into all that are justified, Jn. 1:13; 2 Cor. 5:17; Gal. 6:15; 1 Cor. 6:11, 19; 2 Pet. 1:4. All those that are justified do supernatural works; Therefore, it is certain that they are endued with supernatural grace and holiness. We are said to be righteous, from this inherent justice we are said to be just, and that by God Himself, Gen. 6:9; Heb. 11:4; Lk. 1:61 &amp; 2:25; 1 Pet. 4:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, Of Justification, pp. 517-18 Leigh, though he says what he says below, nor Davenant, who is referenced, evidences a twofold justification as such.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>32. In the next place page 138, he [Brown’s opponent] cites with Bellarmine, Rom. 8:30, and says that [in the verse] either sanctification must be excluded, or ‘justification’ must be taken in its proper sense [as including sanctification]. … (2) Sanctification might be comprehended under the word ‘justified,’ it being a necessary and inseparable consequent, and that without any prejudice to the native, usual and constant import of the word ‘justified’.</p></blockquote>

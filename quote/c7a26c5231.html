<main class="wrap"><figure class="quote" id="q-c7a26c5231" data-kw="church can err">
<blockquote><p>Is the church infallible or can it err about faith? The former we deny; the latter we affirm against the Romanists. The question concerning the infallibility of the church is the most agitated of all which lie between us and Romanists about the church and of so great importance that the papacy seems to rest upon it as its principal fulcrum. For no other reason do they fight so sharply for the infallibility of the church than that they may attach this privilege to their own, which they hold to be the only true church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span></div>

</figure><figure class="quote" id="q-d76c64c47c" data-kw="catholic invisible">
<blockquote><p>Even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. This question truly belongs to another controversy, concerning the perpetual appearance and conspicuousness of the church as to external state. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.7.1b</span></figcaption>

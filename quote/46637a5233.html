<main class="wrap"><figure class="quote" id="q-46637a5233" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing… … X. A scandal is passive and taken by the scandalized, without the fault of the doer, only in this case: cum factum unius est alteri occasio peccandi, prater intentionem facientis, et conditionem facti (Ames, Of Conscience, bk. 5, ch. 11, q. 3); so that to the making of the doer blameless is not only required that he intend not his brother’s fall, but also that the deed be neither evil in itself, nor yet done inordinately and with apperance of evil. XI. The scandal not to be cared for is only in necessary things, such as the hearing of the Word, prayer, etc., from which we may not abstain, though all the world should be offended at us: In these I say, and these only, Scandalum quod oritur ex rebus per s•… bonis et necessariis, non licet evitare, etc. at rerum legittimarum sed non necessariarum disparest ratio, etc., says a great Formalist (Cameron, Praelectiones on Mt. 18:7, Of Scandal). XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious… … Christ’s not caring for the scandal of the Pharisees is also objected to prove that if the thing be lawful or indifferent, we are not to care for the offence of the malicious. But Parker answers well (Of the Cross, pt. 2, p. 57): ‘The scandal there not cared for is when the Pharisees are offended at his abstaining from their washings and his preaching of true doctrine, both of which were necessary duties for Him to do. And when He defends his healing on sabbaths (Lk. 13:15) and his disciples plucking corns (Mt. 12:7), upon this reason, they are duties of necessity and charity, He plainly insinuates there is no defence for deeds unnecessary when the malicious are scandalized. When the thing was indifferent, does He not forgoe his liberty for to please them, as when He payed tribute lest he should offend them (Mt. 17:27), although he know they were malicious.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, pp. 32-34</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbb443ae3f" data-kw="">
<blockquote><p>Scandal or offence is not the grieving or displeasing of my brother; for peradventure when I grieve him or displease him, I do edify him; now edification and scandal are not compatible. But scandal is a word or deed proceeding from me which is, or may be, the occasion of another man’s halting or falling into, or swerving from the straight way of righteousness.</p></blockquote>

</figure><figure class="quote" id="q-bda28d4fcf" data-kw="">
<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>

<blockquote><p>VI. A passive scandal, which is taken and not given, is not only faulty when it proceeds of malice, but also, when it proceeds of ignorance and infirmity: and scandalum pusillorum [a scandal of weak ones], may be scandalum acceptum, on the part of the offended faulty, as well as scandalum Pharisaeorum [the scandal of the Pharisees]. When weak ones are offended at me for the use of a lawful thing, before I know of their weakness and their taking of offence, the scandal is only passive, and so we see that weak ones may take offence where none is given, as well as the malicious. Now, their taking of offence, though it proceed of weakness, yet is sinful, for their weakness and ignorance is a fault, and does not excuse them.</p></blockquote>

</figure><figure class="quote" id="q-5a2fdbda56" data-kw="">
<blockquote><p>The partial conformist Paul, when he offered animal sacrifices, or arranged such for others (Acts 21:23–26; Num. 6:13–14) after Christ’s death, was, under a certain degree of necessity for a greater good (Acts 21:20–23), fulfilling the good in this deficient, yet lawful worship to God, without approving the deficiencies as best. Note these deficiencies in the material worship were in some ways contrary to Gospel principles (Acts 15:10, 28; Gal. 3:19, 23, 24–25; 4:1–3, 5–7, 9, 24, 30–31; 5:1, 7; Col. 2:14, 17, 20, 22; Tit. 1:14; Heb. 7:16, 27; 8:7–8, 10; 9:9–11, 28; 10:1–2, 10–11; 13:9) and the authorities would not remove them. Many may have accused Paul, knowing his convictions and what he had previously preached (Acts 21:21, albeit in a different context with a different kind of people for different formal reasons, e.g. Gal. 2–4 &amp; Col. 2:8–23), of compromising, conforming, backsliding and having temporizing motives for his own ease, avoiding suffering and of breaking the solemn, Gospel covenant. Ought not one to separate from such a scandalous Christian minister, who, for a time and in the circumstances, materially conformed at the permitted, yet restricting indulgence of the tyrannous authorities over God’s Church (as the rest of the story manifests, Acts 21:26–33)? God forbid.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>
<div class="actions"><button class="copy" data-copy="“The partial conformist Paul, when he offered animal sacrifices, or arranged such for others (Acts 21:23–26; Num. 6:13–14) after Christ’s death, was, under a certain degree of necessity for a greater good (Acts 21:20–23), fulfilling the good in this deficient, yet lawful worship to God, without approving the deficiencies as best. Note these deficiencies in the material worship were in some ways contrary to Gospel principles (Acts 15:10, 28; Gal. 3:19, 23, 24–25; 4:1–3, 5–7, 9, 24, 30–31; 5:1, 7; Col. 2:14, 17, 20, 22; Tit. 1:14; Heb. 7:16, 27; 8:7–8, 10; 9:9–11, 28; 10:1–2, 10–11; 13:9) and the authorities would not remove them. Many may have accused Paul, knowing his convictions and what he had previously preached (Acts 21:21, albeit in a different context with a different kind of people for different formal reasons, e.g. Gal. 2–4 &amp; Col. 2:8–23), of compromising, conforming, backsliding and having temporizing motives for his own ease, avoiding suffering and of breaking the solemn, Gospel covenant. Ought not one to separate from such a scandalous Christian minister, who, for a time and in the circumstances, materially conformed at the permitted, yet restricting indulgence of the tyrannous authorities over God’s Church (as the rest of the story manifests, Acts 21:26–33)? God forbid.”

— Travis Fentiman, “Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), “A True Principle”, p. 49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+partial+conformist+Paul%2C+when+he+offered+animal+sacrifices%2C+or+arranged+such+for+others+%28Acts+21%3A23%E2%80%9326%3B+Num.+6%3A13%E2%80%9314%29+after+Christ%E2%80%99s+death%2C+was%2C+under+a+certain+degree+of+necessity+for+a+greater+good+%28Acts+21%3A20%E2%80%9323%29%2C+fulfilling+the+good+in+this+deficient%2C+yet+lawful+worship+to+God%2C+without+approving+the+deficiencies+as+best.+Note+these+deficiencies+in+the+material+worship+were+in+some+ways+contrary+to+Gospel+principles+%28Acts+15%3A10%2C+28%3B+Gal.+3%3A19%2C+23%2C+24%E2%80%9325%3B+4%3A1%E2%80%933%2C+5%E2%80%937%2C+9%2C+24%2C+30%E2%80%9331%3B+5%3A1%2C+7%3B+Col.+2%3A14%2C+17%2C+20%2C+22%3B+Tit.+1%3A14%3B+Heb.+7%3A16%2C+27%3B+8%3A7%E2%80%938%2C+10%3B+9%3A9%E2%80%9311%2C+28%3B+10%3A1%E2%80%932%2C+10%E2%80%9311%3B+13%3A9%29+and+the+authorities+would+not+remove+them.+Many+may+have+accused+Paul%2C+knowing+his+convictions+and+what+he+had+previously+preached+%28Acts+21%3A21%2C+albeit+in+a+different+context+with+a+different+kind+of+people+for+different+formal+reasons%2C+e.g.+Gal.+2%E2%80%934+%26+Col.+2%3A8%E2%80%9323%29%2C+of+compromising%2C+conforming%2C+backsliding+and+having+temporizing+motives+for+his+own+ease%2C+avoiding+suffering+and+of+breaking+the+solemn%2C+Gospel+covenant.+Ought+not+one+to+separate+from+such+a+scandalous+Christian+minister%2C+who%2C+for+a+time+and+in+the+circumstances%2C+materially+conformed+at+the+permitted%2C+yet+restricting+indulgence+of+the+tyrannous+authorities+over+God%E2%80%99s+Church+%28as+the+rest+of+the+story+manifests%2C+Acts+21%3A26%E2%80%9333%29%3F+God+forbid.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+%E2%80%

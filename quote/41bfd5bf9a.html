<main class="wrap"><figure class="quote" id="q-41bfd5bf9a" data-kw="">
<blockquote><p>If our parliament found it such an insupportable grievance and burden, it must needs be that they acknowledged it such, upon such solid grounds of reason and law as are of a standing nature. And in this case, the inclination (besides that it is declared general since the Reformation, and this is supposed grounded upon the Gospel’s reforming light) is nothing else than what the Law of God, of Nature and Nations, the love of true national and Christian liberty prompts unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6e533dfc7" data-kw="">
<blockquote><p>I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon anything amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things accoding to the Word of God. This my protesting, and refusing to join with them, enraged them exceedingly against me; and as their scourge of tongues was grievously bent against others, so now was it against myself, in a most grievous, unjust and unreasonable manner, and very hypocritically gave it out far and near… Thus I left that party of the dissenters who now commonly go under the name of Mr. M’Millan’s people; for the Quakers, Gibb’s faction, the Harlaw’s faction, and episcopacy by bishops, I had never any thing to do with them in matters of religion, neither directly nor indirectly; yea, my soul abhors all their evil ways: but I lieved retired by myself; all which time the Lord pitied me, and restored me to some measure of communion with Himself. Praise, praise. Amen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters</cite>, (Edinburgh: Oliphant, 1827), pp. 237-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

nism/#:~:text=I%20alleging%2C%20what%20was%20wrong%20in,communion%20with%20Himself.%20Praise%2C%20praise.%20Amen&amp;text=I%20alleging%2C%20what%20was%20wrong%20in%20the%20administration&amp;text=measure%20of%20communion%20with%20Himself.%20Praise%2C%20praise.%20Amen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-03771f4977" data-kw="">
<blockquote><p>And sometimes the main reason why they [presbyterians] go to worship God with them is to show they hold communion with them; that though there be many things amiss, against which they bear a real testimony by their non-conformity, yet they go to them to show to the world they separate not from them, and the better to maintain that spiritual love which ought to be among the members of the churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints</cite>, (London: Parkhurst, 1705) 128 pp. ToC, p. 108</span></figcaption>

</figure><figure class="quote" id="q-14036e0edb" data-kw="">
<blockquote><p>You will have many factious zealots to please, who being strangers to the love of holiness, Christianity, and unity, are ruled by the interest of an opinion or sect: and these will never be pleased by you, unless you will be one of their side or party, and conform yourself to their opinions. If you be not against them, but set yourselves to reconcile and end the differences in the church, they will hate you as not promoting their opinions, but weakening them by some abhorred syncretisms. As in civil, so in ecclesiastical wars, the firebrands cannot endure the peaceable: if you will be neuters, you shall be used as enemies. If you be never so much for Christ, and holiness, and common truth, all is nothing, unless you be also for them, and their conceits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, vol. 1, p. 187</span></figcaption>

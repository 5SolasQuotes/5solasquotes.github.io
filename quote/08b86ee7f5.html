<main class="wrap"><figure class="quote" id="q-08b86ee7f5" data-kw="">
<blockquote><p>CARLYLE. I am no worshipper of Force. I see nothing to admire in mere power, i.e. in its quantity apart from its quality. Carlyle’s earnestness is very touching and noble; but it seems to me that, according to his teaching, if you could conceive an omnipotent devil, you ought to worship him as much as Israel’s Jehovah. [So that he is in one sense a modem Manichee?] I suspect so. And an omnipotent militia of darkness would be the very horror of horrors. . .

The connection between Carlylism and despotism I see, but the link is nowhere explicitly avowed. Carlyle is sometimes difficult to understand, and very difficult to judge. Why did he call Chalmers the last of the Christians? I suppose he forgets what he has written elsewhere. Hero-worship! ah well, he and I have to meet a strange hero yet … the greatest that I know of next to Him who overcame him. Carlyle has great faith in the devil, but I suspect he always appreciates quantity of being and of power more than quality. Have you observed how Christianity takes up the fragmentary truth that lies in the demonological and the spirit-inhabited? We Christians have lost nothing that could be retained in the old mythologies. And perhaps these beliefs in spiritual presences in nature are but the lingering mist of patriarchal tradition concerning the spirit-world. …

Carlyle, too, when he keeps to genuine English, when his historical narrative (as in some parts of his “French Revolution “) is vigorously sustained, has done a great deal to display the capabilities of English prose. But he often writes sheer gibberish, according to the classical tests. And whenever a man becomes cloudy in his words, be sure that his thought has grown shadowy too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duncan.html">John Duncan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Colloquia Peripatetica</cite>, ed. William Knight (Edinburgh: Edmonston &amp; Douglas, 1870), pp 49, 53.</span></figcaption>

<blockquote><p>5. …And certainly, the nature of first principles requires that they not be proven, but taken for granted. 6. That habit or natural intellectual power (…since the natural power of the intellect itself, both practical and speculative, suffices [for the innate knowledge of God]; which is to establish its necessity with Thomas Aquinas in his 1st book of the Sentences, dist. 21, ad 1) comprehends the truth of principles immediately, without reasoning or proof, by a kind of simple intuition. It grasps partly theoretical principles and partly practical ones. Among the particular theoretical first principles, I place first and formost: ‘God exists’; and among the practical first principles, first and foremost: ‘God ought to be worshipped.&#x27;</p></blockquote>

<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10).

2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6).

3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment.

4. No glory to God could arise from this but rather the dishonor of a tyrannical lord.

5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing.

2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself.

3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such.

4. We are permitted to kill innocent creatures. Reply.

1. Not rational ones.

2. Irrational ones (bruta) for our use (2 Pet. 2:12).

3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, pp. 84-85, 112-13, 121-22</span></figcaption>

<blockquote><p>[S]ystematic theology has important purposes to secure, not only in testing and guarding purity of doctrine in a church, but in combining the scattered truths of God’s Word, so that we may clearly apprehend them: in exhibiting the unity of the faith; and in facing the misapprehensions, mistakes, and errors which may arise. In particular, great good may be effected by a full display, and a reflective contemplation of the divine character; and in order to this, there must be some order, plan, and division, and the more logical these are the better for every purpose, speculative or practical.

Care must be taken always, in drawing such a portraiture, to shew that the attributes are not distinct parts of the divine essence, but simply different aspects of the one God, viewed separately because of the infirmity of our minds, and the narrowness of our vision, which prevent us from taking in the whole object at once, and constrain us to survey it part after part. As it is not the abstract quality, but the concrete being that calls forth feeling and affection, we must ever contemplate his perfections, as combined in the unity of his living person. It is to be said, in behalf of Charnock, that he never leaves the impression that the attributes are separate existences; they are simply different manifestations presented to us, and views taken by us of the one God, who is at once Great and Good, Holy and Gracious.</p></blockquote>

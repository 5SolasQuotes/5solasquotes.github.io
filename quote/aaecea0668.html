<main class="wrap"><figure class="quote" id="q-aaecea0668" data-kw="">
<blockquote><p>[I]t is the fault of our people, they turn the Gospel into the Law; and we may say, Whosoever seeks to be saved by his Baptism, he falls off from Christ.

[…]

The man that thinks the very outward work of Baptism, the very outward work of receiving a Sacrament will justify him, doth as much dishonour God, as a Jew that thought circumcision, or the sacrifices did justify him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), pp 13, 16.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94d6e249aa" data-kw="">
<blockquote><p>§45. Concerning infants who die without baptism, in what place or state they are and will be, various opinions are fostered. We think it is not to be doubted that the infants of Christians are comprehended in the covenant of God and pertain to the Church. Wherefore the apostle in 1 Cor. 7:14 declares infants born of only one Christian parent to be holy, with a federal or ecclesiastical sanctity, since in the civil forum the infants of citizens pertain to the republic, and are capable and partakers of the rights of the republic, and are heirs of their paternal goods, and therefore can be saved, even if they are snatched away before receiving baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 16-17 Holtzfus was a German reformed theologian, and a hypothetical universalist respecting the atonement.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-1946aa0d79" data-kw="">
<blockquote><p>But if anyone either on the testimony of the church, or parents, or witnesses, or of others cannot be sure about the baptism that he had received in infancy, or if it happened that he was moistened by no other baptism than that of the midwives or private individuals, we are of the opinion that such a man may be baptized without any scruple. For the baptism applied by the last-mentioned people is not baptism at all, and the baptism of the first mentioned people is worthless, as the Council of Carthage [AD 418] has rightly decided (5.3): ‘Concerning infants it has been decided that whenever no very certain witnesses are found who testify without a doubt that they were baptized, and whenever they themselves are not, on account of their age, in a position to give an answer about the sacraments that were given to them, they should be baptized without any scruple, lest that doubt should cause them to be bereft of the cleansing of the sacraments.’ For as Leo [AD 400-461] rightly added, ‘what is not known to have been done cannot be said to have been repeated.’ And consequently we should not approve of a conditional baptism that the papal teachers are used to observing in such cases, according to this formula: ‘If you have not been baptized, then I baptize you.’ For a baptism of this kind lacks any precedent in Scripture and changes the form for baptism that Christ had taught, and it also leaves the one who has been baptized in doubt as to which baptism is the real one–which goes against the purpose of baptism that does not make the promises of God ambiguous but establishes and seals them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (1625; Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 55-56, pp. 169-71</span></figcaption>

</figure><figure class="quote" id="q-105ec53399" data-kw="">
<blockquote><p>Every faithful Christian who has been baptized may have this benefit from baptism as long as he lives: that as by his engrafting into Christ he is one with Him and therefore sees that while Christ lives he must and will live also, so thus having perpetual union and fellowship with Christ, the believer draws strength from the vine, so that he may live the Christian life.

If Christ then has the power of renewing him – which is signified and sealed by baptism (namely, the power of Christ’s death mortifying sin and the virtue of His resurrection in raising him up to a new life) – is not baptism throughout his life, as often as he seriously considers it, a powerful means to help him forward in a Christian life?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holy Helps for a Godly Life</cite>, ed. Brian G. Hedges (1603; Grand Rapids, MI: Reformation Heritage Books, 2018), p. 17.</span></figcaption>

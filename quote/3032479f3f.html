<blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>

<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases. It is really a matter of importance. It would be a hard case if a party, suffering under a grievous wrong, should be turned away from the bar of our highest judicatory, merely on the ground that he had mistaken the nature of his remedy… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and com- plaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it… …There is a good deal of confusion and error often occasioned by the mere designation of our ecclesiastical bodies as courts or judicatories. They are so called Avhen not sitting in judicial capacity… Our courts are bodies sui generis [of their kind]; they include within themselves legislative, executive and judicial powers. Yet this division is in a great measure arbitrary. These several powers are but different modes of exercising the general governing authority in the Church; and it is often very difficult to say whether a particular act should be placed under the one or the other of these heads… An appeal supposes an aggrieved party, but he may appeal from any kind of decision which directly affects himself. A complaint supposes some kind of impropriety in the act complained of, but it may be entered against any kind of act alleged to be improper. So that any kind of decision may be regularly brought up in each of the several ways specified above. That this is the true meaning of this article, might be inferred with certainty from the fact that it has always been so understood and acted upon; and that it is almost a literal transcript of the Scottish rule on the same subject, which has always been interpreted and applied in the same way… In the first place, these technical terms are to be understood, not according to their use in civil courts, but according to our own ecclesiastical usage. Our bodies are called courts; their decisions are called judgments; the matters brought before them are called cases. Are we to infer from this, as has been done by the New School lawyers and brethren, that they have nothing but judicial powers… In the second place, our rules were drawn up with special reference to that class of cases which is of most frequent occurrence, and hence the language employed is adapted to such cases… In the third place it is a fallacy running through this argument that there can be no judicial investigation of anything but a judicial act… There is, therefore, no foundation in our constitution for this new doctrine. Every letter of the rules may be, and has been fully complied with in a multitude of cases, where the decision appealed from was merely an executive act… We shall proceed to show that this new doctrine, especially if applied to complaints as well as appeals (and we have seen that the two cannot in this matter be consistently separated), is subversive of the fundamental principles of Presbyterianism, and inconsistent with the uniform practice of the Church… This doctrine is at variance also with the undeviating practice of our own and all other Presbyterian Churches. This of itself is a fatal objection to any new doctrine. The fact that we have been going on in accordance with the usage of all other Presbyterian bodies, for a hundred and twenty years, interpreting and administering our constitution in a certain way, is answer enough… The words of our book have the sense which they were intended to bear; and they were intended to bear the sense in which its authors and administrators have ever understood and applied them… That the practice of our Church has been uniform on this subject, is admitted… There is not then, upon our Minutes, a single case of an appeal or complaint, which was rejected on the ground that it did not refer to a judicial sentence. We have been going on for a hundred and twenty years entertaining such appeals without any one dreaming of their being irregular… If after all this a new and opposite doctrine is to be introduced, there never can be any stability or security with regard to any principle of Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.</p></blockquote>

wever%2C+was+a+mere+temporary+delusion.+The+members+of+that+synod+who+had+signed+or+allowed+protests+in+all+kinds+of+cases+before%2C+still+continued+to+sign+or+allow+them%2C+with+equal+freedom%2C+their+own+decision+to+the+contrary+notwithstanding%E2%80%A6+We+found+its+very+authors+and+advocates+disregarding+it+the+very+next+year%3B+acting+as+though+no+such+doctrine+had+ever+been+broached.+If+they+practically+abandoned+it+as+untenable%E2%80%A6+The+Synod+of+Philadelphia+extended+the+%5Bnew%5D+doctrine+to+appeals%2C+complaints+and+protests.+Thus+putting+minorities+completely+under+the+feet+of+majorities%2C+not+allowing+them+even+the+right+of+recording+their+dissent+with+the+reasons+for+it%E2%80%A6+%E2%80%A6There+is+a+good+deal+of+confusion+and+error+often+occasioned+by+the+mere+designation+of+our+ecclesiastical+bodies+as+courts+or+judicatories.+They+are+so+called+Avhen+not+sitting+in+judicial+capacity%E2%80%A6+Our+courts+are+bodies+sui+generis+%5Bof+their+kind%5D%3B+they+include+within+themselves+legislative%2C+executive+and+judicial+powers.+Yet+this+division+is+in+a+great+measure+arbitrary.+These+several+powers+are+but+different+modes+of+exercising+the+general+governing+authority+in+the+Church%3B+and+it+is+often+very+difficult+to+say+whether+a+particular+act+should+be+placed+under+the+one+or+the+other+of+these+heads%E2%80%A6+An+appeal+supposes+an+aggrieved+party%2C+but+he+may+appeal+from+any+kind+of+decision+which+directly+affects+himself.+A+complaint+supposes+some+kind+of+impropriety+in+the+act+complained+of%2C+but+it+may+be+entered+against+any+kind+of+act+alleged+to+be+improper.+So+that+any+kind+of+decision+may+be+regularly+brought+up+in+each+of+the+several+ways+specified+above.+That+this+is+the+true+meaning+of+this+article%2C+might+be+inferred+with+certainty+from+the+fact+that+it+has+always+been+so+understood+and+acted+upon%3B+and+that+it+is+almost+a+literal+transcript+of+the+Scottish+rule+on+the+same+subject%2C+which+has+always+been+interpreted+and+applied+in+the+same+way%E2%80%A6+In+the+first+place%2C+these+technical+terms+are+to+be+understood%2C+not+according+to+their+use+in+civil+courts%2C+but+according+to+our+own+ecclesiastical+usage.+Our+bodies+are+called+courts%3B+their+decisions+are+called+judgments%3B+the+matters+brought+before+them+are+called+cases.+Are+we+to+infer+from+this%2C+as+has+been+done+by+the+New+School+lawyers+and+brethren%2C+that+they+have+nothing+but+judicial+powers%E2%80%A6+In+the+second+place%2C+our+rules+were+drawn+up+with+special+reference+to+that+class+of+cases+which+is+of+most+frequent+occurrence%2C+and+hence+the+language+employed+is+adapted+to+such+cases%E2%80%A6+In+the+third+place+it+is+a+fallacy+running+through+this+argument+that+there+can+be+no+judicial+investigation+of+anything+but+a+judicial+act%E2%80%A6+There+is%2C+therefore%2C+no+foundation+in+our+constitution+for+this+new+doctrine.+Every+letter+of+the+rules+may+be%2C+and+has+been+fully+complied+with+in+a+multitude+of+cases%2C+where+the+decision+appealed+from+was+merely+an+executive+act%E2%80%A6+We+shall+proceed+to+show+that+this+new+doctrine%2C+especially+if+applied+to+complaints+as+well+as+appeals+%28and+we+have+seen+that+the+two+cannot+in+this+matter+be+consistently+separated%29%2C+is+subversive+of+the+fundamental+principles+of+Presbyterianism%2C+and+inconsistent+with+the+uniform+practice+of+the+Church%E2%80%A6+This+doctrine+is+at+variance+also+with+the+undeviating+practice+of+our+own+and+all+other+Presbyterian+Churches.+This+of+itself+is+a+fatal+objection+to+any+new+doctrine.+The+fact+that+we+have+been+going+on+in+accordance+with+the+usage+of+all+other+Presbyterian+bodies%2C+for+a+hundred+and+twenty+years%2C+interpreting+and+administering+our+constitution+in+a+certain+way%2C+is+answer+enough%E2%80%A6+The+words+of+our+book+have+the+sense+which+they+were+intended+to+bear%3B+and+they+were+intended+to+bear+the+sense+in+which+its+authors+and+administrators+have+ever+understood+and+applied+them%E2%80%A6+That+the+practice+of+our+Church+has+been+uniform+on+this+subject%2C+is+admitted%E2%80%A6+There+is+not+then%2C+upon+our+Minutes%2C+a+single+case+of+an+appeal+or+complaint%2C+which+was+rejected+on+the+ground+that+it+did+not+refer+to+a+judicial+sentence.+We+have+been+going+on+for+a+hundred+and+twenty+years+entertaining+such+appeals+without+any+one+dreaming+of+their+being+irregular%E2%80%A6+If+after+all+this+a+new+and+opposite+doctrine+is+to+be+introduced%2C+there+never+can+be+any+stability+or+security+with+regard+to+any+principle+of+Presbyterian+Church+government%E2%80%A6+Nothing+short+of+a+plain+and+intelligible+denial+of+the+right+to+complain+of+oppressive+and+unconstitutional+acts%3B+or+to+appeal+from+unrighteous+decisions%2C+though+they+may+not+be+judicial%2C+will+induce+Presbyterians+to+forego+a+privilege+which+they+have+enjoyed+from+the+very+foundation+of+their+Church%E2%80%A6+If+it+is+to+be+applied+to+appeals%2C+we+see+not+how+any+one+can+fail+to+apply+it+to+complaints+and+references%2C+and+if+so+applied%2C+all+must+acknowledge+that+our+system+of+government+would+be+completely+overturned.+The+right+of+appeal+is+already+restricted+within+very+harrow+limits.+It+is+not+the+privilege+of+any+member+of+the+court.+It+belongs+exclusively+to+an+aggrieved+party%3B+to+those+whose+character+or+interests+are+immediately+concerned+in+the+decision.+And+to+all+such+it+is+a+right+guaranteed+by+the+constitution+and+by+the+undeviating+practice+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+16%2C+%E2%80%98Discipline%E2%80%99%2C+section+3%2C+%E2%80%98Appeals+%26+Complaints%E2%80%99+%7C+a.+%E2%80%98Appeals+in+Cases+Not+Judicial%E2%80%99+470&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F104eb0485a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/104eb0485a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=That%20is%2C%20the%20General%20Assembly%20decided,the%20undeviating%20practice%20of%20the%20Church&amp;text=That%20is%2C%20the%20General%20Assembly%20decided%20that%20appeals&amp;text=and%20by%20the%20undeviating%20practice%20of%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God.</p></blockquote>

<blockquote><p>IV. Now this law of God is divided in general into natural and positive. As the right of God is twofold (one natural, founded in the perfectly just and holy nature of God; the other positive, depending on the will of God alone in which He also shows his own liberty), so there is a positive law of God built on the free and positive right of God (with respect to which things are then good because God commands them). Hence God was free either not to give such a law or to institute otherwise (such as the law relating to food and the symbolical law given to Adam [Gen. 2:16-17] and the ceremonial laws of the Old Testament, in which there was no moral goodness or evil per se, but only from the command of God). There is another (natural) founded on the natural right of God, with regard to which things are not called just because they are commanded, but are commanded because they were just and good antecedently to the command of God (being founded on the very holiness and wisdom of God). And such is its nature that (the creation of man being supposed) it must have been given to him, since it prescribes to him indispensable duties to be performed by all, always and everywhere.</p></blockquote>

<blockquote><p>This consideration may be very useful: For it may first serve to be a cure of two great ills in this land: One is of such as conceive that the Law of God, belongs not to Christians; They may as well say that common and natural equity belongs not to Christians. Is it not written in the heart of man by nature? Is it not confirmed by Jesus Christ? Is it not recommended to Christians by the apostles? Is it not established by faith? Is not the observing of it, a testimony of our communion with God? Is not the end of it love from a pure heart, a good conscience, and faith unfeigned? Is it thankfulness to God, because we are delivered from the condemnation, coaction [compulsory force], and rigor of the Law, not to acknowledge the obligation of the Law? Shall not the domestics of the house of God observe the commandments of God, or shall they not be grieved when they transgress and observe them not?</p></blockquote>

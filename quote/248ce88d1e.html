<main class="wrap"><figure class="quote" id="q-248ce88d1e" data-kw="">
<blockquote><p>In the earlier years of his [Thomas E. Peck’s] religious history, he was subject to occasional fits of depression, but in later years these passed away. This is the common experience of men of unusual talents. They stand on the threshold of the great arena eager for the competition and thirsting for success, yet uncertain of themselves; their abilities untested; and the strong impulses to action checked and fretted with the doubt whether the venture will prove a source of satisfaction or distress.

In many cases this stage of the mental development produces moodiness and irritation; discontent with self breeds suspicion of others; and the manifestations of character become unpromising and perilous. In Dr. Peck’s case there was nothing of this; the firm texture of his mind, and his strong hold on the principles of religion, held down such effects of depressed feeling, and left him only to the grief it created, and to the silence of a steady endurance.

As he passed on, and the development of his intellect and his growth in grace expanded into maturity, his steadfast nature, with its underlying currents of lively and affectionate sensibility, grew equable in their habitual manifestations. His work, whatever it was, was always well and faithfully done, according to the law of his own exact and veracious conception of duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-r-vaughan.html">Clement R. Vaughan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biographical Sketch of Dr. T. E. Peck in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f818764a8e" data-kw="">
<blockquote><p>3d. Case. Whether may God carry it strangely, as if he were an Enemy to a New Creature, that should seem to be his darling?

Answ. Thou art a Stranger to Scripture, and the Experiences of all God’s Children, if thou think God must always be dandling this New Creature on his Knee, or giving it the Kisses of his Mouth; no, no, he hath reserved these Sweat-meats for the upper Table in Heaven: there’s great reason thou should have his Frowns, as well as Smiles, to humble thy Heart, exercise thy Graces, discover the necessity of Christ, the desirableness of Heaven: God can and may, without any impediment to his Love, hide it for a season from his own dearest Child: David indeed called in question God’s Love and Faithfulness, when he hid his Face; but at last, he found that it was his Infirmity, and doubtless, lamented it as his Sin:

God hath given abundant Security in his Promises of his Love without present sense: you must not think much at him, if he do not come to visit you, and take you up in his Arms as oft as you would have him: Thou needest some purging Physick as well as Cordials: a Son may need a Frown, as well as a Smile from his Father: God is a free Agent, his Kisses are his own: but its well thou art so sensible of his Access and Recess, his Smiles and Frowns: it’s a sign of some Spiritual Life in thy Soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), 191-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-a53208e82e" data-kw="chastise">
<blockquote><p>&quot;You have chastised me, and I was chastised, as a bullock unaccustomed to the yoke; turn me and l shall be turned.&quot; &amp;c. And it is for the breaking down of the weight of one&#x27;s spirit that God lays it on: for which cause it is declared to be a good thing to bear it, that being the way to make one at length as a weaned child. Secondly, A strong desire to have the cross removed, and to have matters in that part going according to our inclinations. This is very natural, nature desiring to be freed from everything that is burdensome or cross to it; and if that desire is kept in a due subordination to the will of God, and it is not too pre-emptory, it is not sinful. &quot;If it is possible, let this cup pass from me; nevertheless, not as I will.&quot; &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite></span></figcaption>

</figure><figure class="quote" id="q-8f5ace4f9b" data-kw="">
<blockquote><p>If by the word cross, we understand the sufferings which the son of God endured, both in soul and body, as Esay 55. verse 3. Being filled with sorrows, and full of heaviness in soul, even to the death, as having drunk the cup of God’s anger, whereon he cried, My God, my god, why hast thou forsaken me? it is most certain, that such sufferings exceed representation. For our sense cannot comprehend them: but by faith we understand, that they were infinite and unspeakable. Therefore we say in our Creed, that we believe Christ Jesus did suffer, that he was crucified, dead, and buried, that he descended into hell: all these then being unspeakable, must needs be likewise irrepresentable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief treatise of the virtue of the cross and the true manner how to honour it</cite>, trans. Anthony Munday (London: Edward White, 1599), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-efcb982dfb" data-kw="">
<blockquote><p>Christ was to suffer in his natural affections, of joy, sorrow, confidence, fear, love, yet without sin; and though I could not shew how this anxiety and faith could not consist, yet it cannot be denied; for Grace doth not destroy Nature, nor could the vision of personal union hinder the exercise of all human affections and infirmities in Christ, in the state of his humiliation, as clothes of gold cannot allay the pain of the head and stomach: Grace is a garment of cloth of gold, and the union personal, the perfection of grace; yet it hindered not Christ from being plunged in extreme horror and anxiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself</cite>, (London, 1647), p. 62.</span></figcaption>

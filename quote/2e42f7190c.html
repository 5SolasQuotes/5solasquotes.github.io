<main class="wrap"><figure class="quote" id="q-2e42f7190c" data-kw="">
<blockquote><p>Things about the foundation, circa-fundamentalia, are all things revealed in the Word of God, as all histories, miracles, chronologies, things about Orion, the Pleiades, the North Stars (Job 38:31-32), that Paul left his cloak at Troas. The knowledge of these is considered three ways: 1. As necessary, by necessity of a mean, necessitate medii, and the knowledge so is not necessary to salvation. Many are in glory (I doubt not) who lived in the visible church, and yet knew never that Sampson killed a lion. But the knowledge of all these is necessary, necessitate præcepti [by a necessity of precept], because all in the visible church are obliged to know these things; therefore the ignorance of these only, does not actually condemn, but virtually and by demerit leads to condemnation. 2. This knowledge is considered as commanded in the excellency thereof, and so error and bad opinions about these are sinfully ill, though [are] in the regenerate, by accident; such errors condemn not [to damnation] where the foundation is held. 3. The knowledge of these is considered as commended and enjoined to us with the submission of faith, for the authority of God the speaker, and the malicious opposing of these is a fundamental error, not formally, but by evident consequence. For though the matter of these errors is not fundamental, yet the malicious opposing of these is a fundamental error against this principle: Whatever God has said is true. But God says…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-distinctions.html">Rutherford’s Distinctions</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 3 Distinctions about Things Around Fundamentals</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-aedb36876d" data-kw="">
<blockquote><p>Now of Churches faulty and corrupted, some raze the foundation; others, on the true foundation build timber, hay, stubble. From those we must separate; from these we may not. Peter’s is eternal, ‘Whither shall we go from Thee; Thou hast the words of eternal life.’ (Jn. 6:68) Where these words are found, woe be to us if we be not found. Amongst many good separations then, yours cannot be separated from evil, for that we should so far separate from the evil that therefore we should separate from God’s children in the communion of the holy things of God, that for some (after your worst done) not-fundamental corruptions, we should separate from that Church in whose womb we were conceived, and from betwixt whose knees we fell to God: in a word (as one of yours once said) to separate not only from visible evil, but from visible good, as all Antichristian: who but yours can think less than absurd and impious? Grant we should be clean separated from the world, yet if we be not, must you be separated from us?¹ ¹ Neque propter paleam relinquim are am Domini, neque propter pisces malos rumpimus retia Domini. Augustine, Epistle 48 Do but stay till God have separated us from Himself: will the wise husbandman cast away his corn-heap for the chaff and dust? Shall the fisher cast away a good draught because his drag-net has weeds? Does God separate from the faithful soul, because it has some corruptions, her inmates, though not her commanders?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Common Apology of the Church of England against the Unjust Challenges of the over-just Sect, commonly called Brownists… (London: Macham, 1610), sect. 4</cite>, pp. 10-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-1bbdab7c77" data-kw="">
<blockquote><p>As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>We must in this world come as near heaven and the happiness of life everlasting as may be (Phil. 3:14). And for this cause we must join ourselves to the assemblies where the word is preached, prayer is made, and sacraments administered. For there is the gate of heaven.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-88d2be5682" data-kw="">
<blockquote><p>And so Christ sanctified both these types of theology [the humble type and exalted type] in His own person, since He both experienced the humble theology in the humiliation of the flesh, and now enjoys the exalted type in that very exaltation by which He now has been exalted above every name…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (RHB, 2014), ch. 7, ‘The Theology of Vision in the Heavens’, pp. 129-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“And so Christ sanctified both these types of theology [the humble type and exalted type] in His own person, since He both experienced the humble theology in the humiliation of the flesh, and now enjoys the exalted type in that very exaltation by which He now has been exalted above every name…”

— Francis Junius, A Treatise on True Theology trans. David Noe (RHB, 2014), ch. 7, ‘The Theology of Vision in the Heavens’, pp. 129-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+so+Christ+sanctified+both+these+types+of+theology+%5Bthe+humble+type+and+exalted+type%5D+in+His+own+person%2C+since+He+both+experienced+the+humble+theology+in+the+humiliation+of+the+flesh%2C+and+now+enjoys+the+exalted+type+in+that+very+exaltation+by+which+He+now+has+been+exalted+above+every+name%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francis+Junius%2C+A+Treatise+on+True+Theology+trans.+David+Noe+%28RHB%2C+2014%29%2C+ch.+7%2C+%E2%80%98The+Theology+of+Vision+in+the+Heavens%E2%80%99%2C+pp.+129-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88d2be5682.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88d2be5682.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=And%20so%20Christ%20sanctified%20both%20these,has%20been%20exalted%20above%20every%20name&amp;text=And%20so%20Christ%20sanctified%20both%20these%20types%20of&amp;text=He%20now%20has%20been%20exalted%20above%20every%20name" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d616c94f53" data-kw="">
<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David B. MacKinnon</cite>, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-3797e39782" data-kw="">
<blockquote><p>38. Can we say very much about heaven and the blessings of heaven? No, for this far surpasses our understanding. We know only: … b) The enjoyment of heaven is in the first place the enjoyment of God, the visio Dei, a ‘beholding of God.’ This is not to be understood one-sidedly in an intellectualistic manner but in all its magnitude. The nearness of God will affect every capacity of man, and every capacity will react to it. Theologians usually speak of visio [seeing], amor [love], gaudium [joy], gloria [glory]; others of knowing, serving, enjoying and glorifying God (cf. 1 Cor. 13:9-13). It has been asked whether this will be a seeing with physical eyes. This is not to be assumed. God is not visible to the senses. The Mediator certainly is. No one has ever seen God. This seeing follows on faith. It is thus something that is comparable with faith but that still does not necessarily need to be a perceiving with the senses. There will thus be a perception of God, yet such that it is not a material entity that appears to us. c) The enjoyment of heaven in fellowship with God is eternal life in all its fullness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: A System of Christian Theology Single Volume Edition</cite>, trans. Richard B. Gaffin 1 vol. ed. (Lexham Press, 2020), Ecclesiology, the Means of Grace, Eschatology, pt. 3, Eschatology, ch. 7, ‘General Eschatology’, pp. 1153-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

atific-vision/#:~:text=38.%20Can%20we%20say%20very%20much,eternal%20life%20in%20all%20its%20fullness&amp;text=38.%20Can%20we%20say%20very%20much%20about%20heaven&amp;text=God%20is%20eternal%20life%20in%20all%20its%20fullness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2114a44213" data-kw="">
<blockquote><p>However, it is not agreed between the Scholastic Doctors and at least some of our theologians, as is evident from what has been said, whether the soul of our Lord Jesus Christ, while he was still on earth, before death already enjoyed that highest blessedness which it now enjoys in Heaven; and thus whether Christ could then be said to be simultaneously a wayfarer and a comprehender (which the Roman School teaches by common consent). But some of our theologians deny this, while others affirm it, most being silent and saying or establishing nothing about it. Furthermore, from that matter another dispute arises, whether Christ had faith and hope properly so called, which the Roman School denies, as has been shown before. But those of our theologians who deny that Christ’s soul was always perfectly blessed affirm it. Concerning faith, however, there seems to be a λογομαχία [logomachy, or dispute about words]… Moreover, from what has been said it appears that our theologians, either all or most, differ from the Roman School in this, that they think that all fullness of grace was not poured out upon Christ’s soul at once and simultaneously as soon as he was conceived in the Virgin’s womb, but that Christ made progress in grace with time, not only as to acts, but also as to habits; whereas on the contrary the Roman School holds that the gifts of the Spirit were conferred upon Christ in such abundance in his very first conception, that afterwards there was no place at all for increase, but whatever gifts and grace Christ now possesses in his soul, he always had even in his mother’s womb in the same measure and degree. But the principal dispute is about the knowledge of Christ’s soul, which indeed all agree now knows all things in heaven of which knowledge can fall to any creature, but they do not agree whether he always knew all things and never learned anything which he truly did not know before. And the Pontificals indeed by common consent hold that the soul of our Lord Jesus Christ was so filled with knowledge from its very creation, that it afterwards learned nothing which it did not know before, and that Christ never labored under any privative and properly so called ignorance, but through some created knowledge always knew all things which he now knows, and which it is possible for a creature to know. On the contrary, however, most of our theologians assert that it can be truly and properly said that Christ, insofar as he is man, was sometimes ignorant of something, and that his knowledge began to have various increases with age, and thus that he knows some things in heaven which he did not know when he was not yet glorified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, 3. ‘Knowledge of Christ’s soul, and his grace and blessedness’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 2. Controversies on Christ’s Person &amp; Office, pp. 974-82 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“However, it is not agreed between the Scholastic Doctors and at least some of our theologians, as is evident from what has been said, whether the soul of our Lord Jesus Christ, while he was still on earth, before death already enjoyed that highest blessedness which it now enjoys in Heaven; and thus whether Christ could then be said to be simultaneously a wayfarer and a comprehender (which the Roman School teaches by common consent). But some of our theologians deny this, while others affirm it, most being silent and saying or establishing nothing about it. Furthermore, from that matter another dispute arises, whether Christ had faith and hope properly so called, which the Roman School denies, as has been shown before. But those of our theologians who deny that Christ’s soul was always perfectly blessed affirm it. Concerning faith, however, there seems to be a λογομαχία [logomachy, or dispute about words]… Moreover, from what has been said it appears that our theologians, either all or most, differ from the Roman School in this, that they think that all fullness of grace was not poured out upon Christ’s soul at once and simultaneously as soon as he was conceived in the Virgin’s womb, but that Christ made progress in grace with time, not only as to acts, but also as to habits; whereas on the contrary the Roman School holds that the gifts of the Spirit were conferred upon Christ in such abundance in his very first conception, that afterwards there was no place at all for increase, but whatever gifts and grace Christ now possesses in his soul, he always had even in his mother’s womb in the same measure and degree. But the principal dispute is about the knowledge of Christ’s soul, which indeed all agree now knows all things in heaven of which knowledge can fall to any creature, but they do not agree whether he always knew all things and never learned anything which he truly did not know before. And the Pontificals indeed by common consent hold that the soul of our Lord Jesus Christ was so filled with knowledge from its very creation, that it afterwards learned nothing which it did not know before, and that Christ never labored under any privative and properly so called ignorance, but through some created knowledge always knew all things which he now knows, and which it is possible for a creature to know. On the contrary, however, most of our theologians assert that it can be truly and properly said that Christ, insofar as he is man, was sometimes ignorant of something, and that his knowledge began to have various increases with age, and thus that he knows some things in heaven which he did not know when he was not yet glorified.”

— Louis Le Blanc, 3. ‘Knowledge of Christ’s soul, and his grace and blessedness’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 2. Controversies on Christ’s Person &amp; Office, pp. 974-82 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+it+is+not+agreed+between+the+Scholastic+Doctors+and+at+least+some+of+our+theologians%2C+as+is+evident+from+what+has+been+said%2C+whether+the+soul+of+our+Lord+Jesus+Christ%2C+while+he+was+still+on+earth%2C+before+death+already+enjoyed+that+highest+blessedness+which+it+now+enjoys+in+Heaven%3B+and+thus+whether+Christ+could+then+be+said+to+be+simultaneously+a+wayfarer+and+a+comprehender+%28which+the+Roman+School+teaches+by+common+consent%29.+But+some+of+our+theologians+deny+this%2C+while+others+affirm+it%2C+most+being+silent+and+saying+or+establishing+nothing+about+it.+Furthermore%2C+from+that+matter+another+dispute+arises%2C+whether+Christ+had+faith+and+hope+properly+so+called%2C+which+the+Roman+School+denies%2C+as+has+been+shown+before.+But+those+of+our+theologians+who+deny+that+Christ%E2%80%99s+soul+was+always+perfectly+blessed+affirm+it.+Concerning+faith%2C+however%2C+there+seems+to+be+a+%CE%BB%CE%BF%CE%B3%CE%BF%CE%BC%CE%B1%CF%87%CE%AF%CE%B1+%5Blogomachy%2C+or+dispute+about+words%5D%E2%80%A6+Moreover%2C+from+what+has+been+said+it+appears+that+our+theologians%2C+either+all+or+most%2C+differ+from+the+Roman+School+in+this%2C+that+they+think+that+all+fullness+of+grace+was+not+poured+out+upon+Christ%E2%80%99s+soul+at+once+and+simultaneously+as+soon+as+he+was+conceived+in+the+Virgin%E2%80%99s+womb%2C+but+that+Christ+made+progress+in+grace+with+time%2C+not+only+as+to+acts%2C+but+also+as+to+habits%3B+whereas+on+the+contrary+the+Roman+School+holds+that+the+gifts+of+the+Spirit+were+conferred+upon+Christ+in+such+abundance+in+his+very+first+conception%2C+that+afterwards+there+was+no+place+at+all+for+increase%2C+but+whatever+gifts+and+grace+Christ+now+possesses+in+his+soul%2C+he+always+had+even+in+his+mother%E2%80%99s+womb+in+the+same+measure+and+degree.+But+the+principal+dispute+is+about+the+knowledge+of+Christ%E2%80%99s+soul%2C+which+indeed+all+agree+now+knows+all+things+in+heaven+of+which+knowledge+can+fall+to+any+creature%2C+but+they+do+not+agree+whether+he+always+knew+all+things+and+never+learned+anything+which+he+truly+did+not+know+before.+And+the+Pontificals+indeed+by+common+consent+hold+that+the+soul+of+our+Lord+Jesus+Christ+was+so+filled+with+knowledge+from+its+very+creation%2C+that+it+afterwards+learned+nothing+which+it+did+not+know+before%2C+and+that+Christ+never+labored+under+any+privative+and+properly+so+called+ignorance%2C+but+through+some+created+knowledge+always+knew+all+things+which+he+now+knows%2C+and+which+it+is+possible+for+a+creature+to+know.+On+the+contrary%2C+however%2C+most+of+our+theologians+assert+that+it+can+be+truly+and+properly+said+that+Christ%2C+insofar+as+he+is+man%2C+was+sometimes+ignorant+of+something%2C+and+that+his+knowledge+began+to+have+various+increases+with+age%2C+and+thus+that+he+knows+some+things+in+heaven+which+he+did+not+know+when+he+was+not+yet+glorified.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+3.+%E2%80%98Knowledge+of+Christ%E2%80%99s+soul%2C+and+his+grace+and+blessedness%E2%80%99+in+Theological+Theses+Published+at+Various+Times+in+the+Academy+of+Sedan+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+%281675%3B+London%2C+1683%29%2C+Posthumous+Works%2C+2.+Controversies+on+Christ%E2%80%99s+Person+%26+Office%2C+pp.+974-82+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2114a44213.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2114a44213.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=However%2C%20it%20is%20not%20agreed%20between,when%20he%20was%20not%20yet%20glorified&amp;text=However%2C%20it%20is%2

<blockquote><p>In dealing with this question it was necessary to make some allusion to the attitude taken up by the priests and Prelates of the Church of Rome. For a long time those reverend gentlemen had held aloof, and had looked upon the Parnellite Party as revolutionary; but of recent years they had been compelled by the force of circumstances to place themselves at the head of the anti-English Party in Ireland, and, seeing in that Party the means for carrying out their ultimate designs, they had now thoroughly identified themselves with it. There was one thing upon which the Roman Catholic clergy and the Party led by the hon. Member for Cork [Charles Stewart Parnell] were at one, and that was the desire to accomplish the destruction of Orangeism in Ireland.

He would call attention to recent utterances of Archbishop [Thomas] Croke, who said he wished to see the country restored to its pristine vigour, that commerce and agriculture and honest industry might flourish, Orangeism be broken down, and that the green flag might float once more over a prosperous people. It was within the knowledge of hon. Members that in the Province of Ulster, where Orangeism flourished, commerce flourished also; whereas in the other parts of Ireland, where the Orange Institution scarcely existed, commerce was almost extinguished, and honest industry was rewarded by being “Boycotted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hansard-3.html">Hansard 3</a></span><span class="wk"><span class="lbl">Work:</span> <cite>HC, vol. 302, cols 1958-59</cite>, (4 March 1886).</span></figcaption>

<blockquote><p>That no minister shall, upon any occasion, testify from the pulpit against any act of Assembly, be it never so sinful; or against any of the proceedings of the judicatories, be they never so unwarrantable.” (See 1st Testimony, p. 82) For there was far more ground to make their inference from the act of Assembly 1638, than from the act of Assembly 1733; and so all our worthy ancestors from that day, and the Brethren themselves, according to their argument, have been living in a Church in which there was a very sinful term of communion required of them; and yet they never complained of it, nor have they given the least testimony against it. But further, the above Act 1733, relating to these Brethren, being materially rescinded, as was shown above, this objection, even as to them, falls to the ground. But then, as to the second alleged sinful term of communion, viz. “That no minister, or member of this Church shall protest against acts, sentences or decisions of the supreme judicatory, etc.</p></blockquote>

<blockquote><p>3rd Argument. If Paul do not only not command separation in the Church of Corinth, but also command and approve their meeting together in Church-communion, 1 Cor. 5:4; 11:18, 20-22; 14:23; 16:2, where there was: Schisms and contentious, 1 Cor. 1:12-13, envying and strife, 1 Cor. 3:3, incest, and incest tolerated, such as is not named amongst the gentiles, 1 Cor. 5:1, going to law with their brethren for gain before infidels, 1 Cor. 6, harlotry, vv. 15-16, eating at the idols’ table, 1 Cor. 8, keeping fellowship with devils, 1 Cor. 10:20-22, coming to the Lord’s Table drunken, 1 Cor. 11:21, eating and drinking damnation, vv. 29-30. A denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, 1 Cor. 15:35, murdering of weak souls, whom Christ had died for, 1 Cor. 8:12-13, Paul’s name despitefully traduced, 2 Cor. 10:8-9, etc. Then it is unlawful to separate from the pure worship of God, because a Church is not constituted of visible saints and a people all taught of God.</p></blockquote>

<blockquote><p>3. Stout in fundamentals of doctrine or practise, but sober and submiss in circumstantials. Foundations of faith and the unity of the Church were very dear to his [the minister John Frost’s] soul, and high in his esteem. The skeptical shakings of the one, and schismatical distractions of the other, sat as sad burdens on his spirit. With strength and much resolution would he contend for essentials of salvation: and things that must be believed, he would often press his people to hold without controversy, noting it to be the shame of Christianity, to lay the [Apostle’s] Creed open to common disputes. And very studious he was to cement differences among brethren: slow he was in censures, but free in rebukes of, and complaints over brethren’s distance. Earnestly he desired, and studiously endeavoured an union between Episcopal and presbyterial divines in things relating to the discipline of the Church; many times he has in my hearing lamented the want of discipline, and observed the animosity of both as no mean hindrance to its restitution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The People’s need of a Living Pastor</cite>, … (London: Cotes, 1657), pp. 52-53 Crofton was an English presbyterian.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3a9e02a29a" data-kw="">
<blockquote><p>16 And as the covenant once begun with God remaineth perpetually stedfast to such as repent, even after their sins from that time committed; so also baptism once received, confirmeth those that repent in remission of sins for all their life, and therefore ought neither to be terated [sic], nor deferred to the end of life, as if on that condition only it did cleanse us from our sins, if we committed no more after we were once baptized.

17 But all that are baptised with water, whether infants or aged, are not made partakers of the grace of Christ. For God’s eternal election and calling to the kingdom of Christ is free.

18 Neither are all excluded from the grace of Christ which are not baptised with water. For not the want but contempt of baptism excludeth from the covenant made by God with the faithful and their children.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cebb4ffe52" data-kw="">
<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For:

1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more?

2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites.

3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Disputations of Right to Sacraments</cite>, ... (London: Simmons, 1658), 2nd Disputation, pp. 200-201</span></figcaption>

<blockquote><p>Infants of believing parents are likewise to be baptized. The grounds of their baptism are these. First, the commandment of God, “Baptize all nations” (Matt. 28:19), in which words the baptism of infants is prescribed. For the apostles by virtue of this commission baptized whole families (Acts 16:15, 31–33). Again, circumcision of infants was commanded by God (Gen. 17:14), and baptism in the New Testament succeeds in the room of circumcision (Col. 2:11–12); therefore baptism of infants is likewise commanded. The second ground is this. Infants of believing parents are in the covenant of grace. For this is the tenor of the covenant: “I will be thy God, and the God of thy seed” (Gen. 17:7). It may be said that this promise was made in this sort only to Abraham, because he was to be the father of the faithful. Answer. It pertains to all believing parents. God promises “to show mercy to thousands of them that love Him” (Ex. 20). Peter says to the Jews that heard him preach, “The promises belong to you, and to your children” (Acts 2:39). Paul says, “If the parents believe, the children are holy” (1 Cor. 7:14). If holy, then are they in the covenant. Now they are holy because we are in the judgment of Christian charity to esteem them all as regenerate and sanctified, secret judgments (in the mean season) left to God. Now then because infants are in the covenant, they are to be baptized. For this is the reason of St. Peter. To whom the promises belong, to them belongs baptism. But to you and your children belong the promises. Therefore you and your children are to be baptized (Acts 2:38–39).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 230–31.</span></figcaption>

<blockquote><p>Peter also says that “baptism also doth now save us” (1 Peter 3:21). For he did not mean to intimate that our ablution and salvation are perfected by water, or that water possesses in itself the virtue of purifying, regenerating, and renewing; nor does he mean that it is the cause of salvation, but only that the knowledge and certainty of such gifts are perceived in this sacrament. This the words themselves evidently show. For Paul connects together the word of life and baptism of water, as if he had said, by the gospel the message of our ablution and sanctification is announced; by baptism this message is sealed. And Peter immediately subjoins, that that baptism is “not the putting away of the filth of the flesh, but the answer of a good conscience toward God, which is of faith.” Nay, the only purification which baptism promises is by means of the sprinkling of the blood of Christ, who is figured by water from the resemblance to cleansing and washing. Who, then, can say that we are cleansed by that water which certainly attests that the blood of Christ is our true and only laver?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.2</span></figcaption>

<blockquote><p>…a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honored with the saving fellowship of his covenant… III. This however by no means implies that all the children of pious parents should be regarded as ordained to salvation by the divine appointment. For it is manifest, both from the indubitable records of the sacred volume and the examples there placed beyond controversy, and from the experience of everyday life, that not infrequently the offspring of the best of men grow up with the worst dispositions, wickedly bent upon their own destruction. Still God has given that pledge to pious parents that they may regard their little ones as the children of God by gracious adoption, until, when further advanced, they betray themselves by indications to the contrary, and that they may feel not less secure regarding their children dying in infancy than did Abraham and Isaac of old. … LXXVI. (2) If God usually bestows his grace at the same time as it is exhibited in the sacrament, and in the very administration of baptism both regenerates infants and delivers them from the guilt of original sin, the forwardness of parents in speedily presenting their children for baptism will accelerate their regeneration, with all its consequences, while their negligence will retard it; and thus the influences of divine grace upon the souls of some persons will be usually determined by the activity or the slothfulness of others. … LXXVII. (3) If infants, up to the period of baptism, are the children of wrath, and by receiving baptism pass immediately into a state of grace; and if the salvation of baptized persons dying in infancy is certain, while we have only the judgment of charity regarding the salvation of those not baptized, I repeat, there must be a most inexcusable want of Christian parental love (storges) and of paternal piety, when parents do not, at the very instant of birth, procure that baptism on which so much depends. Nor can those ecclesiastical constitutions be defended with the slightest show of reason, which impose the smallest delay upon the administration of the rite. … LXXIX. In like manner, I profess myself unable to reconcile with these doctrines such things as the following: that baptism is as necessary to salvation as food to the sustenance of life, or medicine to the restoration of health; that it is something approaching to a miracle if anyone is saved without baptism; that since we are not to presume too rashly upon the performance of miracles, the judgment of charity respecting the salvation of those dying without baptism rests upon a very doubtful foundation; and that, in the meanwhile, death supplies the want of baptism in infants, as, according to the Papists, martyrdom does in adults. These things seem to me mutually to refute each other, for if death procures for infants what, according to the Papists, martyrdom procures for adults, the salvation of infants dying without baptism will be as certain as that of those who are baptized. For who in the Romish church has any doubt of the salvation of the martyrs? But where did this great man [Pierre Jurieu] learn that death supplies the want of baptism? Has he been taught it by any testimony of Scripture? Is there otherwise any argument in mere assertion, however emphatic?</p></blockquote>

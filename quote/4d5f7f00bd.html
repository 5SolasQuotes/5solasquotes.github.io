<main class="wrap"><figure class="quote" id="q-4d5f7f00bd" data-kw="">
<blockquote><p>…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662), pp. 23-24 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13c402cc4e" data-kw="">
<blockquote><p>We have here a full revelation of God’s favour to David and the kind intentions of that favour, the notices and assurances of which God sent him by Nathan the prophet… David’s purpose to build God a house is superseded. God took notice of that purpose, for he knows what is in man; and He was well pleased with it, as appears 1 Kings 8:18, Thou didst well that it was in thy heart; yet he forbade him to go on with his purpose (2 Sam. 7:5): “Shalt thou build me a house? No, thou shalt not (as it is explained in the parallel place, 1 Chron. 17:4)… That worship only is acceptable which is instituted; why should David therefore design what God never ordained? Let him wait for a warrant, and then let him do it. Better a tent of God’s appointing than a temple of his own inventing… God was not indebted to him for his good intentions, but, whatever he did for God’s honour, God was beforehand with him, 2 Samuel 7:8, 9… Blessings are entailed upon the family and posterity of David. David had purposed to build God a house, and, in requital, God promises to ‘build him a house,’2 Samuel 7:11. Whatever we do for God, or sincerely design to do though Providence prevents our doing it, we ‘shall in no wise lose our reward.’ He had promised to make him a name (2 Sam. 7:9); here he promises to make him a house, which should bear up that name… Though David came short of making good his purpose to build God a house, yet God did not come short of making good his promise to build him a house. Such is the tenour of the covenant we are under; though there are many failures in our performances, there are none in God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible | on 2 Samuel, ch. 7, vv. 4-17</cite></span></figcaption>

</figure><figure class="quote" id="q-198ed5c4e6" data-kw="">
<blockquote><p>This regeneration and inchoate obedience, being wrought in the faithful by the Spirit of God, though it do not wolly extirpate and root out sin, yet it keeps it so under, that it reign not in them: and it so renews them that they labour to resist sin, and to live according to the Law of God: which obedience though it be in itself imperfect, yet is it accepted of God by faith in Christ, in whose perfect righteousness, whatsoever is imperfect in our obedience, is perfected, and our imperfections pardoned; [So Erasmus] Marbach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum… (d. 1621; London: 1633) | on Ex. 20, 10th Commandment, 5th Confutation</cite>, p. 1875</span></figcaption>

</figure><figure class="quote" id="q-9b8f5296de" data-kw="">
<blockquote><p>There was a certain man in Caesarea called Cornelius… A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway… And he said unto him, ‘Thy prayers and thine alms are come up for a memorial before God… And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him. But Peter took him up, saying, ‘Stand up; I myself also am a man.’… ‘…Now therefore are we all here present before God, to hear all things that are commanded thee of God.’ Then Peter opened his mouth, and said, ‘Of a truth I perceive that God is no respecter of persons: But in every nation he that feareth Him, and worketh righteousness, is accepted with Him….’ While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.</p></blockquote>

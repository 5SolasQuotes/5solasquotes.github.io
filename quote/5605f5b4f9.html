<main class="wrap"><figure class="quote" id="q-5605f5b4f9" data-kw="">
<blockquote><p>O you who are the framer of the lands and sky, who bid time to go forth from eternity, and, remaining stable, give all things to be moved; whom no external causes compelled to fashion the work of fluctuating matter, but the form of the highest good, inherent and without envy. You draw all things from a supernal example, yourself most beautiful, bearing a beautiful world in your mind, and forming it in a similar image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin | For just as an artisan acting outside himself looks at some exemplar, according to which he operates, and which he expresses in his work, conformably to that which is read in Ex. 25:40; Heb. 8:5, “Look that you make them after their pattern, which was showed you in the mount”: so God, beholding his own essence, the exemplar and fount of all perfections, and beholding the ideas or reasons of all things, expresses them as He pleases; which Boethius, On the Consolation of Philosophy, 3, metro 9, elegantly explains, saying:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-d1758a69a1" data-kw="intuitive knowledge">
<blockquote><p>God knows all things by one intuitive act. As there is no succession in his being, so there is no succession in his knowledge. He knows things that are successive, before their existence and succession, by one single act of intuition. By one cast of his eye, all things future are present to him in regard of his eternity and omnipresence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Knowledge of God</span></figcaption>

</figure><figure class="quote" id="q-7399b051a7" data-kw="">
<blockquote><p>Of course, some Reformed teachers, e.g., Gomarus, Walaeus, Ludwig Crocius, assumed a ‘conditioned or middle knowledge’ on God’s part which was related to a ‘conditional proposition as to its object’ (as Heidegger Corp. Theol. III, 22 remarks) ‘in respect of bad actions, in which divine providence concurs not effectively but permissively and on the supposition of a conditional or permissive decree’. Alsted too (97) says that ‘there is a middle knowledge, by which He knows that if this exists that will exist.’ For the rest the distinction of a scientia media was decisively rejected by all dogmaticians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Ernst Bizer (1950; Eugene, OR: Wipf &amp; Stock, 2007), ch. 5, ‘The Attributes of God’, sect. 17, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

<main class="wrap"><figure class="quote" id="q-552f034c8c" data-kw="">
<blockquote><p>The term &quot;merit&quot; refers in general to the recompense owed by a community or a society for the action of one of its members, experienced either as beneficial or harmful, deserving reward or punishment. Merit is relative to the virtue of justice, in conformity with the principle of equality which governs it. … With regard to God, there is no strict right to any merit on the part of man. Between God and us there is an immeasurable inequality, for we have received everything from him, our Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §§2006–2007</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66e59fb3f6" data-kw="">
<blockquote><p>Merit of Condignity removed, they clamor and vociferate until they are hoarse that all the glory of good works is obscured, the necessity of doing good is taken away, and a license for perpetrating every kind of wickedness is indulged to men. But what (in heaven&#x27;s name!) does this itch for lying mean? For we have so proved this to be a notable and transparent lie from the candid confessions of the Papists themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-morton.html">Thomas Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antidote against Merit of Condignity</cite>, p. 5</span></figcaption>

</figure><figure class="quote" id="q-a483e5ffc8" data-kw="">
<blockquote><p>We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-73bdee7a45" data-kw="">
<blockquote><p>Merit and reward refer to the same, for a reward means something given anyone in return for work or toil, as a price for it. … Now it is clear that between God and man there is the greatest inequality: for they are infinitely apart, and all man&#x27;s good is from God. Hence there can be no justice of absolute equality between man and God, but only of a certain proportion, inasmuch as both operate after their own manner. Now the manner and measure of human virtue is in man from God. Hence man&#x27;s merit with God only exists on the presupposition of the Divine ordination, so that man obtains from God, as a reward of his operation, what God gave him the power of operation for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 1</span></figcaption>

</figure><figure class="quote" id="q-1d3367e33f" data-kw="">

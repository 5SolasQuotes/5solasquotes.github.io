<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-f25ff943b7" data-kw="">
<blockquote><p>…our conversion itself. Which is to be considered two ways: 1. In actu primo [in the first act], as it is the work of God’s Spirit on us, renewing our corrupt nature, healing all vitions, infusing all virtuous inclinations into each faculty; by which Habitual infused qualities they are disposed to all spiritual and holy actions. This is the work of God by his preventing grace. 2. In actu secundo [in the second act], as it is our work converting ourselves to God in all holy operations of faith, love, and godly obedience, which acts we do by the help of God’s subsequent and assisting grace. Of conversion in both senses we are to enquire, how far it may be resisted and hindered: touching the first, namely, our habitual conversion in the infusion of all gracious habits, this conclusion is to be defended: That in our first conversion or sanctification we are merely passive and cannot by any act of ours either work it ourselves or bind God’s working of it. This is apparent by the Scriptures, which testify unto us what our state is before conversion, what the work of God is in our conversion: namely that we are dead in sins, Eph. 2:1; Col. 2:13; Mt. 8:22; Eph. 5:14, that we are blind and very darkness in regard of spiritual knowledge, Rev. 3:18; Eph. 4:17, 5:8; Mt. 6:23; Lk. 4:18; Jn. 1:5; Acts 26:18; 1 Cor. 2:14, that our hearts are stony, destitute of all sense and motions of goodness, Eze. 36:26, 11:19. Again, that God’s work in our conversion is a raising from the dead, Eph. 2:5; Col. 2:12; Rev. 20:6; Jn. 5:21, 25, a restoring of sight to the blind, Lk. 4:18, a new generation and birth of a man, Jn. 1:13; 3:3, another creation of him, Eph. 2:10; Ps. 51:12; 2 Cor. 5:17; Gal. 6:15. The giving of a new heart of flesh and taking away of the old stony heart, Eze. 11:19. Out of which and many the like places we conclude that a man can do no more in the effecting or hindering of his first conversion than the matter can do in regard of the form, to receive or reject it, no more than Adam’s body could resist the entrance of the soul into it or Lazarus’s carcass and the dead bones in Ezekiel could refuse the spirit of life’s coming into them, no more than an infant can hinder its own conception and birth or the world the creation of itself, no more than the bodies of those sick persons whom Christ cured by his word could hinder the restitution of health when Christ commanded them to be whole, or the eyes of the blind could nill the restoring of their sight, or the air that is dark can refuse to be enlightened: in brief, a man’s heart can no more hinder the work of God’s grace in changing it out of stone into flesh than the body of Lot’s wife could resist the force of his power in turning it out of flesh into a pillar of salt. Against this doctrine of man’s passiveness in his first conversion our adversaries object many things, qualifying the rigor of those censures the Scriptures give touching our utter disability, eluding their force by many subtle shifts, all devised only to this purpose, that our conversion may not be thought to be altogether of grace but shared between the grace of God and some power of our own. To allege and answer every cavil were a business of more length than difficulty: unto them all in general I answer that he that takes a man’s judgment touching man’s abilities, he follows the sentence of a blind corrupt judge and that in his own cause. It is the Lord that judges us and it becomes us to submit to his censure, not to extol ourselves when he abases us, lest we be found liers like those hypocritical Laodiceans, boasting that we are rich and increased with goods and have need of nothing when in the mean God knows though we know not, how that we are wretched, and miserable, and poor, and blind, and naked, standing in need of all things. Wherefore let this truth always stand firm, that as no man can prepare himself by any strength of his own effectually to work his sanctification, either alone by himself or as a coworker with the Spirit of grace, so no man can hinder the work of God’s Spirit when he intends to bestow this first grace of sanctification upon a sinner. This of habitual conversion in the internal renovation of all the faculties, which cannot be resisted or hindered: in the next place we are to consider of conversion as it is our act, consisting in the operations and exercises of all gracious habits infused, as when we actually believe, repent and do other good works. This active conversion is nothing but the practice of sanctification, when being made holy and good, we do good and holy works, as a man after he is raised from death or restored to health performs the actions of a living, of a healthy man. For that similitude of St. Austin’s is certain, Non ideo currit rota, ut sit rotunda, etc. as a wheel runs not that it may be round, but because it is round; so the will believes not that it may be regenerate, but because it is regenerate. And therefore that is an error of the coursest bran when our adversaries make the act of believing to go before our sanctification: whereas nothing is more certain than this, that all holy actions whether of faith or any other grace come from that common root of holiness infused into our souls… …there is a double beginning or cause of every gracious action in a man regenerate: 1. The Spirit of God by his exciting and cooperating grace. 2. Man himself renewed and sanctified in all his faculties. The former is termedprincipium a quo[the principle from which], the latter principium quod [the principle that]: man works, but he must be moved thereto and assisted by the Spirit of Grace: both together concur to the producing of every holy action. I say both together: for although man in his first conversion was merely passive, God’s Spirit working all without man’s help: yet man in performance of any holy act is not merely active, able to do all of himself without God’s help. No, he is partly passive, partly active: passive as he stands in need of God’s grace to stir up, guide, and strengthen the endeavor of each faculty in the doing of good: Active in as much as being thus helped by grace, himself willingly moves himself to every godly work. Now by reason of this concurrence of man with God, these operations of grace are properly called man’s work, not God’s work in man. So that when a regenerate man believes, this act though it be caused by Gods Spirit, yet it is done and exercised by Man voluntarily moving himself in that action, and therefore we say it is man that believes, not God’s Spirit that believes: as if the act of believing were wrought in man’s will by the Spirit of God in the same sort as jugglers work strange motions in their puppets, which seem to do wondrous feats, but tis an unseen hand that’s the cause of all. Such gross conceits should not have been devised by ingenuous minds and put upon so plain and clear doctrine as that is touching the concurrence of God’s grace with our strength in all holy actions whatsoever. The point is easy to him that will understand: Every good desire and good work is partly from man, because he wills it: he works it; but principally from God’s Spirit, because He makes man to will and to work it. Without which cooperating grace man by habitual inherent grace could do no good work at all, according to that of Christ, Jn. 15:5, ‘Without Me ye can do nothing,’ and of the apostle, Phil. 1:6, ‘He that hath begun the good work will also perform it;’ and again, Phil. 2:13, ‘It is God that worketh in you both the will and the deed, even of his good pleasure:’ and again, 1 Cor. 15:10, ‘I have labored more abundantly than they all, yet not I but the grace of God which is in me.’</p></blockquote>

ourselves+when+he+abases+us%2C+lest+we+be+found+liers+like+those+hypocritical+Laodiceans%2C+boasting+that+we+are+rich+and+increased+with+goods+and+have+need+of+nothing+when+in+the+mean+God+knows+though+we+know+not%2C+how+that+we+are+wretched%2C+and+miserable%2C+and+poor%2C+and+blind%2C+and+naked%2C+standing+in+need+of+all+things.+Wherefore+let+this+truth+always+stand+firm%2C+that+as+no+man+can+prepare+himself+by+any+strength+of+his+own+effectually+to+work+his+sanctification%2C+either+alone+by+himself+or+as+a+coworker+with+the+Spirit+of+grace%2C+so+no+man+can+hinder+the+work+of+God%E2%80%99s+Spirit+when+he+intends+to+bestow+this+first+grace+of+sanctification+upon+a+sinner.+This+of+habitual+conversion+in+the+internal+renovation+of+all+the+faculties%2C+which+cannot+be+resisted+or+hindered%3A+in+the+next+place+we+are+to+consider+of+conversion+as+it+is+our+act%2C+consisting+in+the+operations+and+exercises+of+all+gracious+habits+infused%2C+as+when+we+actually+believe%2C+repent+and+do+other+good+works.+This+active+conversion+is+nothing+but+the+practice+of+sanctification%2C+when+being+made+holy+and+good%2C+we+do+good+and+holy+works%2C+as+a+man+after+he+is+raised+from+death+or+restored+to+health+performs+the+actions+of+a+living%2C+of+a+healthy+man.+For+that+similitude+of+St.+Austin%E2%80%99s+is+certain%2C+Non+ideo+currit+rota%2C+ut+sit+rotunda%2C+etc.+as+a+wheel+runs+not+that+it+may+be+round%2C+but+because+it+is+round%3B+so+the+will+believes+not+that+it+may+be+regenerate%2C+but+because+it+is+regenerate.+And+therefore+that+is+an+error+of+the+coursest+bran+when+our+adversaries+make+the+act+of+believing+to+go+before+our+sanctification%3A+whereas+nothing+is+more+certain+than+this%2C+that+all+holy+actions+whether+of+faith+or+any+other+grace+come+from+that+common+root+of+holiness+infused+into+our+souls%E2%80%A6+%E2%80%A6there+is+a+double+beginning+or+cause+of+every+gracious+action+in+a+man+regenerate%3A+1.+The+Spirit+of+God+by+his+exciting+and+cooperating+grace.+2.+Man+himself+renewed+and+sanctified+in+all+his+faculties.+The+former+is+termedprincipium+a+quo%5Bthe+principle+from+which%5D%2C+the+latter+principium+quod+%5Bthe+principle+that%5D%3A+man+works%2C+but+he+must+be+moved+thereto+and+assisted+by+the+Spirit+of+Grace%3A+both+together+concur+to+the+producing+of+every+holy+action.+I+say+both+together%3A+for+although+man+in+his+first+conversion+was+merely+passive%2C+God%E2%80%99s+Spirit+working+all+without+man%E2%80%99s+help%3A+yet+man+in+performance+of+any+holy+act+is+not+merely+active%2C+able+to+do+all+of+himself+without+God%E2%80%99s+help.+No%2C+he+is+partly+passive%2C+partly+active%3A+passive+as+he+stands+in+need+of+God%E2%80%99s+grace+to+stir+up%2C+guide%2C+and+strengthen+the+endeavor+of+each+faculty+in+the+doing+of+good%3A+Active+in+as+much+as+being+thus+helped+by+grace%2C+himself+willingly+moves+himself+to+every+godly+work.+Now+by+reason+of+this+concurrence+of+man+with+God%2C+these+operations+of+grace+are+properly+called+man%E2%80%99s+work%2C+not+God%E2%80%99s+work+in+man.+So+that+when+a+regenerate+man+believes%2C+this+act+though+it+be+caused+by+Gods+Spirit%2C+yet+it+is+done+and+exercised+by+Man+voluntarily+moving+himself+in+that+action%2C+and+therefore+we+say+it+is+man+that+believes%2C+not+God%E2%80%99s+Spirit+that+believes%3A+as+if+the+act+of+believing+were+wrought+in+man%E2%80%99s+will+by+the+Spirit+of+God+in+the+same+sort+as+jugglers+work+strange+motions+in+their+puppets%2C+which+seem+to+do+wondrous+feats%2C+but+tis+an+unseen+hand+that%E2%80%99s+the+cause+of+all.+Such+gross+conceits+should+not+have+been+devised+by+ingenuous+minds+and+put+upon+so+plain+and+clear+doctrine+as+that+is+touching+the+concurrence+of+God%E2%80%99s+grace+with+our+strength+in+all+holy+actions+whatsoever.+The+point+is+easy+to+him+that+will+understand%3A+Every+good+desire+and+good+work+is+partly+from+man%2C+because+he+wills+it%3A+he+works+it%3B+but+principally+from+God%E2%80%99s+Spirit%2C+because+He+makes+man+to+will+and+to+work+it.+Without+which+cooperating+grace+man+by+habitual+inherent+grace+could+do+no+good+work+at+all%2C+according+to+that+of+Christ%2C+Jn.+15%3A5%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+of+the+apostle%2C+Phil.+1%3A6%2C+%E2%80%98He+that+hath+begun+the+good+work+will+also+perform+it%3B%E2%80%99+and+again%2C+Phil.+2%3A13%2C+%E2%80%98It+is+God+that+worketh+in+you+both+the+will+and+the+deed%2C+even+of+his+good+pleasure%3A%E2%80%99+and+again%2C+1+Cor.+15%3A10%2C+%E2%80%98I+have+labored+more+abundantly+than+they+all%2C+yet+not+I+but+the+grace+of+God+which+is+in+me.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+p.+144&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff25ff943b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f25ff943b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=our%20conversion%20itself.%20Which%20is%20to,of%20God%20which%20is%20in%20me&amp;text=our%20conversion%20itself.%20Which%20is%20to%20be%20considered&amp;text=the%20grace%20of%20God%20which%20is%20in%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>So this acceptance or reception of Christ tendered is called ‘regeneration’ (Jn. 1:13 &amp; 3:3, 5-6; 1 Pet 1:23 &amp; 2:2; 1 Jn. 3:9) and ‘renovation’ (Tit. 3:5) as it is a beginning of new life, and ‘conversion’ (Acts 26:17-18; 1 Pet. 2:8-9) inasmuch as they that obey the divine call are turned from darkness to light and from the power of Satan unto God. This reception of Christ tendered is twofold: viz. passive and active. (1) Passive, when God apprehends the sinner, infusing into his soul habits, principles, seeds of faith, repentance, grace, etc. whereby the dark mind is enlightened, the dead heart is quickened, the unwilling will is made willing, etc. Phil. 3:11; Eph. 1:17; 2 Cor. 4:6; Jn. 6:44; Eph. 2:1, 5; Phil. 2:13. This is properly, regeneration, renovation, new-creation, habitual sanctification, Tit. 3:5; 2 Cor. 5:17; 1 Cor. 6:11; 1 Pet. 1:2; Eph. 2:10. This mighty work of grace upon the heart and will of the sinner is not upon the will or heart either as a free agent or as a natural patient, but in regard of that obediential disposition wherein it stands to God’s Almighty power, which it cannot but obey and yield unto, coming to anything whereunto He will bring it, powerfully and efficaciously, Phil. 2:13; Jn. 6:44; Eph. 2:8. (2) Active, when the mind, will and heart of a sinner thus apprehended, qualified and principled by God, through his assistant and co-operating grace does accept Jesus Christ by faith, fiducially resting and relying upon Christ alone, and upon God in Him for life and salvation, Jn. 6:37, 44 &amp; 3:15-16; 1 Pet. 1:21. And as the soul by faith turns to Christ as his chief good: so by repentance it also turns from sin as the chief evil, inconsistent with that good. Hence, faith and repentance are linked together in Scripture as two inseparable twin graces, Mk. 1:15; Acts 19:4. And as faith, so true repentance is the mere gift of God, Acts 11:18; 2 Tim. 2:25. But of the nature both of faith and repentance, I have spoken heretofore: there see (in bk. 3, ch. 3, aphorism 5, quest. 1-7; in bk. 3, ch. 4, aphorism 4, §2, p. 896, etc. and in my Communicant Instructed, p. 127, etc.). And thus the sinner is savingly brought by Christ into his New Covenant.</p></blockquote>

2C+through+his+assistant+and+co-operating+grace+does+accept+Jesus+Christ+by+faith%2C+fiducially+resting+and+relying+upon+Christ+alone%2C+and+upon+God+in+Him+for+life+and+salvation%2C+Jn.+6%3A37%2C+44+%26+3%3A15-16%3B+1+Pet.+1%3A21.+And+as+the+soul+by+faith+turns+to+Christ+as+his+chief+good%3A+so+by+repentance+it+also+turns+from+sin+as+the+chief+evil%2C+inconsistent+with+that+good.+Hence%2C+faith+and+repentance+are+linked+together+in+Scripture+as+two+inseparable+twin+graces%2C+Mk.+1%3A15%3B+Acts+19%3A4.+And+as+faith%2C+so+true+repentance+is+the+mere+gift+of+God%2C+Acts+11%3A18%3B+2+Tim.+2%3A25.+But+of+the+nature+both+of+faith+and+repentance%2C+I+have+spoken+heretofore%3A+there+see+%28in+bk.+3%2C+ch.+3%2C+aphorism+5%2C+quest.+1-7%3B+in+bk.+3%2C+ch.+4%2C+aphorism+4%2C+%C2%A72%2C+p.+896%2C+etc.+and+in+my+Communicant+Instructed%2C+p.+127%2C+etc.%29.+And+thus+the+sinner+is+savingly+brought+by+Christ+into+his+New+Covenant.%E2%80%9D%0A%0A%E2%80%94+Francis+Roberts%2C+Mysterium+%26+Medulla+Bibliorum%3A+the+Mystery+%26+Marrow+of+the+Bible%2C+viz.+God%E2%80%99s+Covenant+with+Man%E2%80%A6+%28London%3A+R.W.%2C+1657%29%2C+bk.+4%2C+Of+God%E2%80%99s+Covenant+of+Performance+made+and+confirmed+in+Jesus+Christ%2C+ch.+6%2C+Of+the+Blessed+Messiah%2C+Aphorism+4%2C+%E2%80%98Of+Christ%E2%80%99s+Establishment+of+his+New+Covenant+and+Application+of+it+to+God%E2%80%99s+Elect%E2%80%99%2C+pp.+1646-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e1c22f3fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e1c22f3fc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-being-born-again-as-subsequent-to-faith-in-receiving-christ-the-fullness-of-life-by-faith/#:~:text=So%20this%20acceptance%20or%20reception%20of,by%20Christ%20into%20his%20New%20Covenant&amp;text=So%20this%20acceptance%20or%20reception%20of%20Christ%20tendered&amp;text=savingly%20brought%20by%20Christ%20into%20his%20New%20Covenant" rel="noopener" target=" <blockquote><p>‘Born again’. Being turned unto God by true faith and repentance: A metaphorical term. We are born again four ways: 1. Sacramentally, by Baptism. 2. Spiritually, by the Word. 3. Corporally, in the Resurrection. 4. Eternally, in our Glorification. Question: But why is our repentance likened to a new birth? Answer: [1] To distinguish true repentance, from that which is false and fained: for it imports five differences. … 2. That in true repentance there is a total change in the whole nature of man: He has grace in every part; a new mind and a new heart, a new memory, and a new conscience, a new language, and a new carriage both to God and man: for birth is the producing of all essential parts of man. 3. That in true repentance there is the pain of contrition, a broken spirit, the throws and pains of travail, there is true godly sorrow and grief in the birth of grace. 4. That there is in true repentance a daily hunger and thirst after the sincere milk of the Word, 1 Pet. 2:2. 5. That in the things of God’s Kingdom there is new life, and sense, and feeling, and motion. Secondly, to show the privilege of the penitent: for it signifies he gets more by his new birth than any child in nature can do by pleading his birthright: For if in repentance we be born unto God, then it shows: 1. That we have received power to be the sons of God, Jn. 1:2. 2. That with our adoption we enjoy the privileges of sons. 1. The favor of God, as a father. 2. The care of God to maintain us, Mt. 6:33. 3. The pardon of God in saving us from condemnation, Rom. 8:1. 4. The portion of God, even the inheritance which God gives as a Father, which is spoken of Rom. 8:17; Gal. 4:7. The use should be twofold: 1. That wee try ourselves carefully in the businesse of our repentance by the former signes:* 1.2 and secondly, that we comfort ourselves in the privileges of our new birth, rejoicing in our portion, and the favor of our heavenly Father. And thus of the reason of the phrase. Concerning the new birth, here we have occasion to consider of two things: 1. That it is needful often to be remembered of the doctrine of regeneration: the apostle having spoken of it before, falls upon it here again.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a190a878ae" data-kw="">
<blockquote><p>And though women be forbidden authoritatively to teach in the Church, 1 Tim. 2:7; 1 Cor. 14, and publicly, yet they may teach the younger women, Tit. 2:2-3, give a seasonable rebuke and counsel to men, 2 Sam. 20:16-17; 1 Sam 25:23-24, 32-33, and a woman, a sister is to labor to gain a sister, by Mt. 18, and that in a Church-way; and women, as other Church-members, are to teach, exhort, warn, according to their place, as well as men, Col. 3:16; Rom. 15:14; 1 Thess. 5:14; Heb. 3:13 &amp; 20, 25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker… (London, 1658)</cite>, p. 260</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“And though women be forbidden authoritatively to teach in the Church, 1 Tim. 2:7; 1 Cor. 14, and publicly, yet they may teach the younger women, Tit. 2:2-3, give a seasonable rebuke and counsel to men, 2 Sam. 20:16-17; 1 Sam 25:23-24, 32-33, and a woman, a sister is to labor to gain a sister, by Mt. 18, and that in a Church-way; and women, as other Church-members, are to teach, exhort, warn, according to their place, as well as men, Col. 3:16; Rom. 15:14; 1 Thess. 5:14; Heb. 3:13 &amp; 20, 25.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20014c7035" data-kw="">
<blockquote><p>But you [a congregationalist] will say, in a church in an island, one may be a pastor without any ordination if the people elect him and there be no elders to ordain. I answer: it is true: but so many pastors send a pastor to be a pastor to a congregation, though that congregation never choose him, as possibly they be for the most part Popish or unwilling; yet both cases are extraordinary and the Church [is in the case of] not [being] constituted and established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644) | pt. 1</cite>, p. 493</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-b6312b0d50" data-kw="">
<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinanris &amp; operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. … 7. A calling to the ministry is either such [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51]. 8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/due-right-of-presbyteries.html">Due Right of Presbyteries</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1st Part</cite>, pp. 203-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

="../quote/b6312b0d50.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=4th%20Distinction.%20A%20calling%20may%20be,the%20instruments%20both%20taking%20and%20giving." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f915b7b479" data-kw="">
<blockquote><p>…for all argument they come at last to this,’By what authority doest thou these things; and who gave thee this authority?’ where the Lord answering for Himself, then, and for us now in the like case, most plainly and at length shows that, howsoever in the ordinary course of a constitute Church, a careful regard must be had to the ordinary calling, yet when (as sometime it falls) that the ordinary husband-men become murderers, and the ordinary builders become destroyers, there God extraordinarily stirs up men whose ministry proves itself to be from Heaven and not from men, even by this, that they come in the way of righteousness: and sinners are converted by them, that, so the Lord of the vineyard may report fruit thereof, even when the ordinary husbandmen rebel, and that the stone, rejected, even of the ordinary builders, may yet be made the head of the corner: which, howsoever it be marvelous in our eyes, yet it is the Lord his doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-forbes.html">Patrick Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Lawful calling of the Ministers of Reformed Churches Against the Cavillations of Romanists… (Middleburg, 1614)</cite>, pp. 3-4</span></figcaption>

</figure><figure class="quote" id="q-2455814659" data-kw="">
<blockquote><p>The apostles have preached the Gospel to us from the Lord Jesus Christ; Jesus Christ [has done so] from God. Christ therefore was sent forth by God, and the apostles by Christ. Both these appointments, then, were made in an orderly way, according to the will of God. Having therefore received their orders, and being fully assured by the resurrection of our Lord Jesus Christ, and established in the Word of God, with full assurance of the Holy Ghost, they went forth proclaiming that the kingdom of God was at hand. And thus preaching through countries and cities, they appointed the firstfruits [of their labours], having first proved them by the Spirit, to be bishops and deacons of those who should afterwards believe. Nor was this any new thing, since indeed many ages before it was written concerning bishops and deacons. For thus saith the Scripture in a certain place, ‘I will appoint their bishops in righteousness, and their deacons in faith.’ [Isa. 60:17 LXX]</p></blockquote>

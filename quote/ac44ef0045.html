<main class="wrap"><figure class="quote" id="q-ac44ef0045" data-kw="judicial ends theocracy">
<blockquote><p>The forensic or judicial law concerned the civil government of the people of God under the Old Testament and contained a body of precepts concerning the form of that political rule. There were various ends of it. (1) The good order and legitimate constitution of the Jewish polity, which should be a true theocracy, as Josephus calls it. (2) The distinguishing of that state and nation from all other people and states and that that polity might be the seat of the church and the place for the manifestation of God. (3) The vindication of the moral and ceremonial law from contempt. (4) The adumbration of the spiritual kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.26.1</span></figcaption>

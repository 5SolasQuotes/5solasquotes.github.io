<main class="wrap"><figure class="quote" id="q-006c00dac8" data-kw="">
<blockquote><p>Who soever are perfect in the Church of God, or whosoever are come to a degree of perfection, or press to perfection, aspiring above nature, above human things, to see things Heavenly and spiritual, these men account of my wisdom, in the sight of these I am wise, and in their audience I speak wisdom, howbeit earthly men think all that I speak but folly. This is the meaning &amp; the effect of the Apostle’s answer shortly. As to this word of perfection, I will not insist in it. A full perfection is not here meaned, but a striving to perfection.

No man nor woman in this life is perfect, but the perfectest of us all that liveth in this world, one lie are striving to perfection, thorow infinite infirmities. Therefore, this word of perfection is not to be understood of that consummate perfection which we shall have in that other life, but as it is opened unto them that have no perfection, no spiritual nor Heavenly sight or knowledge of things Heavenly &amp; spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 98-99.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c9879eb73" data-kw="">
<blockquote><p>Let no Church therefore think itself perfect, and needing nothing, (as bragging Laodicea did) especially when it hath but that first foundation which it had when it came newly out of Babylon; and more especially in matters of worship and discipline.

It is no dishonour unto those Reformers, to say, that they fully finished not this work; as it was not unto Zerubbabel here, that he perfected not the Temple at first. Blessed men! It is evident they purposed more then they did or could effect, because the people’s hearts were not [as yet] prepared, as the phrase is, 2 Chron. 20. 33. In our very Common-Prayer book, there is an [Until] the said discipline may be restored, which argueth they aimed at more. And besides, They were not Apostles, to whom nothing might be added, as Gal. 2. 6.

And God raising up the Tabernacle that was fallen down, not by immediate inspiration, (as at first by the Apostles) but by his Spirit, renewing and begetting light in an ordinary way: Hence therefore the Churches coming out of the darkness of Popery, must needs recover that fulness and perfection of light (which the Apostolical times had) …, by piece-meals and degrees. As for the great things of the Gospel, matters of Faith, or Doctrine, they had so happy a hand therein, that there is to be found little, if any Hay or stubble therein: But in matters of Order, which concern Worship and Discipline, (for so the Apostle distinguisheth, Colos. 2. 5. [Faith and Order] let it be enquired into, whether they were so exact therein.

Although this must be said, that God did take care for all Fundamental Ordinances of his worship; and it is a bitter error, and full of cruelty, to say, We have had no Churches, no Ministers, no Sacraments, but Antichristian all. God’s first and chief care was to build up his Church mystical, to make men Saints, and he hath made glorious ones in their personal walkings with him: and to that end he made a plentiful provision in matters of faith, even from the very first.

It fell out in this case, as in a new Plantation; which if men were to make in another world, and so to begin the world anew, their first care would be to provide necessaries for their subsistence as they are men; to have corn for bread, cattle for meat, and the like: But matters of Order &amp; Government they think of afterwards, and often fall into the right, by seeing their errors by degrees. Think not much, therefore, that men call for (as most men do) a reformation of some things amiss in matters of worship &amp; discipline, or an addition of some things; perhaps a Candlestick, or some other utensil or ordinance of Church-worship is found wanting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zerubbabel’s encouragement to finish the temple. A sermon preached before the honourable House of Commons, at their late solemn fast, Apr. 27 1642</cite>, (London: R. Dawlman, 1642), pp 16-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-f2cd2fb423" data-kw="">
<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Naphtali Press) vol. 3, p. 198</span></figcaption>

<blockquote><p>…Which comes to pass thus:

1. By habitual grace infused, the sanctified will is constantly determined to embrace all spiritual good.

2. By assisting grace the will is stirred up, provoked, allured and inclined to obedience, through the proposal of the promises and the heavenly suggestions of the Holy Spirit.

3. By the same assisting grace all contrary motions of concupiscence are subdued and kept under. So that nothing can hinder obedience to follow; because by grace the will is made willing to obey and by grace all impediments in obeying are taken away: now when all lets are removed, what can let a willing mind to do that which it desires?</p></blockquote>

</figure><figure class="quote" id="q-15a0b0e7a3" data-kw="mortification vivification sanctification renovation image">
<blockquote><p>Rather, it is used strictly for a real and internal renovation of man by which God delivers the man planted in Christ by faith and justified (by the ministry of the word and the efficacy of the Spirit) more and more from his native depravity and transforms him into his own image. Thus with separation from the world and sin and consecration to God, which is the killing of the old man and the vivifying of the new.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5290782353" data-kw="">
<blockquote><p>Speaking before the General Assembly of the Presbyterian Church in Ireland in 1841, Henry Cooke mentioned how a period of ill-health was a providential means of leading him to embrace exclusive psalmody:

Some years ago, he had taken ill, in going to Newry, to organize the Church there. He was five or six weeks unable to reach his own home, in consequence of the occurrence which had happened to him; and, while he was lying on the bed of sickness, his mind, however, capable of thought, he then, for the first time, discovered, that hymns were not suited to the sick man; and that the psalms only were suited to the period of sickness. He could find no truth in paraphrase or hymns, at that hour. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/northern-whig.html">Northern Whig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Northern Whig</cite>, 10 July 1841.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8de93cabef" data-kw="">
<blockquote><p>Whether will these [Separatist] men allow one Christian to sing a psalm alone by himself, methinks the texts and examples mentioned, together with Jam. 5:13… are so plain as no rational man can deny it; But if one may, then the Church may. There is no act of worship which any member of the Church is bound to perform, but the Church is bound to perform; but on the contrary it is not true that what worship the Church does perform, a member of Church can, or may; For instance for the first part, meditation needs no organ of the body, and therefore I leave that. But does a member of the Church pray, so does the whole Church: does he read the Scriptures? so they are read in the Church; does he fast and pray? so does the Church; does he sing a psalm? so does the Church; But it is not true on the contrary, as appears in the sacraments, preaching, discipline, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined</cite>, … (London: 1652), pp. 35-36</span></figcaption>

</figure><figure class="quote" id="q-f31f72356f" data-kw="">
<blockquote><p>He falls next on the doxology… We [Scottish presbyterians] do not use it, but we never laid such weight on using it as to forbear all communion with a congregation where it is used; I called it a ‘human composure’… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10, p. 258</span></figcaption>

</figure><figure class="quote" id="q-c3a2cc06f5" data-kw="">
<blockquote><p>To use the Sacraments according unto the ordinance of God. So God commanded the Passover to be kept in the assembly of the people, and appointed certain sacrifices unto other feast days and Sabbaths. Also Act. 20. The first day of the week, when as the Disciples were come together to break bread, Paul preached, &amp;c. For as God will have true doctrine to be heard, so he will also have the lawful use of the sacraments to be seen in the public assemblies of the Church: because that he will have both these to be a note, whereby the Church may be known and discerned from other nations &amp; sects. The sacraments also, like as the word, are an instrument, or exercise to stir up and maintain faith and godliness in us. They are also a public profession of our faith and thankfulness unto God, and a part of the public worship of God in the church. And therefore the use of them is most especially agreeable unto the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A very profitable and necessary discourse concerning the observation and keeping of the Sabbath day serving as well to confute the superstition of the Jews, which obstinately urge the strict keeping of the seventh day, as also to overthrow the vain and godless reasons of others, that stiffly at this</cite>, trans. John Stockwood (London: John Harrison, 1584), unpaginated.</span></figcaption>

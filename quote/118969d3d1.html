<main class="wrap"><figure class="quote" id="q-118969d3d1" data-kw="institution">
<blockquote><p>The other sacrament of the New Testament is the holy Supper, in which, by the distribution and reception of broken bread and poured-out wine, is declared and sealed to believers the communion of the body of Christ broken for them on the cross and of his blood shed for them unto eternal life. The more illustrious and of greater moment to the consolation of believers this mystery of the Christian religion is, with so much the greater violence has Satan always endeavored to obscure and corrupt it in order to deprive the church of this inestimable treasure. Hence it has happened that in no part of religion have such prolix and animated disputations been raised up, so that at length the Romanists seem to have constituted the sum of theology in this article, nor is there anything in theology or philosophy which they have not brought to bear upon this and compelled to serve their purpose. Various names by which it is usually expressed: (1) the Lord’s Supper (1 Cor. 11:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.21.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-150209a9b0" data-kw="">

</figure><figure class="quote" id="q-5af9981654" data-kw="">
<blockquote><p>The head of this horrid abomination was, when he raised a sign by which it was not only obscured and perverted, but altogether obliterated and abolished, vanished away and disappeared from the memory of man—namely, when, with most pestilential error, he blinded almost the whole world into the belief that the Mass was a sacrifice and oblation for obtaining the remission of sins.</p></blockquote>

</figure><figure class="quote" id="q-cb7d096b01" data-kw="thanksgiving">
<blockquote><p>In this sacramental blessing, however, a twofold relation (schesis) must be attended to: the first to God, the second to the symbols themselves. To God, that thanks may be given to him for the wonderful blessing of the whole work of redemption because he sent Christ into the world and delivered him to death and because he gives him to us for vivifying food. To the symbols, that a blessing may be obtained upon the creatures spread before us (and soon to be extended to believers) in virtue of which they (otherwise of themselves incapable of it) may be rendered efficacious to the spiritual use and benefit of the recipients. Thus in this blessing is contained both the giving of thanks for blessings already received and a supplication for the consecration of the symbols. This is rightly referred to the symbols, not immediately, but because faith excited towards God (the author of sanctification) brings back from him the power of use to the celebration of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.23</span></figcaption>

<main class="wrap"><figure class="quote" id="q-993fe3fb0f" data-kw="">
<blockquote><p>[The] Use of all is to press us to this weighty duty of living to God, and not to ourselves. Not to our own will and interest, and according to the will, and for the glory of God. Motives: 1. Christ’s self-denial, who came from heaven not only to expiate our offenses, but to give us an example. And wherein was the example? He tells us He came not to do his own will, but the will of Him that sent Him, Jn. 6:38. And to promote his Father’s glory, Jn. 8:50, ‘I seek not my own Glory’? He was still guided by his Fathers will, and had his orders from heaven for all that He did. Now how did He do the will of God and seek the glory of God? He did it with delight, Jn 4:34, ’twas meat and drink to Him to do his Fathers will. A will wedded to itself, and his own honour and ease, and credit, is most unlike Christ. And He did it with much patience, and self-denial, Rom. 15:3. He pleased not Himself, that is, sought not the interests of that life He had assumed, but contradicted them by his fastings, temptations sufferings, through the reproaches, and ingratitude of men, and outward meanness, and poverty of his condition. And especially by his death, and passion there, he humbled Himself, and made Himself of no reputation, Phil. 2:4-8. That the same mind might be in us; that we might learn that life, and all the comforts of life, should not be so dear to us, as the love of God, and everlasting life; for Christ loved not his life in comparison of love to his Father and his Church. He preferred the pleasing of his Father in the work of redemption, before his own life. Christ emptied himself , that God might be glorified. How unwilling are ye to go back two or three degrees in your pomp or pleasure, or profit, for God’s sake, when the Sun of righteousness went back ten degrees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew... (London: Robinson, 1684), Sermons on 2 Cor. 5, sermon 29, on 2 Cor. 5:15</cite>, p. 187</span></figcaption>

</figure><figure class="quote" id="q-72f383c48f" data-kw="">
<blockquote><p>Natural self is to be denied as well as corrupt self, as appears by the example of Christ, who had no corrupt self to deny, and yet ’tis said, Rom. 15:3, ‘He pleased not Himself.’ Christ had an innocent natural will, by which He loved his natural life and peace; ‘Father let this cup pass.’ But He submitted it to God; ‘Not my will, but thine be done,’ Mt. 26:39. Therefore we also must not only deny self as corrupted by sin, but self as separate from God. How else shall we submit to God in these things wherein He may lay a restraint upon us, or put us to trial about them, whether we love them in order to Him, they being things which otherwise we may affect. And besides, to love any thing apart from God, and to seek it apart from God and rejoice in it apart from God, without any reference and respect to God, is to make the creature the last end, in which the action terminates, which is an invading of God’s prerogative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew... (London: Robinson, 1684), Sermons on 2 Cor. 5, sermon 29, on 2 Cor. 5:15</cite>, p. 184</span></figcaption>

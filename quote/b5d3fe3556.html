<blockquote><p>A corrupt and wicked life argues a man to be a stranger to God, and God him; for otherwise a man might draw nigh to God, and have unclean hands too, which the Text [James 4:8] supposes that it cannot be. That power which draws a man into acquaintance with God, doth proportionably kill sin.

That power which flows from God in acquaintance with a man, kills sin too: whether I go out to the sun, or the sun come in to me, the darkness is expelled: sin hath not dominion over them that are under grace, Rom. 6. 14. the knowledge of God sets a man loose from his bondage to the enslaving lusts he before served, ye shall know the truth, and the truth shall make you free, John 8. 32. draw nigh to God, and be unclean if you can. That faith which is uniting to Christ, is a purifying faith; rebellion against the Commandments of God, is inconsistent with communion with God; you may fast, and pray, and ask, that you may consume upon your lusts, ver. 4. like a cutpurse in a Church, who comes not thither to seek God, but his prey.

They that draw nigh to God, must cleanse their hands; I will wash mine hands in innocency, so will I compass thine Altar, O Lord, Psal. 26. 6. Where you may observe, that thanksgivings and praises, which the Psalmist calls sacrifices of shouting, or loud music, Psal. 27. 6. and wherein they used (as one saith) … are to be performed with washen hands: so in your prayers, the Lord requires that you should lift up pure hands, 1 Tim. 2. 8. and what a sweet reflection may you make upon your deliverances which are wonderful, when you can say, I was upright with God, and I kept my self from mine iniquity? Therefore hath the Lord recompensed me according to my righteousness, according to the cleanness of my hands in his eye-sight, Psal. 18. 23, 24.

If ye fall into straits, and be plunged into depths of misery; If your face be foul with weeping, and on your eye lids be the shadow of death; what a lifting up of the head will it be unto you, to be able to say, Not for any injustice in my hands? Job. 16. 17. If the Lord shall deliver this Island from the oppression and injustice under which it hath groaned; what a crown and comfort will it be to you, that it is delivered by the pureness of your hands? Job. 22. 30.

To conclude. If there be a frustration of our counsels, and our endeavours bring forth nothing but wind; You shall find the reason why God makes all void and ineffectual, Isa. 59. 6. Their webs shall not become garments, neither shall they cover themselves with their works; Their works are works of iniquity, and the act of violence is in their hands.</p></blockquote>

<blockquote><p>As for public prayers, there are two kinds of them—the one is expressed in words only, the other with song; and this is no recent invention, for from the first origin of the church, this has been the case, as appears in history. And even St. Paul does not speak of verbal prayer alone, but also of singing. And in truth, we know by experience that song has great force and power in moving and inflaming the heart of man to invoke and praise God with more vehement and ardent zeal. It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. For the first, it is not without cause that the Holy Spirit exhorts us so carefully, by the Holy Scripture, to rejoice ourselves in God, and that all our joy should rest there as its true end. For he knows how truly we are inclined to please ourselves in vanity. Thus while our nature draws and leads us to seek all means of foolish and vicious enjoyment—on the contrary, our Lord, to separate and draw us from the allurements of the flesh and of the world, presents to us every possible means to fill us with that spiritual joy which he commends so much to us. But amongst other things which are suitable for the recreation of men, and for yielding them pleasure, music is either the first, or one of the chief, and we must esteem it a gift of God bestowed for that end. Therefore, by so much the more, we ought to see that it is not abused, for fear of soiling and contaminating it; turning that to our condemnation which was given for our profit and good. Even were there no other consideration than this alone, it ought to move us to regulate the use of music, so as to make it subservient to all good morals, and that it should not give occasion for loosing the bridle of dissoluteness, that it should not lead to voluptuousness, nor be the instrument of immodesty and impurity. But further, there is scarcely anything in this world which can more powerfully turn or bend hither and thither the manners of men, as Plato has wisely remarked. And in fact we experimentally feel that it has a secret and incredible power over our hearts to move them one way or other. Therefore we ought to be so much the more careful to regulate it in such a manner, that it may be useful to us, and in no ways pernicious. For this reason, the ancient doctors of the church often complained that the people of their time were addicted to disgraceful and immodest songs, which, not without cause, they esteemed and called a deadly and Satanic poison for corrupting the world. But in speaking of music, I include two parts, to wit, the words, or subject and matter; secondly, the song or melody. It is true that all evil words, as saith St. Paul, corrupt good manners, but when melody is united to them, they much more powerfully pierce the heart, and enter in: just as when by a funnel wine is poured into a vessel, so poison and corruption is infused into the depth of the heart by the melody. What then is to be done? It is to have songs not only pure, but also holy, that they may be incitements to stir us up to pray to and praise God, and to meditate on his works, in order to love him, fear him, honour and glorify him. But what St. Augustine says is true, that none can sing things worthy of God but he who has received power from himself. Wherefore when we have sought all round, searching here and there, we shall find no songs better and more suitable for this end than the Psalms of David which the Holy Spirit dictated and gave to him. And therefore when we sing them, we are as certain that God has put words into our mouths as if he himself sang within us to exalt his glory. Wherefore Chrysostom exhorts all men and women and little children to accustom themselves to sing them as a means of associating themselves with the company of angels; further, we must remember what St. Paul says, that spiritual songs cannot be sung well but with the heart; but the heart requires the understanding: and in that saith St. Augustine lies the difference between the song of man and that of birds, for a linnet, a nightingale, and a jay, may sing well, but it will be without understanding. But the peculiar gift of man is to sing knowing what he says. Further, the understanding ought to accompany the heart and affections, which cannot be unless we have the song imprinted in our memory, that we may be ever singing it. This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David. Touching the music, it appeared that it should be simple in the way we have put it, to carry weight and majesty suitable to the subject, and even fit to be sung in church as has been said.</p></blockquote>

e+allurements+of+the+flesh+and+of+the+world%2C+presents+to+us+every+possible+means+to+fill+us+with+that+spiritual+joy+which+he+commends+so+much+to+us.+But+amongst+other+things+which+are+suitable+for+the+recreation+of+men%2C+and+for+yielding+them+pleasure%2C+music+is+either+the+first%2C+or+one+of+the+chief%2C+and+we+must+esteem+it+a+gift+of+God+bestowed+for+that+end.+Therefore%2C+by+so+much+the+more%2C+we+ought+to+see+that+it+is+not+abused%2C+for+fear+of+soiling+and+contaminating+it%3B+turning+that+to+our+condemnation+which+was+given+for+our+profit+and+good.+Even+were+there+no+other+consideration+than+this+alone%2C+it+ought+to+move+us+to+regulate+the+use+of+music%2C+so+as+to+make+it+subservient+to+all+good+morals%2C+and+that+it+should+not+give+occasion+for+loosing+the+bridle+of+dissoluteness%2C+that+it+should+not+lead+to+voluptuousness%2C+nor+be+the+instrument+of+immodesty+and+impurity.+But+further%2C+there+is+scarcely+anything+in+this+world+which+can+more+powerfully+turn+or+bend+hither+and+thither+the+manners+of+men%2C+as+Plato+has+wisely+remarked.+And+in+fact+we+experimentally+feel+that+it+has+a+secret+and+incredible+power+over+our+hearts+to+move+them+one+way+or+other.+Therefore+we+ought+to+be+so+much+the+more+careful+to+regulate+it+in+such+a+manner%2C+that+it+may+be+useful+to+us%2C+and+in+no+ways+pernicious.+For+this+reason%2C+the+ancient+doctors+of+the+church+often+complained+that+the+people+of+their+time+were+addicted+to+disgraceful+and+immodest+songs%2C+which%2C+not+without+cause%2C+they+esteemed+and+called+a+deadly+and+Satanic+poison+for+corrupting+the+world.+But+in+speaking+of+music%2C+I+include+two+parts%2C+to+wit%2C+the+words%2C+or+subject+and+matter%3B+secondly%2C+the+song+or+melody.+It+is+true+that+all+evil+words%2C+as+saith+St.+Paul%2C+corrupt+good+manners%2C+but+when+melody+is+united+to+them%2C+they+much+more+powerfully+pierce+the+heart%2C+and+enter+in%3A+just+as+when+by+a+funnel+wine+is+poured+into+a+vessel%2C+so+poison+and+corruption+is+infused+into+the+depth+of+the+heart+by+the+melody.+What+then+is+to+be+done%3F+It+is+to+have+songs+not+only+pure%2C+but+also+holy%2C+that+they+may+be+incitements+to+stir+us+up+to+pray+to+and+praise+God%2C+and+to+meditate+on+his+works%2C+in+order+to+love+him%2C+fear+him%2C+honour+and+glorify+him.+But+what+St.+Augustine+says+is+true%2C+that+none+can+sing+things+worthy+of+God+but+he+who+has+received+power+from+himself.+Wherefore+when+we+have+sought+all+round%2C+searching+here+and+there%2C+we+shall+find+no+songs+better+and+more+suitable+for+this+end+than+the+Psalms+of+David+which+the+Holy+Spirit+dictated+and+gave+to+him.+And+therefore+when+we+sing+them%2C+we+are+as+certain+that+God+has+put+words+into+our+mouths+as+if+he+himself+sang+within+us+to+exalt+his+glory.+Wherefore+Chrysostom+exhorts+all+men+and+women+and+little+children+to+accustom+themselves+to+sing+them+as+a+means+of+associating+themselves+with+the+company+of+angels%3B+further%2C+we+must+remember+what+St.+Paul+says%2C+that+spiritual+songs+cannot+be+sung+well+but+with+the+heart%3B+but+the+heart+requires+the+understanding%3A+and+in+that+saith+St.+Augustine+lies+the+difference+between+the+song+of+man+and+that+of+birds%2C+for+a+linnet%2C+a+nightingale%2C+and+a+jay%2C+may+sing+well%2C+but+it+will+be+without+understanding.+But+the+peculiar+gift+of+man+is+to+sing+knowing+what+he+says.+Further%2C+the+understanding+ought+to+accompany+the+heart+and+affections%2C+which+cannot+be+unless+we+have+the+song+imprinted+in+our+memory%2C+that+we+may+be+ever+singing+it.+This+present+book+%5Bthe+Genevan+Psalter%2C+1543%5D%2C+for+this+cause%2C+besides+what+otherwise+has+been+said%2C+ought+to+be+particularly+acceptable+to+every+one+who+desires%2C+without+reproach%2C+and+according+to+God%2C+to+rejoice+in+seeing+his+own+salvation%2C+and+the+good+of+his+neighbours%3B+and+thus+has+no+need+to+be+much+recommended+by+me%2C+as+it+carries+in+itself+its+own+value+and+praise.+Only+let+the+world+be+well+advised%2C+that+instead+of+songs+partly+vain+and+frivolous%2C+partly+foolish+and+dull%2C+partly+filthy+and+vile%2C+and+consequently+wicked+and+hurtful%2C+which+it+has+heretofore+used%2C+it+should+accustom+itself+hereafter+to+sing+these+heavenly+and+divine+songs%2C+with+good+king+David.+Touching+the+music%2C+it+appeared+that+it+should+be+simple+in+the+way+we+have+put+it%2C+to+carry+weight+and+majesty+suitable+to+the+subject%2C+and+even+fit+to+be+sung+in+church+as+has+been+said.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Other+citations+%28work+not+named%29%2C+Preface+to+the+1543+Genevan+Psalter&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a169505ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a169505ee.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/saturday-psalm-series-we-sing-psalms-in-public-worship-calvin/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>

</figure><figure class="quote" id="q-b1385f3a8f" data-kw="">
<blockquote><p>Not that to drink wine is shameful. God forbid! For such precepts belong to heretics … The passage before us is useful also against heretics, who speak evil of God’s creatures; for if it had been among the number of things forbidden, Paul would not have permitted it, nor would have said it was to be used.

And not only against the heretics, but against the simple ones among our brethren, who when they see any persons disgracing themselves from drunkenness, instead of reproving such, blame the fruit given them by God, and say, “Let there be no wine.” We should say then in answer to such, “Let there be no drunkenness; for wine is the work of God, but drunkenness is the work of the devil. Wine maketh not drunkenness; but intemperance produceth it. Do not accuse that which is the workmanship of God, but accuse the madness of a fellow mortal. But thou, while omitting to reprove and correct the sinner, treatest thy Benefactor with contempt!”

… When, therefore, we hear men saying such things, we should stop their mouths; for it is not the use of wine, but the want of moderation which produces drunkenness, Drunkenness! that root of all evils. Wine was given to restore the body’s weakness, not to overturn the soul’s strength; to remove the sickness of the flesh, not to destroy the health of the spirit.

Do not then, by using the gift of God immoderately, afford a handle to the foolish and the impudent. For what is a more wretched thing than drunkenness! The drunken man is a living corpse. Drunkenness is a demon self-chosen, a disease without excuse, an overthrow that admits of no apology; a common shame to our kind. The drunken man is not only useless in our assemblies; not only in public and private affairs; but the bare sight of him is the most disgusting of all things, his breath being stench.

The belchings, and gapings, and speech of the intoxicated, are at once unpleasant and offensive, and are utterly abhorrent to those who see and converse with them; and the crown of these evils is, that this disease makes heaven inaccessible to drunkards, and does not suffer them to win eternal blessedness: for besides the shame attending those who labour under this disease here, a grievous punishment is also awaiting them there!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies Addressed to the People of Antioch, Concerning the Statutes</cite>, (387), 1.7, 11-12 in Nicene and Post-Nicene Fathers 2, 9: 333, 335.</span></figcaption>

</figure><figure class="quote" id="q-510eb4232c" data-kw="">
<blockquote><p>For the persons and duties of men may be accepted with God, when they walk and act in sincerity according to their light, though in many things, and those of no small importance, sundry irregularities are found, both in what they do, and in the manner of doing it. Where persons walk before God in their integrity, and practice nothing contrary to their light and conviction in his worship, God is merciful unto them, although they order not everything according to the rule and measure of the Word. So was it with them who came to the Passover in the days of Hezekiah: they had not cleansed themselves, but did eat the Passover otherwise than it was written, 2 Chron. 30:18; for whom the good king made the solemn prayer suited to their occasion: ‘The good Lord pardon every one that prepareth his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary; and the Lord hearkened unto Hezekiah and healed the people,’ vv. 18-20. Here was a duty for the substance of it appointed of God, but in the manner of its performance there was a failure: they did it not according to what was written, which is the sole rule of all religious duties. This God was displeased withal, yet graciously passed by the offence, and accepted them whose hearts were upright in what they did.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For the persons and duties of men may be accepted with God, when they walk and act in sincerity according to their light, though in many things, and those of no small importance, sundry irregularities are found, both in what they do, and in the manner of doing it. Where persons walk before God in their integrity, and practice nothing contrary to their light and conviction in his worship, God is merciful unto them, although they order not everything according to the rule and measure of the Word. So was it with them who came to the Passover in the days of Hezekiah: they had not cleansed themselves, but did eat the Passover otherwise than it was written, 2 Chron. 30:18; for whom the good king made the solemn prayer suited to their occasion: ‘The good Lord pardon every one that prepareth his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary; and the Lord hearkened unto Hezekiah and healed the people,’ vv. 18-20. Here was a duty for the substance of it appointed of God, but in the manner of its performance there was a failure: they did it not according to what was written, which is the sole rule of all religious duties. This God was displeased withal, yet graciously passed by the offence, and accepted them whose hearts were upright in what they did.”

— John Owen, A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms, (London: 1682), ch. 11, pp. 232-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+persons+and+duties+of+men+may+be+accepted+with+God%2C+when+they+walk+and+act+in+sincerity+according+to+their+light%2C+though+in+many+things%2C+and+those+of+no+small+importance%2C+sundry+irregularities+are+found%2C+both+in+what+they+do%2C+and+in+the+manner+of+doing+it.+Where+persons+walk+before+God+in+their+integrity%2C+and+practice+nothing+contrary+to+their+light+and+conviction+in+his+worship%2C+God+is+merciful+unto+them%2C+although+they+order+not+everything+according+to+the+rule+and+measure+of+the+Word.+So+was+it+with+them+who+came+to+the+Passover+in+the+days+of+Hezekiah%3A+they+had+not+cleansed+themselves%2C+but+did+eat+the+Passover+otherwise+than+it+was+written%2C+2+Chron.+30%3A18%3B+for+whom+the+good+king+made+the+solemn+prayer+suited+to+their+occasion%3A+%E2%80%98The+good+Lord+pardon+every+one+that+prepareth+his+heart+to+seek+the+Lord+God+of+his+fathers%2C+though+he+be+not+cleansed+according+to+the+purification+of+the+sanctuary%3B+and+the+Lord+hearkened+unto+Hezekiah+and+healed+the+people%2C%E2%80%99+vv.+18-20.+Here+was+a+duty+for+the+substance+of+it+appointed+of+God%2C+but+in+the+manner+of+its+performance+there+was+a+failure%3A+they+did+it+not+according+to+what+was+written%2C+which+is+the+sole+rule+of+all+religious+duties.+This+God+was+displeased+withal%2C+yet+graciously+passed+by+the+offence%2C+and+accepted+them+whose+hearts+were+upright+in+what+they+did.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Discourse+of+the+Work+of+the+Holy+Spirit+in+Prayer+with+a+Brief+Inquiry+into+the+Nature+and+Use+of+Mental+Prayer+and+Forms%2C+%28London%3A+1682%29%2C+ch.+11%2C+pp.+232-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F510eb4232c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perm

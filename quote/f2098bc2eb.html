<blockquote><p>Vers. 10. But chiefly them that walk after the flesh in the lust of uncleanness, and despise government, presumptuous are they, self-willed, they are not afraid to speak evil of dignities:

The sixth Note of Heretics is a luxurious and libidinous life, from which he gathers that the foresaid examples of God’s justice, justly threaten to them eternal destruction, chiefly, because they follow the flesh, or corrupt nature as their Captain, and proceed on in impurity, passing the course of their life in filthy [lusts], indulging the pleasures of the flesh.

Government] Note 7. Is the contempt of government, or lawful authority, which they would have taken out of the world, that there might be none to punish their vices. He describes and amplifies this vice with six Reasons.

Despise] Reas. 1. That it is not the naked disobedience of unlawful commands of a mistaking governor, but contempt of the Magistrate doing his duty, contempt of the very power and ordinance of God.

Presumptuous] Reas. 2. That it is presumptuousness joined with contempt.

And self] Reas. 3. That it is boldness in contempt joined with complacency in that sin.

To speak ill] Reas. 4. That it is boldness in contempt breaking forth into cursing, reproaches, evil speakings, which they cast upon Magistracy.

Vers. 11. Whereas Angels which are greater in power and might, bring not railing accusation against them before the Lord.

Reas. 5. That seeing they are vile fellows, they dare speak evil of Magistrates, which Angels that are more excellent than Magistrates, dare not speak ill of them: For although Angels are sometimes used to punish Princes, yet they always endeavour to maintain the estimation of Principalities, Magistrates, and Powers, against whom some Heretics proceed.

Vers. 12. But these, as natural brute beasts, made to be taken and destroyed, speak evil of the things that they understand not, and shall utterly perish in their own corruption,

Reas. 6. That heretics are like to brute beasts in this; For as beasts, 1. Are irrational: 2. They are driven by force, and not by counsel: 3. They being taken perish: So those Heretics who cannot bear Magistracy amongst men, or in the Church, but speak evil of this Ordinance. 1. Being void of judgement, they are ignorant of God’s Ordinance. 2. They are carried by a wicked inclination to blaspheme or to disgrace that which they do not understand. 3. As brute beasts they bring destruction to themselves, and perish by their own corruptness.

Vers. 13. And shall receive the reward of unrighteousness, as they that count it pleasure to riot in the day time: Spots they are and blemishes, sporting themselves with their own deceivings, while they feast with you:

14. Having eyes full of Adultery, and that cannot cease from sin, beguiling unstable souls, an heart they have exercised with covetous practices: cursed children:

He repeats the commination of their deserved condemnation, and adds the Eighth Note in three demonstrations of their impudence. The first is in open luxury, because in the day time, neither fearing the light of the Gospel, nor the Sun, they discover their minds to be given to luxury, delighting themselves in banquettings. The second demonstration of their impudence, in open incontinency, which they will not in the least endeavour to hide, but betray in their eyes, the adulteries of their heart, and will shew forth their impudence in their lust, and so they will not only pollute themselves, but will also deceive and ensnare their unstable souls destitute of solid and saving Faith. The third impudence consists in covetousness, the arts and methods whereof they will so meditate, and have their hearts so exercised with a vicious habit: Briefly comprehending these vices he calls those wicked men accursed.

Vers. 15. Which have forsaken the right way, and are gone astray, following the way of Balaam the Son of Bosor, who loved the wages of unrighteousness,

16. But was rebuked for his iniquity: the dumb Ass speaking with man’s voice, forbad the madness of the Prophet.

He compares the impudent covetousness of these men, to the covetousness of Balaam, whose History he briefly repeats out of Num. 22. who for the desire of reward, erred from the way, which he professed to follow, and at length gave himself to open impiety: wherein he became so stupid, that he was deservedly reprehended and chastised by his Asse; which likewise false Teachers, teaching false things, for filthy lucre sake, deserve.</p></blockquote>

<blockquote><p>Ingrossers; that hoard up commodities, and by stopping their propagation raise the price; these are thieves. Many Block-houses in the city, monopolies in the court, garners in the country, can testify, there are now such thieves abroad: we complain of a dearth; sure the heavens are too merciful to us, that are so unmerciful one to another: scarcity comes without God’s sending: who brings it then? even the Devil and his brokers, engrossing misers.

The Common-wealth may often blow her nails, unless she sit by an engrossers fire: her limbs may be faint with hunger, unless she buy graine at an engrosses price. I confess, this is a sin, which the Law takes notice of, but not in the full nature, as theft. The pick-purse (in my opinion) doth not so much hurt, as this general robber; for they rob millions.

These do not with Joseph, buy up the superfluity of plenty, to prevent a dearth; but hoard up the store of plenty, to procure a dearth. Rebels to God, trespassers to nature, thieves to the Common-wealth: if these were apprehended and punished, neither City nor Country should complain as they do. Mean time, the people’s curse is upon them, and I doubt not but God’s plague will follow it; if repentance turn it not away: till when, they are private thieves.</p></blockquote>

l">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/10/29/thomas-adams-on-the-evil-of-engrossers/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f2bd2c70c7" data-kw="">
<blockquote><p>In what continual danger are we everywhere of running into extremes! While some, blinded and hardened by sin, never bestow one serious thought about their souls, — insensible of the malady within, they despise the physician and disregard the means of recovery, — there are others who think or at least talk of nothing else but of their disorder, saying how bad they are.

Fruitless complaints, complaints of themselves and of their condition, is the sum and substance of their religion. If they can conjure up doubts respecting themselves, and form desponding complaints of their uncomfortable condition, they fancy that they have done their duty. I have myself known several who have spent a good part of their time in such spiritual gossiping, — I know not what else to call it, in going up and down from one to another with their melancholy complaints and objections. But such conduct is utterly contrary to the life of faith.

Had they spent half this time in pouring out their complaints before the Lord, or employed it in doing good to others, they would have been long ago fat and well liking, thriving daily in holiness, and comfort, life and joy. I say not but that it is good, in our soul’s concerns and spiritual difficulties, to apply to them who are furnished with the tongue of the learned, and who know how to speak a word in season to the weary: but what I say is, that for persons to fill their minds with their own complaints and objections, without endeavouring to mix with faith and practice what is spoken for their relief, and to go on still in their own slothful and obstinate way, that this is of no sort of use or advantage, but I fear of much real hurt to the soul.

And yet some, I am apt to think, may even please themselves in such a course, as if it had somewhat in it of eminency in religion. But can they think to mend their condition by wishing it were better, or by complaining that it is so bad? If they do, they will most assuredly be disappointed. None of us will think so absurdly about worldly things. In such things we readily take an industrious course. The husbandman well knows, that if he be idle and slothful in seed-time, it will be in vain to form any expectations as to the time of harvest. “The sluggard will not sow by reason of cold;” and what return hath he in harvest? He must “beg in harvest and have nothing.” Prov. xx. 4.

So it is in spiritual things. The hand of the diligent alone maketh rich. Tell me how a man employs his time, whether he is slothful or industrious, and I will tell you what progress he makes in grace; for you may as soon gather grapes of thorns or figs of thistles, as enjoy those fruits of the Spirit, — love, joy, and peace, whilst you live after the flesh, in self-indulgence, ease, and sloth.</p></blockquote>

<blockquote><p>Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.</p></blockquote>

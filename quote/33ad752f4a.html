<main class="wrap"><figure class="quote" id="q-33ad752f4a" data-kw="">
<blockquote><p>If any particular Church shall tolerate, in her bowels, errors of a heinous nature, the House of the living God becomes thereby a Den of notorious thieves and robbers; and the Church may be made up of infidels, who deny the resurrection of the dead, or of Arians, Socinians and the very worst heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-918b01b664" data-kw="">
<blockquote><p>And for the command, ‘Come out from among them and be ye separate,’ it’s pity that any Christian should need to be told that it speaks only to the Church to come out of the heathen, infidel world (such as are Jews and Mohammedans, and heathens); but there is never a word in all the Bible that bids you ‘Come out of the Church and be ye separate!’ Wonderful! that God should be so abused by misunderstanding Christians! Because He commands men to come out of the infidel world into the Church, they plead it as if He commanded them to come out of the Church into a separated sect. The Church is the House of Christ: Forsake it not, while he stays in it: Forsake it not, for He has promised never to forsake it. Particular Churches indeed he may cast off, but never the universal: Dwell therefore where He dwells.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Catholic, &amp; Catholic Church Described</cite>, … (London: A.M., 1660), pp. 205-6</span></figcaption>

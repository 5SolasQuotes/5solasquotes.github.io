<blockquote><p>Christ hath ordained the holy Communion in remembrance of himself: men do neither retain any remembrance of Christ, nor yet Communion, but have changed all the whole matter into a gay shew, and almost a stage play. Christ saith, Ye shall have the poor always with you, but me ye shall not have always, I leave the world and go to my father: It is expedient for you that I go away: and Christ spake this, not of his Godhead, wherewith he was equal to the father, or of his heavenly nature, but of his body:

Men say, that Christ neither hath with his body left the world, nor yet gone from hence to his father. Paul saith that Christ is in heaven at the right hand of the father, Peter saith in the Acts of the Apostles, Heaven must hold him until the time that all things are restored: Men say, That the body of Christ is in heaven and in earth both at once, and is dispersed into an infinite multitude of places at one time. Paul saith, yet Christ hath once entered into the holy places, &amp; hath with one only sacrifice, &amp; one oblation, made perfect all things: Men say, that they can sacrifice Christ himself again every day, not only for remembrance sake, but in very deed, and that in infinite places.

Christ saith, Thou shalt worship the Lord thy God, and him only shalt thou serve: Men worship the Eucharist, a lack the while, being neither Lord nor God, but a sacrament of the Lord, without authority of the scriptures, or example of the Apostles, and that as God. For, by the living God I beseech you, consider in your minds brethren, who ever, I will not say of the Apostles, but of the holy fathers hath either worshipped the Sacrament himself, or hath shewed it forth to be worshipped of others?

I see that I speak these things not before the common sort of men, but before them who are profoundly learned, I appeal to all your consciences, I will use in this matter your own testimony. Christ hath commanded the Sacrament to be delivered whole: Men have torn the same after a miserable manner, Christ willed that nothing should be added to his law: Men do not only add many things, but the same they prefer before the word of God. But why should I reckon up more?

This only will I speak, and that in a word, they which brought in transubstantiations, masses, calling upon saints, sole life, purgatory, images, vows, trifles, follies, babbles, into the Church of God, have delivered new things, and which the scriptures never heard of. Whatsoever they cry or crake, they bring not an iota out of the word of God.</p></blockquote>

<blockquote><p>In the case of the Eucharist, you blame us for attempting to confine the Lord of the universe, and his divine and spiritual power, (which is perfectly free and infinite,) within the corners of a corporeal nature with its circumscribed boundaries. What end, pray, will there be to calumny? We have always distinctly testified, that not only the divine power of Christ, but his essence also, is diffused over all, and defined by no limits, and yet you hesitate not to upbraid us with confining it within the corners of corporeal nature! How so? Because we are unwilling with you to chain down his body to earthly elements. But had you any regard for sincerity, assuredly you are not ignorant how great a difference there is between the two things – between removing the local presence of Christ’s body from bread, and circumscribing his spiritual power within bodily limits.

Nor ought you to charge our doctrine with novelty, since it was always held by the Church an acknowledged point. But as this subject alone would extend to a volume, in order that both of us may escape so toilsome a discussion, the better course will be for you to read Augustine’s Epistle to Dardanus, where you will find how one and the same Christ more than fills heaven and earth with the vastness of his divinity, and yet is not everywhere diffused in respect of his humanity.

We loudly proclaim the communion of flesh and blood, which is exhibited to believers in the Supper; and we distinctly show that that flesh is truly meat, and that blood truly drink — that the soul, not contented with an imaginary conception, enjoys them in very truth. That presence of Christ, by which we are ingrafted in him, we by no means exclude from the Supper, nor shroud in darkness, though we hold that there must be no local limitation, that the glorious body of Christ must not be degraded to earthly elements; that there must be no fiction of transubstantiating the bread into Christ, and afterwards worshipping it as Christ. We explain the dignity and end of this solemn rite in the loftiest terms which we can employ, and then declare how great the advantages which we derive from it.

Almost all these things are neglected by you. For, overlooking the divine beneficence which is here bestowed upon us, overlooking the legitimate use of so great a benefit, (the topics on which it were becoming most especially to dwell,) you count it enough that the people gaze stupidly at the visible sign, without any understanding of the spiritual mystery. In condemning your gross dogma of transubstantiation, and declaring that stupid adoration which detains the minds of men among the elements, and permits them not to rise to Christ, to be perverse and impious, we have not acted without the concurrence of the ancient Church, under whose shadow you endeavour in vain to hide the very vile superstitions to which you are here addicted.</p></blockquote>

<blockquote><p>[T]o symbolize with Idolaters in their acts of worship, is a thing unlawful to Christians. We know that the Masse is the greatest idol that ever was in the world; and that the act of kneeling was brought in at the Popish communion to worship that Idol: we ought not therefore to symbolize with them in that act of worship; for it is not lawful for us to follow the corruption of an Ordinance, when we have Christ’s imitable practise made known to us:

It is not lawful to mix the acts of God’s true worship, with the chief act of an Idol-worship, such as is Kneeling at the Mass; For the meaning and purpose of kneeling, is Adoration; the object of adoration is the Body and blood of Christ, supposed to be in the Elements: but if we believe no such real presence as they have fancied, then we make void the object of adoration, and consequently the act intended towards it is disannulled also.

But if any doth incline to kneeling, because it hath been a custom hitherto used; he may upon the same ground practise all other Popish idolatries and superstitions. But if you will say, that you think Christ ought to be worshipped there, and that you cannot come to his table with too much reverence; You must understand, that Christ doth not intend to be worshipped there, but to be received; and that you must not be led by your own thinking, but by the manifestation of his will in matters of worship; nor can any one gesture be accounted reverence to him more then another, otherwise then as he doth appoint it to be in his worship.

The standing at the first Passover in Egypt, was a reverence; The sitting at the table with Christ, was in his disciples a reverence to him; nay, and their suffering of him to wash their feet, as their servant, was a reverence due to him as their master, because it was his will to have it so. It is neither circumcision nor uncircumcision, but the doing of God’s will, that maketh us acceptable unto him.

Now it is contrary to his will, that we should follow another example of worship then that which his Apostles have given us: It is contrary to his will, that we in his worship should symbolize with Idolaters, and that we should seem to collude with them in their act of Idol-worship, when we know that the Lord will not be adored, but received in his Supper; and it is no reverence at all, but a very irreverent and unbeseeming behaviour, to put forth an act proper to adoration, when he doth call us to put forth an act of communion and fellowship.</p></blockquote>

<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>

<blockquote><p>Let us, then, lay weight on every effect of the Holy Ghost in any of the particulars before mentioned, on this account, that they are acts of his love and power towards us. This faith will do, that takes notice of his Kindness in all things. Frequently he performs, in sundry particulars, the office of a comforter towards us, and we are not thoroughly comforted,—we take no notice at all of what he doth. Then is he grieved. Of those who do receive and own the consolation he tenders and administers, how few are there that consider him as the Comforter, and rejoice in him as they ought! Upon every work of consolation that the believer receives, this ought his faith to resolve upon,—“This is from the Holy Ghost; he is the Comforter, the God of all consolation; I know there is no joy, peace, hope, nor comfort, but what he works, gives, and bestows; and, that he might give me this consolation, he hath willingly condescended to this office of a comforter. His love was in it, and on that account doth he continue it. Also, he is sent by the Father and Son for that end and purpose. By this means come I to be partaker of my joy,—it is in the Holy Ghost; of consolation,—he is the Comforter. What price, now, shall I set upon his love! how shall I value the mercy that I have received!” This, I say, is applicable to every particular effect of the Holy Ghost towards us; and herein have we communion and fellowship with him, as was in part discovered in our handling the particulars. Doth he shed abroad the love of God in our hearts? doth he witness unto our adoption? The soul considers his presence, ponders his love, his condescension, goodness, and kindness; is filled with reverence of him, and cares [takes care] not to grieve him, and labours to preserve his temple, his habitation, pure and holy. Again: our communion with him causeth in us returning Praise, and thanks, and honour, and glory, and blessing to him, on the account of the mercies and privileges which we receive from him; which are many. Herein consists our next direction. So do we with the Son of God on the account of our redemption: “Unto him that loved us, and washed us from our sins in his own blood, to him be glory and dominion for ever and ever,” Rev. 1:5, 6. And are not the like praises and blessings due to him by whom the work of redemption is made effectual to us? who with no less infinite love undertook our consolation than the Son our redemption. When we feel our hearts warmed with joy, supported in peace, established in our obedience, let us ascribe to him the praise that is due to him, bless his name, and rejoice in him. And this glorifying of the Holy Ghost in thanksgivings, on a Spiritual sence of his consolations, is no small part of our communion with him. Considering his free engagement in this work, his coming forth from the Father to this purpose, his mission by the Son, and condescension therein, his love and kindness, the soul of a believer is poured out in thankful praises to him, and is sweetly affected with the duty. There is no duty that leaves a more heavenly savour in the soul than this doth. Also, in our prayers to him for the carrying on the work of our consolation, which he hath undertaken, lies our communion with him. John prays for grace and peace from the seven Spirits that are before the throne, or the Holy Ghost, whose operations are perfect and complete. This part of his worship is expressly mentioned frequently in Scripture; and all others do necessarily attend it. Let the saints consider what need they stand in of these effects of the Holy Ghost before mentioned, with many such others as might be insisted on; weigh all the privileges which we are made partakers of; remember that he distributes them as he will, that he hath the sovereign disposal of them; and they will be prepared for this duty.</p></blockquote>

led+with+reverence+of+him%2C+and+cares+%5Btakes+care%5D+not+to+grieve+him%2C+and+labours+to+preserve+his+temple%2C+his+habitation%2C+pure+and+holy.+Again%3A+our+communion+with+him+causeth+in+us+returning+Praise%2C+and+thanks%2C+and+honour%2C+and+glory%2C+and+blessing+to+him%2C+on+the+account+of+the+mercies+and+privileges+which+we+receive+from+him%3B+which+are+many.+Herein+consists+our+next+direction.+So+do+we+with+the+Son+of+God+on+the+account+of+our+redemption%3A+%E2%80%9CUnto+him+that+loved+us%2C+and+washed+us+from+our+sins+in+his+own+blood%2C+to+him+be+glory+and+dominion+for+ever+and+ever%2C%E2%80%9D+Rev.+1%3A5%2C+6.+And+are+not+the+like+praises+and+blessings+due+to+him+by+whom+the+work+of+redemption+is+made+effectual+to+us%3F+who+with+no+less+infinite+love+undertook+our+consolation+than+the+Son+our+redemption.+When+we+feel+our+hearts+warmed+with+joy%2C+supported+in+peace%2C+established+in+our+obedience%2C+let+us+ascribe+to+him+the+praise+that+is+due+to+him%2C+bless+his+name%2C+and+rejoice+in+him.+And+this+glorifying+of+the+Holy+Ghost+in+thanksgivings%2C+on+a+Spiritual+sence+of+his+consolations%2C+is+no+small+part+of+our+communion+with+him.+Considering+his+free+engagement+in+this+work%2C+his+coming+forth+from+the+Father+to+this+purpose%2C+his+mission+by+the+Son%2C+and+condescension+therein%2C+his+love+and+kindness%2C+the+soul+of+a+believer+is+poured+out+in+thankful+praises+to+him%2C+and+is+sweetly+affected+with+the+duty.+There+is+no+duty+that+leaves+a+more+heavenly+savour+in+the+soul+than+this+doth.+Also%2C+in+our+prayers+to+him+for+the+carrying+on+the+work+of+our+consolation%2C+which+he+hath+undertaken%2C+lies+our+communion+with+him.+John+prays+for+grace+and+peace+from+the+seven+Spirits+that+are+before+the+throne%2C+or+the+Holy+Ghost%2C+whose+operations+are+perfect+and+complete.+This+part+of+his+worship+is+expressly+mentioned+frequently+in+Scripture%3B+and+all+others+do+necessarily+attend+it.+Let+the+saints+consider+what+need+they+stand+in+of+these+effects+of+the+Holy+Ghost+before+mentioned%2C+with+many+such+others+as+might+be+insisted+on%3B+weigh+all+the+privileges+which+we+are+made+partakers+of%3B+remember+that+he+distributes+them+as+he+will%2C+that+he+hath+the+sovereign+disposal+of+them%3B+and+they+will+be+prepared+for+this+duty.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+2+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+270%E2%80%9372.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03c0559bd9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03c0559bd9.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/11/owen-on-thanksgiving-and-our-communion-with-the-holy-spirit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>3. Again, by an antecedent will God wills all men to be saved: if, therefore, He reprobates anyone, this is by a consequent will, for He creates no one of Himself for punishment; but the consequent will is a concession for our cause; but it is not for any other cause than merit: therefore, etc.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d59742bc63" data-kw="">
<blockquote><p>But Damascene makes the emphasis on the mode of willing. For he distinguishes in God an antecedent will and a consequent will. And the antecedent will is the will with respect to that for which God makes man, and it is irrefragably of goods. The consequent will, however, is the will, not that which follows merits, but that which wills some things according to the foreknowledge of merits. The first, namely the antecedent, is called by the masters the conditional will or the will by which God wills, as far as it depends on Him. The second, however, namely the consequent, is called absolute. The difference, however, between this will and that is not according to a diversity of affection or mode of willing that is in God, but according to the reason of connoting and understanding. For as God is said to will the salvation of all, as far as it depends on Him and antecedently, there is connoted in all men an orderability to salvation, both on the part of the nature given and on the part of the grace offered. For God gave a nature according to which they could know Him and, once known, seek Him, and once sought, find Him, and once found, adhere to Him, and through this obtain salvation. He similarly offered grace, when he sent and offered his Son, whose price sufficed for the salvation of all. He also bestowed and showed the laws and mandates of salvation. He Himself is also present to all who inquire and is near to all who call upon Him. Therefore, to will antecedently to save man is to do what is ordered to salvation and not to be lacking to the one who wills to arrive. Whence, to will antecedently to save does not connote salvation, but orderability to salvation. To will, however, consequently or absolutely to save is to will to give salvation to him whom he foreknows will arrive at salvation through his help and grace, and it connotes the event of salvation. And thus it is not to be said that God wills all men to be saved. The masters agree more with this response, although both are good. According to this, therefore, it must be answered that God wills all men to be saved, as far as it depends on Him or by his antecedent will, but not by his absolute or consequent will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 46, Question 1, ‘Whether God wills all men to be saved by the will of his good-pleasure? [No]’</span></figcaption>

</figure><figure class="quote" id="q-c29931d9c8" data-kw="">
<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>2. Infidelity, that is occasioned and confirmed by prosperity in sin renders the gospel ineffectual to the salvation of men. The Word preached did not profit the Jews, not being mixed with faith in them that heard it. (Heb. 4:2)</p></blockquote>

</figure><figure class="quote" id="q-f54f4838e3" data-kw="">
<blockquote><p>In Romans 2:4, it [longsuffering] is associated with the goodness and forbearance of God, and subsumed under his goodness, as that which is despised by the impenitent who treasures up for himself wrath in the day of wrath, who does not know that the goodness of God “leadeth him to repentance” (eis metanoian se agei). The choice of the verb agein is to be noted. Since the impenitent are in view, it cannot refer to efficacious grace. Nevertheless, it is a strong verb as its use in Romans 8:14 shows: “As many as are led by the Spirit of God, these are the sons of God” (cf. Gal. 5:18). It must be understood as a constraining influence flowing from the goodness of God which is calculated to bring men to repentance. The construction in Romans 2:4 is remarkably similar to that in II Peter 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’, On 2 Pet., 3:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-21abc6618b" data-kw="">
<blockquote><p>Now he gave us that sure communion with himself, when he testified through the preaching of the gospel that he had been given to us by the Father to be ours with all his benefits [Rom. 8:32]. We are said to put on him [Rom. 13:14], to grow together into him [Eph. 4:15], that we may live because he lives. Frequently this doctrine is repeated: that the Father did not spare his only-begotten Son [cf. Rom. 8:32; John 3:15] “that whoever believes in him may not perish” [John 3:16]. But “he who believes in him” is said to have “passed out of death into life” [John 5:24]. In this sense, he calls himself “the bread of life” [John 6:35]; he who eats this bread will never die [John 6:51, 58]. He, I say, was our witness that the Heavenly Father will count as his sons all those who have received him in faith. If we desire anything more than to be reckoned among God’s sons and heirs, we have to rise above Christ. If this is our ultimate goal, how insane are we to seek outside him what we have already obtained in him, and can find in him alone? Moreover, since he is the eternal wisdom of the Father, his unchangeable truth, his firm counsel, we ought not to be afraid of what he tells us in his Word varying in the slightest from that will of the Father which we seek. Rather, he faithfully reveals to us that will as it was from the beginning and ever shall be. The practice of this doctrine ought also to flourish in our prayers. For even though faith in election prompts us to call upon God, still, when we frame our prayers, it would be preposterous to thrust this upon God or to bargain upon this condition: “O Lord, if I have been chosen, hear me.” For it is his will that we be content with his promises, and not inquire elsewhere whether he will be disposed to hear us. This prudence will free us from many traps if we know how to apply to a right use what has been rightly written; but let us not inconsiderately draw out hither and thither what ought to be kept within limits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles, vol. 1 &amp; 2, The Library of Christian Classics (Westminster John Knox Press, 2011), 3.24.5.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82e246423c" data-kw="">
<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope, but an infallible assurance of faith, founded on the blood and righteousness of Christ revealed in the Gospel; and also upon the inward evidence of those graces of the Spirit unto which promises are made, and on the testimony of the Spirit of adoption, witnessing with our spirits that we are the children of God; and, as a fruit thereof, keeping the heart both humble and holy.</p></blockquote>

</figure><figure class="quote" id="q-389fd2ec20" data-kw="">
<blockquote><p>Controversy VI: Can man be certain of his present justice or the divine grace received in Christ? Thesis: The certainty of justice or justification in Christ is not a human conjecture but an infallible confidence that excludes final and total doubt and is based both on the promise of grace, which is universal for all believers, and on the special application and infallible testimony of the Holy Spirit. [Romanist] Antithesis: No one in this life can affirm with certainty and infallibility that their sins have been forgiven without a special revelation. This is a vain confidence and a presumptuous heresy. Thesis: 1. Scripture teaches that the justified have peace (Romans 5) and are persuaded of God’s grace (Romans 8; 2 Timothy 3 and 4). 2. The testimony of the Holy Spirit in our hearts is infallible (John 16; Romans 8; Galatians 4), being the seal and guarantee with which believers are confirmed and sealed (2 Corinthians 1; Ephesians 1 and 4). 3. True faith confidently trusts and expels doubt or unease from the heart (Romans 4; James 1; Ephesians 2; Hebrews 10 and 11). 4. Through the study of external piety, as an infallible argument, we know that we have true faith (2 Peter 1; 1 John 3 and 4). 5. The promises of grace are universal for believers (John 3; Romans 10) and are conditioned on faith and repentance. Therefore, these promises apply to all who find that condition in themselves. 6. The Church Fathers teach the same. Augustine: “It is not arrogance but faith to proclaim what you have received.” Bernard: “Believe that your sins are forgiven. This is the testimony the Holy Spirit gives in our hearts, saying: ‘Your sins are forgiven.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)</cite></span></figcaption>

</figure><figure class="quote" id="q-24d61165d2" data-kw="">
<blockquote><p>The Reformers rejoiced in the assurance of salvation as a tower of strength. This Christian certitude made them irresistible in their attacks on the church of Rome and adamant in resisting the onslaughts of the enemy. They were the first to place the doctrine of assurance, which they regarded as a precious jewel, prominently in the foreground; the first also to impress upon the people the necessity of personal assurance. This was one of their most important points of departure from the church that claimed to be the only ark of safety, and yet was totally unable to engender a feeling of security in the hearts of those that sought shelter in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assurance of Faith (WM. B. Eerdmans Publishing Co., 1939), 19.</cite></span></figcaption>

</figure><figure class="quote" id="q-980d9f5504" data-kw="">
<blockquote><p>VIII. You will say, ‘How may I know that I am in a state of grace, since it is so important to discern this?’ Surely the apostle did not warn in vain that we should take care not to seem to have received the grace of God in vain (2 Cor 6:1). But they have received it in vain, who, seeming to have received it, either experience or show no power of it, or even fall away from that which they seemed to have received (Heb 12:15). Therefore you will know in this way that you are what you profess: 1. If you know through faith that you are in Christ, the fount and origin of grace (Rom 5:1 – Therefore, since we have been justified by faith, we have peace with God through our Lord Jesus Christ, 8:1 – There is therefore now no condemnation for those who are in Christ Jesus). 2. From a sense of reconciliation with God in your soul, whence also we approach the throne of grace with confidence (Rom 4:16, Luke 1:30 – you have found favor with God, Acts 7:46). 3. From the testimony of the Holy Spirit certifying the soul of it (Rom 8:16, Eph 4:30). 4. Finally from the holiness of life agreeing with the state of grace. For grace is a sanctifying grace, and is so incompatible with sin that the kingdom of grace and of sin cannot abide in the same seat, nor can anyone be at the same time under grace and under sin (Rom 6:14 – For sin will have no dominion over you, since you are not under law but under grace, v.22 – But now that you have been set free from sin and have become slaves of God, the fruit you get leads to sanctification). Jude v. 4 – ungodly people, who pervert the grace of our God into sensuality.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>
<div class="actions"><button class="copy" data-copy="“VIII. You will say, ‘How may I know that I am in a state of grace, since it is so important to discern this?’ Surely the apostle did not warn in vain that we should take care not to seem to have received the grace of God in vain (2 Cor 6:1). But they have received it in vain, who, seeming to have received it, either experience or show no power of it, or even fall away from that which they seemed to have received (Heb 12:15). Therefore you will know in this way that you are what you profess: 1. If you know through faith that you are in Christ, the fount and origin of grace (Rom 5:1 – Therefore, since we have been justified by faith, we have peace with God through our Lord Jesus Christ, 8:1 – There is therefore now no condemnation for those who are in Christ Jesus). 2. From a sense of reconciliation with God in your soul, whence also we approach the throne of grace with confidence (Rom 4:16, Luke 1:30 – you have found favor with God, Acts 7:46). 3. From the testimony of the Holy Spirit certifying the soul of it (Rom 8:16, Eph 4:30). 4. Finally from the holiness of life agreeing with the state of grace. For grace is a sanctifying grace, and is so incompatible with sin that the kingdom of grace and of sin cannot abide in the same seat, nor can anyone be at the same time under grace and under sin (Rom 6:14 – For sin will have no dominion over you, since you are not under law but under grace, v.22 – But now that you have been set free from sin and have become slaves of God, the fruit you get leads to sanctification). Jude v. 4 – ungodly people, who pervert the grace of our God into sensuality.”

— Johannes Hoornbeeck, Theological Disputation on the State of Grace (Leiden: Johann Elsevir, 1664) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+You+will+say%2C+%E2%80%98How+may+I+know+that+I+am+in+a+state+of+grace%2C+since+it+is+so+important+to+discern+this%3F%E2%80%99+Surely+the+apostle+did+not+warn+in+vain+that+we+should+take+care+not+to+seem+to+have+received+the+grace+of+God+in+vain+%282+Cor+6%3A1%29.+But+they+have+received+it+in+vain%2C+who%2C+seeming+to+have+received+it%2C+either+experience+or+show+no+power+of+it%2C+or+even+fall+away+from+that+which+they+seemed+to+have+received+%28Heb+12%3A15%29.+Therefore+you+will+know+in+this+way+that+you+are+what+you+profess%3A+1.+If+you+know+through+faith+that+you+are+in+Christ%2C+the+fount+and+origin+of+grace+%28Rom+5%3A1+%E2%80%93+Therefore%2C+since+we+have+been+justified+by+faith%2C+we+have+peace+with+God+through+our+Lord+Jesus+Christ%2C+8%3A1+%E2%80%93+There+is+therefore+now+no+condemnation+for+those+who+are+in+Christ+Jesus%29.+2.+From+a+sense+of+reconciliation+with+God+in+your+soul%2C+whence+also+we+approach+the+throne+of+grace+with+confidence+%28Rom+4%3A16%2C+Luke+1%3A30+%E2%80%93+you+have+found+favor+with+God%2C+Acts+7%3A46%29.+3.+From+the+testimony+of+the+Holy+Spirit+certifying+the+soul+of+it+%28Rom+8%3A16%2C+Eph+4%3A30%29.+4.+Finally+from+the+holiness+of+life+agreeing+with+the+state+of+grace.+For+grace+is+a+sanctifying+grace%2C+and+is+so+incompatible+with+sin+that+the+kingdom+of+grace+and+of+sin+cannot+abide+in+the+same+seat%2C+nor+can+anyone+be+at+the+same+time+under+grace+and+under+sin+%28Rom+6%3A14+%E2%80%93+For+sin+will+have+no+dominion+over+you%2C+since+you+are+not+under+law+but+under+grace%2C+v.22+%E2%80%93+But+now+that+you+have+been+set+free+from+sin+and+have+become+slaves+of+God%2C+the+fruit+you+get+leads+to+sanctification%29.+Jude+v.+4+%E2%80%93+ungodly+people%2C+who+pervert+the+grace+of+our+God+into+sensuality.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+The

<blockquote><p>I know none so liable to such a charge as myself, who yet am ready to give an account to any brother that is offended; and I believe that they ought to rebuke me personally and hear my answer, before they withdraw from me or censure me, much more so [regarding] many others for my sake.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a99c437fa" data-kw="">
<blockquote><p>Now beside the apostles, prophets and evangelists, which were not ordained to be ordinary and perpetual offices in the Church, there are but two ecclesiastical orders or degrees instituted by Christ in the New Testament, viz. elders and deacons. Excellenter Canones d•…os tantum sacros ordines appellari censent, Diaconatus scilicet &amp; Presbyterat•…, quia hos solos primitiva Ecclesia legitur habuisse, &amp; de hi•… sol•… praeceptum Apostli habe•…, says the Master of Sentences (bk. 4, distinction [??])… Moreover, 1 Tim. 3, he gives order only for bishops and deacons, but says nothing of a third order. Wherefore it is manifest that beside those two orders of elders and deacons, there is no other ecclesiastical order which has any divine institution, or necessary use in the Church. And princes should do well to apply their power and authority to the extirpation and rooting out of Popes, Cardinals, Patriarches, Primates, Archbishops, Bishops, Suffragans, Abbots, Deanes, Vice-Deans, Priors, Archdeacons, Subdeacons, Chancellours, Chantours, Subchantours, Exorcists, Monks, Hermits, Acoluths, and all the whole rabble of Popish orders, which undo the Church, and work more mischief in the earth than can be either soon seene or shortly told. But contrary wise, princes ought to establish and mantain in the Church, elders and deacons, according to the apostolical institution. Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only…. And many more of our divines, who teach that the apostle 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by governments, 1 Cor. 12:28, where the apostle says not ‘helps in governements,’ as our new English translation corruptly reads, but ‘helps, governements,’ etc. plainly putting ‘governements’ for a different order from ‘helps’ or deacons… Deacons were instituted by the apostles for collecting, receiving, keeping, and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, churches, schools, and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments. Beside which employments, the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons… And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well qualified men for those functions and offices. For the eighth head of the first book of discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominated to be in election, and that their names be publicly read to the whole Church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominated be noted with public infamy, he ought to be repelled: And that if any man know others of better qualities within the Church, then these that be nominated, they should be put in election, that the Church may have the choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), ch. 8, Digression 1, ‘Of the Vocation of Men of Ecclesiastical Order’</cite>, pp. 160-63</span></figcaption>

e+were+some+elders+who+ruled+well%2C+and+yet+labored+not+in+the+Word+and+doctrine%2C+and+those+elders+he+means+by+them+that+rule%2C+Rom.+12%3A8+and+by+governments%2C+1+Cor.+12%3A28%2C+where+the+apostle+says+not+%E2%80%98helps+in+governements%2C%E2%80%99+as+our+new+English+translation+corruptly+reads%2C+but+%E2%80%98helps%2C+governements%2C%E2%80%99+etc.+plainly+putting+%E2%80%98governements%E2%80%99+for+a+different+order+from+%E2%80%98helps%E2%80%99+or+deacons%E2%80%A6+Deacons+were+instituted+by+the+apostles+for+collecting%2C+receiving%2C+keeping%2C+and+distributing+of+ecclesiastical+goods%2C+which+were+given+and+dedicated+for+the+maintenance+of+ministers%2C+churches%2C+schools%2C+and+for+the+help+and+relief+of+the+poor%2C+the+stranger%2C+the+sick+and+the+weak%2C+also+for+furnishing+of+such+things+as+are+necessary+to+the+ministration+of+the+sacraments.+Beside+which+employments%2C+the+Scripture+has+assigned+neither+preaching%2C+nor+baptizing%2C+nor+any+other+ecclesiastical+function+to+ordinary+deacons%E2%80%A6+And+as+for+the+other+sort+of+elders%2C+together+with+deacons%2C+we+judge+the+ancient+order+of+this+Church+%5Bof+Scotland%5D%2C+to+have+been+most+convenient+for+providing+of+well+qualified+men+for+those+functions+and+offices.+For+the+eighth+head+of+the+first+book+of+discipline%2C+touching+the+election+of+elders+and+deacons%2C+ordains+that+men+of+best+knowledge+and+cleanest+life%2C+be+nominated+to+be+in+election%2C+and+that+their+names+be+publicly+read+to+the+whole+Church+by+the+minister%2C+giving+them+advertisement%2C+that+from+among+them+must+be+chosen+elders+and+deacons%3A+that+if+any+of+these+nominated+be+noted+with+public+infamy%2C+he+ought+to+be+repelled%3A+And+that+if+any+man+know+others+of+better+qualities+within+the+Church%2C+then+these+that+be+nominated%2C+they+should+be+put+in+election%2C+that+the+Church+may+have+the+choice.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+ch.+8%2C+Digression+1%2C+%E2%80%98Of+the+Voca </figure><figure class="quote" id="q-a57c628b10" data-kw="">
<blockquote><p>After he [Cartwright’s opponent] says that ‘those words cannot be extended unto all the precepts,’ first because, ‘the office of widows should be then necessary:’ But he does not consider that St. Paul ordains them not simply, but upon condition. If he [Paul] had instituted the eldership with condition, if he had ordained that office [of elder] rather for the maintenance of the persons themselves than for the service of the church, if he had left so small choice of those to this office, as to that, namely that none might be chosen but poor, none but destitute of all friends, none under the age of sixty years: then he [the opponent] had said somewhat. And even now the perpetuity of that commandment touching widows remains in that sort [as] it was given: that is upon condition.</p></blockquote>

<blockquote><p>Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.”

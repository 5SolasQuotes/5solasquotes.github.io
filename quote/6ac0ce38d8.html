</figure><figure class="quote" id="q-6ed6e06048" data-kw="">
<blockquote><p>The second thing which I observe from this word bereshith, ‘in the beginning’ (which signifies in this place the first being or moment of time) is this, That time itself is but an adjunct, or circumstance of things created, and had a beginning, and shall have an end with the mutable and moveable world. For proof of this we need seek no further but to the fifth verse, where it is said, ‘The evening and the morning were the first day,’ that is, time was produced by the Word of God, even the first day together with the things therein created; and so it follows of all the days of the first week, they are said to be made with the works created in them. And indeed in reason it must needs be so; because time is nothing else but the continuance of things created and the measure of the motions which are in the created world, a day is the measure of the sun’s course from East to West, and round about to the East again: An hour is the time in which the sun runs the four and twentieth part of his day’s motion: A week is the space of seven days, and a year the time which the sun goes his course through the twelve signs of the zodiak; and the whole time of the world consists of years, months and days. Now all these had a beginning, and have an end; yea, there was no day till light and darkness were made and distinguished; no month nor year till the sun and the moon were set in their course:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 3, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

mons%E2%80%A6+%28London%3A+Barlet%2C+1641%29%2C+Of+the+Creation+of+the+World%2C+ch.+3%2C+p.+42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6ed6e06048.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6ed6e06048.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=The%20second%20thing%20which%20I%20observe,moon%20were%20set%20in%20their%20course&amp;text=The%20second%20thing%20which%20I%20observe%20from%20this&amp;text=and%20the%20moon%20were%20set%20in%20their%20course" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-996bcdaf99" data-kw="">
<blockquote><p>Perfection is God all-sufficient and all-excellent: not having need of any thing, giving sufficience unto and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite Sea of all happiness. Perfection is increated [uncreated] glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word ’eminently,’ taken in its strict and proper sense, seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. Eminential continency, and virtual continency (that is, for one thing to be contained in another eminently, as the excellency of the creature is in the Creator: or virtually, as all things saleable are in money, Eccl. 10:9) are not the same: the first is proper to the Creator; the second is found in the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

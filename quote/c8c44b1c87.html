<main class="wrap"><figure class="quote" id="q-c8c44b1c87" data-kw="">
<blockquote><p>Secondly: neither is there any contradiction in these words, of themselves: for to know which are the canonical books may be held to be a substantial point and belonging to the faith, and yet not simply necessary to salvation: he knows little if he cannot distinguish between a simple and absolute necessity, and a necessity not absolute: as some things are absolutely necessary to salvation without the which a man cannot be saved: as Heb. 10:36… But in another sense the apostles write, Acts 15:28, “It seemed good, etc. to lay no more burden upon you than these necessary things”: yet was it not simply necessary to abstain from blood and things strangled, but convenient and profitable for that time because of offence: so to know which books are canonical, though it be not simply necessary to salvation, if a man hold the foundation: yet is it necessary, as a profitable mean for the increase of faith: and though it be not so substantial as the foundation of faith, yet is it substantial, as many necessary parts in an house are beside the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retection, or Discovery of a False Detection Containing a True Defence of Two Books, entitled, Synopsis Papismi, and Tetrastylon Papisticum</cite>, (1603), pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

ly%3A%20neither%20is%20there%20any%20contradiction%20in%20these&amp;text=parts%20in%20an%20house%20are%20beside%20the%20foundation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30a0357d09" data-kw="">
<blockquote><p>For first although there be accidents or certain adjuncts of worship, yet there is no worship to be simply called accidental, because it has in it the very essence of worship. Secondly, as the least commands of God—even to iotas and tittles—are religiously to be observed (Mat. 5:18-19), so additions which seem very small are by the same reason to be rejected. Thirdly, Moses does seal up even those laws of the place of Divine worship, of the manner, of abstinence from blood, and the like, which must needs be referred to accidental worship (if any such be), with this very caution of not adding or taking away (Deut. 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1639), book 2, ch. 13, section 21, p. 272-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-0a69afd8a0" data-kw="">
<blockquote><p>The man comes from China acknowledging God in all his ways, as Abraham left his country, Gen. 12; if he be an idolater, they should not lodge him, 2 Jn. 10; he comes not as indifferent to be married to this or this church, or to none at all, as a man sins not if he marry none at all, 1 Cor. 7, but if he be a professor that joins to no church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 1, p. 283</span></figcaption>

</figure><figure class="quote" id="q-5e2f529fc6" data-kw="">

<blockquote><p>…for as the woman is independent in regard of intrinsic power of consenting or dissenting in point of marriage, the parents’ directive power of extrinsic commanding, as the judicious [congregationalist] Prefacers say… How are [ecclesiastical] leaders and overseers [according to congregationalism,] in the same managing of censures, equal in power, and not above those whom they lead and oversee, yea, to whom they are to yield obedience, as Mr. Hooker cites to that purpose the place Heb. 13:17? Are parents equal in power who do command the virgin, whose it is to consent to the marriage?</p></blockquote>

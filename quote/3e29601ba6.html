<main class="wrap"><figure class="quote" id="q-3e29601ba6" data-kw="">
<blockquote><p>And He suffered from the Father, as one whose demerits were infinite, by reason of our demerits that were laid upon Him. And yet it was especially by that act of his subjecting Himself to those sufferings, that He merited, and on the account of which chiefly He was accounted worthy of, the glory of his exaltation. Philippians 2:8–9, “He humbled Himself, and became obedient unto death; …wherefore God hath highly exalted Him.” And we see that ’tis on this account chiefly, that He is extolled as worthy by saints and angels in the context; “Worthy,” say they, “is the Lamb that was slain.…” This shows an admirable conjunction in him of infinite dignity, and infinite condescension and love to the infinitely unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Excellency of Christ”</cite>, [1734], point 5, p. 579 in Sermons and Discourses, 1734-1738 (WJE Online, vol. 19)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-7ee8450474" data-kw="">
<blockquote><p>If any one saith, that the good works of one that is justified are in such manner the gifts of God, as that they are not also the good merits of him that is justified; or, that the said justified, by the good works which he performs through the grace of God and the merit of Jesus Christ, whose living member he is, does not truly merit increase of grace, eternal life, and the attainment of that eternal life,-if so be, however, that he depart in grace,-and also an increase of glory; let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, can. 32</span></figcaption>

</figure><figure class="quote" id="q-08406211a8" data-kw="">
<blockquote><p>There cannot be a doubt, that every thing in our works which deserves praise is owing to divine grace, and that there is not a particle of it which we can properly ascribe to ourselves. If we truly and seriously acknowledge this, not only confidence, but every idea of merit vanishes. I say we do not, like the Sophists share the praise of works between God and man, but we keep it entire and unimpaired for the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.3</span></figcaption>

</figure><figure class="quote" id="q-8f475c5af3" data-kw="">
<blockquote><p>Moreover, sure reason persuades that no one (Christ excepted), however just and holy, can merit grace de condigno for others. For there exists no pact, no promise concerning the merit of another&#x27;s salvation; and Christ alone, as head of the whole Church, had that grace by which he might merit grace and glory for all the members. … But just as it is certain that one cannot merit grace for another ex condigno, so there is no doubt that this can be done ex congruo.</p></blockquote>

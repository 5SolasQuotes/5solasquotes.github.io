<blockquote><p>This question we have handled above, [vol. 2,] part 1, bk. 3, tract 1, section 3, ch. 3, [‘Of Repudiations &amp; Divorces, by which things the Bond of Matrimony itself is Loosed’, Question 11, ‘Whether it may be allowed in marriage, or convenient, to chastise the wife with strikes?’, pp. 185-6] nor are we repeating it here.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74c3c909a4" data-kw="">
<blockquote><p>Our divines, Bucer, Calvin, Bucanus, Tilenus, Beza, Virttut [Viret?], give consenting, and in some cases correcting, not judicial, power sure, but which is great enough, a negative consent for eschewing of a schism. And the professors of Leiden, Ursinus, Pareus, Junius, give the people a vote, a consent in excommunication, and this cannot exclude women who are offended when the whole Church is offended. The times of Ambrose did witness more pride in the clergy, who began to do all without the people. Chemnitz, Daneus, the Confession of Bohemia, of Helvetia, the Synod of Middleburgh, the Synod of Tylleburgh in Nassovia, anno 1582, teach that the whole Church with consent of all did excommunicate, but the judging authority is in the eldership.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 277</span></figcaption>

</figure><figure class="quote" id="q-5230fae7e5" data-kw="">
<blockquote><p>Question 5: How is it that your ruling-elders do not give imposition of hands and bless pastors when they are ordained, and so the lesser should bless the greater? So the author of Survey. So Dr. Field. Answer: If they judicially consent to imposition of hands, it is sufficient. 2. There is no inconvenience that a ruling elder, as a part of the presbytery, bless one who is not yet a pastor, but to be ordained a pastor: For the ordainer as he is such is greater than the ordained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), p. 290</span></figcaption>

</figure><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.39.28–29</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.”

— William Ames, The Marrow of Theology, 1.39.28–29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COrdinary%20Ministers%20follow%20the%20form%20of%20the%20Church%20that%20is%20instituted%3B%20they%20are%20not%20Ecumenical%2C%20National%2C%20Provincial%2C%20or%20Diocesan%20Bishops%2C%20but%20Elders%20of%20one%20Congregation%2C%20who%20in%20the%20same%20sense%20are%20also%20called%20Bishops%20in%20the%20Scriptures.%2029.%20Those%20transcendent%20members%20of%20the%20Hierarchy%20were%20merely%20human%20creations%2C%20brought%20into%20the%20Church%20without%20any%20Divine%20precept%20or%20example.%E2%80%9D%0A%0A%E2%80%94%20William%20Ames%2C%20The%20Marrow%20of%20Theology%2C%201.39.28%E2%80%9329&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F947e6d6c05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/947e6d6c05.html">Permalink</a><a class="src" href="https://archive.org/details/marrowsacdi00ames" rel="noopener" target="_blank">Read it online · Internet Archive (1639 ed.)</a></div>
</figure><figure class="quote" id="q-0b42a848a4" data-kw="">
<blockquote><p>As for the maintenance and the continuance of the office of ruling elders, we love not unnecessary multiplication of questions, let every Church do herein what they find most convenient. The manner of our Church in these things is such as best befits the condition of the same, and such as cannot be in reason condemned; Neither is a stipend, nor continuance in the function till death, essential to the ministry of the Church, but separable from the same. The Levites of old served not at all times, but by course, and when they were 50 years old, they were wholly liberat[ed], from the burden and labor (though not from the attendance) of the Levitical service; and ministers may still upon the Church’s permission, for lawful reasons and urgent necessities, be absent a whole year, and longer too, from their particular charges. The apostles, when they were first sent through Judea, took no stipend, Mt. 10:8-9. Neither did Paul take any at Corinth, 1 Cor. 9:18. The ministers among the Waldenses work with their hands for their maintenance. The old patriarchs were priests and preachers to their families, and maintained themselves by the work of their hands, feeding of flocks, tilling the ground, etc. These things I do not mention as rules, to be followed by us, but to show, that the intermission of the exercise of the ministry, the want of maintainance and laboring with the hands, are not altogether repugnant, nor inconsistent with the nature of the vocation of the ministers of the Word, but in some cases hic &amp; nunc [here and now], may be most approveable in them: much more in ruling elders. The revenues of our Church are so small that they cannot spare stipends to ruling elders, which makes them willing to serve without stipends; and lest they should be overburdened with this their service, though they be chosen and called to be ruling elders as long as they live, at least till they merit to be deposed, yet our book of policy [Second Book of Discipline] allows them that ease of intermission and serving by course which was allowed to the Levites of old in the Temple. The double honor which the apostle commands to give unto elders that rule well, 1 Tim. 5:17, needs not to be expounded of maintenance and obedience; for by double honor we may either simply understand much honor, or by way of comparison double honor in respect of the widows, whom he had before commanded to honor, 1 Tim. 5:3, as Calvin expounds the place. Both these interpretations does Oecumenius give upon the same place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, … (Edinburgh, 1641), pt, 1, ch. 14, pp. 104-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

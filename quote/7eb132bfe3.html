<main class="wrap"><figure class="quote" id="q-7eb132bfe3" data-kw="attributes essence">
<blockquote><p>The divine attributes are the essential properties by which he makes himself known to us who are weak and those by which he is distinguished from creatures; or they are those which are attributed to him according to the measure of our conception in order to explain his nature.</p></blockquote>

</figure><figure class="quote" id="q-32ede09fa4" data-kw="atheism Psalm 14">

</figure><figure class="quote" id="q-976da217e1" data-kw="atheism speculative practical">
<blockquote><p>While we admit there are many practical atheists, we deny that there are any speculative. A speculative atheist is either direct and express or indirect and interpretative. The direct is one who shakes off all knowledge and sense of deity; but such, properly speaking, there are none, because the sense of deity can never be wholly erased from the mind of man.</p></blockquote>

<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cc923e9d4f" data-kw="">
<blockquote><p>Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), p. 108 Wolter (1913-2006) was an American, Franciscan, John Duns Scotus (d. 1308) scholar and professor of philosophy.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>Argument 8— He who, by office, is obliged to expend himself, and to give his life for the safety of the people, must be inferior to the people. So Christ says, the life is more than raiment or food, because both these give themselves to corruption for man’s life; so the beasts are inferior to man, because they die for our life, that they may sustain our life. And Caiaphas prophesied right, that it was better that one man die than the whole nation perish (John 11:50); and in nature, elements, against their particular inclination, defraud themselves of their private and particular ends, that the commonwealth of nature may stand; as heavy elements ascend, light descend, lest nature should perish by a vacuity. And the good Shepherd (John 10) gives his life for his sheep; so both Saul and David were made kings to fight the Lord’s battles, and to expose their lives to hazard for the safety of the church and people of God. But the king, by office, is obliged to expend his life for the safety of the people of God; he is obliged to fight the Lord’s battles for them; to go betwixt the flock and death, as Paul was willing to be spent for the church. It may be objected, Jesus Christ gave Himself a ransom for his church, and his life for the life of the world, and was a gift given to the world (John 3:16; 4:10) and He was a mean to save us; and so, what arguments we have before produced to prove that the king must be inferior to the people, because he is a ransom, a mean, a gift, are not conclusive, I answer: 1. Consider a mean reduplicatively, and formaliter, [formally] as a mean; and secondly, as a mean materially, that is, the thing which is a mean. 2. Consider that which is only a mean and ransom, and gift, and no more; and that which, beside that it is a mean, is of a higher nature also. So Christ formally as a mean, giving his temporal life for a time, according to the flesh, for the eternal life of all the catholic Church, to be glorified eternally—(not his blessed Godhead and glory, which, as God, He had with the Father from eternity)— in that respect Christ has the relation of a servant, ransom, gift, and some inferiority in comparison of the Church of God; and his Father’s glory, as a mean, is inferior to the end; but Christ materially, in concreto [in particular, materially]: Christ is not only a mean to save his Church, but, as God (in which consideration He was the immortal Lord of life) He was more than a mean— even the Author, Efficient and Creator of heaven and earth; and so there is no ground to say that He is inferior to the Church, but the absolute head, king— the chief of ten thousand— more in excellency and worth than ten thousand millions of possible worlds of men and angels. But such a consideration cannot befall any mortal king; because, consider the king materially as a mortal man, he must be inferior to the whole church, for he is but one, and so of less worth than the whole church; as the thumb, though the strongest of the fingers, yet it is inferior to the hand, and far more to the whole body, as any part is inferior to the whole. Consider the king reduplicative and formally as king, and by the official relation he has, he is no more than but a royal servant, an official mean tending, ex officio [from his office], to this end, to preserve the people, to ride and govern them; and a gift of God, given by virtue of his office, to rule the people of God, and so any way inferior to the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 79</span></figcaption>

om%2C+and+gift%2C+and+no+more%3B+and+that+which%2C+beside+that+it+is+a+mean%2C+is+of+a+higher+nature+also.+So+Christ+formally+as+a+mean%2C+giving+his+temporal+life+for+a+time%2C+according+to+the+flesh%2C+for+the+eternal+life+of+all+the+catholic+Church%2C+to+be+glorified+eternally%E2%80%94%28not+his+blessed+Godhead+and+glory%2C+which%2C+as+God%2C+He+had+with+the+Father+from+eternity%29%E2%80%94+in+that+respect+Christ+has+the+relation+of+a+servant%2C+ransom%2C+gift%2C+and+some+inferiority+in+comparison+of+the+Church+of+God%3B+and+his+Father%E2%80%99s+glory%2C+as+a+mean%2C+is+inferior+to+the+end%3B+but+Christ+materially%2C+in+concreto+%5Bin+particular%2C+materially%5D%3A+Christ+is+not+only+a+mean+to+save+his+Church%2C+but%2C+as+God+%28in+which+consideration+He+was+the+immortal+Lord+of+life%29+He+was+more+than+a+mean%E2%80%94+even+the+Author%2C+Efficient+and+Creator+of+heaven+and+earth%3B+and+so+there+is+no+ground+to+say+that+He+is+inferior+to+the+Church%2C+but+the+absolute+head%2C+king%E2%80%94+the+chief+of+ten+thousand%E2%80%94+more+in+excellency+and+worth+than+ten+thousand+millions+of+possible+worlds+of+men+and+angels.+But+such+a+consideration+cannot+befall+any+mortal+king%3B+because%2C+consider+the+king+materially+as+a+mortal+man%2C+he+must+be+inferior+to+the+whole+church%2C+for+he+is+but+one%2C+and+so+of+less+worth+than+the+whole+church%3B+as+the+thumb%2C+though+the+strongest+of+the+fingers%2C+yet+it+is+inferior+to+the+hand%2C+and+far+more+to+the+whole+body%2C+as+any+part+is+inferior+to+the+whole.+Consider+the+king+reduplicative+and+formally+as+king%2C+and+by+the+official+relation+he+has%2C+he+is+no+more+than+but+a+royal+servant%2C+an+official+mean+tending%2C+ex+officio+%5Bfrom+his+office%5D%2C+to+this+end%2C+to+preserve+the+people%2C+to+ride+and+govern+them%3B+and+a+gift+of+God%2C+given+by+virtue+of+his+office%2C+to+rule+the+people+of+God%2C+and+so+any+way+inferior+to+the+people.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle% <blockquote><p>Human acts are the acts of the will directed by reason. They are either elicited, that is, produced by the will itself, or commanded, that is, produced by some other faculty under the influence of the will. Elicited acts are concerned either with the end or with the means. Three acts are concerned with the end: a) simple velleity, not yet efficacious; b) efficacious intention of the end; c) joy in the end attained. Two acts are concerned with means: a) consent, which accepts means; b) choice of a determined set of means. Each of these five acts of the will is preceded by a directive act of the intellect. Simple velleity, by the knowledge of the good in question; intention, by a judgment that this end should be attained; consent, by counsel; choice, by the last practical judgment which terminates deliberation. After voluntary choice there follows, in the intellect, the act called imperium, which directs the execution of the means chosen, ascending from lower means to those higher and nearer to the end to be obtained, in order inverse to that of intention, which descends from the desired end to the means which come first in execution. After the intellect’s imperium there follows in the will the act called active use, which sets the other faculties to work. These acts of the other faculties, called passive use, are, properly speaking, commanded acts of the will. And the will’s last act is that of joy in the possession of the end obtained. The end, which was first in the order of intention, is the last in the order of execution. … By the term ‘interior’ act St. Thomas often means an act which does not arise from a previous act, the first act, for example, of willing an end. By opposition, then, ‘exterior act’ often means not only the act of the corporeal members, but also an act of the will itself, if this act arises from a preceding act, as when, for example, we will the means because we already will the end. Here we must remark, further, that a human act, voluntary and free, is not necessarily preceded, if we speak precisely, by a discursive deliberation, but may be the fruit of a special inspiration, superior to human deliberation. But, even here, the act is free… because the will consents to follow the inspiration. Here lies the difference between the virtue of prudence, which presupposes discursive deliberation, and the gifts which make man prompt and docile to the inspirations of the Holy Ghost. These latter acts, free but not in the proper sense deliberate [deliberative], are the fruit, as we shall see later, not of co-operating grace, but of operating grace.</p></blockquote>

<blockquote><p>…God is to be worshipped every where… so more solemnly in the public assemblies, which are not carelessly or willfully to be neglected or forsaken, when God, by his word or providence, calleth thereunto.[i] [i] Isa. 56:6,7. Heb. 10:25. Prov. 1:20,21,24. Prov. 8:34. Acts 13:42. Luke 4:16. Acts 2:42.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b3469d8b8" data-kw="">
<blockquote><p>Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid.

2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20.

3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid.

4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644) Rathband was a Westminster divine., pp. 31-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-f3f8d866d3" data-kw="">
<blockquote><p>Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans</cite>, … (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5265bb184b" data-kw="">
<blockquote><p>3rd Conclusion. A visible profession of the truth and doctrine of godliness is that which essentially constitutes a visible church, and every member of the visible church; Only our [Independent] Brethren and we differ much about the nature of this profession which is required in members added to the Church. Our Brethren will have none members of the visible Church, but such as are satisfactory to the consciences of all the visible church, and give evidences so clear, as the judgement of discerning men can attain unto, that they are truly regenerated. We again do teach that the scandalously wicked are to be cast out of the Church by excommunication, and these of approved piety are undoubtedly members of the visible Church, so these of the middle sort are to be acknowledged members of the Church, though the Church have not a positive certainty of the judgement of charity that they are regenerated, so they be known: 1. to be baptized, 2. that they be free of gross scandals, 3. and profess that they be willing hearers of the doctrine of the Gospel. Such a profession as gives evidences to the positive certainty of the judgment of charity, of sound conversion, is not required to make and constitute a true, visible-Church.</p></blockquote>

<blockquote><p>John Baptist and the apostles, Acts 8; Jn. 3, after a confession never asked for their conversion, but baptized, for straightway without delay, even in the night (for so the Word notes, Mt. 21:19; Luke 4:39 &amp; 5:25 &amp; 8:44) the jailor and his house, Acts 16, Cornelius and his house, Acts 10, the eunuch, the multitude of John Baptist’s hearers were baptized members of the universal Church, 1 Cor. 12:12-13, where there was no particular congregation to receive and admit them as members, as Mr. Richard Baxter solidly observes. Nor is it worthy the refuting that the apostles, by an extraordinary power, might baptize them, though to no certain church, but pastors now have not that power: for the apostles baptizing and preaching, and administering the other seal differ not. The apostles preached and baptized in all places as ordinary officers by the same command, Mt. 28:19, by which we teach and baptize in species and nature, from the ordinary pastoral acts of an ordinary minister; they speak with tongues, [and] work miracles as apostles, but they preach and baptize hic &amp; nunc as ordinary officers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658) | bk. 3, ch. 2, ‘Of the First Subject of the Power of the Keys’, p. 293</span></figcaption>

<div class="actions"><button class="copy" data-copy="“John Baptist and the apostles, Acts 8; Jn. 3, after a confession never asked for their conversion, but baptized, for straightway without delay, even in the night (for so the Word notes, Mt. 21:19; Luke 4:39 &amp; 5:25 &amp; 8:44) the jailor and his house, Acts 16, Cornelius and his house, Acts 10, the eunuch, the multitude of John Baptist’s hearers were baptized members of the universal Church, 1 Cor. 12:12-13, where there was no particular congregation to receive and admit them as members, as Mr. Richard Baxter solidly observes. Nor is it worthy the refuting that the apostles, by an extraordinary power, might baptize them, though to no certain church, but pastors now have not that power: for the apostles baptizing and preaching, and administering the other seal differ not. The apostles preached and baptized in all places as ordinary officers by the same command, Mt. 28:19, by which we teach and baptize in species and nature, from the ordinary pastoral acts of an ordinary minister; they speak with tongues, [and] work miracles as apostles, but they preach and baptize hic &amp; nunc as ordinary officers.”

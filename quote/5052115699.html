<blockquote><p>It is therefore a great practical doctrine—that Jesus is not simply a Redeemer from sin, but the Founder and Head of a Kingdom. He has not only taught men a system of opinions concerning God, but instituted also, and rules over, a community. He hath given not simply a precept to be obeyed—a rule for the government of life—an opinion to be held by each individual separately—the body of his followers, like those of Socrates or Plato, combining merely by accidental agreement in opinion: far beyond all this.

He hath constructed a Society; his followers are made members of a community with new social relations. To believe in Jesus is not merely the adoption of an opinion. The very act of faith whereby his followers receive his doctrine, unites them also to Him as members of his mystical body, and through Him to one another. They become a combination of men who are members of one spiritual body—brethren of one holy family. And this is the Kingdom of Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855</cite>, (New York: Edward O. Jenkins, 1855), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>HEAVEN is the Lot of the Righteous; where the absence of all Evil, an unspeakable fulness of Blessings, both for Body and Soul, and a perfect fruition of GOD, shall make up our Happiness. JESUS CHRIST, the Bridegroom, will there give Consummation to our Joys.

NO more Temptations, no more Sins, no more Sufferings, no more Fears; But Light in the Mind, Comforts in the Heart, Peace in the Conscience, a perfect Union of the Faithful in giving Eternal Thanks to God, in the enjoyment of Felicity that shall have no end.

What ought not we to do; what Miseries should not we be content to suffer, to secure the hope of this Glory God has promised to us? What Terror ought to seize us, when we reflect upon our Sins, which (if not repented of) will deprive us of it for ever?</p></blockquote>

</figure><figure class="quote" id="q-233498c302" data-kw="">
<blockquote><p>We must not say that the heavenly Jerusalem, which is the mother of all the faithful, consists only of those who belong to the new covenant, who believed in the gospel of the kingdom of God after the coming of Christ the Savior and who believe nowadays.

All those who were chosen in the Old Testament are also included, whether they lived under the law or before it was given. The earthly Jerusalem with its system of government began to be the mother of the physical people of God in the time of David, but that is no reason why its heavenly equivalent should be reduced to those dimensions and interpreted as having begun only with the New Testament.

Far from it! The church of the firstborn and elect is universal. It consists of all the children of God who were chosen from the foundation of the world, and is their mother. Paul includes all these people when he says, “who is the mother of us all,” and speaks of himself as being one of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 162-63.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-7cd6b5913e" data-kw="">
<blockquote><p>There is a Community of Glory betwixt Christ and Us: The Heaven that the Mediator Christ Enjoys, is our Heaven; Our Heaven is to the Man Christ in a Conquest: Heaven was bought with Blood to Him and Us, and to make you Rejoice: None of GOD‘s Children gets a Heaven properly of their own; Why? We got a share and part of Christ‘s Inheritance, He is the Principal Heir, Romans 8.

We are the Conjunct-heirs: Sweet is that Word which He speaks to his Children, Luke 22. 29. And I appoint unto You a Kingdom, as My Father hath appointed unto Me, that ye may Eat and Drink at My Table in My Kingdom, Sitting on Thrones, Judging the Twelve Tribes of Israel. The Meaning is, My Father hath made a Disposition to Me of the Kingdom of GOD, it is Mine and My Dear Children. I will think Heaven uncouth if ye be not with Me. Here I make a Disposition and Resignation of that Kingdom to you; Ye shall Sit at my Table in My Kingdom: Up your Heart, howbeit ye be not Lords in Earth, ye shall be Lords in Heaven; I and Ye shall part Kingdoms and Thrones together.

Secondly, Rejoice in this ye that are in Christ and see your Condition, ye and Christ are Halfers together of Heaven and Glory, O if GOD‘s Children be in a Sweet Case as long as Christ is in Heaven and keeps the Inheritance, as long shall we keep our Right; And who can cause him Flit? The Devil hath made these Enemies of the Grace of GOD to Misken all our communion with Christ, they have put Christ and the Elect together, as a Man in an Inns for a Night, and to go away to Morrow; They have yoked Christ and us together, as if He were one and we another; as if He were His own, and We were our own; as if Christ had no Law and Right to Us, and We had no Law and Right to Christ, but met at a Venture, and sundered at a Venture; as if We had one heaven, and He had another; As if he had his Portion by himself alone, and that he keeps for ever; and that We had our Share be our alone too, to Sell when We pleased.

Sells if we Dispone Heaven, We Dispone not Christ‘s Heaven. In the Fighting he fights all the Battles his alone, We but look on: But when it comes to the Dividing of the Spoil, We get a Rich Share of the Spoil, Yet he gave the Whole Sum for the Inheritance, and We Nothing; yet we are set at his Elbow in a Throne with him, Now seeing our Right is also Good, slip not from them: Do not as some Unworthy Heir, who having a Good Right slips from it for a feckless composition after Drink, quits all, howbeit he should Beg: Indeed the Wicked does this.

The Devil drinks them Blankfull, and fills them with Worldly Pleasures, and gars them Subscribe a Resignation, and gives them an unworthy composition, some present Pleasure. Compone not with the Devil to go to the Law with him, let Christ be your Advocate, Subscribe not a Submission with the Devil, come never in Trysting Terms with him hold you aback from the World, and the Lusts of it, it is the Devil’s Arles that he gives to Silly Drunken Heirs, when they cry Hills and Mountains fall on us: They would fain give back the Arles and Rew, but it is out of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ and the doves’ heavenly salutations, with their pleasant conference together: or A sermon before the communion in Anwoth. Anno 1630. By that flour of the Church, Mr. Samuel Rutherford</cite>, (n.p., [1660]), pp 21-22.</span></figcaption>

— Samuel Rutherford, Christ and the doves’ heavenly salutations, with their pleasant conference together: or A sermon before the communion in Anwoth. Anno 1630. By that flour of the Church, Mr. Samuel Rutherford, (n.p., [1660]), pp 21-22.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+Community+of+Glory+betwixt+Christ+and+Us%3A+The+Heaven+that+the+Mediator+Christ+Enjoys%2C+is+our+Heaven%3B+Our+Heaven+is+to+the+Man+Christ+in+a+Conquest%3A+Heaven+was+bought+with+Blood+to+Him+and+Us%2C+and+to+make+you+Rejoice%3A+None+of+GOD%E2%80%98s+Children+gets+a+Heaven+properly+of+their+own%3B+Why%3F+We+got+a+share+and+part+of+Christ%E2%80%98s+Inheritance%2C+He+is+the+Principal+Heir%2C+Romans+8.%0A%0AWe+are+the+Conjunct-heirs%3A+Sweet+is+that+Word+which+He+speaks+to+his+Children%2C+Luke+22.+29.+And+I+appoint+unto+You+a+Kingdom%2C+as+My+Father+hath+appointed+unto+Me%2C+that+ye+may+Eat+and+Drink+at+My+Table+in+My+Kingdom%2C+Sitting+on+Thrones%2C+Judging+the+Twelve+Tribes+of+Israel.+The+Meaning+is%2C+My+Father+hath+made+a+Disposition+to+Me+of+the+Kingdom+of+GOD%2C+it+is+Mine+and+My+Dear+Children.+I+will+think+Heaven+uncouth+if+ye+be+not+with+Me.+Here+I+make+a+Disposition+and+Resignation+of+that+Kingdom+to+you%3B+Ye+shall+Sit+at+my+Table+in+My+Kingdom%3A+Up+your+Heart%2C+howbeit+ye+be+not+Lords+in+Earth%2C+ye+shall+be+Lords+in+Heaven%3B+I+and+Ye+shall+part+Kingdoms+and+Thrones+together.%0A%0ASecondly%2C+Rejoice+in+this+ye+that+are+in+Christ+and+see+your+Condition%2C+ye+and+Christ+are+Halfers+together+of+Heaven+and+Glory%2C+O+if+GOD%E2%80%98s+Children+be+in+a+Sweet+Case+as+long+as+Christ+is+in+Heaven+and+keeps+the+Inheritance%2C+as+long+shall+we+keep+our+Right%3B+And+who+can+cause+him+Flit%3F+The+Devil+hath+made+these+Enemies+of+the+Grace+of+GOD+to+Misken+all+our+communion+with+Christ%2C+they+have+put+Christ+and+the+Elect+together%2C+as+a+Man+in+an+Inns+for+a+Night%2C+and+to+go+away+to+Morrow%3B+They+have+yoked+Christ+and+us+together%2C+as+if+He+

<main class="wrap"><figure class="quote" id="q-15c3beb357" data-kw="">
<blockquote><p>…although the testimony of the Spirit cannot be granted in us without the use of means (i.e., the desire of holiness), it does not follow that it is doubtful and uncertain because even these means are promised to us by God and procured for us by the Spirit.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05b741b71d" data-kw="">
<blockquote><p>Concerning this preservation of the elect to salvation and the true perseverance of faith in the faithful, they can be certain according to the measure of faith, which they believe makes them true and enduring members of the Church, having forgiveness of sins and eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, pp. 142-45, 171-75 Latin | CXXXIX. From the doctrine of these British theologians, whose views influenced the drafting of the Canons of the Synod of Dort and whose judgment was included in the Synod’s Acts, one can infer how justified the learned man is who critiques my theses for presenting the Synod’s words as if it had determined that the assurance believers have of their grace and personal salvation is of the same nature, firmness, and necessity as the divine faith with which we assent to the immediately revealed articles of faith. The learned man draws this conclusion from the words found in the fifth chapter on doctrine, article nine, which states:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>

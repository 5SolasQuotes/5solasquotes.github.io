<main class="wrap"><figure class="quote" id="q-31538388e4" data-kw="">
<blockquote><p>If it [psalm singing] be an ordinary part of worship, why perform they it not, but quarrel with us, who… do content ourselves with joint harmonious singing of the Psalms of holy scripture, to the instruction and comfort of our hearts, and praise of our God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Holy Scriptures, Worship, and Ministry used in the Christian Churches separated from Antichrist, Against the Challenges, cavils and contradiction of Mr. Smyth in his book entitled, The Differences of the Churches of the Separation… (Amsterdam, 1609)</cite>, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2feedc2893" data-kw="">
<blockquote><p>Mr. Flavel after this, returned to Dartmouth, where with his family and dear people he blessed God for his mercies towards him. He was in a little time after confined close prisoner to his house, where many of his dear flock stole in over night, or betimes on the Lord’s Day in the morning, to enjoy the benefit of his labors, and spend the sabbath in hearing, praying, singing of psalms, and holy discourses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God | Life of Flavel, p. ix</cite>, vol. 1</span></figcaption>

</figure><figure class="quote" id="q-653b7211b4" data-kw="">
<blockquote><p>It is storied of Caius Marius Victorius, who lived about three hundred years after Christ, and to his old age continued a Pagan; but at last being convinced of the Christian verity, he came to Simplicianus, and told him he would be a Christian; but neither he nor the church could believe it, it being so rare an example for any to be converted at his age; but at last seeing it was real, there was a shouting and gladness, and singing of psalms in all churches; the people crying, Caius Marius Victorius. is become a Christian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 5, ‘Husbandry Spiritualized’, p. 120</span></figcaption>

</figure><figure class="quote" id="q-8850c67c9d" data-kw="">
<blockquote><p>As Calvin and the church in Geneva sang the Apostle’s Creed and yet did not sing man-made hymns (multitudes of which were current in that era, being widely sung by the Lutherans), it is evident that they considered the Creed to be a different element of worship than singing praise to God. Calvin was very familiar, as his writings show, with creeds and the nature of them. Calvin in Geneva evidently thought that it was permissible to sing one’s confession of their faith before God in public worship and yet not to sing man-made praise to God (the two being different). This distinction is confirmed to have been well understood in that general era in that the Synod of Dort (1618), while approving of singing the Creed for the Dutch Church (whose worship practice was very similar to that of Geneva’s), yet condemned singing man-made hymns:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Origin of Reformed Psalmody’ in Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, pp. 179-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-87cc47f55f" data-kw="">

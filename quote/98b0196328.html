<main class="wrap"><figure class="quote" id="q-98b0196328" data-kw="">
<blockquote><p>Calvin, like Luther and Zwingli, taught the perpetual virginity of Mary. The early Reformers even applied, though with some reticence, the title Theotokos [God-bearer] to Mary… Calvin called on his followers to venerate and praise her as the teacher who instructs them in her Son’s commands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-ross-mackenzie.html">J. A. Ross MacKenzie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mary’s Place in Christian Dialogue (ed. Alberic Stacpoole)</cite>, (Wilton, Connecticut: Morehouse-Barlow, 1983), pp. 35-36 (on John Calvin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“Calvin, like Luther and Zwingli, taught the perpetual virginity of Mary. The early Reformers even applied, though with some reticence, the title Theotokos [God-bearer] to Mary… Calvin called on his followers to venerate and praise her as the teacher who instructs them in her Son’s commands.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0741ab16be" data-kw="">
<blockquote><p>Objection [arguing for Purgatory]: ‘Verily I say unto thee, thou shalt not come out thence, till thou hast paid the utmost farthing.’ Answer: In the first of St. Matthew it is said that Joseph knew not his wife, till she had brought forth her firstborn son. Augustine expounds that place by the raven that Noah did send forth: and saith that the raven did never return again: even so Joseph never knew the virgin Mary, for she is a virgin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Staff of Christian Faith</cite>, … (d. 1567; 1577), ‘Of Purgatory’, p. 150</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-81ce495dfe" data-kw="">
<blockquote><p>Though Christ in regard of his divine nature, and by virtue of his eternal generation be the only begotten Son of his Father; and in regard of his humane nature, by reason of the perpetual virginity of his mother, her only begotten Son; yet may He well be said to have brethren, and that in two especial respects:

1. Because the Son of God and Son of men are of one, even of one and the same nature: Therefore He is not ashamed to call them brethren, Heb. 2:11.

2. Because He has adopted them to be Sons of his Father; For we children of men are said to have the adoption of children by Jesus Christ, Eph. 1:5. In this respect Christ stiles his disciples whom He had adopted, ‘brethren’, Mt. 28:10. For He Himself renders this reason of calling them brethren, ‘My Father is their Father’, Jn. 20:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary on the Whole Epistle to the Hebrews</cite>, … (London, 1655), §. 67. ‘Of Christ the first-begotten’, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

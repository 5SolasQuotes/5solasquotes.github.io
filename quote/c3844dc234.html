<main class="wrap"><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843) | question 17, p. 72 lt col top</span></figcaption>

<blockquote><p>7. We take it that the 15th Proposition contains the true mean between the usurped power of some pastors to bind the people, by a known erring sentence, to go against God’s Word; and the usurped power which many pretend to, of ruling the Church by their major vote. But how far the congregation should first have cognisance of the matter, or be heard in the debate; or how far the ministers must endeavor their consent, or suspend their own actions for want of their consent, we do not determine. And therefore all moderate presbyterians and Independents may well agree with us in this; because it’s no power that we deny the pastors, but a power of binding men to go against God’s Word; and it is not any of their liberty that we deny the people, but only ruling ministerial authority, which God never gave them, we must needs deny them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | An Explication of Some Passages in the Propositions, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-c39a02a1ae" data-kw="">
<blockquote><p>2. Public peace in all the commandments of superiors, in so far as can be without sin, obliges the conscience, as Heb. 12:14, ‘Follow peace with all men and godliness;’ Ps. 34:14, ‘Seek peace and follow after it;’ Rom. 12:18. 3. Subjection to the censures of rulers by suffering patiently is an obligation lying upon all private persons, 1 Pet. 2:20, ‘But if when ye do well and suffer for it, ye take it patiently, this is acceptable to God;’ Rom. 13:2, ‘Whosoever therefore resisteth the power, resisteth the ordinance of God.’ 4. Nothing in non-obeying unwarrantable commandments must be done that redounds to the discredit of the ruler or the hurting of his majesty and honor, 1 Pet. 2:17, ‘Honor the king;’ Eccl. 10:20, ‘Curse not the king: for even when we deny subjection or obedience-objective to that which they command, yet owe we obedience official, and all due respect and reverence to the person and eminent place of the ruler, as Acts 7:2, Steven calls them, Men, brethren and fathers, Acts. 7:51, and yet ‘stiffnecked resisters of the Holy Ghost.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, Ch. 2, Question 2, ‘Whether Human Laws Bind the Conscience or Not?’ in The Divine Right of Church Government… (1646), pp. 201-219</span></figcaption>

<blockquote><p>…about a law there are these affections (if I may call them so): There is an interpretation, a dispensation, or relaxation; and these differ from an abrogation. For the former do suppose the law still standing in force, though mitigated; but Abrogation is then properly, when a Law is totally taken away. And this abrogation arises sometimes from the express constitution at first, which did limit and prescribe the time of the law’s continuance: sometimes by an express revoking and repealing of it by that authority which made it, sometimes by adding to that repeal an express law commanding the contrary. Now it may be easily proved that the Ceremonial and Judicial laws, they are abrogated by express repeal. The Judicial Law: 1 Pet. 2:13, where they are commanded to be subject to every ordination of man: and this was long foretold Gen. 49:10. The Lawgiver shall be taken from Judah. The Ceremonial Law that is also expressly repealed Acts 15 and in other places… In the second place, if we would speak exactly and properly, we cannot say, in any good sense, that the Moral Law is abrogated at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), pp. 211-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

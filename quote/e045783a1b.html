<blockquote><p>18. Wrath signifies in God the just will to avenge an injury done or thought to Himself or his Church, Jn. 3:36; Rom. 1:18; 2:5.

19. It is attributed to Him not except as an anthropopathism to Himself; it denotes merely an effect, not an affection. … 24. Hatred also is in no way in God as a passion [or as something suffered], but rather this signifies three things: 1. a negation, or subtraction of the grace and benevolence of Himself by which He is compassionate on others and loves them unto eternal life; 2. the detestation of the hateful thing; 3. the decree to punish, and its execution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tilenus.html">Daniel Tilenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Ordered Arrangement of Theological Disputations held in the Academy of Sedan</cite>, vol. 1 (1607), p. 119-20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9997402f31" data-kw="">
<blockquote><p>The properties of God are either absolute or relative. The absolute properties of God are such as may be considered without the supposition of any thing else whatever, towards which their energy and efficacy should be exerted. His relative are such as, in their egress and exercise, respect some things in the creatures, though they naturally and eternally reside in God. Of the first sort is God’s immensity ; it is an absolute property of his nature and being. For God to be immense, infinite, unbounded, unlimited, is as necessary to him as to be God ; that is, it is of his essential perfection so to be. The ubiquity of God, or his presence to all things and persons, is a relative property of God ; for to say that God is present in and to all things supposes those things to be. Indeed, the ubiquity of God is the habitude of his immensity to the creation. Supposing the creatures, the world that is, God is by reason of his immensity indistant to them all;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, ch. 2, ‘Of the Nature of God’, p. 93 in Works, vol. 12</span></figcaption>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a540be4c48" data-kw="">
<blockquote><p>The second part of the division, however, that between ‘proper’ and ‘figurative,’ is the point of distinction between the affections and all of the attributes discussed previously [life, intellect, will, righteousness, truth, pwer, glory, etc.]. For the affections of the divine will or, as they are sometimes called, divine virtues, are attributed to God, not properly, but figuratively… The affections are, therefore, either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. … …the [reformed] orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions… …This, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept… A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.433 433. [William] Ames, Marrow, I.iv.63… the point of the theological argument is that God act[s] but is not acted upon. The Reformed orthodox understanding of God, in accord with the greater part of the Christian tradition, assumes the divine immutability, and, typically, denies change and, certainly, acquired qualities to God. … The divine affections… are divine perfections that have some analogy to the dispositions or habits of the human will.</p></blockquote>

</figure><figure class="quote" id="q-5f2f93fce0" data-kw="">
<blockquote><p>We must needs assert that in God there is love: because love is the first movement of the will and of every appetitive faculty. For since the acts of the will and of every appetitive faculty tend towards good and evil, as to their proper objects: and since good is essentially and especially the object of the will and the appetite, whereas evil is only the object secondarily and indirectly, as opposed to good; it follows that the acts of the will and appetite that regard good must naturally be prior to those that regard evil; thus, for instance, joy is prior to sorrow, love to hate: because what exists of itself is always prior to that which exists through another. Again, the more universal is naturally prior to what is less so. Hence the intellect is first directed to universal truth; and in the second place to particular and special truths. Now there are certain acts of the will and appetite that regard good under some special condition, as joy and delight regard good present and possessed; whereas desire and hope regard good not as yet possessed. Love, however, regards good universally, whether possessed or not. Hence love is naturally the first act of the will and appetite; for which reason all the other appetite movements presuppose love, as their root and origin. For nobody desires anything nor rejoices in anything, except as a good that is loved: nor is anything an object of hate except as opposed to the object of love. Similarly, it is clear that sorrow, and other things like to it, must be referred to love as to their first principle. Hence, in whomsoever there is will and appetite, there must also be love: since if the first is wanting, all that follows is also wanting. Now it has been shown that will is in God (Q[19], A[1]), and hence we must attribute love to Him.</p></blockquote>

<blockquote><p>Now, these relations which refer to God’s effects cannot possibly exist in Him really. [2] For they cannot exist in Him as accidents in a subject, since there is no accident in Him… Neither can they be God’s very substance… so that God’s substance would then have to be referred to something else. But that which is essentially referred to another depends upon it in a certain way, since it can neither be nor be understood without it. Hence, it would follow that God’s substance would depend on something else extrinsic to it, so that He would not be, of Himself, the necessary being… Therefore, such relations do not really exist in God. Furthermore, we observe that whatever receives something anew must be changed, either essentially or accidentally. Now, certain relations are predicated of God anew; for example, that He is Lord or Governor of this thing which begins to exist anew. Hence, if a relation were predicated of God as really existing in Him, it would follow that something accrues to God anew, and thus that He is changed either essentially or accidentally;</p></blockquote>

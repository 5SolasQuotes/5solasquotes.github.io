<main class="wrap"><figure class="quote" id="q-2df6303391" data-kw="">
<blockquote><p>The systems for mechanization of brain function that were introduced by Descartes, Leibniz, Spinoza and Willis in the 17th century have served well for the design and development of the measurement systems and tools providing new data, but the machine metaphors of computation, representation, and information processing are incompatible with these data… The philosophical system that most clearly and unequivocally conforms to this experimental finding is that of Thomas Aquinas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-j-freeman-iii.html">Walter J. Freeman III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Nonlinear Brain Dynamics &amp; Intention According to Aquinas’ in Mind &amp; Matter</cite>, 6(2) (2009), pp. 207-34, p. 232</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In Sententiarum 2.8.1.1.2 (d. 1274; Quaracchi 1:153)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-2c44db3fe2" data-kw="">
<blockquote><p>And this distinction [between actuality and potentiality] is metaphysical, not scientific (in the modern sense of “scientific’”). That is to say, it is a description of reality that is more general and basic than any scientific theory, resting as it does on facts (about change) that science itself takes for granted. Hence it is valid whatever the empirical scientific facts turn out to be; and (to repeat what was said earlier) while that doesn’t mean that it cannot be subjected to rational evaluation or criticism, such criticism can only come from some alternative metaphysical theory, not from empirical science… Aristotelian metaphysical ideas are, as I keep saying and as will be established by the end of the next chapter, unavoidable, whether the early modern philosophers thought so or not… the distinction I am making, between metaphysical ideas and scientific ones, is just an obvious one to make. As noted before, empirical science must take many things for granted, such as the existence of patterns of cause and effect. Thus, while it might be able to establish whether some particular causal relationship exists, it cannot possibly establish whether causation as such is real or not, given that its method presupposes its existence. Nor, at the most general level and for the same reasons, can it tell us what causation per se is or what kinds of causation exist. And so on for notions like actuality, potentiality, substance, attribute, form, and so on. Empirical science of its very nature cannot give us the full story about these matters; but metaphysics just is the rational investigation of them. Hence metaphysics is obviously different from empirical science.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (St. Augustine’s Press, 2008), ch. 5, pp. 172-73</span></figcaption>

</figure><figure class="quote" id="q-c0b13f9fa1" data-kw="">
<blockquote><p>This paper highlights a set of objections on natural theology addressed by Descartes and Voetius to each other. It shows and expands the common ground Descartes and Voetius held within natural theology. It argues that their contrasting views revolved mainly around the limits of natural theology. For Voetius, natural theology is extrinsically limited by the revealed God, the external principle of faith. For Descartes, metaphysics or natural theology is intrinsically limited by the incomprehensible idea of the Infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vadana-mihai-dragos.html">Vadana Mihai-Dragos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Voetius on the Innate Knowledge of God &amp; the Limits of Natural Theology’ in Annals of the University of Bucharest, Philosophy Series</cite>, vol. LXV, no. 2 (2016), pp. 37-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

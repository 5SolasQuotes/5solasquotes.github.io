<blockquote><p>…we kneel in prayer freely, not because we are obliged to do so by any command.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

%20of%20these%20practices%20under%20an%20obligation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-37f7de4951" data-kw="">
<blockquote><p>Fourthly a confusion of gestures lawful, and unlawful is brought into the Lord’s table, some sitting like guests at a feast, as Christ, and his apostles sat, others like supplicants kneeling, and adoring upon their knees. This confusion is not like that variety of gesture in time of prayer, when some sit, some stand, some kneel. For all the three gestures are there indifferent. But not so here; this confusion of gestures at the Lord’s table now is permitted only for a snare to bring thy feet within the grin. For when all are brought in, then will the formalists cry out, ‘Confusion of gestures is intolerable, uniformity and conformity is necessary,’ as Doctor Sparke does in his persuasion to uniformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute upon Communicating at our Confused Communions</cite>, (Amsterdam, 1624), ch. 5, ‘Of Kneeling in the Act of Receiving the Sacramental Elements’, pp. 70-71</span></figcaption>

</figure><figure class="quote" id="q-3ffcc16b4a" data-kw="">
<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

the%20Lord%E2%80%99s%20death" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-31b9668161" data-kw="">
<blockquote><p>Customs laudable are grounded upon decency and reason, and so moral, or grounded upon no reason at all. But Christ did nothing in God’s worship, nor did He any human moral actions for the mere fact and will of others going before, for these were not reasonable human actions; and if it [sitting at the First Lord’s Supper] be customable only, it is not lawful to put away a customable action out of worship, and to put a moral action of kneeling and divine signification in the place thereof, for so we might change places, times, persons and all physical circumstances, and make them supernatural.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 2, Question 1, pp. 192-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

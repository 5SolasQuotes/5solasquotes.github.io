<main class="wrap"><figure class="quote" id="q-f28dcd04b0" data-kw="">
<blockquote><p>The nature of a thing: not how it is, but how it is meant to be… It is as though a physician who saw only broken arms assumed that if arms have no fractures there must be something wrong with them. How could we correct such a misguided physician? By calling his attention to the purpose or function of the arms, to their proper work. Broken arms cannot do their work as well as intact ones; therefore, brokenness is not their natural state. The nature of a thing is not determined by how something happens to be, but by what it is for — by what it is designed to do and to become, if everything goes well… What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. …potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. Another reason why the expression ‘potentiality for fatherhood’ requires explanation is that although siring children is the most characteristic expression of fatherhood, it is far from its only expression… We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them… although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ I am saying that for men, the reality is parallel. Not every man is called to marry and bear physical children, but every man, whether married or unmarried, is called upon to be a biological, psychological or spiritual father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-budziszewski.html">J. Budziszewski</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What makes Men Men?’, pt. 1</cite>, (2019)</span></figcaption>

</figure><figure class="quote" id="q-9d1583691b" data-kw="">
<blockquote><p>VII… By immortality, I refer not to the immortality of the soul by creation strictly (as discussed in Thesis IV) but to the immortality of the whole composite [of man] by grace. It is not that death was impossible in the absolute sense (since it consisted of separable parts, including the corruptible body, with mutually opposing qualities), but as long as man persisted in that state under the covenant, he would never have died. This argument is against the Pelagians, Photinians, Socinians, and Anabaptists, and is supported by:

1. The first covenant and agreement (Leviticus 18:5, Romans 10:5, 11).

2. The sacrament and the tree of life (Genesis 2:9 compared with Genesis 3:22). The tree did not contain such a great power physically within itself, but it served as a pledge and sacrament, ensuring that his life would be happily continued until, by God’s grace, he would have reached complete blessedness in heaven after a most felicitous transition through death.

3. Death, originally threatened as a penalty in the event of sin (Genesis 2:17), only entered the world when sin became an actual reality; hence, death would not have had any place in that state. With sin excluded, all guilt, penalty, and consequent punishment were also excluded. This is clearly evident from Romans 5:12, 1 Corinthians 15:22, James 1:15, Romans 6:23, and Genesis 2:17, which align with the Hebrew saying: אין מיתה בלא חטא (“there is no death without sin”).</p></blockquote>

<blockquote><p>We therefore come to show the properties of this righteousness and holiness that was thus fixed in Adam’s heart:

1. It’s called original, to difference it from actual holiness; as we call it ‘original sin’, to distinguish it from actual: and therefore the learned call it original, partly in regard of itself, because it was the first righteousness; partly because of Adam, who had it as soon as he was created. As the schools say of original sin, Quam primum originatur homo, originatur itidem peccatum; so we may of Adam in his righteousness, In ortu virtus, as the father said, In ortu vitium est: and partly in regard of his posterity, for it should have been propagated to them.

2. Another property of this righteousness is that it is universal, comprehending the rectitude of all the parts and faculties of the soul: so that Adam was, for his soul, as Absalom is said to be comely for his body, from the head to the foot no blemish at all: so that this was not a perfection in one part only, but all over; as our corruption makes us, as he said of the martyr wounded in many places, totum vulnus.

3. It was harmonious: there was not only rectitude in every part, but a sweet correspondency one with the other; there was no rebellion or fight between the inferiour appetite and the understanding. Therefore some learned men say, This righteousness is not to be conceived as an aggregation of several habits, but as an inward rectitude of all faculties: Even as the exact temperament of the body is not from any superadded habit, but from the natural constitution of the parts.

4. This righteousness and holiness, it was a perfection due to Adam, supposing the end to which God made him. If God required obedience of Adam to keep the law, and happinesse thereupon, it was due not by way of merit, but condecency to God’s goodness, to furnish him with abilities to perform it; as the soul of Adam was a due to him, supposing the end for which God made him. Indeed, now it’s of grace to us, and in a far different consideration made ours, because we lost it. Lastly, this was to be a propagated righteousness; for, as it is to be proved hereafter, God did all this in a way of covenant with Adam, as a public person: And howsoever every thing that Adam did personally was not made ours, (we did not eat in his eating, nor drink in his drinking, we did not dress the garden in his dressing of it) yet that which he did federally, as one in convenant with God, that is made ours; so his sin and misery is made ours, then his righteousness and happiness: As it is now, By one man sin entred into the world, and death by sin; so then it would have been by one man righteousness, and life by righteousness. Questions to be made:

1. Whether this righteousness was natural to Adam, or no? Howsoever some have thought this a mere contention of words, and therefore if they were well explained, there would be no great difference; yet the Papists make this a foundation for other great errors: for, grant this righteousness to be supernatural to Adam, as it is to us, then:

1. It will follow that all the motions rising in the appetite against reason, are from the constitution of our nature; and so no more sin than hunger and thirst is.

2. That freewill is still in us, and that we have lost nothing but that which is merely superadded to us. Or they compare this righteousness Adam had, sometimes to an antidote, which preserves against the deadly effect of poison: sometimes to a bridle, that rules the horse; so that they suppose man’s nature would of itself rebel, but only this was given to Adam to check it: sometimes to Sampson’s hair, whereby he had supernatural strength, but when that was cut off, he had only natural: So that by this doctrine, man, now fallen, should be weaker than he was, but not corrupted. Therefore we must necessarily conclude that this righteousness was natural to him; not indeed flowing from the principles of nature, for so it was of God, but it was a perfection suitable or connatural to him; it was not above him, as it is now in us. As a blind man that was made to see, though the manner was supernatural, yet to see was a natural perfection.</p></blockquote>

2. Another property of this righteousness is that it is universal, comprehending the rectitude of all the parts and faculties of the soul: so that Adam was, for his soul, as Absalom is said to be comely for his body, from the head to the foot no blemish at all: so that this was not a perfection in one part only, but all over; as our corruption makes us, as he said of the martyr wounded in many places, totum vulnus.

3. It was harmonious: there was not only rectitude in every part, but a sweet correspondency one with the other; there was no rebellion or fight between the inferiour appetite and the understanding. Therefore some learned men say, This righteousness is not to be conceived as an aggregation of several habits, but as an inward rectitude of all faculties: Even as the exact temperament of the body is not from any superadded habit, but from the natural constitution of the parts.

4. This righteousness and holiness, it was a perfection due to Adam, supposing the end to which God made him. If God required obedience of Adam to keep the law, and happinesse thereupon, it was due not by way of merit, but condecency to God’s goodness, to furnish him with abilities to perform it; as the soul of Adam was a due to him, supposing the end for which God made him. Indeed, now it’s of grace to us, and in a far different consideration made ours, because we lost it. Lastly, this was to be a propagated righteousness; for, as it is to be proved hereafter, God did all this in a way of covenant with Adam, as a public person: And howsoever every thing that Adam did personally was not made ours, (we did not eat in his eating, nor drink in his drinking, we did not dress the garden in his dressing of it) yet that which he did federally, as one in convenant with God, that is made ours; so his sin and misery is made ours, then his righteousness and happiness: As it is now, By one man sin entred into the world, and death by sin; so then it would have been by one man righteousness, and life by righteousness. Questions to be made:

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e430d2cf9" data-kw="conditional thing not decree">
<blockquote><p>It is one thing for the thing decreed to be conditional; another for the decree itself. The former we grant, but not the latter. There can be granted an antecedent cause or condition of the thing willed, but not immediately of the volition itself. Thus God wills salvation to have the annexed condition of faith and repentance in the execution, but faith and repentance are not the condition or cause of the act of willing in God, nor of the decree to save in the intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.9</span></figcaption>

</figure><figure class="quote" id="q-280ccb1fb4" data-kw="foreknew believe election grace">
<blockquote><p>Assuredly, if this were said because God foreknew that they would believe, not because He Himself would make them believers, the Son is speaking against such a foreknowledge as that when He says, &quot;Ye have not chosen me, but I have chosen you;&quot; when God should rather have foreknown this very thing, that they themselves would have chosen Him, so that they might deserve to be chosen by Him.</p></blockquote>

</figure><figure class="quote" id="q-db7c9a5cf7" data-kw="faith gift elect ordo">
<blockquote><p>Predestination to life necessarily includes the decree of God’s giving faith and perseverance (Acts 13:48; Rom. 8:29, 30). And the promise concerning the giving of faith to the elect no less pertains to the circuit of the gospel covenant (Heb. 8:10; Eph. 2:8; Phil. 1:29), than the promise concerning the giving of salvation to believers.</p></blockquote>

</figure><figure class="quote" id="q-d360696bd6" data-kw="foreseen perseverance mutable election">
<blockquote><p>The Arminians (in order to defend the apostasy of saints) uphold the mutability of election. Thus they make it twofold: one incomplete and not decisive (of those who will believe), which can be revoked and made void by the inconstancy of men who can fall from faith; the other, however, complete and decisive (of those persevering and dying in faith), which is immutable.</p></blockquote>

<blockquote><p>That such inconveniencie may be shunned, it is fit that when any change is to be made in the policy of a Church, not the clergy alone, but the elders also, and men of understanding among the layity, in a lawfull assembly, freely give their voices and consent thereunto. Good reason have our writers to hold against Papists, that laymen ought to have place in councils, wherein things which concern the whole Church are to be deliberated upon.</p></blockquote>

<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as:

1. Unwritten traditions—not necessary, not written.

2. Human mystical, symbolical signs and ceremonies—not necessary, not written.

3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written.

4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, p. 87</span></figcaption>

<blockquote><p>…being persuaded in my conscience that the Lord had a true Church in this Realm [of England]… which, being assembled out of all the parts of the land in Parliament, did commit this authority to ordain ministers unto the bishops: and knowing out of the Word of God that every true Church has this power and authority to ordain ministers: I considered with myself that though the Church offended in committing this power and authority unto them that by the Law of God were not capable of it, yet I might without sin seek and take the Church’s ordination at their hands: as I may reverence and take the benefit of the prince’s power and authority, which is of God, though it be committed unto and exercised by men that by the Law of God are not capable of it. Secondly, seeing it is a thing not to be refused if a man entering into the ministry might have the approbation of all and every one of the ministers of the Gospel in the land:¹ it seems unto me the approbation of that bishop, that is also a minister and preacher of the Gospel, cannot be deemed to be merely unlawful.² ¹ [That such makes a valid ordination, see ‘The Implicit or Tacit Consent of Church Governors is Sufficient for the Power of Being an Office-Bearer’ and ‘That Persons who enter Church Office by Corruption, with the Standing Consent of the Rest of the Church Governors, is Valid’.] ² [Samuel Rutherford with much of the reformed likewise rightly argued that, while the office of a regular episcopal bishop is not Scriptural, nor do they have power, nor should be given power so that a single bishop could ordain a minister, yet the bishops did receive and maintain, with corruptions, the nature of the ministerial office: ‘That Episcopal Bishops &amp; Prelates are Unlawful but Valid Gospel Ministers’.] Thirdly, the authority of the Christian Magistrate (without whose liking and allowance a minister cannot be admitted to the ministry in peace) coming [joining] to the bishop by act of Parliament, I may more boldly come to him³ for his approbation in regard of the Law: not looking so much unto the man, [but] as regarding with reverence the power of the law and Christian magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England</cite>, [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 10, p. 117</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-01d9c7d1bc" data-kw="">
<blockquote><p>4. They that distinguish between the key of order and the key of jurisdiction do without question allow the former to the presbyters. Now the key of order (as rightly understood, as Spalatensis has largely opened it) comprehends all that power whereby we do immediately work on the conscience, and so is exercised in foro interno, and not directly in externo. Now that which we have agreed on [in Baxter’s Association] is only so much as belongs to order, or to a presbyter as the ambassador of Christ and [as] his watchman over the souls of those people; and it is to be no further effectual than they conscientiously submit to it, voluntarily, without external force. It is but our preaching and applying God’s Word to the consciences of the hearers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“4. They that distinguish between the key of order and the key of jurisdiction do without question allow the former to the presbyters. Now the key of order (as rightly understood, as Spalatensis has largely opened it) comprehends all that power whereby we do immediately work on the conscience, and so is exercised in foro interno, and not directly in externo. Now that which we have agreed on [in Baxter’s Association] is only so much as belongs to order, or to a presbyter as the ambassador of Christ and [as] his watchman over the souls of those people; and it is to be no further effectual than they conscientiously submit to it, voluntarily, without external force. It is but our preaching and applying God’s Word to the consciences of the hearers.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+They+that+distinguish+between+the+key+of+order+and+the+key+of+jurisdiction+do+without+question+allow+the+former+to+the+presbyters.+Now+the+key+of+order+%28as+rightly+understood%2C+as+Spalatensis+has+largely+opened+it%29+comprehends+all+that+power+whereby+we+do+immediately+work+on+the+conscience%2C+and+so+is+exercised+in+foro+interno%2C+and+not+directly+in+externo.+Now+that+which+we+have+agreed+on+%5Bin+Baxter%E2%80%99s+Association%5D+is+only+so+much+as+belongs+to+order%2C+or+to+a+presbyter+as+the+ambassador+of+Christ+and+%5Bas%5D+his+watchman+over+the+souls+of+those+people%3B+and+it+is+to+be+no+further+effectual+than+they+conscientiously+submit+to+it%2C+voluntarily%2C+without+external+force.+It+is+but+our+preaching+and+applying+God%E2%80%99s+Word+to+the+consciences+of+the+hearers.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98Objections+Answered%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F01d9c7d1bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/01d9c7d1bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/presbyterianism#:~:text=4.%20They%20that%20distinguish%20between%20the,to%20the%20consciences%20of%20the%20hearers&amp;text=4.%20They%20that%20distinguish%20between%20the%20key%20of&amp;text=God%E2%80%99s%20Word%20to%20the%20consciences%20of%20the%20hearers" rel="noopener" target="_blank">Re

<main class="wrap"><figure class="quote" id="q-b2d7f4b54a" data-kw="">
<blockquote><p>52. Given the inherently diverse and manifold structure of the ordinances of civil government and the Church (not to mention their de facto material structures), in their varied subjects, authorities, objects, purposes, ends, means, adjuncts, effects, relations to each other and how they relate differently to God and Christ,† the phrases “God” and “Christ centered voting” are simplistic and unhelpful. † See ed. Fentiman, All of George Gillespie’s Writings on Christ’s Mediatorial Kingdom is the Church Only (RBO, 2014), pp. 9-10 &amp; 18-27 One can talk about “Christ centered mowing the lawn” or “plumbing,” as Christians ought to mow their lawn and do plumbing in faith to Christ and support his Church by it if possible, perhaps by mowing a church’s lawn or fixing some of their leaky pipes, but the nature, science and work of mowing the lawn and plumbing, or their immediate, nearest ends, do not center around Christ, but around mowing the lawn and plumbing. Likewise, “Christ centered voting,” or “politics,” is most directly centered around voting and politics, and “Christ centered chess” is difficult to appreciate. On the other hand, trusting Christ to save us from our sins, growing in the knowledge of Christ and worshipping Him are Christ centered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses on the Ethics of Civil Voting</cite>, (2024), ‘Christ Centered Voting’ at ‘On Voting’ (RBO)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-43abe76116" data-kw="">
<blockquote><p>Though I yield some degree of eﬃcacy in Christ’s death unto all; yet I conceive it far short, both of impetration [legal undertaking and payment of sins] and application of that gracious atonement, which is thereby wrought to the elect of God; whence also it is that I dare not preach the Gospel indifferently unto all, before the Law; nor the worth of Christ, before the need of Christ. Children’s bread is not meet for whelps; and full souls will despise honey-combs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Cotton to James Ussher</cite>, 31 May 1626 in Sargent Bush, Jr. (ed.), The Correspondence of John Cotton (Chapel Hill: University of North Carolina Press, 2001), pp. 111-12</span></figcaption>

</figure><figure class="quote" id="q-1b869e136d" data-kw="">
<blockquote><p>Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Miscellanies”</cite>, (1722), WJE Online vol. 13, t. ‘Universal Redemption’, p. 174</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-c95490c981" data-kw="">
<blockquote><p>Unto whom is the death and passion of Christ profitable? Although He might have been a sufficient price for the sins for all men, yet actually and effectually he died for his elect only, who receive Him and believe Him, Matt 1:21. “He will deliver his people from their sins.” John 10:15. “I lay down my life for my sheep.” and Chap. 17:19 “I sanctify myself,” for otherwise it would follow that Christ died [without] profit, and to no purpose in regard of many, and that the efficacy of Christ’s death could be made void by men.</p></blockquote>

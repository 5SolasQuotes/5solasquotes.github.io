</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b07a0e66a" data-kw="">
<blockquote><p>And not only Peter but also all the apostles, by making this confession—which they would soon proclaim in the midst of the world—laid the foundation of the church of Christ. Accordingly, figuratively speaking, along with Peter they were all of them the rock on which Christ built his church; or, in another application of the same image, Christ is the rock that the apostles by their preaching laid as the foundation of the church (Acts 4:11; Rom. 9:33; 1 Cor. 3:10–11; Eph. 2:20; 1 Pet. 2:5–6; Rev. 21:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><figure class="quote" id="q-3e0ab16df0" data-kw="Seat of infallibility">
<blockquote><p>They are not yet agreed among themselves on the seat of this infallibility, nor is it known as yet with whom it ought to be—with the pope or with a council. Some claim this privilege for a council, as is done by all those who believe the pope to be fallible and who on that account wish the council to be above him (as it was decreed in the councils of Constance and Basil and is constantly believed by the French church). Others ascribe it to the pope, as those who maintain that he is superior to a council (as the Council of Trent determined and with it the canonists and Scholastics).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.19</span></figcaption>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>

</figure><figure class="quote" id="q-a008e7ae24" data-kw="">
<blockquote><p>Certainly Peter, the first of the apostles, himself a member of the holy and universal Church, Paul, Andrew, John,--what were they but heads of particular communities? And yet all were members under one Head. And (to bind all together in a short girth of speech) the saints before the law, the saints under the law, the saints under grace, all these making up the Lord&#x27;s Body, were constituted as members of the Church, and not one of them has wished himself to be called universal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 5, ep. 18 (to John of Constantinople)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e952113197" data-kw="">
<blockquote><p>The world’s corruption was deep beyond conception. Earth was an open sepulchre; and each man hated his God. It was in reference to what he saw of this fearful enmity that Jesus said, in melancholy pity, “No man can come to me, except the Father which hath sent me draw him.” John vi. 44. They are so totally depraved, they are so wedded to their lusts, they are so gross, and sensual—so truly dead in sin—they do not wish to be freed from their covetousness, their envy, their lust, their power to draw draughts of pleasure from ungodly revelry, or from intense engrossment with the lawful occupations of life. They hide among the trees of the garden at the first sound of the voice of the Lord, even when he comes with grace on his lips, and goodwill to men in his heart.

O brethren, to be able to love any of such a race, argues strange and mysterious depth of love in God the Father. And he did fix his love on many of these; he did it freely, and he did it determinedly. So deliberate, decided, determined was this eternal love of the Father, that it made success certain in the case of each on whom it was fixed. It was such a love, that its plans and purposes implied the operation of each person of the Godhead. The Spirit must go forth and draw, and the Son go forth and die. This was the Father’s plan! O what amazing love is here! What thoughts are in his heart to usward! He will not let go his purpose of having some of our fallen race standing round his throne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-a-bonar.html">Andrew A. Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of the Father in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4cf30b6ad" data-kw="">
<blockquote><p>God’s stretching out his hands” is all one with his call, (Prov. 1:24); but all men are not called after the same rate as the called according to purpose: wherefore, this place proves not, that the workings of grace as to the elect are resistible; but that the offers of grace as to the non-elect are serious, God in the means really spreading out his arms of grace unto them. Again: they [the Remonstrants] urge that of our Savior, “These things I say, that you might be saved,” (John 5:34); which words were spoken to them, which “would not come to Christ,” (ver. 40); but that the Holy Spirit spoke as inwardly and powerfully to them, as to the elect who” hear and learn of the Father;” what chemistry can extract it out of this text? or from what other scripture can it be demonstrated? God” commands the light to shine out of darkness in some hearts,” (2 Cor. 4:6); but does He so in all? Whence then are those blinded ones? (ver. 4). If there be any such, where is the Remonstrants’ equality of grace? Where, when they say, that illumination is wrought irresistibly? These things cannot consist together. Wherefore our Savior’s words show not forth the weakness or separableness of grace as to the elect, but the true end and scope of Christ’s preaching as to the non-elect; what he spoke to them was in order to their salvation… wherefore this place proves not I that the working of grace in the elect is resistible, but it signally shows forth the nature, of divine ordinances. Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Mt. 3:11). Gospel-preaching is not a mere sound or voice of words, but it imports God’s ordinative counsel to turn men unto himself. Hence every true minister is said to stand. in God’s counsel, and for this very end, to turn them from the evil of their doings, (Jer. 22:22). Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls.</p></blockquote>

<blockquote><p>Yea, thou wilt find, that he, who prevented thee with grace, &amp; sought thee, ere ever thou soughtest him, &amp; gave thee grace to cry and pray, Have mercy, O God, yet he will seem to mis-know thee, and make thee none answer. Thou wilt cry in sickness, Mercy, but wilt thou always find mercy? No, no, thou wilt cry in other troubles, Mercy, and his Spirit no question will intercede for thee, and yet for a time he will make thee none answer. What meaneth this? why doeth he so? Now when he hath given thee grace to cry for mercy, a thirst &amp; an hunger for grace, (Blessed are they that hunger &amp; thirst) when he hath given thee this first grace, he will let thee cry a great while to try thy constancy.

We never get a spiritual grace in this life, but with the grace we get always a trial: and when he giveth us grace to cry: he will try if we will cry on. And to speak the truth, Brethren, All our life here, is but a trial of the graces of GOD, which he hath given us. We get not our heaven here, but a faith to look a far of unto it, an hunger, a thirst, a desire of it, and with our thirst a trial of our Faith, a trial of our Hope, of our desire, to see if we will stand in it. And then saith Peter, in the life to come, the trial of thy faith, and hope, and patience, being ended, What shall follow, Praise, and honour, and glory, when JESUS shall appear, 1. Pet. 1. 7. Thou shalt bee filled with saciety and fullness of joy, thine hunger and thirst shall be satisfied as soon as ever thou seest thy Redeemer.</p></blockquote>

<blockquote><p>III. But they [Arminians] do unwisely prove that which is not in controversy. For we do not teach, we do not acknowledge that irresistibility which they attribute to us. This conclusion therefore does not hurt us, who do willingly confess that the Holy Ghost does not always so work in men’s hearts that He takes away all resistance… the question is, whether it may be that they may never be converted, and may finally resist the spirit of adoption. To the proving of this, the places which speaks of reprobates, which we confess do finally resist God calling, and do want the spirit of adoption, are plainly besides the purpose. Finally, these sectaries do not prove that in all these places [of Scripture] it is spoken of a final resistance, of which alone it is spoken here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1635), pp. 478-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“III. But they [Arminians] do unwisely prove that which is not in controversy. For we do not teach, we do not acknowledge that irresistibility which they attribute to us. This conclusion therefore does not hurt us, who do willingly confess that the Holy Ghost does not always so work in men’s hearts that He takes away all resistance… the question is, whether it may be that they may never be converted, and may finally resist the spirit of adoption. To the proving of this, the places which speaks of reprobates, which we confess do finally resist God calling, and do want the spirit of adoption, are plainly besides the purpose. Finally, these sectaries do not prove that in all these places [of Scripture] it is spoken of a final resistance, of which alone it is spoken here.”

— Pierre Du Moulin, The Anatomy of Arminianism, … (1619; London, 1635), pp. 478-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+But+they+%5BArminians%5D+do+unwisely+prove+that+which+is+not+in+controversy.+For+we+do+not+teach%2C+we+do+not+acknowledge+that+irresistibility+which+they+attribute+to+us.+This+conclusion+therefore+does+not+hurt+us%2C+who+do+willingly+confess+that+the+Holy+Ghost+does+not+always+so+work+in+men%E2%80%99s+hearts+that+He+takes+away+all+resistance%E2%80%A6+the+question+is%2C+whether+it+may+be+that+they+may+never+be+converted%2C+and+may+finally+resist+the+spirit+of+adoption.+To+the+proving+of+this%2C+the+places+which+speaks+of+reprobates%2C+which+we+confess+do+finally+resist+God+calling%2C+and+do+want+the+spirit+of+adoption%2C+are+plainly+besides+the+purpose.+Finally%2C+these+sectaries+do+not+prove+that+in+all+these+places+%5Bof+Scripture%5D+it+is+spoken+of+a+final+resistance%2C+of+which+alone+it+is+spoken+here.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%2C+%E2%80%A6+%281619%3B+London%2C+1635%29%2C+pp.+478-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37218675c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37218675c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=III.%20But%20they%20%5BArminians%5D%20do%20unwisely,which%20alone%20it%20is%20spoken%20here&amp;text=III.%20But%20they%20%5BArminians%5D%20do%20unwisely%20prove%20that&amp;text=resistance%2C%20of%20which%20alone%20it%20is%20spoken%20here" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bcce423899" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans believed in the doctrines of grace such as election and particular redemption (Rom 8:28-30). They followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans were experts in their understanding of the concept of common grace although they did not use that term.¹ Their teaching accords fully with the way in which the doctrine of Common Grace is expounded by Prof John Murray (cf Works). They believed that the Holy Spirit is constantly active in restraining evil and promoting good throughout society. The Puritans believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9). They believed in the universal provision of God for all mankind according to the covenant made with Noah as representative of the whole world (Gen 8:20-22 and Ps 145). ¹ [Webmaster’s note: This particular claim is not true. Following Calvin’s use of the term ‘general grace’, the puritans did use the term ‘common grace’, as is affirmed by Dr. Richard Muller below on p. 130, and as is instanced by James Durham (who has a whole section on ‘common grace’ in his Revelation commentary), Stephen Charnock (below), and John Bunyan (below).]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4f0ad7c7ae" data-kw="">
<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), voluntas Dei, pp. 332-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

a1012.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-will-of-god/#:~:text=To%20bring%20forward%20greater%20things%2C%20the,fallen%20by%20the%20tree%20of%20ignominy&amp;text=To%20bring%20forward%20greater%20things%2C%20the%20common%20reason&amp;text=we%20had%20fallen%20by%20the%20tree%20of%20ignominy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the particular sense of a distinction between the voluntas beneplaciti as the decree and the voluntas signi as the divine command, the distinction is little different than the correctly understood distinction between the absolute and the conditional will of God. (Leigh, Body of Divinity, II.vii (p. 198); Cocceius, Summa theol., III.x47.)</p></blockquote>

</figure><figure class="quote" id="q-e054536f86" data-kw="">
<blockquote><p>But many testimonies of Scripture (you will say) teach that even the reprobate have known the truth. Leaving aside the Scriptures of the Old Testament: to Romans the apostle concerning the reprobates says that they hold the truth of God in unrighteousness. And to the Hebrews [6:4-6] he says that some have fallen away from the truth. And he says they taste the word of God and the powers of the world to come: but after the knowledge of the truth they willfully sin. And this is sin against the Holy Spirit: namely the opposition to the truth known, made from the heart. There are twofold cognitions of the truth (as was shown at the outset): one indeed is given and conferred by the gift of the Spirit; but yet inefficacious. For it is only on the surface of the intellect, and the ray has no root in the heart; and therefore it cannot be durable. For it is like seed which is born among rocky chinks and has no root; therefore when the sun arises it withers. Such cognition is common also to the reprobate. … Another is efficacious by the Holy Spirit, the Spirit, I say, of regeneration. For this penetrates into the heart, receives it, reforms and refashions it: there it puts down deep roots, and thrusts itself forth outward in its fruits by charity… Wherefore the Thesis remains firm: only the elect can come to the true knowledge of the truth, and at last the thing itself attains them. Thus it happens that this cognition of the truth is purely the work of the Holy Spirit, efficaciously calling and teaching. What things are demanded of us that we may come to a true and efficacious cognition of the truth? Thesis: That we be led to the cognition of the truth, besides a certain general hearing of the Word of God, we must pray that God may grant us his Spirit: who, when He excites in us the desire to seek that truth, then leads us to seek, to find, and to retain it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Nature of God... (Heidelberg: Wiener Neustadt, 1577), bk. 3 tr. AI by The Faith Received | ch. 3, quest. 3, ‘Whether in the knowledge of truth (which indeed is revealed in the sacred scriptures) our salvation is placed or not placed?’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But many testimonies of Scripture (you will say) teach that even the reprobate have known the truth. Leaving aside the Scriptures of the Old Testament: to Romans the apostle concerning the reprobates says that they hold the truth of God in unrighteousness. And to the Hebrews [6:4-6] he says that some have fallen away from the truth. And he says they taste the word of God and the powers of the world to come: but after the knowledge of the truth they willfully sin. And this is sin against the Holy Spirit: namely the opposition to the truth known, made from the heart. There are twofold cognitions of the truth (as was shown at the outset): one indeed is given and conferred by the gift of the Spirit; but yet inefficacious. For it is only on the surface of the intellect, and the ray has no root in the heart; and therefore it cannot be durable. For it is like seed which is born among rocky chinks and has no root; therefore when the sun arises it withers. Such cognition is common also to the reprobate. … Another is efficacious by the Holy Spirit, the Spirit, I say, of regeneration. For this penetrates into the heart, receives it, reforms and refashions it: there it puts down deep roots, and thrusts itself forth outward in its fruits by charity… Wherefore the Thesis remains firm: only the elect can come to the true knowledge of the truth, and at last the thing itself attains them. Thus it happens that this cognition of the truth is purely the work of the Holy Spirit, efficaciously calling and teaching. What things are demanded of us that we may come to a true and efficacious cognition of the truth? Thesis: That we be led to the cognition of the truth, besides a certain general hearing of the Word of God, we must pray that God may grant us his Spirit: who, when He excites in us the desire to seek that truth, then leads us to seek, to find, and to retain it.”

— Jerome Zanchi, On the Nature of God... (Heidelberg: Wiener Neustadt, 1577), bk. 3 tr. AI by The Faith Received | ch. 3, quest. 3, ‘Whether in the knowledge of truth (which indeed is revealed in the sacred scriptures) our salvation is placed or not placed?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+many+testimonies+of+Scripture+%28you+will+say%29+teach+that+even+the+reprobate+have+known+the+truth.+Leaving+aside+the+Scriptures+of+the+Old+Testament%3A+to+Romans+the+apostle+concerning+the+reprobates+says+that+they+hold+the+truth+of+God+in+unrighteousness.+And+to+the+Hebrews+%5B6%3A4-6%5D+he+says+that+some+have+fallen+away+from+the+truth.+And+he+says+they+taste+the+word+of+God+and+the+powers+of+the+world+to+come%3A+but+after+the+knowledge+of+the+truth+they+willfully+sin.+And+this+is+sin+against+the+Holy+Spirit%3A+namely+the+opposition+to+the+truth+known%2C+made+from+the+heart.+There+are+twofold+cognitions+of+the+truth+%28as+was+shown+at+the+outset%29%3A+one+indeed+is+given+and+conferred+by+the+gift+of+the+Spirit%3B+but+yet+inefficacious.+For+it+is+only+on+the+surface+of+the+intellect%2C+and+the+ray+has+no+root+in+the+heart%3B+and+therefore+it+cannot+be+durable.+For+it+is+like+seed+which+is+born+among+rocky+chinks+and+has+no+root%3B+therefore+when+the+sun+arises+it+withers.+Such+cognition+is+common+also+to+the+reprobate.+%E2%80%A6+Another+is+efficacious+by+the+Holy+Spirit%2C+the+Spirit%2C+I+say%2C+of+regeneration.+For+this+penetrates+into+the+heart%2C+receives+it%2C+reforms+and+refashions+it%3A+there+it+puts+down+deep+roots%2C+and+thrusts+itself+forth+outward+in+its+fruits+by+charity%E2%80%A6+Wherefore+the+Thesis+remains+firm%3A+only+the+elect+can+come+to+the+true+knowledge+of+the+truth%2C+and+at+last+the+thing+itself+attains+them.+Thus+it+happens+that+this+cognition+of+the+truth+is+purely+the+work+of+the+Holy+Spirit%2C+efficaciously+calling+and+teaching.+What+things+are+demanded+of+us+that+we+may+come+to+a+true+and+efficacious+cognition+of+the+truth%3F+Thesis%3A+That+we+be+led+to+the+cognition+of+the+truth%2C+besides+a+certain+general+hearing+of+the+Word+of+God%2C+we+must+pray+that+God+may+grant+us+his+Spirit%3A+who%2C+when+He+excites+in+us+the+desire+to+seek+that+truth%2C+then+leads+us+to+seek%2C+to+find%2C+and+to+retain+it.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+On+the+Nature+of+God...+%28Heidelberg%3A+Wiener+Neustadt%2C+1577%29%2C+bk.+3+tr.+AI+by+The+Faith+Received+%7C+ch.+3%2C+quest.+3%2C+%E2%80%98Whether+in+the+knowledge+of+truth+%28which+indeed+is+revealed+in+the+sacred+scriptures%29+our+salvation+is+placed+or+not+placed%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe054536f86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e054536f86.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=But%20many%20testimonies%20of%20Scripture%20%28you,to%20find%2C%20and%20to%20retain%20it&amp;text=But%20many%20testimonies%20of%20Scripture%20%28you%20will%20say&amp;text=to%20seek%2C%20to%20find%2C%20and%20to%20retain%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

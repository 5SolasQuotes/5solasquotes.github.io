<main class="wrap"><figure class="quote" id="q-1c7f1ad299" data-kw="">
<blockquote><p>Magistracy (saith he, p. 135.) is a power ordained of God, an Image of the power and judgement committed to Christ; Scripture and the gift of wisdom, justice and righteousness, are his unction now. Page 138. They are set up more specially to minister peace and judgement to Gods people in the flesh.

Then Nero, the great Turk, the Indian Kings, being ordained of God, Rom. 3.1. as the image of Christ, must be his submediators and under Deputies, little spiritual Kings, and Prophets, and Priests under Christ as Mediator. And who gave the Scriptures, the Law, written Gospel, and such an unction to the Indian Kings? for they are Magistrates. The man cannot speak of Christian Magistrates; for Rom. 13. which he citeth, speaketh of Nero, whose head was dry from all unction of the Gospel, or new Testament.

If the Magistrate be an Image of Christ’s power, and that power committed to him; they may under the Mediator Christ, ministerially judge of the doctrine preached by Ministers, if true or false. And if they be set up to minister justice more specially to God’s people in the flesh; then the people of God in the Spirit, and in all Spirit, as Saltmarsh saith most of them all are, shall be under no Magistrate; but this he saith of all, page 288, 293, 200, 201, 202, &amp;c. And by this every Magistrate must be a Christian of an image of the Mediator’s power; or then no Christian, or spiritual man can be a Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.21, pp 215-16.</span></figcaption>

</figure><figure class="quote" id="q-fdf1d500b0" data-kw="">
<blockquote><p>And yet we conceive another case… wherein this submission to a new power may be called legal. For the end of all law and government is to preserve our persons and estates; and they who are in supremacy of power have power to preserve or destroy both if they please; and therefore have as great a power over our laws, which are less then our lives. So soon as one supreme power is expelled by another, law, life and estate fall all into the hands of the succeeding power; and what it does not actually take away, stands in effect as deriving from it; and if that supreme power make a sanction for our obedience to it (as always is immediately done) then we may say our submission is legal, or else the supreme power cannot make a law.</p></blockquote>

</figure><figure class="quote" id="q-888559a1bd" data-kw="">
<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>

<blockquote><p>3. Prophesy taken for an immediate revealing of Gospel truths and mysteries, such as that, 1 Cor. 14, and what was frequent in the apostolick times, is now ceased; and there is neither such a gift, nor such an office.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c528061e3" data-kw="">
<blockquote><p>4. Yet if we take prophesy for the understanding of God’s mind, and for attaining to be well acquainted with the mysteries of God, by a mediate way; yea, and that beyond the applied means, or to have a gift and capacity for discerning of these things with little pains, and that beyond what some others can attain unto by any labor, we conceive that in this sense prophesy and prophets may be said to be continued in the Church; and such God raised up in the time of Reformation, men singularily gifted with a prophetical spirit in this sense…</p></blockquote>

</figure><figure class="quote" id="q-c037a6240d" data-kw="">
<blockquote><p>But in the letter to the Romans [12:7-8] and in the first letter to the Corinthians [12:28], he lists others [other offices besides those of the Word], as powers [miracles], the gift of healing, interpretation, government, and caring for the poor. Two of these I omit as being temporary, for it is not worthwhile to tarry over them. But two of them are permanent: government [ruling elders] and caring for the poor [deacons].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4, ch. 3, section 8, p. 1061</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“But in the letter to the Romans [12:7-8] and in the first letter to the Corinthians [12:28], he lists others [other offices besides those of the Word], as powers [miracles], the gift of healing, interpretation, government, and caring for the poor. Two of these I omit as being temporary, for it is not worthwhile to tarry over them. But two of them are permanent: government [ruling elders] and caring for the poor [deacons].”

— John Calvin, Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4, ch. 3, section 8, p. 1061">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+in+the+letter+to+the+Romans+%5B12%3A7-8%5D+and+in+the+first+letter+to+the+Corinthians+%5B12%3A28%5D%2C+he+lists+others+%5Bother+offices+besides+those+of+the+Word%5D%2C+as+powers+%5Bmiracles%5D%2C+the+gift+of+healing%2C+interpretation%2C+government%2C+and+caring+for+the+poor.+Two+of+these+I+omit+as+being+temporary%2C+for+it+is+not+worthwhile+to+tarry+over+them.+But+two+of+them+are+permanent%3A+government+%5Bruling+elders%5D+and+caring+for+the+poor+%5Bdeacons%5D.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Calvin%3A+Institutes+of+the+Christian+Religion%2C+ed.+John+T.+McNeill%2C+trans.+Ford+Lewis+Battles+in+The+Library+of+Christian+Classics%2C+vol.+21+%28Philadelphia%3A+Westminster+Press%2C+1960%29%2C+vol.+2%2C+bk.+4%2C+ch.+3%2C+section+8%2C+p.+1061&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc037a6240d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c037a6240d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-miracles-the-cessation-of-the-gift-of-miracles/#:~:text=But%20in%20the%20letter%20to%20the,and%20caring%20for%20the%20poor%20%5Bdeacons&amp;text=But%20in%20the%20letter%20to%20the%20Romans%20%5B12%3A7%2D8&amp;text=ruling%20elders%5D%20and%20caring%20for%20the%20poor%20%5Bdeacons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c212e3221" data-kw="">
<blockquote><p>By this term [‘prophets’ in this passage] he means (in my opinion) not those who were endowed with the gift of prophesying, but those who were endowed with a peculiar gift, not merely for interpreting Scripture, but also for applying it wisely for present use. My reason for thinking so is this, that he prefers prophecy to all other gifts, on the ground of its yielding more edification — a commendation that would not be applicable to the predicting of future events. Farther, when he describes the office of prophet, or at least treats of what he ought principally to do, he says that he must devote himself to consolation, exhortation, and doctrine. Now these are things that are distinct from prophesyings. Let us, then, by ‘prophets’ in this passage understand, first of all, eminent interpreters of Scripture, and farther, persons who are endowed with no common wisdom and dexterity in taking a right view of the present necessity of the Church, that they may speak suitably to it, and in this way be, in a manner, ambassadors to communicate the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 12, verse 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-19b35ae52e" data-kw="">
<blockquote><p>Fecundity: “increase and multiply.” These words can have: (1) an imperative sense, in which way the ancient Hebrews wanted there to be here a universal precept, placed upon all people, of contracting marriage, which they call ונמה פיריה מצות” ,the commandment of fruitfulness and multiplication,” because one who does not confirm this commandment has no part, they say, in the age to come. But in this way the commandment would fall even upon brute beasts, since the same thing is said of them in verse 22; in this way also there would be a commandment to have dominion over the fish, “have dominion over the fish of the sea,” and so forth. (2) A concessive sense, just as in Genesis 2:16 and Deuteronomy 14:11, 20. Finally, (3) a promissory sense, so that the imperative stands in place of the future, “increase” in place of “you will increase,” and so forth, such that he is promising fertility, power, and appetite to beget what is similar to them; hence this is said only of fecund things, but not of light, stars, plants, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 9, Exegetical Part, p. 252</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<main class="wrap"><figure class="quote" id="q-8512b1e2d9" data-kw="">
<blockquote><p>Moreover, the chief point of all Scripture is that we should not doubt but hope, trust, and believe for a certainty that God is merciful, kind, and patient, that He does not lie and deceive but is faithful and true. He keeps His promises and has now accomplished what He had promised, handing over His only Son into death for our sins, so that everyone who believes in the Son should not perish but have eternal life (John 3:16). Here there can surely be no doubt whether God has been reconciled and is favorably disposed toward us, whether the hate and wrath of God have been removed; for He permits His own Son to die for us sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 386.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Hence it is commonly called a will of sign and opposed to the will of good pleasure, which is always fulfilled — as several weighty Thomists here expound: Cajetan, Bañez, Zumel, cited by González (disp. 56, sect.1)…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-6a77a27b91" data-kw="conditions">
<blockquote><p>Third, if the covenant be viewed in relation to the first sanction in Christ, it has no previous condition, but rests upon the grace of God and the merit of Christ alone. But if it is considered in relation to its acceptance and application to the believer, it has faith as a condition (uniting man to Christ and so bringing him into the fellowship of the covenant). If, however, in relation to its consummation with faith (obedience and the desire of holiness), it has the relation of condition and means because without them no one shall see God. Source of explanation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.3</span></figcaption>

<blockquote><p>The impelling cause [of the gospel call], whereby God is moved internally by Himself, is God’s grace, his good pleasure and favorably-inclined will to offer, in Christ, his salvation to wretched sinners.</p></blockquote>

</figure><figure class="quote" id="q-5c95a48cd0" data-kw="">
<blockquote><p>To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1.450.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

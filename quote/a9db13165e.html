<blockquote><p>The other two are ordinary office-bearers, pastors and teachers; I say two, though the disjunctive particle “some,” be not cast in between them; for they are distinguished, Rom. 12:7, 8, and the exercise of their respective offices is distinguished also, 1 Cor. 12:8; so that by pastors are meant those who, besides their ability to open up the text of Scripture in some measure, are chiefly gifted with the word of wisdom, wisely and powerfully to apply the word for working upon the affections, as the matter requires; and the teacher is he who is gifted with the word of knowledge, or ability to open up the mind of God in Scripture, establishing truth, and confuting error, without insisting much upon particular application; which office, because of the church’s poverty, is confined to the schools, and the ordinary exercise of it before the people left upon the pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 4:11.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-015970734b" data-kw="">
<blockquote><p>Then he [Satan] begins his strongest batteries, or main temptations, when we are first entering into a renewed state: Now this is most usual in the days of our youth. Thus many of our worthies observe, Mr. [Thomas] Ford, speaking of young people, faith, Amongst the usually the stream of converting grace most runs. It may be in some grace is wrought very early, even in childhood, but ordinarily ’tis after they come under catechising, and are more adult. And Mr. Burges thus, Conversion does not only belong to the old, but to the young; yea, commonly conversion is sooner wrought upon the younger sort of people; for they have not resisted the grace of God so much, they have not provoked God to give them up to their own heart’s lusts, and desires, as many ages persons have; so then let young ones hearken to sermons, let them attend to what the ministers of God exhort. Remember thy Creator in the days of thy youth; and it is good to bear the yoke in they youth; it is good to feel the bitterness of sin betimes, Eccl. 12:1; Lam. 3:27. And Vortier thus, The Lord can convert and bring home to himself at all times, in middle age, in old age, at the very last, as the thief upon the cross; yet the time of effectual calling is more ordinary in the time of youth. Some have observed the time of effectual calling to be between the years of eighteen and thirty, most commonly. And I believe that most saints experience, that the Lord wrought upon them in their younger days. Marriages are most in younger times, so are spiritual contracts in Jesus Christ. David was good when young, Daniel a young prophet; Timothy a young preacher, Samuel began with God betimes, Abijah good when a child, so was Josiah. Hammers thus, Those who in their infancy were considered as parts of their parents, and so by virtue of their parents’ membership enjoyed the ordinance of baptism; when once grown up to maturity and ripeness of years, they are to be looked upon and considered in themselves, and no longer as in their parents, and therefore as being in a capacity so to do, they ought now to take hold of the covenant for themselves, and to render a personal account of their faith. It pleases God, that many do so even very early; which agrees with the former opinion, that some are regenerated after they come under catechizing. It was the use of the Jews, as Mr. Buxtorf reports, that so soon as their circumcised children were able to speak, they taught them some select places of Scripture, and so proceeding on by degrees at thirteen years of age, they were called filii praecepti, sons of the precept; and then they were to receive the passover, as says Mr. Weem, and to observe the 613 precepts, which comprehended in them the sum of the Mosaical law, and Jewish religion, and then they themselves were accounted guilty and liable to punishment, both divine and human, if they did transgress the law, whereas before their faults were imputed to their fathers, of whom the punishment was exacted… I hope, I may say of Gentiles as well as Jews, that conversion is sometimes very early, even as early as at thirteen years of age, though it be not ordinary. And oh! how good is it for a man to bear the yoke in his youth, seeing it must be born at one time or other? The burden of sin at that age will be the lighter, the flowing of heavenly affections will be the sweeter, the removal of sin, in all likehood will be sooner, at least the surer; God having engaged Himself that ‘they that seek Him early shall find Him,’ Prov. 8:17. Satan knows all this very well, and therefore he sets a stricter watch on youth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>War with Devils</cite>, … (d. 1663), pp. 52-54</span></figcaption>

<blockquote><p>2. The Church of believers have no authority ecclesiastical, nor power of the keys, if all the pastors on earth were removed from the Church by death; and in that case the keys should indeed be only in Christ’s hand, and the case being extraordinary, Christ [would be] behoved extraordinarily to supply the want of ordination, which Timothy, Titus and other elders do ordinarily give, for the Church of believers could not give that which they have not…</p></blockquote>

<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews. 2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews. 2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.”

— Matthew Henry, Commentary on Acts, ch. 10, v. 35, “But in every nation he that feareth Him, and worketh righteousness, is accepted with Him.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+God+never+did%2C+nor+ever+will%2C+justify+and+save+a+wicked+Jew+that+lived+and+died+impenitent%2C+though+he+was+of+the+seed+of+Abraham%2C+and+a+Hebrew+of+the+Hebrews%2C+and+had+all+the+honour+and+advantages+that+attended+circumcision.+He+does+and+will+render+indignation+and+wrath%2C+tribulation+and+anguish%2C+upon+every+soul+of+man+that+doeth+evil%3B+and+of+the+Jew+first%2C+whose+privileges+and+professions%2C+instead+of+screening+him+from+the+judgment+of+God%2C+will+but+aggravate+his+guilt+and+condemnation.+See+Rom.+2%3A3%2C+8%E2%80%939%2C+17.+Though+God+has+favoured+the+Jews%2C+above+other+nations%2C+with+the+dignities+of+visible+church-membership%2C+yet+He+will+not+therefore+accept+of+any+particular+persons+of+that+dignity%2C+if+they+allow+themselves+in+immoralities+contradictory+to+their+profession%3B+and+particularly+in+persecution%2C+which+was+now%2C+more+than+any+other%2C+the+national+sin+of+the+Jews.+2.+He+never+did%2C+nor+ever+will%2C+reject+or+refuse+an+honest+Gentile%2C+who%2C+though+he+has+not+the+privileges+and+advantages+that+the+Jews+have%2C+yet%2C+like+Cornelius%2C+fears+God%2C+and+worships+Him%2C+and+works+righteousness%2C+that+is%2C+is+just+and+charitable+towards+all+men%2C+who+lives+up+to+the+light+he+has%2C+both+in+a+sincere+devotion+and+in+a+regular+conversation.+Whatever+nation+he+is+of%2C+though+ever+so+far+remote+from+kindred+to+the+seed+of+Abraham%2C+though+ever+so+despicable%2C+nay%2C+though+in+ever+so+ill+a+name%2C+that+shall+be+no+prejudice+to+him.+God+judges+of+men+by+their+hearts%2C+not+by+their+country+or+parentage%3B+and%2C+wherever+He+finds+an+upright+man%2C+He+will+be+found+an+upright+God%2C+Ps.+18%3A25.+Observe%2C+Fearing+God%2C+and+working+righteousness%2C+must+go+together%3B+for%2C+as+righteousness+towards+men+is+a+branch+of+true+religion%2C+so+religion+towards+God+is+a+branch+of+universal+righteousness.+Godliness+and+honesty+must+go+together%2C+and+neither+will+excuse+for+the+want+of+the+other.+But%2C+where+these+are+predominant%2C+no+doubt+is+to+be+made+of+acceptance+with+God.+Not+that+any+man%2C+since+the+fall%2C+can+obtain+the+favour+of+God+otherwise+than+through+the+mediation+of+Jesus+Christ%2C+and+by+the+grace+of+God+in+Him%3B+but+those+that+have+not+the+knowledge+of+Him%2C+and+therefore+cannot+have+an+explicit+regard+to+Him%2C+may+yet+receive+grace+from+God+for+his+sake%2C+to+fear+God+and+to+work+righteousness%3B+and+wherever+God+gives+grace+to+do+so%2C+as+He+did+to+Cornelius%2C+He+will%2C+through+Christ%2C+accept+the+work+of+his+own+hands.+Now%3A+%281%29+This+was+always+a+truth%2C+before+Peter+perceived+it%2C+that+God+respecteth+no+man%E2%80%99s+person%3B+it+was+the+fixed+rule+of+judgment+from+the+beginning%3A+If+thou+doest+well%2C+shalt+thou+not+be+accepted%3F+And%2C+if+not+well%2C+sin%2C+and+the+punishment+of+it%2C+lie+at+the+door%2C+Gen.+4%3A7.+God+will+not+ask+in+the+great+day+what+country+men+were+of%2C+but+what+they+were%2C+what+they+did%2C+and+how+they+stood+affected+towards+Him+and+towards+their+neighbors%3B+and%2C+if+men%E2%80%99s+personal+characters+received+neither+advantage+nor+disadvantage+from+the+great+difference+that+existed+between+Jews+and+Gentiles%2C+much+less+from+any+less+difference+of+sentiments+and+practices+that+may+happen+to+be+among+Christians+themselves%2C+as+those+about+meats+and+days%2C+Rom.+14%3A1-23.+It+is+certain+the+kingdom+of+God+is+not+meat+and+drink%2C+but+righteousness%2C+and+peace%2C+and+joy+in+the+Holy+Ghost%3B+and+he+that+in+these+things+serveth+Christ+is+accepted+of+God%2C+and+ought+to+be+approved+of+men%3B+for+dare+we+reject+those+whom+God+doth+not%3F+%282%29+Yet+now+it+was+made+more+clear+than+it+had+been%3B+this+great+truth+had+been+darkened+by+the+covenant+of+peculiarity+made+with+Israel%2C+and+the+badges+of+distinction+put+upon+them%3B+the+ceremonial+law+was+a+wall+of+partition+between+them+and+other+nations%3B+it+is+true+that+in+it+God+favoured+that+nation+%28Rom.+3%3A1%E2%80%932%3B+9%3A4%29%2C+and+thence+particular+persons+among+them+were+ready+to+infer+that+they+were+sure+of+God%E2%80%99s+acceptance%2C+though+they+lived+as+they+listed%2C+and+that+no+Gentile+could+possibly+be+accepted+of+God.+God+had+said+a+great+deal+by+the+prophets+to+prevent+and+rectify+this+mistake%2C+but+now+at+length+he+does+it+effectually%2C+by+abolishing+the+covenant+of+peculiarity%2C+repealing+the+ceremonial+law%2C+and+so+setting+the+matter+at+large%2C+and+placing+both+Jew+and+Gentile+upon+the+same+level+before+God%3B+and+Peter+is+here+made+to+perceive+it%2C+by+comparing+the+vision+which+he+had+with+that+which+Cornelius+had.+Now+in+Christ+Jesus%2C+it+is+plain%2C+neither+circumcision+availeth+any+thing%2C+nor+uncircumcision%2CGal.+5%3A6%3B+Col.+3%3A11.%E2%80%9D%0A%0A%E2%80%94+Matthew+Henry%2C+Commentary+on+Acts%2C+ch.+10%2C+v.+35%2C+%E2%80%9CBut+in+every+nation+he+that+feareth+Him%2C+and+worketh+righteousness%2C+is+accepted+with+Him.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F294f84affd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/294f84affd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-calling/#:~:text=1.%20God%20never%20did%2C%20nor%20ever,thing%2C%20nor%20uncircumcision%2CGal.%205%3A6%3B%20Col.%203%3A11&amp;text=1.%20God%20never%20did%2C%20nor%20ever%20will%2C%20justify&amp;text=availeth%20any%20thing%2C%20nor%20uncircumcision%2CGal.%205%3A6%3B%20Col.%203%3A11" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-34237a9c9e" data-kw="">
<blockquote><p>§XII. Conversion is distinguished into first conversion, which is the action of God alone and the giving of new life; and second conversion, which is the act of man gladly accepting virtue and fleeing sin after he has been regenerated by the Spirit (Lam. 5:21; Song of Sol. 1:4). … Controversy 3 – Is man in the first act of regeneration merely passive? We affirm against the Socinians and the Arminians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 13, ‘Conversion &amp; Faith’, pp. 148 &amp; 151</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“§XII. Conversion is distinguished into first conversion, which is the action of God alone and the giving of new life; and second conversion, which is the act of man gladly accepting virtue and fleeing sin after he has been regenerated by the Spirit (Lam. 5:21; Song of Sol. 1:4). … Controversy 3 – Is man in the first act of regeneration merely passive? We affirm against the Socinians and the Arminians.”

— Leonard Riissen, A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 13, ‘Conversion &amp; Faith’, pp. 148 &amp; 151">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7XII.+Conversion+is+distinguished+into+first+conversion%2C+which+is+the+action+of+God+alone+and+the+giving+of+new+life%3B+and+second+conversion%2C+which+is+the+act+of+man+gladly+accepting+virtue+and+fleeing+sin+after+he+has+been+regenerated+by+the+Spirit+%28Lam.+5%3A21%3B+Song+of+Sol.+1%3A4%29.+%E2%80%A6+Controversy+3+%E2%80%93+Is+man+in+the+first+act+of+regeneration+merely+passive%3F+We+affirm+against+the+Socinians+and+the+Arminians.%E2%80%9D%0A%0A%E2%80%94+Leonard+Riissen%2C+A+Complete+Summary+of+Elenctic+Theology+%26+of+as+Much+Didactic+Theology+as+is+Necessary%2C+trans.+J.+Wesley+White+MTh+thesis+%28Bern%2C+1676%3B+GPTS%2C+2009%29%2C+ch.+13%2C+%E2%80%98Conversion+%26+Faith%E2%80%99%2C+pp.+148+%26+151&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F34237a9c9e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/34237a9c9e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=XII.%20Conversion%20is%20distinguished%20into%20first,against%20the%20Socinians%20and%20the%20Arminians&amp;text=XII.%20Conversion%20is%20distinguished%20into%20first%20conversion%2C%20which&amp;text=We%20affirm%20against%20the%20Socinians%20and%20the%20Arminians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>8. The only means to partake of this resurrection is by faith to lay hold on Christ, for “he that believes in Me shall live,” etc. Christ being thus laid hold on, no bonds of spiritual death shall hinder his quickening virtue to raise them up, but He will make the very dead to live; for, “he that believes, though he were dead, yet shall he live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John (London: Smith, 1657), on 11:25-26</cite>, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-864c580f03" data-kw="">
<blockquote><p>Fourthly, does she lean upon God before she can come? must He work the first motion to make her willing, before she can believe in Him? Then how are those to be here reproved that would make man’s will to be the author of its first motions unto God. Pelagius was a great defender of it… Lastly, he would maintain (and the Arminians still from him) that grace did indeed help a good work, but it had its first motion from our wills, or at least might have; and the will had a negative voice, and might resist and cross grace which did not work irresistibly in the soul, to force the soul to Him. … Does God move the will attending Him in duties, first? Secondly, when the will is thus moved, does it then come? when it is drawn, does it run? Then this reproves the Enthusiasts of old, the Anabaptists, Antinomians, Seekers of our days, that hold, first, there is no need of duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646)</cite>, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-5103ae4678" data-kw="">
<blockquote><p>The Root of David He is called, according to Isa. 53:2, whereas He is said to be a branch out of the root, Isa. 11:1, because although He be but a branch according to the flesh for so much as he came of David, yet He is a root according to his divinity (Rupertus; Pannonius), whereupon David and all the godly are born by faith partaking of his grace, as of sap coming from Him, and consequently of salvation by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastica interpretatio: or the Expositions upon the difficult and doubtful passages of the seven Epistles called catholic and the Revelation... (London: Haviland, 1627), on Rev. 5, question 6</cite>, p. 308</span></figcaption>

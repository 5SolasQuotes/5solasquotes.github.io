<main class="wrap"><figure class="quote" id="q-e1150b1a98" data-kw="">
<blockquote><p>These Judicial Laws were determinations of the Moral Law. A determination is either Iuris Divini [Divine law] or Humani [human]; these determinations in Moses’ Judicial Laws are Divini Juris; therefore they had greater force to bind the Jew, than any municpal law has to bind the subjects now, in respect they were given by God Himself, and these laws of men which draw nearest to them in equity, are most perfect; although particularly they cannot be fitted to every nation, no more than a shoe of one measure can serve for every foot. … Fourthly, the punishments inflicted by human laws are alterable: so were the punishments in Moses’ Judicial Law; therefore the Jews say of them, ascendunt et descendunt [ascending and desceding], which they understand, not of the greatest and highest transgressions, but of the middle sort of transgressions, which praecepta media, their middle precepts did forbid. Example, Ex. 21:29-36, If a man kept a pushing ox, knowing that he were wont [accustomed] to push, if he kill a man, then the Law ordains that the man shall die, or else to redeem himself with a sum of money; here the law ascended or descended: but if a man had willfully killed a man, that was praeceptum grave [a grave precept], the punishment neither ascended nor descended, but he was to die the death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explication of the Judicial Laws of Moses</cite>, pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ba957fe02" data-kw="">
<blockquote><p>The Law is natural to man. God has engraven it in his heart from creation (Rom 1:32; 2:14,15). When, a long time afterwards, God made and exhibited the two Tables of the Law, this was not to make a new law, but only to restore our first knowledge of the natural law which, because of the corruption of sin, was little by little becoming obliterated from the heart of man (Rom 7:8-9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (Focus Christian Ministries Trust, East Essex England, 1992)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>But concerning the first part (which lies in the power [of the Church] to decree or ordain), we have already declared above that God has received to Himself fully and entirely the right to prescribe laws pertaining to the conscience and that we should walk in them uprightly before God and man.</p></blockquote>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>

</figure><figure class="quote" id="q-88f912c2be" data-kw="">
<blockquote><p>It’s the Law of Nature in general that the whole rule the part, but it follows not [that] therefore every member is to submit to every positive law of the whole though most unjust; the member is to submit to every Law of Nature commanded by the whole: The little finger infected with a gangrene is to submit to the whole man that it be cut off for the safety of the whole body, but its against particular nature that it be cut off, but most suitable to universal nature [regarding the whole]. So in the general it’s natural for the creature-rational to obey the Creator; but it follows not, but it’s a mere positive law that Peter give his life for the Gospel when God by a positive command calls him to it; and the law-positive, if divine, is not contrary to the law of universal-nature [of the whole].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), p. 461</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

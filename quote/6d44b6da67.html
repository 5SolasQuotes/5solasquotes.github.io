<main class="wrap"><figure class="quote" id="q-6d44b6da67" data-kw="">
<blockquote><p>Second, He did not offer Himself for angels, because He is not the epilēptōr (ἐπιλήπτωρ), the undertaker and redeemer of angels (Heb. 2:16). Therefore, we think it imprudently said that Christ’s blood suffices to redeem demons (Cornelius Jansen, Augustinus, tome 3, p. 382). Third, Christ sanctified and offered Himself for the seed of Abraham, whose epilēptōr He is (Heb. 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 61, ‘On the Satisfaction of Christ’ in Sum of Theology (Geneva, 1665), trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Second, He did not offer Himself for angels, because He is not the epilēptōr (ἐπιλήπτωρ), the undertaker and redeemer of angels (Heb. 2:16). Therefore, we think it imprudently said that Christ’s blood suffices to redeem demons (Cornelius Jansen, Augustinus, tome 3, p. 382). Third, Christ sanctified and offered Himself for the seed of Abraham, whose epilēptōr He is (Heb. 2:16).”

— Johannes Coccejus, ch. 61, ‘On the Satisfaction of Christ’ in Sum of Theology (Geneva, 1665), trans. AI at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecond%2C+He+did+not+offer+Himself+for+angels%2C+because+He+is+not+the+epil%C4%93pt%C5%8Dr+%28%E1%BC%90%CF%80%CE%B9%CE%BB%CE%AE%CF%80%CF%84%CF%89%CF%81%29%2C+the+undertaker+and+redeemer+of+angels+%28Heb.+2%3A16%29.+Therefore%2C+we+think+it+imprudently+said+that+Christ%E2%80%99s+blood+suffices+to+redeem+demons+%28Cornelius+Jansen%2C+Augustinus%2C+tome+3%2C+p.+382%29.+Third%2C+Christ+sanctified+and+offered+Himself+for+the+seed+of+Abraham%2C+whose+epil%C4%93pt%C5%8Dr+He+is+%28Heb.+2%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Johannes+Coccejus%2C+ch.+61%2C+%E2%80%98On+the+Satisfaction+of+Christ%E2%80%99+in+Sum+of+Theology+%28Geneva%2C+1665%29%2C+trans.+AI+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d44b6da67.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d44b6da67.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=Second%2C%20He%20did%20not%20offer%20Himself,whose%20epil%C4%93pt%C5%8Dr%20He%20is%20%28Heb.%202%3A16&amp;text=Second%2C%20He%20did%20not%20offer%20Himself%20for%20angels&amp;text=of%20Abraham%2C%20whose%20epil%C4%93pt%C5%8Dr%20He%20is%20%28Heb.%202%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed9d4ca90e" data-kw="">
<blockquote><p>Answer: You are neither to lay such a supposition down that either you are excluded from the number of those that Christ died for or included in that number: neither of the two are revealed to you, and secret things belong to the Lord. It is enough to you that: 1. you are not excluded, for anything that is revealed to you.

2. That thou have need of Christ, and are a guilty sinner.

3. That thou art commanded to believe: As for Christ’s not shedding of his blood for thee; say it were so: it’s no more absurd that you are obliged to believe on Christ as an all sufficient Redeemer for remission of sins (though remission be not purchased to you in Christ’s blood)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 445</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>…for, notwithstanding all their pretences, it will appear that they [of the opposite opinion] hang the whole weight of their building on three or four texts of Scripture— namely, 1 Tim. 2:5-6; Jn. 3:16-17; Heb. 2:9; 1 Jn. 2:2, with some few others [e.g. Jn. 1:29; 1 Tim. 4:10; 2 Pet. 2:1]— and the ambiguity of two or three words, which themselves cannot deny to be of exceeding various acceptations.</p></blockquote>

<blockquote><p>[Jonathan] Rainbow convinces me that Gottshalk [of Orbais, c.803-868] and [Martin] Bucer [1491-1551] (in debates with Anabaptists) taught limited atonement before Calvin. I must modify my judgment, therefore, and argue that limited/unlimited atonement was not a debated issue within reformed circles until the time of Calvin’s successor, [Theodore] Beza. I thus agree with Robert Letham that the extent of the atonement ‘only became a major issue in the next generation’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-a-peterson.html">Robert A. Peterson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin &amp; the Atonement</cite>, (Mentor, 1999), pp. 115-120</span></figcaption>

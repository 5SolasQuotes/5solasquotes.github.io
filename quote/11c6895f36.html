<blockquote><p>PROPOSITION VI

The life promised in the Covenant of works, is a life of glory in heaven: the promise is life, Gal. 3.12. The man that doth them, shall live in them; some have thought that Adam should have had only the continuance of that blessedness which he was created in, if he had kept the Covenant: it is very true, that there is no mention in the Covenant of his going to heaven: but we have clear ground to conclude from Scripture, that if man had stood, he should have gone to heaven; according to this promise:

1. Because hell, where the devils are, is the reward of disobedience by the covenant of works, therefore heaven, where the holy angels are, is the reward of Obedience: it is meet the rewards should be proportionable: I know it is answered, that sin deserves evil at God’s hands, but holiness which is due unto God does not deserve any rewards; but this does not take off the force of the argument: for it is by the Law that sin merits as well as holiness: and hence wicked men are punished only for such sins as they commit in this life, 2 Cor. 5.10. and there is as much goodness in holiness, as evil in sin; and it is a meet thing that God should bestow as much good in a way of obedience, as he inflicts evil in a way of disobedience: besides the Law expresses the punishment of sin by death Rom. 6.23. The wages of sin is death: and the reward of obedience by life. Gal. 3 12. the man that doth them shall live by them: therefore it is a life directly opposite to that death, a life that contains as much good … it, as that death doth evil: those terms do mutually explain one the other.

2. Because Christ in fulfilling of the law for us, has purchased life for us in heaven: Christ has purchased heaven for us, Eph. 1.14. it is called a purchased possession, and he did it by performing the righteousness of the Law for us: it is by making of us righteous that we come to have a title unto eternal life, Rom 5.21. Grace reigns by righteousness unto eternal life by Jesus Christ our Lord.

3. Because Christ tells the young man in the Gospel (that enquired of him what good thing he should do that he might have eternal life) that if he would enter into life he should keep the Commandments, Mat. 19.16, 17. where we may mind, that the life enquired after by the young man, was a life in Heaven; and that Christ in this answer is leading of him to the covenant of works, upon a design to convince him of his inability to keep it.

4. Because the Apostle Paul, gives that as the reason, that men cannot be justified by the Law, because they are sinners, Rom. 8.3. &amp; 3.20. the Legalists that Paul disputes against expected eternal life in heaven by their works, yet in all his disputes with them he never tells them that the covenant of works does not promise any such thing: if he could have told them so, that would clearly have cut off all their hopes: but he still shows that they can’t have Salvation by the Law upon this account, because they can’t fulfil it; yea he plainly implies that the reward by the Law and Gospel are the same, but the way of obtaining it is different, Rom. 4.4. He that worketh has the reward by debt, he that worketh not hath it by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied</cite>, (Boston MA: Samuel Phillips, 1687), pp 33-35.</span></figcaption>

<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>

<blockquote><p>God’s covenant, is his contract with man, concerning the obtaining of life eternal, upon a certain condition. This covenant consists of two parts: God’s promise to man, Man’s promise to God. God’s promise to man, is that, whereby he binds himself to man to be his God, if he perform the condition. Man’s promise to God, is that, whereby he vows his allegiance unto his Lord, and to perform the condition between them. Again, there are two kinds of this covenant. The covenant of works, and the covenant of grace. Jer. 31:31, 32, 33. “Behold the days come, says the Lord, that I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant, I made with their fathers, when I took them by the hand to bring them out of the land of Egypt; the which my covenant they brake, although I was an husband to them, saith the Lord. But this shall be the covenant, that I will make with the house of Israel: after those days, says the Lord, I will put my law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people.” The covenant of works, is Gods covenant, made with condition of perfect obedience, and is expressed in the moral law. The Moral Law, is that part of God’s word, which commands perfect obedience unto man, as well in his nature, as in his actions, and forbids the contrary. Romans 10. 5. “Moses thus describes the righteousness which is of the law, that the man which doth these things, shall live thereby.” 1. Timothy 1. 5. “The end of the commandment, is love out of a pure heart, and of a good conscience, and faith unfeigned.” Luke 16. 27. “You shalt love the Lord your God, with all your heart, with all your soul, and with all your strength.” Rom. 7. 14. “We know that the law is spiritual.” The Law has two parts. The Edict, commanding obedience, and the condition binding to obedience. The condition is eternal life to such as fulfill the law, but to transgressors, everlasting death. The Decalogue, or ten commandments, is an abridgement of the whole law, and the covenant of works. Exod. 34:27. And the Lord said unto Moses, Write these words, for after the tenor of these words, I have made a covenant with thee, and with Israel. And be was there with the Lord forty days and forty nights, and did neither eat bread, nor drink water, and he wrote in the tables the words of the covenant, even the ten commandments. 1. King. 8. 9. Nothing was in the Ark, save the two tables of stone, which Moses had put there at Horeb, where the Lord made a covenant with the children of Israel, when he brought them out of the land of Egypt. Mat. 22:40. “On these two commandments hangs the whole law and the prophets.</p></blockquote>

%E2%80%9CYou+shalt+love+the+Lord+your+God%2C+with+all+your+heart%2C+with+all+your+soul%2C+and+with+all+your+strength.%E2%80%9D+Rom.+7.+14.+%E2%80%9CWe+know+that+the+law+is+spiritual.%E2%80%9D+The+Law+has+two+parts.+The+Edict%2C+commanding+obedience%2C+and+the+condition+binding+to+obedience.+The+condition+is+eternal+life+to+such+as+fulfill+the+law%2C+but+to+transgressors%2C+everlasting+death.+The+Decalogue%2C+or+ten+commandments%2C+is+an+abridgement+of+the+whole+law%2C+and+the+covenant+of+works.+Exod.+34%3A27.+And+the+Lord+said+unto+Moses%2C+Write+these+words%2C+for+after+the+tenor+of+these+words%2C+I+have+made+a+covenant+with+thee%2C+and+with+Israel.+And+be+was+there+with+the+Lord+forty+days+and+forty+nights%2C+and+did+neither+eat+bread%2C+nor+drink+water%2C+and+he+wrote+in+the+tables+the+words+of+the+covenant%2C+even+the+ten+commandments.+1.+King.+8.+9.+Nothing+was+in+the+Ark%2C+save+the+two+tables+of+stone%2C+which+Moses+had+put+there+at+Horeb%2C+where+the+Lord+made+a+covenant+with+the+children+of+Israel%2C+when+he+brought+them+out+of+the+land+of+Egypt.+Mat.+22%3A40.+%E2%80%9COn+these+two+commandments+hangs+the+whole+law+and+the+prophets.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Golden+Chaine%2C+%28Cambridge%2C+1616%29%2C+32.+%5Bspelling+and+punctuation+updated&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16e5724eaa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16e5724eaa.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/william-perkins-on-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-c409fa3a46" data-kw="">
<blockquote><p>The Gospel admits of Repentance after our Falls, and restores us again to the Favour of God upon our true Humiliation: but the Law as a Covenant of Works, left no room for Repentance, but required perfect Obedience without the least Failure; and in case of Non-performance, nothing was to be expected but the Execution of that Death it threatened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-c9f03dff6b" data-kw="">
<blockquote><p>Thus also He made man with free will; and although ignorant of his future fall, yet therefore happy, because he thought it was in his own power both not to die and not to become miserable. And if he had willed by his own free will to continue in this state of uprightness and freedom from sin, assuredly without any experience of death and of unhappiness he would have received by the merit of that continuance the fulness of blessing with which the holy angels also are blessed; that is, the impossibility of falling any more, and the knowledge of this with absolute certainty. For even he himself could not be blessed although in Paradise, nay, he would not be there, where it would not become him to be miserable, if the foreknowledge of his fall had made him wretched with the dread of such a disaster.

But because he forsook God of his free will, he experienced the just judgment of God, that with his whole race, which being as yet all placed in him had sinned with him, he should be condemned. For as many of this race as are delivered by God’s grace are certainly delivered from the condemnation in which they are already held bound. Whence, even if none should be delivered, no one could justly blame the judgment of God. That, therefore, in comparison of those that perish few, but in their absolute number many, are delivered, is effected by grace, is effected freely: thanks must be given, because it is effected, so that no one may be lifted up as of his own deservings, but that every mouth may be stopped, and he that glorieth may glory in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Rebuke and Grace</cite>, (c. 427), 28 in Nicene and Post-Nicene Fathers 1, 5: 483.</span></figcaption>

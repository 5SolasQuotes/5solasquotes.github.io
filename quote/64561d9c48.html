<main class="wrap"><figure class="quote" id="q-64561d9c48" data-kw="">
<blockquote><p>First, if God and Joshua say that Achans offending in these things are troublers of the Common-wealth, how strongly is our great master Aristotle and his Scholars confuted that defend that wicked men may be good Commonwealth’s men, an Achan be a Joshua, a troubler, a saviour of it.

I confess if by good, they understand good accidentally, such good as God, and the State in which they live, may make good use of, I deny it not in that sense, so may God and his people make good use of Plague, Famine, or the Sword, yet are they not formally good, but destructive to the Common-wealth; even so all offenders in the accursed thing are formally as great evils to the Church and Common-wealth where they live, as these evils are, for they cause God to send these and many more, and also turn away his favour from it.

Could Achan have spoken as well as Turtullus; had he known the Law as well as Moses; had he kept as great a House in his Country, and spent as much provision, as Solomon did in Jerusalem, yet had not the Wedge of Gold in his tent, and the Babylonish Garment on his back, been greater evils to the State, then the other good things could have recompensed? so though a man be a deep Scholar, an eloquent speaker, skilful in the Laws of his Country, a bountiful House-keeper, yet himself an Achan, a Blasphemer, an enemy to the power of Religion, a friend or a better to wickedness or have the accursed Wedge of Gold, by oppression, simony, extortion, or bribery in his Tent, he is no good Commonwealth’s man, but an Achan, and a troubler of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-fairclough.html">Samuel Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The troublers troubled, or, Achan condemned and executed. A sermon preached before sundry of the honourable House of Commons at Westminster, April 4, 1641</cite>, (London: Henry Overton, 1641), pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d902ff6ba" data-kw="">
<blockquote><p>…it appears to me that no objection can be made to admitting into the consistory officers of justice and chiefs of police, provided they sit in it in the capacity of magistrates. But always let there be a due distinction observed between the two functions and conditions. To exclude persons that belong to the civil government from all superintendence in the spiritual administration, seems to me contrary to reason. What is essential is that when fitting persons shall have been elected to such an office, there should be no blending of their functions, nor the power of the sword confounded with what ought to be carefully kept distinct from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters, #620</cite>, (1562)</span></figcaption>

</figure><figure class="quote" id="q-a9aceb5085" data-kw="">
<blockquote><p>Nay suppose some should so extol the fullness and sufficiency of the Scriptures that they should hold them so perfect and sufficient for all Christians as to be a perfect rule for all civil government, and that Chrstian commonwealths ought to be governed by laws only there recorded and by no other (which opinion in substance Carolostadius held; that in courts of justice judges should not proceed according to humane laws, but according to the law of Moses; and so for military practices, should hold all the way of war must be founded upon the Scriptures, and thereupon should clamor against any other art and way of war than what was practised there. What would you reply to these men, or what strength were there in such principles? Would not you answer them in what sense the Scriptures were perfect, and how they must understand it?</p></blockquote>

<blockquote><p>The next debate of this nature and kind that fell in was, first, about accepting the [civil] indulgence, then about hearing indulged ministers. As to the first, this made no schism, so long as ministers held their debates among themselves. Some accepted, some not. Those who accepted preached in those parishes where they were indulged; others elsewhere, and sometimes there with them. The indulged ministers also preached elsewhere as they had occasion and access, but thought it not duty to offend the magistrate in breaking confinement to go unnecessarily elsewhere to preach, and thereby hazard the peaceable public exercise of their ministry, which was all they acknowledged they held of the magistrate… neither thought they the keeping of their confinement, though unjustly imposed, a sin, but rather suffering on their part.</p></blockquote>

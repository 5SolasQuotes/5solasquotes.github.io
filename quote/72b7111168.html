<main class="wrap"><figure class="quote" id="q-72b7111168" data-kw="" data-pol="rome">
<blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>An Advertisement to all Favorers of the Roman Religion</cite></figcaption>

</figure><figure class="quote" id="q-8f9e8de841" data-kw="" data-pol="rome">
<blockquote><p>If that law demands perfect conformity to the image of God, then these impulses of evil are clearly sinful. … The Protestant doctrine which pronounces these impulsive acts to be of the nature of sin is confirmed by the consciousness of the believer. He recognizes as evil in their own nature the first risings of malice, envy, pride, or cupidity.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 2, pt. 2, ch. 8</figcaption>

</figure><figure class="quote" id="q-1b3756b939" data-kw="" data-pol="">
<blockquote><p>The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence.</p></blockquote>
<figcaption>— <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, 4.3.21</figcaption>

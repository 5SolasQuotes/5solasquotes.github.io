<blockquote><p>How long Lord shall the wickedness and fury of Idolatry, of superstitions, and of the ignorance of the scriptures range abroad on the earth? How long Lord shall thy holy Gospel be trodden under foot? We in deed have sinned, we have been rebellious against thee, and have not harkened unto thy words, for which cause we are justly, and for our evil desert, thus daily put to confusion and shame. But thou O Lord our God are most just in all thy works. But on the other side Lord, for as much as it belongeth to thy clemency and constancy, to have mercy, to spare, and most faithfully to keep thy covenants and promises, how long Lord? how long wilt thou be angry unto the end? Remember not our iniquities of old.

Wherefore we beseech thee, that for as much as in these last times, thou hast by pouring abroad thy plenteous light, (and that being most mighty,) vouchsafed to make manifest unto men which lay in darkness, yea more then palpable darkness, the secrets of thy truth: thou wouldest once at the length turn away thy wrath and fury from our ingrate minds, and from the most grievous sins, whereby we have laid forth thy most holy name, and the pure doctrine which we profess, to evil speakings and to blasphemies. And deliver thy congregation from the contumelies and oppressions of the wicked, which doubtless light not only upon us, but also upon the majesty of thy name.

Although thou of thine own nature be … untouchable, and not able to be hurt. Illuminate O most loving Christ, thy face upon the Church redeemed with thy blood, which is now in a manner utterly left desolate. Thy name only, and not any other man’s name, we call upon, not undoubtedly trusting to any our own righteousness, but to thy goodness only and mercy, that thou wouldest either appoint an end or measure of those evils, and lenify the vexation wherewith we together with our brethren are afflicted, or that thou wouldest at the least vouchsafe to give unto the hearts of thine, such faith and constancy, that they fall not away from the profession of true piety, yea rather that they may so nobly and valiantly behave themselves, that by their exile, imprisonment, poverty, ignominy, sword, fire, and how cruel so ever kind of death it be, the lively knowledge of thy gospel may more and more shine forth, and be made more manifest to the whole world.</p></blockquote>

<blockquote><p>The grand case of the Christian world is, What is the true center and rule of concord? Could they find out this, it would hold men of various tempers to it.

I. Christ first laid down the description and measure of Christianity: In the baptismal Covenant; and ordained that all should be accounted Christians in foro Ecclesiae who by baptism were solemnly devoted to Him, in a professed belief and Covenant, dedication and vow to God the Father, Son and Holy Ghost: These he would have called Christians or his disciples, and this is their Christening, and so ever called in the Church.

      2. And next He made it his new (that is Last) and Great Command that all his disciples should love each other [Jn. 13:34], and live in eminent unity and peace [Acts 2:41-47]: which He accordingly wrought them to by the first pouring out of his Spirit, Acts 2-4.

II. The apostles founding the Church in this baptismal vow or Covenant and mutual love, exhorted accordingly all the baptized to love each other, and to receive even the weak in faith, but not to doubtful disputations, Rom. 14-15, oft vehemently charging them to be of one mind [Phil. 2] and live in love and peace [2 Cor. 13:11; Gal. 5:22; Eph. 6:23; 1 Thess. 5:13; Jude 1:2], and to beware of them as not serving Christ but their own bellies [Phil. 3:19], who were for divisions, 1 Cor. 1:10-11; Rom. 16:17. And though they came with pretences of order, wisdom or piety, such good words and fair speeches were noted to be engines to deceive the hearts of the simple, Rom. 16:17[-18]. And whereas the objection seemed unanswerable: How can they so agree, who are of several judgements about good and evil? Paul often warns them to hold fast the form of sound words, and sums up (as 1 Cor. 15:1-4) the articles of their Faith, and charges them that so far as they had attained, they should walk by the same rule, and mind the same things, and if in any thing they were otherwise minded, stay till God revealed the matter to them, Phil. 3[:15-16]. He oft charges them to be of one mind and judgement (thus far) and to live in love and peace, and to do nothing by strife and vain glory, but in honor to prefer others to themselves [Rom. 12:10]; and not to strive about words that profit not [2 Tim. 2:14], nor about unnecessary questions, seeing such disputings and strivings gender to ungodliness [1 Tim. 1:4; 6:4; 2 Tim. 2:23], and fret like a canker, and pervert the hearers minds: Yea he directs the pastors to edify souls rather by a teaching than a disputing way [Rom. 14:1; Phil. 2:14; 1 Tim. 6:5], and to convince gainsayers, by meek instructing opposers, to see if thus God will give them repentance to the acknowledgement of the truth [2 Tim. 2:25]: for the minister or servant of the Lord must not strive [2 Tim. 2:24]; Love is their work to be effected in others, and love must be their principle, and love must be their mode and means, even loving others as themselves: Oft are they called by Christ and his apostles from masterly opinions, aspirings and endeavors, and to be as little children [Mt. 18:3-4]; and the servants of all, and as stewards of Gods mysteries and helpers, not lords of the Church’s faith, and not to domineer over the flock of Christ, but to oversee them not by constraint but voluntarily: And what cannot be done by light and love, is not to be done by them at all: The magistrate and not they, must use the sword; but not to make men believers (for he cannot). … And the certain truth is, that he knows neither the interest nor the ignorance and weakness of man, nor the nature of knowledge, who does not know that the frailty and employments of mankind are such as that there never will be an universal concord in very many, or uncertain, unnecessary things; And O that I could write it on all men’s hearts, or doors at least, that the Christian world will never have concord but in a few, certain, necessary things. Therefore Paul said to the Corinthians, 2 Cor. 11:2-3: ‘I am jealous of you with godly jealousy: For I have espoused you to one husband, etc. But I fear lest by any means, as the Serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in (or towards) Christ.’ O mark these words all ye contentious Church-tyrants, dogmatists and superstitious ones. Read and study them well. God laid down the terms of the Church’s concord in seven unities:

      1. One Body or Church-catholic; [Eph. 4:4]

      2. One Spirit or Holy Ghost, as the soul of that Church; [Eph. 4:4]

      3. One hope, or heavenly felicity hoped for; [Eph. 4:4]

      4. One Lord of the Church, our Head and Savior; [Eph. 4:5]

      5. One Faith, or creed, or symbol of our belief, and belief thereof; [Eph. 4:5]

      6. One baptismal Covenant; [Eph. 4:5]

      7. And one God and Father of us all [Eph. 4:6], who is above all, through all and in us all. Eph. 4:3-6. And it is the unity of the Spirit in the bond of peace, that on these terms we are charged to keep, [Eph. 4] vv. 2-3, with all lowliness and meekness, with long-suffering, forbearing one another in love. [Eph. 4:2] But now [in 2 Cor. 11:3] comes the Serpent (note 1. the author) and by subtilty (2. note the means) even as he beguiled Eve (3. Note the precedent) which was by promising her more knowledge and exaltation to be as God; and he corrupts men’s minds, (4. mark the effect), though it is knowledge and advancement of mind that he promises and pretends: Even by drawing them (as to higher Power, Knowlege or Holiness) from the Christian simplicity (5. mark what the corruption of religion is). And what is this Christian Simplicity which they forsake, and how are they thus corrupted from it?…</p></blockquote>

Paul+often+warns+them+to+hold+fast+the+form+of+sound+words%2C+and+sums+up+%28as+1+Cor.+15%3A1-4%29+the+articles+of+their+Faith%2C+and+charges+them+that+so+far+as+they+had+attained%2C+they+should+walk+by+the+same+rule%2C+and+mind+the+same+things%2C+and+if+in+any+thing+they+were+otherwise+minded%2C+stay+till+God+revealed+the+matter+to+them%2C+Phil.+3%5B%3A15-16%5D.+He+oft+charges+them+to+be+of+one+mind+and+judgement+%28thus+far%29+and+to+live+in+love+and+peace%2C+and+to+do+nothing+by+strife+and+vain+glory%2C+but+in+honor+to+prefer+others+to+themselves+%5BRom.+12%3A10%5D%3B+and+not+to+strive+about+words+that+profit+not+%5B2+Tim.+2%3A14%5D%2C+nor+about+unnecessary+questions%2C+seeing+such+disputings+and+strivings+gender+to+ungodliness+%5B1+Tim.+1%3A4%3B+6%3A4%3B+2+Tim.+2%3A23%5D%2C+and+fret+like+a+canker%2C+and+pervert+the+hearers+minds%3A+Yea+he+directs+the+pastors+to+edify+souls+rather+by+a+teaching+than+a+disputing+way+%5BRom.+14%3A1%3B+Phil.+2%3A14%3B+1+Tim.+6%3A5%5D%2C+and+to+convince+gainsayers%2C+by+meek+instructing+opposers%2C+to+see+if+thus+God+will+give+them+repentance+to+the+acknowledgement+of+the+truth+%5B2+Tim.+2%3A25%5D%3A+for+the+minister+or+servant+of+the+Lord+must+not+strive+%5B2+Tim.+2%3A24%5D%3B+Love+is+their+work+to+be+effected+in+others%2C+and+love+must+be+their+principle%2C+and+love+must+be+their+mode+and+means%2C+even+loving+others+as+themselves%3A+Oft+are+they+called+by+Christ+and+his+apostles+from+masterly+opinions%2C+aspirings+and+endeavors%2C+and+to+be+as+little+children+%5BMt.+18%3A3-4%5D%3B+and+the+servants+of+all%2C+and+as+stewards+of+Gods+mysteries+and+helpers%2C+not+lords+of+the+Church%E2%80%99s+faith%2C+and+not+to+domineer+over+the+flock+of+Christ%2C+but+to+oversee+them+not+by+constraint+but+voluntarily%3A+And+what+cannot+be+done+by+light+and+love%2C+is+not+to+be+done+by+them+at+all%3A+The+magistrate+and+not+they%2C+must+use+the+sword%3B+but+not+to+make+men+believers+%28for+he+cannot%29.+%E2%80%A6+And+the+certain+truth+is%2C+that+he+knows+neither+the+interest+nor+the+ignorance+and+weakness+of+man%2C+nor+the+nature+of+knowledge%2C+who+does+not+know+that+the+frailty+and+employments+of+mankind+are+such+as+that+there+never+will+be+an+universal+concord+in+very+many%2C+or+uncertain%2C+unnecessary+things%3B+And+O+that+I+could+write+it+on+all+men%E2%80%99s+hearts%2C+or+doors+at+least%2C+that+the+Christian+world+will+never+have+concord+but+in+a+few%2C+certain%2C+necessary+things.+Therefore+Paul+said+to+the+Corinthians%2C+2+Cor.+11%3A2-3%3A+%E2%80%98I+am+jealous+of+you+with+godly+jealousy%3A+For+I+have+espoused+you+to+one+husband%2C+etc.+But+I+fear+lest+by+any+means%2C+as+the+Serpent+beguiled+Eve+through+his+subtilty%2C+so+your+minds+should+be+corrupted+from+the+simplicity+that+is+in+%28or+towards%29+Christ.%E2%80%99+O+mark+these+words+all+ye+contentious+Church-tyrants%2C+dogmatists+and+superstitious+ones.+Read+and+study+them+well.+God+laid+down+the+terms+of+the+Church%E2%80%99s+concord+in+seven+unities%3A%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A01.+One+Body+or+Church-catholic%3B+%5BEph.+4%3A4%5D%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A02.+One+Spirit+or+Holy+Ghost%2C+as+the+soul+of+that+Church%3B+%5BEph.+4%3A4%5D%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A03.+One+hope%2C+or+heavenly+felicity+hoped+for%3B+%5BEph.+4%3A4%5D%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A04.+One+Lord+of+the+Church%2C+our+Head+and+Savior%3B+%5BEph.+4%3A5%5D%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A05.+One+Faith%2C+or+creed%2C+or+symbol+of+our+belief%2C+and+belief+thereof%3B+%5BEph.+4%3A5%5D%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A06.+One+baptismal+Covenant%3B+%5BEph.+4%3A5%5D%0A%0A%C2%A0%C2%A0%C2%A0%C2%A0%C2%A0%C2%A07.+And+one+God+and+Father+of+us+all+%5BEph.+4%3A6%5D%2C+who+is+above+all%2C+through+all+and+in+us+all.+Eph.+4%3A3-6.+And+it+is+the+unity+of+the+Spirit+in+the+bond+of+peace%2C+that+on+these+terms+we+are+charged+to+keep%2C+%5BEph.+4%5D+vv.+2-3%2C+with+all+lowliness+and+meekness%2C+with+long-suffering%2C+forbearing+one+another+in+love.+%5BEph.+4%3A2%5D+But+now+%5Bin+2+Cor.+11%3A3%5D+comes+the+Serpent+%28note+1.+the+author%29+and+by+subtilty+%282.+note+the+means%29+even+as+he+beguiled+Eve+%283.+Note+the+precedent%29+which+was+by+promising+her+more+knowledge+and+exaltation+to+be+as+God%3B+and+he+corrupts+men%E2%80%99s+minds%2C+%284.+mark+the+effect%29%2C+though+it+is+knowledge+and+advancement+of+mind+that+he+promises+and+pretends%3A+Even+by+drawing+them+%28as+to+higher+Power%2C+Knowlege+or+Holiness%29+from+the+Christian+simplicity+%285.+mark+what+the+corruption+of+religion+is%29.+And+what+is+this+Christian+Simplicity+which+they+forsake%2C+and+how+are+they+thus+corrupted+from+it%3F%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+Plain%2C+Pure%2C+Peaceable%2C+...+%28London%3A+White%2C+1675%29%2C+Preface%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb6907d429d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b6907d429d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=The%20grand%20case%20of%20the%20Christian,are%20they%20thus%20corrupted%20from%20it&amp;text=The%20grand%20case%20of%20the%20Christian%20world%20is&amp;text=and%20how%20are%20they%20thus%20corrupted%20from%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation…

3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty…

4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice…

5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful…

6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing, and we are not only to shun that which gives scandal, but also that whereupon follows a scandal taken, whatsoever it be, if it be not necessary. This is so evident, that Papists themselves subscribe to it, for both Cardinal Cajetan and Dominicus Bannes say that we should abstain even spiritualibus non necessariis [non-necessary spiritual things] when scandal rises out of them. … XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious; and from things that are not necessary, we ought to abstain for the scandal of the malicious as well as for the scandal of the weak.</p></blockquote>

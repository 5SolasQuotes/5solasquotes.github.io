<main class="wrap"><figure class="quote" id="q-7a17240b97" data-kw="">
<blockquote><p>For it is of the nature of the finite that there is absolutely no proportion between it and the infinite, neither is the former able to be equal to the latter. And so, while on the one hand the perfections cognizable in God are infinite in every way, but on the other hand the cognizing ability in every creature is finite; certainly those perfections will leave behind them by the greatest distance whatever cogitations of the creature, neither will they be understood fully and perfectly even by the comprehension of all creatures together. To such an extent God is truly Incomprehensible to every created mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 10, pp 99-100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>
<div class="actions"><button class="copy" data-copy="“For it is of the nature of the finite that there is absolutely no proportion between it and the infinite, neither is the former able to be equal to the latter. And so, while on the one hand the perfections cognizable in God are infinite in every way, but on the other hand the cognizing ability in every creature is finite; certainly those perfections will leave behind them by the greatest distance whatever cogitations of the creature, neither will they be understood fully and perfectly even by the comprehension of all creatures together. To such an extent God is truly Incomprehensible to every created mind.”

</figure><figure class="quote" id="q-da8941acdb" data-kw="">
<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seems not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God, as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-7e97b3d5a5" data-kw="">
<blockquote><p>A dispute arises whether freedom is compatible with necessity (that is, unchangeableness and sempiternity) of this act in which God loves himself. According to Scotus, the act is spontaneous and proceeds not by way of nature but freely, that is, [logically] after intellection-cognition. But if anyone can grasp this, let him do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, p. 101 Wolter was a Scotus scholar.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

<main class="wrap"><figure class="quote" id="q-fd11d9c75c" data-kw="">
<blockquote><p>There is no composition in God, neither Physical, nor Logical, nor Metaphysical; because in him there is no priority nor posteriority, as in composition where the compositum is posterior to the parts compounding.

2. In composition there is act and possibility; but God is all act.

3. In composition the parts differ from the compositum; but in God there is no difference.

4. There is no composition in form; but God is a most simple form.

5. Whatsoever is compounded hath a cause of that composition; but in God there is no cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 17n.</span></figcaption>

<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (Herder Book Co., 1950), ch. 10, God’s Will &amp; God’s Love, pp. 104-5</span></figcaption>

<blockquote><p>Question 1: Whether law [jus], and the decree of law, or the command [jussio] of God, is God Himself? Affirmed with a distinction. Answer: Concerning the decree, as it is regarded on the part of God, or actively: affirmed; as it is regarded on the part of the decreed thing, or passively or terminatively: denied. Concerning law [jus], which in Greek [is] δικαίωμα [ordinance / righteous requirement], Rom. 1:32, insofar as it is equivalent to the power of God: affirmed. Not otherwise than as we have established that God’s blessedness, glory, majesty do not really differ from Himself. The word ‘command’ [jussio], insofar as it denotes the same thing which the words ‘mandate,’ ‘precept,’ or ‘order’ [signify], properly signifies the effect of the divine will, but not the will of God itself; consequently the command or thing-commanded of God is not God Himself: in the way that the law of God is not God Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669), pp. 48-136 tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-a299149450" data-kw="">
<blockquote><p>God is said to be powerful, because he can do more then he will: he could of stones have raised children to Abraham, but he would not; and when our blessed Lord was apprehended, he tells Peter, that he could have obtained of his Father, more then twelve legions of Angels to help him, but he would not: He can do more then he will, but he will not do all that he can.

It meets with those that deny this to God: Plinius Secundus [Pliny the Elder] saith, God is not Almighty, because he cannot lie nor deceive: Ludovicus Vives [Juan Luis Vives] wonders at this, saying, I admire that a man so wise should cavil at God’s power; but Saint Augustine answers him well, and saith, therefore is God omnipotent, because he cannot he nor deceive, for these argue impotency.

Secondly, it confutes others, who say God is not so powerful as the Scripture makes him to be, because he cannot make a thing to be against its nature, as to bee, and not to be: to whom I answer, things which in their nature are simply impossible (with reverence be it spoken) God cannot do; but all other things, though impossible to created nature, God can do; therefore this vain objection doth not disparage God’s power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/josiah-shute.html">Josiah Shute</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Cordials: Delivered in ten sermons, upon part of the ninth and tenth chapters of Ezra, in a time of visitation. By that godly and faithful preacher of God’s Word, Josiah Shute, B.D. and late rector of Mary Woolnoth’s in Lumbard-Street London</cite>, (London: Robert Bostock, 1644), pp 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

It meets with those that deny this to God: Plinius Secundus [Pliny the Elder] saith, God is not Almighty, because he cannot lie nor deceive: Ludovicus Vives [Juan Luis Vives] wonders at this, saying, I admire that a man so wise should cavil at God’s power; but Saint Augustine answers him well, and saith, therefore is God omnipotent, because he cannot he nor deceive, for these argue impotency.

Secondly, it confutes others, who say God is not so powerful as the Scripture makes him to be, because he cannot make a thing to be against its nature, as to bee, and not to be: to whom I answer, things which in their nature are simply impossible (with reverence be it spoken) God cannot do; but all other things, though impossible to created nature, God can do; therefore this vain objection doth not disparage God’s power.”

— Josiah Shute, Divine Cordials: Delivered in ten sermons, upon part of the ninth and tenth chapters of Ezra, in a time of visitation. By that godly and faithful preacher of God’s Word, Josiah Shute, B.D. and late rector of Mary Woolnoth’s in Lumbard-Street London, (London: Robert Bostock, 1644), pp 60-61.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+is+said+to+be+powerful%2C+because+he+can+do+more+then+he+will%3A+he+could+of+stones+have+raised+children+to+Abraham%2C+but+he+would+not%3B+and+when+our+blessed+Lord+was+apprehended%2C+he+tells+Peter%2C+that+he+could+have+obtained+of+his+Father%2C+more+then+twelve+legions+of+Angels+to+help+him%2C+but+he+would+not%3A+He+can+do+more+then+he+will%2C+but+he+will+not+do+all+that+he+can.%0A%0AIt+meets+with+those+that+deny+this+to+God%3A+Plinius+Secundus+%5BPliny+the+Elder%5D+saith%2C+God+is+not+Almighty%2C+because+he+cannot+lie+nor+deceive%3A+Ludovicus+Vives+%5BJuan+Luis+Vives%5D+wonders+at+this%2C+saying%2C+I+admire+that+a+man+so+wise+should+cavil+at+God%E2%80%99s+power%3B+but+Saint+Augustine+answers+him+well%2C+and+saith%2C+therefore+is+God+omnipotent%2C+because+he+cannot+he+nor+deceive%2C+for+these+argue+impotency.%0A%0ASecondly%2C+it+confutes+others%2C+who+say+God+is+not+so+powerful+as+the+Scripture+makes+him+to+be%2C+because+he+cannot+make+a+thing+to+be+against+its+nature%2C+as+to+bee%2C+and+not+to+be%3A+to+whom+I+answer%2C+things+which+in+their+nature+are+simply+impossible+%28with+reverence+be+it+spoken%29+God+cannot+do%3B+but+all+other+things%2C+though+impossible+to+created+nature%2C+God+can+do%3B+therefore+this+vain+objection+doth+not+disparage+God%E2%80%99s+power.%E2%80%9D%0A%0A%E2%80%94+Josiah+Shute%2C+Divine+Cordials%3A+Delivered+in+ten+sermons%2C+upon+part+of+the+ninth+and+tenth+chapters+of+Ezra%2C+in+a+time+of+visitation.+By+that+godly+and+faithful+preacher+of+God%E2%80%99s+Word%2C+Josiah+Shute%2C+B.D.+and+late+rector+of+Mary+Woolnoth%E2%80%99s+in+Lumbard-Street+London%2C+%28Lon

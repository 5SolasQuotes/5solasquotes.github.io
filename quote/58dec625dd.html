<blockquote><p>The New Testament Non-Liturgical It is scarcely necessary to say to those with whom we are specially concerned in this discussion, that there is not, in the New Testament, the slightest trace of any of the elements of a liturgy, as we have limited the word [as that ‘which prescribes written forms of prayer to be recited, in whole or in part, by the congregation, in unison or alternation with the minister; which provides for responsive readings of the Scriptures’]… … The only thing that looks like an oral response from the people in the worship of the apostolic churches, is found in the ‘Amen’ of 1 Cor. 14:16. It was the custom in the Jewish synagogue for the people to respond to the prayers by audibly saying ‘Amen’; and it would seem that this had passed over into the Christian congregations. Paul’s reference to the practice seems to be an endorsement of it. … But the responsive element in the prayers or in the reading of the Psalter or any other portion of the divine Word, is utterly alien to the genius of the Presbyterian system, as it is exhibited in the history of the different branches of the Church, in the words of our Constitution, and in the decisions of our General Assembly. Observe the contrast between ch. 3 and ch. 4 of the [American] ‘Form of Government‘: ‘It is the duty of Christians to praise God by singing psalms or hymns publicly in the church as also privately in the family… The whole congregation should be furnished with books, and ought to join in this part of worship.’ That is the part of the service in which it is the prerogative of the people vocally to join… But ‘the reading of the Holy Scriptures in the congregation is a part of the public worship of God, and ought to be performed by the ministers and teachers.’ And while psalm and hymn books have always been provided and circulated, no forms of prayer have been, nor is there any intimation that the people are vocally to join in, or respond to, any part of them; and that form of prayer which all should be taught and know, and could recite, has been carefully excluded form our Directory. Hence the General Assembly of 1869 (Old School): ‘Resolved, that the practice of responsive reading of the Scriptures in the public worship of the sanctuary is unwise in itself, and especially dangerous in this day, when it becomes the Church to withstand the tendency, so strongly manifested in many places, to a liturgical and ritualistic service.’ Stronger still the reunited Assembly of 1874 declared: ‘That the practice of responsive service in the public worship of the sanctuary is without warrant in the New Testament, and is unwise and impolitic in view of its inevitable tendency to destroy uniformity in our mode of worship.’ [The American Presbyterian system from its inception has been characterized largely by worship being determined at the congregational level (contra historic presbyterianism). Since American presbyterianism has resisted any imposition of a necessary liturgy (such as in Anglicanism), any optional liturgy that the local church chooses to use, necessarily creates disrupts uniformity in worship throughout the churches, which is a hallmark of New Testament worship and that of the Reformation and Puritan eras.] And ‘the sessions of the churches are urged to preserve, in act and spirit, the simplicity indicated in the [American] ‘Directory for Worship’.’ The Assembly of 1882 did not contravene this. In answer to an overture ‘To prepare and publish a ‘Book of Forms’ for social and public worship, and for special occasions which shall be the authorized service book, to be used whenever a prescribed formula may be desired,’ it wisely said: ‘In view of the action of previous General Assemblies on this subject, and the liberty which belongs to each minister to avail himself of the Calvinistic or other ancient devotional forms of the Reformed churches, so far as may seem to him for edification, it is inexpedient for this General Assembly to make any special order in the premises.’ The responsive feature is not embraced in those ancient devotional forms of the Reformed churches. … Eutaxia [Good Order], which was published in 1855 by Dr. Charles Baird, is also cited on the side of the plea [for responsive readings]. But, as we understand Dr. Baird, he opposed the responses and showed conclusively that the Calvinistic Reformers and the Calvinistic Churches rejected them. He says that, ‘the Scriptural idea of public worship is clearly that of a service prescribed in its various parts and features, but free in the filling up of those general outlines.’ (p. 2) ‘It has been the wisdom of the Presbyterian Church to follow strictly the Scriptural and the apostolic method: imposing as duties only such acts and ordinances of worship as are of Divine appointment; and leaving in a great measure to individual choice the selection of words employed in their performance.’ (pp. 2-3) ‘While thus providing for the office of prayer [by the minister], our Reformer (Calvin) introduced also the regular practice of congregational singing [which had been absent from Romanism]… In a survey of the Calvinistic worship, this interesting feature of Psalmody must not be ommitted. It belongs peculiarly and characteristically to that worship. The Reformers of Switzerland and Scotland did not, as we often hear, deprive their ritual of a responsive and popular character. They did no more than separate the functions of minister and people into the distinct duties of reading and singing. The Psalms are the responsive part of Calvin’s Liturgy. These choral services [of the congregation] embodied the acts of adoration, praise and thanksgiving, which are scarcely noticed in the forms of prayer; while in the latter, the office of intercession, supplication, and teaching were assigned to the minister alone. The prayers, by constant use made familiar to the people, were to be followed silently or in subdued tones; the psalms and hymns [inspired Bible songs, and the Creed and Lord’s Prayer in verse] constituted their audible utterance in the sacred ministrations.’ (pp. 26-27) … The plea [for responsive readings] has been sheltered, too, under the name of Dr. Charles Hodge. The article which he wrote on the subject of ‘Presbyterian Liturgies’ can be found in the Princeton Review, [1855, July,] vol. 27, [Article 5,] pp. 445-467 [being a book review of Baird’s Eutaxia]. In it he said: ‘The Scriptures, which in all things outward conform to what is the inward product of the Spirit, do not prescribe any form of words to be used in the worship of God. There are no indications of the use of liturgies in the New Testament. There is no evidence of the prevalence of written forms during the first three centuries.’ [While, as noted above under the subsection on the early Church above on this webpage, in the 3rd century, four short verbal responses came into the Church’s worship, however they were, no doubt, known by memory, and not written. This is significant: Hodge’s statement is correct. One still, at that time, does not see a dependence upon written forms in worship, which greatly alters the character of worship, especially after hundreds of repetitions, as is the case in many churches today.] ‘The disposition to use written forms, as a general rule, decreases in proportion to the increase of intelligence and spirituality of the Church.’ But he thought it would be a good thing if ‘a book were compiled from the liturgies of Calvin, Knox, and of the Reformed churches, containing appropriate prayers, for ordinary public worship, for special occasions, as for times of sickness, declension, or public calamity, with forms for the administration of baptism, of the Lord’s Supper, for funerals and for marriage;’ ‘a collection of prayers for public worship of established character, sanctioned by long approbation of the people of God and by the authority of the Church; something sanctioned and not prescribed, as in the case of our Book of Psalms and Hymns.’ But he [Charles Hodge] declared: ‘We do not desire to see anything introduced which would render our public services less simple than they are at present, but merely that means should be taken that what is done should be done well.’ ‘There is a very great difference between the uniform and universal use of a form of prayer, and the preparation of forms to serve as models, and to be employed when no minister is present.’ And he was not a word in favor of responsive worship, nor do the works he commends contain that element. We can receive all that Dr. Hodge says in that article; but it is an abuse of his name to quote it in favor of the plea which we are resisting. … Arguments Against a Liturgy 1. The fact that not the slightest Scriptural authority can be pleaded for a liturgy should be conclusive in the mind of every true Presbyterian. Some indeed talk about a liturgical germ being fond in the Lord’s Prayer, and the baptismal form, and the communion ceremonial. But the development idea which will defend any of the historic liturgies on that ground, will justify the greatest Papal abuses in doctrine, government, and worship, as legitimately evolved from New Testament germs. Dr. Shields admits (‘Liturgia Expurgata‘, p. 27), that ‘the genius of presbytery the world over, cannot endure anything more stringent than a Directory or system of general rules and suggestions‘; and, p. 58: ‘the wise, generous spirit of our system will not allow the whole Church to be hampered with anything more than a Directory.‘ ‘It cannot be doubted,’ declares Dr. Charles Hodge (Princeton Review, 27, p. 456), ‘that the theory of Presbyterianism is opposed to the use of liturgies.’ Our Church… should authoritatively recognize and provide in the worship of its congregations nothing for which express Scriptural warrant cannot be produced. Its rule is, not to sanction what cannot positively be disproved from the Bible, but to sanction only what can be proved from it. Not the shred of proof for a liturgy can be found therein. …</p></blockquote>

reading+of+the+Holy+Scriptures+in+the+congregation+is+a+part+of+the+public+worship+of+God%2C+and+ought+to+be+performed+by+the+ministers+and+teachers.%E2%80%99+And+while+psalm+and+hymn+books+have+always+been+provided+and+circulated%2C+no+forms+of+prayer+have+been%2C+nor+is+there+any+intimation+that+the+people+are+vocally+to+join+in%2C+or+respond+to%2C+any+part+of+them%3B+and+that+form+of+prayer+which+all+should+be+taught+and+know%2C+and+could+recite%2C+has+been+carefully+excluded+form+our+Directory.+Hence+the+General+Assembly+of+1869+%28Old+School%29%3A+%E2%80%98Resolved%2C+that+the+practice+of+responsive+reading+of+the+Scriptures+in+the+public+worship+of+the+sanctuary+is+unwise+in+itself%2C+and+especially+dangerous+in+this+day%2C+when+it+becomes+the+Church+to+withstand+the+tendency%2C+so+strongly+manifested+in+many+places%2C+to+a+liturgical+and+ritualistic+service.%E2%80%99+Stronger+still+the+reunited+Assembly+of+1874+declared%3A+%E2%80%98That+the+practice+of+responsive+service+in+the+public+worship+of+the+sanctuary+is+without+warrant+in+the+New+Testament%2C+and+is+unwise+and+impolitic+in+view+of+its+inevitable+tendency+to+destroy+uniformity+in+our+mode+of+worship.%E2%80%99+%5BThe+American+Presbyterian+system+from+its+inception+has+been+characterized+largely+by+worship+being+determined+at+the+congregational+level+%28contra+historic+presbyterianism%29.+Since+American+presbyterianism+has+resisted+any+imposition+of+a+necessary+liturgy+%28such+as+in+Anglicanism%29%2C+any+optional+liturgy+that+the+local+church+chooses+to+use%2C+necessarily+creates+disrupts+uniformity+in+worship+throughout+the+churches%2C+which+is+a+hallmark+of+New+Testament+worship+and+that+of+the+Reformation+and+Puritan+eras.%5D+And+%E2%80%98the+sessions+of+the+churches+are+urged+to+preserve%2C+in+act+and+spirit%2C+the+simplicity+indicated+in+the+%5BAmerican%5D+%E2%80%98Directory+for+Worship%E2%80%99.%E2%80%99+The+Assembly+of+1882+did+not+contravene+this.+In+answer+to+an+overture+%E2%80%98To+prepare+and+publish+a+%E2%80%98Book+of+Forms%E2%80%99+for+social+and+public+worship%2C+and+for+special+occasions+which+shall+be+the+authorized+service+book%2C+to+be+used+whenever+a+prescribed+formula+may+be+desired%2C%E2%80%99+it+wisely+said%3A+%E2%80%98In+view+of+the+action+of+previous+General+Assemblies+on+this+subject%2C+and+the+liberty+which+belongs+to+each+minister+to+avail+himself+of+the+Calvinistic+or+other+ancient+devotional+forms+of+the+Reformed+churches%2C+so+far+as+may+seem+to+him+for+edification%2C+it+is+inexpedient+for+this+General+Assembly+to+make+any+special+order+in+the+premises.%E2%80%99+The+responsive+feature+is+not+embraced+in+those+ancient+devotional+forms+of+the+Reformed+churches.+%E2%80%A6+Eutaxia+%5BGood+Order%5D%2C+which+was+published+in+1855+by+Dr.+Charles+Baird%2C+is+also+cited+on+the+side+of+the+plea+%5Bfor+responsive+readings%5D.+But%2C+as+we+understand+Dr.+Baird%2C+he+opposed+the+responses+and+showed+conclusively+that+the+Calvinistic+Reformers+and+the+Calvinistic+Churches+rejected+them.+He+says+that%2C+%E2%80%98the+Scriptural+idea+of+public+worship+is+clearly+that+of+a+service+prescribed+in+its+various+parts+and+features%2C+but+free+in+the+filling+up+of+those+general+outlines.%E2%80%99+%28p.+2%29+%E2%80%98It+has+been+the+wisdom+of+the+Presbyterian+Church+to+follow+strictly+the+Scriptural+and+the+apostolic+method%3A+imposing+as+duties+only+such+acts+and+ordinances+of+worship+as+are+of+Divine+appointment%3B+and+leaving+in+a+great+measure+to+individual+choice+the+selection+of+words+employed+in+their+performance.%E2%80%99+%28pp.+2-3%29+%E2%80%98While+thus+providing+for+the+office+of+prayer+%5Bby+the+minister%5D%2C+our+Reformer+%28Calvin%29+introduced+also+the+regular+practice+of+congregational+singing+%5Bwhich+had+been+absent+from+Romanism%5D%E2%80%A6+In+a+survey+of+the+Calvinistic+worship%2C+this+interesting+feature+of+Psalmody+must+not+be+ommitted.+It+belongs+peculiarly+and+characteristically+to+that+worship.+The+Reformers+of+Switzerland+and+Scotland+did+not%2C+as+we+often+hear%2C+deprive+their+ritual+of+a+responsive+and+popular+character.+They+did+no+more+than+separate+the+functions+of+minister+and+people+into+the+distinct+duties+of+reading+and+singing.+The+Psalms+are+the+responsive+part+of+Calvin%E2%80%99s+Liturgy.+These+choral+services+%5Bof+the+congregation%5D+embodied+the+acts+of+adoration%2C+praise+and+thanksgiving%2C+which+are+scarcely+noticed+in+the+forms+of+prayer%3B+while+in+the+latter%2C+the+office+of+intercession%2C+supplication%2C+and+teaching+were+assigned+to+the+minister+alone.+The+prayers%2C+by+constant+use+made+familiar+to+the+people%2C+were+to+be+followed+silently+or+in+subdued+tones%3B+the+psalms+and+hymns+%5Binspired+Bible+songs%2C+and+the+Creed+and+Lord%E2%80%99s+Prayer+in+verse%5D+constituted+their+audible+utterance+in+the+sacred+ministrations.%E2%80%99+%28pp.+26-27%29+%E2%80%A6+The+plea+%5Bfor+responsive+readings%5D+has+been+sheltered%2C+too%2C+under+the+name+of+Dr.+Charles+Hodge.+The+article+which+he+wrote+on+the+subject+of+%E2%80%98Presbyterian+Liturgies%E2%80%99+can+be+found+in+the+Princeton+Review%2C+%5B1855%2C+July%2C%5D+vol.+27%2C+%5BArticle+5%2C%5D+pp.+445-467+%5Bbeing+a+book+review+of+Baird%E2%80%99s+Eutaxia%5D.+In+it+he+said%3A+%E2%80%98The+Scriptures%2C+which+in+all+things+outward+conform+to+what+is+the+inward+product+of+the+Spirit%2C+do+not+prescribe+any+form+of+words+to+be+used+in+the+worship+of+God.+There+are+no+indications+of+the+use+of+liturgies+in+the+New+Testament.+There+is+no+evidence+of+the+prevalence+of+written+forms+during+the+first+three+centuries.%E2%80%99+%5BWhile%2C+as+noted+above+under+the+subsection+on+the+early+Church+above+on+this+webpage%2C+in+the+3rd+century%2C+four+short+verbal+responses+came+into+the+Church%E2%80%99s+worship%2C+however+they+were%2C+no+doubt%2C+known+by+memory%2C+and+not+written.+This+is+significant%3A+Hodge%E2%80%99s+statement+is+correct.+One+still%2C+at+that+time%2C+does+not+see+a+dependence+upon+written+forms+in+worship%2C+which+greatly+alters+the+character+of+worship%2C+especially+after+hundreds+of+repetitions%2C+as+is+the+case+in+many+churches+today.%5D+%E2%80%98The+disposition+to+use+written+forms%2C+as+a+general+rule%2C+decreases+in+proportion+to+the+increase+of+intelligence+and+spirituality+of+the+Church.%E2%80%99+But+he+thought+it+would+be+a+good+thing+if+%E2%80%98a+book+were+compiled+from+the+liturgies+of+Calvin%2C+Knox%2C+and+of+the+Reformed+churches%2C+containing+appropriate+prayers%2C+for+ordinary+public+worship%2C+for+special+occasions%2C+as+for+times+of+sickness%2C+declension%2C+or+public+calamity%2C+with+forms+for+the+administration+of+baptism%2C+of+the+Lord%E2%80%99s+Supper%2C+for+funerals+and+for+marriage%3B%E2%80%99+%E2%80%98a+collection+of+prayers+for+public+worship+of+established+character%2C+sanctioned+by+long+approbation+of+the+people+of+God+and+by+the+authority+of+the+Church%3B+something+sanctioned+and+not+prescribed%2C+as+in+the+case+of+our+Book+of+Psalms+and+Hymns.%E2%80%99+But+he+%5BCharles+Hodge%5D+declared%3A+%E2%80%98We+do+not+desire+to+see+anything+introduced+which+would+render+our+public+services+less+simple+than+they+are+at+present%2C+but+merely+that+means+should+be+taken+that+what+is+done+should+be+done+well.%E2%80%99+%E2%80%98There+is+a+very+great+difference+between+the+uniform+and+universal+use+of+a+form+of+prayer%2C+and+the+preparation+of+forms+to+serve+as+models%2C+and+to+be+employed+when+no+minister+is+present.%E2%80%99+And+he+was+not+a+word+in+favor+of+responsive+worship%2C+nor+do+the+works+he+commends+contain+that+element.+We+can+receive+all+that+Dr.+Hodge+says+in+that+article%3B+but+it+is+an+abuse+of+his+name+to+quote+it+in+favor+of+the+plea+which+we+are+resisting.+%E2%80%A6+Arguments+Against+a+Liturgy+1.+The+fact+that+not+the+slightest+Scriptural+authority+can+be+pleaded+for+a+liturgy+should+be+conclusive+in+the+mind+of+every+true+Presbyterian.+Some+indeed+talk+about+a+liturgical+germ+being+fond+in+the+Lord%E2%80%99s+Prayer%2C+and+the+baptismal+form%2C+and+the+communion+ceremonial.+But+the+development+idea+which+will+defend+any+of+the+historic+liturgies+on+that+ground%2C+will+justify+the+greatest+Papal+abuses+in+doctrine%2C+government%2C+and+worship%2C+as+legitimately+evolved+from+New+Testament+germs.+Dr.+Shields+admits+%28%E2%80%98Liturgia+Expurgata%E2%80%98%2C+p.+27%29%2C+that+%E2%80%98the+genius+of+presbytery+the+world+over%2C+cannot+endure+anything+more+stringent+than+a+Directory+or+system+of+general+rules+and+suggestions%E2%80%98%3B+and%2C+p.+58%3A+%E2%80%98the+wise%2C+generous+spirit+of+our+system+will+not+allow+the+whole+Church+to+be+hampered+with+anything+more+than+a+Directory.%E2%80%98+%E2%80%98It+cannot+be+doubted%2C%E2%80%99+declares+Dr.+Charles+Hodge+%28Princeton+Review%2C+27%2C+p.+456%29%2C+%E2%80%98that+the+theory+of+Presbyterianism+is+opposed+to+the+use+of+liturgies.%E2%80%99+Our+Church%E2%80%A6+should+authoritatively+recognize+and+provide+in+the+worship+of+its+congregations+nothing+for+which+express+Scriptural+warrant+cannot+be+produced.+Its+rule+is%2C+not+to+sanction+what+cannot+positively+be+disproved+from+the+Bible%2C+but+to+sanction+only+what+can+be+proved+from+it.+Not+the+shred+of+proof+for+a+liturgy+can+be+found+therein.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+American+Presbyterianism%2C+Dr.+R.M.+Patterson%2C+%E2%80%98Presbyterian+Worship%E2%80%99%2C+Presbyterian+Review+%281883%29%2C+pp.+746+ff.%2C+756+ff%2C+769-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58dec625dd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58dec625dd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/responsive-readings/#:~:text=The%20New%20Testament%20Non%2DLiturgical,liturgy%20can%20be%20found%20therein.%20%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>That all the members of the catholic Church are united in this profession [of the Christian faith] is very true; but this is not all, they are bound to more than this, viz. to the exercise of the same specifical ordinances, to subjection to the same discipline, as also to love to one another, and where it is possible, to the celebrating together of the same numerical worship. And in any of these, to make any differences, is a breach of that union, that ought to be among the members of the catholic visible Church. … For when Christ has instituted that every church meeting together, and every member of the catholic Church, should exercise the same specifical ordinances, is not this a Church union, or union of Churches? And let it then be considered, that if every member of the Church catholic may be a member of any or every particular church, where providence may cast him (being rightly qualified thereunto), having right first to the same specifical ordinances as a member of the catholic, and then to the same numerical ordinances, where he comes and finds them (as some of his own way [that is congregationalism] do grant, and cannot well be denied), then the denial of such a person to join in those numerical ordinances [such as congregationalists practice] is a breach of that union and love which ought to be between the members of the catholic Church…</p></blockquote>

<blockquote><p>Another feature of the book [of Common Order, 1564] was that it was so framed as to make responsive worship impossible. The worshipper was to follow the continuous prayers with silent accord… At Frankfort [Germany] the signal for the outbreak of hostilities between the two parties was the loud responses of the Anglicans when a liturgy of compromise was read. The ground which Knox had taken up there, he was not likely to abandon in Scotland. His position would be that the people’s vocal part in divine service was the singing of Psalms; for the preface to the original Geneva Book says: ‘Prayers are after two manner of sorts, that is, either in words only or else with song joined thereunto.&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Another feature of the book [of Common Order, 1564] was that it was so framed as to make responsive worship impossible. The worshipper was to follow the continuous prayers with silent accord… At Frankfort [Germany] the signal for the outbreak of hostilities between the two parties was the loud responses of the Anglicans when a liturgy of compromise was read. The ground which Knox had taken up there, he was not likely to abandon in Scotland. His position would be that the people’s vocal part in divine service was the singing of Psalms; for the preface to the original Geneva Book says: ‘Prayers are after two manner of sorts, that is, either in words only or else with song joined thereunto.&#x27;”

<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a2863a5000" data-kw="Judge of controversies">
<blockquote><p>It is not necessary that there should be in the church any external infallible judge by whom controversies of faith may be solved. It suffices for believers, for the tranquility and rest of their consciences, that there is an interior or divine definitive judgment (namely, of Christ and the Holy Spirit speaking in the Scriptures). An external human judgment, infallible and definitive in the church, is neither necessary nor possible. Controversies do not belong to external order but to the mental judgment for which a judge is necessary to enlighten the mind and sanctify the will (which an external and human judge cannot do because he has no power over the conscience).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a> › <a href="../topics/rome/the-church/infallibility.html">Infallibility</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9307165a8" data-kw="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, Book I, ch. 2, p. 51</span></figcaption>

</figure><figure class="quote" id="q-47ac56c75b" data-kw="perspicuity">
<blockquote><p>The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>

</figure><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

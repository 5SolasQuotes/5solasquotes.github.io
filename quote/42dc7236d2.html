<main class="wrap"><figure class="quote" id="q-42dc7236d2" data-kw="">
<blockquote><p>Fourthly, the signs that difference a true Church from a false, do not primarily belong to a particular congregation, but to the Church-catholic-visible, viz. profession of the true faith, the administration of the true ordinances of God, the Word and sacraments; for therein all the whole Church agree, and is thereby distinguished from those that are without, not from those that are within. This is no note to know this or that particular church by, from another, for it is common to the universal Church, it distinguishes not among themselves, but from the general common opposite: the heathen, or the gross heretic. A man being lead into a vault where were the skulls of many dead men, and understanding that Alexander’s skull was there, desired his guide to show him that; his guide told him it was that skull with the hollow eye holes and with the gristly nose, and with futures crossing the brain pan, and when the man replied that they had all so, yea says his guide, there is no difference between kings and other men’s skulls when they are dead. So if any man should ask you or me which is the church of Ipswich, Dedham or Colchester, it were a folly to say it is the Church where the word of God is preached and sacraments administered, and that profess Jesus Christ to be crucified, dead and buried, risen again, and ascended into Heaven, for so do all the Church catholic, but I must give some other notes to distinguish any of them, for these are not distinctive, because common. Therefore the signs of the true Church belong primarily to the whole, secondarily to particular parts thereof, and are therefore not distinctive to the parts. That which is primary to any thing is distinctive to that thing, but that which is secondary and common is not distinctive from other particulars of the like kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, p. 29</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40b9e09dad" data-kw="">
<blockquote><p>14. I would willingly inquire of the Independents, to what church were added so many thousands that were baptized by the apostles and added unto the Church in one day? Whether to a particular congregation, or to a greater ecclesiastical consociation? It could not be to a particular congregation: 1. For the reasons I have already produced. 2. Because the apostles were not particular, but universal ministers, set over the universal militant Church; and therefore, in virtue of their charge, admitted them to be members of all the Churches, whereof they were ministers. 3. Because they were of diverse and sundry countries: neither is it credible that to be a member of the Church, they were bound to quit their countries and to stay at Jerusalem, howsoever so long as they did stay there, they might participate as well of all the rest of God’s ordinances, as of baptism: Ergo, they were added to some greater consociation, viz. to that, and to all those, whereof the apostles were ministers; for out of all doubt, the apostles who baptized them could not refuse to admit them unto the Lord’s Table wherever they celebrated the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations… (London, 1644), p. 92 Steuart (1591–1654) was a Scottish presbyterian, philosopher, controversialist and professor in both France and the Netherlands.</cite></span></figcaption>

</figure><figure class="quote" id="q-6cbd577fcb" data-kw="">
<blockquote><p>That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism Proved Against Dr. [John] Owen… (London, 1657), ch. 5</cite>, pp. 89-90</span></figcaption>

</figure><figure class="quote" id="q-b515383e4b" data-kw="">
<blockquote><p>We reject the opinion of those [English Independants and congregationalists] who think that in the Church none are to be admitted as members into the external fellowship of the Church, but such as have been by a strict examination first tried by other believers, or the elders of the Church, in the exercises of piety… and have manifested to them evident signs of regeneration: and have afterwards, before the whole body of the Church, publicly professed a sincere confession of faith; and have either by a continued speech, or by questions and answers, made manifest by evident signs the saving grace of God in them… and [are of] such a spirit that in a church covenant sincerely, faithfully, and godlily in the presence of God and the whole church, they both can and will walk in the ways of God. For we read not that in the apostolical Church this manner of admitting church members was in use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God (London: 1645), ch. 1, ‘Of the Qualification of Church-members’</cite>, pp. 10-11</span></figcaption>

</figure><figure class="quote" id="q-cf8d9e31f7" data-kw="">
<blockquote><p>Its a wide mistake that a presbyterian Church has its formal essence from a voluntary, actual combination in such bounds, or such a circuit more or less. That is not a pillar of presbyterian Churches. For their near association, by dwelling where they may edify or scandalize one another, gives them right to be an associated Church; not simply habitation, but the habitation of such and such professors in covenant with God, baptized and giving themselves up in profession to Christ as disciples, before there be a formal consent, they are obliged to associate: yea, nor does that voluntary combination make a presbyterial Church.</p></blockquote>

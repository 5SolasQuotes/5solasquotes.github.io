<main class="wrap"><figure class="quote" id="q-bbba4da196" data-kw="">
<blockquote><p>5. But there were some who held that Job was not someone who was in the nature of things, but that this was a parable made up to serve as a kind of theme to dispute providence, as men frequently invent cases to serve as a model for debate. Although it does not matter much for the intention of the book whether or not such is the case, it makes a difference for the truth itself.

This aforementioned opinion seems to contradict the authority of Scripture. In Ezekiel, the Lord is represented as saying, if there were three just men in our midst, Noah, Daniel, and Job, these would free your souls by their justice (Ezek 14:14). Clearly Noah and Daniel really were men in the nature of things, and so there should be no doubt about Job, who is the third man numbered with them. Also, James says, behold, we bless those who persevered. You have heard of the suffering of Job and you have seen the intention of the Lord (Jas 5:11). Therefore, one must believe that the man Job was a man in the nature of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositio super Iob ad Litteram</cite>, (1263-65), Pr. 5.</span></figcaption>

<blockquote><p>Secondly, God put into the soul these faculties, understanding, will, sense and appetite, which are naturally carried to things that are obvious and known, and not to things that are unknown and far removed. … Fifthly, God has put into every man, for his own preservation, a love of himself, which love is naturally good; but does then begin to be morally good, when it does accord[ing] to and help forward the love of God.</p></blockquote>

</figure><figure class="quote" id="q-9941f2c6bf" data-kw="">
<blockquote><p>Yet, although tyrants desire this very benefit of friendship, they cannot obtain it, for when they seek their own good instead of the common good there is little or no communion between them and their subjects. Now, all friendship is based upon something common among those who are to be friends, for we see that those are united in friendship who have in common either their natural origin, or some similarity in habits of life, or any kind of social interests.

Consequently, there can be little or no friendship between tyrants and their subjects. When the latter are oppressed by tyrannical injustice and feel they are not loved but despised, they certainly do not conceive any love, for it is too great a virtue for the common man to love his enemies and to do good to his persecutors (cf. Matt 5:44). Nor have tyrants any reason to complain of their subjects if they are not loved by them, since they do not act towards them in such a way that they ought to be loved by them.

Good kings, on the contrary, are loved by many when they show that they love their subjects and are studiously intent on the common welfare, and when their subjects can see that they derive many benefits from this zealous care. For to hate their friends and return evil for good to their benefactors—this, surely, would be too great a malice to ascribe fittingly to the generality of men. The consequence of this love is that the government of good kings is stable, because their subjects do not refuse to expose themselves to any danger whatsoever on behalf of such kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 10.</span></figcaption>

<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>

<blockquote><p>Asking whether you should listen to God or to reason is like asking whether you should listen to Beethoven’s Fifth Symphony or to the recording you have of it. It’s like asking whether the earth is lit up by the sun or by sunlight. It’s like asking whether you should obey your commanding officer or his commands. The natural law of reason is a participation in the eternal law of God ([Thomas, Summa] I-I,91,2).</p></blockquote>

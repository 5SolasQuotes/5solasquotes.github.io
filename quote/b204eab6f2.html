<blockquote><p>II… 1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20).</p></blockquote>

<blockquote><p>…his virtues follow; which as they have their seat in man, in the will and affections, so it is not inconvenient for method’s sake to refer them to the same in God. Gods virtues are his essence considered, as it always works orderly, fitly and agreeably to perfect reason. They are not things differing from his essence as in us, but we must conceive of them according to our capacity, and handle them distinctly. By virtues we understand first in general the idea of virtue, or the chiefest moral perfection, by which God is in Himself absolutely the best, and in respect of which all the virtues of angels and men are only slender shadows and representations.</p></blockquote>

<blockquote><p>[Genesis 6] Verses 5-8 give the most terrible picture of human degradation, to which only Romans 1 compares; and the strongest anthropomorphic expression is used, ‘and it repented the Lord’, to describe God’s reaction to this almost utter perversion of His creative purpose. While it is the moral effects of sin which are summarily described in these few terrible words, it is to be noted that the physical effects may have been and probably were equally marked. Sin brutalizes!</p></blockquote>

</figure><figure class="quote" id="q-dee57a070d" data-kw="">
<blockquote><p>Some [attributes] are said absolutely concerning God, as all the preceding attributes. Others relatively, which relation is two-fold: either with respect to the persons among themselves, as the Father, the Son, and the Holy Spirit, or with respect of the creatures to God, as Creator, Savior, Lord, King, etc. Here it is asked, whether all these things were in God from eternity past. Response: All those things that are attributed to God absolutely are eternal, even those that are spoken relative to the very persons, as shall be proven afterwards against the heretics – Arians, Samosatensians, etc. The difficulty, therefore, remains only in those which are spoken concerning God with respect to the creatures, concerning which we respond, if we consider the foundation of the relation, such as the power to create, to conserve, to reign, etc, this also is eternal, because it is referred to the absolute: but if we consider the formal relation, that is added in time: for God was not an actual creator until he had created things. Objection: But then it is stated that something was added to God; and therefore, some change was also done in Him. Response: That relation, with respect to God, is not real; but it is only so with respect to the creature. For to the creature, something real is added, and not to God; but only some notional concept. Augustine compares it to a coin: when it becomes a pledge, nothing is really added to the coin; but to the man who accepts it, something is really added. Thomas compares it to a column, which is to my right: when I turn to that side, still nothing is really added to the column; but only to the man, who turns himself toward it in this or that way, does any change take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Johannes Hornbeek, Institutes 3.9 trans. Charles Johnson</cite></span></figcaption>

</figure><figure class="quote" id="q-eb652065a8" data-kw="">
<blockquote><p>Scripture attributes wrath to God throughout, and other passions also. It will be queried therefore in this place whether it pertains to God, and in what way. And first, the philosophers denied wrath to occur in God, as Epicurus denied and the Stoics, which we so grant, though we only minimally demonstrate [in what follows]. … True, therefore, is this judgment: Wrath does not properly occur in God by his nature, but concerning that, it is said in a human fashion. … We define, therefore, the wrath of God to be the eternal judgment, always like unto Himself, against a sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aretius.html">Aretius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Problems of Theology… (Geneva, 1589; Bern, 1604), Place 158, ‘Whether Wrath is in God, and How?’</cite>, pp. 477-78</span></figcaption>

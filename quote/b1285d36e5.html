<main class="wrap"><figure class="quote" id="q-b1285d36e5" data-kw="">
<blockquote><p>He shall see more largely of the travail of his soul when his people shall have sent forth his gospel into all nations, and it shall have been blessed for the conversion of the whole heathen—when the corn of wheat that has fallen into the ground and died, shall bring forth much fruit, and the handful of corn in the earth upon the top of the mountains shall shake with fruit like Lebanon for abundance.

Now, we anticipate the period when the entire world shall be recovered to an acknowledgment of the true God and Jesus Christ whom he has sent, and when the spiritual reign of truth and piety shall be unlimited. For the whole earth is to be filled with His glory. The little leaven is to leaven the whole lump. The kingdoms of this world are to become the kingdoms of our Lord, and he shall reign for ever. The stone cut out without hands is to become a great mountain and fill the whole earth.

The doom of every Pagan temple is pronounced. The debasing influence of idolatry shall everywhere yield to the renovating force of Christian truth, and the pollutions of heathenism disappear before the extended empire of Immanuel. When this time comes, as come it shall, it will be the fruit of the Redeemer’s sacrifice, and will add even to the sum of his felicity.

And what benevolent spirit, looking to the present debased state of the world, would not rejoice when every solitary place is gladdened with the voice of the gospel—and the earth yields her increase—and God, even our own God, doth bless us—and the Christian graces blossom like the rose of Sharon, where now the spiritual wilderness stretches out in dreary monotony—and “the wolf dwells with the lamb, and the leopard lies down with the kid, and the calf, and the young lion, and the fatling together; and a little child shall lead them. And there shall be nothing to hurt nor to destroy in all my holy mountain, saith the Lord; for the earth shall be full of the knowledge of the Lord, as the waters cover the sea.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-roxburgh.html">John Roxburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saviour s sufferings, and his satisfaction in the fruit of them’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

<blockquote><p>Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 7, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Of the Church of the New Testament, it was prophesied that God would give them one way, as well as one heart, Jer. 32:39, that there shall not only be one Lord, but his Name one, Zech. 14:9. We are exhorted to walk by the same rule, so far as we have attained, that is, to study uniformity, not diversity in those things which are agreed upon to be good and right, Phil. 3:16. Does not the apostle plainly intimate and commend a uniformity in the worship of God, 1 Cor. 14:27… verse 33, for God is not the author of confusion, but of peace, as in all the Churches of the saints, verse 40, ‘Let all things be done decently and in order.’ He limits the prophets to that same number, of two or three, even as he limits those that had the gift of tongues, verse 29. And was it not a great uniformity that he would have every man who prayed or prophesied, to have his head uncovered, and every woman covered, 1 Cor. 11? Does not the same apostle, besides the doctrine of faith and practical duties of a Christian life, deliver several canons to be observed in the ordination and admission of elders and deacons, concerning widows, concerning accusations, admonitions, censures and other things belonging to Church policy, as appears especially from the epistles to Timothy and Titus?… In the ancient Church, although there was not an uniformity in all particulars among all the churches, for instance in the point of fasting: some fasting on the Sabbath, some not, some taking the Lord’s Supper fasting, some after meals, which differences in fasting, gave occasion to the old rule: dissonantia jejunii non dissolvit consonantiam fidei [The dissonance of fasting does not dissolve the concord of the faith]. Although likewise, there was a great difference between the custom of one church and another in the time and manner of celebrating the Lords Supper and in other particulars, as Augustine, Socrates and the author of the Tripartite History record unto us. Yet the Centuries and other ecclesiastical historians show us in every century, a great uniformity in those ancient times, even in very many things belonging to Church government and form of worship.</p></blockquote>

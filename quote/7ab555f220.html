<blockquote><p>A distinction is formal (real in a certain respect) according to Scotists and others, if it exists between realities and formalities, for example between the soul and its faculties, between the faculties themselves, between the metaphysical essence and its properties, between the various perfections or metaphysical degrees, between the attributes of God, between the divine nature and the divine Persons, between the principle of individuation and the specific essence. A formality (or reality) is something positive included in a real being which, although it does not and cannot exist by itself, can be conceived in a clear and distinct concept in abstraction from any other formality of the same thing that it belongs to [it]. The sign of a formal distinction includes three things: a) ability to be conceived in a concept that is not only distinct but also complete and exclusive; b) such that what is conceived is not a thing but something of a thing; c) inseparability from the thing it belongs to. A formal distinction is fully defined as “a distinction in the nature of the thing that comes between several formalities identified in reality, one of which can be conceived without the other before any work of the intellect, although it cannot exist without the other even by divine power. … On the Formal Distinction Specifically This distinction is not admitted by everyone, especially among Thomists. Although it is often called a ‘Scotistic’ distinction, such a distinction was not an innovation on the part of Scotus. It is found in the whole Augustinian tradition. It is contained implicitly in the distinction ‘of attribution’ of St. Bonaventure, and explicitly in Olivi, William of Ware, Matthew of Aquasparta, William of Macclesfield, Roger Marston, Alexander of Alexandria, etc.² Scotus himself merely reduced the distinction to a scientific system, and used it as a powerful instrument of metaphysical explication. ² B. Jansen, “Beiträge zür geschichtlichen Entwicklung der Distinctio formalis,” Zeitschrift für katholische Theologie, LIII (1929) 317 ff. M. Grajewski, op. cit. ch. 6. What are the arguments commonly adduced in favor of the formal distinction? The more powerful arguments are drawn from theology. Among philosophical arguments the following can be numbered: 1. Man, on the part of the thing, formally agrees in animality with the brute; the same man, again on the part of the thing, does not agree in rationality with the same brute. Therefore animality and rationality in man, on the part of the thing, is not one and the same undistinguished perfection; otherwise man would, on the part of the thing, agree and not agree with the brute at the same time and according to altogether the same idea, which is absurd. The same argument holds if the comparison is made between man and angel or pure spirit. 2. If animality and rationality, on the part of the thing and intrinsically, were one and the same perfection, they would be absolutely inseparable; for nothing can be separated from itself; hence one would never be found without the other. But in fact they are found separated, for animality is found in the true without rationality; in an angel rationality is found without animality; and in each case formally and on the part of the thing. Therefore even in man they cannot be formally and on the part of the thing one and the same perfection. 3. Animality can be conceived and defined not only distinctly but also completely and exclusively without rationality; the same has to be said of rationality. But if our knowledge is valid and real definitions are possible, that which is conceived, even on the part of the thing, in one concept cannot be identical with what is conceived in another concept; therefore etc.</p></blockquote>

<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>

<blockquote><p>…nevertheless we think it must be held that there is only one soul in each man – both on account of the philosophical reasons adduced by the common consent of theologians and philosophers, specifically by the scholastics on Thomas’s first part [of the Summa], question 76, article 3, and Summa contra Gentiles, book 2, chapter 58, by the more recent Coimbrans cited above, Ruvius on the second book of On the Soul, questions 5-7, to whom can be added Suárez, Metaphysical Disputations, 13, section 3 and [disp.] 16, section 10, where he disputes that of one thing there is given only one form, and Eustachius a Sancto Paulo in his Summa Philosophiae, p. 173. From our theologians, Zanchi, bk. 2, chapter 3, does the same extensively and solidly. And Polanus compendiously in his Syntagma, book 5, chapter 32.</p></blockquote>

<blockquote><p>…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.</p></blockquote>

<blockquote><p>Nineteenth-century Thomists like Joseph Kleutgen (1811-83) sought to revive the Aristotelian-Thomistic tradition in the face of these modern developments, and their efforts were massively aided by Pope Leo XIII’s encyclical Aeterni Patris (1879), which called for a renewal of Thomism, and of Scholastic philosophy in general. The result was a Neo-Thomistic and Neo-Scholastic movement which marked a third phase in the history of Thomism, dominated Roman Catholic thought until the Second Vatican Council (1962-65), and has dramatically influenced the modern understanding of Aquinas’s thought down to the present day. Several schools of thought describing themselves as ‘Thomistic’ have developed over the course of the last century or so, each representing a different response to the characteristic themes and assumptions of modern philosophy. Since they have had such a profound influence on the contemporary debate over Aquinas’s thought, it will be worthwhile briefly to describe the main positions: 1. Neo-Scholastic Thomism: The dominant tendency within Thomism in the first decades after the revival sparked by Leo’s encyclical, this approach is reflected in many of the manuals and textbooks widely in use in Roman Catholic colleges and seminaries before Vatican II. Due to its emphasis on following the interpretative tradition of the great commentators on Aquinas (such as Capreolus, Cajetan, and John of St. Thomas) and associated suspicion of attempts to synthesize Thomism with non-Thomistic categories and assumptions, it has also sometimes been labeled “Strict Observance Thomism.” Still, its focus was less on exegesis of the historical Aquinas’s own texts than on carrying out the program of deploying a rigorously worked out system of Thomistic metaphysics in a wholesale critique of modern philosophy. Its core philosophical commitments are summarized in the famous “Twenty-Four Thomistic Theses” approved by Pope Pius X. Reginald Garrigou-Lagrange (1877-1964) is perhaps its greatest representative. 2. Existential Thomism: Etienne Gilson (1884-1978), the key proponent of this approach to Thomism, tended to emphasize the importance of historical exegesis but also to deemphasize Aquinas’s continuity with the Aristotelian tradition, highlighting instead the originality of Aquinas’s doctrine of being or existence. He was also critical of the Neo-Scholastics’ focus on the tradition of the commentators, and given what he regarded as their insufficient emphasis on being or existence accused them of ‘essentialism’ (to allude to the other half of Aquinas’s distinction between being and essence). Gilson’s reading of Aquinas as putting forward a distinctively ‘Christian philosophy’ tended, at least in the view of his critics, to blur Aquinas’s distinction between philosophy and theology. Jacques Maritain (1882-1973) introduced into Thomistic metaphysics the notion that philosophical reflection begins with an ‘intuition of being,’ and in ethics and social philosophy sought to harmonize Thomism with personalism and pluralistic democracy. Though “existential Thomism” was sometimes presented as a counterpoint to modern existentialism, the main reason for the label is the emphasis this approach puts on Aquinas’s doctrine of existence. Contemporary proponents include Joseph Owens and John F. X. Knasas. 3. Laval or River Forest Thomism: This approach emphasizes the Aristotelian foundations of Aquinas’s philosophy, and in particular the idea that the construction of a sound metaphysics must be preceded by a sound understanding of natural science, as interpreted in light of an Aristotelian philosophy of nature. Accordingly, it is keen to show that modern physical science can and should be given such an interpretation. Charles De Koninck (1906-1965), James A. Weisheipl (1923-1984), William A. Wallace, and Benedict Ashley are among its representatives. It is sometimes called “Laval Thomism” after the University of Laval in Quebec, where De Koninck was a professor. The alternative label “River Forest Thomism” derives from a suburb of Chicago, the location of the Albertus Magnus Lyceum for Natural Science, whose members are associated with this approach. It is also sometimes called ‘Aristotelian Thomism’ (to highlight its contrast with Gilson’s brand of existential Thomism) though since Neo-Scholastic Thomism also emphasizes Aquinas’s continuity with Aristotle, this label seems a bit too proprietary. (There are writers, like the contemporary Thomist Ralph McInerny, who exhibit both Neo-Scholastic and Laval/River Forest influences, and the approaches are not necessarily incompatible.) 4. Transcendental Thomism: Unlike the first three schools mentioned, this approach, associated with Joseph Marechal (1878-1944), Karl Rahner (1904-84), and Bernard Lonergan (1904-84), does not oppose modern philosophy wholesale, but seeks to reconcile Thomism with a Cartesian subjectivist approach to knowledge in general, and Kantian epistemology in particular. It seems fair to say that most Thomists otherwise tolerant of diverse approaches to Aquinas’s thought tend to regard transcendental Thomism as having conceded too much to modern philosophy genuinely to count as a variety of Thomism, strictly speaking, and this school of thought has in any event been far more influential among theologians than among philosophers. 5. Lublin Thomism: This approach, which derives its name from the University of Lublin in Poland where it was centered, is also sometimes called “phenomenological Thomism.” Like transcendental Thomism, it seeks to combine Thomism with certain elements of modern philosophy, though in a way that is less radically revisionist. In particular, it seeks to make use of the phenomenological method of philosophical analysis associated with Edmund Husserl and the personalism of writers like Max Scheler in articulating the Thomist conception of the human person. Its best-known proponent is Karol Wojtyla (1920-2005), who went on to become Pope John Paul II. 6. Analytical Thomism: This newest approach to Thomism is described by John Haldane… its key proponent, as ‘a broad philosophical approach that brings into mutual relationship the styles and preoccupations of recent English-speaking philosophy and the concepts and concerns shared by Aquinas and his followers’ (from the article on ‘analytical Thomism’ in The Oxford Companion to Philosophy, edited by Ted Honderich). By ‘recent English-speaking philosophy’ Haldane means the analytical tradition founded by thinkers like Gottlob Frege, Bertrand Russell, G. E. Moore, and Ludwig Wittgenstein, which tends to dominate academic philosophy in the English-speaking world. Elizabeth Anscombe (1919-2001) and her husband Peter Geach are sometimes considered the first ‘analytical Thomists,’ though (like most writers to whom this label has been applied) they did not describe themselves in these terms, and as Haldane’s somewhat vague expression ‘mutual relationship’ indicates, there does not seem to be any set of doctrines held in common by all so-called analytical Thomists. What they do have in common seems to be that they are philosophers trained in the analytic tradition who happen to be interested in Aquinas in some way; and the character of their ‘analytical Thomism’ is determined by whether it tends to stress the ‘analytical’ side of analytical Thomism, or the ‘Thomism’ side, or, alternatively, attempts to emphasize both sides equally.</p></blockquote>

+of+natural+science%2C+as+interpreted+in+light+of+an+Aristotelian+philosophy+of+nature.+Accordingly%2C+it+is+keen+to+show+that+modern+physical+science+can+and+should+be+given+such+an+interpretation.+Charles+De+Koninck+%281906-1965%29%2C+James+A.+Weisheipl+%281923-1984%29%2C+William+A.+Wallace%2C+and+Benedict+Ashley+are+among+its+representatives.+It+is+sometimes+called+%E2%80%9CLaval+Thomism%E2%80%9D+after+the+University+of+Laval+in+Quebec%2C+where+De+Koninck+was+a+professor.+The+alternative+label+%E2%80%9CRiver+Forest+Thomism%E2%80%9D+derives+from+a+suburb+of+Chicago%2C+the+location+of+the+Albertus+Magnus+Lyceum+for+Natural+Science%2C+whose+members+are+associated+with+this+approach.+It+is+also+sometimes+called+%E2%80%98Aristotelian+Thomism%E2%80%99+%28to+highlight+its+contrast+with+Gilson%E2%80%99s+brand+of+existential+Thomism%29+though+since+Neo-Scholastic+Thomism+also+emphasizes+Aquinas%E2%80%99s+continuity+with+Aristotle%2C+this+label+seems+a+bit+too+proprietary.+%28There+are+writers%2C+like+the+contemporary+Thomist+Ralph+McInerny%2C+who+exhibit+both+Neo-Scholastic+and+Laval%2FRiver+Forest+influences%2C+and+the+approaches+are+not+necessarily+incompatible.%29+4.+Transcendental+Thomism%3A+Unlike+the+first+three+schools+mentioned%2C+this+approach%2C+associated+with+Joseph+Marechal+%281878-1944%29%2C+Karl+Rahner+%281904-84%29%2C+and+Bernard+Lonergan+%281904-84%29%2C+does+not+oppose+modern+philosophy+wholesale%2C+but+seeks+to+reconcile+Thomism+with+a+Cartesian+subjectivist+approach+to+knowledge+in+general%2C+and+Kantian+epistemology+in+particular.+It+seems+fair+to+say+that+most+Thomists+otherwise+tolerant+of+diverse+approaches+to+Aquinas%E2%80%99s+thought+tend+to+regard+transcendental+Thomism+as+having+conceded+too+much+to+modern+philosophy+genuinely+to+count+as+a+variety+of+Thomism%2C+strictly+speaking%2C+and+this+school+of+thought+has+in+any+event+been+far+more+influential+among+theologians+than+among+philosophers.+5.+Lublin+Thomism%3A+This+approach%2C+which+derives+its+name+from+the+University+of+Lublin+in+Poland+where+it+was+centered%2C+is+also+sometimes+called+%E2%80%9Cphenomenological+Thomism.%E2%80%9D+Like+transcendental+Thomism%2C+it+seeks+to+combine+Thomism+with+certain+elements+of+modern+philosophy%2C+though+in+a+way+that+is+less+radically+revisionist.+In+particular%2C+it+seeks+to+make+use+of+the+phenomenological+method+of+philosophical+analysis+associated+with+Edmund+Husserl+and+the+personalism+of+writers+like+Max+Scheler+in+articulating+the+Thomist+conception+of+the+human+person.+Its+best-known+proponent+is+Karol+Wojtyla+%281920-2005%29%2C+who+went+on+to+become+Pope+John+Paul+II.+6.+Analytical+Thomism%3A+This+newest+approach+to+Thomism+is+described+by+John+Haldane%E2%80%A6+its+key+proponent%2C+as+%E2%80%98a+broad+philosophical+approach+that+brings+into+mutual+relationship+the+styles+and+preoccupations+of+recent+English-speaking+philosophy+and+the+concepts+and+concerns+shared+by+Aquinas+and+his+followers%E2%80%99+%28from+the+article+on+%E2%80%98analytical+Thomism%E2%80%99+in+The+Oxford+Companion+to+Philosophy%2C+edited+by+Ted+Honderich%29.+By+%E2%80%98recent+English-speaking+philosophy%E2%80%99+Haldane+means+the+analytical+tradition+founded+by+thinkers+like+Gottlob+Frege%2C+Bertrand+Russell%2C+G.+E.+Moore%2C+and+Ludwig+Wittgenstein%2C+which+tends+to+dominate+academic+philosophy+in+the+English-speaking+world.+Elizabeth+Anscombe+%281919-2001%29+and+her+husband+Peter+Geach+are+sometimes+considered+the+first+%E2%80%98analytical+Thomists%2C%E2%80%99+though+%28like+most+writers+to+whom+this+label+has+been+applied%29+they+did+not+describe+themselves+in+these+terms%2C+and+as+Haldane%E2%80%99s+somewhat+vague+expression+%E2%80%98mutual+relationship%E2%80%99+indicates%2C+there+does+not+seem+to+be+any+set+of+doctrines+held+in+common+by+all+so-called+analytical+Thomists.+What+they+do+have+in+common+seems+to+be+that+they+are+philosophers+trained+in+the+analytic+tradition+who+happen+to+be+interested+in+Aquinas+in+some+way%3B+and+the+character+of+their+%E2%80%98analytical+Thomism%E2%80%99+is+determined+by+whether+it+tends+to+stress+the+%E2%80%98analytical%E2%80%99+side+of+analytical+Thomism%2C+or+the+%E2%80%98Thomism%E2%80%99+side%2C+or%2C+alternatively%2C+attempts+to+emphasize+both+sides+equally.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98The+Thomistic+tradition%E2%80%99%2C+pt.+1+%26+2+%282009%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9eddc0741b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9eddc0741b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-historys-reception-of-aquinas/#:~:text=Nineteenth%2Dcentury%20Thomists%20like%20Joseph%20Kleutgen%20%281811%2D83,attempts%20to%20emphasize%20both%20sides%20equally&amp;text=Nineteenth%2Dcentury%20Thomists%20like%20Joseph%20Kleutgen%20%281811%2D83%29%20sought%20to&amp;text=or%2C%20alternatively%2C%20attempts%20to%20emphasize%20both%20sides%20equally" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

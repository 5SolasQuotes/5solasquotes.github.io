<blockquote><p>3. Above, indeed, we proved that there is not in God a conditioned will properly so called, although rewards and punishments are proposed to us conditionally: For these differ as much as heaven from earth. Eternal life is conditional, but the sacred oracles do not know of a will of God to give eternal life that is conditional. For there was in God a will by which these things were concatenated, the establishment of Saul’s kingdom and the obedience of Saul, just as the vision of miracles and the conversion of the Tyrians are concatenated, as I mentioned above. Would the establishment of the kingdom have followed the obedience of Saul in this sense, but God had both decreed and long before predicted through the patriarch Jacob, Gen. 49:10, that royal power would be with the tribe of Judah, and that Shiloh, that is, Christ, would arise from him? What? Would that promise have been false if Saul had obeyed? What kind of dreams are these? Corvinus will say (in the cited location), if God had established the kingdom for Saul on the condition that he obeyed, then He would have wished to establish it. ‘For if’ (he says) ‘God had done that, the condition being posited, He surely wished to do it before the condition was fulfilled, under that law, if it were fulfilled.’ A conditional will includes two things (Alvarez, disp. 22, ad fig. 8):

1. Formally and expressly, an affection of simple complacency.

2. Eminently and implicitly, [there is] an efficacious and absolute will, which indeed does not actually exist, but nevertheless would exist if the condition were fulfilled; but insofar as it is turned into an absolute [will] through the fulfillment of the condition, it is called conditional. Response:

1. There is no consequence [in the argument]. If God had established Saul’s kingdom on the hypothesis of obedience, Corvinus, according to his custom, fraudulently assumes this, but does not prove it. Would that he had brought forward an argument! For this alone follows: ‘Therefore He would have willed and decreed to establish it, if He had established it,’ which is most true and by us in no way denied. But because God sends a Savior if men are sinners, it in no way follows: ‘Therefore He decreed to send a Savior on the hypothesis that men are sinners.’ For God’s eternal decree in no way depends upon a temporal condition to be fulfilled by men, for otherwise it would not be eternal.

2. If God had established Saul’s kingdom, He would have decreed to establish it; if He had decreed to establish it, He would also have decreed to work obedience in Saul by efficacious grace, just as He provided this in David. Therefore, from the condition having been fulfilled, there would have followed the temporal and external act of God, but in no way from the same would there have followed the eternal and immanent act. What? Would it be in the power of the creature that there should be eternal acts and eternal volitions in God? Then it would be in the power of the creature that God’s will should exist, and consequently that God Himself should exist; for God’s volitions are the same as God Himself.

3. He says that the conditional will comprises an affection of simple complacency, that is, an absolute volition. Does God therefore absolutely love and will eternal life for Judas, and also conditionally will eternal life for Judas? But these are contradictory. For if God [wills] salvation of the Jew simply, then He would also effect that (Alvarez, disp. 22, ad fig. 8); and therefore he still begs the question.

4. He says that a conditional will eminently contains the absolute will of God, which is not in act, yet would be if the condition were fulfilled, but he foreknows from eternity that the condition will never be fulfilled. How, therefore, does a conditional will, either eminently or formally, contain such an efficacious will, which God both foreknows and decrees will never be? This is a dream.

5. Is not the condition to be fulfilled such a thing upon which the absolute will of God depends? The Arminians deny this, for they do not wish for the first cause to be suspended from the second.

6. “According as it is turned into the absolute,” he says, “it is called conditional.” But truly, change the word “turned” into the word “changed,” and then the eternal conditional will of God is changed into an absolute one. Is the will of God so mutable? But how is the natural desire of God turned into an absolute decree, and then the same will of God will be both natural and free, that is, free and not free? If God has now ceased to will the salvation of the believing elect by an antecedent will, and now absolutely wills them to be saved because they believe, then an end is given to the eternal desire of God. But truly, since He desires the salvation of the elect because He is good toward His creatures, if that desire has now vanished as having been changed into an absolute will, He ceases to be good toward believers.

7. This absolute will, once the condition has been fulfilled, either follows necessarily or contingently. If necessarily, then the efficacious decree of God concerning the salvation of believers is not free, but follows necessarily, by a necessity of nature, from the act of man; and yet Arminius himself concedes that election is a free decree. But if it follows contingently, or freely, from the decree, then God decreed to decree, He willed to will absolutely the salvation of believers. How absurd it is that He should first decree to decree, before He decrees! But this is to posit a progression to infinity. (Alvarez, disp. 22, ad fig. 8)</p></blockquote>

<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>

<blockquote><p>We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.”

</figure><figure class="quote" id="q-afa1392f2c" data-kw="">
<blockquote><p>A second question is, How far the Law can draw a sinner to Christ? Antinomians tell us of a legal drawing and conversion, and of an evangelic drawing; the legal drawing they say is ours [that of the reformed]; the latter theirs. Assertion 1. The difference between the letter of the Law and the Gospel is not in the manner of working, for the letter of either Law or Gospel is alike ineffectual and fruitless to draw any to Christ. Christ preached the Gospel to hard-hearted Pharisees; it moved them not. Moses preached the Law and the curses thereof to the stiffnecked Jews and they were as little humbled. Sounds and syllables of ten hells, of twenty heavens and Gospels, without the Spirit’s working, are alike fruitless. And we grant the Law is a sleepy keeper of a captive sinner; he may either steal away from his keeper or if he be awed with his keeper, he is not kept from any spiritual, internal breach of the Law, nor moved thereby to sincere and spiritual walking. But the difference between Law and Gospel is not in the internal manner of working, but in two other things:

1. In the matter contained in Law and Gospel: because nature is refractory to violence and the Law can do nothing but curse sinners; therefore it can draw no man to Christ. The Gospel again contains sweet and glorious promises of giving a new heart to the elect, of admitting to the Prince of peace laden and broken-hearted mourners in Zion and in conferring on them a free imputed righteousness; and this is in itself a taking-way, but without the Gospel-spirit [it is] utterly ineffectual.

2. To the Gospel there is a Spirit added, which works as God does with an omnipotent pull; and this Spirit does also use the Law to prepare and humble; though this be by a higher power than goes along with the Law as the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pp. 272-318</span></figcaption>

<blockquote><p>But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.</p></blockquote>

<blockquote><p>For the Presence of Christ in the Supper, it is needful that it be distinguished, and considered two ways; First, according to the verity thereof, Then, according to the manner of the verity thereof.

The Verity of Christ’s presence in the Supper, in that the Supper of the Lord is considered not as an earthly action only, but as a heavenly, is that, whereby in his Body, and blood, he is believed to be truly, and really present in the Supper, and that both in respect of the signs, and in respect of the Communicants.

Of the Signs: because the body, and blood of Christ are truly present together with the bread and wine, the sacramental signs; not in respect of co-existence, and place, but in a Sacramental manner, in respect whereof, this presence in the Schools, is commonly termed Relative.

Of the Communicants: because Christ is in very deed present, in the hearts of them that believe, even altogether with the same, and such a presence, as the communion of his body, is exhibited unto them in the Supper: and this presence is Real: yet neither presence is corporal: for by faith (as Ambrose sayth,) Christ is touched, not by body.

Of this Verity there are two grounds; The Divine Promise, and the Sacramental Union.

The Promise; for sith Christ, in the instituting of his Supper, hath promised the eating of his body, and blood; and therefore also his Presence, we must verily believe, that Christ accomplisheth, and performeth what he hath promised.

The Sacramental Union: for the Essential Form of the Sacraments, &amp; that, which maketh Consistence, requireth, that in the Supper, the thing signified be no less certainly conferred, then the very present signs are offered.

The manner of this Verity is not corporal, natural, or Local, either by a conversion of the whole Substance of the bread and Wine into the Lord’s body, and blood, or by a passing into the bread, or by local inclusion; or lastly, by a being in, or closeness; but it is Sacramental, and Spiritual, which God’s will, and authority declared by the word of Institution, effecteth: Sacramental, because, according to the nature of Sacraments, it consisteth in a disposition, and relation, by which Christ, together with the sign, exhibiteth the thing signified to the Communicants, and sanctifieth the bread and wine, that they may be the signs of the thing signified, being conjoined together by a Sacramental union.

Spiritual; because the body, and blood of Christ, being not simply, and as they are in themselves, things subsisting, but Intellectually, and understandingly to be considered, are proposed in these mysteries, and are offered to the mind, not to the body, to Faith, not to the senses; being also with the mind, and with faith alone to be taken and received.

Of this manner, there are three grounds; The Institution, the Verity, and Manner of Christ’s body, and the Nature of the Sacraments.

The Institution: for Christ instituted the Sacrament of our communion with his body and blood, whereof we are spiritually partakers by Faith: for after no other manner can it be believed, that the present body of Christ is exhibited in the Supper; but as it is truly received, as the spiritual meat of the soul unto life.

The manner and verity of his body: for seeing the body of Christ being coessential with ours, is circumscriptively in Heaven, wheresoever he will, and cannot be in earth by a manner invisible, incircumscribed, infinite indefinite; al and every of which manners, overthrow the verity of a body; we must altogether confess, that Christ, being bodily in heaven, is nevertheless, after a Sacramental manner in body present in the Supper.

The Nature of the Sacraments: for Faith should cease in the Sacraments, if the very thing, which is believed, were otherwise present, then after a sacramental manner; neither, indeed doth the omnipotency of God, or a miracle invert, or evert this sacramental manner of presence. Not Gods Omnipotency: because, when there is speech made of that effectual, and actual power of God, the will of God revealed in the word, must needs go before. To which (will), if any thing be contrary, it is from it necessarily excluded, as that also, which is by nature contradictory: not a Miracle; because neither miracles which are indeed above nature, should be said to be against nature, taking away, and withal leaving a substance, or natural quality: nor is it probable, that a thing which is extraordinary, is done in an ordinary Sacrament of the Church.</p></blockquote>

<blockquote><p>Question [to a Muslim convert]

Having acknowledged that eternal Salvation is not to be found but in the Christian Religion, and the Christians being divided into many Religions, why did not you address your self to the Church of Rome?

Answer

By reason of the Images to which they kneel, and because they do adore a piece of bread, saying that it is God himself.

Consideration.

The Mahometans have good reason to abhor Idols. They reproach the Christians with them, as also with the worshipping of the Virgin Mary, and other Saints. This Scandal which is so general, is the cause why not only the Mahometans but the Jews also do detest Christianity. O how many Souls hath this Doctrine hindered from coming to Christ? Satan hath found also another way from dissuading not only them, but the Pagans also from being Christians; for they would enjoin them to believe that what they do behold to be but a little piece of bread, is the living and the eternal God. Even common sense rejecteth this abomination.</p></blockquote>

<blockquote><p>Q. Doth this consecration change the bread and wine into the body and blood of Christ?

A. No: but they still continue in nature and substance bread and wine still, and are but only types and seals of Christ’s body and blood.

Q. But doth not our Saviour say of the bread, This is my body; and of the wine, This is my blood?

A. Though he do; yet it thence no more followeth, that the bread is his very real body, and the wine his blood, then that he is a material door, or vine, because he saith, I am the door, I am the vine.

Q. How is our Saviour then to be understood?

A. To speak by an usual figure, where the name of the thing signified, is given to the sign. After the same manner that in the old Testament, Circumcision is called the Covenant, and the Lamb, the Passover, because they were signs of those things.

Q. What special reasons have you against the change of these elements into the very body and blood of Christ, commonly called Transubstantiation?

A. First, then at the first institution, there must needs be two Christs, one that giveth, another that is given.

Secondly, If the bread be the very body of Christ, &amp;c. then there is no true and proportionable sign to represent the thing signified, and consequently no Sacrament.

Thirdly, the same individual body must then of necessity be in more places then one at once, which is not only against the nature of a true human body, but of a body in general also.

Fourthly, the Apostles, and Evangelists call it bread and wine after the consecration. 1. Cor. 10. 16. 26. 27. 28. Matth. 26. 29.

Fifthly, if there were any such change, it were the greatest miracle in the world, but all other miracles are such, as have been apparent to sense.

Sixthly, then the wicked as well as the godly, should receive Christ Jesus and his quickening spirit, which is never separated from him. Yea (which is horrible to consider) mice and rats may eat the true body of Christ, and drink his blood.

Q. But it is not likely, that at this time, and in this place, our Saviour would use a figurative speech, and speak obscurely, whereas he might have spoken plainly?

A. First, it is plain, that at the same time he used as figurative a speech as this. Secondly, in this institution also we must of necessity acknowledge, that he useth a figure when he saith, that the cup is the new Testament. Thirdly, there is often more light and plainness in a figure, then in a proper speech.

Q. But what may be noted out of this form of speech?

A. The near and sure conjunction of the sign, with the thing signified, which it hath in them that shall receive it worthily; in so much as they which partake of the one, receive the other also.

Q. Then it seems, that though upon the consecration, the bread and wine be not changed into the real body and blood of Christ, that yet they are present, in, with, or under the bread and wine?

A. Not corporally, substantially, or locally; for then, first, the body of Christ should be every where; which doth as much destroy the nature of a human body, as to be in many places at once. Secondly, then as in transubstantiation, the body and blood of Christ should not be a spiritual food of the soul, but bodily, such as the wicked eat of as well as the godly. Thirdly, then also (as in transubstantiation) Christ should be eaten as the Capernaites fancied, really, &amp; with the body, which our Saviour denieth. Fourthly, it should not then be true, which is said, Act. 3. 21. That the heavens shall contain him, till the time that all things be restored. Fifthly, it is the nature of that faith by which we lay hold on, and receive Christ, to seek him, and behold him, in heaven, and to feed upon him there.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q. Doth this consecration change the bread and wine into the body and blood of Christ?

A. No: but they still continue in nature and substance bread and wine still, and are but only types and seals of Christ’s body and blood.

Q. But doth not our Saviour say of the bread, This is my body; and of the wine, This is my blood?

A. Though he do; yet it thence no more followeth, that the bread is his very real body, and the wine his blood, then that he is a material door, or vine, because he saith, I am the door, I am the vine.

Q. How is our Saviour then to be understood?

A. To speak by an usual figure, where the name of the thing signified, is given to the sign. After the same manner that in the old Testament, Circumcision is called the Covenant, and the Lamb, the Passover, because they were signs of those things.

Q. What special reasons have you against the change of these elements into the very body and blood of Christ, commonly called Transubstantiation?

A. First, then at the first institution, there must needs be two Christs, one that giveth, another that is given.

Secondly, If the bread be the very body of Christ, &amp;c. then there is no true and proportionable sign to represent the thing signified, and consequently no Sacrament.

Thirdly, the same individual body must then of necessity be in more places then one at once, which is not only against the nature of a true human body, but of a body in general also.

Fourthly, the Apostles, and Evangelists call it bread and wine after the consecration. 1. Cor. 10. 16. 26. 27. 28. Matth. 26. 29.

Fifthly, if there were any such change, it were the greatest miracle in the world, but all other miracles are such, as have been apparent to sense.

Sixthly, then the wicked as well as the godly, should receive Christ Jesus and his quickening spirit, which is never separated from him. Yea (which is horrible to consider) mice and rats may eat the true body of Christ, and drink his blood.

Q. But it is not likely, that at this time, and in this place, our Saviour would use a figurative speech, and speak obscurely, whereas he might have spoken plainly?

A. First, it is plain, that at the same time he used as figurative a speech as this. Secondly, in this institution also we must of necessity acknowledge, that he useth a figure when he saith, that the cup is the new Testament. Thirdly, there is often more light and plainness in a figure, then in a proper speech.

Q. But what may be noted out of this form of speech?

<main class="wrap"><figure class="quote" id="q-3e6572aea2" data-kw="">
<blockquote><p>Now when Christ is burnt up with love, and sick of tender kindness; to cast water on this love by resisting it, is the highest Gospel-sin that can be, except despiting of the holy Ghost; and a third ground of aggravating to the full, this sin of resisting Christ’s drawing, I take from the judgement and the plague and Gospel-vengeance on such as Christ draweth, and they will not be drawn, and is the sin of the times;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, ... (London, 1647), p. 460</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-139d516bd3" data-kw="">
<blockquote><p>Whereas some object that the care both of temporal good and spiritual good belongs to the magistrate, therefore he must have a power to make Church laws. See [David] Pareus. For his care cannot be supreme, if he must rule at the nod and beck of Church-men. I Answer, the connection is weak: he who has the care of both the temporal and spiritual good of the people, he has a nomothetic [law-making] power to procure both these two goods: it follows [in] no way, for then might he have a power in his own person to preach, and administrate the sacraments; this power [of the magistrate] procures the spiritual good, but such as is the care, such is the power: the care is politic and civil; Therefore the power to procure the spiritual good, must bee politic and civil [circa sacra, not in sacra].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 442-3</span></figcaption>

</figure><figure class="quote" id="q-aca0dbf1a1" data-kw="">
<blockquote><p>Besides these three causes of unsatisfiableness, God Himself doth justly put that property and poison into all worldly things doted upon, and desired immoderately, that they shall plague the heart that pursues them; by filling it still with a furious and fresh supply of more greediness, longings, jealousies, and many miserable discontentments: So that they become unto it, as drink unto a drunkard, a man in a hydropicus, dropsy, or burning fever, serve only to inflame it with new heat, and fiery additions of insatiable thirst and inordinate lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some General Directions for a Comfortable Walking with God</cite>, … (London, 1626) 1625 was a plague year., pp. 226-27</span></figcaption>

</figure><figure class="quote" id="q-76a8711059" data-kw="">
<blockquote><p>So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, ... (London, 1647), p. 37</span></figcaption>

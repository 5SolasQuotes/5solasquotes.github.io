<main class="wrap"><figure class="quote" id="q-e63b4b4bbb" data-kw="">
<blockquote><p>Consider the odious filthiness of sin, the pertinacious adherence thereof unto thy nature; so that nothing but the incarnation and blood of the Son of God, the creator of the world, could wash it out. Consider the justice, and indispensable severity of our God against sin, which would not spare the life of his own Son, nor be satisfied without a sacrifice of infinite and co-equal virtue with itself.

Consider that it was thy sins, which were the associates with Judas, and Pilate, and the Jews, to crucify him: it was thy hypocrisy which was the kiss, that betrayed him; thy covetousness the thorns, that crowned him; thy oppression and cruelty the nails and spears, that pierced him; thy idolatry and superstition the knee, that mocked him; thy contempt of religion the spittle, that defiled him; thy anger and bitterness the gall and vinegar, that distasted him; thy crimson and redoubled sins the purple that dishonoured him: in a word, thou wert the Jew that killed him.

Canst thou, then, have so many members, as weapons, wherewith to crucify thy Saviour, and hast thou not a heart wherein to recognise, and a tongue wherewith to celebrate, the benefits of that blood which thy sins had poured out? The fire is quenched by that water, which by its heat was caused to run over; and shall not any of thy sins be put out by the overflowing of that precious blood, which thy sins caused to run out of his sacred body?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 107-08.</span></figcaption>

<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>

<blockquote><p>(2) Of the seed and blood of the V. Mary was formed Christ’s flesh, the H. Spirit adding quickening force to this material. Of course the seed and blood of the virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the H. Spirit’s extraordinary shadowing and quickening were addded: whence also it is said to have been conceived of the H. Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate. (3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the V. Mary, extraordinary as regards the formative force added to this material.</p></blockquote>

</figure><figure class="quote" id="q-158f4a70da" data-kw="">
<blockquote><p>Christ is represented in Scripture as looking forth on a world of immortal spirits — who had cast off their allegiance to their rightful sovereign — who had banded themselves together against his authority, and were therefore justly obnoxious to severest punishment. He looked and there were none to help — he wondered that there was none to uphold — and, in the greatness of his love, he determined to seek and to save. Leaving the bosom of the Father, and becoming incarnate, he dwelt amongst us, a man of sorrows and acquainted with grief. The malice and the ingratitude of men, the assaults of Satan, the treachery of his enemies, and the desertion and denial of his friends — the agony of the garden, the night of grief in Herod’s hall, the shame and pain of the accursed tree, and the hidings of his Father’s face, were all endured.

That which bore up his holy human soul during the terrible conflict in which he fought our battle with the adversary, was the joy set before him, even the joy of bringing many sons and daughters unto glory; and now that he has triumphed, and has ascended up on high, and has again taken unto himself the glory which he had with the Father before the world was, he is spoken of in the text and in all Scripture, as rejoicing over his people with joy. They are his by creation — they are his by purchase — they are his by adoption — they are his by a begun and progressive sanctification. In the counsels of eternity were they given unto him by the Father — he loved them with an everlasting love; when the fulness of time had come, he sought them and he found them.

The co-equal and co-eternal Spirit quickens and renews them. He dwells in them, and carries on towards perfection the holiness already begun. There is nought in the contemplation of the natural man to call forth the joy of the Saviour; but, if we are his, then are we washed in his blood, and clad in his righteousness. His likeness is impressed on our souls — the impress is becoming, day by day, more manifest, and He rejoices that it is so. There is joy among the angels of heaven, we are told, when a sinner turns from the error of his ways; but, from the test, we learn, that a joy more ineffable still rises in the heart of Him whose nature is infinite, and whose capacities are boundless, when he turns to behold his image and superscription in the souls of his people.

Oh, Brethren, if it be indeed true that the believer is the object of such love, and the cause of such joy, and if we are believers, what manner of persons ought we to be? — how wary, how watchful in our every-day life and conversation? — how willing to bear and forbear for Jesus’ sake? — how able to spend and be spent in his work? He loved his people, and he saved, and is saving them. His delights are with them. He rejoices to contemplate, in their increasing resemblance to himself, the results of his tabernacling among us in the days of his flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reid-ormond.html">John Reid Ormond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ s Joy in His People’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

ual+and+co-eternal+Spirit+quickens+and+renews+them.+He+dwells+in+them%2C+and+carries+on+towards+perfection+the+holiness+already+begun.+There+is+nought+in+the+contemplation+of+the+natural+man+to+call+forth+the+joy+of+the+Saviour%3B+but%2C+if+we+are+his%2C+then+are+we+washed+in+his+blood%2C+and+clad+in+his+righteousness.+His+likeness+is+impressed+on+our+souls+%E2%80%94+the+impress+is+becoming%2C+day+by+day%2C+more+manifest%2C+and+He+rejoices+that+it+is+so.+There+is+joy+among+the+angels+of+heaven%2C+we+are+told%2C+when+a+sinner+turns+from+the+error+of+his+ways%3B+but%2C+from+the+test%2C+we+learn%2C+that+a+joy+more+ineffable+still+rises+in+the+heart+of+Him+whose+nature+is+infinite%2C+and+whose+capacities+are+boundless%2C+when+he+turns+to+behold+his+image+and+superscription+in+the+souls+of+his+people.%0A%0AOh%2C+Brethren%2C+if+it+be+indeed+true+that+the+believer+is+the+object+of+such+love%2C+and+the+cause+of+such+joy%2C+and+if+we+are+believers%2C+what+manner+of+persons+ought+we+to+be%3F+%E2%80%94+how+wary%2C+how+watchful+in+our+every-day+life+and+conversation%3F+%E2%80%94+how+willing+to+bear+and+forbear+for+Jesus%E2%80%99+sake%3F+%E2%80%94+how+able+to+spend+and+be+spent+in+his+work%3F+He+loved+his+people%2C+and+he+saved%2C+and+is+saving+them.+His+delights+are+with+them.+He+rejoices+to+contemplate%2C+in+their+increasing+resemblance+to+himself%2C+the+results+of+his+tabernacling+among+us+in+the+days+of+his+flesh.%E2%80%9D%0A%0A%E2%80%94+John+Reid+Ormond%2C+Christ+s+Joy+in+His+People%E2%80%99+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F158f4a70da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/158f4a70da.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/08/john-reid-ormond-on-christs-humiliation-and-exaltation-for-our-salvation/" rel="noopener" target="_bla

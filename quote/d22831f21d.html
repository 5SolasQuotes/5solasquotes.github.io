<main class="wrap"><figure class="quote" id="q-d22831f21d" data-kw="resurrection victory">
<blockquote><p>The miracles which followed the resurrection of Christ prove that he lives and reigns gloriously in heaven (to say nothing now of the justice of God, the glory of Christ and our salvation, which necessarily demanded it, according to the prophecies uttered concerning it). Did he rise again by his own or by another’s power? The orthodox ascribe the cause of the resurrection to Christ himself no less than to the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.17.1</span></figcaption>

</figure><figure class="quote" id="q-19c4498eb6" data-kw="sufficient efficient">
<blockquote><p>It is not asked with respect to the value and sufficiency of the death of Christ—whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines—that Christ “died sufficiently for all, but efficiently for the elect only.” For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ).</p></blockquote>

</figure><figure class="quote" id="q-0bc84a0fa8" data-kw="">
<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:14</span></figcaption>

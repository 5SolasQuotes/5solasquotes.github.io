<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Danger of Prosperity Discovered in Several Sermons upon Prov. 1:27</cite>, (London: Aylmer, 1685), p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-403f6adf5c" data-kw="">
<blockquote><p>Q. 145. Has God such a will in Him, as He calls a conditional will? as for example, to will all men’s salvation if they repent? Answer: Properly there cannot be a conditional will in God: First, because such a will supposes a superior that may hinder, Acts 18:21. Secondly, it supposes ignorance how things may fall out, as Abraham willed his servant to fetch a wife for Isaac out of the land of his kindred, Gen. 24:4, if she were willing, verse 8. Nevertheless, improperly it may be given to God, not as though his will can have a condition, for that’s the property of a created will, to have a condition of it, Jam. 4:15, but because the thing willed of God may have a condition, Isa. 7:9. Now, that the Lord may be said to have a conditional will in some sense is plain: First, because He is said to will the connection of things when He does not will the things asunder; and therefore He wills them only upon the condition of a connection: God would have all men to repent and come to the knowledge of the truth, 1 Tim. 2:4. Secondly, because He is said to will the salvation of all believers and true penitent persons, and therefore if a reprobate do believe, He wills his salvation, 1 Kn. 11:38. This is true of God towards a reprobate: “If thou wilt obey Me, I will bless thee,” Dt. 7:12-13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Man’s Directory</cite>, … (London: T.F., 1648), Of Catechizing, Of Thoughts, pp. 108-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-354cd715bd" data-kw="">
<blockquote><p>…He says by this will to Judas the traitor, ‘I command and will your final obedience,’ that is, I approve, and hold it morally pleasing and acceptable, whether that obedience actually exists, or not, as the law of an earthly prince is not made to this end, that men should simply cultivate society, but on the hypothesis of society being cultivated, that they should order their life civilly and according to the rule and norm of good laws; so the formal use of the Word of God revealing to us the will of sign is to illuminate, lead, direct what may be the pleasing good acceptable will of God, and how our acts, on the hypothesis that they are elicited and exist, can be instituted according to the Word of God, so that they may be pleasing and acceptable to God, and worthy of reward in Christ.</p></blockquote>

<blockquote><p>And this much touching the wisdom of God. Now follows concerning his will. … 2. Again the will of God is either absolute or conditional. … The conditional will of God is that by which God wills certain things, with a condition adjoined thereunto. And this is called the will of sign, because God does declare and manifest the same, both in precepts and prohibition, and also in promises, and threatenings, as it were by signs. It is also called the antecedent [that which comes before] will, because it goes before the reward or the punishment, that is propounded in the promises, or in the threatenings. By this, God will have all men to be saved and to come to the acknowledgment of truth [1 Tim. 2:4]: to with, if they believe the promises and preaching of the Gospel, and also obey the same. And therefore He calls and invites all men of all sorts and degrees (and therefore magistrates also) to the fellowship of salvation, and to the confession of the truth: yet he commands all to work their own salvation, and to come to the acknowledging of his truth, though all do it not. 1 Tim. 2:4. By this will Christ would have gathered together the Israelites, as a hen does her chickens, Lk. 13:34 to wit, unless they that were called had refused to come. This will is manifested, not by our conjectures, but only out of his word. And it is the square of all our works, and the perfect rule of all righteousness and holiness. Neither is this will of God dissembled or counterfeit, as though God commanded many things, which he would not: for example, when Gen. 22, He commanded Abraham to offer his son, and yet afterwards forbade it. Whatsoever God commands that He wills. So He commanded that Abraham should offer up his son, to wit, in will, in mind, and in appointing him for a burnt offering, for so God tried his faith and readiness to obey his commandments, and not that Abraham should indeed kill and slay his son Isaac, though Abraham did so understand the word of offering: and this the Lord Himself does sufficiently declare when in verse 12. He says, ‘Now I know and have tried that thou fearest God, seeing that thou hast not spared or withheld thy son even thy only son from me.’</p></blockquote>

<blockquote><p>355. The next distinction of Gods will is into absolute and conditional (of which see Amyraldus against Spanheim, On Universal Grace), which some divines use and others condemn and say that God has no conditional will. The common answer which most Schoolmen and other Papists agree with the Protestants in, is, that there are conditions rei volitae [of the willed thing], of the event of the thing willed, but no conditions of the act of volition in God.¹ As Aquinas says of causes, Deus vult hoc esse propter hoc; non autem propter hoc vult hoc.

1. There are both causes and conditions of the event willed of God.

2. Denominatione extrinseca ex connotatione objecti his will is hence called conditional; meaning but a volition of conditionals. ¹ De Vol. Conditionali, &amp; authoritatibus &amp; rationibus pro eadem Vide Ruiz. de Vol. Dei, disp. 20. But his assertion that [Una creatura est Ratio movens tanquam objectum materiale (secundario) ut Deus velit aliam producere] is a fiction, though he lay his stress on it about the ordo decretorum. For movere is causare, and nothing doth cause or move God to act. There are Rationes effectuum &amp; eorum ordinis: but none of the efficient Acts of God in him: If you say, It is absurd to say, that God had no Reason to will the creation of this world rather than another: I answer, That is an Act of efficient Wisdom, above all Reason: But to fetch Reasons from the object, and thereby to be moved to Act, is the part of the imperfect creature. Reasoning properly is below God: much more to be moved by extrinsick objective reasons: Yet on this Ruiz disp. 24. layeth a great fabrick; and so men may draw twenty Schemes of Gods Reasonings as they variously fancy.

356. That God wills conditions, and conditional propositions and grants is past all controversies. For He wills his own Word which is his work: But his word has conditional promises and threats: and as his Word also may be called his will, He has a conditional will, because a conditional Word.

357. God’s eternal omniscience proves that at no instant He had a will properly conditional quoad actum: Because He that at the same instant foreknows whether the condition would be done or not, must needs have his will to be thereby absolute. But yet if it had pleased God to suspend the act of his own volition, upon a human condition, it would not have exposed Him at all to the charge either of mutability or dependence, which is very clear, for:

1. It is presupposed his Will as Voluntas &amp; Essentia is unalterable, and is not that of which we speak.

2. But only his Volition as terminated on this or that object, and so as haec volitio ab objecto denominata.

3. And his efficient Volition, and Power is terminated on objects in time, without mutation in God.

4. And note well that God does suspend his own Possible Volitions in many cases; As he doth Not will to make more Worlds, more Men, more Suns, more Laws, etc. than de facto He will make.

5. And it is no more defectiveness in God to suspend a Volition for a time, than thus to do it for ever.

6. And it is no more Dependence on the Creature to Terminate his Volition only on a qualified subject (performing the Condition) than to terminate his Efficient Power and will on such or such a qualified subject. As for example, He terminates his omnipotent concurse for generation only on the materia seminalis recte disposita; He concurs to burn by fire, etc. And if his acts effectively transient may be terminated only and temporarily on disposed objects, If he did so in acts objectively transient, and did freely not-will the damnation of man till he had actually sinned, but suspended his will freely till then, and then de novo terminated it on the said qualified object, I see no show of dependence or mutability. For I oft cleared it before, that the termination of God’s knowledge, will or power on any particular object, is in him no addition to its estence; And doing it de novo, is no change in him but in the creature only; no more than it would be a change in the sun or its active emanations, if a thousand new creatures newly receive its influx and are moved by it variously according to their several conditions. Yet I have before given reasons why incipere jam praedestinare is more incongruous language.

358. I put in this only to deprecate the blind, uncharitable censures of dissenters in this point, who think that God’s volitions are new and conditional and suspended quoad actum hunc ad hoc objectum, and cry out, ‘It is blasphemy and makes God mutable and dependent.’ I am against their opinion as well as you as to conditional acts, but false charges prove you not to have more truth, but less love and sobriety than others.</p></blockquote>

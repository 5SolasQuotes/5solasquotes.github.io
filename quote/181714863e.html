<blockquote><p>…there are at least these five levels at which irreducible teleology might be said to exist: in basic causal regularities; in complex inorganic processes; in basic biological phenomena; in distinctively animal life; and in human thought and action.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>

</figure><figure class="quote" id="q-0c47a84260" data-kw="">
<blockquote><p>Secondly, God put into the soul these faculties, understanding, will, sense and appetite, which are naturally carried to things that are obvious and known, and not to things that are unknown and far removed. … Fifthly, God has put into every man, for his own preservation, a love of himself, which love is naturally good; but does then begin to be morally good, when it does accord[ing] to and help forward the love of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianisme (London, 1620), ch. 10</cite>, pp. 71-73</span></figcaption>

</figure><figure class="quote" id="q-ea060bdf15" data-kw="">
<blockquote><p>Reason cannot and ought not to bring forth any mysteries, as it were, out of its own storehouse; for this is the prerogative of scripture only. Also, that reason is not to be heard when complaining of its incapacity to comprehend the mysteries of faith: for, being finite, it is no wonder that reason should not comprehend many things that relate to what is infinite; and to reject a mystery because it is incomprehensible to reason, is to offend against reason itself. Neither is reason to be listened to whenever, under cover of holding the mysteries of faith, it aims at setting up its own errors. On the very same grounds we can not call philosophy any rule of faith, although we again concede that it is of no little use, provided it assume not to itself the power of dictating in articles of faith. True philosophy indeed serves very much both to convince men and to prepare their minds; and there is a wonderful harmony between sound philosophy and divinity: for truth is not contrary to truth, nor light to light; only we must not imagine that the former is the rule by which the sense of scripture must be tried and examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 54</span></figcaption>

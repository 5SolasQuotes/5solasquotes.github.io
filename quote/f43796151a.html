<main class="wrap"><figure class="quote" id="q-f43796151a" data-kw="">
<blockquote><p>It must be observed, however, that the teachings and prescriptions of Scripture are not confined by the Confession to what is “expressly set down in Scripture.” Men are required to believe and to obey not only what is “expressly set down in Scripture,” but also what “by good and necessary consequence may be deduced from Scripture.” This is the strenuous and universal contention of the Reformed theology against Socinians and Arminians, who desired to confine the authority of Scripture to its literal asseverations; and it involves a characteristic honoring of reason as the instrument for the ascertainment of truth. We must depend upon our human faculties to ascertain what Scripture says; we cannot suddenly abnegate them and refuse their guidance in determining what Scripture means. This is not, of course, to make reason the ground of the authority of inferred doctrines and duties. Reason is the instrument of discovery of all doctrines and duties, whether “expressly set down in Scripture” or “by good and necessary consequence deduced from Scripture”: but their authority, when once discovered, is derived from God, who reveals and prescribes them in Scripture, either by literal assertion or by necessary implication. The Confession is only zealous, as it declares that only Scripture is the authoritative rule of faith and practice, so to declare that the whole of Scripture is authoritative, in the whole stretch of its involved meaning. It is the Reformed contention, reflected here by the Confession, that the sense of Scripture is Scripture, and that men are bound by its whole sense in all its implications. The reëmergence in recent controversies of the plea that the authority of Scripture is to be confined to its expressed declarations, and that human logic is not to be trusted in divine things, is, therefore, a direct denial of a fundamental position of Reformed theology, explicitly affirmed in the Confession, as well as an abnegation of fundamental reason, which would not only render thinking in a system impossible, but would discredit at a stroke many of the fundamentals of the faith, such e.g. as the doctrine of the Trinity, and would logically involve the denial of the authority of all doctrine whatsoever, since no single doctrine of whatever simplicity can be ascertained from Scripture except by the use of the processes of the understanding. It is, therefore, an unimportant incident that the recent plea against the use of human logic in determining doctrine has been most sharply put forward in order to justify the rejection of a doctrine which is explicitly taught, and that repeatedly, in the very letter of Scripture; if the plea is valid at all, it destroys at once our confidence in all doctrines, no one of which is ascertained or formulated without the aid of human logic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 226–27.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2863a5000" data-kw="Judge of controversies">
<blockquote><p>It is not necessary that there should be in the church any external infallible judge by whom controversies of faith may be solved. It suffices for believers, for the tranquility and rest of their consciences, that there is an interior or divine definitive judgment (namely, of Christ and the Holy Spirit speaking in the Scriptures). An external human judgment, infallible and definitive in the church, is neither necessary nor possible. Controversies do not belong to external order but to the mental judgment for which a judge is necessary to enlighten the mind and sanctify the will (which an external and human judge cannot do because he has no power over the conscience).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.23</span></figcaption>

</figure><figure class="quote" id="q-91f1d74d37" data-kw="">
<blockquote><p>For when some have taken up a private interpretation of any place of Scripture, if, before they have thoroughly imbibed and vented it, they do not submit their conception, although they seem to be greatly satisfied in it and full of it, unto the authority of the Scripture in the declaration of its own mind in other places, there is but small hope of their recovery. And this is that pride which is the source and original of heresy, -- namely, when men will prefer their seemingly wise and rational conceptions of the sense of particular places before the analogy of faith.</p></blockquote>

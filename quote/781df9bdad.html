<blockquote><p>The Compromise of the School of Saumur. The School of Saumur represents an attempt to tone down the rigorous Calvinism of the Synod of Dort, and to avoid at the same time the error of Arminianism. This is seen especially in the work of Amyraldus, who boldly taught a hypothetical universalism, which was really a species of universal atonement. God willed by an antecedent decree that all men should be saved on condition of repentance and faith in Jesus Christ. He therefore sent Christ into the world to die for all men. But seeing that, left to themselves, none would repent and believe, He by a subsequent decree elected some as the objects of the saving operation of His grace. These and these only are actually saved. The outcome proved this to be an untenable position. Of the followers of this school some emphasized the first decree and the universal offer of salvation based on it, with the result that they landed in the Arminian camp; and others stressed the second decree and the necessity of effectual grace, and thus returned to the Calvinistic position. The views of the School of Saumur were practically shared by Davenant, Calamy, and especially Richard Baxter, in England. Its peculiar opinions gave occasion for the construction of the Formula Consensus Helvetica by Turretin and Heidegger, in which these views are combatted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Christian Doctrines</cite>, (William. B. Eerdmans Publishing Company, 1949), 195.</span></figcaption>

<blockquote><p>According to the common doctrine of Augustinians, as expressed in the Westminster Catechism, “God, having … elected some to everlasting life, did enter into a covenant of grace, to deliver them out of the estate of sin and misery, and to bring them into an estate of salvation by a Redeemer.” In opposition to this view some of the Reformed theologians of the seventeenth century introduced the scheme which is known in the history of theology as the doctrine of hypothetical redemption. The principal advocate of this doctrine was Amyraut (died 1664), Professor in the French Protestant Seminary at Saumur. He taught, (1.) That the motive impelling God to redeem men was benevolence, or love to men in general. (2.) From this motive He sent His Son to make the salvation of all men possible. (3.) God, in virtue of a decretum universale hypotheticum, offers salvation to all men if they believe in Christ. (4.) All men have a natural ability to repent and believe. (5.) But as this natural ability was counteracted by a moral inability, God determined to give his efficacious grace to a certain number of the human race, and thus to secure their salvation. This scheme is sometimes designated as “universalismus hypotheticus.” It was designed to take a middle ground between Augustinianism and Arminianism. It is liable to the objections which press on both systems. It does not remove the peculiar difficulties of Augustinianism, as it asserts the sovereignty of God in election. Besides, it leaves the case of the heathen out of view. They, having no knowledge of Christ, could not avail themselves of this decretum hypotheticum, and therefore must be considered as passed over by a decretum absolutum. It was against this doctrine of Amyraut and other departures from the standards of the Reformed Church that, in 1675, the “Formula Consensus Helvetica” was adopted by the churches of Switzerland. This theory of the French theologians soon passed away as far as the Reformed churches in Europe were concerned. Its advocates either returned to the old doctrine, or passed on to the more advanced system of the Arminians. In this country it has been revived and extensively adopted. At first view it might seem a small matter whether we say that election precedes redemption or that redemption precedes election. In fact, however, it is a question of great importance. The relation of the truths of the Bible is determined by their nature. If you change their relation you must change their nature. If you regard the sun as a planet instead of as the centre of our system you must believe it to be something very different in its constitution from what it actually is. So in a scheme of thought, if you make the final cause a means, or a means the final cause, nothing but confusion can be the result… 1. It supposes mutability in the divine purposes; or that the purpose of God may fail of accomplishment. According to this scheme, God, out of benevolence or philanthropy, purposed the salvation of all men, and sent his Son for their redemption. But seeing that such purpose could not be carried out, He determined by his efficacious grace to secure the salvation of a certain portion of the human race. This difficulty the scheme involves, however it may be stated. It cannot however be supposed that God intends what is never accomplished; that He purposes what He does not intend to effect; that He adopts means for an end which is never to be attained. This cannot be affirmed of any rational being who has the wisdom and power to secure the execution of his purposes. Much less can it be said of Him whose power and wisdom are infinite. If all men are not saved, God never purposed their salvation, and never devised and put into operation means designed to accomplish that end. We must assume that the result is the interpretation of the purposes of God. If He foreordains whatsoever comes to pass, then events correspond to his purposes; and it is against reason and Scripture to suppose that there is any contradiction or want of correspondence between what He intended and what actually occurs. The theory, therefore, which assumes that God purposed the salvation of all men, and sent his Son to die as a means to accomplish that end, and then seeing, or foreseeing that such end could not or would not be attained, elected a part of the race to be the subjects of efficacious grace, cannot be admitted as Scriptural. 2. The Bible clearly teaches that the work of Christ is certainly efficacious. It renders certain the attainment of the end it was designed to accomplish. It was intended to save his people, and not merely to make the salvation of all men possible. It was a real satisfaction to justice, and therefore necessarily frees from condemnation. It was a ransom paid and accepted, and therefore certainly redeems. If, therefore, equally designed for all men, it must secure the salvation of all. If designed specially for the elect, it renders their salvation certain, and therefore election precedes redemption. God, as the Westminster Catechism teaches, having elected some to eternal life, sent his Son to redeem them. 3. The Scriptures further teach that the gift of Christ secures the gift of all other saving blessings. “He that spared not his own Son, but delivered him up for us all, how shall he not with him also freely give us all things?” (Rom. 8:32.) Hence they are certainly saved for whom God delivered up his Son. The elect only are saved, and therefore He was delivered up specially for them, and consequently election must precede redemption. The relation, therefore, of redemption to election is as clearly determined by the nature of redemption as the relation of the sun to the planets is determined by the nature of the sun. 4. The Bible in numerous passages directly asserts that Christ came to redeem his people; to save them from their sins; and to bring them to God. He gave Himself for his Church; He laid down his life for his sheep. As the end precedes the means, if God sent his Son to save his people, if Christ gave Himself for his Church, then his people were selected and present to the divine mind, in the order of thought, prior to the gift of Christ. 5. If, as Paul teaches (Rom. 8:29, 30), foreknowledge precedes predestination, and if the mission of Christ is the means of accomplishing the end of predestination, then of necessity predestination to eternal life precedes the gift of Christ. Having, as we are taught in Eph. 1:4, 5, predestinated us to the adoption of sons, God chose us before the foundation of the world, and sent his Son to be the propitiation for our sins. This is the order of the divine purposes, or the mutual relation of the truths of redemption as presented in the Scriptures. 6. The motive (so to speak) of God in sending his Son is not, as this theory assumes, general benevolence or that love of which all men are equally the objects, but that peculiar, mysterious, infinite love in which God, in giving his Son, gives Himself and all conceivable and possible good. All these points, however, as before remarked, ask for further consideration when we come to treat of the nature and design of Christ’s work.</p></blockquote>

on.+The+relation%2C+therefore%2C+of+redemption+to+election+is+as+clearly+determined+by+the+nature+of+redemption+as+the+relation+of+the+sun+to+the+planets+is+determined+by+the+nature+of+the+sun.+4.+The+Bible+in+numerous+passages+directly+asserts+that+Christ+came+to+redeem+his+people%3B+to+save+them+from+their+sins%3B+and+to+bring+them+to+God.+He+gave+Himself+for+his+Church%3B+He+laid+down+his+life+for+his+sheep.+As+the+end+precedes+the+means%2C+if+God+sent+his+Son+to+save+his+people%2C+if+Christ+gave+Himself+for+his+Church%2C+then+his+people+were+selected+and+present+to+the+divine+mind%2C+in+the+order+of+thought%2C+prior+to+the+gift+of+Christ.+5.+If%2C+as+Paul+teaches+%28Rom.+8%3A29%2C+30%29%2C+foreknowledge+precedes+predestination%2C+and+if+the+mission+of+Christ+is+the+means+of+accomplishing+the+end+of+predestination%2C+then+of+necessity+predestination+to+eternal+life+precedes+the+gift+of+Christ.+Having%2C+as+we+are+taught+in+Eph.+1%3A4%2C+5%2C+predestinated+us+to+the+adoption+of+sons%2C+God+chose+us+before+the+foundation+of+the+world%2C+and+sent+his+Son+to+be+the+propitiation+for+our+sins.+This+is+the+order+of+the+divine+purposes%2C+or+the+mutual+relation+of+the+truths+of+redemption+as+presented+in+the+Scriptures.+6.+The+motive+%28so+to+speak%29+of+God+in+sending+his+Son+is+not%2C+as+this+theory+assumes%2C+general+benevolence+or+that+love+of+which+all+men+are+equally+the+objects%2C+but+that+peculiar%2C+mysterious%2C+infinite+love+in+which+God%2C+in+giving+his+Son%2C+gives+Himself+and+all+conceivable+and+possible+good.+All+these+points%2C+however%2C+as+before+remarked%2C+ask+for+further+consideration+when+we+come+to+treat+of+the+nature+and+design+of+Christ%E2%80%99s+work.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+2+%28Oak+Harbor%2C+WA%3A+Logos+Research+Systems%2C+Inc.%2C+1997%29%2C+321%E2%80%9324.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8589b1bd5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="pe 0called%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. For first lets weigh well the words of Christ: ‘I never knew you: depart from Me ye workers of iniquity.’ (Mt. 7:25) Now to know with God is to acknowledge; and therefore, whom Christ never knew, He never acknowledged for his. And those whom He has not sometime acknowledged, He never bought or redeemed with the price of his blood. And therefore well says Gregory: ‘Not to know with God is to reject.’ Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14) Very well therefore says Prosper (bk. 1, Response for Augustine, Objection 9): ‘As it is not sufficient for the renewing of men, that Christ Jesus was born man, unless they be renewed also in the same spirit, whereof He was born: so it is not sufficient for man’s redemption that Christ Jesus was crucified, unless we die together and be buried with Him in baptism.’ Of these premises therefore I frame this assumption: But all are not reconciled unto God, neither do all receive remission of sins: for then all men were blessed (Ps. 32:1); and it were not possible for them to perish: which thing to affirm of all and every one, is very gross. Thirdly, Christ gave Himself that He might sanctify unto Himself a people peculiar (Tit. 2:14), that is, as a precious treasure and his own gotten good selected and chosen from among other: therefore it was not Christ’s purpose to give Himself for a ransom for all and every one alike. Fourthly, for whom redemption it [was] ordained, to them all is given on God’s part the making of them sons by Christ: but the making of sons, or adoption is not granted to all and every one, even on God’s part… Fifthly: None are truly redeemed on God’s part, but they who are freed from sin, both according to the power that it has to cause damnation, and also according to the power that it has to reign in them…</p></blockquote>

<blockquote><p>We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.”

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind... (Oxford: L.L., 1653), pt. 1, Intro, p. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+often+demanded+whether+every+one+that+hears+the+Gospel+be+not+bound+to+believe+that+Christ+died+for+him%3F+Now+I+say+this+phrase+%E2%80%98Christ+died+for+me%E2%80%99+includes+many+things%2C+as+the+benefits+which+arise+unto+me+by+the+death+of+Christ+may+be+conceived+to+be+many.+But+let+these+benefits+be+distinguished+and+we+shall+readily+answer+to+the+question+made%2C+and+that+perhaps+differently%2C+as+namely%2C+affirmatively+to+some%2C+negatively+to+others%3B+as+thus%3A+Do+you+speak+of+Christ%E2%80%99s+dying+for+me%2C+that+is%2C+for+the+pardon+of+my+sins+and+for+the+salvation+of+my+soul%3A+I+answer+affirmatively+and+say+I+am+bound+to+believe+that+Christ+died+for+the+procuring+of+these+benefits+unto+me+in+such+manner+as+God+has+ordained%2C+to+wit%2C+not+absolutely+but+conditionally%2C+to+wit%2C+in+case+I+do+believe+and+repent.+For+God+has+not+otherwise+ordained+that+I+should+reap+the+benefit+of+pardon+and+salvation+by+virtue+of+Christ%E2%80%99s+death+and+passion+unless+I+believe+in+Him+and+repent.+But+if+question+be+made+whether+I+am+bound+to+believe+that+Christ+died+for+me+to+procure+faith+and+repentance+unto+me%3A+I+do+not+say+that+I+am+bound%2C+or+that+every+one+who+hears+the+Gospel+is+bound+to+believe+this.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%2C+consistent+with+his+absolute+Hatred+or+Reprobation+of+the+Vessels+of+Wrath%2C+or+an+answer+unto+a+book+entitled%2C+God%E2%80%99s+Love+unto+Mankind...+%28Oxford%3A+L.L.%2C+1653%29%2C+pt.+1%2C+Intro%2C+p.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76cf032e15.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X

<main class="wrap"><figure class="quote" id="q-de9c7888de" data-kw="">
<blockquote><p>By the Understanding, Will, and Affection, the Soul doth (as it were) enter into God, and God into the Soul; whence followeth (as it were) a mutual in-being of one in another, and an intimate vital union between God and the Soul. Either the vision, fruition, and love of God, is Blessednesse, or there is no Blessednesse; God is not God, Heaven is not Heaven; the Creature, according to the best, namely, the Gospel-dispensation of God, is capable of no more, needs no more, can have no more; God in Christ doth no more for Man, man needs no more from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, London, 1654, ch. 15, p. 335</span></figcaption>

</figure><figure class="quote" id="q-d04c21ab00" data-kw="Grace">
<blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</span></figcaption>

</figure><figure class="quote" id="q-1e78844179" data-kw="Sanctification Original Sin">
<blockquote><p>As our natural corruption was produced originally in the first Adam, and propagated from him to us, so our new nature and holiness is first produced in Christ, and derived from Him to us, or as it were propagated. So that we are not at all to work together with Christ, in making or producing that holy frame in us, but only to take it to ourselves, and use it in our holy practice, as made ready to our hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, Direction III (ch. 3), “One great mystery”</span></figcaption>

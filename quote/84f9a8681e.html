<main class="wrap"><figure class="quote" id="q-84f9a8681e" data-kw="">
<blockquote><p>No sacrifice could be accepted by God, but on such an altar, as could sanctify the gift to its designed effect; and who could supply that, but the last Adam himself? Accordingly, his Divine nature, that eternal Spirit, was the altar, whence the sacrifice of his human nature, derived all its infinite value and efficacy.

“We,” says the apostle Paul, “have an altar, whereof they have no right to eat who serve the tabernacle,” and in another place, “How much more shall the blood of Christ, who through the eternal Spirit, offered himself without spot to God, purge your conscience from dead works, to serve the living God.” His blessed body, suffering and bleeding to death on the cross, and his holy soul, melted within him, by the fire of Divine wrath, both being, at the same time, united to his Divine nature, were the sacrifice burning on the altar, from which, God smelled a sweet smelling savour.

By this infinitely perfect sacrifice, the justice of Jehovah was fully satisfied, and his wrath completely appeased.—Not that Christ was a sacrifice only, whilst he was on the cross. His offering of himself a sacrifice, which he began, at his incarnation, to do, (the sacrifice having been laid on the altar, the first moment thereof,) and which he continued, for more than thirty-three years, to do, he finished on the cross and in the tomb.

Hence are these consoling declarations: “He hath made him to be sin for us “When we shall see him, there is no beauty that we should desire him. He is — a man of sorrows, and acquainted with grief:- Surely he hath borne our griefs, and carried our sorrows.” His Divine nature, then, was the altar, which so sanctified the sacrifice of his human nature, as to render it valuable, in an infinite degree. … Now as Christ himself, was both the sacrifice, and the altar; so, none but himself could be the Priest: and as in his human nature, he was the sacrifice, and in his Divine nature, the altar; so, it behoved him in his person, to be the Priest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 105-06.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d229d0aff" data-kw="">
<blockquote><p>There remains the seventh part of the sentence propounded, to wit, that man is justified by the iustice of God, whereby He accepts Christs satisfaction for the elect. Of this Paul testifies, Rom. 3:25-26, where he says, ‘Whom’ (to wit Christ) ‘God hath set forth to be are conciliation through faith in his blood to declare his justice, by the forgiveness of the sins that are past through the patience of God, to show at this time his iustice, that He might be just and a justifier of him which is of the faith of Jesus.’ By which words the apostle teaches that God declares his justice, in as much as he forgives sins to them for whom Christ has satisfied, namely the believers. For it is the part of justice, to be content, if satisfaction be made for the debt by a surety, and not to exact satisfaction of the debtor himself.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-01a23db27c" data-kw="">
<blockquote><p>But here it is asked, since Christ is said to have tasted death for every man (Heb. 2:9), and for all (2 Cor. 5:15), and to have given Himself a ransom for all (1 Tim. 2:6), whether this can and ought to be understood of all men without exception, even of those who become not partakers of righteousness and life, nor are elected and given to Christ by special grace: at least with a distinction between sufficiency and efficacy? We answer… there are grave reasons why we dare not speak in this manner, in whatever sense.</p></blockquote>

</figure><figure class="quote" id="q-947bf1611f" data-kw="">
<blockquote><p>Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 258</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.”

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 258">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+howsoever+an+absolution+shall+be+completed+at+the+Day+of+Judgment%2C+yet+our+justification+shall+not+abide+in+such+a+way+as+it+is+in+this+life.+Now+our+justification+is+by+pardon+of+sin%2C+and+a+righteousness+without+us+imputed+to+us%2C+which+is+instrumentally+applied+by+faith%3B+but+this+way+shall+then+cease%2C+for+having+perfect+righteousness+inherent+in+ourselves%2C+we+shall+need+no+covering.+It+is+true%2C+the+glory+and+honour+of+all+this+will+redound+upon+Christ%2C+and+He+shall+not+be+the+less+glorified+because+He+has+then+brought+us+to+the+full+end+of+all+his+sufferings.+I+know+some+may+doubt+whether+any+righteousness+but+that+which+is+infinite+can+please+God%2C+and+therefore%2C+as+some+think%2C+the+angels+were+accepted+of+God+through+Christ%2C+though+perfect%3B+so+it+may+be+of+the+saints+in+heaven.+But+I+see+no+ground+for+this.+This+seems+to+be+undoubted%2C+that+the+way+of+justification+by+faith+in+Christ+arises+because+of+our+imperfection+and+sinfulness+remaining+in+us%2C+and+therefore+is+justificatio+viae%2C+not+patriae%E2%80%94%E2%80%99a+justification%E2%80%99+of+us+%E2%80%98in+our+way%2C%E2%80%99+not+when+we+come+to+%E2%80%98our+home%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures%2C+%28London%3A+Miller%2C+1651%29%2C+Lecture+29%2C+on+Acts+3%3A19%2C+p.+258&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F947bf1611f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/947bf1611f.html">Permalink</a><a class="src" href="https

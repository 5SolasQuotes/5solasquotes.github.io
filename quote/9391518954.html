<main class="wrap"><figure class="quote" id="q-9391518954" data-kw="">
<blockquote><p>And the Antichrist came in the Pope also, and denied Christ to come in the flesh, nullified his manhood with transubstantiation, a visible-head of the Church, images, merits, traditions of men, etc., invocation of saints, prayer for the dead, works of supererogation, etc.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-743e53a7ea" data-kw="">
<blockquote><p>Objection 6. That is not the true religion nor a safe way to Heaven, which men can have no infallible certainty of. But the Protestant religion is such: For they all profess their Church to be fallible. Answer: [1.] We must distinguish between a man that may be deceived, and a man that is deceived: and between infallibility in the object, and in the subject or intellect. And between infallibility in the absolutely necessary points, and in some inferior smaller matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself</cite>, The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself (London: Miller, 1657) | Query: ‘Whether the Reformed Catholic Christian religion, commonly called Protestant, be a safe way to salvation?’, pp. 43-44</span></figcaption>

ext=necessary%20points%2C%20and%20in%20some%20inferior%20smaller%20matters" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ed477133ac" data-kw="">
<blockquote><p>Nor do I regard that as an honour whereby I know that my brethren lose their honour. For my honour is the honour of the universal Church: my honour is the solid vigour of my brethren. Then am I truly honoured when the honour due to all and each is not denied them. For if your Holiness calls me Universal Pope, you deny that you are yourself what you call me universally. But far be this from us. Away with words that inflate vanity and wound charity.</p></blockquote>

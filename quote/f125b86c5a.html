<main class="wrap"><figure class="quote" id="q-f125b86c5a" data-kw="">
<blockquote><p>But who knows not, That to the aforesaid divine Articles (clearly expressed in the Holy Scriptures, authentically preached and founded by the Apostles, uniformly believed and confessed by Christians of all places and ages) Rome hath added divers others, which she presseth equally with them, forcing all those of her communion to receive them with the same faith as they do those aforesaid; thundering out horrible anathemas against all them that doubt of them, and using for the ruin of such all the power and credit that she hath, whether in the Church, or in the world?

For besides J[esus] Christ (whom she acknowledgeth with us to be the Mediator of mankind, the High-Priest and chief Sovereign of the Church) she would have us hold the Saints departed to be our Mediators, and her Priests our Sacrificers, and her Pope to be the Head and Husband of the Church. Besides the sacrifice of the Crosse, she forceth upon us that of the Altar.

Besides the blood of Christ, she commands us to expect our cleansing from the sufferings of Martyrs, and from the virtue of a certain fire which she hath kindled under ground. Besides the water of Baptism, and the refection of the Eucharist, she presseth us to receive unction with oils, and the mysteries of her private Confessions. Besides the Great God, whom she adores and prays to as we do, she commandeth us to adore the holy Sacrament, to invocate Angels and beatified Spirits. Besides that service of the Gospel wherein she agreeth with us, she imposeth upon us divers ceremonies, abstaining from meats, distinction of times, veneration of images.

Besides the H[oly] Scriptures which are divinely inspired, which she confesseth with us, she would have us receive with the same faith and respect all the traditions which she approves of. Besides the repose and rest in the Kingdom of heaven, which she with us promiseth to the faithful, she will have us to believe another in Limbo, a prison for children that die without baptism. And besides the torments of hell, which she with us threatens to the wicked, she denounceth to the faithful another like it in purgatoric.

These (and several others like to these) are the positions which she addeth to the true and fundamental Articles of the good Old Christianity; and which are the points that divorce us from her Communion. For every one knows, how carefully she hath established them in her Councils, how daily she recommendeth them in her Schools and pulpits, how rigorously she exacteth them in confession; having long since pronounced, and oft since (daily still) proclaiming and repeating, That she esteems them Heretics, Enemies of Christ, and worse then Infidels, that reject these opinions or any of these.</p></blockquote>

<blockquote><p>Let us therefore sit down seriously and count the cost; yea, and consider whether we be willing to be at the cost. To lead you on in this, my humble advice is, That you would catechise your hearts upon the Articles of this Covenant. Put the question to your hearts, and let every one say thus unto himself:

Am I indeed resolved sincerely, really and constantly, through the grace of God, in my place and calling, to endeavour the preservation of the reformed Religion in the Church of Scotland? &amp;c. The reformation of Religion in the Kingdoms of England and Ireland? &amp;c.

Am I indeed resolved in like manner, without respect of persons, to endeavour the extirpation of Popery, Prelacy? &amp;c.

Am I indeed resolved never to be withdrawn or divided by whatsoever terror or persuasion from this blessed union and conjunction, whether to make defection to the contrary part, or to give my self to a detestable indifferency or neutrality, in this cause of God? &amp;c.

Am I indeed resolved to humble my self for my own sins and the sins of the Kingdom? &amp;c. to amend my self and all in my power, and to go before others in the example of a real reformation? &amp;c.

According to these hints, propose the question upon every clause of this Covenant. And then consider what the cost of performing all these may amount to, and whether you are willing to go to that cost.

But it may be, some will say, What is this cost? I answer, The express letter of the Covenant tells you of one cost which you must be constantly at, and that is sincere, real, and constant endeavour. Pains is a price, I am sure real pains is. The Heathens said, That their gods sold them all good things for labour. The good things of this Covenant are sold at that rate; yea, this is the price which the true God puts upon those things which he freely gives.

To consent to this Covenant, to wish well to this Covenant, to speak well of this Covenant, come not up to the price; you must do these and you must do more, you must be doing, so the promise of every man for himself runs, I will through the grace of God endeavour. Yet every endeavour is not current money, payable, as the price of this Covenant, there must be a threefold stamp upon it, unless it bear the image and superscription of sincerity, reality, and constancy, it will not be accepted. For so the promise runs, I will sincerely, really, and constantly endeavour. …

This Covenant engages us, not only to do, but to suffer; not only to endeavour, but to endure. Such is the tenor of the sixth Article, where every man promises for himself; That he will not suffer himself to be withdrawn from this blessed union, by any terrors. If not by any terror, then not by losses, imprisonments, torments, no nor by death, that King of Terror.

You see then that the price of this Covenant, may be the price of blood, of liberty and of life. Sit down and consider, are you willing to be at this cost to build the Tower? Through the goodness of God in ordering these great affaires, you may never come actually to pay down so much: haply, not half so much; but except you resolve (if called and put to it by the real exigencies of this cause) to pay down the utmost Farthing, your Spirits are too narrow, and your hearts too low for the honour and tenor of this Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature, solemnity, grounds, property, and benefits, of a sacred covenant. Together with the duties of those who enter into such a covenant. Delivered in a sermon at Westminster, at the publique convention, (ordered by the Honourable House of Commons) for the taking of the Covenant, by all such, </cite>, (London: John Rothwell, 1643), pp 11-12, 13.</span></figcaption>

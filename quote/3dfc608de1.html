<main class="wrap"><figure class="quote" id="q-3dfc608de1" data-kw="">
<blockquote><p>Before the Fall, Adam did not need Christ, for he was righteous by his own nature, through the law of perfect nature he loved the law. But after the Fall all need Christ.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56392f2102" data-kw="">
<blockquote><p>The question therefore comes to this: does Scripture contain perfectly, not absolutely everything, but whatever is necessary for salvation, not explicitly and in exact words, but with equal force [to explicit statement] or by valid conclusion (aequipollenter vel per legitimam consequentiam), so that there is no need to resort to any unwritten word; or, is Scripture a full and sufficient rule of faith and conduct, not merely a partial and inadequate one? We uphold the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.9</span></figcaption>

</figure><figure class="quote" id="q-9eb0413e17" data-kw="">
<blockquote><p>I have said that the Popes abused their power by exercising it, not in the interests of the peoples whom they claimed to govern, but in their own; and I must add, not in the interests of anything that can plausibly claim the high name of religion, but of the most vulgar ambition. For the Popes were not content with the lofty position of being supreme judges over temporal princes: they wanted to be temporal princes themselves; and when they sought to aggrandize their dominions they freely used the spiritual weapon of excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XXIII</span></figcaption>

</figure><figure class="quote" id="q-24bf54aa64" data-kw="">
<blockquote><p>We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Papists&#x27; Damnable Faith, p. 8, Third Conclusion</span></figcaption>

</figure><figure class="quote" id="q-25881b937a" data-kw="">
<blockquote><p>But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true; but that all the letters of bishops which have been written, or are being written, since the closing of the canon, are liable to be refuted if there be anything contained in them which strays from the truth, either by the discourse of some one who happens to be wiser in the matter than themselves, or by the weightier authority and more learned experience of other bishops, by the authority of Councils</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Baptism, Against the Donatists, bk. 2, ch. 3, §4</span></figcaption>

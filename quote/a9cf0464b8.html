<main class="wrap"><figure class="quote" id="q-a9cf0464b8" data-kw="">
<blockquote><p>The architectonic principle of the Westminster Confession is supplied by the schematization of the Federal theology, which had obtained by this time in Britain, as on the Continent, a dominant position as the most commodious mode of presenting the corpus of Reformed doctrine (so e.g. Rollock, Howie, Cartwright, Preston, Perkins, Ames, Ball, and cf. Dickson’s “Sum of Saving Knowledge” and Fisher’s “Marrow of Modern Divinity,” both of which emanated from this period and were destined to a career of great influence in the Scottish theology).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield: Studies in Theology</cite>, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 56–7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a766fb798" data-kw="">
<blockquote><p>Can you imagine that the omniscient and righteous Judge of all the earth will take no notice of you or that He who is “of purer eyes than to behold evil, and canst not look on iniquity” (Hab. 1:13) but with infinite abhorrence will suffer you to sin against Him with impunity? Oh, how inexpressibly dreadful will your condition be if you remain asleep in your sinfulness and misery till everlasting fire, prepared for the devil and his angels, awakens you! Alarmed by the terrors of the fiery law, let your heart be won to the compassionate Savior by the mild accents of the blessed gospel. In the glorious gospel, Jesus, with His meritorious righteousness and His great salvation, is freely and wholly and particularly offered to you as a lost sinner of mankind; and the unlimited and authentic offer affords you a right to receive and trust in Him for complete salvation. Oh, do not any longer despise this unspeakable, this inestimably precious gift! Come to the Lord Jesus, and He will in no wise cast you out. Believe in the dear Redeemer, and you shall never perish but have eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 126.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-26b06fb4c4" data-kw="">
<blockquote><p>XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, p. 224</span></figcaption>

</figure><figure class="quote" id="q-d5e3d138cd" data-kw="">
<blockquote><p>Their heavenly adoption ought to excite them to the exercise of beneficence, that they may imitate their Father’s disposition, “who makes his sun to rise on the evil and on the good,” (Mt. 5:45) There is nothing in which men resemble God more truly than in doing good to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 30:4</span></figcaption>

<blockquote><p>2. [About the word “righteousness“:] It cannot be denied but that in many places its used for that propensity in God whereby from his hatred to sin He punishes wicked men; and thus it must be here [in Ps. 11:7], as the context evidences. Thus it is evidently used 2 Chron. 12:6; Rom. 2:5. Therefore in the next place, righteousness attributed to God signifies in the general that rectitude and purity in God’s nature, whereby He is free from all sin and hates all iniquity. And then more particularly that attribute in God whereby He does punish ungodly men:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654) | sect. 1, Sermon 1, Demonstrations of God’s Righteousness; The Kinds of it, and in what sense its attributed unto God, p. 3</span></figcaption>

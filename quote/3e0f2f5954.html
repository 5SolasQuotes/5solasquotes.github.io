</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff958c04f3" data-kw="">
<blockquote><p>It is asked: Does fortune reign, according to the Arminians? They deny it; we prove that fortune dominates in everything, according to them. … 5. Because Prov. 16:33: “The lot is cast into the lap, but its every decision is from Jehovah.” But that is false, for the decision of the lot, and its determination, so that it be white rather than black, is either from the hand apprehending the lot, or from the lots themselves, or from God, or from fortune. Not from the hand, because the bare contact is of itself blind, nor is it directed by any light or instinct, so that it apprehends this lot rather than that one. Not from the lots themselves, because the whole question is about the lots; for they are of themselves determinable and indifferent. Nor is the decision from God, because the adversaries deny that God determines second contingent causes; and they teach that He concurs with them by a universal concourse indifferent and determinable, from which neither is the apprehension of the white lot, rather than the black. Therefore, it is from fortune alone, or from mere and absolute contingency, by which contingent causes, loosed from all predetermining action of God, and notwithstanding all action of God, can act or not act; and this certainly is a cause superior to God, which is not ruled by God, and is blind fortune itself. Because if it is fortune, it is not providence; and if it is providence, it is not fortune.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668) | ch. 2, On God, Title 5, Will of God, on Lk. 21:18, “But not a hair of your head will perish.”, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-90dbf3bc5d" data-kw="">
<blockquote><p>It is asked: Whether because God indeclinably determines the will to one thing, He therefore overturns liberty? The Remonstrants affirm. We deny.

1. Because God infinitely wise and omnipotent does not overturn the nature of second causes, except in the case of the miraculous transmutation of substances; as when He converted water into wine and the staff of Moses into a serpent. But conversion is not such a miraculous transmutation of substances; But of qualities of the same substance remaining in its nature.

2. Because God so moves the free will that it most freely moves itself to the same thing to which it is premoved by God.

3. Because if certain created infallibilizing motives infallibly bend the will, with liberty remaining unharmed, much more can the Creator of wills Himself accomplish this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 11, On the Mode of Conversion, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-b6acb3a8f5" data-kw="">
<blockquote><p>…consider the three main approaches in the history of theology to understanding God’s causal relationship to the world, as Alfred Freddoso has usefully classified them. Occasionalism holds that God alone is the cause of everything that happens, so that there are no true secondary causes in nature. For example, on this view, one billiard ball which makes contact with another during a game of pool does not in any way cause the other to move. Rather, God causes the second ball to move on the occasion when the first makes contact with it. Mere conservationism holds that while God maintains natural objects and their causal powers in existence at every moment, they alone are the immediate causes of their effects. On this view, the one billiard ball really does cause the other one to move, and God has nothing to do with it other than keeping the ball and its causal powers in being. He is not in any direct way the cause of the second ball’s motion. Finally, concurrentism is a middle ground position which holds on the one hand (and contrary to occasionalism) that natural objects are true causes, but on the other hand (and contrary to mere conservationism) that God not only maintains natural objects and their causal powers in being, but also cooperates with them in immediately causing their effects. On this view, the one billiard ball really does cause the other ball to move, but only together with God, Who acts as a concurrent cause. Concurrentism became the standard view within the Scholastic tradition, because the other views are philosophically and theologically problematic. For example, occasionalism veers in the direction of pantheism, while mere conservationism veers in the direction of deism. We can understand how if we recall the Scholastic dictum that “a thing operates according as it is” If, as occasionalism holds, only God alone ever operates or brings about effects, and natural objects operate not at all, then it is difficult to see how they exist at all, at least in any robust way. God alone would seem to be real; natural objects would be like mere fictional characters in the mind of a divine Author. By contrast, if, as mere conservationism holds, natural objects can at least operate or bring about effects apart from God’s immediate causal action, then it seems that they could also exist apart from his immediate causal action. The world would in that case not depend for its continued existence on God’s conserving action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 4, ‘Natural Theology Must Be Grounded in the Philosophy of Nature, Not in Natural Science’, pp. 76-77</span></figcaption>

</figure><figure class="quote" id="q-f4f7b0edf2" data-kw="Author of sin Depravity">
<blockquote><p>The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.</p></blockquote>

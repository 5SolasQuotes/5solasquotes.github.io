<main class="wrap"><figure class="quote" id="q-cac584ea0d" data-kw="">
<blockquote><p>Grace be with you, and peace from god our father, &amp; from our Lord Jesus Christ. We could not but rejoice, when we heard that in England as in other countries the joyful message of the glory of God was very well taken of divers. Notwithstanding, this also is showed us that many weaklings yet be draw back again because of unknown rumours that there be noised of us by them that withstood the gospel of God. This is our rejoicing: Nevertheless I think it not need to withstand such lies as be uttered against the preachers of the gospel. For whereto should this blessing be meet else, namely Blessed be ye when men curse you, and revile you, &amp;c. But we do not allow, &amp; support of any body under pretence of Christian liberty behave himself unchristianly: for all they that have taken upon them the name of Christ, have also put on Christ. And this we marvel of, why some with you fear to take upon them the holy gospel of Christ by reason of the misreport that we are misreported not remembering that it behoveth the son of God to be reproved of the world &amp; the preaching of the cross to be counted foolishness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-bugenhagen.html">Johannes Bugenhagen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compe[n]dious letter which Jhon Pomerane curate of the congregation at Wittenberg sent to the faithful christen congregation in England</cite>, (Southwark: J. Nicholson, 1536), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ca6debd8b" data-kw="">
<blockquote><p>This Scripture man will be accounted nice and scrupulous. If you do regard his conscience, which attends God’s Word only, it must needs be nice and scrupulous in the World’s account, That as they wonder you run not into the same excess of riot with them, so also that you cannot use all such Worship and receive all such Traditions as they do[.]

A tender constitution feels the least blast of wind, so also doth a tender heart; Look upon the carriage of our Saviour’s not washing his hands, it was but a civil. thing, he knew how much the neglect of this would prejudice him, and yet he would not do it. For as he will have a liberty of conscience where some are superstitiously fearful; so again he will have an holy fear of conscience, where others are desperately bold; never then let Reformers startle at this, to be thought more strict then needs.

5. He will be judged singular from others: This ariseth from the other, for seeing his conscience is so tender, thence also his life will be disagreeing to the most, as the Apostles rule, Rom. 13. 2. Not to fashion our selves according to this world; and so Jam. 1. 27. pure Religion is to keep our selves unspotted from the world: it is true on the other side, if there be any irregularity, it is in the most men of the world that they conform not unto the Word of God which is the rule, for the godly doe as they should do; as in a pasture where a flock of sheep is, if all but two or three break the hedges and run into the high-ways, who are wanderers? the multitude? no, those two or three that abide in the pastures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difficulty of and the encouragements to a reformation a sermon preached before the honourable House of Commons at the publick fast, Septem. 27, 1643</cite>, (London: Thomas Underhill, 1643), pp 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-17e83dc68a" data-kw="">
<blockquote><p>4. They [civil magistrates] may and ought to destroy such books as they [spiritual seducers] use to spread for the infecting of others, and inhibit and stop printing of them, or actual selling, spreading or transporting of them, as they may stop carrying of suspected or forbidden goods. 6. They may and ought to restrain and censure all blasphemous and irreverent expressions and speeches against the majesty of God and His ordinances, and all calumnies and bitterness against faithful ministers or professors that adhere to truth: for, these are moral sins; and blasphemy, calumny, and such like, are no more to be passed over without censure in such, than in others who are not professedly tainted with error: And the pretext of following light and conscience, cannot make these sins tolerable, more than the Nicolaitans [Rev. 2] pretending the same for their committing adultery and other filthiness: And this is not to punish men’s opinions, or force their consciences, but to punish their vices, even such as have been hateful unto and punished by, many natural and heathen men.</p></blockquote>

noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But when, in this corrupt disordered State of Things, where the Lusts of Men are perpetually embroiling the World with Wars and Fightings, and throwing all into Confusion; when Ambition and Avarice would rob us of our Property, for which we have toiled, and on which we subsist; when they would enslave the free-born Mind, and compel us meanly to cringe to Usurpation and Arbitrary Power; when they would tear from our eager Grasp the most valuable Blessing of Heaven, I mean our RELIGION: when they invade our Country, formerly the Region of Tranquillity, ravage our Frontiers, butcher our Fellow-Subjects, or confine them in a barbarous Captivity in the Dens of Savages; when our earthly All is ready to be seized by rapacious Hands, and even our Eternal All is in Danger by the Loss of our Religion: when this is the Case, what is then the Will of God?

Must Peace then be maintained? maintained with our perfidious and cruel Invaders? maintained at the Expense of Property, Liberty, Life, and every Thing dear and valuable? maintained, when it is in our Power to vindicate our Right, and do ourselves Justice? Is the Work of Peace then our only Business? No; in such a Time even the God of Peace proclaims by his Providence, “To ARMS!” Then the Sword is, as it were, consecrated to God; and the Art of WAR becomes a Part of our Religion. Then happy is he that shall reward our Enemies, as they have served us. Blessed is the brave Soldier: blessed is the Defender of his Country, and the Destroyer of its Enemies. Blessed are they who offer themselves willingly in this Service, and who faithfully discharge it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The curse of cowardice. A sermon preached to the militia of Hanover County, in Virginia, at a general muster, May 8, 1758. With a view to raise a company for Captain Samuel Meredith</cite>, (Boston: Z. Fowle and S. Draper, 1759), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

vice%2C+and+who+faithfully+discharge+it.%E2%80%9D%0A%0A%E2%80%94+Samuel+Davies%2C+The+curse+of+cowardice.+A+sermon+preached+to+the+militia+of+Hanover+County%2C+in+Virginia%2C+at+a+general+muster%2C+May+8%2C+1758.+With+a+view+to+raise+a+company+for+Captain+Samuel+Meredith%2C+%28Boston%3A+Z.+Fowle+and+S.+Draper%2C+1759%29%2C+pp+3-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4ce369237.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4ce369237.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/26/samuel-davies-on-the-need-to-take-up-arms-in-defence-of-religion-and-liberty/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>IV. (3) We must observe that the right of God (as far as regards creatures) is either of dominion (which includes the right of possessing, disposing and using creatures, as a lord or proprietor, who is able to use and enjoy his own property at pleasure); or of government (which properly refers to rational creatures whom He governs as ruler and legislator; to whom belong legislation, judgment and execution…)… … XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist). … XXXII. …(3) Nor assuredly can the Egyptians [at the Exodus, with reference to them giving their belongings to the Israelites] themselves be considered the lawful owners in the court of heaven with God, but only usurpers (as also other wicked men, although in the forum of earth and with men they are esteemed such)… XXXIII. Although it was not lawful to move a sickle into a neighbor’s standing corn, still the liberty was formerly lawfully granted to a passing traveller, either to pluck ears of corn from the field or grapes from a vineyard for the sake of satisfying hunger (Dt. 23:24,25). This was done not by dispensing with the law of theft, but by its true interpretation for it was a work of necessity, permitted by the supreme Lord for the purpose of binding men more closely in the bonds of love. If these acts have any indecency in themselves, they cease to be such when the divine command (or instinct or vocation) intervenes, imposing such a necessity or conceding liberty.</p></blockquote>

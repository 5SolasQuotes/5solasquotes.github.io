<main class="wrap"><figure class="quote" id="q-701182ebe7" data-kw="">
<blockquote><p>What then, O knights, is this stupendous misapprehension and what this unbearable impulse which bids you fight with such pomp and pains, and all to no purpose save death and sin? You drape your horses in silk, and plume your armour with I know not what sort of rags; you paint your shields and your saddles; you adorn your bits and spurs with gold and silver and precious stones, and then in all this pomp, with shameful wrath and fearless folly, you charge to your death. Are these the trappings of a warrior or are they not rather the trinkets of a woman? Do you think the swords of your foes will be deflected by your gold, spare your jewels or fail to pierce your silks?

As you yourselves have often certainly experienced, there are three things especially needful to a warrior: a knight must guard his person with vigour, shrewdness, and caution; he must be unimpeded in his movements, and he must be quick to draw his sword. You, by contrast, blind yourselves with effeminate tresses and trip yourselves up with long, voluminous tunics, burying your tender, delicate hands in cumbersome, flowing sleeves. Over and above all this, there is that terrible insecurity of conscience, in spite of all your armour, since you have dared to undertake so dangerous a business on such slight and frivolous grounds. Nothing stirs you to battle or rouses you to disputes, really, except flashes of irrational anger, hunger for empty glory, or hankering after some earthly possessions? For causes like these It certainly is not safe to kill or to be killed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Praise of the New Knighthood: A Treatise on the Knights Templar and the Holy Places of Jerusalem</cite>, trans. M Conrad Greenia (c. 1130; Piscataway NJ: Gorgias Press, 2010), 2.3, pp 37-38.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3ffcc16b4a" data-kw="">
<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-c1eaded1ee" data-kw="">
<blockquote><p>Christ is also the legislative Head of the Church. All her laws and ordinances are of Christ’s appointment. The ordinances of the Mosaic economy were prescribed by the Redeemer (Acts vii. 38); and when these had served their object, the same power which instituted those ancient rites abolished them, and in their stead appointed the precious ordinances of the New Testament (Matt. xxviii. 19, 20). The legislative power of Christ is completely ignored by the Church of Rome; for that church has not only repealed and set aside the laws and institutions which Christ has appointed, but she has also instituted laws and ordinances in addition, and in flat opposition, to the laws and ordinances appointed by the Great Lawgiver. The Church of England also has, in the most unwarrantable manner, prescribed holidays, introduced the rite of confirmation, and required the sign of the cross, and godfathers and godmothers in baptism, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 30.</span></figcaption>

</figure><figure class="quote" id="q-da6a422848" data-kw="sabbath partly moral ceremonial">
<blockquote><p>Whether the first institution of the Sabbath was in the fourth commandment; and whether the commandment is partly moral, partly ceremonial. The former we deny; the latter we affirm. The true derivation of the word is from the verb shbhth (i.e., “to cease” or “to rest”), which relates either to the existence of a thing, when it ceases to be and fails, or to the operation of an agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.13.1</span></figcaption>

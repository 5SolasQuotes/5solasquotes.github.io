<main class="wrap"><figure class="quote" id="q-aa558cd29f" data-kw="">
<blockquote><p>Here they depart once again from the teaching of Augustine, who taught not only that concupiscence did not exist in man before the fall (which our [Romanist] opponents grant), as he teaches constantly throughout book 14 of City of God, such as in chapter 23… but Augustine also says that it is contrary to nature, and a defilement of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matt-hedges.html">Matt Hedges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Was Concupiscence Natural to Adam in Pure Nature?’ (2026)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>
<div class="actions"><button class="copy" data-copy="“Here they depart once again from the teaching of Augustine, who taught not only that concupiscence did not exist in man before the fall (which our [Romanist] opponents grant), as he teaches constantly throughout book 14 of City of God, such as in chapter 23… but Augustine also says that it is contrary to nature, and a defilement of it.”

— Matt Hedges, ‘Was Concupiscence Natural to Adam in Pure Nature?’ (2026)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+they+depart+once+again+from+the+teaching+of+Augustine%2C+who+taught+not+only+that+concupiscence+did+not+exist+in+man+before+the+fall+%28which+our+%5BRomanist%5D+opponents+grant%29%2C+as+he+teaches+constantly+throughout+book+14+of+City+of+God%2C+such+as+in+chapter+23%E2%80%A6+but+Augustine+also+says+that+it+is+contrary+to+nature%2C+and+a+defilement+of+it.%E2%80%9D%0A%0A%E2%80%94+Matt+Hedges%2C+%E2%80%98Was+Concupiscence+Natural+to+Adam+in+Pure+Nature%3F%E2%80%99+%282026%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faa558cd29f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/aa558cd29f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=Here%20they%20depart%20once%20again%20from,nature%2C%20and%20a%20defilement%20of%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e9a744e0c" data-kw="">
<blockquote><p>But still the images of such things live in my memory, of which I have spoken much, which my habitual way of life has deeply imprinted there, and they occur to me awake, although lacking strength, but in sleep not only to the point of pleasure, but even to the point of consent and an act very like the reality. And such is the force of illusion in my soul and in my flesh, that false visions persuade my sleeping mind of things which true visions cannot persuade my waking mind. Cannot your hand, O All-Powerful God, heal all the languors of my soul and by a more abundant grace extinguish even the lascivious motions of my sleep? You will increase in me more and more, O Lord, your gifts, that my soul may not be rebellious to itself and that not only in sleep it may not perpetrate those turpitudes of corruptions through animal imaginations even to the flow of the flesh, but may not even consent to them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’ tr. Onku with AI (Leiden: Johann Elsevir, 1660), sect. 15-20 Latin | XVII. And so even during dreams we sometimes sin, being conscious of which, pious people more diligently commend themselves to God before sleep, lest they be defiled by any foul or evil thought, and they specially confess to God and grieve over sins committed during sleep. Augustine did this in his Confessions, Book 10, Chapter 30:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

in+his+Confessions%2C+Book+10%2C+Chapter+30%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e9a744e0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e9a744e0c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=But%20still%20the%20images%20of%20such,may%20not%20even%20consent%20to%20them%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5804290e2a" data-kw="Free Will">
<blockquote><p>It is to be distinguished from natural concupiscence, that which God sowed in our nature, such as the concupiscence for food and drink, by which our bodies are nourished.—Evil concupiscence of itself is sin, even if the consent of the will be not added.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma Theologiae</cite>, 6.3 (quoted in Heppe, Reformed Dogmatics)</span></figcaption>

</figure><figure class="quote" id="q-45aba695e3" data-kw="">
<blockquote><p>…and the ignorance of any questions which may be cleared by God’s Word, is vincible and culpable, for the Law says, ‘The ignorance of these things which we are obliged to know is culpable, and excuses not.’ (Reg. juris Culpabilis est ignorantia rerum quas scire tenemur.) But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no, whether Titus committed murder, or no, and in this there is sometimes invincible ignorance when all diligence morally possible is given to come to the knowledge of the fact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644) | pt. 1, ch. 3, Section 3, Question 4</cite>, p. 45</span></figcaption>

</figure><figure class="quote" id="q-1b3756b939" data-kw="">
<blockquote><p>The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, 4.3.21</span></figcaption>

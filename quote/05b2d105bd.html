</figure><figure class="quote" id="q-a87fa16892" data-kw="">
<blockquote><p>…the precepts of the natural law are general, and require to be determined: and they are determined both by human law and by Divine law. And just as these very determinations which are made by human law are said to be, not of natural, but of positive law; so the determinations of the precepts of the natural law, effected by the Divine law, are distinct from the moral precepts which belong to the natural law. Wherefore to worship God, since it is an act of virtue, belongs to a moral precept; but the determination of this precept, namely that He is to be worshipped by such and such sacrifices, and such and such offerings, belongs to the ceremonial precepts. Consequently the ceremonial precepts are distinct from the moral precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, pt. 1</cite>, Question 99, ‘Of the Precepts of the Old Law’, Article 3, ‘Whether the Old Law comprises ceremonial, besides moral, precepts?’, Reply to Objection 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-bb50f85b0d" data-kw="">
<blockquote><p>Doctrine 9. Godliness is the chief and most necessary of all virtues. By godliness we mean true religion towards God, and a mind wholly given to the true worship of God. Reason 1. Because it has the noblest object, that is, God Himself. 2. Because it does most of all perfect all other virtues, while it refers them and all their acts to a divine beginning and a divine end. For godliness subjects the mind to God in all things, so that it acknowledges God to be the author of all good, from whom every good and perfect gift comes, and makes Him the chiefest good and the last end to whom all our actions are to be directed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, … (London: Rothwell), on 2 Pet. 1:5-7, p. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

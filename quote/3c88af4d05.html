<main class="wrap"><figure class="quote" id="q-3c88af4d05" data-kw="">
<blockquote><p>Or, they are essential works, by which the persons are conveyed partly toward each other, when for example the Father knows, loves, and glorifies the Son, and the Son in turn the Father; and partly toward the creatures, works by which God knows, loves, elects, and reprobates the creatures: in these particularly occur the divine decrees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, ‘The Actions &amp; Decrees of God’, section 7 of Theoretical-Practical Theology (RHB), vol. 3, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39caced0d9" data-kw="three persons perichoresis">
<blockquote><p>In the one only and most simple essence of God there are three distinct persons so distinguished from each other by incommunicable properties or modes of subsisting that one cannot be the other—although by an inexpressible circum-insession (emperichōrēsin) they always remain and exist in each other mutually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.25.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/distinct-persons.html">Distinct persons</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/coinherence.html">Coinherence</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/personal-properties.html">Personal properties</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 3.25.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn%20the%20one%20only%20and%20most%20simple%20essence%20of%20God%20there%20are%20three%20distinct%20persons%20so%20distinguished%20from%20each%20other%20by%20incommunicable%20properties%20or%20modes%20of%20subsisting%20that%20one%20cannot%20be%20the%20other%E2%80%94although%20by%20an%20inexpressible%20circum-insession%20%28emperich%C5%8Dr%C4%93sin%29%20they%20always%20remain%20and%20exist%20in%20each%20other%20mutually.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.25.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39caced0d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39caced0d9.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-1ac53f2eb7" data-kw="perichoresis coinherence">
<blockquote><p>Here belongs the word emperichōrēseōs which the fathers frequently used … to describe the intimate mutual union of the persons … when “the Son is said to be in the Father, and the Father in the Son” (Jn. 10:38; 14:11). … so as to designate thus that union by which the divine persons embrace each other and permeate each other. So that although always remaining distinct, yet they are never separated from each other, but always coexist; wherever one is, there the other also really is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.13</span></figcaption>

</figure><figure class="quote" id="q-2c3189cb1c" data-kw="person subsistence Sabellians">
<blockquote><p>By person, we mean a subsistence in the divine essence, which, in relation to other persons, is distinguished from them by an incommunicable property. It is not for the Sabellians to odiously attack or disdainfully reject the term “person,” as if it were humanly invented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Trinity, Thesis XI</span></figcaption>

</figure><figure class="quote" id="q-17e6751446" data-kw="">
<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

<main class="wrap"><figure class="quote" id="q-a9862497ce" data-kw="">
<blockquote><p>We have another example of reverence given to such rulers, even in things that were done by them wrongfully. For Jeremiah, being for a time suspended from coming into the Temple, being at liberty, would not (lest, as it seems, he should make a tumult) enter the Temple; and therefore (having written that which he had to say) sent Baruch to read his sermon in the Temple.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, (1584), p. 12 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c82ce27abf" data-kw="">
<blockquote><p>4. By this wild interpretation [of 1 Tim. 5:17 by prelates] men may be [Greek] well-governing pastors, who labor not in the Word and doctrine, and so the dumb [non-preaching] prelates, who hold it all one to be damned to a pulpit, and to a man-mill, shall be pastors worthy of double honor. Now Paul will not say this of a right bishop, 1 Tim. 3:2; Tit. 1:9, because good governing in a pastor includes laboring in the Word and doctrine, as the whole includes the part: For preaching is a special act of overseeing and well-governing of souls, Jer. 1:10; 2 Tim: 4:2. Because the Word is the instrument of pastoral governing, how can pastors rule well by using aright the Word of God, except they labor in the Word, which is the shepherd’s staff: of right governing and painful preaching, Heb. 13:17; Acts 20:28-31.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19, p. 285</span></figcaption>

</figure><figure class="quote" id="q-353437fd6b" data-kw="">
<blockquote><p>The light of nature, which is a spark of the will of God, has taught many useful rules even to pagans, anent the right way of making solemn speeches before others, the most of which are to be applied to preaching with due discretion; so that what is thought unseemly in the one is to be avoided in the other. But the best rules are taken from the preachings of Christ, of the apostles and prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’, in Scottish Puritans: Select Biographies</cite>, vol. 1, p. 288</span></figcaption>

<blockquote><p>Even in Evangelical Churches at this moment men professing subjection to Christ are madly thrusting aside His authority, and subjecting the Church to human caprice. Doctrines and rites and practices for which no Divine warrant can be pleaded are multiplying in the Visible Church. Some so-called Protestant Churches are almost as Ritualistic and idolatrous and disobedient to Christ as Rome itself. And other Protestant Churches are following. There is a kind of procession – Rome leading the way, then Prelatic ritualism close behind, but rapidly shortening their distance, and then other Presbyterian Churches being drawn in because they admire the glitter and pomp of the precession without waiting to consider what is the beginning of it all and what is the end of it all. And while all this is going on Christ is standing by and saying, “Who hath believed our report? And to whom is the arm of the Lord revealed?” “All day long I stretched forth My hands unto a disobedient and gainsaying people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), p. 14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>…the duels which have been fought between princes, which have determined their quarrels by the monomachy of man to man. The crown of England was sometimes in that sort disputed, between Edmund Iron-side, and Canute the Dane: Edward III offered as much to the king of France; the French king to the Emperor Charles V; and Henry the Great, father of our most illustrious queen, made offer to the Duke of Guise his competitor to put a period to their difference by point of spear, his person against his, six against six, or hundred against hundred. I will not say that it is lawful to a prince so to hazard the head of the commonwealth, and in his person, all the body of his estate, but when this way is permitted them, it is, because sovereign princes have not any judge above them who can do them right, so that to obtain reason from their hands who are elevated to as high a pitch of dignity as themselves, there is not any other way but by arms; and these their doings have an outward show of charity: for a prince will say, that he likes better to expose his own person to danger than to see a bloody war that should swallow up many thousands of men and give occasion of an infinite slaughter. And it may be that some people desirous to avoid a general conflict of nation against nation, have sometimes remitted their quarrel to a certain number of men, to be chosen by either side by them to be decided by combat. So three hundred Lacedemonians fought against a like number of the Argiens; three Romans against three Latins; and when David and Ishboseth stood competitors for the royalty, the two generals Joab and Abner caused a combat between twelve soldiers of the tribe of Judah against twelve of the tribe of Beniamin [2 Sam. 2:12-17]. This kind of duel is as it were an abridgement of the war, and yet not very justifiable. There is more appearance in this case than in any of the cases aforementioned: Two armies are ready to fight, he that has the right on his side finds himself inferior in forces, so that if they come to handy-strokes we must all die of necessity: The enemy makes an offer of a single fight, one to one, and offers to stand to the event of this duel; why should we all perish and not rather make legal of this way and expedient, which perchance may give us the victory, or at least will save six thousand men’s lives, and there can but one be slain? But this example has no correspondence with the [private] duel, whereof we now treat, and one may not draw into consequence particular actions which are exploited in war or in the consequence of war, especially in heat of battle…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-duello. The Anatomy of Duels</cite>, … (London: Harper, 1632), pp. 11-14 D’Espagne (1591-1659) was a French protestant pastor and theologian who lived in London for a significant time.</span></figcaption>

<blockquote><p>What is desired ceases to be beautiful to the extent that it is desired. The starry heaven is unspeakably beautiful, said Schopenhauer, because it is desired by no one. Beauty delights us not because it is profitable to us. Our delight in beauty is entirely disinterested. Beauty awakens the kind of movement within our faculty of desiring that creates enjoyment in pure, disinterested, beholding, whether such beholding is physical or spiritual. Truth satisfies our understanding. The good fulfills our desires and awakens our love. Beauty provides rest and delight. Materially and objectively they are one. The true, the good, and the beautiful form one unbreakable triad. All that is, in the same measure that it is, is also true, good and beautiful. This unity can disintegrate only temporarily, in this world of disharmonies… Nonetheless, these three are materially one… The true, the good, and the beautiful differ only formally, insofar as the same thing exists in a varied relationship to the rich organization of our spirit. After all, God Himself is also the truth, the holy [good], and the glory [beautiful].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921), p. 165</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What is desired ceases to be beautiful to the extent that it is desired. The starry heaven is unspeakably beautiful, said Schopenhauer, because it is desired by no one. Beauty delights us not because it is profitable to us. Our delight in beauty is entirely disinterested. Beauty awakens the kind of movement within our faculty of desiring that creates enjoyment in pure, disinterested, beholding, whether such beholding is physical or spiritual. Truth satisfies our understanding. The good fulfills our desires and awakens our love. Beauty provides rest and delight. Materially and objectively they are one. The true, the good, and the beautiful form one unbreakable triad. All that is, in the same measure that it is, is also true, good and beautiful. This unity can disintegrate only temporarily, in this world of disharmonies… Nonetheless, these three are materially one… The true, the good, and the beautiful differ only formally, insofar as the same thing exists in a varied relationship to the rich organization of our spirit. After all, God Himself is also the truth, the holy [good], and the glory [beautiful].”

— Herman Bavinck, Other citations (work not named), pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921), p. 165">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+desired+ceases+to+be+beautiful+to+the+extent+that+it+is+desired.+The+starry+heaven+is+unspeakably+beautiful%2C+said+Schopenhauer%2C+because+it+is+desired+by+no+one.+Beauty+delights+us+not+because+it+is+profitable+to+us.+Our+delight+in+beauty+is+entirely+disinterested.+Beauty+awakens+the+kind+of+movement+within+our+faculty+of+desiring+that+creates+enjoyment+in+pure%2C+disinterested%2C+beholding%2C+whether+such+beholding+is+physical+or+spiritual.+Truth+satisfies+our+understanding.+The+good+fulfills+our+desires+and+awakens+our+love.+Beauty+provides+rest+and+delight.+Materially+and+objectively+they+are+one.+The+true%2C+the+good%2C+and+the+beautiful+form+one+unbreakable+triad.+All+that+is%2C+in+the+same+measure+that+it+is%2C+is+also+true%2C+good+and+beautiful.+This+unity+can+disintegrate+only+temporarily%2C+in+this+world+of+disharmonies%E2%80%A6+Nonetheless%2C+these+three+are+materially+one%E2%80%A6+The+true%2C+the+good%2C+and+the+beautiful+differ+only+formally%2C+insofar+as+the+same+thing+exists+in+a+varied+relationship+to+the+rich+organization+of+our+spirit.+After+all%2C+God+Himself+is+also+the+truth%2C+the+holy+%5Bgood%5D%2C+and+the+glory+%5Bbeautiful%5D.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Other+citations+%28work+not+named%29%2C+pp.+157-66+of+ch.+7%2C+H.+%E2%80%98Conscience+%26+the+Idea+of+Beauty%E2%80%99+in+Foundations+of+Psychology+trans.+Born%2C+Kloosterman+%26+Bolt+2nd+ed.+%281897%3B+1921%29%2C+p.+165&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7520e35a4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7520e35a4a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-beauty/#:~:text=What%20

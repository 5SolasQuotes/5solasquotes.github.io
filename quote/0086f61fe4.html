<main class="wrap"><figure class="quote" id="q-0086f61fe4" data-kw="">
<blockquote><p>Only let us cut ourselves off from passion, lest any root of bitterness springing up trouble us; only let us follow the image; only let us reverence our Archetype. Cut off the bodily passions; cut off also the spiritual. For by how much the soul is more precious than the body, by so much more precious is it to cleanse the soul than the body. And if cleansing of the body be a praiseworthy act, see, I pray you, how much greater and higher is that of the soul.

Cut away the Arian impiety; cut away the false opinion of Sabellius; do not join more than is right, or wrongly sever; do not either confuse the Three Persons into One, or make Three diversities of Nature. The One is praiseworthy if rightly understood; and the Three when rightly divided, when the division is of Persons, not of Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration XXXVII. On the Words of the Gospel, “When Jesus had finished these sayings,” etc. – S. Matt. XIX. I.</cite>, (n.d.), 22 in Nicene and Post-Nicene Fathers 2, 7: 344.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-6d5d649a64" data-kw="">
<blockquote><p>When God is said to desire something which does not occur, such as when He states, “O that there were such a heart in them, that they would fear Me, … that it might be well with them, and with their children for ever!” (Deuteronomy 5:29), or, “O that thou hadst hearkened to My commandments! then had thy peace been as a river” (Isaiah 48:18), He is speaking in the manner of men. Strictly speaking, such can never be said concerning the omniscient, omnipotent, immutable, and most perfect God. Rather, it indicates God‟s displeasure toward sin and how He delights in holiness. It indicates that sin is the reason why those blessings are withheld from them — blessings which they, according to His promise, would have received as a reward upon godliness.

The promises are made upon condition of obedience which is granted to the elect according to God‟s immutable purpose. When God says, “Have I any pleasure at all that the wicked should die? saith the Lord God: and not that He should return from His ways, and live?” (Ezekiel 18:23), this does not suggest that God‟s will is impotent. Rather, it indicates that God has no pleasure in the destruction of men, inasmuch as they are His creatures. He has pleasure in the exercise of righteousness and godliness, and in blessing the godly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 117.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

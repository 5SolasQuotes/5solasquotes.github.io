<main class="wrap"><figure class="quote" id="q-c0b13f9fa1" data-kw="">
<blockquote><p>This paper highlights a set of objections on natural theology addressed by Descartes and Voetius to each other. It shows and expands the common ground Descartes and Voetius held within natural theology. It argues that their contrasting views revolved mainly around the limits of natural theology. For Voetius, natural theology is extrinsically limited by the revealed God, the external principle of faith. For Descartes, metaphysics or natural theology is intrinsically limited by the incomprehensible idea of the Infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vadana-mihai-dragos.html">Vadana Mihai-Dragos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Voetius on the Innate Knowledge of God &amp; the Limits of Natural Theology’ in Annals of the University of Bucharest, Philosophy Series</cite>, vol. LXV, no. 2 (2016), pp. 37-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“This paper highlights a set of objections on natural theology addressed by Descartes and Voetius to each other. It shows and expands the common ground Descartes and Voetius held within natural theology. It argues that their contrasting views revolved mainly around the limits of natural theology. For Voetius, natural theology is extrinsically limited by the revealed God, the external principle of faith. For Descartes, metaphysics or natural theology is intrinsically limited by the incomprehensible idea of the Infinite.”

— Vadana Mihai-Dragos, ‘Descartes &amp; Voetius on the Innate Knowledge of God &amp; the Limits of Natural Theology’ in Annals of the University of Bucharest, Philosophy Series, vol. LXV, no. 2 (2016), pp. 37-50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+paper+highlights+a+set+of+objections+on+natural+theology+addressed+by+Descartes+and+Voetius+to+each+other.+It+shows+and+expands+the+common+ground+Descartes+and+Voetius+held+within+natural+theology.+It+argues+that+their+contrasting+views+revolved+mainly+around+the+limits+of+natural+theology.+For+Voetius%2C+natural+theology+is+extrinsically+limited+by+the+revealed+God%2C+the+external+principle+of+faith.+For+Descartes%2C+metaphysics+or+natural+theology+is+intrinsically+limited+by+the+incomprehensible+idea+of+the+Infinite.%E2%80%9D%0A%0A%E2%80%94+Vadana+Mihai-Dragos%2C+%E2%80%98Descartes+%26+Voetius+on+the+Innate+Knowledge+of+God+%26+the+Limits+of+Natural+Theology%E2%80%99+in+Annals+of+the+University+of+Bucharest%2C+Philosophy+Series%2C+vol.+LXV%2C+no.+2+%282016%29%2C+pp.+37-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0b13f9fa1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0b13f9fa1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cartesianism-against-it/#:~:text=This%20paper%20highlights%20a%20set%20of,the%20incomprehensible%20idea%20of%20the%20Infinite&amp;text=This%20paper%20highlights%20a%20set%20of%20objections%20on&amp;text=limited%20by%20the%20incomprehensible%20idea%20of%20the%20Infinite" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d662f50fd5" data-kw="">
<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>

</figure><figure class="quote" id="q-0914111877" data-kw="">
<blockquote><p>8. The mode of creation is explained by us with these adjuncts… 3. It is not formally the divine volition, nor the relation of Creator to creature, but it is God Himself creating, denominated by way of principle from Himself and active outside Himself. See Thomas with his own ST, pt. 1, q. 45, articles 2 and 3. But [the act of] creation passively taken is something in the created thing, not really as [yet] having its own entity, but distinguished from it ex natura rei [from the nature of the thing] as its mode. See Suárez, Metaphysical Disputations, disp. 20, sect. 5, and Thomas in the Disputed Questions on Creation, art. 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | ‘Concerning Creation’, p. 110</span></figcaption>

<blockquote><p>his [Descartes’] warning… that the main questions about God and the soul’s distinction from the body are among those that should be demonstrated by philosophy rather than theology (Descartes, Meditations on First Philosophy in The Philosophical Writings of Descartes, vol. 2, tr. John Cottingham, et al., Cambridge Univ. Press, 1984, p. 3)… In the branch of philosophy called first philosophy or metaphysics, he accomplished little, only explaining and defending two questions about God’s existence and the soul’s distinction from the body. For apart from those questions belonging to pneumatics and natural theology, he was so caught up in explaining them and defending them against objections that he revealed too clearly his weakness in understanding and judging metaphysical formalities and abstractions. I will not even [describe] how he went about proposing such lofty and difficult philosophical ideas in a methodical, precise, clear, and evident way, or how he dealt with similar things and hypotheses taken or assumed without proof, or the non-principles on which he built his own ideas. Finally, there are the contradictions, confusions, and evasions he typically resorted to when attacked by opponents, like a man who has fallen into water grasping at anything.</p></blockquote>

grasping%20at%20anything&amp;text=his%20%5BDescartes%E2%80%99%5D%20warning&amp;text=who%20has%20fallen%20into%20water%20grasping%20at%20anything" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2df6303391" data-kw="">
<blockquote><p>The systems for mechanization of brain function that were introduced by Descartes, Leibniz, Spinoza and Willis in the 17th century have served well for the design and development of the measurement systems and tools providing new data, but the machine metaphors of computation, representation, and information processing are incompatible with these data… The philosophical system that most clearly and unequivocally conforms to this experimental finding is that of Thomas Aquinas.</p></blockquote>

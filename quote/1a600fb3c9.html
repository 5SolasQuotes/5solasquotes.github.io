<main class="wrap"><figure class="quote" id="q-1a600fb3c9" data-kw="">
<blockquote><p>The father commands the children now in the state of sin, to learn and hear the judgments and testimonies of God, Gen. 18. 19. Exod. 12.27. Psal. 78.3, 5, 6. Joel. 1.2, 3. and that in order to the rod and bodily punishment, Prov. 13.24, Prov. 23.13. With-hold not correction from the child, for if thou beastest him with the rod, he shall not die. 24. Thou shalt beat him with the rod, and shalt deliver his soul from hell. Damnable heresies bring swift destruction, 2 Pet. 2.1. The fourth command is given to the father of the house, Exod. 20. in order to son, servant, and stranger, to cause them to keep the Sabbath; which Nehemiah as a father and a ruler practiced by the sword, Nehem. 13.19, 20, 21, 22. And the like Morally, layeth bands on all Magistrates and Ministers, according to the power of the rod, civil or ecclesiastical committed to them, Eli a father and judge despised God, I Sam. 2.30. in not correcting his sons, for abusing of their priestly power: his sons might have pretended conscience that they could not live upon the ordinary allowance for the priest, and that the law of nature might bear them out in their practices; yea, every man is to take care that he and his house serve the Lord, nor did Joshua as a Magistrate only, chap. 24.15. but as a master of a house so speak, then must the Prince, the Parliament, the Magistrates say the like, and take care according to their places as fathers of the Common-wealth do the same.

Hence we thus argue, what ever coercive power to command, threaten, promise, punish, restrain, reward, God hath given to parents, masters of families, teachers, tutors, officers in war, Kings and Princes, is the good gift of God and a talent to be employed for the good of souls, and in order to their station. Because Kings are to bring their glory and honour to the new Jerusalem: its either Kingly honour and power, which is essentially coactive, or then, it is nothing but that holy rich men that bring their glory to it, Rev. 21.24. And Kings shall minister to the Church. It is either royal service as Kings, or then no more favour is bestowed on the Church, then if private men ministered to the Church, Esa. 60 ver. 10. And if it be not for the beautifying of the House of God at Jerusalem, in obeying the Law of God, and inflicting death, or banishment on the refusers of obedience, as the Persian Monarch did, Ezr. 7.25.26, 27, 28. It is not glory brought to Jerusalem. But such a coercive power hath the Lord given, as a talent and gift to parents, masters, teachers, tutors, officers, Kings and Princes: as these places evince.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A free disputation against pretended liberty of conscience</cite>, (London, 1649), pp 175-6.</span></figcaption>

<blockquote><p>Now, you have heard what usury is, and of what it is derived; you shall hear the unlawfulness of it.

First, It is against the law of charity, because charity biddeth us to give every man his own, and to require no more than our own; but usury requireth more than our own, and gives not to other their own. Charity rejoiceth to communicate her goods to other, and usury rejoiceth to gather other men’s goods to herself.

Secondly, It is against the law of nations; for every nation hath some law against usury, and some restraints against usurers, as you shall hear when we speak of the punishment.

Thirdly, As it is against the law of nations, so it is against the law of nature; that is, the natural compassion which should be amongst men. You see a river when it goeth by an empty place, it will not pass until it hath filled that empty place, and then it goeth forward to another empty place, and filleth it; and so to another place, and filleth it; always filling the places which are empty. So should we; the rich should fill the poor, the full should fill the hungry, they which abound should fill them which want; for the rich are but God’s almoners, and their riches are committed to them of God, to distribute and do good, as God doth himself.

As the water is charitable after a sort, so is the air; for it goeth into empty places too, and filleth them as the water doth. Nature cannot abide that any place should be empty; and therefore the air, though it be a light body, and so naturally ascendeth upward, yet rather than any place in the earth should be empty, the air will descend (as it were) from his throne, and go into caves, into dens, and into dungeons, to fill them.

If the rich were so good to their empty brethren as the air and water are to other empty things; as there is no empty place in the world, so there should be no empty person in the world; that is, the rich in Israel would fill the poor in Israel. But the rich make the poor to fill them; for usurers feed upon the poor, even as great fishes devour the small. Therefore he which said, ‘Let there not be a beggar in Israel, Deut. xv.4, said too, Let there not be an usurer in Israel. For if there be usurers in Israel there will be beggars in Israel; for usurers make beggars, even as lawyers make quarrellers.

Fourthly, It is against the law of God. First, It is forbidden in Exod. xxii. 25, where it is said, ‘If thou lend money unto my people, that is, to the poor with thee, thou shalt not oppress them with usury.’ Here is usury called oppression; therefore if oppression be a sin, usury is a sin too. Secondly, It is forbidden, Lev. xxv. 37, where it is said, ‘Thou shalt not give thy money to usury, nor lend thy victuals for increase.” Here you may see that men may be usurers of victuals and other things, as well as of money. Thirdly, It is forbidden in Deut. xxiii. 19, where it is said, ‘Thou shalt not lend unto thy brother upon usury.’

And lest you should say that he meaneth but one kind of usury, he sheweth that he meaneth all kinds of usury; for after, in the 19th verse he saith, ‘As usury of money, usury of victuals, usury of corn, or usury of anything that is given to usury;’ because some are no usurers of money, but some are usurers of victuals, some are usurers of cloth, some are usurers of corn, some are usurers of wine, some are usurers of oil, and some of one thing, and some of another; and none would be counted usurers but they which lend money unto usury; therefore God forbiddeth so precisely usury of anything, shewing that all usury is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Examination of Usury. In Two Sermons</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 91-92.</span></figcaption>

— Henry Smith, The Examination of Usury. In Two Sermons, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 91-92.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow%2C+you+have+heard+what+usury+is%2C+and+of+what+it+is+derived%3B+you+shall+hear+the+unlawfulness+of+it.%0A%0AFirst%2C+It+is+against+the+law+of+charity%2C+because+charity+biddeth+us+to+give+every+man+his+own%2C+and+to+require+no+more+than+our+own%3B+but+usury+requireth+more+than+our+own%2C+and+gives+not+to+other+their+own.+Charity+rejoiceth+to+communicate+her+goods+to+other%2C+and+usury+rejoiceth+to+gather+other+men%E2%80%99s+goods+to+herself.%0A%0ASecondly%2C+It+is+against+the+law+of+nations%3B+for+every+nation+hath+some+law+against+usury%2C+and+some+restraints+against+usurers%2C+as+you+shall+hear+when+we+speak+of+the+punishment.%0A%0AThirdly%2C+As+it+is+against+the+law+of+nations%2C+so+it+is+against+the+law+of+nature%3B+that+is%2C+the+natural+compassion+which+should+be+amongst+men.+You+see+a+river+when+it+goeth+by+an+empty+place%2C+it+will+not+pass+until+it+hath+filled+that+empty+place%2C+and+then+it+goeth+forward+to+another+empty+place%2C+and+filleth+it%3B+and+so+to+another+place%2C+and+filleth+it%3B+always+filling+the+places+which+are+empty.+So+should+we%3B+the+rich+should+fill+the+poor%2C+the+full+should+fill+the+hungry%2C+they+which+abound+should+fill+them+which+want%3B+for+the+rich+are+but+God%E2%80%99s+almoners%2C+and+their+riches+are+committed+to+them+of+God%2C+to+distribute+and+do+good%2C+as+God+doth+himself.%0A%0AAs+the+water+is+charitable+after+a+sort%2C+so+is+the+air%3B+for+it+goeth+into+empty+places+too%2C+and+filleth+them+as+the+water+doth.+Nature+cannot+abide+that+any+place+should+be+empty%3B+and+therefore+the+air%2C+though+it+be+a+light+body%2C+and+so+naturally+ascendeth+upward%2C+yet+rather+than+any+place+in+the+earth+should+be+empty%2C+the+air+will+descend+%28as+it+were%29+from+his+throne%2C+and+go+into+caves%2C+into+dens%2C+and+into+dungeons%2C+to+fill+them.%0A%0AIf+the+rich+were+so+good+to+their+empty+brethren+as+the+air+and+water+are+to+other+empty+things%3B+as+there+is+no+empty+place+in+the+world%2C+so+there+should+be+no+empty+person+in+the+world%3B+that+is%2C+the+rich+in+Israel+would+fill+the+poor+in+Israel.+But+the+rich+make+the+poor+to+fill+them%3B+for+usurers+feed+upon+the+poor%2C+even+as+great+fishes+devour+the+small.+Therefore+he+which+said%2C+%E2%80%98Let+there+not+be+a+beggar+in+Israel%2C+Deut.+xv.4%2C+said+too%2C+Let+there+not+be+an+usurer+in+Israel.+For+if+there+be+usurers+in+Israel+there+will+be+beggars+in+Israel%3B+for+usurers+make+beggars%2C+even+as+lawyers+make+quarrellers.%0A%0AFourthly%2C+It+is+against+the+law+of+God.+First%2C+It+is+forbidden+in+Exod.+xxii.+25%2C+where+it+is+said%2C+%E2%80%98If+thou+lend+money+unto+my+people%2C+that+is%2C+to+the+poor+with+thee%2C+thou+shalt+not+oppress+them+with+usury.%E2%80%99+Here+is+usury+called+oppression%3B+therefore+if+oppression+be+a+sin%2C+usury+is+a+sin+too.+Secondly%2C+It+is+forbidden%2C+Lev.+xxv.+37%2C+where+it+is+said%2C+%E2%80%98Thou+shalt+not+give+thy+money+to+usury%2C+nor+lend+thy+victuals+for+increase.%E2%80%9D+Here+you+may+see+that+men+may+be+usurers+of+victuals+and+other+things%2C+as+well+as+of+money.+Thirdly%2C+It+is+forbidden+in+Deut.+xxiii.+19%2C+where+it+is+said%2C+%E2%80%98Thou+shalt+not+lend+unto+thy+brother+upon+usury.%E2%80%99%0A%0AAnd+lest+you+should+say+that+he+meaneth+but+one+kind+of+usury%2C+he+sheweth+that+he+meaneth+all+kinds+of+usury%3B+for+after%2C+in+the+19th+verse+he+saith%2C+%E2%80%98As+usury+of+money%2C+usury+of+victuals%2C+usury+of+corn%2C+or+usury+of+anything+that+is+given+to+usury%3B%E2%80%99+because+some+are+no+usurers+of+money%2C+but+some+are+usurers+of+victuals%2C+some+are+usurers+of+cloth%2C+some+are+usurers+of+corn%2C+some+are+usurers+of+wine%2C+some+are+usurers+of+oil%2C+and+some+of+one+thing%2C+and+some+of+another%3B+and+none+would+be+counted+usurers+but+they+which+lend+money+unto+usury%3B+therefore+God+forbiddeth+so+precisely+usury+of+anything%2C+shewing+that+all+usury+is+unlawful.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+The+Examination+of+Usury.+In+Two+Sermons%2C+%281591%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+1%3A+91-92.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa5d26390b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a5d26390b3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/20/henry-smith-on-usury-and-oppression/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7d69275a1e" data-kw="">
<blockquote><p>What all men are taught by the works of creation themselves, their order, harmony, and mutual respect to each other, with reference unto their duty towards God and among themselves, is of the law of nature, although there be not an absolute distinct notion of it inbred in the mind discoverable. It is enough that the mind of man is so disposed as to be ready and fit to receive the discovery and revelation of it.

For the very creation itself is a law unto us, and speaks out that duty that God requireth of us towards himself; for he hath not only so ordered all the works of it that they should be meet to instruct us, or contain an instructive power towards rational creatures, made in that state and condition wherein man was created, which was before described, which hath in it the first notion of a law; but it was the will of God that we should learn our duty thereby, which gives it its complement as a law obliging unto obedience. And it is not only thus in general, with respect unto the whole work of creation in itself, but the ordering and disposal of the parts of it is alike directive and instructive to the nature of man, and hath the force of a law morally and everlastingly obligatory.

Thus, the pre-eminence of the man above the woman, which is moral, ensues upon the order of the creation, in that the man was first made, and “the woman for the man,” as the apostle argues, 1 Cor. xi, 8, 9, 1 Tim. ii. 12, 13. And all nations ought to be obliged hereby, though many of them, through their apostasy from natural light, knew not that either man or woman was created, but, it may be, supposed them to have grown out of the earth like mushrooms; and yet an effect of the secret original impression hereof influenced their minds and practices. So the creation of one man and one woman gave the natural law of marriage, whence polygamy and fornication became transgressions of the law of nature.</p></blockquote>

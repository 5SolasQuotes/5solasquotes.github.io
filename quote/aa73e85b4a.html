<main class="wrap"><figure class="quote" id="q-aa73e85b4a" data-kw="">
<blockquote><p>4. In this expression of ‘the Covenant,’ the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’</cite>, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b610d4c24a" data-kw="">
<blockquote><p>Answer: 1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders. 2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644) | Part 1</cite>, p. 483</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-4ea2f4872f" data-kw="">
<blockquote><p>[On Acts 8:4] And suppose they preached the Word without mission or ordination, this is but like that which Chrysostom, Lib: ad eos qui scandalisati sunt, ch. 19, records as a marvelous extraordinary benefit which did accrue from the bloody persecutions of those ancient times, viz. That in such times the sheep acted the parts of shepherds, being driven away to deserts and mountains, where (by the Spirit of God speaking in them) they converted unbelievers, and gathered Churches: Which concludes nothing against the necessity of ordination in constituted and reformed Churches, for they who were scattered abroad, being driven away in the heat of persecution, might not have the opportunity of ordination, and they went forth to gather Christians to plant Churches, to lay foundations where Christ was not known. Such cases were in the beginning excepted from the state of our present question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions (Edinburgh, 1649), ch. 4</cite>, p. 56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-479cbfa66b" data-kw="">
<blockquote><p>Ordination is the act of a presbytery.[t] The power of ordering the whole work of ordination is in the whole presbytery, which, when it is over more congregations than one, whether these congregations be fixed or not fixed, in regard of officers or members, it is indifferent as to the point of ordination.[v] [t] 1 Tim. 4:14. [v] 1 Tim. 4:14. It is very requisite, that no single congregation, that can conveniently associate, do assume to itself all and sole power in ordination: 1. Because there is no example in scripture that any single congregation, which might conveniently associate, did assume to itself all and sole power in ordination; neither is there any rule which may warrant such a practice. 2. Because there is in scripture example of an ordination in a presbytery over diverse congregations; as in the church of Jerusalem, where were many congregations: these many congregations were under one presbytery, and this presbytery did ordain. The preaching presbyters orderly associated, either in cities or neighboring villages, are those to whom the imposition of hands doth appertain, for those congregations within their bounds respectively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster’s Form of Presbyterial Church Government 1645 | Touching the Power of Ordination</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-89c5caa1a7" data-kw="">
<blockquote><p>[N]ational covenanting is the fruit of genuine revival of national religion, and that in Christian lands where national covenanting is not observed there is no evidence that national religion has been really revived. Some, we are aware, speak slightingly of covenanting times, but were you to blot out from the history of Zion all the accounts of covenanting times, you would blot out from her history all the accounts of genuine revival times […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hobart.html">Thomas Hobart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National covenanting a national privilege: a sermon, preached in the Rev. J. Chancellor’s church, Belfast</cite>, (Perth, 1874), p. 14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-162e016af7" data-kw="">
<blockquote><p>If these other things of policy be necessary, necessitate precepti [by the necessity of precept], in regard that Jesus Christ has commanded them to be observed, why then are some things alterable which Christ has commanded to be observed, some things unalterable? Cross and surplice, which prelates say have been in the Church these twelve hundred years, are in themselves as positive, and have as small affinity with the civil laws, customs and manners of nations (except they mean sinful customs) as sacramental eating and drinking. And the like may be said of all the alterable ceremonies sometimes in use, in England, and now in force amongst Papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), p. 10</span></figcaption>

</figure><figure class="quote" id="q-97cd29bf36" data-kw="">
<blockquote><p>From this passage let us learn, that we ought to contemplate the providence of God in such a manner as to ascribe to his almighty power the praise which it deserves for righteous government. Although the rectitude by which God regulates his judgments is not always apparent or made visible to us, still it is never lawful to separate his wisdom and justice from his power. But as the Scriptures very frequently state and clearly explain the reason why God does this or that, we ought carefully to examine the cause of his works.

That invention which the Schoolmen have introduced, about the absolute power of God, is shocking blasphemy. It is all one as if they said that God is a tyrant who resolves to do what he pleases, not by justice, but through caprice. Their schools are full of such blasphemies, and are not unlike the heathens, who said that God sports with human affairs. But in the school of Christ we are taught that the justice of God shines brightly in his works, of whatever kind they are, “that every mouth may be stopped,” (Romans 3:19,) and that glory may be ascribed to him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 152.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-e2d96d4349" data-kw="">

<main class="wrap"><figure class="quote" id="q-1e28bc30b0" data-kw="">
<blockquote><p>Alas! Sirs, you may make a shift to pass through this world unsuspected; many Moralists, yea, Christians, may subscribe their Names to your Testimonial, and give you the Right Hand of fellowship in this world, when you must be set at the Left in the next: Things will not then be carried as they are now. Deal faithfully with God and your own Souls; see you have the Root of the Matter, the Life of Grace: you may herd amongst the Sheep now, and be found amongst Goats at last.

A King will give his Subjects liberty to travel into another King’s Dominions, reserving their Loyalty to their own King: Papists in Queen Elizabeth’s days, being commanded to go to Church, or be punished, sent to the Pope for a Resolution of this Case of Conscience: His Answer was, They might comply; but Fili, da mihi cor, My Son, give me thy Heart: Thus the Devil will give you leave to read, pray, hear, receive, attend on Ordinances; but as long as he hath you fast by the Heart-strings, you are still his Slaves, none of God’s Servants: for the Soul is the Man: As a man thinketh in his Heart, so is he, Prov. 23.7.

As a man’s Principles are stated, so he receives his denomination, a good or a bad, a Jew, or an Heathen; a Saint or a Bruit. If you have a Beast’s Heart in the shape of a Man, God will esteem you no better than a Beast. And it’s an usual Saying, It is better be a Beast, than be like a Beast. It is the Saying of a Learned Man. Some make the Image of the Living God hewn out of the Stock of a dead Tree: But the New Creature is not such a lifeless thing as many imagine: It is the Spirit of power, of love, and of a sound mind, 2 Tim. 17.

This Text, (saith a good Divine) doth express the three parts of God’s Image in the New Creature … certainly this vital Principle hath strong and vigorous motions God-wards, and against Sin; It’s an holy Spark, working upwards to God, and forwards straight for Heaven: Most Professors are mistaken in this great Work; though Ministers are oft calling on you Sinners to look about you, we tell you, there’s a Cheat in the case, Satan is busy to lay his Brats in God’s Bed.

Counterfeit Coin is common; our Warnings now will be thought of, these frequent Summons will ring in your Ears, our Sermons will have a Repetition in this, or in another world: Conscience will gall you, and you cannot plead Ignorance, or say, [non putâram] I thought not of such a day. How often do we tell you of the danger of dying in your old state, and of that Sulphurous Lake, that thousands are scolded in that once lived as securely as you now do, and they are in an hopeless, helpless Eternity; and how can you tell but this may be the last day? the last warning or overture of Grace, the last knock at your Door? God may say, Away, be gone out of my sight, take him, Devil, I will no more be troubled with such a Miscreant.

But if after all this, you be senseless, and lie still while you are nailed in your Coffin, you are dead, twice dead; and this Security is a confutation of that Principle, that Adam and his Posterity by the Fall, is not dead, but sleepeth, or only in a swound and languor, but life is in him: No, no, this sad Stupor or Spiritual Lethargy, shews it’s not an excitation of a principle, but an infusion of new Life: all our shouting, and rubbing, and pricking, will not recover Sinners; we must leave them to a creating Power, and to him that can raise the Dead.</p></blockquote>

<blockquote><p>To speak more plainly: the word of God at this day, is twofold in the Church of God, 1. immediate. 2. mediate. I call that the immediate word of God, which doth proceed immediately out of God’s own mouth: and that I call mediate, which the Lord speaks by his preacher or Minister. We hold then and avouch, that the holy Scripture is that immediate and primary word of God, and to be unto us in steed of that first, immediate, and lively voice of God himself: yea, that it serves us in place not only of that lively voice of God, but also of the secret and insearchable mind of God, and of God’s unspeakable mysteries.

Our arguments are these: 1. For that this is the very will of God. They have Moses (saith he) and the prophets, that is, the books of Moses and the Prophets, Luk. 16. 29. 2. If we had nothing to supply the defect of the lively voice of God, then doubtless our state were worse then that of the old Church of the Jews, which had the oracles of God: but it is against all light of reason so to affirm.

3. Our third reason is this: The first ground of our faith must be, either the lively voice of God, or the very mind and counsel of God, or something to supply the want of God’s lively voice, and of the secret mind of God, which must also be unto us no less certain and firm, then if we heard God himself speak, or did behold and read the very mind of God; yea the very divine oracles written in God’s own breast: but now we have not the lively voice of God; now we see not the secret mind of God: therefore it must follow that we have something to supply the want of the lively voice of God, even means to reveal unto us the secret mind of God: and nothing can do this, but the sacred Scripture: therefore God’s holy written word is, and must be unto us as the very voice, and as the very mind or will of God himself manifested unto us.

The fourth reason. The Scripture contains all those things which God hath spoken in elder ages, and what God himself hath decreed in his secret counsel (so far as is meet for us to know) concerning our life and salvation: Ergo, &amp;c. Thus far of the immediate word of God. The mediate voice of God, we call the voice of the holy and true Church of God: for albeit men speak, yet the word spoken, is the word of God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), pp 42-43.</span></figcaption>

<blockquote><p>…as we do communicate and are knit in one God, one faith, one law, one baptism, and be partakers of one spiritual table; even so we may communicate and be partakers together of and in those things, which do proceed and come unto us, by the means of the aforesaid things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief &amp; Clear Confession of the Christian faith</cite>, (1574), p. 26</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…as we do communicate and are knit in one God, one faith, one law, one baptism, and be partakers of one spiritual table; even so we may communicate and be partakers together of and in those things, which do proceed and come unto us, by the means of the aforesaid things.”

</figure><figure class="quote" id="q-60632cd793" data-kw="">
<blockquote><p>It is not the holiness of our gifts and services, that secure their acceptance; neither is it the holiness of the persons presenting them. It is Jesus, as our High Priest, presenting his infinitely holy person before God—appearing in the sanctuary above, with holiness engraven upon his priestly brow—that does for us what Aaron did for Israel of old. Unless God had disowned Aaron, and commanded the plate of gold to be torn from his forehead, Israel could not doubt their acceptance. So, unless the Father were to disown his Son, and take from him his Divine priesthood, we have no cause for doubting, no room for uncertainty.

Our imperfect services, our defective prayers, might well excite displeasure, and draw down upon us, not an answer of peace, but of wrath. But the Father looks away from us and our unholiness—he gazes on the spotless forehead of his own holy Son, and his anger is turned away. He sees no iniquity in our persons, and no imperfection in our prayers. No imperfection in us can make him less the Perfect One.

No sin in us or our services can make it less true, that he is the altogether Holy One—holy in his person, holy in his priesthood, holy in his intercession for us before the Father’s throne. Ever bearing the names of his purchased ones upon his jewelled breast, and ever bearing upon his brow the symbol of perfect holiness, as their sin-bearer and substitute, he stands before God glorious all over in his garments of beauty, presenting the “holy things which his Israel hallow in all their holy gifts, that they may be accepted before the Lord.</p></blockquote>

<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>

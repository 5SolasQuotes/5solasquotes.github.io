<main class="wrap"><figure class="quote" id="q-8568d246e9" data-kw="">
<blockquote><p>What do we? what are we about? is it a commendable work? is it agreeable to the Word of God? and suitable to our calling? is it of good report? and all circumstances considered expedient? If so, go on in God’s name and the Lord prosper your handy-works…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Clavis mystica: a Key Opening Diverse Difficult &amp; Mysterious Texts of Holy Scripture (London: 1636), Collection of Sermons, Philip his Memento, 22nd Semon</cite>, p. 287</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“What do we? what are we about? is it a commendable work? is it agreeable to the Word of God? and suitable to our calling? is it of good report? and all circumstances considered expedient? If so, go on in God’s name and the Lord prosper your handy-works…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3b7b5df6f" data-kw="">
<blockquote><p>The qualities in general requisite in all them, who should bear charge in the Kirk, consist in soundness of religion, and godliness of life, according as they are sufficiently set forth in the Word. … Ordination is the separation and sanctifying of the person appointed to God and his Kirk, after he be well tried and found qualified. … All thir [these], as they must be raised up by God, and by him made able for the work whereto they are called; so ought they know their message to be limited within God’s word, without the bounds of which they ought not to pass. … And generally thir [these] two things ought they all to respect: the glory of God, and edifying of his Kirk, in discharging their duties in their calling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-book-of-discipline.html">Second Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 3, How the persons that bear Ecclesiastical functions are to be admitted to their office</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-ee70a06d5d" data-kw="">
<blockquote><p>In fact, if one focuses on the number of doctrines confessed, it could hardly be denied that Roman Catholicism represents classical creedal Christianity, while the Protestant Reformation would seem to be one of the first great steps toward the minimalism we are addressing. But this holds true only if this minimalism is characterized by the number of doctrines confessed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-766387651f" data-kw="">
<blockquote><p>…when you hear the Lord saying, ‘Where I am, there shall also my servant be,’ do not think merely of good bishops and clergymen. But be yourselves also in your own way serving Christ, by good lives, by giving alms, by preaching his name and doctrine as you can; and every father of a family also, be acknowledging in this name the affection he owes as a parent to his family. For Christ’s sake, and for the sake of life eternal, let him be warning, and teaching, and exhorting, and correcting all his household;</p></blockquote>

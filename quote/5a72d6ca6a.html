<main class="wrap"><figure class="quote" id="q-5a72d6ca6a" data-kw="">
<blockquote><p>But we are most sorry, that such as are walking humbly with their God, seeking eagerly after the means of grace and salvation, and making good conscience of all their ways, should be made odious, and that piety, humility, repentance, zeal, conscience, etc. should be mocked, and all by occasion of the [attempted imposing of the English-popish] ceremonies [on the Church of Scotland].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 5</cite>, pp. 23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-db30a8cf5e" data-kw="">
<blockquote><p>True worship of God may be defined generally thus: Worship of God is the true honor shown to God from a sense of his kindness and power towards us, as resulting from his Word. But this honor is not civil, but divine and religious and is seated mainly in the heart and mind. Thus worship arises from the sense of God’s power and kindness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/definitions-of-worship.html">Definitions of Worship</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lambert Daneau d. c. 1590 | Isagogue, p. 110 as quoted in Heinrich Heppe, Reformed Dogmatics ed. Bizer, tr. Thompson (1861; 1950), ch. 1, section, 8</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-489a7b8f18" data-kw="">
<blockquote><p>…necessity itself abolished certain of their [the apostles’] ordinances, as their common feasts of love. Wherefore whatsoever was performed by the apostles in rites and ceremonies, I do not judge that presently, neither yet without some exception, to be followed as a rule. And indeed I wonder not that those ancient fathers, having respect unto their own times, did take away some things, some things add, and somewhat alter. Only herein (with their good leave be it spoken) they seem to me to have often failed, that they neither held any measure in their rites, neither had that due regard to Christian simplicity and purity, as was meet; Epistle 8, fol. 70-71.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As translated by John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’</cite>, p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

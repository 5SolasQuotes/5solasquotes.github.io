<main class="wrap"><figure class="quote" id="q-08d8e4b231" data-kw="">
<blockquote><p>Objection: Be it true that crosses were purposely appointed to be adored, yet not so now. The Jews would not admit of the image of Caesar in the Church, yet they abolished it not, but admitted it in their coin… [Rutherford’s] Answer: 1. Though the cross were first framed for no adoration… … 5. We remove not crosses from coinage, no more than the Jews did the image of Caesar. But we agree with them [the Jews], [Richard] Hooker [an Anglican] being judge, in banishing them from the worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty, pp. 89-92 in The Divine Right of Church Government (London, 1646)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6410d65b06" data-kw="">
<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

</figure><figure class="quote" id="q-3cf2afc866" data-kw="">
<blockquote><p>We have never disapproved of pictures or sculptures; they are of great use in representing histories as well as in civil affairs, especially in describing and depicting plants. So we do not disapprove those arts, but recommend them and affirm that they should be exercised as useful to the Republic.</p></blockquote>

</figure><figure class="quote" id="q-cd3a190048" data-kw="">
<blockquote><p>Universus locus demonstrat deum esse, qui apparuit. Dicitur Angelus, ut cognoscamus, quod is, qui visus est, non est Deus Pater (cuius enim Angelus esset Pater) sed unigenitus Filius, qui magni consilij est angelus, qui sacris discipulis dixit; Omnia quaecun{que} audiui apatre meo, nota fecivobis. Quemadmodum autem angeli nomen posuit, non quidem volens ministrorum quempiam innuere, sed personam unigeniti demonstrare: sic iterum ipsius tum naturam, tum potentiam praedicat, inquiens ipsum dixisse: Ego sum qui sum, et Ego Deus Abraham, Deus Isaack, Deus Iacob, etc.</p></blockquote>

</figure><figure class="quote" id="q-90fb003200" data-kw="">
<blockquote><p>And it is very frivolous that they have always in their mouth that images are certain visible words of God which help the faith of them that be ignorant. For Paul testifies that faith comes by hearing and hearing by the word of God, not by pictures or images. If any be desirous to have Christ pictured, let him read the holy scriptures, let him have in his hand the gospels, the apostolical epistles, and the Acts of the apostles, and let him be oftentimes present at godly sermons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places (London, 1583), pt. 2, ch. 5</cite>, sect. 25, p. 353</span></figcaption>

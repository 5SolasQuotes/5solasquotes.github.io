<main class="wrap"><figure class="quote" id="q-3308ad86b5" data-kw="">
<blockquote><p>39… But that [sanctification] is not perfect in the way, but such it will be in the goal, nor is it given here consummated, but only begun. 40. Sanctification is succeeded by glorification, which consists both in the perfection of sanctity and in the conferring of felicity, which can be regarded partly in the vision of God, partly in love and fruition of God seen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“39… But that [sanctification] is not perfect in the way, but such it will be in the goal, nor is it given here consummated, but only begun. 40. Sanctification is succeeded by glorification, which consists both in the perfection of sanctity and in the conferring of felicity, which can be regarded partly in the vision of God, partly in love and fruition of God seen.”

— Sr. Friedrich Spanheim, Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C39%E2%80%A6+But+that+%5Bsanctification%5D+is+not+perfect+in+the+way%2C+but+such+it+will+be+in+the+goal%2C+nor+is+it+given+here+consummated%2C+but+only+begun.+40.+Sanctification+is+succeeded+by+glorification%2C+which+consists+both+in+the+perfection+of+sanctity+and+in+the+conferring+of+felicity%2C+which+can+be+regarded+partly+in+the+vision+of+God%2C+partly+in+love+and+fruition+of+God+seen.%E2%80%9D%0A%0A%E2%80%94+Sr.+Friedrich+Spanheim%2C+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+%E2%80%98Miscellaneous+Theological+Disputation%E2%80%99%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3308ad86b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3308ad86b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-glorification/#:~:text=But%20that%20%5Bsanctification%5D%20is%20not%20perfect,love%20and%20fruition%20of%20God%20seen&amp;text=But%20that%20%5Bsanctification%5D%20is%20not%20perfect%20in%20the&amp;text=partly%20in%20love%20and%20fruition%20of%20God%20seen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40785982bc" data-kw="">
<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, (RHB), vol. 3, pp. 47-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-a4e61a5c0e" data-kw="">
<blockquote><p>7. Because the state of the church then will be one of perfection and not of edification, the ministry, sacraments, and discipline together with the instituted churches themselves will cease, and the mystical church will remain in immediate communion with God.</p></blockquote>

</figure><figure class="quote" id="q-b1ffe2efcb" data-kw="">
<blockquote><p>4. If indeed theology is considered as it is knowledge endowed by God upon creatures, either communicated in this age or to be communicated in the future age, that theology is ectypal. And this theology is fashioned by God alone from the archetype, as it were, through various ways and degrees of communication; for men turning to and fro in this world, through the grace of revelation; for angels rather, and for blessed spirits in heaven, it is received through the grace of vision, by benefit of which we also, after this life, face to face; that is, before him and closely, shall contemplate him as he is, 1 Jn. 3:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 1, ‘On Sacrosanct Theology’ in A Synopsis of Pure Theology</cite>, (1625) tr. Charles Johnson</span></figcaption>

</figure><figure class="quote" id="q-c09bf5a540" data-kw="">
<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alden-c-mccray.html">Alden C. McCray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Defending ‘Avertive’ Religion</cite>, vol. 82, no. 1 (April 2023), pp. 25-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.”

— Alden C. McCray, ‘Defending ‘Avertive’ Religion: Calvin on the Visio Dei &amp; Moral Theology’ in Reformed Theological Review, vol. 82, no. 1 (April 2023), pp. 25-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgainst+claims+that+John+Calvin+repudiated+the+beatific+vision+and+teleological+virtue+ethics%2C+this+article+demonstrates+the+importance+of+the+visio+Dei+by+examining+sections+of+Calvin%E2%80%99s+exegesis+and+several+important+sermons.+To+explicate+how+such+a+teleology+impacts+the+Christian%E2%80%99s+relation+to+%E2%80%98lower+goods%E2%80%99%2C+it+then+explores+Augustine%E2%80%99s+theology+of+created+being.+Together+these+conversations+contribute+to+an+explanation+of+Calvin%E2%80%99s+view+of+Christian+moral+life+now+through+growth+in+virtue+and+in+relation+to+the+hope+of+seeing+or+contemplating+God.%E2%80%9D%0A%0A%E2%80%94+Alden+C.+McCray%2C+%E2%80%98Defending+%E2%80%98Avertive%E2%80%99+Religion%3A+Calvin+on+the+Visio+Dei+%26+Moral+Theology%E2%80%99+in+Reformed+Theological+Review%2C+vol.+82%2C+no.+1+%28April+2023%29%2C+pp.+25-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc09bf5a540.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c09bf5a540.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Against%20claims%20that%20John%20Calvin%20repudiated,hope%20of%20seeing%20or%20contemplating%20God&amp;text=Against%20claims%20that%20John%20Calvin%20repudiated%20the%20beatific&amp;text=to%20the%20hope%20of%20seeing%20or%20contemplating%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Formula Consensus Helvetica of 1675 is a response to the Amyraldian errors tolerated within the French Reformed Church. The primary author of the Formula was Johann Heinrich Heidegger (pictured), whom Francis Turretin of Geneva and Lucas Gernler of Basel assisted. In this extract, they reject the Amyraldian notion of two decrees (one for the salvation of all men conditionally, and another for the salvation of the elect alone):

Canon VI: Wherefore, we can not agree with the opinion of those who teach: 1) that God, moved by philanthropy, or a kind of special love for the fallen of the human race, did, in a kind of conditioned willing, first moving of pity, as they call it, or inefficacious desire, determine the salvation of all, conditionally, i.e., if they would believe, 2) that he appointed Christ Mediator for all and each of the fallen; and 3) that, at length, certain ones whom he regarded, not simply as sinners in the first Adam, but as redeemed in the second Adam, he elected, that is, he determined graciously to bestow on these, in time, the saving gift of faith; and in this sole act election properly so called is complete.

For these and all other similar teachings are in no way insignificant deviations from the proper teaching concerning divine election; because the Scriptures do not extend unto all and each God’s purpose of showing mercy to man, but restrict it to the elect alone, the reprobate being excluded even by name, as Esau, whom God hated with an eternal hatred (Rom 9:11). The same Holy Scriptures testify that the counsel and will of God do not change, but stand immovable, and God in the, heavens does whatsoever he will (Ps 115:3; Isa 47:10); for God is infinitely removed from all that human imperfection which characterizes inefficacious affections and desires, rashness repentance and change of purpose. The appointment, also, of Christ, as Mediator, equally with the salvation of those who were given to him for a possession and an inheritance that can not be taken away, proceeds from one and the same election, and does not form the basis of election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 521-22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03516e18da" data-kw="">
<blockquote><p>Before leaving these erratic theories, let me briefly advert to Amyraldism, sometimes called hypothetic Universalism, which was ill the last degree disastrous to French Protestantism before the revocation of the Edict of Nantes. I refer to it more especially because the phraseology which it introduced is still current in America, and is found in this country in quarters where we are surprised to find it.

By those who were competent to take the measure of Amyraldism — such as Rivetus, Maresius, and Spanheim — it was regarded as a subtle form of Arminianism, though its author and his followers declared their harmony with the Articles of the Synod of Dort. After a long discussion of this middle way by one synod after another, in 1637 and 1645, Amyraldus, by his protestations to the effect that he assented and consented to the Articles of Dort, succeeded in disarming further opposition, and in obtaining an acquittal from the charge of heterodoxy in 1649.

But it was the death-blow of French Protestantism. The majority of the theologians and pastors soon adopted his opinions. The French Protestant Church virtually ceased to be a witness for the doctrines of grace. A scholar of Amyraldus, Pajon, went farther than his master in minimizing the extent of natural corruption and the power of the Spirit in conversion. For the gracious operations of the Spirit, he, in fact, substituted the moral influence of the word, or moral suasion. After this, it was rather the Jansenists than the Protestants in France that gave any testimony to the doctrines of special grace.

A few years later a terrible storm of persecution broke out, and scattered the French Protestants over the globe. It is not for us to call this a divine retribution, or a visitation in wrath. But few will deny that a deep declension had begun — or hesitate to affirm that the salt was beginning to lose its savour. Of those refugees who were scattered in all directions, no fewer than TWO HUNDRED PASTORS repaired to Holland, and were received with deep sympathy, and yet with due caution.

They were not to be received as pastors into the Walloon Church, unless they subscribed an article binding them to accept the Articles of Dort, and never to refer in public or in private to those Amyraldist and Pajonian doctrines which Spanheim, Jurieu, Saurin, and others regarded as an Arminian leaven which had destroyed the French Protestant Church. These pastors consented to subscribe that article, and the Church was thus freed from the evil leaven by which it was menaced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 322-24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-5ba96ff518" data-kw="">
<blockquote><p>The learned Amyraldus did not service to the cause of the Reformation by his distinction between A PHYSICAL AND MORAL POWER OF BELIEVING IN CHRIST. He supposed the sinner to have the former, but not the latter. He held that Christ died for all men according to a decree of God, by which salvation was secured to sinners on condition of faith; which general decree, according to him, was to be considered as going before the particular decree about giving faith to the elect. When it was mentioned to him that his notion of the general decree now mentioned was absurd, as it suspended the end of Christ’s death on an impossible condition, he denied that the condition was impossible. ‘For,’ said he, ‘though I do not, with the Arminians, deny the impotence of fallen man, or his inability to believe (I allow him to be morally impotent), yet I hold that man has still a physical or natural power of believing, as he possesses the natural faculties of the understanding and the will.’ Herein Amyraldus has given a sad example of the abuse of great parts. Shall we suppose that when Christ undertook for sinners in the covenant of grace, He considered them any otherwise than as most miserable, lost, dead in sin, utterly impotent (Rom. 5:7; 8:3); or that the wisdom of God gave Christ to die for this end, that sinners might attain salvation by a natural power of believing—a power which Amyraldus confesses could never be exerted? Further, is not faith a most holy and moral act, and, as it takes place in the sinner, [a] purely supernatural act? And shall we allow that a principle which is not moral, but merely physical, can be productive of such a moral and supernatural act? Ought not an act and its principle to correspond with one another? Let the same thing be said of love which Amyraldus has said of faith, and the Pelagians will triumph who used to speak so much about a natural faculty of loving God above all things. Indeed, upon this scheme there will be no keeping out of the Pelagian opinion about the powers of pure nature, and about physical or natural faculties in man of doing what is morally good. For, in confuting that opinion, our divines still maintained that the image of God was requisite in the first man, in order to his exerting such morally good acts as those of loving and seeking true blessedness in the enjoyment of Him. But Amyraldus overthrows this doctrine, while he is led, by the distinction he makes between natural and moral power, to hold that the conception of man’s rational nature necessarily includes in it a power of exerting acts morally good, such as those of desiring and endeavouring to obtain the restoration of communion with the infinitely holy and blessed God. The tendency of this scheme became more manifest when Pajonius—a disciple of Amyraldus—began to deny the necessity of the Spirit’s work in the internal illumination of sinners, in order to their saving conversion. For, said Pajonius, nothing more is necessary to that end than that the understanding which has in itself a sufficiency of clear ideas (according to the language of the Cartesian philosophy then in vogue) should only be struck by the light of external revelation, as the eye is struck by the rays of light coming form a luminous object</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Veritate Religionis Reformatae et Evangelicalae</cite>, (1688), lib. ii., cap. 6, sect. 82; quoted in George Smeaton, The Doctrine of the Holy Spirit (Great Britain: Banner, rep. 1958), pp. 363-364</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The learned Amyraldus did not service to the cause of the Reformation by his distinction between A PHYSICAL AND MORAL POWER OF BELIEVING IN CHRIST. He supposed the sinner to have the former, but not the latter. He held that Christ died for all men according to a decree of God, by which salvation was secured to sinners on condition of faith; which general decree, according to him, was to be considered as going before the particular decree about giving faith to the elect. When it was mentioned to him that his notion of the general decree now mentioned was absurd, as it suspended the end of Christ’s death on an impossible condition, he denied that the condition was impossible. ‘For,’ said he, ‘though I do not, with the Arminians, deny the impotence of fallen man, or his inability to believe (I allow him to be morally impotent), yet I hold that man has still a physical or natural power of believing, as he possesses the natural faculties of the understanding and the will.’ Herein Amyraldus has given a sad example of the abuse of great parts. Shall we suppose that when Christ undertook for sinners in the covenant of grace, He considered them any otherwise than as most miserable, lost, dead in sin, utterly impotent (Rom. 5:7; 8:3); or that the wisdom of God gave Christ to die for this end, that sinners might attain salvation by a natural power of believing—a power which Amyraldus confesses could never be exerted? Further, is not faith a most holy and moral act, and, as it takes place in the sinner, [a] purely supernatural act? And shall we allow that a principle which is not moral, but merely physical, can be productive of such a moral and supernatural act? Ought not an act and its principle to correspond with one another? Let the same thing be said of love which Amyraldus has said of faith, and the Pelagians will triumph who used to speak so much about a natural faculty of loving God above all things. Indeed, upon this scheme there will be no keeping out of the Pelagian opinion about the powers of pure nature, and about physical or natural faculties in man of doing what is morally good. For, in confuting that opinion, our divines still maintained that the image of God was requisite in the first man, in order to his exerting such morally good acts as those of loving and seeking true blessedness in the enjoyment of Him. But Amyraldus overthrows this doctrine, while he is led, by the distinction he makes between natural and moral power, to hold that the conception of man’s rational nature necessarily includes in it a power of exerting acts morally good, such as those of desiring and endeavouring to obtain the restoration of communion with the infinitely holy and blessed God. The tendency of this scheme became more manifest when Pajonius—a disciple of Amyraldus—began to deny the necessity of the Spirit’s work in the internal illumination of sinners, in order to their saving conversion. For, said Pajonius, nothing more is necessary to that end than that the understanding which has in itself a sufficiency of clear ideas (according to the language of the Cartesian philosophy then in vogue) should only be struck by the light of external revelation, as the eye is struck by the rays of light coming form a luminous object”

— Melchior Leydekker, De Veritate Religionis Reformatae et Evangelicalae, (1688), lib. ii., cap. 6, sect. 82; quoted in George Smeaton, The Doctrine of the Holy Spirit (Great Britain: Banner, rep. 1958), pp. 363-364">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+learned+Amyraldus+did+not+service+to+the+cause+of+the+Reformation+by+his+distinction+between+A+PHYSICAL+AND+MORAL+POWER+OF+BELIEVING+IN+CHRIST.+He+supposed+the+sinner+to+have+the+former%2C+but+not+the+latter.+He+held+that+Christ+died+for+all+men+according+to+a+decree+of+God%2C+by+which+salvation+was+secured+to+sinners+on+condition+of+faith%3B+which+general+decree%2C+according+to+him%2C+was+to+be+considered+as+going+before+the+particular+decree+about+giving+faith+to+the+elect.+When+it+was+mentioned+to+him+that+his+notion+of+the+general+decree+now+mentioned+was+absurd%2C+as+it+suspended+the+end+of+Christ%E2%80%99s+death+on+an+impossible+condition%2C+he+denied+that+the+condition+was+impossible.+%E2%80%98For%2C%E2%80%99+said+he%2C+%E2%80%98though+I+do+not%2C+with+the+Arminians%2C+deny+the+impotence+of+fallen+man%2C+or+his+inability+to+believe+%28I+allow+him+to+be+morally+impotent%29%2C+yet+I+hold+that+man+has+still+a+physical+or+natural+power+of+believing%2C+as+he+possesses+the+natural+faculties+of+the+understanding+and+the+will.%E2%80%99+Herein+Amyraldus+has+given+a+sad+example+of+the+abuse+of+great+parts.+Shall+we+suppose+that+when+Christ+undertook+for+sinners+in+the+covenant+of+grace%2C+He+considered+them+any+otherwise+than+as+most+miserable%2C+lost%2C+dead+in+sin%2C+utterly+impotent+%28Rom.+5%3A7%3B+8%3A3%29%3B+or+that+the+wisdom+of+God+gave+Christ+to+die+for+this+end%2C+that+sinners+might+attain+salvation+by+a+natural+power+of+believing%E2%80%94a+power+which+Amyraldus+confesses+could+never+be+exerted%3F+Further%2C+is+not+faith+a+most+holy+and+moral+act%2C+and%2C+as+it+takes+place+in+the+sinner%2C+%5Ba%5D+purely+supernatural+act%3F+And+shall+we+allow+that+a+principle+which+is+not+moral%2C+but+merely+physical%2C+can+be+productive+of+such+a+moral+and+supernatural+act%3F+Ought+not+an+act+and+its+principle+to+correspond+with+one+another%3F+Let+the+same+thing+be+said+of+love+which+Amyraldus+has+said+of+faith%2C+and+the+Pelagians+will+triumph+who+used+to+speak+so+much+about+a+natural+faculty+of+loving+God+above+all+things.+Indeed%2C+upon+this+scheme+there+will+be+no+keeping+out+of+the+Pelagian+opinion+about+the+powers+of+pure+nature%2C+and+about+physical+or+natural+faculties+in+man+of+doing+what+is+morally+good.+For%2C+in+confuting+that+opinion%2C+our+divines+still+maintained+that+the+image+of+God+was+requisite+in+the+first+man%2C+in+order+to+his+exerting+such+morally+good+acts+as+those+of+loving+and+seeking+true+blessedness+in+the+enjoyment+of+Him.+But+Amyraldus+overthrows+this+doctrine%2C+while+he+is+led%2C+by+the+distinction+he+makes+between+natural+and+moral+power%2C+to+hold+that+the+conception+of+man%E2%80%99s+rational+nature+necessarily+includes+in+it+a+power+of+exerting+acts+morally+good%2C+such+as+those+of+desiring+and+endeavouring+to+obtain+the+restoration+of+communion+with+the+infinitely+holy+and+blessed+God.+The+tendency+of+this+scheme+became+more+manifest+when+Pajonius%E2%80%94a+disciple+of+Amyraldus%E2%80%94began+to+deny+the+necessity+of+the+Spirit%E2%80%99s+work+in+the+internal+illumination+of+sinners%2C+in+order+to+their+saving+conversion.+For%2C+said+Pajonius%2C+nothing+more+is+necessary+to+that+end+than+that+the+understanding+which+has+in+itself+a+sufficiency+of+clear+ideas+%28according+to+the+language+of+the+Cartesian+philosophy+then+in+vogue%29+should+only+be+struck+by+the+light+of+external+revelation%2C+as+the+eye+is+struck+by+the+rays+of+light+coming+form+a+luminous+object%E2%80%9D%0A%0A%E2%80%94+Melchior+Leydekker%2C+De+Veritate+Religionis+Reformatae+et+Evangelicalae%2C+%281688%29%2C+lib.+ii.%2C+cap.+6%2C+sect.+82%3B+quoted+in+George+Smeaton%2C+The+Doctrine+of+the+Holy+Spirit+%28Great+Britain%3A+Banner%2C+rep.+1958%29%2C+pp.+363-364&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ba96ff518.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ba96ff518.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=The%20learned%20Amyraldus%20did%20not%20service,light%20coming%20form%20a%20luminous%20object&amp;text=The%20learned%20Amyraldus%20did%20not%20service%20to%20the&amp;text=rays%20of%20light%20coming%20form%20a%20luminous%20object" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-755e0e1434" data-kw="">
<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>

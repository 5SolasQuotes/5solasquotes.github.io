<blockquote><p>The synod’s meaning may be gathered from the solemn warning they give to all the people in that province, even to the people of Muckhard, etc. ‘To beware of everything that may encourage division from, or weaken the hands of the Lord’s servants set over them;’ that is, say they, that they submit to the ministry even of such intruders, and take sealing ordinances from their hands.</p></blockquote>

<blockquote><p>64. Is universal doubt necessary in order to knowledge and sound conviction of natural theology, as some have taught? Ans. No; it is useless, impossible, sinful, and dangerous.

65. Wherein useless? Ans. Doubt gives no light, removes no bias of mind or affections, and does not dispose the mind to a thorough investigation.

66. Why or wherein impossible? Ans. We cannot at plea sure remove all convictions.

67. How is it sinful? Ans. It rejects the love, fear, reverence, obedience, and worship, due to God, for the time, and trifles with light and evidences already received.

68. How is it dangerous? Ans. It trifles with light and conviction, refuses duty for the time, and God may judicially harden and blind us; Isa. vi. 9, 10; xliv. 18, 19.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d485beb761" data-kw="">
<blockquote><p>When he [Paul] says, Let no one judge you on the subject of eating and drinking, he may be understood generally to refer to articles of diet; in respect to these, the distinction as between clean and unclean was now gone; and whatever one might take he must not on this score be judged, or held to act unsuitably to the true ideal of a Christian life. And, in like manner, with respect to, or in the matter of (for such undoubtedly is the meaning of ἐν μέρει) a feast, a stated solemnity (such as the Passover or Pentecost), or of a new moon (not strictly a holy day, except the seventh, but one marked by a few additional observances), or of Sabbaths.

That the latter include, and indeed chiefly designate, the weekly Sabbath of the Jews, can admit of no reasonable doubt, both from days of that description comprising by far the greater part of those bearing the name of Sabbaths, and also because nearly, if not all, the other days to which the term Sabbath was applied, were already embraced in the feasts and new moons previously specified. Thus the distinctively sacred days appointed in the Mosaic law, together with its stated festivals, its distinctions of clean and unclean in food, and, by parity of reason, other things of a like outward and ceremonial nature, are here placed in one category, and declared to be no longer binding on the consciences of believers, or needful to their Christian progress.

And for this reason, that they were all only shadows of things to come, while the body is of Christ; that is, they were no more than imperfect and temporary prefigurations of the work He was to accomplish, and the benefits to be secured by it to those who believe; and as such, of course, they fell away when the great reality appeared. It might seem as if something further should have been concluded not merely the non-obligatory observance of those shadowy institutions of the old covenant, but, as in the Epistle to the Galatians, the essential antichristianism of their observance. There is, however, a difference in the two cases; the churches of Galatia had actually fallen back upon Jewish observances as necessary to their salvation, but the Colossians were as yet only exposed to the temptation of having in their neighbourhood persons whose teaching and practice lay in a similar direction. So far as yet appeared, correct views of the truth and of their liberty in Christ might be all that was required to guard against the danger.

But was there no danger from the apostle’s own doctrine in another direction? In coupling Sabbath days with the other peculiar observances of Judaism, as things done away in Christ, does he not strike at the obligation of maintaining the observance of one day in seven for the more especial service of God, and break the connection between the Lord’s day of Christians and the Sabbath of earlier times? So it has often been alleged, and, among others, very strongly by [Henry] Alford, who says, ‘If the observance of the Sabbath had been, in any form, of lasting obligation on the Christian church, it would have been quite impossible for the apostle to have spoken thus. The fact of an obligatory rest of one day, whether the seventh or the first, would have been directly in the teeth of his assertion here: the holding of such would have been still to retain the shadow, while we possess the substance.’ To this [Charles] Ellicott justly replies, that such an assertion ‘cannot be substantiated. The Sabbath of the Jews (he adds), as involving other than mere national reminiscences, was a σκιὰ (shadow) of the Lord’s day: that a weekly seventh part of our time should be specially devoted to God, rests on considerations as old as the creation: that that seventh portion of the week should be the first day, rests on apostolical, and perhaps, inferentially, Divine usage and appointment.’

Substantially concurring in this, I still deem it better to say, that in so far as the Sabbath was a shadow of any thing in Christian times, it was, with all of a like nature, abolished in Christ; and on that account particularly (though also for other reasons), the day which took its place from the beginning of the Gospel dispensation, and had become known and observed, wherever the Christian church was established, as emphatically the Lord’s day, was changed from the last to the first day of the week. The seventh day Sabbath had been so long regarded as one of the more distinctive badges of Judaism, and had also, as an important factor, entered into many of the other institutions of the old covenant (the stated feasts, the sabbatical year, the year of Jubilee), that it necessarily came to partake, to some extent, of their typical character, and, in so far as it did so, must, like them also, pass away when the time of reformation came.

But this is only one aspect of the sabbatical institution—not the original and direct, but rather a subsidiary and incidental one. As in a peculiar sense the day of God—the day, as Jesus Himself testified, which was made for man, and of which He claimed to be the Lord, the Sabbath was essentially one with the Lord’s day of the Christian church, which, when the apostle wrote, was everywhere recognised and observed by believers. For in that respect there was nothing in the Sabbath of earlier times properly shadowy, or typical of redemption. It commenced before sin had entered, and while yet there was no need for a Redeemer. Nor was there any thing properly typical in the observance of it imposed in the fourth commandment; for this was a substantial re-enforcement of the primary institution, in its bearing on the general relation of men to God, and of members of society to each other.

When associated with the typical services of the old covenant, the same thing virtually happened to it as with circumcision, which was the sign and seal of the Abrahamic covenant of grace, and had no immediate connection with the law of Moses; while yet it became so identified with that law, that it required to be supplanted by another ordinance of nearly similar import when the seed of blessing arrived, in which the Abrahamic covenant was to find its fulfilment. So great had the necessity become for the abolition of the one ordinance and the introduction of the other, that the apostle virtually declares it to have been indispensable, when he affirms (in his Epistle to the Galatians), of those who would still be circumcised, that they were debtors to do the whole law.

At the same time, as regards the original design and spiritual import of circumcision, this he makes coincident with baptism, speaks here (v. 11) of baptized believers as the circumcision of Christ; and so presents the two ordinances as in principle most closely associated with each other, differing in form rather than in substance. We have no reason to suppose his meaning to be different in regard to the Sabbath; it is gone so far as its outward rest on the seventh day formed part of the typical things of Judaism, but no further. Its primaeval character and destination remain. As baptism in the Spirit is Christ’s circumcision, so the Lord’s day is His Sabbath; and to be in the Spirit on that day, worshipping and serving Him in the truth of His Gospel, is to carry out the intent of the fourth commandment.</p></blockquote>

hat+respect+there+was+nothing+in+the+Sabbath+of+earlier+times+properly+shadowy%2C+or+typical+of+redemption.+It+commenced+before+sin+had+entered%2C+and+while+yet+there+was+no+need+for+a+Redeemer.+Nor+was+there+any+thing+properly+typical+in+the+observance+of+it+imposed+in+the+fourth+commandment%3B+for+this+was+a+substantial+re-enforcement+of+the+primary+institution%2C+in+its+bearing+on+the+general+relation+of+men+to+God%2C+and+of+members+of+society+to+each+other.%0A%0AWhen+associated+with+the+typical+services+of+the+old+covenant%2C+the+same+thing+virtually+happened+to+it+as+with+circumcision%2C+which+was+the+sign+and+seal+of+the+Abrahamic+covenant+of+grace%2C+and+had+no+immediate+connection+with+the+law+of+Moses%3B+while+yet+it+became+so+identified+with+that+law%2C+that+it+required+to+be+supplanted+by+another+ordinance+of+nearly+similar+import+when+the+seed+of+blessing+arrived%2C+in+which+the+Abrahamic+covenant+was+to+find+its+fulfilment.+So+great+had+the+necessity+become+for+the+abolition+of+the+one+ordinance+and+the+introduction+of+the+other%2C+that+the+apostle+virtually+declares+it+to+have+been+indispensable%2C+when+he+affirms+%28in+his+Epistle+to+the+Galatians%29%2C+of+those+who+would+still+be+circumcised%2C+that+they+were+debtors+to+do+the+whole+law.%0A%0AAt+the+same+time%2C+as+regards+the+original+design+and+spiritual+import+of+circumcision%2C+this+he+makes+coincident+with+baptism%2C+speaks+here+%28v.+11%29+of+baptized+believers+as+the+circumcision+of+Christ%3B+and+so+presents+the+two+ordinances+as+in+principle+most+closely+associated+with+each+other%2C+differing+in+form+rather+than+in+substance.+We+have+no+reason+to+suppose+his+meaning+to+be+different+in+regard+to+the+Sabbath%3B+it+is+gone+so+far+as+its+outward+rest+on+the+seventh+day+formed+part+of+the+typical+things+of+Judaism%2C+but+no+further.+Its+primaeval+character+and+destination+remain.+As+baptism+in+the+Spirit+is+Christ%E2%80%99s+circumcision%2C+so+the+Lord%E2%80%99s+day+is+His+Sabbath%3B+and+to+be+in+the+Spirit+on+that+day%2C+worshipping+and+serving+Him+in+the+truth+of+His+Gospel%2C+is+to+carry+out+the+intent+of+the+fourth+commandment.%E2%80%9D%0A%0A%E2%80%94+Patrick+Fairbairn%2C+The+Revelation+of+Law+in+Scripture%3A+Considered+with+respect+both+to+its+own+Nature%2C+and+to+its+Relative+Place+in+Successive+Dispensations.+The+Third+Series+of+the+%E2%80%98Cunningham+Lectures%E2%80%99%2C+%28Edinburgh%3A+T.+%26+T.+Clark%2C+1869%29%2C+pp+472-74.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd485beb761.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d485beb761.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/08/20/patrick-fairbairn-on-colossians-216-and-sabbath-observance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>I. The law given by Moses is usually distinguished into three species: moral (treating of morals or of perpetual duties towards God and our neighbor); ceremonial (of the ceremonies or rites about the sacred things to be observed under the Old Testament); and civil, constituting the civil government of the Israelite people. The first is the foundation upon which rests the obligation of the others and these are its appendices and determinations. Ceremonial has respect to the first table determining its circumstances, especially as to external worship. Civil has respect to the second table in judicial things, although it lays down punishments for crimes committed against the first table.

II. The truth of this distinction appears from the diversity of the names by which it is designated in the Scriptures. The moral law is for the most part expressed by mtsvth (“precepts”), the ceremonial by chqym (“statutes”) and the judicial by mshptym (“judgments”), which the Septuagint renders by entolas, dikaiōmata and krimata. “I will speak unto thee all the commandments, and the statutes, and the judgments, which thou shalt teach them” (Dt. 5:31); so also in 6:1, 20; 7:11; and Lev. 26:46. Sometimes however these words are synonymous and used promiscuously (Ezk. 5:6; 20:11, 16, 18). But the distinction appears principally from the nature of the thing and the office of the law (whose it is to settle the order according to which man is joined to God and his neighbor). Now man is joined to God first by a certainternal and external likeness—in love and justice, holiness and truth, whose rule the moral law delivers. Again by the external signification and testification of those acts of divine worship (marks and symbols being employed) whose use the ceremonial law prescribes. Finally, what duty man owes to man, the civil law (applied more distinctly to the Israelites) explains. The moral law regards the Israelite people as men; the ceremonial as the church of the Old Testament expecting the promised Messiah; the civil regards them as a peculiar people who in the land of Canaan ought to have a republic suiting their genius and disposition.

III. Hence arises a manifold difference between the moral law and others both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews (the civil, indeed, inasmuch as it regarded them as a distinct state dedicated to God; the ceremonial, however, referring to their ecclesiastical state and state of minority and infancy). In regard to use, the moral is the end of the others, while the others are subservient to the moral. Thus far we have spoken of the moral; now we must discuss the ceremonial.

IV. The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or of signification. It is so called from the object about which it is conversant (viz., the sacred ceremonies or rites that were formerly to be observed in the external worship of God). This is so whether the word ceremony is derived from the Etruscan cerus, meaning “holy,” as sanctimonia from sanctus (according to Joseph Scaliger and Dionysius Gothofredus in notis ad Festum+); or from Ceres which (because the Gauls occupied Rome, they preserved the eternal fire and the vestal virgins) was called the sanctuary of the Roman people and the receptacle of the Roman sacred vessels. The Romans, for the sake of renumeration, called their sacred rites caeremoniae from Ceres (according to Valerius Maximus, Factorum et Dictorum Memorabilium 1.1.10 [ed. C. Kemp, 1966], p. 6; cf. Florus, lib. 1, cap. 13+). Or (what is more probable) from the Hebrew chrm which signifies a thing sacred and devoted to God.

V. It is marked by various names—now by chqym (as mshptym marks the judicial and mtsvth the moral); then by “the law of commandments in ordinances” (nomon tōn entolōn en dogmasi, Eph. 2:15) because its precepts are ordained (dedogmena) (sanctioned by the will of God) having no goodness except from the divine appointment; then by “carnal commandment” (entolēn sarkikēn, Heb. 7:16) and “carnal ordinances” (dikaiōmata sarkos, Heb. 9:10) because they are occupied with prescribing external and corruptible things (which are called carnal in the Scriptures); then by “weak and beggarly elements” (stoicheia asthenē kai ptōcha tou kosmou, Gal. 4:9) because they were the first rudiments and, as it were, the alphabet of the Jewish church. During her infantile state, she ought to have been instructed in them and able to do nothing by herself either for justification or for salvation.</p></blockquote>

e+the+moral+law+delivers.+Again+by+the+external+signification+and+testification+of+those+acts+of+divine+worship+%28marks+and+symbols+being+employed%29+whose+use+the+ceremonial+law+prescribes.+Finally%2C+what+duty+man+owes+to+man%2C+the+civil+law+%28applied+more+distinctly+to+the+Israelites%29+explains.+The+moral+law+regards+the+Israelite+people+as+men%3B+the+ceremonial+as+the+church+of+the+Old+Testament+expecting+the+promised+Messiah%3B+the+civil+regards+them+as+a+peculiar+people+who+in+the+land+of+Canaan+ought+to+have+a+republic+suiting+their+genius+and+disposition.+III.+Hence+arises+a+manifold+difference+between+the+moral+law+and+others+both+in+origin+%28because+the+moral+is+founded+upon+natural+right+and+on+this+account+is+known+by+nature%3B+but+the+others+upon+positive+right+and+on+this+account+are+from+free+revelation%29+and+in+duration.+The+former+is+immutable+and+eternal%3B+the+latter+mutable+and+temporary.+In+regard+to+object%2C+the+one+is+universal+embracing+all%3B+the+others+particular+applying+only+to+the+Jews+%28the+civil%2C+indeed%2C+inasmuch+as+it+regarded+them+as+a+distinct+state+dedicated+to+God%3B+the+ceremonial%2C+however%2C+referring+to+their+ecclesiastical+state+and+state+of+minority+and+infancy%29.+In+regard+to+use%2C+the+moral+is+the+end+of+the+others%2C+while+the+others+are+subservient+to+the+moral.+Thus+far+we+have+spoken+of+the+moral%3B+now+we+must+discuss+the+ceremonial.+IV.+The+ceremonial+law+is+the+system+of+God%E2%80%99s+positive+precepts+concerning+the+external+worship+in+sacred+things%2C+prescribed+to+the+ancient+church%2C+either+for+the+sake+of+order+or+of+signification.+It+is+so+called+from+the+object+about+which+it+is+conversant+%28viz.%2C+the+sacred+ceremonies+or+rites+that+were+formerly+to+be+observed+in+the+external+worship+of+God%29.+This+is+so+whether+the+word+ceremony+is+derived+from+the+Etruscan+cerus%2C+meaning+%E2%80%9Choly%2C%E2%80%9D+as+sanctimonia+from+sanctus+%28according+to+Joseph+Scaliger+and+Dionysius+Gothofredus+in+notis+ad+Festum%2B%29%3B+or+from+Ceres+which+%28because+the+Gauls+occupied+Rome%2C+they+preserved+the+eternal+fire+and+the+vestal+virgins%29+was+called+the+sanctuary+of+the+Roman+people+and+the+receptacle+of+the+Roman+sacred+vessels.+The+Romans%2C+for+the+sake+of+renumeration%2C+called+their+sacred+rites+caeremoniae+from+Ceres+%28according+to+Valerius+Maximus%2C+Factorum+et+Dictorum+Memorabilium+1.1.10+%5Bed.+C.+Kemp%2C+1966%5D%2C+p.+6%3B+cf.+Florus%2C+lib.+1%2C+cap.+13%2B%29.+Or+%28what+is+more+probable%29+from+the+Hebrew+chrm+which+signifies+a+thing+sacred+and+devoted+to+God.+V.+It+is+marked+by+various+names%E2%80%94now+by+chqym+%28as+mshptym+marks+the+judicial+and+mtsvth+the+moral%29%3B+then+by+%E2%80%9Cthe+law+of+commandments+in+ordinances%E2%80%9D+%28nomon+t%C5%8Dn+entol%C5%8Dn+en+dogmasi%2C+Eph.+2%3A15%29+because+its+precepts+are+ordained+%28dedogmena%29+%28sanctioned+by+the+will+of+God%29+having+no+goodness+except+from+the+divine+appointment%3B+then+by+%E2%80%9Ccarnal+commandment%E2%80%9D+%28entol%C4%93n+sarkik%C4%93n%2C+Heb.+7%3A16%29+and+%E2%80%9Ccarnal+ordinances%E2%80%9D+%28dikai%C5%8Dmata+sarkos%2C+Heb.+9%3A10%29+because+they+are+occupied+with+prescribing+external+and+corruptible+things+%28which+are+called+carnal+in+the+Scriptures%29%3B+then+by+%E2%80%9Cweak+and+beggarly+elements%E2%80%9D+%28stoicheia+asthen%C4%93+kai+pt%C5%8Dcha+tou+kosmou%2C+Gal.+4%3A9%29+because+they+were+the+first+rudiments+and%2C+as+it+were%2C+the+alphabet+of+the+Jewish+church.+During+her+infantile+state%2C+she+ought+to+have+been+instructed+in+them+and+able+to+do+nothing+by+herself+either+for+justification+or+for+salvation.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+11.24.1%E2%80%935%3B+pp.+145%E2%80%93147.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f5f5aff92.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f5f5aff92.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/12/turretin-on-the-threefold-distinction-in-the-mosaic-law/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-8ed0f09344" data-kw="">
<blockquote><p>Until the Civil War the various Presbyterian bodies used psalms predominantly, singing hymns only now and then, especially in informal gatherings. Their songbook, Psalms and Hymns, had a clearly defined psalter section. After the Civil War the use of hymns increased greatly. In the Presbyterian Hymnal published in 1874 by the northern branch of the church, psalms were mixed in with hymns. The 1901 Psalms and Hymns of the southern church followed suit.</p></blockquote>

</figure><figure class="quote" id="q-a47cec384e" data-kw="">
<blockquote><p>He grants Translations are of good use, but not in the worship of God: and if of good use elsewhere, why not there? Saint Paul exhorts the Colossians, That the Word of God might dwell in them richly, in all wisdom. They being Grecians, I take it for granted, that the most of them were not skilled in the Hebrew, the New Testament being not written, not any of it, till after Pentecost, not all of it until John a matter of sixty years after Christ’s death. This to the Colossians could not be meant of the New Testament, but of the Old.

So again, the Thessalonians, being Grecians, did not understand the Hebrew, yet they were commanded to prove all things: By what? why by the Scriptures, and this was the Old Testament which, they understanding not (the Hebrew) then it cannot but be meant of the translation.

This Conclusion I think is clear, sith the Churches of the Gentiles were commanded to read Moses and the Prophets, and read them they could not but in a translation; therefore translations are commanded by God, as an Ordinance and constitution of Heaven itself.</p></blockquote>

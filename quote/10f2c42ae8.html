<main class="wrap"><figure class="quote" id="q-10f2c42ae8" data-kw="">
<blockquote><p>Now, what is the cause of most backsliding? I believe, as a general rule, one of the chief causes is neglect of private prayer. Of course the secret history of falls will not be known till the last day. I can only give my opinion as a minister of Christ and a student of the heart. That opinion is, I repeat distinctly, that backsliding generally first begins with neglect of private prayer.

Bibles read without prayer, sermons heard without prayer, marriages contracted without prayer, journeys undertaken without prayer, residences chosen without prayer, friendships formed without prayer, the daily act of private prayer itself hurried over or gone through without heart,—these are the kind of downward steps by which many a Christian descends to a condition of spiritual palsy, or reaches the point where God allows him to have a tremendous fall.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), p. 73.</span></figcaption>

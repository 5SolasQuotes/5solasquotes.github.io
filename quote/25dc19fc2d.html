<main class="wrap"><figure class="quote" id="q-25dc19fc2d" data-kw="">
<blockquote><p>V. Hence arises the question with the Romanists concerning the acceptation of this word—whether it is to be taken precisely in a forensic sense in this affair; or whether it ought also to be taken in a physical and moral sense for the infusion of righteousness and justification, if it is allowable (so to speak) either by the acquisition or the increase of it. For they do not deny that the word justificatio and the verb justificare are often taken in a forensic sense, even in this matter, as Bellarmine (“De Justificatione,” 1.1 Opera [1858], 4:461–62), Tirinus (Theologiae elenchticae … controversarium fidei, Cont. 15, number 1 [1648], pp. 217–21) and Toletus (Commentarii et annotationes in epistolam … ad Romanos, Annot. 13 [1602], pp. 117–22) and not a few others. Yet they do not wish this to be the constant meaning, but that it often signifies a true production, acquisition or increase of righteousness; this is especially the case when employed about the justification of man before God. Hence they distinguish justification into “first and second.” The first is that by which the man who is unjust is made just; the second is that by which a just man is made more just. Hence Bellarmine says: “Justification undoubtedly is a certain movement from sin to righteousness, and takes its name from the terminus to which it leads, as all other similar motions, illumination, calefaction; that is true justification, where some righteousness is aquired beyond the remission of sin.” Thomas Aquinas says, “Justification taken passively implies a motion to making righteous, just as calefaction a motion to heat” (ST, I–II, Q. 113, Art. 1, p. 1144). Now although we do not deny that this word has more than one signification and is taken in different ways in the Scriptures (now properly, then improperly, as we have already said), still we maintain that it is never taken for an infusion of righteousness, but as often as the Scriptures speak professedly about our justification, it always must be explained as a forensic term.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 16.1.5. (emphasis added)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a095e93a3" data-kw="">
<blockquote><p>We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 233.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

og.net/2023/08/luther-christ-the-physician/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-2436d8992f" data-kw="">
<blockquote><p>That popish device of a second justification is a satanical delusion for the Word of God does acknowledge no more but one justification at all, and that absolute and complete of itself. There is but one justice, but one satisfaction of God being offended. Therefore, there cannot be a manifold justification.</p></blockquote>

</figure><figure class="quote" id="q-09257e16db" data-kw="">
<blockquote><p>Therefore we are pronounced righteous, not on the basis of the Law or of works or of our own righteousness but on the basis of pure grace. Paul insisted on the promise so vigorously and stressed it so often because he saw how necessary it is.</p></blockquote>

<blockquote><p>XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?</p></blockquote>

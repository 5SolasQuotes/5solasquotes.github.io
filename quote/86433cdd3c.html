<main class="wrap"><figure class="quote" id="q-86433cdd3c" data-kw="">
<blockquote><p>God as the supreme Lord has true right over the actions of all men, both internal and external, that they may serve his glory and obedience be rendered to him in all things (Luke 17:10), which obedience moreover he as ruler has commanded and sanctioned under the gravest threats (Gen 2:17, Deut 27:26). When man violates this right and denies this obedience to God, he commits two things: 1) he does not acknowledge the lordship of his master over himself, 2) he despises him, even by disdaining his laws before his sight, who pays heed to all the ways of men. Hence this wickedness is so great that none greater can be given; by it man turns away from the infinite good, and consequently merits for himself the privation of the highest good; whence he has been handed over by his Lord, whose obedience he refused, into servitude to the Devil and his servants, that he may be tormented by them in [God’s] name and experience the gravity of the lordship he despised (Jude 5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. Onku with AI (Utrecht, 1650) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41d66bc500" data-kw="">
<blockquote><p>There is also a received distribution of theology into doctrine concerning God and the works of God. Indeed, whatever things are treated in theology are able to be referred to this double doctrine, even sin itself: which, although it is not a work of God, yet it is an accidental property of a divine work, namely, of angels and men; not concreated, but derived from elsewhere, namely, from the fall of angels and men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘The Distribution of Theology’</span></figcaption>

</figure><figure class="quote" id="q-7e8ead5587" data-kw="">
<blockquote><p>Question 5. What are we to judge of those actions which are done through concupiscence. 10th Answer. Concupiscence does not make an act cease to be voluntary, neither does it indeed diminish the voluntariness of it in respect of the act, but increases it rather. For he that does a thing out of concupiscence, has a will strongly inclined to that which it does, as is appears either delightful or profitable to him; if therefore the concupiscence be fixed, the sin’s the greater, as it was in Judas, who betrayed Christ out of covetousness of [money].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, p. 93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

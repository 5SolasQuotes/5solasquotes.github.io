<blockquote><p>1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not. 2. Therefore to such the impossibility is not physical, but moral. 3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.) 4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations. 5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.) 6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Knowledge &amp; Love… (London: Parkhurst, 1689), pt. 2, ch. 14</cite>, pp. 266-69</span></figcaption>

<blockquote><p>(6) That the law does not obligate to what is impossible. I respond, It does not obligate to what is impossible simpliciter, simply, by nature, to man as he is a man, apart from his fault, such as, for example, flying, but it obligates to what is impossible secundum quid [according to which], relatively, by man’s own contumacy, to man as he is a sinner (Rom. 8:3).</p></blockquote>

</figure><figure class="quote" id="q-76df4aac03" data-kw="">
<blockquote><p>…not only was original righteousness taken away on account of the fall, but by the same stroke the entire nature of man was so morally corrupted as regards the intellect, the will, the affections, that by nature he is blind in respect to all spiritual truth, likewise incompetent for any spiritual good, and prone to all evil in respect to his will. These are the chief reasons of the Reformed: (1) Scripture declares that man is dead in sin (Eph. 2:1, 5; Matt. 8:22; 1 Tim. 5:6; Rom. 5:12), yet death pertains to nature. (2) All of man’s faculties are said to be corrupted: a blind intellect (Eph. 4:18), which does not perceive the things that are of the Spirit, and considers them as foolishness (1 Cor. 2:14–15), a will averse to spiritual good, enmity toward God, which does not subject itself to the divine law, neither indeed can it (Rom. 8:7), an impure conscience (Titus 1:15), distorted affections (Gal. 5:24; Rom. 7:5), members (Rom. 6:19), the whole man entirely corrupted (Isa. 1:4, 6), the flesh, the fleshly man, the old man. (3) We are said to be alienated from the life of God, that is, from the divine, spiritual, and heavenly life (Eph. 4:18), and destitute of the glory of God (Rom. 3:23). (4) We are all said to be under sin (Rom. 3:9ff.). (5) There is made known in us a total powerlessness toward spiritual good (Jer. 13:23; 2 Cor. 3:5; Rom. 7:14–25).</p></blockquote>

<blockquote><p>Inability deals with the fact that our own depravity is humanly irremediable. Man is totally unable to change his character or act in a way that is different from it. Definition Negatively, it is not: 1. Metaphysical; it is not due to the loss or absence of any component element of our being, nor to any incompatibility between the component elements in our being, nor to any limitation belonging to our being as creatures. 2. It did not belong to man originally. We must distinguish between what man is unable to be, become, or do because of his finitude, and the moral inability arising from sin. In his original state man had plenary ability to fullfil all of God’s demands. To maintain otherwise would mean that sin was a necessity of the condition in which he was created. For all failure to meet the full demands of God is sin. 3. Inability does not mean the loss of natural liberty. This refers to free agency, namely, that man exercises volition according to his character. Inability presupposes liberty. 4. Inability does not deny the possibility of Justitia civilis, that is natural and social virtue. Positively, inability means that in sin man is not only indisposed and made opposite to all good but that he is totally unable to be otherwise. It is inability to discern, love, or choose the things that are well pleasing to God. He cannot know them because they are spiritually discerned; he cannot love them because his mind is enmity against God; he cannot choose them because those in the flesh cannot please God. It is the [in Greek] ou dunatai (cannot) of the natural man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings of John Murray, vol. 2, ch. 9, ‘Inability’</cite>, p. 83</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Inability deals with the fact that our own depravity is humanly irremediable. Man is totally unable to change his character or act in a way that is different from it. Definition Negatively, it is not: 1. Metaphysical; it is not due to the loss or absence of any component element of our being, nor to any incompatibility between the component elements in our being, nor to any limitation belonging to our being as creatures. 2. It did not belong to man originally. We must distinguish between what man is unable to be, become, or do because of his finitude, and the moral inability arising from sin. In his original state man had plenary ability to fullfil all of God’s demands. To maintain otherwise would mean that sin was a necessity of the condition in which he was created. For all failure to meet the full demands of God is sin. 3. Inability does not mean the loss of natural liberty. This refers to free agency, namely, that man exercises volition according to his character. Inability presupposes liberty. 4. Inability does not deny the possibility of Justitia civilis, that is natural and social virtue. Positively, inability means that in sin man is not only indisposed and made opposite to all good but that he is totally unable to be otherwise. It is inability to discern, love, or choose the things that are well pleasing to God. He cannot know them because they are spiritually discerned; he cannot love them because his mind is enmity against God; he cannot choose them because those in the flesh cannot please God. It is the [in Greek] ou dunatai (cannot) of the natural man.”

— John Murray, Collected Writings of John Murray, vol. 2, ch. 9, ‘Inability’, p. 83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CInability+deals+with+the+fact+that+our+own+depravity+is+humanly+irremediable.+Man+is+totally+unable+to+change+his+character+or+act+in+a+way+that+is+different+from+it.+Definition+Negatively%2C+it+is+not%3A+1.+Metaphysical%3B+it+is+not+due+to+the+loss+or+absence+of+any+component+element+of+our+being%2C+nor+to+any+incompatibility+between+the+component+elements+in+our+being%2C+nor+to+any+limitation+belonging+to+our+being+as+creatures.+2.+It+did+not+belong+to+man+originally.+We+must+distinguish+between+what+man+is+unable+to+be%2C+become%2C+or+do+because+of+his+finitude%2C+and+the+moral+inability+arising+from+sin.+In+his+original+state+man+had+plenary+ability+to+fullfil+all+of+God%E2%80%99s+demands.+To+maintain+otherwise+would+mean+that+sin+was+a+necessity+of+the+condition+in+which+he+was+created.+For+all+failure+to+meet+the+full+demands+of+God+is+sin.+3.+Inability+does+not+mean+the+loss+of+natural+liberty.+This+refers+to+free+agency%2C+namely%2C+that+man+exercises+volition+according+to+his+character.+Inability+presupposes+liberty.+4.+Inability+does+not+deny+the+possibility+of+Justitia+civilis%2C+that+is+natural+and+social+virtue.+Positively%2C+inability+means+that+in+sin+man+is+not+only+indisposed+and+made+opposite+to+all+good+but+that+he+is+totally+unable+to+be+otherwise.+It+is+inability+to+discern%2C+love%2C+or+choose+the+things+that+are+well+pleasing+to+God.+He+cannot+know+them+because+they+are+spiritually+discerned%3B+he+cannot+love+them+because+his+mind+is+enmity+against+God%3B+he+cannot+choose+them+because+those+in+the+flesh+cannot+please+God.+It+is+the+%5Bin+Greek%5D+ou+dunatai+%28cannot%29+of+the+natural+man.%E2%80%9D%0A%0A%E2%80%94+John+Murray%2C+Collected+Writings+of+John+Murray%2C+vol.+2%2C+ch.+9%2C+%E2%80%98Inability%E2%80%99%2C+p.+83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b21e4c107.h

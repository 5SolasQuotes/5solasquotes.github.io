<main class="wrap"><figure class="quote" id="q-4e8cb2b806" data-kw="">
<blockquote><p>…we can distinguish between natural passive potency and supernatural or obediential passive potency. A natural passive potency points to an outcome that can be realized given only a thing’s natural capacities, and can be actualized by some agent that is itself a mixture of active and passive potency. A supernatural or obediential potency points to an outcome that cannot be realized given only a thing’s natural capacities, and requires as an agent a purely actual divine cause. In human beings, potencies for eating, sleeping, walking, talking, thinking, willing, writing poems or doing science, and even coming to know the truths of natural theology and natural law are for the Scholastic all natural potencies; whereas the capacity to attain the Beatific Vision is an obediential potency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Metaphysics (Editiones Scholasticae, 2014), 1.1.3, ‘Divisions of act and potency’</cite>, p. 44</span></figcaption>

<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God.’ Richard Baxter: 1. What not sanctified free-will? 2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’, that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671), section 56</cite>, pp. 139-40</span></figcaption>

</figure><figure class="quote" id="q-a7f8ab653f" data-kw="">
<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’ (2022) at Public Discourse</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-6428ca8b93" data-kw="">
<blockquote><p>As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions</cite>, sect. 7, p. 101</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.”

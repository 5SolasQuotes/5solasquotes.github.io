<main class="wrap"><figure class="quote" id="q-9c0fdfa1ba" data-kw="">
<blockquote><p>It is well known, indeed, that the blinded and superstitious followers of the Bishop of Rome claim the title of Catholic, as exclusively applicable to themselves. In their own estimation, they are the Church, the only true Church, the Catholic, or universal Church; and all the other classes of nominal Christians, throughout the world, are heretics, out of the way of salvation. This claim, however, in the estimation of all enlightened Christians, is as presumptuous as it is vain. That department of nominal Christendom, instead of being the only true Church, is considered by many as too far gone in corruption to be comprehended under the Christian name at all; and instead of there being no salvation out of her communion, the danger of eternal perdition is rather to those who are found within her pale.

It is not doubted, indeed, that there are many pious individuals within that pale; but it is believed that they are placed in circumstances deplorably unfavourable to their growth in grace; and that the multitudes around them, in the same communion, are immersed in darkness, superstition, and dreadful error, which place them in the utmost jeopardy of eternal perdition. This is that “Antichrist,” that “Man of sin,” and “Son of Perdition,” who exalteth himself above all that is called God, and who is yet to be “destroyed with the breath of Jehovah’s mouth, and with the brightness of his coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterianism: The Truly Primitive and Apostolic Constitution of the Church of Christ</cite>, (Philadelphia PA: Presbyterian Tract and Sunday School Society, 1836), p. 6.</span></figcaption>

<blockquote><p>Their inference then from that text, 1 Sam. 2:17, 24 (if they speak to the purpose) must be this, viz. We ought to separate from a true Church, and set up a distinct Church within it, if but two scandalous ministers be not brought under due censure, though somewhat be done against them, and their wickedness be truly represented; as old Eli the high priest had reproved his sons pertinently and gravely, though I confess he ought to have done more. I shall yet be more liberal: What though not only two, but a great number of scandalous ministers in a true Church do escape condign censure? This affords no ground for relinquishing of them, and setting up a distinct Church: In such a case the scandals are not espoused, nor do even errors and heresies become the sentiments of a Church that professes the truths opposite to them, though erroneous or scandalous persons may have so much countenance as to prove too strong for the sounder part, as the sons of Zeruiah were too strong for David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-1990f502ca" data-kw="">
<blockquote><p>Thirdly, so far as in you lieth give all diligence, that the foresaid Kirks, now freed of the Episcopal yoke, and purged from all the rites and dregs of Antichrist, be not drawn back to the same bondage, neither by fraud nor force. The Lord of his infinite goodness hath bestowed this favour on you, and hath put it in the heart of the King’s most excellent Majesty, that he will not have your necks pressed any longer with the yoke, or rather intolerable tyranny of Episcopal government, (we heartily congratulate with you in this your happiness.) But withal it is our desire, that ye lay your accompt, that if the neighbouring Kirks be drawn back to that yoke of bondage, (which God of his mercy avert) your liberty will not be long sure: for the enemies of the truth being strengthened by a new addition of forces, and increase of power, they will incessantly pursue you, that at last ye will yield, and of your own accord take on that iron yoke, which, though by a slow, yet by a sure pace, leadeth to utter destruction.

Ye ought therefore to strengthen and support the Kirks of England by your whole power, and to exhort them, that they come never again under that tyrannical yoke; but rather that they may stand courageously for the maintenance of their liberty (yet so, that they fall not on the other extreme, Anarchy, a more dangerous evil) yea, that they have not the least fellowship with any idolatrous rites or ceremonies. The Christian tabernacle no less then the Jewish ought to be built according to that pattern shewed in the Mount of the Scripture, so that there be not in the curtains thereof so much as a loop or a tach, but according to the prescript of God the only Law-giver.

Long experience hath taught us, that there is in such rites a secret and wonderful power to defile, if but the smallest part thereof be admitted, it will not long continue so, but speedily, like a gangrene, it will begin to spread, whilst at last it corrupt the whole worship, having lost the simplicity and purity of Christ’s institution. What? were she not a foolish and mad woman, who would adorn her self with ornaments borrowed from some vile harlot, supposing thereby the better to please her husband? What filthier harlot is there then the Romish strumpet, most accomplished in all sorts of spiritual villainies, surpassing all the bounds of impudency?

Let us never therefore be so demented, as to accompt the worship of God, most pure by Christ’s institution, to be more pleasing unto God, when it is performed with ornaments borrowed from the Romish Bordel [brothel]. Let us think that the Lord cannot but be highly offended, take away his holy Spirit, and depart far with the light of his grace, so soon as men begin to be so mad; then he suffereth them from day to day to sink deeper in the dunghill of superstitious rites, wherein they delight, while at last they be suffocated therein as it came to pass in the Papacy.

We confess indeed, that for things indifferent we like not to be contentious, neither left we the Romish Kirk for these or such like things; but for the denying of that only sacrifice of Christ in their Mass; for their adoration of a breaden god and of Saints, for their exalting the Pope above God, and for his tyranny; for their contempt &amp; prohibition of the use of Scripture; for justification by works, and hundreds more of that kind. If the Romish Kirk had been tainted only with some smaller blemishes, or had been defiled only with some indifferent rites; if for these we had departed from her we might have been justly taxed as Schismatics, yea, a generation of vipers, which bursting through the mother’s bowels, is not brought forth but by patricide.

But first having once departed for their accursed idolatry, and the Kirk being purged, to return back again unto Popish rites, once cast out, appeareth evidently to be extremely dangerous, by reason of the subtilty and restlessness of Satan.

2. Whosoever ceaseth not eagerly to press and to introduce these rites, though they perceive all things to be turned upside down thereby, they make manifest, that it is not for these ceremonies alone they stir up such troubles, but that they do secretly project some other thing

3. As for such ceremonies and rites as have their origin all from minds arrogant, and not contented with divine institution, &amp; to which an opinion of necessity is added, as if without these, holy things could not be decently gone about, and the worship but coldly performed; truly we cannot see how such ceremonies can be called indifferent.

Suffer never therefore (much honoured brethren) so far as is in you, that the English Kirks be forced to receive such ceremonies; but rather use all means that they and ye in Kirk-government may be brought to as near agreement as may be. Hence shall redound manifold and great utility.</p></blockquote>

Ye ought therefore to strengthen and support the Kirks of England by your whole power, and to exhort them, that they come never again under that tyrannical yoke; but rather that they may stand courageously for the maintenance of their liberty (yet so, that they fall not on the other extreme, Anarchy, a more dangerous evil) yea, that they have not the least fellowship with any idolatrous rites or ceremonies. The Christian tabernacle no less then the Jewish ought to be built according to that pattern shewed in the Mount of the Scripture, so that there be not in the curtains thereof so much as a loop or a tach, but according to the prescript of God the only Law-giver.

Long experience hath taught us, that there is in such rites a secret and wonderful power to defile, if but the smallest part thereof be admitted, it will not long continue so, but speedily, like a gangrene, it will begin to spread, whilst at last it corrupt the whole worship, having lost the simplicity and purity of Christ’s institution. What? were she not a foolish and mad woman, who would adorn her self with ornaments borrowed from some vile harlot, supposing thereby the better to please her husband? What filthier harlot is there then the Romish strumpet, most accomplished in all sorts of spiritual villainies, surpassing all the bounds of impudency?

Let us never therefore be so demented, as to accompt the worship of God, most pure by Christ’s institution, to be more pleasing unto God, when it is performed with ornaments borrowed from the Romish Bordel [brothel]. Let us think that the Lord cannot but be highly offended, take away his holy Spirit, and depart far with the light of his grace, so soon as men begin to be so mad; then he suffereth them from day to day to sink deeper in the dunghill of superstitious rites, wherein they delight, while at last they be suffocated therein as it came to pass in the Papacy.

We confess indeed, that for things indifferent we like not to be contentious, neither left we the Romish Kirk for these or such like things; but for the denying of that only sacrifice of Christ in their Mass; for their adoration of a breaden god and of Saints, for their exalting the Pope above God, and for his tyranny; for their contempt &amp; prohibition of the use of Scripture; for justification by works, and hundreds more of that kind. If the Romish Kirk had been tainted only with some smaller blemishes, or had been defiled only with some indifferent rites; if for these we had departed from her we might have been justly taxed as Schismatics, yea, a generation of vipers, which bursting through the mother’s bowels, is not brought forth but by patricide.

But first having once departed for their accursed idolatry, and the Kirk being purged, to return back again unto Popish rites, once cast out, appeareth evidently to be extremely dangerous, by reason of the subtilty and restlessness of Satan.

2. Whosoever ceaseth not eagerly to press and to introduce these rites, though they perceive all things to be turned upside down thereby, they make manifest, that it is not for these ceremonies alone they stir up such troubles, but that they do secretly project some other thing

3. As for such ceremonies and rites as have their origin all from minds arrogant, and not contented with divine institution, &amp; to which an opinion of necessity is added, as if without these, holy things could not be decently gone about, and the worship but coldly performed; truly we cannot see how such ceremonies can be called indifferent.

Suffer never therefore (much honoured brethren) so far as is in you, that the English Kirks be forced to receive such ceremonies; but rather use all means that they and ye in Kirk-government may be brought to as near agreement as may be. Hence shall redound manifold and great utility.”

e+no+less+then+the+Jewish+ought+to+be+built+according+to+that+pattern+shewed+in+the+Mount+of+the+Scripture%2C+so+that+there+be+not+in+the+curtains+thereof+so+much+as+a+loop+or+a+tach%2C+but+according+to+the+prescript+of+God+the+only+Law-giver.%0A%0ALong+experience+hath+taught+us%2C+that+there+is+in+such+rites+a+secret+and+wonderful+power+to+defile%2C+if+but+the+smallest+part+thereof+be+admitted%2C+it+will+not+long+continue+so%2C+but+speedily%2C+like+a+gangrene%2C+it+will+begin+to+spread%2C+whilst+at+last+it+corrupt+the+whole+worship%2C+having+lost+the+simplicity+and+purity+of+Christ%E2%80%99s+institution.+What%3F+were+she+not+a+foolish+and+mad+woman%2C+who+would+adorn+her+self+with+ornaments+borrowed+from+some+vile+harlot%2C+supposing+thereby+the+better+to+please+her+husband%3F+What+filthier+harlot+is+there+then+the+Romish+strumpet%2C+most+accomplished+in+all+sorts+of+spiritual+villainies%2C+surpassing+all+the+bounds+of+impudency%3F%0A%0ALet+us+never+therefore+be+so+demented%2C+as+to+accompt+the+worship+of+God%2C+most+pure+by+Christ%E2%80%99s+institution%2C+to+be+more+pleasing+unto+God%2C+when+it+is+performed+with+ornaments+borrowed+from+the+Romish+Bordel+%5Bbrothel%5D.+Let+us+think+that+the+Lord+cannot+but+be+highly+offended%2C+take+away+his+holy+Spirit%2C+and+depart+far+with+the+light+of+his+grace%2C+so+soon+as+men+begin+to+be+so+mad%3B+then+he+suffereth+them+from+day+to+day+to+sink+deeper+in+the+dunghill+of+superstitious+rites%2C+wherein+they+delight%2C+while+at+last+they+be+suffocated+therein+as+it+came+to+pass+in+the+Papacy.%0A%0AWe+confess+indeed%2C+that+for+things+indifferent+we+like+not+to+be+contentious%2C+neither+left+we+the+Romish+Kirk+for+these+or+such+like+things%3B+but+for+the+denying+of+that+only+sacrifice+of+Christ+in+their+Mass%3B+for+their+adoration+of+a+breaden+god+and+of+Saints%2C+for+their+exalting+the+Pope+above+God%2C+and+for+his+tyranny%3B+for+their+contempt+%26+prohibition+of+the+use+of+Scripture%3B+for+justification+by+works%2C+and+hundreds+more+of+that+kind.+If+the+Romish+Kirk+had+been+tainted+only+with+some+smaller+blemishes%2C+or+had+been+defiled+only+with+some+indifferent+rites%3B+if+for+these+we+had+departed+from+her+we+might+have+been+justly+taxed+as+Schismatics%2C+yea%2C+a+generation+of+vipers%2C+which+bursting+through+the+mother%E2%80%99s+bowels%2C+is+not+brought+forth+but+by+patricide.%0A%0ABut+first+having+once+departed+for+their+accursed+idolatry%2C+and+the+Kirk+being+purged%2C+to+return+back+again+unto+Popish+rites%2C+once+cast+out%2C+appeareth+evidently+to+be+extremely+dangerous%2C+by+reason+of+the+subtilty+and+restlessness+of+Satan.%0A%0A2.+Whosoever+ceaseth+not+eagerly+to+press+and+to+introduce+these+rites%2C+though+they+perceive+all+things+to+be+turned+upside+down+thereby%2C+they+make+manifest%2C+that+it+is+not+for+these+ceremonies+alone+they+stir+up+such+troubles%2C+but+that+they+do+secretly+project+some+other+thing%0A%0A3.+As+for+such+ceremonies+and+rites+as+have+their+origin+all+from+minds+arrogant%2C+and+not+contented+with+divine+institution%2C+%26+to+which+an+opinion+of+necessity+is+added%2C+as+if+without+these%2C+holy+things+could+not+be+decently+gone+about%2C+and+the+worship+but+coldly+performed%3B+truly+we+cannot+see+how+such+ceremonies+can+be+called+indifferent.%0A%0ASuffer+never+therefore+%28much+honoured+brethren%29+so+far+as+is+in+you%2C+that+the+English+Kirks+be+forced+to+receive+such+ceremonies%3B+but+rather+use+all+means+that+they+and+ye+in+Kirk-government+may+be+brought+to+as+near+agreement+as+may+be.+Hence+shall+redound+manifold+and+great+utility.%E2%80%9D%0A%0A%E2%80%94+A+letter+from+the+synod+of+Zeeland%2C+to+the+commissioners+of+the+General+Assembly+of+the+Kirk+of+Scotland%3A+written+by+them+in+Latin%2C+and+now+faithfully+translated+into+English%3A+expressing%2C+1.+Their+fellow-feeling+of+the+present+condition+of+the+Kirks+of+Ireland+and+England%2C+and+exciting+us+to+the+like.+2.+Their+respects+and+affection+t%2C+%28London%3A+Edward+Brewster%2C+1643%29%2C+pp+3-5.&am

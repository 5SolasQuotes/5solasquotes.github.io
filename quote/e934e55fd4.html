</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b81e91a18" data-kw="">
<blockquote><p>Question: What is Creation? Answer: Creation is a work proper only to God, undividedly common to the Father, the Son, and to the Holy Ghost, whereby, in the beginning, and in the space of six days, God made of nothing, the heavens and earth, and all the host of them visible, and invisible, to the glory of his Name, and the use of man… Yea whereas the Lord could have made the world in an instant, it pleased Him to take six days to finish the heaven and the earth, with all the host of them, to this end (we may well suppose) that we should take good notice of the same. For this, was the Sabbath ordained, that we might preserve the memory of the Creation, and praise the Lord…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Divinity Plainly Discovering the Mysteries of Christian Religion</cite>, (London, 1614), Grounds of Divinity, pp. 73, 75-76</span></figcaption>

<blockquote><p>Sciences are differentiated according to the various means through which knowledge is obtained. For the astronomer and the physicist both may prove the same conclusion: that the earth, for instance, is round: the astronomer by means of mathematics (i.e. abstracting from matter), but the physicist by means of matter itself.</p></blockquote>

</figure><figure class="quote" id="q-07d6bf612a" data-kw="">
<blockquote><p>15. Argument 9 [of Rutherford against an Arminian conception of the antecedent will of God]: If such an antecedent will, by which He naturally wills good to the creature, belongs to God, then by the same reasoning God by an antecedent will willed the existence of the creature and from eternity willed the creation of the world by the impulse of nature. But then why did God for infinite ages before the creation of the world not satisfy that natural volition? What resisted God here? Not the world, not men, not a defect of matter. They will say that God’s absolute will resisted the natural will: But how absurd? Christians argue against Aristotle, Proclus and others that God created the world freely. Therefore He could have from eternity not have created, and such a will was in vain for eternity; and by equal reasoning God eternally wills the τὸ esse [being] of infinite worlds and of infinite men and angels… Indeed, because attributes in God are necessary and eternal, they never begin, they never cease; from eternity God naturally willed all men to be saved, and indeed naturally, and consequently by necessity of nature He created the world and could not have not created it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apologetic Exercitations for Divine Grace, Exercitation 2</cite>, (Amsterdam: Laurentius, 1636), Exercise 2, ch. 4, ‘On the Antecedent &amp; Consequent Will of God’, pp. 323-63 tr. AI by The Faith Received Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-b5df3ae534" data-kw="">
<blockquote><p>Q. DId God create the world at the same instant, or in the space of six days? A. In the space of six days: First, because Moses’ narration is historical, and therefore he speaks of six distinct days. Secondly, Moses, Ex. 20 &amp; 31, urges the Jews to work six days and rest the seventh, because God created the world in six days and rested the seventh; this reason had been ridiculous if God had made the world in an instant. Thirdly, if we understand Moses in this place allegorically, then we must make this whole history an allegory. Fourthly, if the seventh day had been the first (and in it God had created the world), then how is it understood that God rested the seventh day? Fiftly, how could so many diverse kinds of creatures be created in the same instant of time? yea, then we must say that man was created and brought into Paradise and was cast asleep, and Eve was formed of his rib the same instant. Q. How then is that understood, Ecclesiasticus 18 [v. 1], ‘He that lives forever, created all things together’? A. It is to be understood of that confused mass that God created in the beginning: out of the which afterward He created the rest of the creatures in their distinct days. Q. Why did God spend so much time in making the world? A. Not because He was weak and could not make it in less time, but that we might the more seriously consider the order of the creation, distinction and replenishing of the world; and in these, the omnipotency, wisdom and goodness of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Fourteen First Chapters of Genesis, by way of Question &amp; Answer</cite>, … (London, 1626), Questions on the 2nd Chapter, pp. 28-29</span></figcaption>

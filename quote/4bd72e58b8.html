<main class="wrap"><figure class="quote" id="q-4bd72e58b8" data-kw="">
<blockquote><p>I pray hear some of their words, the London [presbyterian] ministers (Vindication, p. 115), ‘Though we dare not make separation from a true Church… yet we do make separation in a true Church [by purging and reforming it…]’ Read over the whole answer and you may perceive their minds (p. 76)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light. The practice proved to be not only unwarrantable, but likewise so hurtful to the churches that church-reformation cannot with any comfort go forward so long as such separation is tolerated</cite>, Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light. The practice proved to be not only unwarrantable, but likewise so hurtful to the churches that church-reformation cannot with any comfort go forward so long as such separation is tolerated… (London: R.I., 1652), p. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“I pray hear some of their words, the London [presbyterian] ministers (Vindication, p. 115), ‘Though we dare not make separation from a true Church… yet we do make separation in a true Church [by purging and reforming it…]’ Read over the whole answer and you may perceive their minds (p. 76)…”

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, ch. 21, pp. 119-120</span></figcaption>

</figure><figure class="quote" id="q-66cd10c262" data-kw="">
<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Scandal</cite>, pp. 321–22</span></figcaption>

</figure><figure class="quote" id="q-67be89223d" data-kw="">
<blockquote><p>…when many have been in the fault, there has been a forbearance [in exercising Church discipline]… ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he [the apostle Paul] not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>

</figure><figure class="quote" id="q-8b86543bca" data-kw="">
<blockquote><p>Observation 4. Our Savior does not command his disciples to separate from commmunion with the Pharisees, and oblige them not hear their doctrine; but only to beware of the errors that they mix with their doctrine. We may, and ought to hold communion with a Church, though erroneous in doctrine, if not fundamentally erroneous. Separation from a Church is not justifiable upon any other ground than that which makes a separation betwixt God and that Church: Which is either the apostasy of that Church into gross idolatry; or in point of doctrine, into damnable heresy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Notes with Practical Observations on the Four Holy Evangelists</cite>, … (London, 1700), On Mt. 16</span></figcaption>

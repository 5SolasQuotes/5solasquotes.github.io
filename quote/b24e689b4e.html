<main class="wrap"><figure class="quote" id="q-b24e689b4e" data-kw="">
<blockquote><p>We are carefully to distinguish between a law of Nature, or a perpetual binding moral law, which stands for an eternal rule to us, except the Lawgiver Himself, by a supervenient positive law, which serves but for a time, do loose us from an obligation thereunto, and [it be] a positive temporary law. God says in an express law of nature that obliges us perpetually, ‘The son shall not be put to death for the sins of the father’; no magistrate on earth can lawfully take away the life of the son for the sin of the father, for this eternally obliges. Yet Saul was to destroy the sucking children of the Amalekites for the sins of their fathers, but he had a positive temporary command of God to warrant his fact, 1 Sam. 15:2-3, none can infer that we are from this law, which was a particular exception, from a catholic, perpetually obliging moral law, that magistrates are now to take away the lives of the sucking infants of Papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, ‘An Introduction to the Doctrine of Scandal’, pp. 64-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b334fee3da" data-kw="">
<blockquote><p>Even when we choose evil, we choose for the good, albeit poorly. The choice of the sinner for evil in this sense is not a choice for an alternate, competing reality that is diametrically opposed to the order of goodness. It is a poor choice— an attempt at the good that fails in ways that are both person ally and socially destructive. Understood in this way, vice is not so much an equal alternative to virtue, but a corruption and weakening of the virtus of human nature, which by its natural form is ordered to the good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 230 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><figure class="quote" id="q-27682b7137" data-kw="">
<blockquote><p>It is not very just to chastise men for the offenses of their natural ancestors, but to take the fiction of ancestry in a corporate succession as a ground for punishing men who have no relation to guilty acts, except in names and general descriptions, is a sort of refinement in injustice belonging to the philosophy of this enlightened age… [they punish] men, many, if not most, of whom abhor the violent conduct of… former times as much as their present persecutors can do, and who would be as loud and as strong in the expression of that sense, if they were not well aware of the purposes for which all this declamation is employed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reflections on the Revolution in France</cite>, … (1790)</span></figcaption>

</figure><figure class="quote" id="q-a89d19e613" data-kw="">
<blockquote><p>5. Children! Be humbled under the sense of the iniquity of your parents when ye remember their ways, or possess what unjustly they have gotten, ye become guilty of their sins, without repentance. Especially you have need to take notice of this that are the children of parents that have opposed the purity of God’s service and worship and the work of its reformation, and have been corrupters of it: Children may be partakers of their parents’ faults and so plagued for them several ways; and we think that this forfeiture is more than ordinary. And therefore, as amongst men there are special crimes beyond ordinary procuring such a sentence, so is it here. And:

1. They be guilty by following their foot-steps, in walking in their parents sins, as Jeroboam’s children did.

2. In approving their fathers’ way, praising their fathers’ sayings or doings, as it is Psalm 49:13.

3. In winking at their parents’ sins and wickedness.

4. In boasting of their oppressions, bloodshed, etc. as if they were were acts of valor and manhood.

5. In being content that their fathers sinned, if it gained any possession to them.

6. In possessing and enjoying without repentance what to their knowledge they sinfully purchased.

7. In spending prodigally and riotously what the parents covetously gathered; the sin of the parent here is the seed of the sons’ sin.

8. In professing sorrow for the want [lack] of occasion to live in ignorance, profanity, or looseness as their fathers did, as in Jer. 44:17-19, they said that things went well then. [9.] In not being humbled before God for the sins of predecessors, nor confessing them to him, as Lev. 26:40, nor repairing the losses or injuries which we knew they did to any that were wronged or oppressed by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed</cite>, … (Glagow, 1676), 2nd Commandment, pp. 76-77</span></figcaption>

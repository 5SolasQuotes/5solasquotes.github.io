<main class="wrap"><figure class="quote" id="q-ed68056649" data-kw="">
<blockquote><p>Here I shall once for all clearly prove that a minister’s universal and total abstinence from administration of the Lord’s Supper unto that flock or Church over which God has made him an overseer is unlawful, though for the eschewing of scandal. No sinful omission of that which is commanded by an affirmative precept is lawful for the eschewing of scandal: But a minister’s total and universal abstinence from the administration of the Lord’s Supper unto that flock over which God has made him overseer, is a sinful omission of that which is commanded by an affirmative precept; therefore it is not lawful for the eschewing of scandal. The major is confirmed from that of the apostle, Rom. 3:8, ‘Their damnation is just, that say, Let us do evil that good may come:’ as also that of Aquinas [Summa] 2nd of the 2nd part, Question 43, Article 7, ‘Secundum ordinem charitatis plus debet homo suam salutem spiritualem diligere, quàm alterius.’ ‘A well-ordered charity begins ever at home, making a man chiefly to desire and endeavour the salvation of his own soul, and consequently to be more solicitous how to avoid sin in himself, than to prevent it in others;’ See Rutherford more largely touching Scandal, [Question 6,] p. 84. The minor is proved, because it is necessary for my salvation to obey affirmative precepts, though not in all differences of time. See Rutherford, [Question 2,] pp. 13-14. Praecepta affirmativa obligant, though not ad semper, yet ad aliquando. ‘Affirmative Precepts tie us to do the things they require, though not at all times, yet at some time or other.’ And therefore universally and totally to abstain from what they command, is sinfully to omit what is commanded by them. I cannot but here call to mind a reply of the renowned [reformed, Daniel] Chamier to a shift of Cajetan [a Romanist], which he brings to elude our arguments against their Communion under one kind [which excludes the cup to the laity], that are drawn from the command of the Cup. The command, says Cajetan, is but affirmative; and affirmativa praecepta, ut si obligent semper, non tamen ad semper. [Affirmative precepts, so if they oblige always, yet not unto all times.] Unto which Chamier replies very solidly and sharply. Esto (says He) sed quid tu appellas pro semper? nullumne apud te discrimen est inter non semper? &amp; nunquam? [‘Eat’, says He, but why do you say ‘for all times’? Is there not even with you a discrimination between not-always and never?] The like reply will serve unto those who go about to evade the command of the Lord’s Supper, by telling us that it is an affirmative command, and does oblige semper, but not ad semper. It does always bind, but not to always: for there is a wide difference between not always and never. Now the upshot of these men’s tenets is that if the church be not presbyterated, the command of the Lord’s Supper does never bind during such its condition. Suarez in the 3rd part of Thomas, tome 30, disputation 80, sect. 1, as also Becanus in his Summae Theol. Scholastic., part 3, Tract 2, ch. 25, part 2, question one, allege diverse reasons why all priests whatsoever are bound to say mass; if you please to make such a change in them as to put ‘ministers’ for ‘priests’, and ‘the Lord’s Supper’ for ‘mass’, you may make them orthodox, and so they will serve our turn.</p></blockquote>

<blockquote><p>Let us then bring our hearts to holy resolutions, and set ourselves upon that which is good, and against that which is evil in ourselves or others, according to our callings, upon this encouragement, that Christ’s grace and power shall go along with us. What had become of that great work of reformation of religion in the latter-spring of the gospel, if men had not been armed with invincible courage… that the cause was Christ’s, and that He would not be wanting to his own cause. Luther igenuously confessed that he carried matters often inconsiderately, and with mixture of passion. But upon acknowledgement, God took not advantage of his errors, but the cause being God’s, and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>

<blockquote><p>Now for the last thing which makes things indifferent with us scandalous: we are not left without witness from the Scriptures in such cases. But that ceremonies, known to be scandalous, were notwithstanding used: for, it is manifest concerning the Jewish ceremonies that they were scandalous in the usage to the gentiles and in the omitting to the Jews, Acts 21:21-22, 27-28; Gal. 2:3, 9, 12. But that this point of scandal may be distinctly understood, diverse rules are to be considered of: First, that the angering or bare displeasing of other men is not the offense or scandal condemned in Scripture, as not only the words in the original show, but all sound divines grant. A scandal is a stumbling block that occasions a man to fall from grace in the profession of it, into sin or error. Secondly, that to give offense, by doing anything which is simply evil in itself (as David did by his adultery and murder), this is out of all question abominable. Thirdly, that the offense of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so, offense must not be given either to the Jews or to the Grecian, 1 Cor. 10:31. Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons; but must make conscience of it, that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13] to obey the human ordinances of men in authority, from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances, and that we be careful not to offend private men in free ceremonies. Fiftly, that where ceremonies are left free and indifferent and have no commandement to restrain their use or enjoin it, there are men to redeem the offense of their brethren with no other price than the loss of liberty in things indifferent. The apostle Paul says rather than [that] he will offend his brother, he will never eat flesh while he lives, 1 Cor. 10:8, 13. He does not say he will never preach the Gospel while he lives, or never receive the sacraments while he lives: a necessity lay upon him to preach the Gospel, and to yield to the use of all lawful things to get his liberty, whosoever be offended. Sixtly, that where the person that takes offense is wilfully ignorant and by all means avoids instruction and will not have the patience to be taught, such offense is not to be regarded. Thus our Savior Christ teaches confidently his doctrine of eating his flesh, though the Capernaites were offended: and some of his disciples turned apostates about it, being such persons as would not abide the exposition of his meaning, Jn. 6:52. Seventhly, the like is to be said of such persons as take offense out of envy or malice, as the man in the parable that envied Christ’s bounty (Mt. 20:15), or the Pharisees, that out of malice were offended at Christ, Mt. 15:14; 1 Pet. 2:8. Eighthly, that in things that have proved scandalous, yet we are not bound to lose our liberty till the weak brother declare his offense. Meat sacrificed to idols was offensive to many in all countries, yet the apostle’s rule is, ‘Eat and make no question unless one say, ‘This is meat sacrificed to idols,” 1 Cor. 10:25, 28.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now for the last thing which makes things indifferent with us scandalous: we are not left without witness from the Scriptures in such cases. But that ceremonies, known to be scandalous, were notwithstanding used: for, it is manifest concerning the Jewish ceremonies that they were scandalous in the usage to the gentiles and in the omitting to the Jews, Acts 21:21-22, 27-28; Gal. 2:3, 9, 12. But that this point of scandal may be distinctly understood, diverse rules are to be considered of: First, that the angering or bare displeasing of other men is not the offense or scandal condemned in Scripture, as not only the words in the original show, but all sound divines grant. A scandal is a stumbling block that occasions a man to fall from grace in the profession of it, into sin or error. Secondly, that to give offense, by doing anything which is simply evil in itself (as David did by his adultery and murder), this is out of all question abominable. Thirdly, that the offense of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so, offense must not be given either to the Jews or to the Grecian, 1 Cor. 10:31. Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons; but must make conscience of it, that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13] to obey the human ordinances of men in authority, from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances, and that we be careful not to offend private men in free ceremonies. Fiftly, that where ceremonies are left free and indifferent and have no commandement to restrain their use or enjoin it, there are men to redeem the offense of their brethren with no other price than the loss of liberty in things indifferent. The apostle Paul says rather than [that] he will offend his brother, he will never eat flesh while he lives, 1 Cor. 10:8, 13. He does not say he will never preach the Gospel while he lives, or never receive the sacraments while he lives: a necessity lay upon him to preach the Gospel, and to yield to the use of all lawful things to get his liberty, whosoever be offended. Sixtly, that where the person that takes offense is wilfully ignorant and by all means avoids instruction and will not have the patience to be taught, such offense is not to be regarded. Thus our Savior Christ teaches confidently his doctrine of eating his flesh, though the Capernaites were offended: and some of his disciples turned apostates about it, being such persons as would not abide the exposition of his meaning, Jn. 6:52. Seventhly, the like is to be said of such persons as take offense out of envy or malice, as the man in the parable that envied Christ’s bounty (Mt. 20:15), or the Pharisees, that out of malice were offended at Christ, Mt. 15:14; 1 Pet. 2:8. Eighthly, that in things that have proved scandalous, yet we are not bound to lose our liberty till the weak brother declare his offense. Meat sacrificed to idols was offensive to many in all countries, yet the apostle’s rule is, ‘Eat and make no question unless one say, ‘This is meat sacrificed to idols,” 1 Cor. 10:25, 28.”

— Nicholas Byfield, A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), on 1 Pet. 2:13, pp. 595-97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+for+the+last+thing+which+makes+things+indifferent+with+us+scandalous%3A+we+are+not+left+without+witness+from+the+Scriptures+in+such+cases.+But+that+ceremonies%2C+known+to+be+scandalous%2C+were+notwithstanding+used%3A+for%2C+it+is+manifest+concerning+the+Jewish+ceremonies+that+they+were+scandalous+in+the+usage+to+the+gentiles+and+in+the+omitting+to+the+Jews%2C+Acts+21%3A21-22%2C+27-28%3B+Gal.+2%3A3%2C+9%2C+12.+But+that+this+point+of+scandal+may+be+distinctly+understood%2C+diverse+rules+are+to+be+considered+of%3A+First%2C+that+the+angering+or+bare+displeasing+of+other+men+is+not+the+offense+or+scandal+condemned+in+Scripture%2C+as+not+only+the+words+in+the+original+show%2C+but+all+sound+divines+grant.+A+scandal+is+a+stumbling+block+that+occasions+a+man+to+fall+from+grace+in+the+profession+of+it%2C+into+sin+or+error.+Secondly%2C+that+to+give+offense%2C+by+doing+anything+which+is+simply+evil+in+itself+%28as+David+did+by+his+adultery+and+murder%29%2C+this+is+out+of+all+question+abominable.+Thirdly%2C+that+the+offense+of+aliens+is+to+be+regarded%2C+that+is%2C+we+must+not+do+anything+by+which+men+that+are+not+yet+converted+may+be+hardened+from+the+liking+of+religion%3A+and+so%2C+offense+must+not+be+given+either+to+the+Jews+or+to+the+Grecian%2C+1+Cor.+10%3A31.+Fourthly%2C+that+when+the+authority+of+the+magistrate+or+Church+has+determined+concerning+the+use+of+things+indifferent%2C+we+are+not+now+left+free%2C+nor+are+bound+to+look+at+the+scandal+of+particular+persons%3B+but+must+make+conscience+of+it%2C+that+we+offend+not+the+Church%2C+by+working+a+greater+hurt+or+loss+to+the+Church+than+the+particular+hurt+of+private+persons+can+extend+unto.+In+such+cases+as+this%2C+the+apostle%E2%80%99s+rule+holds%3A+%E2%80%98If+any+man+seem+to+be+contentious%2C+we+have+no+such+custom%2C+nor+the+Church+of+God%2C%E2%80%99+1+Cor.+11%3A16.+And+we+are+bound%2C+in+this+text+of+the+apostle+Peter+%5B1+Pet.+2%3A13%5D+to+obey+the+human+ordinances+of+men+in+authority%2C+from+which+obligation+other+men%E2%80%99s+offense+cannot+free+us.+And+the+apostle+charges+us+to+look+to+it+that+we+offend+not+the+Church+in+prescribed+ordinances%2C+and+that+we+be+careful+not+to+offend+private+men+in+free+ceremonies.+Fiftly%2C+that+where+ceremonies+are+left+free+and+indifferent+and+have+no+commandement+to+restrain+their+use+or+enjoin+it%2C+there+are+men+to+redeem+the+offense+of+their+brethren+with+no+other+price+than+the+loss+of+liberty+in+things+indifferent.+The+apostle+Paul+says+rather+than+%5Bthat%5D+he+will+offend+his+brother%2C+he+will+never+eat+flesh+while+he+lives%2C+1+Cor.+10%3A8%2C+13.+He+does+not+say+he+will+never+preach+the+Gospel+while+he+lives%2C+or+never+receive+the+sacraments+while+he+lives%3A+a+necessity+lay+upon+him+to+preach+the+Gospel%2C+and+to+yield+to+the+use+of+all+lawful+things+to+get+his+liberty%2C+whosoever+be+offended.+Sixtly%2C+that+where+the+person+that+takes+offense+is+wilfully+ignorant+and+by+all+means+avoids+instruction+and+will+not+have+the+patience+to+be+taught%2C+such+offense+is+not+to+be+regarded.+Thus+our+Savior+Christ+teaches+confidently+his+doctrine+of+eating+his+flesh%2C+though+the+Capernaites+were+offended%3A+and+some+of+his+disciples+turned+apostates+about+it%2C+being+such+persons+as+would+not+abide+the+exposition+of+his+meaning%2C+Jn.+6%3A52.+Seventhly%2C+the+like+is+to+be+said+of+such+persons+as+take+offense+out+of+envy+or+malice%2C+as+the+man+in+the+parable+that+envied+Christ%E2%80%99s+bounty+%28Mt.+20%3A15%29%2C+or+the+Pharisees%2C+that+out+of+malice+were+offended+at+Christ%2C+Mt.+15%3A14%3B+1+Pet.+2%3A8.+Eighthly%2C+that+in+things+that+have+proved+scandalous%2C+yet+we+are+not+bound+to+lose+our+liberty+till+the+weak+brother+declare+his+offense.+Meat+sacrificed+to+idols+was+offensive+to+many+in+all+countries%2C+yet+the+apostle%E2%80%99s+rule+is%2C+%E2%80%98Eat+and+make+no+question+unless+one+say%2C+%E2%80%98This+is+meat+sacrificed+to+idols%2C%E2%80%9D+1+Cor.+10%3A25%2C+28.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Byfield%2C+A+Commentary%3A+or+Sermons+upon+the+Second+Chapter+of+the+First+Epistle+of+Saint+Peter...+%28London%2C+1623%29%2C+on+1+Pet.+2%3A13%2C+pp.+595-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3ddeedd518.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3ddeedd518.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=Now%20for%20the%20last%20thing%20which,to%20idols%2C%E2%80%9D%201%20Cor.%2010%3A25%2C%2028&amp;text=Now%20for%20the%20last%20thing%20which%20makes%20things&amp;text=meat%20sacrificed%20to%20idols%2C%E2%80%9D%201%20Cor.%2010%3A25%2C%2028" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now Papists confirm many of their superstitions by the English ceremonies… It will be said that Papists have no ground nor reason to confirm any of their superstitions by the English ceremonies. But I answer: 1. If it were so, yet forasmuch as Papists draw them to a confirmation of their superstitions, we should abstain from them as appearances of evil. Eating (at a private banquet) of that which was sacrificed to idols, did confirm an idolater and infidel in his religion, as Pareus notes (Commentary on 1 Cor. 10:28): yet from this the idolater had no reason to confirm himself in his idolatry; but because the idolater seeing it, might draw it to a confirmation, the apostle will have it for that respect foreborn. When the Arians abused trine [three-fold] immersion in baptism to signify three natures of the three persons, Pope Gregory and the Fourth Council of Toledo ordained that in Spain, thrice washing should no longer be used in baptism, but once only. The Arians had no just reason to draw such a signification from the ceremony of trine-immersion: yet was it abolished when those heretics did so abuse it. If any say that we are saved by the blood of the son of man, the phrase is orthodox, because of the communication or rather communion of properties, and the Nestorians cannot with good reason by it confirm their heresy, yet are we to abstain from this form of speech, in Zanchius his judgment, when it is drawn to the confirmation of that error.</p></blockquote>

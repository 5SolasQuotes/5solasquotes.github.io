<blockquote><p>June 30. — Self-examination. Why is a missionary life so often an object of my thoughts? Is it simply for the love I bear to souls? Then, why do I not show it more where I am? Souls are as precious here as in Burmah. Does the romance of the business not weigh anything with me? — the interest and esteem I would carry with me? — the nice journals and letters I should write and receive?

Why would I so much rather go to the East than to the West Indies? Am I wholly deceiving my own heart? and have I not a spark of true missionary zeal? Lord, give me to understand and imitate the spirit of those unearthly words of Thy dear Son: ‘It is enough for the disciple that he be as his Master, and the servant as his Lord,’ ‘He that loveth father or mother more than Me, is not worthy of Me.’ Gloria in Excelsis Deo!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Entry for 30 June 1833 in Andrew A. Bonar (ed.) Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

<blockquote><p>Who can then blame us to shun a danger, and fearing the worst, to resist evil beginnings? to give no place to the Devil, to crush the viper while it is in the shell, to abstain from all appearance of evil, 1 Thess. 5:22, and to take the little ones of Babylon, whiles they are young, and dash their heads against the stones? It skils not, that many will judge us too precise for doing so. What? do they think this preciseness any other than that which the Law of God requires, even observing of the commandement of God without adding to it or diminishing from it, and keeping the straight path, without declining to the right hand or the left? or do they think us more precise than Mordecai, who would do no reverence to Haman, because he was an Amalekite, and so not to be countenanced nor honoured by an Israelite? Are we more precise than Daniel, who would not close his window when he was praying, no not for the king’s edict, knowing, that because he had used to do so aforetime, his doing otherwise had been both a denying of his former profession and an ensnaring of himself by yielding in small things to yield in greater, and after an inch to take an elle? Are we more precise than the apostle Paul who gave no place to the adversaries of Christian liberty, no not for an hour? Are we more precise than David, who would not do so much as take up the names of idols into his lips, lest from speaking of them he should be led to a liking of them: or may not the sad and doleful examples of so many and so great abuses and corruptions which have crept into the Church from so small and scarcely observable originals, make us loathe at our hearts to admit a change in the policy and discipline of a well constitute[d] Church, and rightly ordered before the change, and especially in such things as are not at all necessary? O! from how small beginnings did the mystery of iniquity advance it’s progression? How little motes have accresced to mountains? Wherefore simplicitatem Christi nos oportet coler•…, à qua ubi primum •…xtulit pedem vanitas, vanitatem sequitur superstitio, superstitionem error, errorem presumptio, presumptionem impietas Idololatrica. We have cause to fear that if, with Israel, we come to the sacrifices of idols, and eat of idolothyts, and bow down or use any of superstitious and idolotrous rites, thereafter we be made to join ourselves to these idols, and so the fierce anger of the Lord be kindled against us, as it was against them.</p></blockquote>

<blockquote><p>6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, The Due Right of Presbyteries (1644), Ch. 5, sections 1-2 in Part 2, pp. 272-3</span></figcaption>

<blockquote><p>Grace breeds delight in God, and delight breeds Meditation. A duty wherein consists the essentials of Religion, and which nourisheth the very life blood of it; and that the Psalmist may shew how much the godly man is habituated and inured to this blessed work of Meditation, he subjoins, in his Law doth he meditate day and night; not but that there may be sometimes intermission; God allows time for our calling, he grants some relaxation, but when it is said, the godly man meditates day and night, the meaning is, frequently; he is much conversant in the duty.

‘Tis a command of God to pray without ceasing, 1 These. 5.17. The meaning is, not that we should be always praying (as the Euchites held) but that we should every day set some time apart for prayer; so Drusius and others interpret it. We read in the old Law it was called the continual sacrifice; not that the people of Israel did nothing else but sacrifice, but because they had their stated hours every morning and evening they offered, therefore it was called the continual sacrifice; thus the godly man is said to meditate day and night, that is, he is often at this work, he is no stranger to meditation. …

That a good Christian is a meditating Christian, Psalm 119.15. I will meditate in thy precepts, 1 Tim. 4.15. Meditate upon these things. Meditation is the chewing upon the truths we have heard; The beasts in the old Law that did not chew the cud were unclean; the Christian that doth not by meditation chew the cud, is to be accounted unclean. Meditation is like the watering of the seed, it makes the fruits of grace flourish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian on the mount: or, A treatise concerning meditation. Wherein the necessity, useful</cite>, ness, excellency of Meditation is at large discussed (London: Ralph Smith, 1657), pp 58-60.</span></figcaption>

— Thomas Watson, A Christian on the mount: or, A treatise concerning meditation. Wherein the necessity, useful, ness, excellency of Meditation is at large discussed (London: Ralph Smith, 1657), pp 58-60.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGrace+breeds+delight+in+God%2C+and+delight+breeds+Meditation.+A+duty+wherein+consists+the+essentials+of+Religion%2C+and+which+nourisheth+the+very+life+blood+of+it%3B+and+that+the+Psalmist+may+shew+how+much+the+godly+man+is+habituated+and+inured+to+this+blessed+work+of+Meditation%2C+he+subjoins%2C+in+his+Law+doth+he+meditate+day+and+night%3B+not+but+that+there+may+be+sometimes+intermission%3B+God+allows+time+for+our+calling%2C+he+grants+some+relaxation%2C+but+when+it+is+said%2C+the+godly+man+meditates+day+and+night%2C+the+meaning+is%2C+frequently%3B+he+is+much+conversant+in+the+duty.%0A%0A%E2%80%98Tis+a+command+of+God+to+pray+without+ceasing%2C+1+These.+5.17.+The+meaning+is%2C+not+that+we+should+be+always+praying+%28as+the+Euchites+held%29+but+that+we+should+every+day+set+some+time+apart+for+prayer%3B+so+Drusius+and+others+interpret+it.+We+read+in+the+old+Law+it+was+called+the+continual+sacrifice%3B+not+that+the+people+of+Israel+did+nothing+else+but+sacrifice%2C+but+because+they+had+their+stated+hours+every+morning+and+evening+they+offered%2C+therefore+it+was+called+the+continual+sacrifice%3B+thus+the+godly+man+is+said+to+meditate+day+and+night%2C+that+is%2C+he+is+often+at+this+work%2C+he+is+no+stranger+to+meditation.+%E2%80%A6%0A%0AThat+a+good+Christian+is+a+meditating+Christian%2C+Psalm+119.15.+I+will+meditate+in+thy+precepts%2C+1+Tim.+4.15.+Meditate+upon+these+things.+Meditation+is+the+chewing+upon+the+truths+we+have+heard%3B+The+beasts+in+the+old+Law+that+did+not+chew+the+cud+were+unclean%3B+the+Christian+that+doth+not+by+meditation+chew+the+cud%2C+is+to+be+accounted+unclean.+Meditation+is+like+the+watering+of+the+seed%2C+it+makes+the+fruits+of+grace+flourish.%E2%80%9D%0A%0A%E2%80%94+Tho <blockquote><p>The Church did formerly of late confer with Christ, and refused to open to Him when He was knocking and showering down influences of grace [in the Song of Solomon]; now she is glad to confer:

1. With the smiting watchmen [Church officers], where she found little of Christ.

2. Next with private Christians in assemblies. This is a mean of the Lords showering down of influences in the public and domestic, or less public meetings of his saints; for ordinances of all sorts that are appointed of Christ, they drop down savory and seasonable dews. The Lord writes in his book the savory conferences of such as fear the Lord’s name, Mal. 3:16; and three things follow:

1. The Lord owns such as are his.

2. His forbearance though there be faults in their service.

3. His making known to his the difference betwixt such as serve God, and such as serve Him not: and Zech. 8, the inhabitants of one city encourage the inhabitants of another; and the fruits of it is:

1. Praying.

2. Owning the saints. And they take hold of the skirt of a Jew; and both say Christians meeting for prayer and conference want not God, who rains down impressions of grace upon them as his people, especially when they warm one another; as many coals in one heap make a great fire. Nor is the acting of the Spirit tied only to the public ministry; the saints take to their houses clusters of wine-grapes, which they feed upon at home. Let the saints meet, and by conference and prayer draw down new influences of the Spirit, Jude 20; Isa. 2:1-3; Jer. 50:4-5; Col. 3:16; Heb. 3:13 &amp; 10:24; 1 Thess. 5:14.</p></blockquote>

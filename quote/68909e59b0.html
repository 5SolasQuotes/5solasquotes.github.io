<blockquote><p>Reason 3. Ministers that were studious of the good of the flock did (very many of them) heretofore discern the need of an express consent [by laypesons for church-membership], that they might have more certainty of the extent of their charge than the bounds of a parish can give them. Only they (truly) maintained that our churches were true churches without a more express consent than we then had; and that it tended but to the well-being of a church, and not to the being, that the consent be more express than formerly…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 11-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>[Margin note:] Which be the principal points of the catholic Faith or religion? Now, because I see some [persons] (not yielding unto these things which we have spoken in general concerning the fundamental or principal points of our religion) again to demand what those should be: I answer: That these articles are to be called grounds or principles, which being laid, the whole building remains: and which being overthrown, all things builded thereupon fall to the ground. And all these things we profess to have been described with great shortness and plainness out of the Word of God in the Creed which they call the Apostles’. Which thing ought to be added to the Ten Commandments and the Lord’s prayer, of the which, that, to wit, the Ten Commandments do very compendiously set out the order of Christian life: and this, that is, the Lord’s Prayer, does very briefly also set out, right invocation and prayer. This (I say) is that fundamental, true and perpetual mark of the catholic Church, which shall never be blotted out unto the world’s end: but which nevertheless ought to be expounded out of the writings of the prophets and apostles, from whence it is taken, that all men may understand it and keep it as much as in them lies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the True &amp; Visible Marks of the catholic Church</cite>, … (London: 1582), n.p.</span></figcaption>

Which%20be%20the%20principal,as%20much%20as%20in%20them%20lies&amp;text=Margin%20note%3A%5D%20Which%20be%20the%20principal%20points%20of&amp;text=keep%20it%20as%20much%20as%20in%20them%20lies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I. The Articles of the Christian Belief It is a catechism if you prefix to every article the question, ‘What do you believe?’ There is one only God in three persons, the Father, Son and Holy Ghost: who is infinite in being, power, wisdom and goodness: the Creator of all things, our most absolute Lord, most righteous Governor and most gracious Father. God made man for Himself in his own image, with reason and freewill: endued with wisdom and holiness; and put under him the inferior creatures, for his use: and bound him by the Law of Nature to adhere to God his Maker; to believe Him, fear Him, love Him, honor Him and obey Him with all his powers: moreover forbidding Him to eat of the Tree of Knowledge upon pain of death. Man being tempted by Satan, did willfully sin, and so fell from God and happiness, under the wrath of God, the curse of his Law and the power of the Devil: and hence we are all conceived in sin, and prone to evil, and condemnation is passed upon all; and no mere creature is able to deliver us. God so loved the world that He gave his only Son to be their Redeemer; who being God, and one with the Father did take our nature, and become man; being conceived by the Holy Ghost in the Virgin Mary, and born of her, and called Jesus Christ; and being free from sin, He conquered the tempter, fulfilled all righteousness, revealed the Gospel, and confirmed it by miracles; and gave Himself a sacrifice for our sins, and a ransom for us, in suffering death on the cross, to reconcile us unto God; and was buried, and went among the dead) and rose again the third day, having conquered death; and afterward ascended into heaven where he remains God and Man, in one Person, and is Lord of all, in glory with the Father; the chief Priest, and Prophet, and King of his Church; interceding for us; and teaching and ruling us, by his Spirit, ministers, and Word. The Lord Jesus Christ has ordained in his Testament that all they that receive Him by a true effectual faith, and by true repentance do turn from the flesh, the world, and the Devil unto God, shall freely receive the pardon of their sins, and shall become the sons of God, and heirs of everlasting life, and the Spirit of Christ shall dwell within them: and all that overcome and persevere to the death, shall live with Christ in endless glory: But the unbelievers, impenitent and unholy shall be condemned to everlasting fire. And this He has commanded his ministers to preach to all the world: And has told us that, All that are given Him of the Father, shall come to Him, and that he will in no wise cast them out, nor shall any pluck them out of his hands. The Holy Ghost proceeding from the Father and the Son, did inspire and guide the prophets, apostles, and evangelists, that they might truly and fully reveal the doctrine of Christ, and deliver it in Scripture to the Church as the rule of our faith and life: and by abundance of evident uncontrolled miracles, and wonderful gifts, to be the great witness of Christ, and of the truth of his holy Word. Where the Gospel is made known, the Holy Ghost by it does enlighten the minds of all that shall be saved, and opening and softening their hearts, does draw them to believe in Christ and turns them from the power of Satan unto God: Whereupon they are joined to Christ the Head, and into one holy catholic Church which is his Body, consisting of all true believers: and are freely justified, and made the sons of God; and a sanctified peculiar people unto Him, and do love Him above all, and serve Him sincerely in holiness and righteousness, loving and desiring the communion of the saints; overcoming the flesh, the world and the Devil, and hoping for Christ’s second coming, and for everlasting life. At death the souls of the justified go to happiness with Christ, and the souls of the wicked to misery: And at the end of this world the Lord Jesus Christ will come again, and will raise the bodies of all men from the dead; and will judge all according to their works; And the righteous shall go into everlasting life, and the rest into everlasting punishment: All this I do unfeignedly believe. II. Our Consent to the Gospel Covenant, with God the Father, Son and Holy Ghost, by which we are Christians and members of the catholic Church Question: Are you willing and resolved to give up yourself to God the Father, Son and Holy Ghost, according to the Gospel doctrine which your profess? Repenting of my sins and renouncing the flesh, the world and the devil, I do take this one God to be my only God, and do heartily give up myself unto Him; even to the Father, as my Creator and reconciled Father in Christ: And to his Son Jesus Christ, as my Lord, and only Savior, to reconcile and bring me unto God: And to the Holy Ghost as my Sanctifier; that He may further illuminate, sanctify and confirm me, and I may hold fast and obey the doctrine of Christ, which was revealed by his inspiration, and witnessed by his gifts and miracles, and is now contained in the Holy Scriptures; and that he may be in me the earnest of my everlasting happiness with God. III. The Sum of Christian Duty Question: What are [???…] Christ has appointed that fit men shall be ordained his ministers, to preach the Gospel to the nations of the world, and make them his disciples, baptizing them in the name of the Father, Son and Holy Ghost: and to congregate his disciples, and to oversee and guide the several congregations, and each member thereof: particularly, to teach them the Word of God; to pray and praise God with them and for them to administer the Lord’s Supper in remembrance of Him; especially on the Lord’s Day, which He has appointed for holy communion in such works: Also to rebuke with authority the scandalous and unruly; and to bind and reject those that are obstinately impenitent, and unreformed; and to absolve and restore the penitent, and confirm the weak. It is therefore the people’s duty to join with such churches, for the aforesaid worship of God; and to know, hear, submit to, and obey these their guides that are over them in the Lord; and to avoid division and discord, and to live in unity, love and peace. The secret duties of holiness are these: The exercise of faith, repentance, love, hope, delight in God, and all other graces; The mortifying of our sins; especially atheism, unbelief, and unholiness; hardness of heart, disobedience and unthankfulness, flesh-pleasing, covetousness, and pride; The diligent examining of our own hearts, about our estates, our duties, and our sins: meditating upon God, and his Word and works; especially of our redemption by Jesus Christ; and of death, Judgment, heaven, and Hell; watching diligently over our thoughts, affections, words and actions: resisting temptations: And frequent and fervent prayer to God, in the name of Christ, with confession, thanksgiving, and cheerful praises; Parents and masters must diligently teach their children and servants the Word and fear of God, and pray with them and for them, and hinder them from sin, and use all their power that they and their households may serve the Lord: children and servants must willingly learn and obey: We must seek instruction in the matters of our salvation, especially of our teachers: we must take heed of the company of tempting and ungodly persons, and delight in the company and help of the godly: We must lovingly and faithfully give, and thankfully receive admonitions and exhortations: confessing our faults one to another: and by prayer, psalms, and edifying conference, and a holy conversation, provoking one another to love, and to good works. Superiors must rule for God and the common good, with justice and mercy: Inferiors must honor and obey them in the Lord: We must not injure, but preserve the life, chastity, estate, name, and rights of our neighbor: Not seeking our own against his welfare, but doing as we would be done by; forbearing and forgiving; and loving our neighbor as ourselves: Yea loving our enemies; and doing good to all according to our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, The Christian Religion expressed: I. briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II. more largely in a Profession taken out of the Holy Scriptures, containing 1. the articles of the Christian Belief, 2. our consent to the Gospel Covenant, 3. the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660) | The Profession of the Christian Religion. See the original for the Scripture proofs.</span></figcaption>

— Richard Baxter, The Christian Religion expressed: I. briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II. more largely in a Profession taken out of the Holy Scriptures, containing 1. the articles of the Christian Belief, 2. our consent to the Gospel Covenant, 3. the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660) | The Profession of the Christian Religion. See the original for the Scripture proofs.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+The+Articles+of+the+Christian+Belief+It+is+a+catechism+if+you+prefix+to+every+article+the+question%2C+%E2%80%98What+do+you+believe%3F%E2%80%99+There+is+one+only+God+in+three+persons%2C+the+Father%2C+Son+and+Holy+Ghost%3A+who+is+infinite+in+being%2C+power%2C+wisdom+and+goodness%3A+the+Creator+of+all+things%2C+our+most+absolute+Lord%2C+most+righteous+Governor+and+most+gracious+Father.+God+made+man+for+Himself+in+his+own+image%2C+with+reason+and+freewill%3A+endued+with+wisdom+and+holiness%3B+and+put+under+him+the+inferior+creatures%2C+for+his+use%3A+and+bound+him+by+the+Law+of+Nature+to+adhere+to+God+his+Maker%3B+to+believe+Him%2C+fear+Him%2C+love+Him%2C+honor+Him+and+obey+Him+with+all+his+powers%3A+moreover+forbidding+Him+to+eat+of+the+Tree+of+Knowledge+upon+pain+of+death.+Man+being+tempted+by+Satan%2C+did+willfully+sin%2C+and+so+fell+from+God+and+happiness%2C+under+the+wrath+of+God%2C+the+curse+of+his+Law+and+the+power+of+the+Devil%3A+and+hence+we+are+all+conceived+in+sin%2C+and+prone+to+evil%2C+and+condemnation+is+passed+upon+all%3B+and+no+mere+creature+is+able+to+deliver+us.+God+so+loved+the+world+that+He+gave+his+only+Son+to+be+their+Redeemer%3B+who+being+God%2C+and+one+with+the+Father+did+take+our+nature%2C+and+become+man%3B+being+conceived+by+the+Holy+Ghost+in+the+Virgin+Mary%2C+and+born+of+her%2C+and+called+Jesus+Christ%3B+and+being+free+from+sin%2C+He+conquered+the+tempter%2C+fulfilled+all+righteousness%2C+revealed+the+Gospel%2C+and+confirmed+it+by+miracles%3B+and+gave+Himself+a+sacrifice+for+our+sins%2C+and+a+ransom+for+us%2C+in+suffering+death+on+the+cross%2C+to+reconcile+us+unto+God%3B+and+was+buried%2C+and+went+among+the+dead%29+and+rose+again+the+third+day%2C+having+conquered+death%3B+and+afterward+ascended+into+heaven+where+he+remains+God+and+Man%2C+in+one+Person%2C+and+is+Lord+of+all%2C+in+glory+with+the+Father%3B+the+chief+Priest%2C+and+Prophet%2C+and+King+of+his+Church%3B+interceding+for+us%3B+and+teaching+and+ruling+us%2C+by+his+Spirit%2C+ministers%2C+and+Word.+The+Lord+Jesus+Christ+has+ordained+in+his+Testament+that+all+they+that+receive+Him+by+a+true+effectual+faith%2C+and+by+true+repentance+do+turn+from+the+flesh%2C+the+world%2C+and+the+Devil+unto+God%2C+shall+freely+receive+the+pardon+of+their+sins%2C+and+shall+become+the+sons+of+God%2C+and+heirs+of+everlasting+life%2C+and+the+Spirit+of+Christ+shall+dwell+within+them%3A+and+all+that+overcome+and+persevere+to+the+death%2C+shall+live+with+Christ+in+endless+glory%3A+But+the+unbelievers%2C+impenitent+and+unholy+shall+be+condemned+to+everlasting+fire.+And+this+He+has+commanded+his+ministers+to+preach+to+all+the+world%3A+And+has+told+us+that%2C+All+that+are+given+Him+of+the+Father%2C+shall+come+to+Him%2C+and+that+he+will+in+no+wise+cast+them+out%2C+nor+shall+any+pluck+them+out+of+his+hands.+The+Holy+Ghost+proceeding+from+the+Father+and+the+Son%2C+did+inspire+and+guide+the+prophets%2C+apostles%2C+and+evangelists%2C+that+they+might+truly+and+fully+reveal+the+doctrine+of+Christ%2C+and+deliver+it+in+Scripture+to+the+Church+as+the+rule+of+our+faith+and+life%3A+and+by+abundance+of+evident+uncontrolled+miracles%2C+and+wonderful+gifts%2C+to+be+the+great+witness+of+Christ%2C+and+of+the+truth+of+his+holy+Word.+Where+the+Gospel+is+made+known%2C+the+Holy+Ghost+by+it+does+enlighten+the+minds+of+all+that+shall+be+saved%2C+and+opening+and+softening+their+hearts%2C+does+draw+them+to+believe+in+Christ+and+turns+them+from+the+power+of+Satan+unto+God%3A+Whereupon+they+are+joined+to+Christ+the+Head%2C+and+into+one+holy+catholic+Church+which+is+his+Body%2C+consisting+of+all+true+believers%3A+and+are+freely+justified%2C+and+made+the+sons+of+God%3B+and+a+sanctified+peculiar+people+unto+Him%2C+and+do+love+Him+above+all%2C+and+serve+Him+sincerely+in+holiness+and+righteousness%2C+loving+and+desiring+the+communion+of+the+saints%3B+overcoming+the+flesh%2C+the+world+and+the+Devil%2C+and+hoping+for+Christ%E2%80%99s+second+coming%2C+and+for+everlasting+life.+At+death+the+souls+of+the+justified+go+to+happiness+with+Christ%2C+and+the+souls+of+the+wicked+to+misery%3A+And+at+the+end+of+this+world+the+Lord+Jesus+Christ+will+come+again%2C+and+will+raise+the+bodies+of+all+men+from+the+dead%3B+and+will+judge+all+according+to+their+works%3B+And+the+righteous+shall+go+into+everlasting+life%2C+and+the+rest+into+everlasting+punishment%3A+All+this+I+do+unfeignedly+believe.+II.+Our+Consent+to+the+Gospel+Covenant%2C+with+God+the+Father%2C+Son+and+Holy+Ghost%2C+by+which+we+are+Christians+and+members+of+the+catholic+Church+Question%3A+Are+you+willing+and+resolved+to+give+up+yourself+to+God+the+Father%2C+Son+and+Holy+Ghost%2C+according+to+the+Gospel+doctrine+which+your+profess%3F+Repenting+of+my+sins+and+renouncing+the+flesh%2C+the+world+and+the+devil%2C+I+do+take+this+one+God+to+be+my+only+God%2C+and+do+heartily+give+up+myself+unto+Him%3B+even+to+the+Father%2C+as+my+Creator+and+reconciled+Father+in+Christ%3A+And+to+his+Son+Jesus+Christ%2C+as+my+Lord%2C+and+only+Savior%2C+to+reconcile+and+bring+me+unto+God%3A+And+to+the+Holy+Ghost+as+my+Sanctifier%3B+that+He+may+further+illuminate%2C+sanctify+and+confirm+me%2C+and+I+may+hold+fast+and+obey+the+doctrine+of+Christ%2C+which+was+revealed+by+his+inspiration%2C+and+witnessed+by+his+gifts+and+miracles%2C+and+is+now+contained+in+the+Holy+Scriptures%3B+and+that+he+may+be+in+me+the+earnest+of+my+everlasting+happiness+with+God.+III.+The+Sum+of+Christian+Duty+Question%3A+What+are+%5B%3F%3F%3F%E2%80%A6%5D+Christ+has+appointed+that+fit+men+shall+be+ordained+his+ministers%2C+to+preach+the+Gospel+to+the+nations+of+the+world%2C+and+make+them+his+disciples%2C+baptizing+them+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3A+and+to+congregate+his+disciples%2C+and+to+oversee+and+guide+the+several+congregations%2C+and+each+member+thereof%3A+particularly%2C+to+teach+them+the+Word+of+God%3B+to+pray+and+praise+God+with+them+and+for+them+to+administer+the+Lord%E2%80%99s+Supper+in+remembrance+of+Him%3B+especially+on+the+Lord%E2%80%99s+Day%2C+which+He+has+appointed+for+holy+communion+in+such+works%3A+Also+to+rebuke+with+authority+the+scandalous+and+unruly%3B+and+to+bind+and+reject+those+that+are+obstinately+impenitent%2C+and+unreformed%3B+and+to+absolve+and+restore+the+penitent%2C+and+confirm+the+weak.+It+is+therefore+the+people%E2%80%99s+duty+to+join+with+such+churches%2C+for+the+aforesaid+worship+of+God%3B+and+to+know%2C+hear%2C+submit+to%2C+and+obey+these+their+guides+that+are+over+them+in+the+Lord%3B+and+to+avoid+division+and+discord%2C+and+to+live+in+unity%2C+love+and+peace.+The+secret+duties+of+holiness+are+these%3A+The+exercise+of+faith%2C+repentance%2C+love%2C+hope%2C+delight+in+God%2C+and+all+other+graces%3B+The+mortifying+of+our+sins%3B+especially+atheism%2C+unbelief%2C+and+unholiness%3B+hardness+of+heart%2C+disobedience+and+unthankfulness%2C+flesh-pleasing%2C+covetousness%2C+and+pride%3B+The+diligent+examining+of+our+own+hearts%2C+about+our+estates%2C+our+duties%2C+and+our+sins%3A+meditating+upon+God%2C+and+his+Word+and+works%3B+especially+of+our+redemption+by+Jesus+Christ%3B+and+of+death%2C+Judgment%2C+heaven%2C+and+Hell%3B+watching+diligently+over+our+thoughts%2C+affections%2C+words+and+actions%3A+resisting+temptations%3A+And+frequent+and+fervent+prayer+to+God%2C+in+the+name+of+Christ%2C+with+confession%2C+thanksgiving%2C+and+cheerful+praises%3B+Parents+and+masters+must+diligently+teach+their+children+and+servants+the+Word+and+fear+of+God%2C+and+pray+with+them+and+for+them%2C+and+hinder+them+from+sin%2C+and+use+all+their+power+that+they+and+their+households+may+serve+the+Lord%3A+children+and+servants+must+willingly+learn+and+obey%3A+We+must+seek+instruction+in+the+matters+of+our+salvation%2C+especially+of+our+teachers%3A+we+must+take+heed+of+the+company+of+tempting+and+ungodly+persons%2C+and+delight+in+the+company+and+help+of+the+godly%3A+We+must+lovingly+and+faithfully+give%2C+and+thankfully+receive+admonitions+and+exhortations%3A+confessing+our+faults+one+to+another%3A+and+by+prayer%2C+psalms%2C+and+edifying+conference%2C+and+a+holy+conversation%2C+provoking+one+another+to+love%2C+and+to+good+works.+Superiors+must+rule+for+God+and+the+common+good%2C+with+justice+and+mercy%3A+Inferiors+must+honor+and+obey+them+in+the+Lord%3A+We+must+not+injure%2C+but+preserve+the+life%2C+chastity%2C+estate%2C+name%2C+and+rights+of+our+neighbor%3A+Not+seeking+our+own+against+his+welfare%2C+but+doing+as+we+would+be+done+by%3B+forbearing+and+forgiving%3B+and+loving+our+neighbor+as+ourselves%3A+Yea+loving+our+enemies%3B+and+doing+good+to+all+according+to+our+power.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Profession+of+the+Christian+Religion.+See+the+original+for+the+Scripture+proofs.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a4aed3395.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a4aed3395.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=I.%20The%20Articles%20of%20the%20Christian,to%20all%20according%20to%20our%20power&amp;text=I.%20The%20Articles%20of%20the%20Christian%20Belief%20It&amp;text=doing%20good%20to%20all%20according%20to%20our%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>19. Also we judge it our duty to preach those plain and necessary things which the salvation of men does most depend on, and the people generally have most need to hear; that is, the opening to them their Baptismal Covenant, and the Articles of the [Apostles’] Creed, the Lord’s Prayer, the Decalogue and the Gospel-precepts; or more briefly the doctrine of faith in Christ, and repentance towards God, and of the love of God and man; to live soberly, righteously, and godly in this world, as looking and hoping for a better, Tit. 2:12. And not to fill the people’s heads with needless controversies, or vain jangling, or contending about words which edify not, but subvert the hearers; much less to perplex them with talking of the unrevealed counsels of God; nor yet to corrupt their minds by talking against our superiors, or against dissenters behind their backs, or by aggravating the faults of other men’s manner of worshipping God, or breeding in them distaste of the public worship; or talking against bishops, or ceremonies, or liturgy; nor by representing any sort of Christians who differ from us in points not fundamental, as odious to the hearers; whether Lutherans, Calvinists, Arminians, Episcopal, Presbyterian, Independent, yea or Anabaptists; no, nor to injure the Papists themselves, by making our differences seem greater than indeed they are. Our office is to preach up love, and not to preach it down and mortify it, which all those do, whatever they pretend, that attempt to represent their brethren as odious, and to hide or deny, or extenuate that in them which is good and amiable.</p></blockquote>

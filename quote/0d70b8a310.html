<blockquote><p>Problem 1: Whether therefore regeneration in the second moment always actually grows and is intensified? Response: As to the universal or perpetual and whole course, affirmatively. As to the particular, incidental, and πρόσκαιρος [proskairos, temporary] impediment or regression, remission, diminution, and relapse of that course, negatively. Not otherwise than a boy grows in stature, although through disease or other impediment that growth is sometimes stopped, indeed the stature seems to be diminished. With this distinction the practical writers are to be understood, who make continual augmentation in grace and in all acts of the new man an infallible sign of true conversion. See Rev. 2:4–5; Gal. 3:1, 3; and 5:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bc8c60b3c7" data-kw="">
<blockquote><p>XVI. That this may be more in the open, the phrases and modes of speaking which Scripture uses in expressing the conversion of man are to be noted, as that God circumcises our heart (Dt. 30:6), that He takes away the stony heart and provides a fleshy one (Eze. 36:26), that we are drawn by the Father (Jn. 6:44), that those who believe, believe according to the efficacy of the power of his might (Eph. 1:18-19), and similar phrases which occur throughout. XVII. The efficacy of the Spirit which is signified here is such that where it is, there also a new creature exists. For the circumcision of the heart, the bending of the mind to faith, and the change of the heart constitute a new creature. Since this, therefore, is from the Holy Spirit, the new man also exists in act. XVIII. But not in potentiality only, so that conversion is then left to the liberty of his will; for God brings man not only to the power of believing, but to the very act of believing or converting (Jn. 6:44; Phil. 1:29; Acts 13:48). XIX. For either God does not give the act of believing itself, but only aids and the power of faith to be elicited by free will; or if He does give it, where is the place for deliberation, whether one wishes to believe or to be converted? For one who is already believing, there will certainly be none at all. XX. Indeed, the very corruption of man requires this. For Scripture names him dead. If he is dead, either he will not be resurrected to life at all, or if he is resurrected, it is necessary that this be done with that efficacy of which we have already spoken, so that the effect follows without doubt. The consequence follows, for since this resurrection indicates an infusion of life from God (Eph. 2:5) and an immortal seed implanted in man (1 Pet. 1:23), with this life infused, will not the man live? Or will the choice of living be left to liberty? But if life is not infused into him, he remains dead, and thus there will be no conversion of him. XXI. Nor indeed should anyone say here that God gives a kind of half-life, leaving the rest to be perfected by man. The phrases cited above do not permit this, for they indicate not some partial action, but a full and complete one. The condition of a man spiritually dead also opposes this fiction, for if only a particle of supernatural life is communicated to him, he must add the rest from his own resources. That will never be added by him who does not have it, and thus the conversion will be stuck. But if the better portion is conferred by God, the new creature already exists, if only from this, that the greater power overcomes the lesser in acting. XXII. This very thing is proven further. The hindrances which impede man’s conversion are the darkness of the mind (Eph. 4:18), the projection of the will toward evil (Gen. 8:21), and the disorder of the affections (Rom. 7:20). When these have been in large part restored in conversion by God, and good qualities have been substituted in place of these impediments, it is necessary that the faculties of the soul begin to operate differently, nor is it left free whether they wish to be converted or otherwise, being already converted in act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), pp. 4-5</span></figcaption>

<blockquote><p>5. All the justified have a real union and interest in Christ, to live by faith (Hab. 2:4; Rom. 1:17), and wait on God in all their troubles by faith; but though there be an union of love in God’s mind from eternity, between the elect and God, yet a complete union between us and Christ, without the Spirit, and without any faith, though it be boldly asserted by Familists (Rise, Reign, Er., p. 37), is against the Scripture: For then might we be born again, and not receive Christ by faith, contrary to the Scripture (Jn. 1:11-12, Antinomians hold an union with Christ before we believe); and be united to Christ, as branches to the Vine-tree, and not abide in Christ (Jn. 15:1-6), have Christ dwelling in our heart, and not by faith, contrary to Paul (Eph. 3:17); so might Christ live in us, and we eat and drink Him as the true manna, have the Son, and yet want [lack] faith, contrary to the Scriptures (Gal. 2:20; Rev. 2:7•; Jn. 6:35, 40, 44, 47, 54-55). All which, or most of them, prove that we were not justified when Christ died on the cross.</p></blockquote>

<blockquote><p>Thus Mt. 19:28, the Last Day is also called the day of regeneration unto the people of God; yet in this life they partake of that grace, but because then is the full perfection and manifestation of it, therefore the Scripture calls it the day of regeneration. Even as the apostle, Acts 13:33, applies that passage of the psalm to Christ’s resurrection, ‘This day have I begotten thee,’ because then was such a solemn and public declaration that he was the Son of God. No marvel then, if the Scripture do also call the day of judgment a time when sins shall be blotted out [Acts 3:19], because then is the public absolution of the godly; and according to philosophy motions receive their names from the term to which they tend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, pp. 256-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus Mt. 19:28, the Last Day is also called the day of regeneration unto the people of God; yet in this life they partake of that grace, but because then is the full perfection and manifestation of it, therefore the Scripture calls it the day of regeneration. Even as the apostle, Acts 13:33, applies that passage of the psalm to Christ’s resurrection, ‘This day have I begotten thee,’ because then was such a solemn and public declaration that he was the Son of God. No marvel then, if the Scripture do also call the day of judgment a time when sins shall be blotted out [Acts 3:19], because then is the public absolution of the godly; and according to philosophy motions receive their names from the term to which they tend.”

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures (London: Miller, 1651), Lecture 29, on Acts 3:19, pp. 256-58">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+Mt.+19%3A28%2C+the+Last+Day+is+also+called+the+day+of+regeneration+unto+the+people+of+God%3B+yet+in+this+life+they+partake+of+that+grace%2C+but+because+then+is+the+full+perfection+and+manifestation+of+it%2C+therefore+the+Scripture+calls+it+the+day+of+regeneration.+Even+as+the+apostle%2C+Acts+13%3A33%2C+applies+that+passage+of+the+psalm+to+Christ%E2%80%99s+resurrection%2C+%E2%80%98This+day+have+I+begotten+thee%2C%E2%80%99+because+then+was+such+a+solemn+and+public+declaration+that+he+was+the+Son+of+God.+No+marvel+then%2C+if+the+Scripture+do+also+call+the+day+of+judgment+a+time+when+sins+shall+be+blotted+out+%5BActs+3%3A19%5D%2C+because+then+is+the+public+absolution+of+the+godly%3B+and+according+to+philosophy+motions+receive+their+names+from+the+term+to+which+they+tend.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures+%28London%3A+Miller%2C+1651%29%2C+Lecture+29%2C+on+Acts+3%3A19%2C+pp.+256-58&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b0187239c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b0187239c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/regeneration#:~:text=Thus%20Mt.%2019%3A28%2C%20the%20Last%20Day,the%20term%20to%20which%20they%20tend&amp;text=Thus%20Mt.%2019%3A28%2C%20the%20Last%20Day%20is%20also&amp;text=names%20from%20the%20term%20to%20which%20they%20tend" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

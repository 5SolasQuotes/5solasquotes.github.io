</figure><figure class="quote" id="q-90594fc31d" data-kw="">
<blockquote><p>The possible, on the other hand, can be defined as that to which existence is not repugnant. So it is the same as the notion of being or of thing, and it includes both actually existing things and things that do not actually exist but can exist. For something to be possible in this sense, both extrinsic and intrinsic impossibility must be excluded. Logical possibility in the broad sense therefore includes both internal non-repugnance to existing (logical possibility properly speaking) and, if the being is causable, virtual existence in its cause (virtual possibility).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-a198ed1450" data-kw="">
<blockquote><p>The creation of the world is an external, temporal, and universal action of God, by which He alone made and perfected the whole universe, by the power of His omnipotent will, in the space of six days; for His own glory, and the utility of creatures, especially intelligent ones, and the eternal salvation of the elect in heaven. … The adjunct of time is that God created the world in the space of six natural days, Gen. 2:3, Ex. 20:11. For although God could have created it in a moment, yet He willed to use these intervals: that He might more openly declare that the creation of the world was not made from eternity, but in time; and that He might render men more attentive in the particular meditation of distinct works, as appears especially from Ps. 104 &amp; 136.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

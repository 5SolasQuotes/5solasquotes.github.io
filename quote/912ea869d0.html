<blockquote><p>2. When we teach, that the pastor or pastors of every particular Church and congregation, with the elders of the same, being met together, have power to bind and loose, we understand this, only of such places wherein a competent number of understanding and qualified men, may be had to make up an eldership: otherwise let there be one eldership made up of two or three of the next adjacent parishes, according as was ordained by the Church of Scotland in the seventh chapter of the Second Book of Discipline [section 10]… …set some bounds to the execution of their power: which bounds we also think good to be kept, viz. that if a Church be so small that it has not so many well qualified men as may be sufficient to assist the pastor in the governement thereof, then let one common eldership be made up out of it and some other neighbor churches…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... (1637), ch. 8, Digression 4, p. 189</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-61e1f1f8ad" data-kw="">
<blockquote><p>But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgie and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640 the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacy (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was, that I setled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government.</p></blockquote>

</figure><figure class="quote" id="q-f03e333876" data-kw="">
<blockquote><p>Objection: But we are bound by the canons of the Church which are still in force. Answer:

1. Scripture is the Church’s sufficient rule, and the perfect Law of God.

2. Those things that Scripture has left to occasional determination, no councils must make standing laws for to bind at all times. For if such laws had been fit, God would have made them.

3. It is the present guides of the Church that are upon the place, and see the occasions, that must determine such circumstantials as are of mutable determination. And former Church-governors can no more take away the power of the present, than they can deprive them of their office; it being essential to the office of every pastor to be a guide or ruler of his flock.

4. If you think that all Church canons (yea though it be General Councils) bind, then you are bound to contradictories: for one Council has oft crossed another. And Papists themselves disclaim many things enjoined by canons. The 16th canon of the 4th Council of Carthage requires ministers not to read the books of heathens: Does this bind now? Many the like might be mentioned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

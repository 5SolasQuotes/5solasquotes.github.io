<blockquote><p>22. Scripture describes the perfection of this God to us through pure attributes, all affirmative, by mode of συγκατάβασις [accommodation], which nevertheless are οὐσιωδῶς “essentially” and fundamentally one and the same, although several partly effectively, [several] partly objectively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim-the-elder.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>
<div class="actions"><button class="copy" data-copy="“22. Scripture describes the perfection of this God to us through pure attributes, all affirmative, by mode of συγκατάβασις [accommodation], which nevertheless are οὐσιωδῶς “essentially” and fundamentally one and the same, although several partly effectively, [several] partly objectively.”

— Friedrich Spanheim the Elder, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C22.+Scripture+describes+the+perfection+of+this+God+to+us+through+pure+attributes%2C+all+affirmative%2C+by+mode+of+%CF%83%CF%85%CE%B3%CE%BA%CE%B1%CF%84%CE%AC%CE%B2%CE%B1%CF%83%CE%B9%CF%82+%5Baccommodation%5D%2C+which+nevertheless+are+%CE%BF%E1%BD%90%CF%83%CE%B9%CF%89%CE%B4%E1%BF%B6%CF%82+%E2%80%9Cessentially%E2%80%9D+and+fundamentally+one+and+the+same%2C+although+several+partly+effectively%2C+%5Bseveral%5D+partly+objectively.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim+the+Elder%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe73d34c82e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e73d34c82e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=22.%20Scripture%20describes%20the%20perfection%20of,several%20partly%20effectively%2C%20%5Bseveral%5D%20partly%20objectively&amp;text=22.%20Scripture%20describes%20the%20perfection%20of%20this%20God&amp;text=same%2C%20although%20several%20partly%20effectively%2C%20%5Bseveral%5D%20partly%20objectively" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9441992a73" data-kw="">
<blockquote><p>For it is commonly conceded today that a composition in concepts does not argue to a real composition in the thing. For if the formal notion of one perfection (for example knowing, even if the knowing is omniscient) does not include the formal notion of another perfection (for example loving, even if the loving is altogether perfect), then to be sure this fact does not necessarily imply that both perfections have, in respect of the thing (e.g. God), the idea of parts and so the idea of being mutually perfectible. But this condition would be required for having composition on the part of the thing. If we were able to conclude anything from the conceptual separability of one perfection from another, then some non-identity on the part of the thing would be proved (as a virtual or so-called formal non-identity, which we will deal with in the treatment of the formal distinction). But such a non-identity implies neither composition nor imperfection in the being that has those perfections. At most, indeed, a reason is to be sought why one such perfection is found in the same thing along with another perfection not included in the formal concept of the first, but I do not know why the only adequate assignable reason for explaining it must be found in a mutual perfectability (a perfectibility after the manner of parts) that those perfections have on the side of the thing. But if anyone wishes to dispute this question, let him do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), pt. 1, article 2, pp. 17-18 Wolter was a Scotus scholar and writes from that perspective.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

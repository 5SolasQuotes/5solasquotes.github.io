<blockquote><p>Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, pp. 32-33</span></figcaption>

</figure><figure class="quote" id="q-330a4ce05d" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ‘It’s a staple rule, no man by nature has an ecclesiastical power over another by constraint; one comes a Christian convert from China, to a country or city where many churches are, none of them can, by the rule of the Gospel, compel him to join with one more than another. He may freely choose what is most suitable to his heart, and may be most to promote his spiritual edification.’ [Rutherford’s] Answer: …The man comes from China acknowledging God in all his ways, as Abraham left his country (Gen. 12); if he be an idolater, they should not lodge him (2 Jn. 10); he comes not as indifferent to be married [the analogy used by congregationalists for joining] to this or this church, or to none at all; as a man sins not if he marry none at all (1 Cor. 7). But if he be a professor that joins to no Church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage, but both parties are under a command to confess Christ before men; and its a selfish thing to make a man’s own heart the judge and determiner of his membership, and not the churches led by the rule of the Word: and so the Church is obliged to receive him, and he is obliged to join a member, according to Cant. 1:7-8; Mt. 10:32.</p></blockquote>

olasquotes.github.io%2Fquote%2F330a4ce05d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/330a4ce05d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a,according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32&amp;text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a%20staple%20rule&amp;text=a%20member%2C%20according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cab4783fca" data-kw="">
<blockquote><p>Apostles and members-dissolved are not fixed members of a single congregation, and yet members they must be of the visible, Church-catholic: sure it is no paradox, that the Apostles are such members, for they had right to all the seals in all congregations; Therefore, they must by this reason be members and no members: the like may be said of godly professors-sojourners [travellers], of these baptized by John Baptist, Mt. 3, by Peter, Acts 10, by Paul, Acts 16. For if we say that professors are only members of a particular congregation, then we confine a brother to be gained only to one congregation: ‘let all the rest perish: they are not my brethren.’</p></blockquote>

<blockquote><p>1st Conclusion. An adjoining to a visible Church either formally to be a member thereof, or materially, confessing the Faith of the true visible Church, God offering occasion, is necessary to all: 1. Because we are to be ready to give a confession of the hope that is in us, to every one who asks, 1 Pet. 3:15. 2 Because he who denies Christ before men, him also will Christ deny before the Father and before the holy angels, Mt. 10:33. 3. Yet if some die without the Church, having faith in Christ, and want opportunity to confess Him before men, as repenting in the hour of death, their salvation is sure, and they are within the invisible Church: so is that to be taken, extra Ecclesiam nulla salus, none can be saved who are every way without the Church, both visible and invisible; as all perished who were not in Noah’s Ark. 2nd Conclusion. When God offers opportunity, all are obliged to join themselves to a true visible Church: 1. Because God has promised his presence to the Churches as his Son walks in the midst of the golden candlesticks, Rev. 2:2. 2. Because faith comes by hearing a sent preacher, Rom. 10:4. 3. Separation from the true visible Church is condemned, Heb. 10:24; Jude v. 19; 1 Jn. 2:19. 4. Good men esteem it a rich favour of God to lay hold on the skirt of a Jew, Zech. 8:23, and to have any communion, even as a door keeper in God’s House, and have desired it exceedingly and complained of the want thereof, Ps. 84:10. v. 1-2; Ps. 27:4; Ps. 42:1-4; Ps. 63:1-2.</p></blockquote>

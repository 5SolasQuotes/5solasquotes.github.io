<blockquote><p>For [God] sets before every race of mankind that which is always and universally just, as well as all righteousness; and every race knows that adultery, and fornication, and homicide, and such like, are sinful; and though they all commit such practices, yet they do not escape from the knowledge that they act unrighteously whenever they so do, with the exception of those who are possessed with an unclean spirit, and who have been debased by education, by wicked customs, and by sinful institutions, and who have lost, or rather quenched and put under, their natural ideas. For we may see that such persons are unwilling to submit to the same things which they inflict upon others, and reproach each other with hostile consciences for the acts which they perpetrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue with Trypho, a Jew</cite>, (c. 155-70), 93 in Ante-Nicene Fathers, 1: 246.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57fba2f2b2" data-kw="">
<blockquote><p>A heathen writer, no base author, I wis, made this definition of law; that it is an especial reason, placed in nature, commanding what is to be done, and forbidding the contrary. And verily the law is nothing but a declaration of God’s will, appointing what thou hast to do, and what thou oughtest to leave undone.

The beginning and cause of laws is God himself, who is the fountain of all goodness, equity, truth, and righteousness. Therefore all good and just laws come from God himself, although they be, for the most part, published and brought to light by men. Touching the laws of men, we must have a peculiar consideration of them by themselves. …

The laws of men (for my promise was, that in my second part I would speak of them) are those which are by men ordained and published to the preservation of the common weal and l church of God. Touching these they are of divers kinds. For there are politic laws, there are ecclesiastical laws, and men’s traditions. Politic laws are those which the magistrate, according to the state of times, places, and per sons, doth ordain for the preserving of public peace and civility. Of this sort there are an innumerable company of examples in the civil law and constitutions of the emperors, especially of Justinian. All which ought to come as near as may be to the laws of God and nature, and not to be contrary to them, or to have any smack of impiety or cruel tyranny.

To such laws St Peter willeth us to obey, where he saith: “Submit yourselves unto all manner ordinance of man for the Lord’s sake ; whether it be to the king, as having the pre-eminence, or unto rulers, as they that are sent by him for the punishment of evil doers, but for the praise of them that do well.” For although the apostle by ordinances, or men’s constitutions, doth inclusively mean the kings and magistrates themselves, as in the second clause of the sentence he doth immediately declare; yet, notwithstanding, he doth bid us therefore obey good laws and just, because by them the magistrates support and rule the commonweal.

Moreover, just and honest politic laws are an help to love and tranquillity; do preserve fellowly society among men; do defend the good, bring inordinate persons into better order; and lastly, do not make a little only to the setting forward of religion, but do also abrogate evil customs, and utterly banish unlawful mischiefs. Hereof we have examples in the deeds of Nabuchodonosor, Cyrus, Darius, Artaxerxes, and other princes more.</p></blockquote>

</figure><figure class="quote" id="q-0617859933" data-kw="">
<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon</cite>, p. 509</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-f92399d50e" data-kw="against mental reservations">
<blockquote><p>Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits. We do not speak of the rhetorical use of equivocations, nor of the logical use which often obtains in disputations. Rather we speak of the theological and moral use in giving testimony and in oaths, where truth and sincerity are required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.12.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a> › <a href="../topics/worship/oaths-and-vows/lawful-oaths.html">Lawful oaths</a></span><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/third-commandment-the-name.html">Third commandment (the name)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Mortification of Sin in Believers</cite>, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

</figure><figure class="quote" id="q-00feb2e9e7" data-kw="against will-worship">
<blockquote><p>This would be to approve of will worship (ethelothrēskeias, which he elsewhere condemns); but in the second, for that which is founded on reason and is exercised by reason. That is, Paul uses that which is spiritual and inward, not carnal and outward, by antithesis to the Levitical and Old Testament ceremonial service which was carnal in the offering up of beasts; whereas God now no more requires brutes, but rational and spiritual sacrifices, as Peter calls them (1 Pet. 2:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12 / will-worship</span></figcaption>

</figure><figure class="quote" id="q-6410d65b06" data-kw="">
<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

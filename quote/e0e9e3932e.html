<main class="wrap"><figure class="quote" id="q-e0e9e3932e" data-kw="">
<blockquote><p>Those that care not to please God, yet care for the outward favors of God [such as Esau], and are ready to murmur if they want [lack] them; as if God were bound to them and they [were] free. And yet so merciful is God, that He has second blessings for those that love Him not, and gives them all they care for. That one blessing of special love is for none but Israel; but those of common kindness are for them that can sell their birthright. This blessing was more than Esau could be worthy of…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments (d. 1656; Old Paths Gospel Press), vol. 1</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed4087ec9b" data-kw="">
<blockquote><p>Dr. Preston answered that Christ was in himself sufficient to save all; and might be said to be provided for that end and use; as a medicine is to cure infected poison, though it cures none actually but those that drink it. “Habet in se quod omnibus prosit, sed, si non bibitur, non,” as in 1 John 5:11-12. But many did not thus apply Christ, because they had him not so offered and exhibited as others had, Matt 11:21; Luke 10:13, for God gave some faith and repentance, as I have showed. The serpent (Moses was commanded to make), was in itself sufficient to cure those that were bitten, Num. 21:8-9, yet cured none but only those who looked on it. “So, as Moses lifted up the Serpent in the wilderness, shall the Son of Man be lifted up, that whosoever believed in Him should not perish but have everlasting life,” John 3:14-15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This is John Ball’s (1590-1659) narrative of Preston’s debate with the Arminian Francis White (1564-1638). From Ball’s, The Life of the Renowned Doctor Preston, ed. by E. W. Harcourt (London: Parker &amp; Co., 1885), p. 135. This quote was compiled by Tony Byrne.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-ab94b5d552" data-kw="">
<blockquote><p>The benefits proper unto men are of two sorts: some are common to all men both good and bad, and some proper to the elect and faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted in David Silversides, The Free Offer of the Gospel</cite>, p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-42a4d4d71e" data-kw="">
<blockquote><p>We distinguish and teach that in this sense they [reprobates] are made to be reconciliable by the death of Christ, by which Prosper says (Response to the Little Head of the Gauls, ch. 9): “Christ is the Savior of the whole world on account of his true undertaking of human nature and communion in the ruin of the first man.” Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: … 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism, pp. 421-422 c. 1638-1643 trans. T. Fentiman</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-9d48b4ca22" data-kw="">
<blockquote><p>Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 2</cite>, p. 369</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

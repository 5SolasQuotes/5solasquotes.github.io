<main class="wrap"><figure class="quote" id="q-83f5e40efa" data-kw="">
<blockquote><p>Now to build up or edify a brother to sin is properly to offend a brother; for the proper definition of an offence is that which edifies a brother unto sin, as the original word expresses it (1 Cor. 8:10), and so to sin against a brother is to wound his conscience; yea, and as much as in us lies, to cause him to perish for whom Christ died, which is no better than spiritual murder of his soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40… (London, 1661)</cite>, pp. 13-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

<blockquote><p>Thirdly, that the offence of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so offence must not be given either to the Jew or to the Grecian, 1 Cor. 10:31.</p></blockquote>

</figure><figure class="quote" id="q-ac19291742" data-kw="">
<blockquote><p>VI. A passive scandal, which is taken and not given, is not only faulty when it proceeds of malice, but also, when it proceeds of ignorance and infirmity: and scandalum pusillorum [a scandal of weak ones], may be scandalum acceptum, on the part of the offended faulty, as well as scandalum Pharisaeorum [the scandal of the Pharisees]. When weak ones are offended at me for the use of a lawful thing, before I know of their weakness and their taking of offence, the scandal is only passive, and so we see that weak ones may take offence where none is given, as well as the malicious. Now, their taking of offence, though it proceed of weakness, yet is sinful, for their weakness and ignorance is a fault, and does not excuse them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 8</cite>, p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

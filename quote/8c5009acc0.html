<blockquote><p>They spoke with strange tongues, and not those of their native land; and the wonder was great, a language spoken by those who had not learnt it. And the sign is to them I that believe not [1 Cor. 14:22], and not to them that believe, that it may be an accusation of the unbelievers, as it is written, ‘With other tongues and other lips will I speak unto this people, and not even so will they listen to Me saith the Lord. [Isa. 28:11]&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 390) | Oration 41, on Pentecost, section 15 in NPNF2, 7:384</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ffdfb121d" data-kw="">
<blockquote><p>3. The Spirit dwells not in our flesh, that is, in our sinful and unrenewed part, for so is flesh taken, Rom. 7; who dreamed that grace dwells in original sin? or if by ‘flesh’ he mean the natural man, or the carnal man, or the outward man that is in our person; he then thinks this outward and natural man, or our body is turned in a spirit, or spiritual nature, so as we are made by justification spiritual as angels; and need no more ordinances, Word, seals, reading the written Scripture, than if we were glorified saints, as Saltmarsh speaks of the believers… If so, then believers, being more spiritual than angels, and so less literal and less carnal, because by imputed righteousness they are Christed and Godded, and so the body of sin destroyed by the the imputed righteousness of Christ, fully and completely, then… nor need they give attendance to reading, nor need they marry, nor can they die, nor sin, as our Saviour says, and that because they are spiritual; if then believers be more spiritual, as Del says, they need far less than angels the written Word, or the preaching of the Law, or any ordinances, nor should they marry, or die, nor can they sin, nor lie, nor whore, nor steal, nor kill, but be as the angels of Heaven. I cannot but profess my jealousy of all Familists, I much fear, when Del says believers are more spiritual than angels; and that the natural man must be made spiritual, which is done (says he) by the imputed righteousnesse of God, pp. 6-7, that he minds, with Mistress Hutchison [of New England], that these who are united to Christ have in this life new bodies, and two bodies, 1 Cor. 6:19. And that the souls of men are mortal, in regard of generation, like the beasts, Eccl. 3:8, but made immortal by the purchase of redemption. And that the Resurrection, Jn. 5:28, is not meant of the Resurrection of the body, but of our union here, and after this life with Christ. And so taught that abominable priest Antony Pocquius, and the Quintists with him (Calvin, An Instruction Against the Libertines, ch. 22, p. 458 [also ch. 23]), with Phyletus and Hymeneus, that the Resurrection of the dead was in this life, and that we are not saved in hope only in this life, but really and completely before we die; and the same perfection of life-eternal in this life is taught by Antinomians, to wit, by Towne and Saltmarsh, the colleague of Del. These must lie upon Antinomians, while they condemn their fathers, the Familists, upon whose principles they walk, which they have never yet done, nor have they denied the foul heresies that are in the story of the Rise, Reign, Ruin of Antinomians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 2 | ch. 84, ‘Master Dell &amp; Saltmarsh deny all outward reformation, all Scripture seals, Ordinances, with Familists, and flee to an Enthuastical Spirit and an internall Word only’, pp. 204-5</span></figcaption>

<blockquote><p>We must then learn from Familists: … 4. Then the delivering up of the Kingdom spoken of, 1 Cor. 15, and the Day of Judgment is already begun, and is in doing these many centuries of years. So we heard before H. Nicholas say, even now in this present day does the Lord sit in his throne and judge the world. I rather believe Paul than Saltmarsh or H. Nicholas; for Paul says, 1 Cor. 15, speaking of the resurrection of our bodies, which I am sure the Familists have not yet seen, 1 Cor. 15:24, then comes the end, [Greek] etc. Then, when the resurrection of the body shall be, then shall be the end, when He shall render up the Kingdom to the Father. So the rendering up of the Kingdom to the Father (which Saltmarsh says, p. 72, is even now, when the day dawns and the day-star ariseth) shall not be till the end, and till the general Resurrection of all be: And therefore Saltmarsh misses a step in his new devised order, except he say with Libertines and Hen. Nicholas that the Resurrection is to be exponed spiritually, as Hymaeneus and Philetus said, and there shall be no more Resurrection, nor Day of Judgement, nor rendering of the Kingdom, nor Heaven nor Hell, but such as we see in this life (as it is most like[ly] Saltmarsh believes with all the nation of the Familists), for the administration of the Spirit is in this life, as well as the ministration of Law and Gospel were in this life. The Scripture speaks of the Day of Judgment as of a thing not yet come, 2 Thess. 2:2, ‘Let no man trouble you, neither by spirit, nor by word, nor by letter as from us, as that the day of Christ is at hand.’ Then some by the spirit of Scriptureless revelation, as now Anabaptists and Familists have said, the Day of Judgment was near, or begun in this life; yea, the Scripture says, it is a day appointed of God, Acts 17.31, and shows us the foregoing tokens of that day, beyond which there is no more time nor Gospel, as 1 Thess. 5:1-2; Mt. 24:22, 23, 36-47; Mt. 25:31 &amp; 46; 2 Pet. 3:1-3 &amp; 10-13 &amp; 1 Cor. 15:24-26. And what needed the Holy Ghost bid us watch and be sober, and beware that that Day come not on us unawares, and tell us, if we have not oil in our lamps at that nick of time when the shout shall be given that the Bridegroom is entered in his chamber, Mt. 25, there is no more place for repentance or buying oil, or any possibility of salvation when that day is once come; because if the day of judgment be now, and the rendering up the Kingdom to the Father, be in this life, how is it that so many daily repent and escape out of the snare of the Devil? And the market of buying oil in this life is not passed: For Peter, Acts 8, wills Simon Magus, while he lives, to repent and sue for pardon. And so the time of the offered Gospel and the Day of Judgment cannot be both together, Paul could never say, 1 Cor. 3, I could not write to you as to spirituall, but as to carnal, except he meant that he wrote to some spiritual man, nor could he say, the spiritual man discerns all things except the last ministration, which is the spiritual ministration, were begun in the time that Paul wrote to the Corinthians, and then began the ministration of the Spirit, and our seeing of the Lord with open face, 2 Cor. 3, and so then was the rising of the dead, and the rendering of the Kingdom to the Father. And where are we now, if the dead have been a rising now these fifteen hundred years, and a dying all this [time?]; For Saltmarsh assured us that the [???] of the Kingdome is not in the end of world, when the fulness of time or ages is come, but it is a [???] in parts, till the fulness of the stature of [???], Eph. 4:11-13, that we meet all in Heaven, and the Lord Jesus his mystical body be filled up and perfected, and so long as pastors, teachers and a ministry shall be on earth, and when this shall be, the Scripture tells when the end shall come, 1 Cor. 15:24, and when all rule, power and authority shall be put down, and Christ’s enemies subdued, and when all things shall be subdued. Now this is not in this life.</p></blockquote>

:22, 23, 36-47; Mt. 25:31 &amp; 46; 2 Pet. 3:1-3 &amp; 10-13 &amp; 1 Cor. 15:24-26. And what needed the Holy Ghost bid us watch and be sober, and beware that that Day come not on us unawares, and tell us, if we have not oil in our lamps at that nick of time when the shout shall be given that the Bridegroom is entered in his chamber, Mt. 25, there is no more place for repentance or buying oil, or any possibility of salvation when that day is once come; because if the day of judgment be now, and the rendering up the Kingdom to the Father, be in this life, how is it that so many daily repent and escape out of the snare of the Devil? And the market of buying oil in this life is not passed: For Peter, Acts 8, wills Simon Magus, while he lives, to repent and sue for pardon. And so the time of the offered Gospel and the Day of Judgment cannot be both together, Paul could never say, 1 Cor. 3, I could not write to you as to spirituall, but as to carnal, except he meant that he wrote to some spiritual man, nor could he say, the spiritual man discerns all things except the last ministration, which is the spiritual ministration, were begun in the time that Paul wrote to the Corinthians, and then began the ministration of the Spirit, and our seeing of the Lord with open face, 2 Cor. 3, and so then was the rising of the dead, and the rendering of the Kingdom to the Father. And where are we now, if the dead have been a rising now these fifteen hundred years, and a dying all this [time?]; For Saltmarsh assured us that the [???] of the Kingdome is not in the end of world, when the fulness of time or ages is come, but it is a [???] in parts, till the fulness of the stature of [???], Eph. 4:11-13, that we meet all in Heaven, and the Lord Jesus his mystical body be filled up and perfected, and so long as pastors, teachers and a ministry shall be on earth, and when this shall be, the Scripture tells when the end shall come, 1 Cor. 15:24, and when all rule, power and authority shall be put down, and Christ’s enemies subdued, and when all things shall be subdued. Now this is not in this life.”

— Samuel Rutherford, A Survey of the Spiritual Antichrist... (London, 1648) | pt. 1 | ch. 19, ‘Saltmarsh with Familists Phancyeth Diverse New Administrations of the Law, of John Baptist, of the Gospel, of All Spirits’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+then+learn+from+Familists%3A+%E2%80%A6+4.+Then+the+delivering+up+of+the+Kingdom+spoken+of%2C+1+Cor.+15%2C+and+the+Day+of+Judgment+is+already+begun%2C+and+is+in+doing+these+many+centuries+of+years.+So+we+heard+before+H.+Nicholas+say%2C+even+now+in+this+present+day+does+the+Lord+sit+in+his+throne+and+judge+the+world.+I+rather+believe+Paul+than+Saltmarsh+or+H.+Nicholas%3B+for+Paul+says%2C+1+Cor.+15%2C+speaking+of+the+resurrection+of+our+bodies%2C+which+I+am+sure+the+Familists+have+not+yet+seen%2C+1+Cor.+15%3A24%2C+then+comes+the+end%2C+%5BGreek%5D+etc.+Then%2C+when+the+resurrection+of+the+body+shall+be%2C+then+shall+be+the+end%2C+when+He+shall+render+up+the+Kingdom+to+the+Father.+So+the+rendering+up+of+the+Kingdom+to+the+Father+%28which+Saltmarsh+says%2C+p.+72%2C+is+even+now%2C+when+the+day+dawns+and+the+day-star+ariseth%29+shall+not+be+till+the+end%2C+and+till+the+general+Resurrection+of+all+be%3A+And+therefore+Saltmarsh+misses+a+step+in+his+new+devised+order%2C+except+he+say+with+Libertines+and+Hen.+Nicholas+that+the+Resurrection+is+to+be+exponed+spiritually%2C+as+Hymaeneus+and+Philetus+said%2C+and+there+shall+be+no+more+Resurrection%2C+nor+Day+of+Judgement%2C+nor+rendering+of+the+Kingdom%2C+nor+Heaven+nor+Hell%2C+but+such+as+we+see+in+this+life+%28as+it+is+most+like%5Bly%5D+Saltmarsh+believes+with+all+the+nation+of+the+Familists%29%2C+for+the+administration+of+the+Spirit+is+in+this+life%2C+as+well+as+the+ministration+of+Law+and+Gospel+were+in+this+life.+The+Scripture+speaks+of+the+Day+of+Judgment+as+of+a+thing+not+yet+come%2C+2+Thess.+2%3A2%2C+%E2%80%98Let+no+man+trouble+you%2C+neither+by+spirit%2C+nor+by+word%2C+nor+by+letter+as+from+us%2C+as+that+the+day+of+Christ+is+at+hand.%E2%80%99+Then+some+by+the+spirit+of+Scriptureless+revelation%2C+as+now+Anabaptists+and+Familists+have+said%2C+the+Day+of+Judgment+was+near%2C+or+begun+in+this+life%3B+yea%2C+the+Scripture+says%2C+it+is+a+day+appointed+of+God%2C+Acts+17.31%2C+and+shows+us+the+foregoing+tokens+of+that+day%2C+beyond+which+there+is+no+more+time+nor+Gospel%2C+as+1+Thess.+5%3A1-2%3B+Mt.+24%3A22%2C+23%2C+36-47%3B+Mt.+25%3A31+%26+46%3B+2+Pet.+3%3A1-3+%26+10-13+%26+1+Cor.+15%3A24-26.+And+what+needed+the+Holy+Ghost+bid+us+watch+and+be+sober%2C+and+beware+that+that+Day+come+not+on+us+unawares%2C+and+tell+us%2C+if+we+have+not+oil+in+our+lamps+at+that+nick+of+time+when+the+shout+shall+be+given+that+the+Bridegroom+is+entered+in+his+chamber%2C+Mt.+25%2C+there+is+no+more+place+for+repentance+or+buying+oil%2C+or+any+possibility+of+salvation+when+that+day+is+once+come%3B+because+if+the+day+of+judgment+be+now%2C+and+the+rendering+up+the+Kingdom+to+the+Father%2C+be+in+this+life%2C+how+is+it+that+so+many+daily+repent+and+escape+out+of+the+snare+of+the+Devil%3F+And+the+market+of+buying+oil+in+this+life+is+not+passed%3A+For+Peter%2C+Acts+8%2C+wills+Simon+Magus%2C+while+he+lives%2C+to+repent+and+sue+for+pardon.+And+so+the+time+of+the+offered+Gospel+and+the+Day+of+Judgment+cannot+be+both+together%2C+Paul+could+never+say%2C+1+Cor.+3%2C+I+could+not+write+to+you+as+to+spirituall%2C+but+as+to+carnal%2C+except+he+meant+that+he+wrote+to+some+spiritual+man%2C+nor+could+he+say%2C+the+spiritual+man+discerns+all+things+except+the+last+ministration%2C+which+is+the+spiritual+ministration%2C+were+begun+in+the+time+that+Paul+wrote+to+the+Corinthians%2C+and+then+began+the+ministration+of+the+Spirit%2C+and+our+seeing+of+the+Lord+with+open+face%2C+2+Cor.+3%2C+and+so+then+was+the+rising+of+the+dead%2C+and+the+rendering+of+the+Kingdom+to+the+Father.+And+where+are+we+now%2C+if+the+dead+have+been+a+rising+now+these+fifteen+hundred+years%2C+and+a+dying+all+this+%5Btime%3F%5D%3B+For+Saltmarsh+assured+us+that+the+%5B%3F%3F%3F%5D+of+the+Kingdome+is+not+in+the+end+of+world%2C+when+the+fulness+of+time+or+ages+is+come%2C+but+it+is+a+%5B%3F%3F%3F%5D+in+parts%2C+till+the+fulness+of+the+stature+of+%5B%3F%3F%3F%5D%2C+Eph.+4%3A11-13%2C+that+we+meet+all+in+Heaven%2C+and+the+Lord+Jesus+his+mystical+body+be+filled+up+and+perfected%2C+and+so+long+as+pastors%2C+teachers+and+a+ministry+shall+be+on+earth%2C+and+when+this+shall+be%2C+the+Scripture+tells+when+the+end+shall+come%2C+1+Cor.+15%3A24%2C+and+when+all+rule%2C+power+and+authority+shall+be+put+down%2C+and+Christ%E2%80%99s+enemies+subdued%2C+and+when+all+things+shall+be+subdued.+Now+this+is+not+in+this+life.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Spiritual+Antichrist...+%28London%2C+1648%29+%7C+pt.+1+%7C+ch.+19%2C+%E2%80%98Saltmarsh+with+Familists+Phancyeth+Diverse+New+Administrations+of+the+Law%2C+of+John+Baptist%2C+of+the+Gospel%2C+of+All+Spirits%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc42a704acc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c42a704acc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hyper-preterism/#:~:text=We%20must%20then%20learn%20from%20Familists,this%20is%20not%20in%20this%20life&amp;text=We%20must%20then%20learn%20from%20Familists&amp;text=subdued.%20Now%20this%20is%20not%20in%20this%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But, alas! what need is there of miracles, such as healing sick bodies and restoring sight to blind eyes, when we see greater miracles done every day by the power of God’s Word? Do not the spiritually blind now see?… And if we have the thing already which such miracles were only intended to introduce, why should we tempt God in requiring further signs?</p></blockquote>

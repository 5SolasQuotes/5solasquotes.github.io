<main class="wrap"><figure class="quote" id="q-fac1d9e67d" data-kw="">
<blockquote><p>I have arranged the book into fifty-two Meditations, adapted for each Lord’s Day, not merely because it is not intended to read them continuously through, but because the subject is, so to speak, specially identified with the risen Saviour. For the truth lying at the foundation of the Psalms, and which makes them the Hymnal of the Church, is the identification of Christ with the Church.

All the sorrows of the believer run up into the sorrow of Christ; and all the joys of the believer flow from the joy of Christ. And around these three truths — helpless misery, glorious salvation, and faith, with its exponent, prayer — move all the Psalms. Any seeming repetitions may therefore in part perhaps be due to the constant recurrence of these three elements throughout the Psalms.

Had the volume been suitable for it, I would fain have inscribed it, such as it is, to those loved friends to whom it is my privilege to minister in the gospel of His Son. Any mark of affection, however slender, to those who are themselves so earnest and loving, would have been peculiarly grateful.

And now I would send it forth with the earnest prayer that the Lord the Spirit who indited the Psalms, would give us all increasingly, the spiritual understanding and the spiritual joy of them in Christ; and so bless the effort to open this alabaster-box, that the savour of His name may be as ointment poured forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alfred-edersheim.html">Alfred Edersheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Golden Diary of Heart Converse with Jesus in the Book of Psalms. Arranged for every Sunday in the Year</cite>, (London: James Nisbet &amp; Co., 1866), vi-vii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2065f7484" data-kw="">
<blockquote><p>We must have songs not only honorable but also holy, which are to be like needles to arouse us to pray and praise God, to meditate on his works, in order to love him, fear, honor and glorify him. But what St. Augustine says is true, that no one can sing things worthy of God unless he has received them from Him. For when we have searched here and there, we will not find better songs nor ones more appropriate for this purpose than the Psalms of David, which the Holy Spirit has spoken to him and made. Therefore, when we sing them, we are certain that God has put the words in our mouth as if they themselves sang in us to exalt his glory. Consequently Chrysostom exhorts both men, women and little children to learn to sing them in order that they may be like a meditation to associate them with the company of angels (Chrysostom, In Ps. 41:1,2). Besides, we must remember what St. Paul says, that spiritual songs cannot be better sung than from the heart (Eph. 5:19; Col. 3:16). But the heart requires understanding. And in that (says St. Augustine) lies the difference between the singing of men and that of birds (Aug. Enarr. in Ps. 81, 2.1). For a Linnet, a Nightingale or a Popinjay will sing well, but it will be without understanding. But man’s proper gift is to sing, knowing what he says; after understanding must follow the heart and the affection, something that can only happen when we have the song imprinted on our memory never to cease singing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to the Reader’ in The Form of Prayers and Songs of the Church</cite>, (1543)</span></figcaption>

</figure><figure class="quote" id="q-653b7211b4" data-kw="">
<blockquote><p>It is storied of Caius Marius Victorius, who lived about three hundred years after Christ, and to his old age continued a Pagan; but at last being convinced of the Christian verity, he came to Simplicianus, and told him he would be a Christian; but neither he nor the church could believe it, it being so rare an example for any to be converted at his age; but at last seeing it was real, there was a shouting and gladness, and singing of psalms in all churches; the people crying, Caius Marius Victorius. is become a Christian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 5, ‘Husbandry Spiritualized’, p. 120</span></figcaption>

</figure><figure class="quote" id="q-6a2d046ea4" data-kw="">
<blockquote><p>It is affirmed, that in Col. 3:16, and in the parallel scriptures, we have indubitable evidence of the divine right of psalms, hymns, and spiritual songs, of human composition. The word of Christ, that is, according to a very lame exposition, the gospel, or writings of the New Testament, exclusively, must dwell in us richly, and that with a reference to our mutual improvement; which is effected by teaching one another, in the singing of psalms, hymns, and spiritual songs; which compositions not being found in the Old Testament, must be drawn from, and formed according to the doctrines of the gospel, found in the New Testament; for there alone, “the word of Christ,” which is to constitute the great matter of these compositions, is to be found, being expressly distinguished by the apostle, in writing to the Hebrews, from all former revelations.

To these assertions I make the following replies:—You will justify me in remarking, in the first place, that it is not true, that the “word of Christ,” or the gospel, is confined, exclusively, to the writings of the New Testament. One who well understood what the gospel is, informs us, that it was preached unto Abraham; and that to the Antediluvians the righteousness of faith, of which Noah was both an heir and a preacher, was made known. To them Christ by his Spirit preached in the day of forbearance, though now they occupy the place of imprisoned spirits. If the Spirit of Christ preached to them, one would reasonably conclude, they enjoyed the revelation of the word of Christ.

We are also certified, that the gospel was preached to the Israelites in the wilderness.—Unto us was the gospel preached as well as unto them. How could these writers presume to assert, that “where the apostle writes immediately to the Jews themselves, he expressly distinguishes the word of Christ from all former revelations, made by Moses and the prophets,”—“distinguishes the gospel from all the revelations of the divine will, in the Old Testament,”—when that apostle informs those very people, and in that same epistle, that the gospel, in “the revelation of the divine will in the Old Testament,” was preached to their fathers? May not a suspicion, without illiberality, exist, that men who write and talk at this rate, are novices in the knowledge of what the gospel is? But, in every age of the church, teachers have been found, understanding neither what they said, nor whereof they affirmed.

My second remark is this:—It is gratuitous to assert, that in the Old Testament scriptures, psalms, hymns, and spiritual songs, are not to be found. Is not this a pitiful play on words? Does it become men of sense thus to write? …

My third remark is on the text, Col. 3:16.—It appears to be both misunderstood and misapplied. Duties highly important, and the manner of performing them, are enjoined. They are three: An intimate and extensive acquaintance with the doctrine of Christ: Let the word of Christ dwell in you richly—Wisely promoting each other’s edification: In all wisdom, teaching and admonishing one another—Praising God, with proper dispositions of heart, in the use of psalms, hymns, and spiritual songs: In psalms, and hymns, and spiritual songs, singing with grace in your heart to the Lord. The celebration of the divine perfections, in suitable songs, wisely teaching and admonishing one another, are duties demanded by God; and that to discharge these duties aright, requires an extensive acquaintance with the inspired page, our apostle teaches, and the Christian readily acknowledges; but the scripture under consideration neither requires the members of the church to commence making hymns, nor authorizes the use of such, in the church, when made.

Psalms, and hymns, and spiritual songs, are, indeed, to be sung; but these are found in this inspired Book. The attempt to justify the expulsion of the Book of Psalms, and the introduction of uninspired hymns, from these injunctions of the sacred writer, argues a remarkable obliquity of intellect, not excused, even by the unhappy punctuation of our version. I have said, unhappy punctuation; for “through bad pointing this verse is not very intelligible; the several members of it should be distinguished thus: Let the doctrine of Christ dwell richly among you; teaching and admonishing each other in all wisdom; singing, with grace in your hearts unto the Lord, in psalms, hymns, and spiritual songs. This arrangement the original will not only bear, but it absolutely requires it, and it is not sense without it.” Still, it must be seen, that no pointing, however bad, can give any countenance to a human, in preference to an inspired system of psalms. Whether the argument upon which I have animadverted, merits a better character than “gratuitous assumption,” I leave to my reader to decide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-mcmaster.html">Gilbert McMaster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the Church of God</cite>, (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), pp 156-59n.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

— Gilbert McMaster, An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the Church of God, (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), pp 156-59n.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+affirmed%2C+that+in+Col.+3%3A16%2C+and+in+the+parallel+scriptures%2C+we+have+indubitable+evidence+of+the+divine+right+of+psalms%2C+hymns%2C+and+spiritual+songs%2C+of+human+composition.+The+word+of+Christ%2C+that+is%2C+according+to+a+very+lame+exposition%2C+the+gospel%2C+or+writings+of+the+New+Testament%2C+exclusively%2C+must+dwell+in+us+richly%2C+and+that+with+a+reference+to+our+mutual+improvement%3B+which+is+effected+by+teaching+one+another%2C+in+the+singing+of+psalms%2C+hymns%2C+and+spiritual+songs%3B+which+compositions+not+being+found+in+the+Old+Testament%2C+must+be+drawn+from%2C+and+formed+according+to+the+doctrines+of+the+gospel%2C+found+in+the+New+Testament%3B+for+there+alone%2C+%E2%80%9Cthe+word+of+Christ%2C%E2%80%9D+which+is+to+constitute+the+great+matter+of+these+compositions%2C+is+to+be+found%2C+being+expressly+distinguished+by+the+apostle%2C+in+writing+to+the+Hebrews%2C+from+all+former+revelations.%0A%0ATo+these+assertions+I+make+the+following+replies%3A%E2%80%94You+will+justify+me+in+remarking%2C+in+the+first+place%2C+that+it+is+not+true%2C+that+the+%E2%80%9Cword+of+Christ%2C%E2%80%9D+or+the+gospel%2C+is+confined%2C+exclusively%2C+to+the+writings+of+the+New+Testament.+One+who+well+understood+what+the+gospel+is%2C+informs+us%2C+that+it+was+preached+unto+Abraham%3B+and+that+to+the+Antediluvians+the+righteousness+of+faith%2C+of+which+Noah+was+both+an+heir+and+a+preacher%2C+was+made+known.+To+them+Christ+by+his+Spirit+preached+in+the+day+of+forbearance%2C+though+now+they+occupy+the+place+of+imprisoned+spirits.+If+the+Spirit+of+Christ+preached+to+them%2C+one+would+reasonably+conclude%2C+they+enjoyed+the+revelation+of+the+word+of+Christ.%0A%0AWe+are+also+certified%2C+that+the+gospel+was+preached+to+the+Israelites+in+the+wilderness.%E2%80%94Unto+us+was+the+gospel+preached+as+well+as+unto+them.+How+could+these+writers+presume+to+assert%2C+that+%E2%80%9Cwhere+the+apostle+writes+immediately+to+the+Jews+themselves%2C+he+expressly+distinguishes+the+word+of+Christ+from+all+former+revelations%2C+made+by+Moses+and+the+prophets%2C%E2%80%9D%E2%80%94%E2%80%9Cdistinguishes+the+gospel+from+all+the+revelations+of+the+divine+will%2C+in+the+Old+Testament%2C%E2%80%9D%E2%80%94when+that+apostle+informs+those+very+people%2C+and+in+that+same+epistle%2C+that+the+gospel%2C+in+%E2%80%9Cthe+revelation+of+the+divine+will+in+the+Old+Testament%2C%E2%80%9D+was+preached+to+their+fathers%3F+May+not+a+suspicion%2C+without+illiberality%2C+exist%2C+that+men+who+write+and+talk+at+this+rate%2C+are+novices+in+the+knowledge+of+what+the+gospel+is%3F+But%2C+in+every+age+of+the+church%2C+teachers+have+been+found%2C+understanding+neither+what+they+said%2C+nor+whereof+they+affirmed.%0A%0AMy+second+remark+is+this%3A%E2%80%94It+is+gratuitous+to+assert%2C+that+in+the+Old+Testament+scriptures%2C+psalms%2C+hymns%2C+and+spiritual+songs%2C+are+not+to+be+found.+Is+not+this+a+pitiful+play+on+words%3F+Does+it+become+men+of+sense+thus+to+write%3F+%E2%80%A6%0A%0AMy+third+remark+is+on+the+text%2C+Col.+3%3A16.%E2%80%94It+appears+to+be+both+misunderstood+and+misapplied.+Duties+highly+important%2C+and+the+manner+of+performing+them%2C+are+enjoined.+They+are+three%3A+An+intimate+and+extensive+acquaintance+with+the+doctrine+of+Christ%3A+Let+the+word+of+Christ+dwell+in+you+richly%E2%80%94Wisely+promoting+each+other%E2%80%99s+edification%3A+In+all+wisdom%2C+teaching+and+admonishing+one+another%E2%80%94Praising+God%2C+with+proper+dispositions+of+heart%2C+in+the+use+of+psalms%2C+hymns%2C+and+spiritual+songs%3A+In+psalms%2C+and+hymns%2C+and+spiritual+songs%2C+singing+with+grace+in+your+heart+to+the+Lord.+The+celebration+of+the+divine+perfections%2C+in+suitable+songs%2C+wisely+teaching+and+admonishing+one+another%2C+are+duties+demanded+by+God%3B+and+that+to+discharge+these+duties+aright%2C+requires+an+extensive+acquaintance+with+the+inspired+page%2C+our+apostle+teaches%2C+and+the+Christian+readily+acknowledges%3B+but+the+scripture+under+consideration+neither+requires+the+members+of+the+church+to+commence+making+hymns%2C+nor+authorizes+the+use+of+such%2C+in+the+church%2C+when+made.%0A%0APsalms%2C+and+hymns%2C+and+spiritual+songs%2C+are%2C+indeed%2C+to+be+sung%3B+but+these+are+found+in+this+inspired+Book.+The+attempt+to+justify+the+expulsion+of+the+Book+of+Psalms%2C+and+the+introduction+of+uninspired+hymns%2C+from+these+injunctions+of+the+sacred+writer%2C+argues+a+remarkable+obliquity+of+intellect%2C+not+excused%2C+even+by+the+unhappy+punctuation+of+our+version.+I+have+said%2C+unhappy+punctuation%3B+for+%E2%80%9Cthrough+bad+pointing+this+verse+is+not+very+intelligible%3B+the+several+members+of+it+should+be+distinguished+thus%3A+Let+the+doctrine+of+Christ+dwell+richly+among+you%3B+teaching+and+admonishing+each+other+in+all+wisdom%3B+singing%2C+with+grace+in+your+hearts+unto+the+Lord%2C+in+psalms%2C+hymns%2C+and+spiritual+songs.+This+arrangement+the+original+will+not+only+bear%2C+but+it+absolutely+requires+it%2C+and+it+is+not+sense+without+it.%E2%80%9D+Still%2C+it+must+be+seen%2C+that+no+pointing%2C+however+bad%2C+can+give+any+countenance+to+a+human%2C+in+preference+to+an+inspired+system+of+psalms.+Whether+the+argument+upon+which+I+have+animadverted%2C+merits+a+better+character+than+%E2%80%9Cgratuitous+assumption%2C%E2%80%9D+I+leave+to+my+reader+to+decide.%E2%80%9D%0A%0A%E2%80%94+Gilbert+McMaster%2C+An+Apology+for+the+Book+of+Psalms%2C+in+Five+Letters%3B+Addressed+to+the+Friends+of+Union+in+the+Church+of+God%2C+%281818%3B+4th+edn%2C+Philadelphia%3A+Daniels+%26+Smith%2C+1852%29%2C+pp+156-59n.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a2d046ea4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a2d046ea4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/03/09/gilbert-mcmaster-on-colossians-316-and-humanly-composed-hymns/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>It is an undeniable historical fact that non-canonical songs were excluded from the Geneva services and that this sate of affairs was due to Calvin’s influence and desire… He took great pains to put together a psalter for use in Strasbourg, translating a number of the psalms himself. He included no hymns, and that in spite of the fact that the congregational singing of hymns was an established ordinance in Strasbourg. He borrowed some of the German tunes but none of the lyrics, and the choice must have been deliberate. There is also the fact that, throughout its long history of development, the Geneva Psalter never included a single hymn. The only possible exception to this would be the inclusion of a metrical version of the Apostle’s Creed in the first edition of Calvin’s Geneva Psalter (1542). The Creed, however, was in a different category from either hymns or biblical songs… In any event, the Creed was not present in the final and authoritative version of the psalter (1562). …it must be kept in mind that, ’till the middle of the seventeenth century it was the current belief of Roman Catholic and Protestant Christendom that the Apostle’s Creed was ‘Membratim articulatimque‘ composed by the Apostle’s in Jerusalem on the day of Pentecost…’ (Schaff, Creeds, vol. 1, p. 22) Calvin himself prefers to leave the question of authorship open… In his catechism Calvin says, ‘It is commonly called the Apostle’s Creed, because from the beginning of the church it came from the lips of the Apostles or was faithfully collected from their writings.’ (Theological Treatises, p. 92) The Apostles’ Creed was thus seen by Calvin as having Apostolic sanction, if not authority, and as deriving directly from the Apostolic age, if not from the hands of the Apostles themselves. It was in his view a creed that had the honor and respect attending its use in the Church for some 1,500 years. Should we then be surprised to find that Calvin included a metrical version of such a creed in his psalter? It is unfortunate that he did so, but we can certainly see reasons for his having done so, which ultimately have nothing to do with whether the Apostles’ Creed is inspired. Certainly there is a wide difference between the inclusion of such a creed in the psalter and the inclusion of contemporary hymns, which is something that Calvin never did…. the final and complete version of the Genevan Psalter (1562) did not contain a metrical version of the Apostles’ Creed. Whatever reasons Calvin had for including the creed in the first place, he evidently changed his mind.</p></blockquote>

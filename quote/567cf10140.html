<main class="wrap"><figure class="quote" id="q-567cf10140" data-kw="">
<blockquote><p>Any form of church government is satisfactorily defended only in so far as its essential constituents are proved to be in accordance with Scripture. It is true that we are not furnished, under the dispensation of the Spirit, with any such formal pattern of ecclesiastical polity as was shown to Moses in the mount. The hints and examples which the New Testament affords for our guidance in this department often indicate rather than delineate duty, and leave room for the exercise of Christian expediency in executing our instructions.

But without alleging that a Divine hand has here discriminated for us the legitimate and the forbidden grounds by completed fences, having every post and stake precisely adjusted, we may yet look for those landmarks which shall betoken the general divisions of the country, which shall assist without superseding minuter measurements and partitionings, and which have only to be known and respected to secure the invaluable blessings of a kind and righteous administration. …

That Christ should assign his church no form of government, is, I submit, a position highly improbable in itself. The church must have some constitution; and on many grounds it appears of great and manifest importance that he should be its Legislator.

(1.) He is the Prince of Peace, and he promised peace to his people. But how could the societies of his worshippers be peacefully organised if the mode of organization were optional, and left to be determined by their own fallible and conflicting judgments? Under such conditions discord would be inevitable. It is true that strifes about church government have actually arisen, and that no extent of privilege secures an imperfect discipleship against their occurrence. But the conflicts which result from the neglect of a standard are always more or less restrained, even while they last, by that standard; and they admit of eventual and satisfactory settlement. Whereas differences accruing from want of a standard have no moderating element, and furnish no means either of prevention or of cure. Therefore they must yield unavoidable and interminable troubles.

(2.) It was of high importance that Christ should legislate for his church in order to secure for it a constitution worthy of his wisdom. We have seen that the peace of the church requires that its King and Head should furnish its constitution. This consideration holds good, irrespectively of the merits of different forms of government. Although they were equally eligible in themselves, it would still be of immense consequence for the peace of the church to have a preference of one above another appointed and enjoined. But different systems of ecclesiastical administration have no such parity of excellence. Few things, not identical in kind, have the same value in themselves, or fitness for a specific end.

That diverse forms of rule should form an exception, and should so approximate in worth as to make the choice between them a matter of indifference, is inconceivable; for nowhere is a happy medium more liable to be missed than in the modelling of superintendence; and nowhere does human nature show a stronger proneness to incline to one or other of opposite extremes. In so far as good government is secured, it is inexpressibly valuable in itself. It treats the governed as citizens and not as serfs; it allows the greatest freedom consistent with order; it establishes presidency without oppression, and liberty without licentiousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-king.html">David King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition and Defence of the Presbyterian Form of Church Government. In Reply to Episcopal and Independent Writers</cite>, (2nd edn, Edinburgh: Johnstone and Hunter, 1854), pp 17-18, 19-21.</span></figcaption>

<blockquote><p>Masters are to have regard to the moral and religious character of those in their employment (Gen. xxxix. 3, 4; Ps. ci. 2-5); and while careful to assign them suitable wages for their work (Jas. v. 1-4), they are also to treat them in a kindly spirit, allowing them sufficient time for the exercises of religion, and endeavouring to train them up in the fear of the Lord (Gen. xviii. 19).

On the other hand, servants ought to perform the work assigned to them conscientiously, honestly, diligently, and cheerfully (Prov. xviii. 9; Titus. ii. 9, 10). They are also to entertain a respectful regard for their masters, to pray for them (I Tim. vi. 1; I Pet. ii. 18); and submit with meekness when rebuked for their faults (I Pet. ii. 18-20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the Church, and Terms of Communion: Together with the Terms of Communion of the Reformed Presbyterian Church in</cite>, Ireland. To which is Appended the Cameronian Dream (Belfast, 1879), pp 43-44.</span></figcaption>

<blockquote><p>In midst of pointing to the Erastians that the logic of one of their arguments would require them to believe that the punishments of the judicial law remained valid (a view many Erastians rejected), George Gillespie, in an aside, pointed out that he sympathised with the English divines who held that the penal sanctions remained obligatory:

I know some divines hold that the judicial law of Moses, so far as concerneth the punishments of sins against the moral law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, &amp;c., ought to be a rule to the Christian magistrate; and, for my part, I wish more respect were had to it, and that it were more consulted with. This is by the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s rod blossoming; or, the divine ordinance of church government vindicated</cite>, (1646; Edinburgh, 1844), p. 2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Those prisoners being taken at [the Battle of] Bothwell Bridge [1679] were pressed to bind themselves not to take up arms against the king’s person and authority, under the certification of no less punishment than death. … Though they had not been subjects, but only prisoners of war in the victor’s power, to deprive them of life or liberty forever, I suppose they could not have been blamed for the preservation of their life to have given in such a bond; some who were taken prisoners by [Oliver] Cromwell, for their liberty engaged not to carry arms against him; and I do not remember that any censured them for it. What they [the opponents against taking the Scottish Indulgence] say in a parenthesis, that hazard will not make a moral change in actions, is a palpable error: If there were twenty with drawn swords waiting at the church door to kill a minister if he should come to preach, it were rash, furious, self-destroying, self-murdering zeal for a minister to venture to go to preach at that time, in despite of the hazard, so certain, visible and unavoidable, and yet it were his duty at another time to preach where there were no such hazard. For a merchant to cast his wares in the sea in a calm were wicked folly contrary to the 8th Command, a stealing from his family and himself; and yet in a storm, Paul and the passengers and mariners thought it their duty to cast out both goods and tackling of the ship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, (London: Cockerill, 1681), pp. 610-11</span></figcaption>

<blockquote><p>In reference to the Saints of God yet living. You are now scorned and persecuted, the ungodly world doth now judge you, and condemn you: the Psalmist observed it in his time; they gather themselves together against the Souls of the Righteous, and condemn the Innocent blood. Innocence is no security against cruelty and oppression; yea, it seems, no wine so sweet to wicked men as Innocent blood; ye have condemned and killed the just:

And yet, that open violence may not want a pretence of Justice, they act in the form of a legal process, before they kill, they do condemn; but alas! those Fig-leaves will not cover their nakedness. It is the just, whom they do unjustly Condemn and Murder; so it was in David’s time, and so it was in St. James his time, and so it is now; the Reprobate world holds on its course to this day; and so it will be to the end of the World. God’s Righteous Abels must expect no better justice at the Tribunals of these unrighteous Cains.</p></blockquote>

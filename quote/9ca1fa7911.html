<main class="wrap"><figure class="quote" id="q-9ca1fa7911" data-kw="">
<blockquote><p>The uncovering of the head is a gesture of reverence, and yet the gentiles had their heads covered when they worshiped their gods, as Brissonius proves (Formulae, bk. 1). Drusius proves the like of the Jews, that they covered their head when they prayed to God (Preterita, 1. Cor. 1:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly… (1619), ‘Kneeling in the act of receiving the sacramental elements of bread and wine proved unlawful’, ‘Kneeling considered as it is a breach of the Second Commandment’</cite>, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The uncovering of the head is a gesture of reverence, and yet the gentiles had their heads covered when they worshiped their gods, as Brissonius proves (Formulae, bk. 1). Drusius proves the like of the Jews, that they covered their head when they prayed to God (Preterita, 1. Cor. 1:4).”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82a48c5391" data-kw="">
<blockquote><p>[Durell:] ‘There was a great irreverence at prayer in their congregations, very few kneeling, many not so much as putting off their hats, and of this,’ he says, he was an eye-witness. …Into how many congregations he went where many did not so much as put off their hats in the time of prayer? And whether he either saw or heard that the ministers of those churches did any way countenance that irreverence? …For ought I know those in whom he observed this irreverence might be sectaries, who did more bitterly inveigh against presbyterians than against any other men whatever; perhaps also they might be episcopal-men, who designed to put an affront upon the presbyterians’ prayers: just as now some are observed to sit upon their breech all the time of pulpit-prayer, unless when just the Lord’s prayer is repeating, because forsooth pulpit-prayer is not allowed by the [establishing Anglican] Church, but only bidding of prayer. I write it with grief, but I must write it, I never in any congregations where I have been observed so much irreverence as I have observed in those in which there is the greatest abundance of such as always pretended a love to the English [Anglican] liturgy; particular stories I might relate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662.</cite>, pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-79971a3461" data-kw="">
<blockquote><p>§. 9. Of the faults of servants contrary to reverence in carriage. … 2. Others, if at first coming to their master they give some salutation, yet, through too much familiarity with them, all the day after they will carry themselves fellow-like, scarce uncovering their heads in their master’s presence, not enduring to stand long before him, but either setting themselves down, or slinking away when they should be in presence… This unmannerly familiarity is commonly in such servants, as have poor and mean [low] masters: for rich and great men’s servants can be so full of curtesy, as not a word shall be spoken by their masters to them, or by them to their masters, but the knee shall be bowed withal: they can stand hour after hour before their masters, and not once put on their hat: if they be walking after their masters, their master shall not turn sooner than their hat will be off, and that so oft as he turns or speaks to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Domestical Duties… (London: 1622) | 7th Treatise, “Duties of Servants” | section 9</cite>, p. 602</span></figcaption>

<blockquote><p>we showed that St. Paul would have Christians give attention to decency, especially when assembled in the name of God, both to hear His Word and to pray… Now he says on this score that ‘a man indeed ought not to cover his head.’ Let us observe that St. Paul has only taken exception to something that was not appropriate and fitting according to the usage of the land. For (as we have shown) we are not to take those countries and measure them by our custom(s).</p></blockquote>

<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>

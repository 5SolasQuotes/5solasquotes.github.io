<blockquote><p>1. WHY THE WOMAN WAS FORMED FROM THE SIDE OF THE MAN. And because she is not given as slave-girl or as one to lord it over him, in the beginning she was not formed either from the highest part, nor from the lowest, but from the side of man, for the sake of conjugal partnership.

If she had been made from the highest, as from the head, she might seem created for domination; but if from the lowest, as from the feet, she might seem to be created for subjection to slavery. But because she is taken neither as mistress, nor as [a] slave-girl, she is made from the middle, that is, from the side, because she is taken for conjugal partnership.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sentences</cite>, trans. Giulio Silano (1150; 4 vols, Toronto, 2007), IV, d. 28, c. 4, a. 1.</span></figcaption>

<blockquote><p>…the difficulty to do good, proneness to evil, contrariety between the powers and faculties of the soul, and the rebellion of the meaner against the superior and better, are not the conditions of nature, as it was or might have been in itself before the entrance of sin, but that all these proceed from the putting of the powers of the soul, by the loss of grace, out of that course, which by the law of God and nature they were to hold. For does not the condition of man’s nature require that amongst things inquired after, thought of, and known, God should be the first? and amongst things desired and loved, nothing should be desired and loved more or before Him, nor otherwise than for Him? and is it not clear and evident, that if God be the first thing that is thought of, sought after, and loved, and that nothing be sought after or respected, but after and for God, that there will be no proneness to evil, difficultire to do good, contrariety between the powers of the soul, and rebellion of the meaner and inferior against the better and superior? surely there is none that can or will make question of it. Now it is confessed by the best learned amongst the Schoolmen, that howsoever it be not so in the course of our understanding, in this state wherein we are, yet according to the course of the nature of our understanding simply considered, it should be so, that God should be the first thing sought after and known by us. … By this which has ben said [including the quotes by Scotus and Bonaventure], it is evident that according to the course of nature not disordered, nor put out of course, the first thing that is inquired after, thought of and known, is God, and that He is the first good that is desired and loved, and that no other thing is desired or loved but after Him, and for Him. So that none of the things formerly mentioned can be found in the nature of man, unless it be put out of course. Whence grows the contrariety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.</p></blockquote>

<blockquote><p>Transient to a First Uncausable Efficient Cause [see pp. 38-46 of the Summary for background for 16-21] .

16. In the same class of essentially ordered causes, the series cannot be infinite, for otherwise there would be an actually infinite series of simultaneously existing dependent things, which is impossible (from conclusion 4). Hence there cannot be an infinite series of essentially ordered efficient causes. The like must be said of final causes, or of material or formal causes.

17. A circle of essentially ordered causes cannot exist as independent or uncaused in itself (conclusion 5). Since a circle of causes must always be understood of things simultaneously existing,¹ this conclusion extends to every circle of causes. ¹ “But just as the cause which gives being to something must exist in the moment when the transient thing begins to exist,² so too the reason that the transient thing persists in being must coexist as long as the transient thing continues to exist.” p. 34 ² [This is confirmed in that only something actual can actualize something potential.]

18. A material cause does not behave as matter unless the formal cause forms it and vice versa. The point is plain from the definitions of these causes [see pp. 39-40], for unless that which is composed of both exists, matter and form cannot have an inflow on the thing caused [see pp. 38 &amp; 40]. Here from follows another conclusion, namely:

19. If something has behaved as matter, something else has behaved as form, and vice versa.

20. What is not effected is not caused by a final cause. The point is plain from the definitions of each [see pp. 39-40], for the final cause is that for the sake of which the efficient cause produces the effect; therefore it causes only by mediation of the efficient cause. This conclusion can thus be formulated in another way, namely that if something depends on a final cause it also depends on an efficient cause.

21. What is not effected is not mattered or formed, or, if something is caused by a material and formal cause, it is also caused by an efficient cause. For matter and form are parts; therefore they are in themselves indifferently disposed to forming one thing. Therefore something in the order of efficient cause is required to effect this one thing.

22. If something is transient or changeable or temporal, something is effectible or able to be effected. For nothing of this sort has in itself the total reason for its existence; therefore it is from another, namely from an efficient cause; therefore it is something that can be an effect or is effectible.

23. If something is effectible, something can effect. Cause and effect are correlatives¹ so that the possibility of one involves the possibility of the other. ¹ [Correlatives are things that are by definition depedent on each other; if there is one, there must be the other. An example is: if there is a father, there must be, or have been, a son; if there is a son, there must be, or have been, a father.]

24. If some efficient cause can exist, some first efficient and uncausable thing can exist. The proof is as follows: If there is an efficient cause it is either a first efficient cause (that is, not itself effectible) or not. If it is not the first ineffectible efficient cause, there is either: a) a circle of efficient causes such that the circle as a whole is altogether independent of anything outside it, but its individual members are effected by each other, or b) there is an infinite series of efficient causes that are either i) essentially ordered or ii) accidentally ordered.¹ ¹ “Causes are said to be accidentally ordered among themselves if one depends on the other in being, but not in actually causing; hence if the first cause of such a series ceases to exist, the others can still exist and still cause. Thus a father, when grandfather and great-grandfather are dead, can generate a son.” p. 44 But a) is impossible (from conclusion 17) and so is b) i) (from conclusion 16). But b) ii) would also be impossible unless there existed something outside the series on which the whole series depends. The proof is twofold: First, that from the fact that the individual members are dependent, the series consists, as a totality, of dependent things, and so the series as a whole is dependent and thus requires some cause outside itself. Second, from the fact that if the individual causes are not simultaneously existent, [then] they begin to be and cease to be; therefore they are transient. But if something is transient, there is also something absolutely permanent and independent both as to its existence and as to its permanence (from conclusion 3). Such a being, to the extent it keeps the series in being, is also an efficient cause, otherwise it would not be altogether independent as to its permanence in being. For if it were merely a material or formal cause, it would depend on some other efficient cause so that it be formally a cause (from conclusions 18 and 21). If it were merely a final cause, it would also require an efficient cause in order to exercise its final causality (from conclusion 20). There is a confirmation from the fact that to persist in being is formally an effect, at least in its beginning. Therefore if it is an efficient cause, it is in every case the first ineffectible efficient cause. That this first efficient cause is simply uncausable is plain from conclusions 20 and 21.

25. What is ineffectible cannot be caused by a final or material or formal cause; therefore it is simply uncausable.

26. If an ineffectible being can exist, it must exist; for if it did not actually exist, it could not receive existence from a cause. So it could not in fact exist but would be simply impossible.

27. A first uncausable efficient cause actually exists. The point is plain from the fact that there is something transient, changeable and temporal (from conclusions 8, 14, 15); therefore there is an uncausable first efficient cause (from conclusions 24 to 26). It follows next that there exists at least one efficient cause. Hence if something can be transient, changeable, etc. some ineffectible efficient cause must exist as the condition sine qua non [without which: nothing] of the possibility of something else.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Transient to a First Uncausable Efficient Cause [see pp. 38-46 of the Summary for background for 16-21] .

16. In the same class of essentially ordered causes, the series cannot be infinite, for otherwise there would be an actually infinite series of simultaneously existing dependent things, which is impossible (from conclusion 4). Hence there cannot be an infinite series of essentially ordered efficient causes. The like must be said of final causes, or of material or formal causes.

17. A circle of essentially ordered causes cannot exist as independent or uncaused in itself (conclusion 5). Since a circle of causes must always be understood of things simultaneously existing,¹ this conclusion extends to every circle of causes. ¹ “But just as the cause which gives being to something must exist in the moment when the transient thing begins to exist,² so too the reason that the transient thing persists in being must coexist as long as the transient thing continues to exist.” p. 34 ² [This is confirmed in that only something actual can actualize something potential.]

18. A material cause does not behave as matter unless the formal cause forms it and vice versa. The point is plain from the definitions of these causes [see pp. 39-40], for unless that which is composed of both exists, matter and form cannot have an inflow on the thing caused [see pp. 38 &amp; 40]. Here from follows another conclusion, namely:

19. If something has behaved as matter, something else has behaved as form, and vice versa.

20. What is not effected is not caused by a final cause. The point is plain from the definitions of each [see pp. 39-40], for the final cause is that for the sake of which the efficient cause produces the effect; therefore it causes only by mediation of the efficient cause. This conclusion can thus be formulated in another way, namely that if something depends on a final cause it also depends on an efficient cause.

21. What is not effected is not mattered or formed, or, if something is caused by a material and formal cause, it is also caused by an efficient cause. For matter and form are parts; therefore they are in themselves indifferently disposed to forming one thing. Therefore something in the order of efficient cause is required to effect this one thing.

22. If something is transient or changeable or temporal, something is effectible or able to be effected. For nothing of this sort has in itself the total reason for its existence; therefore it is from another, namely from an efficient cause; therefore it is something that can be an effect or is effectible.

23. If something is effectible, something can effect. Cause and effect are correlatives¹ so that the possibility of one involves the possibility of the other. ¹ [Correlatives are things that are by definition depedent on each other; if there is one, there must be the other. An example is: if there is a father, there must be, or have been, a son; if there is a son, there must be, or have been, a father.]

24. If some efficient cause can exist, some first efficient and uncausable thing can exist. The proof is as follows: If there is an efficient cause it is either a first efficient cause (that is, not itself effectible) or not. If it is not the first ineffectible efficient cause, there is either: a) a circle of efficient causes such that the circle as a whole is altogether independent of anything outside it, but its individual members are effected by each other, or b) there is an infinite series of efficient causes that are either i) essentially ordered or ii) accidentally ordered.¹ ¹ “Causes are said to be accidentally ordered among themselves if one depends on the other in being, but not in actually causing; hence if the first cause of such a series ceases to exist, the others can still exist and still cause. Thus a father, when grandfather and great-grandfather are dead, can generate a son.” p. 44 But a) is impossible (from conclusion 17) and so is b) i) (from conclusion 16). But b) ii) would also be impossible unless there existed something outside the series on which the whole series depends. The proof is twofold: First, that from the fact that the individual members are dependent, the series consists, as a totality, of dependent things, and so the series as a whole is dependent and thus requires some cause outside itself. Second, from the fact that if the individual causes are not simultaneously existent, [then] they begin to be and cease to be; therefore they are transient. But if something is transient, there is also something absolutely permanent and independent both as to its existence and as to its permanence (from conclusion 3). Such a being, to the extent it keeps the series in being, is also an efficient cause, otherwise it would not be altogether independent as to its permanence in being. For if it were merely a material or formal cause, it would depend on some other efficient cause so that it be formally a cause (from conclusions 18 and 21). If it were merely a final cause, it would also require an efficient cause in order to exercise its final causality (from conclusion 20). There is a confirmation from the fact that to persist in being is formally an effect, at least in its beginning. Therefore if it is an efficient cause, it is in every case the first ineffectible efficient cause. That this first efficient cause is simply uncausable is plain from conclusions 20 and 21.

25. What is ineffectible cannot be caused by a final or material or formal cause; therefore it is simply uncausable.

26. If an ineffectible being can exist, it must exist; for if it did not actually exist, it could not receive existence from a cause. So it could not in fact exist but would be simply impossible.

27. A first uncausable efficient cause actually exists. The point is plain from the fact that there is something transient, changeable and temporal (from conclusions 8, 14, 15); therefore there is an uncausable first efficient cause (from conclusions 24 to 26). It follows next that there exists at least one efficient cause. Hence if something can be transient, changeable, etc. some ineffectible efficient cause must exist as the condition sine qua non [without which: nothing] of the possibility of something else.”

es+the+effect%3B+therefore+it+causes+only+by+mediation+of+the+efficient+cause.+This+conclusion+can+thus+be+formulated+in+another+way%2C+namely+that+if+something+depends+on+a+final+cause+it+also+depends+on+an+efficient+cause.+21.+What+is+not+effected+is+not+mattered+or+formed%2C+or%2C+if+something+is+caused+by+a+material+and+formal+cause%2C+it+is+also+caused+by+an+efficient+cause.+For+matter+and+form+are+parts%3B+therefore+they+are+in+themselves+indifferently+disposed+to+forming+one+thing.+Therefore+something+in+the+order+of+efficient+cause+is+required+to+effect+this+one+thing.+22.+If+something+is+transient+or+changeable+or+temporal%2C+something+is+effectible+or+able+to+be+effected.+For+nothing+of+this+sort+has+in+itself+the+total+reason+for+its+existence%3B+therefore+it+is+from+another%2C+namely+from+an+efficient+cause%3B+therefore+it+is+something+that+can+be+an+effect+or+is+effectible.+23.+If+something+is+effectible%2C+something+can+effect.+Cause+and+effect+are+correlatives%C2%B9+so+that+the+possibility+of+one+involves+the+possibility+of+the+other.+%C2%B9+%5BCorrelatives+are+things+that+are+by+definition+depedent+on+each+other%3B+if+there+is+one%2C+there+must+be+the+other.+An+example+is%3A+if+there+is+a+father%2C+there+must+be%2C+or+have+been%2C+a+son%3B+if+there+is+a+son%2C+there+must+be%2C+or+have+been%2C+a+father.%5D+24.+If+some+efficient+cause+can+exist%2C+some+first+efficient+and+uncausable+thing+can+exist.+The+proof+is+as+follows%3A+If+there+is+an+efficient+cause+it+is+either+a+first+efficient+cause+%28that+is%2C+not+itself+effectible%29+or+not.+If+it+is+not+the+first+ineffectible+efficient+cause%2C+there+is+either%3A+a%29+a+circle+of+efficient+causes+such+that+the+circle+as+a+whole+is+altogether+independent+of+anything+outside+it%2C+but+its+individual+members+are+effected+by+each+other%2C+or+b%29+there+is+an+infinite+series+of+efficient+causes+that+are+either+i%29+essentially+ordered+or+ii%29+accidentally+ordered.%C2%B9+%C2%B9+%E2%80%9CCauses+are+said+to+be+accidentally+ordered+among+themselves+if+one+depends+on+the+other+in+being%2C+but+not+in+actually+causing%3B+hence+if+the+first+cause+of+such+a+series+ceases+to+exist%2C+the+others+can+still+exist+and+still+cause.+Thus+a+father%2C+when+grandfather+and+great-grandfather+are+dead%2C+can+generate+a+son.%E2%80%9D+p.+44+But+a%29+is+impossible+%28from+conclusion+17%29+and+so+is+b%29+i%29+%28from+conclusion+16%29.+But+b%29+ii%29+would+also+be+impossible+unless+there+existed+something+outside+the+series+on+which+the+whole+series+depends.+The+proof+is+twofold%3A+First%2C+that+from+the+fact+that+the+individual+members+are+dependent%2C+the+series+consists%2C+as+a+totality%2C+of+dependent+things%2C+and+so+the+series+as+a+whole+is+dependent+and+thus+requires+some+cause+outside+itself.+Second%2C+from+the+fact+that+if+the+individual+causes+are+not+simultaneously+existent%2C+%5Bthen%5D+they+begin+to+be+and+cease+to+be%3B+therefore+they+are+transient.+But+if+something+is+transient%2C+there+is+also+something+absolutely+permanent+and+independent+both+as+to+its+existence+and+as+to+its+permanence+%28from+conclusion+3%29.+Such+a+being%2C+to+the+extent+it+keeps+the+series+in+being%2C+is+also+an+efficient+cause%2C+otherwise+it+would+not+be+altogether+independent+as+to+its+permanence+in+being.+For+if+it+were+merely+a+material+or+formal+cause%2C+it+would+depend+on+some+other+efficient+cause+so+that+it+be+formally+a+cause+%28from+conclusions+18+and+21%29.+If+it+were+merely+a+final+cause%2C+it+would+also+require+an+efficient+cause+in+order+to+exercise+its+final+causality+%28from+conclusion+20%29.+There+is+a+confirmation+from+the+fact+that+to+persist+in+being+is+formally+an+effect%2C+at+least+in+its+beginning.+Therefore+if+it+is+an+efficient+cause%2C+it+is+in+every+case+the+first+ineffectible+efficient+cause.+That+this+first+efficient+cause+is+simply+uncausable+is+plain+from+conclusions+20+and+21.+25.+What+is+ineffectible+cannot+be+caused+by+a+final+or+material+or+formal+cause%3B+therefore+it+is+simply+uncausable.+26.+If+an+ineffectible+being+can+exist%2C+it+must+exist%3B+for+if+it+did+not+actually+exist%2C+it+could+not+receive+existence+from+a+cause.+So+it+could+not+in+fact+exist+but+would+be+simply+impossible.+27.+A+first+uncausable+efficient+cause+actually+exists.+The+point+is+plain+from+the+fact+that+there+is+something+transient%2C+changeable+and+temporal+%28from+conclusions+8%2C+14%2C+15%29%3B+therefore+there+is+an+uncausable+first+efficient+cause+%28from+conclusions+24+to+26%29.+It+follows+next+that+there+exists+at+least+one+efficient+cause.+Hence+if+something+can+be+transient%2C+changeable%2C+etc.+some+ineffectible+efficient+cause+must+exist+as+the+condition+sine+qua+non+%5Bwithout+which%3A+nothing%5D+of+the+possibility+of+something+else.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52a28e625b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52a28e625b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=Transient%20to%20a%20First%20Uncausable%20Efficient,of%20the%20possibility%20of%20something%20else&amp;text=Transient%20to%20a%20First%20Uncausable%20Efficient%20Cause%20%5Bsee&amp;text=which%3A%20nothing%5D%20of%20the%20possibility%20of%20something%20else" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-be8b63b848" data-kw="">
<blockquote><p>Asking whether you should listen to God or to reason is like asking whether you should listen to Beethoven’s Fifth Symphony or to the recording you have of it. It’s like asking whether the earth is lit up by the sun or by sunlight. It’s like asking whether you should obey your commanding officer or his commands. The natural law of reason is a participation in the eternal law of God ([Thomas, Summa] I-I,91,2).</p></blockquote>

</figure><figure class="quote" id="q-d82d41e871" data-kw="">
<blockquote><p>Wisdom is an architectonic system commanding and directing all others. Now this is most peculiar to theology, which is so far the arbiter and mistress of all sciences that it judges of them and cannot itself by judged by another. For all other systems must be referred to it as a standard, and whatever does not agree with theology must be rejected from them. So although it does not prescribe to other systems principles and objects, yet it so far rules over them (because it establishes their limits) that they neither dare hold to any object opposed to theology, nor to use their principles against it. And also with respect to the ultimate end (viz., the glory of God) which although they do not immediately attain, yet they are bound to have such a direction. […]

If theology takes some things from other systems, it is not as an inferior from superiors, but as a superior from inferiors (as a mistress freely using her handmaids). Theology does not so much take from others, as presupposes certain previously known things upon which it builds revelation.</p></blockquote>

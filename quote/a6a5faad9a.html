<blockquote><p>to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.</p></blockquote>

<blockquote><p>There is therefore a twofold justification. One whereby, in ourselves being sinners, we are justified before God, from without us: The other whereby being now justified before God from without us, we are justified before Him within ourselves. The first of these is the cause of the second. The second is the effect and demonstration of the first. The first is done by faith, the other by works. Both must concur that the righteousness of the Law may be fulfilled in us… Let us speak fullier of the second sort of justification. It is that whereby God, by regeneration given us, and the works of sincere faith which we performed, absolves us from the charge of hypocrisy, profaness and impiety, and no longer takes us for men dead in sin, servants of the Devil and children of the world, but for true believers, his sons restored to his image, endued with his life and translated into his Kingdom: which judgment of God, the Law also approves. Not that it [the Law] takes it self-satisfied by our works, but because being bereaved of its dominion and subjected to Christ our Lord, it cannot choose but [to] commend the works which come from faith in Christ and from his Spirit, and account them for true righteousness, though they are imperfect; and them that perform them, for truly righteous and sons pleasing to God. Let it be here enquired, seeing Scripture does often and expressly ascribe to us both these righteousnesses we speak of, and therefore we are in respect of them both to be judged righteous, not only with men, but with God, whether in the same sense as we are said to be justified by works, Jam. 2, and to be justified by words, Mt. 12, works may not be said to be imputed to us for righteousness? Not indeed as faith is imputed to righteousness: but as the fact of Phineas is said to be imputed to him for righteousness, Ps. 106:31.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, sect. 3, pp. 342-52 in Richard Baxter’s Confession of his Faith… (London: 1655) The page numbering is misnumbered. The whole of sect. 3 has more on this topic, as Baxter quotes 80 authors in support of his views on the necessity of works for believers in salvation.</cite>, pp. 344-47</span></figcaption>

</figure><figure class="quote" id="q-4c49dd8aef" data-kw="">
<blockquote><p>A fifth argument is that which so much sounds in all books: If good works be the effect and fruit of our justification, then they cannot be conditions, or causa sine qua non [a cause without which: nothing] of our justification. The consequence is clear, because such a supposed condition, or causa sine qua non, must be antecedent, and going before. Now the Orthodox bring Augustine’s known position, which also may be made good out of Scripture, Bona opera non praecedunt justificandum, sed sequuntur justificatum [‘Good works do not precede being justified, but follow having been justified’]; and another to that sense is quoted out of Gregory: Non per opera venitur ad fidem, sed per fidem ad opera [‘not through works is one come to faith, but through faith to works’], faith must go before works. Till we are justified, we are not able to do anything that is good… Seeing therefore that justification is antecedent to a holy life, good works cannot be any condition of it; and by this we may see that more things are required to our salvation than to our justification; to the possession of heaven and [versus] the entitling us thereunto. For justification does entitle and interest us in that eternal inheritance which is performed by faith; but to be made actual partakers of everlasting happiness, good works are the way to that Kingdom, not the cause of it. Therefore none contend more then the Orthodox writers for the necessity of good works, and that in respect of salvation; yet in respect of our justification, then the Scripture calls them a menstruous rag and such as are utterly unworthy. It’s true that justification cannot be continued in a man unless he continue in good works, yet for all that they are not conditions of his justification: they are qualifications and determinations of the subject who is justified, but no conditions of his justification. As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God. Its a thousand times affirmed by our divines, many things are required to the constitution of some subject, which yet are not either causes or conditions of such and such an effect: Light is necessarily required and dryness as qualities in fire, yet it burns as it’s hot, not as light or dry. To the integral being of a man are required his head and shoulders, so that the eye could not see if not seated there; yet a man’s shoulders are not the causa sine qua non of his seeing. Many things are necessarily conjoined together, and yet one is not the condition of the others’ effect. So that this doctrine does not exclude, but [does] command holy works, only it gives faith and works their proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated… (London, 1654) | sermon 24</cite>, p. 229-31</span></figcaption>

<blockquote><p>smothered and overlaid as it were, for a time… but these acts do not properly and of themselves preserve the life of grace by securing the effect itself of preservation; but indirectly and incidentally by excluding and removing the cause of destruction.</p></blockquote>

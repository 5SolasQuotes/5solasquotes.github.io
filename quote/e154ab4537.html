<main class="wrap"><figure class="quote" id="q-e154ab4537" data-kw="">
<blockquote><p>Now Papists confirm many of their superstitions by the English ceremonies… It will be said that Papists have no ground nor reason to confirm any of their superstitions by the English ceremonies. But I answer: 1. If it were so, yet forasmuch as Papists draw them to a confirmation of their superstitions, we should abstain from them as appearances of evil. Eating (at a private banquet) of that which was sacrificed to idols, did confirm an idolater and infidel in his religion, as Pareus notes (Commentary on 1 Cor. 10:28): yet from this the idolater had no reason to confirm himself in his idolatry; but because the idolater seeing it, might draw it to a confirmation, the apostle will have it for that respect foreborn. When the Arians abused trine [three-fold] immersion in baptism to signify three natures of the three persons, Pope Gregory and the Fourth Council of Toledo ordained that in Spain, thrice washing should no longer be used in baptism, but once only. The Arians had no just reason to draw such a signification from the ceremony of trine-immersion: yet was it abolished when those heretics did so abuse it. If any say that we are saved by the blood of the son of man, the phrase is orthodox, because of the communication or rather communion of properties, and the Nestorians cannot with good reason by it confirm their heresy, yet are we to abstain from this form of speech, in Zanchius his judgment, when it is drawn to the confirmation of that error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 36-7</span></figcaption>

</figure><figure class="quote" id="q-96301fde29" data-kw="">
<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 54-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

<blockquote><p>[T]hough by nature ye are sinful, and evil, and tainted with Corruption, yet there are some impressions of equity, some principles of common honesty still preserved; not only those that are comparatively, but those that are totally evil; those that are unsanctified, have some rules of honesty engraven upon them, some impressions of the image of God, that image not wholly defaced, concerning truths and rules of morality, which nature hath still preserved. Nature it self starts back at some abominations in an unregenerate man, the Conscience of an unregenerate man, checks it self at some horrible impiety. In a spiritual sense, all moral virtues are but vices; as St. Jerome saith, all sacred truths are not to be known, but by revelation, natural endowments are beneficial, as one benefit of the remainder of nature is, that they which cross not the rules of morality live more innocent; For, were it not that those principles bare sway in most men’s lives, common honesty and justice could not be maintained.

Secondly, by nature we can never attain to grace, and so by those virtues we cannot prevail with God for Salvation; Yet they may for a temporal reward, as in the Romans, God rewarded moral virtue with victory and prosperity.

The third benefit it gets, they that observe the rules of nature, their accompt at the last day shall be far more easy; indeed, the Heathen shall be all turned into Hell, but the Damnation shall be more easy; Socrates less punished than Cato.

Lastly, a man that lives according to the rules of nature, keeps within the compass of these principles; though not able to reach at Salvation, yet their Conversion is more easy; it’s more possible to gain him to grace, this stock of nature is fit to graft grace and religion on more kindly; yet at the best it cannot fructify, and bring forth fruit to eternal life, but grace being graffed, it will fructify to Salvation. A man within the sphere of morality, that lives peaceable, sober, just, and of an humble mind; there is more hope of salvation in that man, he is not so far from the Kingdom of God, as those that sin against nature; evil and wicked men have some principles of knowledge; ye are evil, and yet ye know some good things.</p></blockquote>

<blockquote><p>The image of God which we have spoken about neither completely perished through sin, nor completely survived from sin. Therefore it remains in some measure (Gen. 9:6; James 3:9; 1 Cor. 11:7, where without doubt the topic is not the past state, but the current one). It remains, I say, to the extent that it consists: (1) in the very nature of man, of the body and soul. (2) In the natural faculties of the soul, in the intellect and will. (3) In certain gifts of the intellect and will, insofar as among the worst is still seen some use of reason, and also some propensity to good, even moral good (Rom. 1:19; 2:15; 1 Cor. 5:1). Furthermore, (4) in at least some remnants of original dominion (Gen. 7:2). God willed all these bits of his own image to survive in us from the fall, first so that they may be witnesses of his own most undeserved goodness toward us…</p></blockquote>

<blockquote><p>§XXVII. With respect to Duration, the human soul is immortal, which Christian Religion teaches against the Sadducees, Epicureans, and Atheists, who think that souls are extinguished with their bodies. This is contradicted by: 1. Scripture, Eccl. 12:7, “The dust returns to its earth from whence it was, and the Spirit returns to God who gave it.” Mt. 10:28, “Fear not them which kill the body, but are not able to kill the soul: but rather fear him, which is able to destroy both soul and body in Hell.” Mt. 22:32, “I am the God of Abraham, and the God of Isaac, and the God of Jacob: God is not the God of the dead, but of the living.” Lk. 16:23, “The rich man in torments saw Abraham afar off, and Lazarus in his bosom,” etc. Lk. 23:43, Christ to the converted thief: “Today you will be with me in Paradise.” v. 46, Christ, expiring, cried out: “Father, into your hands I commend my Spirit.” 2 Cor. 5:8, Paul says: “We are willing rather to be absent from the body, and to be present with the Lord.” Phil. 1:23, “I have a desire to depart, and to be with Christ.” 1 Pet. 3:19, “By which also he went and preached unto the spirits in prison,” etc. add Ps. 49:15, “God will redeem my soul from the power of the grave: for He shall receive me.” 2 Sam. 12:23, “But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.” 1 Kn. 17:21, “O Lord my God, I pray thee, let this child’s soul come into him again.</p></blockquote>

<blockquote><p>Argument 8— He who, by office, is obliged to expend himself, and to give his life for the safety of the people, must be inferior to the people. So Christ says, the life is more than raiment or food, because both these give themselves to corruption for man’s life; so the beasts are inferior to man, because they die for our life, that they may sustain our life. And Caiaphas prophesied right, that it was better that one man die than the whole nation perish (John 11:50); and in nature, elements, against their particular inclination, defraud themselves of their private and particular ends, that the commonwealth of nature may stand; as heavy elements ascend, light descend, lest nature should perish by a vacuity. And the good Shepherd (John 10) gives his life for his sheep; so both Saul and David were made kings to fight the Lord’s battles, and to expose their lives to hazard for the safety of the church and people of God. But the king, by office, is obliged to expend his life for the safety of the people of God; he is obliged to fight the Lord’s battles for them; to go betwixt the flock and death, as Paul was willing to be spent for the church. It may be objected, Jesus Christ gave Himself a ransom for his church, and his life for the life of the world, and was a gift given to the world (John 3:16; 4:10) and He was a mean to save us; and so, what arguments we have before produced to prove that the king must be inferior to the people, because he is a ransom, a mean, a gift, are not conclusive, I answer:

1. Consider a mean reduplicatively, and formaliter, [formally] as a mean; and secondly, as a mean materially, that is, the thing which is a mean.

2. Consider that which is only a mean and ransom, and gift, and no more; and that which, beside that it is a mean, is of a higher nature also. So Christ formally as a mean, giving his temporal life for a time, according to the flesh, for the eternal life of all the catholic Church, to be glorified eternally—(not his blessed Godhead and glory, which, as God, He had with the Father from eternity)— in that respect Christ has the relation of a servant, ransom, gift, and some inferiority in comparison of the Church of God; and his Father’s glory, as a mean, is inferior to the end; but Christ materially, in concreto [in particular, materially]: Christ is not only a mean to save his Church, but, as God (in which consideration He was the immortal Lord of life) He was more than a mean— even the Author, Efficient and Creator of heaven and earth; and so there is no ground to say that He is inferior to the Church, but the absolute head, king— the chief of ten thousand— more in excellency and worth than ten thousand millions of possible worlds of men and angels. But such a consideration cannot befall any mortal king; because, consider the king materially as a mortal man, he must be inferior to the whole church, for he is but one, and so of less worth than the whole church; as the thumb, though the strongest of the fingers, yet it is inferior to the hand, and far more to the whole body, as any part is inferior to the whole. Consider the king reduplicative and formally as king, and by the official relation he has, he is no more than but a royal servant, an official mean tending, ex officio [from his office], to this end, to preserve the people, to ride and govern them; and a gift of God, given by virtue of his office, to rule the people of God, and so any way inferior to the people.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Argument 8— He who, by office, is obliged to expend himself, and to give his life for the safety of the people, must be inferior to the people. So Christ says, the life is more than raiment or food, because both these give themselves to corruption for man’s life; so the beasts are inferior to man, because they die for our life, that they may sustain our life. And Caiaphas prophesied right, that it was better that one man die than the whole nation perish (John 11:50); and in nature, elements, against their particular inclination, defraud themselves of their private and particular ends, that the commonwealth of nature may stand; as heavy elements ascend, light descend, lest nature should perish by a vacuity. And the good Shepherd (John 10) gives his life for his sheep; so both Saul and David were made kings to fight the Lord’s battles, and to expose their lives to hazard for the safety of the church and people of God. But the king, by office, is obliged to expend his life for the safety of the people of God; he is obliged to fight the Lord’s battles for them; to go betwixt the flock and death, as Paul was willing to be spent for the church. It may be objected, Jesus Christ gave Himself a ransom for his church, and his life for the life of the world, and was a gift given to the world (John 3:16; 4:10) and He was a mean to save us; and so, what arguments we have before produced to prove that the king must be inferior to the people, because he is a ransom, a mean, a gift, are not conclusive, I answer:

nsom%2C+and+gift%2C+and+no+more%3B+and+that+which%2C+beside+that+it+is+a+mean%2C+is+of+a+higher+nature+also.+So+Christ+formally+as+a+mean%2C+giving+his+temporal+life+for+a+time%2C+according+to+the+flesh%2C+for+the+eternal+life+of+all+the+catholic+Church%2C+to+be+glorified+eternally%E2%80%94%28not+his+blessed+Godhead+and+glory%2C+which%2C+as+God%2C+He+had+with+the+Father+from+eternity%29%E2%80%94+in+that+respect+Christ+has+the+relation+of+a+servant%2C+ransom%2C+gift%2C+and+some+inferiority+in+comparison+of+the+Church+of+God%3B+and+his+Father%E2%80%99s+glory%2C+as+a+mean%2C+is+inferior+to+the+end%3B+but+Christ+materially%2C+in+concreto+%5Bin+particular%2C+materially%5D%3A+Christ+is+not+only+a+mean+to+save+his+Church%2C+but%2C+as+God+%28in+which+consideration+He+was+the+immortal+Lord+of+life%29+He+was+more+than+a+mean%E2%80%94+even+the+Author%2C+Efficient+and+Creator+of+heaven+and+earth%3B+and+so+there+is+no+ground+to+say+that+He+is+inferior+to+the+Church%2C+but+the+absolute+head%2C+king%E2%80%94+the+chief+of+ten+thousand%E2%80%94+more+in+excellency+and+worth+than+ten+thousand+millions+of+possible+worlds+of+men+and+angels.+But+such+a+consideration+cannot+befall+any+mortal+king%3B+because%2C+consider+the+king+materially+as+a+mortal+man%2C+he+must+be+inferior+to+the+whole+church%2C+for+he+is+but+one%2C+and+so+of+less+worth+than+the+whole+church%3B+as+the+thumb%2C+though+the+strongest+of+the+fingers%2C+yet+it+is+inferior+to+the+hand%2C+and+far+more+to+the+whole+body%2C+as+any+part+is+inferior+to+the+whole.+Consider+the+king+reduplicative+and+formally+as+king%2C+and+by+the+official+relation+he+has%2C+he+is+no+more+than+but+a+royal+servant%2C+an+official+mean+tending%2C+ex+officio+%5Bfrom+his+office%5D%2C+to+this+end%2C+to+preserve+the+people%2C+to+ride+and+govern+them%3B+and+a+gift+of+God%2C+given+by+virtue+of+his+office%2C+to+rule+the+people+of+God%2C+and+so+any+way+inferior+to+the+people.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+...+%281644%3B+Edinburgh%3A <blockquote><p>But when I say that God can without respect of sin, inflict any torment upon his creature, this is delivered of power absolute. This power the Lord did execute upon his own Son: for what was his sin? Was He not the spotless lamb of God? Yet what agonies did He suffer in the garden, what torments and terrors upon the cross, when He cried out ‘My God, my God, Why hast thou forsaken Me?’ But the like power He does not execute on us, only He gives us authority to exercise the like power over other creatures: If the powder of an hare [rabbit] burnt alive in an oven, be found to be wholesome for us, He gives us leave thus to deal with him, and the like: yet have not these creatures sinned either against God, or against us. Of this absolute power of God I have discoursed more sparingly in the place cited by him, bk. 1, pt. 2, De Electione, digression 3.</p></blockquote>

<blockquote><p>3rd… no person who maintains error in their judgment… [is to] be admitted… … 12th, that he be required to bind himself to secrecy to divulge nothing of the matters reasoned or concluded in the Society but in so far as the Society does allow to be done with general consent… and if satisfaction be given in all these, then may be presented unto him the articles of the Society and he be required to assent thereunto…</p></blockquote>

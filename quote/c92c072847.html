<blockquote><p>You produce all things from a supernal example, i.e., from a perpetual exemplar: You Yourself most beautiful, elongated from all deformity, bearing in mind, i.e., in full memory, a beautiful world, namely, the archetype, forming it; and producing the sensible world itself in a similar image, as it was present in your mind.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef7d39e09" data-kw="">
<blockquote><p>Are there ideas? It is affirmed. Whether by necessity there are posited ideas in God? It is affirmed. Whether they are in God, or rather outside God? The prior is affirmed. Whether they are things themselves produced by God, so far by the divine intellect, is objected, that is, whether they have the rule of an object, in which, as it were, they are things known in the imagination by a creature? It is denied. Whether they are the effective causes of things, and indeed are first things and principles simply in their genus? It is affirmed. Whether every knowing or cognition of God indicates an idea? It is denied. Whether ideas are rightly divided into speculative and practical? It is denied. Whether ideas pertain to the speculative or rather to practical knowledge? The latter is affirmed. Whether the distinction of ideas into act and potential rightly explained is possible? It is affirmed. Whether all ideas in God are one and really the same with God? It is affirmed. Whether they are really the same amongst themselves or are really and intrinsically one idea? Affirm with a distinction. Whether ideas in God and in themselves are able and ought to be understood or investigated by us? It is denied. Whether ideas which are in the divine mind, through the first thing respect, so far, the singular nature, or the nature of the species? The latter is affirmed. Whether ideas are all which are known by God? It is denied. Whether evil may maintain an idea in God? It is denied with a distinction. [The reason is because evil is not a thing, or the form, species or genus of a thing, but a deficiency therefrom.] Whether impossibilities have ideas in God? It is denied. Whether prime matter [matter without form] has an idea in God? It is affirmed. Whether in God may be the idea of things which neither are, nor were, nor will be? It is affirmed. Whether accidents have an idea in God? It is distinguished. Whether singulars have an idea in God? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix: ‘Of Ideas in God’ in Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 1, tract 2, I. ‘Of God’, 2nd Kind, (1) Intellect or Knowledge [Scientia] of God Abbr.</span></figcaption>

</figure><figure class="quote" id="q-50619c436b" data-kw="">

</figure><figure class="quote" id="q-0afca7c940" data-kw="">
<blockquote><p>The doctrine of middle knowledge, however, represents contingent future events as contingent and free also in relation to God. This is with reference not only to God’s predestination but also his foreknowledge, for just as in Origen, things do not happen because God knows them, but God foreknows them because they are going to happen. Hence, the sequence is not necessary knowledge, the knowledge of vision, the decree to create (etc.); instead, it is necessary knowledge, middle knowledge, decree to create (etc.), and the knowledge of vision. God does not derive his knowledge of the free actions of human beings from his own being, his own decrees, but from the will of creatures. God, accordingly, becomes dependent on the world, derives knowledge from the world that he did not have and could not obtain from himself, and hence, in his knowledge, ceases to be one, simple, and independent – that is, God. Conversely, the creature in large part becomes independent vis-a-vis God. It did indeed at one time receive “being” (esse) and “being able” (posse) from God but now it has the “volition” (velle) completely in its own hand. It sovereignly makes it own decisions and either accomplishes something or does not accomplish something apart from any preceding divine decree. Something can therefore come into being quite apart from God’s will. The creature is now creator, autonomous, sovereign; the entire history of the world is taken out of God’s controlling hands and placed into human hands. First, humans decide; then God responds with a plan that corresponds to that decision.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

a=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0afca7c940.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/middle-knowledge/#:~:text=The%20doctrine%20of%20middle%20knowledge%2C%20however,plan%20that%20corresponds%20to%20that%20decision&amp;text=The%20doctrine%20of%20middle%20knowledge%2C%20however%2C%20represents%20contingent&amp;text=with%20a%20plan%20that%20corresponds%20to%20that%20decision" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom">
<blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.”

— Jeremiah Burroughs, The Rare Jewel of Christian Contentment, ch. 3, Lesson 9 (variety and order of providence)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+indeed%2C+look+at+things+by+pieces%2C+we+look+at+one+detail+and+do+not+consider+the+relation+that+one+thing+has+to+another%2C+but+God+looks+at+all+things+at+once%2C+and+sees+the+relation+that+one+thing+has+to+another.+When+a+child+looks+at+a+clock%2C+it+looks+first+at+one+wheel%2C+and+then+at+another+wheel%3A+he+does+not+look+at+them+all+together+or+the+dependence+that+one+has+upon+another%3B+but+the+workman+has+his+eyes+on+them+all+together+and+sees+the+dependence+of+all%2C+one+upon+another%3A+so+it+is+in+God%27s+providence.+Now+notice+how+this+works+to+contentment%3A+when+a+certain+passage+of+providence+befalls+me%2C+that+is+one+wheel%2C+and+it+may+be+that+if+this+wheel+were+stopped%2C+a+thousand+other+things+might+come+to+be+stopped+by+this.+In+a+clock%2C+stop+but+one+wheel+and+you+stop+every+wheel%2C+because+they+are+dependant+upon+one+another.+So+when+God+has+ordered+a+thing+for+the+present+to+be+thus+and+thus%2C+how+do+you+know+how+many+things+depend+upon+this+thing%3F+God+may+have+some+work+to+do+twenty+years+hence+that+depends+on+this+passage+of+providence+that+falls+out+this+day+or+this+week.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+The+Rare+Jewel+of+Christian+Contentment%2C+ch.+3%2C+Lesson+9+%28variety+and+order+of+providence%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2494a6812.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2494a6812.html">Permalink</a><a class="src" href="https://archive.org/details/rarejewelchrist00burrgoog" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>

<main class="wrap"><figure class="quote" id="q-cd39974bed" data-kw="">
<blockquote><p>1. We must distinguish a twofold power of the keys (Trelcatius, Instittutes of Theology, bk. 2, p. 287-88; Pareus on 1 Cor. 5, Of Excommunication): the one is execute in doctrine: the other in discipline: the one concionalis [of preaching]: the other judicialis [of judgment]. Touching the former, we grant it is proper for pastors alone, whose office and vocation it is, by the preaching and publishing of God’s Word, to shut the Kingdom of Heaven against impenitent and disobedient men, and to open it unto penitent sinners, to bind God’s heavy wrath upon the former, and (by application of the promises of mercy) to loose the latter from the sentence and fear of condemnation. When we ascribe the power of binding and loosing to that whole consistory, wherein governing elders are joined together with pastors, we mean only of the Keys of external discipline, which are used in ecclesiastical courts and judicatories.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 8, Digression 4, pp. 188-89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-077f9ce523" data-kw="">

</figure><figure class="quote" id="q-dfd68668bf" data-kw="">
<blockquote><p>That to the worthy we may witness freely any truth. To the unworthy, which seek extremity of law against us, we will witness that truth which the law will afford us, and urge it no further, but to stop their own mouths and to leave them without excuse. Yea and no preacher has furhter message to such, when they thoroughly know them to be such, and when they know that the further truth may better be taught in another place and to more meet persons.</p></blockquote>

</figure><figure class="quote" id="q-c9bf4ea8ae" data-kw="">
<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London, 1644) | pt. 2, p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<main class="wrap"><figure class="quote" id="q-aabf01b0f3" data-kw="">
<blockquote><p>Assertion Two. Yet in other things there ought to be great respect had to offense, and men ought to be swayed accordingly in their practice, as the former reasons clear. As (1), if the matter is of light concernment in itself, as how men’s gestures are in their walking (suppose in walking softly, or quickly, with cloak or without) men ought to do, or abstain, as may prevent the construction of pride, lightness, etc., or give occasion to others in any of these. Of such sort was womens’ praying with their heads uncovered amongst the Corinthians, it being then taken for an evil sign. Yet if it is necessary, there is nothing little, as Moses will not leave a hoof (Ex. 10)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament of the Church of Scotland or, A Treatise concerning Scandal (Edinburgh, 1659), pt. 1</cite>, ch. 6, pp. 25-26</span></figcaption>

</figure><figure class="quote" id="q-b472dcc2f0" data-kw="">
<blockquote><p>VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Agreement of the Associated Pastors</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-41222c9eb2" data-kw="">
<blockquote><p>XII. There was no need that a particular precept concerning the baptism of infants should be given because it was known to the disciples that infants were circumcised. It therefore sufficed that there was a general command to baptize all nations, under which the particular is contained.

XIII. The baptism of Christ (performed when he was in his thirtieth year) cannot overthrow infant baptism. All the acts of Christ (which do not pertain to doctrine) are not forthwith to be imitated; otherwise baptism would have to be received only in the thirtieth year (which however our opponents do not say). There was a peculiar reason for his waiting until that time; not only because only in the preceding year was the baptism of John instituted, but also on account of the type of the Levitical priests (who although received in their twenty-fifth year into the priestly college, before their thirtieth year were not admitted to the exercise of their office). Christ (not needing baptism) could safely put it off. But our case is different, we being conceived and born in sin.

XIV. John admitted no one to baptism unless he confessed his sins because he was dealing with the baptism of adults and those called to the Christian church. But it does not follow that the same should be done with infants who are already in the church.

XV. A sign whose virtue depends on the disposition of the receiving subject differs from one whose virtue depends on the promise of the institutor. The former sign is to no purpose applied to one not understanding it; but it is not so with the latter (such as baptism and circumcision). Again, a subject receptive of the sign differs from one perceptive of it also; infants can be the former, although not the latter. Third, a sign is useless applied to one not understanding, or about to understand (which cannot be said of an infant). XVI. Baptism is called the sacrament of repentance; not because it requires that beforehand in everyone to be baptized, but because it binds the baptized to the desire of it, whether in the present (when they are capable of it) or in the future. XVII. Sacraments without faith in the user are said to be empty ceremonies with regard to adults; not with regard to infants, in whom (for a salutary use of baptism) the promise is sufficient and the grace of the covenant (which is sealed on the part of God), even though as yet there is not an answer and restipulation on the part of the baptized (as is evident in circumcision, Gen. 17:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.12–17 (p. 418–19).</span></figcaption>

<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>

<blockquote><p>In the next session, S259 TU 16.7.44, the divines debated the proposed words “they are Christians &amp; holy” in relation to infants presented for baptism. A lengthy dispute pertained to what Paul had in mind. Are those baptized holy in reality or are they to be considered holy merely in federal terms, by being in a covenantal relationship with God, which may or may not involve the regenerating presence of the Holy Spirit? Thomas Goodwin claimed that the holiness in view is such that if they die they will be saved. He was uncertain whether they have the holiness of election or regeneration, but he thought they have the Holy Ghost. In short, Goodwin thought that those baptized are to be regarded as really holy, rather than simply federally holy. Lazarus Seaman countered by pointing out that this is to make a different ground for baptism. Goodwin replied by denying that infants are actually saved, but affirming that we are to judge them so. This was too much for Stephen Marshall, who said that Goodwin was wrong: our judgment of charity must not determine whom we admit to the sacrament. We have no warrant to judge that they are saved. It is sufficient that the infants of believing parents are federally holy. Rutherford agreed, pointing out that real and federal holiness are different. The Lord has election and reprobation among infants; if they are in a state of salvation, how can any be lost? To this barrage of opposition, Goodwin insisted that the question is not about the reality (whether or not the infant is regenerate) but “how I am to judge of them. I cannot judge that all are holy &amp; saved, I judge so of this child &amp; that child.” Marshall pointed to a clear mistake in Goodwin’s interpretation and application: the minister is to judge and believe that they are holy with the holiness Paul speaks of, not with any real holiness. While for Goodwin, the holiness in 1 Corinthians 7:14 is the holiness of salvation, Marshall’s rebuttal was that saving holiness infallibly saves. His underlying assumption was that since not all who are baptized will be saved, Paul cannot be referring to saving holiness. Goodwin did not give up. He agreed that an infallible judgment about an infant’s salvation was impossible, but what Paul had in view was a judgment compatible with the promise—an indefinite faith grounded on an indefinite promise. Vines countered Goodwin by denying that the text had anything to do with the judgment of the minister about the child. It applied to each and every child in relation to the parents from whom they proceed. The holiness must be present in each one who comes into the category described in the text. If the infants were really holy, there would be a passing down of such holiness from the parents, and so they would be born regenerate and really holy. Moreover, whatever the kind of holiness intended in the text, it is altogether different from the judgment of the minister. Walker then underlined the distinction between federal and real holiness—many are called holy who are yet wicked and profane. Seaman pointed out that “federall holnesse is the true ground of administration of sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly: Reading Its Theology in Historical Context’ in</cite>, ed. Carl R. Trueman, The Westminster Assembly and the Reformed Faith (Phillipsburg, NJ: P&amp;R Publishing, 2009), pp. 329–331</span></figcaption>

0dissolving%20the%20bond%20of%20marriage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We teach not that baptism constitutes the Church simply, as the Church, but that it is a seal of a visible membership; and all baptized by John Baptist and the disciples of Christ were thereby entered in a visible profession that they believed in Christ already come, and so were made members and citizens by that public symbol and seal that they were members of the Christian Church, though as yet it received not that name of a Christian Church, and they were members both of the Jewish and Christian Church: For these are not contrary incorporations, and they needed not to be baptized again when they were added to the Christian Church, for they were never added to the visible Christian Church, nor needed they to be added, seeing they were members of that Church before.</p></blockquote>

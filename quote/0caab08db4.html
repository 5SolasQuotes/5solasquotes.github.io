<main class="wrap"><figure class="quote" id="q-0caab08db4" data-kw="">
<blockquote><p>The transgression of that Law of the fourth commandment, and the profanation of the Sabbath, is, 1. Aggravated by special circumstances, and reckoned amongst the greatest abominations, Ezek. 20 &amp; 22.

2. Threatened, with severest vengeance both personally with death, Exo. 31:14 and nationally with fearful judgments, as fire in their habitations, Jer. 17:27 and desolation to their country, Levit. 26:34 &amp; 43.

3. And punished accordingly with death, Numb. 15 and desolation of their Nation, 2 Chron. 36:21 and so acknowledged as the cause thereof, Nehem. 13:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey-and-herbert-palmer.html">Daniel Cawdrey and Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbatum Redivium: or the Christian Sabbath vindicated</cite>, (London, 1645), The epistle to the reader.</span></figcaption>

<blockquote><p>It was this practical consistency of James Renwick and the few other faithful witnesses associated with him, that was blessed by the Head of the church as the means of overturning one of the most cruel governments that ever oppressed a civilized people. Though holding generally the same principles with this noble martyr, the great part of the nation truckled and wavered in their practice, while he continued steadfast and consistent, maintaining a testimony as well by his practice as by the principles which he held, till the power of the persecutor was broken, and the throne of the Stuarts tottered on its base!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 324.</span></figcaption>

</figure><figure class="quote" id="q-87b828318b" data-kw="">
<blockquote><p>[T]hey who have become inventors of unholy heresies, profane and apostate and enlarging their unbridled mouth against the Divine glory and uttering things perverted, will be caught as having of their folly slipped into charges not slighter than those of the infatuation of the Greeks or haply into charges even surpassing theirs. For it were better for them not to have known the way of truth than having known it to turn back from the holy commandment given to them: for the true proverb hath come to them, The dog returned to his own vomit, and, The washed sow to the wallowing in the mire.

For they parted amongst themselves the charges of blasphemy against Christ and like fierce and bitter wolves they waste the flocks for which Christ died, and despoil what is His, multiplying to themselves that which is not theirs, as it is written, and weighting their yoke heavily, of whom may be said with much reason, They went out from us but they were not of us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-cyril-of-alexandria.html">Cyril of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Christ is One by way of Dispute with Hermias</cite>, (c. 431), trans. P. E. Pusey in A Library of Fathers of the Holy Catholic Church, Anterior to the Division of the East and West, Translated by Members of the English Church. Volume 47 (Oxford: James Parker, 1881), p. 238.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

tics-are-worse-than-pagans/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-e5ece47dd5" data-kw="">
<blockquote><p>Thirdly, it is objected that the humanity of Christ and the picture of Christ crucified may be allowed, not for adoration but in sign of love and commemoration. Answer: First, I answer in the words of the apostle, Gal. 3:1, labour that Jesus Christ may be so pictured by the preaching of the Gospel in the mind that thou maist by the eye of faith behold Him as clearly and more effectually than if he were described in thy sight and crucified before thee: For by faith we behold Him which is invisible, Heb. 11:1, 27. Secondly, I say we be bound to discern between the precious body of the Son of God, and the sinfull carcases of mortal men: for that this is a mystery most admirable that God should be manifested in the flesh, 1 Tim. 3:6, that God and man should be so united together that both natures make but one person: so as albeit death parted the natural soul from the natural body, yet that precious body was still the body of that person which was the Son of God, no way subiect to any change or corruption, Acts 2:27. An image will teach us to disjoin in our minds those holy natures which God has so conjoined as man ought not in the thoughts of his heart to separate them, but ever by spiritual wisdom and faith to distinguish them. Thirdly, I say if no man on the earth can at this day give us the true picture of Christ: then is it intolerable audaciousness for any earthly man to counterfeit falsely his holy parts and members. But no man can give us his just stature, or truly discribe his physiognomy: therefore this ought not to be practiced. And if a man cannot bear to be abused and falsely or untruly resembled and conterfeited by picture: shall we think it none offense to the Son of God? Fourthly, we may reason from the writings of the holy Evangelists, who were appointed and sent from God, purposely to describe the Son of God Jesus Christ: for if they with one consent, deny us any help at all, or any one live concerning the external lineaments, and form of his body: then ought not man to presume to picture Christ after his own invention: but we see clearly how the four Evangelists purposely pass over this matter, the holy Ghost foreseeing the superstition of Antichrist, and how the Popish painted Christs should be worshipped to the great dishonour of our everlasting Lord and Savior Jesus Christ. Fifthly, we may reason against this Popish God on this manner: if that picture of Christ, which was allowed and commanded of God Himself, Num. 21:8; Jn. 3:14, being superstitiously abused, must be burnt to ashes, 2. Kings 18:4, then much more these false pictures of Christ never allowed, but disallowed of God, and most impiously adored of vain men, ought to be rejected with a far greater detestation. If any doubt of the Popish idolatry, to their cross their own book and daily practice in their false Church testify against them. The fourth objection: They say the picture of Christ serves well to confute the old heretics, the Marcionites and Valentinians which denied that Christ had a true, natural, human body. Answer: First, if these and the like heretics believe not the words, nor respect the works of Christ: if they will not believe Moses and the prophets testifying of Christ, with his apostles and evangelists, they will not belieue anyone that shall return from the dead, and much less a dead and painted Christ. The godly emperors Valens and Theodosius made a law that none should make any image of our Sauior Christ: and if any were found, it should be utterly defaced and rejected. Again, Epiphanius rent in pieces the picture of Christ on a cloth, anno 565, because, said he, it was contrary to holy Scripture (Epiphanius, Epistle ad Iohan.; epistle Hierosolymit). Eusebius says that some convents of the gentiles carried about in tables the pictures of Peter and Paul and Christ also, because this was a custom (says he) to remember their patrons and benefactors (Eusebius, lib. confes. ch. 36). Their very words are these: ‘As our care is, in and by all means to maintain the religion of the most high God: so permit we none to portrait, engrave, or picture, in colors, stone or any other matter whatsoever, the image of our Savior: moreover we command that wheresoever such an image can be found, it be taken away, and all those to be chastised with most grievous punishment that attempt anything against our command.’ (Petr. Crinitus, bk. 9, de honest. discipl)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-holland.html">Henry Holland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Adam</cite>, (London: Thomas Man, 1606), On the 2nd Commandment, Question 79, pp. 42-43 Holland was a London minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

2C+we+may+reason+from+the+writings+of+the+holy+Evangelists%2C+who+were+appointed+and+sent+from+God%2C+purposely+to+describe+the+Son+of+God+Jesus+Christ%3A+for+if+they+with+one+consent%2C+deny+us+any+help+at+all%2C+or+any+one+live+concerning+the+external+lineaments%2C+and+form+of+his+body%3A+then+ought+not+man+to+presume+to+picture+Christ+after+his+own+invention%3A+but+we+see+clearly+how+the+four+Evangelists+purposely+pass+over+this+matter%2C+the+holy+Ghost+foreseeing+the+superstition+of+Antichrist%2C+and+how+the+Popish+painted+Christs+should+be+worshipped+to+the+great+dishonour+of+our+everlasting+Lord+and+Savior+Jesus+Christ.+Fifthly%2C+we+may+reason+against+this+Popish+God+on+this+manner%3A+if+that+picture+of+Christ%2C+which+was+allowed+and+commanded+of+God+Himself%2C+Num.+21%3A8%3B+Jn.+3%3A14%2C+being+superstitiously+abused%2C+must+be+burnt+to+ashes%2C+2.+Kings+18%3A4%2C+then+much+more+these+false+pictures+of+Christ+never+allowed%2C+but+disallowed+of+God%2C+and+most+impiously+adored+of+vain+men%2C+ought+to+be+rejected+with+a+far+greater+detestation.+If+any+doubt+of+the+Popish+idolatry%2C+to+their+cross+their+own+book+and+daily+practice+in+their+false+Church+testify+against+them.+The+fourth+objection%3A+They+say+the+picture+of+Christ+serves+well+to+confute+the+old+heretics%2C+the+Marcionites+and+Valentinians+which+denied+that+Christ+had+a+true%2C+natural%2C+human+body.+Answer%3A+First%2C+if+these+and+the+like+heretics+believe+not+the+words%2C+nor+respect+the+works+of+Christ%3A+if+they+will+not+believe+Moses+and+the+prophets+testifying+of+Christ%2C+with+his+apostles+and+evangelists%2C+they+will+not+belieue+anyone+that+shall+return+from+the+dead%2C+and+much+less+a+dead+and+painted+Christ.+The+godly+emperors+Valens+and+Theodosius+made+a+law+that+none+should+make+any+image+of+our+Sauior+Christ%3A+and+if+any+were+found%2C+it+should+be+utterly+defaced+and+rejected.+Again%2C+Epiphanius+rent+in+pieces+the+picture+of+Christ+on+a+cloth%2C+anno+565%2C+because%2C+said+he%2C+it+was+contrary+to+holy+Scripture+%28Epiphanius%2C+Epistle+ad+Iohan.%3B+epistle+Hierosolymit%29.+Eusebius+says+that+some+convents+of+the+gentiles+carried+about+in+tables+the+pictures+of+Peter+and+Paul+and+Christ+also%2C+because+this+was+a+custom+%28says+he%29+to+remember+their+patrons+and+benefactors+%28Eusebius%2C+lib.+confes.+ch.+36%29.+Their+very+words+are+these%3A+%E2%80%98As+our+care+is%2C+in+and+by+all+means+to+maintain+the+religion+of+the+most+high+God%3A+so+permit+we+none+to+portrait%2C+engrave%2C+or+picture%2C+in+colors%2C+stone+or+any+other+matter+whatsoever%2C+the+image+of+our+Savior%3A+moreover+we+command+that+wheresoever+such+an+image+can+be+found%2C+it+be+taken+away%2C+and+all+those+to+be+chastised+with+most+grievous+punishment+that+attempt+anything+against+our+command.%E2%80%99+%28Petr.+Crinitus%2C+bk.+9%2C+de+honest.+discipl%29%E2%80%9D%0A%0A%E2%80%94+Henry+Holland%2C+The+History+of+Adam%2C+%28London%3A+Thomas+Man%2C+1606%29%2C+On+the+2nd+Commandment%2C+Question+79%2C+pp.+42-43+Holland+was+a+London+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe5ece47dd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5ece47dd5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Thirdly%2C%20it%20is%20objected%20that%20the,Crinitus%2C%20bk.%209%2C%20de%20honest.%20discipl&amp;text=Thirdly%2C%20it%20is%20objected%20that%20the%20humanity%20of&amp;text=command.%E2%80%99%20%28Petr.%20Crinitus%2C%20bk.%209%2C%20de%20honest.%20discipl" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

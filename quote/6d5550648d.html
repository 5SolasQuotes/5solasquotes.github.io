<main class="wrap"><figure class="quote" id="q-6d5550648d" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned and Profitable Treatise of Man&#x27;s Justification</cite>, ch. VIII, p. 29</span></figcaption>

</figure><figure class="quote" id="q-9c4add85b0" data-kw="">
<blockquote><p>They say, we are justified by works, as by causes thereof: we say, that we are justified by works as by signs and fruits of our justification before God, and no otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, on James 2:21</span></figcaption>

— William Perkins, A Reformed Catholic, on James 2:21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+say%2C+we+are+justified+by+works%2C+as+by+causes+thereof%3A+we+say%2C+that+we+are+justified+by+works+as+by+signs+and+fruits+of+our+justification+before+God%2C+and+no+otherwise.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+on+James+2%3A21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c4add85b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c4add85b0.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" rel="noopener" target="_blank">Read it online · Internet Archive (1597 ed.)</a></div>
</figure><figure class="quote" id="q-a8d5e74bd6" data-kw="">
<blockquote><p>However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers, so that we can interpose it between the judgment of God and our sins, so that we are protected under it as under a shield from the divine wrath which we have deserved, so that “covered by it we may now boldly and securely stand before the divine tribunal and thus be pronounced righteous to life eternal.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/formal-cause.html">Formal Cause: Imputation</a> › <a href="../topics/justification/formal-cause/imputation-not-infusion.html">Imputation, not infusion</a></span><span class="t"><a href="../topics/justification/infused-righteousness.html">Infused Righteousness</a> › <a href="../topics/justification/infused-righteousness/inherent-righteousness-as-the-formal-cause.html">Inherent righteousness as the formal cause</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/infused-righteousness.html">Infused righteousness</a></span></div>

</figure><figure class="quote" id="q-569d0412b6" data-kw="">
<blockquote><p>Therefore we say, that in that righteousness and instauration, (whereby we are fashioned anew by God) cannot consist justification, because the same through our corruption is imperfect, so that we cannot stand therewith before the judgment seat of Christ.</p></blockquote>

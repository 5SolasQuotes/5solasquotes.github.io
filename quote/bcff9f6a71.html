<blockquote><p>114. Ex. 4:21; 7:3; 10:27; 11:10, ‘But I will harden Pharoah’s heart.’ Ch. 8:15, 32, ‘Pharaoh hardened his heart, and was hardened, etc.’ God hardens permissively, not effectively, by no antecedent will (for He will not the death of a sinner), but by a consequent will, when he punishes by just judgment, and uses evil to a good end. ‘Satan,’ says Augustine, ‘hardens by persuading, man by consenting, God by forsaking.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible</cite>, … (London: Miller, 1662) | Exodus</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22d49744d1" data-kw="">
<blockquote><p>Question 9. Whether every will of God is fulfilled? Denied with a distinction. Answer: Concerning the will properly taken, or of good-pleasure [beneplaciti]: affirmed, Isa. 46:10. Concerning the will taken metonymically, or of command [mandati]: denied. And this opinion is insinuated by Thomas, in [Summa] pt. 1, question 19, article 6, where he disputes that every will of God is always fulfilled, together with article 11, where he distinguishes the will into [the will] of the sign and [the will] of good-pleasure. … Question 11. By what will can anyone justly will that which God does not will? Explained. Answer: We thus explain it: by a right will, which is conformable to the law and general command of God, one can will that which God does not will by the will of good-pleasure, or the hidden [will]. See Gen. 22, compared with Heb. 11:17 and 2 Sam. 7:2-3, 13. Question 12, Whether the precepts of God sometimes differ from his will? Affirmed with a distinction. Answer: In the proximate object they differ: for of the precept, or command, there can be another object—and indeed an opposite one—than [that] of the will or good-pleasure. As is manifest, Gen. 22, where the proximate object of the divine command given to Abraham was the slaying [mactatio] of Isaac; and the object of the good-pleasure, or of the divine will properly so called, was the non-slaying of the same. But although the objects of the will of command and of good-pleasure are opposed among themselves, yet the acts of command and of will are not opposed, but the former is subordinated to the latter. For God, by the will of good-pleasure, willed the command, or to command Abraham; but He did not will the thing commanded to Abraham, or the fulfillment of the commanded thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-0db55133c7" data-kw="">
<blockquote><p>The will of God is God by one simple act, absolutely willing the being of whatsoever He pleases. That distinction of the absolute and conditional will, as also that of the antecedent and consequent will of God, are both unsound. God wills it to be a truth that whosoever believes shall be saved: He likewise wills it to be the duty of Judas to believe: Hence follows (in case) a will of approbation concerning things in their own nature possible, which yet never shall be: as namely, the acceptation of the obedience of the reprobates; but it does not follow that God has conditionally willed the acceptation of the obedience of the reprobates. God decrees the coexistence of two extremes conditionally cohering, as the faith and salvation of Judas, the sight of such miracles and repentance in the Tyrians: the being of which extremes themselves He has not decreed. Though the things willed be conditioned, yet the volition or willing of God concerning those things is absolute. The authors and approvers of the second distinction, understand by the antecedent will of God (John Damascene, Of the Orthodox Faith, bk. 2, ch. 29), his will concerning the creature looking at it as in itself, without any consideration of after-circumstances: so they say God wills all men, even the reprobate to be saved: this they call his first will, and it is, say they, uncertain. By the consequent will of God, they understand his will concerning the creature looked at, not only as in itself, but together with after-adjuncts and circumstances, as sin, etc. This they call his second will, and it is, say they, certain. As a judge looking upon such a person as in himself, accounts it best that he should live; but looking upon him in second respects, as a murderer, etc. he accounts it best that he should die. The vanity of both these distinctions appears in that they are repugnant to the simplicity, perfection and independence of the first cause. The will of God in the decree, and the revealing of part thereof in the command, do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 17-18</span></figcaption>

<blockquote><p>I long ago began a treatise [Baxter’s Catholick Theology] to reconcile the Arminians and Anti-Arminians in these matters… And because I know not whether ever I shall live to reassume it… I must give the judicious a few hints of the media [means] of conciliation which I would have used: … 20. The doctrine of God’s antecedent and consequent will must be better explained, as being but his governing will, so called from legislation and judgment, which are the antecedent and consequent parts of government. 21. So must God’s will de naturalibus et moralibus [of natural and moral things], and his legislative antecedent will be well opened, and the uselessness and confusion of the distinction of signi [sign] and beneplaciti [good-pleasure] manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry, containing: I. the Reasons of their Preaching, II. an Answer to the accusations urged as reasons for the silencing of about 2000</cite>, … (London: Parkhurst, 1681), pp. 122-23, 127</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I long ago began a treatise [Baxter’s Catholick Theology] to reconcile the Arminians and Anti-Arminians in these matters… And because I know not whether ever I shall live to reassume it… I must give the judicious a few hints of the media [means] of conciliation which I would have used: … 20. The doctrine of God’s antecedent and consequent will must be better explained, as being but his governing will, so called from legislation and judgment, which are the antecedent and consequent parts of government. 21. So must God’s will de naturalibus et moralibus [of natural and moral things], and his legislative antecedent will be well opened, and the uselessness and confusion of the distinction of signi [sign] and beneplaciti [good-pleasure] manifested.”

<blockquote><p>I will make your cause better than you have made it, but not by making other men’s worse, but by opening the reconciling truth. I. I shall tell you in what sense God’s will and decrees may and must be said to have an extrinsic cause, without change in God. (Predestinatio nihil ponit in praedestinato inquit [Predestination places nothing in the one who is predestined]; Aquinas, pt. 1, q. 23, art. 2) 1. Know therefore that God’s essence is his will, but not as essence. To say that God is God, and that God wills this or that, are not terms of the same signification. 2. God’s will is his essence denominated from some amiable good as the object; and so there is ever quid respectivum [in that respect] in the notion of will. 3. As God wills Himself, the act being perfectly immanent, his will is called Himself much more properly than his will of things extrinsic (which is ever either effectively, or at least objectively transient), because it is God that wills, and that is willed or loved (which made many ancients say that this was the Third Person in the Trinity). 4. But as God wills things ad extra [to things outside Himself], though it is his essence that so wills them, yet it is unfit to say simply that this will is God; e.g. that to will Peter’s salvation is God, because the name ‘will’ here includes the thing willed. 5. And therefore when we speak of God’s will in the universal notion, as abstracted from all particular objects and acts, it is less inconvenient to say simply that this will is God than when we speak of his will in act ad extra. By this time you may see that though God’s will, as his essence, has no cause, yet his will as denominated extrinsically from the object may have some kind of cause, that is objective, which is quasi materia actus [the matter of the act, as it were], and the terminus sine quo non [end-without-which-nothing] (Alvarez himself says that by a ’cause’ he means also any objective condition or reason of the act); that is, God’s will is not denominated a complacency in Christ existent or in Peter regenerate, or his understanding a seeing that the world was good before any of these things did exist. (This is all that Ruiz’s reasons prove, Of the Will of God, disp. 115, sect. 4, p. 102, who says that there is more than extrinsic denomination; et relatio rationis quam realis formalitas [and a relation of reason rather than a real formality]. But he does but show by his quodammodo [in some way], that he knows not what to say.) So that by extrinsic denomination, without any change in God, He may and should be said de novo [of new] to know things to be existent, to be past, to will things as existent with complacency or will them with displicency: But not to will the futurity of men’s damnation de novo; but yet his will of the futurity of men’s damnation has several degrees of the objective cause, from whence it is denominated: As in esse cognito [known being], the person who is the object is in order of nature first a man, a subject, and then a sinner, and a despiser of mercy, and then a damnable sinner. And so these are indeed conditions in the object, or causae sine quibus non [causes without which nothing], or objective material-constituent causes, not in themselves, but the foresight of them, not of God’s will as his essence, nor of his will as a will, but of his will as extrinsically denominated: a decree to damn Judas, e.g. because no otherwise is Judas an object capable of giving such an extrinsic denomination to God’s will.</p></blockquote>

<blockquote><p>3. These false teachers, or foxes, are said to spoil the vines, for foxes hurt not a vineyard, or flock of lambs, more than false teachers do the Church.

2. Obscuring the simplicity of worship.

3. Overturning the beauty of order and bringing in confusion.</p></blockquote>

</figure><figure class="quote" id="q-a8a43c2c29" data-kw="">
<blockquote><p>To worship is to give to anyone the honor due unto him: So the rendering unto God that love, that fear, that service, that honor which is due unto him is the worshipping of God, that’s the Scripture definition, Ps. 29:2, ‘Give unto the Lord the honor due unto his name;’ then follows by way of exposition, ‘Worship the Lord in the beauty of holiness,’ that is, in his holy Temple, in his beautiful sanctuary, or in the comely honor of his sanctuary. So that worship is the tendering of honor to the Lord, in a way honorable to Him, namely according to his own will and laws of worship: which is intimated by coming to worship Him in his beautiful sanctuary, where all things about the service of God were exactly prescribed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London [1643]), Job 1:13-14, pp. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

— Joseph Caryl, An Exposition with Practical Observations upon the Three First Chapters of the Book of Job… (London [1643]), Job 1:13-14, pp. 190">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+worship+is+to+give+to+anyone+the+honor+due+unto+him%3A+So+the+rendering+unto+God+that+love%2C+that+fear%2C+that+service%2C+that+honor+which+is+due+unto+him+is+the+worshipping+of+God%2C+that%E2%80%99s+the+Scripture+definition%2C+Ps.+29%3A2%2C+%E2%80%98Give+unto+the+Lord+the+honor+due+unto+his+name%3B%E2%80%99+then+follows+by+way+of+exposition%2C+%E2%80%98Worship+the+Lord+in+the+beauty+of+holiness%2C%E2%80%99+that+is%2C+in+his+holy+Temple%2C+in+his+beautiful+sanctuary%2C+or+in+the+comely+honor+of+his+sanctuary.+So+that+worship+is+the+tendering+of+honor+to+the+Lord%2C+in+a+way+honorable+to+Him%2C+namely+according+to+his+own+will+and+laws+of+worship%3A+which+is+intimated+by+coming+to+worship+Him+in+his+beautiful+sanctuary%2C+where+all+things+about+the+service+of+God+were+exactly+prescribed+by+God.%E2%80%9D%0A%0A%E2%80%94+Joseph+Caryl%2C+An+Exposition+with+Practical+Observations+upon+the+Three+First+Chapters+of+the+Book+of+Job%E2%80%A6+%28London+%5B1643%5D%29%2C+Job+1%3A13-14%2C+pp.+190&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa8a43c2c29.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a8a43c2c29.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=To%20worship%20is%20to%20give%20to,God%20were%20exactly%20prescribed%20by%20God&amp;text=To%20worship%20is%20to%20give%20to%20anyone%20the&amp;text=service%20of%20God%20were%20exactly%20prescribed%20by%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

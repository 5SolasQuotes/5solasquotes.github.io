<blockquote><p>190. On what principles do you rest the advocacy of the doctrine in question?

The distinct, continued, or descending obligation of public social Covenants arises from the unchangeable obligation of moral and Christian duty, from the moral identity of the social body, and more especially from the Divine will as revealed in the Scriptures.

191. Does not the moral identity of the national society require that such a latitude of view should be connected with the idea of continued obligation?

It does. The social body is a moral subject, and as such is rewarded or punished by the Supreme Being. “The identity of a nation, as existing through different ages, is, in all moral respects, as real as the identity of an individual through the whole period of his life. The individuals that compose it, like the particles of matter in the human body, pass away, and are succeeded by others, but the body politic continues essentially the same.”

192. Do we find men, in the common affairs of life, recognising and acting upon the principle just alluded to?

Yes; hence, debts contracted, on certain kinds of property, by the parent, descend as a burden upon the heir; debts contracted by the British Government a century ago are still acknowledged as real debts: the Magna Charta granted by King John, and confirmed by his son, Henry III., six hundred years ago, is still considered as constituting the very charter of English liberty; and the Revolution Settlement is still viewed by the nations as equally binding now as it was by those who first entered into it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prize Catechism on the Principles and Position of the Reformed Presbyterian Church</cite>, (Belfast: M. Pollock, 1858), pp 82-83.</span></figcaption>

<blockquote><p>In this detestation of Christ towards Satan, for uttering blasphemy against his father, in his challenge to have power to dispose of all the kingdoms of the world as being his own; we are taught, not only to grieve at such blasphemies as we shall hear uttered against God, but to testified our detestation and indignation towards them. The world is full of black mouthed Rabshekas, who will not spare to blaspheme the glorious name of our God, &amp; to scoff &amp; deride his sacred word: now when we meet with such, we must not be like Stoics without affection, but in Christian wisdom from bleeding hearts for the reproach of God, shew forth godly zeal and indignation for the rescue of his glory.

The Hypocritical practise of wicked Jezabel in proclaiming a fast upon the false accusation of Naboth’s blasphemy against God and the king, may teach God’s Church to be zealous indeed against all blasphemers. When Rabsheka railed on the God of Israel, good king Hezekiah rent his clothes, and humbled himself in great measure for that reproach against his God. Tears were David’s meat day and night, while the heathen among whom he was constrained to live, said unto him where is thy God? And just Lot vexed his righteous soul from day to day with the unlawful deeds of the filthy Sodomites, living among them.

The practise of these godly men must be a president [precedent] for us to follow, that we hear no blasphemy against God without detestation. And as all God’s children must practise this duty, so especially Masters of families: David would not suffer a liar or a slanderer to come in his sight, or to abide in his house; much less would he have endured a blasphemer of God, or a slanderer of his word. The law commanded that the blasphemer should be stoned to death, who wittingly and willingly spake a word against God; and no doubt this law is perpetual.

Let a man but speak a word of disgrace against an earthly prince, and it costs him his life, and that justly: how much more then should he die the death though he had a thousand lives, that shall blaspheme the king of kings? Shall one that hath been baptized into the name of Christ, say there is no God, and that the Scriptures are but a device of man, and yet live? God forbid, for this hellish sin defiles a kingdom. And therefore the Magistrate with the sword of justice must cry out against such wretches, Away from us blasphemers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The combat between Christ and the Devil displayed: or A commentary upon the temptations of Christ</cite>, (London: Melchizedek Bradwood, 1606), pp 42-43.</span></figcaption>

<blockquote><p>The Polish Reformer, John à Lasco stated in a book dedicated to King Sigismond of Poland that the English monarch, Edward VI, when granting permission for foreign Reformed churches within his realm, also desired the further reformation of the English Church:

When I was called by that king [Edward VI.] and when certain laws of the country stood in the way, so that the public rites of divine worship used under Popery could not immediately be purged out (which the king himself desired); and when I was earnest for the foreign churches, it was at length his pleasure, that the public rites of the English churches should be reformed by degrees, as far as could be got done by the laws of the country; but that strangers, who were not strictly bound to these laws in this matter, should have churches granted unto them, in which they should freely regulate all things wholly according to apostolical doctrine and practice, without any regard to the rites of the country; that by this means the English churches also might be excited to embrace the apostolical purity, by the unanimous consent of all the states of the kingdom.

Of this project, the king himself, from his great piety, was both the chief author and the defender. For, although it was almost universally acceptable to the king’s council, and the archbishop of Canterbury promoted it with all his might, there were not wanting some who took it ill, and would have opposed it, had not his majesty checked them by his authority and the reasons which he adduced for the design. …

The care of our church was committed to us chiefly with this view, that in the ministration thereof, we should follow the rule of the divine word and apostolical observance, rather than any rites of other churches. In fine, we were admonished both by the king himself, and his chief nobility, to use this great liberty granted to us in our ministry, rightly and faithfully, not to please men, but for the glory of God, by promoting the reformation of his worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-a-lasco.html">John à Lasco</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Ordinatione Ecclesiarum peregrinarum in Anglia</cite>, p. 649. Quoted in Thomas McCrie, The Life of John Knox: Containing Illustrations of the History of the Reformation in Scotland, ed. Andrew Crichton (London: Henry G. Bohn, 1854), p. 359.</span></figcaption>

— John à Lasco, De Ordinatione Ecclesiarum peregrinarum in Anglia, p. 649. Quoted in Thomas McCrie, The Life of John Knox: Containing Illustrations of the History of the Reformation in Scotland, ed. Andrew Crichton (London: Henry G. Bohn, 1854), p. 359.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Polish+Reformer%2C+John+%C3%A0+Lasco+stated+in+a+book+dedicated+to+King+Sigismond+of+Poland+that+the+English+monarch%2C+Edward+VI%2C+when+granting+permission+for+foreign+Reformed+churches+within+his+realm%2C+also+desired+the+further+reformation+of+the+English+Church%3A%0A%0AWhen+I+was+called+by+that+king+%5BEdward+VI.%5D+and+when+certain+laws+of+the+country+stood+in+the+way%2C+so+that+the+public+rites+of+divine+worship+used+under+Popery+could+not+immediately+be+purged+out+%28which+the+king+himself+desired%29%3B+and+when+I+was+earnest+for+the+foreign+churches%2C+it+was+at+length+his+pleasure%2C+that+the+public+rites+of+the+English+churches+should+be+reformed+by+degrees%2C+as+far+as+could+be+got+done+by+the+laws+of+the+country%3B+but+that+strangers%2C+who+were+not+strictly+bound+to+these+laws+in+this+matter%2C+should+have+churches+granted+unto+them%2C+in+which+they+should+freely+regulate+all+things+wholly+according+to+apostolical+doctrine+and+practice%2C+without+any+regard+to+the+rites+of+the+country%3B+that+by+this+means+the+English+churches+also+might+be+excited+to+embrace+the+apostolical+purity%2C+by+the+unanimous+consent+of+all+the+states+of+the+kingdom.%0A%0AOf+this+project%2C+the+king+himself%2C+from+his+great+piety%2C+was+both+the+chief+author+and+the+defender.+For%2C+although+it+was+almost+universally+acceptable+to+the+king%E2%80%99s+council%2C+and+the+archbishop+of+Canterbury+promoted+it+with+all+his+might%2C+there+were+not+wanting+some+who+took+it+ill%2C+and+would+have+opposed+it%2C+had+not+his+majesty+checked+them+by+his+authority+and+the+reasons+which+he+adduced+for+the+design.+%E2%80%A6%0A%0AThe+care+of+our+church+was+committed+to+us+chiefly+with+this+view%2C+that+in+the+ministration+thereof%2C+we+should+follow+the+rule+of+the+divine+word+and+apostolical+observance%2C+rather+than+any+rites+of+other+churches.+In+fine%2C+we+were+admonished+both+by+the+king+himself%2C+and+his+chief+nobility%2C+to+use+this+great+liberty+granted+to+us+in+our+ministry%2C+rightly+and+faithfully%2C+not+to+please+men%2C+but+for+the+glory+of+God%2C+by+promoting+the+reformation+of+his+worship.%E2%80%9D%0A%0A%E2%80%94+John+%C3%A0+Lasco%2C+De+Ordinatione+Ecclesiarum+peregrinarum+in+Anglia%2C+p.+649.+Quoted+in+Thomas+McCrie%2C+The+Life+of+John+Knox%3A+Containing+Illustrations+of+the+History+of+the+Reformation+in+Scotland%2C+ed.+Andrew+Crichton+%28London%3A+Henry+G.+Bohn%2C+1854%29%2C+p.+359.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff69f614611.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f69f614611.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/13/john-a-lasco-on-edward-vi-and-the-need-for-further-reform-of-the-english-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

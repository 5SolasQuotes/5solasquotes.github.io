<blockquote><p>Neo. I pray you, sir, proceed to the affirmative part, and tell us what the Lord requires in this commandment.

Evan. The Lord in this commandment requires purity of heart, (1 Thess. 4:5); and he also requires speeches savouring of sobriety and chastity, (Col. 4:6, Gen. 4:1); and he also requires that we keep our eyes from beholding vanity and lustful objects, (Psa. 119:37, Job 31:1); and he also requires that we be temperate in our diet, in our sleep, and in our recreations, (Luke 21:34); and he also requires that we possess our vessels in holiness and honour, (1 Thess. 4:9); and if we have not the gift of chastity, he requires that we take the benefit of holy marriage, (1 Cor. 7:29); and that the man and wife do in that estate render due benevolence each towards the other, (1 Cor. 7:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 431.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline.html">Church Discipline</a></span></div>

<blockquote><p>Thirdly, the practice of wisdom consists, first, in avoiding extremities, vv. 16-17. Secondly, in keeping the mean, v. 18. The extremities are excess or defect. The excess is an error on the right hand, when a man by pride abuses his wisdom, in stretching it beyond the limits and bounds of human capacity, either in defining thereby what is just, what unjust, or what is truth, what error. ‘Be not righteous overmuch.’ A man cannot be too righteous in respect of obedience to the Commandments, yet if he be so much addicted to one or some, as that he despises the rest, he bewrays hypocrisy and folly, and may well be said to be too just. For a man is not to cull out what he thinks good, thereby to justify himself, and to condemn others…</p></blockquote>

<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law.

3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty.

4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things.

5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie.

6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one.

7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know:

1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such.

2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause.

3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>

<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 54-55</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?”

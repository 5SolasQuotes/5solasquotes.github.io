<blockquote><p>1. That this offer is real. Christ does not deceive, or dissemble with sinners, but really He does desire they should have liberty. Men sometimes make offers of good things to one another, but they are not sincere in them. But it is not so with Christ; He is a real well-wisher to sinners’ souls. He has expressed it all the ways that can be desired. Would you believe his reality, if He does woo sinners? Why, so He does, Lk. 14:23, compel them to come in, viz. by importunate entreaty. Would you believe his reality, if He does wait for sinners? Why, so He does, Rev. 3:20, ‘Behold I stand at the door, and knock, etc.’ Would you believe his reality if He does weep for sinners? Why, so He does, He wept over Jerusalem, Lk. 19:41-42. Would you believe his reality if He does die for sinners? Why, so He did, Rom. 5:8. While we were yet sinners, Christ died for us. Nay, would you believe his reality if he should be damned for sinners? Why, so He was, though not in respect of the place, yet in respect of the pains of Hell: He was ;’made a curse for us,’ Gal. 3:13. What would you have Christ to say or do more than He has said and done, to convince you, that He would have sinners to be partakers of this freedom. Has He not said so in his Word? Has He not sealed it with his blood? Has He not accepted and embraced from time to time, whoever came unto Him? Does He not engage Himself by his faithful promise, to do so still to the end of the world, that He will in no wise cast out such as come to Him, Jn. 6:37. And yet what a wonder is it, that the world is so unbelieving still? and so hard to be persuaded, that Christ has any loving thoughts or purposes towards them? Oh this cursed unbelief, and hardness of heart, that is in men and women that makes them that they will not come to Christ that they might have life!</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4d63f5295" data-kw="">
<blockquote><p>So in the 23rd [of] Proverbs, v. 26. ‘My son give me thy heart;’ ‘O my son,’ says God, ‘give Me thy heart;’ Christ is the Everlasting Father, and He says, ‘My son, give me thy heart, come to Me.’ One place more in the 3rd [chapter of] Revelation is worth your observing; ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in to him and will sup with him, and he with Me:’ ‘Behold I stand at the door and knock;’ I came down from heaven into mine ordinances, I knock at the door of your hearts and consciences, if any man will open now, if any many would have water of life from me, if any man would have bread of life from Me, if any man would have communion with Me, let him but open and receive Me in, and I will sup with him and he with Me: what sweet invitations have we from Christ, how forward, how ready is the Lord Jesus to do poor sinners good.</p></blockquote>

 Online</a></div>
</figure><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations (the Westminster Annotations)</cite>, 3rd ed. (1658), on Song 5:2</span></figcaption>

<blockquote><p>Now the Son of the ever blessed God tenders Himself to you with many entreaties, goes after you up and down, night and day, knocking at the door of your heart, with all his graces, comforts, and fruits of his death, by the ministry of his word, the motions of his Spirit, multitudes of temporal and spiritual mercies; but you, unworthy wretch, slights both Him and his precious attendants, and esteems your shop and stock, your corn and carnal comforts, far before Him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Door of Salvation Opened by the Key of Regeneration, in his Works</cite>, (d. 1673; Banner of Truth), 5:140-41</span></figcaption>

<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-397a529116" data-kw="">
<blockquote><p>And doubtless when the business of the Last Judgment is not to examine whether Christ has satisfied for us or not, but whether we have performed the conditions on our part, on which the benefits of his satisfaction, especially eternal life, were promised; it must needs follow that so far our iustitia causae [our righteousness of the cause] in that trial will lie in our actual performance of those conditions, which is our personal evangelical righteousness; and according thereto we shall be justified; that is, adjudged to be the heirs of life, and not of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellarmine Castigated, ‘On Justification’</cite>, in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 404-5 | Bellarmine Castigated, ‘On Justification’, bk. 5, ch. 3, p. 1246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bde91c87e8" data-kw="">
<blockquote><p>The wicked shall be raised by the power of Christ as a just Judge. The divine power that shut them up in the grave as in a prison, will bring them out, in order to their receiving the last sentence, to enter into the prison of hell. But the godly shall be raised by virtue of the Spirit of Christ, that bond of union betwixt Christ and those blessed bodies; so that it shall be to them as a pleasant awakening out of sleep.</p></blockquote>

</figure><figure class="quote" id="q-3eddfe8052" data-kw="">
<blockquote><p>XL. Are good works therefore unnecessary for our justification? To become righteous from being guilty and liable to punishment—that is, to receive the abundance of grace and the gift of righteousness—they are not necessary as antecedents. But they are absolutely necessary as consequences. They are the fruits and ends of justification, from which justification ought not and cannot be separated. For in the New Covenant, God has first promised us the forgiveness of sins, and then sanctification. Christ has been made for us not only righteousness, but also sanctification. Faith embraces both promises, and draws both benefits from the fullness of Christ, into whom it inserts us. Thus, a faith that does not produce good works as its fruits reveals itself not to be true faith at all, but a rotten corpse of faith, which mimics the outward appearance of faith but has no power, movement, or activity. Therefore, in order that we may be declared righteous, and that it may be shown (whether in the court of our conscience or in the final judgment) that God has truly granted us forgiveness of sins, good works are necessary as posterior evidences, as they say. For faith is known by its works, just as a tree is known by its fruits. References: Heb. 10:16; 2 Cor. 1:30; Jm. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, trans. AI (1634), p. 9</span></figcaption>

%3B%202%20Cor.%201%3A30%3B%20Jm.%201%3A11&amp;text=XL.%20Are%20good%20works%20therefore%20unnecessary%20for%20our&amp;text=References%3A%20Heb.%2010%3A16%3B%202%20Cor.%201%3A30%3B%20Jm.%201%3A11" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The final judgment which Christ will exercise at the end of the world over the living and the dead, raised up and gathered together at the trump of God and the voice of the archangel, must be investigated as to its truth and manner. It is not inquired concerning the judgment of God taken merely for his rule and governing, nor concerning the fatherly judgment of God toward believers, but concerning that public and solemn judgment of the last day.</p></blockquote>

</figure><figure class="quote" id="q-68ca6aa5c2" data-kw="">
<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.1.26</span></figcaption>

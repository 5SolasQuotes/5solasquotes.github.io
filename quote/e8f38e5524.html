<blockquote><p>…the duels which have been fought between princes, which have determined their quarrels by the monomachy of man to man. The crown of England was sometimes in that sort disputed, between Edmund Iron-side, and Canute the Dane: Edward III offered as much to the king of France; the French king to the Emperor Charles V; and Henry the Great, father of our most illustrious queen, made offer to the Duke of Guise his competitor to put a period to their difference by point of spear, his person against his, six against six, or hundred against hundred. I will not say that it is lawful to a prince so to hazard the head of the commonwealth, and in his person, all the body of his estate, but when this way is permitted them, it is, because sovereign princes have not any judge above them who can do them right, so that to obtain reason from their hands who are elevated to as high a pitch of dignity as themselves, there is not any other way but by arms; and these their doings have an outward show of charity: for a prince will say, that he likes better to expose his own person to danger than to see a bloody war that should swallow up many thousands of men and give occasion of an infinite slaughter. And it may be that some people desirous to avoid a general conflict of nation against nation, have sometimes remitted their quarrel to a certain number of men, to be chosen by either side by them to be decided by combat. So three hundred Lacedemonians fought against a like number of the Argiens; three Romans against three Latins; and when David and Ishboseth stood competitors for the royalty, the two generals Joab and Abner caused a combat between twelve soldiers of the tribe of Judah against twelve of the tribe of Beniamin [2 Sam. 2:12-17]. This kind of duel is as it were an abridgement of the war, and yet not very justifiable. There is more appearance in this case than in any of the cases aforementioned: Two armies are ready to fight, he that has the right on his side finds himself inferior in forces, so that if they come to handy-strokes we must all die of necessity: The enemy makes an offer of a single fight, one to one, and offers to stand to the event of this duel; why should we all perish and not rather make legal of this way and expedient, which perchance may give us the victory, or at least will save six thousand men’s lives, and there can but one be slain? But this example has no correspondence with the [private] duel, whereof we now treat, and one may not draw into consequence particular actions which are exploited in war or in the consequence of war, especially in heat of battle…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-duello. The Anatomy of Duels</cite>, … (London: Harper, 1632), pp. 11-14 D’Espagne (1591-1659) was a French protestant pastor and theologian who lived in London for a significant time.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbaca9017f" data-kw="">
<blockquote><p>But I answer, the place 2 Cor. 2:10 is controverted, and we doubt not, but [that it is] of that same nature with the power of excommunicating, 1 Cor. 5:4. But for private forgiving, it is not the Church-forgiving here meant, because:

1. The private forgiving is a duty of charity commanded in the Law of Nature to all, even out[side] of [a] Church-state, and obliges the excommunicate[d], who, though they be cast out of the Church, are not exempted from the Law that binds all, Mt. 6:12,14-15; Mt. 5:44-45, but the Church-forgiving is an act of obedience to a positive Church-Law of Christ.

2. Private Christians are to forgive their enemies whether they repent or not, even as Christ forgave those who crucified Him, Col. 3:13; Lk. 23:34; and when the party repents not, this forgiveness is not ratified in Heaven, yet are we obliged to forgive and to commit vengeance to God; But the authoritative forgiving is a thing that the Church is not obliged unto, absolutely; nor may they, or can they forgive, except the offender repent: and if they see that he repents not, they cannot lawfully forgive; but, being in God’s room, must take vengeance on all disobedience, and their retaining of sin and forgiving is valid in Heaven, because they are in God’s place. Now any forgiving or retaining of sin but these two, together with God’s forgiving and retaining, we know not. But Peter’s forgiving his offending brother seventy times seven times, is common to all private Christians, even out[side] of [a] Church-state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1642), pt. 1, ch. 1, section 1, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4.

4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>

— John Cotton, ‘The Answer of Mr. John Cotton of Boston in New-England, to the aforesaid Arguments Against Persecution for Cause of Conscience, …’ in Roger Williams, The Blovdy Tenent of Persecution for Cause of Conscience, Discussed in a Conference… (London, 1644), p. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+When+Christ+commands+his+disciples+to+bless+them+that+curse+them+and+persecute+them%2C+He+gives+not+therein+a+rule+to+public+officers%2C+whether+in+Church+or+commonweal%2C+to+suffer+notorious+sinners%2C+either+in+life+or+doctrine%2C+to+pass+away+with+a+blessing%3A+But+to+private+Christians+to+suffer+persecution+patiently%2C+yea+and+to+pray+for+their+persecutors.+Again%2C+it+is+true%2C+Christ+would+have+his+disciples+to+be+far+from+persecuting+%28for+that+is+a+sinful+oppression+of+men+for+righteousness+sake%29+but+that+hinders+not+but+that+He+would+have+them+execute+upon+all+disobedience+the+judgement+and+vengeance+required+in+the+Word%2C+2+Cor.+10%3A6%3B+Rom.+13%3A4.+4.+Though+it+be+true+that+wicked+persons+now+may+by+the+grace+of+God+become+true+disciples+and+converts%2C+yet+we+may+not+do+evil+that+good+may+come+thereof%3A+And+evil+it+would+be+to+tolerate+notorious+evil-doers%2C+whether+seducing+teachers+or+scandalous+livers.+Christ+had+something+against+the+angel+of+the+Church+of+Pergamus+for+tolerating+them+that+held+the+doctrine+of+Balaam%2C+and+against+the+Church+of+Thiatira+for+tolerating+Jezabel+to+teach+and+seduce%2C+Rev.+2%3A14%2C+20.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+%E2%80%98The+Answer+of+Mr.+John+Cotton+of+Boston+in+New-England%2C+to+the+aforesaid+Arguments+Against+Persecution+for+Cause+of+Conscience%2C+%E2%80%A6%E2%80%99+in+Roger+Williams%2C+The+Blovdy+Tenent+of+Persecution+for+Cause+of+Conscience%2C+Discussed+in+a+Conference%E2%80%A6+%28London%2C+1644%29%2C+p.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd8eea88569.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class

<main class="wrap"><figure class="quote" id="q-cfdc6cfcab" data-kw="">
<blockquote><p>That the prohibitions we read of in Scripture, of not kindling a fire on the Sabbath day, Exod. 35. and Exod. 16.29. For not going out of their place on the seventh day, to gather manna: must not be taken in that strictness, in which some would urge them, or at least only concerned the Jews in that time, not afterward. The fire forbidden to be kindled, must necessarily be understood, 1. Either in reference to the making the Tabernacle, of which he there speaks; or 2. more largely of any trade-fire kindled for men to work with, to get a livelihood, not such as is kindled for dressing of meat, refreshing us in cold weather; or when we are sick.

… It is not probable there was no fire in the Jews’ houses that made the feast, at which our Saviour was, Luk. 14. besides we find works parallel to this, justified in Scripture. Though going out of their doors on the Sabbath, must be understood, to gather manna, Exod. 16.29. or upon other ends, than in order to actions of piety, necessity, or preservation and mercy, for that instance, Numb. 15.32, 33. The Scripture so shortly relates that story of the man’s being put to death for gathering sticks on the Sabbath day, as to the cause of it, that it is hard to give a satisfactory answer.

Stoning to death was a punishment used in the highest cases, as that of blasphemy, &amp;c. with which our reason would not judge such a violation of the Sabbath, as gathering sticks was to be put in the balance: but in the Judgement there could be no error, for it was given by the Judge of the whole Earth, who cannot err in appointing punishments to sins: That he gathered sticks on the Sabbath, and this was the matter of his guilt, is plain, but whether it was after some special command of Moses to the contrary (which the scripture saith not) or to assert a profane liberty, and his not regarding the commandment of God, when he had no need to it: Or whether it was in order to kindle some fire for labour contrary to the precept, Exod. 35.3.

Or what other circumstance fell in to aggravate the action to such a degree of guilt we cannot tell. Suppose it was to kindle a necessary fire, yet we are sure it might have been done before the Sabbath; so as it was an unnecessary labour, as to any necessity but what a former neglect had created: something was doubtless in it more than we have in the story. It is certain Moses brings this example next after the Law against presumptuous sinners, Num. 15.30, 31, 32. Nor do we read afterwards of any such examples of severity.</p></blockquote>

<blockquote><p>I now come to that which you yourself also acknowledge, that all human inventions are not at once to be condemned. For it was clearly a human invention that we communicate [in the Lord’s Supper] in the morning, rather than after dinner: and it was a human invention that the prices of things that were sold in the primitive Church were laid at the apostles’ feet… I pass over that they who defend these things will be able to put forward some honest and just meaning not alien from the Scripture… But, if by this there is given occasion of error to the weak, let them be advised to regard these things as indifferent; let them be taught by sermons, not to judge the worship of God as placed in these things… Neither do I think that tyranny is instantly brought in if any indifferent thing be appointed to be done in the Church and be constantly performed by many. At this day we so administer the Eucharist in the morning time, that after dinner we will not have the communion in the sacred assembly [In the New Testament the Eucharist was always administered in the evening]. But who will say, that this, which we all do with the like will and consent is tyrannical? To myself truly, as I have now often mentioned, it would be more agreeable that we should only do what Christ did and delivered to his apostles. But, if any indifferent things have been added, I would not now sharply strive on this account; especially when we see that they by whom the light of the Gospel has been greatly promoted in England, and can be yet more promoted, oppose themselves to us. I acknowledge indeed with you that ‘whatsoever is not of faith is sin.’ (Rom. 14:23). But what the apostle wrote to Titus seems, above all things, to promote our having a quiet conscience in our actions: ‘Unto the pure all things are pure;” and to Timothy, “Every creature of God is good.” But it is not necessarily required that we should show express mention in holy Scripture of the particular things which we use: this is enough to know by faith, on the whole— that indifferent things cannot defile those who live with a pure and sincere mind and conscience… but I yet thought that the use of these differences was not in itself or its own nature ungodly or of fatal consequence, provided other things which are prescribed to us by the Word of God remain sound.</p></blockquote>

<blockquote><p>This delight is spiritual in God as the proper object, and in the ordinances as the only means to lead us unto God, Job 27:10; Ps. 43:4; Canticles, 2:3; Isa. 56:7. Reasons.

1. Because the duties of that day are higher, we have then all the means of communion with God:

1. We have them in a more raised solemn way without any interruption; there is then a double institution, not only of the worship, but the time.

2. Its a spiritual feast, a day of God’s appointment, our recompence as well as our duty, Neh. 2:26. Ordinances are fodinae gratiae [wells of grace], Isa. 12:3.

3. This day we come to remember the highest favours of God to the creature, to contemplate the works of Creation, God’s rest, and of Redemption, Christ’s rest, 1 Pet. 4:1, and our own eternal rest, Heb. 4:9, the Sabbaths of the faithful are the suburbs of Heaven, Heb. 12:23, the Lord’s Supper is heaven in a map, Luke 14:15; Mt. 26:29.

4. Many of the duties of the day are but spiritual recreations; meditation is the solace of the mind in the contemplation of God’s works, Ps. 104:34. Singing of Psalms is a vent for spiritual mirth, Lam. 5; Eph. 5:18-19; then God should be solemnly praised, Ps. 92:1-2.

5. It is the temper of the people of God to delight in his solemn worship, Ps. 2; 1 Cor. 2:12. Male concordat canticum novum et vetus homo [The new song and old man poorly agree]. Augustine; Ps. 84:1, 10; Ps. 122:1.

6. Delight in the Sabbath is the best way to discharge the duties:

1. With comfort; delight sweetens all; how will men toil at their sport? Neh. 11:8.

2. With profit, Isa. 64:5; God will not send them away sad which come into his presence with joy.</p></blockquote>

— Edward Leigh, A System or Body of Divinity, … (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment, pp. 820-21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+delight+is+spiritual+in+God+as+the+proper+object%2C+and+in+the+ordinances+as+the+only+means+to+lead+us+unto+God%2C+Job+27%3A10%3B+Ps.+43%3A4%3B+Canticles%2C+2%3A3%3B+Isa.+56%3A7.+Reasons.+1.+Because+the+duties+of+that+day+are+higher%2C+we+have+then+all+the+means+of+communion+with+God%3A+1.+We+have+them+in+a+more+raised+solemn+way+without+any+interruption%3B+there+is+then+a+double+institution%2C+not+only+of+the+worship%2C+but+the+time.+2.+Its+a+spiritual+feast%2C+a+day+of+God%E2%80%99s+appointment%2C+our+recompence+as+well+as+our+duty%2C+Neh.+2%3A26.+Ordinances+are+fodinae+gratiae+%5Bwells+of+grace%5D%2C+Isa.+12%3A3.+3.+This+day+we+come+to+remember+the+highest+favours+of+God+to+the+creature%2C+to+contemplate+the+works+of+Creation%2C+God%E2%80%99s+rest%2C+and+of+Redemption%2C+Christ%E2%80%99s+rest%2C+1+Pet.+4%3A1%2C+and+our+own+eternal+rest%2C+Heb.+4%3A9%2C+the+Sabbaths+of+the+faithful+are+the+suburbs+of+Heaven%2C+Heb.+12%3A23%2C+the+Lord%E2%80%99s+Supper+is+heaven+in+a+map%2C+Luke+14%3A15%3B+Mt.+26%3A29.+4.+Many+of+the+duties+of+the+day+are+but+spiritual+recreations%3B+meditation+is+the+solace+of+the+mind+in+the+contemplation+of+God%E2%80%99s+works%2C+Ps.+104%3A34.+Singing+of+Psalms+is+a+vent+for+spiritual+mirth%2C+Lam.+5%3B+Eph.+5%3A18-19%3B+then+God+should+be+solemnly+praised%2C+Ps.+92%3A1-2.+5.+It+is+the+temper+of+the+people+of+God+to+delight+in+his+solemn+worship%2C+Ps.+2%3B+1+Cor.+2%3A12.+Male+concordat+canticum+novum+et+vetus+homo+%5BThe+new+song+and+old+man+poorly+agree%5D.+Augustine%3B+Ps.+84%3A1%2C+10%3B+Ps.+122%3A1.+6.+Delight+in+the+Sabbath+is+the+best+way+to+discharge+the+duties%3A+1.+With+comfort%3B+delight+sweetens+all%3B+how+will+men+toil+at+their+sport%3F+Neh.+11%3A8.+2.+With+profit%2C+Isa.+64%3A5%3B+God+will+not+send+them+away+sad+which+come+into+his+presence+with+joy.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+System+or+Body+of+Divinity%2C+%E2%80%A6+%28London%3A+A.M.%2C+1654%29%2C+9th+Book%2C+of+the+Moral+Law%2C+ch.+5%2C+4th+Commandment%2C+pp.+820-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a29be598b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a29be598b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=This%20delight%20is%20spiritual%20in%20God,come%20into%20his%20presence%20with%20joy&amp;text=This%20delight%20is%20spiritual%20in%20God%20as%20the&amp;text=sad%20which%20come%20into%20his%20presence%20with%20joy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-779ef8841e" data-kw="">
<blockquote><p>Although Christ assumed human nature, yet he did not on that account assume it in order to provide a model for carvers and painters. He denied that he had come “to abolish the law and the prophets” (Matt. 5:17). But images are forbidden by the law and the prophets” (Deut. 4:15; Isa. 44:9). He denied that his bodily presence would be profitable for the Church, and promised that he would be near us by his Spirit forever (John 16:7). Who, therefore, would believe that a shadow or likeness of his body would contribute any benefit to the pious? (II Cor. 5:5). Since he abides in us by his Spirit, we are therefore the temple of God (I Cor. 3:16). But “what agreement has the temple of God with idols?” (II Cor. 6:16)</p></blockquote>

</figure><figure class="quote" id="q-c48360d4b4" data-kw="">
<blockquote><p>and that the Engagement whereinto we are entered [to the English republican government, 1648], to be ‘true and faithful to this commonwealth, as it now is (viz.) established without a king and House of Lords,’ has nothing at all inconsistent with the former engagements [such as the SL&amp;C, 1643], or does give us the least cause to carry about with us a conscience (as to these things) trembling and doubtful, because we find ourselves free from all guilt of the least intention of violating any former promises, in things which are possible and lawful to be done by us in our places, which were unalterable conditions of all human promises, at all times presupposed and implied therein.</p></blockquote>

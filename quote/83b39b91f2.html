<main class="wrap"><figure class="quote" id="q-83b39b91f2" data-kw="">
<blockquote><p>But by what merit have we received this righteousness, sonship, and inheritance of eternal life? By none. For what could be merited by men confined under sin, subjected to the curse of the Law, and condemned to eternal death? Therefore we have received all this freely and without deserving it, yet not without merit. What merit was it, then? Not ours, but that of Jesus Christ, the Son of God, who was born under the Law, not for Himself but for us (as Paul said earlier [Gal. 3:13] that He was made a curse for us), and who redeemed us who were under the Law. Therefore we have received this sonship solely by the redemption of Jesus Christ, the Son of God, who is our most abundant and eternal merit . . . Together with this gift of sonship, moreover, we have also received the Holy Spirit, whom God, through the Word, sends into our hearts, “crying: ‘Abba! Father!’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 374.</cite></span></figcaption>

<blockquote><p>Let us not suppose, then, that the Holy Spirit, by this promise, commends the dignity of our works, as if they were deserving of such a reward. For Scripture leaves us nothing of which we may glory in the sight of God. Nay, rather its whole object is to repress, humble, cast down, and completely crush our pride. … to this happiness he gives the name of reward, hire, recompense, not as estimating the merit of works, but intimating that it is a compensation for their straits, sufferings, and affronts, &amp;c.</p></blockquote>

<blockquote><p>9.3 The Covenant Of Works The covenant of works is the pact of God initiated with the uncorrupted Adam, as head of the whole human race, in which He stipulated from man perfect obedience to the law, promised eternal, heavenly life for the same obedience, but threatened eternal death for transgression, and in turn man promised perfect obedience to God who stipulated, which having furnished, he could expect eternal, heavenly life. Scripture testifies that such a covenant existed with Adam. “They…(like Adam) transgressed the covenant” (Hos. 6:7). And God established the sacrament of the same covenant, “the tree of life” (Gen. 2:9). (VII). 9.4. God And Adam Covenanted They were covenanted, God as the Creator, Law-giver, and Rewarder, and Adam as the first man, uncorrupt, and head of the human race. For Adam was the “one blood” in which the whole posterity lay hidden (Acts 17:26), and he was “the first Adam,” equally representing those to be born from his blood, and “the second Adam” represents the faithful; indeed, he is a “type of” the one “to come” (Rom. 5:14). And since the remaining words concern the whole human race, the human race cannot be secluded from the covenant initiated with him. (VIII). 9.10. The Promise Of Heavenly And Eternal Life The promise of the covenant of works was eternal and heavenly life. This sacrament of it, “the tree of life,” by all means true and…(eternal) (Gen. 2:9), sanctioned not only for animals, and the earthly blessings that he already possessed, in which there was no διαθήκη (covenant), but there was προσθήκη (an accession) to the covenant. And when Christ, fulfilling the law in our place, merited eternal and heavenly life for us, He obtained the fulfillment of the same law by merit for us. Indeed, God promised something more in the covenant of works than that of whom could be a sharer outside of that. And it was not other than the translation into heavenly Paradise. (XXIII–XXVI). 10.4. The Stipulation Of God And The Promise Of The Son In this singular pact God the Father demanded from the Son, as Mediator, vicarious obedience to the law for man the sinner, and the Son promised it in turn. “Behold, I come. In the scroll of the book it has been written about me, that I shall do Your will” (Ps. 40:8–9). “Where He placed His soul as sacrifice, He will see a seed” (Isa. 53:10). “This commandment I have received from the Father, that I may place My soul” (John 10:17, 18). “He was born from a woman, gενόμενος ὑπὸ νόμον (born under the law) (Gal. 4:4). Therefore, everywhere Christ comes in the name br[ ἐγτύου and παρακλήτου (of advocate, guarantor), by guaranteeing and promising for another, of the one who receives Him in his faith (Job 33:23, Jer. 30:21, Isa. 38:14, Heb. 7:22). This Sponsor is at the same time is called “Mediator” (1 Tim. 2:5, Heb. 8:6), “Testator” (Heb. 9:15, 16), “High Priest” (Heb. 7:26), “Vindicator” (Job 19:25, Heb 2:16), etc. (VII–XIV). 10.5. The Demand Of The Son The demand of the same Son follows the promise. For as God the Father demanded payment from the Son and promised inheritance for paying, so the Son by promising and furnishing it, acquired the right to claim an inheritance, church, people of His own possession. “Demand from Me, and I will give you the nations as Your inheritance, and the ends of the earth as Your possession” (Ps. 2:8). “Surely My judgment is before the Lord, and…(My works) are a price before My God” (Isa. 49:4). For the promise and obedience of the Son had reason of true merit, even from condignity, for which nothing could be lacking (XIV).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology (1697). Trans. Casey Carmichael. ©R. Scott Clark and Casey Carmichael 2015.</cite></span></figcaption>

ise.+For+as+God+the+Father+demanded+payment+from+the+Son+and+promised+inheritance+for+paying%2C+so+the+Son+by+promising+and+furnishing+it%2C+acquired+the+right+to+claim+an+inheritance%2C+church%2C+people+of+His+own+possession.+%E2%80%9CDemand+from+Me%2C+and+I+will+give+you+the+nations+as+Your+inheritance%2C+and+the+ends+of+the+earth+as+Your+possession%E2%80%9D+%28Ps.+2%3A8%29.+%E2%80%9CSurely+My+judgment+is+before+the+Lord%2C+and%E2%80%A6%28My+works%29+are+a+price+before+My+God%E2%80%9D+%28Isa.+49%3A4%29.+For+the+promise+and+obedience+of+the+Son+had+reason+of+true+merit%2C+even+from+condignity%2C+for+which+nothing+could+be+lacking+%28XIV%29.%E2%80%9D%0A%0A%E2%80%94+J.H.+Heidegger%2C+The+Concise+Marrow+of+Christian+Theology+%281697%29.+Trans.+Casey+Carmichael.+%C2%A9R.+Scott+Clark+and+Casey+Carmichael+2015.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc047bece1d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c047bece1d.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/j-h-heidegger-christ-condignly-merited-as-the-second-adam/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

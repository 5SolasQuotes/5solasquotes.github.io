<blockquote><p>Their women used both to pray and prophesy unveiled, and with their head bare, (for even women also used to prophesy) but the men went so far to wear long hair, as having spent their time in philosophy and covered their heads when praying and prophesying, each[?] of which was a Grecian custom.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aaa70fed60" data-kw="">
<blockquote><p>Wherefore let it be set down that it is lawful for the Church to make to itself either canons or laws, or decrees, or statutes, or call them by what name thou wilt. For the Church is a company, and must be ruled by the Word of God, especially because it belongs to the salvation thereof, and to the worshiping of God. But there be other things which belong only unto outward discipline. For there is need of certain outward bonds, to the end that the fellowship of the people may be retained. So the apostle decreed that women ought to pray with the head covered, and men uncovered. And the apostles in the Acts, decreed that we should abstain from blood, from strangled, and from things dedicated unto idols. And always in councils after they had done with doctrine, they began to entreat of discipline. Finally so did all the fathers as Tertullian, Origen, Basil, Augustine and Jerome. The end of these laws must be edifying and good order. But for so much as they be not of necessity, they may be changed according to the times and places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, (d. 1562; London, 1583), ch. 4, ‘Of Ecclesiastical Laws…’, p.42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f25aa18f93" data-kw="">
<blockquote><p>But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fides Catholica, or, The Doctrine of the Catholic Church in Eighteen Grand Ordinances</cite>, … (London, 1661), ch. 1, question 6, p. 82 Annand (1633–1689) was born and educated in Scotland (University of Aberdeen, 1649) and took another degree at Oxford in 1655. He was ordained by an Irish bishop and wrote the following as an Anglican minister against the English puritans upon the restoration of King Charles II. He then served as a Scottish minister from 1663-1689.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-3feea598b2" data-kw="">
<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing… 3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative (London: Maxwell, 1682) Stoddon was an English, congregationalist minister., pp. 40-44</span></figcaption>

C+and+to+be+determined+by+the+custom+of+those+particular+churches+or+people%2C+where+any+one+has+his+conversation%2C+and+not+to+be+positively+asserted+for+a+general+duty%E2%80%A6+Objection+2%3A+Others+object%2C+That+the+Reformed+Churches+in+other+countries+observe+no+such+thing%2C+but+generally+practice+the+contrary+in+their+assemblies%3B+but+if+it+were+a+duty%2C+why+should+not+they+practice+it+as+well+as+we%3F%E2%80%A6+Objection+4%3A+Others+there+be+that+will+allow+it+to+be+necessary%2C+by+the+rules+of+decency+and+reverence%2C+to+be+uncovered+in+prayer%2C+and+in+singing+and+perhaps+in+reading+of+the+Scriptures+too%2C+but+not+in+preaching%3A+And+their+reason+is+because+in+preaching+we+have+not+the+pure+word+of+God%2C+but+mixed+with+men%E2%80%99s+own+private+opinions+and+improvements%E2%80%A6+Objection+5%3A+Others%2C+it+seems%2C+argue+after+this+fashion%3A+This+uncovering+of+the+head+in+divine+worship%2C+is+a+thing+that+has+been+so+abused%2C+and+rested+in+by+a+company+of+dead+formalists%2C+and+so+zealously+affected+by+such+as+dote+on+foolish+and+superstitious+ceremonies%2C+that+to+show+our+dislike+of+their+ways%2C+we+think+it+expedient+to+act+contrary+to+them+in+this+thing+also%2C+and+not+to+symbolize+with+their+superstitions.+Answer%3A+Had+I+not+heard+it+from+some+that+pretended+to+sobriety%E2%80%A6+Objection+6%3A+But+there+are+yet+others+that+think+they+have+more+to+say+than+all+this.+Their+bodily+infirmities+are+such+as+that+they+cannot+bear+it+to+be+so+long+uncovered%2C+without+hazard+of+their+health%3A+But+God+will+have+mercy%2C+and+not+sacrifice%E2%80%A6+Objection+7%3A+Others+think+to+say+something+in+this%2C+if+this+had+been+such+a+duty%3B+wherefore+have+our+teachers+been+so+long+silent%2C+Why+had+we+not+heard+of+this+sooner%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Stoddon%2C+An+Essay+on+a+Question+Relating+to+Divine+Worship+viz.+Whether+it+be+Contrary+to+the+Apostolical+Laws+of+Decency+%26+Reverence+for+a+Man+to+have+his+Head+Covered+in+the+Time+%26+Place+of+God%E2%80%99s+Solemn+Public+Worship%3F%3A+Affirmative+%28London%3A+Maxwell%2C+1682%29+Stoddon+was+an+English%2C+congregationalist+minister.%2C+pp.+40-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3feea598b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3feea598b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=2.%20I%20hope%20it%20will%20be,we%20not%20heard%20of%20this%20sooner&amp;text=2.%20I%20hope%20it%20will%20be%20granted%20me&amp;text=Why%20had%20we%20not%20heard%20of%20this%20sooner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§10. Of the vices contrary to children’s reverend gesture towards their parents. … 2. Disdainful stateliness, when they think [it too] much to stand bare-headed any while in their parents’ presence. It falls out many times, that when parents and children are together before their betters, they will show more reverence than these: for the father will stand, and be uncovered, when the son sits down and puts on his hat, upon conceit that his father does more reverence than is meet: but if it were so, yet the son for the father’s sake should stoop somewhat the lower.</p></blockquote>

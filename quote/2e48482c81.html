<main class="wrap"><figure class="quote" id="q-2e48482c81" data-kw="">
<blockquote><p>Whatsoever, therefore, is spoken of God, is not God; but serves rather to help our weak understanding, to conceive in our reason, and to utter in our speech, the majesty of his divine nature, so far as he hath vouchsafed to reveal himself to us in his word.

1. All the attributes of God belong to every of the three Persons, as well as to the essence itself, with the limitation of a personal propriety. As the mercy of the Father is mercy begetting, the mercy of the Son is mercy begotten, the mercy of the Holy Ghost is mercy proceeding: and so of the rest.

2. The essential attributes of God differ not from his essence; because they are so in the essence, that they are the very essence itself. In God, therefore, there is nothing which is not either his essence or person.

3. The essential attributes of God differ not essentially or really one from another, because whatsoever is in God, is one most simple essence, and admits no division, but only in our reason and understanding, which being not able to know earthly things by one simple act, without the help of many distinct acts, must of necessity have the help of many distinct acts to know the incomprehensible God.

Therefore, to speak properly, there are not in God many attributes, but one only, which is nothing else but the Divine Essence itself, by what attribute soever you call it. But in respect of our reason, they are said to be so many different attributes; for our understanding conceives by the name of mercy, a thing different from that which is called justice. The essential attributes of God are not therefore really separate.

4. The essential attributes of God are not parts or qualities of the divine essence, nor accidents in the essence, nor a subject, but the very whole and entire essence of God; so that every such attribute is not aliud et aliud, another and another thing, but one and the same thing. There are therefore no quantities in God, by which he may be said to be so much and so much; nor qualities, by which he may be said to be such and such; but whatsoever God is, he is such and the same by his essence. By his essence he is wise, and therefore wisdom itself; by his essence he is good, and therefore goodness itself; by his essence he is merciful, and therefore mercy itself; by his essence he is just, and therefore justice itself, &amp;c.

In a word, God is great, without quantity; good, true, and just, without quality; merciful, without passion; an act, without motion; everywhere present, without sight; without time, the first and the last; the Lord of all creatures, from whom all receive themselves, and all the good they have, yet neither needeth nor receiveth he any increase of goodness or happiness from any other.

This is the plain description of God, so far as he hath revealed himself to us in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 23-24.</span></figcaption>

<blockquote><p>This volume was inspired by Etienne Gilson’s query, made in the early 1950s, as to why medieval authors spoke of God’s being as infinite, a statement found neither in Judaeo-Christian scriptures nor in Greek philosophy… It concludes that infinity is predicated of God not only extrinsically, but also intrinsically: His very being is infinite – a predication resting on an Aristotelian theory of act/potency or on a Platonic version of participation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leo-sweeney.html">Leo Sweeney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Infinity in Greek &amp; Medieval Thought Ref</cite></span></figcaption>

<blockquote><p>A fallacy of accident is also committed by those who claim that if God were immutable, then He could not be said to have life. For while the living things of our experience do indeed change in various ways (by growing, taking in nutrients, moving about, learning, and so forth), it doesn’t follow that any possible living thing must undergo change. What is essential to a thing’s being alive, at least on the traditional Aristotelian account of life, is that the thing operate in the basis of an internal principle, as opposed to being entirely dependent on external forces. Hence, an animal can be said to be alive insofar as at least much of what it does flows from its own nature, whereas a stone is not alive because it is entirely passive, and can do things (such as breaking a window) only insofar as other things act upon it… Now, as the uncaused cause of all things, God certainly acts in a way which does not require his being acted upon by anything else. Hence, He can certainly be said to have life. Indeed, unlike other living things (all of which to some extent, even if not entirely, require being acted upon by other things, insofar as they need to eat, breathe, and so forth), God acts in a way which is completely independent of anything else. Hence, He can be said to have life in the fullest way possible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“A fallacy of accident is also committed by those who claim that if God were immutable, then He could not be said to have life. For while the living things of our experience do indeed change in various ways (by growing, taking in nutrients, moving about, learning, and so forth), it doesn’t follow that any possible living thing must undergo change. What is essential to a thing’s being alive, at least on the traditional Aristotelian account of life, is that the thing operate in the basis of an internal principle, as opposed to being entirely dependent on external forces. Hence, an animal can be said to be alive insofar as at least much of what it does flows from its own nature, whereas a stone is not alive because it is entirely passive, and can do things (such as breaking a window) only insofar as other things act upon it… Now, as the uncaused cause of all things, God certainly acts in a way which does not require his being acted upon by anything else. Hence, He can certainly be said to have life. Indeed, unlike other living things (all of which to some extent, even if not entirely, require being acted upon by other things, insofar as they need to eat, breathe, and so forth), God acts in a way which is completely independent of anything else. Hence, He can be said to have life in the fullest way possible.”

— Edward Feser, Five Proofs of the Existence of God, (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+fallacy+of+accident+is+also+committed+by+those+who+claim+that+if+God+were+immutable%2C+then+He+could+not+be+said+to+have+life.+For+while+the+living+things+of+our+experience+do+indeed+change+in+various+ways+%28by+growing%2C+taking+in+nutrients%2C+moving+about%2C+learning%2C+and+so+forth%29%2C+it+doesn%E2%80%99t+follow+that+any+possible+living+thing+must+undergo+change.+What+is+essential+to+a+thing%E2%80%99s+being+alive%2C+at+least+on+the+traditional+Aristotelian+account+of+life%2C+is+that+the+thing+operate+in+the+basis+of+an+internal+principle%2C+as+opposed+to+being+entirely+dependent+on+external+forces.+Hence%2C+an+animal+can+be+said+to+be+alive+insofar+as+at+least+much+of+what+it+does+flows+from+its+own+nature%2C+whereas+a+stone+is+not+alive+because+it+is+entirely+passive%2C+and+can+do+things+%28such+as+breaking+a+window%29+only+insofar+as+other+things+act+upon+it%E2%80%A6+Now%2C+as+the+uncaused+cause+of+all+things%2C+God+certainly+acts+in+a+way+which+does+not+require+his+being+acted+upon+by+anything+else.+Hence%2C+He+can+certainly+be+said+to+have+life.+Indeed%2C+unlike+other+living+things+%28all+of+which+to+some+extent%2C+even+if+not+entirely%2C+require+being+acted+upon+by+other+things%2C+insofar+as+they+need+to+eat%2C+breathe%2C+and+so+forth%29%2C+God+acts+in+a+way+which+is+completely+independent+of+anything+else.+Hence%2C+He+can+be+said+to+have+life+in+the+fullest+way+possible.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God%2C+%28Ignatius+Press%2C+2017%29%2C+%E2%80%98The+Divine+Attributes%E2%80%99%2C+%E2%80%98Immutability%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2625f706ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2625f706ef.html">Permalink</a><a class="src" href=

<main class="wrap"><figure class="quote" id="q-d3ee81f1a3" data-kw="">
<blockquote><p>Forasmuch as we have been freed from the teaching of Moses through Christ the Lord, so that it is no longer necessary for us to observe the civil decrees of the law of Moses, namely, in terms of the way and the circumstances in which they are described, nevertheless, insofar as the substance and proper end of these commandments are concerned, and especially those which enjoin the discipline that is necessary for the whole commonwealth, whoever does not reckon that such commandments are to be conscientiously observed is certainly not attributing to God either supreme wisdom or a righteous care for our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Reign of Christ HT: Rev. Shawn Mathis | Book 2, ch. 60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1926b08cf8" data-kw="">
<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.”

</figure><figure class="quote" id="q-d097d6f387" data-kw="">

</figure><figure class="quote" id="q-74b996f70a" data-kw="">
<blockquote><p>Since we have need of civil laws and the power of punishing, it will be wisest not to contemn those given by Moses; but seriously rather to consider what the meaning of God was in them, what he chiefly required, and how much it might be to the good of every nation, if they would borrow thence their manner of governing the commonwealth; yet freely all things and with the Spirit of Christ. For what Solon or Plato, or Aristotle, what lawyers or Caesars could make better laws than God? And it is no light argument, that many magistrates at this day do not enough acknowledge the Kingdom of Christ, though they would seem most Christian, in that they govern their States by laws so diverse from those of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 5:19, as quoted by John Milton, A Complete Collection of the Historical, Political &amp; Miscellaneous Works of John Milton, vol. 1, p. 394</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e09efd57c8" data-kw="">
<blockquote><p>In this treatise Hemmingsen [a Lutheran] argues that all particular rules of ethical conduct can be derived from immutable axioms or first principles. Though moral philosophy works according to its own rules, Hemmingsen shows that its conclusions, far from being at odds with the divine revelation of the moral law, are identical with the ethical commandments of Scripture. Thus Hemmingsen includes a section on the Decalogue, along with a lengthy account of the traditional cardinal virtues, supported by a myriad of quotations from classical Greek and Roman sources. This important treatise looks both backward to classical and medieval philosophy and forward to developments in the seventeenth century and beyond.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Law of Nature: A Demonstrative Method ed. &amp; trans. Hutchinson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

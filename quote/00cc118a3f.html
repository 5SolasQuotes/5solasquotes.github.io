<blockquote><p>The puritans rested the case against distinctive vestments on the following grounds. First and foremost, the insistence upon a particular vesture was an infringement of Christian liberty; the church which had been freed by Christ form the bondage of the law was now attempting to infringe the crown rights of Christ the Redeemer by introducing new sartorial [relating to dress] burdens on the conscience.¹ This was especially foolish when the Anglicans themselves admitted that such matters were adiaphora, or in the real of indifferent things. ¹ Cf. A Parte of a Register, p. 41: “if it be abolished and Christ be come in stead, then a great injury is done to Christ for many causes. The one is, that those ceremonies which Christ by his passion did abolish, should in contempt of Him and his passion be taken again.</p></blockquote>

</figure><figure class="quote" id="q-2ec377fb86" data-kw="">
<blockquote><p>The Genevan practice of wearing black academic gowns, white preaching bands, and black caps deliberately indicated that ministers were teachers of the Word rather than sacerdotal mediators. There clothes were not considered clerical vestments but were standard attire for clergy to be worn during and outside public worship (Maetsch, Calvin’s Company of Pastors, 19; William D. Maxwell, John Knox’s Genevan Service Book, 1556 (Westminster: Faith Press, 1965), 210-213). Lavater’s Short Work on Rites and Regulations described a similar approach to clerical attire in Zurich; however, the clerical dress was more informal than Calvin’s: clergy were to ‘wear ordinary, yet respectable clothing (as other respectable citizens do), not theatrical clothing.’ John Knox held a similarly minimalist approach among the English exiles in Frankfurt, signaling his displeasure at Cranmer’s retention of the surplice. In a sermon on Noah’s drunkenness and the subject of what should or should not be covered up, he touched upon the sensitive matter of English cleric John Hooper’s refusal to wear clerical vestments (Jane Dawson, John Knox (New Haven, CT: Yale University Press, 2016), 101). Earlier in 1550, Hooper refused to be consecrated as bishop, partly on the grounds of what he perceived to be unreformed vestments (‘those Aaronic habits’). (John Hooper to Heinrich Bullinger, June 29, 1550. See Hastings Robinson, Original Letters Relative to the English Reformation, 2 vols. (Cambridge: Cambridge University Press, 1846-1847), 1:87) In reply, both Martin Bucer and Peter Martyr Vermigli refuted his position on the basis that vestments were adiaphorus [indifferent]. Vermigli made the slightly backhanded remark that ‘indifferent things cannot corrupt those that are of a pure mind and sincere conscience in their doings.’ (Correspondence between Bucer, Martyr and Hooper in George Cornelius Gorham, Gleanings of a Few Scattered Ears During the Period of the Reformation in England (London: Bell and Daldy, 1857). Bucer and Martyr’s replies to Hooper were also used by Archbishop Parker [who sought to universally enforce such clerical dress] in response to the Vestarian Controversy under Queen Elizabeth I. Quotes are in Matthew Parker, A Brief Examination for the Tyme…, (London: Richard Jugge, 1566), RSTC 10387, sig. C.2r.) Hooper–helped by a spell in prison–begrudingly took the advice on board and was consecrated Bishop of Gloucester later that year. Thus, when Knox and his colleagues left the English congregation at Frankfurt for Calvin’s Geneva, they found the clerical attire more congenial to their approach. However, when the Genevan exiles returned home after the death of Queen Mary, they had mixed success in implementing their desired clerical attire. Knox returned to Scotland where the Genevan gown became the norm, whereas Christopher Goodman and others returned to England were vestments were retained (indeed, to the 1549 standards). The controversy over vestments was reignited and contributed to the production of the Middelburg Liturgy (1586) by the English Puritans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-earngey.html">Mark Earngey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Soli Deo Gloria</cite>, (New Growth, 2017), pp. 42-43</span></figcaption>

<blockquote><p>§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 9 in Remains (London: Parkhurst, 1684), pp. 219-20</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.”

— John Corbet, Of Divine Worship, pt. 3, sect. 9 in Remains (London: Parkhurst, 1684), pp. 219-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A79.+Of+Wearing+the+Surplice+As+touching+the+surplice%2C+the+wearing+of+a+garment+of+this+or+that+color%2C+or+of+this+or+that+form+or+shape+in+divine+worship%2C+is+neither+commanded+nor+forbidden+of+God.+But+though+as+to+its+material+it+may+be+indifferent%2C+yet+as+to+its+formal+state%2C+it+may+not+be+also.+If+the+surplice+be+made+a+holy+garment%2C+as+the+priestly+garments+under+the+law%2C+if+it+be+used+to+make+him+that+wears+it+more+holy%2C+and+the+service+more+acceptable+for+obtaining+divine+grace%2C+it+is+superstitious.+If+it+be+made+a+symbol+of+sanctity%2C+it+may+raise+a+scruple.+But+a+distinctive+habit+%5Bgarment%5D+of+a+minister%2C+whether+used+as+his+ordinary+garb%2C+or+only+in+sacred+administrations%2C+I+cannot+see+to+be+superstitious+or+forbidden.+But+a+habit+that+is+not+superstitious+may+be+too+gaudy+or+too+theatrical.+What+is+the+formal+state+or+reason+of+the+surplice+is+to+be+judged+by+the+authoritatively+declared+meaning+of+those+that+enjoin+it%2C+touching+its+end+and+use.+But+whatsoever+the+nature+and+reason+of+this+garment+be%2C+I+cannot+approve+the+enforcing+of+it+upon+such+ministers+and+in+such+congregations+to+whom+by+reason+of+invincible+prejudice%2C+it+is+either+odious+or+ridiculous%2C+yea+though+their+prejudice+be+supposed+culpable.+Wise+rulers+give+way+to+the+immovable+averseness+of+inferiors+in+things+unnecessary+and+of+no+great+moment%2C+though+of+good+intention.+And+as+I+should+be+loath+to+wear+a+fool%E2%80%99s+coat+in+divine+service+upon+the+command+of+a+superior%2C+so+I+should+be+loath+to+appear+in+a+congregation+in+a+habit+which+I+knew+would+be+to+them+as+ridiculous+as+a+fool%E2%80%99s+coat%2C+though+it+were+their+great+folly+so+to+think.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%2C+pt.+3%2C+sect.+9+in+Remains+%28London%3A+Parkhurst%2C+1684%29%2C+p <blockquote><p>The dress of the Ministers in the English Church at Geneva [under John Knox] is a matter which is perplexing, for there is no evidence available indicating precisely what was the custom. … [John] Paullain [1517–1565, an English reformer], in his ‘Ad lectorem candidum’ (Lit. sac., P, Q) [‘To the Bright Reader’, in Liturgia Sacra, seu Ritus Ministerii in Ecclesia Peregrinorum… 1551/4], on the other hand, states quite definitely that vestments are not worn in his congregation. He urges that the New Testament does not prescribe a Minister’s apparel, and that a shepherd is not known to his sheep by his garb but by his call to them, and he thinks it sufficient that a Minister should be dressed modestly and soberly, with an absence of all pomp and arrogance. Further, he regards vestments as an incitement to superstition because of the Roman custom of blessing the garments. Thus he thought that in this as in other matters the Reformed Church should be content with the utmost simplicity. In England the Puritan party objected strenuously to all vestments. As early as 1562 request was made to Convocation ‘that the use of copes and surplices… be taken away; so that all ministers in their ministry use a grave, comely, and side-garment, as commonly they do in preaching’ and ‘that the ministers of the word and sacraments be not compelled to wear such gowns and caps, as the enemies of Christ’s gospel have chosen to be the special array of their priesthood’ ([John] Strype, Annals, Oxford ed., 1824, vol. i., pt. ii. 501). And in the same period we find the bishops enforcing the cassock and gown and forbidding the Puritan custom of preaching in what Bishop Duppa called ‘a riding or ambulatory Cloake’ (Rit. Com. Rep. ii. 577). The objections in these passages are against all gowns… Certainly [Myles] Coverdale [1488–1569] objected to all gowns, as we see by his letter to Farel in 1556: ‘Our affairs are not altered for the better, but alas! are sadly deteriorated. For it is now settled and determines… that out of doors must be worn the square cap, bands, a long gown and tippet; while the white surplice and cope are to be retained in divine service’ (Parker Soc. Zurich Letters, p. 121, Let. 50). … This brief review of the early evidence in Strasburg, Frankfort [Germany], Geneva, England and Scotland, shows that there appears to have been no practice that was agreed upon by all who followed the Calvinistic Reformation, and as regards the English Church of Geneva no accurate conjecture can be made. It is probable that the Ministers there adopted Calvin’s practice and wore the black gown, with cassock, bands, and scarf; but there can be no certainty.</p></blockquote>

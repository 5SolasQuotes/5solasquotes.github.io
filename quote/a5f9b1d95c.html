<main class="wrap"><figure class="quote" id="q-a5f9b1d95c" data-kw="">
<blockquote><p>No man can withdraw himself from the stated religious services of the community of which he is a member, without serious injury to his personal religious life. It is not without significance that the apostolic writer couples together the exhortations, “to hold fast the confession of our hope, that it waver not”, and “to forsake not the assembling of ourselves together.” When he commands us not to forsake “the assembling of ourselves together,” he has in mind, as the term he employs shows, the stated, formal assemblages of the community, and means to lay upon the hearts and consciences of his readers their duty to the church of which they are the supports, as well as their duty to themselves.

And when he adds, “As the custom of some is,” he means to put a lash into his command. We can see his lip curl as he says it. Who are these people who are so vastly strong, so supremely holy, that they do not need the assistance of the common worship for themselves; and who, being so strong and holy will not give their assistance to the common worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Religious Life of Theological Students in Union Seminary Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d554ae102" data-kw="">
<blockquote><p>Let every man walk within the compass of his calling. Whatsoever lies not in us to reform, it shall be our zeal and piety to tolerate, and with patience to forbear, especially in things of this nature, which concern not so much the outward communion with God or man, essentially required in a visible state, as the due ordering of business in the said communion, wherein there be many superfluities and defects, salva tamen Ecclesia; yea, and such a Church notwithstanding, as wherein the best and truest members (circumstances considered) may have more cause to rejoice than to grieve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, (d. 1617), ch. 2, pp. 297-98</span></figcaption>

</figure><figure class="quote" id="q-c218a57fc2" data-kw="">
<blockquote><p>Yea, in those confessions, those passionate psalms made for him, we find him acknowledging of sin as his own. This will appear by some passages in those psalms which are prophetically made of Christ, and utter the inward addresses of his soul unto his Father. And of all the psalms, or other prophecies of this nature, there is no one except the twenty-second, which can challenge more passages in so small a space, applied expressly unto Christ in the New Testament, than the sixty-ninth psalm. In ver. 4 we have it, ‘They hated me without a cause.’ This we find applied by Christ himself, as prophesied of himself, John xv. 25. Again, we have it ver. 9 of that psalm, ‘The zeal of thine house hath eaten me up.’

This you have in like manner, John ii. 19, applied unto Christ. Moreover, the next words of that 9th verse, ‘The reproaches of them that reproached thee are fallen upon me.’ Lo, you have them applied by Paul as expressly unto Christ, Rom. xv. 3. Again, that passage, ver. 21, ‘They gave me gall for my meat, and in my thirst they gave me vinegar to drink;’ you know both the story and the application of it by the evangelists, Matthew, Mark, and John. Then that other passage that follows, ‘Let their table be made a snare,’ you have it applied accordingly unto the Jews that crucified him, for their crucifying of him, Rom. xi. 9.

Now then, so many of these being so applied, why should not those others also be so applied? as when it is said, ver. 4, 5, ‘Then I restored that which I took not away; O God, thou knowest my foolishness, and my guiltiness is not hid from thee.’ How fitly do these words express the imputation of sin to him. It was a proverbial speech, when a man suffered innocently as to his own person, to say that ‘He restored that which he took not,’ and so Christ on the cross is brought in here speaking. For as Isaiah tells us, ‘He bore our sins;’ with Oh in the next verse of the psalm he confesseth as his own, having taken them upon him. ‘O God, thou knowest my foolishness’ (that is my sin, as foolishness it is usually taken), ‘and my sins are not hidden from thee.’ Which is plainly in other words that which the apostle says of him, 2 Cor. v., ‘He that knew no sin was made sin.’

The like you have in the fortieth psalm, ‘Sacrifice and burnt-offering thou wouldst not; Lo I come,’ &amp;c., ver. 6, 7, which how it is applied to Christ you may read in Heb. x, neither can it well be applied to any other. Yet, ver. 12, he says, ‘My iniquities take hold of me.’ He calls them his, not by perpetration, but by a voluntary assumption, and by imputation, reckoning them as his. So Isaiah liii. 6, ‘He laid on him the iniquities of us all.’ In the Hebrew it is, ‘He caused to meet in him the iniquities of us all.’ He was made the great ocean, into which the guilt of all our sins did run.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christ the Mediator</cite>, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 183-84.</span></figcaption>

<blockquote><p>Whenever someone has a serious problem and they look to other people for help, they often get told that “everything is going to be fine.” The Church of Ireland theologian, George Salmon (1819-1904) notes that to do so is to heal the wounds of others lightly:

Such comforting assurances are often easily given because they cost so little. They relieve him who makes them from the burden of a painful demand on him for sympathy. One is not always in the mood to mourn with those who mourn, or even to seem to mourn, and so it is pleasant to be able to persuade oneself that the need for such an effort has not arisen and may never arise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cathedral and University Sermons</cite>, (2nd edn, London: John Murray, 1901), p. 137.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whenever someone has a serious problem and they look to other people for help, they often get told that “everything is going to be fine.” The Church of Ireland theologian, George Salmon (1819-1904) notes that to do so is to heal the wounds of others lightly:

Such comforting assurances are often easily given because they cost so little. They relieve him who makes them from the burden of a painful demand on him for sympathy. One is not always in the mood to mourn with those who mourn, or even to seem to mourn, and so it is pleasant to be able to persuade oneself that the need for such an effort has not arisen and may never arise.”

— George Salmon, Cathedral and University Sermons, (2nd edn, London: John Murray, 1901), p. 137.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhenever+someone+has+a+serious+problem+and+they+look+to+other+people+for+help%2C+they+often+get+told+that+%E2%80%9Ceverything+is+going+to+be+fine.%E2%80%9D+The+Church+of+Ireland+theologian%2C+George+Salmon+%281819-1904%29+notes+that+to+do+so+is+to+heal+the+wounds+of+others+lightly%3A%0A%0ASuch+comforting+assurances+are+often+easily+given+because+they+cost+so+little.+They+relieve+him+who+makes+them+from+the+burden+of+a+painful+demand+on+him+for+sympathy.+One+is+not+always+in+the+mood+to+mourn+with+those+who+mourn%2C+or+even+to+seem+to+mourn%2C+and+so+it+is+pleasant+to+be+able+to+persuade+oneself+that+the+need+for+such+an+effort+has+not+arisen+and+may+never+arise.%E2%80%9D%0A%0A%E2%80%94+George+Salmon%2C+Cathedral+and+University+Sermons%2C+%282nd+edn%2C+London%3A+John+Murray%2C+1901%29%2C+p.+137.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4bcef8abf1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4bcef8abf1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/12/23/george-salmon-on-healing-wounds-lightly/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

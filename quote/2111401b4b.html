<blockquote><p>Blessed are they that mourn: for they shall be comforted. Matt. v. 4.

THE Master, when he said this, was fulfilling the prophecy, — “He hath sent me to bind up the broken-hearted” (Isaiah Ixi. 1). He was speaking in the same line as when he said, “Come unto me, all ye that labour and are heavy laden, and I will give you rest!” (Matt. xi. 28). The words reach beyond the mourners simply over sin. They indeed are blessed in their consciousness of pardon and safety, but there is more than that here. He, the infinite Saviour, came to bring the kingdom of heaven, God’s reign in the soul. That is a kingdom of peace. The believer comes to him and is blessed in the coming. He comes with his heart borne down with earthly sorrow. Where else, to whom else in all the world can he go? Earth cannot help him. He comes to a sympathizing Saviour (Heb. iv. 15), and he is in a place of calm. He hardly knows why or how, but peace and rest are in his heart, and they are blessedness. That is for today. But the “shall be” looks forward to a time when God shall wipe all tears away (Isaiah xxv. 8; Rev. vii. 17; xxi. 4). The anticipation of future blessedness touches and lightens the present sorrow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-aikman.html">William Aikman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God shall wipe away all tears from their eyes in R. M. Offord (ed.), Life’s Golden Lamp for Daily Devotional Use. A Treasury of Texts from the very words of Christ with comments thereon by as many Ministers of the Gospel as there are days in the Year</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d81b301a0" data-kw="">
<blockquote><p>Do not imagine that no one can please God while he is engaged in military service. Among such was holy David to whom the Lord gave such high testimony. Among such were many just men of that time. Among such, also, was that centurion who said to the Lord: ‘I am not worthy that thou shouldst enter under my roof, but only say the word and my servant shall be healed. For I also am a man, subject to authority, having under me soldiers, and I say to this one: Go, and he goeth, and to another: Come, and he cometh; and to my servant: Do this, and he doth it’; of him the Lord said: ‘Amen I say to you I have not found so great faith in Israel.’ Among such, also, was that Cornelius to whom the angel was sent, who said: ‘Cornelius, thy prayer is heard and thy alms are accepted,’ when he advised him to send to the blessed Apostle Peter, to hear from him what he ought to do. And to summon the Apostle to him he sent a religious soldier.

Among such, also, were those who came for baptism to John, the holy precursor of the Lord and friend of the bridegroom, of whom the Lord said: ‘There hath not arisen among them that are born of women a greater one than John the Baptist.’ When they asked him what they ought to do, he answered them: ‘Do violence to no man, neither calumniate any man, and be content with your pay.’ Obviously, he did not forbid them to serve in the army when he commanded them to be satisfied with their pay.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Boniface, c. 418 (no. 189) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), p. 268.</cite></span></figcaption>

</figure><figure class="quote" id="q-9adb5fcbc0" data-kw="">
<blockquote><p>What politic laws are to be allowed? Those which are agreeable to the law of nature (whereof the Decalogue is an abridgment) and composed for the safety of the people: or those which do not swerve from the eternal rule of the honoring of God and loving our neighbor, and are made by a lawful magistrate. Those that are made after any other manner, they are no better then tyrannical bonds, Isa. 10:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Theology</cite>, p. 892</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-98ced36c4d" data-kw="">
<blockquote><p>This is to be observed in all precepts, as well ceremonial, as judicial, and moral. When two precepts of God seem one to be repugnant to an other, so as the one is a hindrance to the other, that they cannot both at one time be observed; yea rather, it is necessary that the one of them for the time being be omitted: then, that which shall be judged weightiest and greatest, must be retained. But yet in the meantime, that other, which is reckoned to be less and lighter, is not violated; because in the same there is nothing done against the will of God.

The law commandeth, that every one should have respect to the safety of his neighbour: and if one be a magistrate, that he by arms defend his city. The same law commandeth, that We must not labour on the sabbath day: the enemy besiegeth the city, and that on the sabbath day; because he knoweth that that law was laid upon the citizens. Here seemeth a contrariety of the precepts: for on the one part, safety must be maintained; and on the other part, the sabbath must be observed. The Maccabees judged it best to fight, because the safety of the common-weal seemed greater and better than the ceremony of the sabbath.

Also the law is, that we should feed the hungry: and an other law commandeth, that the shew-bread should be eaten of none, but of the priests. David came hungry unto the priest, nothing he had but the shew-bread: wherefore here cometh together two contrary precepts. The wise priest followeth and observeth that, which is the worthier; namely, to feed the hungry: he brought out the shew-bread, and helped David. There is also another law, that we must furnish the prince with armour; for he is to be holpen by his subjects: and contrariwise, it is commanded, that things consecrated unto God must not be translated unto other uses. Dauid the king’s son in law, which warred for him as his general lieutenant, was then unarmed: the priest had no weapon at hand, but the sword of Goliath. Here be two precepts, which seem contrary; the priest followeth the one, and delivereth the sword unto the magistrate: because he judged it better, to arm the magistrate, than to observe the ceremony.

Also there is a law, that the church must not be deprived of ministers, so as it should be destitute of them: and Paule hath another law, that a novice or man newly entered into religion, should not be a bishop. The church of Milan was much troubled, because it could not find a meet bishop, that as well was free from the heresy of Arius, as also that had great authority and learning given him of God: only there was Ambrose; but yet a novice, and newly come to the faith. Here are two laws met, in shew contrary one to another; but it was meet for the lesser law to give place to the greater: for Christ so taught, when by the sentence of the prophet he saith; I will have mercy, &amp; not sacrifice. Howbeit, he meaneth not, that he will not have sacrifice: but that, if two commandments meet together, whereof the one belongeth unto mercy, and the other unto sacrifice; he testifieth, that he had rather have mercy, than sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes:</cite>, The Common Places, trans. Anthony Marten (2nd edn, London, 1583), 2.3.13.</span></figcaption>

C+it+is+commanded%2C+that+things+consecrated+unto+God+must+not+be+translated+unto+other+uses.+Dauid+the+king%E2%80%99s+son+in+law%2C+which+warred+for+him+as+his+general+lieutenant%2C+was+then+unarmed%3A+the+priest+had+no+weapon+at+hand%2C+but+the+sword+of+Goliath.+Here+be+two+precepts%2C+which+seem+contrary%3B+the+priest+followeth+the+one%2C+and+delivereth+the+sword+unto+the+magistrate%3A+because+he+judged+it+better%2C+to+arm+the+magistrate%2C+than+to+observe+the+ceremony.%0A%0AAlso+there+is+a+law%2C+that+the+church+must+not+be+deprived+of+ministers%2C+so+as+it+should+be+destitute+of+them%3A+and+Paule+hath+another+law%2C+that+a+novice+or+man+newly+entered+into+religion%2C+should+not+be+a+bishop.+The+church+of+Milan+was+much+troubled%2C+because+it+could+not+find+a+meet+bishop%2C+that+as+well+was+free+from+the+heresy+of+Arius%2C+as+also+that+had+great+authority+and+learning+given+him+of+God%3A+only+there+was+Ambrose%3B+but+yet+a+novice%2C+and+newly+come+to+the+faith.+Here+are+two+laws+met%2C+in+shew+contrary+one+to+another%3B+but+it+was+meet+for+the+lesser+law+to+give+place+to+the+greater%3A+for+Christ+so+taught%2C+when+by+the+sentence+of+the+prophet+he+saith%3B+I+will+have+mercy%2C+%26+not+sacrifice.+Howbeit%2C+he+meaneth+not%2C+that+he+will+not+have+sacrifice%3A+but+that%2C+if+two+commandments+meet+together%2C+whereof+the+one+belongeth+unto+mercy%2C+and+the+other+unto+sacrifice%3B+he+testifieth%2C+that+he+had+rather+have+mercy%2C+than+sacrifice.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Loci+Communes%3A%2C+The+Common+Places%2C+trans.+Anthony+Marten+%282nd+edn%2C+London%2C+1583%29%2C+2.3.13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F98ced36c4d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/98ced36c4d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/12/23/peter-martyr-vermigli-on-what-to-do-when-two-duties-appear-to-be-in-conflict/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-3a1e1b611b" data-kw="">
<blockquote><p>I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not.</p></blockquote>

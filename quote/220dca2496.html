<main class="wrap"><figure class="quote" id="q-220dca2496" data-kw="">
<blockquote><p>See how it is that we do not justify men before God by works, but say, that all who are of God are regenerated and made new creatures, so that they pass from the kingdom of sin into the kingdom of righteousness. In this way they make their calling sure, and, like trees, are judged by their fruits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f5f000b74" data-kw="">
<blockquote><p>But if any one prefers the other reading, it comes to the same thing, &quot;Shew me by works thy faith;&quot; for since it is not an idle thing, it must necessarily be proved by works. The meaning then is, &quot;Unless thy faith brings forth fruits, I deny that thou hast any faith.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, James 2:18</span></figcaption>

</figure><figure class="quote" id="q-d163ded14a" data-kw="">
<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>

— John Calvin, Institutes of the Christian Religion, 3.14.17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%20if%20we%20attend%20to%20the%20four%20kinds%20of%20causes%20which%20philosophers%20bring%20under%20our%20view%20in%20regard%20to%20effects%2C%20we%20shall%20find%20that%20not%20one%20of%20them%20is%20applicable%20to%20works%20as%20a%20cause%20of%20salvation.%20The%20efficient%20cause%20of%20our%20eternal%20salvation%20the%20Scripture%20uniformly%20proclaims%20to%20be%20the%20mercy%20and%20free%20love%20of%20the%20heavenly%20Father%20towards%20us%3B%20the%20material%20cause%20to%20be%20Christ%2C%20with%20the%20obedience%20by%20which%20he%20purchased%20righteousness%20for%20us%3B%20and%20what%20can%20the%20formal%20or%20instrumental%20cause%20be%20but%20faith%3F%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.14.17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd163ded14a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d163ded14a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-5c90d8b706" data-kw="">
<blockquote><p>We are justified not without works yet not through works, since in our sharing in Christ, which justifies us, [progressive] sanctification is just as much included as [imputed] righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.16.1</span></figcaption>

</figure><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7dcd05a912" data-kw="">
<blockquote><p>THE Unchangeableness of God is one of those Perfections of his, whereby he is, in a peculiar manner, distinguished from the Creatures. The Creatures are made up of Changes. Their Beings, Life, Conditions, are subject to many Changes. But God knows none of these Changes, his Being is most immutable, his Life the most even, constant, Uniform, serene Life; his Happiness at all times alike and the Same. God doth always abide in the same likeness, says one of the Ancients, with him there is no Variableness nor shadow of Change. Now there is an instinct in us, whereby we are carried out to desire unchangeableness. Everything doth naturally desire its Perfection; Man therefore being a reasonable Creature, finding himself subject to many Changes, longs after a perfect State, which is to be Unchangeable, he would fain come to an Unchangeable Life, to an Unchangeable Happiness. Now what we cannot find, or attain unto in our selves, we should aspire after, by attaining Union and Conjunction with our Maker.

Everything is made perfect by reaching or attaining its First Cause or Principle. God is the Fountain of Life, the Fountain of Unchangeableness, so far as unchangeableness is communicable to the Creatures. Indeed, in a strict and proper sense Unchangeableness is one of the Incommunicable Attributes of God, none but God is simply and absolutely Unchangeable, or can be so. It implies a Contradiction to suppose a Creature, and that Creature intrinsically and in its own Nature, not to be under a possibility of Change; but yet after a sort, the Creatures may be made Unchangeable, in having an Unchangeable Life, an Unchangeable Happiness given to them by some kind of participation of God, who is the chief Good, and who hath all Life and Happiness in himself.

Thus the holy Angels, who are not simply and absolutely unchangeable in themselves, do yet enjoy an unchangeable Life and Happiness, in way of donation and Communication, by the sight of God, and Communion with God. We should therefore aspire after the sight of God, and press after the most perfect adherence to him. God only is the Centre of Unchangeableness, and by fixing our hearts in him, we shall, after a sort, become unchangeable. Join thy heart to Eternity, (says Austin [Augustine]) and thou thy self shalt be eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rowe.html">John Rowe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Edward Pearse, A beam of divine glory, or, The unchangeableness of God opened, vindicated, and improved: whereunto is added, The soul’s rest in God. By Edward Pearse. To which is prefixed the author’s last letter, written in the time of his sickness to some peculiar friends</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e87035f18" data-kw="">
<blockquote><p>The power of God in its second meaning, δύναμις (dunamis) in Greek, and potentia in Latin, refers to the power and strength of God whereby He is able to execute and accomplish everything which is in agreement with His character and His truth—also to create whatever is conceivable and to do whatever He wishes to do. From stones He is able to raise up children unto Abraham (Matthew 3:9), that is, to create human beings from a lump of clay as He did in the beginning, and make such human beings partakers of both the faith and life of Abraham. God could even create thousands of worlds. In a word, God’s power is unlimited.

One could imagine the creation of many things which would be contrary to the nature and truth of God. One could speculate about imaginary things which bear no resemblance to a creature. To relate this to the omnipotence of God and to ask whether God would be able to perform such things, is to entertain thoughts about God which are void of reverence and godly fear. Whatever is contradictory to the nature and truth of God, as well as contrary to the essential nature of a creature, is no reflection upon the power of God. Far be it from us to attribute this to the omnipotent and holy God. “Far be it from God, that He should do wickedness; and from the Almighty, that He should commit iniquity” (Job 34:10).

God can neither deny Himself (2 Timothy 2:13), nor can He lie or deceive (Titus 1:2). “It was impossible for God to lie” (Hebrews 6:18). Even though God has eternally been capable of creating a world, it does not follow that the world could have existed eternally. “Yes” and “no” are at all times opposites and cannot be simultaneous realities. One and the same body, one and the same man, cannot be simultaneously present at many places which are far removed from each other. These and a thousand-fold more things do not appertain to omnipotence.

Nevertheless, we maintain that God by His omnipotence is able to accomplish whatever He will even beyond what He has willed, as well as whatever He would will. His arm is not shortened and therefore He is called the Almighty. “I am the Almighty God” (Genesis 17:1); “When the Almighty was yet with me” (Job 29:5); “… saith the Lord Almighty” (2 Corinthians 6:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 131-32.</span></figcaption>

<blockquote><p>Now, in the cross of Christ, all the divine attributes are perfectly harmonized. Here it is, and only here, that “mercy and truth have met together, righteousness and peace have kissed each other.” By the cross, every attribute of the Deity is shown immaculate, and beaming with a splendour nowhere else to be seen.

The highest display of the glory of God ever made to the universe, was made by the cross of Christ. This glory is here seen, not only to be consistent with the salvation of penitent offenders, but to shine the brightest of all, in the very act of saving the chief of sinners— “Where sin abounded, grace did much more abound.</p></blockquote>

<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>

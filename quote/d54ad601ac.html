<blockquote><p>I. We believe that Christ our Redeemer did truly die in the flesh for our sins, and that with one oblation, He has forever consecrated those who are sanctified.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1145c7e24" data-kw="">
<blockquote><p>Not all those who are called are predestined. For Christ said: ‘Many are called, but few are chosen’ (Mt. 22:14). But they contend that the calling is universal and that God would wish everyone saved. If it is understood as universal calling because it is offered to all and no one is excluded by name, it is true. If it is also called universal because the death of Christ and his redemption is sufficient for the whole world; that also is most true. But if this universality is meant so that He it is in everyone’s hand to receive the promises, I deny it: because to some it is given, to others it is not given. As if we did not see also that for a long time the very preaching of the Gospel was not given to many places, ages, and nations. God would have all to be saved, provided they believe. He gives faith to whom it seems good to Him. For He may justly do with his own what he will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Free Will &amp; Predestination” in Philosophical Works</cite>, trans. Joseph P. McLelland (Kirksville, MO: Sixteenth Century Essays &amp; Studies, 1994), vol 4, p. 332</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

s Online</a></div>
</figure><figure class="quote" id="q-0c583b5a0f" data-kw="">
<blockquote><p>VIII. Hence is that received and fit distinction, that Christ died for all men, in respect of the sufficiency of his merit, or the greatness of the price: but in respect of the efficacy and fruit of his death, he died for all, and only for the believers; seeing not all, but only the faithful receive him: but the rest reject him through infidelity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-04e73746c9" data-kw="">
<blockquote><p>There is such a fulness in the satisfaction of Christ, as is sufficient for the salvation of the whole world, were the whole world to believe in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | “Christ died for sinners. But everything turns on the significance of the preposition. What is meant by “Christ died for sinners”? To answer that Christ died in order to make it possible for God to righteously receive sinners who come to Him through Christ, is only saying what many a Socinian has affirmed. The testing of a man’s orthodoxy on this vital truth of the atonement requires something far more definite than this. The saving efficacy of the atonement lies in the vicarious nature of Christ’s death, in his representing certain persons, in his bearing their sins, in his being made a curse for them, in his purchasing them, spirit and soul and body. It will not do to evade this by saying</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

solasquotes.github.io%2Fquote%2F04e73746c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/04e73746c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=There%20is%20such%20a%20fulness%20in,whole%20world%20to%20believe%20in%20Him&amp;text=There%20is%20such%20a%20fulness%20in%20the%20satisfaction&amp;text=were%20the%20whole%20world%20to%20believe%20in%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ccf4f8f6d0" data-kw="">
<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways:

I. As God.

II. As Judge of the World.

III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 4</span></figcaption>

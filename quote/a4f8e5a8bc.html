<main class="wrap"><figure class="quote" id="q-a4f8e5a8bc" data-kw="">
<blockquote><p>This is one principal difference between the law and the gospel, and was ever so esteemed in the church of God, until all communication of efficacious grace began to be called in question: The law guides, directs, commands, all things that are against the interest and rule of sin. It judgeth and condemneth both the things that promote it and the persons that do them; it frightens and terrifies the consciences of those who are under its dominion. But if you shall say unto it, “What then shall we do? this tyrant, this enemy, is too hard for us. What aid and assistance against it will you afford unto us? what power will you communicate unto its destruction?” Here the law is utterly silent, or says that nothing of this nature is committed unto it of God; nay, the strength it hath it gives unto sin for the condemnation of the sinner: “The strength of sin is the law.” But the gospel, or the grace of it, is the means and instrument of God for the communication of internal spiritual strength unto believers. By it do they receive supplies of the Spirit or aids of grace for the subduing of sin and the destruction of its dominion. By it they may say they can do all things, through Him that enables them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of the dominion of sin and grace; wherein sin’s reign is discovered, in whom it is, and in whom it is not; how the law supports it; how grace delivers from it, by setting up its dominion in the heart</cite>, (London, 1688) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1965), vii, 546-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de3fc4268c" data-kw="">
<blockquote><p>In general, Christ requires us to hearken to the whole Word; to the Law to convince us and drive us out of ourselves unto Jesus, and to the Gospel which proclaims salvation to the sinner; to the Law so that according to its never-ceasing demands, we may direct all our actions thereby as our only rule; to the Gospel which shews us in whom is our power to obey the Law. O! how sweet it is to walk between Sinai and Zion, to go again and again unto Jesus for power to do all that which God in His ever-enduring Law demands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), p. 119.</span></figcaption>

</figure><figure class="quote" id="q-8063f6df32" data-kw="">
<blockquote><p>Ignorance of the difference between the law and the gospel promotes also, in a great degree, the strength and influence of a self-righteous temper. When a man is driven to acts of obedience by the dread of God’s wrath revealed in the law and not drawn to them by the belief of His love revealed in the gospel; when he fears God because of His power and justice and not because of His goodness; when he regards God more as an avenging judge than as a compassionate friend and father; and when he contemplates God rather as terrible in majesty than as infinite in grace and mercy, he shows that he is under the dominion, or at least under the prevalence, of a legal spirit. If he builds his faith of the pardon of sin, of the favor of God, and of eternal life on any graces that he supposes are implanted in him or on any duties that are performed by him, he is evidently under the power of a self-righteous temper. He shows that he is under the influence of this hateful temper by grounding his hope and his comfort on conditions performed by himself and not on the gracious and absolute promises of the gospel. In a word, when his hope of divine mercy is raised by the liveliness of his frame in duties and not by discoveries of the freeness and riches of redeeming grace offered to him in the gospel; or when he expects eternal life not as the gift of God through Jesus Christ but as a recompense from God for his own obedience and suffering, he plainly shows that he is under the power of a legal spirit. Now, if he is ignorant of the leading distinctions between the law and the gospel, this ignorance will strengthen his legal propensity and confirm him in his resolution to seek justification partly, if not wholly, by the works of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 129–30.</span></figcaption>

</figure><figure class="quote" id="q-c604a8f512" data-kw="">
<blockquote><p>I am Jehovah.” This name expresses, fundamentally, self-existence, and therefore conveys the idea that he to whom it belongs is the author of all finite being. The people to whom the law is given are hereby reminded that they are the creatures of God, living, moving, having their being in him, and that this absolute physical dependence involves an absolute moral dependence also.

This name serves to show that this law was not given to the Hebrews, as Hebrews, but as men, and, consequently, that it belongs not to those elements of the Mosaic institute which are provisional and temporary, but to those which are permanent and eternal. The sum of this law is love; and love to God is absolutely essential to the perfection and happiness of men. The law has been dispensed under many different forms, but in its essence it is as immutable as the nature of God and the relation of creature to creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moral Law in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-f922714a28" data-kw="">
<blockquote><p>3. The ceremonies are proven to be superstitious by this reason: If there were no more, they have no necessary nor profitable use in the Church (as has been proved), which kind of things cannot be used without superstition. It was according to this rule, that the Waldenses and Albingenses taught that the exorcisms, breathings, crossings, salt, spittle, unction, chrism, etc. used by the Church of Rome in baptism, being neither necessary nor requisite in the administration of the same, did occasion error and superstition rather than edification to salvation. (History of the Waldenses, pt. 3, bk. 1, ch. 6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 1, ‘That the Ceremonies are unlawful, because superstitious…’, p. 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95cd6d1c09" data-kw="">
<blockquote><p>Until the day Dr. Peck first met the young woman called Jersey, he did not believe in the devil. In fact, as a mature, highly experienced psychiatrist, he expected that this case would resolve his ongoing effort to prove to himself, as scientifically as possible, that there were absolutely no grounds for such beliefs. Yet what he discovered could not be explained away simply as madness or by any standard clinical diagnosis… …he recounts his journey from skepticism to eventual acknowledgment of the reality of an evil spirit, even at the risk of being shunned by the medical establishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/m-scott-peck.html">M. Scott Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Glimpses of the Devil</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

<blockquote><p>4. That the New Testament speaking of Demons as possessing men, speaks in words of common use, and in the common vulgar notions, not concerning itself in strict philosophical speculations.

5. That possession by devils, being granted to be believed by people, it does not follow that he that cures distempers supposed to be owing to that cause, and that speaks as such people speak, i.e. that uses words in common language, must certainly admit as truth that philosophical speculation which the ignorant people imagine to be true.</p></blockquote>

</figure><figure class="quote" id="q-c328fa613d" data-kw="">
<blockquote><p>Sixthly, escaping of worldly pollutions is not always an argument of a renewed nature, because sin may drive out sin, even as divines say about popish exorcisms, when the priest calls out devils from men possessed, it is by collusion: the devil recedes not because those exorcismes are of divine efficacy, but because hereby he would confirm people more in believing a lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), Section 3, Sermon 32, p. 192</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

</figure><figure class="quote" id="q-9941fe4cd2" data-kw="">
<blockquote><p>…though such has been the dotage, and is at this day of superstitious ones, that they think to charm the devil with their carnal exorcisms; hence the Romish reliques, cross, holy water, yea, and among the Jews themselves in corrupter times, who thought by their phylacteries and circumcision to scare away the devil, which made some of them expound that, Cant. 3:8, of circumcision, ‘Every man hath his sword on his thigh, because of fear in the night.’ By sword on the thigh, they expound circumcision, which they will vainly have given as a charm against evil spirits that affright them in the night. But alas, the devil cares for none of these, no, not for an ordinance of God, when by fleshly confidence we make it a spell: he has been often bound with these fetters and chaines (as is said of him in the Gospel) and the chains have been plucked asunder by him, neither could any man thus tame him. He esteems, as Job says of the Leviathan, iron as straw, and brass as rotten wood. It must be a stronger than the strong man must bind him, and none stronger but God the Father of spirits.</p></blockquote>

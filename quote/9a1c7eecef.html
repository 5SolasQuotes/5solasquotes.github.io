<blockquote><p>Fourth, it is asked whether they are to be compelled to the Faith by threats and certain penalties. That they are not, it seems: a. For it is said in the Council of Toledo: “The holy synod has ordered concerning the Jews.” And this same thing Gregory says: henceforth to force no one into believing. For just as a man, obeying the serpent by his own will of choice, perished, so, when the grace of God calls him, each one is saved by believing through the conversion of his own mind. Therefore they are not to be driven by force, but rather to be given themselves. Gregory. It remains, therefore, that they are not to be compelled to the faith. b. Likewise, Augustine says: “We can do something unwillingly, yet we cannot believe unless of our own will one is to be led to the faith.</p></blockquote>

<blockquote><p>Concerning the first, thus: it seems that they are not to be tolerated: 1. For they blaspheme both against Christ and against the blessed Virgin; they also persecute the catholic Faith, and they inflict injury upon the ecclesiastical sacraments, as is had in the Extravagants, On the Jews, Etsi Iudaeos. But blasphemers, according to the Old Law also, were to be handed over to death; therefore the Jews too are not to be tolerated, but to be exposed to death, especially those who conduct themselves thus. 2. Furthermore, in their book, which is called the Talmud, many things were contained that pertained to the blasphemy of Christ and the blessed Virgin; since therefore they observe the doctrine of that book as though it were a law, together with books of this sort they must be destroyed. 3. Likewise, Christians persecute pagans even to death, who are the holders of the Holy Land; but an insult to the Redeemer is a greater injury; therefore Christians ought to persecute those who perpetrate such an insult even to death; therefore they are not to be tolerated. But that they inflict an insult is evident from what is said in the Extravagants, On the Jews, In nonnullis. On the contrary: a. By what is said in the Psalm, on that verse: ‘Kill them not,’ the Gloss says: ‘This can be taken especially of the Jews;’ he prays that the Jews may not perish utterly: for they have indeed been dispersed in order that they may be provoked to conversion; and he also said concerning them: ‘Kill not those who killed me, but let the nation of the Jews remain with the sign of circumcision.’ They are to be tolerated. b. Likewise, testimony that is received from adversaries is stronger; but the catholic Church takes testimony from the Old Law, which the Jews observe; therefore, in order that the catholic Church may have testimony from enemies, the Jews are to be tolerated: for from the Old Law, namely from the Law of Moses and the Prophets, testimony about Christ is taken, which they cannot deny. c. Likewise, Isa. 10:22 has that the remnant of Israel shall be saved; and similarly the apostle says, Rom. 11:5; but the remnant could not be saved unless the seed of the Jews remained; therefore the seed of the Jews must be saved; therefore the Jews are to be tolerated. This must be granted. [Replies to objections:] 1. To the contrary objection, however, it must be said that although they commit blasphemy, still they believe that they are not sinning in this, because they do not yet believe that the Messiah has come, and in this they err and are reserved for future damnation unless they come to their senses, as is said on that verse of the Psalm: ‘I will repay them.’ The Gloss: ‘In the present however, they should persist in manifest blasphemy, so that they may be dispersed; in the future, so that they may be condemned. They ought to be restrained by secular princes, as is had in the Extravagants, On the Jews, In nonnullis, where it is said: in the provinces we most strictly forbid that they presume to burst forth into insult against the Creator; and since we ought not to conceal the reproach of Him who has wiped away our reproaches, we command that such presumptuous persons be restrained by secular princes with the addition of worthy punishment, lest they presume in any way to blaspheme the Crucified for us. 2. To the second it must be said that their books, in which blasphemies of this sort are contained, ought to be burned; but they themselves, if they should persist pertinaciously in blasphemy of this sort and are convicted before a judge, are to be punished with a fitting penalty. But it is otherwise if they blaspheme secretly. 3. To the third it must be said that there is a different reason concerning the pagan holders of the Holy Land themselves and concerning the Jews themselves. For Christians persecute those pagans as unjust holders and violators of a sacred place, to the injury of Christ; but the Jews are permitted to live and to dwell among Christians for many reasons, both because from the Jews we have received the Old Law, and because Christ came from that seed, then because the promise of their salvation was made; when the fullness of the gentiles shall have entered into Christ, they are to be restrained by due admonition; nor does it seem that greater pardon should be shown to them in manifest offenses than to evil Christians.</p></blockquote>

ey+should+persist+pertinaciously+in+blasphemy+of+this+sort+and+are+convicted+before+a+judge%2C+are+to+be+punished+with+a+fitting+penalty.+But+it+is+otherwise+if+they+blaspheme+secretly.+3.+To+the+third+it+must+be+said+that+there+is+a+different+reason+concerning+the+pagan+holders+of+the+Holy+Land+themselves+and+concerning+the+Jews+themselves.+For+Christians+persecute+those+pagans+as+unjust+holders+and+violators+of+a+sacred+place%2C+to+the+injury+of+Christ%3B+but+the+Jews+are+permitted+to+live+and+to+dwell+among+Christians+for+many+reasons%2C+both+because+from+the+Jews+we+have+received+the+Old+Law%2C+and+because+Christ+came+from+that+seed%2C+then+because+the+promise+of+their+salvation+was+made%3B+when+the+fullness+of+the+gentiles+shall+have+entered+into+Christ%2C+they+are+to+be+restrained+by+due+admonition%3B+nor+does+it+seem+that+greater+pardon+should+be+shown+to+them+in+manifest+offenses+than+to+evil+Christians.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+1+%7C+ch.+1%2C+%E2%80%98Whether+Jews+are+to+be+Tolerated%3F%E2%80%99+tr.+AI+by+The+Faith+Received&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a0d1f12a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a0d1f12a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Concerning%20the%20first%2C%20thus%3A%20it%20seems,manifest%20offenses%20than%20to%20evil%20Christians&amp;text=Concerning%20the%20first%2C%20thus%3A%20it%20seems%20that%20they&amp;text=them%20in%20manifest%20offenses%20than%20to%20evil%20Christians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Second, it is asked whether their rites are as it were idolatry. That it seems so: 1. From the fact that it is said in Gal. 5:1, on the words, “Do not again be entangled with the yoke of bondage,” the Gloss says: “This bondage is not lighter than that of idolatry,” because the servitude of the legal observances is likened to idolatry in burden. 2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.</p></blockquote>

<blockquote><p>First, we need to keep in mind the Fregean point that a difference in sense does not entail a difference in reference. To use Frege’s famous example, the sense of the expression “the morning star” is different from the sense of the expression “the evening star.” But these two expressions refer to one and the same thing, viz. the planet Venus. Similarly, expressions like “the God of the Christians” and “the God of the Muslims” differ in sense, but it doesn’t follow from that alone that they don’t refer to the same God… Second, even a speaker’s erroneous beliefs don’t entail that he is not referring to the same thing that speakers with correct beliefs are referring to… Similarly, the fact that Muslims have what Christians regard as a number of erroneous beliefs about God does not by itself entail that Muslims and Christians are not referring to the same thing when they use the expression “God.</p></blockquote>

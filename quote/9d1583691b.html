<main class="wrap"><figure class="quote" id="q-9d1583691b" data-kw="">
<blockquote><p>VII… By immortality, I refer not to the immortality of the soul by creation strictly (as discussed in Thesis IV) but to the immortality of the whole composite [of man] by grace. It is not that death was impossible in the absolute sense (since it consisted of separable parts, including the corruptible body, with mutually opposing qualities), but as long as man persisted in that state under the covenant, he would never have died. This argument is against the Pelagians, Photinians, Socinians, and Anabaptists, and is supported by: 1. The first covenant and agreement (Leviticus 18:5, Romans 10:5, 11). 2. The sacrament and the tree of life (Genesis 2:9 compared with Genesis 3:22). The tree did not contain such a great power physically within itself, but it served as a pledge and sacrament, ensuring that his life would be happily continued until, by God’s grace, he would have reached complete blessedness in heaven after a most felicitous transition through death. 3. Death, originally threatened as a penalty in the event of sin (Genesis 2:17), only entered the world when sin became an actual reality; hence, death would not have had any place in that state. With sin excluded, all guilt, penalty, and consequent punishment were also excluded. This is clearly evident from Romans 5:12, 1 Corinthians 15:22, James 1:15, Romans 6:23, and Genesis 2:17, which align with the Hebrew saying: אין מיתה בלא חטא (“there is no death without sin”).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>

<blockquote><p>…note that while the behavior of non-human animals is not deterministic, neither is it random or arbitrary. It is perfectly intelligible given their causal powers together with the powers of the things they interact with. Yet non-human animals do not have wills, much less free will… Aquinas’s answer is that the will is a power of the kind of thing whose activity arises from within it in a certain way–specifically, by way of having knowledge of the kind of which a rational substance alone is capable (Summa theologiae I-II.6.1-2). To act voluntarily is to know what you are doing in the way that human beings do.</p></blockquote>

</figure><figure class="quote" id="q-3a7a08b9ad" data-kw="">
<blockquote><p>Farther this Pigghius reasons and says that this desire which Augustine calls concupisence is a work of nature and of God: and therefore it cannot be counted sin. But we have before answered that it comes not from the grounds of nature as it was instituted by God, but of nature corrupted. For man, when he was created, was made right and (and as the scripture says) to the image of God. Wherefore that desire of things pleasant and preservative in Adam, when he was first created, was not outrageous or vehement, to be against right reason and the word of God: for, that followed afterward. Wherefore we ought not to call it the work of God (as Pigghius says) but the wickedness of sin and corruption of affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, ch. 5, p. 123 in Most Learned &amp; Fruitful Commentaries of Dr. Peter Martyr Vermilius... (d. 1562; London: 1568)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-f28dcd04b0" data-kw="">
<blockquote><p>The nature of a thing: not how it is, but how it is meant to be… It is as though a physician who saw only broken arms assumed that if arms have no fractures there must be something wrong with them. How could we correct such a misguided physician? By calling his attention to the purpose or function of the arms, to their proper work. Broken arms cannot do their work as well as intact ones; therefore, brokenness is not their natural state. The nature of a thing is not determined by how something happens to be, but by what it is for — by what it is designed to do and to become, if everything goes well… What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. …potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. Another reason why the expression ‘potentiality for fatherhood’ requires explanation is that although siring children is the most characteristic expression of fatherhood, it is far from its only expression… We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them… although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ I am saying that for men, the reality is parallel. Not every man is called to marry and bear physical children, but every man, whether married or unmarried, is called upon to be a biological, psychological or spiritual father.</p></blockquote>

+speak%2C+to+develop%3B+it+demands%2C+so+to+speak%2C+a+response.+It+is+like+an+arrow%2C+notched+in+the+string+and+aimed+at+the+target%2C+even+if+it+never+takes+flight.+It+intimates+an+inbuilt+meaning+and+expresses+an+inbuilt+purpose%2C+which+cannot+help+but+influence+the+mind+and+will+of+every+person+imbued+with+them%E2%80%A6+although+not+every+woman+is+called+to+marry+and+bear+physical+children%2C+%E2%80%98every+woman%2C+whether+married+or+unmarried%2C+is+called+upon+to+be+a+biological%2C+psychological+or+spiritual+mother.%E2%80%99+I+am+saying+that+for+men%2C+the+reality+is+parallel.+Not+every+man+is+called+to+marry+and+bear+physical+children%2C+but+every+man%2C+whether+married+or+unmarried%2C+is+called+upon+to+be+a+biological%2C+psychological+or+spiritual+father.%E2%80%9D%0A%0A%E2%80%94+J.+Budziszewski%2C+%E2%80%98What+makes+Men+Men%3F%E2%80%99%2C+pt.+1+%282019%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff28dcd04b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f28dcd04b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/man-the-image-of-god#:~:text=The%20nature%20of%20a%20thing%3A%20not,a%20biological%2C%20psychological%20or%20spiritual%20father&amp;text=The%20nature%20of%20a%20thing%3A%20not%20how%20it&amp;text=to%20be%20a%20biological%2C%20psychological%20or%20spiritual%20father" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The analogy which I understand is to hold between the Jewish and Christian Church is this: As profane persons were forbidden to enter into the Temple because of the sacramental and typical holiness thereof (for the Temple was a type of Christ), so profane persons are now much more to be kept back from the sacrament of the Lord’s Supper, which has more of sacramental signification, mystery and holiness in it than the temple of Jerusalem had, and whereby more ample evangelical promises are set forth and sealed unto us. And as profane persons might of old come into the court of the gentiles, and there hear the Word preached in Solomon’s porch (where both Christ and his apostles did preach, Jn. 10:23; Acts 3:11; 5:12, which porch was in the utmost court, that is, the court of the gentiles: of which elsewhere out of Josephus), but might not come into the court of Israel, nor have communion in the sacrifices: so profane, obstinate sinners are to be excluded for their impiety from the Church-communion of saints, though they may hear the Word, as heathens also may do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 9. Whether in the Jewish Church there was any suspension or exclusion of profane, scandalous, notorious sinners, from partaking in the public ordinances with the rest of the children of Israel in the temple 41, pp. 46-47</span></figcaption>

<blockquote><p>28. We have, therefore, a most excellent and sure mark to distinguish… the legitimate observances of the Church, if we remember that one of two things, or both together, are always intended, viz., that in the sacred assembly of the faithful, all things may be done decently, and with becoming dignity, and that human society may be maintained. In order by certain bonds, as It were, of moderation and humanity… since nothing here is sought but the maintenance of charity by a common office… 30. …the whole sum of righteousness, and all the parts of divine worship, and everything necessary to salvation, the Lord has faithfully comprehended, and clearly unfolded, in his sacred oracles, so that in them He alone is the only Master to be heard. But as in external discipline and ceremonies [he used as an example bowing in prayer], he has not been pleased to prescribe every particular that we ought to observe, (he foresaw that this depended on the nature of the times, and that one form would not suit all ages, in them we must have recourse to the general rules which he has given, employing them to test whatever the necessity of the Church may require to be enjoined for order and decency. Lastly, as he has not delivered any express command, because things of this nature are not necessary to salvation, and, for the edification of the Church, should be accommodated to the varying circumstances of each age and nation, it will be proper, as the interest of the Church may require, to change and abrogate the old, as well as to introduce new forms. I confess, indeed, that we are not to innovate rashly or incessantly, or for trivial causes. Charity is the best judge of what tends to hurt or to edify: if we allow her to be guide, all things will be safe. 31. Things which have been appointed according to this rule, it is the duty of the Christian people to observe with a free conscience indeed, and without superstition, but also with a pious and ready inclination to obey…</p></blockquote>

</figure><figure class="quote" id="q-bf95d426e2" data-kw="">
<blockquote><p>In making laws, ministers are only heralds and envoys, who promulgate the laws of the prince and enunciate the commands of God, addressing believers in his name; but in constitutions they are directors of external worship in matters pertaining to good order (eutaxian) because although God has prescribed in general that all things should be done decently and in order, still He has sanctioned nothing in particular, but left it to the prudence of pastors, who are able to dispose of them as they see is conducive to edification. For so great is the variety in minds, so great the conflict between judgments and dispositions, that unless they are bound by certain laws as by chains and bits, they would easily disagree with each other and the unity of the church be dissolved. Since about things of this kind there was no special precept, since they are innumerable and mutable depending upon circumstances of times, places and persons, God wishes the rulers of the church to consult for its peace, edification and decorum by determining those things which seem best adapted to the habits of the people and with regard for times and places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3, pp. 285-293, p. 286</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In making laws, ministers are only heralds and envoys, who promulgate the laws of the prince and enunciate the commands of God, addressing believers in his name; but in constitutions they are directors of external worship in matters pertaining to good order (eutaxian) because although God has prescribed in general that all things should be done decently and in order, still He has sanctioned nothing in particular, but left it to the prudence of pastors, who are able to dispose of them as they see is conducive to edification. For so great is the variety in minds, so great the conflict between judgments and dispositions, that unless they are bound by certain laws as by chains and bits, they would easily disagree with each other and the unity of the church be dissolved. Since about things of this kind there was no special precept, since they are innumerable and mutable depending upon circumstances of times, places and persons, God wishes the rulers of the church to consult for its peace, edification and decorum by determining those things which seem best adapted to the habits of the people and with regard for times and places.”

— Francis Turretin, Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3, pp. 285-293, p. 286">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+making+laws%2C+ministers+are+only+heralds+and+envoys%2C+who+promulgate+the+laws+of+the+prince+and+enunciate+the+commands+of+God%2C+addressing+believers+in+his+name%3B+but+in+constitutions+they+are+directors+of+external+worship+in+matters+pertaining+to+good+order+%28eutaxian%29+because+although+God+has+prescribed+in+general+that+all+things+should+be+done+decently+and+in+order%2C+still+He+has+sanctioned+nothing+in+particular%2C+but+left+it+to+the+prudence+of+pastors%2C+who+are+able+to+dispose+of+them+as+they+see+is+conducive+to+edification.+For+so+great+is+the+variety+in+minds%2C+so+great+the+conflict+between+judgments+and+dispositions%2C+that+unless+they+are+bound+by+certain+laws+as+by+chains+and+bits%2C+they+would+easily+disagree+with+each+other+and+the+unity+of+the+church+be+dissolved.+Since+about+things+of+this+kind+there+was+no+special+precept%2C+since+they+are+innumerable+and+mutable+depending+upon+circumstances+of+times%2C+places+and+persons%2C+God+wishes+the+rulers+of+the+church+to+consult+for+its+peace%2C+edification+and+decorum+by+determining+those+things+which+seem+best+adapted+to+the+habits+of+the+people+and+with+regard+for+times+and+places.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Question+31%2C+%E2%80%98Does+a+legislative+power+properly+so+called%2C+of+enacting+laws+binding+the+conscience%2C+belong+to+the+church%3F+Or+only+an+ordaining+%28diataktike%29+power%2C+of+sanctioning+constitutions+and+canons+for+the+sake+of+good+order+%28eutaxian%29%3F+The+f

<blockquote><p>Answer. None of us do teach that it is against the light of nature that the adverse party be the judge; it might fall out in a general council lawfully convened, from which there is no provocation; yea and in a national council (for all councils may err) the adverse party may judge, as it was a lawful council according to a Church-constitution that condemned Christ of blasphemy, and they were also his enemies;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 456-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b571955e76" data-kw="">
<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

<blockquote><p>V. The law of nature is an ordinance and precept which reason, from common notions infused by God even after the fall, forms in the manner of a law with God Himself assisting; by which all and each are taught generally concerning good and evil to be avoided or done, and concerning the means to each.</p></blockquote>

</figure><figure class="quote" id="q-d330f3a329" data-kw="">
<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>

o%20by%20you&amp;text=10%2C%20Direction%207.%20Meddle%20not%20with%20lawsuits&amp;text=as%20you%20would%20have%20others%20do%20by%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans</cite>, (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</span></figcaption>

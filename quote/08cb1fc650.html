<main class="wrap"><figure class="quote" id="q-08cb1fc650" data-kw="">
<blockquote><p>When god instituted civil government, and armed the magistrate with power to punish crime, did he say to him in respect of part of the law, thou shalt “not bear the sword in vain,” but in respect of another part of it “thou shalt not execute judgment?” If God has not made this distinction who may, who dare? Is it said that murder is a crime against society, and idolatry a sin against God; and therefore the former ought to be punished by man, but that the latter may not? I deny both the premises and the conclusion. The distinction is a mere fiction; it has no foundation either in reason or in scripture. Both of these are crimes against society, as well as sins against God. Idolatry is as certainly and fatally injurious to the welfare of society as is murder. It was idolatry that brought down the wrath of God upon the Jews. As the punishment of this sin they were held in captivity seventy years. And as the punishment of this sin the empire of the ten tribes was dissolved. The fatal effects of idolatry upon society are not so readily perceived by irreligious statesmen, as those of murder, and the reason is they are ignorant and regardless of the written law of God. In the prosecution of a short-sighted and ruinous policy they neglect and despise one of the most important duties of government. A duty which if neglected is always followed by national misery and ruin!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 262.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-528533c5d0" data-kw="">
<blockquote><p>But they say immediately, ‘We teach that these images are not to be worshipped.’ As if, in fact, says [Jerome] Zanchius (De Imagin., col. 402), ‘God had not once rather diligently done the same thing through Moses and the prophets, that we are doing. So then why did He even want all images abolished? Because it is not enough to teach by word that an evil thing must not be done; but the slight obstacles, the incentives, the causes, the occasions of evil doing must be abolished.’ It is not enough, with the scribes and Pharisees, to teach out of Moses’ chair what the people should do, but all occasions, yea, appearances of evil, are to be taken out of their sight. ‘Those things affect more powerfully, and affect more, which fall upon the eyes than those which fell upon the ears. And so Hezekiah had been able to warn the people not to worship the serpent, but he preferred to break it in pieces and completely remove it from visibility,’ says one well to this purpose. (Thomas Naogeorgus [Kirchmeyer] in 1 Jn 5:21)</p></blockquote>

<blockquote><p>I appeal to the conscience of every Christian, whether we (avoiding the occasion of idolatry) tend any whit to paganism, as the Papists by their devices do, or whether we (by removing all images, and consequently the cross too) do derogate from Christ and from His passion as they do, which, having the material cross, cannot come to the knowledge and faith of The Crucified.</p></blockquote>

</figure><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>

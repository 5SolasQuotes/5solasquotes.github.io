<main class="wrap"><figure class="quote" id="q-97718e7522" data-kw="">
<blockquote><p>Yea, thou wilt find, that he, who prevented thee with grace, &amp; sought thee, ere ever thou soughtest him, &amp; gave thee grace to cry and pray, Have mercy, O God, yet he will seem to mis-know thee, and make thee none answer. Thou wilt cry in sickness, Mercy, but wilt thou always find mercy? No, no, thou wilt cry in other troubles, Mercy, and his Spirit no question will intercede for thee, and yet for a time he will make thee none answer. What meaneth this? why doeth he so? Now when he hath given thee grace to cry for mercy, a thirst &amp; an hunger for grace, (Blessed are they that hunger &amp; thirst) when he hath given thee this first grace, he will let thee cry a great while to try thy constancy.

We never get a spiritual grace in this life, but with the grace we get always a trial: and when he giveth us grace to cry: he will try if we will cry on. And to speak the truth, Brethren, All our life here, is but a trial of the graces of GOD, which he hath given us. We get not our heaven here, but a faith to look a far of unto it, an hunger, a thirst, a desire of it, and with our thirst a trial of our Faith, a trial of our Hope, of our desire, to see if we will stand in it. And then saith Peter, in the life to come, the trial of thy faith, and hope, and patience, being ended, What shall follow, Praise, and honour, and glory, when JESUS shall appear, 1. Pet. 1. 7. Thou shalt bee filled with saciety and fullness of joy, thine hunger and thirst shall be satisfied as soon as ever thou seest thy Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 268-69.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f4d498e05" data-kw="">
<blockquote><p>‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-annesley.html">Samuel Annesley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion with God, in Two Sermons</cite>, … (London: Tyler, 1655), sermon 2, pp. 41-42</span></figcaption>

5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Alas%2C%20this%20business%20is%20beyond%20my,and%20tell%20the%20Father%20thy%20case&amp;text=Alas%2C%20this%20business%20is%20beyond%20my%20strength%2C%20I&amp;text=Go%20therefore%20and%20tell%20the%20Father%20thy%20case" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fallen, sinful man stands in need of the utmost encouragement that divine condescension can extend unto, to prevail with him to receive and lay hold of the promise of grace and mercy by Jesus Christ. There is nothing that we are so prone unto, as to distrust the promises of God; nothing that we are with more difficulty won over unto, than to mix them with faith. To evidence this we may consider,— 1. That the first entrance of sinto the world was by a disbelief of the truth of God; yea, that very sin formally consisted in an apprehension that God, in his promises and threatenings, had a mind to deceive us, Gen. 3:4–6. And as sin thus laid its foundation by the craft of Satan, so it endeavours to carry on its building. It continually suggests to the hearts and minds of men that they shall certainly be deceived in trusting to God’s promises. For,— (1.) Secret thoughts there are in the hearts of men,—which are “deceitful above all things, and desperately wicked,”—that neither the promises nor threatenings of God are true, in the terms and sense wherein they are proposed unto them. They neither think that it shall be so bad with any as he threateneth, nor so well as he promiseth. Did men believe the threatenings of God as to the fearful and eternal ruin of sinners, it were not possible they should live in sin as they do, without any endeavour of amendment, so to flee from the wrath to come. Nor do they think in their hearts that it shall be with them that believe according as God hath promised. They say in their hearts, “The Lord will not do good, neither will he do evil,” Zeph. 1:12,—namely, as he hath either promised or threatened. (2.) Men think that there are still some reserves and latent conditions in the promises and threatenings of God, and that God knows it shall be otherwise than they seem to portend. By this imagination Satan deceived our first parents as to the truth of God in his threatening. He persuaded them that there was a reserve therein, that was directly contrary unto what the words of it declared; and that by transgressing of his command they should not die, but be wise and like himself. And still men suppose that the promises propose a fair ground, indeed, but that if they should go to build upon it, there is a mine under it, which would be sprung at one time or another, unto their ruin. They cannot apprehend that it shall be with them according unto and as the promise doth declare. If they should attempt to believe, yet one latent condition or other would defeat them of obtaining it; whereas, indeed, the whole and entire condition of enjoying the promise is faith alone. (3.) Whatever may be the truth of the promise, yet they cannot conceive that God intends them therein; whereas yet there is no declaration or intention of God, whereby our duty is to be regulated and whereon we shall be judged, but what is contained and expressed in the proposal of the promise itself. On these and the like grounds, the great contest in the world, between God and man, is whether God be true or a liar in his promise. It is not thus directly stated in the minds of men, for they have many other pretences why they do not believe; but this is that which it is resolved into. For “he that receiveth not the testimony of God, maketh him a liar.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 22, Works of John Owen (Edinburgh: Johnstone and Hunter, 1855), 272–73.</span></figcaption>

th+either+promised+or+threatened.+%282.%29+Men+think+that+there+are+still+some+reserves+and+latent+conditions+in+the+promises+and+threatenings+of+God%2C+and+that+God+knows+it+shall+be+otherwise+than+they+seem+to+portend.+By+this+imagination+Satan+deceived+our+first+parents+as+to+the+truth+of+God+in+his+threatening.+He+persuaded+them+that+there+was+a+reserve+therein%2C+that+was+directly+contrary+unto+what+the+words+of+it+declared%3B+and+that+by+transgressing+of+his+command+they+should+not+die%2C+but+be+wise+and+like+himself.+And+still+men+suppose+that+the+promises+propose+a+fair+ground%2C+indeed%2C+but+that+if+they+should+go+to+build+upon+it%2C+there+is+a+mine+under+it%2C+which+would+be+sprung+at+one+time+or+another%2C+unto+their+ruin.+They+cannot+apprehend+that+it+shall+be+with+them+according+unto+and+as+the+promise+doth+declare.+If+they+should+attempt+to+believe%2C+yet+one+latent+condition+or+other+would+defeat+them+of+obtaining+it%3B+whereas%2C+indeed%2C+the+whole+and+entire+condition+of+enjoying+the+promise+is+faith+alone.+%283.%29+Whatever+may+be+the+truth+of+the+promise%2C+yet+they+cannot+conceive+that+God+intends+them+therein%3B+whereas+yet+there+is+no+declaration+or+intention+of+God%2C+whereby+our+duty+is+to+be+regulated+and+whereon+we+shall+be+judged%2C+but+what+is+contained+and+expressed+in+the+proposal+of+the+promise+itself.+On+these+and+the+like+grounds%2C+the+great+contest+in+the+world%2C+between+God+and+man%2C+is+whether+God+be+true+or+a+liar+in+his+promise.+It+is+not+thus+directly+stated+in+the+minds+of+men%2C+for+they+have+many+other+pretences+why+they+do+not+believe%3B+but+this+is+that+which+it+is+resolved+into.+For+%E2%80%9Che+that+receiveth+not+the+testimony+of+God%2C+maketh+him+a+liar.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+ed.+W.+H.+Goold%2C+vol.+22%2C+Works+of+John+Owen+%28Edinburgh%3A+Johnstone+and+Hunter%2C+1855%29%2C+272%E2%80%9373.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facbf53f3f1. <blockquote><p>Davenant recognized that if God wills the means of salvation to be procured for the reprobate, then God’s intention to save appears thwarted. Does this not imply that God’s will is ineffectual because of God’s universal desire to save all? Davenant responds to God’s apparent impotence by noting that God oftentimes obtains (and sometimes actually grants) the means to an end wherein the end is never attained. Davenant appeals to the scholastic distinction between providence and predestination employed by Aquinas. (Davenant, De Morte Christi, in DD, 23 (370); Davenant, Sententia de Gallicana controversia, in DD, fol. Ii4v. Cf. Aquinas, [Disputed Questions,] De Veritate, in CT, q. 6 [on Predestination] a. 2 co. [actually art. 3, body]) Providence is a general appointment of a thing toward an end (universaliter ordinationem in finem), whereas predestination represents the outcome or result of an ordering (exitum vel eventum ordinis). Predestination differs from providence in that “not everything that is ordained to an end [as in providence] reaches that end.” (Aquinas, De Veritate, in CT, q. 6 a. 2 co. [actually art. 3, body]) Like providence, then, the evangelical covenant is grounded upon an ordination to an end that does not infallibly obtain. God has ordained that Christ make a universal satisfaction on condition of belief, which condition being not always fulfilled, necessitates that not all are forgiven. This evangelical covenant, which displays the “freedom, mercy, and justice of God,” is made, consonant with God’s general love for mankind, between humanity and God promising the saving benefits of Christ to those who repent and believe.</p></blockquote>

<blockquote><p>Moreover, all have their own task and place. Roman Catholics assume that after death Old Testament believers waited in the limbo of the fathers and were not released until Christ freed them at his descent into hell; and they also believe that infants who were not yet baptized when they died will be received neither in hell nor in heaven but in a separate “receptacle,” the limbo of infants. But Scripture presents no basis for either of these two “limbos.” It is of course logical that those who lose sight of the unity of the covenant of grace, and view the benefits secured by Christ as a new substance that did not exist before—such are compelled to make the devout of the Old Testament wait in the limbo of the fathers for this acquisition and impartation of Christ’s benefits. But those who acknowledge the unity of the covenant and view the benefits of Christ as the gracious benevolence of God that, with a view toward Christ, could be imparted already before his suffering and death—they have no need for a limbus patrum. Under the provisions of the Old Testament, the way to heavenly blessedness was the same as under the New Testament, even though there is indeed a difference in the light by which they walked then and now. In the same way there is no room on the other side of the grave for a limbo of infants (limbus infantum); for the children of the covenant, whether baptized or unbaptized, go to heaven when they die; and so little has been disclosed to us about the fate of those outside the covenant that we had best abstain from any definite judgment. Still, contained in theory of the limbus patrum and the limbus infantum is the true idea that there are varying degrees both in the punishment of the ungodly and in the blessedness of the devout. There is distinction of rank and activity in the world of angels. There is diversity among all created beings and most abundantly among humans. There is distinction of place and task in the church of Christ; on earth every believer is given one’s own gifts and charged with one’s own task. And in death the works of each follow the person who dies in the Lord. Undoubtedly this diversity is not destroyed in heaven but, on the contrary, is purified of all that is sinful and multiplied abundantly (Luke 19:17–19). Still this difference in degree detracts nothing from the blessedness each enjoys in keeping with one’s own capacity. For all will be at home with the same Lord (2 Cor. 5:8), are taken up into the same heaven (Rev. 7:9), enjoy the same rest (Heb. 4:9), and find joy in the same service of God (Rev. 7:15).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8e262339eb" data-kw="">
<blockquote><p>4. The text continues: ‘And these are the signs that will accompany those who believe: in my name they will cast out demons, they will speak new tongues, they will take snakes in their hands, and if they drink any deadly beverage, it will not will do them any harm. They will lay hands on the sick, and they will be healed.’ [Mk. 16:17] That, my brethren, you do not do; does that mean you do not believe? No, of course! These signs were necessary at the beginning of the Church. Faith, in order to grow, had to be nourished. We, too, when planting trees, pour water on them until we have found that they have resumed; but once their roots are fixed in the ground, we stop watering them. Hence Paul’s words: ‘Languages ​​are a sign, not for believers, but for unbelievers.’ (1 Cor 14:22)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 29 on the Gospels, on the Ascension, May 24</cite>, 591</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8203363a8d" data-kw="">
<blockquote><p>It is not by Romanists only that it is denied, practically at least, if not theoretically. Nothing is more common among Protestants, especially in our day, than the attempt to coerce the conscience of men by public opinion; to make the opinions of men on questions of morals a rule of duty for the people, and even for the Church. If we would stand fast in the liberty wherewith Christ has made us free, we must adhere to the principle that in matters of religion and morals the Scriptures alone have authority to bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. VI, §4</span></figcaption>

</figure><figure class="quote" id="q-2fcae9d028" data-kw="">
<blockquote><p>In the earliest times, “the Holy Ghost fell upon them that believed: and they spake with tongues,” which they had not learned, “as the Spirit gave them utterance.” These were signs adapted to the time. For there behooved to be that betokening of the Holy Spirit in all tongues, to show that the Gospel of God was to run through all tongues over the whole earth. That thing was done for a betokening, and it passed away. In the laying on of hands now, that persons may receive the Holy Ghost, do we look that they should speak with tongues? Or when we laid the hand on these infants, did each one of you look to see whether they would speak with tongues, and, when he saw that they did not speak with tongues, was any of you so wrong-minded as to say, These have not received the Holy Ghost; for, had they received, they would speak with tongues as was the case in those times? If then the witness of the presence of the Holy Ghost be not now given through these miracles, by what is it given, by what does one get to know that he has received the Holy Ghost? Let him question his own heart. If he love his brother, the Spirit of God dwelleth in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the First Epistle of John, Homily 6, on 1 Jn. 3:19-4:3</cite>, section 10 in NPNF1, 7:497-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

earliest%20times%2C%20%E2%80%9Cthe%20Holy%20Ghost%20fell&amp;text=brother%2C%20the%20Spirit%20of%20God%20dwelleth%20in%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c7ca4ef8d4" data-kw="">
<blockquote><p>The apostles did not always exercise it, but only made use of it [the power of miracles] to prove the Word of God, to confirm it by the miracles; as it is written here in the text: ‘And they went forth, and preached everywhere, the Lord working with them, and confirming the Word by the signs that followed. [Mk. 16:20]’ But since the Gospel has now been spread abroad, and made known to all the world, there is no need of working miracles as in the apostles’ times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 206-8 on Mk. 16:16-17 in ‘Day of Christ’s Ascension into Heaven’, 2nd Sermon, on Mk. 16:14-20 in The Precious &amp; Sacred Writings of Martin Luther… ed. John N. Lenker (Minneapolis, MN: Lutherans in All Lands Co., 1907), vol. 12, Church Postil, Gospels: Pentecost or Missionary Sermons, vol. 3, p. 207</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-8c5009acc0" data-kw="">
<blockquote><p>They spoke with strange tongues, and not those of their native land; and the wonder was great, a language spoken by those who had not learnt it. And the sign is to them I that believe not [1 Cor. 14:22], and not to them that believe, that it may be an accusation of the unbelievers, as it is written, ‘With other tongues and other lips will I speak unto this people, and not even so will they listen to Me saith the Lord. [Isa. 28:11]&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c0cc0302e5" data-kw="">
<blockquote><p>But hence is not proved [by congregationalists], because the Colossians are as private Christians to admonish or rebuke their pastor Archippus, Therefore the body of believers have the power of the keys to depose and excommunicate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (London, 1642)</cite>, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed7da2b36b" data-kw="">
<blockquote><p>Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only…. And many more of our divines, who teach that the apostle 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by governments, 1 Cor. 12:28, where the apostle says not ‘helps in governements,’ as our new English translation corruptly reads, but ‘helps, governements,’ etc. plainly putting ‘governements’ for a different order from ‘helps’ or deacons… Deacons were instituted by the apostles for collecting, receiving, keeping, and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, churches, schools, and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments. Beside which employments, the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), ch. 8, Digression 1, ‘Of the Vocation of Men of Ecclesiastical Order’</cite>, pp. 160-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

%20ordinary%20deacons&amp;text=Now%20elders%20are%20either%20such%20as%20labor%20in&amp;text=nor%20any%20other%20ecclesiastical%20function%20to%20ordinary%20deacons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8db5789f55" data-kw="">
<blockquote><p>17. It having been the custom of the Church in the apostles’ days, to have orindarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) | The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts, n.p.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-74c3c909a4" data-kw="">
<blockquote><p>Our divines, Bucer, Calvin, Bucanus, Tilenus, Beza, Virttut [Viret?], give consenting, and in some cases correcting, not judicial, power sure, but which is great enough, a negative consent for eschewing of a schism. And the professors of Leiden, Ursinus, Pareus, Junius, give the people a vote, a consent in excommunication, and this cannot exclude women who are offended when the whole Church is offended. The times of Ambrose did witness more pride in the clergy, who began to do all without the people. Chemnitz, Daneus, the Confession of Bohemia, of Helvetia, the Synod of Middleburgh, the Synod of Tylleburgh in Nassovia, anno 1582, teach that the whole Church with consent of all did excommunicate, but the judging authority is in the eldership.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658)</cite>, p. 277</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

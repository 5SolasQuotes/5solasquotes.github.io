</figure><figure class="quote" id="q-6037e57a04" data-kw="">
<blockquote><p>If we compare the two Tables together as to the matter contained in them and the immediate object of each duty commanded, the duties of the First Table are greater and the duties of the Second Table lesser, the one relating more immediately, the other more mediately to religion, in which respect they express peculiarly our love to God, which is called the first and great command; For the first four commands require that which in its own nature is worship, and is in an immediate way to be given to God; but the duites required in the other six, are not properly, formally and immediately called for as parts of worship to God, though, as they are acknowledgments of Him, they may be consequentially thereto referred.</p></blockquote>

</figure><figure class="quote" id="q-eb3ba0ae08" data-kw="">
<blockquote><p>But I the rather assent to Alexander Hales, because I have read somewhere, I think it is in Hospinian, de Templis, that the Pope has no organ-piping music in his Church or chapel. And these I account the relics of ancient simplicity in worship, which the Pope received from the first bishops of Rome, and regarded not to make alterations of, without advantage.</p></blockquote>

</figure><figure class="quote" id="q-4179e7598d" data-kw="">
<blockquote><p>The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or signification. … Ceremonies are external rites and sacred accidents of the worship of God. They are not of themselves the worship of God, but concomitant adjuncts and assistants by signification, exercise, exercise, work and decorum.</p></blockquote>

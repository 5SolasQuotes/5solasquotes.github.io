<main class="wrap"><figure class="quote" id="q-745348e364" data-kw="">
<blockquote><p>I. They bring that place of Saint John, Chapter 3. Verse 16. Where God is said to have so loved the world, that he gave his Son: which place we have already taught, doth hurt Arminius; and that the sending of the Son is in the following words, restrained to the believers alone. Whence it is manifest, that Christ was not sent, but to save them who were to believe.

I might say that the world is here taken for the faithful alone; as, John 6. 33 and I Tim. 3.16 and Heb. 2.5. But although we grant, that by the world all mankind are contained in the whole, yet it will not thence follow, that Christ purchased Salvation for all, and particular men, doth abundantly testify, that mankind is loved by God.

II. And it is worth the labour to know what meaning the Arminians apply to Christ, and what according to the Arminians is the sense of these Words of Christ. God so loved the world that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life.

According to the Doctrine of Arminius, this must be the sense of these words; God so loved all mankind, with a love wherewith he hath not willed their Salvation that he decreed to send his Son, before he thought of saving man, to purchase for himself the power of saving man, and afterward he decreed to give every man power of believing, if he himself would, that so he might have eternal life. A monster of Doctrine and a new Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 29.1-2, p. 215.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59645f8c5f" data-kw="">
<blockquote><p>One of the English delegates to the Synod of Dort, George Carleton, exhorted the Dutch to preserve the confession of the Reformed churches and to resist the innovations of the Arminians (he does not mention them by name in this extract, but these are the innovators to whom he was referring):

The reformed Churches throughout Europe, having recovered their liberty, and shaken off the heavy yoke of Rome, to shew themselves more thankful to Christ their Redeemer, have severally set forth confessions of their Faith, which though they were many, yet they so well agree in one consent and harmony of minds, that we may plainly discover, it was the voice of one only Spirit, which in so many Nations, so many Languages delivered it self.

In this general concord of other Nations, your consent did bear a part; your praises were in the Gospel, your authority in the Church much set by. But now the neighbour Churches round about enquire, question, and wonder, what it might be which in these confessions your Church alone quarrels with: Against which, none of the rest, since the reformation, have taken exception.

Give me leave to ask of you in the Apostle’s words, Proceeded the Word of God from you alone? or hath it come only unto you? Other Nations and Provinces preserve the doctrine of the Gospel which they have received, whole and sound, without any alteration and change, and resolve by God’s help, hereafter so to continue.

This is that which his Majesty [James I of England] commends unto you, even the unity and consent of Confession, the spring and original of reformation; he commends unto you the consent of the Churches, he requires you, that what form of Church you have received from your Fathers, you will deliver over to your posterity; that what Doctrine now these twenty or thirty years hath been publicly taught amongst you, you preserve in its former purity; that you shut up all gap and inlet, which may every day give way to innovation, that such treasures of Christ as are committed to your trust, you preserve safe, without suffering them to be embased by admixtion of false and counterfeit stuff.

Unto you are committed the Oracles of God; keep your Faith unspotted, and undefiled unto God and Christ the Church’s King: You are seriously to take heed, that your Doctors, leaving the simplicity of holy Scriptures, divert not upon abstruse and intricate quirks; that they set not before you smoke, in stead of solid meat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-carleton.html">George Carleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An oration made at the Hague, before the Prince of Orange and the assembly of the high and mighty lords, the States General of the United Provinces: by the reverend father in God, the Lord Bishop of Llandaff, one of the commissioners sent by the Kings most excellent Majesty to the Synod of Dort</cite>, (London: Ralph Rounthwait, 1619), pp 6-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-edd9b2e278" data-kw="">
<blockquote><p>In a debate at the Westminster Assembly, Edmund Calamy explained the difference between English hypothetical universalist and Arminian views on the extent of the atonement. I am most definitely not a hypothetical universalist but instead a strict particularist, but in order to avoid attacking straw-men, it is important to understand what this view is so that it is not conflated with the Arminian notion of universal atonement.

It is also important to remember that neither the Synod of Dort nor the Westminster Assembly condemned English hypothetical universalism as outside the bounds of Reformed orthodoxy. The strict particularlists and the hypothetical universalists were seen as different regiments in the army of true religion. We do not have to like these facts, but it is good to keep them in mind in order to deal charitably with differing brethren:

I am far from universal redemption in the Arminian sense; but that that I hold is in the sense of our divines in the Synod of Dort, that Christ did pay a price for all, – absolute intention for the elect, conditional intention for the reprobate in case they do believe, – that all men should be salvabiles, non obstant lapsu Adami … that Jesus Christ did not only die sufficiently for all, but God did intend, in giving of Christ, and Christ in giving Himself, did intend to put all men in state of salvation in case they do believe. … I argue from the iii. of Joh[n] 16, in which words a ground of God’s intention of giving Christ, God’s love to the world, a philanthropy the world of elect and reprobate, and not of elect only …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 522, 22 Oct. 1645, pp 152, 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>The Law holdeth forth a perfect righteousness, and will not admit of any other; but the Gospel, that condescends, and brings pardon through Christ. And this is the main difference, and in which they can never be made one. Now the Papists, Arminian, Socinian, and others do overthrow this grand and main difference holding justification by works under some notion, or other: whereas the Apostle maketh an immediate opposition, If of faith, then not of works. The Apostle doth not distinguish of works of nature, and works of grace, or of works of grace perfect imperfect: but speaketh absolutely, &amp; so doth also exclude that subtle opinion, of making faith to justify as a work; for the Apostle, making an opposition between faith and works, must necessarily take faith under such a notion, as cannot be a work. And this truth is that which is the pillar of the Church of God, and that which differenceth us from Jews, Turks, Papists, and many Hereticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 258.</span></figcaption>

l-distinction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-23fccf8c36" data-kw="">
<blockquote><p>The hopes of the Arminians in England were but small so long as K[ing]. James did live, for that good Prince both in word and writing did threaten to burn these Hereticks if any of them should appear in his Dominions; see his Declaration against Vorstius: yea, so long as [George] Abbot was in grace at Court, the Arminians kept a low sail, but after that his Successor even in his own time had come in favour, that unhappy Sect under the patronage of Mountagu and White’s learning began to spread far and near, yea, at last silence in a public Edict was enjoined to their opposers, and all favours conferred on those who had skill and will to promote that Cause, &amp; many evident disgraces poured on well-deserving men for no other reason but their Anti-Arminian spirit.

All this time our Church [the Church of Scotland] was free of these evils; but so soon as the advancers of Arminianism at the English Court, began to intermeddle with the affairs of our Kingdom, at once these men were eyed, who inclined that way, prime places were put into their hands for no other virtue the World could discern in them, but their boldness to let out their inclination towards the Arminian Error.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8d58f9f9b0" data-kw="">
<blockquote><p>XXXII. Finally, it is asked here how Christ can be said to have been heard in that prayer from fear, as the apostle testifies, Heb. V:7 [“Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;”], and elsewhere Christ professes that he is always heard by the Father, Jn. XI:42, when nevertheless death had necessarily to be undergone by him. That which Christ willed simply and absolutely, in that he never suffered a refusal; but that which he willed only under a condition, it is no wonder if he did not obtain it, since that was not so much a will as it was velleity, and that was not so much to be reckoned a rational desire, which ought always to hold the primary place, as a natural inclination and sensitive appetite, which never has the principal role in prayer. 2. Christ was heard from the fear of death, not indeed absolutely, as if He had been freed from the necessity of undergoing death, but in a certain respect, namely, insofar as God, who heard Him, so shook off that fear that He received death most steadfastly and submitted Himself wholly to the divine will, and was thus strengthened so that He laid aside all dread of death. For Christ feared two things above all:

1. Lest He should succumb, overwhelmed by the evils which He saw to be most grievous.

2. Lest He should be swallowed up by death, so that no exit from it would be open. But God heard Him, that is, freed Him from both those fears:

1. Because He so corroborated Him by the power of His Spirit in the midst of the struggle that He most steadfastly and invincibly sustained that most grievous contest.

2. Because He freed Him from death, having loosed the pains of hell by His glorious resurrection; and thus, most truly, in this respect He was heard—not, indeed, that He might not pay the penalty of death, but that He might not be swallowed up by it; not that He might not taste it, but that He might not perish in it; not in the subterfuge of punishments, but in the constant toleration of the same and in a strong and invincible liberation and victory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Satisfaction of Christ</cite>, … (Geneva, 1666), 6th Disputation, which is the Fourth on the Truth of Christ’s Satisfaction, Asserted from his Agony and Desertion tr. AI by The Received Faith, sect. 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b72859a83" data-kw="">
<blockquote><p>The second conclusion pretended to be drawn from this [Rev. 2:21] is that the Lord has a universal will to have all men saved, seeing He gives her time to repent. This we say does not follow hence: For: … 4. It will not follow Christ wills persons to repent; therefore He wills their salvation: because He may be said to will them to repent when He requires it of them as their duty: and thus their duty of repenting is the immediate object of his revealed and preceptive will: but a person’s salvation is the proper object of his will of good-pleasure, or of his decreeing and purposing will. And no otherways can He be said to will such persons’ salvation (because He commands them to repent) than this, to wit, that in His Word He has signified repentance to be such a person’s duty, and that He has appointed a connection between repentance and salvation; which still relates to his revealed will: even as when God made the first Covenant with Adam, it might be said that He willed Adam to be holy, and that by that Covenant He had made a connection between holiness and life; yet it is not proper to say that the Lord willed life to Adam upon that condition, because that looks to the event and respects the Lord’s will of purpose: which cannot but be effectual. And if the Lord’s willing of men (at least such as are under his ordinances) to be saved be thus understood as including only the duty which God lays upon men and the connection that He has made between it and salvation in his Word, it may be admitted: but if it be extended to any antecedent will in God Himself, distinct from that which is called His revealed will, this place and such like will give no ground for such an assertion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 2, Lecture 6, on vv. 18-29, pp. 169-70</span></figcaption>

<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (Herder Book Co., 1950), ch. 10, God’s Will &amp; God’s Love, pp. 104-5</span></figcaption>

<blockquote><p>From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.</p></blockquote>

<blockquote><p>This question is not proposed without cause by us: for on the one hand, if God’s simplicity and immutability are regarded, it will not seem in any way admissible in God that wills be contrary to one another; which also will always be done according to that saying: ‘My will shall be done: and whatsoever He hath willed He hath done.’ Yet if many passages which are handed down in Scripture be considered, we should confess: there is no one who would not say that the will of God is not one only but in a manner manifold: and very often contrary. For He commands many things which do not happen either because He cannot effect them to be, or because He does not will them to be. The former cannot be said without denying God’s omnipotence, and thus deity. Some distinguish between an antecedent will and a consequent will: as [John] Damascus, bk. 2, ch. 46. Others between the will of good-pleasure and the will of sign: as Lombard and the scholastics: Sentences, bk. 1, dist. 45. Others between a will not revealed and a will revealed. Others between absolute volition and conditional volition. Others what God wills to be done respecting us, and into the will which He wills to be from us. Some distinguish in the will of the Almighty a will efficacious and an inefficacious will, as Augustine in the Enchiridion, chs. 102-3. These divisions seem various, but if they be weighed diligently and rightly understood, they reduce to the same. … Efficacious &amp; Inefficacious Will Thirdly, that former and absolute will is also called by Augustine, just as it is most certain, so also most omnipotent, efficacious and invincible: and this is because it is always fulfilled, as much in heaven as on earth. But the other, namely the conditional, is called by the same Augustine the inefficacious will: because, clearly, it is not always fulfilled. For since it depends on conditions which God demands of us, and we do not perform them, it happens that it is not always nor in all things fulfilled, and therefore it is deservedly called inefficacious, namely by itself alone. Let Augustine be read in volume 3, in the Enchiridion to Laurentius, chs. 102-3. Some things also in volume 5, On the City of God, bk. 22, chs. 1-2. …

IV. From those things which I have said, it appears, first, why, although there is only one will of God—that is, one decree concerning all things, as has been demonstrated, and that immutable—it is nevertheless said to be manifold: namely, both on account of the diverse kinds of things which God wills, and on account of the diverse manner of willing, as it seems to us: because, namely, he wills some things simply and absolutely, while other things seem to us to be willed conditionally. Then it is also clear that, although there seem to be many partitions of the divine will, all are nevertheless reduced to one partition: namely, to the absolute and secret will, which is also called the will of Good Pleasure; and to the revealed and conditional will, which is not undeservedly named the will of the sign. And thus, in the third place, it appears that, although in reality there is only one will in God, as has been declared and confirmed, it can nevertheless be said to be manifold by different respects. And conversely, although on account of the diverse reasons by which he seems to will, and by which he explains his will, many wills of his are said to exist: it does not therefore hinder that there is in reality only one will of God, and that constant and eternal: which is the head of this our thesis. For although He wills many things, and indeed willed some things, for example, in the Old Testament, but wills other things in the New: yet He willed both those and these by the same will and decree. He willed those at one time, namely, until the time of correction, as the Apostle says: he wills these at another time, until the end of the world. Behold how the diverse kinds of things which he wills do not in the least cause there to be in reality many wills of God: but one and the same will always remains in God. And although he seems to will many things absolutely, but others conditionally: in reality, however, if one must speak properly, all things whatsoever God wills, He wills absolutely and simply. And consequently, all things which He wills also come to pass. For the fact that he is said to will certain things conditionally: this is to be referred only to the manifestation of that will. For there is no conditional will in God, because this fights against his eternal wisdom: but only in the law. And this also, that He signifies in the law that He wills conditionally: He had decreed by his absolute will to do—namely, not to manifest his will concerning the saving or damning of men without a condition; and this because this would be both useful to us and would conduce to the manifesting of his justice. For it was and is useful to us the elect to know that God does not will that anyone be saved without living faith in Christ: and consequently, if we wish to be saved, that we must believe in Christ. Likewise, this conduced to rendering the reprobate inexcusable. For they know what things are necessary for salvation: and consequently, it served to vindicate the justice of God from all accusations and calumnies. Therefore, because it was expedient, He revealed his will with a condition. And in this respect, the will of God seems to be twofold: which, however, is in reality only one, and that firm and constant. For by one and constant will he absolutely wills only the elect to be saved: and consequently He wills only also by true faith, which can be kept, are given: but the reprobate, are absolutely excluded from this salvation: and therefore, are not given the faith by which they can be blessed in heaven. See how the different modes, by which God seems to will, do not remove the fact that there remains but one, eternal and absolute and immutable will of God, on account of which different modes, different wills also seem to exist.

V. But that He also commands many things to be done, which are not done: it does not follow from this, however, either that He is impotent: as if He could not cause that what He commands, be done: or that there is truly a manifold will in God: one, which He signifies by word, another, which He does not will to be done in His presence, that which He commands. For there are two kinds of God’s commandments: some are simply absolute: and without any condition at all, either expressed or tacit. These are the most certain, absolute and simple testimonies of the divine will, which is called good pleasure. Such was that to Moses, do all things according to the pattern which you saw on the mountain. Likewise, Thus you shall say to the children of Israel: go into Egypt: and other commands of that kind made both to Moses himself and to the prophets. Because these are the very will of God: therefore He who gives these commands, also brings it about that they are done. And of these is that in Isaiah 46, ‘My counsel shall stand: and my will shall be done;’ and Pm. 115, ‘Whatsoever He willed, He did.’ Therefore, as far as this kind of God’s commandments is concerned: it appears that there is one and the same will: that, namely, which is revealed in the Word: and that, which was hidden in the secret counsel of God. Whence does this appear? From the fact that what God commands happens. There are other commandments, which He promulgated with a condition, if not expressed, at least tacit: such as those which we have in the law. Namely, if we wish to enter into life: that this and that is commanded to us, and that these commandments are to be kept, as Christ explained, saying: If you wish to enter into life, keep the commandments. All these things indeed, are proposed conditionally both to the elect and to the reprobate: meanwhile, however, these commandments have a far different reason, insofar as they are made to the elect: and another, insofar as they are made to the reprobate. Insofar as they are made to the elect: although they are proposed with a condition: yet the will of God in them is absolute. For God simply wills: that they be kept by the elect, if not always, at least at length sometime. And for this reason, because they cannot perform these things by their own strength: He gives them the strength of the Spirit, by which they can; just as He promises through Ezekiel: I will cause that you walk in my commandments. And because even with the strength which the Lord supplies, they cannot perfectly keep the commandments in themselves: He brings it about that they keep them perfectly in Christ: insofar as namely: And through Christ their transgressions are not imputed to them: and on account of Christ, their begun obedience, serving as most perfect, is accepted: and on the contrary, Christ’s justice and obedience are imputed to them: and because finally, at the end in heaven most perfectly, even in themselves, they will complete the sum of the law. In this way also it appears, that the will of God, which is revealed in the commandments: is one and the same in reality with the secret will and will of good pleasure. Therefore, neither here are there two different wills, but one. God acts in giving the law to the elect, as a parent in prescribing laws to his children. He not only teaches what He requires of them: but also signifies that He altogether wills that they keep them, whether they want to or not. But towards the reprobate, He acts as a Lord towards his servants. He will promulgate merely conditional laws: if they want to be with Him, [He wills] altogether that they conduct themselves thus: if not, let them depart. Thus God. Therefore, insofar as these commandments are given to the reprobate, and likewise promises are added to them: all are truly conditional. For the will of God is not absolute, that the reprobate keep them: or attain the promises. This is clear, both from the one example of ‘Pharaoh, I will harden, lest he let the people go:’ and from the fact that they do not keep them, neither in themselves, nor in Christ: in whom they are not: nor ever will keep them. But those things which God properly wills: He brings it about that all of them be accomplished: according to that, All things, whatsoever He willed, He did: And that in Isa. 46, ‘My counsel shall stand, and my will shall be done.’ Wherefore there is not here a double will of God in reality: one in the law, another in the mind and essence of God: for it is not the will of God that the impious should keep the law, as has been said. No one, therefore, will be able to infer in any way from the precepts of God that there is a double will in reality. I will speak more briefly and clearly. The Law can be considered in two ways: either insofar as it is Torah (doctrine), by which it is taught what is pleasing to God, and what must be done by us, or not done, if we wish to be saved: in this way the Law is taught as pertaining to all, both the reprobate and the elect. And because it reveals and teaches what is right and pleasing to God: that is therefore said to be the will of God, because it reflects the nature of God, and what God loves and approves. Or it is considered insofar as it is Torah (commandment): that is, the true testimony of the secret will, or what He wills to be done by us at all. In this way it pertains only to the elect. This will of God, revealed in the law, is fulfilled by the elect: in the way that was mentioned above: and as God wills it to be done by them. The impious, however, the reprobate, while they act against the doctrine of the law, and thereby against their own duty: they do not act against the absolute, true, and properly so-called will of God: but they are said to act against the will of God for this reason, because they act against that which they know to be pleasing to God, and to be approved by God. But if you object that they therefore do not properly sin, because they do not act against the will of God, which is properly the will of God: that exception is easily refuted. For sin is defined, not as what is a transgression of the secret will and divine good pleasure: but as what is a transgression of the divine law: and what is 1 Jn. 3:4, lawlessness (anomia). For we sin for this reason, because we do not perform the things that are good and pleasing to God, and commanded and owed by us, but the contrary. In the law, however, are manifested: what all men owe to God by duty, and what they do not owe. Therefore, they sin more gravely who act against these things, and are therefore said to sin against the will of God: because they sin against that doctrine by which we are taught what is consistent with the nature of God, and what we owe Him by duty: and what is in itself pleasing and acceptable to God. But if you object again: but God therefore mocks the reprobate: when He commands that they do this or that: if this is not His certain and definite will. He does not mock them at all: because by His law, although He does not reveal what He absolutely wills to be done by them (for this is properly the will of God), yet He clearly teaches what is the duty of Him and of every man. Therefore, the law is deservedly called by Moses, Torah (doctrine): because it teaches everyone what his duty is: adding moreover, that whoever has acted against this duty of his, sins gravely and becomes liable to death. On the contrary, he who has done his duty: him [He rewards]. Lest this seem insufficient to you? Or is this mocking? Tell me, I pray: In the parable of the Gospel, those who were first invited to the wedding, and did not come: was it therefore a mockery to them by the king: because he only signified to them what would be pleasing to him, and what was their duty: and did not command them to be compelled, as the second ones, to come to the wedding? Not at all. Yet meanwhile, the will of the king in inviting the first was not that which it was in the second. For in calling these latter, the will of the king was absolute: that they should come at all, and therefore he also brought it about that they should come at all. To the former, however, he only signified: and that candidly and ingenuously: what would be pleasing to Him. As therefore it cannot be said that He called the first to the wedding with an invitation: although the will of the King was not absolute and simple that they come, as it was in calling the second: so neither can it be said that God mocks the reprobate when He gives them the law and calls them: although it is not His will that they come and obey the law. For it is enough to render them inexcusable: that they understand what things are pleasing to God, and what is their duty what things are pleasing to God, and what is their duty: they would have taken and thought that they were doing it by their own virtue, from God, who has absolute right over them and over all, to be commanded. To that point, that God commanded Abraham to kill his son, when nevertheless He did not want him killed: and to Pharaoh, to let the people go, when nevertheless He did not want them to be let go: and from this many try to gather that there were two, and those contrary, wills in God: one expressed by word, the other hidden in His own mind: We answer that this does not follow at all. For there was only one, and that a constant will: namely, that Abraham’s son was not to be killed: nor was the people to be let go by Pharaoh: and thus both were fulfilled. But as for the command given to Pharaoh, it was a doctrine by which He signified what was to be done by Pharaoh if he did not want to be afflicted by so many plagues: and what was his duty, and in itself just and owed: but it was not a testimony of His absolute will. Wherefore it does not follow from that that there were two wills of God. In the command also given to Abraham, it was not a simple will of God that he should kill his son: but only that he should take the sword, with the intention of killing and sacrificing, and that for the sake of God: and thus show his piety towards God, and his promptness in obeying: which was also entirely done: because this was the will of God. But the will of God did not extend as far as the killing. Therefore, when Abraham, having finished all other things, had extended the sword with which he might slaughter his son: the Lord forbade him to do it. To which will also Abraham complied. Thus neither here was there a double will of God: but one. And the Lord said: offer your son as a burnt offering: this therefore was the will of God: and yet afterwards, He signified another will. It was not another: for He did not first want that it should come to the actual slaughter. Therefore Moses premises, The Lord tempted Abraham: but He only wanted that, with other things actually performed, he should also slaughter him with the promptness of his mind, not with the sword. For this is that which, first and properly, the Lord requires in His precepts: that is, that we should be prompt in mind for His obedience, and by this promptness of our mind of ours, the commandments are properly fulfilled before God. The sum in almost all these arguments is admitted as a parable: for the will of God, properly accepted, is the absolute, certain, and firm decree of God, concerning things to be done, either by Himself or by others: and that this is always fulfilled, and is immutable, we do not doubt to affirm. But the Law and all commandments are called the will of God: because by them it is signified and taught what is in itself just, and pleasing to God: and what is required of us, if we wish to be saved. But alone, it is not properly the will of God: but the Torah, the doctrine of the just: and the command of doing it. But if with this doctrine and command there is joined the decree of God, by which He absolutely wills that what He requires be performed: then it will be said to be properly the will of God: as it is, in so far as it is given to the elect. Wherefore not undeservedly they have distinguished in the schools, not indeed the will of God itself: but the signification of the name of the will of God: in so far as it sometimes signifies the decree of God itself, and the good-pleasure: which is properly called will: whence it is also called the will of good-pleasure, and absolute will, because it is without condition: and most omnipotent, because it is always done. But sometimes it signifies that which is in itself pleasing to God, and just: and which the nature of the divine genius refers to: and which is required of us, if we wish to be saved: which is properly called law, and Torah: whence also will is signified: because by this doctrine it is signified what is pleasing to God, and what is of our duty: And conditional will, because these things are required of us, if we wish to obtain eternal salvation. In truth, however, the will of God, properly accepted, is only one, and that perpetual, and firm: as has now been sufficiently and abundantly declared.</p></blockquote>

IV. From those things which I have said, it appears, first, why, although there is only one will of God—that is, one decree concerning all things, as has been demonstrated, and that immutable—it is nevertheless said to be manifold: namely, both on account of the diverse kinds of things which God wills, and on account of the diverse manner of willing, as it seems to us: because, namely, he wills some things simply and absolutely, while other things seem to us to be willed conditionally. Then it is also clear that, although there seem to be many partitions of the divine will, all are nevertheless reduced to one partition: namely, to the absolute and secret will, which is also called the will of Good Pleasure; and to the revealed and conditional will, which is not undeservedly named the will of the sign. And thus, in the third place, it appears that, although in reality there is only one will in God, as has been declared and confirmed, it can nevertheless be said to be manifold by different respects. And conversely, although on account of the diverse reasons by which he seems to will, and by which he explains his will, many wills of his are said to exist: it does not therefore hinder that there is in reality only one will of God, and that constant and eternal: which is the head of this our thesis. For although He wills many things, and indeed willed some things, for example, in the Old Testament, but wills other things in the New: yet He willed both those and these by the same will and decree. He willed those at one time, namely, until the time of correction, as the Apostle says: he wills these at another time, until the end of the world. Behold how the diverse kinds of things which he wills do not in the least cause there to be in reality many wills of God: but one and the same will always remains in God. And although he seems to will many things absolutely, but others conditionally: in reality, however, if one must speak properly, all things whatsoever God wills, He wills absolutely and simply. And consequently, all things which He wills also come to pass. For the fact that he is said to will certain things conditionally: this is to be referred only to the manifestation of that will. For there is no conditional will in God, because this fights against his eternal wisdom: but only in the law. And this also, that He signifies in the law that He wills conditionally: He had decreed by his absolute will to do—namely, not to manifest his will concerning the saving or damning of men without a condition; and this because this would be both useful to us and would conduce to the manifesting of his justice. For it was and is useful to us the elect to know that God does not will that anyone be saved without living faith in Christ: and consequently, if we wish to be saved, that we must believe in Christ. Likewise, this conduced to rendering the reprobate inexcusable. For they know what things are necessary for salvation: and consequently, it served to vindicate the justice of God from all accusations and calumnies. Therefore, because it was expedient, He revealed his will with a condition. And in this respect, the will of God seems to be twofold: which, however, is in reality only one, and that firm and constant. For by one and constant will he absolutely wills only the elect to be saved: and consequently He wills only also by true faith, which can be kept, are given: but the reprobate, are absolutely excluded from this salvation: and therefore, are not given the faith by which they can be blessed in heaven. See how the different modes, by which God seems to will, do not remove the fact that there remains but one, eternal and absolute and immutable will of God, on account of which different modes, different wills also seem to exist.

V. But that He also commands many things to be done, which are not done: it does not follow from this, however, either that He is impotent: as if He could not cause that what He commands, be done: or that there is truly a manifold will in God: one, which He signifies by word, another, which He does not will to be done in His presence, that which He commands. For there are two kinds of God’s commandments: some are simply absolute: and without any condition at all, either expressed or tacit. These are the most certain, absolute and simple testimonies of the divine will, which is called good pleasure. Such was that to Moses, do all things according to the pattern which you saw on the mountain. Likewise, Thus you shall say to the children of Israel: go into Egypt: and other commands of that kind made both to Moses himself and to the prophets. Because these are the very will of God: therefore He who gives these commands, also brings it about that they are done. And of these is that in Isaiah 46, ‘My counsel shall stand: and my will shall be done;’ and Pm. 115, ‘Whatsoever He willed, He did.’ Therefore, as far as this kind of God’s commandments is concerned: it appears that there is one and the same will: that, namely, which is revealed in the Word: and that, which was hidden in the secret counsel of God. Whence does this appear? From the fact that what God commands happens. There are other commandments, which He promulgated with a condition, if not expressed, at least tacit: such as those which we have in the law. Namely, if we wish to enter into life: that this and that is commanded to us, and that these commandments are to be kept, as Christ explained, saying: If you wish to enter into life, keep the commandments. All these things indeed, are proposed conditionally both to the elect and to the reprobate: meanwhile, however, these commandments have a far different reason, insofar as they are made to the elect: and another, insofar as they are made to the reprobate. Insofar as they are made to the elect: although they are proposed with a condition: yet the will of God in them is absolute. For God simply wills: that they be kept by the elect, if not always, at least at length sometime. And for this reason, because they cannot perform these things by their own strength: He gives them the strength of the Spirit, by which they can; just as He promises through Ezekiel: I will cause that you walk in my commandments. And because even with the strength which the Lord supplies, they cannot perfectly keep the commandments in themselves: He brings it about that they keep them perfectly in Christ: insofar as namely: And through Christ their transgressions are not imputed to them: and on account of Christ, their begun obedience, serving as most perfect, is accepted: and on the contrary, Christ’s justice and obedience are imputed to them: and because finally, at the end in heaven most perfectly, even in themselves, they will complete the sum of the law. In this way also it appears, that the will of God, which is revealed in the commandments: is one and the same in reality with the secret will and will of good pleasure. Therefore, neither here are there two different wills, but one. God acts in giving the law to the elect, as a parent in prescribing laws to his children. He not only teaches what He requires of them: but also signifies that He altogether wills that they keep them, whether they want to or not. But towards the reprobate, He acts as a Lord towards his servants. He will promulgate merely conditional laws: if they want to be with Him, [He wills] altogether that they conduct themselves thus: if not, let them depart. Thus God. Therefore, insofar as these commandments are given to the reprobate, and likewise promises are added to them: all are truly conditional. For the will of God is not absolute, that the reprobate keep them: or attain the promises. This is clear, both from the one example of ‘Pharaoh, I will harden, lest he let the people go:’ and from the fact that they do not keep them, neither in themselves, nor in Christ: in whom they are not: nor ever will keep them. But those things which God properly wills: He brings it about that all of them be accomplished: according to that, All things, whatsoever He willed, He did: And that in Isa. 46, ‘My counsel shall stand, and my will shall be done.’ Wherefore there is not here a double will of God in reality: one in the law, another in the mind and essence of God: for it is not the will of God that the impious should keep the law, as has been said. No one, therefore, will be able to infer in any way from the precepts of God that there is a double will in reality. I will speak more briefly and clearly. The Law can be considered in two ways: either insofar as it is Torah (doctrine), by which it is taught what is pleasing to God, and what must be done by us, or not done, if we wish to be saved: in this way the Law is taught as pertaining to all, both the reprobate and the elect. And because it reveals and teaches what is right and pleasing to God: that is therefore said to be the will of God, because it reflects the nature of God, and what God loves and approves. Or it is considered insofar as it is Torah (commandment): that is, the true testimony of the secret will, or what He wills to be done by us at all. In this way it pertains only to the elect. This will of God, revealed in the law, is fulfilled by the elect: in the way that was mentioned above: and as God wills it to be done by them. The impious, however, the reprobate, while they act against the doctrine of the law, and thereby against their own duty: they do not act against the absolute, true, and properly so-called will of God: but they are said to act against the will of God for this reason, because they act against that which they know to be pleasing to God, and to be approved by God. But if you object that they therefore do not properly sin, because they do not act against the will of God, which is properly the will of God: that exception is easily refuted. For sin is defined, not as what is a transgression of the secret will and divine good pleasure: but as what is a transgression of the divine law: and what is 1 Jn. 3:4, lawlessness (anomia). For we sin for this reason, because we do not perform the things that are good and pleasing to God, and commanded and owed by us, but the contrary. In the law, however, are manifested: what all men owe to God by duty, and what they do not owe. Therefore, they sin more gravely who act against these things, and are therefore said to sin against the will of God: because they sin against that doctrine by which we are taught what is consistent with the nature of God, and what we owe Him by duty: and what is in itself pleasing and acceptable to God. But if you object again: but God therefore mocks the reprobate: when He commands that they do this or that: if this is not His certain and definite will. He does not mock them at all: because by His law, although He does not reveal what He absolutely wills to be done by them (for this is properly the will of God), yet He clearly teaches what is the duty of Him and of every man. Therefore, the law is deservedly called by Moses, Torah (doctrine): because it teaches everyone what his duty is: adding moreover, that whoever has acted against this duty of his, sins gravely and becomes liable to death. On the contrary, he who has done his duty: him [He rewards]. Lest this seem insufficient to you? Or is this mocking? Tell me, I pray: In the parable of the Gospel, those who were first invited to the wedding, and did not come: was it therefore a mockery to them by the king: because he only signified to them what would be pleasing to him, and what was their duty: and did not command them to be compelled, as the second ones, to come to the wedding? Not at all. Yet meanwhile, the will of the king in inviting the first was not that which it was in the second. For in calling these latter, the will of the king was absolute: that they should come at all, and therefore he also brought it about that they should come at all. To the former, however, he only signified: and that candidly and ingenuously: what would be pleasing to Him. As therefore it cannot be said that He called the first to the wedding with an invitation: although the will of the King was not absolute and simple that they come, as it was in calling the second: so neither can it be said that God mocks the reprobate when He gives them the law and calls them: although it is not His will that they come and obey the law. For it is enough to render them inexcusable: that they understand what things are pleasing to God, and what is their duty what things are pleasing to God, and what is their duty: they would have taken and thought that they were doing it by their own virtue, from God, who has absolute right over them and over all, to be commanded. To that point, that God commanded Abraham to kill his son, when nevertheless He did not want him killed: and to Pharaoh, to let the people go, when nevertheless He did not want them to be let go: and from this many try to gather that there were two, and those contrary, wills in God: one expressed by word, the other hidden in His own mind: We answer that this does not follow at all. For there was only one, and that a constant will: namely, that Abraham’s son was not to be killed: nor was the people to be let go by Pharaoh: and thus both were fulfilled. But as for the command given to Pharaoh, it was a doctrine by which He signified what was to be done by Pharaoh if he did not want to be afflicted by so many plagues: and what was his duty, and in itself just and owed: but it was not a testimony of His absolute will. Wherefore it does not follow from that that there were two wills of God. In the command also given to Abraham, it was not a simple will of God that he should kill his son: but only that he should take the sword, with the intention of killing and sacrificing, and that for the sake of God: and thus show his piety towards God, and his promptness in obeying: which was also entirely done: because this was the will of God. But the will of God did not extend as far as the killing. Therefore, when Abraham, having finished all other things, had extended the sword with which he might slaughter his son: the Lord forbade him to do it. To which will also Abraham complied. Thus neither here was there a double will of God: but one. And the Lord said: offer your son as a burnt offering: this therefore was the will of God: and yet afterwards, He signified another will. It was not another: for He did not first want that it should come to the actual slaughter. Therefore Moses premises, The Lord tempted Abraham: but He only wanted that, with other things actually performed, he should also slaughter him with the promptness of his mind, not with the sword. For this is that which, first and properly, the Lord requires in His precepts: that is, that we should be prompt in mind for His obedience, and by this promptness of our mind of ours, the commandments are properly fulfilled before God. The sum in almost all these arguments is admitted as a parable: for the will of God, properly accepted, is the absolute, certain, and firm decree of God, concerning things to be done, either by Himself or by others: and that this is always fulfilled, and is immutable, we do not doubt to affirm. But the Law and all commandments are called the will of God: because by them it is signified and taught what is in itself just, and pleasing to God: and what is required of us, if we wish to be saved. But alone, it is not properly the will of God: but the Torah, the doctrine of the just: and the command of doing it. But if with this doctrine and command there is joined the decree of God, by which He absolutely wills that what He requires be performed: then it will be said to be properly the will of God: as it is, in so far as it is given to the elect. Wherefore not undeservedly they have distinguished in the schools, not indeed the will of God itself: but the signification of the name of the will of God: in so far as it sometimes signifies the decree of God itself, and the good-pleasure: which is properly called will: whence it is also called the will of good-pleasure, and absolute will, because it is without condition: and most omnipotent, because it is always done. But sometimes it signifies that which is in itself pleasing to God, and just: and which the nature of the divine genius refers to: and which is required of us, if we wish to be saved: which is properly called law, and Torah: whence also will is signified: because by this doctrine it is signified what is pleasing to God, and what is of our duty: And conditional will, because these things are required of us, if we wish to obtain eternal salvation. In truth, however, the will of God, properly accepted, is only one, and that perpetual, and firm: as has now been sufficiently and abundantly declared.”

+is+most+certain%2C+so+also+most+omnipotent%2C+efficacious+and+invincible%3A+and+this+is+because+it+is+always+fulfilled%2C+as+much+in+heaven+as+on+earth.+But+the+other%2C+namely+the+conditional%2C+is+called+by+the+same+Augustine+the+inefficacious+will%3A+because%2C+clearly%2C+it+is+not+always+fulfilled.+For+since+it+depends+on+conditions+which+God+demands+of+us%2C+and+we+do+not+perform+them%2C+it+happens+that+it+is+not+always+nor+in+all+things+fulfilled%2C+and+therefore+it+is+deservedly+called+inefficacious%2C+namely+by+itself+alone.+Let+Augustine+be+read+in+volume+3%2C+in+the+Enchiridion+to+Laurentius%2C+chs.+102-3.+Some+things+also+in+volume+5%2C+On+the+City+of+God%2C+bk.+22%2C+chs.+1-2.+%E2%80%A6+IV.+From+those+things+which+I+have+said%2C+it+appears%2C+first%2C+why%2C+although+there+is+only+one+will+of+God%E2%80%94that+is%2C+one+decree+concerning+all+things%2C+as+has+been+demonstrated%2C+and+that+immutable%E2%80%94it+is+nevertheless+said+to+be+manifold%3A+namely%2C+both+on+account+of+the+diverse+kinds+of+things+which+God+wills%2C+and+on+account+of+the+diverse+manner+of+willing%2C+as+it+seems+to+us%3A+because%2C+namely%2C+he+wills+some+things+simply+and+absolutely%2C+while+other+things+seem+to+us+to+be+willed+conditionally.+Then+it+is+also+clear+that%2C+although+there+seem+to+be+many+partitions+of+the+divine+will%2C+all+are+nevertheless+reduced+to+one+partition%3A+namely%2C+to+the+absolute+and+secret+will%2C+which+is+also+called+the+will+of+Good+Pleasure%3B+and+to+the+revealed+and+conditional+will%2C+which+is+not+undeservedly+named+the+will+of+the+sign.+And+thus%2C+in+the+third+place%2C+it+appears+that%2C+although+in+reality+there+is+only+one+will+in+God%2C+as+has+been+declared+and+confirmed%2C+it+can+nevertheless+be+said+to+be+manifold+by+different+respects.+And+conversely%2C+although+on+account+of+the+diverse+reasons+by+which+he+seems+to+will%2C+and+by+which+he+explains+his+will%2C+many+wills+of+his+are+said+to+exist%3A+it+does+not+therefore+hinder+that+there+is+in+reality+only+one+will+of+God%2C+and+that+constant+and+eternal%3A+which+is+the+head+of+this+our+thesis.+For+although+He+wills+many+things%2C+and+indeed+willed+some+things%2C+for+example%2C+in+the+Old+Testament%2C+but+wills+other+things+in+the+New%3A+yet+He+willed+both+those+and+these+by+the+same+will+and+decree.+He+willed+those+at+one+time%2C+namely%2C+until+the+time+of+correction%2C+as+the+Apostle+says%3A+he+wills+these+at+another+time%2C+until+the+end+of+the+world.+Behold+how+the+diverse+kinds+of+things+which+he+wills+do+not+in+the+least+cause+there+to+be+in+reality+many+wills+of+God%3A+but+one+and+the+same+will+always+remains+in+God.+And+although+he+seems+to+will+many+things+absolutely%2C+but+others+conditionally%3A+in+reality%2C+however%2C+if+one+must+speak+properly%2C+all+things+whatsoever+God+wills%2C+He+wills+absolutely+and+simply.+And+consequently%2C+all+things+which+He+wills+also+come+to+pass.+For+the+fact+that+he+is+said+to+will+certain+things+conditionally%3A+this+is+to+be+referred+only+to+the+manifestation+of+that+will.+For+there+is+no+conditional+will+in+God%2C+because+this+fights+against+his+eternal+wisdom%3A+but+only+in+the+law.+And+this+also%2C+that+He+signifies+in+the+law+that+He+wills+conditionally%3A+He+had+decreed+by+his+absolute+will+to+do%E2%80%94namely%2C+not+to+manifest+his+will+concerning+the+saving+or+damning+of+men+without+a+condition%3B+and+this+because+this+would+be+both+useful+to+us+and+would+conduce+to+the+manifesting+of+his+justice.+For+it+was+and+is+useful+to+us+the+elect+to+know+that+God+does+not+will+that+anyone+be+saved+without+living+faith+in+Christ%3A+and+consequently%2C+if+we+wish+to+be+saved%2C+that+we+must+believe+in+Christ.+Likewise%2C+this+conduced+to+rendering+the+reprobate+inexcusable.+For+they+know+what+things+are+necessary+for+salvation%3A+and+consequently%2C+it+served+to+vindicate+the+justice+of+God+from+all+accusations+and+calumnies.+Therefore%2C+because+it+was+expedient%2C+He+revealed+his+will+with+a+condition.+And+in+this+respect%2C+the+will+of+God+seems+to+be+twofold%3A+which%2C+however%2C+is+in+reality+only+one%2C+and+that+firm+and+constant.+For+by+one+and+constant+will+he+absolutely+wills+only+the+elect+to+be+saved%3A+and+consequently+He+wills+only+also+by+true+faith%2C+which+can+be+kept%2C+are+given%3A+but+the+reprobate%2C+are+absolutely+excluded+from+this+salvation%3A+and+therefore%2C+are+not+given+the+faith+by+which+they+can+be+blessed+in+heaven.+See+how+the+different+modes%2C+by+which+God+seems+to+will%2C+do+not+remove+the+fact+that+there+remains+but+one%2C+eternal+and+absolute+and+immutable+will+of+God%2C+on+account+of+which+different+modes%2C+different+wills+also+seem+to+exist.+V.+But+that+He+also+commands+many+things+to+be+done%2C+which+are+not+done%3A+it+does+not+follow+from+this%2C+however%2C+either+that+He+is+impotent%3A+as+if+He+could+not+cause+that+what+He+commands%2C+be+done%3A+or+that+there+is+truly+a+manifold+will+in+God%3A+one%2C+which+He+signifies+by+word%2C+another%2C+which+He+does+not+will+to+be+done+in+His+presence%2C+that+which+He+commands.+For+there+are+two+kinds+of+God%E2%80%99s+commandments%3A+some+are+simply+absolute%3A+and+without+any+condition+at+all%2C+either+expressed+or+tacit.+These+are+the+most+certain%2C+absolute+and+simple+testimonies+of+the+divine+will%2C+which+is+called+good+pleasure.+Such+was+that+to+Moses%2C+do+all+things+according+to+the+pattern+which+you+saw+on+the+mountain.+Likewise%2C+Thus+you+shall+say+to+the+children+of+Israel%3A+go+into+Egypt%3A+and+other+commands+of+that+kind+made+both+to+Moses+himself+and+to+the+prophets.+Because+these+are+the+very+will+of+God%3A+therefore+He+who+gives+these+commands%2C+also+brings+it+about+that+they+are+done.+And+of+these+is+that+in+Isaiah+46%2C+%E2%80%98My+counsel+shall+stand%3A+and+my+will+shall+be+done%3B%E2%80%99+and+Pm.+115%2C+%E2%80%98Whatsoever+He+willed%2C+He+did.%E2%80%99+Therefore%2C+as+far+as+this+kind+of+God%E2%80%99s+commandments+is+concerned%3A+it+appears+that+there+is+one+and+the+same+will%3A+that%2C+namely%2C+which+is+revealed+in+the+Word%3A+and+that%2C+which+was+hidden+in+the+secret+counsel+of+God.+Whence+does+this+appear%3F+From+the+fact+that+what+God+commands+happens.+There+are+other+commandments%2C+which+He+promulgated+with+a+condition%2C+if+not+expressed%2C+at+least+tacit%3A+such+as+those+which+we+have+in+the+law.+Namely%2C+if+we+wish+to+enter+into+life%3A+that+this+and+that+is+commanded+to+us%2C+and+that+these+commandments+are+to+be+kept%2C+as+Christ+explained%2C+saying%3A+If+you+wish+to+enter+into+life%2C+keep+the+commandments.+All+these+things+indeed%2C+are+proposed+conditionally+both+to+the+elect+and+to+the+reprobate%3A+meanwhile%2C+however%2C+these+commandments+have+a+far+different+reason%2C+insofar+as+they+are+made+to+the+elect%3A+and+another%2C+insofar+as+they+are+made+to+the+reprobate.+Insofar+as+they+are+made+to+the+elect%3A+although+they+are+proposed+with+a+condition%3A+yet+the+will+of+God+in+them+is+absolute.+For+God+simply+wills%3A+that+they+be+kept+by+the+elect%2C+if+not+always%2C+at+least+at+length+sometime.+And+for+this+reason%2C+because+they+cannot+perform+these+things+by+their+own+strength%3A+He+gives+them+the+strength+of+the+Spirit%2C+by+which+they+can%3B+just+as+He+promises+through+Ezekiel%3A+I+will+cause+that+you+walk+in+my+commandments.+And+because+even+with+the+strength+which+the+Lord+supplies%2C+they+cannot+perfectly+keep+the+commandments+in+themselves%3A+He+brings+it+about+that+they+keep+them+perfectly+in+Christ%3A+insofar+as+namely%3A+And+through+Christ+their+transgressions+are+not+imputed+to+them%3A+and+on+account+of+Christ%2C+their+begun+obedience%2C+serving+as+most+perfect%2C+is+accepted%3A+and+on+the+contrary%2C+Christ%E2%80%99s+justice+and+obedience+are+imputed+to+them%3A+and+because+finally%2C+at+the+end+in+heaven+most+perfectly%2C+even+in+themselves%2C+they+will+complete+the+sum+of+the+law.+In+this+way+also+it+appears%2C+that+the+will+of+God%2C+which+is+revealed+in+the+commandments%3A+is+one+and+the+same+in+reality+with+the+secret+will+and+will+of+good+pleasure.+Therefore%2C+neither+here+are+there+two+different+wills%2C+but+one.+God+acts+in+giving+the+law+to+the+elect%2C+as+a+parent+in+prescribing+laws+to+his+children.+He+not+only+teaches+what+He+requires+of+them%3A+but+also+signifies+that+He+altogether+wills+that+they+keep+them%2C+whether+they+want+to+or+not.+But+towards+the+reprobate%2C+He+acts+as+a+Lord+towards+his+servants.+He+will+promulgate+merely+conditional+laws%3A+if+they+want+to+be+with+Him%2C+%5BHe+wills%5D+altogether+that+they+conduct+themselves+thus%3A+if+not%2C+let+them+depart.+Thus+God.+Therefore%2C+insofar+as+these+commandments+are+given+to+the+reprobate%2C+and+likewise+promises+are+added+to+them%3A+all+are+truly+conditional.+For+the+will+of+God+is+not+absolute%2C+that+the+reprobate+keep+them%3A+or+attain+the+promises.+This+is+clear%2C+both+from+the+one+example+of+%E2%80%98Pharaoh%2C+I+will+harden%2C+lest+he+let+the+people+go%3A%E2%80%99+and+from+the+fact+that+they+do+not+keep+them%2C+neither+in+themselves%2C+nor+in+Christ%3A+in+whom+they+are+not%3A+nor+ever+will+keep+them.+But+those+things+which+God+properly+wills%3A+He+brings+it+about+that+all+of+them+be+accomplished%3A+according+to+that%2C+All+things%2C+whatsoever+He+willed%2C+He+did%3A+And+that+in+Isa.+46%2C+%E2%80%98My+counsel+shall+stand%2C+and+my+will+shall+be+done.%E2%80%99+Wherefore+there+is+not+here+a+double+will+of+God+in+reality%3A+one+in+the+law%2C+another+in+the+mind+and+essence+of+God%3A+for+it+is+not+the+will+of+God+that+the+impious+should+keep+the+law%2C+as+has+been+said.+No+one%2C+therefore%2C+will+be+able+to+infer+in+any+way+from+the+precepts+of+God+that+there+is+a+double+will+in+reality.+I+will+speak+more+briefly+and+clearly.+The+Law+can+be+considered+in+two+ways%3A+either+insofar+as+it+is+Torah+%28doctrine%29%2C+by+which+it+is+taught+what+is+pleasing+to+God%2C+and+what+must+be+done+by+us%2C+or+not+done%2C+if+we+wish+to+be+saved%3A+in+this+way+the+Law+is+taught+as+pertaining+to+all%2C+both+the+reprobate+and+the+elect.+And+because+it+reveals+and+teaches+what+is+right+and+pleasing+to+God%3A+that+is+therefore+said+to+be+the+will+of+God%2C+because+it+reflects+the+nature+of+God%2C+and+what+God+loves+and+approves.+Or+it+is+considered+insofar+as+it+is+Torah+%28commandment%29%3A+that+is%2C+the+true+testimony+of+the+secret+will%2C+or+what+He+wills+to+be+done+by+us+at+all.+In+this+way+it+pertains+only+to+the+elect.+This+will+of+God%2C+revealed+in+the+law%2C+is+fulfilled+by+the+elect%3A+in+the+way+that+was+mentioned+above%3A+and+as+God+wills+it+to+be+done+by+them.+The+impious%2C+however%2C+the+reprobate%2C+while+they+act+against+the+doctrine+of+the+law%2C+and+thereby+against+their+own+duty%3A+they+do+not+act+against+the+absolute%2C+true%2C+and+properly+so-called+will+of+God%3A+but+they+are+said+to+act+against+the+will+of+God+for+this+reason%2C+because+they+act+against+that+which+they+know+to+be+pleasing+to+God%2C+and+to+be+approved+by+God.+But+if+you+object+that+they+therefore+do+not+properly+sin%2C+because+they+do+not+act+against+the+will+of+God%2C+which+is+properly+the+will+of+God%3A+that+exception+is+easily+refuted.+For+sin+is+defined%2C+not+as+what+is+a+transgression+of+the+secret+will+and+divine+good+pleasure%3A+but+as+what+is+a+transgression+of+the+divine+law%3A+and+what+is+1+Jn.+3%3A4%2C+lawlessness+%28anomia%29.+For+we+sin+for+this+reason%2C+because+we+do+not+perform+the+things+that+are+good+and+pleasing+to+God%2C+and+commanded+and+owed+by+us%2C+but+the+contrary.+In+the+law%2C+however%2C+are+manifested%3A+what+all+men+owe+to+God+by+duty%2C+and+what+they+do+not+owe.+Therefore%2C+they+sin+more+gravely+who+act+against+these+things%2C+and+are+therefore+said+to+sin+against+the+will+of+God%3A+because+they+sin+against+that+doctrine+by+which+we+are+taught+what+is+consistent+with+the+nature+of+God%2C+and+what+we+owe+Him+by+duty%3A+and+what+is+in+itself+pleasing+and+acceptable+to+God.+But+if+you+object+again%3A+but+God+therefore+mocks+the+reprobate%3A+when+He+commands+that+they+do+this+or+that%3A+if+this+is+not+His+certain+and+definite+will.+He+does+not+mock+them+at+all%3A+because+by+His+law%2C+although+He+does+not+reveal+what+He+absolutely+wills+to+be+done+by+them+%28for+this+is+properly+the+will+of+God%29%2C+yet+He+clearly+teaches+what+is+the+duty+of+Him+and+of+every+man.+Therefore%2C+the+law+is+deservedly+called+by+Moses%2C+Torah+%28doctrine%29%3A+because+it+teaches+everyone+what+his+duty+is%3A+adding+moreover%2C+that+whoever+has+acted+against+this+duty+of+his%2C+sins+gravely+and+becomes+liable+to+death.+On+the+contrary%2C+he+who+has+done+his+duty%3A+him+%5BHe+rewards%5D.+Lest+this+seem+insufficient+to+you%3F+Or+is+this+mocking%3F+Tell+me%2C+I+pray%3A+In+the+parable+of+the+Gospel%2C+those+who+were+first+invited+to+the+wedding%2C+and+did+not+come%3A+was+it+therefore+a+mockery+to+them+by+the+king%3A+because+he+only+signified+to+them+what+would+be+pleasing+to+him%2C+and+what+was+their+duty%3A+and+did+not+command+them+to+be+compelled%2C+as+the+second+ones%2C+to+come+to+the+wedding%3F+Not+at+all.+Yet+meanwhile%2C+the+will+of+the+king+in+inviting+the+first+was+not+that+which+it+was+in+the+second.+For+in+calling+these+latter%2C+the+will+of+the+king+was+absolute%3A+that+they+should+come+at+all%2C+and+therefore+he+also+brought+it+about+that+they+should+come+at+all.+To+the+former%2C+however%2C+he+only+signified%3A+and+that+candidly+and+ingenuously%3A+what+would+be+pleasing+to+Him.+As+therefore+it+cannot+be+said+that+He+called+the+first+to+the+wedding+with+an+invitation%3A+although+the+will+of+the+King+was+not+absolute+and+simple+that+they+come%2C+as+it+was+in+calling+the+second%3A+so+neither+can+it+be+said+that+God+mocks+the+reprobate+when+He+gives+them+the+law+and+calls+them%3A+although+it+is+not+His+will+that+they+come+and+obey+the+law.+For+it+is+enough+to+render+them+inexcusable%3A+that+they+understand+what+things+are+pleasing+to+God%2C+and+what+is+their+duty+what+things+are+pleasing+to+God%2C+and+what+is+their+duty%3A+they+would+have+taken+and+thought+that+they+were+doing+it+by+their+own+virtue%2C+from+God%2C+who+has+absolute+right+over+them+and+over+all%2C+to+be+commanded.+To+that+point%2C+that+God+commanded+Abraham+to+kill+his+son%2C+when+nevertheless+He+did+not+want+him+killed%3A+and+to+Pharaoh%2C+to+let+the+people+go%2C+when+nevertheless+He+did+not+want+them+to+be+let+go%3A+and+from+this+many+try+to+gather+that+there+were+two%2C+and+those+contrary%2C+wills+in+God%3A+one+expressed+by+word%2C+the+other+hidden+in+His+own+mind%3A+We+answer+that+this+does+not+follow+at+all.+For+there+was+only+one%2C+and+that+a+constant+will%3A+namely%2C+that+Abraham%E2%80%99s+son+was+not+to+be+killed%3A+nor+was+the+people+to+be+let+go+by+Pharaoh%3A+and+thus+both+were+fulfilled.+But+as+for+the+command+given+to+Pharaoh%2C+it+was+a+doctrine+by+which+He+signified+what+was+to+be+done+by+Pharaoh+if+he+did+not+want+to+be+afflicted+by+so+many+plagues%3A+and+what+was+his+duty%2C+and+in+itself+just+and+owed%3A+but+it+was+not+a+testimony+of+His+absolute+will.+Wherefore+it+does+not+follow+from+that+that+there+were+two+wills+of+God.+In+the+command+also+given+to+Abraham%2C+it+was+not+a+simple+will+of+God+that+he+should+kill+his+son%3A+but+only+that+he+should+take+the+sword%2C+with+the+intention+of+killing+and+sacrificing%2C+and+that+for+the+sake+of+God%3A+and+thus+show+his+piety+towards+God%2C+and+his+promptness+in+obeying%3A+which+was+also+entirely+done%3A+because+this+was+the+will+of+God.+But+the+will+of+God+did+not+extend+as+far+as+the+killing.+Therefore%2C+when+Abraham%2C+having+finished+all+other+things%2C+had+extended+the+sword+with+which+he+might+slaughter+his+son%3A+the+Lord+forbade+him+to+do+it.+To+which+will+also+Abraham+complied.+Thus+neither+here+was+there+a+double+will+of+God%3A+but+one.+And+the+Lord+said%3A+offer+your+son+as+a+burnt+offering%3A+this+therefore+was+the+will+of+God%3A+and+yet+afterwards%2C+He+signified+another+will.+It+was+not+another%3A+for+He+did+not+first+want+that+it+should+come+to+the+actual+slaughter.+Therefore+Moses+premises%2C+The+Lord+tempted+Abraham%3A+but+He+only+wanted+that%2C+with+other+things+actually+performed%2C+he+should+also+slaughter+him+with+the+promptness+of+his+mind%2C+not+with+the+sword.+For+this+is+that+which%2C+first+and+properly%2C+the+Lord+requires+in+His+precepts%3A+that+is%2C+that+we+should+be+prompt+in+mind+for+His+obedience%2C+and+by+this+promptness+of+our+mind+of+ours%2C+the+commandments+are+properly+fulfilled+before+God.+The+sum+in+almost+all+these+arguments+is+admitted+as+a+parable%3A+for+the+will+of+God%2C+properly+accepted%2C+is+the+absolute%2C+certain%2C+and+firm+decree+of+God%2C+concerning+things+to+be+done%2C+either+by+Himself+or+by+others%3A+and+that+this+is+always+fulfilled%2C+and+is+immutable%2C+we+do+not+doubt+to+affirm.+But+the+Law+and+all+commandments+are+called+the+will+of+God%3A+because+by+them+it+is+signified+and+taught+what+is+in+itself+just%2C+and+pleasing+to+God%3A+and+what+is+required+of+us%2C+if+we+wish+to+be+saved.+But+alone%2C+it+is+not+properly+the+will+of+God%3A+but+the+Torah%2C+the+doctrine+of+the+just%3A+and+the+command+of+doing+it.+But+if+with+this+doctrine+and+command+there+is+joined+the+decree+of+God%2C+by+which+He+absolutely+wills+that+what+He+requires+be+performed%3A+then+it+will+be+said+to+be+properly+the+will+of+God%3A+as+it+is%2C+in+so+far+as+it+is+given+to+the+elect.+Wherefore+not+undeservedly+they+have+distinguished+in+the+schools%2C+not+indeed+the+will+of+God+itself%3A+but+the+signification+of+the+name+of+the+will+of+God%3A+in+so+far+as+it+sometimes+signifies+the+decree+of+God+itself%2C+and+the+good-pleasure%3A+which+is+properly+called+will%3A+whence+it+is+also+called+the+will+of+good-pleasure%2C+and+absolute+will%2C+because+it+is+without+condition%3A+and+most+omnipotent%2C+because+it+is+always+done.+But+sometimes+it+signifies+that+which+is+in+itself+pleasing+to+God%2C+and+just%3A+and+which+the+nature+of+the+divine+genius+refers+to%3A+and+which+is+required+of+us%2C+if+we+wish+to+be+saved%3A+which+is+properly+called+law%2C+and+Torah%3A+whence+also+will+is+signified%3A+because+by+this+doctrine+it+is+signified+what+is+pleasing+to+God%2C+and+what+is+of+our+duty%3A+And+conditional+will%2C+because+these+things+are+required+of+us%2C+if+we+wish+to+obtain+eternal+salvation.+In+truth%2C+however%2C+the+will+of+God%2C+properly+accepted%2C+is+only+one%2C+and+that+perpetual%2C+and+firm%3A+as+has+now+been+sufficiently+and+abundantly+declared.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+Other+citations+%28work+not+named%29%2C+On+the+Nature+of+God...+%28Heidelberg%3A+Wiener+Neustadt%2C+1577%29%2C+bk.+3+tr.+AI+by+The+Faith+Received+%7C+ch.+4%2C+quest.+3%2C+%E2%80%98Whether+the+will+of+God+is+one+and+simple%2C+or+rather+manifold%3A+and+if+manifold%2C+how+many+those+wills+are%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1648add43.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1648add43.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=This%20question%20is%20not%20proposed%20without,now%20been%20sufficiently%20and%20abundantly%20declared&amp;text=This%20question%20is%20not%20proposed%20without%20cause%20by&amp;text=as%20has%20now%20been%20sufficiently%20and%20abundantly%20declared" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

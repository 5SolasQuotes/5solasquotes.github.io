<main class="wrap"><figure class="quote" id="q-57d6681ec7" data-kw="decrees eternal">
<blockquote><p>Are the decrees of God eternal? We affirm against Socinus. That there are decrees in God both Scripture testifies (which repeatedly attributes to him foreknowledge, purpose, determinate counsel and good pleasure) and manifold reason evinces—from the highest perfection of God (to which it pertains that nothing shall take place without his will) and from his omniscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1–2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36908052ff" data-kw="eternal decrees election">
<blockquote><p>We believe that all the decrees are absolutely eternal. … Scripture ascribes eternity to them (as when a kingdom is said to have been prepared for the pious “from the foundation of the world” [Mt. 25:34]; when we are said to have been chosen “before the foundation of the world” [Eph. 1:4]; and grace is said to have been given in Christ “before the world began” [2 Tim. 1:9]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.1–2</span></figcaption>

</figure><figure class="quote" id="q-285e6e7ed1" data-kw="foreknowledge decree">
<blockquote><p>If the foreknowledge of God is eternal, it is necessary that the decree upon which it is founded should also be eternal (since he does not know things as future except in the decree, through which they pass from a state of possibility to a state of futurition).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.3</span></figcaption>

</figure><figure class="quote" id="q-0e430d2cf9" data-kw="conditional thing not decree">
<blockquote><p>It is one thing for the thing decreed to be conditional; another for the decree itself. The former we grant, but not the latter. There can be granted an antecedent cause or condition of the thing willed, but not immediately of the volition itself. Thus God wills salvation to have the annexed condition of faith and repentance in the execution, but faith and repentance are not the condition or cause of the act of willing in God, nor of the decree to save in the intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.9</span></figcaption>

</figure><figure class="quote" id="q-2e6a031b5d" data-kw="eternal immutable unconditional decree">
<blockquote><p>Every decree of God is eternal; therefore it cannot depend upon a condition which takes place only in time. (2) God’s decrees depend on his good pleasure (eudokia) (Mt. 11:26; Eph. 1:5; Rom. 9:11). Therefore they are not suspended upon any condition outside of God. (3) Every decree of God is immutable (Is. 46:10; Rom. 9:11). Now a conditional decree is mutable because every condition is mutable.</p></blockquote>

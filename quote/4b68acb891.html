<main class="wrap"><figure class="quote" id="q-4b68acb891" data-kw="">
<blockquote><p>Christianity is so perfectly agreeable to the nobler powers of the human soul, that it has with much propriety been called the religion of philosophers. Philosophy is an excellent auxiliary to this divine institution, which draws from it the finest illustrations. Considered merely in this light, it merits from the friends of our religion, particular attention. But, separate philosophy from the Christian system, and, as the sources to mankind of knowledge, of virtue and happiness, they will, not even for a moment, admit of a comparison. In these respects, the latter is infinitely more perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, p. 6n.</span></figcaption>

<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology</cite>, (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</span></figcaption>

%20%281504%2D1575%29%2C%20a%20Swiss%20reformer%2C%20was%20the%20successor&amp;text=or%2C%20the%20effect%20of%20this%20knowledge%20on%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c568a566de" data-kw="">
<blockquote><p>The first thing which must strike any thoughtful reader, after having carefully and studiously perused the Westminster Assembly’s Confession of Faith, is the remarkable comprehensiveness and accuracy of its character, viewed as a systematic exhibition of divine truth, or what is termed a system of theology.

In this respect it may be regarded as almost perfect, both in its arrangement and in its completeness. Even a single glance over its table of contents will show with what exquisite skill its arrangement proceeds from the statement of first principles to the regular development and final consummation of the whole scheme of revealed truth. Nothing essential is omitted; and nothing is extended to a length disproportioned to its due importance.

Nor do we think that a systematic study of theology could be prosecuted on a better plan than that of the Confession of Faith. Too little attention, perhaps, has been shown to the Confession in this respect; and we are strongly persuaded that it might be most advantageously used in our theological halls as a text-book.

This, at least, may be affirmed, that no private Christian could fail to benefit largely from a deliberate and studious perusal and reperusal of the Confession of Faith, for the express purpose of obtaining a clear and systematic conception of sacred truth, both as a whole, and with all its parts so arranged as to display their relative importance, and their mutual bearing upon, and illustration of, each other.

Such a deliberate perusal would also tend very greatly to fortify the mind against the danger of being led astray by crude notions, or induced to attribute undue importance to some favourite doctrine, to the disparagement of others not less essential, and with serious injury to the harmonious analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay in Robert Shaw, An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>IV… The soul, being simple and immaterial—opposite to material things—existing wholly in the whole body and in each of its parts, [in the Garden of Eden] subsisted independently of the body in both being and operation, and it would have persisted independently of the body even after death, contrary to the claims of Socinus.</p></blockquote>

</figure><figure class="quote" id="q-7b81d9709e" data-kw="">
<blockquote><p>To summarize the five main approaches to teleology: Teleological eliminativism denies that there is any teleology at all in the natural world. Teleological reductionism allows that there is, but holds that it can be reduced to non-teleological phenomena. Platonic teleological realism holds that there is irreducible teleology in the natural world but only in the sense that an external ordering intellect orders things to certain ends. Aristotelian teleological realism holds that there is irreducible teleology in the natural world and that it is immanent, existing in things simply by virtue of their natures and in no way dependent on an ordering intelligence. Scholastic teleological realism holds that there is irreducible teleology in the natural world and that it is immanent to things given their natures, but also that the fact that they exist with natures directing them to those ends cannot itself ultimately be made sense of apart from a divine ordering intelligence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<main class="wrap"><figure class="quote" id="q-5979b50f3b" data-kw="">
<blockquote><p>From the sixteenth century until the beginning of the twentieth, no Reformed theologian I know of denied the validity of natural theology derived from natural revelation. The strong antipathy in our day to theology based on unaided human speculation has brought in its wake a widespread and wholesale rejection of all natural theology.

This departure, in part a reaction against Enlightenment rationalism, is a departure from historic Reformed theology and from biblical theology. Both Roman Catholicism and historic Reformed theology embraced natural theology gleaned from natural revelation. The reason for this substantial agreement is because the Bible, which both sides regarded as a special revelation, clearly teaches that, in addition to God’s revelation of himself in Scripture, there is also the sphere of divine revelation found in nature.

Classical theology made an acute distinction between special revelation and general revelation. The two kinds of revelation are distinguished by the terms special and general because of the difference in content-scope and in the audience of each. Special revelation is special because it provides specific information about God that cannot be found in nature. Nature does not teach us God’s plan for salvation; Scripture does. We learn many more specifics about the character and activity of God from Scripture than we can ever glean from creation.

The Bible is also called special revelation because the information contained in it is unknown by people who have never read the Bible or had it proclaimed to them. General revelation is general because it reveals general truths about God and because its audience is universal. Every person is exposed to some degree to God’s revelation in creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-c-sproul.html">R. C. Sproul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Reformed Theology? Understanding the Basics</cite>, (1997; Grand Rapids MI: Baker Books, Kindle Edition, 2016), pp 16-18.</span></figcaption>

</figure><figure class="quote" id="q-e52cd4ef98" data-kw="">
<blockquote><p>Even though the natural knowledge of God is not salvific, it nevertheless serves a purpose and is useful for the following reasons:

(1) It teaches that God exists; that He is an invisible, spiritual Being; is infinite; is the first cause of all things; in His Being is infinitely exalted above all that exists; and is holy, omnipotent, good and just.

(2) It teaches that God is the cause of all things (also of him who meditates about God), and thus is sovereign Lord over all. It teaches that by His influence He upholds, governs, and directs all things according to His will, so that no one can stay His hand or say, “What doest Thou?”

(3) It teaches that every human being is obligated to Him with an irrevocable obligation to do His will as expressed in His law, which is revealed to him by virtue of the light of nature.

(4) By this man can view his sin and guilt against the background of God’s justice.

(5) It promotes the maintenance of human society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 16-17.</span></figcaption>

</figure><figure class="quote" id="q-d2478435c2" data-kw="">
<blockquote><p>Of course, without special personal divine interposition there is a considerable amount of revelation of God’s being and perfections afforded by nature, — by the works of God’s hand, the constitution that He has given to man, and the providence and government which He constantly and silently exercises over him. God could not create such a world as this, and put and keep in it an intelligent being like man, without inlaying into the workmanship of His hands, and into His providence over it, incontestible evidence of His own existence, and considerable proofs, because traces of His wisdom, power, and goodness.

No one doubts, and our [Westminster] Confession in its very first clause admits, that in this there is a source of knowledge of God, or if you will, of revelation, thoroughly valuable and important; while science, glorious science, is continually reading it off to us more and more fully, some of her unwitting sons labouring in the service as the hardest driven Gibeonites we have ever chanced to come across sweating in their toil. Long and successfully may they toil, and much may they bring to light in proof of God’s necessary existence and God’s necessary perfections!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Doctrine of the Inspiration of Scripture (With a Prefatory Note on the Free Church College Committee’s Report, and with Remarks on Dr Marcus Dods’s Recent Sermon)</cite>, (1877; 4th edn, London: J. Nisbet, 1890), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-74cb50ad6f" data-kw="">
<blockquote><p>The means for the knowledge of God: The more general means XIX. Now, concerning the supports by which we arrive at the knowledge of God, they are observed to be of two kinds. In the first more general kind are enumerated three ways to arrive at the knowledge of God, namely: (1) the way of causality, whereby having moved through various second causes as if by Jacob’s ladder, we finally arrive at the highest step, where God is, according to the mode which we described above in §VI. And this knowledge is what the apostle seems to indicate in Romans 1:19. (2) The way of eminence, by which whatever there is of absolute perfection in creatures we attribute with the highest eminence to the Creator, because of the fact that no one can confer on another what he does not have either formally or eminently, nor can an effect be conceived such that it is on the whole more excellent than its own cause. The psalmist seems to use this way in Psalm 94:9. Indeed, it is fitting by this support to interpret all anthropopathic and metaphorical expressions. (3) The way of negation, by which we entirely remove from him any imperfection that occurs in the creatures, for example, corporality, mortality, finitude, and the like. Scripture seems to follow this way in Numbers 23:19 and Psalm 90:2–3. And indeed in this manner, we arrive by this threefold way at the knowledge of God, such that (1) the first way chiefly leads to his relative attributes, through which he is called Creator, preserver, governor, and mover; (2) the second way leads to his communicable and affirmative attributes, for example, wisdom, righteousness, and so forth, which we will discuss in their own place; and (3) the third leads to his incommunicable and negative attributes, such as infinity, immutability, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 2, sect. 19, p. 56 The more specific means Mastricht lists as: (1) the divine names in Scripture, (2) the divine attributes in Scripture, (3) the works of God, (4) the Word of God.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The means for the knowledge of God: The more general means XIX. Now, concerning the supports by which we arrive at the knowledge of God, they are observed to be of two kinds. In the first more general kind are enumerated three ways to arrive at the knowledge of God, namely: (1) the way of causality, whereby having moved through various second causes as if by Jacob’s ladder, we finally arrive at the highest step, where God is, according to the mode which we described above in §VI. And this knowledge is what the apostle seems to indicate in Romans 1:19. (2) The way of eminence, by which whatever there is of absolute perfection in creatures we attribute with the highest eminence to the Creator, because of the fact that no one can confer on another what he does not have either formally or eminently, nor can an effect be conceived such that it is on the whole more excellent than its own cause. The psalmist seems to use this way in Psalm 94:9. Indeed, it is fitting by this support to interpret all anthropopathic and metaphorical expressions. (3) The way of negation, by which we entirely remove from him any imperfection that occurs in the creatures, for example, corporality, mortality, finitude, and the like. Scripture seems to follow this way in Numbers 23:19 and Psalm 90:2–3. And indeed in this manner, we arrive by this threefold way at the knowledge of God, such that (1) the first way chiefly leads to his relative attributes, through which he is called Creator, preserver, governor, and mover; (2) the second way leads to his communicable and affirmative attributes, for example, wisdom, righteousness, and so forth, which we will discuss in their own place; and (3) the third leads to his incommunicable and negative attributes, such as infinity, immutability, and so forth.”

— Petrus van Mastricht, Theoretical Practical Theology, (RHB), vol. 2, bk. 2, ch. 2, sect. 19, p. 56 The more specific means Mastricht lists as: (1) the divine names in Scripture, (2) the divine attributes in Scripture, (3) the works of God, (4) the Word of God.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+means+for+the+knowledge+of+God%3A+The+more+general+means+XIX.+Now%2C+concerning+the+supports+by+which+we+arrive+at+the+knowledge+of+God%2C+they+are+observed+to+be+of+two+kinds.+In+the+first+more+general+kind+are+enumerated+three+ways+to+arrive+at+the+knowledge+of+God%2C+namely%3A+%281%29+the+way+of+causality%2C+whereby+having+moved+through+various+second+causes+as+if+by+Jacob%E2%80%99s+ladder%2C+we+finally+arrive+at+the+highest+step%2C+where+God+is%2C+according+to+the+mode+which+we+described+above+in+%C2%A7VI.+And+this+knowledge+is+what+the+apostle+seems+to+indicate+in+Romans+1%3A19.+%282%29+The+way+of+eminence%2C+by+which+whatever+there+is+of+absolute+perfection+in+creatures+we+attribute+with+the+highest+eminence+to+the+Creator%2C+because+of+the+fact+that+no+one+can+confer+on+another+what+he+does+not+have+either+formally+or+eminently%2C+nor+can+an+effect+be+conceived+such+that+it+is+on+the+whole+more+excellent+than+its+own+cause.+The+psalmist+seems+to+use+this+way+in+Psalm+94%3A9.+Indeed%2C+it+is+fitting+by+this+support+to+interpret+all+anthropopathic+and+metaphorical+expressions.+%283%29+The+way+of+negation%2C+by+which+we+entirely+remove+from+him+any+imperfection+that+occurs+in+the+creatures%2C+for+example%2C+corporality%2C+mortality%2C+finitude%2C+and+the+like.+Scripture+seems+to+follow+this+way+in+Numbers+23%3A19+and+Psalm+90%3A2%E2%80%933.+And+indeed+in+this+manner%2C+we+arrive+by+this+threefold+way+at+the+knowledge+of+God%2C+such+that+%281%29+the+first+way+chiefly+leads+to+his+relative+attributes%2C+through+which+he+is+called+Creator%2C+preserver%2C+governor%2C+and+mover%3B+%282%29+the+second+way+leads+to+his+communicable+and+affirmative+attributes%2C+for+example%2C+wisdom%2C+righteousness%2C+and+so+forth%2C+which+we+will+discuss+in+their+own+place%3B+and+%283%29+the+third+leads+to+his+incommunicable+and+negative+attributes%2C+such+as+infinity%2C+immutability%2C+and+so+forth.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology%2C+%28RHB%29%2C+vol.+2%2C+bk.+2%2C+ch.+2%2C+sect.+19%2C+p.+56+The+more+specific+means+Mastricht+lists+as%3A+%281%29+the+divine+names+in+Scripture%2C+%282%29+the+divine+attributes+in+Scripture%2C+%283%29+the+works+of+God%2C+%284%29+the+Word+of+God.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74cb50ad6f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74cb50ad6f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-theology/#:~:text=The%20means%20for%20the%20knowledge%20of,as%20infinity%2C%20immutability%2C%20and%20so%20forth&amp;text=The%20means%20for%20the%20knowledge%20of%20God%3A%20The&amp;text=attributes%2C%20such%20as%20infinity%2C%20immutability%2C%20and%20so%20forth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-bb50f85b0d" data-kw="">
<blockquote><p>Doctrine 9. Godliness is the chief and most necessary of all virtues. By godliness we mean true religion towards God, and a mind wholly given to the true worship of God. Reason 1. Because it has the noblest object, that is, God Himself. 2. Because it does most of all perfect all other virtues, while it refers them and all their acts to a divine beginning and a divine end. For godliness subjects the mind to God in all things, so that it acknowledges God to be the author of all good, from whom every good and perfect gift comes, and makes Him the chiefest good and the last end to whom all our actions are to be directed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, … (London: Rothwell), on 2 Pet. 1:5-7, p. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d60eb4534a" data-kw="">
<blockquote><p>The means for the maintenance of the poor are collected, by the deacons, the first day of the week, and other days of the public assembling of the people to the worship of God, at the entry of the Church. And if this prove not a competency, then do the people either bring in their charity on such days as are appointed by the eldership, or are willing to be taxed, according as they shall be judged to be able. In some cities, and parishes where this order has been carefully observed, none have been suffered to beg, and none have lacked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Alexander Henderson, The Government and Order of the Church of Scotland</cite>, (1641), pp. 31-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-6f6a68c3d1" data-kw="">
<blockquote><p>Before the coming of his well-beloved Son in the flesh, severely He punished all such as durst enterprise to alter or change his ceremonies and statutes, as in Saul, Uzziah, Nadab, Abihu, is to be read. And will He now, after that He has opened his counsel to the world by his only Son, whom He commands to be heard, and after that by his Holy Spirit, speaking by his apostles, He has established the religion in which He will his true worshippers abide to the end, will He now I say admitt men’s inventions in the matter of religion, etc.? For this sentence he prouounces: Not that which seems good in thy eyes, shalt thou do to the Lord thy God, but that which the Lord thy God commanded thee, that do thou: Add nothing unto it, diminish nothing from it. Which sealing up his New Testament He repeats in these words: ‘That which ye have, hold till I come,’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Letter to the Queen Dowager, Regent of Scotland</cite>, 1556” in The Works of John Knox, ed. David Laing (Edinburgh: James Thing, 1845), pp. 69-84. Also quoted in George Gillespie, English-Popish Ceremonies (1637), bk. 3, ch. 7, section 11, pp. 118-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Before the coming of his well-beloved Son in the flesh, severely He punished all such as durst enterprise to alter or change his ceremonies and statutes, as in Saul, Uzziah, Nadab, Abihu, is to be read. And will He now, after that He has opened his counsel to the world by his only Son, whom He commands to be heard, and after that by his Holy Spirit, speaking by his apostles, He has established the religion in which He will his true worshippers abide to the end, will He now I say admitt men’s inventions in the matter of religion, etc.? For this sentence he prouounces: Not that which seems good in thy eyes, shalt thou do to the Lord thy God, but that which the Lord thy God commanded thee, that do thou: Add nothing unto it, diminish nothing from it. Which sealing up his New Testament He repeats in these words: ‘That which ye have, hold till I come,’ etc.”

20I%20come%2C%E2%80%99%20etc&amp;text=Before%20the%20coming%20of%20his%20well%2Dbeloved%20Son%20in&amp;text=which%20ye%20have%2C%20hold%20till%20I%20come%2C%E2%80%99%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1224286efb" data-kw="">
<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R, 1994), vol. 2, 11th Topic, ‘On the Law of God’, Question 24, ‘What was the end and use of the ceremonial law under the Old Testament?’, section 3, p. 146</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-9527c70aca" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

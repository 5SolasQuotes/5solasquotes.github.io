<main class="wrap"><figure class="quote" id="q-85123d9e17" data-kw="">
<blockquote><p>…like Voetius–he interprets Zecahriah 12 as implying that the soul is given to a ‘body that is already formed organically.’ Van Mastricht denies a development throughout three kinds of souls [as Aquinas held], ‘first the vegetative, then the sensitive and finally the rational’ soul… It seems that Van Mastricht–like his predecessor in Utrecht [Voet]–thought that the body needs to have reached a certain stage in its development, before it receives a soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006)</cite>, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“…like Voetius–he interprets Zecahriah 12 as implying that the soul is given to a ‘body that is already formed organically.’ Van Mastricht denies a development throughout three kinds of souls [as Aquinas held], ‘first the vegetative, then the sensitive and finally the rational’ soul… It seems that Van Mastricht–like his predecessor in Utrecht [Voet]–thought that the body needs to have reached a certain stage in its development, before it receives a soul.”

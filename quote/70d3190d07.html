<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB)</cite>, vol. 5, ch. 6, the Justification of those to be Redeemed</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09cfb60301" data-kw="">
<blockquote><p>[You must distinguish:] 4. Betwixt a twofold righteousness of one and the same Covenant: 1. Of perfect obedience, or performance of the condition. 2. Of suffering, or satisfaction for disobedience or non-performance which makes the Law to have nothing against us, though we disobeyed. See [William] Pemble, Of Justification, p. 2. Our legal righteousness is of this last sort, and not of the first. Both these sorts of righteousness are not possible to be found in any one person, except Christ, who had the former righteousness as his own (incommunicable to us in that form). The second He had for us, as He was by imputation a sinner: And so we have it in, or by Him. Mark this. 5. Betwixt two kinds of righteousness, suitable to the two Covenants [of Works and of Grace] and their conditions: 1. Legal righteousness, which is our conformity, or satisfaction to the Law. 2. And evangelical righteousness, which is our conformity to the new Covenant. Note, that: 1. Every Christian must have both these. 2. That our legal righteousness is only that of satisfaction: but our evangelical is only that of obedience, or performance of the condition. 3. That our legal righteousness is all without us in Christ, the other in ourselves. 6. [Distinguish] Betwixt [1.] evangelical righteousness, improperly so called, viz. because the Gospel does reveal and offer it. This is our legal righteousness of Christ. 2. And evangelical righteousness properly so called viz. because the new Covenant is the rule to which it is conformed. This is our performance of the new Covenant’s conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification… (Hague, 1655) | Guide to the Reader Baxter here lays out his Neonomianism.</cite></span></figcaption>

</figure><figure class="quote" id="q-9a507d44d8" data-kw="">
<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae ecclesiasticae, Epistle 68, p. 124b as trans. G.A. van den Brink, The Transfer of Sin: The Debate on Imputation in the English Antinomian Controversy (1690–1700)… (Brill, 2024)</cite>, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.”

— Johannes Piscator, Epistolae ecclesiasticae, Epistle 68, p. 124b as trans. G.A. van den Brink, The Transfer of Sin: The Debate on Imputation in the English Antinomian Controversy (1690–1700)… (Brill, 2024), p. 217">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+Christ+made+satisfaction+for+our+sins+by+the+obedience+with+which+He+fulfilled+the+law%2C+so+that+that+%5Bobedience%5D+is+imputed+to+us+by+God+as+though+we+ourselves+had+fulfilled+%5Bthe+law%5D%2C+then+it+follows+therefrom+that+we+are+set+free+from+obedience+of+the+law%2C+because%E2%80%94according+to+this+hypothesis%E2%80%94Christ+has+fulfilled+it+for+us+or+in+our+stead.%E2%80%9D%0A%0A%E2%80%94+Johannes+Piscator%2C+Epistolae+ecclesiasticae%2C+Epistle+68%2C+p.+124b+as+trans.+G.A.+van+den+Brink%2C+The+Transfer+of+Sin%3A+The+Debate+on+Imputation+in+the+English+Antinomian+Controversy+%281690%E2%80%931700%29%E2%80%A6+%28Brill%2C+2024%29%2C+p.+217&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a507d44d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a507d44d8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=If%20Christ%20made%20satisfaction%20for%20our,for%20us%20or%20in%20our%20stead." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</span></figcaption>

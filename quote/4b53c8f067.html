<main class="wrap"><figure class="quote" id="q-4b53c8f067" data-kw="">
<blockquote><p>Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02bf9e3817" data-kw="first day heaven earth light">
<blockquote><p>The works of the first day are reckoned as three (the heaven, the earth and light) according to the Mosaic account. God demonstrates his power in the production of all things ex nihilo by his word alone; his wisdom in their variety, order and use; his goodness in making all things very good. Thus he exercised an ordering and command which powerfully gave existence to things, and ordination which wisely directed all things and assigned to each its own use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/heaven-and-earth.html">Heaven and Earth</a> › <a href="../topics/creation/heaven-and-earth/the-heavens.html">The heavens</a></span><span class="t"><a href="../topics/creation/heaven-and-earth.html">Heaven and Earth</a> › <a href="../topics/creation/heaven-and-earth/the-earth.html">The earth</a></span><span class="t"><a href="../topics/creation/heaven-and-earth.html">Heaven and Earth</a> › <a href="../topics/creation/heaven-and-earth/the-visible-world.html">The visible world</a></span><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a> › <a href="../topics/creation/the-six-days/light-and-firmament.html">Light and firmament</a></span><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a> › <a href="../topics/creation/the-six-days/mosaic-account.html">Mosaic account</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 5.1.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20works%20of%20the%20first%20day%20are%20reckoned%20as%20three%20%28the%20heaven%2C%20the%20earth%20and%20light%29%20according%20to%20the%20Mosaic%20account.%20God%20demonstrates%20his%20power%20in%20the%20production%20of%20all%20things%20ex%20nihilo%20by%20his%20word%20alone%3B%20his%20wisdom%20in%20their%20variety%2C%20order%20and%20use%3B%20his%20goodness%20in%20making%20all%20things%20very%20good.%20Thus%20he%20exercised%20an%20ordering%20and%20command%20which%20powerfully%20gave%20existence%20to%20things%2C%20and%20ordination%20which%20wisely%20directed%20all%20things%20and%20assigned%20to%20each%20its%20own%20use.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%205.1.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F02bf9e3817.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/02bf9e3817.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-efc69252f5" data-kw="">
<blockquote><p>Fifthly, it can also be asked to what end God created all things. The principal end is, that there might be those who should enjoy the divine goodness known in very deed, and should glorify the majesty of God sempiternally. Unto this end both angels and men have been created. The secondary end is that the remaining created things should at the same time illustrate the glory of God and serve the uses of men. The consideration of these ends has nothing of ambiguity, and makes very much unto nourishing in us the faith of divine goodness and providence. … That place, Prov. 16, where Solomon says: ‘The Lord works all things for Himself, and the impious also unto the evil day,’ is not to be adduced unto this operation of creation. For Solomon speaks there not concerning creation, although God Himself the principle and end of all things created all things for Himself: but concerning His providence and government, by which He so governs all things, even the minds of the impious, that they make unto His glory. Therefore it is to be taken heed, lest anyone from the words of Solomon badly understood and applied, should gather that God created the impious, as impious. For the impious as impious is not from God, but from the father the devil (Jn. 8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

/creation#:~:text=Fifthly%2C%20it%20can%20also%20be%20asked,the%20father%20the%20devil%20%28Jn.%208&amp;text=Fifthly%2C%20it%20can%20also%20be%20asked%20to%20what&amp;text=but%20from%20the%20father%20the%20devil%20%28Jn.%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-031055852b" data-kw="">
<blockquote><p>Q. 9. What is the work of creation? A. The work of creation is God’s making all things of nothing, by the Word of his power, in the space of six days, and all very good. … Q. In what time did He make them? A. In the space of six days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-alleine.html">Joseph Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Familiar Explanation of the Assembly’s Shorter Catechism… (d. 1668; London: Brewster, 1674), Catechism</cite>, pp. 11-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-e06284c3e4" data-kw="">
<blockquote><p>They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. … The moving cause of God unto creating was not any necessity or indigence, for He is in need of nothing, Acts 17:25, but His most free will, Ps. 115:3, by which He willed to communicate and manifest Himself to creatures, Gen. 1:27, 31, and thereby to be glorified by them, Ps. 8:1; 19:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

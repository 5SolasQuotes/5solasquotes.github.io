<main class="wrap"><figure class="quote" id="q-d3d9df8a33" data-kw="">
<blockquote><p>I embrace the doctrine of the church of England, as declared in the Thirty-nine Articles, and other approved public writings of the most famous bishops and other divines thereof. I avow her rejection of the pretended authority and real errors of your church [of Rome] to be her duty, and justifiable. The same is my judgment in reference unto all other protestant churches in the world, in all things wherein they agree among themselves; which is in all things necessary that God may be acceptably worshipped and themselves saved. [1] …

Let there be one solemn stated confession of the Christian protestant faith, such as is the doctrine of the Articles of the church of England, especially as explained in the public authorized writings of the church in the days of Queen Elizabeth and King James, before the inroad of novel opinions among us, to be subscribed by all enjoying a public ministry. [2]

[1] John Owen, A Vindication of the Animadversions on “Fiat Lux;” Wherein the Principles of the Roman Church as to Moderation, Unity, and Truth, are Examined; and Sundry Important Controversies, Concerning the Rule of Faith, Papal Supremacy, the Mass, Images, etc., Discussed (1663) in William H. Goold (ed.), The Works of John Owen, D.D. (16 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 14: 196.</p></blockquote>

<blockquote><p>By which meanes it shall moreover come to pass (which is the other caution to be given) that not every pastor (no not with the elders of his congregation) shall be permitted to have full liberty of binding and loosing, but shall in those matters receive counsell and advice from other pastors. Howbeit for this latter purpose, the Church of Scotland has profitably provided another remedy also, namely, that in certain chief places, all the pastors in the adjacent bounds, shall at set and ordinary times assemble themselves (which assemblies in this nation we call Presbyteries) that so the Churches may be governed Communi Presbyterorum consilio [by the common counsel of presbyters], as Hierome speaks of the primitive times of the Church. 3. Though the execution of the discipline of excommunication and absolution pertain to the consistory [local session] of the pastor and elders in every Church, yet this discipline is to be by them executed in name of the whole Church (Zanchi, in 4 Praec., col. 756; D. Fulke on 1 Cor. 5:4).</p></blockquote>

<blockquote><p>Here I might admonish them which separate themselves from our church [of England]. As Paul saith, ‘Examine whether you be in the faith,’ so examine whether you have the show of error. Hath it not the show of error to broach a religion which was never heard of before? Hath it not the show of error to retain an opinion which the author himself [Robert Browne] hath recanted, as though ye would suck up that which the dog hath vomited? Hath it not the show of error to affirm that those preachers may not be heard, which (by their own confessions) have converted them to the knowledge of God, and daily convert others? Hath it not the show of error to affirm that the Lord’s prayer may not be used for a prayer, which for anything that we or they can read, was so used from the beginning?

Hath it not the show of error to say that no man may use any set prayer, seeing there be many set prayers, and psalms, and blessings in the holy Scripture, which were used in the same form? Hath it not the show of error to affirm that we have no church, and yet to grant that our martyrs which died in popery were true members of the church? Hath it not the show of error to affirm that two or three may excommunicate all the rest without a minister, seeing the pastor is the mouth of the church?

Hath it not the show of error to affirm that the church of Christ was ever invisible before this age, and that it is such a small flock as their number is, and that it hath set foot nowhere but in England? Hath it not the show of error to hold that for good and sound religion which is altered every day, adding and detracting, as though a man should make a religion of his own invention, so fast as new conceits come into his brain: Let them think what Paul Saith unto them, ‘Be wise unto sobriety,’ Rom. xii. 3, and suspect that construction which yourselves devised; for Solomon saith, There is an error upon the right hand as well as upon the left, Prov. iv. 27; that is (as I may call it), the zealous error; and if this be not, I know none within this land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Trial of the Spirits</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 143.</span></figcaption>

<blockquote><p>And thirdly, see God making room for us [the New England colony from old England] by some lawful means. But how shall I know whether God has appointed me such a place, if I be well where I am, what may warrant my removal? There be four or five good things, for procurement of any of which I may remove. Secondly, there be some evil things, for avoiding of any of which we may transplant ourselves. Thirdly, if withal we find some special providence of God concurring in either of both concerning ourselves, and applying [in] general grounds of removal to our personal estate. First, we may remove for the gaining of knowledge. Our Saviour commends it in the queen of the South, that she came from the utmost parts of the earth to hear the wisdom of Salomon: Mt. 12:42. And surely with him she might have continued for the same end, if her personal calling had not recalled her home. Secondly, some remove and travail for merchandise and gain-sake; Daily bread may be sought from far, Prov. 31:14. Yea our Savior approves travail for merchants, Mt. 13:45-46, when He compares a Christian to a merchantman seeking pearls: For He never fetches a comparison from any unlawful thing to illustrate a thing lawful. The comparison from the unjust steward, and from the thiefe in the night is not taken from the injustice of the one, or the theft of the other; but from the wisdom of the one, and the suddenness of the other; which in themselves are not unlawful. Thirdly, to plant a colony, that is, a company that agree together to remove out of their own country, and settle a city or commonwealth elsewhere. Of such a colony we read in Acts 16:12 [of Philippi], which God blessed and prospered exceedingly and made it a glorious Church. Nature teaches bees to do so when as the hive is too full, they seek abroad for new dwellings: So when the hive of the commonwealth is so full that tradesmen cannot live one by another, but eat up one another, in this case it is lawful to remove. Fourthly, God allows a man to remove when he may employ his talents and gifts better elsewhere, especially when where he is, he is not bound by any special engagement. Thus God sent Joseph before to preserve the Church: Joseph’s wisdom and spirit was not fit for a shepherd, but for a counselor of state; and therefore God sent him into Egypt. To whom much is given, of him God will require the more: Lk. 12:48. Fifthly, for the liberty of the ordinances, 2 Chron. 11:13-15. When Jeroboam made a desertion from Judah, and set up golden calves to worship, all that were well affected, both priests and people, sold their possessions and came to Jerusalem for the ordinances’ sake. This case was of seasonable use to our fathers in the days of Queen [Bloody] Mary, who removed to France and Germany in the beginning of her reign, upon proclamation of [the] alteration of religion [to Romanism], before any persecution began. Secondly, there be evils to be avoided that may warrant removal: First, when some grievous sins overspread a country that threaten desolation, Mic. 2:6-11: When the people say to them that prophesy, ‘Prophesy not;’ then verse 10, ‘Arise then, this is not your rest.’ Which words though they be a threatening, not a commandment; yet as in a threatning a wise man foresees the plague, so in the threatening he sees a commandment, to hide himself from it. This case might have been of seasonable use unto them of the Palatinate, when they saw their orthodox ministers banished [by Lutherans], although themselves might for a while enjoy liberty of conscience. Secondly, if men be overburdened with debts and miseries, as David’s followers were, they may then retire out of the way (as they retired to David for safety) not to defraud their creditors (for God is an avenger of such things, 1 Thess: 4:6), but to gain further opportunity to discharge their debts and to satisfy their creditors, 1 Sam. 22:1-2. Thirdly, in case of persecution, so did the apostles in Acts 13:46-47. Thirdly, as these general cases, where any of them do fall out, do warrant removal in general: so there be some special providences or particular cases which may give warrant unto such or such a person to transplant himself, and which apply the former general grounds to particular persons. First, if sovereign authority command and encourage such plantations by giving way to subjects to transplant themselves and set up a new commonwealth. This is a lawful and expedient case for such particular persons as be designed and sent: Mt. 8:9, and for such as they, who are sent, have power to command. Secondly, when some special providence of God leads a man unto such a course. This may also single out particulars, Ps. 32:8, ‘I will instruct and guide thee with mine eye.’ As the child knows the pleasure of his father in his eye, so does the child of God see God’s pleasure in the eye of his heavenly Father’s providence. And this is done three ways: First, if God give a man an inclination to this or that course, for that is the spirit of man; and God is the Father of spirits: Heb. 12:9; Rom. 1:12; 1 Cor. 16:12. Paul discerned his calling to go to Rome by his [Greek], his ready inclination to that voyage; and Apollos his loathness to go to Corinth Paul accepted as a just reason of his refusal of a calling to go thither. And this holds, when in a man’s inclination to travail, his heart is set on no by-respects, as to see fashions, to deceive his creditors, to fight duels, or to live idly, these are vain inclinations; but if his heart be inclined upon right judgment to advance the Gospel, to maintain his family, to use his talents fruitfully, or the like good end, this inclination is from God. As the beams of the moon darting into the sea leades it to and fro, so does a secret inclination darted by God into our hearts lead and bow (as a bias) our whole course. Secondly, when God gives other men hearts to call us, as the men of Macedon did Paul, ‘Come to us into Macedonia, and help us.’ When we are invited by others who have a good calling to reside there, we may go with them, unless we be detained by weightier occasions. One member has interest in another, to call to it for help, when it is not diverted by greater employment. Thirdly, there is another providence of God concurring in both these, that is, when a man’s calling and person is free, and not tied by parents, or magistrates, or other people that have interest in him. Or when abroad he may do himself and others more good than he can do at home. Here is then an eye of God that opens a door there, and sets him loose here, inclines his heart that way, and outlooks all difficulties. When God makes room for us, no binding here, and an open way there, in such a case God tells them, He will appoint a place for them. Secondly, this may teach us in every place where God appoints us to sit down, to acknowledge Him as our Landlord. The earth is the Lord’s, and the fulnesse thereof; his are our countries, our towns, our houses; and therefore let us acknowledge Him in them all. The apostle makes this use of it amongst the Athenians, Acts 17:26-27. He has appointed the times and places of our habitation, that we might seek, and grope after the Lord. There is a threefold use that we are to make of it, as it appears there: [First] Let us seek after the Lord, why? Because if thou commest into an house, thou wilt ask for the owner of it: And so if thou come into a foreign land, and there find an house and land provided for thee, wilt thou not inquire, where is the landlord? Where is that God that gave me this house and land? He is missing, and therefore seek after Him. Secondly, thou must feel after Him, grope after Him by such sensible things, strive to attain the favor of your Landlord, and labour to be obedient to Him that has given you such a place. Thirdly, you must labour to find Him in his ordinances, in prayer and in Christian communion. These things I owe Him as my Landlord, and by these I find and enjoy Him. This use the very pagans were to make of their several plantations: And if you knew Him before, seek Him yet more, and feel after Him till you find Him in his ordinances and in your consciences. Thirdly, when you have found God making way and room for you, and carrying you by his providence unto any place, learn to walk thankfully before Him, defraud Him not of his rent, but offer yourselves unto his service: Serve that God and teach your children to serve Him that has appointed you and them the place of your habitation.</p></blockquote>

teaches+bees+to+do+so+when+as+the+hive+is+too+full%2C+they+seek+abroad+for+new+dwellings%3A+So+when+the+hive+of+the+commonwealth+is+so+full+that+tradesmen+cannot+live+one+by+another%2C+but+eat+up+one+another%2C+in+this+case+it+is+lawful+to+remove.+Fourthly%2C+God+allows+a+man+to+remove+when+he+may+employ+his+talents+and+gifts+better+elsewhere%2C+especially+when+where+he+is%2C+he+is+not+bound+by+any+special+engagement.+Thus+God+sent+Joseph+before+to+preserve+the+Church%3A+Joseph%E2%80%99s+wisdom+and+spirit+was+not+fit+for+a+shepherd%2C+but+for+a+counselor+of+state%3B+and+therefore+God+sent+him+into+Egypt.+To+whom+much+is+given%2C+of+him+God+will+require+the+more%3A+Lk.+12%3A48.+Fifthly%2C+for+the+liberty+of+the+ordinances%2C+2+Chron.+11%3A13-15.+When+Jeroboam+made+a+desertion+from+Judah%2C+and+set+up+golden+calves+to+worship%2C+all+that+were+well+affected%2C+both+priests+and+people%2C+sold+their+possessions+and+came+to+Jerusalem+for+the+ordinances%E2%80%99+sake.+This+case+was+of+seasonable+use+to+our+fathers+in+the+days+of+Queen+%5BBloody%5D+Mary%2C+who+removed+to+France+and+Germany+in+the+beginning+of+her+reign%2C+upon+proclamation+of+%5Bthe%5D+alteration+of+religion+%5Bto+Romanism%5D%2C+before+any+persecution+began.+Secondly%2C+there+be+evils+to+be+avoided+that+may+warrant+removal%3A+First%2C+when+some+grievous+sins+overspread+a+country+that+threaten+desolation%2C+Mic.+2%3A6-11%3A+When+the+people+say+to+them+that+prophesy%2C+%E2%80%98Prophesy+not%3B%E2%80%99+then+verse+10%2C+%E2%80%98Arise+then%2C+this+is+not+your+rest.%E2%80%99+Which+words+though+they+be+a+threatening%2C+not+a+commandment%3B+yet+as+in+a+threatning+a+wise+man+foresees+the+plague%2C+so+in+the+threatening+he+sees+a+commandment%2C+to+hide+himself+from+it.+This+case+might+have+been+of+seasonable+use+unto+them+of+the+Palatinate%2C+when+they+saw+their+orthodox+ministers+banished+%5Bby+Lutherans%5D%2C+although+themselves+might+for+a+while+enjoy+liberty+of+conscience.+Secondly%2C+if+men+be+overburdened+with+debts+and+miseries%2C+as+David%E2%80%99s+followers+were%2C+they+may+then+retire+out+of+the+way+%28as+they+retired+to+David+for+safety%29+not+to+defraud+their+creditors+%28for+God+is+an+avenger+of+such+things%2C+1+Thess%3A+4%3A6%29%2C+but+to+gain+further+opportunity+to+discharge+their+debts+and+to+satisfy+their+creditors%2C+1+Sam.+22%3A1-2.+Thirdly%2C+in+case+of+persecution%2C+so+did+the+apostles+in+Acts+13%3A46-47.+Thirdly%2C+as+these+general+cases%2C+where+any+of+them+do+fall+out%2C+do+warrant+removal+in+general%3A+so+there+be+some+special+providences+or+particular+cases+which+may+give+warrant+unto+such+or+such+a+person+to+transplant+himself%2C+and+which+apply+the+former+general+grounds+to+particular+persons.+First%2C+if+sovereign+authority+command+and+encourage+such+plantations+by+giving+way+to+subjects+to+transplant+themselves+and+set+up+a+new+commonwealth.+This+is+a+lawful+and+expedient+case+for+such+particular+persons+as+be+designed+and+sent%3A+Mt.+8%3A9%2C+and+for+such+as+they%2C+who+are+sent%2C+have+power+to+command.+Secondly%2C+when+some+special+providence+of+God+leads+a+man+unto+such+a+course.+This+may+also+single+out+particulars%2C+Ps.+32%3A8%2C+%E2%80%98I+will+instruct+and+guide+thee+with+mine+eye.%E2%80%99+As+the+child+knows+the+pleasure+of+his+father+in+his+eye%2C+so+does+the+child+of+God+see+God%E2%80%99s+pleasure+in+the+eye+of+his+heavenly+Father%E2%80%99s+providence.+And+this+is+done+three+ways%3A+First%2C+if+God+give+a+man+an+inclination+to+this+or+that+course%2C+for+that+is+the+spirit+of+man%3B+and+God+is+the+Father+of+spirits%3A+Heb.+12%3A9%3B+Rom.+1%3A12%3B+1+Cor.+16%3A12.+Paul+discerned+his+calling+to+go+to+Rome+by+his+%5BGreek%5D%2C+his+ready+inclination+to+that+voyage%3B+and+Apollos+his+loathness+to+go+to+Corinth+Paul+accepted+as+a+just+reason+of+his+refusal+of+a+calling+to+go+thither.+And+this+holds%2C+when+in+a+man%E2%80%99s+inclination+to+travail%2C+his+heart+is+set+on+no+by-respects%2C+as+to+see+fashions%2C+to+deceive+his+creditors%2C+to+fight+duels%2C+or+to+live+idly%2C+these+are+vain+inclinations%3B+but+if+his+heart+be+inclined+upon+right+judgment+to+advance+the+Gospel%2C+to+maintain+his+family%2C+to+use+his+talents+fruitfully%2C+or+the+like+good+end%2C+this+inclination+is+from+God.+As+the+beams+of+the+moon+darting+into+the+sea+leades+it+to+and+fro%2C+so+does+a+secret+inclination+darted+by+God+into+our+hearts+lead+and+bow+%28as+a+bias%29+our+whole+course.+Secondly%2C+when+God+gives+other+men+hearts+to+call+us%2C+as+the+men+of+Macedon+did+Paul%2C+%E2%80%98Come+to+us+into+Macedonia%2C+and+help+us.%E2%80%99+When+we+are+invited+by+others+who+have+a+good+calling+to+reside+there%2C+we+may+go+with+them%2C+unless+we+be+detained+by+weightier+occasions.+One+member+has+interest+in+another%2C+to+call+to+it+for+help%2C+when+it+is+not+diverted+by+greater+employment.+Thirdly%2C+there+is+another+providence+of+God+concurring+in+both+these%2C+that+is%2C+when+a+man%E2%80%99s+calling+and+person+is+free%2C+and+not+tied+by+parents%2C+or+magistrates%2C+or+other+people+that+have+interest+in+him.+Or+when+abroad+he+may+do+himself+and+others+more+good+than+he+can+do+at+home.+Here+is+then+an+eye+of+God+that+opens+a+door+there%2C+and+sets+him+loose+here%2C+inclines+his+heart+that+way%2C+and+outlooks+all+difficulties.+When+God+makes+room+for+us%2C+no+binding+here%2C+and+an+open+way+there%2C+in+such+a+case+God+tells+them%2C+He+will+appoint+a+place+for+them.+Secondly%2C+this+may+teach+us+in+every+place+where+God+appoints+us+to+sit+down%2C+to+acknowledge+Him+as+our+Landlord.+The+earth+is+the+Lord%E2%80%99s%2C+and+the+fulnesse+thereof%3B+his+are+our+countries%2C+our+towns%2C+our+houses%3B+and+therefore+let+us+acknowledge+Him+in+them+all.+The+apostle+makes+this+use+of+it+amongst+the+Athenians%2C+Acts+17%3A26-27.+He+has+appointed+the+times+and+places+of+our+habitation%2C+that+we+might+seek%2C+and+grope+after+the+Lord.+There+is+a+threefold+use+that+we+are+to+make+of+it%2C+as+it+appears+there%3A+%5BFirst%5D+Let+us+seek+after+the+Lord%2C+why%3F+Because+if+thou+commest+into+an+house%2C+thou+wilt+ask+for+the+owner+of+it%3A+And+so+if+thou+come+into+a+foreign+land%2C+and+there+find+an+house+and+land+provided+for+thee%2C+wilt+thou+not+inquire%2C+where+is+the+landlord%3F+Where+is+that+God+that+gave+me+this+house+and+land%3F+He+is+missing%2C+and+therefore+seek+after+Him.+Secondly%2C+thou+must+feel+after+Him%2C+grope+after+Him+by+such+sensible+things%2C+strive+to+attain+the+favor+of+your+Landlord%2C+and+labour+to+be+obedient+to+Him+that+has+given+you+such+a+place.+Thirdly%2C+you+must+labour+to+find+Him+in+his+ordinances%2C+in+prayer+and+in+Christian+communion.+These+things+I+owe+Him+as+my+Landlord%2C+and+by+these+I+find+and+enjoy+Him.+This+use+the+very+pagans+were+to+make+of+their+several+plantations%3A+And+if+you+knew+Him+before%2C+seek+Him+yet+more%2C+and+feel+after+Him+till+you+find+Him+in+his+ordinances+and+in+your+consciences.+Thirdly%2C+when+you+have+found+God+making+way+and+room+for+you%2C+and+carrying+you+by+his+providence+unto+any+place%2C+learn+to+walk+thankfully+before+Him%2C+defraud+Him+not+of+his+rent%2C+but+offer+yourselves+unto+his+service%3A+Serve+that+God+and+teach+your+children+to+serve+Him+that+has+appointed+you+and+them+the+place+of+your+habitation.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+God%E2%80%99s+Promise+to+his+Plantation%2C+as+it+was+delivered+in+a+Sermon%2C+%28London%2C+1630%29%2C+pp.+8-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0eac3917de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0eac3917de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=And%20thirdly%2C%20see%20God%20making%20room,them%20the%20place%20of%20your%20habitation&amp;text=And%20thirdly%2C%20see%20God%20making%20room%20for%20us&amp;text=you%20and%20them%20the%20place%20of%20your%20habitation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea669cbd29" data-kw="">
<blockquote><p>3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel, and doctrine concerning Christ the Savior and faith in him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and Him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Sr. Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel, and doctrine concerning Christ the Savior and faith in him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and Him through whom it is expiated, and the means of applying that expiation to us.”

— Sr. Friedrich Spanheim, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+The+revelation+alone+exhibited+in+the+sphere+of+nature+cannot+be+salutary%2C+nor+has+any+mortal+through+it+alone+either+been+led+to+salvation+or+been+able+to+be+led.+4.+To+those+therefore+to+whom+the+grace+of+superior+revelation+in+the+sphere+of+grace+after+sin+introduced+into+the+world+has+not+been+made%2C+salvation+was+never+destined+by+God%3A+for+the+wise+one+does+not+will+the+end+for+him+to+whom+he+by+no+means+grants+the+necessary+means%2C+without+which+it+cannot+come+to+pass+that+he+should+attain+the+end%2C+when+those+can+be+had+only+by+his+giving.+5.+And+since+the+sphere+of+nature+exhibits+only+%CF%84%E1%BD%B8+%CE%B3%CE%BD%CF%89%CF%83%CF%84%E1%BD%B8%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CE%B8%CE%B5%CE%BF%E1%BF%A6+%5Bthe+knowledge+of+God%5D%2C+by+no+means+indeed+%CF%83%CE%BF%CF%86%CE%AF%CE%B1%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CE%B8%CE%B5%CE%BF%E1%BF%A6+%E1%BC%90%CE%BD+%CE%BC%CF%85%CF%83%CF%84%CE%B7%CF%81%CE%AF%E1%BF%B3+%5Bthe+wisdom+of+God+in+mystery%5D%2C+that+is%2C+the+Gospel%2C+and+doctrine+concerning+Christ+the+Savior+and+faith+in+him%2C+who%2C+without+knowledge+of+Him+who+alone+is+the+way%2C+can+come+to+life%3F+6.+Therefore+the+revelation+alone+exhibited+to+sinners+in+the+sphere+of+grace+through+God%E2%80%99s+word+can+be+salutary%2C+which+reveals+both+the+actual+expiation+of+sin%2C+and+the+mode+of+it%2C+and+Him+through+whom+it+is+expiated%2C+and+the+means+of+applying+that+expiation+to+us.%E2%80%9D%0A%0A%E2%80%94+Sr.+Friedrich+Spanheim%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+ </figure><figure class="quote" id="q-6ba53c405b" data-kw="">
<blockquote><p>4. Stephen [a deacon] did no more (Acts ch. 7) in his apology [contra Anglicans who hold that deacons may preach] than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1646) | pt. 1</cite>, p. 165</span></figcaption>

</figure><figure class="quote" id="q-19c698ca90" data-kw="">

<blockquote><p>…we have in these verses a remarkable testimony to Christ’s infinite superiority over all that are born of women… There is a constant tendency in human nature to ‘hear man’ [contrast Mt. 17:5]. Bishops, priests, deacons, popes, cardinals, councils, presbyterian preachers, and independent ministers, are continually exalted to a place which God never intended them to fill, and made practically to usurp the honor of Christ. Against this tendency let us all watch, and be on our guard. Let these solemn words of the vision ever ring in our ears, ‘Hear ye Christ.’ [Mt. 17:5] The best of men are only men at their very best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels, on Mt.</cite>, 17:1-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<main class="wrap"><figure class="quote" id="q-9c67a990d8" data-kw="">
<blockquote><p>The requiring subscription to the 39 Articles is a great imposition: I believe them all myself, but as there are some which might be expressed more unexceptionably, so I think it a better way to let such matters continue to be still the standard of doctrine and to censure those who teach any contrary tenets, than to oblige all who serve in the Church to subscribe them. The greater part subscribe without ever examining them, and others do it because they must do it, though they can hardly satisfy their consciences about some things in them. Churches and societies are much better secured by laws than by subscriptions: it is a more reasonable as well as a more easy mode of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-burnet.html">Gilbert Burnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of his own Time</cite>, … new ed. (London: Orr, 1850), vol. 2, Conclusion, p. 904 Burnet (1643–1715) was a Scottish philosopher and historian, and Bishop of Salisbury.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a41aa0d3bf" data-kw="">
<blockquote><p>Rusticus the prefect said, ‘What kind of doctrines do you profess?’ Justin said, ‘I have endeavoured to learn all doctrines; but I have acquiesced at last in the true doctrines, those namely of the Christians, even though they do not please those who hold false opinions.’ Rusticus the prefect said, ‘Are those the doctrines that please you, you utterly wretched man?’ Justin said, ‘Yes, since I adhere to them with right dogma.’ Rusticus the prefect said, ‘What is the dogma?’ Justin said: ‘That according to which we worship the God of the Christians, whom we reckon to be one from the beginning, the maker and fashioner of the whole creation, visible and invisible; and the Lord Jesus Christ, the Son of God, who had also been preached beforehand by the prophets as about to be present with the race of men, the herald of salvation and teacher of good disciples.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Martyrdom of the Holy Martyrs</cite>, ch. 1 in ANF 1.305</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-6e13fc085d" data-kw="">
<blockquote><p>Conservatives argued that the Synod of Philadelphia was correct in interpreting the 1729 Adopting Act in terms of the ‘afternoon minute’ and the strict reinterpretation of 1736. Receiving and adopting the ‘system’ [a term used in 1788] of the [Westminster] Confession meant embracing the whole confession without exception, once the originally scrupled articles on the civil magistrate had been amended in 1788. A larger group of Presbyterians, recalling the original intent of the morning minute of 1729, believed the ‘system’ referred to the Confession’s Calvinistic doctrines; this body advocated the distinction between doctrines ‘essential’ to the system and those that were not. This was the spirit of the old Synod of New York. And there was a third small party, which held that ‘system of doctrine’ [in 1788] referred to the fundamental doctrines shared in common with all Christian churches. This minority expression drew inspiration from the 1729 language ‘systems of Christian doctrine’ [in the early morning session of the Adopting Act 1729]. Some of the early pre-1729 discussions about subscription had advocated this opinion, but, it ultimately had been rejected [Fortson claims] in the compromise of 1729. Nonetheless, a few voices would continue to herald a loose view of subscription which favored mere assent to catholic Christianity as the ‘substance’ of Westminster doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-20c40102e8" data-kw="Creeds and confessions">
<blockquote><p>To this power belongs the making of public creeds and confessions, which are usually and by synods and presbyteries to preserve the unity and agreement of faith and reject errors. They do not have the same authority as the Scriptures, since they must be compared with and corrected by them. Yet they have even their own memorable weight and ought to be valued very highly by the pious. Both because they contain the sum and foundation of the Christian doctrine and are like barriers against the errors and corruptions which can injure religion. And because they are the bonds of ecclesiastical communion and formulas of consent which testify of the unity of faith and the agreement of churches with each other and are distinguished from unbelievers, as soldiers by marks or watchwords from their enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.5</span></figcaption>

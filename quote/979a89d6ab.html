<main class="wrap"><figure class="quote" id="q-979a89d6ab" data-kw="">
<blockquote><p>…and I declare before God and the world that it was far from the intention of those that contrived it [the SL&amp;C], to wrong the King and his posterity… and the foresaid supplication doth manifestly declare their intent being only to have settled a conformity in Kirk government throughout all his Majesty’s dominions… I do further declare before God and the World that they [the English] are guilty of the breach of the Sacred Covenant, and that we have discharged our duty thereof (which is only promissory &amp; conditional as all oaths de futuro [of the future] are) by endeavoring to effectuate it quantum in nobis erat [insofar as we are in it], and that we are absolved in foro poli &amp; soli [in the sight of the city and self] of any oath or vow contained therein, insofar as concerns the settling of religion in the Kirk of England and Ireland, and that we are only bound thereby to preserve the Reformation of Religion in our own Kirk and Kingdom [of Scotland]… Therefore I exhort and conjure you, again and again, in the bowels of our Lord Christ, and words of a dying man, especially my brethren of the ministry… to stand fast and firm to this point of your Covenant, which you were bound to before by the Law of God and of this Land [of Scotland], and never suffer your selves by all the gilded allurement of this world, which will prove bitter and deceitful at last, to relinquish it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Declaration of Mr. Alexander Henderson</cite>, … Made upon his Death-Bed (London, 1648), pp. 8-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09822e2260" data-kw="">
<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-bd9074b305" data-kw="">
<blockquote><p>Now adays monarchs pretend always in their titles, to be kings by the grace of God: but how many of them to this end only pretend it, that they may reign without control; for to what purpose is the grace of God mentioned in the title of kings, but that they may acknowledge no superior? In the mean while God, whose name they use, to support themselves, they willingly would tread under their feet. It is therefore a mere cheat when they boast to reign by the grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Daniel</cite>, 4:25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>…for if Jeremiah, from the Lord, had not commanded expressly that both the king and kingdom of Judah should submit to the king of Babylon and serve him, and pray for him, as their lawful king, it had been as lawful for them to rebel against that tyrant as it was for them to fight against the Philistines and the king of Ammon;</p></blockquote>

</figure><figure class="quote" id="q-e77df7bdf0" data-kw="">
<blockquote><p>Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz: 1. If a prince abandon. 2. If he alienate. 3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered</cite>, … (London, 1650), ch. 4, pp. 47-48</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz: 1. If a prince abandon. 2. If he alienate. 3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…”

— Edward Gee, An Exercitation concerning Usurped Powers… (London, 1650), ch. 4, pp. 47-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMr.+Ashcam%E2%80%A6+lays+down+four+cases+wherein+he+says+subjects+are+freed+from+their+sworn+allegiance.+His+three+first+%28viz%3A+1.+If+a+prince+abandon.+2.+If+he+alienate.+3.+If+Nero-like+through+mad+fury+or+folly%2C+he+seek+in+an+hostile+way+the+destruction+of+his+whole+kingdom%29+will+I+presume+be+taken+not+to+concern+our+case+in+hand%3B+the+fourth+possibly+may+be+judged+applicable+to+it%E2%80%A6+Fourthly%2C+%28says+he%29+if+the+prince+have+part+of+the+supreme+right%2C+and+the+people+the+other+part%2C+then+notwithstanding+an+oath+of+allegiance+to+him%2C+he+may+be+opposed+if+he+invade+the+other+part+of+supreme+right%E2%80%A6+And+in+the+next+section+he+says+of+all+those+four+cases%2C+and+therefore+of+this%2C+that+they+show+how+we+are+absolved+in+our+own+consciences+from+all+oath+and+contract+when+one+party+forfeits+his+conditions+first.+The+defensive+opposing+of+a+prince%2C+invading+his+compeers%E2%80%99+part+by+the+party+invaded+where+the+supreme+right+is+so+shared+%28supposing+the+oath+of+allegiance+to+be+cautioned+according+to+that+sharing%29%2C+I+shall+not+dispute%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%E2%80%A6+%28London%2C+1650%29%2C+ch.+4%2C+pp.+47-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe77df7bdf0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e77df7bdf0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=lays%20down%20four%20cases%20wherein%20he,that%20sharing%29%2C%20I%20shall%20not%20dispute&amp;text=lays%20down%20four%20cases%20wherein%20he%20says%20subjects&amp;text=according%20to%20that%20sharing%29%2C%20I%20shall%20not%20dispute" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

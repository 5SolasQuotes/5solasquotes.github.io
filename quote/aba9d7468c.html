<main class="wrap"><figure class="quote" id="q-aba9d7468c" data-kw="">
<blockquote><p>In this sort may Christians honor the cross: for who makes any question but in our wars against the Jews or Mahumetists, we may bear our ensigns or arms crossed, for public testifying to the infidels that we are Christians, and our adversaries are miscreants and void of faith. So may the cross be engrave[n] on money to show that it is the coin or stamp of a Christian prince. So may the cross be placed on the gates of cities, castles or houses, to deliver apparently that the inhabitants in such places do make profession of Christianity. So was it long since ordained that the instruments of contracts or bargaining made by public notaries should be sealed and signed with the cross, as it is read in lib. de Cod. And in such like politic considerations, we reject not the use of the material cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise on the Virtue of the Cross &amp; the True Manner How to Honour It</cite>, (London, 1599), ‘How the Cross Ought to be Honored’, no page number. de La Faye (1540-1615) served with Theodore Beza in Geneva as a reformed professor of philosophy and theology.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51cebe7f05" data-kw="">
<blockquote><p>Concerning the humanity of our blessed Savior, that being a creature he might be depicted, I mean it was naturally capable of it: it was the great instrument of many actions, it conversed with mankind above thirty years together, it was the subject of great changes, and the matter of a long story, and the conduit of many excellent instructions, and therefore might without all question be described as well as Caesar’s or Meletius, Marc Anthony or the kings of the gentiles. It might be done: and the question being here only of the making or having of it, abstractedly from all other appendages or collateral considerations, I need say no more of it under this title; but that it is neither impious nor unreasonable of itself to have or to make the picture or image of Christ’s humanity, or rather of his human body. For against this there is neither reason nor religion; and if it be made accidentally unlawful, that is not of present consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 334</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-f1428f6aba" data-kw="">
<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>

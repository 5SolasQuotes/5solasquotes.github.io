<main class="wrap"><figure class="quote" id="q-bded0e8fc8" data-kw="Mary|Idolatry" data-pol="mary|images-and-idolatry">
<blockquote><p>Giving divine honor to the holy Virgin, or worshipping her with adoration, as Protestants say, due to God alone; of ascribing all the titles of Christ unto her, turning Lord in the Psalms in most places into Lady; praying to her, not only to entreat, yea, to command her Son to help and save them, but to save them herself, as she to whom her Son hath committed the administration of mercy, keeping that of justice to himself; with many other the like horrid blasphemies</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Animadversions on a Treatise Intituled Fiat Lux</cite>, ch. 15 (Blessed Virgin)</figcaption>

<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, Of the First Commandment</figcaption>

<figcaption>— <a href="../authors/matthew-poole.html">Matthew Poole</a>, <cite>Annotations upon the Holy Bible</cite>, Luke 1:49</figcaption>

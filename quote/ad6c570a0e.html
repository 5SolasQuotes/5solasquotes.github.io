<main class="wrap"><figure class="quote" id="q-ad6c570a0e" data-kw="">
<blockquote><p>We do not teach that Church-men are loosed from the positive laws of emperors and kings. Bellarmine [a Papal apologist] says that the magistrate can neither punish Church-men, nor convene them before the tribunal; so [Pope] Innocentius the third, says the empire is not above the Pope, but the Pope is above the empire… And what they allege for Peter’s exemption from paying tribute, will exime [exempt] all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they [Papists]) by a divine positive law are eximed from the laws of magistrates. So says Suarez, Bellarmine, and the [??] of Rheimes, but with neither conscience, nor reason. And contrary to their own practice and doctrine: For Paul will have every soul subject to superior powers, and except the Roman Clergy want [lack] souls, they must also be subject. Solomon punished Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Caesar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil [unqualified], as many as are in danger of resisting the power, are to be subject. Rom. 13:4; but Church-men are such, therefore they are subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), Appendix</cite>, pp. 454-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6b08d012f" data-kw="">
<blockquote><p>We have Paul’s general statement that in the churches all things are to be done decently and in order. Accordingly, civil observances, by which bonds, as it were, order and decorum are kept in the assembly of Christians, are by no means to be classed among human traditions, but are rather to be referred to that rule of the apostle, provided they are not believed to be necessary for salvation, or bind consciences by religion, or are related to the worship of God, or lodge piety in these things. But we are stoutly to resist those regulations which under the title of ‘spiritual laws’ are in force to bind consciences as if necessary for the worship of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin’s Catechism (1538) in ed. Dennison, Reformed Confessions 1.440-1 | 31. Human Traditions</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-86f1b7b339" data-kw="">
<blockquote><p>Yea and the Christian king rules over men as men, and also as Christian-men; he rules over them as men, with a dominion over their bodies, lives and goods by his civil laws, he has also dominion as king over men, as Christians and members of Christ’s kingdom and Church, not over their consciences (for that is proper only to the Father of spirits), but he has a coactive [coercive] power over all men, even pastors, as to cause them do their Christian duties, he has power to compel Church-men in assemblies to determine truth, and to use the keys right, and to preach and use the sacraments according as Christ has commanded in his Word, and to punish them when they do otherwise. … I answer, the infallible rule of judging for both [Church and State] is the Word of God, which speaks home impartially to both, if they will hear, but certainly the king’s civil, kingly coactive power to compel men to do their duty remains the highest and most supreme power on earth, in genere potestatis politicae, in ‘the kind of politic-power’, and pastors and all men may by this power be compelled to do right; as for the abuse of the power, it is no part of the power; and in this kind the king has a negative-politic and kingly suffrage [vote] and voice in all Church assemblies, no ecclesiastical constitution has the force of a [civil] law without the politic suffrage of the civil judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea (1642), ch. 19, ‘…as about… the King’s Power in Things Ecclesiastical’</cite>, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-36c2bc95f2" data-kw="">
<blockquote><p>If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Whether One May Flee From a Deadly Plague”</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

— Martin Luther, “Whether One May Flee From a Deadly Plague”, pp. 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+in+the+Old+Testament+God+himself+ordered+lepers+to+be+banished+from+the+community+and+compelled+to+live+outside+the+city+to+prevent+contamination+%5BLeviticus+13%E2%80%9314%5D%2C+we+must+do+the+same+with+this+dangerous+pestilence+so+that+anyone+who+becomes+infected+will+stay+away+from+other+persons%2C+or+allow+himself+to+be+taken+away+and+given+speedy+help+with+medicine.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+%E2%80%9CWhether+One+May+Flee+From+a+Deadly+Plague%E2%80%9D%2C+pp.+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36c2bc95f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36c2bc95f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=If%20in%20the%20Old%20Testament%20God,and%20given%20speedy%20help%20with%20medicine." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6e8bda2314" data-kw="">
<blockquote><p>Evangelicals responded similarly to the Scottish cholera epidemic of 1832, organizing weekly, and even nightly, prayer meetings in the hope of arresting the advance of the disease. These meetings supplemented the fast days called by the government at the request of the Church of Scotland… As a result, Evangelicals also saw these public prayer meetings as a suitable context in which to ask God to send religious revival. This latter purpose prevailed after the threat of the epidemic passed away, at least among groups in the parish of Kilsyth, which continued to meet during the remainder of the 1830’s, asking God ‘to awaken a spirit of earnest and vital religion among them, and throughout the Christian Church generally’ .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-alan-currie.html">David Alan Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Growth of Evangelicalism in the Church of Scotland, 1793-1843 PhD diss. (Univ. of St. Andrews, 1991)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

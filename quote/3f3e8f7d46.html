<main class="wrap"><figure class="quote" id="q-3f3e8f7d46" data-kw="">
<blockquote><p>Reader, if I were to counsel thee how to spend a market-day, so that thou mightest gain much wealth and treasure, I doubt not but thou wouldst hearken to me; I am now to advise thee how to spend the Lord’s-day, the market-day for thy soul, so that thou mayest get the true treasure, durable riches and righteousness; I pray thee to hear and obey the directions which I have to deliver to thee from the Lord for that end.

First, Make preparation for the day. There is scarce any work which admits of any considerable perfection but requires some previous preparation. In works of nature, the ground must be dunged, dressed, ploughed, harrowed, and all to prepare it for the seed. In works of art the musician tuneth his violin, screwing up some of his strings higher, letting some down lower, as occasion is, and all to prepare it for his lesson, and indeed without this he would make but sad music. Truly, friend, thus it is with us in matters of higher moment; hearts, like soil, must be prepared for the seed of the word—how many a sermon hath been lost because this was wanting!–and the violins of our souls must be tuned to praise God, or otherwise they will sound but harshly in his ears.

The priests were to wash in the laver when they went into the tabernacle, and when they came near to the altar to minister, upon pain of death, Exod. xxx. 19, 20. Signifying that to holy performances there is required holy preparation; suitable to which is David’s speech, ‘I will wash my hands in innocency, so will I compass thine altar,’ Ps. xxvi.

When the temple was to be built, the stones were hewn, and the timber squared and fitted, before they were brought to the place where the temple stood; there was neither axe, nor hammer, nor any use of them in the temple: and what doth this speak, but that the Christian must be polished and prepared to be a spiritual temple, an habitation for the God of Jacob, and also fitted for his worship, which was then in the temple?

There is no duty but requires some previous disposition. A little breakfast quickens the appetite to a good dinner; duty fits the heart for duty; consider prayer. The Christian must be poor in spirit, that would prevail in prayer for spiritual riches. The vessel must be empty before it can be filled. ‘O Lord, thou wilt prepare their heart, thou wilt cause thine ear to hear,’ Ps. x. 17.

For hearing; the weeds must be plucked up before the grain be thrown into the ground. ‘Wherefore laying aside all malice and all guile and hypocrisies, as new-born babes, desire the sincere milk of the word,’ 1 Pet. ii. 1, 2. In singing, the lungs must be good, the inwards clean before the voice will be sweet and clear. ‘O God, my heart is fixed, my heart is fixed, I will sing and give praise,’ Ps lvii. 7. So for the Lord’s-day, the Israelites had their preparation. It was ‘the preparation, that is, the day before the Sabbath,’ Mark xv. 42.

The preparation for the Lord’s-day consisteth partly in care so to order worldly businesses, that they may not encroach on the Sabbath; some expositors observe that the word remember, in the Fourth Command, enjoineth a provident foresight and diligent despatch of earthly affairs on the day before, that nothing may remain to disquiet us in, or disturb God’s day of rest.

There is an observable place, ‘If thou keep thy foot from my Sabbath,’ Isa. lviii. 13, that is, from treading on my holy ground with the dirty feet of earthly affairs or affections. The Jews’ preparation began at three of the clock in the afternoon, which the Hebrews called the Sabbath eve: the ancient fathers called cœna pura, from the heathen (say some) whose religion taught them in their sacrifices to certain of their gods, to prepare themselves by a strict kind of holiness, at which time they had a supper, consisting of meats holy in their opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 226-27.</span></figcaption>

<blockquote><p>Be much with God in religious duties. Secret praying, reading, and meditating, are great helps to piety. The bottom of a Christian’s building is underground, and out of the world’s sight. The greatest part of that trade which a saint drives with God is unseen, and his returns are unknown to the world. Christ giveth his sweetest kisses and dearest embraces to his spouse when she is alone. Jacob met with the blessing when he had parted with his company, and wrestled singly with the angel of the covenant. Bread eaten in secret, how sweet is it! When God meeteth thy soul in a morning or evening prayer, communion with his Majesty will be sweet to thee indeed.

Take heed of omission of duties in the closet. The Amalekite had not eaten in three days, who was nigh death. It is observed that the places under the line are not so hot as some places at a further distance, because, though they have the beams of the sun falling perpendicularly to cause a more intense heat, yet the nights there being longer than in some other parts, the days are not so hot. When the nights are long, the days are very cold; when there are long omissions of duties, godliness will cool.

Ah, didst thou but know what many a saint hath gained by that hidden calling, I am confident thou wouldst mind it, whatever thou didst omit. Remember how often and earnestly I have urged thee to this duty. It is thy privilege, that though thou canst not every day have the showers of public ordinances, yet mayest thou have the watering-pots of secret duties to make thy soul fruitful. Let no day pass without thy morning and evening sacrifices. Fasting is bad for some bodies; I am sure to fast from spiritual food is exceeding injurious to thy soul.

He that runneth into enormities (as a drunkard, or swearer, or adulterer, &amp;c.) he stabbeth his soul; he that omitteth daily duties, he starveth his soul. Now, what great difference is there between the death of the soul by stabbing and by starving? If thy soul die eternally, it will be little comfort to thee to plead that thou didst not drink, or swear, as others. Oh friend, let no day pass without secret duties; if thou risest in a morning, and followest thy calling all day, and liest down at night, and never desirest God’s company, or askest his blessing, I would know wherein thou dost God more service than the ox or ass? For shame, friend, do not thus play the beast any longer.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b1ba9f71d5" data-kw="">
<blockquote><p>If I love such things as God has lent me, and committed unto mine administration, so that I cannot find in mine heart to bestow them on the uses which God has appointed me, then I dishonour God and abuse his creature, in that I give more honor unto it than I should do; and then I make an idol of it, in that I love it more than God and his commandment; and then I dishonor my neighbor, from whose need I withdraw it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-053212b8ee" data-kw="">
<blockquote><p>Christ appears to Moses first in the fiery bush, as if to say, ‘With this image or figure I am showing that if you want to recognize Christ, whoever you may be, you will find it first in Moses that He will come from the seed of Abraham and redeem the world.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>LW 62.78</cite></span></figcaption>

</figure><figure class="quote" id="q-32f10c1bd5" data-kw="">
<blockquote><p>Therefore upon these grounds, 1. We simply condemn any delineating of God, or the Godhead, or Trinity, such as some have upon their buildings, or books, like a sun shining with beams and the Lord’s Name, Jehova, in it, or any other way, this is most abominable to see, and a heinous wronging of God’s Majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 2nd Commandment, p. 55</span></figcaption>

— James Durham, An Exposition of the Ten Commandments… (London, 1675), 2nd Commandment, p. 55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+upon+these+grounds%2C+1.+We+simply+condemn+any+delineating+of+God%2C+or+the+Godhead%2C+or+Trinity%2C+such+as+some+have+upon+their+buildings%2C+or+books%2C+like+a+sun+shining+with+beams+and+the+Lord%E2%80%99s+Name%2C+Jehova%2C+in+it%2C+or+any+other+way%2C+this+is+most+abominable+to+see%2C+and+a+heinous+wronging+of+God%E2%80%99s+Majesty.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+An+Exposition+of+the+Ten+Commandments%E2%80%A6+%28London%2C+1675%29%2C+2nd+Commandment%2C+p.+55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32f10c1bd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32f10c1bd5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-god-are-forbidden/#:~:text=Therefore%20upon%20these%20grounds%2C%201.%20We,a%20heinous%20wronging%20of%20God%E2%80%99s%20Majesty&amp;text=Therefore%20upon%20these%20grounds%2C%201.%20We%20simply%20condemn&amp;text=see%2C%20and%20a%20heinous%20wronging%20of%20God%E2%80%99s%20Majesty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-90b837260d" data-kw="">
<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-conclusion.html">Rutherford’s Conclusion</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, ‘An Introduction to Scandal’, Question 6, ‘A Further Consideration of Things Not Necessary &amp; How They be Scandalous Objects’, pp. 62-3</span></figcaption>

</figure><figure class="quote" id="q-b69904f602" data-kw="">
<blockquote><p>When Moses beheld the bush burning with fire, and yet no whit consumed, he wondered at the sight, and said, ‘I will now turn aside and see this great sight, why the bush is not burnt.’ But when God thereupon called unto him out of the midst of the bush, and said, ‘Draw not night hither,’ and told him who He was; Moses trembled, hid his face, and durst not behold God. Yet although being thus warned, we dare not draw so nigh; what doth hinder but we may stand aloof off, and wonder at this great sight? ‘Our God is a consuming fire;’ (Heb. 12:29) says the apostle: and a question we find propounded in the prophet, ‘Who among us shall dwell with the devouring fire? Who among us shall dwell with the everlasting burnings?’… With what astonishment then may we behold our dust and ashes assumed into the undivided unity of God’s own person; and admitted dwell here, as an inmate under the same roof? And yet in the midst of those everlasting burning, the bush to remain unconsumed, and to continue fresh, and green for evermore. Yea, how should not we with Abraham rejoice to see this day, wherein not only our nature in the person of our Lord Jesus is found to dwell for ever in those everlasting burnings; but, in and by Him, our own persons also are brought so night thereunto, that God does set his sanctuary among us, and dwell with us; and (which is much more) makes us ourselves to be the house and habitation, wherein He is pleased to dwell by his Spirit…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery of the Incarnation in The Whole Works</cite>, … (1631), vol. 4, pp. 585-86</span></figcaption>

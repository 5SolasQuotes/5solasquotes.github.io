<main class="wrap"><figure class="quote" id="q-d754cccd5b" data-kw="">
<blockquote><p>And further, we might say to him who seeks to convince us that mind does not exist: It is folly for you to undertake any such task; for if your theory is true, I am not properly the subject of argument. You might as well expect a dead man to find comfort in his funeral sermon. Convincing me, were you to succeed, would only mean setting in motion certain nerve-currents in a material organism. And besides, you, in the act of arguing, are only a material organism, with a set of material forces at work which you call your philosophical opinions. One Leyden jar might as well be supposed to discuss chemistry with another Leyden jar as for you and me to talk metaphysics.

And yet again: If I am convinced that you are right, I am convinced that consciousness has played me false. But if in regard to this fundamental conviction I am deceived, how can I be sure of my eyes and my ears when they tell me that you are present and that you speak? To be convinced that consciousness is a false witness seems to be impossible, when I remember that my belief in the existence of my philosophical acquaintance is founded on a belief in the veracity of consciousness. I must trust my consciousness in order that I may be convinced that it is mendacious, which involves an absurdity akin to that of a man trying to take himself up in his arms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-l-patton.html">Francis L. Patton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Christian Doctrine</cite>, (Philadelphia: The Westminster Press, 1901), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

</figure><figure class="quote" id="q-cd7f05d40b" data-kw="">
<blockquote><p>As I have emphasized, the Aristotelian position acknowledges that sensory experience, mental imagery, emotion, and other mental attributes we share with non-human animals are entirely corporeal or bodily. It also holds that the intellect depends on the senses, and thus the body and brain, for informational input. It also holds that the intellect depends on the senses, and thus the body and brain, for informational input. Moreover, the Aristotelian allows that even when concepts have been abstracted from mental imagery, the intellect still, in the normal course of things, makes use of imagery when entertaining even the most abstract ideas and lines of reasoning. That too depends on brain activity. And it cannot be emphasized too strongly that these are not concessions the Aristotelian has been forced to make in light of modern neuroscientific findings. On the contrary, these are things that Aristotelians have been saying for centuries. Hence there is nothing in what modern neuroscience has discovered about the mind that need be remotely troubling to the Aristotelian. Indeed it is precisely the sort of thing Aristotelian philosophy of mind would lead us to expect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 3, ‘What is a human being?’ | ch. 9, ‘Neither computers nor brains’, ‘Arguments from neuroscience’, p. 440</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Flacius Illyricus [an extreme Lutheran]. Marin Mersenne, in his commentary on the early chapters of Genesis, says that by denying innate ideas, Flacius took away the tools we need to fight atheism and atheists. (Mersenne, Quaestiones Celeberrimae in Genesim (Paris: Sébastien Cramoisy, 1623), pp. 236ff.) Flacius’ rejection of inborn sparks of knowledge was based on his mistaken view of original sin. He apparently claimed that original sin was the actual substance or nature of a human being or the human soul.</p></blockquote>

</figure><figure class="quote" id="q-f1d8e2c61a" data-kw="">
<blockquote><p>[1.] A twofold revelation of God is given to wayfarers [persons in this life], one in the sphere of nature, another in the sphere of grace.

2. Revelation in the sphere of nature is either Objective in the works of creation, or Subjective in the consciences of men.

3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led.

4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving.

5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel and doctrine concerning Christ the Savior and faith in Him, who, without knowledge of Him who alone is the way, can come to life?

6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3ffcc16b4a" data-kw="">
<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 3, ch. 4</cite>, p. 69</span></figcaption>

</figure><figure class="quote" id="q-f073f8f4b1" data-kw="">
<blockquote><p>Swearing by appeal to God is a most solemn act of worship: but the sign of taking an oath is left free to convenient choice. Abraham‘s servant did it by putting his hand under his thigh: Was this a common law or institution? Others did it otherwise: We do it by laying our hand on the Book and kissing it. These are neither sinful additions or idolatry. The memorial of God’s works and men’s covenants were kept, sometime by pitching stones, sometime by pillars, sometime by set days (as the Feast of Purim), sometime by laying up the ensigns (as Goliah‘s sword, etc.). And all these lawful and no idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, pp. 13-14</span></figcaption>

</figure><figure class="quote" id="q-13058b77a4" data-kw="">
<blockquote><p>…he [the opponent] was required to prove it significative of some spiritual duty [in order for it to be warrant for a human, significant ceremony in worship]: For it was in probability only a common sign of subjection, as well out of an oath, as in it, without any respect unto Christ. …but men’s conceits are no great proofs. He adds 2. that if it were a sign of subjection yet might it be significant of a spiritual duty. But may be and might be is no proof.</p></blockquote>

</figure><figure class="quote" id="q-0ce027ab35" data-kw="">
<blockquote><p>There is a twofold intention in worship, one formal and properlly religious, and is expounded moral, ex natura rei [out of the nature of the thing], to be religious, it being such an intention, as can have no other state in worship, but a religious state… an intrinsical intention, ex natura et conditione operis [out of the nature and condition of the work], to worship… But there is another intention not religious: if a child read a chapter of the Bible, that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, Signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’, and here the object not being religious, the intrinsical operation cannot raise up any religious intention of the child… the latter intention of the worker, is so far extraneous to worship, as whether it be, or be not, the nature of worship is not impaired nor violated. Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646) | Introduction</cite>, pp. 88-89</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8a2877e5ef" data-kw="">
<blockquote><p>It is a pious saying that the Father is not limited by times: for the true meaning of the name of Father which He bore before time began surpasses comprehension. Although religion teaches us to ascribe to Him this name of Father through which comes the impassible origin of the Son, yet He is not bound in time, for the eternal and infinite God cannot be understood as having become a Father in time, and according to the teaching of the Gospel the Only-begotten God the Word is recognized even in the beginning rather to be with God than to be born. …

The essential likeness conformed to the Father’s essence in kind is also taught to be identical in time: lest He who is the image of God, who is the Word, who is God with God in the beginning, who is like the Father, by the insertion of times between Himself and the Father should not have in Himself in perfection that which is both image, and Word, and God. For if He be proclaimed to be younger in time, He has lost the truth of the image and likeness: for that is no longer likeness which is found to be dissimilar in time. For that very fact that God is Father prevents there being any time in which He was not Father: consequently there can be no time in the Son’s existence in which He was not Son. Wherefore we must neither call the Father older than the Son nor the Son younger than the Father: for the true meaning of neither name can exist without the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 24-25 in Nicene and Post-Nicene Fathers 2, 9: 10-11.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b49847345b" data-kw="">
<blockquote><p>Humility.—A measure of this grace is to be expected in every true Christian: but it can only appear in proportion to the knowledge they have of Christ and of their own hearts. It is a part of C’s [1] daily employment to look back upon the way by which the Lord has led him; and while he reviews the Ebenezers he has set up all along the road, he sees, in almost an equal number, the monuments of his own perverse returns, and how he has in a thousand instances rendered to the Lord evil for good. Comparing these things together, he can without affectation adopt the Apostle’s language, and style himself “less than the least of all saints, and of sinners the chief.”

A and B know that they ought to be humbled; but C is truly so, and feels the force of that text which I mentioned in my last; Ezek. xvi. 63. Again, as he knows most of himself, so he has seen most of the Lord. The apprehension of infinite Majesty combined with infinite Love, makes him shrink into the dust. From the exercise of this grace he derives two others, which are exceedingly ornamental, and principal branches of the mind which was in Christ.

The one is, submission to the will of God. The views he has of his own vileness, unworthiness, and ignorance, and of the Divine sovereignty, wisdom, and love, teach him to be content in every state, and to bear his appointed lot of suffering with resignation, according to the language of David in a time of affliction, “I was dumb, and opened not my mouth, because thou didst it.”

The other is, tenderness of spirit towards his fellow-Christians. He cannot but judge of their conduct according to the rule of the word. But his own heart, and the knowledge he has acquired of the snares of the world, and the subtilty of Satan, teach him to make all due allowances, and qualify him for admonishing and restoring, in the spirit of meekness, those who have been overtaken in a fault. Here A is usually blameable; the warmth of his zeal, not being duly corrected by a sense of his own imperfections, betrays him often into a censorious spirit. But C can bear with A likewise, because he has been so himself, and he will not expect green fruit to be ripe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter XII, Forty-One Letters on Religious Subjects</cite></span></figcaption>

</figure><figure class="quote" id="q-ee137d1657" data-kw="">
<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 87-88</span></figcaption>

<blockquote><p>Q. 2. Is this doctrine of the Trinity, then; a fundamental article, upon the belief of which our salvation depends?

A. Beyond all doubt it is: because without the knowledge and belief of the Trinity of persons, we would remain ignorant of the love of the Father, the merit of the Son, and the sanctifying influences of the Holy Ghost, in the purchase and application of redemption; without which there could be no salvation, John 17:3, – “This is life eternal, that they might know thee the only true God, and Jesus Christ whom thou hast sent.</p></blockquote>

<blockquote><p>20. Q. Doth the Holy Ghost proceed only from the Father?

A. No: But also from the Son, he is therefore called the Spirit of Christ. Rom. 8.9. But ye are not in the Flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any Man have not the Spirit of Christ, he is none of his. AND THE SPIRIT OF THE SON. Gal. 4.6. And because ye are Sons, God hath sent forth the Spirit of his Son into your Hearts, crying, Abba, Father.

21. Q. Is not the Holy Ghost, only a Power, or Attribute of God?

A. No: But an actual Person, having Understanding and Will. 1 Cor. 2.10. For the Spirit searcheth all Things, yea the deep Things of God. Chap. 12.11. But all these worketh that one and the self-same Spirit, dividing to every Man severally as he will. He also appeared at the Baptism of Christ, Matt. 3.16. And Jesus when he was baptized, went up straightway out of the Water: And lo, the Heavens were opened unto him, and be saw the SPIRIT of GOD descending like a Dove, and lighting upon him.

22. Q. Is he also a distinct Person?

A. Yes; He is expressly called, another, John 14.16, 17. And I will pray the Father, and he shall give you another Comforter that he may abide with you for ever; even the Spirit of Truth.</p></blockquote>

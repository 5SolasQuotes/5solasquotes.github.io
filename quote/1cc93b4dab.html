<main class="wrap"><figure class="quote" id="q-1cc93b4dab" data-kw="">
<blockquote><p>But they say that the “definition of predestination is opposed to the advantage of preaching,”—as if, indeed, it were opposed to the preaching of the apostle! Did not that teacher of the heathen so often, in faith and truth, both commend predestination, and not cease to preach the word of God?

Because he said, “It is God that worketh in you both to will and to do for His good pleasure,” did he not also exhort that we should both will and do what is pleasing to God? or because he said, “He who hath begun a good work in you shall carry it on even unto the day of Christ Jesus,” did he on that account cease to persuade men to begin and to persevere unto the end?

Doubtless, our Lord Himself commanded men to believe, and said, “Believe in God, believe also in me:” and yet His opinion is not therefore false, nor is His definition idle when He says, “No man cometh unto me”—that is, no man believeth in me—“except it has been given him of my Father.” Nor, again, because this definition is true, is the former precept vain. Why, therefore, do we think the definition of predestination useless to preaching, to precept, to exhortation, to rebuke,—all which things the divine Scripture repeats frequently,—seeing that the same Scripture commends this doctrine?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Gift of Perseverance</cite>, (c. 428-29), 34 in Nicene and Post-Nicene Fathers 1, 5: 538-39.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e430f5a8c3" data-kw="">
<blockquote><p>GOD, whose judgments no man can comprehend, whose ways cannot be found out, and whose will ought to stop all men’s mouths, according to the determinate and unchangeable purpose of his will, by the virtue whereof all things are made, yea even those things which are evil and execrable (not in that they be wrought by his divine counsel, but forasmuch as they proceed of the prince of the air, and that spirit which works in the children of disobedience) has determined from before all beginning with himself, to create all things in their time, for his glory, and namely men: whom he has made after two sorts, clean contrary one to the other.

Whereof he makes the one sort (which it pleased him to choose by his secret will and purpose) partakers of his glory through his mercy, and these we call according to the word of God, the vessels of honour, the elect, the children of promise, and predestinate to salvation: and the others, whom likewise it pleased him to ordain to damnation (that he might show forth his wrath and power, to be glorified also in them) we do call the vessels of dishonour and wrath, the reprobate and cast off from all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Totius Christianismi</cite>, trans. William Whittingham, rev. R. Scott Clark (Geneva, 1575; 2002), p. 4.</span></figcaption>

<blockquote><p>1. According to my ordering of the decrees divine: In no moment of nature or reason is the decree of damnation precedent to the decree of permitting infidelity, or leaving the infidelity of some men uncured, to wit, by denying them faith, by denying the grace of regeneration. But the decrees of creating all in Adam, of permitting all to fall in Adam, in bringing all men forth into the world in the state of original sin, of leaving this original sin uncured in them, and last of all, of damning them for their sins; are decrees not subordinate, but coordinate, as decrees de mediis [of means, or middle things], tending jointly to one supreme end, which is the manifestation of God’s glory upon them in the way of justice-vindicative, as also to show the riches of his glory upon the vessels of mercy whom He has prepared unto glory (Rom. 9:22), to wit, by beholding in others that miserable condition, which through God’s mere grace and goodness they have escaped.

2. According to the Contra-Remonstrants [Anti-Arminians] tenet, I answer: 1. Many of them do not maintain that infidelity is consequent to the decree of damnation, but in the foresight of God, precedent rather: as appears by the British [delegation of] divines [to the Synod of Dort], their Theses de Reprobatione; and Alvarez professes the same. The denial of grace, and so the permitting of natural infidelity to remain uncured, they make consequent (as it seems) to a negative decree of denying glory. And to the decree of permitting infidelity, they make the foresight of infidelity subsequent; and this foresight of infidelity they make precedent to reprobation, as it signifies the decree of damnation. And thus far I agree with them, that in no moment of nature, or sign of reason did God ordain any man to damnation, but for sin; and consequently in no moment of nature, or sign of reason, did the decree of damnation go before the foresight of sin or infidelity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, … (Oxford: L.L., 1653), pt. 1, ‘The Discourse Itself’, p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-11dffc7fdb" data-kw="">
<blockquote><p>The will of God is the supreme rule of righteousness, so that everything which he wills must be held to be righteous by the mere fact of his willing it. Therefore, when it is asked why the Lord did so, we must answer, Because he pleased. But if you proceed farther to ask why he pleased, you ask for something greater and more sublime than the will of God, and nothing such can be found.</p></blockquote>

<blockquote><p>In the following extract, John Knox explains that the civil magistrate is to rule according to scripture alone. Libertarian Theologians and the advocates of Two-Kingdoms establishmentarianism agree that the role of the state is determined by the word of God. They differ, however, when it comes to determining precisely what the role of the state is. Upon first reading, we might be tempted to think that Knox’s argument supports Libertarian Theology; for this reason, footnotes have been added to elucidate Knox’s meaning:

St Paul in few words declareth the end wherefore the sword is committed to the powers, saying, it is ‘to the punishment of the the wicked doers, and to the praise of such as do well’ (Rom. 13). Of which words it is evident, that the sword of God is not committed to the hand of man, to use as it pleaseth him; but only, to punish vice, maintain virtue,[1] that men may live in such society as before God is acceptable. And this is the very and only cause why God hath appointed powers in this earth. For such is the furious rage of man’s corrupt nature, that unless severe punishment were appointed, and put in execution upon malefactors, better it were that man should live among brute and wild beasts, than among men. But at present, I dare not enter into the description of this common-place, for so should I not satisfy the text, which by God’s grace I purpose to absolve [open up]. This only by the way I would, that such as are placed in authority, should consider, whether they reign and rule by God, so that God ruleth them; or, if they rule without, besides, and against God; of whom our prophet here doth complain.

If any lust to take trial of this point, it is not hard; for Moses in the election of judges, and of a king, describeth not only what persons shall be chosen to that honour, but doth also give to him that is elected and chosen, the rule, by the which he shall try himself whether God reign in him or not; saying, ‘When he shall sit upon the throne of his kingdom, he shall write to himself an exemplar of this law in a book, but the priests the Levites: it shall be with him, and he shall read therein all the days of his life, that he may learn to fear the Lord his God, and to keep all the words of this law, and these statutes, that he may do them; that his heart be not lifted up above his brethren, and that he turn not from the commandment, to the right hand, or to the left (Deut. 17). The same is repeated to Joshua, in his inauguration to the government of the people, by God himself, saying, ‘Let not the book of this law depart from thy mouth, but mediate in it day and night, that thou mayest keep and do all that which is written in it. For then shall thy way be prosperous, and thou shalt do prudently’ (Josh. 1).[2]

The first thing then that God craveth of him that is called to the honour of a king, is, the knowledge of his will revealed in his Word: the second, is an upright and willing mind to put in execution such things as God commandeth in his law, without declining either to the right hand or to the left.

Kings then have not absolute power to do in their regiment what pleaseth them; but their power is limited by God’s Word. So that if they strike where God commandeth not, they are but murderers; and if, they spare, where God commandeth to strike, they and their throne are criminal, and guilty of the wickedness that aboundeth upon the face of the earth for lack of punishment. Oh, if kings and princes would consider what account shall be craved of them, as well of their ignorance and misknowledge of God’s will, as for the neglecting of their office!</p></blockquote>

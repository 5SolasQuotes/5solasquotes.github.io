<main class="wrap"><figure class="quote" id="q-a2b42ca68b" data-kw="">
<blockquote><p>Whom, when Priscilla. By this it appeareth how far Priscilla and Aquila were from the love of themselves, and from envying another man’s virtue, in that they deliver those things familiarly and privately to an eloquent man, which he may afterward utter publicly. They excelled not in the same grace wherein he did excel, and, peradventure, they might have been despised in the congregation. Moreover, they most diligently help him, whom they see better furnished as well with eloquence as the use of the Scripture; so that they keep silence, and he alone is heard.

Again, this was no small modesty which was in Apollos, in that he doth suffer himself to be taught and instructed not only in [by] an handy-craftsman, but also by a woman. He was mighty in the Scripture, and did surpass them; but as touching the accomplishment of the kingdom of Christ, those do polish and trim him who might seem to be scarce fit ministers.

Also, we see that at that time women were not so ignorant of the word of God as the Papists will have them; forasmuch as we see that one of. the chief teachers of the Church was instructed by a woman. Notwithstanding, we must remember that Priscilla did execute this function of teaching at home in her own house, that she might not overthrow the order prescribed by God and nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 202-03.</span></figcaption>

</figure><figure class="quote" id="q-dbc05a79dd" data-kw="">
<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 5:28</span></figcaption>

bc05a79dd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=In%20the%20second%20member%20%5Bof%20the,without%20exception%20which%20they%20shall%20command&amp;text=In%20the%20second%20member%20%5Bof%20the%20verse%5D%20he&amp;text=be%20received%20without%20exception%20which%20they%20shall%20command" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>20. They are not fond of significant mystic ceremonies in the worship and service of God, but rather follow and symbolize that comely Gospel-simplicity which Christ and his apostles used that in the Church of Rome has been sadly marred with the whorish fairdings and gaudrie of human devices, additions and traditions, rather borrowed from the old pagan pagentry than the sacred page: But though they nauseate such relics and pieces of Papistry, yet what rites and ceremonies are decent and convenient, either from the nature or adjuncts of the religious things or actions they are exercised about, they are neither so shay nor foolish as to refuse to use them, K. J. Conf., art: 21, Acts of the Assembly, 1638, ss: 7, Assembly’s Confession, ch. 21, article 1.</p></blockquote>

</figure><figure class="quote" id="q-274a098af2" data-kw="">
<blockquote><p>Now if the Pope’s Commands are in force, and the Commands of God dispensed with, the Commands of the Pope will soon just out the Commands of God. You know the Pope hath by the Plenitude of his power struck out the second Commandment, and by the same authority he may when he please, strike out the first Commandment, and by consequent all the rest; and then he may make a new Preface, and a new Decalogue, if that number will content him, he may say as the Extravagant saith, that he himself [is the Lord our God,] who desires to bring us into the land of Egypt, the house of bondage (he should do well to put in that) where we shall have no other God but the Pope, for he exalts himself above all that is called God; but we may have as many Images, and Idols as we please, and so take the Name of our God in vain; we must keep all the Saint’s days, and then we shall not be at leisure to keep the Lord’s-day; you know the Pope’s Agents here in England, about four years ago, did not only dispense with the people for observing the Lord’s-day, but enjoin them to prophane it: you know their Doctrine about equivocation, and Fornication; they do too often count Murther meritorious, a Doctrine which doth well become the mouth of that purple whore, who is drunk with the blood of Saints.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now if the Pope’s Commands are in force, and the Commands of God dispensed with, the Commands of the Pope will soon just out the Commands of God. You know the Pope hath by the Plenitude of his power struck out the second Commandment, and by the same authority he may when he please, strike out the first Commandment, and by consequent all the rest; and then he may make a new Preface, and a new Decalogue, if that number will content him, he may say as the Extravagant saith, that he himself [is the Lord our God,] who desires to bring us into the land of Egypt, the house of bondage (he should do well to put in that) where we shall have no other God but the Pope, for he exalts himself above all that is called God; but we may have as many Images, and Idols as we please, and so take the Name of our God in vain; we must keep all the Saint’s days, and then we shall not be at leisure to keep the Lord’s-day; you know the Pope’s Agents here in England, about four years ago, did not only dispense with the people for observing the Lord’s-day, but enjoin them to prophane it: you know their Doctrine about equivocation, and Fornication; they do too often count Murther meritorious, a Doctrine which doth well become the mouth of that purple whore, who is drunk with the blood of Saints.”

— Francis Cheynell, Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast, (London: Samuel Gellibrand, 1643), p. 15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+if+the+Pope%E2%80%99s+Commands+are+in+force%2C+and+the+Commands+of+God+dispensed+with%2C+the+Commands+of+the+Pope+will+soon+just+out+the+Commands+of+God.+You+know+the+Pope+hath+by+the+Plenitude+of+his+power+struck+out+the+second+Commandment%2C+and+by+the+same+authority+he+may+when+he+please%2C+strike+out+the+first+Commandment%2C+and+by+consequent+all+the+rest%3B+and+then+he+may+make+a+new+Preface%2C+and+a+new+Decalogue%2C+if+that+number+will+content+him%2C+he+may+say+as+the+Extravagant+saith%2C+that+he+himself+%5Bis+the+Lord+our+God%2C%5D+who+desires+to+bring+us+into+the+land+of+Egypt%2C+the+house+of+bondage+%28he+should+do+well+to+put+in+that%29+where+we+shall+have+no+other+God+but+the+Pope%2C+for+he+exalts+himself+above+all+that+is+called+God%3B+but+we+may+have+as+many+Images%2C+and+Idols+as+we+please%2C+and+so+take+the+Name+of+our+God+in+vain%3B+we+must+keep+all+the+Saint%E2%80%99s+days%2C+and+then+we+shall+not+be+at+leisure+to+keep+the+Lord%E2%80%99s-day%3B+you+know+the+Pope%E2%80%99s+Agents+here+in+England%2C+about+four+years+ago%2C+did+not+only+dispense+with+the+people+for+observing+the+Lord%E2%80%99s-day%2C+but+enjoin+them+to+prophane+it%3A+you+know+their+Doctrine+about+equivocation%2C+and+Fornication%3B+they+do+too+often+count+Murther+meritorious%2C+a+Doctrine+which+doth+well+become+the+mouth+of+that+purple+whore%2C+who+is+drunk+with+the+blood+of+Saints.%E2%80%9D%0A%0A%E2%80%94+Francis+Cheynell%2C+Sion%E2%80%99s+memento%2C+and+Gods+alarum.+In+a+sermon+at+Westminster%2C+before+the+Honourable+House+of+Commons%2C+on+the+31.+of+May+1643.+the+solemn+day+of+their+monthly+fast%2C+%28London%3A+Samuel+Gellibrand%2C+1643%29%2C+p.+15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F274a098af2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/274a098af2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/02/francis-cheynell-on-the-danger-of-popery-to-the-lords-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-ef80eef3e2" data-kw="">
<blockquote><p>The Lord loveth the gates of Zion more than all the dwellings of Jacob.”—Ps 87:2 THAT we may apprehend the meaning of these words, and so thereupon raise some edifying observation, we must inquire into the reason why the Lord is said to love the gates of Zion more than all the dwellings of Jacob. This being manifest, the words will be clear. Now the reason we may find assigned by the Lord himself, Deut. xiii. 5, 6, 11. The gates of Zion was the place which the Lord had chosen to cause his name to dwell there, i.e. as the following words explain, the place of his worship. For the temple was built upon, or near to, the hill of Zion. And this, you know, was in peculiar the settled place of his worship. It was the Lord’s delight in affection to his worship, for which he is said to love the gates of Zion, more than all the dwellings of Jacob. But it may be replied, the Lord had worship, not only in the gates of Zion, in the temple, but also in the dwellings of Jacob. We cannot suppose that all the posterity of Jacob would neglect the worship of God in their families; no doubt the faithful among them resolved with Joshua, ‘I and my house will serve the Lord.’ Since, therefore, the worship of God was to be found in both, how can this worship be the reason why one should be preferred before the other? Sure upon no other account but this, the worship of God in the gates of Zion was public, his worship in the dwellings of Jacob was private. So that, in fine, the Lord may be said to love the gates of Zion before all the dwellings of Jacob, because he prefers public worship before private. He loved all the dwellings of Jacob, wherein he was worshipped privately; but the gates of Zion he loved more than all the dwellings of Jacob, for there he was publicly worshipped. Hence we have a clear ground for this Observation. Public worship is to be preferred before private. So it is by the Lord, so it should be by his people. So it was under the law, so it must be under the gospel. Indeed, there is difference between the public worship under the law and gospel in respect of a circumstance, viz., the place of public worship. Under the law, the place of public worship was holy, but we have no reason so to account any place of public worship under the gospel; and this will be manifest, if both we inquire what were the grounds of that legal holiness in the tabernacle or temple, and withal observe that none of them can be applied to any place of worship under the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prizing Public Worship</cite></span></figcaption>

<blockquote><p>Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 7, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>That as the Jews were wont to shut up the solemnity of the Passover by singing some of David’s Psalms; so our Saviour, after the celebration of the Sacrament of his body and blood, went out with his disciples to the mount of Olives, […] having sung the Hymn, which Hymn (say the best expositors) was the same that the Jews did ordinarily sing after the Passover, and is called by them the great Hallel, which, as Paulus Brugensis says, consisted of six Psalms, from Ps. 113 to Ps. 118, and he adds (verisimile est hos à Domino decantatos) it is most like that these were sung by our Saviour. And Drusius says, hunc hymnum hodieque canunt in nocte Paschatis; The Jews sing this Hymn in the evening of the Passover to this day. The learned Scaliger having largely described the forms and rites of celebrating the Passover, concludes thus; This was the true rite of celebrating the Passover in the times of the Messiah…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3e0068a0fa" data-kw="">
<blockquote><p>They did only examine Paul&#x27;s doctrine by the rule and square of the Scripture … for the Scripture is the true touchstone whereby all doctrines must be tried. If any man say that this kind of trial is doubtful, forasmuch as the Scripture is oftentimes doubtful, and is interpreted divers ways, I say, that we must also add judgment of the Spirit, who is, not without cause, called the Spirit of discretion, [discernment.] But the faithful must judge of every doctrine no otherwise then out of, and according to, the Scriptures, having the Spirit for their leader and guide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 17:11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-b1bdca0c90" data-kw="">
<blockquote><p>It is not denied that the people, learned and unlearned, in order to the proper understanding of the Scriptures, should not only compare Scripture with Scripture, and avail themselves of all the means in their power to aid them in their search after the truth, but they should also pay the greatest deference to the faith of the Church. … What Protestants deny on this subject is, that Christ has appointed any officer, or class of officers, in his Church to whose interpretation of the Scriptures the people are bound to submit as of final authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-12c2017005" data-kw="">
<blockquote><p>The fact that all the true people of God in every age and in every part of the Church, in the exercise of their private judgment, in accordance with the simple rules above stated, agree as to the meaning of Scripture in all things necessary either in faith or practice, is a decisive proof of the perspicuity of the Bible, and of the safety of allowing the people the enjoyment of the divine right of private judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>

</figure><figure class="quote" id="q-5b92934789" data-kw="">
<blockquote><p>Although we allow to individual believers the judgment of private discretion (because &quot;he that is spiritual judgeth all things&quot; [1 Cor. 2:15], and the apostle commands us to &quot;prove all things&quot; [1 Thess. 5:21]), we do not therefore assert in opposition to Peter (2 Pet. 1:20*) that the Scriptures are of private interpretation (idia epilysis). For epilysis here does not mean the interpretation of the Scriptures so much as the origin of the prophetic oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.33</span></figcaption>

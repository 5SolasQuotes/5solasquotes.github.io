<main class="wrap"><figure class="quote" id="q-110c52544f" data-kw="">
<blockquote><p>Lombard tuaght that the days of Genesis 1, defined by mornings and evenings, should be understood as ‘the space of twenty four hours.’ (Sentences, bk. 2, dist. 12, ch. 2) Bonaventure (AD 1221-1274) argued that God created ‘in the space of six days’–a phrase that will appear later in Reformed writings.¹ ¹ The Latin phrase sex dierum spatium appears in Bonaventure’s Commentaries on the Four Books of Sentences, trans. Alexis Bugnolo, book 2, commentary on distinction 12, art. 1, question 2…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-beeke.html">Joel Beeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What did the Reformers Believe about the Age of the Earth?</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-57a97c89f5" data-kw="">
<blockquote><p>Secondly, that which is the only foundation of a scruple in this case, is a principle most unreasonable in itself, that we are to embrace nothing for truth, though divinely revealed, but what our reason is able to comprehend, as to the nature of the thing, and the manner of its existence; on which account the doctrine of the Trinity, Incarnation, Satisfaction, and consequently the whole mystery of the Gospel of Christ must be rejected as incredible, and that on this bare pretense, because although many expressions in Scripture seem to import all these things, yet we are bound to interpret them to another sense, because this is incongruous to our reason. But although Christianity be a religion which comes in the highest way of credibility to the minds of men, although we are not bound to believe anything but what we have sufficient reason to make it appear that it is revealed by God, yet that anything should be questioned whether it be of divine revelation, merely because our reason is to seek, as to the full and adaequate conception of it, is a most absurd and unreasonable pretence: And the assertors of it must run themselves on these unavoidable absurdities: First, of believing nothing either in nature or religion to be true, but what they can give a full and satisfactory account of, as to every mode and circumstance of it. Therefore let such persons first try themselves in all the appearances of nature: And then we may suppose they will not believe that the sun shines, till they have by demonstrative arguments proved the undoubted truth of the Ptolomaic or Copernican hypothesis, that they will never give credit to the flux and reflux of the Sea, till they clearly resolve the doubts which attend the several opinions of it. That there is no such thing as matter in the world, till they can satisfactorily tell us how the parts of it are united; nor that there are any material beings, till they have resolved all the perplexing difficulties about the several affections of them; and that themselves have not so much as a rational soul, till they are bound to satisfy us of the manner of the union of the soul and body together. And if they can expedite all these, and many more difficulties about the most obvious things…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Origines Sacræ, or, A Rational Account of the Grounds of Christian Faith</cite>, ... (London, 1662), bk. 2, ch. 8, pp. 233-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1028b83b72" data-kw="">
<blockquote><p>Hence we define the creation of the world as an external action of the almighty God… whereby… He founded the heavens and the earth out of nothing, at the beginning of time. And in the space of six days He arranged in their proper order all the individual things which He willed to mold from that prime matter…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-polander.html">Johannes Polander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of Pure Theology</cite>, (Brill, 2015), vol. 1, disputation 10, ‘Concerning the Creation of the World’, pp. 248-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-bb7c6bef38" data-kw="">
<blockquote><p>1. Man is to be considered as a creature [and] 2. as such a creature, to wit, endued with reason and the Image of God; in either considerations, especially in the former, all that are created are obliged to do and suffer the will of God though they never sinned. It’s not enough to say that sun, moon, trees, herbs, vines, earth, beasts, birds and fishes cannot suffer the ill of punishment which is relative to the break of a Law, for the whole creation is subject to vanity for our sins, Rom. 8:20-21. The servant is smitten and sickened for the master’s sake, and God may take from them what He gave them, [even] their lives without sense of pain and dolor, for all beings, yea [even] defects and privations, are debtors to the glory-declarative of God, Prov. 16:4; Rom. 11:36; yea, and no-beings [things that could be, but are not,] are under this debt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (1655), p. 17</span></figcaption>

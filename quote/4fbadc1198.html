<blockquote><p>Of the punishments of Adultery

22 Somewhat we will declare in this place of the punishments of adultery. And this I think to be necessary for me: for by the grievousness of the punishments, we know the weightiness of sins. By rewards and punishments Common-weals are preserved. But punishments must be applied, according to the heinousness of offenses. … Now grievous a sin is Schism, or to be divided from the church, it is perceived by the punishments laid upon men for other grievous sins. The idolatry own unto the molten calf, God punished by a kind of death. Because Zedechias burned the book of the prophet, God did revenge it with captivity. But the rebellion done against Moses and Aaron he punished more grieviously: he sent a fire, wherewith those, which conspired with Chore, were consumed, and the earth swallowed up the seditious persons.

We will first then consider the punishments of adultery, that we may understand how heinous a sin it is. Secondly we will see, whether the adulterer and the adulteress, should have equal punishments; and whether they be bound to like punishments, and whether of them is the greater sinner. Thirdly, what evils may come by reason that these punishments are either neglected or bitterly taken away. As thourching the first, we must search in the holy scriptures, what may be found touching the punishments of adultery; after that we will defend to the reckoning up of punishments of divers nations; then will we come to the Roman laws; and last of all unto the ecclesiastical and Canon laws.

Of the first we must understand, that the divine scriptures teach us, that The wages of sin is death. Seeing therefore that death is due unto sins; forthwith, after a man hath transgressed, he might be put to death by the justice of the law. But God is not so strict an exactor, he granteth as yet some space unto life: the which nevertheless is sometime broken off by the sword of the magistrates; if grievous crimes be committed, which can by no means be suffered. But there are other sins of less weight, for which it is not lawful to put men to death. Further, we will see whether adultery may be reckoned among those sins, whereunto death is due. Certainly it was a sin, whereunto death belonged: as the holy scriptures declare unto us, and that for good cause. For by this wickedness is hurt that society, from whence is derived the fountain of all friendship among men. In the book of Genesis, when Abimelech the king of Gerar had seen Isaac playing somewhat familiar with Rebecca, he perceived him to be her husband and not her brother. So then he charged, that one upon the pain of death should touch that woman.

Therefore we see, that before the law of Moses, adultery was by the Ethnicks [pagans] punished with death. Joseph after that it had been lain to his charge in Egypt, that he committed adultery with his mistress, was delivered to the head officer of capital crimes; and was cast into prison. Tamar, when she had buried two husbands, and waited for the third, unto whom she was betrothed, did commit adultery, and was judged to be burnt. And undoubtedly, when a woman that is betrothed, doth abuse her self, she committeth adultery. For although it be not a full marriage, yet is there such hope of marriage, as it ought not to be polluted.

This did the emperor Severus perceive. The law may be read Ad legem Iulian de adulterio, in the Digests, the law Sivxor, in the Paraih Dinus. In the 22 chapter of Deuteronomy, and in the 20 Leviticus: by the law that is there given, the adulterer &amp; adulteress are commanded to be put to death. Which sentence, God in the 16 chapter of Ezekiel confirmeth, where he saith, that he would bring punishment upon the adulterous Israelites. The same law is confirmed in the eight chapter of John. When the Scribes and Pharisees had brought unto Christ a woman, which was taken in adultery, they said; Moses commanded us in the law, that such a woman should be stoned, &amp;c.

So greatly did God esteem charity, and unspotted wedlock; as he would not have so much as suspicion to remain between them, which were man and wife. For in the book of Numbers, there is indeed a law touching jealousy. She which was suspected of adultery, was brought unto the priest; curses were denounced, a drink was given her, and straitway it was known whether she was an adulteress or no. And if a man had married a wife, and had been able to gather and prove by certain signs, that she was not a virgin; she was punished. If a maiden betrothed to a husband, had been forced by any abroad in the field, the ravisher should have been punished with death: if in the city, the damsel should also have had the same punishment, Deuteronomy 22, so then great severity was used herein. Howbeit the revenge was not committed to private persons: the husband killed not his wife, nor the father his daughter; but the matter was brought before a judge. So read we to be done to Susanna, although that history be Apocryphal. In the propher Jeremie, we read that Nabuchadne-zar rolled Zedechias and Achabus, two unchaste priests. These things we have in the holy scriptures, especially of the old testament.</p></blockquote>

<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects.

1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ.

2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction.

3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>

<blockquote><p>How can piety but promise to herself a zealous patron of your Highness, being the sole son and heir of so gracious and great a monarch, who is not only the defender of the faith by title, but also a defender of the faith in truth, as the Christian world hath taken notice, by his learned confuting of [Robert] Bellarmine’s overspreading heresies, and his suppressing in the blade of [Conrad] Vorstius’s Athean blasphemies? [1]

And how easy it is for your Highness to equal, if not exceed, all that were before you, in grace and greatness, if you do but set your heart to seek and to serve God, considering how religiously your Highness hath been educated by godly and virtuous governors and tutors; as also that you live in such a time, wherein God’s providence, and the King’s religious care, hath placed over this church, to the unspeakable comfort thereof, another venerable Jehoiada, that doth good in our Israel both towards God and towards his house; of whom your Highness at all times, in all doubts, may learn the sincerity of religion, for the salvation of your inward soul, and the wisest counsel for the direction of your outward state.

And to excite you the rather to the zealous practice of divine piety, often suppose with yourself, that your Highness hears your religious father James speaking unto you, as sometimes holy David spake to his son Solomon: and thou Charles my son know thou the God of thy father, and serve him with a perfect heart, and with a willing mind; for the Lord searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.</p></blockquote>

<blockquote><p>4. The old covenant is abrogated as to the yoke of Mosaical policy. — We have nothing to do with the judicial laws of the Jews, any farther than they are moral, or of a moral equity: “The law and the prophets were until John.” (Lk. 16:16) “The priesthood being changed, there is made of necessity a change also of the law.” (Heb. 7:12)</p></blockquote>

<blockquote><p>There are on the contrary, those things that pass from parent to child, which the parent by nature or special privilege, hath power to convey, as

1. The essential or integral parts of a species, with the natural properties, that do accompany it, so one brute beast brings forth another, one bird brings forth another, and man brings forth one of man-kind.

2. The privileges or burdens, which in Family or Nation are hereditary, they are conveyed from parents to posterity, from Ancestors to their Issue: As is the father, so is the child, as respecting these particulars: The child of a Free-man with St Paul is free born: The child of a Noble man is noble; The child of a bond-man (where servants were wholly their Masters to dispose) is a bond-man likewise. So the child, of a Turk is a Turk; The child of a Pagan is a Pagan; The child of a Jew is a Jew; The child of a Christian is a Christian: As by virtue of the grand Charter of Heaven among the people of God, this privilege doth descend: So it is of the nature of those things that are descendible.

3. The name of Jew or Christian would not long hold in any family, among any people, if this truth (that there is a generation, according to the flesh, which have this privilege to be accounted of the people of God) may not be yielded, but as it is in trades, the father is of one, the son of another, so we should see it in religions: But God provideth for a continuance in succession, from age to age, from generation to generation; he keeps them still within Covenant, though many do degenerate.

But some say, all this is blown away at one breath: That the Jews had this privilege cannot be denied. But this was a privilege peculiar to the seed of Abraham’s flesh, and not to the seed of his saith: Believing Jews had this birthright-privilege, Believing Christians have not, they must make profession of their faith before they be accounted among them that be holy.

I answer, Such a grant God did once vouchsafe by free Charter to his people: How can it be made appear that ever it was reversed, or any such limit put unto it? The Church of God hath held it in Fee by virtue of this grant from Abraham to this very hour, and there is no word of God to challenge them for usurpation; They that will out us of so long possession, must make their plea punctual for our eviction.

Secondly, Christians can produce new Covenant-advancing Scriptures, that Christ’s coming put them into a better and more comfortable condition then were believers in former ages: I would fain have them to produce any one new Covenant-depressing Scripture, to shew that we in any case are in a worse or more uncomfortable condition then our fathers. If it be said that though this Birth-privilege be taken away, yet we are not in a worse condition having it in other more desirable things enlarged.

Let these then shew when, and where this was taken away, and what was given in lieu and recompense of this want, and greatest discomfort that can come to a parent, as a parent, to have his issue expunged out of the number of God’s people who are holy: Let them produce those Scriptures, which so difference the old and new Covenant made with believers, that the one should be perpetual, the other personal; That the Covenant with the Jew shall transcend the Covenant with Christians, as an Inheritance for ever exceeds a Grant for term of life:

Let them give us an hint of any Reason why this privilege should belong to the heirs of Abraham’s body, and not to the heirs of his faith. That reason held forth by some, that Christ should come out of his loins is of no force, it excludes all the tribes out of that privilege but Judah, when every tribe of Israel in this were equal with Judah, every family of Judah’s tribe but David’s; And most of all, it would have excluded the seed of the Proselytes, that according to the flesh were strangers to Israel, when yet in this privilege they were equal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The birth-privilege, or, Covenant-holiness of believers and their issue in the time of the Gospel together with the right of infants to baptism</cite>, (London: Tho. Underhill, 1644), pp 5-7.</span></figcaption>

he+Jews+had+this+privilege+cannot+be+denied.+But+this+was+a+privilege+peculiar+to+the+seed+of+Abraham%E2%80%99s+flesh%2C+and+not+to+the+seed+of+his+saith%3A+Believing+Jews+had+this+birthright-privilege%2C+Believing+Christians+have+not%2C+they+must+make+profession+of+their+faith+before+they+be+accounted+among+them+that+be+holy.%0A%0AI+answer%2C+Such+a+grant+God+did+once+vouchsafe+by+free+Charter+to+his+people%3A+How+can+it+be+made+appear+that+ever+it+was+reversed%2C+or+any+such+limit+put+unto+it%3F+The+Church+of+God+hath+held+it+in+Fee+by+virtue+of+this+grant+from+Abraham+to+this+very+hour%2C+and+there+is+no+word+of+God+to+challenge+them+for+usurpation%3B+They+that+will+out+us+of+so+long+possession%2C+must+make+their+plea+punctual+for+our+eviction.%0A%0ASecondly%2C+Christians+can+produce+new+Covenant-advancing+Scriptures%2C+that+Christ%E2%80%99s+coming+put+them+into+a+better+and+more+comfortable+condition+then+were+believers+in+former+ages%3A+I+would+fain+have+them+to+produce+any+one+new+Covenant-depressing+Scripture%2C+to+shew+that+we+in+any+case+are+in+a+worse+or+more+uncomfortable+condition+then+our+fathers.+If+it+be+said+that+though+this+Birth-privilege+be+taken+away%2C+yet+we+are+not+in+a+worse+condition+having+it+in+other+more+desirable+things+enlarged.%0A%0ALet+these+then+shew+when%2C+and+where+this+was+taken+away%2C+and+what+was+given+in+lieu+and+recompense+of+this+want%2C+and+greatest+discomfort+that+can+come+to+a+parent%2C+as+a+parent%2C+to+have+his+issue+expunged+out+of+the+number+of+God%E2%80%99s+people+who+are+holy%3A+Let+them+produce+those+Scriptures%2C+which+so+difference+the+old+and+new+Covenant+made+with+believers%2C+that+the+one+should+be+perpetual%2C+the+other+personal%3B+That+the+Covenant+with+the+Jew+shall+transcend+the+Covenant+with+Christians%2C+as+an+Inheritance+for+ever+exceeds+a+Grant+for+term+of+life%3A%0A%0ALet+them+give+us+an+hint+of+any+Reason+why+this+privilege+should+belong+to+the+heirs+of+Abraham%E2%80%99s+body%2C+and+not+to+the+heirs+of+his+faith.+That+reason+held+forth+by+some%2C+that+Christ+should+come+out+of+his+loins+is+of+no+force%2C+it+excludes+all+the+tribes+out+of+that+privilege+but+Judah%2C+when+every+tribe+of+Israel+in+this+were+equal+with+Judah%2C+every+family+of+Judah%E2%80%99s+tribe+but+David%E2%80%99s%3B+And+most+of+all%2C+it+would+have+excluded+the+seed+of+the+Proselytes%2C+that+according+to+the+flesh+were+strangers+to+Israel%2C+when+yet+in+this+privilege+they+were+equal.%E2%80%9D%0A%0A%E2%80%94+Thomas+Blake%2C+The+birth-privilege%2C+or%2C+Covenant-holiness+of+believers+and+their+issue+in+the+time+of+the+Gospel+together+with+the+right+of+infants+to+baptism%2C+%28London%3A+Tho.+Underhill%2C+1644%29%2C+pp+5-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0dcf3b8a57.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0dcf3b8a57.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/15/thomas-blake-on-the-new-covenant-and-the-birth-privileges-of-christians/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

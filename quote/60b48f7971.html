<main class="wrap"><figure class="quote" id="q-60b48f7971" data-kw="">
<blockquote><p>Believers shall be adjudged to everlasting life on account of Christ’s fulfillment of the law in their stead…and their sentence will correspond with the nature, though not with the merit of their gracious qualities and works, particularly their kindness to poor saints, which shall be publicly mentioned as a mark of their union with Christ, filial relation to God, gracious heirship and diligent seeking of his heavenly kingdom…. But, whether their sins will be publicly mentioned in the last judgment, is not so evident. On the one hand, None of their sins are mentioned in the judicial procedure…. God casts all their sins behind his back, into the depths of the sea, and remembers them no more…. Christ, their judge, being also their propitiation and advocate, would not mention their sins…. The public mention of their sins could not but affect them with shame; and could not consist with his presenting them without wrinkle… But on the other hand, Every work of men, whether good or bad, is represented as brought into judgment…. God’s justice seems to require, that both sides of a cause should be produced and heard…. Many of their sins are publicly marked in Scripture. By the public mentioning of their sins, the justifying virtue of Christ’s blood will be illustriously manifested…. Many of their sins are so connected with those of the wicked, that the one cannot be publicly mentioned without the other. The belief of such public manifestation of their sins may be of great use to render them circumspect in this life. Such public mention of their sins could not then affect them with disagreeable shame and confusion, as it is not their innocence, but Jesus and his righteousness, which are their comfort and glory….</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3c4b7bc33" data-kw="">
<blockquote><p>Life Eternal is the life of glory, wherein the soul, joined to our body, enjoys God forever, being advanced to the highest top and height of her felicity. The Cause of this life is God, to wit, the Father the efficient, the Son the meritorious, and the Holy Ghost the sealing and applying cause. The Matter, which has the respect of the subject, are those good things, which neither eye has seen, nor ear heard, nor can the mind of man comprehend. That which is of the Object, are all the blessed and elect. The Form is the most perfect knowledge, vision, and fruition of God Himself, and the exceeding felicity &amp; blessedness of man, which accompanies the same, which also consists both in the separation, and absence of all evil things, and in the participation, and presence of all good things; both are both perfect and eternal. The End is the glory of God’s grace, and the glorifying of the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confirming, pp. 589-90</span></figcaption>

<blockquote><p>I. There are three kinds or differences of life: there is a life of nature, which the apostle calls Natural. There is a life of Grace, which the sons of God alone do enjoy in this world: there is a life of Glory, which consists in the vision of God.

II. Life eternal is two ways taken: Metonymically, both for the way to life, and for Christ Himself: Properly, for the state of the blessed after this life.

III. There is one vision of God natural, in the things created; another specular, or symbolical, by resemblances and signs; another of faith, by the doctrine and doings of Christ; another of present sight, or of glory to come, when we shall see God face to face.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confuting, of Life Eternal, pp. 594-5</span></figcaption>

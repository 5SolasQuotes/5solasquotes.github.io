<main class="wrap"><figure class="quote" id="q-8f01fded6d" data-kw="">
<blockquote><p>Matters of smaller weight, and so covertly discovered that no great offence to the Church was to be feared in them, I wholly passed by, as one that discerned nothing of them, or had been unfurnished of replies. For other of greater moment, and so openly delivered, as there was just cause of fear, least the truth and church of God should be prejudiced and periled by it, and such as the conscience of my duty &amp; calling would not suffer me altogether to pass over, this was my course, to deliver, when I should have just cause by my text, the truth of such doctrine as he had otherwise taught in general speeches, without touch of his person in any sort, and further at convenient opportunity to confer with him in such points.

According to which determination, whereas he had taught certain things concerning predestination otherwise then the word of God doth, as it is understood by all churches professing the gospel, and not unlike that wherewith Coranus some times troubled his church; I both delivered the truth of such points in a general doctrine, without any touch of him in particular, and conferred with him also privately upon such articles.

In which conference, I remember, when I urged the consent of all churches, and good writers against him that I knew, and desired if it were otherwise, what authors he had seen of such doctrine, he answered me that his best author was his own reason: which I wished him to take heed of, as a matter standing with Christian modesty &amp; wisdom in a doctrine not received by the church, not to trust to his own judgment so far, as to publish it before he had conferred with others of his profession, labouring by daily prayer, and study to know the will of God, as he did, to see how they understood such doctrine: notwithstanding he with wavering replying that he would some other time deal more largely in the matter, I wished him, &amp; prayed him not so to do, for the peace of the church, which by such meanes might be hazarded; seeing he could not but think, that men, who make any conscience of their ministry, will judge it a necessary duty in them, to teach the truth, and to convince the contrary.

Another time upon like occasion of this doctrine of his that the assurance of that we believe by the word, is not so certain, as of that we perceive by sense; I both taught the doctrine otherwise, namely the assurance of faith to be greater, which assureth both of things above, and contrary to all sense and human understanding, and dealt with him also privately upon that point.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-travers.html">Walter Travers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Supplication made to the Privy Counsel</cite>, (Oxford: John Barnes, 1612), pp 12-13.</span></figcaption>

<blockquote><p>We say, furthermore, that these Reformed Churches do not dissent in the fundamentals of faith. For although they may dissent in some chapters of Doctrine, we nevertheless deny any dissension in the fundamentals of faith… We are not saying here that they do not dissent in rites and ceremonies, for not every such dissension, either by its own nature severs, or ought to sever, the union of the Reformed Churches, especially since none of the Reformed Churches retains rites that are repugnant to the Gospel or introduced with an opinion of worship… Augustine, in Epistle 86, wrote no less skillfully than holily: “Let the garment of the Church be so varied by different observances that it is not torn apart by adverse contentions.”… Furthermore, it should also be added that we do not say that the Reformed Churches do not likewise dissent in the external mode of administering ecclesiastical polity or discipline… Nevertheless, we also contend that, this discrepancy being admitted, there is still no dissension in the fundamentals of faith. Indeed, such diversity in external polity can and ought to be tolerated without injury to or rupture of fraternal unity, especially since all the reformed Churches retain those things which are absolutely necessary, namely, the pure preaching of the Word of God, the due administration of the Sacraments, the ordination of pastors by public authority, and finally, the censure of morals. It is not on account of a difference in external form in these matters, where there is consensus in the fundamentals of faith, that the Reformed Churches should fight among themselves and reject all external ecclesiastical union. … The Foundation of Faith denotes… The primary object of faith, which is Christ the Savior… An epitome of this doctrine of the prophets and apostles [Eph. 2:20], containing in itself the sum of the Law and the Gospel, can be and is accustomed to be most conveniently reduced to four heads. So Augustine in the Enchiridion.

1. The Apostles’ Creed.

2. The Decalogue.

3. The Lord’s Prayer.

4. The doctrine of the sacraments. … But neither do we say they dissent in the very many secondary and tertiary articles, which since they are sufficiently proposed to, revealed to, and understood by all the Reformed Churches, are asserted with unanimous consent by them against the old heresies of the Marcionites, Manichaeans, Arians, Eunomians, Nestorians, Eutychians, and Monothelites, and against the new heresies of the Romanists. In a very few secondary articles not sufficiently proposed to all, or certainly not well enough weighed by them, and in some tertiary ones whose clear deduction from the primary is still hidden from some Churches, let there be dissent… Yet that does not impede the harmony of faith (ὁμονοίαν πίστεως) nor does it, or should it, break the ecclesiastical unity of the said Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 144-53, pp. 145-49</span></figcaption>

— Samuel Ward, ‘The Reformed Churches do not Dissent, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 144-53, pp. 145-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+say%2C+furthermore%2C+that+these+Reformed+Churches+do+not+dissent+in+the+fundamentals+of+faith.+For+although+they+may+dissent+in+some+chapters+of+Doctrine%2C+we+nevertheless+deny+any+dissension+in+the+fundamentals+of+faith%E2%80%A6+We+are+not+saying+here+that+they+do+not+dissent+in+rites+and+ceremonies%2C+for+not+every+such+dissension%2C+either+by+its+own+nature+severs%2C+or+ought+to+sever%2C+the+union+of+the+Reformed+Churches%2C+especially+since+none+of+the+Reformed+Churches+retains+rites+that+are+repugnant+to+the+Gospel+or+introduced+with+an+opinion+of+worship%E2%80%A6+Augustine%2C+in+Epistle+86%2C+wrote+no+less+skillfully+than+holily%3A+%E2%80%9CLet+the+garment+of+the+Church+be+so+varied+by+different+observances+that+it+is+not+torn+apart+by+adverse+contentions.%E2%80%9D%E2%80%A6+Furthermore%2C+it+should+also+be+added+that+we+do+not+say+that+the+Reformed+Churches+do+not+likewise+dissent+in+the+external+mode+of+administering+ecclesiastical+polity+or+discipline%E2%80%A6+Nevertheless%2C+we+also+contend+that%2C+this+discrepancy+being+admitted%2C+there+is+still+no+dissension+in+the+fundamentals+of+faith.+Indeed%2C+such+diversity+in+external+polity+can+and+ought+to+be+tolerated+without+injury+to+or+rupture+of+fraternal+unity%2C+especially+since+all+the+reformed+Churches+retain+those+things+which+are+absolutely+necessary%2C+namely%2C+the+pure+preaching+of+the+Word+of+God%2C+the+due+administration+of+the+Sacraments%2C+the+ordination+of+pastors+by+public+authority%2C+and+finally%2C+the+censure+of+morals.+It+is+not+on+account+of+a+difference+in+external+form+in+these+matters%2C+where+there+is+consensus+in+the+fundamentals+of+faith%2C+that+the+Reformed+Churches+should+fight+among+themselves+and+reject+all+external+ecclesiastical+union.+%E2%80%A6+The+Foundation+of+Faith+denotes%E2%80%A6+The+primary+object+of+faith%2C+which+is+Christ+the+Savior%E2%80%A6+An+epitome+of+this+doctrine+of+the+prophets+and+apostles+%5BEph.+2%3A20%5D%2C+containing+in+itself+the+sum+of+the+Law+and+the+Gospel%2C+can+be+and+is+accustomed+to+be+most+conveniently+reduced+to+four+heads.+So+Augustine+in+the+Enchiridion.%0A%0A1.+The+Apostles%E2%80%99+Creed.%0A%0A2.+The+Decalogue.%0A%0A3.+The+Lord%E2%80%99s+Prayer.%0A%0A4.+The+doctrine+of+the+sacraments.+%E2%80%A6+But+neither+do+we+say+they+dissent+in+the+very+many+secondary+and+tertiary+articles%2C+which+since+they+are+sufficiently+proposed+to%2C+revealed+to%2C+and+understood+by+all+the+Reformed+Churches%2C+are+asserted+with+unanimous+consent+by+them+against+the+old+heresies+of+the+Marcionites%2C+Manichaeans%2C+Arians%2C+Eunomians%2C+Nestorians%2C+Eutychians%2C+and+Monothelites%2C+and+against+the+new+heresies+of+the+Romanists.+In+a+very+few+secondary+articles+not+sufficiently+proposed+to+all%2C+or+certainly+not+well+enough+weighed+by+them%2C+and+in+some+tertiary+ones+whose+clear+deduction+from+the+primary+is+still+hidden+from+some+Churches%2C+let+there+be+dissent%E2%80%A6+Yet+that+does+not+impede+the+harmony+of+faith+%28%E1%BD%81%CE%BC%CE%BF%CE%BD%CE%BF%CE%AF%CE%B1%CE%BD+%CF%80%CE%AF%CF%83%CF%84%CE%B5%CF%89%CF%82%29+nor+does+it%2C+or+should+it%2C+break+the+ecclesiastical+unity+of+the+said+Churches.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98The+Reformed+Churches+do+not+Dissent%2C+%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+144-53%2C+pp.+145-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7665cff6b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7665cff6b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=We%20say%2C%20furthermore%2C%20that%20these%20Reformed,ecclesiastical%20unity%20of%20the%20said%20Churches&amp;text=We%20say%2C%20furthermor

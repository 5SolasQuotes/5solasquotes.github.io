<blockquote><p>PRAYER.

MY Saviour Jesus, who hast loved me and washed me from my sins in thy blood, and hast presented me arrayed and decked with thy precious merit unto God thy Father: the more thy grace is admirable towards me, the more am I ashamed and grieved, that any thing displeasing unto thee should remain yet within me. The remembrance of my sins past is displeasing unto me, and much more the sense of the present. I have a deep sorrow that I have offended thee, but more that I offend thee still. O when shall the full deliverance come when all the bonds of sin shall be cut off, when there will be no more cloud between heaven and me that stop the passage of prayer, and no more weight that keep the spirit from rising to thee?

O Lord Jesu who hast plucked me out of the jaws of Hell by thy victory over death, be pleased to complete thy conquest in my soul. For I shall not account my self fully redeemed till I be rescued from the power of sin; and that is the principal end of thy coming, that is the principal effect of thine obedience. I learn of thine Angel fore-runner and foreteller of thy birth, that thou bearest the name of Jesus, because thou savest thy people from their sins. Mat. 1.21. There is with thee plenteous redemption, and thou shalt redeem Israel from all his iniquities. Psal. 130.7. Lord it is that plenteous redemption that my soul longeth for; I cannot be contented with less, then to be redeemed from all mine iniquities. I cannot conceive neither Salvation nor liberty without it.

Therefore will I call upon thee to be freed from sin, I will my self labour for it with all mine endeavour. And the freedom which it hath pleased thee to begin within me, kindleth my desire and provoketh my diligence to bring it to perfection. Yea, Lord I will say after thy servant David, I will walk at liberty, for I seek thy precepts, Psal. 119 45. being assured that I shall find in thy service perfect freedom. O what freedom; yea, what empire shall my soul possess, when she shall be altogether subjected to thy good spirit, who in recompense will subject this rebellious flesh unto the more spiritual part of the soul, this flesh which so often raiseth, even in faithful hearts, a party against God; and sets on the passions to shake off the magistracy of piety and reason.

O Son of God who makest us free and then we are free indeed. Joh. 8.36. I desire not to be free to make liberty a covering of maliciousness, or to turn thy grace into wantonness. I desire but to change one service for another, the service to sin for the service to righteousness, I desire to be free that I may be thy servant; yea, that I may serve thee with full liberty, freely bestowing all the powers and faculties of my soul upon thy service, and making my heart a burnt offering, a living Sacrifice, holy acceptable unto thee, which is my reasonable service.

O God and father of my Lord Jesus Christ, thou hast sanctified me in some measure by thy Spirit, because thou hadst before redeemed me by thy Son; but I long for the perfect stature: all is not well with me till I have the full measure. And how far I am yet from it, it grieves me to think on. But this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before, I press towards the mark for the prize of the high calling of God in Christ Jesus. Phil. 3.13.

O Lord if I have the grace sincerely to press towards the mark, I cannot miss the prize of thy high calling. Give me but the grace to press towards the mark, and I leave to thy goodness the care of bestowing the prize upon me. Let thy Sabbath be my delights, thy word my food, thy will my rule, thy commandments my business, and thy promises my encouragement. I long more to be sanctified then to be glorified; and I long to be glorious that I may be holy. But it is of thee, O Lord, that I must expect both: draw me, O Lord, and I shall run after thee. Cant. 1.4. Turn me and I shall be turned. Jer. 3.19. Teach me to do thy will for thou art my God. Psal. 143.10. Work in me both to will and to do according to thy good pleasure. Phil. 2.13. For thy Sons sake, and by thy Spirit, and perfect my holiness for thy glory. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A week of soliloquies and prayers. With a preparation for the Holy Communion</cite>, (London: H. Moseley, 1657), pp 59-67.</span></figcaption>

<blockquote><p>And first, learn, concerning prayer: All prayer for things heavenly and spiritual concerning the life to come (I speak not of the worldly things, but things heavenly and spiritual) should arise on some certainty and assurance of the heart, that God will grant to us the things we ask.

Therefore James in his Epistle last chap. 15. verse. he calls prayer, the prayer of faith, that is, that rises of faith and assurance in the heart, that God will grant us the thing we ask. John in his first Epistle, last chap. 14. verse, he joins these two together, confidence or assurance, and prayer, and he says. This is that confidence we have in the Lord, that, if We aske any thing according to his will, he will hear us:

There is confidence in prayer, that, when we pray, we should have that assurance that God will give us these things we seek, not according to our will, but according to his own will. It is his will that we should have these heavenly things, through the blood of Christ. And therefore our prayer for them should rise on confidence, that God will grant them for Christ’s sake.</p></blockquote>

<blockquote><p>Prayer is not a smooth expression, or a well-contrived form of words; not the product of a ready memory, or of a rich invention exerting itself in the performance. These may draw a neat picture of it, but still, the life is wanting. The motion of the heart God-wards, holy and divine affection, makes prayer real, and lively, and acceptable to the Living God, to whom it is presented; the pouring out of thy heart to Him who made it, and therefore hears it, and understands what it speaks, and how it is moved and affected in calling on Him.

It is not the gilded paper and good writing of a petition, that prevails with a king, but the moving sense of it. And to that King who discerns the heart, heart-sense is the sense of all, and that which only He regards: He listens to hear what that speaks, and takes all as nothing where that is silent. All other excellence in Prayer, is but the outside and fashion of it; this is the life of it.

Though prayer, precisely taken, is only petition, yet, in its fuller and usual sense, it comprehends the venting of our humble sense of vileness and sin, in sincere confession, and the extolling and praising of the holy name of our God, His excellency and goodness, with thankful acknowledgment of received mercies. Of these sweet ingredient perfumes is the incense of Prayer composed, and by the Divine fire of love it ascends unto God, the heart and all with it; and when the hearts of the saints unite in joint prayer, the pillar of sweet smoke goes up the greater and the fuller. …

And, indeed, the sincerity and unfeignedness of prayer, makes it go up as a straight pillar, no crookedness in it, tending straight towards heaven, and bowing to no side by the way. Oh ! the single and fixed viewing of God, as it, in other ways, is the thing which makes all holy and sweet, so particularly does it in this Divine work of prayer.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Prayer is not a smooth expression, or a well-contrived form of words; not the product of a ready memory, or of a rich invention exerting itself in the performance. These may draw a neat picture of it, but still, the life is wanting. The motion of the heart God-wards, holy and divine affection, makes prayer real, and lively, and acceptable to the Living God, to whom it is presented; the pouring out of thy heart to Him who made it, and therefore hears it, and understands what it speaks, and how it is moved and affected in calling on Him.

It is not the gilded paper and good writing of a petition, that prevails with a king, but the moving sense of it. And to that King who discerns the heart, heart-sense is the sense of all, and that which only He regards: He listens to hear what that speaks, and takes all as nothing where that is silent. All other excellence in Prayer, is but the outside and fashion of it; this is the life of it.

Though prayer, precisely taken, is only petition, yet, in its fuller and usual sense, it comprehends the venting of our humble sense of vileness and sin, in sincere confession, and the extolling and praising of the holy name of our God, His excellency and goodness, with thankful acknowledgment of received mercies. Of these sweet ingredient perfumes is the incense of Prayer composed, and by the Divine fire of love it ascends unto God, the heart and all with it; and when the hearts of the saints unite in joint prayer, the pillar of sweet smoke goes up the greater and the fuller. …

And, indeed, the sincerity and unfeignedness of prayer, makes it go up as a straight pillar, no crookedness in it, tending straight towards heaven, and bowing to no side by the way. Oh ! the single and fixed viewing of God, as it, in other ways, is the thing which makes all holy and sweet, so particularly does it in this Divine work of prayer.”

— Robert Leighton, A Practical Commentary Upon the First Epistle General of Saint Peter, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 512.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPrayer+is+not+a+smooth+expression%2C+or+a+well-contrived+form+of+words%3B+not+the+product+of+a+ready+memory%2C+or+of+a+rich+invention+exerting+itself+in+the+performance.+These+may+draw+a+neat+picture+of+it%2C+but+still%2C+the+life+is+wanting.+The+motion+of+the+heart+God-wards%2C+holy+and+divine+affection%2C+makes+prayer+real%2C+and+lively%2C+and+acceptable+to+the+Living+God%2C+to+whom+it+is+presented%3B+the+pouring+out+of+thy+heart+to+Him+who+made+it%2C+and+therefore+hears+it%2C+and+understands+what+it+speaks%2C+and+how+it+is+moved+and+affected+in+calling+on+Him.%0A%0AIt+is+not+the+gilded+paper+and+good+writing+of+a+petition%2C+that+prevails+with+a+king%2C+but+the+moving+sense+of+it.+And+to+that+King+who+discerns+the+heart%2C+heart-sense+is+the+sense+of+all%2C+and+that+which+only+He+regards%3A+He+listens+to+hear+what+that+speaks%2C+and+takes+all+as+nothing+where+that+is+silent.+All+other+excellence+in+Prayer%2C+is+but+the+outside+and+fashion+of+it%3B+this+is+the+life+of+it.%0A%0AThough+prayer%2C+precisely+taken%2C+is+only+petition%2C+yet%2C+in+its+fuller+and+usual+sense%2C+it+comprehends+the+venting+of+our+humble+sense+of+vileness+and+sin%2C+in+sincere+confession%2C+and+the+extolling+and+praising+of+the+holy+name+of+our+God%2C+His+excellency+and+goodness%2C+with+thankful+acknowledgment+of+received+mercies.+Of+these+sweet+ingredient+perfumes+is+the+incense+of+Prayer+composed%2C+and+by+the+Divine+fire+of+love+it+ascends+unto+God%2C+the+heart+and+all+with+it%3B+and+when+the+hearts+of+the+saints+unite+in+joint+prayer%2C+the+pillar+of+sweet+smoke+goes+up+the+greater+and+the+fuller.+%E2%80%A6%0A%0AAnd%2C+indeed%2C+the+sincerity+and+unfeignedness+of+prayer%2C+makes+it+go+up+as+a+straight+pillar%2C+no+crookedness+in+it%2C+tending+straight+towards+heaven%2C+and+bowing+to+no+side+by+the+way.+Oh+%21+the+single+and+fixed+viewing+of+God%2C+as+it%2C+in+other+ways%2C+is+the+thing+which+makes+all+holy+and+sweet%2C+so+particularly+does+it+in+this+Divine+work+of+prayer.%E2%80%9D%0A%0A%E2%80%94+Robert+Leighton%2C+A+Practical+Commentary+Upon+the+First+Epistle+General+of+Saint+Peter%2C+%281693-94%29+in+The+Whole+Works+of+the+Most+Reverend+Father+in+God%2C+Robert+Leighton%2C+D.D.%2C+Archbishop+of+Glasgow+%282+vols%2C+London%3A+James+Duncan%2C+1828%29%2C+1%3A+512.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa71d56be65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a71d56be65.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/27/robert-leighton-on-the-life-of-prayer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The truth is that fasting is such a help to extraordinary humiliation, as moderate feasting is to extraordinary thanksgiving, and therefore [fasting] is no more worship than Christian feasting: And to this purpose do our divines answer, concerning this place, which is ordinarily objected by every Papist, as here by the Rejoinder [of Ames’s opponent]. See Chemnitius upon these words. See Polanus, Syntagma, bk. 9, ch. 8, ‘Fasting is a help to prayer, a sign of humility and repentance, but is not a worship of God.’ 5. Fasting such as Hannah’s was, is not a human institution, as our ceremonies are, but partly natural, when the whole man is taken up with greater and more instant imployment, exclusive of all ordinary refreshments: and partly of divine application, in extraordinary humiliation, so that it has ground and example both in the Old &amp; New Testament, which our ceremonies are destitute of.</p></blockquote>

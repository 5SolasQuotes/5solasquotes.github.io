<main class="wrap"><figure class="quote" id="q-13e7f02ba2" data-kw="">
<blockquote><p>The Lord’s Supper they [Independents] desire to celebrate at night after all other ordinances are ended; albeit the Brownists [separatists] now take it in the forenoon.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-598737ce3b" data-kw="">
<blockquote><p>…still I deny that they have been set over believers as legislators to prescribe a rule of life at their own hands, or bind the people committed to them to their decrees. When I say this, I mean that they are not at all entitled to insist that whatever they devise without authority from the Word of God shall be observed by the Church as matter of necessity. Since such power was unknown to the apostles, and was so often denied to the ministers of the Church by our Lord himself, I wonder how any have dared to usurp, and dare in the present day to defend it, without any precedent from the apostles, and against the manifest prohibition of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, bk. 4, ch. 10, section</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-73072cf5f0" data-kw="">
<blockquote><p>To the place of Mt. 15, even you Bishop [John] Hooper had rather receive your meat with your hands washed than with your hands unwashed (as the Pharisees did). To Col. 2, whatsoever is spoken there of beggarly and weak elements appertains to superstition: by which superstition these things were exacted as matters necessary or profitable to salvation, even after Christ was revealed: And whatsoever abuse there be of these garments [for ministers] (or the like ceremonies) that sticks not on the garments, but in impure minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Sprint, assander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’</cite>, p. 175</span></figcaption>

</figure><figure class="quote" id="q-4c57a2c187" data-kw="">
<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert Macward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… (1671), 3rd Dialogue</cite>, pp. 112</span></figcaption>

<blockquote><p>Q. 26. Are our forefathers to be blamed for pulling down altars, images, and other monuments of idolatry, from places of public worship at the Reformation? No; they had Scripture precept and warrant for what they did, Num. 33:52, and Deut. 7:5 — “Ye shall destroy their altars, and break down their images, and cut down their groves, and burn their graven images with fire.</p></blockquote>

<blockquote><p>The Prelatical conformity… Their way was destructive to true Christian liberty both of conscience and practice, compelling the practice, and conscience itself, by the mere will and authority of the law-makers. Obedite praepositis [obey in those things having been put forth] was the great argument with them to satisfy consciences: Sic volo, sit jubeo, sic pro ratione voluntas [Thus I will; I may so command; thus the will for the reason]. We say that no canons nor constitutions of the church can bind the conscience nisi per et propter verbum Dei, i.e. except insofar as they are grounded upon and warrantable by the Word of God, at least by consequence, and by the general rules thereof…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 83 of Ch. 15, ‘Of Uniformity in Religion, Worship of God and Church Government’ in Miscellaneous Questions (no date)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fde2d15b26" data-kw="">
<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John</cite>, 13:12-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.”

</figure><figure class="quote" id="q-e408f5506f" data-kw="">
<blockquote><p>‘Yea but’ (say they) ‘our significant ceremonies were taken from idolaters and limbs of [the Roman] Antichrist who have abused them.’ Were this true, yet take the dross from the silver and make a vessel for the finer (Prov. 25:4); but it is false. Though they have had such as ours and have still, yet ours are our own and were never theirs in special. Fire and water are contrary, yet they agree in their kind: they are both elements. So ours are ceremonies and so are theirs, but otherwise they differ as fire and water; they scorn therefore ours and we deride theirs. We read of sacrifices offered to devils, yet some of this was sold in shambles and some the heathens made feasts of [such]. It was all the same flesh in kind, but not in use. The Christians did damnably if they went to it when it was sacrificed, yea and if they went to their idol feasts when they blessed an idol, it was idolatry; but if they bought part of that flesh in the shambles and ate it, or went to their private feasts when they ate of it (for aught they knew) without reference to the idol, then, says Paul, ‘Eat, making no question for conscience sake.’ So say we of our cross, surplice, kneeling: they were ordinances before idolaters abused them. If they take them and bless an idol with them, be it upon their own pates; but if we be invited to them in a better use (and not know, nor have just cause to suspect any lurking idolatry), why should we make so many needless questions about the use of them? Put [the] case, such as they are pertained to idolaters. So did Goliath’s sword, yet David laid it up in a holy place for better use. So did bowing belong to Baal, prostrating the whole body to idols, kissing to the calves, kissing the hand to the host of heaven, lifting up the eyes, stretching forth both hands, shouting for joy, sitting or lying along upon the ground or on a carpet to idols; yet all these we may use in the worship of the true God. So for our ceremonies, such as they are pertained to idolaters, but were not idolatrous of themselves. The cross was used as a sign of profession before idolatry prevailed. The white garment was ordained as a cover-sloven in the poverty of the Church; kneeling was used as an act of reverence before the breaden god was hatched. And may not we lawfully use them now, to show that we are in communion and fellowship with that blessed and persecuted Church, without such noises and schisms?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., pp. 207-9</span></figcaption>

<blockquote><p>13. The points upon which the Lutheran Churches disagree with us are of two kinds. There are some upon which it is easier to reach agreement: such are the ceremonies of the Lutheran Churches, which may be excused and tolerated, because they concern decorum rather than necessity. Of the same sort also are certain opinions respecting the point of Predestination, upon which, I judge, one might easily draw up an article of the common confession that all would approve without difficulty, provided that curiosity be avoided—which, I believe, has already been done by the Confession of Augsburg [1530], which speaks of it soberly and expressly declines that question. There is also some difference concerning the necessity of baptism, which may rightly and reasonably be affirmed to be necessary to salvation — that is to say, that it is necessary for each person not to despise it — without pressing the question of necessity any further.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“13. The points upon which the Lutheran Churches disagree with us are of two kinds. There are some upon which it is easier to reach agreement: such are the ceremonies of the Lutheran Churches, which may be excused and tolerated, because they concern decorum rather than necessity. Of the same sort also are certain opinions respecting the point of Predestination, upon which, I judge, one might easily draw up an article of the common confession that all would approve without difficulty, provided that curiosity be avoided—which, I believe, has already been done by the Confession of Augsburg [1530], which speaks of it soberly and expressly declines that question. There is also some difference concerning the necessity of baptism, which may rightly and reasonably be affirmed to be necessary to salvation — that is to say, that it is necessary for each person not to despise it — without pressing the question of necessity any further.”

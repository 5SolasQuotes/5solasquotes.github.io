<blockquote><p>WE come now to the words themselves; wherein Christ asserts that, He is, 1) the Way (2) the Truth, (3) the Life. &amp; (4) That no man cometh to the Father but by him. In them we learn those two things, in general, first The misery of wretched man by nature: This cannot be in a few words expressed. These words will point out those particulars thereof, which we will but mention.

1. That he is born an enemy to, and living at a distance from God, by virtue of the curse of the broken covenant of life, made with Adam.

2. That he neither can, nor will return to God, of himself. His way is not in himself; He hath need of another to be his way.

3. That he is a blind wandering creature, ready to take by ways and to wander; yea he loveth to wander: He goeth astray as soon as he is borne, speaking lies.

4. He cannot discern the true way; but is blinded with prejudice thereat, and full of mistakes, he is nothing but a lump of error.

5: He is dead legally, and really, how can he then come home? How can he walk in the way, though it were pointed out to him?

6. He, even when entered into the way, is subject to so many faintings, swoonings, upsittings &amp;c. that except he get new quickening, he must lye be the way, and perish.

In a word, his misery is such as cannot be expressed; for as little as it is believed, and laid to heart; or seen and mourned for, and lamented.

Now for a ground to our following discourse, I would press the solid, through, and sensible apprehension of this, without which there will be no use making or application of Christ: for the whole need not the physician, but the sick: and Christ is not come to call the righteous, but sinners to repentance. Mat. 9: 12. Marc. 2: 17. Yea, believers themselves would live within the sight of this, and not forget their frailty: for though there be a change wrought in them, yet they are not perfect, but will have need of Christ as the Way, the Truth and the Life, till he bring them in, and set them down upon the throne, and crown them with the crown of life.

And O happy they, who must not walk one foot without this guide, leading them by the hand, or rather carrying them in his arms. Let all then, who would make use of Christ, remember what they were, and what they are, and keep the sense of their frailty and misery fresh; that seeing their need of him, they may be in better case to look out to him for help and supply, and be more distinct in their application of him.

The Second general is, That Christ is a complete Mediator, thoroughly furnished for all our necessities: Are we at a distance from the Father: He is a Way to bring us together. Are we wandered out of the way: He is the Way to us. Are we blind and ignorant: He is the Truth: Are we dead: He is the

Life: Concerning this fullness &amp; completeness of his, we would make those things.

1. That he is thoroughly furnished with all things we stand in need of: the Way, the Truth and the Life, He hath eye salve, clothing, gold tried in the fire, &amp;c. For the Spirit of the Lord is upon him, and hath anointed him. Esa. 61: 1.

2. He is suitably qualified, not only having a fullness, and an all fullness, so that whatever we need, is to be had in him; but also a suitable fullness answering our case to the life: are we out of the way. He is the Way, are we dead, he is Life &amp;c.

3. He is richly qualified with this suitable good. He hath not only wisdom and knowledge, but treasures of it, yea all the treasures thereof Col 2: 3. There is fullness in him, yea it hath pleased the father that in him should all fullness dwell. Col. 1: 19. Yea the fullness of the godhead dwelleth in him bodily. Col. 2. 9.

4. Hence this is an upmaking completeness &amp; fullness: for we are said to be Complete in him Col. 2: 10. And he is said to be all and in all Col. 4: 11, He filleth all in all. Ephes. 1. 23.

5. It is also a satisfying completeness. The eye is not satisfied with seeing, nor the ear with hearing, the avaricious man is not satisfied with gold, nor the ambitious man wealth honour: but still they are crying with the loch-leech give, give. But the man who getteth Christ is full; he sitteth down and crieth, enough, enough, and no wonder, for he hath all. He can desire no more, he can seek no more, for what can the man want, that is complete in him?

6 There is here that, which will answer all the objections of a soul, and these sometimes are not few. If they say, they cannot know the way to the Father; then he is Truth, to instruct and teach them that, and so to enter them into it: and if they say, they cannot walk in that way, nor advance in it one step, but will faint and sit up, succumb and fall by; he answereth that. He is the Life, to put life, and keep life in them, and to cause them to walk, by putting a new principle of life in them, and breathing of new on that Principle.

O thrice happy they who have fled to him for refuge! It is easy for them, to answer all objections, and cavils of Satan, and of a false heart; It is easy for them, to put Christ to answer all. And on the other hand, who can tell the misery of such, as are strangers to Jesus? How shall their wants be made up? how shall they answer challenges, accusations, temptations, doubts, fears, objections, and discouragements cast up in their way?

O! should not this endear the way of the gospel to us, &amp; make Christ precious unto us? Is it not a wonder that such an a sufficient Mediator, who is able to save to the uttermost all that come to God through him, should be so little regarded and sought unto, and that there should be so few, that embrace him, and take him, as he is offered in the gospel?

How can this be answered, in the day of accounts? what excuse can unbelievers now have? Is not all to be found in Christ that their case calleth for? Is he not a complete mediator, thoroughly furnished with all necessaries? Is not the riches of his fullness written on all his dispensations? The mouths then of unbelievers must be for ever stopped.</p></blockquote>

</figure><figure class="quote" id="q-9057bfd0a5" data-kw="">
<blockquote><p>But, alas! ‘Twas not this that drove us from the Church of Rome. ‘Twas not the fall of one Felix, nor the weakness of some Cecilians, ’twas not the covetousness of her Prelates, the licentiousness of her Monks, the filthiness of her Court, the excess and abuse of her Sovereign Pontiffs. For though she suffered these disorders with too much indulgence, yet she neither doth command them, nor openly approve of them.

Though she very gently tolerate such as were debauched or vicious, yet she did not force any to be so. No man was for entering into her communion constrained to be a slave to any of those vices which bore sway in the midst of her. No, a man might have lived within it, and yet addicted himself to honesty and goodness: And as yet corruption had not gained so far, as that ill manners were authorized by public laws. But on the contrary during the worst of times, though her voice was weak and languishing, yet she made some noise against the impiety of the age. And oftentimes those very men that gave ill example in their lives preached against it and decried it horribly in the pulpit.

That which hath pulled us from her communion is her doctrine, and not her actions; that which she commands, and not that which she suffers; that which she requires of us all, and not that which she tolerates in some others; the articles of her faith, and not the faults of her life. For the adoration of the Eucharist, invocation of Saints, veneration of images, and those other articles which we rehearsed before, are not such things as she only tolerates as bad, or excuseth as doubtful; but beliefs which she commendeth as true, and observations which she commandeth as useful and necessary to salvation.

Nor doth she only practise them in the house and privately, but likewise preach them in the Temple, as perpetual parts of her Faith. So that if we continue in her communion, we must needs make profession of believing them, that is, make our selves guilty of an horrible hypocrisy, confessing with our mouth what we do not believe with our heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 15-16.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e3075bbc9d" data-kw="">
<blockquote><p>‘Therefore he that giveth in marriage.’… You are not, however, to understand that celibacy is here preferred to marriage, otherwise than under the exception which was a little before expressed. For if power be wanting [lacking] on the part of the daughter, the father acts an exceedingly bad part if he endeavors to keep her back from marriage, and would be no longer a father to her, but a cruel tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 7, v. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd91d1e080" data-kw="">
<blockquote><p>Christ-God is more than grace, pardon, holiness, than created glory, as the Husband is excellenter then his marriage robe, bracelets, rings; and we are to lay our love and faith principally upon the Father and the Son, more than all created graces;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

— Samuel Rutherford, The Trial and Triumph of Faith (1652) | Sermon 7, p. 75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist-God+is+more+than+grace%2C+pardon%2C+holiness%2C+than+created+glory%2C+as+the+Husband+is+excellenter+then+his+marriage+robe%2C+bracelets%2C+rings%3B+and+we+are+to+lay+our+love+and+faith+principally+upon+the+Father+and+the+Son%2C+more+than+all+created+graces%3B%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Trial+and+Triumph+of+Faith+%281652%29+%7C+Sermon+7%2C+p.+75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd91d1e080.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd91d1e080.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/wedding-rings/#:~:text=Christ%2DGod%20is%20more%20than%20grace%2C%20pardon,Son%2C%20more%20than%20all%20created%20graces&amp;text=Christ%2DGod%20is%20more%20than%20grace%2C%20pardon%2C%20holiness%2C%20than&amp;text=and%20the%20Son%2C%20more%20than%20all%20created%20graces" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2476d15112" data-kw="">
<blockquote><p>You will learn from our brother, master Butler, by what circumstances I am hindered and with whom I have to contend within these two days on the subject of divorce. In the commentaries¹ which I lately wrote on the decalogue, I allowed both to the man and his wife an equal liberty of divorce on account of adultery, if they are disposed to use that liberty which Christ has permitted in the gospel of his Church, where the marriage contract is dissolved by adultery. ¹ See a Declaration of the ten holy Commandments of Almighty God, in Hooper’s early writings, Parker Society edition. The passage here referred to will be found in pp. 378, 379, where Hooper complains of the uncharitable construction put upon it. My opponents allow the husband to divorce his wife by reason of adultery, and to marry another; but they do not allow the same liberty to the wife. In your next letter, as you love me, either confirm my opinion, or correct my error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Original Letters relative to the English Reformation</cite>, ed. Hastings Robinson for the Parker Society (Cambridge Univ. Press, 1846), vol. 1, Letter 32, Hooper to Bullinger, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-08bf918eb7" data-kw="">
<blockquote><p>…for here [at the Jerusalem Council] that not only the doctrinal power was to be used, but beside that: 1. the schism was to be removed, and the authority of the synod to be used against the willfulness and obstinacy of those obtruders of circumcision, in rebuking them as perverters of souls. 2. For the scandal which might have been taken if the Gentiles should have eaten blood and things strangled, and meats offered to idols, and therefore the apostles and elders behoved, as a convened synod to forbid a grievous scandal and a spiritual homicide against the Law of nature, to wit, that the gentiles for fear of scandalizing weak. believers amongst the Jews, should abstain from the practice of some things at this time merely indifferent in their nature, though not indifferent in their use, such as were to eat things offered to idols, things strangled and blood:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, pp. 390-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-83e40f8274" data-kw="">
<blockquote><p>…who denies that the magistrate may command the husband and wife to do a duty to each other, the father not to provoke the son, the son not to disobey the father… the master and servant, the captaine and soldier to do a duty each, one to another? And there is a proper right and liberty, and power [in these relations] immediately given by God, without the king or magistrate’s interposing of their authority: to all these, the king’s authority makes not the man a father, nor the son subject to the father, nor the servant to the master, nor the soldier to the commander. God immediately made those powers, and God in the Law of Nature has given a power to the father over the son without the magistrate; yea, though there had never been a magistrate in the world… …now it no more follows that all fathers are equal to the magistrate, all masters, all captains to the king… for fathers, masters, captains, husbands have immediately from God in the Law of Nature a supreme, a high and independent authority… without any intervention of the will or authority of king or any earthly magistrate, and without any subordination as they are such to the prince. … 3. If the magistrate should usurp over husbands, and masters and fathers, their jus maritale, herile, paterum [right of marriage, being an heir, or a father], and spoil them of husband-power, and masterly and fatherly power, as our adversaries counsel the magistrate to take the spiritual right and power of the keys of the Kingdome of God from the Church and pastors, the former should complain, as do the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (London, 1646), ch. 25, pp. 568-69</span></figcaption>

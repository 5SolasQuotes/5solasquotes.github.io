<main class="wrap"><figure class="quote" id="q-ce6a9f313d" data-kw="">
<blockquote><p>Thou sayest that amongst us there is respect of persons, that we prefer the wealthy; which, if they be liberal, although they be drowned in many vices, yet we use to heal up their sores, &amp;c.

I am assured that thy own conscience doth convict thee of a malicious lie, in thus writing; for thou canst not be ignorant what the city of Geneva hath of late years sustained for rooting our pestilent persons, who laboured to destroy the Lord’s vineyard planted in the same. And what was the cause that so they conjured against the liberty of Christ’s Evangel? The hatred, wilt thou and they say, which they did bear against strangers? I answer, But no mo[re] strangers were then in Geneva than were before, when the chief captains of that faction were most earnest professors of the Evangel, (in mouth I mean.) And in very deed, if they would have laboured to have expelled the strangers they had been enemies to their own commodity; for by the multitude of strangers their commonwealth doth flourish: and none did receive such benefits of strangers, as those that required Christ’s doctrine to be overthrown. …

The preachers called for reformation of manners. They boldly and sharply rebuked even those that were in highest authority. One of the chiefest of the band was excommunicated, and so did remain mo[re] years than one. The Consistory called for justice to be executed, and for the penalties to be appointed, for the inobedient and open contemners. But nothing could prevail; the multitude of the wicked was so great, that in votes and voices they did prevail. And so was great, that in votes and voices they did prevail.

And so was the iniquity of the wicked maintained for a long season. Which being considered, the godly as well that are native born, as also the strangers, consulted upon the next and surest remedy, and after that not only the most part of strangers were determined to depart, but that also faithful servant of Christ Jesus had in public sermon commended his flock, with the weeping eyes of many, to the protection and providence of God, and had publicly pronounced, that he would be no Minister in that church were vice could not be punished according to God’s word, where the wicked should triumph and make laws at their pleasure.

After this consultation, it was concluded that a reasonable number of strangers, whose fidelity and honest conversation had long been tried and well known, should be made burgesses, and free to have voice in Counsel, and in making civil statutes. Which being understand, the wicked began more manifestly to utter themselves: they opposed themselves to the magistrates, they plainly denied that any strangers should be free, they appealed to the greater Counsel; which being gathered, did justify the decree of the Sindiques (so the chief magistrates called.) Shortly after did the whole venom burst out: for after feasting and banqueting of all sorts of villains, was the conspiracy concluded and put in execution.

For with one consent they invade upon the night one of the chief magistrates: they cried victory and triumph, but God suddenly repressed that fury, so assisting, without the arm of man, his servant and lieutenant for that time appointed in that City, that first he recovered the ensign of his just and lawful office again; and thereafter so put to flight that rebellious and great multitude, that some being apprehended and committed to prison, the rest were disposed by the only power of God. For that is a thing most evident and plain, that the number of the one did in twenty degrees surmount the other.

This do I write, to let the simple reader understand, although thou be blinded, what was the original of the trouble which Geneva did after suffer. What did the strangers, I pray thee, gain by their liberty? As touching the world, I say nothing, for no kind of commodity they lacked before which after they did obtain, only this excepted, that in counsel they should have voices and place to speak: which thing also did only offend those oppressors of justice and maintainers of iniquity; for thereby did they perceive, that their enterprises should be broken, and that statutes should be made to reform their insolencie. To proceed, just being executed without respect of person upon those that were apprehended, the rest who did escape, to great number, were pronounced rebels.</p></blockquote>

<blockquote><p>Nobody should trust in his zeal for religious matters to the extent of believing that good intentions will automatically lead to right actions. Unless our zeal is controlled by the Word of God it will do more harm than good. The person who is addicted to superstitions and false doctrine will be a determined enemy of the truth and will probably turn out to be a fierce persecutor of those who worship it. That kind of zeal derives from an excessive devotion to ancestral traditions.

It is characteristic of such traditions of people that they invent a different God from the one who really exists but who appears to be close enough to ours that he takes pleasure in the things that we glorify. Before long, mixed forms of worship appear that are defended on the ground of their antiquity, the example of the masses and above all on the authority of their ancestors, which is sacrosanct for many and from which it would be wrong to depart. If they see other people who think and believe differently, they start to hate them and think that they should not be allowed to do anything, because they are considered to be enemies of religion and very dangerous people.

Furthermore, as Christ predicted, they think that they are better worshipers of God if they persecute such people and torture them with all kinds of torments. Paul provides us with an example of this because his zeal drove him to persecute the church. He took godly worshipers of both sexes to prison and forced them to deny their faith.</p></blockquote>

<blockquote><p>We receive frequent and mournful relations of that accursed practice of duels, yea and among persons of our religion; and though we believe this violent and brutish sin is so strongly rooted, as to elude and reject all remedies, yet because of its atrociousness and enormity, we desire your holy synod to consuls of the last and sovereign remedy, even that dreadful power which the word of God has given unto his Church to draw out the spiritual sword against such notorious delinquents, without connivency, dispensation, or respect of persons, that by its implacable severity against those daring rebels, the Lord blessing his own ordinance, their feet which ran swiftly to shed innocent blood may be hereafter stopped and restrained. At least, let us weep and groan before the Lord that this evil may never be imputed to us, that we may be delivered from the guilt of so much blood as has been wickedly spilt among us, that it may never lie at our doors, nor our consciences may ever reproach us for having lent our heart or hands unto that murdering spirit, and that we may never be marked with this brand of infamy which is peculiar to the enemies of God, to have been executioners of his vengeance upon themselves.</p></blockquote>

— French Reformed Churches, Synodicon in Gallia Reformata (John Quick, London, 1692), ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, p. 444">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+receive+frequent+and+mournful+relations+of+that+accursed+practice+of+duels%2C+yea+and+among+persons+of+our+religion%3B+and+though+we+believe+this+violent+and+brutish+sin+is+so+strongly+rooted%2C+as+to+elude+and+reject+all+remedies%2C+yet+because+of+its+atrociousness+and+enormity%2C+we+desire+your+holy+synod+to+consuls+of+the+last+and+sovereign+remedy%2C+even+that+dreadful+power+which+the+word+of+God+has+given+unto+his+Church+to+draw+out+the+spiritual+sword+against+such+notorious+delinquents%2C+without+connivency%2C+dispensation%2C+or+respect+of+persons%2C+that+by+its+implacable+severity+against+those+daring+rebels%2C+the+Lord+blessing+his+own+ordinance%2C+their+feet+which+ran+swiftly+to+shed+innocent+blood+may+be+hereafter+stopped+and+restrained.+At+least%2C+let+us+weep+and+groan+before+the+Lord+that+this+evil+may+never+be+imputed+to+us%2C+that+we+may+be+delivered+from+the+guilt+of+so+much+blood+as+has+been+wickedly+spilt+among+us%2C+that+it+may+never+lie+at+our+doors%2C+nor+our+consciences+may+ever+reproach+us+for+having+lent+our+heart+or+hands+unto+that+murdering+spirit%2C+and+that+we+may+never+be+marked+with+this+brand+of+infamy+which+is+peculiar+to+the+enemies+of+God%2C+to+have+been+executioners+of+his+vengeance+upon+themselves.%E2%80%9D%0A%0A%E2%80%94+French+Reformed+Churches%2C+Synodicon+in+Gallia+Reformata+%28John+Quick%2C+London%2C+1692%29%2C+ed.+John+Quick%2CSynodicon+in+Gallia+reformata%2C+or%2C+The+Acts%2C+Decisions%2C+Decrees+%26+Canons+of+those+Famo <blockquote><p>§1. Question 1: Must I always do as I would be done by? Or has this rule any exceptions? Answer: The rule intends no more but that your just self-denial and love to others be duly exercised in your dealings with all. And:

1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them.

2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (London, 1673), pt. 4, ch. 19, title 2, p. 114</span></figcaption>

<blockquote><p>…Calvin protested [to the French king] “in truth before God” that Geneva has “never attempted to send persons into your kingdom.” Explaining matters further, the letter declared: “that never with our knowledge and permission has someone gone from here to preach except one individual who was requested from us for the city of London… So then, the Genevan ministers say they encouraged some people to exercise their gifts everywhere. There is, however, the clear implication that was all they did. The explanation would appear to wish to persuade the king that what he has heard of as Geneva sending ministers into his kingdom is actually a simple case of free preachers and godly men wandering of their own free will into the king’s territory… The answers to both concerns are, according to Calvin and Beza’s own Augustinian understanding of lying, plainly speech contra mentem. They did send preachers into France and they were involved in dissensions of precisely the kind about which the king was asking.</p></blockquote>

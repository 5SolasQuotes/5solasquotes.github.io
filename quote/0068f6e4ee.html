</figure><figure class="quote" id="q-c02d3587ac" data-kw="">
<blockquote><p>But because he conceives the dissenting churches to be true churches also, their ministers generally men of real piety, good learning, and zealously active to save immortal souls… And… because he finds the discipline of the Established Church defective… on the other hand [he] finds the preaching of the dissenting ministers generally more close, methodical, and lively; their ministrations more pure, without those human mixtures… the power of practical religion is more visibly kept up among them… These, and other considerations of the like nature, determine him to hold stated communion with some dissenting congregation, where he thinks himself better edified than in the parochial assemblies. He judges himself obliged to get the best helps he can for his soul, and thinks he ought not to be more restrained in the choice of a spiritual guide for the benefit of his soul than he is in the choice of a lawyer or physician for the preserving of his estate and bodily health.</p></blockquote>

</figure><figure class="quote" id="q-05d0dc780f" data-kw="">
<blockquote><p>…union has the advantage over division, because:

1. It is a commanded mean tending to edification, which division is not.

2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it.

3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, p. 323</span></figcaption>

</figure><figure class="quote" id="q-6e67728399" data-kw="">
<blockquote><p>Our Lord Jesus is no approver nor countenancer of separation from a true Church for the faults of some members in it; neither do faults in some members, and defects in ministers and officers in executing discipline, pollute the ordinances in themselves, or to others who are free of that guilt; and so do not necessitate a separation from such a Church, or any ordinance thereof: For, this and the former epistle being compared together, these things are clear, that there were gross members in the Church, adulterers, Nicolaitans, seducers, etc. that they are continued in Church-communion, ‘thou hast them and sufferest them,’ clearly import this; for that angel no otherwise had them but as Church-members under his charge. 3. That this angel sinfully permitted them to continue Church-members, and therefore is reproved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

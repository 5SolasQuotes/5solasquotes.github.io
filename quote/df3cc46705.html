<blockquote><p>By the sanction of the law, we intend the promises and penalties wherewith by God the observation of it and obedience unto it was enforced. This the apostle hath respect unto in sundry places of this Epistle; the principal whereof are reported in the following dissertation. To represent this distinctly, we may observe that the law falls under a threefold consideration; — first, As it was a repetition and expression of the law of nature, and the covenant of works established thereon; secondly, As it had a new end and design put upon the administration of it, to direct the church unto the use and benefit of the promise given of old to Adam, and renewed unto Abraham four hundred and thirty years before; thirdly, As it was the instrument of the rule and government of the church and people of Israel with respect unto the covenant made with them in and about the land of Canaan. And in this threefold respect it had a threefold sanction: —

2. First, As considered absolutely, it was attended with promises of life and threatenings of death, both eternal. The original promise of life upon obedience and the curse on its transgression were inseparably annexed unto it, yea, were essential parts of it, as it contained the covenant between God and man. See Gen. ii. 17; Deut. xxvii. 26; Rom. vi.23, iv.4, x. 5, xi. 6; Lev. xviii. 5; Ezek. xx. 11; Gal. iii. 12, 13.

3. Now, in the administration of the law, the church was thus far brought under the obligation of these promises and threatenings of life and death eternal, so far interested in the one and made obnoxious unto the other, as that if they used not the law according to the new dispensation of it, wherein it was put into a subserviency unto the promise, as Gal. iii. 19—24, they were left to stand or fall according to the absolute tenor of that first covenant and its ratification; which, by reason of the entrance of sin, proved fatally ruinous unto all that cleaved unto it, Rom. viii. 3, 9:31.

4. Secondly, The law had, in this administration of it, a new end and design put upon it, and that in three things: — (1.) That it was made directive and instructive unto another end, and not merely perceptive, as at the beginning. The authoritative institutions that in it were superadded to the moral commands of the covenant of works, did all of them direct and teach the church to look for righteousness and salvation, the original ends of the first covenant, in another and by another way; as the apostle at large disputes in this Epistle, and declares positively, Gal. iii., throughout.

(2.) In that it had a dispensation added unto the commands of obedience, and interpretation, κατ επεικειαν, by condescension, given by God himself, as to the perfection of its observance and manner of its performance in reference unto this new end. It required not absolutely perfect obedience, but perfectness of heart, integrity, and uprightness, in them that obeyed. And unto the law thus considered the former promises and threatenings were annexed; for the neglect of this use of it left the transgressors obnoxious to the curse denounced in general against them that continued not in the whole law to do it. (3.) It had merciful relief provided against sin, for the supportment and consolation of sinners, as we shall see in the consideration of their sacrifices.

5. Thirdly, It may be considered as it was the instrument of the rule and government of the people and church of Israel, according to the tenor of the covenant made with them about the land of Canaan, and their living unto God therein. And in this respect it had four things in it:— (1.) That it represented unto the people the holiness of God, the effects whereof are implanted in the law according to its original constitution; whereupon in it they are often called to be holy, because the Lord and Lawgiver is holy. (2.) That it gave a representation of his grace and condescension, pardoning sin in the covenant of mercy, inasmuch as he allowed a compensation by sacrifices for so many transgressions, which in their own nature were forfeitures of their interest in that land. (3.) That it was a righteous rule of obedience unto that people as unto their especial covenant condition. (4.) That it fully represented the severity of God against willful transgressors of his covenant, as now renewed in order to the promise, seeing every such transgression was attended, in their administration of rule, with death without mercy.</p></blockquote>

<blockquote><p>As therefore I have showed in what sense the covenant of grace is called “the new covenant,” in this distinction and opposition, so I shall propose sundry things which relate unto the nature of the first covenant, which manifest it to have been a distinct covenant, and not a mere administration of the covenant of grace: — 1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends.</p></blockquote>

</figure><figure class="quote" id="q-0cddbc583b" data-kw="">
<blockquote><p>Howbeit, the preface to the ten commandments deserves a particular notice, in the matter, of the Sinai transaction, Exod. xx. 2, “I am the Lord thy God, which have brought thee out of the land of Egypt, out of the house of bondage.” Hence it is evident to me, that the covenant of grace was delivered to the Israelites on Mount Sinai. For the Son of God, the messenger of the covenant of grace, spoke these words to a select people, the natural seed of Abraham, typical of his whole spiritual seed. …

But that the covenant of works was also, for special ends, repeated and delivered to the Israelites on Mount Sinai, I cannot refuse, 1. Because of the apostle’s testimony, Gal. iv. 24, “These are the two covenants; the one from Mount Sinai, which gendereth to bondage.” For the children of this Sinai covenant the apostle here treats of, are excluded from the eternal inheritance, as Ishmael was from Canaan, the type of it, ver. 30, “Cast out the bond-woman and her son ; for the son of the bond-woman shall not be heir with the son of the free woman;” but this could never be said of the children of the covenant of grace under any dispensation, though both the law and covenant from Sinai itself, and its children, were even before the coming of Christ under a sentence of exclusion, to be execute on them respectively in due time.

2. The nature of the covenant of works is most expressly in the New Testament brought in, propounded, and explained, from the Mosaical dispensation. The commands of it from Exod. xx. by our blessed Saviour, Matth. xix. 17—19, “If thou wilt enter into life, keep the commandments. He saith unto him, Which? Jesus said, Thou shalt do no murder, thou shalt not commit adultery,” &amp;c. The promise of it, Rom. x. 5, “Moses describes the righteousness which is of the law, that the man which doth these things shall live by them.” The commands and promise of it together, see Luke x. 25—28. The terrible sanction of it, Gal. iii. 10, “For it is written, (viz. Deut. xxvii. 26,) Cursed is every one that continueth not in all things which are written in the book of the law to do them.”

3. To this may be added the opposition betwixt the law and grace so frequently inculcated in the New Testament, especially in Paul’s epistles. See one text for all, Gal. iii. 12, “And the law is not of faith, but the man that doeth them shall live in them.”

4. The law from Mount Sinai was a covenant, Gal. iv. 24, “These are the two covenants, the one from the Mount Sinai;” and such a covenant as had a semblance of disannuling the covenant of grace, Gal. iii. 17, “The covenant that was confirmed before of God in Christ, the law which was 430 years after, cannot disannul;” yea, such a one as did, in his own nature, bear a method of obtaining the inheritance, so far different from that of the promise, that it was inconsistent with it; “For if the inheritance be of the law, it is no more of promise,” Gal. iii. 18, wherefore the covenant of the law from Mount Sinai could not be the covenant of grace, unless one will make this last not only a covenant seeming to destroy itself, but really inconsistent; but it was the covenant of works, which indeed had such a semblance, and in its own nature did bear such a method as before noted; howbeit, as Ainsworth says, “The covenant of the law now given could not disannul the covenant of grace,” Gal. iii. 17. — Annot. on Exod. xix. I.</p></blockquote>

2. The nature of the covenant of works is most expressly in the New Testament brought in, propounded, and explained, from the Mosaical dispensation. The commands of it from Exod. xx. by our blessed Saviour, Matth. xix. 17—19, “If thou wilt enter into life, keep the commandments. He saith unto him, Which? Jesus said, Thou shalt do no murder, thou shalt not commit adultery,” &amp;c. The promise of it, Rom. x. 5, “Moses describes the righteousness which is of the law, that the man which doth these things shall live by them.” The commands and promise of it together, see Luke x. 25—28. The terrible sanction of it, Gal. iii. 10, “For it is written, (viz. Deut. xxvii. 26,) Cursed is every one that continueth not in all things which are written in the book of the law to do them.”

3. To this may be added the opposition betwixt the law and grace so frequently inculcated in the New Testament, especially in Paul’s epistles. See one text for all, Gal. iii. 12, “And the law is not of faith, but the man that doeth them shall live in them.”

4. The law from Mount Sinai was a covenant, Gal. iv. 24, “These are the two covenants, the one from the Mount Sinai;” and such a covenant as had a semblance of disannuling the covenant of grace, Gal. iii. 17, “The covenant that was confirmed before of God in Christ, the law which was 430 years after, cannot disannul;” yea, such a one as did, in his own nature, bear a method of obtaining the inheritance, so far different from that of the promise, that it was inconsistent with it; “For if the inheritance be of the law, it is no more of promise,” Gal. iii. 18, wherefore the covenant of the law from Mount Sinai could not be the covenant of grace, unless one will make this last not only a covenant seeming to destroy itself, but really inconsistent; but it was the covenant of works, which indeed had such a semblance, and in its own nature did bear such a method as before noted; howbeit, as Ainsworth says, “The covenant of the law now given could not disannul the covenant of grace,” Gal. iii. 17. — Annot. on Exod. xix. I.”

— Edward Fisher, The Marrow of Modern Divinity, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 196-97n. (The footnote is Boston’s.)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowbeit%2C+the+preface+to+the+ten+commandments+deserves+a+particular+notice%2C+in+the+matter%2C+of+the+Sinai+transaction%2C+Exod.+xx.+2%2C+%E2%80%9CI+am+the+Lord+thy+God%2C+which+have+brought+thee+out+of+the+land+of+Egypt%2C+out+of+the+house+of+bondage.%E2%80%9D+Hence+it+is+evident+to+me%2C+that+the+covenant+of+grace+was+delivered+to+the+Israelites+on+Mount+Sinai.+For+the+Son+of+God%2C+the+messenger+of+the+covenant+of+grace%2C+spoke+these+words+to+a+select+people%2C+the+natural+seed+of+Abraham%2C+typical+of+his+whole+spiritual+seed.+%E2%80%A6%0A%0ABut+that+the+covenant+of+works+was+also%2C+for+special+ends%2C+repeated+and+delivered+to+the+Israelites+on+Mount+Sinai%2C+I+cannot+refuse%2C+1.+Because+of+the+apostle%E2%80%99s+testimony%2C+Gal.+iv.+24%2C+%E2%80%9CThese+are+the+two+covenants%3B+the+one+from+Mount+Sinai%2C+which+gendereth+to+bondage.%E2%80%9D+For+the+children+of+this+Sinai+covenant+the+apostle+here+treats+of%2C+are+excluded+from+the+eternal+inheritance%2C+as+Ishmael+was+from+Canaan%2C+the+type+of+it%2C+ver.+30%2C+%E2%80%9CCast+out+the+bond-woman+and+her+son+%3B+for+the+son+of+the+bond-woman+shall+not+be+heir+with+the+son+of+the+free+woman%3B%E2%80%9D+but+this+could+never+be+said+of+the+children+of+the+covenant+of+grace+under+any+dispensation%2C+though+both+the+law+and+covenant+from+Sinai+itself%2C+and+its+children%2C+were+even+before+the+coming+of+Christ+under+a+sentence+of+exclusion%2C+to+be+execute+on+them+respectively+in+due+time.%0A%0A2.+The+nature+of+the+covenant+of+works+is+most+expressly+in+the+New+Testament+brought+in%2C+propounded%2C+and+explained%2C+from+the+Mosaical+dispensation.+The+commands+of+it+from+Exod.+xx.+by+our+blessed+Saviour%2C+Matth.+xix.+17%E2%80%9419%2C+%E2%80%9CIf+thou+wilt+enter+into+life%2C+keep+the+commandments.+He+saith+unto+him%2C+Which%3F+Jesus+said%2C+Thou+shalt+do+no+murder%2C+thou+shalt+not+commit+adultery%2C%E2%80%9D+%26c.+The+promise+of+it%2C+Rom.+x.+5%2C+%E2%80%9CMoses+describes+the+righteousness+which+is+of+the+law%2C+that+the+man+which+doth+these+things+shall+live+by+them.%E2%80%9D+The+commands+and+promise+of+it+together%2C+see+Luke+x.+25%E2%80%9428.+The+terrible+sanction+of+it%2C+Gal.+iii.+10%2C+%E2%80%9CFor+it+is+written%2C+%28viz.+Deut.+xxvii.+26%2C%29+Cursed+is+every+one+that+continueth+not+in+all+things+which+are+written+in+the+book+of+the+law+to+do+them.%E2%80%9D%0A%0A3.+To+this+may+be+added+the+opposition+betwixt+the+law+and+grace+so+frequently+inculcated+in+the+New+Testament%2C+especially+in+Paul%E2%80%99s+epistles.+See+one+text+for+all%2C+Gal.+iii.+12%2C+%E2%80%9CAnd+the+law+is+not+of+faith%2C+but+the+man+that+doeth+them+shall+live+in+them.%E2%80%9D%0A%0A4.+The+law+from+Mount+Sinai+was+a+covenant%2C+Gal.+iv.+24%2C+%E2%80%9CThese+are+the+two+covenants%2C+the+one+from+the+Mount+Sinai%3B%E2%80%9D+and+such+a+covenant+as+had+a+semblance+of+disannuling+the+covenant+of+grace%2C+Gal.+iii.+17%2C+%E2%80%9CThe+covenant+that+was+confirmed+before+of+God+in+Christ%2C+the+law+which+was+430+years+after%2C+cannot+disannul%3B%E2%80%9D+yea%2C+such+a+one+as+did%2C+in+his+own+nature%2C+bear+a+method+of+obtaining+the+inheritance%2C+so+far+different+from+that+of+the+promise%2C+that+it+was+inconsistent+with+it%3B+%E2%80%9CFor+if+the+inheritance+be+of+the+law%2C+it+is+no+more+of+promise%2C%E2%80%9D+Gal.+iii.+18%2C+wherefore+the+covenant+of+the+law+from+Mount+Sinai+could+not+be+the+covenant+of+grace%2C+unless+one+will+make+this+last+not+only+a+covenant+seeming+to+destroy+itself%2C+but+really+inconsistent%3B+but+it+was+the+covenant+of+works%2C+which+indeed+had+such+a+semblance%2C+and+in+its+own+nature+did+bear+such+a+method+as+before+noted%3B+howbeit%2C+as+Ainsworth+says%2C+%E2%80%9CThe+covenant+of+the+law+now+given+could+not+disannul+the+covenant+of+grace%2C%E2%80%9D+Gal.+iii.+17.+%E2%80%94+Annot.+on+Exod.+xix.+I.%E2%80%9D%0A%0A%E2%80%94+Edward+Fisher%2C+The+Marrow+of+Modern+Divinity%2C+%281646%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+vii%2C+196-97n.+%28The+footnote+is+Boston%E2%80%99s.%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0cddbc583b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0cddbc583b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/04/thomas-boston-on-republication-of-the-covenant-of-works-under-moses/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-3b3bd8ec8c" data-kw="">
<blockquote><p>These covenants differ, in relation to the Parties contracting the covenant of works, the Parties were God, and the first Adam, representing all his natural posterity; but in the covenant of grace, the Parties were God the Father, and Christ the second Adam, representing all his spiritual seed. The first covenant, was made with a mere man, a fallible creature: the second, was established with God-man, “the Lord from heaven, who enangeth not.” The former, depended on a righteous creature: the latter, on a righteous, an almighty Redeemer.

The one, was made with man in his best state, and yet he kept it not: the other, was made with God-man, our blessed Immanuel, who neither could nor would, fail in fulfilling it. In that, the triune God, is to be considered as the supreme Lawgiver, and the fountain of uncreated goodness, delighting in communicating happiness to an upright creature: in this, he is to be viewed as infinitely merciful and gracious, rejoicing to give, in a manner suited to the glory of all his perfections, eternal life to an elect sinner believing in Jesus.

According to the covenant of works, God could deal with man, and man with God, immediately; but according to the covenant of grace, he cannot deal with man, nor man with him, but through a Mediator. With the blessed Mediator it was, that he dealt primarily, and immediately; and with man, only in and through Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 536-37.</span></figcaption>

</figure><figure class="quote" id="q-2e02cb66de" data-kw="">
<blockquote><p>Others with my self hold that there is but two Covenants, the one a Covenant of Works, and the tree of life, was a Sacrament or sign and token of it, this was made with Adam before his fall and to all his posterity who come under it as soon as they take upon them his nature, for he did bear an Image for himself and all his posterity, so that if he had stood in his integrity he had conveyed his righteousness and holiness to all his posterity, and when he by sin defiled his nature, the whole race of mankind was polluted by him, and also he received a Covenant both for himself and all his posterity, and in case he had been faithful to it, all his posterity had stood with him, but he breaking that Covenant brought not only guilt upon himself but upon all his posterity with him, so that now there is none clean, no not one; how can he be clean that is born of a woman? Job 25:4. thus man’s nature is polluted.

And in regard of the Covenant, let every mouth be stopped, for all the world is become guilty before God, Rom. 3:29. for all have sinned and come short of the glory of God, Rom. 3:23. by one man sin entered into the world, and death by sin, and so death passed upon all men for that all have sinned, Rom. 5:12. so then all men by nature lie under the pollution and guilt of Adam’s sin, and liable to all the curses and penalties due unto them for breach of that Covenant.

But then there was a Covenant of grace which God the Father made with Jesus Christ from all eternity to save some of the posterity of Adam, and had not this Covenant been prepared ready against the fall of Adam to take place at the very moment of his fall, the Justice of God had immediately seized upon the whole Creation under Heaven, and consumed them to their first nothing, but then came Jesus Christ with the covenant in his hand saying, be gracious unto him, and deliver him from going down to the pit, I have found a ransom, Job 33:24. … the covenant of grace was made with Jesus Christ from all eternity, being a contract or plot of God the Father with God the Son from all eternity as mediator for the salvation of the Elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two solemn covenants made between God and man: viz. the covenant of works and the covenant of grace</cite>, (London: Thomas Banks, 1647), pp 1-2.</span></figcaption>

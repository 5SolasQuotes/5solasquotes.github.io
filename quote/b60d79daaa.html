<main class="wrap"><figure class="quote" id="q-b60d79daaa" data-kw="">
<blockquote><p>[T]he deleterious and fatal consequences of youthful smoking. On this point there is not a doubt or hesitation; all unite in picturing in the strongest colours the frightful effects of the poison on youths under age, — how it stunts the growth, checks the development of all the powers of mind and body, destroys manhood, and whether by its irritating effects on some, or its soporific effects on others, leaves the early smoker at twenty or five-and-twenty years of age emasculated, trembling, effeminate. …

Here then is a plateau on which we all take our stand in perfect harmony, and utter one long, loud, and deep note of warning to the boys and youth of our native land; imploring them as they value the vigour of their minds and bodies, as they would manfully combat in the battle of after life, resolutely to throw away their cigar or their knowing little pipe, as they would cast from them poison and death. Let them not for the sake of a momentary pleasure, or for a fashionable folly, sacrifice their happiness and comfort through life, and perhaps bring themselves to an untimely grave.

Let parents, teachers, masters of apprentices (many of whom have been hurried into acts of fraud and dishonesty to gratify the craving appetite for tobacco), and all who are in authority, use their power to put down this great national evil of boy-smoking. Let mothers, sisters, and wives use their influence to abate this ruinous practice, against which all who are in the least degree acquainted with the subject so loudly protest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-close.html">Francis Close</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tobacco: Its Influences, Physical, Moral, and Religious. A Lecture Delivered at the Athen</cite>, æum, Carlisle, on Thursday Evening, October 27th, 1859 (2nd edn, London: Hatchard, 1859), pp 22-23.</span></figcaption>

<blockquote><p>[I]f any party whatever, but especially if the State, or civil power, shall claim the right of controlling the government which Christ has appointed in the hands of Church office-bearers, they must refuse obedience to that claim, must make up their minds to suffer, if need be, the loss of all things, rather than yield to it. And this because they are only servants, ministers, stewards, entrusted by the alone Master and King with a certain authority and duty.

Were they princes — as Rome’s ecclesiastics claim to be — then might they be free to consider the question, at least, whether it were not expedient, in certain circumstances, to resign the government of the Church into other hands. But they are stewards only, mere administrators, and have no discretion in any such matter. They hear the voice of the Master, “The flock over which the Holy Ghost hath made you overseers” — “put away from among yourselves that wicked person” — “whatsoever ye shall bind on earth, shall be bound in heaven; and whatsoever ye shall loose on earth, shall be loosed in heaven.”

And the government which they have thus received, they must discharge on their responsibility to Christ alone. But especially, to yield it up into the hands of the State, were to yield it, as we have seen, into the hands of another king, another master, and so were nothing less than treason against the only King and Head of the Church.</p></blockquote>

<blockquote><p>Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].</p></blockquote>

<blockquote><p>4. He [Parker] makes a distinction betwixt the case of appellation and the case de nulla administratione mala praesumpta. Though the particular eldership has proceeded aright, though it consist of able and sufficient men, and though it be in re propria [in a proper thing], yet if one think himself wronged, and so appeal, then is it made obnoxious to a higher consistory, for says Parker, as the Council of Sardis ordains, audience must not be denied to him who entreats for it. So says Zepperus, speaking of the same purpose: ‘cuivis integrum quoque sit ad superiores gradus provocare, si in inferioris gradus sententia aut decreto aliquid desideret.’ (de Pol. Eccl., bk. 3, ch. 2)</p></blockquote>

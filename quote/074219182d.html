<main class="wrap"><figure class="quote" id="q-074219182d" data-kw="">
<blockquote><p>Seventhly, some may ask in what space did God make the world? I answer: God could have made the world and all things in it in one moment: but He began and finished the whole work in six distinct days. [This phrase is likely opposed to those in the early and Medieval Church who taught that the six days were but one day repeated six times.] In the first day He made the matter of all things and the light… and in the end of the sixth day He made man. Thus in six distinct spaces of time, the Lord did make all things: and that especially for three causes: I. To teach men that they ought to have a distinct and serious consideration of every creature: for if God had made the world in a moment, some might have said, this work is so mystical that no man can speak of it. But for the preventing of this cavil, it was his pleasure to make the world and all things therein in six days: and the seventh day He commanded it to be sanctified by men, that they might distinctly and seriously meditate upon every work of the creation. II. God made the world and every thing therein in six distinct days, to teach us what wonderful power and liberty He had over all his creatures: for He made the light when there was neither sun nor moon, nor stars: to show that in giving light to the world, He is not bound to the sun, to any creature or to any means: for the light was made the first day: but the sun, the moon and the stars were not created before the fourth day. Again, trees and plants were created the third day: but yet the sun, moon and the stars, and rain which nourish and make herbs, trees and plants to grow were not created till after the third day: which shows plainly that God can make trees, plants and herbs to grow without the means of rain, and without the virtue and operation of the sun, the moon and the stars. III. He made the world in six distinct days and framed all things in this order to teach us his wonderful providence of his creatures: for before man was created He provided for him a dwelling place and all things necessary for his perpetual preservation and perfect happiness and felicity. So also He created beasts and cattle: but not before He had made herbs, plants and grass, and all means whereby they are preserved. And if God had this care over man when as yet He was not: much more will God have care over him now when he is, and has a being in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (London, 1595), pp. 62-63</span></figcaption>

<blockquote><p>The time of their [the devils’] standing in their primitive state is conceived to be very short; for their creation (though the Socinians hold it was long before) must fall within the compass of six days, for in that space the Scripture tells us God made heaven and earth, and all things therein: and therefore within the space of six days He created the angels also. Some refer their creation to the first day’s work, others to the fourth day: and it’s probably thought that Adam’s continuance in innocency was not much above one day, and yet even then there were fallen Angels to tempt him: so that their glorious and blessed state could not, according to the computation, last above six or seven days, such a speedy issue did God make with them upon their very first sin…</p></blockquote>

<blockquote><p>…Though the general time which they fulfil may be known, or is known and set down by writers, yet the precise particular time, the day of the month, or hour of the day, or (which is the thing inquired) when their months come out and are fulfilled, that’s a secret. Though it be commonly known that a woman goes nine months with child… I may say in this case, as our Lord Jesus Christ said about the end of the world, ‘Of that day and hour knows no man,’ we may know the general time, we may know it will not be long before the world shall end. The time which the world shall go with its great birth is commonly said to be six thousand years; but the day and hour of its travel, and of the consummation of all things according to the decree of God, no man, no nor angel, knows.</p></blockquote>

<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.”

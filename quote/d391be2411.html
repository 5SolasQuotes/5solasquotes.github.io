<main class="wrap"><figure class="quote" id="q-d391be2411" data-kw="">
<blockquote><p>For 1. The Parliament hath nothing to do at all in Church matters, more to judge of them, or to punish heretics then if they had no souls. For M. Burton saith, p. 14. Confor. Deform. if it be true that Christ hath left such a power to any state then to a Popish state.

But I deny your consequence. Christ hath given to no state a power to inact wicked Laws, or to ratify wicked Popish constitutions, ergo, he hath not given to a Christian state a power cumulative to bring their glory to the N[ew]. Jerusalem, and to be Christian nurse-fathers to see the bride of Christ suck healthsome milk, it follows just as this doth. God hath not given Kings any power to butcher and destroy the sheep of Christ, ergo he hath not given to King’s power to rule and govern a Christian people in equity and justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brotherly and free epistle to the patrons and friends of pretended Liberty of Conscience in A survey of the spiritual antichrist</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-355b1f3f17" data-kw="">
<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-035047e7f3" data-kw="">
<blockquote><p>Though the children of Ammon did a high injury to David, yet no injury can be recompensed in justice with the pressure of the constrained subjection of loyalty to a violent lord. If David had not had an higher warrant from God than an injury done to his messengers, he could not have conquered them. But the Ammonites were the declared enemies of the church of God, and raised forces against David when they themselves were the injurers and offenders. And if David’s conquest will prove a lawful title by the sword to all conquerors, then may all conquerors lawfully do to the conquered people as David did; that is, they may ‘put them under saws, and under harrows of iron, and under axes of iron, and cause them pass through the brick-kilne.’ But, I beseech you, will royalists say, that conquerors, who make themselves kings by their sword, and so make themselves fathers, heads, defenders, and feeders of the people, may use the most extreme tyranny in the world, such as David used against the children of Ammon, which he could not have done by the naked title of sword-conquest, if God had not laid a commandment of an higher nature on him to serve God’s enemies so? I shall then say, if a conquering king be a lawful king, because a conqueror, then has God made such a lawful king both a father, because a king, and a tyrant, and cruel and lionhearted oppressor of those whom he has conquered; for God has given him royal power by this example (2 Sam. 12:30-31) to put these, to whom he is a father and defender by office, to torment, and also to be a torturer of them by office, by bringing their backs under such instruments of cruelty as ‘saws, and harrows of iron, and axes of iron.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

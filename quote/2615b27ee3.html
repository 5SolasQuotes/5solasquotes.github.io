</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7ba100245" data-kw="">
<blockquote><p>(4) Wilfully. Christ comes and stands; He stands and knocks. Why does He not enter? Why, you will not open. He stands, He is ready to take possession; why is He yet without? Why, you will not give it Him. If Christ did not stand, did not knock, you might pretend a better reason why ye do not open. But when He stands ready to enter, what can be alleged why he is not admitted, but because you will not open?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works</cite>, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100, p. 61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“(4) Wilfully. Christ comes and stands; He stands and knocks. Why does He not enter? Why, you will not open. He stands, He is ready to take possession; why is He yet without? Why, you will not give it Him. If Christ did not stand, did not knock, you might pretend a better reason why ye do not open. But when He stands ready to enter, what can be alleged why he is not admitted, but because you will not open?”

</figure><figure class="quote" id="q-19034cd159" data-kw="">
<blockquote><p>Christ spake by saint Paul and the rest of the apostles in their time (2 Cor. 13:3), and He speaks by us, which are His ambassadors at this day: therefore harden not your hearts against his preaching, lest He shut you out of his rest, but reverently embrace his preaching; let Christ enter into your hearts by his Word and Spirit, that ye may have rest and peace of conscience in this life; and be received up into his everlasting rest where ye shall never be molested any more, in the life to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Philemon and Hebrews</cite>, (London, R.B., 1635), on Heb. 3:11, p. 133</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christ spake by saint Paul and the rest of the apostles in their time (2 Cor. 13:3), and He speaks by us, which are His ambassadors at this day: therefore harden not your hearts against his preaching, lest He shut you out of his rest, but reverently embrace his preaching; let Christ enter into your hearts by his Word and Spirit, that ye may have rest and peace of conscience in this life; and be received up into his everlasting rest where ye shall never be molested any more, in the life to come.”

</figure><figure class="quote" id="q-300c8b4d54" data-kw="">
<blockquote><p>Behold, I have used all means for thy conversion: I have patiently expected it, and earnestly importuned it, and still I continue so doing; and if any man hear the voice of my Word, and open the door of his heart to Me, yielding to those my vehement solicitations, I will impart Myself to the soul of that man, and will have mutual fellowship with him, and he with Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain &amp; Familiar Explication</cite>, … (d. 1656; Oxford: Talboys, 1838), vol. 2, on Rev. 3:20, p. 553</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“Behold, I have used all means for thy conversion: I have patiently expected it, and earnestly importuned it, and still I continue so doing; and if any man hear the voice of my Word, and open the door of his heart to Me, yielding to those my vehement solicitations, I will impart Myself to the soul of that man, and will have mutual fellowship with him, and he with Me.”

— Joseph Hall, A Plain &amp; Familiar Explication: by way of Paraphrase, of All the Hard Texts of the Whole Divine Scriptures… (d. 1656; Oxford: Talboys, 1838), vol. 2, on Rev. 3:20, p. 553">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBehold%2C+I+have+used+all+means+for+thy+conversion%3A+I+have+patiently+expected+it%2C+and+earnestly+importuned+it%2C+and+still+I+continue+so+doing%3B+and+if+any+man+hear+the+voice+of+my+Word%2C+and+open+the+door+of+his+heart+to+Me%2C+yielding+to+those+my+vehement+solicitations%2C+I+will+impart+Myself+to+the+soul+of+that+man%2C+and+will+have+mutual+fellowship+with+him%2C+and+he+with+Me.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+A+Plain+%26+Familiar+Explication%3A+by+way+of+Paraphrase%2C+of+All+the+Hard+Texts+of+the+Whole+Divine+Scriptures%E2%80%A6+%28d.+1656%3B+Oxford%3A+Talboys%2C+1838%29%2C+vol.+2%2C+on+Rev.+3%3A20%2C+p.+553&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F300c8b4d54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/300c8b4d54.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Behold%2C%20I%20have%20used%20all%20means,with%20him%2C%20and%20he%20with%20Me&amp;text=Behold%2C%20I%20have%20used%20all%20means%20for%20thy&amp;text=mutual%20fellowship%20with%20him%2C%20and%20he%20with%20Me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-85e6a0f083" data-kw="">
<blockquote><p>…in the Revelation that Ecce venio [‘Behold, I come’] (Rev. 16:15) tells us the King of Glory is not far off. O then (as it is in the Psalm) ‘Lift up yourselves ye everlasting gates, that the King of Glory may enter in.’ (Ps. 24:7) The heart is the gate at which Christ must enter, ’tis the fort, the citadel which He would have yielded into his possession, ‘My son give me thy heart (Prov. 23:26); Let us therefore prepare our hearts for the entertainment of so great a guest, that so our souls may hold the same course hereafter which our prayers here do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-king.html">Henry King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Lord’s Prayer delivered in Certain Sermons</cite>, … (London: Haviland, 1628), ‘Thy Kingdom Come’, p. 129 King (1592-1669) was an Anglican bishop and poet.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<main class="wrap"><figure class="quote" id="q-8a33e2adc6" data-kw="">
<blockquote><p>THE first distribution of the acts of Christ’s righteousness is with respect to the laws which Christ obeyed in that righteousness which he performed. But here it must be observed in general, that all the precepts which Christ obeyed may be reduced to one law and that is that which the Apostle calls the law of works. Rom. iii.27. Every command that Christ obeyed may be reduced to that great and everlasting law of God that is contained in the covenant of works, that eternal rule of right which God had established between himself and mankind. Christ came into the world to fulfil and answer the covenant of works; that is, the covenant that is to stand forever as a rule of judgment, and that is the covenant that we had broken, and that was the covenant that must be fulfilled.

This law of works indeed includes all the laws of God which ever have been given to mankind; for it is a general rule of the law of works, and indeed of the law of nature, That God is to be obeyed, and that he must be submitted to in whatever positive precept he is pleased to give us. It is a rule of the law of works, that men should obey their earthly parents: and it is certainly as much a rule of the same law, That we should obey our heavenly Father: and so the law of works requires obedience to all positive commands of God. It required Adam’s obedience to that positive command, Not to eat of the forbidden fruit; and it required obedience of the Jews to all the positive commands of their institution. When God commanded Jonah to arise and go to Nineveh, the law of works required him to obey: and so it required Christ’s obedience to all the positive commands which God gave him.

But more particularly, the commands of God which Christ obeyed, were of three kinds; they were either such as he was subject to merely as man, or such as he was subject to as he was a Jew, or such as he was subject to purely as Mediator.

1. He obeyed those commands which he was subject to merely as man: and they were the commands of the moral law, which was the same with that which was given at Mount Sinai, written in two tables of stone, which are obligatory on mankind of all nations and all ages of the world.

2. He obeyed all those laws he was subject to as he was a Jew. Thus he was subject to the ceremonial law, and was conformed to it. He was conformed to it in his being circumcised the eighth day; and he strictly obeyed it in going up to Jerusalem to the temple three times a-year; at least after he was come to the ago of twelve years, which seems to have been the age when the males began to go up to the temple. And so Christ constantly attended the service of the temple, and of the synagogues.

To this head of his obedience to the law that he was subject to as a Jew, may be reduced his submission to John’s baptism. For it was a special command to the Jews, to go forth to John the Baptist, and be baptized of him; and therefore Christ being a Jew, was sub|ject to this command: and therefore, when he came to be baptized of John, and John objected, that he had more need to come to him to be baptized of him, he gives this reason for it, That it was need|ful that he should do it, that he might fulfil all righteousness. See Matth. iii.13.14.15.

3. Another law that Christ was subject to, was the mediatorial law, which contained those commands of God to which he was subject, not merely as man, nor yet as a Jew, but which related purely to his mediatorial office. Such were the commands which the Father gave him, to teach such doctrines, to preach the gospel, to work such miracles, to call such disciples, to appoint such ordinances, and finally to lay down his life: for he did all these things in obedience to commands he had received of the Father, as he often tells us. And these commands he was not subject to merely as man; for they did not belong to other men: nor yet was he subject to them as a Jew; for they were no part of the Mosaic law; but they were commands that he had received of the Father, that purely respected the work he was to do in the world in his mediatorial office.

It is to be observed, that Christ’s righteousness, by which he merited heaven for himself, and all who believe in him, consists principally in his obedience to this mediatorial law: for in fulfilling this law consisted his chief work and business in the world. The history of the evangelists is chiefly taken up in giving an account of his obedience to this law: and this part of his obedience was that which was attended with the greatest difficulty of all; and therefore his obedience in it was most meritorious.

What Christ had to do in the world by virtue of his being Mediator, was infinitely more difficult than what he had to do merely as a man, or as a Jew. To his obedience to this mediatorial law belongs his going through his last sufferings, beginning with his agony in the garden, and ending with his resurrection.

As the obedience of the first Adam, wherein his righteousness would have consisted, if he had stood, would have mainly consisted, not his in obedience to the moral law, to which he was subject merely as man, but in his obedience to that special law that he was subject to as moral head and surety of mankind, even the command of abstaining from the tree of knowledge of good and evil; so the obedience of the second Adam, wherein his righteousness consists, lies mainly, not in his obedience of the law that he was subject to merely as man, but to that special law which he was subject to in his office as Mediator and surety for man.</p></blockquote>

<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>

<blockquote><p>A Sacrament, is an outward sign, which God joineth to his covenant, which he hath made with men. And that is either of an eternal, or temporal covenant. A Sacrament of an eternal covenant, is a Sacrament, whereby God doth confirm the promise of eternal life. And that is either of the covenant of works, or of the covenant of grace.

The Sacrament of the covenant of works, is a Sacrament, which God gave our first parents in the state of their first integrity. And that was two fold, the tree of life, and the tree of the knowledge of good and evil. The tree of life was a Sacrament of the covenant of works, whereby that life was signified, which man should have lived, if he had stood in the obedience of God. Gene. 2.9.

The tree of the knowledge of good and evil, was a Sacrament by which was signified to man, in how good estate he was whilst he performed obedience to God his creator: and into how evil and miserable estate he should cast himself if he obeyed not God. Gen. 2.17. &amp; 3.7.8.9.10.11.</p></blockquote>

The tree of the knowledge of good and evil, was a Sacrament by which was signified to man, in how good estate he was whilst he performed obedience to God his creator: and into how evil and miserable estate he should cast himself if he obeyed not God. Gen. 2.17. &amp; 3.7.8.9.10.11.”

— Amandus Polanus, The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 116-17.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+Sacrament%2C+is+an+outward+sign%2C+which+God+joineth+to+his+covenant%2C+which+he+hath+made+with+men.+And+that+is+either+of+an+eternal%2C+or+temporal+covenant.+A+Sacrament+of+an+eternal+covenant%2C+is+a+Sacrament%2C+whereby+God+doth+confirm+the+promise+of+eternal+life.+And+that+is+either+of+the+covenant+of+works%2C+or+of+the+covenant+of+grace.%0A%0AThe+Sacrament+of+the+covenant+of+works%2C+is+a+Sacrament%2C+which+God+gave+our+first+parents+in+the+state+of+their+first+integrity.+And+that+was+two+fold%2C+the+tree+of+life%2C+and+the+tree+of+the+knowledge+of+good+and+evil.+The+tree+of+life+was+a+Sacrament+of+the+covenant+of+works%2C+whereby+that+life+was+signified%2C+which+man+should+have+lived%2C+if+he+had+stood+in+the+obedience+of+God.+Gene.+2.9.%0A%0AThe+tree+of+the+knowledge+of+good+and+evil%2C+was+a+Sacrament+by+which+was+signified+to+man%2C+in+how+good+estate+he+was+whilst+he+performed+obedience+to+God+his+creator%3A+and+into+how+evil+and+miserable+estate+he+should+cast+himself+if+he+obeyed+not+God.+Gen.+2.17.+%26+3.7.8.9.10.11.%E2%80%9D%0A%0A%E2%80%94+Amandus+Polanus%2C+The+substance+of+Christian+religion+soundly+set+forth+in+two+books%2C+by+definitions+and+partitions%2C+framed+according+to+the+rules+of+a+natural+method%2C+by+Amandus+Polanus+professor+of+divinity.+The+first+book+concerneth+faith.+The+second+concerneth+good+works.+The+principal+points+whereof+are+containe%2C+trans.+Elijahu+Wilcocks+%28London%3A+John+Oxenbridge%2C+1595%29%2C+pp+116-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F800614bdde.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/800614bdde.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/30/amandus-polanus-on-the-sacraments-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>

<blockquote><p>4 Thesis

For in the absolute Covenant [of grace], there is nothing in the creature that doth impel God either to promise, or to perform what he hath promised, or to perform what he hath promised; But in that Covenant [of works] to which a restipulation is annexed, God doth fulfil what he hath promised, because the creature hath rendered what is required; And although God hath made such a Covenant, wherein he hath promised so great things, upon condition of man’s performance, yet all this proceeds from the antecedent love of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), p. 355.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-971e984110" data-kw="">
<blockquote><p>Because God the Lord commands that we should hallow the day of the Sabbath, He intended to teach by doing so that one should rest [feyren] not only a few hours, but the whole day, and not act according to the common custom, in which one spends perhaps one or two hours hearing God’s Word but afterward wastes the rest of the time with idleness, useless chatter, going for walks, carousings, and similar things. Against this, God the Lord commands that we are to hallow the entire day of the Sabbath and pass the time with holy works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schola Pietas</cite>, (1736), 3.26, p. 655. Quoted in Johann Gerhard, Theological Commonplaces: On the Law of God, on the Ceremonial and Forensic Laws, trans. Richard J. Dinda, ed. Benjamin T. G. Mayes and Joshua J. Hayes (1613; St Louis MO: Concordia Publishing House, 2015), editor’s introduction, Kindle Locations 261-265.</span></figcaption>

<blockquote><p>Writing as editor of the Christian Miscellany, the Church of Scotland probationer (later Free Church minister), James Clarkston Fairbairn, recounted the spiritual experience of the late divinity student, James Halley (pictured):

Whilst, in the case of many a believer, his conversion forms a memorable passage in his history, to which he can look back with mingled feelings of joy and sorrow; of joy, when he contemplates the sovereign love of the Redeemer, who sent the Holy Spirit to arrest him in the road to destruction, and to conduct him to that which leads Sion-ward, and which is overhung with the gracious presence of Jehovah as with an atmosphere of exceeding glory, and strewed with the pledges of his favour as with lovely and fragrant flowers: with feelings no less of regret and bitterness, when he reflects on the small progress he has made on his journey, notwithstanding the comfort he has in it, and the delectable company of Jesus, who walks along with him;—whilst it is so with some children of light, with others it is different.

They have no distinct recollection of the day when they came to a right mind, and turned their backs upon the world. Many now in glory, and many upon earth, have it to record as their experience, in regard to this solemn matter, that the kingdom of heaven cometh not by observation. They are the heirs of the kingdom; they have entered within its golden gates; yet they cannot tell you, nor themselves, the precise hour or day when they first set foot there.

The experience of Halley was that of the class last mentioned. When, in the estimation of all who possessed his confidence, knew his heart, and were capable of judging as far as man can be so, he was not simply a convert, but far advanced in the walk of faith—and gave evidence of this by unabated diligence in the path of duty, an inflexible integrity, an insatiable desire after heavenly things, an interest so heart-felt, and an experience so mature in the ways of God towards his people, as to be of no small use in comforting the spiritual mourner, and confirming by counsel the hands of those who were even strong men—he not unfrequently suffered painful anxiety, and had deep heart-searchings, as to the question, whether he had yet accepted of Christ, and obtained an interest in the blood which cleanses from all sins.

But if the day on which the Strong One entered the house and took him captive, cannot be recorded, the growth of grace in his soul was rapid. All along the short pilgrimage appointed to him in this “far country,” are to be seen the foot-prints of one who was in haste,—who was ever impressed with the conviction that it will not do to stand still and tamper with the world. In illustrating this, we are much in the condition of one, who, having many arguments to his purpose, all of them equally cogent, but having to use brevity, hesitates which to select out of so well furnished a store.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-clarkston-fairbairn.html">John Clarkston Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Character of the Late James Halley, A.B., Student of Theology. By the Editor in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-43d87fcc7d" data-kw="">
<blockquote><p>I should be too tedious if I should stand to reckon up the manifold mercies that God hath bestowed on this our land, beyond all the world besides, our peace, and plenty, with the Gospel of Christ, our many, and great deliverances… God hath delivered us from the Spanish invasion, and the Gun-powder treason, and hath placed us in a wealthy land. ‘Be ye therefore filled with the Spirit’ (saith our prophet David) ‘speaking to yourselves in Psalms, and Hymns, and spiritual songs’: and here I might speak of the godly care of our Church, which hath ordained singing of Psalms, both before, and after sermon, and indeed are very fitting to be sung in order, for the better stirring up of our affections. And here I have a just cause to task them of the Separation, who will not admit of any set form of prayer, for that (as they say) is cursing of the Spirit; but why then should we have a set form of singing? For my part it shall ever have my allowance and I think that these their ex tempore prayers sounds as harshly in the ears of heaven, as diverse Psalms sung together in several tunes would in ours.</p></blockquote>

<blockquote><p>First of all I shall set forth the best contributions of the philosophers of the Greeks, because whatever there is of good has been given to men from above by God, since ‘every best gift and every perfect gift is from above, coming down from the Father of lights.’ If, however, there is anything that is contrary to the truth, then it is a dark invention of the deceit of Satan and a fiction of the mind of an evil spirit … In imitation of the method of the bee, I shall make my composition from those things which are conformable with the truth and from our enemies themselves gather the fruit of salvation. But all that is worthless and falsely labelled as knowledge I shall reject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-of-damascus.html">John of Damascus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fount of Knowledge</cite>, (c. 734), preface in The Fathers of the Church: A New Translation, 37: 5.</span></figcaption>

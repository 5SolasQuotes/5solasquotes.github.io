<main class="wrap"><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c0b3c83338" data-kw="">
<blockquote><p>8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that:

1. God’s power makes it possible for all things to be.

2. Next God knows them possible.

3. He knows what is convenient or fit to be made to his unsearchable ends.

4. He wills that they shall be, and man among the rest, and so on.</p></blockquote>

ne</a></div>

<blockquote><p>With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.</p></blockquote>

</figure><figure class="quote" id="q-fa789451f9" data-kw="">
<blockquote><p>As it is of the law of nature that, in general, a due proportion of time be set apart for the worship of God; so, in his Word, by a positive, moral, and perpetual commandment, binding all men in all ages, he hath particularly appointed one day in seven for a Sabbath, to be kept holy unto him:a which, from the beginning of the world to the resurrection of Christ, was the last day of the week; and, from the resurrection of Christ, was changed into the first day of the week,b which in Scripture is called the Lord’s day,c and is to be continued to the end of the world, as the Christian Sabbath.d a. Exod 20:8, 10-11; Isa 56:2, 4, 6-7. • b. Gen 2:2-3; Acts 20:7; 1 Cor 16:1-2. • c. Rev 1:10. • d. Exod 20:8, 10 with Mat 5:17-18.</p></blockquote>

</figure><figure class="quote" id="q-5ee817b3d4" data-kw="">
<blockquote><p>But, says, somebody, how are these people, who attribute to the sky the shape of a sphere or globe, not contradicted by what is written in our literature: ‘who stretched out the sky like a skin’ (Psalm 104:2)? Certainly let it be contradicted by that, if what they say is false; this after all, is true which has divine authority behind it, rather than that which is the guesswork of human weakness. But if it should happen that they can prove their case with evidence and arguments beyond any possibility of doubt, then it has to be demonstrated that what is said here among us about a skin is not contrary to those explanations of theirs. Otherwise, in any case (if you are going to be crassly literal-minded) it will also be contrary to another place in these very scriptures of ours where the sky is said to be like a suspended dome. What, I ask you, could be so different and opposed to each other as a skin stretched out flat, and the hollow curve of a dome? But if we are obliged, as indeed we are, to understand these two expressions in such a way that they are found to agree with each other and not to be in the least contradictory, then we are also and equally obliged to demonstrate that neither of them is opposed to those explanations, should they happen to be shown by rational arguments to be true, which inform us that the sky has the shape of a hollow globe all round us—provided, once again, it can be proved. And even if that comparison on our side with a dome is taken literally, it will make no difficulty for those who say the sky is a globe; it is reasonable to assume that Scripture wished to talk about the shape of the sky with reference to that part of it which is above us. So if the sky is not a globe, it is in one part—the part which covers the Earth—a dome, while if it is a globe, then it is a dome all round. But as for the text about a skin, that is rather more serious, because it may seem to be opposed, not to the globe, which may just be a human fabrication, but to our own dome. My treatment of this in terms of allegory may be found in the thirteenth book of my Confessions. So whether the sky being stretched out like a skin is to be understood allegorically in the way I suggested there, or in some other way, still to satisfy the tiresome people who persist in demanding a literal explanation I will say what in my opinion should be obvious to anyone of sense. Each term, no doubt, that is both ‘skin’ and ‘dome’ can be understood figuratively; but what we have to see is how each can be explained literally. Well, if is it not only curved but also a flat ceiling that can be called a dome, then assuredly a skin for its part can be stretched out round a curve as well as on a flat plane, After all, both wine containers and footballs are skins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Literal Meaning of Genesis’</cite>, pp. 202-203 in ed. Hill &amp; Rotelle, On Genesis: On Genesis: a Refuation of the Manichees, Unfinished Literal Commentary on Genesis, The Literal Meaning of Genesis in The Works of St. Augustine : a Translation for the 21st Century (NY: New City Press, 2002)</span></figcaption>

to the globe, which may just be a human fabrication, but to our own dome. My treatment of this in terms of allegory may be found in the thirteenth book of my Confessions. So whether the sky being stretched out like a skin is to be understood allegorically in the way I suggested there, or in some other way, still to satisfy the tiresome people who persist in demanding a literal explanation I will say what in my opinion should be obvious to anyone of sense. Each term, no doubt, that is both ‘skin’ and ‘dome’ can be understood figuratively; but what we have to see is how each can be explained literally. Well, if is it not only curved but also a flat ceiling that can be called a dome, then assuredly a skin for its part can be stretched out round a curve as well as on a flat plane, After all, both wine containers and footballs are skins.”

— Augustine of Hippo, ‘The Literal Meaning of Genesis’, pp. 202-203 in ed. Hill &amp; Rotelle, On Genesis: On Genesis: a Refuation of the Manichees, Unfinished Literal Commentary on Genesis, The Literal Meaning of Genesis in The Works of St. Augustine : a Translation for the 21st Century (NY: New City Press, 2002)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%2C+says%2C+somebody%2C+how+are+these+people%2C+who+attribute+to+the+sky+the+shape+of+a+sphere+or+globe%2C+not+contradicted+by+what+is+written+in+our+literature%3A+%E2%80%98who+stretched+out+the+sky+like+a+skin%E2%80%99+%28Psalm+104%3A2%29%3F+Certainly+let+it+be+contradicted+by+that%2C+if+what+they+say+is+false%3B+this+after+all%2C+is+true+which+has+divine+authority+behind+it%2C+rather+than+that+which+is+the+guesswork+of+human+weakness.+But+if+it+should+happen+that+they+can+prove+their+case+with+evidence+and+arguments+beyond+any+possibility+of+doubt%2C+then+it+has+to+be+demonstrated+that+what+is+said+here+among+us+about+a+skin+is+not+contrary+to+those+explanations+of+theirs.+Otherwise%2C+in+any+case+%28if+you+are+going+to+be+crassly+literal-minded%29+it+will+also+be+contrary+to+another+place+in+these+very+scriptures+of+ours+where+the+sky+is+said+to+be+like+a+suspended+dome.+What%2C+I+ask+you%2C+could+be+so+different+and+opposed+to+each+other+as+a+skin+stretched+out+flat%2C+and+the+hollow+curve+of+a+dome%3F+But+if+we+are+obliged%2C+as+indeed+we+are%2C+to+understand+these+two+expressions+in+such+a+way+that+they+are+found+to+agree+with+each+other+and+not+to+be+in+the+least+contradictory%2C+then+we+are+also+and+equally+obliged+to+demonstrate+that+neither+of+them+is+opposed+to+those+explanations%2C+should+they+happen+to+be+shown+by+rational+arguments+to+be+true%2C+which+inform+us+that+the+sky+has+the+shape+of+a+hollow+globe+all+round+us%E2%80%94provided%2C+once+again%2C+it+can+be+proved.+And+even+if+that+comparison+on+our+side+with+a+dome+is+taken+literally%2C+it+will+make+no+difficulty+for+those+who+say+the+sky+is+a+globe%3B+it+is+reasonable+to+assume+that+Scripture+wished+to+talk+about+the+shape+of+the+sky+with+reference+to+that+part+of+it+which+is+above+us.+So+if+the+sky+is+not+a+globe%2C+it+is+in+one+part%E2%80%94the+part+which+covers+the+Earth%E2%80%94a+dome%2C+while+if+it+is+a+globe%2C+then+it+is+a+dome+all+round.+But+as+for+the+text+about+a+skin%2C+that+is+rather+more+serious%2C+because+it+may+seem+to+be+opposed%2C+not+to+the+globe%2C+which+may+just+be+a+human+fabrication%2C+but+to+our+own+dome.+My+treatment+of+this+in+terms+of+allegory+may+be+found+in+the+thirteenth+book+of+my+Confessions.+So+whether+the+sky+being+stretched+out+like+a+skin+is+to+be+understood+allegorically+in+the+way+I+suggested+there%2C+or+in+some+other+way%2C+still+to+satisfy+the+tiresome+people+who+persist+in+demanding+a+literal+explanation+I+will+say+what+in+my+opinion+should+be+obvious+to+anyone+of+sense.+Each+term%2C+no+doubt%2C+that+is+both+%E2%80%98skin%E2%80%99+and+%E2%80%98dome%E2%80%99+can+be+understood+figuratively%3B+but+what+we+have+to+see+is+how+each+can+be+explained+literally.+Well%2C+if+is+it+not+only+curved+but+also+a+flat+ceiling+that+can+be+called+a+dome%2C+then+assuredly+a+skin+for+its+part+can+be+stretched+out+round+a+curve+as+well+as+on+a+flat+plane%2C+After+all%2C+both+wine+containers+and+footballs+are+skins.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+%E2%80%98The+Literal+Meaning+of+Genesis%E2%80%99%2C+pp.+202-203+in+ed.+Hill+%26+Rotelle%2C+On+Genesis%3A+On+Genesis%3A+a+Refuation+of+the+Manichees%2C+Unfinished+Literal+Commentary+on+Genesis%2C+The+Literal+Meaning+of+Genesis+in+The+Works+of+St.+Augustine+%3A+a+Translation+for+the+21st+Century+%28NY%3A+New+City+Press%2C+2002%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ee817b3d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ee817b3d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-a-flat-earth/#:~:t

<blockquote><p>As to such things as we would do, but cannot, God will accept the will for the deed, provided, we be as willing to do as to will the deed. Thus Abraham is said to have offered up his Son, because he was willing to do it. And this is the consolation the Apostle had, when to will was present with him, but to do he had no power; that with his mind he did serve the Law or the Will of God, Rom. 7.

The Saints cannot do the things that they would, because the flesh lusteth against the Spirit, Gal. 5.17. and in such a case Christ doth excuse his disciples with this, The spirit indeed, (mark that, the spirit indeed) is willing, but the flesh is weak, Matth. 26.41. and upon this account ’tis, that Christ tells his Father, John 17.6. that his disciples had kept his Word, though they failed very often, because their heart was to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-venning.html">Ralph Venning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The way to true happiness, or, the way to heaven opened. In a sermon before the Right Honourable the Lord Mayor and Aldermen of the City of London, Jan. 28. 1654/5</cite>, (London: John Rothwel, 1655), pp 20-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>49 Q. What reasons may be given of the Lord’s days beginning in the morning?

A. Other days then begin.

That they do so with us, is evident by the account of our hours. For midnight ended, we begin with one a clock: then the first hour of the day beginneth. And it appears to be so among the Jews: for when Aaron proclaimed (Exod. 32. 5, 6.) To morrow shall be a feast to the Lord, They rose up early on the morrow. I deny not but that sundry of the Jewish feasts began in the evening: as the Passover (Exod. 12.6.) But it cannot be proved that their weekly Sabbaths so began. There were special reasons for the beginning of those feasts in the evening, which did then begin. As for the supposed beginnings of the first days gathered out of this phrase, (the evening and the morning were the first day) they cannot be necessarily concluded to be at evening. For the evening and the morning there importeth the moment of the evening and morning parting one from another, and the return to the same period: which moment is rather at the beginning of the morning then of evening. The evening useth to be referred to the end of the day, and the morning to the beginning, as Exod. 29. 38, 39. I. Sam. 17. 16. and 30.12. Joh. 20.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>This gospel holiness respects Jesus Christ as its pattern. It proposeth no lower pattern for imitation, then to be conform to his image; he that is begotten again unto a lively hope, by the resurrection of Christ from the dead, girds up the loins of his mind (which are the affections of his soul, lest by falling flat upon the earth he be hindered in running the race set before him, as looking to the forerunner his pattern) in this girdle of hope, that he may be holy in all manner of conversation, keeping his eye upon the precept and pattern, that his practice may be conform[ed].

It is written, saith he, Be ye holy for I am holy, the hope of seeing God, and being ever with him imposeth a necessity upon him who hath it, to look no lower, then at him, who is glorious in holiness; and therefore he is said to purify himself, even as he is pure; and knowing that this is the end of their being quickened together with Christ, that they may walk even as he walked; they, in their working and walking, aim at no less then to be like him; and therefore never sit down upon any attained measure, as if they were already perfect: the spotless purity of God expressed in his laws, is that whereto they study assimilation; therefore they are still in motion towards this mark, and are changed from one degree of glorious grace into another, into the same image, even as by the Spirit of the Lord, who never gives over his putting them to cleanse from all filthiness of the flesh and of the Spirit, till that be true in the truest sense, thou art all fair, my love, there is no spot in thee.

And knowing that perfect fruition of him cannot be without perfect conformity to him, herein do they exercise themselves, to grow in grace, and to be still advancing towards some more likeness to his image, forgetting all their attainments, as things that are behind, and by their reachings forth unto that which is before, make it evident, that they make every begun degree of grace and conformity to God, a prevenient capacity for a new degree, which yet they have not attained.

I know, our moralists look upon themselves as matchless, in talking of following his steps, as he hath left us an example: in this they make a flourish with flaunting effrontery, but for all their boasting of wisdom, such a poor simple man as I, am made to wonder at their folly, who proposing, as they say, the purity of Christ for their pattern, are not even thence convinced, that in order to a conformity thereto, there is a simple &amp; absolute necessity of the mighty operations of that Spirit of God, whereby this end can be reached; but while they flout at the Spirit’s working, as a melancholy fancy, whereby the soul is garnished with the beauty of holiness, and made an habitation for God, I doubt not to say of these great sayers, that they understand neither what they say, nor whereof they affirm: nay doth not their talking of the one, not only without seeing the necessity of the other, but speaking against it, say in the heart of every one, (who hath not the heart of a beast) that they have never yet got a sight of the holiness of that pattern, nor of their own pollutions and impotency; for if they had, they would give themselves up to Jesus Christ to be washed by him, without which they can have no part with him.

O there will be a vast difference, at the latter day, betwixt them who have given their black souls to Jesus Christ to bleach, when he shall present them without spot, not only clothed with wrought gold, but all glorious within, and these who have never dipped, yea who have despised to dip their defiled souls in any other fountain, save in the impure puddle of their own performances: this will make them loathsome in his sight, and cause his soul abhor those, who have done this despite unto the Spirit of grace, as to slight that blessed fountain, opened for sin &amp; for uncleanness, let them pretend as high as they will, to look to him, as a pattern, while (because the plague sore is got up in their eye) they look not to him as a price, not to the grace of Jesus Christ, as that which can only principle any acceptable performance of duty, he will plunge them in the ditch, and it Will cost them their souls, for rejecting the counsel of God against themselves, in not making use of him who came by water, as well as by blood.</p></blockquote>

— Robert MacWard, Letter to John Brown of Wamphray, Christ, the way, and the truth, and the life. Or, A short discourse pointing forth the way of making use of Christ for justification and especially and more particularly for sanctification in all its parts, from Johan. XIV: vers. VI. Wherein several cases of conscie">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+gospel+holiness+respects+Jesus+Christ+as+its+pattern.+It+proposeth+no+lower+pattern+for+imitation%2C+then+to+be+conform+to+his+image%3B+he+that+is+begotten+again+unto+a+lively+hope%2C+by+the+resurrection+of+Christ+from+the+dead%2C+girds+up+the+loins+of+his+mind+%28which+are+the+affections+of+his+soul%2C+lest+by+falling+flat+upon+the+earth+he+be+hindered+in+running+the+race+set+before+him%2C+as+looking+to+the+forerunner+his+pattern%29+in+this+girdle+of+hope%2C+that+he+may+be+holy+in+all+manner+of+conversation%2C+keeping+his+eye+upon+the+precept+and+pattern%2C+that+his+practice+may+be+conform%5Bed%5D.%0A%0AIt+is+written%2C+saith+he%2C+Be+ye+holy+for+I+am+holy%2C+the+hope+of+seeing+God%2C+and+being+ever+with+him+imposeth+a+necessity+upon+him+who+hath+it%2C+to+look+no+lower%2C+then+at+him%2C+who+is+glorious+in+holiness%3B+and+therefore+he+is+said+to+purify+himself%2C+even+as+he+is+pure%3B+and+knowing+that+this+is+the+end+of+their+being+quickened+together+with+Christ%2C+that+they+may+walk+even+as+he+walked%3B+they%2C+in+their+working+and+walking%2C+aim+at+no+less+then+to+be+like+him%3B+and+therefore+never+sit+down+upon+any+attained+measure%2C+as+if+they+were+already+perfect%3A+the+spotless+purity+of+God+expressed+in+his+laws%2C+is+that+whereto+they+study+assimilation%3B+therefore+they+are+still+in+motion+towards+this+mark%2C+and+are+changed+from+one+degree+of+glorious+grace+into+another%2C+into+the+same+image%2C+even+as+by+the+Spirit+of+the+Lord%2C+who+never+gives+over+his+putting+them+to+cleanse+from+all+filthiness+of+the+flesh+and+of+the+Spirit%2C+till+that+be+true+in+the+truest+sense%2C+thou+art+all+fair%2C+my+love%2C+there+is+no+spot+in+thee.%0A%0AAnd+knowing+that+perfect+fruition+of+him+cannot+be+without+perfect+conformity+to+him%2C+herein+do+they+exercise+themselves%2C+to+grow+in+grace%2C+and+to+be+still+advancing+towards+some+more+likeness+to+his+image%2C+forgetting+all+their+attainments%2C+as+things+that+are+behind%2C+and+by+their+reachings+forth+unto+that+which+is+before%2C+make+it+evident%2C+that+they+make+every+begun+degree+of+grace+and+conformity+to+God%2C+a+prevenient+capacity+for+a+new+degree%2C+which+yet+they+have+not+attained.%0A%0AI+know%2C+our+moralists+look+upon+themselves+as+matchless%2C+in+talking+of+following+his+steps%2C+as+he+hath+left+us+an+example%3A+in+this+they+make+a+flourish+with+flaunting+effrontery%2C+but+for+all+their+boasting+of+wisdom%2C+such+a+poor+simple+man+as+I%2C+am+made+to+wonder+at+their+folly%2C+who+proposing%2C+as+they+say%2C+the+purity+of+Christ+for+their+pattern%2C+are+not+even+thence+convinced%2C+that+in+order+to+a+conformity+thereto%2C+there+is+a+simple+%26+absolute+necessity+of+the+mighty+operations+of+that+Spirit+of+God%2C+whereby+this+end+can+be+reached%3B+but+while+they+flout+at+the+Spirit%E2%80%99s+working%2C+as+a+melancholy+fancy%2C+whereby+the+soul+is+garnished+with+the+beauty+of+holiness%2C+and+made+an+habitation+for+God%2C+I+doubt+not+to+say+of+these+great+sayers%2C+that+they+understand+neither+what+they+say%2C+nor+whereof+they+affirm%3A+nay+doth+not+their+talking+of+the+one%2C+not+only+without+seeing+the+necessity+of+the+other%2C+but+speaking+against+it%2C+say+in+the+heart+of+every+one%2C+%28who+hath+not+the+heart+of+a+beast%29+that+they+have+never+yet+got+a+sight+of+the+holiness+of+that+pattern%2C+nor+of+their+own+pollutions+and+impotency%3B+for+if+they+had%2C+they+would+give+themselves+up+to+Jesus+Christ+to+be+washed+by+him%2C+without+which+they+can+have+no+part+with+him.%0A%0AO+there+will+be+a+vast+difference%2C+at+the+latter+day%2C+betwixt+them+who+have+given+their+black+souls+

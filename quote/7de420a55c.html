<blockquote><p>Hence also there is only one sense of one place of Scripture: because otherwise the sense of the Scripture should be not only not clear and certain, but none at all: for that which doth not signify one thing, signifieth certainly nothing.</p></blockquote>

</figure><figure class="quote" id="q-a067c1d621" data-kw="">
<blockquote><p>When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.</p></blockquote>

<blockquote><p>I answer, first, that we do not send any one who is in doubt on any matter to his private spirit, neglecting all means of finding truth, as the Jesuit falsely objects to us; but to scripture itself, and the Holy Spirit speaking publicly in the scripture, who, we say, ought to be heard, and by whose authority we maintain that all controversies should be decided: which also was the very thing done in this council.</p></blockquote>

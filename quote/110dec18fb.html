<blockquote><p>It’s all the reason in the world that a sinner be drawn to Christ. For Christ is the most rational object that is, He being the wisdom of God. And man is led and taken with reason. Christ is a convincing thing and invincibly binds reason: So the forlorne Son, before he return to his Father, argues… and the wise merchant must discourse, Mt. 13:45-46… So Mt. 9:21, the diseased woman has heart-logic within herself… and the unjust steward cast syllogisms thus… Yea, a fool’s paradise, a wedge of gold, is a strong reason, Prov. 7:21… Faith is the deepest and soundest understanding, the gold, the flower of reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London, 1647), p. 280</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc723ab2ff" data-kw="">
<blockquote><p>But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 30, on Lk. 7:47, p. 268</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>The next inward virtue of the mind is faith. This supposes a knowledge of the object or things to be believed, which being propounded sufficiently, as credible, our assent thereto is called faith, which rests upon divine authority, though it see not the proper reasons to enforce assent; for seeing we cannot by mere natural reason attain sufficient knowledge of supernatural truths, but that divine revelation is needful, therefore besides natural knowledge, faith is necessary, which receives them for this authority of the speaker. To explain this: There is in every proposition an affirmation or a denial:

1. Sometimes a man holds neither part, because he sees that equal reasons may be brought on both sides; and that is called doubting.

2. If we incline to one part, yet so as we fear the reasons of the other part may be true, then it is called opinion. As Agrippa was almost persuaded to be a Christian.

3. If we consent to one part, that is called knowledge, which goes beyond both the other, and arises from evidence and assurance of the truth. Knowledge is threefold:

1. By sense.

2. By discourse of reason.

3. By relation of other men: and this is properly faith.

1. Knowledge by sense is such as was that of Joseph’s brethren that had seen him before they sold him into Egypt, and therefore knew him.

2. Knowledge by discourse. Such as Jacob’s was, when he saw the chariots come out of Egypt, he conceived straightway that his son was alive.

3. That by relation of others, as Jacob knew that his son yet lived when his sons told him so.

1. For the first, when a thing cannot be present to the sense, then must we rely upon the third (relation [of others]). The Queen of Sheba did first hear of Solomon’s wisdom in her own land before she came and heard him herself.

2. For point of reason, there’s nothing absent from that but that which is supernatural and above our understanding; when a thing exceeds the capacity of mere natural reason without divine illumination, as we see in Nicodemus, a great Rabbi in Israel. For concerning mysteries in religion, the apostle says out of the prophet, ‘Eye has not seen, or ear heard, nor has it entered into the heart of man’: that is, they exceed both the capacity of the sense and reason; And therefore we must come to the third way, which is by faith: for as Job speaks, ‘God is great, and we know Him not, neither 〈◊〉 the number of his years be 〈◊〉’: therefore it must necessarily follow, Nisi credider it is non stabiliemini, as the prophet assures us, ‘If ye will not believe, ye shall not be established.’ And yet this restrains us not so far but that after we have believed, we may search after a reason that we may be able and ready (as the apostle bids us) always to give an answer to every man that asks a reason of the hope that is in us. For grace does not annihilate and make nature void; faith is above and not contrary to right reason; it is as a greater light to the less, yea, religio est summa ratio, it ‘is the quintessence of reason,’ or reason exalted or elevated. But we are to use reason as the handmaid to faith (for faith must bring the understanding of man into captivity to the obedience of Christ, as saint Paul says) and we must expect from the Holy Ghost the teaching of these things which our nature neither can nor is able to conceive. Now faith differs from science thus: In science there is first an enquiry after the reasons and causes, and then the assent follows. But in faith there is first the assent, and then the understanding of that to which we have assented Auditu 〈◊〉, by the hearing follows. ‘As soon as they hear of Me, they shall obey Me,’ says God. It is conceptus cum assensu [having been conceived with assent], because the object of our faith is not propounded with such evidence to the understanding as to constrain us to believe, but the will holds the understanding prisoner and keeps it captive. Thus faith becoms a free act, an act of obedience; whereas if things were propounded with that evidence that we could not distrust, there could be 〈◊〉 [no?] place for freedom of obedience in believing: God has so ordered it that matters of faith are propounded as summe credibilia, ‘highly credible,’ such that in prudence we may safely assent unto [them], yet not with that evidence which necessitates assent; for then there could be no trial of obedience in believing, nor any pretense left for reward to believers or punishment to unbelievers. See the Schoolmen generally and master [Richard] Hooker’s, [Sermon] of the Certainty of Faith, added to his Laws of Ecclesiastical Polity. ‘With the heart man believes,’ says the apostle: Belief being an act of the understanding, it should come first a mente [from the mind], but he says there we must corde 〈◊〉, for the will [or “heart”] has an especial act in it. Now the reason why it pleased God thus to order the matter in production of faith is because, if reason of itself could have attained to the things pertaining to God, little or no glory at all had come to God by it. Again, seeing matters of faith cannot be attained by reason, this shows the vanity of the wisdom of the flesh, and we may see how God does confound and abase it. For in religion, the ground is contrary to that in philosophy; 〈 Greek 〉, not to believe is the way of philosophy, and 〈 Greek〉, to believe, of divinity, at which Lucian scoffed. For the warrant of believing or assenting before we know, something has been said before: we will add a little more in this place: Saint Cyril in his fifth 〈◊〉, Cyprian, Chrysostom and others of the ancient fathers prove against philosophers that Quic quid sit, fide sit, ‘Whatsoever is done, is done by faith.’ This appears in all civil affairs wherein men go upon a civil faith, without certain knowledge of the things, and therefore much more in matters of religion, which are supernatural, may we live by faith. Thus we see the husbandman, who though he sees the weather unkindly etc., yet fits himself to till and sow his ground and bestows his cost, though he have no demonstrative knowledge whether he shall reap any profit or no. And so the merchants, though their goods and ships are subject to storms, pirates, etc. yet they run the hazard and adventure upon this civil faith. So in marriage, though some may be barren, yet they marry in hope to have children; and so in warfare though the victory be uncertain, yet the soldier goes on to battle, etc. The Schoolmen after the fathers go a subtler way to work and hold, that 〈◊◊〉, fide scitur, that we believe even those things we know: for by our senses and understanding we know many things, and herein they are our witnesses which we believe, yet all confess that these witnesses are very doubtfull in many things. For the eye, which is the most certain and chief of all the outward senses, because it apprehends more differences and apprehends its object after a more special and spiritual manner: yet they which are skillful in the optics reckon up twenty ways how it may be deceived and what great imperfections are in it. And for our reason or understanding, we see how uncertain it is in our younger years, and how we correct former errors as we grow in years: When we are children, we speak as children, reason as children and conceive as they do, but when we are men we put away childish things. Ploughmen cannot reason of the formal causes of things because they cannot see them; but tell them of labor: that they can conceive; and so in respect of a more sublime understanding they come far short. And therefore we also may be deceived in things that are above us, and therefore the third way of knowledge that is by relation, is necessary. The certainty of faith is grounded upon the condition and quality of the relaters, and has only two exceptions:

1. Either against the authors, that they want [lack] skill and are ignorant of the things they relate.

2. Or else that they are such upon whose fidelity we cannot rely. Now in either of these cases if the party relating want skill and cannot relate the truth, or is not honest, and will not [be], his testimony is not to be taken. So then there is no more certain way than this, that whereas the knowledge of faith and grounds of religion are to be built upon such witnesses as want neither skill nor fidelity, but for their skill can, and for their faithfulness will, deliver the truth, we are to embrace what they deliver as certain truths. The apostle says not, ‘I believe whom I know,’ but scio cuicredo, ‘I know whom I believe.’ We know that whom we believe is Amen, just and true, that cannot lie a faithful witness; it is a thing impossible for Him so to do. And for the manner of giving his testimony, the terms in Scripture are:

1. Dictum Jehovah, and Dixit 〈◊〉, ‘the word of the Lord,’ and ‘Thus says the Lord.’

2. And because man’s stipulation and promise is more certain than his bare affirmation, therefore God has made promises to us, and his promises are precious, as the apostle says.

3. And for our greater comfort and assurance has confirmed his promise with an oath.

4. Again, because if we have a man’s handwriting, we give greater credit to that than to an oath, we have his own handwriting, written with his own finger.

5. And for confirmation of that He has put to his seal.

6. And lastly (beyond which no man goes, nor any man desires more to strengthen a promise), He has given an earnest penny, a true God’s penny as we call it. Now that which may be objected against this is:

1. That the immediate voice of God is not now amongst us and that which we hear is from Moses, Isaiah, saint Matthew, saint Paul, etc. Yet this we must know, that though we heare it from them, being but men, yet did they not speak of themselves, not of their own brains, but as they were inspired by the Holy Ghost. And this saint Peter tells us: ‘The prophecy’ (says he) ‘came not in old time by the will of man: but holy men of God spake as they were moved by the Holy Ghost.’ For a prince usually speaks not to the people immediately from his own mouth, but by edicts and proclamations published by others in his name. And as the scepter or mace which is delivered to them that publish those edicts is a sign and token that they come from and for the prince, so the scepter of God’s extraordinary power was committed to his prophets, apostles, etc. The Jews required no more than a sign of our Savior, which with them was the scepter. And our Savior desired no more of them then that if they would not believe Him for his words, yet they should for his works. And that if He had not done among them the works which no other man did (those were his miracles), they might have been excused for their unbelief. Upon which saint Augustine says that either we must grant that they were done, or else that without miracles all the world was converted and became Christians, which is a greater miracle than all the rest which He did; and so we must grant miracles whether we will or no. And this is our warrant that these men, the prophets and apostles came from God, and that God has spoken to us by them.

2. The next query is whether He is able to perform those things which He has promised by them. To that we say with the angel that ‘with God nothing shall be unpossible.’ The prophet says, ‘His hands are not shortened, it is able to reach all things.’ When Moses mistrusted God’s providence to feed 600,000 men, saying, ‘Shall all the flocks and the herds be slain, or all the fish of the sea be gathered together to suffice them?’ God answered, ‘Is the Lord’s hand waxed short? Thou shalt see whether my word shall come to pass or not.’

3. Lastly, for his will, take a place of a father for all: Scio posse, scio scire, cupere velle, for, ‘The Lord is good to them that trust in Him, to the soul that seeks Him.&#x27;</p></blockquote>

1. Either against the authors, that they want [lack] skill and are ignorant of the things they relate.

2. Or else that they are such upon whose fidelity we cannot rely. Now in either of these cases if the party relating want skill and cannot relate the truth, or is not honest, and will not [be], his testimony is not to be taken. So then there is no more certain way than this, that whereas the knowledge of faith and grounds of religion are to be built upon such witnesses as want neither skill nor fidelity, but for their skill can, and for their faithfulness will, deliver the truth, we are to embrace what they deliver as certain truths. The apostle says not, ‘I believe whom I know,’ but scio cuicredo, ‘I know whom I believe.’ We know that whom we believe is Amen, just and true, that cannot lie a faithful witness; it is a thing impossible for Him so to do. And for the manner of giving his testimony, the terms in Scripture are:

1. Dictum Jehovah, and Dixit 〈◊〉, ‘the word of the Lord,’ and ‘Thus says the Lord.’

2. And because man’s stipulation and promise is more certain than his bare affirmation, therefore God has made promises to us, and his promises are precious, as the apostle says.

3. And for our greater comfort and assurance has confirmed his promise with an oath.

4. Again, because if we have a man’s handwriting, we give greater credit to that than to an oath, we have his own handwriting, written with his own finger.

5. And for confirmation of that He has put to his seal.

6. And lastly (beyond which no man goes, nor any man desires more to strengthen a promise), He has given an earnest penny, a true God’s penny as we call it. Now that which may be objected against this is:

1. That the immediate voice of God is not now amongst us and that which we hear is from Moses, Isaiah, saint Matthew, saint Paul, etc. Yet this we must know, that though we heare it from them, being but men, yet did they not speak of themselves, not of their own brains, but as they were inspired by the Holy Ghost. And this saint Peter tells us: ‘The prophecy’ (says he) ‘came not in old time by the will of man: but holy men of God spake as they were moved by the Holy Ghost.’ For a prince usually speaks not to the people immediately from his own mouth, but by edicts and proclamations published by others in his name. And as the scepter or mace which is delivered to them that publish those edicts is a sign and token that they come from and for the prince, so the scepter of God’s extraordinary power was committed to his prophets, apostles, etc. The Jews required no more than a sign of our Savior, which with them was the scepter. And our Savior desired no more of them then that if they would not believe Him for his words, yet they should for his works. And that if He had not done among them the works which no other man did (those were his miracles), they might have been excused for their unbelief. Upon which saint Augustine says that either we must grant that they were done, or else that without miracles all the world was converted and became Christians, which is a greater miracle than all the rest which He did; and so we must grant miracles whether we will or no. And this is our warrant that these men, the prophets and apostles came from God, and that God has spoken to us by them.

2. The next query is whether He is able to perform those things which He has promised by them. To that we say with the angel that ‘with God nothing shall be unpossible.’ The prophet says, ‘His hands are not shortened, it is able to reach all things.’ When Moses mistrusted God’s providence to feed 600,000 men, saying, ‘Shall all the flocks and the herds be slain, or all the fish of the sea be gathered together to suffice them?’ God answered, ‘Is the Lord’s hand waxed short? Thou shalt see whether my word shall come to pass or not.’

3. Lastly, for his will, take a place of a father for all: Scio posse, scio scire, cupere velle, for, ‘The Lord is good to them that trust in Him, to the soul that seeks Him.&#x27;”

— Lancelot Andrewes, A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments, (d. 1626; 1675), 1st Command, ch. 7, pp. 110-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+next+inward+virtue+of+the+mind+is+faith.+This+supposes+a+knowledge+of+the+object+or+things+to+be+believed%2C+which+being+propounded+sufficiently%2C+as+credible%2C+our+assent+thereto+is+called+faith%2C+which+rests+upon+divine+authority%2C+though+it+see+not+the+proper+reasons+to+enforce+assent%3B+for+seeing+we+cannot+by+mere+natural+reason+attain+sufficient+knowledge+of+supernatural+truths%2C+but+that+divine+revelation+is+needful%2C+therefore+besides+natural+knowledge%2C+faith+is+necessary%2C+which+receives+them+for+this+authority+of+the+speaker.+To+explain+this%3A+There+is+in+every+proposition+an+affirmation+or+a+denial%3A+1.+Sometimes+a+man+holds+neither+part%2C+because+he+sees+that+equal+reasons+may+be+brought+on+both+sides%3B+and+that+is+called+doubting.+2.+If+we+incline+to+one+part%2C+yet+so+as+we+fear+the+reasons+of+the+other+part+may+be+true%2C+then+it+is+called+opinion.+As+Agrippa+was+almost+persuaded+to+be+a+Christian.+3.+If+we+consent+to+one+part%2C+that+is+called+knowledge%2C+which+goes+beyond+both+the+other%2C+and+arises+from+evidence+and+assurance+of+the+truth.+Knowledge+is+threefold%3A+1.+By+sense.+2.+By+discourse+of+reason.+3.+By+relation+of+other+men%3A+and+this+is+properly+faith.+1.+Knowledge+by+sense+is+such+as+was+that+of+Joseph%E2%80%99s+brethren+that+had+seen+him+before+they+sold+him+into+Egypt%2C+and+therefore+knew+him.+2.+Knowledge+by+discourse.+Such+as+Jacob%E2%80%99s+was%2C+when+he+saw+the+chariots+come+out+of+Egypt%2C+he+conceived+straightway+that+his+son+was+alive.+3.+That+by+relation+of+others%2C+as+Jacob+knew+that+his+son+yet+lived+when+his+sons+told+him+so.+1.+For+the+first%2C+when+a+thing+cannot+be+present+to+the+sense%2C+then+must+we+rely+upon+the+third+%28relation+%5Bof+others%5D%29.+The+Queen+of+Sheba+did+first+hear+of+Solomon%E2%80%99s+wisdom+in+her+own+land+before+she+came+and+heard+him+herself.+2.+For+point+of+reason%2C+there%E2%80%99s+nothing+absent+from+that+but+that+which+is+supernatural+and+above+our+understanding%3B+when+a+thing+exceeds+the+capacity+of+mere+natural+reason+without+divine+illumination%2C+as+we+see+in+Nicodemus%2C+a+great+Rabbi+in+Israel.+For+concerning+mysteries+in+religion%2C+the+apostle+says+out+of+the+prophet%2C+%E2%80%98Eye+has+not+seen%2C+or+ear+heard%2C+nor+has+it+entered+into+the+heart+of+man%E2%80%99%3A+that+is%2C+they+exceed+both+the+capacity+of+the+sense+and+reason%3B+And+therefore+we+must+come+to+the+third+way%2C+which+is+by+faith%3A+for+as+Job+speaks%2C+%E2%80%98God+is+great%2C+and+we+know+Him+not%2C+neither+%E3%80%88%E2%97%8A%E3%80%89+the+number+of+his+years+be+%E3%80%88%E2%97%8A%E3%80%89%E2%80%99%3A+therefore+it+must+necessarily+follow%2C+Nisi+credider+it+is+non+stabiliemini%2C+as+the+prophet+assures+us%2C+%E2%80%98If+ye+will+not+believe%2C+ye+shall+not+be+established.%E2%80%99+And+yet+this+restrains+us+not+so+far+but+that+after+we+have+believed%2C+we+may+search+after+a+reason+that+we+may+be+able+and+ready+%28as+the+apostle+bids+us%29+always+to+give+an+answer+to+every+man+that+asks+a+reason+of+the+hope+that+is+in+us.+For+grace+does+not+annihilate+and+make+nature+void%3B+faith+is+above+and+not+contrary+to+right+reason%3B+it+is+as+a+greater+light+to+the+less%2C+yea%2C+religio+est+summa+ratio%2C+it+%E2%80%98is+the+quintessence+of+reason%2C%E2%80%99+or+reason+exalted+or+elevated.+But+we+are+to+use+reason+as+the+handmaid+to+faith+%28for+faith+must+bring+the+understanding+of+man+into+captivity+to+the+obedience+of+Christ%2C+as+saint+Paul+says%29+and+we+must+expect+from+the+Holy+Ghost+the+teaching+of+these+things+which+our+nature+neither+can+nor+is+able+to+conceive.+Now+faith+differs+from+science+thus%3A+In+science+there+is+first+an+enquiry+after+the+reasons+and+causes%2C+and+then+the+assent+follows.+But+in+faith+there+is+first+the+assent%2C+and+then+the+understanding+of+that+to+which+we+have+assented+Auditu+%E3%80%88%E2%97%8A%E3%80%89%2C+by+the+hearing+follows.+%E2%80%98As+soon+as+they+hear+of+Me%2C+they+shall+obey+Me%2C%E2%80%99+says+God.+It+is+conceptus+cum+assensu+%5Bhaving+been+conceived+with+assent%5D%2C+because+the+object+of+our+faith+is+not+propounded+with+such+evidence+to+the+understanding+as+to+constrain+us+to+believe%2C+but+the+will+holds+the+understanding+prisoner+and+keeps+it+captive.+Thus+faith+becoms+a+free+act%2C+an+act+of+obedience%3B+whereas+if+things+were+propounded+with+that+evidence+that+we+could+not+distrust%2C+there+could+be+%E3%80%88%E2%97%8A%E3%80%89+%5Bno%3F%5D+place+for+freedom+of+obedience+in+believing%3A+God+has+so+ordered+it+that+matters+of+faith+are+propounded+as+summe+credibilia%2C+%E2%80%98highly+credible%2C%E2%80%99+such+that+in+prudence+we+may+safely+assent+unto+%5Bthem%5D%2C+yet+not+with+that+evidence+which+necessitates+assent%3B+for+then+there+could+be+no+trial+of+obedience+in+believing%2C+nor+any+pretense+left+for+reward+to+believers+or+punishment+to+unbelievers.+See+the+Schoolmen+generally+and+master+%5BRichard%5D+Hooker%E2%80%99s%2C+%5BSermon%5D+of+the+Certainty+of+Faith%2C+added+to+his+Laws+of+Ecclesiastical+Polity.+%E2%80%98With+the+heart+man+believes%2C%E2%80%99+says+the+apostle%3A+Belief+being+an+act+of+the+understanding%2C+it+should+come+first+a+mente+%5Bfrom+the+mind%5D%2C+but+he+says+there+we+must+corde+%E3%80%88%E2%97%8A%E3%80%89%2C+for+the+will+%5Bor+%E2%80%9Cheart%E2%80%9D%5D+has+an+especial+act+in+it.+Now+the+reason+why+it+pleased+God+thus+to+order+the+matter+in+production+of+faith+is+because%2C+if+reason+of+itself+could+have+attained+to+the+things+pertaining+to+God%2C+little+or+no+glory+at+all+had+come+to+God+by+it.+Again%2C+seeing+matters+of+faith+cannot+be+attained+by+reason%2C+this+shows+the+vanity+of+the+wisdom+of+the+flesh%2C+and+we+may+see+how+God+does+confound+and+abase+it.+For+in+religion%2C+the+ground+is+contrary+to+that+in+philosophy%3B+%E3%80%88+Greek+%E3%80%89%2C+not+to+believe+is+the+way+of+philosophy%2C+and+%E3%80%88+Greek%E3%80%89%2C+to+believe%2C+of+divinity%2C+at+which+Lucian+scoffed.+For+the+warrant+of+believing+or+assenting+before+we+know%2C+something+has+been+said+before%3A+we+will+add+a+little+more+in+this+place%3A+Saint+Cyril+in+his+fifth+%E3%80%88%E2%97%8A%E3%80%89%2C+Cyprian%2C+Chrysostom+and+others+of+the+ancient+fathers+prove+against+philosophers+that+Quic+quid+sit%2C+fide+sit%2C+%E2%80%98Whatsoever+is+done%2C+is+done+by+faith.%E2%80%99+This+appears+in+all+civil+affairs+wherein+men+go+upon+a+civil+faith%2C+without+certain+knowledge+of+the+things%2C+and+therefore+much+more+in+matters+of+religion%2C+which+are+supernatural%2C+may+we+live+by+faith.+Thus+we+see+the+husbandman%2C+who+though+he+sees+the+weather+unkindly+etc.%2C+yet+fits+himself+to+till+and+sow+his+ground+and+bestows+his+cost%2C+though+he+have+no+demonstrative+knowledge+whether+he+shall+reap+any+profit+or+no.+And+so+the+merchants%2C+though+their+goods+and+ships+are+subject+to+storms%2C+pirates%2C+etc.+yet+they+run+the+hazard+and+adventure+upon+this+civil+faith.+So+in+marriage%2C+though+some+may+be+barren%2C+yet+they+marry+in+hope+to+have+children%3B+and+so+in+warfare+though+the+victory+be+uncertain%2C+yet+the+soldier+goes+on+to+battle%2C+etc.+The+Schoolmen+after+the+fathers+go+a+subtler+way+to+work+and+hold%2C+that+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+fide+scitur%2C+that+we+believe+even+those+things+we+know%3A+for+by+our+senses+and+understanding+we+know+many+things%2C+and+herein+they+are+our+witnesses+which+we+believe%2C+yet+all+confess+that+these+witnesses+are+very+doubtfull+in+many+things.+For+the+eye%2C+which+is+the+most+certain+and+chief+of+all+the+outward+senses%2C+because+it+apprehends+more+differences+and+apprehends+its+object+after+a+more+special+and+spiritual+manner%3A+yet+they+which+are+skillful+in+the+optics+reckon+up+twenty+ways+how+it+may+be+deceived+and+what+great+imperfections+are+in+it.+And+for+our+reason+or+understanding%2C+we+see+how+uncertain+it+is+in+our+younger+years%2C+and+how+we+correct+former+errors+as+we+grow+in+years%3A+When+we+are+children%2C+we+speak+as+children%2C+reason+as+children+and+conceive+as+they+do%2C+but+when+we+are+men+we+put+away+childish+things.+Ploughmen+cannot+reason+of+the+formal+causes+of+things+because+they+cannot+see+them%3B+but+tell+them+of+labor%3A+that+they+can+conceive%3B+and+so+in+respect+of+a+more+sublime+understanding+they+come+far+short.+And+therefore+we+also+may+be+deceived+in+things+that+are+above+us%2C+and+therefore+the+third+way+of+knowledge+that+is+by+relation%2C+is+necessary.+The+certainty+of+faith+is+grounded+upon+the+condition+and+quality+of+the+relaters%2C+and+has+only+two+exceptions%3A+1.+Either+against+the+authors%2C+that+they+want+%5Black%5D+skill+and+are+ignorant+of+the+things+they+relate.+2.+Or+else+that+they+are+such+upon+whose+fidelity+we+cannot+rely.+Now+in+either+of+these+cases+if+the+party+relating+want+skill+and+cannot+relate+the+truth%2C+or+is+not+honest%2C+and+will+not+%5Bbe%5D%2C+his+testimony+is+not+to+be+taken.+So+then+there+is+no+more+certain+way+than+this%2C+that+whereas+the+knowledge+of+faith+and+grounds+of+religion+are+to+be+built+upon+such+witnesses+as+want+neither+skill+nor+fidelity%2C+but+for+their+skill+can%2C+and+for+their+faithfulness+will%2C+deliver+the+truth%2C+we+are+to+embrace+what+they+deliver+as+certain+truths.+The+apostle+says+not%2C+%E2%80%98I+believe+whom+I+know%2C%E2%80%99+but+scio+cuicredo%2C+%E2%80%98I+know+whom+I+believe.%E2%80%99+We+know+that+whom+we+believe+is+Amen%2C+just+and+true%2C+that+cannot+lie+a+faithful+witness%3B+it+is+a+thing+impossible+for+Him+so+to+do.+And+for+the+manner+of+giving+his+testimony%2C+the+terms+in+Scripture+are%3A+1.+Dictum+Jehovah%2C+and+Dixit+%E3%80%88%E2%97%8A%E3%80%89%2C+%E2%80%98the+word+of+the+Lord%2C%E2%80%99+and+%E2%80%98Thus+says+the+Lord.%E2%80%99+2.+And+because+man%E2%80%99s+stipulation+and+promise+is+more+certain+than+his+bare+affirmation%2C+therefore+God+has+made+promises+to+us%2C+and+his+promises+are+precious%2C+as+the+apostle+says.+3.+And+for+our+greater+comfort+and+assurance+has+confirmed+his+promise+with+an+oath.+4.+Again%2C+because+if+we+have+a+man%E2%80%99s+handwriting%2C+we+give+greater+credit+to+that+than+to+an+oath%2C+we+have+his+own+handwriting%2C+written+with+his+own+finger.+5.+And+for+confirmation+of+that+He+has+put+to+his+seal.+6.+And+lastly+%28beyond+which+no+man+goes%2C+nor+any+man+desires+more+to+strengthen+a+promise%29%2C+He+has+given+an+earnest+penny%2C+a+true+God%E2%80%99s+penny+as+we+call+it.+Now+that+which+may+be+objected+against+this+is%3A+1.+That+the+immediate+voice+of+God+is+not+now+amongst+us+and+that+which+we+hear+is+from+Moses%2C+Isaiah%2C+saint+Matthew%2C+saint+Paul%2C+etc.+Yet+this+we+must+know%2C+that+though+we+heare+it+from+them%2C+being+but+men%2C+yet+did+they+not+speak+of+themselves%2C+not+of+their+own+brains%2C+but+as+they+were+inspired+by+the+Holy+Ghost.+And+this+saint+Peter+tells+us%3A+%E2%80%98The+prophecy%E2%80%99+%28says+he%29+%E2%80%98came+not+in+old+time+by+the+will+of+man%3A+but+holy+men+of+God+spake+as+they+were+moved+by+the+Holy+Ghost.%E2%80%99+For+a+prince+usually+speaks+not+to+the+people+immediately+from+his+own+mouth%2C+but+by+edicts+and+proclamations+published+by+others+in+his+name.+And+as+the+scepter+or+mace+which+is+delivered+to+them+that+publish+those+edicts+is+a+sign+and+token+that+they+come+from+and+for+the+prince%2C+so+the+scepter+of+God%E2%80%99s+extraordinary+power+was+committed+to+his+prophets%2C+apostles%2C+etc.+The+Jews+required+no+more+than+a+sign+of+our+Savior%2C+which+with+them+was+the+scepter.+And+our+Savior+desired+no+more+of+them+then+that+if+they+would+not+believe+Him+for+his+words%2C+yet+they+should+for+his+works.+And+that+if+He+had+not+done+among+them+the+works+which+no+other+man+did+%28those+were+his+miracles%29%2C+they+might+have+been+excused+for+their+unbelief.+Upon+which+saint+Augustine+says+that+either+we+must+grant+that+they+were+done%2C+or+else+that+without+miracles+all+the+world+was+converted+and+became+Christians%2C+which+is+a+greater+miracle+than+all+the+rest+which+He+did%3B+and+so+we+must+grant+miracles+whether+we+will+or+no.+And+this+is+our+warrant+that+these+men%2C+the+prophets+and+apostles+came+from+God%2C+and+that+God+has+spoken+to+us+by+them.+2.+The+next+query+is+whether+He+is+able+to+perform+those+things+which+He+has+promised+by+them.+To+that+we+say+with+the+angel+that+%E2%80%98with+God+nothing+shall+be+unpossible.%E2%80%99+The+prophet+says%2C+%E2%80%98His+hands+are+not+shortened%2C+it+is+able+to+reach+all+things.%E2%80%99+When+Moses+mistrusted+God%E2%80%99s+providence+to+feed+600%2C000+men%2C+saying%2C+%E2%80%98Shall+all+the+flocks+and+the+herds+be+slain%2C+or+all+the+fish+of+the+sea+be+gathered+together+to+suffice+them%3F%E2%80%99+God+answered%2C+%E2%80%98Is+the+Lord%E2%80%99s+hand+waxed+short%3F+Thou+shalt+see+whether+my+word+shall+come+to+pass+or+not.%E2%80%99+3.+Lastly%2C+for+his+will%2C+take+a+place+of+a+father+for+all%3A+Scio+posse%2C+scio+scire%2C+cupere+velle%2C+for%2C+%E2%80%98The+Lord+is+good+to+them+that+trust+in+Him%2C+to+the+soul+that+seeks+Him.%27%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+A+Pattern+of+Catechistical+Doctrine+at+Large%3B+or+a+Learned+%26+Pious+Exposition+of+the+10+Commandments%2C+%28d.+1626%3B+1675%29%2C+1st+Command%2C+ch.+7%2C+pp.+110-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff610d1dac6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f610d1dac6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=The%20next%20inward%20virtue%20of%20the,to%20the%20soul%20that%20seeks%20Him&amp;text=The%20next%20inward%20virtue%20of%20the%20mind%20is&amp;text=in%20Him%2C%20to%20the%20soul%20that%20seeks%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I wish the reader to understand that as often as we mention Faith alone in this question, we are not thinking of a dead faith, which worketh not by love, but holding faith to be the only cause of justification. (Galatians 5:6; Romans 3:22.) It is therefore faith alone which justifies, and yet the faith which justifies is not alone: just as it is the heat alone of the sun which warms the earth, and yet in the sun it is not alone, because it is constantly conjoined with light. Wherefore we do not separate the whole grace of regeneration from faith, but claim the power and faculty of justifying entirely for faith, as we ought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, Canon 11, p. 120</span></figcaption>

</figure><figure class="quote" id="q-5911d442cf" data-kw="">
<blockquote><p>Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure:

1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed.

2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

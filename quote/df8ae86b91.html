<main class="wrap"><figure class="quote" id="q-df8ae86b91" data-kw="">
<blockquote><p>What our Lord said of his immediate disciples is applicable to all his followers: “thine they were and thou gavest them me.” We are God’s creatures; our hearts are in his hand; he can turn them as he pleaseth; but unless we be thus turned, we will never cordially submit to have Christ to reign over us. No full nor faithful declaration of the truth—no alluring representation of the Saviour’s compassion and love—no affecting description of the horrors which await the finally impenitent—nay, not miracles themselves, forcing conviction on the understanding, can ever prevail with an unholy creature to become a willing subject of Messiah.

They must be drawn of the Father—they must be all taught of God. Jehovah beholds the end from the beginning, and the determinations of Omniscience hang not dependent on the feeble sons of earth. What think you, brethren, is it reasonable to suppose that the Sovereign of the Universe must await in anxious suspense, must remain ignorant of the consequences of his own operations, till a creature which he has made—till a creature which has unmade itself—till a creature whose desperately wicked heart cannot of itself think a right thought—till such a creature as this shall have resolved what it is to do, and how it is to act?

Shall we suppose that after all his agonies, and tears, and blood, it depended entirely on the will of man, whether Messiah should see of the travail of his soul, or all these have been wasted in vain? No, let not us pretend to limit the Holy One of Israel, nor attempt with our narrow span to measure Him whose understanding is infinite, and whose ways are past finding out. He who appointed Messiah a King, appointed him also the subjects over whom he is to reign. “Even so, O Father, for thus it seemed good in thy sight.”

Jehovah promised to Christ a numerous offspring, and this promise must be fulfilled. Most, if not all, who have ever submitted to Christ, have declared that naturally they were averse, and that divine power was requisite to overcome this aversion. Still there is no divine decree, far less any positive operation on the mind, preventing men from coming to Christ. This is the result of their love of sin. So that the two positions to be held—whether we can reconcile them or not—are, all that come to Christ are drawn, taught, and influenced of God—all that do not come are prevented, neither by divine influence nor decree, but simply by their own love of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-greig.html">Christopher Greig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Subdues a People to Himself in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-994f18c156" data-kw="">
<blockquote><p>There is a double interpretation of this text, each of them claiming under very valuable interpreters; some making it a declaration of Christ’s readiness to come in to souls, and to give them a spiritual fellowship and communion with Himself; others interpreting it of Christ’s readiness to come to the Last Judgment, and to take his saints into an eternal joyful fellowship and communion with Himself: hence there is a different interpretation of every sentence in the text. I stand at the door; either, in my gospel dispensations, I stand at the door of sinners’ hearts; or, I am ready to come to judge the world. And knock, by the inward monitions and impressions of my Spirit, or my ministers more externally; or, I am about to knock, that is, I am ready to have the last trump sounded. If any man hear my voice, and open the door; that is, if any man will hearken to the counsels and exhortations of my ministers, and to the monitions of my Spirit, and not resist my Holy Spirit; or, if any man has heard my voice, and opened his heart to Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible. Collinges was one of the men who finished Poole’s Commentary after he died, having gotten to Isa. 58</cite>, Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>CANON 6. If anyone says that God has mercy upon us when, apart from his grace, we believe, will, desire, strive, labor, pray, watch, study, seek, ask, or knock, but does not confess that it is by the infusion and inspiration of the Holy Spirit within us that we have the faith, the will, or the strength to do all these things as we ought; or if anyone makes the assistance of grace depend on the humility or obedience of man and does not agree that it is a gift of grace itself that we are obedient and humble, he contradicts the Apostle who says, “What have you that you did not receive?” (1 Cor. 4:7), and, “But by the grace of God I am what I am” (1 Cor. 15:10). CANON 7. If anyone affirms that we can form any right opinion or make any right choice which relates to the salvation of eternal life, as is expedient for us, or that we can be saved, that is, assent to the preaching of the gospel through our natural powers without the illumination and inspiration of the Holy Spirit, who makes all men gladly assent to and believe in the truth, he is led astray by a heretical spirit, and does not understand the voice of God who says in the Gospel, “For apart from me you can do nothing” (John 15:5), and the word of the Apostle, “Not that we are competent of ourselves to claim anything as coming from us; our competence is from God” (2 Cor. 3:5).1</p></blockquote>

— Second Council of Orange, Canons And Decrees Of The Second Council Of Orange, (AD 529)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCANON+6.+If+anyone+says+that+God+has+mercy+upon+us+when%2C+apart+from+his+grace%2C+we+believe%2C+will%2C+desire%2C+strive%2C+labor%2C+pray%2C+watch%2C+study%2C+seek%2C+ask%2C+or+knock%2C+but+does+not+confess+that+it+is+by+the+infusion+and+inspiration+of+the+Holy+Spirit+within+us+that+we+have+the+faith%2C+the+will%2C+or+the+strength+to+do+all+these+things+as+we+ought%3B+or+if+anyone+makes+the+assistance+of+grace+depend+on+the+humility+or+obedience+of+man+and+does+not+agree+that+it+is+a+gift+of+grace+itself+that+we+are+obedient+and+humble%2C+he+contradicts+the+Apostle+who+says%2C+%E2%80%9CWhat+have+you+that+you+did+not+receive%3F%E2%80%9D+%281+Cor.+4%3A7%29%2C+and%2C+%E2%80%9CBut+by+the+grace+of+God+I+am+what+I+am%E2%80%9D+%281+Cor.+15%3A10%29.+CANON+7.+If+anyone+affirms+that+we+can+form+any+right+opinion+or+make+any+right+choice+which+relates+to+the+salvation+of+eternal+life%2C+as+is+expedient+for+us%2C+or+that+we+can+be+saved%2C+that+is%2C+assent+to+the+preaching+of+the+gospel+through+our+natural+powers+without+the+illumination+and+inspiration+of+the+Holy+Spirit%2C+who+makes+all+men+gladly+assent+to+and+believe+in+the+truth%2C+he+is+led+astray+by+a+heretical+spirit%2C+and+does+not+understand+the+voice+of+God+who+says+in+the+Gospel%2C+%E2%80%9CFor+apart+from+me+you+can+do+nothing%E2%80%9D+%28John+15%3A5%29%2C+and+the+word+of+the+Apostle%2C+%E2%80%9CNot+that+we+are+competent+of+ourselves+to+claim+anything+as+coming+from+us%3B+our+competence+is+from+God%E2%80%9D+%282+Cor.+3%3A5%29.1%E2%80%9D%0A%0A%E2%80%94+Second+Council+of+Orange%2C+Canons+And+Decrees+Of+The+Second+Council+Of+Orange%2C+%28AD+529%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa47eb87126.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a47eb87126.html">Permalink</a><a class="src" h

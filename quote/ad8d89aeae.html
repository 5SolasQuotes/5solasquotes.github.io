<main class="wrap"><figure class="quote" id="q-ad8d89aeae" data-kw="">
<blockquote><p>O Jehovah! God of my salvation! Let me call upon you particularly to notice what I have just now stated, That although the prophet simply, and without hyperbole, recites the agony which he suffered from the greatness of his sorrows, yet his purpose was at the same time to supply the afflicted with a form of prayer that they might not faint under any adversities, however severe, which might befall them. We will hear him by and by bursting out into vehement complaints on account of the grievousness of his calamities; but he seasonably fortifies himself by this brief exordium, lest, carried away with the heat of his feelings, he might become chargeable with complaining and murmuring against God, instead of humbly supplicating Him for pardon. By applying to Him the appellation of the God of his salvation, casting, as it were, a bridle upon himself, he restrains the excess of his sorrow, shuts the door against despair, and strengthens and prepares himself for the endurance of the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 88, trans. James Anderson.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f54649e8d6" data-kw="">
<blockquote><p>([Margin Note:] What sort of influences we are to seek from God) But this is also a tempting of God: 1. We are not to pray for influences-physical simply and absolutely for all uses and ends to work miracles, to remove mountains, but especially we are to pray for more influences and such as are suitable to our ordinary duties: Ps. 119:36, ‘Incline my heart’ (but he suits not of God every bowing of the heart abstracted from the Word) ‘incline my heart unto thy testimonies and not to covetousness.’ Verse 133, ‘Order my heart in thy steps; let not any iniquity have dominion over me.’ 2. David seeks not every sort of quickening influences, but Ps. 119:25, ‘Quicken Thou me according to thy Word.’ Verse 40, ‘Quicken me in thy righteousness.’ Verse 88, ‘Quicken me after thy loving kindness.’ Verse 149, ‘O Lord, quicken me according to thy judgement.’ Verse 156 and 116, ‘Uphold me according to thy word, that I may live.’ Quakers and Familists seek after the furious wild-fire of hell, skaddings and flamings of a spirit abstracted from the Word…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Influences of the Life of Grace</cite>, (London, 1659), p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

rd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ce7d2c08fc" data-kw="">
<blockquote><p>Nay, here idolatry is manifest; since the worship of adoration and religious invocation is due to God alone (Ps. 50:15; Matt. 4:10; Rom. 10:17), nor can the calves of the lips be offered to the Saints, nor the incense of prayers burned to them, without their thereby being reckoned omniscient, omnipotent, omnipresent, and immense — able in a moment to be present to all who invoke them, in various places, on various matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Concise Refutation of Papism</cite>, p. 17</span></figcaption>

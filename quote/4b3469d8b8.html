<main class="wrap"><figure class="quote" id="q-4b3469d8b8" data-kw="">
<blockquote><p>Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid.

2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20.

3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid.

4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice</cite>, … (London, 1644) Rathband was a Westminster divine., pp. 31-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-b869d84c47" data-kw="">
<blockquote><p>We hold all who profess faith in Christ to be members of the visible Church, though they be not members of a visible congregation, and that the seals of the Covenant [of Grace] should not be denied to them. And for [the] more full clearing of the question, let these considerations be observed: First Distinction: All believers, as believers, in foro Dei, ‘before God’ have right to the seals of the Covenant [of Grace], these to whom the Covenant and body of the Charter belongs, to these the seal belongs, but in foro Ecclesiastico [in the sight of the Church], and in an orderly Church-way, the seals are not to be conferred by the Church upon persons because they believe, but because they profess their believing: therefore the apostles never baptized pagans, but upon profession of their faith. Second Distinction: Faith in Christ truly gives right to the seals of the Covenant [of Grace], and in God’s intention and decree, called voluntas beneplaciti [will of good-pleasure], they belong only to the invisible Church; but the orderly way of the Churches’ giving the seals is because such a society is a professing or visible Church, and [the] orderly giving of the seals according to God’s approving will, called, voluntas signi et revelata [the signified and revealed will], belongs to the visible Church. Third Distinction: The Church may orderly and lawfully give the seals of the Covenant to those to whom the Covenant and promises of grace do not belong in God’s decree of election. Fourth Distinction: The Church may lawfully add to the Church visible such as God adds not to the Church invisible, as they may add Simon Magus; and the Church may lawfully cast out of the visible Church, such as Christ has not cast out of the invisible Church, as the Church may excommunicate regenerate persons for scandalous sins. Fifth Distinction: Then the regenerate-excommunicated have right to the seals of the Covenant, as they have to the Covenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.</p></blockquote>

<blockquote><p>2. A second way of your communion of [congregationalist] churches, is, ‘By way of recommendation, as Paul in the behalf of Phoebe, etc.’ But this is so far from being any part of the power of the keys that it is a duty which a church or party owe to any Christian that is godly, not by virtue of any particular church-membership, but by the common interest of Christianity, yea, by the common right of humanity, even to an honest heathen, according to the Ninth Commandment, which requires us to bear true witness to our brother if we be thereto required. The letters are only declarative, of the good behaviour of the party, occasioned to remove to such a place. Was this (think you) a part of the power of the keys delivered to Peter and the rest of the apostles? Besides, if there be any virtue in these letters, to admit a member into communion, is there not a like virtue in them to excommunicate one ungodly? And if these letters dimissory have power to admit a member of one church to be a member of another, without any new covenanting, have they not the like power to admit the pastor of one church, to be a pastor of another Church, without any new ordination? which yet, I believe, you do not practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium</cite>, … (1645), ch. 4, ‘Of the Subject of Church-Liberty’, p. 41 Cawdrey (1588–1664) was a presbyterian Westminster divine.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9b3d39ed78" data-kw="">
<blockquote><p>Undoubtedly ζητήσεις μωραὶ καὶ ἀπαίδευτοι, foolish questions as well as those that are ignorant or unlearned, greatly block the path to piety. The former concern matters that accomplish nothing for piety. The latter arise from ignorance of the doctrine of righteousness, arguments against the faith, or even το‹ς ἅ μὴ ἑωράκασιν ἐμβατεύουσιν (from those who take their stand) on what they have not seen, who have neither seen nor heard anything in the Word of God, but who habitually appear and rear up with profane feet. Therefore, κενοφωνίαι and λογομαχίαι, foolish talk and quarrels about words, greatly hinder edification. Indeed, into what sordid conditions men will fall, who understand neither Scripture nor its substance! With all their might they furnish obscure, new, erratic, and suspect ideas as ends for religion, reduce the faith to tragedy, or transform the words of God into dross as amid a fire, thereby weakening and emptying them.

Contrarily, those things necessary for piety include the thorough examination of the Word of God, comparison of spiritual matters with spiritual matters, demonstration of the truth that accords with piety, conscience, the foundation of religion and the ἀναλογίας τῆς πίστεως (analogy of faith)—the harmony and conformity of all that must be believed from the uniform witness of God through σύνεσιν (conscience) and ἐπίστασιν (care). Also necessary for piety is the serious examination and proper consideration of the weight of God’s Word, as well as the disciplined and careful comparison of the product of all these practices. The end of all this is to subject the mind to the divine witness and the ἀποδείξιν τοῦ Πνεύματος, demonstration of the Spirit.

The devil very much hates this greatest means of increasing and strengthening true religion and destroying wickedness. Therefore, he corrupts the minds of men, so that they do not give heed to sound doctrine and the force of Scripture. Although these men have the μόρφωσιν (form) and precise outline of piety, they deny it, with both παραδιατριβὰς (idle occupation) and leisure spent for gain. Instead, they pursue ἀντιθέσεις ψευδωνύμου γνώσεως, contradictions falsely called knowledge, preferring this account to the opinion of the πολυμαθείας (very learned), experience, and common sense. Full of zeal, these men multiply their wickedness in numerous schools and seminaries.

In contrast, when Scripture is taken as the standard, there is nothing that is a greater threat, is more insidious, opposes, and tears down ἐπισυναγωγα‹ς, congregations, more than τῶν σχολαζόντων τῇ μαθήσιν, those who lack devotion to the sacred truth. After that danger is the one in which students, in the face of the trials of this life, only have knowledge of the truth as it suits them to listen to or talk about it. These follies, which are inappropriate to those who are and are called brothers, must cause harm.

For this reason, those who have been appointed to the sacred ministry to shepherd the flocks by the consensus and recommendation of the church and called by the authority of the elders must devote themselves with more anxious care so that they are found diligent and active not only in the explanation and presentation of the main points of doctrine but also in discussions about the mystery of piety according to its revelation in the Scriptures, together with the refutation of errors and restraint of corruptions, fruitless questions, and unhelpful assertions about the Word of God.</p></blockquote>

<blockquote><p>Here I might admonish them which separate themselves from our church [of England]. As Paul saith, ‘Examine whether you be in the faith,’ so examine whether you have the show of error. Hath it not the show of error to broach a religion which was never heard of before? Hath it not the show of error to retain an opinion which the author himself [Robert Browne] hath recanted, as though ye would suck up that which the dog hath vomited? Hath it not the show of error to affirm that those preachers may not be heard, which (by their own confessions) have converted them to the knowledge of God, and daily convert others? Hath it not the show of error to affirm that the Lord’s prayer may not be used for a prayer, which for anything that we or they can read, was so used from the beginning?

Hath it not the show of error to say that no man may use any set prayer, seeing there be many set prayers, and psalms, and blessings in the holy Scripture, which were used in the same form? Hath it not the show of error to affirm that we have no church, and yet to grant that our martyrs which died in popery were true members of the church? Hath it not the show of error to affirm that two or three may excommunicate all the rest without a minister, seeing the pastor is the mouth of the church?

Hath it not the show of error to affirm that the church of Christ was ever invisible before this age, and that it is such a small flock as their number is, and that it hath set foot nowhere but in England? Hath it not the show of error to hold that for good and sound religion which is altered every day, adding and detracting, as though a man should make a religion of his own invention, so fast as new conceits come into his brain: Let them think what Paul Saith unto them, ‘Be wise unto sobriety,’ Rom. xii. 3, and suspect that construction which yourselves devised; for Solomon saith, There is an error upon the right hand as well as upon the left, Prov. iv. 27; that is (as I may call it), the zealous error; and if this be not, I know none within this land.</p></blockquote>

</figure><figure class="quote" id="q-9affd19521" data-kw="">

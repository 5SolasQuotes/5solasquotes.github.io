<main class="wrap"><figure class="quote" id="q-0e97ec98bb" data-kw="">
<blockquote><p>Doubtless it will be the special care of this religious and wise Senate, to establish such orders in all this land for the house of God, that his ministers shall be encouraged to set themselves with all cheerfulness about the salvation of the people’s souls. Your honours will so provide it, that the pastors shall have nothing to do but with God and with souls, and with devils, to hold off by their spiritual weapons these roaring lions from their flocks. Questionless, your pieties will procure so much due respect, and so honourable a maintenance for every servant of God in this land, that they may wait wholly on their spiritual charges.

The pagan princes of old, the Turkish [Islamic] this day, the ancient popish parliaments, and the late prelatical, have demonstrated their care for that which they esteemed the service of their God. It will be very far from this most hopeful of all things, which also for time to come has so much need of the special assistance, and singular help of God, that they should in this so natural, so reasonable, so Christian a duty towards the servant of God, be any ways lacking.

Most wisely, and with all reason, have they procured the lamps of the house of God to be set in such posture, as their light may best shine to the use of men. Stars, though otherwise great, and full of light, if they move in too high a sphere, become either invincible, or of an obscure and bad light, for little use to men below upon earth. The pastors of God’s house, when they stand too high in worldly pomp above the people, their light in so great a distance vanishes, and scarce is visible to men so far below them. Yet it would be carefully considered, that the lights of the house of God be not too much brought down, and set too low; to put them under a bushel, to set them under the feet of the family, were to mar their shining and hinder the communication of their light [Matt. 5:15].

Above all, great care would be used, that when the superfluity of oil which did choke and extinguish, rather than maintain the light of some lamps, shall be diverted unto better employment, nevertheless that no candle of God, in any part of this land, be permitted to languish, much less to die for want of so much oil as is requisite for a convenient subsistence. But a word to wise men, and half a word of this kind to men so religious, and zealous for the house of God, is enough.</p></blockquote>

</figure><figure class="quote" id="q-544893aa41" data-kw="">
<blockquote><p>These words contain the fourth Commandment of the Decalogue, being the last of the first Table concerning our duty to God immediately. The Sum of it is to appoint unto men a set and solemn time wherein they should wholly give themselves to the study of holiness, and to the performance of holy exercises necessary for that purpose. …

It is propounded in these words, Remember the Sabbath-day to sanctify it. Remembrance is properly of things past, but here according to the usual acceptation of the word, it signifies a diligent consideration of the thing before hand, as where the young man is commanded, Eccles. 12. 1. To remember his Creator in the days of his youth, that is, seriously to consider of him. It is all one as if he should say, diligently observe, for so he interprets himself Deut. 5. 12.

Think upon and accordingly provide for the observation of this holy rest, by dispatching all the works of thy calling, that nothing might be undone which providence and diligence might prevent, that might hinder thy rest on the seventh day. Men are apt to forget the Creation of the world, therefore the Lord appointed the fourth Commandment; and to forget Christ, therefore he appointed the standing Ordinance of the Lord’s Supper, Luk. 22. 19.

The Sabbath-day] or the day of rest, and ceasing from labour, as the word properly signifieth, which is repeated again in the conclusion of the Commandment. It must not be bestowed as other days, but then they ought conscionably to forbear those things which on other days they might lawfully perform, for rest is a cessation from doing things.

To sanctify it] or keep it holy, that is, to employ the day in holy duties of God’s immediate worship, to sanctify it, to set it a part to holy uses and purposes. So two things are required, 1. The remembrance of the time, which is a serious preconsideration to prepare for it. 2. A careful celebration, consisting in resting and sanctifying it, for a bare rest is not enough, but such a rest as tendeth to and endeth in the sanctifying of it.</p></blockquote>

<blockquote><p>Paul… his traditions were the Gospel of Christ and honest manners and living, and such a good order as becomes the doctrine of Christ. As that a woman obey her husband, have her head covered, keep silence, and go womanly and christianly apparelled: that children and servants be in subjection: and that the young obey their elders, that no man eat but he that labours and works, and that men make an earnest thing of God’s Word, and of his holy Sacraments: and to watch, fast, and pray, and such like, as the Scripture commands. Which things he that would break were no christian man… There were also certain customs alway which were not commanded in pain of hell or everlasting damnation, as to watch all night, and to kiss one another: which as soon as the people abused, then they brake them. For which cause the bishops might break many things now in like manner. Paul also in many things which God had made free, gave pure and faithful counsel without tangling of any man’s conscience, and without all manner commanding under pain of cursing, pain of excommunication, pain of heresy, pain of burning, pain of deadly sin, pain of hell, and pain of damnation. As thou mayst see. 1 Cor. 7.</p></blockquote>

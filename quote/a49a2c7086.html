<blockquote><p>The proof here of is evident if Christ’s words be weighed in the nineteenth Chapter of S. Matthew’s gospel. For when the Pharisees asking him a question, whether it were lawful for a man to put away his wife for every cause, received answer that it was not, and thereupon said unto him, Why did Moses then command to give a bill of divorcement and to put her a way: Our Saviour said unto them; Moses suffered you because of the hardness of your heart to put away your wives: But from the beginning it was not so. And I say unto you, that, whosoever shall put away his wife, except it be for whoredom, and shall marry another, doth commit adultery: and who so marrieth her that is put away, doth commit adultery.

Now in this sentence, the clause of exception [except it be for whoredom] doth argue that he commiteth not adultery, who, having put away his wife for whoredom marrieth another.

But he must needs commit it in doing so unless the band of marriage be loosed and dissolved. For who so marrieth another as long as he is bound to the former, is an adulterer. The band then of marriage is loosed &amp; dissolved between that man and wife who are put asunder and divorced for whoredom.

And if the band beloosed, the man may marry another: seeing it is written Art thou loosed from a wife? If thou marry thou sinnest not. Therefore it is lawful for him who hath put away his wife for whoredom to marry another.

This argument doth firmly and necessarily conclude the point in question, if the first part &amp; proposition of it be proved to be true. For there is no controversy of any of the rest: being all grounded on such undoubted principles of scripture &amp; reason, that our adversaries themselves admit and grant them all.

The first they deny to wit that the clause of exception in Christ’s speech [except it be for whoredom] doth argue that the man committeth not adultery, who, having put away his wife for whoredom, marrieth another. And to overthrow this proposition, they do bring sundry answers and evasions. The best of all which as Bellarmine avoucheth, is, that those words [except it be for whoredom] are not an exception. For Christ (saith he) meant those words [except for whoredom] not as an exception, but as a negation. So that the sense is whosoever shall put away his wife. except for whoredom; that is to say without the cause of whoredom, &amp; shall marry another doth commit adultery. Whereby it is affirmed that he is an adulterer who having put away his wife without the cause of whoredom, marrieth another: but nothing is said touching him who marrieth another, having put away his former wife for whore dome. In deed this evasion might have some colour for it, if these words of Christ [except it be for whoredom] were not an exception.

But neither hath Bellarmine ought that may suffice for the proof hereof and the very text of the Scripture it self is soe clear against him, that he must of necessity give over his hold. For the principal pillar wherewith he under propseth it, is S. Austin’s judgment, who hath so expounded it in his first book touching adulterous marriages: Now of that treatise S. Austin saith himself in his retractations I have written two books touching adulterous marriages, as near as I could according to the scriptures being desirous to open and loose the knots of a most difficult question. Which whether I have done so that no knot is left therein, I know not: nay rather I perceive that I have not done it perfectly, and thoroughly, although I have opened many creeks thereof, as whosoever readeth with judgment may discern. S. Augustin then acknowledgeth that there are some wants &amp; imperfections in that work which they may see who read with judgment.

And whether this that Bellarmine doth allege out of it, deserve not to fall within the compass of that censure I appeal to their judgment who have eyes to see: For S. Augustin thought that the word in the original of S. Matthew’s gospel, had, by the Proper signification of it, imported a negation rather then an exception. As he sheweth by saying that where the common Latin translation hath [except for whoredom] in the Greek text it is rather read without the cause of whoredom. Supposing belike (whether by slip of memory or rather oversight) that the same words, which were used before in the fifth Chapter of S. Matthew’s Gospel to the same purpose, were used also in this place: whereas here they differ, and are well expressed by that in the Latin by which S. Austin thought they were not so well. Howbeit, if they had been the same with the former: yet neither so might Bellarmine allow his opinion: considering that the common Latin translation (which Papists by there Council of Trent are bound to stand to under pain of curse) expresseth those likewise as a plain exception.</p></blockquote>

<blockquote><p>Epiphanius writes (Heresies, 61), ‘There were a sect, a branch of the old Cathari [12th-14th centuries, southern Europe], or Puritans, (as he says) which called themselves Apostolici, propter exactum disciplinae studium, etc., for an extraordinary desire they had above other men to have discipline and all things to the exact pattern of the apostles’ days;’ which is itself an imagination. For, it were cacozelia, an apish imitation, to retain all in use then, seeing diverse things even then were but temporaria. For beside their canon in matters of knowledge (Gal. 6:16), they had their dogmata or decreta, not of equal importance; as was that of eating ‘things strangled, and blood’ (Acts 15:20), which no man now thinks himself bound to abstain from. And besides their epitaxes, commandments in matter of practice (1 Cor. 7:10), they had their diataxes, injunctions, not of equal regard with the former. Such were their agapae, love-feasts after the sacrament (Jude 12): and their celebrating the sacrament after supper (1 Cor. 11:20-12) [in the evening, as the word in Greek for ‘supper’, δεῖπνον, in the Lord’s ‘Supper’, intimates]; which no Church at this day does imitate. Therefore, to press all that was in that time is an imagination. And, as to press all so of these things that remain, to press all alike, or think an equal necessity of them, which was a parcel of the imagination of the Donatists. For, some things the apostles peremptorily commanded (1 Cor. 7:10); Some things they had no commandment for, but only gave counsel (1 Cor. 7:25); Some things they commanded and taught (1 Tim. 4:11); somethings they taught and exhorted (1 Tim. 6:2); whereof each was to be esteemed in his own value and worthiness; Neither to dispense with the commandment, nor to make a matter of necessity of the counsel. Both which have not a little harmed the Church. Lastly, to these matters of counsel, which for the most part are things indifferent, they also fall upon two imaginations. 1. Some say: omnia mihi licent [‘all is lawful to me’] (1 Cor. 10:23), and so [if] it be not condemned as unlawful, make no bones of it, which tends to all profaneness. [2.] Others say, ‘Touch not, taste not, handle not’ (Col. 2:21), which speak of things indifferent as merely unlawful, which imagination ends in superstition. A mean [middle] way would be holden between them both, that neither ‘a snare be cast’ (1 Cor. 7:35) on men’s consciences by turning non expedit [not expedient] into non licet [not permitted], nor our ‘liberty’ in Christ (Gal. 5:13) [to] be made an occasion to the flesh by casting non expedit out of doors. For the Spirit of Christ is the spirit of ingenuity, which will freely submit itself to that which is expedient, even in things of their own nature lawful. The not observing whereof, with good heed and discretion, has in old time filled the world with many a superstitious imagination and in our days has healed the imagination and superstition and hypocrisy with another of riot and licentious liberty as bad as the former, yea a great deal worse.</p></blockquote>

rent, they also fall upon two imaginations. 1. Some say: omnia mihi licent [‘all is lawful to me’] (1 Cor. 10:23), and so [if] it be not condemned as unlawful, make no bones of it, which tends to all profaneness. [2.] Others say, ‘Touch not, taste not, handle not’ (Col. 2:21), which speak of things indifferent as merely unlawful, which imagination ends in superstition. A mean [middle] way would be holden between them both, that neither ‘a snare be cast’ (1 Cor. 7:35) on men’s consciences by turning non expedit [not expedient] into non licet [not permitted], nor our ‘liberty’ in Christ (Gal. 5:13) [to] be made an occasion to the flesh by casting non expedit out of doors. For the Spirit of Christ is the spirit of ingenuity, which will freely submit itself to that which is expedient, even in things of their own nature lawful. The not observing whereof, with good heed and discretion, has in old time filled the world with many a superstitious imagination and in our days has healed the imagination and superstition and hypocrisy with another of riot and licentious liberty as bad as the former, yea a great deal worse.”

— Lancelot Andrewes, Other citations (work not named), 96 Sermons, One of the Sermons upon the 2nd Commandment, on Acts 2:42, pp. 29-30 Andrewes was a reformed Anglican.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEpiphanius+writes+%28Heresies%2C+61%29%2C+%E2%80%98There+were+a+sect%2C+a+branch+of+the+old+Cathari+%5B12th-14th+centuries%2C+southern+Europe%5D%2C+or+Puritans%2C+%28as+he+says%29+which+called+themselves+Apostolici%2C+propter+exactum+disciplinae+studium%2C+etc.%2C+for+an+extraordinary+desire+they+had+above+other+men+to+have+discipline+and+all+things+to+the+exact+pattern+of+the+apostles%E2%80%99+days%3B%E2%80%99+which+is+itself+an+imagination.+For%2C+it+were+cacozelia%2C+an+apish+imitation%2C+to+retain+all+in+use+then%2C+seeing+diverse+things+even+then+were+but+temporaria.+For+beside+their+canon+in+matters+of+knowledge+%28Gal.+6%3A16%29%2C+they+had+their+dogmata+or+decreta%2C+not+of+equal+importance%3B+as+was+that+of+eating+%E2%80%98things+strangled%2C+and+blood%E2%80%99+%28Acts+15%3A20%29%2C+which+no+man+now+thinks+himself+bound+to+abstain+from.+And+besides+their+epitaxes%2C+commandments+in+matter+of+practice+%281+Cor.+7%3A10%29%2C+they+had+their+diataxes%2C+injunctions%2C+not+of+equal+regard+with+the+former.+Such+were+their+agapae%2C+love-feasts+after+the+sacrament+%28Jude+12%29%3A+and+their+celebrating+the+sacrament+after+supper+%281+Cor.+11%3A20-12%29+%5Bin+the+evening%2C+as+the+word+in+Greek+for+%E2%80%98supper%E2%80%99%2C+%CE%B4%CE%B5%E1%BF%96%CF%80%CE%BD%CE%BF%CE%BD%2C+in+the+Lord%E2%80%99s+%E2%80%98Supper%E2%80%99%2C+intimates%5D%3B+which+no+Church+at+this+day+does+imitate.+Therefore%2C+to+press+all+that+was+in+that+time+is+an+imagination.+And%2C+as+to+press+all+so+of+these+things+that+remain%2C+to+press+all+alike%2C+or+think+an+equal+necessity+of+them%2C+which+was+a+parcel+of+the+imagination+of+the+Donatists.+For%2C+some+things+the+apostles+peremptorily+commanded+%281+Cor.+7%3A10%29%3B+Some+things+they+had+no+commandment+for%2C+but+only+gave+counsel+%281+Cor.+7%3A25%29%3B+Some+things+they+commanded+and+taught+%281+Tim.+4%3A11%29%3B+somethings+they+taught+and+exhorted+%281+Tim.+6%3A2%29%3B+whereof+each+was+to+be+esteemed+in+his+own+value+and+worthiness%3B+Neither+to+dispense+with+the+commandment%2C+nor+to+make+a+matter+of+necessity+of+the+counsel.+Both+which+have+not+a+little+harmed+the+Church.+Lastly%2C+to+these+matters+of+counsel%2C+which+for+the+most+part+are+things+indifferent%2C+they+also+fall+upon+two+imaginations.+1.+Some+say%3A+omnia+mihi+licent+%5B%E2%80%98all+is+lawful+to+me%E2%80%99%5D+%281+Cor.+10%3A23%29%2C+and+so+%5Bif%5D+it+be+not+condemned+as+unlawful%2C+make+no+bones+of+it%2C+which+tends+to+all+profaneness.+%5B2.%5D+Others+say%2C+%E2%80%98Touch+not%2C+taste+not%2C+handle+not%E2%80%99+%28Col.+2%3A21%29%2C+which+speak+of+things+indifferent+as+merely+unlawful%2C+which+imagination+ends+in+superstition.+A+mean+%5Bmiddle%5D+way+would+be+holden+between+them+both%2C+that+neither+%E2%80%98a+snare+be+cast%E2%80%99+%281+Cor.+7%3A35%29+on+men%E2%80%99s+consciences+by+turning+non+expedit+%5Bnot+expedient%5D+into+non+licet+%5Bnot+permitted%5D%2C+nor+our+%E2%80%98liberty%E2%80%99+in+Christ+%28Gal.+5%3A13%29+%5Bto%5D+be+made+an+occasion+to+the+flesh+by+casting+non+expedit+out+of+doors.+For+the+Spirit+of+Christ+is+the+spirit+of+ingenuity%2C+which+will+freely+submit+itself+to+that+which+is+expedient%2C+even+in+things+of+their+own+nature+lawful.+The+not+observing+whereof%2C+with+good+heed+and+discretion%2C+has+in+old+time+filled+the+world+with+many+a+superstitious+imagination+and+in+our+days+has+healed+the+imagination+and+superstition+and+hypocrisy+with+another+of+riot+and+licentious+liberty+as+bad+as+the+former%2C+yea+a+great+deal+worse.%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+Other+citations+%28work+not+named%29%2C+96+Sermons%2C+One+of+the+Sermons+upon+the+2nd+Commandment%2C+on+Acts+2%3A42%2C+pp.+29-30+Andrewes+was+a+reformed+Anglican.&amp;url=https%3A%2F%2F5solasquotes.gi <blockquote><p>Many prophets of Neo-Confederate mythology argue that attacks on the non-recognition of slave-marriages and legal proscriptions on slave-literacy in the Old South are actually slanderous, and that the antebellum South was the epitome of a Christian commonwealth. The interesting thing is that the Revd James Henley Thornwell, one of the leading proslavery apologists among the Old School Presbyterians,[1] recognised that unbiblical practices concerning slave-marriage and anti-scriptural legislation concerning slave-literacy actually existed in his home state (South Carolina). Although we differ with Thornwell in seeing such things as incidental evils, as the whole system of American slavery was based on iniquitous man-stealing, we do nonetheless applaud his honesty on these matters:

Our Synod has just closed its sessions. A large committee was appointed, of which I am chairman, to draw up a paper, to be presented to the next Synod, on the subject of slavery, defining the true position of our Church, and suggesting means for rectifying some of the abuses and evils incidental to the institution. We shall probably recommend a petition to the Legislature, praying that a law may be enacted, to protect the family relations of the slave; and that the disgraceful statute, which prohibits them from learning to read, may be repealed. I shall take great pains in the preparation of the document, and would be glad to receive any suggestions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-thornwell.html">J. H. Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to B. M. Palmer, 20 Oct. 1847 in B. M. Palmer, The life and letters of James Henley Thornwell, D.D., LL.D., ex-president of the South Carolina College, late professor of theology in the theological seminary at Columbia, South Carolina (Richmond, 1875), p. 301.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>The second cause [for marriage] is to avoid fornication. This Paul signifieth when he saith, ‘For the avoiding of fornication, let every man have his own wife,’ 1 Cor. vii. 8. He saith not for avoiding of adultery, but for avoiding of fornication, showing that fornication is unlawful, too, which the papists make lawful, in maintaining their stews [brothels], as a stage for fornicators to play upon, and a sanctuary to defend them; like Absalom’s tent, which was spread upon the top of the house, that all Israel might see how he defiled his father’s concubines, 2 Sam. xvi. 22.

For this cause Malachi saith that God did create but one woman for the man. He had power to create more, but to show that he would have him to stick to one, therefore he created of one rib but one wife for one husband, Mal. ii. 15. And in the ark there were no more women than men, but four wives for four husbands, although it was otherwise in the beginning of the world, when many wives might seem necessary to multiply mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

enanter</a></div>

<blockquote><p>…to say [as the opponent does], that the Word teaches the Church to abstain from blood (Acts 15), is a part of the perfection of the Scripture, and yet the Scripture teaches that abstinence from blood, not as an eternal and unalterable Law, for we are not now tied to abstain from blood, therefore the Scripture may make the man of God perfect in some works that are alterable and changeable: This (I say) is no answer, for saying that God should now make abstinence from blood and things strangled indifferent (Acts 15), as He made them in that interval of time when the [Levitical] ceremonies were mortal [alive] but not deadly and unlawful, as is clear in that Paul circumcised Timothy (Acts 16:1-3), that rite being then indifferent; and yet he writes in another case when the Gospel is now fully promulgated, that to be circumcised makes a man a debtor in conscience to keep the whole Law of Moses, and so to abstain from eating of blood and things strangled must be a falling from the grace of Christ and an apostasy from the Gospel (Gal. 5:1-7). The like I say of observing of days (Rom. 14:5-6) which were indifferent and [yet] in another case (Gal. 4:9-10; Col. 2:16-17) [were] deadly, unlawful and not necessary. So the matter (Acts 15), which in the case of scandalizing the weak, is abstinence from things indifferent, say ‘that they are indifferent’ binds as a perpetual law to the end of the world, and binds us this same very day (Rom. 14:20) in the morality of it, as abstinence from murdering one for whom Christ died, (Rom. 14:15; 1 Cor. 8:12-13; 1 Cor. 10:26-28). And upon the ground laid by prelates, which is most false and untrue, to wit, that many positive things in Church government, such as are [by] prelates deemed to be warranted by apostolic, though not by Divine, right: ceremonies and crossing, kneeling to bread, altars, surplice, rochet, corner-cap, yea, and circumcision, a passover lamb, and all the Jewish ceremonies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).</p></blockquote>

monies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).”

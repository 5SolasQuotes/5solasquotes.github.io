<main class="wrap"><figure class="quote" id="q-6b2e80d829" data-kw="">
<blockquote><p>IV. (2) …Laws bind the conscience per se and directly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly and mediately in case of scandal and contempt. Hence the guilt arising from their violation is not properly on account of the violation of the constitution, but on account of the neglect of the authority which God ordained, and on account of the scandal given. … XX. Again, in the transgression of them [church constitutions] there can be no sin except indirectly (i.e., not on account of the usurpation of the thing itself [as in homicide, fornication], but on account of another thing [that is, from contempt of lawful authority], for because obedience is commanded by God, there is sin in a neglect of it, if with a neglect of brotherly edification, or if from impiety and license. However, if all these are absent, there will be no sin in a transgression of them… nor is the authority of the one commanding to be so much regarded as the cause of the command.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, pp. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84e5bda01e" data-kw="">
<blockquote><p>This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676), Vol. 4, pt. 3, bk. 4, Tract 1, ‘Of Ecclesiastical Power’, 7. Of the Legislative Power of the Churches, 5th Question, Response 2, p. 796</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.”

</figure><figure class="quote" id="q-434a2843e4" data-kw="">
<blockquote><p>[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.</p></blockquote>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [prelate] Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches and Gregory de Valentia, as I show[ed] before… …when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo [therefore], it [the Church’s judgment] cannot remove my doubting and beget faith… 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

<blockquote><p>…we do not deny that faith can be called in a certain sense implicit, both in children and the uninstructed (who have only an obscure knowledge) and in the more advanced (in whom the light is always mixed with darkness…)… But the question is whether faith in its conception includes knowledge; if not a full, still a true and certain knowledge in its own order. …the question is whether that assent is blind, destitute of all knowledge, so that it may be better defined by ignorance and to believe is to assent to things unknown [or not].” – Institutes 3.565 Even children are to ‘obey’ their ‘parents in the Lord’ (Eph. 6:1), that is, in consistency with their knowledge of right and wrong and in faith to God. It should be apparent that if subordinates have, or should have, a rational trust in their superiors, the less the superiors need to pedantically instruct their subordinates in the reasons for their rules. However, if a subordinate has a grounded case of conscience against the command of the superior, and it is not an emergency (where the superior must act for the subordinate’s good regardless), then the superior(s) ought to make clear sufficient reasons as to the moral necessity of the command so as to persuade their conscience if at all possible. A rule (such as that of this webpage) may often be gone without as long as it may be appealed to and bind when necessary. To put it another way, it is not wrong to serve authorities or men, even though we do not have a full and explicit persuasion of the complete moral bindingness of their dictates from God’s natural and moral laws, if we are able, perhaps for other reasons, to serve them in the Lord. That is to say, passive obedience, where one is not fully convinced of the inherent bindingness of the precept itself, is acceptable if one is able to do it for other godly reasons. Paul said, for instance: 1 Cor. 9:19 “For though I be free from all men, yet have I made myself servant unto all, that I might gain the more.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-97278baa58" data-kw="">
<blockquote><p>When God reveals some new truth to man, some truth of mighty import, and bearing immediately upon the eternal interests of the soul; or when (as oftener happens) some truth as old almost as the beginnings of Revelation, but which has long been obscured by the mass of human traditions which have gathered over it, is revived, and assumes its proper place, an amazing effect is produced. The history of the great doctrine of “Justification by Faith” affords a remarkable illustration of this.

That doctrine is so clearly revealed, and occupies so conspicuous a place throughout the sacred writings, that it is a matter of astonishment that any one who reads them should miss it. Yet, for long and weary ages, it was in a manner lost to man. God, indeed, always, even in the times of darkest superstition, had a band of witnesses upon earth. For centuries they were so few and so despised, that they might well be called “hidden ones” Without exaggeration it may be said, that to Christendom – that great truth was lost.

The discovery and revival of it at the Reformation, was life from the dead. A new impulse – the freshness and glory of a new and spiritual existence – was throughout Europe communicated to the human mind. The earth is not more invigorated, when the breezes and showers of spring, with the potent alchemy of the sun now gaining the ascendant, dispel the fogs, and relax the frozen grip of winter, causing the vegetation to teem up, and mantle bill and valley, than were the minds of men by that blessed change, for which we are too stinted in our gratitude to the Most High. To this so celestial doctrine, and those others which go hand in hand with it in fair procession, we owe all those privileges which we so justly esteem, and by which the ages since the Reformation are distinguished from those that went before, by all that is Christian in sentiment pure in principle, and charitable in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-clarkston-fairbairn.html">John Clarkston Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Baptist in Christian Miscellany</cite></span></figcaption>

<blockquote><p>That they indeed quote Paul in the same sense does them very little good: “The doers of the law, not the hearers, are justified” [Rom. 2:13 p.]. I do not intend to evade the question through Ambrose’s solution: that this was said because fulfillment of the law is faith in Christ.15 For I see this as a mere evasion, quite needless where the way lies open. Here the apostle is casting down the foolish confidence of the Jews, who claimed for themselves the sole knowledge of the law, even while they were its greatest despisers. Lest, then, mere skill in the law should please them so much, he warns that if righteousness be sought from the law, not knowledge but observance of it is sought. We assuredly do not question that the righteousness of the law consists in works, and not even that righteousness consists in the worth and merits of works. But it has not yet been proved that we are justified by works unless they produce some one man who has fulfilled the law. That Paul meant precisely this is sufficiently attested by the context of his utterance. After having condemned Gentiles and Jews together for their unrighteousness, he then gets down to details and says: “Those who have sinned without law will perish without law,” which has reference to the Gentiles; and “those who have sinned in the law will be judged by the law” [Rom. 2:12], which concerns the Jews. Now, since they, winking at their own shortcomings, plumed themselves on the law alone, Paul adds something especially fitting: the law was not laid down merely that men might be made righteous by hearing its voice; but only if and when they obeyed it. It is as if he said: “Do you seek righteousness in the law? Do not claim to have heard it, something of little weight in itself, but bring works whereby you may declare that the law was not laid down for you in vain.” Since they were all lacking in these works, it followed that they were bereft of boasting about the law. Paul’s meaning, then, requires us, rather, to frame the opposite argument: the righteousness of the law lies in perfection of works; no one can boast that he has fulfilled the law through works; consequently, there is no righteousness arising from the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, 3.17.12.</span></figcaption>

</figure><figure class="quote" id="q-6bec436415" data-kw="">
<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.”

— Robert Rollock, ‘Treatise on Justification’, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+this+point+it+may+be+asked+whether+justification+is+perfectly+completed+in+this+life%3F+Let+me+say+in+response+to+this%2C+first+of+all%2C+that+God%E2%80%99s+benefits+to+us+in+Christ+fall+into+two+categories.+One+category+includes+benefits+that+are+not+inherent+in+man%2C+such+as+his+eternal+predestination%2C+his+justification%2C+and+his+adoption.+The+other+includes+benefits+that+are+inherent+in+man%2C+such+as+his+effectual+calling+and+his+glorification.+The+benefits+included+in+these+two+categories+have+this+in+common%2C+that+none+of+them%E2%80%94not+predestination%2C+not+justification%2C+not+adoption%2C+not+effectual+calling%2C+not+glorification%E2%80%94will+be+fully+manifested+and+revealed+until+Christ%E2%80%99s+own+manifestation+is+full+and+perfect.+Indeed%2C+the+revelation+of+these+things+in+man+has+a+beginning+in+the+first+manifestation+of+Christ+Himself.+Thus+the+apostle+writes+in+Rom.+3%3A21%2C+%E2%80%9Cbut+now+the+righteousness+of+God+is+revealed%2C+etc.%E2%80%9D+But+the+revelation+of+them+in+believers+is+not+yet+full.+Thus+1+Jn.+3%3A2%3A+%E2%80%9CWe+are+already+sons+of+God%2C+but+it+has+not+yet+appeared+what+we+will+be.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+%E2%80%98Treatise+on+Justification%E2%80%99%2C+tr.+Aaron+Denlinger+%26+Noah+Phillips+MAJT+27+%282016%29%2C+1.4.2.+%E2%80%98The+Imputation+of+Righteousness%E2%80%99%2C+pp.+108-9+Rollock+%28c.+1555-1599%29+was+a+Scottish+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bec436415.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bec436415.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=At%20th

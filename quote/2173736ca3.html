<main class="wrap"><figure class="quote" id="q-2173736ca3" data-kw="">
<blockquote><p>Perhaps it may be thought by some that the Saviour’s declaration, “Render, therefore, unto Caesar the things which are Caesar’s,” (Mat. xxii. 21,) does not seem to coincide with the sentiments now expressed. As this passage has also been impressed into the service of courtly adulation, and been generally applied in support of unqualified subjection to all kinds of taxes and Government-imposts, we must here endeavour to set it in its true light. We affirm, then, in the most unequivocal terms, that the declaration is no direct and positive answer to the question proposed, nor was it understood to be so by the Jews.

As the question stood, it required to be answered thus:- It is lawful, or it is not evident, that the question was captious and ensnaring, since the Saviour said – “Why tempt ye me, ye hypocrites?” The answer, therefore, was evasive and equivocal, and was so understood; otherwise, how should those who proposed it “marvel,” had not their cunning been baffled, and their hopes disappointed? Let it be remarked, that it is no way derogatory to the Saviour’s candour to say, that he is baffled the malice of his enemies by answering the fool according to his folly.

We have an instance of this kind in the decision he gave respecting the woman taken in adultery – “Let him that is without sin among you cast the first stone at her.” So, likewise, when he said – “Destroy this temple, and in three days I will rear it up again,” he gave a practical illustration of the propriety of the precept in these instances which we have adduced. Since the answer, then, was evasive, it must be highly absurd to consider it as direct, and to apply it accordingly, as has been frequently done.

But even although we should allow the question to have been answered in direct terms, which we by no means do, it could never be justly adduced as an example for our imitation, either regarding obedience to civil rulers, or the voluntary payment of government taxes, since our political circumstances, and those of the Jews in the Saviour’s time, are entirely different. They were a conquered nation – and had, by their aggravated sins, given the Gentiles, or Romans, a right over them, which none would have obtained, had they continued to perform their allegiance to God.

Caesar did not govern them, either by their choice or consent; they had no hand in enacting those laws to which they were obliged to submit, nor had any of the Caesars sworn to govern them according to law. They had no political charter, recognizing their rights and liberties; nor had it ever been said to them, in relation to Caesar, “Will ye have this man to reign over you?” They were, therefore, obliged to submit to any imposition, because resistance, at that time, was out of the question.

Our case is entirely different in submitting to the authority of our Caesars or civil magistrates. They have no absolute or dictatorial power over us; nor can they demand a shilling from us, unless it be allowed them by law. Those laws which claim our obedience are not made by the magistrate, but by ourselves, through our representatives; nor are we bound to obey any magistrates, but such as have been legally set up.

Our Caesar swears and engages to rule by law; and all his power is derived from the same law which constitutes him chief magistrate. The law alone sanctions what he is to command, and defines the limits of our obedience. These circumstances, then, can be no just similarity established between Caesar’s arbitrary exactions from the Jews, and our taxation according to law. This text, of course, is grossly abused, when it is applied for the purpose of inculcating submission to the measures of civil government; nor does it tend in the slightest degree, when rightly understood, to invalidate the doctrine advocated in the preceding remarks.</p></blockquote>

<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>

<blockquote><p>2. Nations are bound to frame their constitutions of government; to enact their laws; and to conduct the civil administration, in professed and real obedience to the Scriptures. – National acknowledgment of the Messiah’s authority is not a bare profession. “Not every one that saith, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven,” Matt. vii. 21. Christ’s titles are not mere honorary titles; he is really a king. Submission to his sceptre implies the reception of his law and obedience to its demands.

The laws of Christ are contained in the Bible, and all the laws of the Bible are Christ’s laws. Both the Old and New Testaments are his statute books. Every moral law found there, carries with it an obligation to obedience. And it is the imperative duty of all Christ’s subjects to search, each for himself, the inspired record, that he may ascertain from its pages the principles of righteousness by which his conduct ought to be governed. “Search the Scriptures; – and they are they which testify of me.” As nations are under the government of the Mediator, this obligation rests upon them as well as upon individuals.

And why should not nations seek light from the Bible? The remains of the moral law are very broken and imperfect in the natural man, even in regard to civil duties. Witness the national follies and crimes of the most enlightened pagan nations: to say nothing of the great majority of the inhabitants of those nations that either have not the Bible at all, or have only a closed Bible and who have consequently sunk into the most wretched condition of moral and social debasement. The Bible professes to be a perfect rule. It has been “given by inspiration of God, that the man of God may be perfect; thoroughly furnished unto all good works,” 2 Tim. iii. 16, 17. There is no exception made of civil or political “works.” This gracious revelation finds man in all things wanting such light as will clearly show him the will of God. This it does.

Nor are its teachings confined to the duties of personal religion and those of the domestic and other social relations. The Scriptures abound with instruction respecting matters civil and political. The historical part of the Old Testament, the prophecies, the book of Proverbs and the Psalms, are full of the richest treasures of political wisdom; while the Pentateuch contains a system of laws devised by infinite wisdom for the chosen people of God. Indeed, civil duties occupy as large a space in the Bible as they do in the actual operations of society.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4c394ca331" data-kw="">
<blockquote><p>Three things are to be observed in this speech:

1. God’s resolution not always to strive with man by his Spirit. My Spirit has striven a great while; it shall strive yet a little longer; but it shall not strive always. The Holy Spirit is a striving Spirit with the children of men; striving them away from sin, and to bring them to God; striving by the checks of their own consciences, but the ministry of the Word, by the rebukes of Providence; striving by one fair warning after another to reclaim the sinner. Have not we ourselves experienced these strivings?—something within us that has whispered in an hour of temptation, “Do not this abominable thing which the Lord hates?” ‘Twill be our wisdom to hearken to such whispers, and to close with them, striving against sin. Heb 12:4. If the Spirit of God be resisted in its strivings, and quenched in its motions, though it may strive long, yet it will not strive always. ‘Tis a principle with men not to be always persuading those with whom they cannot prevail; neither will the blessed Spirit do so. If Ephraim be joined to idols, is it not a righteous thing with God to say, Strive no more with him, let him alone? Hosea 4:17. What guest will stay long there where he is not welcome? Is it not wisdom then to improve these strivings while we have them?

2. The reason of that resolution: For that he also is flesh; carnal, earthly, sensual, corrupted, depraved, defiled; and therefore ‘tis to no purpose to strive with him; ‘tis but labor lost. It is as good to go about to change the Ethiopian’s skin or the leopard’s spots, as to reclaim and reform these impenitent sinners. Flesh, in scripture, is frequently opposed to spirit. It is the corrupt nature that renders the strivings of the blessed Spirit ineffectual. ‘Tis the law in the members that wars against the law of the mind. Rom. 7:23. The flesh and the spirit are sworn enemies one to another, and between them there is a constant conflict. Gal. 5:17. Now where the flesh, the carnal part, is so far suffered to prevail, as that the man may be denominated flesh, there the Spirit will not always, will not long strive. Those therefore that would enjoy the Spirit’s strivings, must curb and restrain, and not gratify and encourage, the corrupt motions and carnal desires of the flesh and of the mind. Eph. 2:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-henry.html">Philip Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the First 11 Chapters of Genesis</cite>, (d. 1696; London: Nisbet &amp; Co., 1839), pp. 166-67 on Gen. 6:3, “And the Lord said, My Spirit shall not always strive with man, for that he also is flesh.”</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f9facaff9" data-kw="">
<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | voluntas Dei, ‘the will of God’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-5bffc2791f" data-kw="">
<blockquote><p>Also one must bear in mind that God’s original wish was that all should be saved [1 Tim. 2:4] and come to His Kingdom. For it was not for punishment that He formed us but to share in his goodness, inasmuch as He is a good God. But inasmuch as He is a just God, his will is that sinners should suffer punishment. The first then is called God’s antecedent will and pleasure, and springs from Himself, while the second is called God’s consequent will and permission, and has its origin in us. And the latter is twofold: one part dealing with matters of guidance and training, and having in view our salvation, and the other being hopeless and leading to our utter punishment, as we said above. And this is the case with actions that are not left in our hands. But of actions that are in our hands, the good ones depend on his antecedent goodwill and pleasure, while the wicked ones depend neither on his antecedent, nor on His consequent will, but are a concession to free-will. For that which is the result of compulsion has neither reason nor virtue in it. God makes provision for all creation and makes all creation the instrument of his help and training, yea often even the demons themselves, as for example in the cases of Job and the swine [Mt. 8:30 ff.].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-of-damascus.html">John of Damascus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Orthodox Faith</cite>, bk. 2, ch. 29, ‘On Providence’ in NPNF2, vol. 9, pt. 2, p. 42 Damascus (c. 675 or 676 – 749) was Christian monk, apologist and theologian, known as the last of the Greek fathers. Damascus appears not to believe in an unconditional predestination underlying his antecedent/ consequent distinction, per ch. 30.</span></figcaption>

<blockquote><p>XXIII. There is in man a twofold judgment, to wit, an antecedent, which is that of the affections and senses; and a consequent, which is that of reason: so there is a twofold volition: the one follows the judgment of sense, and it is rather an imperfect desire than a perfect volition; the other follows the judgment of reason: both these volitions were in Christ more eminently than in us, because in Him were two wills, and these, by reason of his two natures, were distinct in Him, though his person was but one; therefore He desired the cup might pass from Him, but willed it not; or, He willed it by his antecedent, not by his consequent will. O Thou that madest in Thyself the judgement of affection stoop to the judgment of reason and madest thy desire subservient to thy will, and causedst thy antecedent will to give place to thy consequent: produce in me the same effect, that these sinful delights which my affections so earnestly run after, and thy gentle corrections, which they so earnestly run from, may be so ordered that the one by me may be courageously subdued, the other patiently endured, that my affections may submit to my will, my will to reason and reason to thy Spirit.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXIII. There is in man a twofold judgment, to wit, an antecedent, which is that of the affections and senses; and a consequent, which is that of reason: so there is a twofold volition: the one follows the judgment of sense, and it is rather an imperfect desire than a perfect volition; the other follows the judgment of reason: both these volitions were in Christ more eminently than in us, because in Him were two wills, and these, by reason of his two natures, were distinct in Him, though his person was but one; therefore He desired the cup might pass from Him, but willed it not; or, He willed it by his antecedent, not by his consequent will. O Thou that madest in Thyself the judgement of affection stoop to the judgment of reason and madest thy desire subservient to thy will, and causedst thy antecedent will to give place to thy consequent: produce in me the same effect, that these sinful delights which my affections so earnestly run after, and thy gentle corrections, which they so earnestly run from, may be so ordered that the one by me may be courageously subdued, the other patiently endured, that my affections may submit to my will, my will to reason and reason to thy Spirit.”

— Alexander Ross, A Century of Divine Meditations upon Predestination… (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXIII.+There+is+in+man+a+twofold+judgment%2C+to+wit%2C+an+antecedent%2C+which+is+that+of+the+affections+and+senses%3B+and+a+consequent%2C+which+is+that+of+reason%3A+so+there+is+a+twofold+volition%3A+the+one+follows+the+judgment+of+sense%2C+and+it+is+rather+an+imperfect+desire+than+a+perfect+volition%3B+the+other+follows+the+judgment+of+reason%3A+both+these+volitions+were+in+Christ+more+eminently+than+in+us%2C+because+in+Him+were+two+wills%2C+and+these%2C+by+reason+of+his+two+natures%2C+were+distinct+in+Him%2C+though+his+person+was+but+one%3B+therefore+He+desired+the+cup+might+pass+from+Him%2C+but+willed+it+not%3B+or%2C+He+willed+it+by+his+antecedent%2C+not+by+his+consequent+will.+O+Thou+that+madest+in+Thyself+the+judgement+of+affection+stoop+to+the+judgment+of+reason+and+madest+thy+desire+subservient+to+thy+will%2C+and+causedst+thy+antecedent+will+to+give+place+to+thy+consequent%3A+produce+in+me+the+same+effect%2C+that+these+sinful+delights+which+my+affections+so+earnestly+run+after%2C+and+thy+gentle+corrections%2C+which+they+so+earnestly+run+from%2C+may+be+so+ordered+that+the+one+by+me+may+be+courageously+subdued%2C+the+other+patiently+endured%2C+that+my+affections+may+submit+to+my+will%2C+my+will+to+reason+and+reason+to+thy+Spirit.%E2%80%9D%0A%0A%E2%80%94+Alexander+Ross%2C+A+Century+of+Divine+Meditations+upon+Predestination%E2%80%A6+%28London%3A+Young%2C+1646%29%2C+pp.+15-16%2C+19%2C+21-23%2C+89-92+Ross+%28c.+1590%E2%80%931654%29+was+a+Scottish+minister+and+chaplain-in-ordinary+to+King+Charles+I.+He+was+not+the+Aberdeen+doctor+of+the+same+name.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fdc58a3ef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3fdc58a3ef.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=XXIII.%20There%20is%20in%20man%20a,reason%20and%20reason%20to%20thy%20Spirit&amp;text=XXIII.%20There%20is%20in%20man%20a%20twofold%20judgment&amp;text=will%20to%20reason%20and%20reason%20to%20thy%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>6. Next it must be noted how peremptorily he [a Romish adversary] charges me with ignorance for saying this antecedent will is not simply, properly and formally in God. But he should have considered that when I said so, I spoke in the words of Durand (Durand, bk. 1, dist. 46, quest. 1), one of his own side, whom I alleged in the margin: that, if it were false I said, yet the ignorance should not be fathered on me, but on them that begot it. For I said the truth, and himself is ignorant of the doctrine of his own Church. For Thomas handling this antecedent will, says (pt. 1, quest. 19, art. 6, to obj. 1), ‘We do not simply will what we will antecedently; and therefore this antecedent will may rather be called a velleity than an absolute will. (magis dici potest velleitas quam absoluta voluntas) A velleity, that is to say as Gregory of Valence expounds him (Commentary on Thomas, pt. 1, disp. 1, quest. 19, point 2), ‘a certain conditionated will; when that only can be said simply to be willed, that is willed consequently.’ Where we see that Thomas reduces this antecedent will to an imperfect kind of willing, which he calls a velleity, which is not a simple, proper or formal will: and the most Schoolmen follow him upon this ground, because there cannot be a formal will in God which is not fulfilled, as the salvation of all men is not. Hence it is says Suarez (Tract on Predestination, bk. 4, ch. 2, no. 2), that some have inferred that this of God whereby He would the salvation of all men, is no proper and formal act of willing in God: because He has no imperfect act of willing, as they call velleity, but only a signification of will (voluntatem signi), which only is metaphorical and interpretative, in that He carries Himself towards men, as if He had that act of willing. Thus think Cajetan and Marsilius. Others say, the formal and proper will of God reaches not to the salvation of all men, for that cause because it is not fulfilled, but only to the giving of sufficient means: which will, only to appoint sufficient means, is formal in God, and thereof God is said to will the salvation of all men: and of this mind are many Schoolmen. This will of God, says Vasquez (in pt. 1 of Thomas, disp. 83, no. 22), whereby He would the salvation of all men, even of the reprobate, very many Schoolmen, especially the newer, think to be only a conditionated will, which they call a velleity: whose act is not absolute and perfect, but under condition. Now the probabler opinion, says Dominicus Bannes (Commentary, pt. 1, quest. 19, art. 6, conclusion 2), is that there is formally no will in God which is signified by the name of velleity. Whence it follows that since by the doctrine of Thomas and many others, this antecedent will is but a velleity, it cannot be formally in God. But to take down this raw student yet a little more, Soto Major says (in tome above, p. 274): This word, God will the salvation of all men, by the good leave of so many ancient authors, we will not only expound of will properly so called, which is God’s good pleasure, but of his antecedent will; that is to say, an imaginary and metaphorical will: according to the which, it is no inconvenience to say, God will have all men to be saved: of which antecedent will, or will improperly so called, Damascene speaks (p. 279). And again: Damascene’s antecedent will is but a general, metaphorical and improper will, which they call a velleity. Here you see that Damascene and Thomas’s antecedent will is but a velleity, and this velleity is no will simply or formally in God; and therefore I spoke not ignorantly, but after the mind of the best Schoolmen that write when I said out of Durand that this antecedent will is not simply, properly and formally the will of God, but knew well enough what I said: and such as hold the contrary, that this antecedent will whereby God is said to will the salvation of all men, is simply, properly or formally the will of God, are driven to hold a paradox, that God’s absolute will, which is defined to be the will of his good pleasure, may be defeated and not accomplished (Opus est fateri non omnem voluntatem Beneplaciti semper impleri. Magal. in Tim., p. 252): which is a desperate shift and contrary to the doctrine of the best ancient divines in the Church of Rome (Thomas, pt. 1, quest. 19, art. 6; Master [of the Sentences, Lombard], bk. 1, dist. 46, where Scotus, Ockham, Dionysius Capreollus, dist. 45, quest. unic. art. 2, concl. 5; Cajetan on 1. Tim. 2:4; Dominic Banez, pt. 1, quest. 19, art. 6, concl. 2, in sum. text. Perer., Select Disputations on Jn. 1, no. 73); and directly against the Scripture, which says, ‘Our God has done whatsoever pleased Him in heaven and earth.’ (Ps. 135:6) ‘Who has resisted his will?’ (Rom. 9:19) ‘Who works all things according to the counsel of his own will.’ (Eph. 1:11)</p></blockquote>

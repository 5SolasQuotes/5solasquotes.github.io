<blockquote><p>39. Furthermore, the administration of the ecclesiastical power in consistories, classes and synods, doth not at all tend to weaken in anywise, hurt or diminish, the authority of the civil magistrate, much less to take it away or destroy it; yea, rather, by it a most profitable help cometh to the magistrate, forasmuch as by the bond of religion men’s consciences are more straitly tied unto him. There has been, indeed, fantastical men, who under pretence and cloak of Christian liberty, would abolish and cast out laws and judgments, orders also, degrees and honours, out of the commonwealth, and have been bold to reckon the function of the magistrate armed with the sword among evil things and unlawful: but the reformed churches do renounce and detest these dreams, and do most harmoniously and most willingly confess and acknowledge it to be God’s will that the world be governed by laws and policy, and that he himself hath appointed the civil magistrate, and hath delivered to him the sword to the protection and praise of good men, but for punishment and revenge on the evil, that by this bridle, men’s vices and faults may be restrained, whether these are committed against the first or second table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One hundred and eleven propositions concerning the ministry and government of the church</cite>, (1647; Edinburgh, 1844), p. 12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e81acd84b" data-kw="">
<blockquote><p>But then (say they) this makes things arbitrary and indifferent to become necessary. This is true: but you must conceive that a thing may be said to be necessary two ways: necessary in itself, and necessary in the outward submission to the use of it. In itself, a thing indifferent cannot be made necessary. It is always as it is by nature, and conscience informed must so judge it; yet in the outward use, for the peace of the Church, it may upon command become necessary. After the death of Christ, till the destruction of the temple, abstaining from things strangled and blood, circumcision, legal vows and purifyings were indifferent in themselves, (for else the apostles would not have used them so): yet for the peace of some churches they were judged necessary to be yielded in love; and so may it be in other things: yet the indifferent nature of things is not taken away, but the necessary use prescribed for the peace of the church, upon better grounds than that we should suffer ourselves to be unsettled from royal power [as in his day with the civil government instituting ceremonies].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, Section 10, pp. 94-95 Abbot was a reformed Anglican.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>[F]or it is obvious to every observation, that Families are the Seminaries of Towns, Churches, Countries, and Nations; and are as it were, the Hives, out of which do swarm the materials of greater assemblies; if therefore they be not well Principled therein all their Relations, the rest must needs miscarry. And here I observed, was the true Original of all our Miscarriages and mischiefs abroad; that when young people went out thence, to constitute new families, either as servant, or by marriage, they knew not the particular duties of their New Relations; as Husbands and Wives, as Parents and Children, as Masters and Servants: because for the most part, they were never taught them in the Families from whence they were transplanted. Remove a Crabstock from a barren to a fruitful soil, it will still be a Crabstock, without change of nature.

It is a certain Truth, a thousand times exemplified, That (without special converting grace) he or she shall never be good parents to their children, that were not good children to their parents: Nor they good Governors of servants that were not good servants to their Governors; nor they good Husband or Wife, in their own families that were not good in their former family Relations, as children or servants; Nor lastly, will those who are naughy in their Family Relations be good Neighbours in a Town, good Members of a Church, or good Subjects, or Magistrates in the State: A good man is the proper subject of the goodness of all other Relations: And he only is a good man, that is good in his first Relations; The Spring then of all Reformation, in Townes, Churches, Nations, (next to personal Reformation, where everyone mends one, that is himself) is that which is found in Families. If they were but either well constituted, or well-ordered and reformed, the whole work were done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The preface to the reader in Family reformation promoted. In a sermon on Joshua, chap. 24. ver. 15.</cite></span></figcaption>

</figure><figure class="quote" id="q-1be73ac50d" data-kw="">
<blockquote><p>That this is also your principal care, most watchful fathers of your country, your zeal and piety do not suffer us to doubt. For indeed you have remembered that dominion is strengthened by piety and righteousness according to the oracle of the wisest of kings; and that your rule never could be happy and well ordered unless you took care that by the word of God, his authority should always avail with you and that Christ himself should reign through you. You have remembered that here might be not so much an aristocracy as a theocracy, having God always for its president and ruler; and that the safety of the republic, which should always be the supreme law, could not be better consulted than by defending those two impregnable ramparts – the culture of pure religion and the pious care of nurturing the church, which God has committed to the protection of your wings […] as long as you will take care that among your citizens piety and justice, the love of religion and country, love and the holy concord of souls shall flourish, and vices (too many in this most corrupt age even in the growing church) be severely repressed; as long as by our zeal this city shall truly correspond to her name “Reformed,” as much with respect to integrity of morals as to purity of doctrine […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, pp xxxv-i.</span></figcaption>

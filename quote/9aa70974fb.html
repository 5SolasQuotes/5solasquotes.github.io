<main class="wrap"><figure class="quote" id="q-9aa70974fb" data-kw="">
<blockquote><p>Sacred things applied to civil business do not therefore become civil, for who will say that prayer at the beginning of a Parliament is a civil act, though it were used in the Upper and Lower House, and applied to that civil meeting as it ought to be? And why then shall application of civil decency unto sacred buisiness make it alter the nature or name of it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (Amsterdam: Thorp, 1633), ch. 1, section 16, ‘Concerning an Argument Against our Ceremonies, out of 1 Cor. 14’, pp. 73-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-64968dc87b" data-kw="">
<blockquote><p>3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 652</span></figcaption>

<blockquote><p>3. [As Rutherford’s adversary said,] There is no government where sovereignty is not kept inviolable. [Rutherford:] It is true; where there is a king, sovereignty must be inviolable; What then? Arbitrary government is not sovereignty… 3. Arbitrary governing has no alliance with God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644), p. 25</span></figcaption>

— Samuel Rutherford, Lex Rex... (1644), p. 25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+%5BAs+Rutherford%E2%80%99s+adversary+said%2C%5D+There+is+no+government+where+sovereignty+is+not+kept+inviolable.+%5BRutherford%3A%5D+It+is+true%3B+where+there+is+a+king%2C+sovereignty+must+be+inviolable%3B+What+then%3F+Arbitrary+government+is+not+sovereignty%E2%80%A6+3.+Arbitrary+governing+has+no+alliance+with+God%3B%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%29%2C+p.+25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc638daf6c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c638daf6c2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=3.%20%5BAs%20Rutherford%E2%80%99s%20adversary%20said%2C%5D%20There,governing%20has%20no%20alliance%20with%20God&amp;text=3.%20%5BAs%20Rutherford%E2%80%99s%20adversary%20said%2C%5D%20There%20is%20no&amp;text=3.%20Arbitrary%20governing%20has%20no%20alliance%20with%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-75f12122c0" data-kw="">
<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads:

1. The gesture of sitting, which Christ Himself also used.

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary</cite>, ... (London, 1623), on 1 Pet. 2:13, pp. 588-90</span></figcaption>

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.”

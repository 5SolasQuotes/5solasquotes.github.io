<blockquote><p>Now because this work [of sanctification] is but inchoate and imperfect, and in part only transacted in this World; and there are remainders of sin in this life in the best of Saints; and because Grace and Corruption are vigorous, active, operative Principles, dwelling so near together, under the same Roof, in the same Soul, yea in the very same Faculties: there must needs arise a sharp and severe War in the Soul between these two Neighbouring and Opposite Natures, the particular events and successes whereof are various and uncertain; but the Victory is infallibly determined in the issue on the side of Grace. Grace indeed is greatly beset, hardly bestead, much encumbered and almost overthrown at some reasons: but it will certainly eluctari, wrestle and recover itself out of all the dangers that threaten it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/urian-oakes.html">Urian Oakes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The unconquerable, all-conquering, &amp; more-then-conquering soldier, or, The successful war which a believer wageth with the enemies of his soul as also, the absolute and unparalleled victory that he obtains finally over them through the love of God in Jesus Christ: as it was discussed in a sermon pre</cite>, (Cambridge MA: Samuel Green, 1674), p. 1.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45a6a3f53c" data-kw="imperfect sanctification against perfectionism">
<blockquote><p>It is well known that this is enumerated also among the many heads of the Pelagian hydra—that he contended that the believer can in this life live without sin and so can perfectly fulfill the law and be constituted in a state of sinlessness. Augustine thus describes this error: “The Pelagians go so far as to say that the life of the righteous in this world has no sin, and from these in this mortal existence the church of Christ is made up, so as to be wholly without wrinkle and without blemish, as if it was not the church of Christ, which throughout the world cries out to the Lord, Forgive us our debts.” Is sanctification so perfect in this life that believers can fulfill the law absolutely? We deny against the Romanists and Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.2.1–2</span></figcaption>

<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, On Theodore Beza</span></figcaption>

</figure><figure class="quote" id="q-84f4da8a14" data-kw="">
<blockquote><p>If yet you see not the pride of these men, I will shew it you in these four particular Evidences, and that so plainly, that if you know the difference between the language of heaven and of hell, you may easily perceive the devil speaking by their mouths.

1. They affirm themselves to be perfect without sin (yea, some of them say they are Christ and God.) And is it possible that any man in this life, that is not mad with spiritual pride, can indeed believe that he hath no sin? what? that he transgresseth no Law? That he doth love God in the highest degree that he is bound to do? That he never hath a thought or word that is sinful, nor sinfully loseth one minute of his time?

Yea, and this when in the eyes and ears of the wisest, they foam out their own shame, as the raging Sea doth cast out the dirt. The devil himself hath either less pride or less ignorance, then to think himself to be perfect without sin; If they have no sin, what need they pray, Forgive us our sins, or what further need have they of the blood of Christ or his Intercession to procure them any further forgiveness? If you can see no pride in this, I fear you are blinded with them to destruction.</p></blockquote>

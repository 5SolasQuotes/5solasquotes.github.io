<main class="wrap"><figure class="quote" id="q-b3c7105a4b" data-kw="">
<blockquote><p>And if there be no such heaven to which they are appointed, no hell from which they are redeemed, they do but comfort themselves with a fable, and bless themselves with a thing of nought: their comfort is no greater than the comfort of a beggar, that dreams he is a king, and when he awakes, finds himself a beggar still. Surely the ends of Christ’s death were to deliver us from the wrath to come, 1 Thess. i. 10. not from an imaginary, but a real hell, to bring us to God, 1 Pet. iii. 18. to be the author of eternal salvation to them that obey him, Heb. v. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fountain of Life: A Display of Christ in his Essential and Mediatorial Glory</cite>, (1673) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 1: 396.</span></figcaption>

</figure><figure class="quote" id="q-be44ccd4ab" data-kw="">
<blockquote><p>(First,) God is an infinite Ocean of Sweetness, Perfection, and Glory; he has all Good and all Perfection in Him, as in its Fountain, Fulness, and Purity; as all the Lines in the Circumference do meet, and are united in the Center; so all Excellencies and Perfections do meet, and are united in God; and as God has all Excellencies and Perfections in him, so (Secondly) he perfectly understands his own infinite Perfections, contemplates them, and has an infinite delight, solace, and satisfaction in them; he is infinitely pleased and at rest in himself, and in the vision and fruition of his own Perfections, and this is his blessedness; hence he tells us, that he is God All-sufficient; that is to say, for and to himself, as well as for and to his people, Gen. 17.1. I am God All-sufficient, I am my own blessedness; and Abraham, I am thy blessedness, and I have enough for both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A beam of divine glory, or, The unchangeableness of God opened, vindicated, and improved: whereunto is added, The soul’s rest in God. By Edward Pearse. To which is prefixed the author’s last letter, written in the time of his sickness to some peculiar friends</cite>, (London: Jonathan Robinson, 1674), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

1/08/17/edward-pearse-on-gods-infinite-satisfaction-in-himself/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-dac57b3344" data-kw="">
<blockquote><p>Sixthly, in this that Christ bare the curse of the law upon the cross; we learn that those that be the children of God, when they suffer any judgement, cross, or calamity, either in body or in mind or both, do not bear them as the curses of God, but as the chastisements of a loving father.

For it doth not stand with the justice of God to punish one fault twice: and therefore when any man that putteth his whole confidence in God, shall either in his own person, in his good name, or in his goods feel the heavy hand of God, God doth not as a judge curse him, but as a father correct him.

Here then is condemned the opinion of the Church of Rome, which hold, that we by our sufferings do in some part satisfy the justice of God: but this can not stand, because Christ did make a perfect satisfaction to the justice of his father for all punishment. And therefore satisfaction to God made by man for temporal punishment is needless, and much derogates from Christ’s passion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 335.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

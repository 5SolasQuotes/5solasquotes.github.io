<blockquote><p>Morality and holiness is principally seated in the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675) | Preface, n.p.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Morality and holiness is principally seated in the will.”

— Richard Baxter, Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675) | Preface, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMorality+and+holiness+is+principally+seated+in+the+will.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology%2C+Plain%2C+Pure%2C+Peaceable...+%28London%3A+White%2C+1675%29+%7C+Preface%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe82b18451a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e82b18451a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=Morality%20and%20holiness%20is%20principally%20seated%20in%20the%20will." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a7a08b9ad" data-kw="">
<blockquote><p>Farther this Pigghius reasons and says that this desire which Augustine calls concupisence is a work of nature and of God: and therefore it cannot be counted sin. But we have before answered that it comes not from the grounds of nature as it was instituted by God, but of nature corrupted. For man, when he was created, was made right and (and as the scripture says) to the image of God. Wherefore that desire of things pleasant and preservative in Adam, when he was first created, was not outrageous or vehement, to be against right reason and the word of God: for, that followed afterward. Wherefore we ought not to call it the work of God (as Pigghius says) but the wickedness of sin and corruption of affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans, ch. 5, p. 123 in Most Learned &amp; Fruitful Commentaries of Dr. Peter Martyr Vermilius... (d. 1562; London: 1568)</cite></span></figcaption>

</figure><figure class="quote" id="q-d3bbb51ec1" data-kw="">
<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>

</figure><figure class="quote" id="q-975320707f" data-kw="">
<blockquote><p>It is neither affirmed nor denied that flesh also was granted to the first men for food, and therefore we may safely be ignorant of it. It is sufficient for us that it was expressly allowed, Gen. 9:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen. 1, v. 29</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is neither affirmed nor denied that flesh also was granted to the first men for food, and therefore we may safely be ignorant of it. It is sufficient for us that it was expressly allowed, Gen. 9:3.”

— Matthew Poole, Commentary on Gen. 1, v. 29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+neither+affirmed+nor+denied+that+flesh+also+was+granted+to+the+first+men+for+food%2C+and+therefore+we+may+safely+be+ignorant+of+it.+It+is+sufficient+for+us+that+it+was+expressly+allowed%2C+Gen.+9%3A3.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Commentary+on+Gen.+1%2C+v.+29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F975320707f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/975320707f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=It%20is%20neither%20affirmed%20nor%20denied,it%20was%20expressly%20allowed%2C%20Gen.%209%3A3." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cdb094eedf" data-kw="">
<blockquote><p>But a great question here does justly offer itself, whether man might not eat flesh at the first, but herbs, seeds and fruits only. And because the other creatures are confined to herbs and seeds, whether such of them as live now upon flesh, were otherwise sustained then, as lions, beares, wolves, etc. Touching either of these diverse expositours are of diverse opinions. Some think that although herbs and seeds and fruits only are named, when man’s food is appointed unto him, yet for so much as flesh is not forbidden, and a dominion over the creatures to use them, as he thought good, was given unto him, he might at his pleasure make food of that also. And they argue from this that sacrifices were to be made of the creatures, some part of which was to be eaten, and likewise that they were to be killed, that they might have their skins for clothing, wherefore it is most probable that they ate their flesh. So that God in appointing these things to be eaten, did but appoint their ordinary food, there being a liberty to use flesh for food also, when man should think good. But others hold that seeds and herbs and fruits were mans only food till the Flood, because none but these are mentioned and an express allowance is given to eat flesh after the flood, as these things. Thus the Fathers generally, and most new writers of all sorts. And it seems to have been an ancient received opinion, by that which old poets have left written, as Boethius. The former age was content with the faithful fields, and satified their hunger with the acorn, when they had fasted long. And Ovid: Men were content with meat growing without forcing, they gathered the fruits growing in mountainous places and those that grow upon thorns, etc. (bk. 1, Metamor.) And it stands with good reason that man should feed then only upon such things, they being such as might well suffice nature, and most pleasant at the first, and men’s bodies being strong and healthful, and this was a most simple diet, and so most fit to be appointed at the first to rebuke the luxury of after times. Some also yield this for a reason, that man not being used to the shedding of blood might be better preserved from murder. But this reason is weak, because beasts were killed for sacrifice, and to have their skins for apparel, and therefore Cain, the very first man born into the world, fell into this damnable sin of murder. The reasons before rendered therefore are best, and that the creatures not being killed up at the first, might the better be multiplied upon the earth. After the flood men’s bodies grew weaker, and it is generally thought that neither herbs nor waters were so wholesome as before, but more corrupt through that deluge, and therefore flesh was now allowed to be eaten; and whereas waters were their only drink before, vines were now planted that they might have wine for their infirmity. Yet it is not to be doubted but that Noah and his sons did forbear the killing of beasts to eat for a time, that their increase might not be hindered. Calvin thinks it best to suspend and not to determine this question. Touching beasts, that now live upon flesh, some also think that they did so at the first, because the nature of a creature is always the same, and that when God assigned herbs and seeds for the beasts to feed upon, He meant not all beasts. But this is contrary to the text, speaking of all, wherein was the breath of life, and howsoever creatures never alter from their specifical nature, yet they may alter from their individual [nature], using such food at one time, as they used not at another, as children, who at the first are nourished with milk, and eat no solid meat, yet afterwards they eat it. Others therefore more probably hold, that even those beasts that since have lived upon flesh, and birds also, lived then all upon seeds and herbs, and that this discord and malignity of nature came upon them afterwards, since the Flood, one bearing a kind of hatred to another and so preying upon it and tearing and eating the flesh thereof. And this opinion has both the present text plainly for it and even at the time of the Flood it must needs be yielded to have been so, because all sorts of creatures earthly living with Noah in the ark, were susteined without eating flesh, for otherwise their number, being so few of each kind taken in, would not have sufficed, see also for this Isa. 11:7 and 65:25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament (1627; 1653), on Genesis, ch. 1</cite>, pp. 27-28</span></figcaption>

— John Mayer, A Commentary upon the Whole Old Testament (1627; 1653), on Genesis, ch. 1, pp. 27-28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+a+great+question+here+does+justly+offer+itself%2C+whether+man+might+not+eat+flesh+at+the+first%2C+but+herbs%2C+seeds+and+fruits+only.+And+because+the+other+creatures+are+confined+to+herbs+and+seeds%2C+whether+such+of+them+as+live+now+upon+flesh%2C+were+otherwise+sustained+then%2C+as+lions%2C+beares%2C+wolves%2C+etc.+Touching+either+of+these+diverse+expositours+are+of+diverse+opinions.+Some+think+that+although+herbs+and+seeds+and+fruits+only+are+named%2C+when+man%E2%80%99s+food+is+appointed+unto+him%2C+yet+for+so+much+as+flesh+is+not+forbidden%2C+and+a+dominion+over+the+creatures+to+use+them%2C+as+he+thought+good%2C+was+given+unto+him%2C+he+might+at+his+pleasure+make+food+of+that+also.+And+they+argue+from+this+that+sacrifices+were+to+be+made+of+the+creatures%2C+some+part+of+which+was+to+be+eaten%2C+and+likewise+that+they+were+to+be+killed%2C+that+they+might+have+their+skins+for+clothing%2C+wherefore+it+is+most+probable+that+they+ate+their+flesh.+So+that+God+in+appointing+these+things+to+be+eaten%2C+did+but+appoint+their+ordinary+food%2C+there+being+a+liberty+to+use+flesh+for+food+also%2C+when+man+should+think+good.+But+others+hold+that+seeds+and+herbs+and+fruits+were+mans+only+food+till+the+Flood%2C+because+none+but+these+are+mentioned+and+an+express+allowance+is+given+to+eat+flesh+after+the+flood%2C+as+these+things.+Thus+the+Fathers+generally%2C+and+most+new+writers+of+all+sorts.+And+it+seems+to+have+been+an+ancient+received+opinion%2C+by+that+which+old+poets+have+left+written%2C+as+Boethius.+The+former+age+was+content+with+the+faithful+fields%2C+and+satified+their+hunger+with+the+acorn%2C+when+they+had+fasted+long.+And+Ovid%3A+Men+were+content+with+meat+growing+without+forcing%2C+they+gathered+the+fruits+growing+in+mountainous+places+and+those+that+grow+upon+thorns%2C+etc.+%28bk.+1%2C+Metamor.%29+And+it+stands+with+good+reason+that+man+should+feed+then+only+upon+such+things%2C+they+being+such+as+might+well+suffice+nature%2C+and+most+pleasant+at+the+first%2C+and+men%E2%80%99s+bodies+being+strong+and+healthful%2C+and+this+was+a+most+simple+diet%2C+and+so+most+fit+to+be+appointed+at+the+first+to+rebuke+the+luxury+of+after+times.+Some+also+yield+this+for+a+reason%2C+that+man+not+being+used+to+the+shedding+of+blood+might+be+better+preserved+from+murder.+But+this+reason+is+weak%2C+because+beasts+were+killed+for+sacrifice%2C+and+to+have+their+skins+for+apparel%2C+and+therefore+Cain%2C+the+very+first+man+born+into+the+world%2C+fell+into+this+damnable+sin+of+murder.+The+reasons+before+rendered+therefore+are+best%2C+and+that+the+creatures+not+being+killed+up+at+the+first%2C+might+the+better+be+multiplied+upon+the+earth.+After+the+flood+men%E2%80%99s+bodies+grew+weaker%2C+and+it+is+generally+thought+that+neither+herbs+nor+waters+were+so+wholesome+as+before%2C+but+more+corrupt+through+that+deluge%2C+and+therefore+flesh+was+now+allowed+to+be+eaten%3B+and+whereas+waters+were+their+only+drink+before%2C+vines+were+now+planted+that+they+might+have+wine+for+their+infirmity.+Yet+it+is+not+to+be+doubted+but+that+Noah+and+his+sons+did+forbear+the+killing+of+beasts+to+eat+for+a+time%2C+that+their+increase+might+not+be+hindered.+Calvin+thinks+it+best+to+suspend+and+not+to+determine+this+question.+Touching+beasts%2C+that+now+live+upon+flesh%2C+some+also+think+that+they+did+so+at+the+first%2C+because+the+nature+of+a+creature+is+always+the+same%2C+and+that+when+God+assigned+herbs+and+seeds+for+the+beasts+to+feed+upon%2C+He+meant+not+all+beasts.+But+this+is+contrary+to+the+text%2C+speaking+of+all%2C+wherein+was+the+breath+of+life%2C+and+howsoever+creatures+never+alter+from+their+specifical+nature%2C+yet+they+may+alter+from+their+individual+%5Bnature%5D%2C+using+such+food+at+one+time%2C+as+they+used+not+at+another%2C+as+children%2C+who+at+the+first+are+nourished+with+milk%2C+and+eat+no+solid+meat%2C+yet+afterwards+they+eat+it.+Others+therefore+more+probably+hold%2C+that+even+those+beasts+that+since+have+lived+upon+flesh%2C+and+birds+also%2C+lived+then+all+upon+seeds+and+herbs%2C+and+that+this+discord+and+malignity+of+nature+came+upon+them+afterwards%2C+since+the+Flood%2C+one+bearing+a+kind+of+hatred+to+another+and+so+preying+upon+it+and+tearing+and+eating+the+flesh+thereof.+And+this+opinion+has+both+the+present+text+plainly+for+it+and+even+at+the+time+of+the+Flood+it+must+needs+be+yielded+to+have+been+so%2C+because+all+sorts+of+creatures+earthly+living+with+Noah+in+the+ark%2C+were+susteined+without+eating+flesh%2C+for+otherwise+their+number%2C+being+so+few+of+each+kind+taken+in%2C+would+not+have+sufficed%2C+see+also+for+this+Isa.+11%3A7+and+65%3A25.%E2%80%9D%0A%0A%E2%80%94+John+Mayer%2C+A+Commentary+upon+the+Whole+Old+Testament+%281627%3B+1653%29%2C+on+Genesis%2C+ch.+1%2C+pp.+27-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdb094eedf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdb094eedf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=But%20a%20great%20question%20here%20does,for%20this%20Isa.%2011%3A7%20and%2065%3A25." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

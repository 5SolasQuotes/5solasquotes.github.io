<main class="wrap"><figure class="quote" id="q-53dc81c98d" data-kw="">
<blockquote><p>But Jesus in this passage also asserts His own Lordship over the Sabbath. “The Son of man is Lord even of the Sabbath.” The title Son of man is distinctly Messianic and points to the dominion which He in His capacity as the Messiah exercises. It is in His capacity as the Son of man that He exercises this Lordship over the Sabbath. And this simply means that, within that universal Lordship and authority that is His as the one to whom all authority in heaven and earth has been committed, the Sabbath has its proper place and function. Abolition of it is, as B. B. Warfield says, “as far as possible from the suggestion of the passage.”

Further, we must observe that Jesus says “even of the Sabbath.” The presence of the word “even” serves to show the extent of Jesus’ Lordship. This Lordship is so comprehensive that it even includes the Sabbath, and surely such an emphasis discloses the high conception of its sanctity and authority Jesus entertained.

Finally, the reason assigned for this Lordship over the Sabbath is the fact that the Sabbath was made for man. It was for the sake of man that Jesus came into the world, it was for man’s sake that He died and rose again, it is for man’s sake that He is exalted as the Messiah to supreme mediatorial sovereignty. But it was also for man’s sake that the Sabbath was made. If, then, it was for man’s sake that Jesus came, and suffered, and died, and rose again to ascend up where He was before, is it possible that that which was made for man – the Sabbath – should be annulled and abrogated by that which He became and did for man’s sake?

There is complete congruity between His Messianic work and Lordship on the one hand and the Sabbath ordinance on the other. They both serve the same purpose. And so His Lordship embraces the Sabbath institution, embraces it too for the purpose of preserving it, confirming it and blessing it. He is Lord of the Sabbath too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fourth Commandment According to the Westminster Standards in The Calvin Forum</cite></span></figcaption>

</figure><figure class="quote" id="q-792cfe5dde" data-kw="">
<blockquote><p>What shall it profit a man, if he gain the whole world, and lose his own soul? said our Saviour, who was to lay down a ransom for it, and knew well that it would cost infinitely more than the world was worth. Yet, the most of men value their own souls at a far lower rate than the whole world, losing them for broken morsels of it: yea, many times for vain hopes that are never accomplished. And as these men make a miserable bargain, so on the contrary, they that lose the world, or any thing worldly, yea, though it were the whole, to save their souls, make a profitable loss of it.

Nature teaches men to hazard and lose all for the life of the body rather than lose it, (although it proves many times very uncomfortable by the loss of these outward things,) and yet, the most part of men pass their whole life-time without one serious thought of the excellency and importance of their souls, whose life and happiness is of a higher nature, and neither consists in, nor depends upon, any thing here below. Hence it is, that while they use the helps of this present life, and the defences of it when it is in danger, and use them with so much diligence and attention, the means of that better life of their better part, their souls, they either use not at all, or so slightly and coldly that they never find salvation in them.

You may find it some way in yourselves: the threatenings and preparations of men against you, have awakened and roused you more to think upon means of your temporal safety; but how few are sensible and afraid of the wrath of God, who, as our Saviour tells us, can kill both body and soul, and cast them into hell! You want not frequent advertisement from the word of God, so plentifully preached, that many are perishing, one part in gross ignorance of God, another in profane and licentious living, and the greatest part in a formal and lifeless profession of religion, without the power of it; and yet, where are they who lay it to heart, and bestir themselves to rescue their souls from destruction?

Certainly, whatsoever men profess, it is unbelief that is the cause of impenitence. Men are not convinced of the purity of God’s nature, nor sensible of the impurity of their own; therefore they apply not themselves in good earnest to the work of repentance, and to reformation, the liveliest part of it. Labour, then, for a more active and practical knowledge of God and Divine truths, such as may humble and renew your souls; not only that you may be delivered from outward troubles that threaten you, but much more, that you may escape the wrath to come.

And because neither the word preached, nor judgments, nor mercies that are set before you, are sufficient to quicken a dead soul, or soften a hard heart, without the effectual concurrence of the Spirit of God, let us have recour.se to the throne of grace, by humble and earnest prayer, in the name and mediation of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 93-94.</span></figcaption>

</figure><figure class="quote" id="q-3bd4952534" data-kw="">
<blockquote><p>But how can we imagine that many thousands [of Jerusalem Christians] could in one meeting communicate at one Table in the Lord’s Supper, and that ordinarily? 1. What voice could reach to so many thousands, as they did grow unto?… 3. Can we believe that seeing congregational meetings of fewer, and that in private houses, was less obnoxious to the indignation of authority, than meeting in the Temple, as is most evident, Acts 4:1-2; and seeing [that] the apostles had liberty to meet, Acts 5:26, [can we believe] that they would draw the first mold of the Christian visible-Church after the pattern of a convention [i.e. all gathering unto one place] most unfit, yea impossible for attaining the intended end, to wit, edification, especially not being compelled thereunto by an extrinsical necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, p. 428</span></figcaption>

<blockquote><p>Frequent the windows of his ordinances, both the more secret and retired windows of prayer and meditation, reading, fasting, Christian conference; and these that are more solemn and public, such as word and sacrament, when you can have access: for there it is that Christ feeds his doves, and gives them interviews with himself; and when the public windows are shut, or defiled, or haunted with foxes or birds of prey, that fright, scatter, or tear the doves, be the more frequently resorting to the more private or secret windows, &amp;c.</p></blockquote>

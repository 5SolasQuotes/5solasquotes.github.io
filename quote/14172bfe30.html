<blockquote><p>…for you lay down as an undeniable principle, and the basis of your whole doctrine of independent government that there are no visible Churches in the world but a congregation meeting in one place to worship God, which I have demonstrated to be most false… so, though a congregation may only be actually seen when it is convened within the four angles of a material house, yet all the congregations on earth make one visible Church, and have some visible and audible acts of external government common to all, as that all pray, praise, fast, mourn, rejoice, one with another; and are to rebuke, exhort, comfort one another and to censure one another, so far as is possible, and of right and by law meet in one council, and so by Christ’s institution are that way visible, that a single congegation is visible which meets in one house, though many be absent de facto, through sickness, callings, imprisonment and some through sinful neglect;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, p. 95</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d23af0379e" data-kw="">
<blockquote><p>28. Ministers with their families ought to be maintained with honest and liberal stipends. We also believe that the church cannot well be governed unless such necessary maintenance be bestowed on the ministers as whereby they and their family may live in an honest estate; For no man, except he have whereupon to live (Mt. 10:10), can do his duty; and Christ says, “the workman is worthy of his wages” and the apostle writes largely thereof in more than one place (1 Cor. 9:7 etc.) showing by many reasons that ministers which serve the churches ought to receive of the same church what so is needful for them: (1 Tim. 5:17 etc.) and that they have good right to demand the same: so far from offence is it, that they should take it, as some would cavil: yet notwithstanding covetousness, as well in all other as chiefly in ministers we do with the apostle utterly condemn: (1 Tim. 3:3,8) as also we allow not prodigality: and we teach that both these faults are to be shunned and avoided.

29. The church goods should not be wasted, but be bestowed on the maintenance of ministers, and other godly uses. And whereas many goods have in times past, and yet in some places are given to churches, by the liberality of princes and other godly persons: we judge that if any church have such goods, great care is to be had that the same be not wasted nor converted into profane uses, and much less into sacriligious uses, nor feigned to be so converted: but to be only bestowed upon that purpose whereto they were given, even to a godly intent. And we well allow of that ancient partition of church goods, where one part went to the bishops, that is, to the teachers, (Deu[…] […]) and ministers of the Word and their families; another to the clerks, that is to students and such as were ordained to the ministry of the church and to them that attended on the church: the third part to poor people and travelers: a fourth part to repairing of churches and schools, to which part also, belong not only the houses of ministers, teachers, students, libraries and books, all kinds of instruments and things necessary for churches and schools: but also spittles and hospitals and other such like places, where such live as are peculiarly to be relieved and cared for of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Body of Christian Religion</cite>, (d. 1590; London, 1659)</span></figcaption>

<blockquote><p>XV…

1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others.

2. It is also a support for fellowship and an indication of charity.

3. And it should be done especially for the Holy Church, devout families, and individual believers.</p></blockquote>

</figure><figure class="quote" id="q-ee7f641456" data-kw="">
<blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>

<blockquote><p>7. Unto the pastor only appertains the administration of the sacraments, in like manner as the administration of the word; for both are appointed by God as means to teach us, the one by the ear, and the other by the eyes and other senses, that by both knowledge may be transferred to the mind.

8. It appertains, **by the same reason**, to the pastor to pray for the people, and namely for the flock committed to his charge; **and to bless them in the name of the Lord,** who will not suffer the blessings of his faithful servants to be frustrated.</p></blockquote>

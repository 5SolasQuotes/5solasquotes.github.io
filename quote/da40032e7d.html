<blockquote><p>Mere head knowledge of these virtues of faith, hope, and love is worthless; these virtues must be earnestly put into practice. The kingdom of God is not just a matter of talk but of power (1 Cor. 4:20). Thus, we should not be satisfied with merely knowing the virtues we have so far discussed but should endeavour to exercise them so that they are manifest in our actions. Likewise, someone is not justified because he can eloquently describe the doctrine of justification, but because he persistently proves his faith by his good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/godefridus-udemans.html">Godefridus Udemans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Faith, Hope, and Love</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke (1621; Grand Rapids MI: Reformation Heritage Books, 2012), p. 36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-956d6b5e84" data-kw="">
<blockquote><p>First, there is no greater freedom under heaven. It is as great as the suffering and most powerful resurrection of Christ, by which we have been called into freedom. It is the greatest freedom in heaven and earth because the sacrifice of the Son surpasses heaven and earth and remains valid in eternity, so that the devil cannot attack us any more. Similarly, the slavery of a Christian is greater than any other slavery, except that it is a slavery not to the bad but to the good and is motivated by a free conscience. After all, who was a greater slave than Christ, who became the servant of his enemies and even washed the feet of Judas? Thus a Christian must do good even to his enemies and opponents, as Christ said: “You too must wash one another’s feet.”

If Christ suffered the vilest things for you and took your shame on himself, for he took your sins and crimes on him as if he were the one who had committed them and he suffered the pains of eternal damnation for you. As it is said, “He tasted death for us all,” and now Christ has placed our brothers and neighbours in his place, so I ask you, what is so awful about serving Christ and your brothers, at his command? Philippians 2 exhorts us to serve our neighbours by following the example of Christ. In fact, we are not just slaves; we are the garbage and filth of the world, just as Christ was rejected for our sake and considered to be the filth of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Divi Pauli Apostoli ad Galatas Notae ex Concionibus Gasparis Oleviani Excerptae, et a Theodoro Beza Editae</cite>, (Geneva: Eustache Vignon, 1578). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 187.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-ff3b9cf688" data-kw="">
<blockquote><p>What compelled people may do to redeem their lives, with loss of liberty, is nothing to the point… and that they may sell the liberty of their posterity, not yet born, is utterly denied as unlawful; yea, a violentated father to me is a father, and not a father, and the posterity may vindicate their own liberty given away unjustly before they were born, Qua omne regnum vi partum potest vi dissolvi.</p></blockquote>

</figure><figure class="quote" id="q-a5d26390b3" data-kw="">
<blockquote><p>Now, you have heard what usury is, and of what it is derived; you shall hear the unlawfulness of it.

First, It is against the law of charity, because charity biddeth us to give every man his own, and to require no more than our own; but usury requireth more than our own, and gives not to other their own. Charity rejoiceth to communicate her goods to other, and usury rejoiceth to gather other men’s goods to herself.

Secondly, It is against the law of nations; for every nation hath some law against usury, and some restraints against usurers, as you shall hear when we speak of the punishment.

Thirdly, As it is against the law of nations, so it is against the law of nature; that is, the natural compassion which should be amongst men. You see a river when it goeth by an empty place, it will not pass until it hath filled that empty place, and then it goeth forward to another empty place, and filleth it; and so to another place, and filleth it; always filling the places which are empty. So should we; the rich should fill the poor, the full should fill the hungry, they which abound should fill them which want; for the rich are but God’s almoners, and their riches are committed to them of God, to distribute and do good, as God doth himself.

As the water is charitable after a sort, so is the air; for it goeth into empty places too, and filleth them as the water doth. Nature cannot abide that any place should be empty; and therefore the air, though it be a light body, and so naturally ascendeth upward, yet rather than any place in the earth should be empty, the air will descend (as it were) from his throne, and go into caves, into dens, and into dungeons, to fill them.

If the rich were so good to their empty brethren as the air and water are to other empty things; as there is no empty place in the world, so there should be no empty person in the world; that is, the rich in Israel would fill the poor in Israel. But the rich make the poor to fill them; for usurers feed upon the poor, even as great fishes devour the small. Therefore he which said, ‘Let there not be a beggar in Israel, Deut. xv.4, said too, Let there not be an usurer in Israel. For if there be usurers in Israel there will be beggars in Israel; for usurers make beggars, even as lawyers make quarrellers.

Fourthly, It is against the law of God. First, It is forbidden in Exod. xxii. 25, where it is said, ‘If thou lend money unto my people, that is, to the poor with thee, thou shalt not oppress them with usury.’ Here is usury called oppression; therefore if oppression be a sin, usury is a sin too. Secondly, It is forbidden, Lev. xxv. 37, where it is said, ‘Thou shalt not give thy money to usury, nor lend thy victuals for increase.” Here you may see that men may be usurers of victuals and other things, as well as of money. Thirdly, It is forbidden in Deut. xxiii. 19, where it is said, ‘Thou shalt not lend unto thy brother upon usury.’

And lest you should say that he meaneth but one kind of usury, he sheweth that he meaneth all kinds of usury; for after, in the 19th verse he saith, ‘As usury of money, usury of victuals, usury of corn, or usury of anything that is given to usury;’ because some are no usurers of money, but some are usurers of victuals, some are usurers of cloth, some are usurers of corn, some are usurers of wine, some are usurers of oil, and some of one thing, and some of another; and none would be counted usurers but they which lend money unto usury; therefore God forbiddeth so precisely usury of anything, shewing that all usury is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Examination of Usury. In Two Sermons</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 91-92.</span></figcaption>

+it+were%29+from+his+throne%2C+and+go+into+caves%2C+into+dens%2C+and+into+dungeons%2C+to+fill+them.%0A%0AIf+the+rich+were+so+good+to+their+empty+brethren+as+the+air+and+water+are+to+other+empty+things%3B+as+there+is+no+empty+place+in+the+world%2C+so+there+should+be+no+empty+person+in+the+world%3B+that+is%2C+the+rich+in+Israel+would+fill+the+poor+in+Israel.+But+the+rich+make+the+poor+to+fill+them%3B+for+usurers+feed+upon+the+poor%2C+even+as+great+fishes+devour+the+small.+Therefore+he+which+said%2C+%E2%80%98Let+there+not+be+a+beggar+in+Israel%2C+Deut.+xv.4%2C+said+too%2C+Let+there+not+be+an+usurer+in+Israel.+For+if+there+be+usurers+in+Israel+there+will+be+beggars+in+Israel%3B+for+usurers+make+beggars%2C+even+as+lawyers+make+quarrellers.%0A%0AFourthly%2C+It+is+against+the+law+of+God.+First%2C+It+is+forbidden+in+Exod.+xxii.+25%2C+where+it+is+said%2C+%E2%80%98If+thou+lend+money+unto+my+people%2C+that+is%2C+to+the+poor+with+thee%2C+thou+shalt+not+oppress+them+with+usury.%E2%80%99+Here+is+usury+called+oppression%3B+therefore+if+oppression+be+a+sin%2C+usury+is+a+sin+too.+Secondly%2C+It+is+forbidden%2C+Lev.+xxv.+37%2C+where+it+is+said%2C+%E2%80%98Thou+shalt+not+give+thy+money+to+usury%2C+nor+lend+thy+victuals+for+increase.%E2%80%9D+Here+you+may+see+that+men+may+be+usurers+of+victuals+and+other+things%2C+as+well+as+of+money.+Thirdly%2C+It+is+forbidden+in+Deut.+xxiii.+19%2C+where+it+is+said%2C+%E2%80%98Thou+shalt+not+lend+unto+thy+brother+upon+usury.%E2%80%99%0A%0AAnd+lest+you+should+say+that+he+meaneth+but+one+kind+of+usury%2C+he+sheweth+that+he+meaneth+all+kinds+of+usury%3B+for+after%2C+in+the+19th+verse+he+saith%2C+%E2%80%98As+usury+of+money%2C+usury+of+victuals%2C+usury+of+corn%2C+or+usury+of+anything+that+is+given+to+usury%3B%E2%80%99+because+some+are+no+usurers+of+money%2C+but+some+are+usurers+of+victuals%2C+some+are+usurers+of+cloth%2C+some+are+usurers+of+corn%2C+some+are+usurers+of+wine%2C+some+are+usurers+of+oil%2C+and+some+of+one+thing%2C+and+some+of+another%3B+and+none+would+be+counted+usurers+but+they+which+lend+money+unto+usury%3B+therefore+God+forbiddeth+so+precisely+usury+of+anything%2C+shewing+that+all+usury+is+unlawful.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+The+Examination+of+Usury.+In+Two+Sermons%2C+%281591%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+1%3A+91-92.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa5d26390b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a5d26390b3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/20/henry-smith-on-usury-and-oppression/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Writing to Thomas Houston of the Reformed Presbyterian Church of Ireland in 1847, the Revd David Scott and another American Covenanter bemoaned the fact that so many churches compromised by not disciplining slaveholders or testifying against a proslavery constitution:

Rev. and Dear Sir,

[…] In regard to the state of things around us […] the disregard of the rights of man by the larger denominations in this country, none of which maintains a faithful testimony against the sin of slaveholding, or puts any restraint upon their members voting under a slaveholding Constitution, and most of which admit without question slave holders to the enjoyment of church privileges […] Others are not so discouraged but are assured that our cause will ultimately triumph.

[We are not] entirely devoid of encouragement in the condition of things around us. The evils of the Constitution, particularly as a pro-slaveholding instrument, are becoming more and more manifest […]</p></blockquote>

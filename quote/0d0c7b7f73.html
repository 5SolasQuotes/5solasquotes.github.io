<main class="wrap"><figure class="quote" id="q-0d0c7b7f73" data-kw="">
<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all or most Churches, and so on the catholic Church, yet it properly respected neighbour Churches, either, which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered; acquainting one another with their affairs, so far as it was of any advantage: admitting the members of other Churches to communion with them, on occasion, refusing communion with such members of other Churches as were by them excommunicated. And this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shunned by them who so joined in another Church, or denied to such sojourners if they desired it: or, when one Church showed rage, fury and bitterness against another because of what they differed about [though it was non-fundamental].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., pp. 251-52</span></figcaption>

<blockquote><p>Whether both the symbols of bread and wine are to be administered? It is affirmed. Whether usual and truly ordinary bread [is to be used]? It is affirmed. … What in place of wine ought to be administered where wine may not be had? What is analogous. Of what kind [is to be administered to] those that abstain from the supper? The same [as the previous answer]. Whether water ought to be mixed with the wine? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations</cite>, … (Utrecht, 1643), 2nd Section, ‘Of Redemption’, Tract 5, ‘Of Signs’, Title VII, ‘Of the Sacraments’, subtitle 5, ‘Of the Lord’s Supper’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-293341cf5f" data-kw="">
<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>

</figure><figure class="quote" id="q-c07368275b" data-kw="">
<blockquote><p>…let them who commend them [dances] to the Church, see where those sober and modest dances which they speak of can find any place: and to those that expound choreas ducere [to conduct dances], only of lascivious dances, we will in a form of speech commodious enough interpret these dances to be meant of all dancings whatsoever: otherwise St. Cyprian had not affirmed that David danced before God, unless any should think that the Blessed [Peter] Martyr (which never came into his mind) would brand the royal prophet with a mark of lascivious and obscene dancing. And if there be any that think that dancing be sober and modest, they are at their liberty for me to abound in their own sense: at least, with Octavius, that good defender of the Christian religion, and other lights of Reformed Christianity, it seems meet for me to repute them as obscene and evil pleasures. Lastly, let the patrons of those dances which they call sober…</p></blockquote>

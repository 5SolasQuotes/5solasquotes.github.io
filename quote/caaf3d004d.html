<main class="wrap"><figure class="quote" id="q-caaf3d004d" data-kw="">
<blockquote><p>But if by ‘the Author of Sin’, is meant the Permitter, or not a Hinderer of Sin; and at the same time, a Disposer of the State of Events, in such a manner, for wise, holy and most excellent ends and purposes, that sin, if it be permitted or not hindered, will most certainly and infallibly follow: I say, if this be all that is meant, by being the Author of Sin, I don’t deny that God is the Author of Sin… And I don’t deny, that God’s being thus the Author of Sin, follows from what I have laid down…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Careful &amp; Strict Inquiry into the Modern Prevailing Notions of that Freedom of Will... 4th ed. (Wilmington, DE: James Adams, 1790), pt. 4, section 9</cite>, p. 254</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>

— Johannes Piscator, Aphorisms of Christian Doctrine, Locus 6, aph. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+God+by+his+providence+governs+even+sins%2C+yet+he+is+not+the+cause+or+author+of+sin%3A+because+he+takes+no+delight+in+sin%2C+but+rather+abhors+it%3B+nor+does+he+himself+sin%2C+or+can+he+sin%3B+likewise+because+he+neither+commands+nor+persuades+sin%3B+nor+does+he+pour+malice+into+those+who+sin%2C+nor+compel+them+to+sin%3B+and+moreover+he+directs+all+things+to+a+good+end.%E2%80%9D%0A%0A%E2%80%94+Johannes+Piscator%2C+Aphorisms+of+Christian+Doctrine%2C+Locus+6%2C+aph.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4b8c25085e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4b8c25085e.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-bc72ee2b84" data-kw="Permission Author of sin">
<blockquote><p>Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

</figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</span></figcaption>

</figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 5.4</span></figcaption>

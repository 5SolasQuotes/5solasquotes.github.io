<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36. 535. Leigh, Treatise, II.xiii (p. 100). 536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 572</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>III. God tells us, that sinners will their death, ‘Why will ye die,’ saith God, — The way which sinners take is the way of death, and it is their voluntary choice, they are not force’t to it by God, and neither are they drag’d to by the Devil — but it is their free will &amp; act— Adam acted voluntarily in what he did — IV. God expressly tells us in our text and context, that He has no pleasure in the death of a sinner, but yt [that] he turn and live — God wills the life and eternal salvation of poor sinners turn ye turn ye for why will ye die — God is sincere, hearty, and earnest in his will, it is plainly to be seen and understood by word, which is his revealed will to the children,— in particular his amazing will to save sinners is to be discovered in his sending his dearly beloved and only begotten Son into this world in amazing manner as He did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samson-occom.html">Samson Occom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on Ezekiel 33:11’</cite>, (1765)</span></figcaption>

</figure><figure class="quote" id="q-57a78890f2" data-kw="">
<blockquote><p>Now although the nature of God be marvellously one and simple, so it is that according to our manner of conception, we distinguish his virtues and properties from his essence. Concerning his properties, we conceive them under very different respects, and pretend not when we say that he is merciful, to beget an apprehension in the minds of those that hear us, that He is just, or when we say that He is wise, to give occasion to think of his power and might, as his attributes have very different objects, so we comprehend them in our understandings under very different ideas: But then when we speak of his essence, we make a kind of abstraction of it from his properties, and represent it as a single and simple thing, in which all his attributes exist as in a common subject. As to what concerns his attributes, we see them in some sort in this life, in that we understand at least in some degree what is the nature of those operations by which they display themselves upon their objects. For we are not perfectly ignorant what may be that inclination in God of pardoning sins to the penitent, and punishing the obstinate and impenitent and things of like nature. But as to his essence, there is no man that does not acknowledge that we understand it not at all in this life; that is to say, we are not able to form any conception in our minds which has any respect to the nature of his essence, only some think that when we shall be received into the heavens, our supreme happiness will consist in the vision of this essence, which certainly seems extremely difficult to be imagined…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evidence of Things Not Seen, or Diverse Scriptural &amp; Philosophical Discourses concerning the State of Good &amp; Holy Men after Death</cite>, ... (d. 1664; London: Cockerill, 1700), 4th Discourse, Concerning the Happiness of Believers after the Resurrection, pp. 172-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-c387c9c582" data-kw="">
<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jonah</cite>, ch. 4, verse 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Question 13. But how may it appear that He is willing to receive me? Answer: Make trial of Him thyself. If thou didst but know his heart to poor sinners, you would not question it. Believe what He says in the gospel; there thou shalt find that He is a willing Savior; for therein thou hast: First, his most serious invitations, Mt. 11:28, “Come unto Me, ye that are weary and heavy laden.” Isa. 55:1, “Ho! every one that thirsteth come ye to the waters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Flavel</cite>, 6 vols. (d. 1691; London: Baynes &amp; Son, 1820) | vol. 5, “A Sober Consideration of the Sin of Drunkenness”, p. 337</span></figcaption>

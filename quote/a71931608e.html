<main class="wrap"><figure class="quote" id="q-a71931608e" data-kw="">
<blockquote><p>Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-mather.html">Richard Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechisme, or the Grounds &amp; Principles of Christian Religion</cite>, … (1650), ch. 32, ‘Of the life that beievers ought to live in the world, and of the Law of God’, pp. 114-16 Mather was a congregationalist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-73ce228bfb" data-kw="">
<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions n.d</cite>, ch. 12, ‘Whether a Sound Heart and an Unsound Head can Consist Together? and Vice Versa; or, Whether Truth and Holiness be not Insepararable Companions?’ in Works, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-f600721bf9" data-kw="">
<blockquote><p>The exceeding great bitterness of the continued and increasing sad distractions amongst the people of God to the hindrance of their edification in faith and a godly life with charity and peace amongst themselves should put all the ministers of Christ to most serious thoughts in considering how far they may under the present dispensations of God, without sin, accommodate in following unquestionable duties with and under the established government of the Church. And although as to a cordial allowance of the present change they cannot yet attain, something remaining, whether of scruple or affection, which makes it unpleasing, and their concurrence with it, to lie heavy upon their spirits, yet if there be found no manifest transgression in concurring under the same, in matters of unquestionable duty, they would wisely put difference between gravamen spiritus [heaviness of spirit] and ligamen conscientiae [a tie of conscience]: something in the will that renders them averse, and [differenced from] the prevailing clear light of a well-informed conscience (to which, how uneasy it is to attain in this point of controversy, they can tell who have truly tried it) binding them up from concurrence, as a thing in itself unlawful. Men who walk in the fear of God and are zealous of His honor had need to be very jealous of their own zeal, that it carry them not to the rejecting of a real duty, which (to their apprehension) sits too near a sin… It is their duty to advert, lest, at this time too great animosity contribute to the laying of the foundation of a woeful division to be entailed to the generations to come, the evil whereof will preponder all the good that any one form of Church-government can, of itself, produce, viz. the dishonor of God, the weakening of the cause of the true protestant religion against the common adversaries thereof, the destroying of true charity and love amongst the people of God, the hinderance of their profiting under the several ministries they live under, and the creating continual confusions and distractions in the commonwealth (the ordinary fruit of schism in the Church) as too lamentable experience (whereof we carry the sad marks to this day) has taught us. 1. That there may and ought to be a brotherly accommodation and concurrence in matters of practice which are undoubted duty (albeit brethren be of different judgments anent the constitution of meetings or capacity of persons that act in these duties), grave and learned men have put it out of question. It is well known that in the [Westminster] Assembly of Divines at London, accommodation was mainly labored for (and far carried on) between presbyterians and independents, that they might concur in common actings for regulating the Church, with a reserve of liberty of their own several principles… Also, several of the most eminent presbyterians in England, as Mr. [Richard] Vines, Mr. [Richard] Baxter and others, accounting of un-preaching [ruling] elders, as of a human device (as now the office of a bishop is accounted of by many brethren), yet, not being able to attain to the exercise of presbyterial government without the intermixture of these; yea, of them, double the number to preaching presbyters in each meeting (which gave them an overswaying power in the government), notwithstanding they did concur with them in matters of unquestionable duty. Is it not also well known that amongst ourselves in this [Scottish] Church, [Resolutioner] brethren did ordinarily concur in synods and presbyteries, in doing their duties with these [the Protesters] whom they charged with a sinful schism? (a thing as much against the [Solemn League and] Covenant [1643], as that which is now pretended for withdrawing from the meetings of synods and presbyteries)… it is affirmed that they homologate with the tenet and practice of Separatism, denying the lawfulness of concurrence in a lawful necessary duty because of the personal sin of fellow-actors in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom</cite>, (Edinburgh: Tyler, 1662) 45 pp.</span></figcaption>

l+whereof+will+preponder+all+the+good+that+any+one+form+of+Church-government+can%2C+of+itself%2C+produce%2C+viz.+the+dishonor+of+God%2C+the+weakening+of+the+cause+of+the+true+protestant+religion+against+the+common+adversaries+thereof%2C+the+destroying+of+true+charity+and+love+amongst+the+people+of+God%2C+the+hinderance+of+their+profiting+under+the+several+ministries+they+live+under%2C+and+the+creating+continual+confusions+and+distractions+in+the+commonwealth+%28the+ordinary+fruit+of+schism+in+the+Church%29+as+too+lamentable+experience+%28whereof+we+carry+the+sad+marks+to+this+day%29+has+taught+us.+1.+That+there+may+and+ought+to+be+a+brotherly+accommodation+and+concurrence+in+matters+of+practice+which+are+undoubted+duty+%28albeit+brethren+be+of+different+judgments+anent+the+constitution+of+meetings+or+capacity+of+persons+that+act+in+these+duties%29%2C+grave+and+learned+men+have+put+it+out+of+question.+It+is+well+known+that+in+the+%5BWestminster%5D+Assembly+of+Divines+at+London%2C+accommodation+was+mainly+labored+for+%28and+far+carried+on%29+between+presbyterians+and+independents%2C+that+they+might+concur+in+common+actings+for+regulating+the+Church%2C+with+a+reserve+of+liberty+of+their+own+several+principles%E2%80%A6+Also%2C+several+of+the+most+eminent+presbyterians+in+England%2C+as+Mr.+%5BRichard%5D+Vines%2C+Mr.+%5BRichard%5D+Baxter+and+others%2C+accounting+of+un-preaching+%5Bruling%5D+elders%2C+as+of+a+human+device+%28as+now+the+office+of+a+bishop+is+accounted+of+by+many+brethren%29%2C+yet%2C+not+being+able+to+attain+to+the+exercise+of+presbyterial+government+without+the+intermixture+of+these%3B+yea%2C+of+them%2C+double+the+number+to+preaching+presbyters+in+each+meeting+%28which+gave+them+an+overswaying+power+in+the+government%29%2C+notwithstanding+they+did+concur+with+them+in+matters+of+unquestionable+duty.+Is+it+not+also+well+known+that+amongst+ourselves+in+this+%5BScottish%5D+Church%2C+%5BResolutioner%5D+brethren+did+ordinarily+concur+in+synods+and+presbyteries%2C+in+doing+their+duties+with+these+%5Bthe+Protesters%5D+whom+they+charged+with+a+sinful+schism%3F+%28a+thing+as+much+against+the+%5BSolemn+League+and%5D+Covenant+%5B1643%5D%2C+as+that+which+is+now+pretended+for+withdrawing+from+the+meetings+of+synods+and+presbyteries%29%E2%80%A6+it+is+affirmed+that+they+homologate+with+the+tenet+and+practice+of+Separatism%2C+denying+the+lawfulness+of+concurrence+in+a+lawful+necessary+duty+because+of+the+personal+sin+of+fellow-actors+in+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Andrew+Honyman%2C+The+Seasonable+Case+of+Submission+to+the+Church-Government+as+now+Re-established+by+Law%2C+briefly+stated+and+determined+by+a+Lover+of+the+Peace+of+this+Church+%26+Kingdom+%28Edinburgh%3A+Tyler%2C+1662%29+45+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff600721bf9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f600721bf9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=The%20exceeding%20great%20bitterness%20of%20the,personal%20sin%20of%20fellow%2Dactors%20in%20it&amp;text=The%20exceeding%20great%20bitterness%20of%20the%20continued%20and&amp;text=of%20the%20personal%20sin%20of%20fellow%2Dactors%20in%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

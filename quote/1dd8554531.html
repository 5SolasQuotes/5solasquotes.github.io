<main class="wrap"><figure class="quote" id="q-1dd8554531" data-kw="">
<blockquote><p>The necessity and contingency of things is not to be attributed to God’s decree, but to the working of his power; contingency is when He uses his resistible power; if He works irresistibly then follows necessity: what is contingent to the second cause is infallible to God’s prescience, but necessary to the work of his omnipotency: his decree is a remote cause, which without his power works not. Christ’s death was contingent to the Jews that crucified Him; infallible to God’s prescience, who foresaw that the Jews would kill Him; but necessary in regard of his decree, working by his power in presenting that bitter cup unto Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination &amp; its Adjuncts... (London: 1646), sect. 25</cite>, pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb46224f48" data-kw="">
<blockquote><p>2… But here we must distinguish between effectual calling, which always takes place and none can hinder it, and calling not effectual, yet sufficient if men did not put in a bar by their own hardness of heart: God’s absolute will then is not resisted when men come not to repentance: for his will is to leave such to themselves by his just judgment: and not to give them of his effectual grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Six-fold Commentary upon Romans (Cambridge: Legge, 1611), on Rom. 2, 3. Questions, Question 7, ‘Whether the leading of men to repentance by God’s long sufferance argues that they are not reprobate’</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-711e7bc10b" data-kw="">
<blockquote><p>The proposition is universal, as to the modification of the subject, “all;” but in the word “of them,” it is restrained unto those alone with whom this covenant is made. […] But whereas it is the internal, effectual grace of the covenant, and not only the means, but the infallible event thereon, —not only that they shall be all taught to know, but that they shall all actually know the Lord, — all individuals are intended; that is, that whole church all whose children are to be taught of God, and so to learn as to come unto him by saving faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:11; Works, vol. 22, p. 202</span></figcaption>

</figure><figure class="quote" id="q-3064123999" data-kw="">
<blockquote><p>Wherefore, whosoever in the preaching of the Gospel, are charged and commanded to repent, to believe in Christ, or turn unto God, they are commanded also to use all these external means [“hear a Sermon preached, to read the Scripture, to be informed by Catechizing, and conference of Religion…”] whereby they may be informed of the duty required, and of the means leading thereunto; in the exercise of which external means, they may meet with sundry common operations and effects of God’s Spirit, before they be regenerate or converted, whereof the use may be sound not only in, but also after, conversion; And if any man shall refuse, slight or neglect to follow these preparatory exercises, which may prepare him for conversion, he is inexcusable before God and man, and guilty of rejecting of the offer of reconciliation, yea guilty of resisting of the Holy Ghost, of which sin and guiltiness the holy martyr Stephen charges the misbelieving Jews, 8. As for the regenerate man, he it is who in the acknowledgement of his sinfulness and deserved misery, and of his utter inability to help himself, does cast away all confidence in his own parts, and possible righteousness of his own works, and flees to Christ offered in the Gospel…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/therapeutica-sacra.html">Therapeutica Sacra</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, Chapter 3</cite></span></figcaption>

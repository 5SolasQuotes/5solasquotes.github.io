<main class="wrap"><figure class="quote" id="q-5323c4e91a" data-kw="">
<blockquote><p>…in favor of the baptism of infant servants, from the cessation of the Jewish Church to the times of Augustine, we can only say that Augustine speaks of it as a custom in existence; that it resulted, in his day, from the conviction that baptism came in place of circumcision, a conviction which we can trace up through the earliest fathers… …we commend the resolutions of the Synod of South Carolina… ‘1. Resolved, That it is the duty of believing masters to train up their servants, as well as their children, in the nurture and admonition of the Lord. 2. Resolved, That the principles of the Abrahamic covenant, as to the cirucmcision of servants, is till in force in reference to the infant offspring of those who stand to us in this relation; and that as baptism succeeds to circumcision, it is the duty of masters to dedicate such servants to God in the ordinance of baptism, and to do all in their power to train them up in a knowledge of the truth and in the way of salvation through Christ. 3. Resolved, That though there are great and manifest dificulties in carrying out the principles of these resolutions, these difficulties have chiefly resulted from the long continued neglect of believing masters and of the church, and that these difficulties must be gradually overcome by continued and persevering efforts.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-howe.html">George Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 3, ‘The Baptism of Servants’ in Southern Presbyterian Review, no. 1 (June 1847)</cite>, pp. 63-102</span></figcaption>

</figure><figure class="quote" id="q-a24a7153fd" data-kw="">
<blockquote><p>LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church</cite>, p. 435 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>1. In the controversy upon the perseverance or falling away of believers or saints, the question relates to that faith or sanctifying grace which may be received, exercised, retained, or rejected only through the medium, or some exercise of, free will [i.e. in adults].</p></blockquote>

</figure><figure class="quote" id="q-5fe0fc1c30" data-kw="">
<blockquote><p>As for infants, their case is of a peculiar consideration, God by his Spirit supplying what is wanting [lacking] through the imbecility of their age; and hence the Spirit working semen fidei [a seed of faith], and apprehending them, though they cannot apprehend Christ; I question not their union to Christ, and the imputation of his righteousnesse to their justification; but we speak now de adultis [of adults], that none that are of years sufficient are justified without actual faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cca077ef66" data-kw="Hardening|Depravity" data-pol="">
<blockquote><p>Suitably upon the will and affections he hath several acts, -- obfirming the one in corruption, and giving up the other to vileness, Rom. 1:24, 26, until the heart become thoroughly hardened, and the conscience seared; not forcing the one, but leaving it to follow the judgment of practical reason, -- which being a blind, yea, a blinded guide, whither can it lead a blind follower, but into the ditch? -- not defiling the other with infused sensuality, but provoking them to act according to inbred, native corruption, and by suffering frequent vile actings to confirm them in ways of vileness.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Righteous Zeal Encouraged by Divine Protection</cite>, sermon on Jer. 15:19–20</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-276fa7e7b7" data-kw="Hardening|Original Sin|Depravity" data-pol="">
<blockquote><p>Thus God is said to harden men, not by positive hardening, or working anything in the creature, but by not working, not softening, leaving a man to the hardness of his own heart, whereby it is unavoidable, by the depravation of man’s nature, and the fury of his passions, but that he should be further hardened. … If you put fire near to wax or resin, both will melt; but when the fire is removed, they return to their natural quality of hardness and brittleness. The positive act of the fire is to melt and soften, and the softness of the rosin is to be ascribed to that, but the hardness is from the resin itself, wherein the fire hath no influence, but only a negative act by a removal of it; so when God hardens a man, he only leaves him to that stony heart which he derived from Adam, and brought with him into the world.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption>

</figure><figure class="quote" id="q-2c9dc6be06" data-kw="Hardening|Depravity|Author of sin|Reprobation" data-pol="">
<blockquote><p>God hardens some men&#x27;s hearts, as he did Pharaoh&#x27;s, and he wills to harden them, or he hardens them according to his decreeing will; &quot;Whom he will he hardens&quot;, (Romans 9:18) this he does not by any positive act, by infusing hardness and blindness into the hearts of men; which is contrary to his purity and holiness, and would make him the author of sin; but by leaving men to their natural blindness and hardness of heart; for the understanding is naturally darkened; and there is a natural blindness, hardness, and callousness of heart, through the corruption of nature, and which is increased by habits of sinning.</p></blockquote>
<figcaption>— <a href="../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 2, ch. 3 (Of the Decrees of Rejection)</figcaption>

</figure><figure class="quote" id="q-dda3160a8c" data-kw="Hardening|Free Will|Justice" data-pol="">
<blockquote><p>For in those people God did not make the common sins but found them there, as we have noted before. And although God, in his just but to us hidden judgment, does abandon and harden them more and more (Romans 9:18), yet it is they who by their own free choice first become hardened (Romans 11:7) and abandon the benefits of general providence; they abuse God’s longsuffering, as Paul testifies in Romans 1:18, 26, and 28.</p></blockquote>
<figcaption>— <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a>, <cite>Synopsis of a Purer Theology (Leiden Synopsis)</cite>, Disp. 24, On Divine Predestination</figcaption>

</figure><figure class="quote" id="q-5ef3f2a919" data-kw="Hardening|Holy Spirit" data-pol="">
<blockquote><p>When his light is taken away, nothing remains but blindness and darkness: when his Spirit is taken away, our hearts become hard as stones: when his guidance is withdrawn, we immediately turn from the right path: and hence he is properly said to incline, harden, and blind those whom he deprives of the faculty of seeing, obeying, and rightly executing.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.4.3</figcaption>

<main class="wrap"><figure class="quote" id="q-13867aee89" data-kw="">
<blockquote><p>1. That no human engagements are or ought to be binding to the conscience of those that take them further than the meaning of those that give them is declared and assented unto by the taker.

2. That no engagements whereof the meaning is declared ought to be further binding to the conscience than the intent declared is lawful and allowable in the presence of God.

3. That the intents of no engagements amongst men can be further lawful and allowable in the presence of God than as they are subordinate unto the main rules of our Christian profession and to the principles of natural equity in human societies, whence this corollary will follow: That if upon unforeseen accidents and emergences (which alter the nature of all human affairs) one and the same intent and design may be at one time agreeable to these rules and principles, and at another time become disagreeable thereunto: then that intent and design not only may, but must be laid down; for it is wholly unlawful to maintain any purposes which cease the practice or the profession of duties flowing from these rules and principles.

4. That the intents and designs of the Oath of Allegiance [to Charles I, who was executed] and of the National [Solemn League &amp;] Covenant were never made by the parliaments which framed them to contradict one another; or in their proper times to oppress the rules of our Christian profession or the principles of natural equity by which our society is upheld: although in respect of certain expressions which relate to the circumstances of several times wherein they were framed, they are clearly different one from another. Whence this again will follow: That to be obliged to different intentions (though contrary) upon several occasion (if both agree in their proper times to the forenamed rules and principles) this can be no breach of duty or prejudice of conscience.

5. That it does belong only to the superior powers of human societies to judge and determine at all times that the public engagements and designs ought to be, and what the form of government is, which is most proper for the times, and agreeable to natural equity to be yielded unto by all for common preservation in humane societies.

6. That the supreme powers cannot be bound up unalterably to any particular design or human engagement so as not to be free upon emergencies to entertain other designs and engagements; when they shall think it most expedient for common safety, and agreeable to Christianity, nay, they are not only free to do this, but they are bound to it: else they are not faithful to the charge which God has committed to them.

7. That subjects (that is, particular men in private stations) ought not to make themselves interpreters of the intents of public engagements otherwise than as they are agreeable to the rules of Christianity and the principles of natural equity; and so far as they bear a sense agreeable unto these, so far they are bound in conscience professedly to own them; but if a sense be imposed upon them contrary to any of these, then they are not obliged to own that sense.</p></blockquote>

1.%20That%20no%20human%20engagements%20are%20or%20ought&amp;text=they%20are%20not%20obliged%20to%20own%20that%20sense" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Oaths conceived or made rightly of things lawful, true, certain, weighty, and possible, are to be kept. For if once thou hast acknowledged and testified thyself to be justly bound to keep thy promise, and hast called God to record hereof, when as afterwards thou wittingly and willingly breakest thine oath, thou dost violate and break a just bond, and doest either accuse God, the witness and maintainer of this bond, of vanity and lightness, or provoke Him to punish thee. Ps. 15:4-5… But oaths that are made of unlawful things, either by an error, or by ignorance, or through infirmity, or against the conscience, it is sin to keep them. And therefore such oaths are to be retracted and recalled, least we add thereby sins unto sins… They therefore who keep that which they have ill sworn heap sin unto sin; as did Herod putting John Baptist to death by pretence of keeping his oath: and likewise such as keep monastical vows, whereby they have sworn idolatry and impious single living… and according to the example and doctrine of David, 1 Sam. 25, who swears that he will destroy Nabal together with his family, saying: ‘So and more also do God unto the enemies of David; for surely I will not leave of all that he has by the dawning of the day, any that pisses against the wall:’ But after he had heard Abigail speak, he gives thanks to God that the executing and fulfilling of his oath was hindered by her and confirms by a new oath that this is God’s blessing and benefit, saying: ‘Blessed be the Lord God of Israel which sent thee this day to meet me; and blessed be thy counsels, and blessed be thou, which hast kept me this day from coming to shed blood, and that mine hand has not saved me. For indeed, as the Lord God of Israel lives, who has kept me back from hurting thee, etc.’… Objection 2. The oath of peace which was made to the Gibeonites, Josh. 9, was [by deception and] against the commandment of God. It is lawful therefore to keep an oath made of things unlawful. Answer:

1. They were not excluded from peace if any of those nations which God has commanded to be destroyed, did ask peace of the Israelites and did embrace their religion. Now the Gibeonites desire peace and are adjudged to serve the tabernacle for woodcleavers and drawers of water perpetually. Therefore the peace which was promised them, albeit it was obtained by fraud and guile, yet was it not repugnant to God’s commandment.

2. The Israelites do not therefore keep this oath, as that they were bound thereby, because they sware it being deceived, and thinking the Gibeonites to have been of another country: but first for avoiding of offence, whereby the name of God might be disgraced among the heathen, if the Jews had not kept their oath; and then, because it was lawful and just to save them which desired peace and embraced their religion, although no oath had been made at all.</p></blockquote>

<blockquote><p>Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits. We do not speak of the rhetorical use of equivocations, nor of the logical use which often obtains in disputations. Rather we speak of the theological and moral use in giving testimony and in oaths, where truth and sincerity are required.</p></blockquote>

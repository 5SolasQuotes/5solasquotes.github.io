<main class="wrap"><figure class="quote" id="q-935f45ba52" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God</cite>, p. 670 of ‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.”

— Jerome Zanchi, p. 670 of ‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+absolutely+deny%2C+that+good+works+are+a+cause+of+salvation%2C+viz.%2C+an+instrumental+rather+than+an+efficient+one%E2%80%A6+Good+works+are+an+instrumental+cause+of+the+possession+of+life+eternal%2C+for+by+these+as+by+media+and+by+the+legitimate+path+God+leads+us+into+the+possession+of+eternal+life%E2%80%A6+The+same+truly+are+rightly+able+to+be+said+to+be+an+instrumental+cause+of+eternal+life%2C+insofar+as+God+leads+us+by+them+into+eternal+life.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+p.+670+of+%E2%80%98Whether+Good+Works+are+the+Cause+of+Eternal+Salvation%3F%E2%80%99+in+Of+the+Nature+of+God%2C+or+of+the+Divine+Attributes+%28Neustadt%2C+1593%29%2C+Book+5%2C+ch.+2%2C+after+Of+Predestination+in+General%2C+Question+6%2C+Other+Part%2C+Of+the+Predestination+of+the+Saints%2C+Question+3%2C+after+the+Thesis%2C+pp.+670-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F935f45ba52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/935f45ba52.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20do%20not%20absolutely%20deny%2C%20that,us%20by%20them%20into%20eternal%20life&amp;text=We%20do%20not%20absolutely%20deny%2C%20that%20good%20works&amp;text=God%20leads%20us%20by%20them%20into%20eternal%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-220dca2496" data-kw="">
<blockquote><p>See how it is that we do not justify men before God by works, but say, that all who are of God are regenerated and made new creatures, so that they pass from the kingdom of sin into the kingdom of righteousness. In this way they make their calling sure, and, like trees, are judged by their fruits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“See how it is that we do not justify men before God by works, but say, that all who are of God are regenerated and made new creatures, so that they pass from the kingdom of sin into the kingdom of righteousness. In this way they make their calling sure, and, like trees, are judged by their fruits.”

</figure><figure class="quote" id="q-d8dd4eb741" data-kw="">
<blockquote><p>(6) They [good works] are necessary to the attainment of salvation, not in any sense as a prerequisite to justification, nor in any stage of the believer’s progress meriting the divine favor, but as essential elements of that salvation, the consubstantial fruits and means of sanctification and glorification. A saved soul is a holy soul, and a holy soul is one whose faculties are all engaged in works of loving obedience. Grace in the heart cannot exist without good works as their consequent. Good works cannot exist without the increase of the graces which are exercised in them. Heaven could not exist except as a society of holy souls mutually obeying the law of love in all the good works that law requires. Eph. v. 25 — 27; 1 Thess. iv. 6, 7; Rev. xxi. 27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ch. 16, ‘Of Good Works’</cite>, p. 301 in A Commentary on the Confession of Faith: with questions for theological students and Bible classes (Philadelphia: Presbyterian Board of Publication, 1901)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-5757b1131c" data-kw="">
<blockquote><p>Wherefore good works are necessary to salvation, certainly not as an efficient or meritorious cause, by an efficient principle; yet they are necessary by a principle of being present, and so a testimony of our living faith, without which faith is dead; and they are required to salvation, not as a cause of ruling, but as a way to the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/festus-hommius.html">Festus Hommius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 67, ‘Of Good Works’, ‘Whether Good Works are Necessary to Salvation?’ in 70 Theological Disputations Against Papists</cite>, … in a Collection Against Bellarmine (Leiden, 1614), pp. 454-55</span></figcaption>

</figure><figure class="quote" id="q-e22f124206" data-kw="">
<blockquote><p>Good works are essentially prerequisite to an admission into heaven. Though they do not merit everlasting life, yet they are indispensably necessary in all who are ‘heirs of the grace of life.’ Believers, ‘being made free from sin, have their fruit unto holiness, and the end everlasting life.’ – Rom. 6:22</p></blockquote>

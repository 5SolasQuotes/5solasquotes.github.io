<main class="wrap"><figure class="quote" id="q-9a1c37103a" data-kw="">
<blockquote><p>I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“John Flavel’s</cite>, (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“I know no orthodox divine in the world, that presumes to thrust in any work of man’s into the covenant of grace, as a condition, which, in the Arminian sense, he may or may not perform, according to the power and pleasure of his own free will, without the preventing or determining grace of God; which preventing grace is contained in those promises, Eze. 36:25–27, etc. Nor yet that there is any meritorious worth, either of condignity or congruity in the Popish sense, in the very justifying act of faith, for the which God justifies and saves us. But we say, That though God, in the way of preventing grace, works faith in us, and when it is so wrought, we need his assisting grace to act it, yet neither his assisting nor preventing grace makes the act of faith no more to be our act; it is we that believe still though in God’s strength, and that upon our believing, or not believing, we have or have not the benefits of God’s promises; which is the very proper notion of a condition.”

lasquotes.github.io%2Fquote%2F9a1c37103a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a1c37103a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=I%20know%20no%20orthodox%20divine%20in,very%20proper%20notion%20of%20a%20condition&amp;text=I%20know%20no%20orthodox%20divine%20in%20the%20world&amp;text=is%20the%20very%20proper%20notion%20of%20a%20condition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1125fa090f" data-kw="">
<blockquote><p>Regeneration is a benefit of God, by which our corrupted nature is renewed to the image of God by the Holy Spirit, 2 Pet. 1:4; Tit. 3:5; Gal. 4:6; 2 Cor. 3:7. That same is also called sanctification, and the gift of grace. Rom. 5. Also of schoolemen it is called an infused grace. Regeneration is either begun, or perfected: the former belongs to this life, the latter to the life to come… Regeneration of the soul is that whereby the powers of the soul are renewed. Tit. 3:5; Gal. 4:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, … (London, 1595), ‘Regeneration’, pp. 94-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-0e8c7bab12" data-kw="">
<blockquote><p>XXVI. If it is necessary for the reparation to be co-extensive with the corruption, and the latter has invaded all the faculties of the soul, the former must also be constituted in all its parts. And since supernatural life has been extinguished in the whole man, and not in the will or the mind separately, the whole man must also become a partaker of spiritual life, so that he may be truly called regenerated. XXVII. Therefore, the darkened mind is illuminated (Eph. 1:18), the will, prone only to evil, is bent toward the good, the disordered affections, alienated from the rule of reason, begin again to listen to it and to be more subject to the will (Rom. 6:12), and finally, the whole man comes into some part of this new and divine change. XXVIII. Those who state that here only the mind is illuminated and the affections corrected, but that the will is not healed, but only freed from impediments and rendered more ready to exercise the faculty inherent in it, must see on what foundation of Scripture they do this. We, on the contrary, feel that the will is as much the subject of this reparation as the mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

is%20reparation%20as%20the%20mind" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2b0187239c" data-kw="">
<blockquote><p>Thus Mt. 19:28, the Last Day is also called the day of regeneration unto the people of God; yet in this life they partake of that grace, but because then is the full perfection and manifestation of it, therefore the Scripture calls it the day of regeneration. Even as the apostle, Acts 13:33, applies that passage of the psalm to Christ’s resurrection, ‘This day have I begotten thee,’ because then was such a solemn and public declaration that he was the Son of God. No marvel then, if the Scripture do also call the day of judgment a time when sins shall be blotted out [Acts 3:19], because then is the public absolution of the godly; and according to philosophy motions receive their names from the term to which they tend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, pp. 256-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

<main class="wrap"><figure class="quote" id="q-c3a3be2842" data-kw="">
<blockquote><p>Undoubtedly, in my opinion, no man endued with sound judgment will deny that lights, crosses and trifles of that sort flowed from superstition. Whence I hold, that those who retain them, while they possess liberty of choice, draw too eagerly from dregs. Nor do I see what purpose can be answered by burdening the Church with frivolous and useless (not to call them by their proper name, noxious) ceremonies, where we enjoy the liberty of establishing a pure and simple order.</p></blockquote>

<blockquote><p>The whole place shows it was God: but He is called an angel, that we might know that He which was seen, was not God the Father (for whose angel should the Father be) but the only begotten Son of God, which is the Angel of the great Counsel, which said to his holy apostles, ‘All things which I have heard of my Father, I have declared unto you.’ And even as He gave Him the name of an angel, not meaning thereby to note any other minister or messenger, but to show the Person of the only begotten Son: so again he sets forth both his nature and power, saying He said: ‘I AM THAT I AM,’ and ‘I the God of Abraham, the God of Isaac, the God of Jacob’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodoret.html">Theodoret of Cyrus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable Notes upon the books of Exodus &amp; Leviticus</cite>, As quoted in Gervase Babington, ... (London: Chard, 1604), ch. 3, p. 32 Theodoret (c. 393–c. 458/466)</span></figcaption>

</figure><figure class="quote" id="q-6618d7e760" data-kw="">
<blockquote><p>1. The form of worship forbidden in the word of God is idolatry and the adoration of saints.

2. Idolatry is the making, maintaining and religious worshipping of an idol. …

3. An idol is an image of likeness [simulacrum] made for the purposes of religious worship. Propositions I. An idol differs from an image and likeness as species from genus… So not every likeness [simulacrum] is an idol; in fact, Tertullian calls man the simulacrum of God. …

III. To make an idol is to make an image or likeness for purposes of religious worship.

IV. Therefore, not all making of images and likenesses is idolatry; they may be made for memorials, for enjoyment and other secular [politicus] purposes.

V. The cherubim, the bronze serpent, and other objects made by God’s order were not made for purposes of religious worship, but as types of Christ. Therefore, the papists wrongly seek to defend their idols on this pretext. For (1) God ordered the making of these objects, but forbids idols; (2) no religious worship was given them, so that when the bronze serpent began to be worshipped, it was destroyed (2 Kings 18:4); to idols the religious worship is given; (3) since all types are done away since the coming of Christ, such objects have no place in the New Testament. Saints are true idols [images of God].

VI. The images that the papists make of Christ, the angels, Mary and the saints [are forbidden]. The reason is tht they are made for purposes of religious worship. The papists deny that they are idols because… (4) the saints lived in genuine human form, and (5) the images are books for the laity. Response: …(4) As to the fourth, it follows from this only that images of the saints can be made, that is, if it is not done for purposes of religious worship. (5) As for the fifth argument, its premise is false; what kind of books the idols [note Wolleb does not say “images”] are is evident from Jeremiah 10:14-15 and Habakkuk 2:18-19, where they are called teachers of lies and vanity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (1626), bk. 2, ‘The Service of God’, 2nd Commandment in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 208-10</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1762391914" data-kw="">
<blockquote><p>It is our Duty. In his Example we have a taste of his Spirit; I am not of the World, saith Christ; and we should imitate Christ as dear Children, Ephes. 5.1. They that love to live in delight and pleasures, are but Christians in Name. If we had no other Reason to contemn the vanity of the World, than the Life of Christ, this were enough. Who was wisest, Christ, or you? Who can make the better choice, Christ or you? Who is in an Error, Christ or you? Christ chose a poor Life, and you affect Greatness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Seventeenth Chapter of St. John</cite>, Sermon 25, in A Second Volume of Sermons (London, 1684), p. 225</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c7372b0c9" data-kw="Perseverance Comfort">
<blockquote><p>Christ your Head is risen, therefore you cannot be lost: nay, he is not only risen from the dead himself, but is also &quot;become the first-fruits of them that slept,&quot; 1 Cor. 15: 20. Believers are his members, his fulness, he cannot therefore be complete without you: a part of Christ cannot perish in the grave, much less burn in hell. Remember, when you feel the natural union dissolving, that this mystical union can never be dissolved: the pangs of death cannot break this tye.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), Inference 7</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6fde623784" data-kw="">
<blockquote><p>(1.) It is clear that the specific and essential form of a fundamental article is not taken from the authority of God speaking in the Word (seeing God’s authority is one and the same in all that He speaks), but from the influence that the knowledge of an article has to unite us to God in Christ, and bring us to salvation. (2.) And secondly, it will follow that this, Thou shalt not by the use of things indifferent kill him for whom Christ died, and the like is no less fundamental, by evident consequence, in respect it is spoken by God’s own authority, than articles of our faith. (3.) It follows that formalists ignorantly divide matters of God’s worship, into matters of faith, or points fundamental, and things indifferent, as if many scriptural truths were not to be found in God’s Word, such as the miracles of Moses, and Elias, the journeys of Paul, which are neither matters fundamental, nor yet things indifferent. (4.) Many things may be fundamental, by consequence, to one who can read the Word, and hear it read, which is not by consequence fundamental to a rude and ignorant man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-distinctions.html">Rutherford’s Distinctions</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 4 Distinctions about Fundamentals</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf3a92e9a9" data-kw="">
<blockquote><p>Much has been made by historians of the Scots ‘forcing’ their austere brand of religion upon their English brethren. However, it is clear that Scottish commissioners were aware their role was limited to advising only and that the construction of the Church rested with English members of the Assembly. Indeed, the Westminster Assembly did invite the Scottish commissioners to become full members of the Assembly, an invitation which the Scots declined, thereby recognising and respecting England’s right to define its own church government… The Scots fully encouraged the English to set up a Classical Presbytery based on English tradition and encouraged compromise [or rather a principled accommodation to the Independents]. In response to [the Independent] Philip Nye’s sharp accusation that the Scots had ‘given’ the Assembly a whole system of church government, the Scottish members responded that ‘we were well content the Assembly should take their own order, and not tie themselves to ours.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kirsteen-m-mackenzie.html">Kirsteen M. MacKenzie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League &amp; Covenant of the Three Kingdoms &amp; the Cromwellian Union, 1643-1663 (Routledge, 2018), ch. 1</cite>, pp. 37-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

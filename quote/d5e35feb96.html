<blockquote><p>2. The special object of faith, as justifying, is not the special object of faith in this ordinance. The special object of faith, as justifying, is the promise, and Christ in the promise, in general, as “the Saviour of sinners:” so when the apostle called men “to repent and believe,” he tells them, “The promise is unto you,” Acts 2:39. And I suppose I need not insist upon the proof this, that the promise, and Christ in the promise as Saviour and Redeemer, is the object of faith, as it is justifying. But this also is supposed in the actings of faith in this ordinance; which is peculiar, and gives us peculiar communion with Christ. Therefore,— 3. The special and peculiar object of faith, the immediate object of it in this ordinance, in its largest extent is,— (1.) The human nature of Christ, as the subject wherein mediation and redemption was wrought. Christ is considered to come as a sacrifice; that is laid down as the foundation of it, Ps. 40:6; Heb. 10:5, “A body hast thou prepared me;” which is synecdochically taken for the whole human nature. Faith, when it would lead itself unto the sacrifice of Christ, which is here represented, doth in an especial manner consider the human nature of Christ; that God prepared him a body for that end. This we are to have peculiar regard unto when we come to the administration or participation of this ordinance. For that end we now celebrate it. Nay,— (2.) Faith goes farther, and doth not consider merely the human nature of Christ, but considers it as distinguished into its integral parts,—into body and blood; both which have a price, value, and virtue given unto them by their union with his human soul: for both the body of Christ and the blood of Christ, upon which the work of our redemption is put in Scripture, have their value and worth from their relation unto his soul; as soul and body, making the human nature, had its value and worth from its relation unto the Son of God: otherwise, he saith of his body, “Handle it, it is but flesh and bones.” But where the body of Christ is mentioned, and the blood of Christ is mentioned, there is a distribution of the human nature into its integral parts, each part retaining its relation to his soul; and from thence is its value and excellency. This is the second peculiar in the object of faith in this ordinance. (3.) There is more than this: they are not only considered as distinguished, but as separate also;—the blood separate from the body, the body left without the blood. This truth our apostle, in this chapter and the next, doth most signally insist upon; namely, the distinct parts of this ordinance,—one to represent the body, and the other to represent the blood,—that faith may consider them as separate. The Papists, we know, do sacrilegiously take away the cup from the people; they will give them the bread, but they will not give them the cup: and as it always falls out that one error must be covered with another, or else it will keep no man dry under it, they have invented the doctrine of concomitance,—that there is a concomitance; that is, whole Christ is in every kind,—in the bread, and in the wine,—the one doth accompany the other: which is directly to overthrow the ordinance upon another account,—as it is to represent Christ’s body and blood as separated one from the other. Our Lord Jesus blessed the bread and the cup, and said, “This is my body;” [“This is my blood;”]—which cannot be spoken distinctly, unless supposed to be separate. Here, then, is a threefold limitation of the act of faith, even in this ordinance, in a peculiar manner restraining it to a special communion with God in Christ:—that it hath a special regard to the human nature of Christ; to his human nature as consisting of body and blood; and as it respects them as separated, body and blood. Yea,— (4.) It respects them as separate in that manner. You all along know that I do not intend these objects of faith as the ultimate object,—for it is the person of Christ that faith rests in,—but those immediate objects that faith is exercised about, to bring it to rest in God. It is exercised about the manner of this separation; that is, the blood of Christ comes to be distinct by being shed, and the body of Christ comes to be separate by being bruised and broken. All the instituted sacrifices of old did signify this,—a violent separation of body and blood: the blood was let out with the hand of violence, and so separated; and then sprinkled upon the altar, and then towards the holy place; and then the body was burned distinct by itself. So, the apostle tells us, it is “the cup which we bless, and the bread which we break;” the cup is poured out, as well as the bread broken, to remind faith of the violent separation of the body and blood of Christ. From this last consideration, of faith acting itself upon the separation of the body and blood of Christ by way of violence, it is led to a peculiar acting of itself upon all the causes of it,—whence it was that this body and this blood of Christ were represented thus separate: and by inquiring into the causes of it, it finds a moving cause, a procuring cause, an efficient cause, and a final cause; which it ought to exercise itself peculiarly upon always in this ordinance. [1.] A moving cause; and that is, the eternal love of God in giving Christ in this manner, to have his body bruised, and his blood shed. The apostle, going to express the love of God towards us, tells you it was in this, that “he spared not his own Son,” Rom. 8:32. One would have thought that the love of God might have wrought in sending his Son into the world; but it also wrought in not sparing of him. Thus faith is called in this ordinance to exercise itself upon that love which gives out Christ not to be spared. [2.] It reflects upon the procuring cause;—whence it is, or what it is, that hath procured it, that there should be this representation of the separated body and blood of Christ; and this is even our own sin. “He was delivered for our offences,”—given for our transgressions,—died to make reconciliation and atonement for our sins: they were the procuring cause of it, upon such considerations of union and covenant which I shall not now insist upon. It leads faith, I say, upon a special respect to sin, as the procuring cause of the death of Christ. A natural conscience, on the breach of the law, leads the soul to the consideration of sin, as that which exposes itself alone to the wrath of God and eternal damnation, but in this ordinance we consider sin as that which exposed Christ to death: which is a peculiar consideration of the nature of sin. [3.] There is the efficient cause;—whence it was that the body and blood of Christ were thus separated; and that is threefold:—principal, instrumental, and adjuvant. What is the principal efficient cause of the sufferings of Christ? Why, the justice and righteousness of God. “God hath set him forth to be a propitiation, to declare his righteousness,” Rom. 3:25. Whence it is said, “He spared him not.” He caused all our sins to meet upon him: “The chastisement of our peace was upon him.” Again, there is the instrumental cause; and that is the law of God. Whence did that separation, which is here represented unto us, ensue and flow? It came from the sentence of the law, whereby he was hanged upon the tree. Moreover, the adjuvant cause was those outward instruments, the wrath and malice of men: “For of a truth against thy holy child Jesus, whom thou hast anointed, both Herod, and Pontius Pilate, with the Gentiles, and the people of Israel, were gathered together,” Acts 4:27. Faith considers the cause whence it was that Christ was thus given up, the eternal love of God; the procuring cause was our own sins: and if once faith takes a view of sin as that which hath nailed Christ to the cross, it will have a blessed effect on the soul. And it considers the efficient cause; which is the justice and righteousness of God: the law of God was the instrument in the hand of righteousness, which was holpen on by those outward instruments who had a hand in his suffering, but none in his sacrifice. [4.] Faith considers in this matter the end of this separation of the body and blood of Christ which is thus represented; and that is, ultimately and absolutely, the glory of God. He “set him forth to declare his righteousness,” Rom. 3:25, Eph. 1:6. God aimed at the glorifying of himself. I could easily manifest unto you how all the glorious properties of his nature are advanced, exalted, and will be so to eternity, in this suffering of Christ. The subordinate ends are two; I mean the subordinate ends of this very peculiar act of separation of the body and blood:—1st. It was to confirm the covenant. Every covenant of old was to be ratified and confirmed by sacrifice; and in confirming the covenant by sacrifice, they divided the sacrifice into two parts, and passed between them before they were offered; and then took it upon themselves that they would stand to the covenant which was so confirmed. Jesus Christ being to confirm the covenant, Heb. 9:16, the body and blood of Christ, this sacrifice, was to be parted, that this covenant might be confirmed. And,—2dly. A special end of it was, for the confirming and strengthening of our faith. God gives out unto us the object of our faith in parcels. We are not able to take this great mysterious fruit of God’s love in gross, in the lump; and therefore he gives it out, I say, in parcels. We shall have the body broken to be considered; and the blood shed is likewise to be considered. This is the peculiar communion which we have with Christ in this ordinance; because there are peculiar objects for faith to act itself upon in this ordinance above others.</p></blockquote>

rtue+given+unto+them+by+their+union+with+his+human+soul%3A+for+both+the+body+of+Christ+and+the+blood+of+Christ%2C+upon+which+the+work+of+our+redemption+is+put+in+Scripture%2C+have+their+value+and+worth+from+their+relation+unto+his+soul%3B+as+soul+and+body%2C+making+the+human+nature%2C+had+its+value+and+worth+from+its+relation+unto+the+Son+of+God%3A+otherwise%2C+he+saith+of+his+body%2C+%E2%80%9CHandle+it%2C+it+is+but+flesh+and+bones.%E2%80%9D+But+where+the+body+of+Christ+is+mentioned%2C+and+the+blood+of+Christ+is+mentioned%2C+there+is+a+distribution+of+the+human+nature+into+its+integral+parts%2C+each+part+retaining+its+relation+to+his+soul%3B+and+from+thence+is+its+value+and+excellency.+This+is+the+second+peculiar+in+the+object+of+faith+in+this+ordinance.+%283.%29+There+is+more+than+this%3A+they+are+not+only+considered+as+distinguished%2C+but+as+separate+also%3B%E2%80%94the+blood+separate+from+the+body%2C+the+body+left+without+the+blood.+This+truth+our+apostle%2C+in+this+chapter+and+the+next%2C+doth+most+signally+insist+upon%3B+namely%2C+the+distinct+parts+of+this+ordinance%2C%E2%80%94one+to+represent+the+body%2C+and+the+other+to+represent+the+blood%2C%E2%80%94that+faith+may+consider+them+as+separate.+The+Papists%2C+we+know%2C+do+sacrilegiously+take+away+the+cup+from+the+people%3B+they+will+give+them+the+bread%2C+but+they+will+not+give+them+the+cup%3A+and+as+it+always+falls+out+that+one+error+must+be+covered+with+another%2C+or+else+it+will+keep+no+man+dry+under+it%2C+they+have+invented+the+doctrine+of+concomitance%2C%E2%80%94that+there+is+a+concomitance%3B+that+is%2C+whole+Christ+is+in+every+kind%2C%E2%80%94in+the+bread%2C+and+in+the+wine%2C%E2%80%94the+one+doth+accompany+the+other%3A+which+is+directly+to+overthrow+the+ordinance+upon+another+account%2C%E2%80%94as+it+is+to+represent+Christ%E2%80%99s+body+and+blood+as+separated+one+from+the+other.+Our+Lord+Jesus+blessed+the+bread+and+the+cup%2C+and+said%2C+%E2%80%9CThis+is+my+body%3B%E2%80%9D+%5B%E2%80%9CThis+is+my+blood%3B%E2%80%9D%5D%E2%80%94which+cannot+be+spoken+distinctly%2C+unless+supposed+to+be+separate.+Here%2C+then%2C+is+a+threefold+limitation+of+the+act+of+faith%2C+even+in+this+ordinance%2C+in+a+peculiar+manner+restraining+it+to+a+special+communion+with+God+in+Christ%3A%E2%80%94that+it+hath+a+special+regard+to+the+human+nature+of+Christ%3B+to+his+human+nature+as+consisting+of+body+and+blood%3B+and+as+it+respects+them+as+separated%2C+body+and+blood.+Yea%2C%E2%80%94+%284.%29+It+respects+them+as+separate+in+that+manner.+You+all+along+know+that+I+do+not+intend+these+objects+of+faith+as+the+ultimate+object%2C%E2%80%94for+it+is+the+person+of+Christ+that+faith+rests+in%2C%E2%80%94but+those+immediate+objects+that+faith+is+exercised+about%2C+to+bring+it+to+rest+in+God.+It+is+exercised+about+the+manner+of+this+separation%3B+that+is%2C+the+blood+of+Christ+comes+to+be+distinct+by+being+shed%2C+and+the+body+of+Christ+comes+to+be+separate+by+being+bruised+and+broken.+All+the+instituted+sacrifices+of+old+did+signify+this%2C%E2%80%94a+violent+separation+of+body+and+blood%3A+the+blood+was+let+out+with+the+hand+of+violence%2C+and+so+separated%3B+and+then+sprinkled+upon+the+altar%2C+and+then+towards+the+holy+place%3B+and+then+the+body+was+burned+distinct+by+itself.+So%2C+the+apostle+tells+us%2C+it+is+%E2%80%9Cthe+cup+which+we+bless%2C+and+the+bread+which+we+break%3B%E2%80%9D+the+cup+is+poured+out%2C+as+well+as+the+bread+broken%2C+to+remind+faith+of+the+violent+separation+of+the+body+and+blood+of+Christ.+From+this+last+consideration%2C+of+faith+acting+itself+upon+the+separation+of+the+body+and+blood+of+Christ+by+way+of+violence%2C+it+is+led+to+a+peculiar+acting+of+itself+upon+all+the+causes+of+it%2C%E2%80%94whence+it+was+that+this+body+and+this+blood+of+Christ+were+represented+thus+separate%3A+and+by+inquiring+into+the+causes+of+it%2C+it+finds+a+moving+cause%2C+a+procuring+cause%2C+an+efficient+cause%2C+and+a+final+cause%3B+which+it+ought+to+exercise+itself+peculiarly+upon+always+in+this+ordinance.+%5B1.%5D+A+moving+cause%3B+and+that+is%2C+the+eternal+love+of+God+in+giving+Christ+in+this+manner%2C+to+have+his+body+bruised%2C+and+his+blood+shed.+The+apostle%2C+going+to+express+the+love+of+God+towards+us%2C+tells+you+it+was+in+this%2C+that+%E2%80%9Che+spared+not+his+own+Son%2C%E2%80%9D+Rom.+8%3A32.+One+would+have+thought+that+the+love+of+God+might+have+wrought+in+sending+his+Son+into+the+world%3B+but+it+also+wrought+in+not+sparing+of+him.+Thus+faith+is+called+in+this+ordinance+to+exercise+itself+upon+that+love+which+gives+out+Christ+not+to+be+spared.+%5B2.%5D+It+reflects+upon+the+procuring+cause%3B%E2%80%94whence+it+is%2C+or+what+it+is%2C+that+hath+procured+it%2C+that+there+should+be+this+representation+of+the+separated+body+and+blood+of+Christ%3B+and+this+is+even+our+own+sin.+%E2%80%9CHe+was+delivered+for+our+offences%2C%E2%80%9D%E2%80%94given+for+our+transgressions%2C%E2%80%94died+to+make+reconciliation+and+atonement+for+our+sins%3A+they+were+the+procuring+cause+of+it%2C+upon+such+considerations+of+union+and+covenant+which+I+shall+not+now+insist+upon.+It+leads+faith%2C+I+say%2C+upon+a+special+respect+to+sin%2C+as+the+procuring+cause+of+the+death+of+Christ.+A+natural+conscience%2C+on+the+breach+of+the+law%2C+leads+the+soul+to+the+consideration+of+sin%2C+as+that+which+exposes+itself+alone+to+the+wrath+of+God+and+eternal+damnation%2C+but+in+this+ordinance+we+consider+sin+as+that+which+exposed+Christ+to+death%3A+which+is+a+peculiar+consideration+of+the+nature+of+sin.+%5B3.%5D+There+is+the+efficient+cause%3B%E2%80%94whence+it+was+that+the+body+and+blood+of+Christ+were+thus+separated%3B+and+that+is+threefold%3A%E2%80%94principal%2C+instrumental%2C+and+adjuvant.+What+is+the+principal+efficient+cause+of+the+sufferings+of+Christ%3F+Why%2C+the+justice+and+righteousness+of+God.+%E2%80%9CGod+hath+set+him+forth+to+be+a+propitiation%2C+to+declare+his+righteousness%2C%E2%80%9D+Rom.+3%3A25.+Whence+it+is+said%2C+%E2%80%9CHe+spared+him+not.%E2%80%9D+He+caused+all+our+sins+to+meet+upon+him%3A+%E2%80%9CThe+chastisement+of+our+peace+was+upon+him.%E2%80%9D+Again%2C+there+is+the+instrumental+cause%3B+and+that+is+the+law+of+God.+Whence+did+that+separation%2C+which+is+here+represented+unto+us%2C+ensue+and+flow%3F+It+came+from+the+sentence+of+the+law%2C+whereby+he+was+hanged+upon+the+tree.+Moreover%2C+the+adjuvant+cause+was+those+outward+instruments%2C+the+wrath+and+malice+of+men%3A+%E2%80%9CFor+of+a+truth+against+thy+holy+child+Jesus%2C+whom+thou+hast+anointed%2C+both+Herod%2C+and+Pontius+Pilate%2C+with+the+Gentiles%2C+and+the+people+of+Israel%2C+were+gathered+together%2C%E2%80%9D+Acts+4%3A27.+Faith+considers+the+cause+whence+it+was+that+Christ+was+thus+given+up%2C+the+eternal+love+of+God%3B+the+procuring+cause+was+our+own+sins%3A+and+if+once+faith+takes+a+view+of+sin+as+that+which+hath+nailed+Christ+to+the+cross%2C+it+will+have+a+blessed+effect+on+the+soul.+And+it+considers+the+efficient+cause%3B+which+is+the+justice+and+righteousness+of+God%3A+the+law+of+God+was+the+instrument+in+the+hand+of+righteousness%2C+which+was+holpen+on+by+those+outward+instruments+who+had+a+hand+in+his+suffering%2C+but+none+in+his+sacrifice.+%5B4.%5D+Faith+considers+in+this+matter+the+end+of+this+separation+of+the+body+and+blood+of+Christ+which+is+thus+represented%3B+and+that+is%2C+ultimately+and+absolutely%2C+the+glory+of+God.+He+%E2%80%9Cset+him+forth+to+declare+his+righteousness%2C%E2%80%9D+Rom.+3%3A25%2C+Eph.+1%3A6.+God+aimed+at+the+glorifying+of+himself.+I+could+easily+manifest+unto+you+how+all+the+glorious+properties+of+his+nature+are+advanced%2C+exalted%2C+and+will+be+so+to+eternity%2C+in+this+suffering+of+Christ.+The+subordinate+ends+are+two%3B+I+mean+the+subordinate+ends+of+this+very+peculiar+act+of+separation+of+the+body+and+blood%3A%E2%80%941st.+It+was+to+confirm+the+covenant.+Every+covenant+of+old+was+to+be+ratified+and+confirmed+by+sacrifice%3B+and+in+confirming+the+covenant+by+sacrifice%2C+they+divided+the+sacrifice+into+two+parts%2C+and+passed+between+them+before+they+were+offered%3B+and+then+took+it+upon+themselves+that+they+would+stand+to+the+covenant+which+was+so+confirmed.+Jesus+Christ+being+to+confirm+the+covenant%2C+Heb.+9%3A16%2C+the+body+and+blood+of+Christ%2C+this+sacrifice%2C+was+to+be+parted%2C+that+this+covenant+might+be+confirmed.+And%2C%E2%80%942dly.+A+special+end+of+it+was%2C+for+the+confirming+and+strengthening+of+our+faith.+God+gives+out+unto+us+the+object+of+our+faith+in+parcels.+We+are+not+able+to+take+this+great+mysterious+fruit+of+God%E2%80%99s+love+in+gross%2C+in+the+lump%3B+and+therefore+he+gives+it+out%2C+I+say%2C+in+parcels.+We+shall+have+the+body+broken+to+be+considered%3B+and+the+blood+shed+is+likewise+to+be+considered.+This+is+the+peculiar+communion+which+we+have+with+Christ+in+this+ordinance%3B+because+there+are+peculiar+objects+for+faith+to+act+itself+upon+in+this+ordinance+above+others.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+9+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+523%E2%80%93527.+%28HT%3A+Amy+Warren%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd5e35feb96.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d5e35feb96.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/owen-gives-us-theological-reasons-to-object-to-intinction/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.</p></blockquote>

<blockquote><p>2nd, from the significancy of the symbol; since bread, as the principal natural nourishment of our bodies, represents his flesh, which, as living bread, he gave for the life of the world.–– John 6:51 . But the kind of bread, whether leavened or unleavened, is not specified in the command, nor is it rendered essential by the nature of the service. Christ used unleavened bread because it was present at the Passover. The early Christians celebrated the Communion at a common meal, with the bread of common life, which was leavened. The Romish Church has used unleavened bread ever since the eighth century, and commands the use of the same as the only proper kind, but does not make it essential (“Cat. Conc. Trident.,” Pt. 2, ch. 4:, &amp;&amp; 13 and 14). The Greek Church insists upon the use of leavened bread. The Lutherans Church uses unleavened bread. The Reformed Church, including the Church of England, regards the use of leavened bread, as the food of common life, to be most proper, since bread in the Supper is the symbol of spiritual nourishment. The use of sweet cake, practiced in some of our churches is provincial and arbitrary, and is without any support in Scripture, tradition, or good taste.</p></blockquote>

<blockquote><p>XXV. Next follow the actions of the disciples, and consequently of the other guests. And these, according to Christ’s appointment, are three: first, to receive both the bread and the cup; but each separately, for so Christ distributed them: in this manner he commanded his people to take them; thus the body of Christ, as broken for us; his blood as poured out of his body, are more distinctly represented; and in fine, as a complete entertainment requires both meat and drink, so this most complete spiritual repast which we have in Christ, is thus most excellently represented. And therefore we cannot so well approve of that custom which prevailed in Cyprian’s time, to give a piece of bread dipt in wine to infants and the sick; which was the practice in some places, about the year of Christ 340, in the public and ordinary celebration of the sacrament. The same judgment we are to pass on the custom of the Greeks, who crumble the consecrated bread into the wine, and take it out with a spoon.</p></blockquote>

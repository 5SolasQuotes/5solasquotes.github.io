<main class="wrap"><figure class="quote" id="q-f2ed1a8fc3" data-kw="">
<blockquote><p>Him that cometh to me I will in nowise cast out.” — John vi. 37.

This is one of the most precious texts in the Bible. I do not speak thus, as if there were any part of that blessed book which might be regarded as of little value. It is all “more to be desired than gold, yea than much fine gold.” This the believer at least can testify, as the Holy Spirit testifies. His comprehensive language is that of the Psalmist, “I esteem all thy precepts concerning all things to be right,” and therefore “I rejoice at thy word, as one that findeth great spoil.” In his eyes, and in his experience, even the most alarming denunciations of the inspired record are exceeding precious; aye, more precious far than the most sweetly distilling accents of mercy to many a heedless ear, for “the full soul loatheth an honeycomb, but to the hungry soul every thing bitter is sweet.”

But still the single short sentence before us. contains so much of the rich marrow and essence of redeeming love, that it seems to hold within it the concentrated savour and preciousness of the whole gospel of grace. Take every other verse of all the Scriptures away, and leave but only this, still is there revealed by it a foundation sufficient whereon a world of souls may build their hopes and never be put to shame. Only let the trembling soul rest firmly on this living rock, the floods may deluge and the storms may beat, earth may scorn and hell may rage, but it cannot perish.

Precious in itself; how much more precious still when standing in connexion with other sure words of truth! Join these two texts together, and you will see what I mean: “Salvation is far from the wicked;” “Him that cometh unto me I will in nowise cast out.” As thy soul liveth, the first dread word is true; how awfully alarming! But as the Lord liveth, the second glad sound is equally true; how glorious is the news! It is the Lord of glory himself that speaks it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller-of-monifieth.html">Samuel Miller of Monifieth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Coming unto Jesus in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Concerning the distinction or difference of days, we say that it is a beastly superstition to esteem one day more holy than another, or to think that abstaining from work were a thing of itself that pleases God. Notwithstanding among the seven days we observe and keep one, according to the commandment of God, for to bestow it to hear the Word of God in the congregation, and principally to dedicate and give ourselves to learn and understand our duties towards God, and towards our neighbors. Thus we spend the Sunday. And concerning other festival days, we have put away as many as is possible for us: knowing the abuse that has come thereby, and the little need that Christendom has of them. Yet nevertheless, because there be certain days dedicated to the mysteries of our redemption, we use the Christian liberty, and have respect to that which either may hurt, or serve to the edification of the Church, according to the circumstance of time, place, and persons.</p></blockquote>

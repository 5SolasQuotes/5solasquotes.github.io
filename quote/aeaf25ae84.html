<main class="wrap"><figure class="quote" id="q-aeaf25ae84" data-kw="">
<blockquote><p>1. He from all eternity decreed the creation of man after his own image, and the making of the covenant of works with him, in time. All things brought forth in time, lay from eternity in the womb of God’s decree; in virtue whereof they have their being in time: for which cause the decree is said to bring forth, as a woman doth a child, Zeph. ii. 2. And the creation of angels and men, with the providence about them, made many lines in the volume of the sealed book of the decrees.

God self-sufficient needed neither man nor angel: but, for the manifestation of his own glory, he purposed from eternity to create them; and moreover, to enter into such a covenant with man, as one should therein represent the whole family; sovereign pleasure meanwhile taking another method with the angelic tribe: but withal purposing to give both the one and the other a sufficient ability to stand in their integrity, if they would. Thus, from eternity, the covenant of works, in all the parts and appurtenances thereof, was before the eternal mind; though being made with a mere man, it could not actually be entered into, till once man was created. But, “Known unto God are all his works from the beginning of the world,” Acts xv. 18.

2. He decreed also from eternity, to permit the first man, the representative of the whole family, to fall, and so to break the covenant, and involve himself, and all his posterity in ruins. It is evident from the spotless holiness of God, and the nature of the thing, that the divine permission was not the cause of man’s fall; and from the necessary dependence of the creature upon the Creator, that without it, he could not have fallen. But the sovereign Lord of the creatures, permitted the fall of man for his own holy ends, purposing to bring about good from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 386-87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30de8ba973" data-kw="">
<blockquote><p>Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).</p></blockquote>

</figure><figure class="quote" id="q-990b52e06e" data-kw="">
<blockquote><p>The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death, if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, The Marrow of Modern Divinity</cite></span></figcaption>

<blockquote><p>…In Hos. 6:7 we read: “But they like Adam have transgressed the covenant.” Attempts have been made to discredit this reading. Some have suggested the reading “at Adam,” which would imply that some well-known transgression occurred at a place called Adam. But the preposition forbids this rendering. Moreover, the Bible makes no mention whatever of such a well-known historical transgression at Adam. The Authorized Version renders “like men,” which would then mean, in human fashion. To this it may be objected that there is no plural in the original, and that such a statement would be rather inane, since man could hardly transgress in any other way. The rendering “like Adam” is after all the best. It is favored by the parallel passage in Job 31:33; and is adopted by the American Revised Version.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Wm. B. Eerdmans publishing co., 1938), 214–15.</span></figcaption>

</figure><figure class="quote" id="q-5caa5bb914" data-kw="">
<blockquote><p>There are some general obscure threatenings annexed to the prohibitions in the Law of Nature; that is, Nature may discern that God will punish the breakers of his Law, but how, or with what degree of punishment it cannot discern: Also it may collect that God will be favorable and gracious to the obedient: but it neither knows truly the conditions, nor the nature or greatness of the reward, nor God’s engagement thereto. Therefore as it is in Nature, it is a mere Law; and not properly a Covenant. Yea to Adam in his perfection, the form of the Covenant [of Works] was known by superadded revelation, and not written naturally in his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 3, pp. 9-10</span></figcaption>

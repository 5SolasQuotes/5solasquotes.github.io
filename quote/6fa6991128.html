<blockquote><p>First, the Scripture will inform us that singing of Psalms is a necessary and profitable duty: 1. A necessary duty, because God requires it, Eph. 5:17-19. It is the will of God that (on the one side) Christians should not be drunk with wine; and, on the other side, be filled with the Spirit, speaking to themselves in Psalms, etc. (Col. 3:16; Beza (in location) shows that the three Greek words that are translated Psalms, Hymns, and Songs, are the same that are used by the Septuagint to render the Hebrew words, which are the Titles of diverse Psalms, which we call the Psalms of David) [We have not been able to find this reference in Beza’s NT Commentary] It is the Spirit of God that saith to the afflicted, ‘Pray’; and to the merry, ‘Sing psalms‘, Jam. 5:13. 2. And a profitable duty, because the Spirit of God declares unto us the benefit of it, prescribing that the Word of God should dwell in us richly, and then adding further, ‘teaching and admonishing one another in psalms’, etc. Now it’s true, that teaching and admonishing may be referred either to the Word of God going before, or to psalms and hymns following after; but, it comes all to one, if the psalms, hymns, and songs spoken of there, be such as are recorded in Scripture, for then they are a part of the Word of God: and so the intent of the apostle may be to show that of every part of the Word of God, and in particular of the psalms and songs thereof (the rejoicing part) use is to be made for our edification; thereby something may be added to our light in a teaching way, and to our life and vigor in piety in an admonishing way. Secondly, the Scripture gives excellent rules also for singing, that it may be a profitable duty; As that it be, 1. With understanding, Ps. 47:7; 1 Cor. 14:14-15. 2. With the heart and affection; not without the voice: but the meaning is, that we should not please and content our selves with the outward sound without an inward sense. 3. With grace in the heart, Col. 3:16, that is, (as I conceive), with a godly and gracious frame of heart inwardly, (according as the matter of the Psalm is), showing itself in a graceful and dexterous demeanor in that duty outwardly (as in a comely and reverent gesture, a decent tune and tone)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preservative of Piety in a Quiet Reasoning for those duties of religion, that are the means and helps appointed of God for the preserving and promoting of godliness</cite>, … (London, 1662), Pt. 2, Ch. 4, ‘Of Singing of Psalms, and namely, in Families’, pp. 195-6. Thomas was a rector in the Anglican Church.</span></figcaption>

<blockquote><p>Some promoters of singing hymns may differ with the [OPC] majority and minority reports, alleging that perhaps the phrase “singing of psalms” in the Westminster Confession of Faith may not mean that only psalms are to be employed in public worship. Some Presbyterians have argued that the term ‘psalms,’ being a lower case ‘p’ might refer to psalms and hymns. In the original 1648 edition of the Westminster Directory for the Publick Worship of God, the upper case ‘P’ in the term ‘Psalms’ was consistently used;¹ but regardless of which edition is used with consistent upper or lower case, it will make no difference to the true intent of the writers and signers of the Westminster Standards. The following Westminster documents consistently speak of singing psalms, with no mention of hymns: Westminster Confession of Faith (ch. XXI, sec. V), Westminster Form of Presbyterial Church Government (Of the Ordinances in a particular Congregation), and the Westminster Directory for the Publick Worship of God (Of the Sanctification of the Lord’s Day, Of Singing of Psalms). Acknowledging historic Presbyterian familiarity with the Synod of Dordrecht Church Order (1618-19) and the distinction made between psalms and hymns, in all fairness to legislative intent interpretation, the ‘psalms’ or ‘Psalms’ in the Westminster Standards must be biblical psalms of praise. ¹ The Westminster Standards, An Original Facsimile (Audubon, New Jersey: Old Paths Publications, 1997) In the later editions of the Westminster Standards, biblical psalms of praise, were commonly referred to as ‘psalms.’ In the reading of the Scriptures, in The Westminster Directory for the Publick Worship of God, it references exposition of the portion of Scripture read: “let it not be done until the whole chapter of psalm be ended” (Of Public Reading of the Holy Scriptures). Regarding public preaching, it speaks of some ‘text of scripture’; it further orders the use of “some chapter, a psalm, or book of the holy scripture” (Of the Preaching of the Word). In the Directory for the Publick Worship of God, there are parallel and coordinate directives to read or sing a ‘psalm,’ but no directive to sing a hymn. We find this same employment of the term ‘psalm’ or ‘psalms’ in the Authorised King James Version to refer to the Book of Psalms (see Luke 24:44). The London or Baptist Confession of Faith (1689) deliberately altered section V, of the chapter, Of Religious Worship and the Sabbath Day, to read “psalms, hymns, and spiritual songs.” The Baptists understood the legislative intent meaning of the Westminster Confession of Faith to be psalms only, as Ephesians 5:19 and Colossians 3:16 are used as proof-texts for the “singing of psalms with grace in the heart” (West. Con. ch. XXI, sec. V). The Baptists, therefore, decidedly rejected the historic Westminster Presbyterian interpretation of Ephesians 5:19 and Colossians 3:16. The 17th century Westminster Presbyterians interpreted, “psalms, hymns, and spiritual songs” (Eph. 5:19; Col. 3:16) to the Book of Psalms.</p></blockquote>

<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which things are natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which things are natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.”

— William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship… (1633), pp. 495-96">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Rejoinder+%5Bof+an+apponent%5D+brings+abundance+of+instances+%5Bfor+human+ceremonies+idolatrously+abused%5D+out+of+his+old+store%3A+1.+Kneeling%2C+bowing%2C+prostrating%2C+lifting+up+of+the+eyes%2C+and+of+the+hands%2C+shouting%2C+and+dancing+for+joy+%5Bwhich+things+are+natural+worship%5D.+But+these+we+absolutely+deny+to+be+human+inventions.+The+Rejoinder+knew+this+and+therefore+by+prevention+replies%3A+to+say+these+are+not+human+inventions+because+they+partly+spring+out+of+natural+light+is+as+much+as+to+say+they+are+not+because+they+are+human+inventions%3A+for+what+are+human+inventions%2C+but+such+as+spring+out+of+natural+light%3F+What%3F+the+cross+and+surplice%3B+the+cornered-cap+and+tippet%3B+the+bishop%E2%80%99s+rochet+and+cope%2C+with+a+thousand+such+like%3B+which+whoesoever+will+equal%2C+or+%28in+regard+of+naturalness+and+willfull+invention%29+liken+unto+lifting+up+of+eyes+and+hands%2C+etc.+in+prayer%2C+must+for+that+time+lay+aside+right+natural+invention+and+judgment%E2%80%A6+I+think+it+would+trouble+all+the+graduates+in+England+to+find+out+that+natural+light+from+whence+bachelors+of+art%2C+maisters+of+art%2C+bachelors+and+doctors+of+divinity+received+their+several+kinds+of+hoods%2C+even+as+much+as+to+find+out+light+of+nature+for+all+the+several+habits+of+monks.+But+%28says+the+Rejoynder%29+all+came+from+natural+light%2C+better+or+worse%2C+more+or+less+agitated%2C+just+as+men%E2%80%99s+long+hair+and+women%E2%80%99s+short%2C+which+nature+itself+teaches+to+be+uncomely+%28according+to+the+apostle%E2%80%99s+light+%5B1+Cor.+11%3A14%5D%29+came+from+the+light+of+nature.+It+is+natural+to+a+child%2C+for+to+suck+the+dug+and+after+to+put+the+hand+to+the+mouth%3B+and+after+to+creep+or+go%3A+Is+it+like+natural+to+sound+a+certain+distinct+sound+upon+a+trumpet%3F+to+dance+a+certain+round%2C+or+galliard+after+every+fiddle%3F+It+is+natural+for+a+child+to+signify+his+discerning+of+those+that+it+is+used+to+by+some+such+sound+as+dad+and+mam%2C+but+not+to+make+verses+in+a+certain+number.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+God%E2%80%99s+Worship%E2%80%A6+%281633%29%2C+pp.+495-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58bfd29c22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58bfd29c22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=the%20Rejoinder%20%5Bof%20an%20apponent%5D%20brings,make%20verses%20in%20a%20certain%20number&amp;text=the%20Rejoinder%20%5Bof%20an%20apponent%5D%20brings%20abundance%20of&amp;text=not%20to%20make%20verses%20in%20a%20certain%20number" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b5fd610e77" data-kw="">
<blockquote><p>And when the Scripture assures us that it was their practice to use Psalms and Hymns, and spiritual songs, praising God and praying unto Him in the words of David… And when we all account it our duty to praise God in singing David’s Psalms, some of which, as we use them [in the psalters they had], are of a mean composure and carry expressions beneath the majesty of Scripture; others, such as concerned the Jewish Church only; why ought not the apostles, and we as necessarily, to use this form of prayer sanctified by our Savior’s own lips?</p></blockquote>

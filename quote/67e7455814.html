<main class="wrap"><figure class="quote" id="q-67e7455814" data-kw="">
<blockquote><p>The 14th Chapter of Ecclesiastical doctrine is of the Lord’s keys, of which he says to Peter, I will give thee the Keys of the Kingdom of Heaven, and these keys are the peculiar function or Ministry and administration of Christ his power, and his holy Spirit; which power is committed to the Church of Christ, and to the Ministers thereof, unto the end of the world: that they should not only by preaching publish the holy Gospel, although they should do this especially, that is, should shew forth that Word of true comfort, and the joyful message of peace, and new tidings of that favor which God offers, but also that to the believing and unbelieving, they should publicly or privately denounce and make known, to wit, to them His favor, to these his wrath, and that to all in general, or to everyone in particular, that they may wisely receive some into the house of God, to the communion of Saints, and drive some out from thence, and may so through the performance of their Ministry, hold in their hand the Scepter of Christ his Kingdom, and use the same to the government of Christ his Sheep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, The Confession of Bohemia, which Gillespie quotes approvingly on, p.154</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lamentations &amp; Holy Mournings of the Prophet Jeremiah</cite>, … (London: Windet, 1587), ch. 3, p. 131-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7176c29a50" data-kw="">
<blockquote><p>Hence likewise we may collect how really and cheerfully willing Christ is to save sinners. Certainly, He that makes such bitter lamentation over the foreseen ruins of Jerusalem, must needs have a very cordial, and unfeigned will and desire of her salvation… What a pathetic expostulation is here, which carries in it notices of vehement affections? Oh! how willing is Christ to give unto sinners the things that belong unto their peace? Yea, is He not more willing to bestow great things than small? Does not his willingness to give, infinitely exceed the sinners’ willingness to receive? Is not Christ more glad to receive poor and weary souls, than they are to come unto Him?… Is not every thing about Christ mighty drawing, alluring, and inviting?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger</cite>, (1679) 254 pp., pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London: T.R. &amp; E.M., 1653), on Ps. 81:13, pp. 254-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

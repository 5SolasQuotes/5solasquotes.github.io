<main class="wrap"><figure class="quote" id="q-d3cacfc1c5" data-kw="">
<blockquote><p>Because he mentions &quot;the crown of righteousness&quot; and &quot;the righteous Judge,&quot; and employs the word &quot;render,&quot; the Papists endeavor, by means of this passage, to build up the merits of works in opposition to the grace of God. But their reasoning is absurd. … for as soon as God has received us into favor, he likewise accepts our works, so as even to deign to give them a reward, though it is not due to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to Timothy, Titus, and Philemon</cite>, 2 Timothy 4:8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Because he mentions &quot;the crown of righteousness&quot; and &quot;the righteous Judge,&quot; and employs the word &quot;render,&quot; the Papists endeavor, by means of this passage, to build up the merits of works in opposition to the grace of God. But their reasoning is absurd. … for as soon as God has received us into favor, he likewise accepts our works, so as even to deign to give them a reward, though it is not due to them.”

— John Calvin, Commentaries on the Epistles to Timothy, Titus, and Philemon, 2 Timothy 4:8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause%20he%20mentions%20%22the%20crown%20of%20righteousness%22%20and%20%22the%20righteous%20Judge%2C%22%20and%20employs%20the%20word%20%22render%2C%22%20the%20Papists%20endeavor%2C%20by%20means%20of%20this%20passage%2C%20to%20build%20up%20the%20merits%20of%20works%20in%20opposition%20to%20the%20grace%20of%20God.%20But%20their%20reasoning%20is%20absurd.%20%E2%80%A6%20for%20as%20soon%20as%20God%20has%20received%20us%20into%20favor%2C%20he%20likewise%20accepts%20our%20works%2C%20so%20as%20even%20to%20deign%20to%20give%20them%20a%20reward%2C%20though%20it%20is%20not%20due%20to%20them.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Epistles%20to%20Timothy%2C%20Titus%2C%20and%20Philemon%2C%202%20Timothy%204%3A8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3cacfc1c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d3cacfc1c5.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom43" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef42b50dce" data-kw="">
<blockquote><p>This mode of expression, they tell us, is employed, because God bestows the first grace. It is really foolish to imagine that they can succeed in this way, since Paul excludes man and his utmost ability, -- not only from the commencement, but throughout, -- from the whole work of obtaining salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span></div>
<div class="actions"><button class="copy" data-copy="“This mode of expression, they tell us, is employed, because God bestows the first grace. It is really foolish to imagine that they can succeed in this way, since Paul excludes man and his utmost ability, -- not only from the commencement, but throughout, -- from the whole work of obtaining salvation.”

— John Calvin, Commentaries on the Epistles to the Galatians and Ephesians, Ephesians 2:9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis%20mode%20of%20expression%2C%20they%20tell%20us%2C%20is%20employed%2C%20because%20God%20bestows%20the%20first%20grace.%20It%20is%20really%20foolish%20to%20imagine%20that%20they%20can%20succeed%20in%20this%20way%2C%20since%20Paul%20excludes%20man%20and%20his%20utmost%20ability%2C%20--%20not%20only%20from%20the%20commencement%2C%20but%20throughout%2C%20--%20from%20the%20whole%20work%20of%20obtaining%20salvation.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Epistles%20to%20the%20Galatians%20and%20Ephesians%2C%20Ephesians%202%3A9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef42b50dce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef42b50dce.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom41" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-4926e4926f" data-kw="">
<blockquote><p>Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-congruity.html">Merit of congruity (de congruo)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.”

— Joseph Pohle, The Catholic Encyclopedia, s.v. “Merit” (1911)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEthics%20and%20theology%20clearly%20distinguish%20two%20kinds%20of%20merit%3A%20Condign%20merit%20or%20merit%20in%20the%20strict%20sense%20of%20the%20word%20%28meritum%20ad%C5%93quatum%20sive%20de%20condigno%29%2C%20and%20congruous%20or%20quasi-merit%20%28meritum%20inad%C5%93quatum%20sive%20de%20congruo%29.%20Condign%20merit%20supposes%20an%20equality%20between%20service%20and%20return%3B%20it%20is%20measured%20by%20commutative%20justice%20%28justitia%20commutativa%29%2C%20and%20thus%20gives%20a%20real%20claim%20to%20a%20reward.%20Congruous%20merit%2C%20owing%20to%20its%20inadequacy%20and%20the%20lack%20of%20intrinsic%20proportion%20between%20the%20service%20and%20the%20recompense%2C%20claims%20a%20reward%20only%20on%20the%20ground%20of%20equity.%E2%80%9D%0A%0A%E2%80%94%20Joseph%20Pohle%2C%20The%20Catholic%20Encyclopedia%2C%20s.v.%20%E2%80%9CMerit%E2%80%9D%20%281911%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4926e4926f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4926e4926f.html">Permalink</a><a class="src" href="https://www.newadvent.org/cathen/10202b.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><figure class="quote" id="q-2e33359a3e" data-kw="">
<blockquote><p>That God visits the good works of the godly with reward, and to former adds new and ampler grace, we deny not. But whosoever asserts that works have the effect of increasing justification, understands neither what is the meaning of justification nor its cause. That we are regarded as righteous when we are accepted by God, has already been proved. From this acceptance, too, works derive whatever grace they had.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on canon 24</span></figcaption>

</figure><figure class="quote" id="q-1d5aa59359" data-kw="">

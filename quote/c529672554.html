</figure><figure class="quote" id="q-9f06d33a7f" data-kw="">
<blockquote><p>How long is it since God did create the world? Four thousand years before the birth of our Saviour Christ, and so about 5614 years before this time. Why is the order of the years of the world so carefully set down in the Scripture?

1. To convince all heathen that either thought that the world was without beginning, or that it began millions of years before it did.

2. To give light to all sacred histories of the Bible… … How long was God creating the world? Six days and six nights. Why was He creating so long, seeing He could have perfected all the creatures at once and in a moment? First, to show the variety, distinction and excellency of his several creatures. Secondly, to teach us the better to understand their workmanship, even as a man which will teach a child in the frame of a letter will first teach him one line of the letter, and not the whole letter together. Thirdly, to admonish us that we are bound to bestow more time in discerning and knowing them than we do. Fourthly, that we might also by his example finish our work in six days. Fifthly, that we might observe, that many of the creatures were made before those which are ordinarily their causes, and thereby learn, that the Lord is not bound to any creature, or to any means: thus the sun was not created before the fourth day, and yet days which now are caused by the rising of the sun were before that; so trees and plants were created the third day, but the sun, moon and stars, by which they are now nourished and made to grow, were not created till after the third day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, ... (1645), A Large Explication of the Body of Christian Religion, pp. 96-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>As to writing, in this age of magniloquence I would advise every one to be very careful to use no more words than are necessary to express thought. Aim at the Aristotelic. Some men seem desirous of adumbrating their thoughts by their words. They inoculate their thought, and often with a virus. Some writers — word-fanciers — seem first to have secured a good stock of terms, if with the “curiosa felicitas,” so much the better; and then they consider how they may best fit them into a sentence!

But the result is like that of a word-fancier’s essay I once read, and a friend asked, “Is it not deep?” I answered, “Not deep, but drumlie.” Now the drumlie often looks very deep. … I always recommend Aristotle for his clearness. There is no writer like him for using no more words than he had thoughts. He is the very model of the precise and the full together. The Schoolmen lost this. Aquinas is far behind his “Philosophus” in this. But he is much subtiler. Subtility is the main feature of scholasticism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duncan.html">John Duncan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Colloquia Peripatetica</cite>, ed. William Knight (Edinburgh: Edmonston &amp; Douglas, 1870), p. 54.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

<blockquote><p>7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).</span></figcaption>

<blockquote><p>3. We neither have, nor can have here in flesh, any one proper formal conception of the Divine nature that is formally suited to the truth in the object, but only metaphorical or analogical conceptions borrowed from things better known.

4. Yet nothing beyond sense (at least) is so certainly known as God, so far as we can reach, though nothing be less perfectly or more defectively known, or less comprehended. Even as we know nothing visible more certainly than the sun, and yet comprehend nothing visible less. …

7. God is here seen in the glass of His works, with the revelation of His Word and Spirit. And from these works we must borrow our conceptions.

8. Therefore, though the thing intended when we speak of God be transcendently and only in Him, and not in the creature, yet the first use of the words is to signify something in the creature. And therefore the creature is the famosius analogatum, though nothing to God.</p></blockquote>

</figure><figure class="quote" id="q-e496c4e922" data-kw="">
<blockquote><p>I call to witness theology, the queen and mistress of the other branches of learning, and it is almost our especial task to see that these are ready handmaids to it; not that confused theology drawn from the ditches of the scholastics, nor the theology that is merely common and teachable material handed down in a variety of manuals by scores of quite worthy and not inadequate men; but theology that is free, pure and undefiled drawn in from the fountain of fountains with the Holy Spirit and power of Almighty God aiding – and indeed completing – the whole task; theology that daily blossoms forth using all the supports of true philosophy and the other branches of knowledge which can serve to help or adorn it. We see the inmost shrines of truth unlocked and hidden meanings of the living page unearthed and set before us. ‘Hence the light and sacred draughts.’</p></blockquote>

<blockquote><p>Paley’s argument presupposes that teleology is extrinsic; Aquinas follows Aristotle in holding that it is immanent to the natural order. Paley therefore focuses on complex phenomena, especially biological phenomena, as uniquely indicative of teleology; Aquinas takes all natural phenomena, however simple or complex and whether organic or inorganic, to manifest teleology. Paley is presenting a cumulative and probabilistic “argument to the best explanation”; Aquinas is putting forward a metaphysical demonstration… But Paley is at least seriously threatened by it [Darwinian evolution], while the Fifth Way is not threatened by it at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147, p. 82</span></figcaption>

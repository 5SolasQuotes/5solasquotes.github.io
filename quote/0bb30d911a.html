<main class="wrap"><figure class="quote" id="q-0bb30d911a" data-kw="">
<blockquote><p>Sundry religious ordinances are appointed in the New Testament: that there should be every Lord’s Day a collection for the poor: that the man being after a more excellent manner the image of God should pray bare-headed, not being ashamed to show his head, but having a kind of headship over the woman; and the woman should cover her head, when she prays… no Christian Church can consist without some external rites and ceremonies, which if they be not repugnant to the Word of God, are to be observed by us, as these ordinances of religion were by the Jews. …In these indifferent things which in their own nature are neither good, nor evil, we must not contend, breaking the peace and unity of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Philemon and Hebrews</cite>, (London, 1635), on Heb. 9:1, pp. 327-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18487bdd66" data-kw="">
<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints Happiness</cite>, … (London: M.S., 1660), pp. 15-16</span></figcaption>

<blockquote><p>A recent letter from one of the world’s leading Greek lexicographers, P.G.W. Glare, has undermined a foundational building block in the egalitarian view of marriage. Glare denies that the word ‘head’ ever had the meaning ‘source’ in ancient Greek literature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The meaning ‘source’ ‘does not exist’: Liddell-Scott editor rejects egalitarian interpretation of ‘head’</cite>, (kephale)’ in CBMW News, vol. 2, no. 5 (Dec. 1997), pp. 1, 7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“A recent letter from one of the world’s leading Greek lexicographers, P.G.W. Glare, has undermined a foundational building block in the egalitarian view of marriage. Glare denies that the word ‘head’ ever had the meaning ‘source’ in ancient Greek literature.”

— Wayne Grudem, ‘The meaning ‘source’ ‘does not exist’: Liddell-Scott editor rejects egalitarian interpretation of ‘head’ (kephale)’ in CBMW News, vol. 2, no. 5 (Dec. 1997), pp. 1, 7-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+recent+letter+from+one+of+the+world%E2%80%99s+leading+Greek+lexicographers%2C+P.G.W.+Glare%2C+has+undermined+a+foundational+building+block+in+the+egalitarian+view+of+marriage.+Glare+denies+that+the+word+%E2%80%98head%E2%80%99+ever+had+the+meaning+%E2%80%98source%E2%80%99+in+ancient+Greek+literature.%E2%80%9D%0A%0A%E2%80%94+Wayne+Grudem%2C+%E2%80%98The+meaning+%E2%80%98source%E2%80%99+%E2%80%98does+not+exist%E2%80%99%3A+Liddell-Scott+editor+rejects+egalitarian+interpretation+of+%E2%80%98head%E2%80%99+%28kephale%29%E2%80%99+in+CBMW+News%2C+vol.+2%2C+no.+5+%28Dec.+1997%29%2C+pp.+1%2C+7-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c7d5fde48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c7d5fde48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=A%20recent%20letter%20from%20one%20of,meaning%20%E2%80%98source%E2%80%99%20in%20ancient%20Greek%20literature&amp;text=A%20recent%20letter%20from%20one%20of%20the%20world%E2%80%99s&amp;text=had%20the%20meaning%20%E2%80%98source%E2%80%99%20in%20ancient%20Greek%20literature" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3b1b27c588" data-kw="">
<blockquote><p>Hence forth will I now touch certain points what I would have in your common assemblies observed and kept, and what I would were avoided, that in them nothing be done either unorderly, or contentiously, or riotously… One thing more must I tell you, which is yet of no great importance, nor [is] much weighty, but such as may, if the time and place so require, be changed… Lesse hurt were it, if ye in such points agreed, since they be but externe matters, nor make so much to the furtherance of Gospel-like godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus.html">Erasmus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Tome or Volume of the Paraphrase of Erasmus upon the New Testament</cite>, … (London, 1549), on 1 Cor. 11, pp. xxx-xxxi</span></figcaption>

</figure><figure class="quote" id="q-10e4283e38" data-kw="">
<blockquote><p>As penitent sinners of various kinds were ordered to sit in the church ”bare-heidit all the tyme of the sermons,’¹ it would appear that the members of the congregation kept their hats on during that time. This is also implied by Knox’s statement that the Earl of Huntly pulled down his bonnet over his eyes when the preacher denounced certain vices.² In 1637, George Gillespie says: ‘A man coming into one of our churches in time of public worship, if he see the hearers covered, he knows, by this customable sign, that sermon is begun.”‘³ Thomas Kirk, an Englishman, who visited Dundee in 1677, says: “We heard a sermon at the greatest church; they first sing a psalm, and then the minister begins his prayer, and as soon as he has taken his text they all put on their hats.’† By the beginning of the eighteenth century many Scottish Presbyterians uncovered their heads during sermon.° The custom survived in the Scottish Church at Rotterdam until at least the last quarter of the nineteenth century. At one time the ministers of Scotland may have kept their hats on while preaching, as French and Dutch Protestant preachers did.ª ¹ Booke of the Universall Kirk, 2:692. ² Laing’s Knox, 2:362. ³ Dispute Against the English-Popish Ceremonies, 1637, part 3, p. 86. † Kirk and Thoresby’s Tours in Scotland, p. 19. — In England, during part of the seventeenth century, it was customary for the people to sit in church with their hats on, and to take them off when they sang the Psalms (Brand’s Popular Antiquities, Bohn’s ed., 2:323). Some lifted them at the name of Jesus [according to the Anglican custom] (Marsden’s Early Puritans, 1853, p. 347). ° An Examination of Three Prelatical Pamphlets, 1703, p. 18. ª “He [i.e. Alix] was bold and brisk in the pulpit, and when he read his text, he cocked his hatt; but Claud, when he put on his hat, slipped it on, and drew down the sides of it” (Wodrow’s Analecta, 2:273). ‘The ministers’ of the Church of Holland ‘are covered in the time of sermon’ (Lieut. -Col. Erskine to Wodrow in 1728, Edinburgh Christian Instructor, xxvii, 265). This custom was approved by at least one eminent English [Independent] Puritan. “Mr. [Philip] Nye told us his private judgement, that in preaching he thinks the minister should be covered, and the people discovered; but in the sacrament, the minister should be discovered, as a servant, and the guests all covered.” (Laing’s Baillie’s Letters, 2:149).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformation in Scotland</cite>, … (London: Hodder &amp; Stoughton, 1910), pp. 301-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

stom%5D+%28Marsden%E2%80%99s+Early+Puritans%2C+1853%2C+p.+347%29.+%C2%B0+An+Examination+of+Three+Prelatical+Pamphlets%2C+1703%2C+p.+18.+%C2%AA+%E2%80%9CHe+%5Bi.e.+Alix%5D+was+bold+and+brisk+in+the+pulpit%2C+and+when+he+read+his+text%2C+he+cocked+his+hatt%3B+but+Claud%2C+when+he+put+on+his+hat%2C+slipped+it+on%2C+and+drew+down+the+sides+of+it%E2%80%9D+%28Wodrow%E2%80%99s+Analecta%2C+2%3A273%29.+%E2%80%98The+ministers%E2%80%99+of+the+Church+of+Holland+%E2%80%98are+covered+in+the+time+of+sermon%E2%80%99+%28Lieut.+-Col.+Erskine+to+Wodrow+in+1728%2C+Edinburgh+Christian+Instructor%2C+xxvii%2C+265%29.+This+custom+was+approved+by+at+least+one+eminent+English+%5BIndependent%5D+Puritan.+%E2%80%9CMr.+%5BPhilip%5D+Nye+told+us+his+private+judgement%2C+that+in+preaching+he+thinks+the+minister+should+be+covered%2C+and+the+people+discovered%3B+but+in+the+sacrament%2C+the+minister+should+be+discovered%2C+as+a+servant%2C+and+the+guests+all+covered.%E2%80%9D+%28Laing%E2%80%99s+Baillie%E2%80%99s+Letters%2C+2%3A149%29.%E2%80%9D%0A%0A%E2%80%94+David+Hay+Fleming%2C+The+Reformation+in+Scotland%E2%80%A6+%28London%3A+Hodder+%26+Stoughton%2C+1910%29%2C+pp.+301-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F10e4283e38.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/10e4283e38.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=As%20penitent%20sinners%20of%20various%20kinds,all%20covered.%E2%80%9D%20%28Laing%E2%80%99s%20Baillie%E2%80%99s%20Letters%2C%202%3A149&amp;text=As%20penitent%20sinners%20of%20various%20kinds%20were%20ordered&amp;text=the%20guests%20all%20covered.%E2%80%9D%20%28Laing%E2%80%99s%20Baillie%E2%80%99s%20Letters%2C%202%3A149" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

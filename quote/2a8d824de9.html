el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-78f1af44c6" data-kw="">
<blockquote><p>First: how God is not a cause when He permits. For if God were to give his efficacious grace to the will, it would not sin. I respond that this doubt is common to all and looks elsewhere. Briefly, however, I say that for us, who hold every sin to be an effect of reprobation [this is hard language which the Reformed often spoke against]… the response is at hand: namely, that God is not bound to exhibit efficacious grace, since through original sin its privation has been incurred [the Reformed agree with this]; and therefore the permission is just. [The Reformed generally disagree:] He does give sufficient grace, with which man can and without which he cannot avoid sin. And in that permission God foresees that the man will sin, as we have often taught with Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>However the will depends on God, and whatever God works in it, it always retains the liberty which we said consists in immunity from the threefold necessity of coercion, determination by matter, and determination by sense.</p></blockquote>

</figure><figure class="quote" id="q-bfe47d0801" data-kw="">
<blockquote><p>We reject likewise the fictions of the Pelagianizers: Concerning the conditioned will, concerning the decree of velleity or desire. Concerning Middle or conditioned Knowledge, by which that desired determination is said to be foreseen. Concerning the intention of conditioned concourse concomitantly into the effect—and consequently concerning the simultaneous concourse and egress of grace and free will, which is really independence and primacy, pre-running and predetermination of the second cause. Concerning universal sufficient grace, and according to it a salvific calling, whose presupposition is the grace of universal redemption, reconciliation, and confederation. Which fictions have been sufficiently sifted by the authors just cited, partly also by the Dominican theologians and other genuine followers of Thomas, whom you will see alleged in those authors passim [throughout], and especially in Sylvius the Douai theologian, in his treatise On the Motion of the First Mover. Of our men, Ferri in his Orthodox Scholastic and its Defense against the Jesuit Perrin has rendered most useful service here. The Various Dissertations on the [End] Term of Life edited by Beverovicio can also be compared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>I returned, and saw under the sun, that the race is not to the swift, nor the battle to the strong, neither yet bread to the wise, nor yet riches to men of understanding, nor yet favour to men of skill; but time and chance happeneth to them all.” – Eccl. 9:11 Wettstein, Gernler &amp; Buxtorf – 6. Providence in A Syllabus of Controversies in Religion which come between the Orthodox Churches &amp; whatever other Adversaries, for material for the regular disputations… customarily held in the theological school of the academy at Basil (Basil, 1662), pp. 19-21 . 1700’s Hottinger, Johann J. – A Theological Exercitation on the Immediate Operation of God in the Soul of Man (Zurich, 1714) 54 pp. . . Latin Book 1600’s Rutherford, Samuel – A Scholastic Disputation on Divine Providence… (Edinburgh, 1649) 620 pp. ToC English ToC . . Historical Theology On the 1500’s-1600’s Article Matava, R.J. – ‘A Sketch of the Controversy de auxiliis‘ in Journal of Jesuit Studies (Apr, 2020) Abstract: “In the 16th century, the Dominicans and the Jesuits engaged in a polarized theological debate about how God can move the human will in a way that neither compromises human free choice nor makes God the author of moral evil. This debate, called the “controversy de auxiliis,” was never resolved. In 1607, Pope Paul V decreed that neither side was heretical and forbade further publishing on the issue without his explicit permission. This article explains the main theological points of the various Dominican and Jesuit actors, the human factors that contributed to the debate…</p></blockquote>

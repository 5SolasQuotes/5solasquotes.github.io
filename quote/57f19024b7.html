</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f78ef9fd2e" data-kw="">
<blockquote><p>A spiritual prayer is accompanied with the use of means… When Hezekiah was sick, he did not only pray for recovery, but he laid a lump of figs to the boil, Isa. 38:21. Thus it is in case of the soul, when we pray against sin, and avoid temptations; when we pray for grace, and improve opportunities, this is the laying a fig to the boil, which will make us recover: To pray for holiness, and neglect the means, is like winding up the clock, and pulling off the weights.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Godly Man’s Picture Drawn with a Scripture Pencil</cite>, (London, 1666), p. 125</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-dcb6304b89" data-kw="">
<blockquote><p>Instead then of listening to infidel counsel, and shutting up our churches at any of the wonted [accustomed] times of worship, let their doors be invitingly opened, and with frequency let sincere supplication, with humiliation and fasting, be presented to our merciful God. This is a duty which ought not to be perfunctorily performed; but one to which individuals, and families, and fellowships, and all other religious associations, are bound to attend, and in which they ought to abound, praying that a spirit of grace and of supplication may be poured out upon all; and that, by repentance and reliance on the efficacious atonement of our blessed Redeemer, God may be graciously pleased to hear and to heal. Jesus has given every encouragement to believing social prayer in his name: “ If two of you shall agree on earth as touching any thing that they shall ask. it shall be done for them of my Father which is in heaven.” Mat. xviii. 19. Let united, fervent, and believing supplication be sent up then to the throne of God, and we shall have reason to rejoice in the issue. Let it not be said of us as it is written against Asa, King of Judah, after all the Lord had done for him, who “ was diseased in Iris feel, until his disease was exceeding great; Yet in his disease lie sought to the Lord, but to the physicians.” 2 Chron. xvi. 12. But in the midst of abounding sin and alarming indifference, it is matter of the greatest consolation to each individual believer, that whatever becomes of the nation, his own faith and repentance will not pass unrewarded, if he truly put his trust and dependence on the living God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Cause of the Prevalence of Pestilence, and other judgments of God</cite>, (Paisley, 1832), p. 34. Begg (1808–1883)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-f44d0de2e8" data-kw="">
<blockquote><p>…but some greater kingly power is due to the king in the case of the Churches aberring, than in the case of the Churches’ right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which is extraordinary], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only (for he that is not with Christ is against Him), but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pp. 413-4</span></figcaption>

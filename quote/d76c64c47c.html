<main class="wrap"><figure class="quote" id="q-d76c64c47c" data-kw="catholic invisible">
<blockquote><p>Even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. This question truly belongs to another controversy, concerning the perpetual appearance and conspicuousness of the church as to external state. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.7.1b</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 54</span></figcaption>

</figure><figure class="quote" id="q-3173b205cc" data-kw="">
<blockquote><p>Previously, men had looked to the Church for all the trustworthy knowledge of God obtainable, and as well for all the communications of grace accessible. Calvin taught them that neither function has been committed to the Church, but God the Holy Spirit has retained both in His own hands and confers both knowledge of God and communion with God on whom He will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin and Calvinism</cite>, Appendix, &quot;Calvin as a Theologian,&quot; p. 492</span></figcaption>

</figure><figure class="quote" id="q-73a9ff7cc5" data-kw="invisible church">
<blockquote><p>That the statement of this most vexed question may be rightly exhibited, the origin of the controversy must be inquired into. The Romanists suppose that the church was called invisible by us in order to satisfy the question asked of us by them—where our church was before Luther. Since we could not show that our church was perpetually visible in the world, we excogitated this distinction—that the visible church is one thing, the invisible another. But they interpret our opinion falsely. For even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.7.1</span></figcaption>

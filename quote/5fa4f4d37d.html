<main class="wrap"><figure class="quote" id="q-5fa4f4d37d" data-kw="">
<blockquote><p>In this post, Moses Roney’s Reformed Presbyterian periodical continues its praise of the Scottish Reformers for bringing education to the people. After discussing how King James VI and Charles I wanted to use schools for sinister purposes, Dr Humphrey points out that the Reformed Church of Scotland was willing to provide the schools themselves (even though the civil rulers often neglected to do their duty). According to the Scottish theory of the two-kingdoms, education does not need to be monopolised by either church or state, instead both institutions should co-operate to promote the glory of God in the training of the nation’s youth:

But the church of Scotland did not [for] wait these tardy and sinister moves of the government. Those good men, who saw so early and clearly what was necessary to lay the foundations of Protestantism broad and deep throughout the country, determined to do what they could for the establishment of parochial schools, however neglectful the civil rulers might be of their duty. While they expostulated with the nobility for their supineness, they exerted themselves as if all the hopes of Scotland depended on their efforts; in so much that, in the Lowlands especially, popular education had made great progress before the state came to their aid. It is stated in a document still extant, that only twenty years after the reformation, ‘so great had been the progress of religious instruction in a country where, forty years before, the Bible was not suffered to be read, that almost every house possessed a copy, and that it was read in it!’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, p. 306</span></figcaption>

<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as:

1. Unwritten traditions—not necessary, not written.

2. Human mystical, symbolical signs and ceremonies—not necessary, not written.

3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written.

4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>

</figure><figure class="quote" id="q-0d368330bf" data-kw="">
<blockquote><p>In the churches, we know that there were many ἐπισκοποι (Acts 20:17, 28; Phil. 1:1), and this work of overseeing was specifically charged to the πρεσβυτεροι (Acts 20:17, 28; 1 Tim. 3:1–7; 5:17; Titus 1:5, 7; 1 Pet. 5:1–3). In line with this, Peter also calls himself an elder (πρεσβυτερος, 1 Pet. 5:1). Of a special institution of the episcopate alongside the presbyterate, accordingly, the New Testament knows nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §502</span></figcaption>

</figure><figure class="quote" id="q-0e31d655df" data-kw="">
<blockquote><p>Other two questions here are shortly to be discussed, as belonging to this purpose, as:

1. Whether discipline be a mark of the visible Church? Mr. [John] Robinson says [that] the power of censures is simply necessary for the being of the Church; sundry of our divines affirm it is. So the learned professors of Leiden, and Ursinus with Pareus. Great Junius says [that] it is a note belonging to the Church’s order, ad decorum; the [Lutheran] Augsburg Confession leaves it out from amongst the notes, and so does Calvin and Whittaker, making two notes only: Word and sacraments. Learned Beza makes only the preaching of the Word a note, not excluding the other two. I think distinctions may help the matter:

1. There is a power of discipline, and there is a care thereof. True Churches have a power given them of Christ, and this Robinson proves, and no more; yet the care to exercise the power may be wanting [lacking] in a true Church. 2nd Distinction: Right discipline is not necessary for the essence of a visible Church: [1.] All our divines condemn Anabaptists and Pelagians, who plead that righteous men only, and such societies as have right discipline, to be true Churches.

2. Novatians and Donatists came near to them in this also, as we may see in Augustine. So Richard Field, Parker [and] Cartwright make it necessary to the well-being of the Church:

1. Because it is not indifferent.

2. Because it is commanded in God’s Word.

3. Discipline in the substantial points is immutable.

4. It is necessary in respect of the end. And all this the learned Parker demonstrates to be true. But it is not necessary simply to the being of it: as a city may be without walls, a garden without an hedge. 3rd Distinction: The power and right to discipline is a propriety essential to the Church, and is not removed from it till God remove the candlestick and the Church cease to be a visible Church; but the exercise may be wanting and the Church a true visible Church, from which we are not to separate. 4th. Discipline is a necessary note and inseparable from a visible Church, whole, entire and not lame and imperfect. But a Church may retain the essence and being of a visible Church, and yet have no discipline in actual use, or little; and though want of discipline do leaven a Church, yet it does not (as Robinson says) evert the nature thereof and turn it into Babylon and a den of dragons. Robinson will have profaneness and impiety, by absolute necessity, rooted out by discipline; but he is too hasty. Nay, not by public preaching of a sent pastor through absolute [necessity], but only through ordinary and conditional necessity. You bind the Almighty too hard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), ch. 9, section 9, pp. 287-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>A particular church, gathered and completely organized according to the mind of Christ, consists of officers and members; and the officers appointed by Christ to be chosen and set apart by the church (so called and gathered), for the peculiar administration of ordinances, and execution of power or duty, which he intrusts them with, or calls them to, to be continued to the end of the world, are bishops or elders, and deacons.</p></blockquote>

<blockquote><p>There hath been of old an irreconcilable feud between light and darkness, between good and evil, and wheresoever truth hath had its dwelling, there error and falsehood have endeavoured to intrude themselves; so that no sooner was truth incarnate in the person of our Lord Jesus, but Antichrist, yea many Antichrists did arise and set themselves against it; sed magna fuit veritas &amp; praevalebat, truth was great and did prevail.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fec9bbb050" data-kw="">
<blockquote><p>The fourth commandment commands “to keep holy the day of the Sabbath” (תבש םוי). The Sabbath is rest from work. God commands “to keep holy” and be devoted to the time of that rest by keeping, worshipping, glorifying the holy things of the one true God, and hallowing His name with thoughts and cares. For the Sabbath is necessary to be performed for the Lord (חהיל), for the grace of the honour and worship of the Lord (Ex. 20:8–11; 31:15). Hence, neither is all cessation commanded, nor that from any work that man takes up for the necessity of his life, but from servile work (חכאלמ) (Lev. 23:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), XIV.XIII, Kindle Locations 2296-2301.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Finally, you may see the growing danger of indifference which I speak of in the painful increase of Sabbath-breaking in the land. In town and in country, in Belgravia and Bethnal Green, the state of things is the same. Full Churches are the exception on Sunday, and half-empty Churches are the rule. A religious census of any large population tells the same story. The Fourth Commandment of the Decalogue seems to be left out in the cold and ready to die.

Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting everyone do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his favourite campaign against the Lord’s Day than he has done since the Reformation. You may see what I mean, in the persistent attempts now made to throw open places of amusement, aquariums, museums, picture galleries, and such-like places, under the plausible pretence of ‘affording recreation to the working classes.’

I have no hesitation in saying that this unmistakable increase of Sabbath neglect is one of the worst symptoms of the increase of indifference to vital religion in our days. There is an inseparable connection between the observance of the Lord’s Day and the prosperity of to true religion. Voltaire was quite right when he said he could never succeed in destroying Christianity unless he destroyed Sunday. Whether Englishmen know it or not, their Sabbath has been one of their richest possessions, and the grand secret of their position in the world. Of it the famous words may be truly used, that ‘it is the cheap defence of a nation.’ [Edmund Burke] It is a simple fact that wherever spiritual religion in a Church is strong and vigorous, the honour of Sunday goes up, and wherever it decays, Sunday ceases to be well observed. In a word, Sunday is the barometer of every so-called Christian nation. Tell me how Sunday is kept in a land, and I will tell you what the Church of the land is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts for Thinkers: An Address given to the Sixteenth Liverpool Diocesan Conference, in St George s Hall, November 2, 1897’ in Charges and Addresses</cite></span></figcaption>

</figure><figure class="quote" id="q-35279583c3" data-kw="">
<blockquote><p>The primitive Church also of Christ his apostles had no images, either of Christ himself or of other saints set up in their places of public prayer, nor in their Churches. The deed of Epiphanius is very well known which he committed at Anablacha in Syria. It is written in Greek in an epistle to John Bishop of Jerusalem, and translated into Latin by St. Jerome: He rent the vail that hung in the temple [church building], bearing in it the image of Christ or some other saint, testifying therewithal that it is against Christian religion for the picture of a man, to hang in the Church of God. Saint Augustine in Catalogo haerese [Greek] makes mention of one Marcella a follower of Carpocrates his sect, which worshipped the images of Jesu, Paul Homer and Pythagoras, with falling down prostrate before them and offering incense unto them…. Furthermore, for Christ our Lord and very God, though he have taken on him the nature of us men, yet that notwithstanding, there ought no image to be erected. For he did not become man to that intent. But he drew up his humanity into heaven, and therewithal gave us a charge, that so often as we pray, we shoulde lift up the eyes of our minds and bodies into heaven above. Moreover, being once ascended, he sent his Spirit instead of himself, unto the Church wherin he has a spiritual kingdom, and needs not any bodily or corruptible things. For he commanded that if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now, since without all controuersy, our Christ is the very true God, and that the very true God does forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man, it follows consequently that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The primitive Church also of Christ his apostles had no images, either of Christ himself or of other saints set up in their places of public prayer, nor in their Churches. The deed of Epiphanius is very well known which he committed at Anablacha in Syria. It is written in Greek in an epistle to John Bishop of Jerusalem, and translated into Latin by St. Jerome: He rent the vail that hung in the temple [church building], bearing in it the image of Christ or some other saint, testifying therewithal that it is against Christian religion for the picture of a man, to hang in the Church of God. Saint Augustine in Catalogo haerese [Greek] makes mention of one Marcella a follower of Carpocrates his sect, which worshipped the images of Jesu, Paul Homer and Pythagoras, with falling down prostrate before them and offering incense unto them…. Furthermore, for Christ our Lord and very God, though he have taken on him the nature of us men, yet that notwithstanding, there ought no image to be erected. For he did not become man to that intent. But he drew up his humanity into heaven, and therewithal gave us a charge, that so often as we pray, we shoulde lift up the eyes of our minds and bodies into heaven above. Moreover, being once ascended, he sent his Spirit instead of himself, unto the Church wherin he has a spiritual kingdom, and needs not any bodily or corruptible things. For he commanded that if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now, since without all controuersy, our Christ is the very true God, and that the very true God does forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man, it follows consequently that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.”

— Heinrich Bullinger, Fifty Godly &amp; Learned Sermons divided into Five Decades, … (1549; London: 1577), 2nd Decade, 2nd Sermon, Of God’s Law, and of the Two First Commandments of the First Table, pp. 121-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+primitive+Church+also+of+Christ+his+apostles+had+no+images%2C+either+of+Christ+himself+or+of+other+saints+set+up+in+their+places+of+public+prayer%2C+nor+in+their+Churches.+The+deed+of+Epiphanius+is+very+well+known+which+he+committed+at+Anablacha+in+Syria.+It+is+written+in+Greek+in+an+epistle+to+John+Bishop+of+Jerusalem%2C+and+translated+into+Latin+by+St.+Jerome%3A+He+rent+the+vail+that+hung+in+the+temple+%5Bchurch+building%5D%2C+bearing+in+it+the+image+of+Christ+or+some+other+saint%2C+testifying+therewithal+that+it+is+against+Christian+religion+for+the+picture+of+a+man%2C+to+hang+in+the+Church+of+God.+Saint+Augustine+in+Catalogo+haerese+%5BGreek%5D+makes+mention+of+one+Marcella+a+follower+of+Carpocrates+his+sect%2C+which+worshipped+the+images+of+Jesu%2C+Paul+Homer+and+Pythagoras%2C+with+falling+down+prostrate+before+them+and+offering+incense+unto+them%E2%80%A6.+Furthermore%2C+for+Christ+our+Lord+and+very+God%2C+though+he+have+taken+on+him+the+nature+of+us+men%2C+yet+that+notwithstanding%2C+there+ought+no+image+to+be+erected.+For+he+did+not+become+man+to+that+intent.+But+he+drew+up+his+humanity+into+heaven%2C+and+therewithal+gave+us+a+charge%2C+that+so+often+as+we+pray%2C+we+shoulde+lift+up+the+eyes+of+our+minds+and+bodies+into+heaven+above.+Moreover%2C+being+once+ascended%2C+he+sent+his+Spirit+instead+of+himself%2C+unto+the+Church+wherin+he+has+a+spiritual+kingdom%2C+and+needs+not+any+bodily+or+corruptible+things.+For+he+commanded+that+if+we+would+bestow+any+thing+on+him+or+for+his+sake%2C+we+should+bestow+it+on+the+poor%2C+and+not+on+his+picture+or+image.+And+now%2C+since+without+all+controuersy%2C+our+Christ+is+the+very+true+God%2C+and+that+the+very+true+God+does+forbid+to+hallow+to+him+any+likeness+of+man%2C+that+is%2C+to+represent+God+in+the+shape+of+a+man%2C+it+follows+consequently+that+to+Christ+no+image+is+to+be+dedicated%2C+because+he+is+the+true+and+very+God+and+life+everlasting.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+Godly+%26+Learned+Sermons+divided+into+Five+Decades%2C+%E2%80%A6+%281549%3B+London%3A+1577%29%2C+2nd+Decade%2C+2nd+Sermon%2C+Of+God%E2%80%99s+Law%2C+and+of+the+Two+First+Commandments+of+the+First+Table%2C+pp.+121-22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F35279583c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/35279583c3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=The%20primitive%20Church%20also%20of%20Christ,and%20very%20God%20and%20life%20everlasting&amp;text=The%20primitive%20Church%20also%20of%20Christ%20his%20apostles&amp;text=the%20true%20and%20very%20God%20and%20life%20everlasting" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

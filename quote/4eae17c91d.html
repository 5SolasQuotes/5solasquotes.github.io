<main class="wrap"><figure class="quote" id="q-4eae17c91d" data-kw="">
<blockquote><p>some years, when I had but very little, if any, experimental acquaintance with access to God through Christ; until the Lord was pleased to visit me with sore affliction, whereby I was brought to the mouth of the grave, and under which my soul was oppressed with horror and darkness; but God graciously relieved my spirit by a powerful application of Psalm 130:4, ‘But there is forgiveness with thee, that Thou mayest be feared;’ from whence I received special instruction, peace, and comfort, in drawing near to God through the Mediator, and preached thereupon immediately after my recovery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Exposition on Ps. 130</cite>, (1669) 566 pp. | “Mr [Richard] Davis, being under religious impressions, had sought a conference with Owen. In the course of the conversation, Dr Owen put the question, “Young man, pray in what manner do you think to go to God?” “Through the Mediator, sir,” answered Mr Davis. “That is easily said,” replied the Doctor, “but I assure you it is another thing to go to God through the Mediator than many who make use of the expression are aware of. I myself preached Christ,” he continued</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c5132bea7" data-kw="">
<blockquote><p>In times of public calamity, as a general rule we should stand in our lot, and do and suffer the Lord’s will there. We may indeed flee from pestilence, if we neglect no duty in so doing. This may sometimes be done, especially where a whole community may retire to a healthy spot. Where this cannot be done, let physicians, ministers of the Gospel, public officers and those who may be useful as nurses stand their ground, and commit their case to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-c6852c840c" data-kw="">
<blockquote><p>The truth is, the times were very sad, and nothing but lamentation and bemoanings heard in the streets. Those that had wealth retired into the country, but those that were needy were, if not taken away by death, almost starved, and so consequently ready to mutiny against their superiors for relief. All the gates of colleges and halls were constantly kept shut day and night, a few persons being left in them to keep possession. The shops of the town were closed, none but the attendants on the sick or the collectors for them were to be seen stirring abroad, the churches were seldom or never open for divine service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london.html">Charles Creighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Epidemics in Britain, from A.D. 664 to the Extinction of the Plague</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-b5a3e459c4" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 399</span></figcaption>

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology… (London, 1673), p. 399">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWilt+thou+not+be+ruled+by+the+laws%2C+unless+thou+see+the+king%3F+wilt+thou+not+fear+the+infection+of+the+plague+unless+thou+see+it%3F+Use+thy+reason+for+thy+soul+as+well+as+for+thy+body%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%E2%80%A6+%28London%2C+1673%29%2C+p.+399&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5a3e459c4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5a3e459c4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fleeing-from-danger/#:~:text=Wilt%20thou%20not%20be%20ruled%20by,as%20well%20as%20for%20thy%20body&amp;text=Wilt%20thou%20not%20be%20ruled%20by%20the%20laws&amp;text=thy%20soul%20as%20well%20as%20for%20thy%20body" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-33f20bf472" data-kw="">
<blockquote><p>Nor do the Arminians much honor the magistrate, who, walking in the steps of Erastus, do hold that the magistrate having power of public places, preachers are obliged not to preach in public places if the magistrate forbid them; but they may preach in private places. But: …

2. The Lord has no more given to magistrates power of places, or religious-actions in places, than He has given to them power of truths: Therefore, they [Arminians] must be obliged in conscience, rejecting a vain and sapless distinction, to preach in public places: for as that judicious and learned, [reformed] professor, Jacob Triglandius says, ‘The place is accident all to the worship, and changes not the nature of it;’ (Trigland, de Potest. et Eccelesiastica Dissertatio, Theol., p. 123)…

3. The apostles knew not this distinction, for they not only preached truth (the scribes and pharisees forbidding them), but in public places, and at all occasions, and daily in the Temple, and in every house they ceased not to teach and preach Jesus Christ (Acts 6:2,4; 4:1,20; 5:20-21). The magistrate, being Antichristian, forbids not preaching of saving truths because of the place, be it private or public, but he forbids them because they are saving; and if Jesus Christ has called a man to preach in public in the housetops, the magistrate has no power from God to silence him in public more than in private. The magistrate forbids that any teach false doctrine, not for the place, but because it is injurious and hurtful to human societies that men should be principled in a false religion, and cannot but disturb the public peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), pp. 557-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<main class="wrap"><figure class="quote" id="q-a58bf7ba85" data-kw="">
<blockquote><p>When commenting on Abel’s sacrifice when preaching on Hebrews 11:4, William Perkins observed that even some ceremonial laws partly set forth moral duties that, when stripped of their ceremonial form, remain valid in every age (cf. Westminster Confession 19.3):

Now for us the truth is, this law binds us not, for it was a ceremony and is ended in Christ. Yet the equity and use of it reaches even to us – namely, it teaches us when we will give anything unto God, to give the best we have. This is the equity of those laws ceremonial, which commanded them to give to the Lord their firstborn and their firstfruits and the fattest of their cattle. And so much of them do still bind us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Whether both the symbols of bread and wine are to be administered? It is affirmed. Whether usual and truly ordinary bread [is to be used]? It is affirmed. … What in place of wine ought to be administered where wine may not be had? What is analogous. Of what kind [is to be administered to] those that abstain from the supper? The same [as the previous answer]. Whether water ought to be mixed with the wine? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, … (Utrecht, 1643), 2nd Section, ‘Of Redemption’, Tract 5, ‘Of Signs’, Title VII, ‘Of the Sacraments’, subtitle 5, ‘Of the Lord’s Supper’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-389d830e47" data-kw="">
<blockquote><p>They who write on this subject with judgment and understanding, use to distinguish three sorts of modes of men’s actions that are found in religion, viz. circumstances, rites and ceremonies. Circumstances are modifications of actions, as time, place, person; or, a circumstance is any thing that accompanies an action which is not of its essence, but is used with it, relates to it, and is an accident, or adjunct of it: and it may be such, either with respect to the pysical or moral being of the action: Circumstances use to be sorted in these memorial verses: ‘Quis, quid, ubi, quibus auxiliis, cur, quomodo, quando.’ And ‘forma, figura, locus, tempus, stirps, patria, nomen.’ Circumstance is a word of larger extent than rite, and that than ceremony; a rite is the manner of going about any action (chiefly that which is public or solemn) confirmed by law or custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), section 12, p. 276</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-4939dbe389" data-kw="">
<blockquote><p>Every art has its basic ingredients. Grammar has the alphabet. Geometry has a few simple illustrations. These basics are important to know, but they are not the whole story. Likewise the elements of the world are not the finished product, but only those things out of which the rest are put together. Similarly, righteousness has its basic elements, its own alphabet. This elementary ABC level of righteousness has its place, in the law of Moses.

But perfect righteousness is that which is found in Christ by faith. When Christ is known by faith, relapsing into a search for righteousness by observing the feasts of the law is nothing other than if someone who was a most learned professor and master of arts should lapse back into learning the alphabet. Who would not be astonished at such stupidity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio Epistolae Pauli ad Galatas</cite>, (Frankfurt, 1546). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 145.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-6a1e669d94" data-kw="">
<blockquote><p>It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially and to our edification joined with them, and yet partake in none of these: nor is [there] so much of these [human ceremonies] among them as he would make us believe.</p></blockquote>

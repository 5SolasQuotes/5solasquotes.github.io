<main class="wrap"><figure class="quote" id="q-20e177c1c2" data-kw="">
<blockquote><p>And in this way, under the head of prayer, which is an offering up of desires, there may be comprehended the consideration of the whole motives by which men are induced to engage in theological study, and in preparing for the work of the ministry. The motive by which men should be led to engage in theological study is a real desire to attain to the knowledge of God’s revealed will, and the grounds of reason of this desire, the causes that produce it, and keep it in strong and vigorous exercise, should be right views of its nature, excellence, and objects, as coming from God, as making him known to us, and as communicated by him to men, in order that they, through the knowledge and belief of it, may be saved from eternal misery, and enabled to glorify God and to enjoy him for ever.

It is because theology, as taught in the word of God, is possessed of this character, and intended to be the means of effecting these results, that you should desire the knowledge of it. And as candidates for the office of the ministry, you should seek and desire the knowledge of it, not only for your own salvation, but in order that, devoting your lives to the making it known to others, you may become the instruments of saving the souls of your fellow-men.

A desire to attain to a full knowledge of God’s revealed will, and generally to acquire all the qualifications necessary for entering upon the work of the ministry, originating in such views as these, clearly apprehended, and deeply impressed upon your hearts, will ever be accompanied with profound humility, with a deep sense of responsibility, and with a firm determination to be unwearied and persevering, to spare no pains, and to shrink from no sacrifice, in the use of all the means by which the necessary knowledge may be acquired, and the due qualifications may be secured. And the first and most indispensable of all requisites is, that you have such a desire, founded upon such views and considerations; and whenever this desire becomes at any time weak and languid, you are to seek to have it strengthened and invigorated by meditation upon the value of divine truth, and the preciousness of the salvation of souls.

When this desire has been really called forth in your hearts—and without it your labours and studies in acquiring theological knowledge cannot be expected to lead to any important practical results, but only to harden your hearts and prove offensive to God—then you will feel constrained to offer it up to God in prayer, under a conviction that he alone can gratify it, and animated by the assurance that he has promised his Holy Spirit to them that ask him.

If all your studies, and especially all your attempts to ascertain the meaning of the statements of God’s word, are not accompanied by fervent prayer for the outpouring of the Holy Spirit, the inference is irresistible, either that you do not really desire to become savingly acquainted with divine truth for your own benefit and that of others, or else that you do not really believe that God alone can bestow this knowledge, and that he usually gives it in answer to prayer.

And it is most proper that, in connection with this topic, you should examine carefully into the state of your hearts, and into the motives which have led you to engage in a course of theological study, the desires by which you are animated in the prosecution of it, and the objects which you have in view. Without right views and deep impressions of the origin and source, the character and objects of theological truth, you can have no right and well-principled desire to acquire the knowledge of it, and without such a desire existing in your heart, and distinctly recognised and felt there, you can present no sincere or acceptable prayer to God for the enlightening influences of the Holy Spirit.

Where no desire exists in the heart, of course it cannot be offered up; and where a desire for the outpouring of the Holy Spirit is not offered up, there is no reason to expect that the Spirit will be given. If you are not yet aware that a useful and really valuable knowledge of theology must come from the Holy Spirit, and is usually given in answer to prayer, you are still ignorant of the first principles of God’s oracles; and if you have no real and ardent desire to get this knowledge, and are not ready and resolved to abound and to persevere in the use of all the means which may contribute to the attainment of it, then your attendance here is a mockery, it is a hypocritical profession which does not correspond with the actual state of your hearts; and in that case it would be much safer and more expedient for you to direct your attention to some other object of pursuit.

Your prayers thus become tests of your character and motives—plain indications of the real desires that exist in your hearts, and of the objects which you are really aiming at. Although a desire to have the enlightening influences of the Holy Spirit is the only right basis, and will prove the only efficient source of prayer for his outpouring, yet it is to be remembered that the desire must not only exist, but must also be offered up.

Men are very apt to deceive themselves in regard to the state of their hearts, and the character of their desires and affections. They are not naturally inclined to pray, and you must beware of being satisfied with any other evidence of the existence and strength of that desire, under the influence of which you profess to be acting, except the fervency and the frequency with which you offer it up to God in prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture V, pp 66-68.</span></figcaption>

<blockquote><p>Faith is the key that opens the treasure chests of our God; prayer is the hand by which we grasp the treasures and are made rich. Prayer lifts our hearts from earth to heaven. It refreshes our memories of God’s promises in order to strengthen us. It brings assurance and safety against anything that causes us to fear. By it we receive from his hand all that we desire. Prayer supplies rest and peace for our souls. It maintains and strengthens reverence for the Lord. It increases the desire to turn to him who is the fountain and fullness of all things.

Prayer teaches us to forsake the world and to crucify our flesh. In prayer we see our heavenly and everlasting benefits for whose enjoyment we sigh. Nothing is more desirable as having fellowship with him apart from whom we cannot be blessed. Would you keep company with God, then you must either pray or read, for when we pray, we are speaking with God, and when we read, God is speaking to us.</p></blockquote>

</figure><figure class="quote" id="q-bded0e8fc8" data-kw="Mary Idolatry">
<blockquote><p>Giving divine honor to the holy Virgin, or worshipping her with adoration, as Protestants say, due to God alone; of ascribing all the titles of Christ unto her, turning Lord in the Psalms in most places into Lady; praying to her, not only to entreat, yea, to command her Son to help and save them, but to save them herself, as she to whom her Son hath committed the administration of mercy, keeping that of justice to himself; with many other the like horrid blasphemies, which he shall hear more of if he desire it.</p></blockquote>

</figure><figure class="quote" id="q-fa98faef09" data-kw="">
<blockquote><p>Our Saviour Christ before this prayer gives this commandment: After this manner pray ye: whereby he would not bind those whom he teacheth to pray, unto this set number of words as unto a work done: for that were to babble indeed. And the Apostles themselves, as we may read in their acts, and epistles, often prayed in other words after the delivery and receiving of this form of prayer from our Saviour Christ.

And that which is the strongest proof, Mathew and Luke setting down this Lord’s prayer, do not curiously observe the self same words altogether. But our Saviour Christ in a short example would shew unto his disciples the manner howe to pray, according as his custom was to teach a general doctrine by propounding some particular example, where under the special we are to understand the general.

And therefore in this platform of prayer, his purpose is to shew, [I] how few and small a number of words we must use in prayer, contrary to the vain babbling of the Pharisees &amp; of the Heathen. [II] Who is to be called upon, or to whom we must direct our prayer: [III] with what confidence we must pray: [IV] how and for what causes: [V] what things we are to ask: [VI] in what order: [VII] by what mean: [VIII] and for what end.

And thus are all the principal points, which are required in true prayer, contained in this platform. So that it was both truly and finely said of Austin in an Epistle to Proba, we have liberty in praying to use other words so that we say the same things which this prayer containeth: but we have not liberty to say other, divers or contrary things. And this it is which Mathew saith, cap. 6. v. 9. thus, or after this manner pray ye. And that saying of Christ recorded by S. Luke 11. v. 2. when ye pray, say is all one with this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 7-9.</span></figcaption>

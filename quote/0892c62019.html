<main class="wrap"><figure class="quote" id="q-0892c62019" data-kw="">
<blockquote><p>This can be no other in general but that which we call “the covenant of grace.” And it is so called in opposition unto that of “works,” which was made with us in Adam; for these two, grace and works, do divide the ways of our relation unto God, being diametrically opposite, and every way inconsistent, Romans 11:6. Of this covenant the Lord Christ was the mediator from the foundation of the world, namely, from the giving of the first promise, Revelation 13:8; for it was given on his interposition, and all the benefits of it depended on his future actual mediation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 77</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8f5ff4e9d" data-kw="">
<blockquote><p>These things being observed, we may consider that the Scripture doth plainly and expressly make mention of two testaments, or covenants, and distinguish between them in such a way, as what is spoken can hardly be accommodated unto a twofold administration of the same covenant. The one is mentioned and described, Exodus 24:3-8, Deuteronomy 5:2-5, — namely, the covenant that God made with the people of Israel in Sinai; and which is commonly called “the covenant,” where the people under the old testament are said to keep or break God&#x27;s covenant; which for the most part is spoken with respect unto that worship which was peculiar thereunto. The other is promised, Jeremiah 31:31-34, 32:40; which is the new or gospel covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 91</span></figcaption>

</figure><figure class="quote" id="q-f47dc6baee" data-kw="">
<blockquote><p>With respect hereunto it is that the Lord Christ is said to be the “mediator of a better covenant;” that is, of another distinct from it, and more excellent.</p></blockquote>

</figure><figure class="quote" id="q-4e78a94b75" data-kw="david">
<blockquote><p>Any “good and joyful tidings” whatsoever are called by the Greeks euangelion and by the Hebrews khshrh tvbhh. Yet that is eminently (kat’ exochēn) ascribed in Scripture to the news (the most pleasing of all) concerning the happy advent of Christ to the world, the covenant of grace made in him and the salvation obtained through him. It is not, however, used always with the same meaning. Sometimes it denotes (broadly and in general) the gratuitous covenant made in Christ. In this sense, Paul speaking of the ancient people, says, “They have not all obeyed the gospel” (Rom. 10:16); and it is said, “The gospel was preached to them that are dead” (1 Pet. 4:6). Sometimes it is put strictly and in particular either for the promise and the doctrine concerning Christ about to come (in which sense, Paul says, “The gospel was preached before unto Abraham when the promises were given to him,” Gal. 3:8); or more properly for the doctrine of Christ manifested and the fulfillment of all the promises (in which sense it is everywhere used in the New Testament for the doctrine of the mission of Christ or the completed gospel and is opposed to the epangelia, which denotes simply the doctrine of the promise of Christ in the Old Testament).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d085134a35" data-kw="">
<blockquote><p>I know there are some, that lay it unto our charge, as the false apostles did unto Paul, that we use the word of God deceitfully; they find fault with our translations of the Scriptures; they spare not to say there be a thousand faults in the New Testament; yet would they never set down five hundred, or one hundred, or fifty, or twenty-five, or five.

If there be errors in the translation, I know they were men which translated it, and they might err like men. May no translation be allowed that is not altogether perfect? as if the Greek translation were without fault, or as if many faults were not in the common vulgar translation in Latin, or in the translation of Jerome. What then? Must the Greek translation be forbidden? must Jerome’s translation, or the vulgar translation, be forbidden? As for the old Latin common translation, though many learned men have shewed the gross errors thereof; yet have they well provided for it in the council of Trent.

”Let no man dare or presume (say they) by any manner of colour to refuse the old common translation of the Bible.” Yet is no translation of ours so corrupt, as that which they have thus privileged. But if it were true, which they falsely report, reason would they did correct the errors, and so set it abroad. But thus they bear you in hand, that they may bring you in hatred of it, and pull you from the reading of the Scriptures. I will not say in what sort they abuse the word of God. What speak I of abusing? Nay, they do manifestly against and contrary to the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 36-37.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2bcb8c6370" data-kw="">
<blockquote><p>This comprehensive application of the [Scriptural] rule [articulated by Rutherford] was necessitated because the advocates for human ceremonies had argued that such things might be justified as circumstances of worship. It was maintained that circumstances which were not forbidden were lawful if they were edifying. Their reformed opponents quickly saw that this argument effectively created a class of religious actions which were beside the Word in matters of faith and worship. Their response was clear and concise: any action which served as a means of worship was a moral action and required the warrant of God’s Word. To the point, Rutherford asserted, “In actions or religious means of worship, and actions moral, whatever is beside the Word of God is against the Word of God”. (Divine Right of Church Government, 1646, [Intro, section 2], pp. 19-20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Constitutional Principle of the Scottish Reformation</cite>, 2012, vol. 2, pp. 1-42</span></figcaption>

</figure><figure class="quote" id="q-43d6c25b4d" data-kw="">
<blockquote><p>To you who are magistrates, and invested with civil authority, permit me respectfully to say, The ordinance of God and the voice of a free people have elevated you to posts of dignity and power, that you may be the sentinels of the public virtue. To you their eyes are directed, to maintain the sacredness and diffuse the blessings of the holy Sabbath. The voice of the King of kings to you is, Remember the Sabbath Day!

In your personal and official capacity never lose sight of its appointment and design. If, as our civil fathers, you would see your children rise up and call you blessed; if you would embalm your names in the remembrance of an elevated people, and transmit them with many a grateful sentiment to a distant futurity; be entreated to become the exemplary and fearless guardians of the Christian Sabbath.</p></blockquote>

</figure><figure class="quote" id="q-10f2c42ae8" data-kw="">
<blockquote><p>Now, what is the cause of most backsliding? I believe, as a general rule, one of the chief causes is neglect of private prayer. Of course the secret history of falls will not be known till the last day. I can only give my opinion as a minister of Christ and a student of the heart. That opinion is, I repeat distinctly, that backsliding generally first begins with neglect of private prayer.

Bibles read without prayer, sermons heard without prayer, marriages contracted without prayer, journeys undertaken without prayer, residences chosen without prayer, friendships formed without prayer, the daily act of private prayer itself hurried over or gone through without heart,—these are the kind of downward steps by which many a Christian descends to a condition of spiritual palsy, or reaches the point where God allows him to have a tremendous fall.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), p. 73.</span></figcaption>

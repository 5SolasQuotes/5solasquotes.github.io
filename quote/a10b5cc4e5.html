<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>

<blockquote><p>…Which comes to pass thus:

1. By habitual grace infused, the sanctified will is constantly determined to embrace all spiritual good.

2. By assisting grace the will is stirred up, provoked, allured and inclined to obedience, through the proposal of the promises and the heavenly suggestions of the Holy Spirit.

3. By the same assisting grace all contrary motions of concupiscence are subdued and kept under. So that nothing can hinder obedience to follow; because by grace the will is made willing to obey and by grace all impediments in obeying are taken away: now when all lets are removed, what can let a willing mind to do that which it desires?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), p. 155</span></figcaption>

<blockquote><p>Some of the saints are said to be perfect, as compared with worldly men, who neglect things divine, and never enter upon the path of perfection.</p></blockquote>

</figure><figure class="quote" id="q-ea53d8095e" data-kw="">
<blockquote><p>3. Though we must not conceive of God as of a human or corporeal shape, yet we cannot think of God without some reflection upon our own being. We cannot conceive Him to be an intelligent being, but we must make some comparison between him and our own understanding nature, to come to a knowledge of him. Since we are enclosed in bodies, we apprehend nothing but what comes in by sense, and what we in some sort measure by sensible objects. And in the consideration of those things, which we desire to abstract from sense, we are fain to make use of the assistances of sense and visible things: And therefore when we frame the highest notion, there will be some similitude of some corporeal thing in our fancy; and though we would spiritualize our thoughts, and aim at a more abstracted and raised understanding, yet there will be some dregs of matter sticking to our conceptions; yet we still judge by argument and reasoning, what the thing is we think of under those material images. A corporeal image will follow us, as the shadow does the body: While we are in the body, and surrounded with fleshly matter, we cannot think of things without some help from corporeal representations: Something of sense will interpose itself in our purest conceptions of spiritual things; for the faculties which serve for contemplation, are either corporeal, as the sense and fancy, or so allied to them that nothing passes into them but by the organs of the body; so that there is a natural inclination to figure nothing but under a corporeal notion, till by an attentive application of the mind and reason to the object thought upon, we separate that which is bodily from that which is spiritual, and by degrees ascend to that true notion of that we think upon, and would have a due conception of in our mind. Therefore God tempers the declaration of Himself to our weakness, and the condition of our natures. He condescends to our littleness and narrowness, when he declares himself by the similitude of bodily members. As the light of the sun is tempered, and diffuses itself to our sense through the air and vapors, that our weak eyes may not be too much dazzled with it: Without it we could not know or judge of the sun, because we could have no use of our sense, which we must have before we can judge of it in our understanding: So we are not able to conceive of spiritual beings in the purity of their own nature, without such a temperament, and such shadows to usher them into our minds. And therefore we find the Spirit of God accommodates himself to our contracted and teddered capacities, and uses such expressions of God, as are suited to us in this state of flesh wherein we are: And therefore because we cannot apprehend God in the simplicity of his own Being, and his undivided essence, he draws the representations of Himself from several Creatures and several actions of those creatures: As sometimes he is said to be angry, to walk, to sit, to fly; not that we should rest in such conceptions of Him, but take our rise from this foundation, and such perfections in the creatures, to mount up to a knowledge of God’s nature by those several steps, and conceive of him by those divided excellencies, because we cannot conceive of him in the purity of his own essence. We cannot possibly think or speak of God, unless we transfer the names of created perfections to Him; yet we are to conceive of them in a higher manner when we apply them to the Divine Nature, than when we consider them in the several creatures formally, exceeding those perfections and excellencies which are in the creature, and in a more excellent manner: as one says, “Though we cannot comprehend God without the help of such resemblances, yet we may without making an image of Him; so that inability of ours excuses those apprehensions of Him from any way offending against his Divine Nature.” These are not notions so much suited to the nature of God as the weakness of man: They are helps to our meditations, but ought not to be formal conceptions of Him. We may assist ourselves in our apprehensions of Him, by considering the subtilty and spirituality of air; and considering the members of a body, without thinking him to be air, or to have any corporeal member. Our reason tells us, that whatsoever is a body, is limited and bounded; and the notion of infiniteness and bodiliness, cannot agree and consist together: And therefore what is offered by our fancy should be purified by our reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London: 1682), “Discourse on God’s being a Spirit”, pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

ion+of+that+we+think+upon%2C+and+would+have+a+due+conception+of+in+our+mind.+Therefore+God+tempers+the+declaration+of+Himself+to+our+weakness%2C+and+the+condition+of+our+natures.+He+condescends+to+our+littleness+and+narrowness%2C+when+he+declares+himself+by+the+similitude+of+bodily+members.+As+the+light+of+the+sun+is+tempered%2C+and+diffuses+itself+to+our+sense+through+the+air+and+vapors%2C+that+our+weak+eyes+may+not+be+too+much+dazzled+with+it%3A+Without+it+we+could+not+know+or+judge+of+the+sun%2C+because+we+could+have+no+use+of+our+sense%2C+which+we+must+have+before+we+can+judge+of+it+in+our+understanding%3A+So+we+are+not+able+to+conceive+of+spiritual+beings+in+the+purity+of+their+own+nature%2C+without+such+a+temperament%2C+and+such+shadows+to+usher+them+into+our+minds.+And+therefore+we+find+the+Spirit+of+God+accommodates+himself+to+our+contracted+and+teddered+capacities%2C+and+uses+such+expressions+of+God%2C+as+are+suited+to+us+in+this+state+of+flesh+wherein+we+are%3A+And+therefore+because+we+cannot+apprehend+God+in+the+simplicity+of+his+own+Being%2C+and+his+undivided+essence%2C+he+draws+the+representations+of+Himself+from+several+Creatures+and+several+actions+of+those+creatures%3A+As+sometimes+he+is+said+to+be+angry%2C+to+walk%2C+to+sit%2C+to+fly%3B+not+that+we+should+rest+in+such+conceptions+of+Him%2C+but+take+our+rise+from+this+foundation%2C+and+such+perfections+in+the+creatures%2C+to+mount+up+to+a+knowledge+of+God%E2%80%99s+nature+by+those+several+steps%2C+and+conceive+of+him+by+those+divided+excellencies%2C+because+we+cannot+conceive+of+him+in+the+purity+of+his+own+essence.+We+cannot+possibly+think+or+speak+of+God%2C+unless+we+transfer+the+names+of+created+perfections+to+Him%3B+yet+we+are+to+conceive+of+them+in+a+higher+manner+when+we+apply+them+to+the+Divine+Nature%2C+than+when+we+consider+them+in+the+several+creatures+formally%2C+exceeding+those+perfections+and+excellencies+which+are+in+the+creature%2C+and+in+a+more+excellent+manner%3A+as+one+says%2C+%E2%80%9CThough+we+cannot+comprehend+God+without+the+help+of+such+resemblances%2C+yet+we+may+without+making+an+image+of+Him%3B+so+that+inability+of+ours+excuses+those+apprehensions+of+Him+from+any+way+offending+against+his+Divine+Nature.%E2%80%9D+These+are+not+notions+so+much+suited+to+the+nature+of+God+as+the+weakness+of+man%3A+They+are+helps+to+our+meditations%2C+but+ought+not+to+be+formal+conceptions+of+Him.+We+may+assist+ourselves+in+our+apprehensions+of+Him%2C+by+considering+the+subtilty+and+spirituality+of+air%3B+and+considering+the+members+of+a+body%2C+without+thinking+him+to+be+air%2C+or+to+have+any+corporeal+member.+Our+reason+tells+us%2C+that+whatsoever+is+a+body%2C+is+limited+and+bounded%3B+and+the+notion+of+infiniteness+and+bodiliness%2C+cannot+agree+and+consist+together%3A+And+therefore+what+is+offered+by+our+fancy+should+be+purified+by+our+reason.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+Several+Discourses+upon+the+Existence+%26+Attributes+of+God+%28London%3A+1682%29%2C+%E2%80%9CDiscourse+on+God%E2%80%99s+being+a+Spirit%E2%80%9D%2C+pp.+125-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fea53d8095e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ea53d8095e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perfect-being-theology/#:~:text=3.%20Though%20we%20must%20not%20conceive,should%20be%20purified%20by%20our%20reason&amp;text=3.%20Though%20we%20must%20not%20conceive%20of%20God&amp;text=our%20fancy%20should%20be%20purified%20by%20our%20reason" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-931b3d6b25" data-kw="">
<blockquote><p>V. It is then out of doubt, that all they, and only they, are partakers of the efficacy of Christ’s death; that is, of redemption, reconciliation with God, remission of sins, righteousness, and eternal life, so many as receive by faith these benefits in the Gospel: but such as pass over this life without faith, remain forever excluded from this power and benefits of his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645)</cite>, pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“V. It is then out of doubt, that all they, and only they, are partakers of the efficacy of Christ’s death; that is, of redemption, reconciliation with God, remission of sins, righteousness, and eternal life, so many as receive by faith these benefits in the Gospel: but such as pass over this life without faith, remain forever excluded from this power and benefits of his death.”

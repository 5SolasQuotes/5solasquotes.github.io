<main class="wrap"><figure class="quote" id="q-8d7480c6b7" data-kw="">
<blockquote><p>The capacity of a created thing can be understood in two ways. The first is according to its natural potency, which pertains to its seedlike principle. In this respect, God does not leave empty any capacity of a created thing, generically speaking, although the capacity of some particular created thing may not be fulfilled, due to some impediment. The second is according to its obediential potency, whereby anything created is able to become what God wills it to be. And in this respect, in human nature there is a capacity for this dignity: that of being assumed into the unity of the divine [Second] person. Nor must every capacity like this be fulfilled, just as God need not do whatever he is able to do, but rather what befits the order established by his wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences | distinction 1, Incarnation, quest. 1, art. 3, Whether God would have been incarnate if man had not sinned, Reply to obj. 4</cite>, bk. 3,</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>XXII. The subject in which it [original sin] resides is not only the lower faculties, namely of sensing and appetition, nor only the superior faculties, namely of understanding and willing, but the whole man, both soul and body, with all their powers. Besides experience, these passages testify: Gen. 6:5; Jer. 17:9; 1 Cor. 2:14; Eph. 4:17-18; Rom. 6:12-13, etc.</p></blockquote>

<blockquote><p>2. Consider upon what terms you may have this God for your God… You give more for your bread, your clothes, your house, for the needful comforts that are for the support of your frail body, than you need give for the great, glorious, incomprehensible, incomparable God. You pay money for them, but you may have Him without money and without price. One would think that the equity of the condition should both amaze you and allure you. Consider, I say, God does not require of you things impossible to you; He does not say, If you will remove mountains, dry up oceans, stop the course of nature, create worlds, I will then be yours, as great as I am; He does not say, If you will satisfy my justice, answer the demands of my law, merit my love and favor, then I will be your God. No; He Himself has done all this for you by the death of his Son; all He desires is, that you would accept Him in his Son for your God. Nay, He does not require of you anything that is barbarous or cruel, as the heathen deities did, by the devil, of their worshippers. He does not say, If you will lance and mangle your bodies, as Baal’s priests did; if you will go barefoot in sackcloth long and tedious pilgrimages, as the papists do; if you will offer your children in the fire, and give the fruit of your bodies for the sins of your souls, as some did, then I will be your God. Again, He does not require of you things that are chargeable, to offer the best and chief of your flock daily in the sacrifice to Him; nor, as He once did of the young man, to sell all that you have, and give it to the poor; nor, as idolators, to lay down such a part of your estate for your portion; but He only requires that you would take the Lord for your God; and will you not do it? Can you deny Him and your poor soul so reasonable, so equitable a request? As the servant said to Nama, ‘If the prophet had commanded you some great thing, would not you have done it? how much more then when He only says, Wash, and be clean?’ So say I to you; if God had commanded the greatest things imaginable, would you not to your power have done them, that you might enjoy the blessed God for your eternal portion? how much more then when He only says, ‘Thou shalt have no other God before me’? O reader, do but observe that first command, which contains the sum both of your duty and felicity, and you are made, you are a blessed man for ever. Take the true God in Jesus Christ for your God, prize Him as your God, love Him as your God, honor Him as your God, and obey Him as your God, and He will be your God forever. Do but as much for the true God as the covetous man does for his wealth, which is his god, as the intemperate man for his belly, which is his god; they give their highest esteem, their choicest affections, and their greatest service to that which they take for their god. And surely the true God is more worthy hereof, and will requite you best for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Incomparableness of God, in his Works (Banner of Truth)</cite>, 4:493-97</span></figcaption>

</figure><figure class="quote" id="q-47cd471641" data-kw="">
<blockquote><p>Suppose an apparently strong and healthy man should apply to you for relief, and, when asked why he did not labor for his subsistence, should reply, Because I can find no one to employ me. If you wished to know whether this or indolence were the true reason, you would offer him employment; and if he then refused to labor, you would feel satisfied that he was slothful and undeserving of your charity. So, when God puts into the hands of sinners a price to get wisdom, and they do not improve it, it becomes evident that they do not wish, that they are not willing, to become religious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-payson.html">Edward Payson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Select Thoughts’, in The Complete Works of Edward Payson, vol. 1, p. 488 | The Sinner’s Unwillingness to go to Christ</cite></span></figcaption>

<blockquote><p>To be moved voluntarily, is to be moved from within, that is, by an interior principle: yet this interior principle may be caused by an exterior principle; and so to be moved from within is not repugnant to being moved by another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 105, art. 4, Whether God can move the created will, reply to obj. 2</cite></span></figcaption>

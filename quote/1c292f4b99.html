<main class="wrap"><figure class="quote" id="q-1c292f4b99" data-kw="">
<blockquote><p>…but let the chief study, endeavor and delight of your souls be about that which God most delights into, let the substantials of religion have the first place in the soul; Pray more in secret, that He will be the life of your souls, you ought indeed to attend public ordinances, but above all, take heed to your conversation and walking at home, and in secret, prayer in your family is a more substantial worship than to sit and hear prayer in public, and prayer in secret is more substantial than that: The more retired and immediate a duty be, the more weighty it is, the more it cross thy corruptions; and evidence the stamp of God on thy affections, the more divine it is; And therefore to serve God in these, is to serve Him in truth. Practice has more of truth in it than a profession… Duties that have more opposition from our natures against them: and less fuel or oil to feed the flame of our self-love and corruption, have more truth in them;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion… ([Glasgow] 1666 / 1667), on Jn. 4:24, 2nd Sermon</cite>, p. 136</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e68c3262b" data-kw="">
<blockquote><p>Friday, Oct. 12. — Kept a family fast this day, that we might afflict ourselves before our God; to seek of Him a right way for us and for our little ones, and for all our substance: I trust it was such a fast as the Lord would choose: His divine presence was amongst us, and we had good reason to hope and believe, that the Lord was entreated of us, Oh that we may find more and more reason to say so, when we come on shore. I dread going into the world. But wherefore do I fear? Lord, I believe, O help my unbelief, that Thou wilt keep me unspotted from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Whitefield’s Journal During the Time He was Detained in England, by the Embargo, vol. 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

</figure><figure class="quote" id="q-142cc5097c" data-kw="">
<blockquote><p>The mortality in our perish is not over yet, though I hoped my child had closed it: but just while I was writing this, I heard of the death of a mother of four small children… carried off at night by a sickness, so far as I could understand, not above two hours long long. Alas! we have provoked our God. By the awful voice of Providence continuing, I was led to Zech. 12:12, ‘And the land shall mourn, every family apart,’ etc., on which I dwelt from 11th March till 20th May; and for some time after, on Ps. 126:5, ‘They that sow in tears, shall reap in joy.’ Upon the former of these I pressed the duty of personal and family fasting, among other things. And this was not without fruit. I knew that some were engaged in these duties; particularly James Biggar’s family, on which the hand of the Lord lay long and heavy, and carried off several of them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Memorial Concerning Personal &amp; Family Fasting &amp; Humiliation on Zech. 12:12 (†1732) 50 pp. in Works, vol. 11, pp. 343-393 See especially p. 386 ff. | The occasion of this piece (Memoirs, p. 304):</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-77f8be7850" data-kw="">
<blockquote><p>III. Here therefore we think the question can be solved by distinguishing heretics. For there are some who corrupt the substance of baptism and omit or change the form of institution; such as were the ancient Arians, who denied a Trinity of persons in unity of essence, and the modern Socinians. Others, while they retain substantials and defend the true doctrine of the holy Trinity contained in the formula of baptism, ‘err on other heads of doctrine’; as the ancient Novatians and Donatists, and the modern Romanists and Arminians. As to the former, we judge that baptism administered by them is null, and so they are not properly to be rebaptized, but baptized, who have been baptized by such heretics, because they evidently corrupt the essential form of baptism, to which the invocation of the Trinity belongs. For this reason, the baptism of the Arians, who baptized ‘in the name of the Father, the only true God, in Jesus Christ, the Savior and a creature, and in the Holy Spirit, the servant of both’… was formerly rejected in the Nicene Council… Still a distinction must be made here again. For either the minister alone was infected with that heresy or the whole church with him. If the latter, we deny it to be true baptism. If the former (to wit, if the church thinks rightly, notwithstanding the error of the pastor, if he is a secret heretic), provided the formula of Christ be retained, we believe the baptism to be valid and that it is not necessary to rebaptize those who have been once baptized. The sacrament is the property of the church, which is administered in her name and in her faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 15, ‘Is Baptism Administered by Heretics Lawful? We Distinguish’ in Institutes (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’</cite>, pp. 396-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d115b7eac" data-kw="">
<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>

</figure><figure class="quote" id="q-0299065bfb" data-kw="">
<blockquote><p>4. Those who, in baptism, according to the common condition of infants, were truly justified, regenerated, and adopted, when arrived at years of discretion, do not continue justified, regenerated, or adopted as adults unless by repentance, faith, and the renunciation promised they fulfil their vow taken upon them at baptism.</p></blockquote>

</figure><figure class="quote" id="q-7516cb2aa2" data-kw="">
<blockquote><p>Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.</p></blockquote>

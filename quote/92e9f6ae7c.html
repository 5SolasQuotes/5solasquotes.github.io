<main class="wrap"><figure class="quote" id="q-92e9f6ae7c" data-kw="">
<blockquote><p>Now why the first day of the week should be called the Lord’s day, reason offers it self plentifully.

1. In opposition to his suffering day, of which he saith to his Persecutors, This is your day, and the power of darkness.

2. It was the Day when he triumphed over Sin, Death, and Hell.

3. It was the Day, when he was with power manifested to be the Son of God, Rom. 1.4.

4. In all probability it was the day he instituted for the Christian Sabbath: and therefore called the Lord’s day, as the Sacrament is called the Lord’s Supper, because he instituted it.

5. Finally, take all the Ancients from Ignatius who lived nearest the Apostle downward, they all understood by the Lord’s day, the first day of the week, and accordingly kept it holy unto the Lord.

Now let all these be laid together, and I beseech our Brethren, laying aside all partiality, prejudice and section, seriously to consider, whether they will not amount to as good a proof as we have for many other things, that the Lord Christ hath instituted the Lord’s day for the Christian Sabbath, though it be not in the Gospel proclaimed in so many words: And in good earnest I think those of our Brethren who will not judge it sufficient, if their Consciences weigh all Gospel Truths in the same balance, will be in no small danger of being warped in other, and those very weighty Truths of the Gospel, from a perversion in which, the good Lord keep them and us all, for his mercy’ sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), pp 66-67.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8fa779d47" data-kw="">
<blockquote><p>Those days which are consecrated to Christ in the Church, if they are received only for reason of a remembrance of the saving graces of Christ to us, and are retained, in order to make us more certain concerning these matters and actions, and if they are observed without any superstition of the day, in the way that they were celebrated when they were first instituted, not by the Papists, but by the Church), then, let them be retained for the honor of Christ, for as long as it seems good to the pious Church, because they are matters straightaway indifferent, and means. Although, I think and judge that even these days among us (who cannot now doubt concerning the trustworthiness of the Evangelical history; nor do we, by the grace of God, walk amongst the heathens), these days, I say, are to be abolished. For, every day, by the preaching of the gospel, Christ is born, circumcised, dies, and resurrects for us, Heb. 13:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ad tomum I. et II. controversiarum Roberti Bellarmini responsio</cite>, (Joannes le Preux, 1598), pp. 1519–20. The latin was cited by George Gillespie, A Dispute Against the English Popish Ceremonies (Naphtali Press, 2013), p. 50 and Balduin, de Cas. Consc., lib. 2, cap. 12, cas. 1. Trans. Charles Johnson</span></figcaption>

<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>

<blockquote><p>39. The use of faulty liturgies is no worse than the use of faulty translations of the Holy Scripture, which yet Christ and his apostles ordinarily [and voluntarily] used [i.e. the Septuagint, the Greek translation of the Hebrew Old Testament] (of which I shall say more anon).ª ª [See Baxter’s defense of this in the section of principles on ‘Reformation &amp; Conformity’.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 2, pp. 12, 14</span></figcaption>

<blockquote><p>Many rest upon their outward civility &amp; morality, or negative holiness. They cannot be challenged for gross faults, and that is all the way they have to rest in: alas, could not a wicked Pharisee say, as much as they, viz That he was no extortioner, unjust person, nor an adulterer, nor such as the publican was, Luk. 18:11?

How many heathens, as to this, shall outstrip such as profess themselves Christians? and yet they lived and died strangers to the right way to happiness. See what that poor young man said Luk. 18: 21.

… Some may win to more then civility, and attain unto a kind of outward holiness, and outward performance of the duties of religion, such as hearing, reading, prayer, communicating; and rest there, and yet perish: for that is but their own way; it is not the right way.

Had not the foolish virgins lamps? and did they not wait with the rest Matt. 25? and will not many say in that day, we have eaten and drunken in thy presence, and thou hast taught in our streets, to whom Christ shall answer, I know not whence you are, depart from me, all ye workers of iniquity, Luk. 13: 26, 27? were not the Jews much in duties &amp; outward ordinances? and yet see how the Lord rejecteth them all, Esa. 1: 11, 12, 13, 14, 15, &amp; 66: 3.</p></blockquote>

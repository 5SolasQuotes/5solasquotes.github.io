<blockquote><p>…the king [David] said unto Nathan the prophet, ‘See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains.’ And Nathan said to the king, ‘Go, do all that is in thine heart; for the Lord is with thee.’ And it came to pass that night, that the word of the Lord came unto Nathan, saying, ‘Go and tell my servant David, ‘Thus saith the Lord, Shalt thou build Me an house for Me to dwell in?… And when thy days be fulfilled, and thou shalt sleep with thy fathers, I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom. He shall build an house for my name…’… Then went king David in, and sat before the Lord, and he said, ‘…now, O Lord God, thou art that God, and thy words be true, and thou hast promised this goodness unto thy servant: Therefore now let it please thee to bless the house of thy servant, that it may continue for ever before thee: for thou, O Lord God, hast spoken it: and with thy blessing let the house of thy servant be blessed for ever.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">Old Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2 Sam. 7:2-13, 18, 28-29</cite></span></figcaption>

</figure><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-4c5030f757" data-kw="">
<blockquote><p>III. Unto this catholick visible church Christ hath given the ministry, oracles, and ordinances of God, for the gathering and perfecting of the saints in this life, to the end of the world; and doth by his own presence and Spirit, according to his promise, make them effectual thereunto.[g] [g] 1 Cor. 12:28. Eph. 4:11-13. Matt. 28:19,20. Isa. 59:21. IV. This catholick church hath been sometimes more, sometimes less visible.[h] And particular churches, which are members thereof, are more or less pure, according as the doctrine of the gospel is taught and embraced, ordinances administered, and publick worship performed more or less purely in them.[i] [h] Rom. 11:3,4. Rev. 12:6,14. [i] Rev. 2-3. 1 Cor. 5:6,7.</p></blockquote>

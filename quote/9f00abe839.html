<main class="wrap"><figure class="quote" id="q-9f00abe839" data-kw="">
<blockquote><p>The last (or extreme) judgment is a judicial act, whereby Christ, in the last day, with great majesty in glory, shall give sentence upon all men universally. The principal efficient cause as touching indeed the judicial power and authority is God the Father, the Son, and the Holy Spirit. But, as touching the manner of judgment,or exercise thereof, Christ is not only as he is God but also as he is man, which follows together with the personal union of the divine and human nature, as also, because of his agreeableness and affinity with man. The administering cause shall be the angels, whose service God will use both in the gathering together and in the separating and singling out of them that shall be judged. The matter as it respects the subject is the faith or infidelity of everyone declared by the effects of both. But as concerning the object are both universally, all creatures, even the unreasonable, which shall be freed from the servitude of corruption and generally all, both angels and men, and particularly that man of sin and son of perdition, Antichrist. … The end supreme is the glory of God himself and the accomplishment or Christ’s office. Subordinate is the just condemnation of the wicked and the glorious felicity of the faithful. Both which the infinity and eternity either of joy or sorrow follows. The cause of this life is God, too wit, the Father the efficient, the Son the meritorious, and the Holy Spirit the sealing and applying cause. The matter, which has the respect of the subject, are those good things which neither eye has seen nor ear heard nor can the mind of man comprehend. That which is of the object are all the blessed and elect. The form is the most perfect knowledge, vision, and fruition of God himself, and the exceeding felicity and blessedness of man which accompanies the same which also consists both in the separation and absence of all evil things and in the participation and presence of all good things….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity, trans. John Gawen (London, 1610), 587–90. Translation, Spelling, and punctuation modernized.</cite></span></figcaption>

<blockquote><p>For man knows God naturally in the same way as he desires him naturally. Now man desires him naturally insofar as he naturally desires happiness, which is a likeness of the divine goodness. Hence it does not follow that God considered in Himself is naturally known to man, but that his likeness is. Therefore, man must come by reasoning to know God in the likenesses to Him which he discovers in God’s effects.</p></blockquote>

</figure><figure class="quote" id="q-007cf12553" data-kw="">
<blockquote><p>There are two main views. One of them has come to be called corruptionism, and it holds that at death the human being ceases to exist (unless and until God resurrects him), even though the soul carries on. The other view is called survivalism, and it hold that the human being persists in existence after death and even before any resurrection, though only as constituted by his soul… …the position I favor is the survivalist one. For I have said that after death the human being persists, albeit in a severely reduced or incomplete state. Now the survivalist view is characterized as the view that after death but before the resurrection, the soul constitutes the human being… a form qua [as] form exists only together with the substance of which it is the form. However, since the substance of which the human soul is the form is not entirely coporeal, that substance subsists and continues beyond the death of the body because the death of the body involves the cessation of only the corporeal aspect of said substance, not the incorporeal aspect. Hence, because the substance that the human soul is the form of persists beyond the death of the body, the soul persists beyond the death of the body… this thing that exists beyond the death of the body is also a substance–albeit an incomplete one–and, since this incomplete substance just is the human being in a radically impaired state, it is quite natural to say that the soul that survives death just is the human being surviving death (again, in a radically incomplete state)… …For the corruptionist position holds, again, that at death the human being cease to exist, even though the soul carries on. Yet the human being is the substance of which the soul is a form. So, if the human being ceases to exist at death, then that means that the substance of which the soul is the form ceases to exist at death. And in that case, how could the soul carry on? How could a form exist apart from the substance of which it is the form?… There are two further important arguments for survivalism, one philosophical and one theological. The first is this… just as it is the human being who sees, and not the eye, it is the human being who thinks, and not the intellect. The eye sees only in a loose sense, and the intellect thinks only in a loose sense. Now, on both the survivalist view and the corruptionist view, the intellect survives the death of the body and thought occurs as well. But if thought occurs and if on Aquinas’s own principles it is strictly speaking only the human being, and not the intellect, which thinks, then it follows that there must be a sense in which the human being survives as well. The second, theological argument is this. Being a Christian theologian, Aquinas holds that, after death, the soul is rewarded, punished, or purged in light of the deeds of this present life. But it makes sense to reward, punish, or purge only perons, not mere parts of persons. It makes no sense, for example, to speak of rewarding or punishing Bob’s foot or hi pancreas for Bob’s good or bad deeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 497-502 in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

tance+of+which+the+soul+is+a+form.+So%2C+if+the+human+being+ceases+to+exist+at+death%2C+then+that+means+that+the+substance+of+which+the+soul+is+the+form+ceases+to+exist+at+death.+And+in+that+case%2C+how+could+the+soul+carry+on%3F+How+could+a+form+exist+apart+from+the+substance+of+which+it+is+the+form%3F%E2%80%A6+There+are+two+further+important+arguments+for+survivalism%2C+one+philosophical+and+one+theological.+The+first+is+this%E2%80%A6+just+as+it+is+the+human+being+who+sees%2C+and+not+the+eye%2C+it+is+the+human+being+who+thinks%2C+and+not+the+intellect.+The+eye+sees+only+in+a+loose+sense%2C+and+the+intellect+thinks+only+in+a+loose+sense.+Now%2C+on+both+the+survivalist+view+and+the+corruptionist+view%2C+the+intellect+survives+the+death+of+the+body+and+thought+occurs+as+well.+But+if+thought+occurs+and+if+on+Aquinas%E2%80%99s+own+principles+it+is+strictly+speaking+only+the+human+being%2C+and+not+the+intellect%2C+which+thinks%2C+then+it+follows+that+there+must+be+a+sense+in+which+the+human+being+survives+as+well.+The+second%2C+theological+argument+is+this.+Being+a+Christian+theologian%2C+Aquinas+holds+that%2C+after+death%2C+the+soul+is+rewarded%2C+punished%2C+or+purged+in+light+of+the+deeds+of+this+present+life.+But+it+makes+sense+to+reward%2C+punish%2C+or+purge+only+perons%2C+not+mere+parts+of+persons.+It+makes+no+sense%2C+for+example%2C+to+speak+of+rewarding+or+punishing+Bob%E2%80%99s+foot+or+hi+pancreas+for+Bob%E2%80%99s+good+or+bad+deeds.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+pp.+497-502+in+Immortal+Souls%3A+a+Treatise+on+Human+Nature+Ref+%28Editiones+Scholastica%2C+2024%29%2C+pt.+4%2C+ch.+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F007cf12553.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/007cf12553.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/heaven#:~:text=There%20are%20two%20main%20views.%20One,for%20Bob%E2%80%99s%20good%20or%20bad%20deeds&amp;text=There%20are%2 <blockquote><p>What is ‘happiness’ after all? Is it a matter of ‘getting what you want’? Is it a matter of maximizing pleasure and minimizing pain, as Bentham and Mill held (albeit in different ways)? On these conceptions, happiness seems to be definable in terms of the subjective states of the agent. On an Aristotelian or classical natural law conception, though, it is something objective, a matter of living in accordance with one’s nature, understood as a fixed essence entailing a natural end or purpose.</p></blockquote>

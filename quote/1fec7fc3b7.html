<main class="wrap"><figure class="quote" id="q-1fec7fc3b7" data-kw="">
<blockquote><p>Prayer is a blessed means of drawing from the fulness that is in Christ. And the saints of God, blessed in Christ, are by prayer made a blessing unto one another. Christ and the church must not be overlooked here. This will form an ever-recurring topic of converse, and constant subject of prayer. The church is the building of which Christ is the foundation and chief corner-stone; the body of which he is the Head; the spouse of which he is the Husband; the kingdom of which he is the sole Monarch. The church, in the sense of the word as comprehending all the redeemed and sanctified of God, is the interest dearest to Christ, and that in which the divine glory is to be made great.

Besides comprehending our own personal interest, it includes that of unnumbered thousands and millions, and all the glory accruing from them to Christ and to God. Her visible concerns, viewed in their subordination to the divine glory and spiritual interests of men, assume the highest relative importance, and must awaken the affections, and kindle the zeal of those that are Christ’s, and pray as he has taught, “Hallowed be thy name, thy kingdom come, thy will be done on earth as it is in heaven.” “Pray for the peace of Jerusalem: They shall prosper that love thee; ye that make mention of the Lord, (ye that are the Lord’s remembrancers,) keep not silence, and give him no rest till he establish, and till he make Jerusalem a praise in the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-symington.html">Andrew Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Social Prayer: A Sermon, Preached in Albion-Street Church, Glasgow, on the evening of Thursday, October 24, 1839</cite>, (Paisley: Alex. Gardner, 1840), pp 30-31.</span></figcaption>

<blockquote><p>6. Hence follows that all actions and circumstances of their nature indifferent, must lose that indifferency and receive from God some goodness and aptness to edify before they can be the reasonable and nearest matter of any civil or ecclesiastical constitution; Because what rulers can in law and reason command, that they must will as good and apt to edify before they can bind others to will it. But neither the will of a ruler, nor the will of any other can lawfully will a thing indifferent, as it is such: For a thing indifferent, as it is such, is neither good nor evil, and the object of the will is always good. 3. Rulers command as God’s ministers for our good, Rom. 13:4. Ergo [Therefore], the means and actions enjoined for the compassing of this end must be good; for if the end be good, the means as the means must be good; Ergo, they cannot be indifferent.</p></blockquote>

</figure><figure class="quote" id="q-0efd71aa3e" data-kw="">
<blockquote><p>In discussing such a subject as this, it is necessary to act as Nehemiah’s workers did, every one of whom “with one of his hands wrought in the work, and with the other hand held a weapon.” And like these patriotic builders, the historical student is often cumbered with “much rubbish.” In the devoted band of hymn-singers, Dr. H[oratius]. Bonar has long held a conspicuous place, by his ardent attempts to prove that the Reformers of Scotland used human hymns in the public worship of God.

In considering this question therefore, it will not be amiss to examine pretty carefully what such a veteran champion has advanced; though, perhaps, it may be thought presumptuous for one, who marches in the rank and file of Presbyterianism, to criticise the utterances of the Moderator of the Free Church Assembly. But the highest dignitaries—not excepting the Pope of Rome—are just as fallible as the greatest geniuses, and the best of scholars, and neither of these claim to be beyond criticism.

Dr. Bonar, however, stands head and shoulders above most of his contemporaries in a far better sense, to wit, in vital godliness. Well does the writer of this article remember hearing him commending Christ to a crowd of people near the Heart of Mid-Lothian more than a dozen years ago. His countenance and especially his eyes seemed lit up with the reflection of his Master’s glory. And not only are we assured that “the secret of the Lord is with them that fear Him,” but, that, “a good understanding have all they that do His commandments.” Yet Paul says, “Be ye followers of me, even as I also am of Christ,” and Dr. Bonar will ask no more. Moreover, if an attempt were made to count heads, it might be rather difficult to say on which side of the hymn-question most of Christ’s earnest followers have been ranged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hymnology of the Scottish Reformation. I. in Original Secession Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse. For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it. For there must be also heresies among you, that they which are approved may be made manifest among you. When ye come together therefore into one place, this is not to eat the Lord’s supper. For in eating every one taketh before other his own supper: and one is hungry, and another is drunken. What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not.</p></blockquote>

<blockquote><p>It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Scarecrows for Extremism</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?”

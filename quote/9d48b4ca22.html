<main class="wrap"><figure class="quote" id="q-9d48b4ca22" data-kw="">
<blockquote><p>Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 2, p. 369</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ddd2ba5cf" data-kw="">
<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

e%20goodness%20of%20God%20is%20exercised%20towards&amp;text=mercy.%20John%2016%3A27%3B%20Rom.%205%3A8%3B%20I%20John%203%3A1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5cd726bb37" data-kw="">
<blockquote><p>41. And indeed, God loves all his creatures, insofar as they are his creatures, but not with the same level of love. For he loves some in Christ, whom he chose in Christ from eternity according to the will of his good pleasure. He does not love the reprobate in the same way, whom nevertheless he does not damn as innocent, but on account of their voluntary wickedness and willful unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Disputation on that Place of Paul</cite>, 1 Cor. 15:22, ‘As in Adam All Die, so in Christ All shall be Made Alive’, &amp; of this Question, Whether Christ has Died for All?, pt. 5 tr. Michael Lynch (Heidelberg, 1589)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-90078a779d" data-kw="">
<blockquote><p>4. A change from the offers of Grace, to the revelations of wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11… There is never an offer of grace and love made to souls in the grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern</cite>, (London: J. Robinson, 1674), pp. 73–75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<main class="wrap"><figure class="quote" id="q-f6b575b7b5" data-kw="">
<blockquote><p>You will have a battle, too, when you go forth as ministers into the church. The church is now in a period of deadly conflict. The redemptive religion known as Christianity is contending, in our own Presbyterian Church and in all the larger churches in the world, against a totally alien type of religion. As always, the enemy conceals his most dangerous assaults under pious phrases and half truths. The shibboleths of the adversary have sometimes a very deceptive sound. “Let us propagate Christianity,” the adversary says, “but let us not always be engaged in arguing in defense of it; let us make our preaching positive, and not negative; let us avoid controversy; let us hold to a Person and not to dogma; let us sink small doctrinal differences and seek the unity of the church of Christ; let us drop doctrinal accretions and interpret Christ for ourselves; let us look for our knowledge of Christ in our hearts; let us not impose Western creeds on the Eastern mind; let us be tolerant of opposing views.” Such are some of the shibboleths of that agnostic Modernism which is the deadliest enemy of the Christian religion to-day. They deceive some of God’s people some of the time; they are heard sometimes from the lips of good Christian people, who have not the slightest inkling of what they mean. But their true meaning, to thinking men, is becoming increasingly clear. Increasingly it is becoming necessary for a man to decide whether he is going to stand or not to stand for the Lord Jesus Christ as he is presented to us in the Word of God. te;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Good Fight of Faith”</cite>, (1929). Listen to a reading of this sermon.</span></figcaption>

575b7b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6b575b7b5.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/10/1929-or-2018/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>

</figure><figure class="quote" id="q-de6215db97" data-kw="">
<blockquote><p>Bucer believed that in a face-to-face dialogue it would be easierto persuade one’s opponents of the truth… Bucer knew well that written documents were subjected to differing interpretations. His preference for public dialogue also influenced many of his written works, which adopted the literary genre of a fictional dialogue. In these works, he would exemplify how men of differing opinions could peaceably and gradually arrive at agreement on the truth. This gradual approach was illustrative of his pedagogy for persuading and teaching others the truth of God’s word… As Stupperich has asserted, for Bucer unity would result not from compromise but from the clarification of misunderstandings that enable a unity in the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism</cite>, (Oxford Univ. Press, 2010) 260 pp. ToC, p. 23</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1ffdacf5c3" data-kw="">
<blockquote><p>The Son of God manifested in the flesh is named Jesus, because he hath saved us, through his desert, and yet still saveth us by his power from all our sins. Matt. 1. Acts 4. Hebr. 7. … As often as I hear therefore the name of Jesus, I ought to remember the promise of the Gospel that lieth hid in it: that he through his merit, hath saved me from my sins, and by his power, mortifieth the remnants of sin in me, until he fully deliver me from them: that he also quickeneth me through his holy spirit, and that he everlastingly keepeth for me that same salvation purchased with so great a price, 1 Pet. 1. And so he beareth that worthy name for my sake, which was given unto him by the father from heaven, that he might shew the truth of his name, in truth and effectually as well in my salvation, as in the salvation of all believers. He is faithful that beareth that notable name of saviour, and he that hath promised, shall do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), pp 114-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-939b9f2b48" data-kw="">
<blockquote><p>We receive frequent and mournful relations of that accursed practice of duels, yea and among persons of our religion; and though we believe this violent and brutish sin is so strongly rooted, as to elude and reject all remedies, yet because of its atrociousness and enormity, we desire your holy synod to consuls of the last and sovereign remedy, even that dreadful power which the word of God has given unto his Church to draw out the spiritual sword against such notorious delinquents, without connivency, dispensation, or respect of persons, that by its implacable severity against those daring rebels, the Lord blessing his own ordinance, their feet which ran swiftly to shed innocent blood may be hereafter stopped and restrained. At least, let us weep and groan before the Lord that this evil may never be imputed to us, that we may be delivered from the guilt of so much blood as has been wickedly spilt among us, that it may never lie at our doors, nor our consciences may ever reproach us for having lent our heart or hands unto that murdering spirit, and that we may never be marked with this brand of infamy which is peculiar to the enemies of God, to have been executioners of his vengeance upon themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, p. 444</span></figcaption>

</figure><figure class="quote" id="q-a8697e8299" data-kw="">
<blockquote><p>There were 3 things (most Honourable Sirs!) which Luther did fear would prove to be the Ruin of Religion.

1. Oblivion.

2. Security.

3. Carnal policy: The good God overthrow these in our Land, lest our land be overthrown by these: Though Ministers discover all sorts of sins, and though a Parliament discovers all sorts of plots and dangers, yet people are settled on their Lee’s, they will not see, nor fear, nor humble themselves, nor turn to the Lord at all; O pray, (said a dying man in the beginning of the German reformation) that God would preserve the Gospel … For the Pope and the Council of Trent are hatching of strange things: Ministers say as much and more to people, pray, be humbled, reform; For you see what the bloody Papists have done in Ireland, and you hear what they are plotting against England, we do thus speak and weep, but man will not hearken and obey; They who will not easily see their sins, will as hardly believe their dangers … O that God’s advises (so frequent, so earnest, so and more safe) to humbling and reforming might once be regarded and followed: we shall be safe, if we ever remain impenitent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Preservation or, A Sermon Discovering the only way to prevent Destroying Judgements: Preached to the Honourable House of Commons at their last Solemn Fast, being on May, 25, 1642</cite>, (London: Samuel Gellibrand, 1642), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-dcd0422f7c" data-kw="">
<blockquote><p>I may say as Augustine did, though a good conscience be sufficient for myself, yet a good name is necessary for others; a good name is as precious ointment, yet there will not be wanting many flying reports to corrupt it; many are the obloquies and reproaches which by the sons of slander are cast upon me, they would fain have my name to be buried and rot above ground, before my friends can bury my body under it, yet herein is my comfort: there will be a resurrection of names as well as of bodies at the Last Day; I am assured that God will not only wipe off all tears from mine eyes, but all reproaches from my name also; I am, as says the apostle, counted a deceiver, yet true; as an apostate, yet firm to my first principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice</cite>, (London, 1651), p. 1</span></figcaption>

<blockquote><p>This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect:

1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them.

2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect:

1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them.

2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.”

— Lancelot Andrewes, A Pattern of Catechistical Doctrine at Large, (d. 1626; 1675) 5th Commandment, ch. 2, p. 321">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+we+showed+was+the+order+of+love+in+respect+of+nearness+of+conjunction+with+us.+But+now+in+respect+of+excellency+and+the+honor+which+is+therefore+due+to+any%2C+it+is+otherwise%3A+for+in+some+cases+the+person+of+greater+excellency+must+be+preferred+before+such+as+be+of+near+relation+to+us.+St.+Paul+honored+Nero%2C+an+infidel%2C+appealing+to+him.+Thus+a+stranger+may+be+honored+rather+than+one+of+our+own+country%2C+as+Daniel+was+honored+by+Darius+above+all+the+princes+of+Babylon%3A+and+Joseph%2C+though+a+stranger%2C+by+Pharaoh+above+all+the+rulers+of+Egypt.+Thus+one+that+is+not+allied+may+be+honored+before+one+of+our+own+kindred%2C+as+Moses+appointed+Aaron+and+not+any+of+his+own+sons+to+succeed+him+in+the+government+of+Israel.+Now+such+persons+as+are+to+be+honored+in+respect+of+their+excellent+gifts+and+of+their+nearness+to+God%2C+which+we+ought+to+esteem+and+honor+above+all+nearness+to+ourselves+by+any+relations+to+us%2C+and+that+not+only+for+itself%2C+but+also+our+honor+and+respect+being+the+reward+which+God+has+appointed+to+such+gifts%3B+although+in+respect+of+ourselves+also+we+are+to+regard+them%2C+they+being+of+great+use+and+profit+to+us+by+their+gifts.+The+heathen+man+said+that+every+one+made+more+account+of+%E3%80%88Greek%E3%80%89%2C+than+of+%E3%80%88Greek%E3%80%89%2C+%E2%80%98of+his+own+things%E2%80%99%2C+than+%E2%80%98of+God%E2%80%99s%E2%80%99%2C+and+the+apostle+complains+of+such+as+sought+%E3%80%88+in+non-Latin+alphabet+%E3%80%89%2C+%E2%80%98their+own+things%2C+and+not+the+things+of+Christ%E2%80%99.+But+if+we+look+at+the+%E3%80%88%E2%97%8A%E3%80%89+of+any%2C+we+must+not+chiefly+look+at+ourselves%2C+but+to+honor+God+in+his+gifts%2C+for+we+must+consider+them+in+a+double+respect%3A%0A%0A1.+As+they+are+useful+and+beneficial+to+us%2C+and+so+the+duty+is+diliges%2C+thou+shalt+love+them.%0A%0A2.+As+they+are+near+to+God%2C+by+that+excellency+which+he+has+given+them%3A+and+so+we+must+do+more+than+love+them%2C+we+must+honor+them.+If+it+be+here+demanded%3A+Why+did+not+God+make+all+men+excellent+alike+and+fit+to+be+superiors%3F+Answer%3A+God+made+men+of+finite+natures+and+therefore+of+such+condition+that+one+should+need+the+help+of+another%3A+for+which+end+the+woman+also+was+made+to+be+an+helper+to+the+man.+Besides%2C+seeing+men+grow+in+wisdom+and+abilities+for+several+%E3%80%88%E2%97%8A%E3%80%89+according+to+their+finite+capacities%2C+industry+and+education%2C+necessarily+it+follows+that+as+the+stars+differ+each+from+other+in+glory%2C+so+one+man+does+excel+another.+In+this+regard+the+elder+brother%2C+having+as+dignity+of+primogeniture%2C+so+more+maturity+of+years+and+reason+was+appointed+by+God+to+rule+over+the+rest+of+the+family.+Yet+God+the+King+of+kings+and+Lord+of+lords%2C+the+fountain+and+original+of+all+rule%2C+made+Moses+the+younger+brother+ruler+and+as+a+God+to+Aaron%2C+the+elder+brother%2C+and+preferred+David+before+his+elder+brethren%2C+and+Solomon+before+Adonijah+and+Absalom+when+He+first+framed+and+composed+a+national+government+in+his+own+people.+But+having+settled+the+platform+of+that+rule+He+intended+by+the+practice+of+David+and+Solomon+in+a+monarchical+course+%28the+best+of+all+kinds+of+governments+and+approved+by+God%2C+because+He+rested+in+it%29%2C+He+left+the+managing+of+that+kingdom+and+rule+to+the+true+and+lawful+heirs+of+David+in+all+after-times%2C+because+they+by+education+under+their+parents%2C+and+aptness+of+children+to+walk+in+the+steps+of+their+fathers+and+to+fit+their+spirits+and+carriage+to+what+they+are+born+to%2C+would+probably+best+perform+the+royal+and+weighty+charge+of+ruling+as+kings%2C+and+make+election+of+the+most+able%2C+active+and+faithful+instruments+to+assist+them+in+%E3%80%88%E2%97%8A%E3%80%89+their+great+affairs.%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+A+Pattern+of+Catechistical+Doctrine+at+La

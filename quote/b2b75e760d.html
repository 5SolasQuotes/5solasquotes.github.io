<main class="wrap"><figure class="quote" id="q-b2b75e760d" data-kw="">
<blockquote><p>Thanksgiving after the holy Communion.

MY God, most gracious Father, who hast this day given me the pledges of my salvation &amp; the earnest of eternal life; My God, who hast fed me with the body and blood of thy son, and hast quickened me with the merit of his obedience applied to my heart through faith; I am full with thy bounty: My soul is satisfied as with marrow and fatness, and my mouth praiseth thee with joyful lips. My soul hath been thirsty after thee as a thirsty land, and thou hast made it a watered garden. Psal. 63.5. Psal. 143 6. Isa. 58.11. I have presented unto thee my bruised heart, and thou hast made it whole with thy sweetest comforts. I came unto thee poor and hungry after thy grace, and I return rich and full with the bread descended from heaven.

O the treasures of thy mercy which passeth all understanding! Thou hast given me thy Son. Thou hast given me thine own self. The Lord is the portion of mine inheritance, and of my cup, thou maintainest my lot. The lines are fallen unto me in pleasant places, yea, I have a goodly heritage. Therefore my heart is glad, and my glory rejoiceth, My, flesh also shall rest in hope. Psal. 16.5.

O that I had the tongue of Angels, to give thee glory in the highest, for the peace which thou makest on earth, with the men honoured with thy good will! Let thy redeemed people glorify thee. Let all thy works magnify thee. Let my soul be delivered by thine eternal compassions, comforted by thy love, and already blessed in heavenly places in the person of Christ my head, love thee, praise thee, magnify thee, and consecrate her self unto thee, who hast bestowed thy Son upon me. I heartily desire O my God, to set up thy kingdom in my heart, to subject all my affections and imaginations unto thee alone, to have no will but thy will, to know no interest but thy glory, to place all my felicity in walking before thee unto all pleasing.

But, O my God. I live yet in the flesh. The flesh is infirm, Satan is crafty and vigilant to seduce me; And the world is contrary, whether he persecute me, or smile upon me. My zeal may take a flight to thee, but hath not the wing strong enough to keep me up in that height. And after I am raised up to heaven, I am prone to fall down again to the ground. Wherefore, O Lord, be pleased to sustain me with thy virtue from above. And as after sending of thy Son thou didst send thy Spirit to thy Church, So now after thou hast given me thy Son this day, O give me also the virtue of thy good Spirit.

Yea come, holy Ghost, make my heart thy dwelling place. Sanctify me to thy self, mortify my sinful affections. Fill me with faith, charity, meekness and all Christian virtues. Preserve me against the seductions of the world. Endue me with strength against all the fiery darts of the wicked. Be my counsellor in my perplexities, My comforter in my troubles, and my guide in all my ways.

My God, who hast fed me this day in the hope of a better life spiritual and eternal, Give me grace to begin it already. O enable me to live in earth as they live in heaven, as much as my temporal condition is capable of it, advancing in thy knowledge, loving thee, praising thee and obeying thee with all my heart, with all my soul, with all my strength, and with all my understanding. Suffer me not to love the world, nor the things that are in the world, but let my heart be where my treasure is. 1. Joh. 3. Mar. 6.

And after I have fought the good fight, and kept the faith, be pleased to give me the crown incorruptible of life. Let me finally possess to the full thy beloved Son that loved me and gave himself for me. Let me once enjoy that fulness of joy that lieth in thy presence, and those pleasures for evermore that are at thy right hand, Where I may find mine eternal delight in praising thee eternally, for thine eternal love in thy Son Jesus Christ. To whom with thee and the holy Ghost be glory for evermore. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A week of soliloquies and prayers. With a preparation for the Holy Communion</cite>, (London: H. Moseley, 1657), pp 259-64.</span></figcaption>

<blockquote><p>I hope no length of time, or change of circumstances, shall cause you to forget those solemn views of eternity, and impressions of your misery as a sinner, and those beginnings of the knowledge of the glory and love of Christ, which so deeply engaged your thoughts while with us. These gifts and callings of God, being according to the counsel of his eternal love, are without repentance on his part.

And though we, in ourselves, are unstable as water, and would soon mar the work, and cast away the charters of our eternal inheritance, he is the Rock, he changeth not, and will not suffer us essentially to change; but will bring judgment unto victory—bringing light out of our wretched darkness, order out of our confusion, and establishment and fresh displays of his power and love out of our faintings and backslidings.</p></blockquote>

<blockquote><p>This communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being placed in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requires personal obedience, perfect obedience, and exact obedience. He that ‘continues not in all is cursed,’ Gal. 3:10. The law then finds us dead and kills us. It finds us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being placed in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requires personal obedience, perfect obedience, and exact obedience. He that ‘continues not in all is cursed,’ Gal. 3:10. The law then finds us dead and kills us. It finds us dead before, and not only leaves us dead still, but makes us more dead.”

— Richard Sibbes, The Complete Works of Richard Sibbes, ed. Alexander Balloch Grosart, vol. 6 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1863), 3. [spelling modernized]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+communion+and+fellowship+of+man+with+God%2C+was+first+founded+on+a+covenant+of+works+made+with+Adam+in+paradise.+If+he+did+obey%2C+and+did+not+eat+of+the+forbidden+fruit%2C+he+should+have+life+both+for+himself+and+his+posterity%3B+the+which+covenant%2C+because+God+would+not+have+forgotten%2C+he+afterward+renewed+in+the+delivery+of+the+ten+commandments%2C+requiring+from+man+obedience+to+them+in+his+own+person%2C+exactly%2C+at+all+times%2C+perpetually%3A+promising+life+on+the+obedience%2C+and+threatening+death+and+cursing+if+he+continued+not+in+everything+the+law+required+to+do.+But+this+fellowship+being+placed+in+man%E2%80%99s+own+freedom%2C+and+having+so+weak+a+foundation%2C+he+lost+both+himself+and+it%2C+so+that+now+by+the+first+covenant+of+works%2C+Adam+and+all+his+posterity+are+under+a+curse%3B+for+we+cannot+fulfill+the+law+that+requires+personal+obedience%2C+perfect+obedience%2C+and+exact+obedience.+He+that+%E2%80%98continues+not+in+all+is+cursed%2C%E2%80%99+Gal.+3%3A10.+The+law+then+finds+us+dead+and+kills+us.+It+finds+us+dead+before%2C+and+not+only+leaves+us+dead+still%2C+but+makes+us+more+dead.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+The+Complete+Works+of+Richard+Sibbes%2C+ed.+Alexander+Balloch+Grosart%2C+vol.+6+%28Edinburgh%3B+London%3B+Dublin%3A+James+Nichol%3B+James+Nisbet+and+Co.%3B+W.+Robertson%2C+1863%29%2C+3.+%5Bspelling+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14bed2b0c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14bed2b0c7.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/sibbes-our-communion-was-first-founded-upon-a-covenant-of-works/" rel="noopener" target="_blank

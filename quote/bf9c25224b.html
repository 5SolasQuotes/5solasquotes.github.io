<main class="wrap"><figure class="quote" id="q-bf9c25224b" data-kw="">
<blockquote><p>When men would express the removal of somewhat absolutely necessary, they use to say, this were Solem è mundo tollere, to take the Sun out of the World. If that were removed, how would all beauty vanish, and (as some think) all motion cease? The potter’s wheel (say they) could not turn upon earth, if the Sun should not move in heaven.

So take Christ from a soul, ’tis impotent to all good, Without me ye can do nothing, John 15. 5. Were it not for the Sun it would be perpetual night in the world, notwithstanding all the torches that could be lighted; yea notwithstanding all the light of the moon and stars. It is neither the torch-light of natural parts and creature-comforts; nor the star-light of civil honesty and common gifts; nor the moon-light of temporary faith and formal profession, that can make it day in the soul, till the Sun of righteousness arise and shine there.

Once indeed there was a time, when fruits were produced without a Sun; when God, to prevent the idolizing of this creature as the only cause of all fertility, enabled the earth to bring forth on the third day, whereas the Sun was not made till the fourth: But never was there any the least moment of time since the fall, wherein man could bring forth fruit to God without the cooperation of Christ. He that hath not the Son hath not life, 1 Iohn 5. 12. Neither can any vital action be performed but by his special grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), pp 9-10.</span></figcaption>

<blockquote><p>As to the causal ‘for’ [in Mt. 25:42], I say that it does indeed signify a cause, but not meritorious of the Kingdom, but declaratory of the righteous sentence passed by the Judge; that of right the Kingdom is adjudged to the sheep, because by works they declared themselves truly sheep, that is, believers. Some there be that grant (which I would not do) that works are an efficient cause of the Kingdom, but not by way of merit, but as a way and means, etc.</p></blockquote>

<blockquote><p>I grant that the works of regeneration are necessary unto eternal life promised in the gospel, but not as merits or meritorious causes, but as the means and way wherein we are to proceed on from justification and regeneration unto glory and life eternal. They may also be said to be causes, after a sort, for they please God in Christ, and in some respects move Him, but not as merits, but as effects of the only merit of Jesus Christ, whereof they testify.</p></blockquote>

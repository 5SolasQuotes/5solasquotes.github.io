<main class="wrap"><figure class="quote" id="q-c48ae33cf2" data-kw="">
<blockquote><p>It is infallible and certain. The infallibility of it is witnessed by those places where God’s Word is compared to Gold seven times refined, and where it is said, Heaven and earth shall sooner pass away, then one jot or tittle, (a). And so thy testimonies are sure; By all this it appeareth, that the Word of God is a fixed Canon, it cannot be wrested and wyer-drawn, so as to approve one thing to day, and the contrary to morrow: It is hellish blasphemy to compare it to a nose of Wax; and to say that it is to be interpreted secundum currentem statum Ecclesiae, as the condition of the Church altereth, so must the Scripture alter; thereby they confirm that of Tertullian, Deus non erit Deus nisi homini placuerit, God shall not be God unless man please.

If you say, that the Apostle Peter speaks of some who did wrest the Scripture, and put it upon the wrack; This is to be granted concerning the words, not the sense, and matter of the Holy Ghost intended by those words: That is invariable and cannot be a Reed shaken with every wind of interpretation, and because Heretics would fly to the words, denying the sense, therefore hath the Church of God been constrained to use new words to distinguish them by.

Irenaeus doth well compare Heretics to the Beast Hyaena, that imitates the Shepherd’s voice, and so by that means seduceth the Sheep into destruction. Now this infallibility of the Word is so great that when some, as Saul and Uzzah, have gone against it, as if their special considerations might give them a protection, which were indeed fair and plausible, yet they were severely punished by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difficulty of and the encouragements to a reformation a sermon preached before the honourable House of Commons at the public fast, Septem. 27, 1643</cite>, (London: Thomas Underhill, 1643), p. 4.</span></figcaption>

</figure><figure class="quote" id="q-7d48192352" data-kw="">
<blockquote><p>1. We have learned from none others the plan of our salvation, than from those through whom the Gospel has come down to us, which they did at one time proclaim in public, and, at a later period, by the will of God, handed down to us in the Scriptures, to be the ground and pillar of our faith. …

2. These have all declared to us that there is one God, Creator of heaven and earth, announced by the law and the prophets; and one Christ the Son of God. If any one do not agree to these truths, he despises the companions of the Lord; nay more, he despises Christ Himself the Lord; yea, he despises the Father also, and stands self-condemned, resisting and opposing his own salvation, as is the case with all heretics.</p></blockquote>

</figure><figure class="quote" id="q-09f8fd9819" data-kw="Laity reading Scripture">
<blockquote><p>Our opinion is, that the scriptures are not so difficult, but that those who read them attentively may receive from thence advantage and the greatest edification, even laymen, plebeians and the common mass of mankind. … But we affirm that it may be understood by all who desire to know it, and bestow the pains they ought; even as a lamp may be seen by all who choose to open their eyes.</p></blockquote>

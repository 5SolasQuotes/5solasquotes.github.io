<blockquote><p>I answer that, It is necessary to assign an appetitive power to the soul. To make this evident, we must observe that some inclination follows every form: for example, fire, by its form, is inclined to rise, and to generate its like. Now, the form is found to have a more perfect existence in those things which participate knowledge than in those which lack knowledge. For in those which lack knowledge, the form is found to determine each thing only to its own being—that is, to its nature. Therefore this natural form is followed by a natural inclination, which is called the natural appetite. But in those things which have knowledge, each one is determined to its own natural being by its natural form, in such a manner that it is nevertheless receptive of the species of other things: for example, sense receives the species of all things sensible, and the intellect, of all things intelligible, so that the soul of man is, in a way, all things by sense and intellect: and thereby, those things that have knowledge, in a way, approach to a likeness to God, in Whom all things pre-exist, as Dionysius says (Div. Nom. v). Therefore, as forms exist in those things that have knowledge in a higher manner and above the manner of natural forms; so must there be in them an inclination surpassing the natural inclination, which is called the natural appetite. And this superior inclination belongs to the appetitive power of the soul, through which the animal is able to desire what it apprehends, and not only that to which it is inclined by its natural form. And so it is necessary to assign an appetitive power to the soul. … Reply Obj. 2: What is apprehended and what is desired are the same in reality, but differ in aspect [ratione]: for a thing is apprehended as something sensible or intelligible, whereas it is desired as suitable or good. Now, it is diversity of aspect in the objects, and not material diversity, which demands a diversity of powers. Reply Obj. 3: Each power of the soul is a form or nature, and has a natural inclination to something. Wherefore each power desires by the natural appetite that object which is suitable to itself. Above which natural appetite is the animal appetite, which follows the apprehension, and by which something is desired not as suitable to this or that power, such as sight for seeing, or sound for hearing; but simply as suitable to the animal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 80, Appetitive Powers in General, art. 1, Whether the appetite is a special power of the soul?</span></figcaption>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker Academic, 2017), pp. 41-42</span></figcaption>

<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts: 1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added. 2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast. 3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts: 1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added. 2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast. 3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.”

— Thomas Goodwin, The Object &amp; Acts of Justifying Faith, pt. 1, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+come+now+to+the+next+attribute+expressed+in+this+proclamation%2C+merciful%3A+%E2%80%98The+Lord%2C+the+Lord+God%2C+strong%2C+gracious%2C+merciful%2C+abundant+in+goodness+and+truth%2C+keeping+mercy+for+thousands%2C+forgiving+iniquity%2C+transgression%2C+and+sin%2C%E2%80%99+Ex.+34%3A6-7.+Things+attributed+to+God+here+are+of+three+sorts%3A+1.+The+inward+disposition+or+inclination%2C+or+aptitude+and+readiness+to+mercy%2C+that+is+in+the+four+first+attributes%2C+merciful%2C+gracious%2C+long-suffering%2C+much+in+goodness%2C+and+truth+is+added.+2.+There+are+his+purposes+and+resolutions+of+mercy%2C+keeping+mercy+for+thousands%3B+and+they+are+immanent+acts+in+God%2C+kept+and+laid+up+in+God%E2%80%99s+own+breast.+3.+There+are+extrinsical+acts+of+mercy+issuing+from+both%3A+%E2%80%98pardoning+iniquity%2C+transgression%2C+and+sin.%E2%80%99+The+meaning+plainly+is%2C+first%2C+God+is+merciful+as+He+is+Jehovah%3B+that+is+his+nature.+Secondly%2C+He+fully+resolves+to+show+mercy%3B+there+is+his+heart.+Thirdly%2C+He+has+done+it%2C+and+does+it+every+day%2C+in+pardoning+sin%3B+there+is+his+wont+and+practice.+So+that+God+is+every+way+merciful%3A+in+his+nature%2C+in+his+purposes%2C+and+in+his+deeds+and+performance.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+The+Object+%26+Acts+of+Justifying+Faith%2C+pt.+1%2C+bk.+1%2C+ch.+8%2C+on+Ex.+34%3A6-7+in+The+Works+%28d.+1680%3B+Edinburgh%3A+James+Nichol%2C+1864%29%2C+vol.+8%2C+p.+55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb6bfd17c0d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b6bfd17c0d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=I%20come%20now%20to%20the%20next,and%20in%20his%20deeds%20and%20performance&amp;text=I%20come%20now%20to%20the%20next%20attribute%20expressed&amp;text=his%20purposes%2C%20and%20in%20his%20deeds%20and%20performance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Besides, the text [2 Cor. 5:13] only says, ‘God is reconciling the world to Himself;’ now there is a great difference between God reconciling and reconciled: The former supposes in God a propensity to bring about the way of reconciliation; not that He is already reconciled, but this flows from a general love and pity He bears to mankind, whereby He procures a way that actual reconciliation may be obtained between man and God; yea Eph. 2:16 compared with Col. 1:20…</p></blockquote>

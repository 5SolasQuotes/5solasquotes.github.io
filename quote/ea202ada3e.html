<main class="wrap"><figure class="quote" id="q-ea202ada3e" data-kw="">
<blockquote><p>Our Savior also had a law for the strict observation of the Sabbath day, yet when it came in competition with greater, such as those that concerned the propagation of the Gospel, and the necessary refreshment of his disciples, who had attended Him from place to place, to the neglect of their bodily sustenance, he urges it not, but justifies them in the nonobservance of it. Nay, he did not only make that law to give place to the preaching of the Gospel and the necessary refreshment of his Disciples, but the helping of an ox or an ass out of the ditch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-wilson.html">Joseph Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Vanity of Human Inventions</cite>, … (London, 1666), p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c722f2b7b9" data-kw="">
<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 77-78</span></figcaption>

<blockquote><p>…the night of the first day was that which followed the light, after God had separated the light which he called ‘day’ from the darkness which he called ‘night’; to object the order of the words is vain, Moses himself takes off that objection by inverting that order in the following words, for v. 4, he puts light before darkness and day before night.</p></blockquote>

</figure><figure class="quote" id="q-62b6e1860c" data-kw="">
<blockquote><p>This Sabbath is then kept holy unto the Lord, when men, after a due preparing of their hearts, and ordering of their common affairs beforehand, do not only observe an holy rest all the day from their own works, words, and thoughts, about their worldly employments and recreations (Ex 20:8; 16:23, 25-26, 29-30; 31:15-17; Isa 58:13; Neh 13:15-22); but also are taken up the whole time in the public and private exercises of his worship, and in the duties of necessity and mercy. (Isa 58:13; Mat 12:1-13)</p></blockquote>

</figure><figure class="quote" id="q-eb6a4c61db" data-kw="">
<blockquote><p>Section 3, That on the Lord’s Day we must abstain from carnal recreations… we ought to… feed and cherish it with vain sports and worldly recreations… To them that are wearied with labour, the rest of the Lord’s Day is the best and fittest recreation for the refreshing of their bodies; and if they be spiritually-minded, the exercises of the Sabbath before spoken of, are the best recreations for the cheering of the heart and mind. For who can reasonably think when a man is tired with the week’s labour, that… should recreate a man more, than an holy and religious rest, hearing the Word, singing of Psalms, holy conferences, and such like…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-394dd02b63" data-kw="">
<blockquote><p>We find three old opinions concerning the sin against the Holy-Ghost, but they were long since exploded; I will but only name them: First, saint Origen thought all sins committed after baptism, to be sins against the Holy Ghost: his reason was only a witty conceit of his own, that God the Father is in all things, the Son is only in all reasonable creatures, the Holy Ghost is only in all regenerate men; therefore when men sin against that divine Person that is in them, if they be heathens, they sin against God the Father or the Son; if they be Christians, they sin against the Holy Ghost. The Novatian heretics agreed with Origen in opinion, for they denied remission of sins to any that fell, thinking all falls of Christians to be the sin against the Holy Ghost: but this opinion is false; For else all sins were unpardonable to Christians: yet we find saint Paul remit the sin of the incestuous Corinthian; also our Savior charges the Pharisees with this sin, who were no Christians. Secondly, saint Augustine thought [after a revision of his earlier view] final impenitency to be the sin against the Holy Ghost; but final impenitency is no blasphemy, but only a general circumstance that may accompany any sin. Besides, our Savior intends that this sin may be found in this life, for he says it shall not be forgiven in this life, and the Pharisees were alive when they were accused of it. Thirdly, Peter Lombard and Thomas Aquinas thought sins of malice to be the sin against the Holy Ghost, and sins of infirmity against the Father, and sins of ignorance against the Son. This opinion is false, because the sin against the Holy Ghost must be a sin of some certain blasphemy; but malice is no certain sin, but a general [sin], and it is not always a blasphemy. The six differences the Schoolmen make of the sin against the Holy Ghost are: first, envying of our brother’s grace: secondly, impugning the known truth: thirdly, desperation, fourthly, presumption: fifthly, obstinacy: sixthly, final impenitency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hales.html">John Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Blasphemy against the Holy Ghost (London: 1646), pp. 20-21</span></figcaption>

</figure><figure class="quote" id="q-8a728eb99f" data-kw="">
<blockquote><p>And in this they [Jews] speak but the words of the Law, in Num. 15:27-28: ‘If any soul sin through ignorance, he shall bring a she-goat of the first year for a sin offering. And the priest shall make an atonement for him that sins ignorantly. But the soul that does ought presumptuously… the same has reproached the Lord: That soul shall be cut off from among his people.’ Now what is meant by ‘cutting off’?… ask the Jews to and among whom the thing was spoken, what it means in their common speech and acceptation, and they will tell you, ‘cutting off means’ [Hebrew], ‘Death by the hand of Heaven,’ death or destruction by the hand of God. Interpreting the matter to this purpose, that if a person sinned wilfully and presumptuously, there was no sin offering allowed in that case, but the party so offending fell immediately under liableness to divine vengance, to be destroyed or cut off by the hand of Heaven…</p></blockquote>

<blockquote><p>2. The apostle, 1 Jn. 5:16, speaks of a sin unto death, that we are not to pray for one guilty of that; This has much troubled the learned; The ancients, they thought it was not an absolute prohibition of all [persons] to pray for such, but only that eminent men might do it; They thought for an ordinary Christian to pray for such sinners, it would be high presumption; As it’s not for everyone in the court to speak for some heinous offender but a special favourite; When God said, though Noah, Job and Daniel should pray for that people, He would not hear them (Eze. 14:14); This implied that they were nearer to God’s ear and might prevail sooner than others; Though this exposition be old, yet the text seems to be absolutely prohibitive; and so Augustine said that if we knew who had sinned that unpardonable sin against the Holy Ghost, we were no more to pray for him than for one damned in hell:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 145 Expository Sermons upon the Whole 17th Chapter of the Gospel according to St. John… (London: Miller, 1656), Sermon 41, ‘Of Praying both for the Godly &amp; the Wicked,’, pp. 229-30</span></figcaption>

<main class="wrap"><figure class="quote" id="q-bb51e8267d" data-kw="">
<blockquote><p>But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), Ch. 4, pp. 51-2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2242bf998" data-kw="">
<blockquote><p>The presbyterial government has no such liberty nor arbitrariness as civil or military government has, there being in all civil or temporal affairs a great deal of latitude left to those who manage the same, so that they command nor act against the Word of God. But presbyterial government is tied up to the rules of Scripture in all such particulars as are properly spiritual and proper to the church, though, in other particulars, occasional circumstances of times, places, accommodations and the like, the same light of nature and reason guides both church and state; yet in things properly spiritual and ecclesiastical, there is not near so much latitude left to the presbytery, as there is in civil affairs to the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>bk. 1 ToC of Aaron’s Rod Blossoming</cite>, (1646; Edinburgh, 1844), p. 84</span></figcaption>

</figure><figure class="quote" id="q-2e5d8328ba" data-kw="">
<blockquote><p>It [magistracy] is an ordinance of men, not effectively, as if it were an invention and a dream of men; but subjectively, because exercised by man. Objectively, and [Greek, telikos], for the good of men, and for the external man’s peace and safety especially; whereas church -officers are for the spiritual good of men’s souls. And Durandus says well (Book on the Origin of Right), “Civil power according to its institution is of God, and according to its acquisition and way of use is of man.” And we may thus far call the forms of magistrates ‘a human ordinance’ [2 Pet. 2]—that some magistrates are ordained to care for men’s lives and matters criminal, of life and death, and some for men’s lands and estates; some for commodities by sea, and some by land; and are thus called magistrates according to these determinations or human ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (Edinburgh: Ogle &amp; Boyd, 1843), p. 6 (lt col top)</span></figcaption>

<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>

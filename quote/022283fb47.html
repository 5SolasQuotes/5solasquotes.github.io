<main class="wrap"><figure class="quote" id="q-022283fb47" data-kw="">
<blockquote><p>The passage where God declares, “The son shall not bear the iniquity of the father, but the soul that sinneth, it shall die” (Ezk. 18:20) is not to be absolutely and simply understood as it sounds. Otherwise there would be a contradiction to the law and a denial of the substitution of Christ in our place. Rather it ought to be explained: (1) of adult sons who depart from the iniquity of parents and do not imitate them (as appears from v. 19—“Why? doth not the son bear the iniquity of the father? When the son hath done that which is lawful and right, he shall surely live.” Now such are not the sons of Adam, who are transgressors from the womb). (2) Of personal and particular sins, not of common and general, which can involve many, such as the sin of Adam. (3) There is not established here a general rule of providence and justice in accordance with which God either before always acted or will hereafter conform all his judgments. For He ordained in the Law otherwise and proceeded in examples. Rather it treats of a business peculiar to the Jews on whom God bestowed this by a special concession; not to act with them in that strictness of justice which he could observe (as to impute others’ sins to them), but to punish their own sins in themselves, that in this way their mouth might be entirely closed. On this pretext, the Jews carped at the divine judgments that the undeserving were punished for the sins of their parents, as is evident from the proverb they used: “The fathers have eaten sour grapes and the children’s teeth are set on edge.” God answers that He would not deal with them thus in the least, but would punish each one for his own sins, as we read in v. 30. Therefore He wishes in the present affair to draw and to bring them to this confession—to acknowledge God to be just in his judgments and that there was no need for Him to seek sins in the fathers in order to punish the sons; that there was sufficient criminality in themselves (even apart from the imputation of the sins of others) to justify the infliction of the punishment they had already suffered and even greater still. So there is not here any definition of right, but only the declaration of a special agreement. He does not say what He can rightly do, but against the complaints of the people, what he wills to do. The scope of the prophet and the connection of the words lead us to this. Finally, the highest right differs from the forbearing (epieikeia) right. In accordance with the former, God can visit the sins of parents upon their children, but in accordance with the latter He extends the punishment no further than to sinners themselves. Thus the prophet, speaking of the New Testament times, says among other things: “In those days they shall say no more, the fathers have eaten a sour grape, and the children’s teeth are set on edge. But every one shall die for his own iniquity” (Jer. 31:29, 30*). He says this to teach that God would deal with them more gently than before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, p. 624</span></figcaption>

<blockquote><p>However, from the fact that the apostle assigns death to consummated sin, the Romanists wrongly infer that non-consummated sin is not worthy of death, but only of temporal punishments, that is, so that they may hold to venial sin, and from that, their purgatory. They attend too little to the fact that the apostle does not say that only sin consummated by the full consent of the will gives birth to death, since elsewhere Paul assigns death to concupiscence (Rom. 7:5), namely that concupiscence which he did not know was sin (v. 7). Accordingly, he intends only that consummated sin gives birth preeminently to death, insofar as it includes two degrees of sin, internal as well as external.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 2, pp. 490-91</span></figcaption>

<blockquote><p>There is also a received distribution of theology into doctrine concerning God and the works of God. Indeed, whatever things are treated in theology are able to be referred to this double doctrine, even sin itself: which, although it is not a work of God, yet it is an accidental property of a divine work, namely, of angels and men; not concreated, but derived from elsewhere, namely, from the fall of angels and men.</p></blockquote>

</figure><figure class="quote" id="q-d3fea535f4" data-kw="">
<blockquote><p>Whether God is able to hate sin and will its existence? It is asked whether that distinction is frivolous by which we teach God to hate sin, and yet to will its existence? So says that Arminian against Perkins (p. 701). We deny:

1. Because for God to hate sin is not for God to intend that sin would never exist, as it is false that God decreed that the crucifixion of the Savior, the selling of Joseph, the carrying off of his people into captivity by the Assyrians and Chaldeans, the defecting of the ten tribes from the family of David and the spoiling of Job by the Sabeans, would not exist.

2. Because sin in itself is a disgraceful evil and an object of the displeasing and disapproving will [of God]. But truly for sin to exist is a useful good, conducing to the glory of God; and all good existing in time is from God, from the eternal decree.

3. Because in the explication of our distinction, Arminius falsely imputes to us that we teach that God wills and approves sin existing and that God does not hate sin existing. For God hates sin and hates the existence of sin in the genus of a disgraceful thing, and yet He decrees to permit that it would exist under the genus of a useful thing.

4. [William] Twisse rightly says, Marcus Cato[1] willed Carthage [an enemy city] to exist inasmuch as it was a grindstone and material exercising youth of Roman virtue, and yet he willed against it, i.e. to hate Carthage. I further add that Peter rightly willed that Christ would spare Himself, that He would not be killed by ungodly foes; and yet Christ wills against this, rightly declaring him to be of Satan; notwithstanding, Peter was bound to hate that occasion as it was sin (Mt. 16:21-23). [1] Marcus Cato the elder (234-149 B.C.) was a Roman soldier, senator and historian known for his opposition to Hellenization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, p. 233-234, as trans. in Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter trans. Charles Johnson &amp; Travis Fentiman (1668 / 2019), pp. 68-69</span></figcaption>

tanding%2C+Peter+was+bound+to+hate+that+occasion+as+it+was+sin+%28Mt.+16%3A21-23%29.+%5B1%5D+Marcus+Cato+the+elder+%28234-149+B.C.%29+was+a+Roman+soldier%2C+senator+and+historian+known+for+his+opposition+to+Hellenization.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Examination+of+Arminianism%2C+p.+233-234%2C+as+trans.+in+Rutherford%E2%80%99s+Examination+of+Arminianism%3A+the+Tables+of+Contents+with+Excerpts+from+Every+Chapter+trans.+Charles+Johnson+%26+Travis+Fentiman+%281668+%2F+2019%29%2C+pp.+68-69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3fea535f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d3fea535f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/sin#:~:text=Whether%20God%20is%20able%20to%20hate,known%20for%20his%20opposition%20to%20Hellenization&amp;text=Whether%20God%20is%20able%20to%20hate%20sin%20and&amp;text=and%20historian%20known%20for%20his%20opposition%20to%20Hellenization" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. Children! Be humbled under the sense of the iniquity of your parents when ye remember their ways, or possess what unjustly they have gotten, ye become guilty of their sins, without repentance. Especially you have need to take notice of this that are the children of parents that have opposed the purity of God’s service and worship and the work of its reformation, and have been corrupters of it: Children may be partakers of their parents’ faults and so plagued for them several ways; and we think that this forfeiture is more than ordinary. And therefore, as amongst men there are special crimes beyond ordinary procuring such a sentence, so is it here. And:

1. They be guilty by following their foot-steps, in walking in their parents sins, as Jeroboam’s children did.

2. In approving their fathers’ way, praising their fathers’ sayings or doings, as it is Psalm 49:13.

3. In winking at their parents’ sins and wickedness.

4. In boasting of their oppressions, bloodshed, etc. as if they were were acts of valor and manhood.

5. In being content that their fathers sinned, if it gained any possession to them.

6. In possessing and enjoying without repentance what to their knowledge they sinfully purchased.

7. In spending prodigally and riotously what the parents covetously gathered; the sin of the parent here is the seed of the sons’ sin.

8. In professing sorrow for the want [lack] of occasion to live in ignorance, profanity, or looseness as their fathers did, as in Jer. 44:17-19, they said that things went well then. [9.] In not being humbled before God for the sins of predecessors, nor confessing them to him, as Lev. 26:40, nor repairing the losses or injuries which we knew they did to any that were wronged or oppressed by them.</p></blockquote>

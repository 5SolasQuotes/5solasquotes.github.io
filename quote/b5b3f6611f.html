<main class="wrap"><figure class="quote" id="q-b5b3f6611f" data-kw="">
<blockquote><p>That the elect were the party represented, or contracted and undertaken for, in the covenant of grace, appears from the following grounds.

1. The party with whom the covenant was made, is in the text called God’s chosen; as representing and contracting for all the chosen or elect: even as the first man was called Adam or man, as representing and contracting for all mankind in his covenant. For, as the apostle teacheth, Heb. ii. 11, He —and they — are all of one not only of one nature, but also of one body, to wit, the election; Christ is the head elect, Isa. xlii. 1, they the body elect, Eph. v. 23. Therefore they go under one name, principally belonging to him, and then to them by participation with him. Thus ho is also called Abraham’s seed, as representing all the spiritual seed of Abraham, that is, the elect, Gal. iii. 16, “And to thy seed which is Christ;” and the seed of the woman, as opposed to the serpent’s seed; and under that name also the elect are comprehended; they, and they only, being the party betwixt whom and the serpent with his seed, God puts the enmity, according to the promise, Gen. iii. 15.

2. Those whom Christ represented and contracted for in the covenant of grace, are the heavenly men: 1 Cor. xv. 47, 48, “The first man is of the earth, earthy: the second man is the Lord from heaven. As is the earthy, such are they also that are earthy; and as is the heavenly, such are they also that are heavenly.” Now, the heavenly men, belonging to Christ the second man, arc none other but the elect. For they are contra-distinguished to the earthy men, belonging to the first man; to wit, all mankind taken into the first covenant in Adam: and therefore they are the elect men, taken into the second covenant, in the second Adam.

Again, the heavenly men are those who shall bear the image of the heavenly man Christ, ver. 49; and such are the elect, and they alone. And, finally, they are those to whom Christ is, in respect of efficacy, a quickening spirit: for “as is the heavenly, such are they also that are heavenly.” As Adam’s deadly efficacy goes as wide as his representation did in the first covenant, reaching all mankind his natural seed, and them only; so Christ’s quickening efficacy goes as wide as his representation did in the second covenant, reaching all the elect, his spiritual seed, and them only: and if it did not, some would be deprived of the benefit which was purchased and paid for, by the surety, in their name: the which is not consistent with the justice of God.

3. They whom Christ represented and contracted for in the covenant, are his seed, his spiritual seed: Gal. iii. 16. “Now to Abraham and his seed were the promises made. He saith—and to thy seed, which is Christ.” Psalm lxxxix. 3, 4, “I have sworn unto David my servant. Thy seed will I establish for ever.” In the covenants typical of the covenant of grace, the parties represented were the seed of the representatives they were made with, as was cleared before: and in the first Adam’s covenant, his natural seed were the represented.

Wherefore, in the second Adam’s covenant, his spiritual seed are the represented. Now, Christ’s spiritual seed are the elect, and none other; for they are those whom he begets with the word of truth, Jam. i. 18. and are born again (1 Pet. i.23.) unto him in their regeneration; whom therefore lie sees as his seed, with his own image on them, Isa. liii. 10. They are the travail of his soul, who, sooner or later, are, all of them, justified, ver. 11. They are the seed that shall serve him, Psalm xxii. 30; which shall be established and endure for ever, namely, in a state of happiness, Psalm Ixxxix. 4, 29, 30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 400-01.</span></figcaption>

<blockquote><p>Q. Of how many sorts is this Covenant?

A. In substance it is but one, but in regard of circumstance it is two: the Old Testament, and the New.

Q. What is the Old Testament?

A. It is the covenant of God, which (under types, figures, and shadows) did set forth Christ before his coming in the flesh; and by virtue whereof life everlasting was given by faith in Christ that was to come.

Q. What is the new Testament?

A. It is the covenant of God, which (since the coming of Christ in the flesh) hath abolished those shadows, &amp; giveth life everlasting by faith in Christ, that is come; by means whereof it is in a special respect called the Gospel. Coloss. 2.16.17.20. Hebr. 9.1.2.3. &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 168.</span></figcaption>

<blockquote><p>197. But can you not appeal to Scripture, if possible, of a still more conclusive nature, in relation to this subject?

Yes: posterity is charged with the guilt of violating Covenants made with ancestors: “They are turned back to the iniquity of their forefathers, which refused to hear my words; and they went after other gods to serve them: the house of Israel and the house of Judah have broken my Covenant which I made with their fathers.” (Jer. xi. 10.) Still more explicit Israel on the plains of Moab; for, in relation to the transactions at Sinai, entered into forty years before the time when Moses addressed the words to Israel, and when he, Caleb, and Joshua, were the only three original Covenanters alive, he declare:- “The Lord our God made a Covenant with us in Horeb: the Lord made not this Covenant with our fathers, but with us, even with us, who are all of us here alive this day.” (Deut. v. 2, 3.)

198. Is not the principle of the continued obligation of Covenants often in Scripture made a plea in supplicating the Divine mercy?

Yes, frequently. Hence, for example, Jeremiah exclaims:- “Do not abhor us for thy name’s sake: remember, break not thy Covenant with us.” (See Jer. xiv. 21.)

199. On the other hand, does not Jehovah himself frequently rest a plea on the same principle, why punishment should fall upon the guilty?

He does. In the suppositional case stated by Moses (Deut. xxix. 25) to inquirers after the cause of the conditional infliction of sweeping desolations on the Jewish race, the emphatic reply is given: – “Because they have forsaken the Covenant of the Lord God of THEIR FATHERS.</p></blockquote>

<blockquote><p>affectio: affection; viz. passion or desire, a disposition toward someone or something; synonymous with passio and affectus. Specifically, the affectio animi, or affection of soul, that is the faculty of desire. [While the above is speaking of affections in general, that is for living creatures, and God does not have passions, yet note the Reformed Orthodox teaching that affections are attributed to God improperly: ‘On the Affections of God’.] affectus voluntatis Dei: affections of the will of God; viz., those divine attributes which, according to the strict faculty psychology held by the Protestant scholastics, appear as dispositions or conditions of the divine will; i.e., amor or love, benevolentia or goodness of will, clementia or clemency, gratia or grace, ira or wrath, longanimitas or longsuffering, misericordia or mercy, odium or hate, and patientia or patience.</p></blockquote>

</figure><figure class="quote" id="q-f886edd33a" data-kw="">
<blockquote><p>Whether doth not the Covenant of grace require works, as well as doth the Covenant of works? I answer, It doth; as is evident Titus 2.11.14. The grace of God that bringeth salvation, teacheth us to be zealous of good works; and Mat. 5.16. Let men see your good works, saith Christ; though Christ preached not a Covenant of works, but of grace, yet he calls for good works. But mark the difference.

1. The Covenant of works doth not require works for the same end, as the Covenant of grace, for that requires works as the matter of our justification before God; so saith Moses, (understanding him in a Legal way) Deut. 6. last, This is your righteousness; but the Covenant of grace requires works not as a part of our righteousness, but that thereby we should glorify God, and manifest it that we are made righteous by Christ, James 2. we are thereby declared to be righteous; the godly conversation of a Christian maketh it evident to the consciences of men, that he is a justified man.

2. The works that are required in the Covenant of grace, are not required from the same beginning; the Covenant of works requires works to be performed from our own strength and ability received in the Creation, it presupposeth ability in our selves to do what it requireth. But the Covenant of grace requireth works to be done by the help of the Spirit of Jesus Christ. Phil. 4.13. I can do all things, saith the Apostle, through Christ strengthening mee, that is, the power which the Covenant of grace directs us unto.

3. The Covenant of grace doth not require works in the same order as the Covenant of works doth, for the Covenant of works requires works first, and then faith to believe our selves beloved unto life; but the Covenant of grace requireth faith first, and then that we bring forth good works; therefore saith the Apostle (Titus 3.8.) Let them which have believed, be careful to shew forth good works: He doth not say, Let them which have done good works, believe; but first believe and then doe good works, he placeth faith before works; and hence it is that the obedience of the Gospel, is called the obedience of faith, Rom. 16.26. as following faith and springing from it. Thus then this difference of the condition of the Covenants remaineth; the one Covenant commanding works, the other faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-bulkeley.html">Peter Bulkeley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The gospel-covenant; or The covenant of grace opened</cite>, (London: Benjamin Allen, 1646), p. 55.</span></figcaption>

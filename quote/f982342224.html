</figure><figure class="quote" id="q-9f537cdcf5" data-kw="">
<blockquote><p>The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>

</figure><figure class="quote" id="q-f5a2ff4eef" data-kw="">
<blockquote><p>3. We must hold that the Covenant of Grace, though it take not away the obligation of the Law, yet it takes away the rigor, or severity and terribleness of that obligation. For though it set before our eyes an universal perfection of righteousness, as to be affected and endeavored to our utmost strength, yet does it not strictly and precisely require it on the pain of eternal damnation. Indeed to a certain measure of obedience, to wit, such as by ordinary grace is possible, it does strictly and precisely oblige us, that is, on pain of eternal damnation, requiring that we actually have it. But to a farther measure, which by the power of ordinary grace we cannot attain, it obliges us less strictly, to wit, requiring that we have it in desire and endeavor, v.g. to the perfection of parts, as they call it, it obliges precisely: For it does no otherwise promise eternal life, but on this condition, that we actually have this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on Mortal &amp; Venial Sin</cite>, pp. 24-25 in Richard Baxter, Richard Baxter’s Confession (1655), ch. 10, sect. 3, p. 401</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3586497a7a" data-kw="">
<blockquote><p>…there is a twofold necessity; one absolute, the other conditional. Absolute, that is, when one thing is so necessarily required to another, as that it cannot be without it. Secondly, there is a necessity that is not absolute, but conditional; that is, when one thing is so necessary to another as that it cannot well be without it: of this latter sort, the necessity of this government in the Church of God is: for the Church may be without it in some kind of being, but it cannot have her well-being except this concur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London, 1631), Lecture 14 Randall (1570–1622) was an English puritan who held that the particular form of Church government is not by divine-right., p. 235</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

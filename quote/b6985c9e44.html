<main class="wrap"><figure class="quote" id="q-b6985c9e44" data-kw="">
<blockquote><p>Some object that the fifth, sixth, seventh and eighth [Anglican] canons have excommunicated us [nonconformists] already. Therefore we separate not, but they cast us out. Answer: Let them that are concerned in those canons defend them if they can and justify themselves, for it’s past my skill; but we are not bound (though excommunicated) to execute them on ourselves: Let others do it if it must be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-424874201a" data-kw="">
<blockquote><p>[In the Early and Medieval Churches, they taught] To pray towards the East, and that for this cause and signification, because we seek to Paradise, our old and ancient country, and [this] is commended and apostolical, [according to] Basil, Of the Holy Spirit, ch. 27. … The temples [church buildings] were erected to stand East and West, the altars of the Church stood Eastward and some toward the West; Socrates, Ecclesiastical History, bk. 5, ch. 22.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Patristic Practices’</cite>, pp. 88, 90</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f3b61fd2a" data-kw="">
<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. … 2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse. 3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity. 4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’ 5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus… (London, 1631), on Lev. 10</cite>, pp. 197-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

gments%20be%20secret%2C%20yet%20they%20are%20not%20unjust" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c9c1a8810b" data-kw="">
<blockquote><p>Pt. 2, ‘Of Idolatry’ §2. ‘Of Idolatry in General’ Idolatry is a species of superstition, being an excess in the object of worship. It is the giving of worship that is proper to God to that which is not God… . Pt. 3, ‘Of Superstition Less than Idolatry’ §1. ‘Of Excess in the Quantity or Measure of Religious Observances’ All superstition is an excess in religion… this excess is either in the measure or in the kind when the rule of religion is transgressed in either of these ways; and in some instances there may be an excess in both… . §2. ‘Of Excess in Religious Observances, for the Kind Thereof’ …Some kinds of religious worship may not be vicious in their nature, nor contrary to God’s holiness to command or allow, yet may be forbidden by the general precept of Scripture or other supernatural revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684) Corbet (d. 1680) was a congregationalist puritan.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-ec33576fe8" data-kw="">
<blockquote><p>God’s effectual calling is that, whereby God calleth out of darkness into his admirable light, from the power of Satan unto God, in Christ Jesus, those whom he knew from eternity, and predestinated unto life, of his mere favour, by the promulgation of the covenant of grace, or preaching of the Gospel.

Such also as be called by the same grace of God, answer, and believe in him through Jesus Christ. This answer is of faith, which is, in very truth, the condition of the promise which is in the covenant of grace. Wherefore our effectual calling doth consist of the promise of the covenant (which is under condition of faith) and in faith also, which is nothing else but the fulfilling of the condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), p. 1.</span></figcaption>

<blockquote><p>[T]here is a further consideration that will make it appear, that the Grace of God does exceed the grace of the most glorious angel in heaven: which is the unlimited perfection of God’s nature, the Angels have a stinted measure of perfection: the excelling of their nature is not sufficient in order to some acts of grace: as in other respects, they are not sufficient, so they have not grace enough to pardon such wrongs as God pardons; to be at such cost for man’s salvation, as God has been at: ’tis true that they do approve of and rejoice in all those acts of Grace that God does? but such actions do exceed the grace that is in their hearts; they have can’t perform those acts of mercy that God does: therefore where God would shew his sufficiency to pardon the iniquities of his people, he tells them, that God, Hos. 11.6. this infiniteness of God’s grace is the foundation of our faith, for such things as we are utterly unworthy of: Psal. 36.7. how excellent is thy loving kindness O Lord, therefore the Sons of men put their trust under the shadow of thy wings.

There is an infinite Ocean of grace in the heart of God, whereby he can bestow the greatest gifts upon his creatures, that their natures are capable of: this plain from that absolute liberty which the Scripture does ascribe unto God in all his actions; he does all things after the counsel of his own Will. Eph. 1.11. I will have mercy on whom I will have mercy, Rom 9.15. which shews there is no limitedness in his perfection, to be any restraint unto him: or a reason why he does not pardon and save these and those: his glorious excellency is such, that no unworthiness, nor provocation can overcome his mercy: but there is a sufficiency of grace in him, for any thing that is an act of mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied</cite>, (Boston MA: Samuel Phillips, 1687), pp 17-18.</span></figcaption>

</figure><figure class="quote" id="q-00dfc149ac" data-kw="">
<blockquote><p>Mercy is especially to be attributed to God, as seen in its effect, but not as an affection of passion… To sorrow, therefore, over the misery of others belongs not to God; but it does most properly belong to Him to dispel that misery, whatever be the defect we call by that name. Now defects are not removed, except by the perfection of some kind of goodness; and the primary source of goodness is God, as shown above (Q. 6, A. 4). It must, however, be considered that to bestow perfections appertains not only to the divine goodness, but also to His justice, liberality, and mercy; yet under different aspects. The communicating of perfections, absolutely considered, appertains to goodness, as shown above (Q. 6, AA. 1, 4); in so far as perfections are given to things in proportion, the bestowal of them belongs to justice, as has been already said (A. 1); in so far as God does not bestow them for His own use, but only on account of His goodness, it belongs to liberality; in so far as perfections given to things by God expel defects, it belongs to mercy.</p></blockquote>

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Scripture, moreover, has a, third rule for modifying the use of earthly blessings. We have already adverted to it when considering the offices of charity. For it declares that they have all been given us by the kindness of God, and appointed for our use under the condition of being regarded as trusts, of which one day we must give an account. We must, therefore, administer them as if we constantly heard the words sounding in our ears, ‘Give an account of your stewardship.&#x27;</p></blockquote>

<blockquote><p>…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Stock of Divine Knowledge</cite>, … (London: T.H., 1641) Stock (c.1568-1626) was an English puritan., ch. 19, Of the Anger of God, pp. 217-18</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.”

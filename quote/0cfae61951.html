<blockquote><p>In this [fallen] condition the holy Scriptures help us, teaching that the heavenly Father is at peace with humankind by no other means than by the sacrifice of his only begotten Son. Through this sacrifice God has made an everlasting covenant with his people, has forgiven our sins, has adopted those who believe as his children, has committed them to his first begotten Son for salvation, and had incorporated them and made them heirs of his heavenly kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), dedication, p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“In this [fallen] condition the holy Scriptures help us, teaching that the heavenly Father is at peace with humankind by no other means than by the sacrifice of his only begotten Son. Through this sacrifice God has made an everlasting covenant with his people, has forgiven our sins, has adopted those who believe as his children, has committed them to his first begotten Son for salvation, and had incorporated them and made them heirs of his heavenly kingdom.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ce5a3baf25" data-kw="">
<blockquote><p>Thus, in the first place, the certainty of the salvation of believers is in a remarkable manner bound up in Holy Scripture, with this doctrine. They for whom Christ died cannot perish; and it is his dying for them that makes their perishing an impossibility. This is very clearly brought out in the tenth chapter of John’s Gospel. There it is explicitly declared by Christ himself that he was to “lay down his life for the sheep” (ver. 15); and that this declaration is exclusive — implying that he lays down his life for them alone, without any reference to the world at large — is to be inferred from the connection in which he introduces it. He is enlarging on the security which his people have in him; and it is as the proof of this — the only tangible proof which he alleges — that he brings in the appeal to the fact of his dying for them.

But this would be no proof at all, if others besides his sheep were interested in his death; or, which is the same thing, if any for whom he laid down his life might, after all, perish. Hence, in a subsequent part of the chapter (ver. 25-30), it is expressly given as the reason why some believe not, and therefore are lost, that they are not of his sheep, for whom he lays down his life; and, on the other hand, the safety of believers, or the security that they shall never perish, is made to depend on their being his sheep, to whom he gives eternal life (ver. 28), and whom the Father hath given to him (ver. 29); the former of these gifts being the consequence, and the latter the cause, of his laying clown his life for them, and for them alone.

He lays down his life for those whom the Father hath given him; and to those for whom he lays down his life, he giveth eternal life; and this is that threefold cord, not to be quickly broken, which fastens believers to the Rock of Ages; — the Father’s gift of a people to the Son to be his sheep; the Son’s dying for his sheep thus given to him by the Father; and his giving to them, as the fruit of his dying for them, eternal life. But unless all the three lines in this cord be of equal extent, it cannot hold fast — it must yield, or stretch, or break; nor, on any supposition of a wider purpose in the death of the Son than in the gift which the Father makes to him of a chosen number to be his sheep, is there any value in the assurance with which the Lord rivets the last link of the chain: “I and my Father are one.” (Ver. 30.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), xxxii-iv.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-d0d485032f" data-kw="">
<blockquote><p>2. It is to be considered, how many ways Christ may be said to give Himself [Greek], a ransom for us, or in our place. 1. Christ has sufficiently died for all [the elect] in their room to redeem them. For, pro [Greek], ‘for men’, notes ever the decree and intention of Christ dying for men; but the sufficiency and worth and intrinsical dignity of Christ’s death depends not upon the decree and intention of God, for the worth of the death and the blood of Him who is God, Acts 20:28; 1 Cor. 2:8, and the Lord of Glory is infinite, because of the infinitness of the Person, before and without the decree of God.</p></blockquote>

</figure><figure class="quote" id="q-34326e8cff" data-kw="">
<blockquote><p>God’s reconciliation to us must precede our reconciliation to him. This, as remarked above, is the great doctrine of the Bible. So long as we are under the wrath and curse of God, due to us for sin, we are aliens and enemies, cut off from his favor and fellowship, which are the life of the soul. Therefore until God’s wrath and curse are removed, there is no possibility of holiness and love. It is vain to attempt to secure the favor of God by being holy; we must enjoy his favor before we can be holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:18</span></figcaption>

<blockquote><p>But while our inherent depravity renders every kind of work which proceeds from us vicious in the sight of God, the only thing left for our works is to recover the grace which they have not in themselves, by a gratuitous acceptance. This is done when works acknowledged to have no value in themselves borrow, and, as it were, beg their value from Christ.</p></blockquote>

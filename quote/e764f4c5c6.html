<main class="wrap"><figure class="quote" id="q-e764f4c5c6" data-kw="">
<blockquote><p>We are apt to think, that there is such a difference between our open sins and our religious exercises, that any defilement attaching to the latter must be so inconsiderable in itself, and so outweighed by the sacredness of the act performed, that no particular account need to be taken of these sins. God’s estimate is very different indeed. His eye sees the sins of our religious services in another light, as being no less heinous than other iniquities, and needing special forgiveness no less than they.

Not merely our open transgressions—our scarlet and crimson sins—need pardon, but our holy services, our good words and deeds, our prayers, our praises, our worship, our breaking of bread at the table of the Lord. In every one of these there is such an amount of sin cleaving to, and mingled with, every act, and feeling, and thought, and word, as to render them in themselves so miserably defective and defiled, as to be utterly unacceptable in the sight of the Holy One.

When seeking God, we need to have our way of seeking and our act of seeking forgiven. When praying for pardon, we need to have that prayer itself forgiven. Each petition bears witness against us. There is such imperfection, such coldness, such formality, such deadness, such wandering, such half-heartedness, such a want of every thing that constitutes prayer, that, were there not forgiveness for the sins of our holy things, we might as well cease to pray. When coming to Christ, we need forgiveness for our act of coming, for the impure motives which lead us to come, as well as for the defective way in which we come. All this is provided for. There is forgiveness not merely for the sins we bring to Christ, but for our way of bringing them. …

There is forgiveness, then, for the iniquities of our holy things forgiveness not only for our omissions of duty, but for our duties themselves; forgiveness, not only for our estrangement from God, but for our sins in returning to him; forgiveness, not only for our prayerlessness, but for our prayers; forgiveness, not only for our long rejection of Christ, but for our sins in coming to him; forgiveness, not only for our unbelief, but for our faith; forgiveness, not only for our past enmity, but for our present cold-hearted love; forgiveness, not only for the sins we bring to Christ, but for our way of bringing them; forgiveness, not only for the sins we carried to the altar of burnt-offering, and laid upon the bleeding sacrifice, but for our imperfect way of taking them, the impure motives that defiled our service, and also for the sins mingling with our worship when standing within the veil in that sanctuary, where the majesty of the Holy One has made its abode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ our High Priest, Bearing the Iniquity of our Holy Things in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85d2bcd06d" data-kw="">
<blockquote><p>One finds Calvin (for instance) declaiming, in his lectures, that they [French kings] are “gross and stupid.” They “think they are exempt from the law.” They are self-indulgent, “inhuman tyrants,” and “madmen.” They “despise everything divine” and wish to be worshipped in God’s place. They “rage against the church.” “We know that wherever there is cunning in the world, it reigns especially in the palaces of princes.”… Thus, the depiction of obsequious deference and obedience on the part of Geneva towards France was, in reality, a façade.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 97</span></figcaption>

</figure><figure class="quote" id="q-4bf40a721c" data-kw="">
<blockquote><p>Some had thought that your Love and Charity extended a little to[o] far beyond the Scripture-Rule in some Instances, such as Journal last p. 59. when you say, “The Quakers’ Notions about walking and being led by the Spirit, you think are right and good;” unless they be Quakers of another Stamp than the rest, whose dangerous Tenets are inconsistent with the right Notion of walking and being led by the Spirit, while, beside other Things, they deny Justification by the imputed Righteousness of CHRIST, or his active and passive Obedience received by Faith, to be the only Ground of Justification before GOD; and while thus they cannot receive CHRIST JESUS, they consequently cannot walk in him, nor be led by his Spirit, who is the Spirit of Truth, testifying of CHRIST, according to the Revelation made of him in the Word, which they contradict. Whatever Duties of Love you perform toward these Men, yet I’ll never believe you mean or intend to justify their Principles and delusive Notions, nor think well of them, till once the LORD convince and convert them.</p></blockquote>

<blockquote><p>And one thing is surely right in Kant’s argument, which is that the experience of beauty, like the judgement in which it issues, is the prerogative of rational beings. Only creatures like us—with language, self-consciousness, practical reason, and moral judgement—can look on the world in this alert and disinterested way, so as to seize on the presented object and take pleasure in it.</p></blockquote>

</figure><figure class="quote" id="q-e854102423" data-kw="">
<blockquote><p>Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 6 (Edinburgh: T&amp;T Clark, n.d.), 592.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.”

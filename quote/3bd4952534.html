<main class="wrap"><figure class="quote" id="q-3bd4952534" data-kw="">
<blockquote><p>But how can we imagine that many thousands [of Jerusalem Christians] could in one meeting communicate at one Table in the Lord’s Supper, and that ordinarily? 1. What voice could reach to so many thousands, as they did grow unto?… 3. Can we believe that seeing congregational meetings of fewer, and that in private houses, was less obnoxious to the indignation of authority, than meeting in the Temple, as is most evident, Acts 4:1-2; and seeing [that] the apostles had liberty to meet, Acts 5:26, [can we believe] that they would draw the first mold of the Christian visible-Church after the pattern of a convention [i.e. all gathering unto one place] most unfit, yea impossible for attaining the intended end, to wit, edification, especially not being compelled thereunto by an extrinsical necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, p. 428</span></figcaption>

</figure><figure class="quote" id="q-8e97531428" data-kw="">
<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law: 1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people. 2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law. 3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, vol. 2, p. 108, section 40, ‘Of the law of paying tithes,’ on Heb. 7:5-7 Gouge (d. 1653) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-abbe9fdc5b" data-kw="">
<blockquote><p>First, in that they [the Anglican ministers of Old England, arguing for set, stinted forms of prayer, as in the English Prayer Book] do confound, and make all one ordinance, Blessings, Psalms, and Prayers. … And first, it is evident, that, howsoever some kind of blessing, and prayer be all one, and so may be confounded, yet that solemn kind of blessing spoken of Num. 6, and which the patriarchs, and priests did use in their places, was clean of an other nature: In prayer the minister stands in place of the people and in their name offers up petitions and thanksgiving to God: But in blessing, the minister stands in the place of God, and in his name pronounceth a blessing, or mercy, upon the people. 2. Whereas this duty of prayer may be performed by one equal to another, by an inferior to a superior, yea by a man to himself: that other of blessing is always from the greater to the lesser: and therefore the apostle to the Hebrews, to show that the Preisthood of Melchisedek was more excellent than that of Levi, proves it by this, that Melchisedec blessed Abraham; taking this for granted without all contradiction, that the less is blessed of the greater. 3. Mr. Bernard himself in this book makes prayer one thing, and the blessing pronounced upon the people when they departed another thing: as he also makes singing of psalms a third distinct thing from them both: as there is cause he should.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Justification of Separation from the Church of England Against Mr. Richard Bernard his Invective, entitled, The Separatists Schism</cite>, (Amsterdam, 1610), pp. 466-67</span></figcaption>

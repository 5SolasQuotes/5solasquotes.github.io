<blockquote><p>How wrongly most of the Scholastic authors have thought concerning original sin can be obscure to no one who is moderately versed in their books. Nor have they recently imbibed this error of opinion, but they have retained it as drawn from ancient times and masters. For Lombard, who has held the first place in the school for now five hundred years, testifies that certain theologians before him taught that original sin is nothing but the guilt of punishment for the sin of the first man, by which his posterity are liable and subject to temporal and eternal punishment for the actual sin of Adam, so that it is neither a fault nor a punishment (Lombard, dist. 30, ch. 5). And although he not obscurely signifies that so insane an opinion is displeasing to him, he was nevertheless unable to persuade his disciples from being devolved into the same or a greater absurdity of opinion. For Scotus did not fear to affirm that after any sin whatsoever has been committed, nothing remains in us except the guilt of punishment (Scotus, in 2, d. 34, q. 1, art. 2). And Biel, a blind man, follows this blind man (Biel in 2, d. 30, q. 1). But if nothing inhered in Adam after the fall except the guilt of punishment, certainly not a fault, but a bare guilt, passed to his posterity by propagation. Durandus also makes original sin nothing other than mere guilt, when he disputes that Adam’s will is considered ours in no other way than because Adam, by sinning voluntarily, brought destruction and the privation of original justice upon us all; wherefore he denies that this sin ought to be called a fault (Durandus, in 2, d. 30, q. 2). William, Bishop of Paris, also taught this, when he proceeded so far as to defend that this natural vice is worthy of no punishment (Wilhelmus Paris, De vitiis et peccat.). Ockham professes that he would have gone into that opinion which posits that original sin is nothing but divine non-acceptance on account of some preceding demerit in another, if he were not prohibited by the authorities of certain fathers, which seemed to him to say that original fault is the lack of justice that ought to be present (Occamus, in 2, q. 14). Thus for this man, original sin would be only the non-acceptance of God on account of Adam’s offense, if he did not wish to seem to depart from the diverse opinion of the saints. Are these men ever to be thought to have even dreamed of the contagion and magnitude of original sin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin… against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin</cite>, p. 1</span></figcaption>

<blockquote><p>The mode of giving supernatural grace to nature is, Junius stated, infusion, a term that is strikingly redolent of Aquinas’s conception of the mode of communicating grace.” (Seung J. Lee, Orders of Nature &amp; Grace, p. 60) Gale: “That supernatural good and virtue comes from God by divine infusion is generally asserted and demonstrated by the sectators of Augustin and Aquinas.” (4.496) . No Proper Habitual vs. Actual Grace Distinction On Maresius and Thomas: “Supernatural habits, by contrast [with natural habits], are stirred into action by the Holy Spirit, who dwells in the recipients of habitual grace (Maresius 1646-48, 2:143). Maresius disagrees with some Roman Catholic theologians, who suggest that people imbued with habitual grace require an additional gift of ‘actual grace’ before habitual grace bears fruit. For Maresius, the Spirit’s powerful presence is quite sufficient. As a result, Maresius is suspicious of the distinction between habitual and actual grace—a distinction, he notes, which is not found in Aquinas. That said, if by ‘actual grace’ is meant simply the Spirit’s activity in exciting supernatural habits into action, Maresius does not object, although he prefers the term ‘moving grace’ (Maresius 1646-48, 2:144). And since the Holy Spirit dwells with believers permanently, he argues that moving grace is also permanently present as to the principle of its motion, even if it is not permanently active.” (Stephen Hampton in Oxford Handbook of Early Modern Theology, p. 236) . Deification Thomas: “Now the gift of grace surpasses every capability of created nature, since it is nothing short of a partaking of the Divine Nature, which exceeds every other nature. And thus it is impossible that any creature should cause grace. For it is as necessary that God alone should deify [deificet], bestowing a partaking of the Divine Nature by a participated likeness, as it is impossible that anything save fire should enkindle.</p></blockquote>

</figure><figure class="quote" id="q-7565f8e859" data-kw="">
<blockquote><p>If there is Anything, the Uncausable is Susbtance [see pp. 56-68 of the Summary] . 48. If something accidental exists, something substantial exists. Proof: An accident depends essentially on its substrate. This dependence is of the same order as that which is found between formal cause and material cause. For substance is as it were the matter of accidents. Hence for any accident that actually exists there is required the simultaneous existence of another being, namely that in which the accident is. If this other is not something substantial but on the contrary an accident, then some third being is required. But there cannot be a regress to infinity, both because there would be at the same time an infinite number and because dependence in any essential order ends in some independent being in the same order. Hence every effect demands an ultimate being that is not an effect; a thing in matter requires eventually a being not in matter, namely prime matter. Likewise a being in another or to which existing in another belongs, involves a being not in another, or to which existing in itself belongs. If you object that some accident, namely quantity, can exist in itself, that is, supernaturally, the objection is not valid; for even in this case God, as first efficient cause, would be making up for the natural, material, secondary causality of the substance. And so, even on this supposition, at least one substance would exist, namely God himself. 49. If there is anything, substance exists. If there is anything, it is either accident or substance. But if it is accident, substance too exists (from conclusion 48). Therefore in either case, if there is anything, there is substance. 50. Being is divided into substance and accident. The existence of accidents must be proved from experience. And on this point one must note that, on the evidence of experience, many things exist that are not only beings but beings in another, as color, shape etc. It does not matter whether these are formally objective or subjective, for in either case they are real modifications of something. One must say the same about our internal acts, as thoughts, affections, volitions; for we experience these beings as empirical modifications of the ‘ego’. — From the fact of actual accident follows the fact of actual substance (from conclusion 48). Thus both accident and substance exist; therefore being is divided into substance and accident. About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. 51. If something is altogether independent, it must be substance and not accident. Hence the uncausable, for instance, is substance. This conclusion is sufficiently clear from what was said above in proof of conclusion 48. … Proof of God … 11. God’s knowledge is really the same as the divine essence. Plain both from the physical simplicity of God and from the infinite perfection of the divine essence, which is perfectible neither accidentally nor substantially (conclusion 2). [A difference between the divine essence and its knowledge would be a difference between substance and accident.] … 15… Corollary: On a Personal God We show, against those who conceive God to be an impersonal cosmic force, that God is a rational being and hence personal. For a personal God is here understood as a rational supposit, that is, a singular substance simply complete, in its own right, and endowed with reason. God’s simply complete substantiality and singularity, and being in his own right, follow from our principal argument. In the present chapter God’s rationality is proved. Hence everything requisite for a personal being is verified of God. … 29. Every being is good, or being and good convert. … Further, creatures are also good for other creatures; for example, substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If there is Anything, the Uncausable is Susbtance [see pp. 56-68 of the Summary] . 48. If something accidental exists, something substantial exists. Proof: An accident depends essentially on its substrate. This dependence is of the same order as that which is found between formal cause and material cause. For substance is as it were the matter of accidents. Hence for any accident that actually exists there is required the simultaneous existence of another being, namely that in which the accident is. If this other is not something substantial but on the contrary an accident, then some third being is required. But there cannot be a regress to infinity, both because there would be at the same time an infinite number and because dependence in any essential order ends in some independent being in the same order. Hence every effect demands an ultimate being that is not an effect; a thing in matter requires eventually a being not in matter, namely prime matter. Likewise a being in another or to which existing in another belongs, involves a being not in another, or to which existing in itself belongs. If you object that some accident, namely quantity, can exist in itself, that is, supernaturally, the objection is not valid; for even in this case God, as first efficient cause, would be making up for the natural, material, secondary causality of the substance. And so, even on this supposition, at least one substance would exist, namely God himself. 49. If there is anything, substance exists. If there is anything, it is either accident or substance. But if it is accident, substance too exists (from conclusion 48). Therefore in either case, if there is anything, there is substance. 50. Being is divided into substance and accident. The existence of accidents must be proved from experience. And on this point one must note that, on the evidence of experience, many things exist that are not only beings but beings in another, as color, shape etc. It does not matter whether these are formally objective or subjective, for in either case they are real modifications of something. One must say the same about our internal acts, as thoughts, affections, volitions; for we experience these beings as empirical modifications of the ‘ego’. — From the fact of actual accident follows the fact of actual substance (from conclusion 48). Thus both accident and substance exist; therefore being is divided into substance and accident. About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. 51. If something is altogether independent, it must be substance and not accident. Hence the uncausable, for instance, is substance. This conclusion is sufficiently clear from what was said above in proof of conclusion 48. … Proof of God … 11. God’s knowledge is really the same as the divine essence. Plain both from the physical simplicity of God and from the infinite perfection of the divine essence, which is perfectible neither accidentally nor substantially (conclusion 2). [A difference between the divine essence and its knowledge would be a difference between substance and accident.] … 15… Corollary: On a Personal God We show, against those who conceive God to be an impersonal cosmic force, that God is a rational being and hence personal. For a personal God is here understood as a rational supposit, that is, a singular substance simply complete, in its own right, and endowed with reason. God’s simply complete substantiality and singularity, and being in his own right, follow from our principal argument. In the present chapter God’s rationality is proved. Hence everything requisite for a personal being is verified of God. … 29. Every being is good, or being and good convert. … Further, creatures are also good for other creatures; for example, substance upholds accidents, accidents give further perfection to substance, etc.”

+accident.+The+existence+of+accidents+must+be+proved+from+experience.+And+on+this+point+one+must+note+that%2C+on+the+evidence+of+experience%2C+many+things+exist+that+are+not+only+beings+but+beings+in+another%2C+as+color%2C+shape+etc.+It+does+not+matter+whether+these+are+formally+objective+or+subjective%2C+for+in+either+case+they+are+real+modifications+of+something.+One+must+say+the+same+about+our+internal+acts%2C+as+thoughts%2C+affections%2C+volitions%3B+for+we+experience+these+beings+as+empirical+modifications+of+the+%E2%80%98ego%E2%80%99.+%E2%80%94+From+the+fact+of+actual+accident+follows+the+fact+of+actual+substance+%28from+conclusion+48%29.+Thus+both+accident+and+substance+exist%3B+therefore+being+is+divided+into+substance+and+accident.+About+knowledge+of+the+formal+idea+of+accident+one+must+note+that+%E2%80%98in+another%E2%80%99+or+%E2%80%98in-anotherness%E2%80%99+is+correlative%2C+for+it+involves+something+in+which+it+is.+But+to+perceive+some+relation%2C+there+is+need+of+knowledge+of+the+terms+of+the+relation+in+themselves.+Our+first+knowledge+of+reality%2C+therefore%2C+seems+to+be+knowledge+of+things+as+absolute+objects+and+not+in+their+relation+to+other+beings.+But+when+we+say+that+accidents+are+immediately+experienced+as+beings+in+another+the+sense+is%3A+this+knowledge+is+not+by+way+of+reasoning+out+but%2C+from+phenomenological+analysis+of+the+givens+of+experience%2C+we+perceive+through+simple+apprehension+this+relation+of+%E2%80%98in-anotherness%E2%80%99.+Shape%2C+for+instance%2C+is+not+only+perceived+in+itself+and+as+something+absolute+but+also+in+its+relation+to+extension+and+color%2C+namely+as+the+limit+of+a+colored+expanse.+But+in+other+cases+it+seems+we+do+not+immediately+perceive+the+idea+of+%E2%80%98in-anotherness%E2%80%99%2C+but+rather+we+infer+it+by+reasoning+out.+This+happens%2C+for+example%2C+with+quantity.+No+wonder+then+that+some%2C+as+Descartes%2C+identified+extension+with+material+substance+as+such.+51.+If+something+is+altogether+independent%2C+it+must+be+substance+and+not+accident.+Hence+the+uncausable%2C+for+instance%2C+is+substance.+This+conclusion+is+sufficiently+clear+from+what+was+said+above+in+proof+of+conclusion+48.+%E2%80%A6+Proof+of+God+%E2%80%A6+11.+God%E2%80%99s+knowledge+is+really+the+same+as+the+divine+essence.+Plain+both+from+the+physical+simplicity+of+God+and+from+the+infinite+perfection+of+the+divine+essence%2C+which+is+perfectible+neither+accidentally+nor+substantially+%28conclusion+2%29.+%5BA+difference+between+the+divine+essence+and+its+knowledge+would+be+a+difference+between+substance+and+accident.%5D+%E2%80%A6+15%E2%80%A6+Corollary%3A+On+a+Personal+God+We+show%2C+against+those+who+conceive+God+to+be+an+impersonal+cosmic+force%2C+that+God+is+a+rational+being+and+hence+personal.+For+a+personal+God+is+here+understood+as+a+rational+supposit%2C+that+is%2C+a+singular+substance+simply+complete%2C+in+its+own+right%2C+and+endowed+with+reason.+God%E2%80%99s+simply+complete+substantiality+and+singularity%2C+and+being+in+his+own+right%2C+follow+from+our+principal+argument.+In+the+present+chapter+God%E2%80%99s+rationality+is+proved.+Hence+everything+requisite+for+a+personal+being+is+verified+of+God.+%E2%80%A6+29.+Every+being+is+good%2C+or+being+and+good+convert.+%E2%80%A6+Further%2C+creatures+are+also+good+for+other+creatures%3B+for+example%2C+substance+upholds+accidents%2C+accidents+give+further+perfection+to+substance%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7565f8e859.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7565f8e859.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=If%20there%20is%20Anything%2C%20the%20Uncausable,give%20further%20perfection%20to%20substance

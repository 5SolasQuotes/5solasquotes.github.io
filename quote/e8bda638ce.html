<main class="wrap"><figure class="quote" id="q-e8bda638ce" data-kw="">
<blockquote><p>And, therefore, I take it for granted, that obedience is required under the Covenant of Grace as strictly as ever it was under the Covenant of Works; and required, not only to show our gratitude and thankfulness, but necessarily and indispensably in order to the obtaining of heaven and eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 209 of The Doctrine of the Two Covenants in Works (Philadelphia, 1863) vol. 2 (d. 1690)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation: Negatum Est</cite>, [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-868d1869e5" data-kw="">
<blockquote><p>When the doctrine of the Reformers began to be abused by the Antinomians, the Puritans were raised up, in the good providence of God, to give the same prominence to Sanctification as Luther had given to Justification; to insist as as strenuously on the the work of the Spirit in applying salvation as he had done on the work of Christ in procuring it: for though both doctrines were taught at an earlier period… it was reserved for their successors, when controversy arose, to expound them more fully in their necessary connection and mutual relations. Such writers as Owen, and Goodwin, and Charnock, and Howe, and Trail adhered firmly to the doctrine of Justification as proclaimed by Luther and Calvin, while they checked every tendency to Antinomian licence by the firm assertion of the indispensable necessity of personal holiness as one of the essential parts of the great salvation… Considered as fruits of our sanctification, and as evidences of our ‘MEETNESS for the inheritance of the saints in light,’ they cannot be too highly commended; but considered as the ground of our Justification, or as forming any part of our TITLE to that inheritance, they are to be utterly rejected, and treated as ‘dung’ and ‘filthy rags’ with reference to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture.(Edinburgh: T&amp;T Clark</cite>, (Grand Rapids: Baker, 1955), pp. 363-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-12ba2291d7" data-kw="">
<blockquote><p>…you must know therefore that righteousness is no proper real being, but a modus entis, ‘the modification of a being’. The subject of it is: 1. an action, 2. or a person. An action is the primary subject, and so the disposition; and the person secondary, as being therefore righteous, because his disposition and actions are so. Righteousness is the conformity of dispositions and actions, and consequently the person to the rule prescribed. It is not a being distinct therefore from the dispositions and actions, but their just and well being. This [de]finition is only of the creatures’ righteousness. God is the Primum Iustum, and so the rule of righteousness to the creature, and has no rule but Himself for the measuring of his actions. Yet his essence is too far above us, remote and unknown to be this rule to the creature, therefore has He given us his laws, which flow from his perfection, and they are the immediate rule of our dispositions and actions and so of our righteousness. Here carefully observe, that this law has two parts: 1. The precept and prohibition prescribing and requiring duty: 2. The promise and commination [threatening] determining of the reward of obedience, and penalty of disobedience. As the precept is the principal part, and the penalty annexed but for the precept’s sake; so the primary intent of the lawgiver is the obeying of his precepts, and our suffering of the penalty is but a secondary for the attaining of the former. So is there accordingly a two-fold Righteousness or fulfilling of this law, (which is the thing I would have observed): the primary, most excellent and most proper Righteousness lies in the conformity of our actions to the precept: The secondary, less excellent righteousness) yet fitly enough so called) (see Pemble, Of Justification, p. 2) is, when though we have broke the precepts, yet we have satisfied for our breach, either by our own suffering, or some other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 16, pp. 62-64</span></figcaption>

</figure><figure class="quote" id="q-24a4706bdb" data-kw="">
<blockquote><p>From this come three periods of justification that should be diligently observed here, namely 1: The period of establishment, by which man is first justified: in this occasion not only is efficacy of works excluded for acquiring justification, but so is the very presence of these works in so far as God justifies the sinner and the wicked. 2: The period of continuation: in this occasion, although no efficacy of good works is granted for justification, the presence of these same works, nevertheless, is required. And it is probably in this sense that James denies that we are justified by faith along but he requires works in addition. And lastly 3: The period of consummation in which the right unto eternal life, granted under the first period and continued under the second, is advanced even to the possession of eternal life: in this occasion not only is the presence of good works required, but also, in a certain sense, their efficacy, in so far as God, whose law we attain just now through the merit alone of Christ, does not want to grant possession of eternal life, unless [it is] beyond faith with good works previously performed. We received once before the right unto eternal life through the merit of Christ alone. But God does not want to grant possession of eternal life, unless there are, next to faith, also good works which precede this possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As given in Mark Jones, Antinomianism: Reformed Theology’s Unwelcome Guest</cite>, (P&amp;R, 2013)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“From this come three periods of justification that should be diligently observed here, namely 1: The period of establishment, by which man is first justified: in this occasion not only is efficacy of works excluded for acquiring justification, but so is the very presence of these works in so far as God justifies the sinner and the wicked. 2: The period of continuation: in this occasion, although no efficacy of good works is granted for justification, the presence of these same works, nevertheless, is required. And it is probably in this sense that James denies that we are justified by faith along but he requires works in addition. And lastly 3: The period of consummation in which the right unto eternal life, granted under the first period and continued under the second, is advanced even to the possession of eternal life: in this occasion not only is the presence of good works required, but also, in a certain sense, their efficacy, in so far as God, whose law we attain just now through the merit alone of Christ, does not want to grant possession of eternal life, unless [it is] beyond faith with good works previously performed. We received once before the right unto eternal life through the merit of Christ alone. But God does not want to grant possession of eternal life, unless there are, next to faith, also good works which precede this possession.”

— Petrus van Mastricht, As given in Mark Jones, Antinomianism: Reformed Theology’s Unwelcome Guest (P&amp;R, 2013)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+this+come+three+periods+of+justification+that+should+be+diligently+observed+here%2C+namely+1%3A+The+period+of+establishment%2C+by+which+man+is+first+justified%3A+in+this+occasion+not+only+is+efficacy+of+works+excluded+for+acquiring+justification%2C+but+so+is+the+very+presence+of+these+works+in+so+far+as+God+justifies+the+sinner+and+the+wicked.+2%3A+The+period+of+continuation%3A+in+this+occasion%2C+although+no+efficacy+of+good+works+is+granted+for+justification%2C+the+presence+of+these+same+works%2C+nevertheless%2C+is+required.+And+it+is+probably+in+this+sense+that+James+denies+that+we+are+justified+by+faith+along+but+he+requires+works+in+addition.+And+lastly+3%3A+The+period+of+consummation+in+which+the+right+unto+eternal+life%2C+granted+under+the+first+period+and+continued+under+the+second%2C+is+advanced+even+to+the+possession+of+eternal+life%3A+in+this+occasion+not+only+is+the+presence+of+good+works+required%2C+but+also%2C+in+a+certain+sense%2C+their+efficacy%2C+in+so+far+as+God%2C+whose+law+we+attain+just+now+through+the+merit+alone+of+Christ%2C+does+not+want+to+grant+possession+of+eternal+life%2C+unless+%5Bit+is%5D+beyond+faith+with+good+works+previously+performed.+We+received+once+before+the+right+unto+eternal+life+through+the+merit+of+Christ+alone.+But+God+does+not+want+to+grant+possession+of+eternal+life%2C+unless+there+are%2C+next+to+faith%2C+also+good+works+which+precede+this+possession.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+As+given+in+Mark+Jones%2C+Antinomianism%3A+Reformed+Theology%E2%80%99s+Unwelcome+Guest+%28P%26R%2C+2013%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F24a4706bdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/24a4706bdb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=From%20this%20come%20three%20periods%20of,good%20works%20which%20precede%20this%20possession&amp;text=From%20this%20come%20three%20periods%20of%20justification%20that&amp;text=faith%2C%20also%20good%20works%20which%20precede%20this%20possession" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

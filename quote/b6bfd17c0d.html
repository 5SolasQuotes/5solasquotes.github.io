<main class="wrap"><figure class="quote" id="q-b6bfd17c0d" data-kw="">
<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts: 1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added. 2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast. 3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-efc6740ffe" data-kw="">
<blockquote><p>This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Reconciliation, or Christ’s Trumpet of Peace to the World</cite>, (d. 1646; 1657; Soli Deo Gloria, 1997), ch. 74, The Fourteenth Argument, pp. 316-17</span></figcaption>

<blockquote><p>[Ex. 20:5] ‘And showing mercy unto thousands of them that love Me and keep my commandments.’ God’s justice reaches unto the third and fourth generation, but his mercy to the thousand[th] generation; and hence we may gather that God inclines more to mercy than to justice, and therefore when He punishes He is said, facere opus non suum, Isa. 28:21, that He may do his strange work, that is to punish.</p></blockquote>

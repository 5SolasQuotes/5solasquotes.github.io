<blockquote><p>On that day we are to rest both from those worldly employments of our particular callings which on other days are our duty, and the work of the day, and from those sports and recreations which on other days are lawful, as the entertainment of our spare hours, and the preparatives for our busy ones; from both we are to rest on the Lord’s Day: for certainly carnal pleasure is as great an enemy to spiritual joy as the sorrow of the world is, and sport is as inconsistent with the Sabbath rest as labour is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath: A Serious Address to those that Profane the Lord’s Day</cite>, (1713; Grand Rapids MI: Torwood Press, 2013), p. 7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a2f105d7d" data-kw="">
<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>

<blockquote><p>The worship of God is either natural or instituted. Natural worship is that which in specie, and immediately, is founded in the nature of God and the nature of man, and God’s relation to man, and man’s relation to God. And it is twofold, either that which is naturally necessary, or that which is naturally laudable. That which is naturally necessary, is indispensable and unchangeable. That which is naturally laudable must be used whensoever conveniently it may. There is natural worship due to God, both as the Creator of man and as the Redeemer of fallen man. As God is our Creator, He is our absolute Owner and Ruler, and Benefactor; and as such, He is to be acknowledged by us with all due observance. And whatsoever acts of observance towards God we are upon this ground immediately obliged unto, they are natural worship due to God as our Creator. All natural worship due to God as Creator is discernable by natural revelation, or the Book of Nature. In Nature entire it was clearly and completely thereby discernible; but in Nature fallen, more dimly and defectively; yet not for want of objective evidence, but for the indisposition of our faculty. Likewise to God our Redeemer, there is a worship due from us, naturally and immediately arising from our redemption, and our relation to God therein founded. And it is (our redemption being supposed) no more of God’s arbitrary institution than that worship which is founded in the Law of our Creation and primitive State. To the knowledge of this sort of natural worship, we come by means of that divine revelation by which we come to the knowledge of our redeemed state. But the knowledge of our redeemed state being supposed, natural reason will show that such and such acts of observance in specie are naturally and indispensably due to God our Redeemer.</p></blockquote>

e+of+our+redeemed+state+being+supposed%2C+natural+reason+will+show+that+such+and+such+acts+of+observance+in+specie+are+naturally+and+indispensably+due+to+God+our+Redeemer.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+%C2%A75.+%E2%80%98Divine+worship+distinguished+into+Natural+%26+Instituted.+And+first%2C+of+Natural+Worship%E2%80%99+in+The+Remains%2C+%E2%80%A6+%28d.+1680%3B+London%3A+Parkhurst%2C+1684%29%2C+%E2%80%98Of+Divine+Worship%E2%80%99%2C+pt.+1%2C+pp.+174-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66d8ababe8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66d8ababe8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=The%20worship%20of%20God%20is%20either,indispensably%20due%20to%20God%20our%20Redeemer&amp;text=The%20worship%20of%20God%20is%20either%20natural%20or&amp;text=naturally%20and%20indispensably%20due%20to%20God%20our%20Redeemer" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6b751f3b63" data-kw="">
<blockquote><p>As for the recreations, which are here said to serve lawfully to the refreshing of our spirits, this appellation [by an opponent] is very ambiguous; neither do I know any difference between the recreating of our spirits and the refreshing of our spirits: yet here the refreshing of our spirits is made the end of recreation. Again it were good to distinguish between recreation of the body, and recreation of the mind. I think the refreshing of spirits pertains to the recreation of the body; men’s spirits are natural and material things, and they are apt to be wasted first naturally… and spirits thus wasted are recreated, that is, repaired by eating and drinking. And thus provisions of victual are commonly called recreats. 2. Secondly they are wasted also by labour voluntarily undertaken, and these are repaired, as by the former way, so by rest also. And each way we are allowed to recreate our spirits on the Lord’s Day… But now adays many courses are called recreations, wherein there is found little rest; and the natural spirits of man are rather wasted, and his nature tired; far more than the one is repaired, or the other eased. And when all comes to all, I doubt the issue will be to style the pleasures of our senses by the cleanly name of recreations. Now the Jews were expressely forbidden to find their own pleasure on the Lord’s holy day, Isa. 58:13, yet were they not forbidden all pleasure, that belonged only to such a sabbath as was a fast; and therein indeed hypocrites are taxed for finding pleasure on that day, Isa. 58:3. But the weekly Sabbath was for pleasure and delight, but not for man’s own pleasure, nor for the doing of their own ways. But to delight in the Lord, which is spiritual pleasure, and the recreating of our souls in the Lord: this is a blessed rest, thus to rest unto Him; and the Word of God is the best food of the soul; No recreates like unto God’s holy ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as still in Force to Bind Christians… (London, 1641) | The Doctrine of the Sabbath Considered, section 8, p. 242</span></figcaption>

</figure><figure class="quote" id="q-0181e0f60e" data-kw="invocation of saints refuted memory not worship">
<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>

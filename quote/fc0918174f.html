<main class="wrap"><figure class="quote" id="q-fc0918174f" data-kw="">
<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)… 3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery… 4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), question 16, pp. 64-65</span></figcaption>

<blockquote><p>2. Calvin thinks their vow not lawful. Bucanus, Polyander and Willet think it the lawful vow of the Nazarites, commanded [in] Num. 6. What then? if by God’s Law of the Nazarites, they abstained from wine and the Passover? God is above his own Law… 3. How prove ye, they abstained from the Passover? being so divine a law, might not their vow suffer an exception for a greater law in eating the Passover? I think it might, for in case of necessity they [the Rechabites] came and dwelt at Jerusalem for fear of the army of the Chaldeans, Jer. 35:11, and yet their vow was to dwell in tents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, p. 203</span></figcaption>

</figure><figure class="quote" id="q-3424d4181f" data-kw="">
<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach… nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>

</figure><figure class="quote" id="q-ff3b9cf688" data-kw="">
<blockquote><p>What compelled people may do to redeem their lives, with loss of liberty, is nothing to the point… and that they may sell the liberty of their posterity, not yet born, is utterly denied as unlawful; yea, a violentated father to me is a father, and not a father, and the posterity may vindicate their own liberty given away unjustly before they were born, Qua omne regnum vi partum potest vi dissolvi.</p></blockquote>

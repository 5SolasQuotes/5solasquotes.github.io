<main class="wrap"><figure class="quote" id="q-3a5b0c6743" data-kw="">
<blockquote><p>If God be Jehovah, the supreme Lord, then it condemns the blasphemous papists, who speak after this manner, &#x27;Our Lord God the Pope.&#x27; Is it a wonder the pope lifts his triple crown above the head of kings and emperors, when he usurps God&#x27;s title, &quot;shewing himself that he is God?&quot; 2 Thess. 2:4.</p></blockquote>
<figcaption>— <a href="../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, p. 29</figcaption>
<div class="meta"><span class="t">Names of God</span><span class="t">Rome: The Papacy</span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Letter to Pope Leo X</cite>, p. 2</figcaption>

</figure><figure class="quote" id="q-a519a9ff77" data-kw="">

</figure><figure class="quote" id="q-c93bf87ff0" data-kw="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>
<figcaption>— <a href="../authors/louis-berkhof.html">Louis Berkhof</a>, <cite>Systematic Theology</cite>, Part Five, The Doctrine of the Church, ch. III (Government of the Church)</figcaption>
<div class="meta"><span class="t">Church&#x27;s Authority and Power</span><span class="t">Sufficiency</span></div>

<blockquote><p>[On Rom. 4:25, which speaks of justification:] Since we are born in sins, and are able to do nothing of ourselves but offend God, we cannot be restored unless there be some one to make satisfaction for our sins, and also to breathe into us the Spirit of justice: both for these Christ has thoroughly accomplished… Let us always think… that, in the death of Christ, our sins have been expiated by his blood; in his resurrection, whereby He has entered on a heavenly life, and now lives to God… let us recognize that we are called to a life new and well-pleasing to God, and that He Himself will bestow that upon us.</p></blockquote>

<blockquote><p>The observation is that a complete and full absolution from all sin is not enjoyed till the day of judgement. The believers have not a full discharge till then: we are in this life continually subject to new sins, and so to new guilt, whereby arise new fears, so that the soul has not a full rest from all, till that final absolution be pronounced at the Day of Judgment. Before we show the grounds whereby it may appear that the remission of our sins is not fully completed till then: we must lay down some propositions by way of a grand work. First, The Scripture not only in this privilege of remission of our sin, but in others also, makes the complement and fullness of them to be at the Day of Judgment. Redemption is the total sum, as it were, of all our mercies, and we are partakers of it in this life, Col. 1:14; Rom. 3:24. Yet the Scripture calls the Day of Judgment, when we shall rise out of our graves in a peculiar and eminent manner, the day of redemption, Eph. 1:7; 4:30, because at that day will be the utmost and last effects of our redemption. Adoption, that also is a privilege we receive in this life; yea a learned man (Forbes in his book where he handles the order of God’s graces) makes adoption (as I take it) to be the first, and to go before justification; yet the apostle, Rom. 8:23, calls the last day, the day of adoption. Hence 1 Jn. 3.2, the apostle, though he says, ‘We are now the sons of God,’ yet he says ‘it doth not appear what we shall be,’ because the glory God at the Last Day will put upon us is so far transcendent and superlative to what now we are. Thus Mt. 19.28, the last day is also called the day of regeneration unto the people of God; yet in this life they partake of that grace, but because then is the full perfection and manifestation of it, therefore the Scripture calls it the day of regeneration. Even as the apostle, Acts 13:33, applies that passage of the psalm to Christ’s resurrection, ‘This day have I begotten thee,’ because then was such a solemn and public declaration that he was the Son of God. No marvel then, if the Scripture do also call the day of judgment a time when sins shall be blotted out, because then is the public absolution of the godly; and according to philosophy motions receive their names from the term to which they tend. Secondly, howsoever justification be said to consist in pardon of sin, yet there is a great difference between the one and the other; for justification, besides the pardon of sin, does connote a state that the subject is put into, viz. a state of favour, being reconciled with God. Hence it is, that this state cannot be reiterated often, no more than a wife after that first entrance into the relation is frequently made a wife. In this sense, the Scripture always speaks of it, as connoting a state or condition the subject is put into, as well as a peculiar privilege vouchsafed to such. It is true, there are indeed learned men, who think justification may be reiterated, as you heard, Peter Martyr and [Martin] Bucer. Others call it a continued action, as conservation. But although there is a continuance of justification, and the godly are preserved in that estate, yet we cannot say God does renew justification daily, as He does pardon of sin. There are some that think the Scripture gives a ground for a second justification, or the continuing and increasing of it, and bring those places, Tit. 3:5-7; Rev. 22:11. The learned and excellent interpreter Ludovicus de Dieu, in ch. 8 of the Romans, verse 4, largely pleads for a twofold justification; the first he makes to be the imputing of Christ’s righteousness to us, received by faith, which is altogether perfect, and is the cause of pardon of sins: the second he makes an effect of the former, whereby through the grace of God regenerating, we are conformable unto that law in part, and are day by day more and more justified, and shall be fully so when perfection comes: of which justification he says these texts speak, Jm. 2:21, 24; Rev. 22:11; Mt. 11:37; 1 Kn. 8:32. This twofold justification he makes to differ toto coelo [by a whole heaven] from the Papists, whose first is founded upon the merit of congruity, the second upon the merit of condignity. But the discussing of this will be more proper in the other part, viz. of imputed righteousness. Augustine seems to hold justification [to be] a frequent and continued act, bk. 2, Contra Julian, ch. 8. When we are heard in that prayer (‘Forgive us our sins’) we need (says he) such a remission daily, what progress soever we have made in our second justification. He speaks also of a justification hujus vitae [of this life], which he calls the lesser; and another plenam and perfect, full and perfect, which belongs to the state of glory, Tract 4 on John, Book on the Spirit &amp; the Letter, last chapter. But the more exact handling of this will be in the place above-mentioned. It seems more consonant to Scripture if we say that justification is a state we were once put into which is not repeated over and over as often as sin is forgiven; neither can it admit of increase or decrease, so that a man should be more or less justified; for even David while he was in that state of suspension, was not less justified, though the effects of justification were less upon him. It is true, in some sense learned men say justification may increase, viz. extensive, not intensive, as they express it, by way of extension, when more sins are pardoned, not intensively in its own nature. Even as the soul of a man in its information of the body admits of no increase intensively, but it does extensively, the more the parts of the body grow, the further does its information extend. But of these things more in their proper place. Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’. Fourthly, although pardon of sin be completed at that great day, yet this is not to be understood as if God’s pardon of any sin were imperfect, and something of sin did still remain to be done away. No, those expressions of forgiveness of sin in the Scripture denote such a full and plenary pardon that a sin cannot be more remitted than it is. But because we commit new sins daily, and so need pardon daily, therefore it is that we are not completely pardoned till then. As also because the perfect pardon we have here shall then solemnly and publicly be declared to all the world. These things thus premised, I come to show the grounds or particulars wherein our pardon of sin is thus completed. And first, in our sense and feeling: for howsoever God pardon a sin perfectly, yet our faith which receives it is weak. This jewel is taken with a trembling and shaking hand. Hence it is that we have not full faith and confidence in our spirits. We may see this in David; though Nathan told him his sins were forgiven him, yet his faith was not so vigorous and powerful as wholly to apply this to his own soul, and therefore he had much anguish and trouble of heart afterwards. But now, at the last day, all these fears, diffidence and darkness will be quite removed out of our hearts. There shall be no more disturbance in our souls than there can be corruption in the highest heavens; we shall then have such a gourd as no worm can devour. Our souls shall not then know the meaning of sitting in darkness, and wanting God’s favour. There will then be no complaints, ‘Why has the Lord forsaken me?’ Well may God’s children be called upon to lift up their heads, when such a redemption draws nigh; and well may that day be called the times of refreshment, seeing the people of God are so often scorched with the fiery darts of Satan. Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished and not so much as any scars remain, the wound will be so fully healed. Although God does fully pardon sin, yet the effects of this are delayed; many chastisements and sad afflictions are to be undergone: howsoever, death itself, and the corruption in the grave must seize upon justified persons; now these are the fruit of sin, and howsoever the sting of these be taken away, yet they are not wholly conquered till that Last Day. Then therefore may we justly say, sin is pardoned, when there shall be no more grave, no more death, no more corruption, but all shall be swallowed up in immortality and glory. Thirdly, then, and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be. Here in this life, because the root of corruption abides in us, there are daily pullulant [sprouting] branches of sins, and so frequent guilt is contracted; whereby as we have daily sores, so we need daily plasters. It is with original corruption in us, as in that tree in Dan. 4:14-15; although the branches be cut off, yet the stump is still in the earth, and that sprouts out too fast by the temptations that are always by it. Hence it is that we always pray, ‘Forgive us our sins;’ and because of these failings the apostle, 2 Cor. 5:20, writes to, and exhorts the godly Corinthians, who were already reconciled to God, to be further reconciled to Him. But then this petition shall wholly cease; then there will be no serpent to sting us, nor will the eye of justifying faith to look upon the brazen serpent exalted be necessary any more. The Lord will not only wipe away the tear of worldly grief, but also of godly sorrow at that time. Then, and not till then, will it be true, that God sees no sin in his children. Then will the Church be without wrinkles, or any spot within her. In this respect it is, the Church of God prays so earnestly for the Bridegroom’s coming. For this it is they look for and hasten in their prayers that day. Fourthly, at that day will pardon of sin only be completed, if you consider the nature of justification. For what is that, but an overcoming the accusing adversary, and clearing of us against every charge? Now this is most eminently and fully done in those last assizes. The Syriac word to justify is also to conquer and overcome, because when a man is justified, he overcomes all those bills and indictments which were brought in against him; now this is manifestly done in the Day of Judgment, when God shall before men and angels acquit and absolve his people: and if the apostle say in this life, Rom. 6:7, of a godly man dead in Christ, he is justified from his sins, in respect of sanctification, that sin does not conquer him, but he sin, how much more will this be true at that day, when all the guilt and filth of sin shall be totally removed? Oh what a glorious conquest will that be over sin, hell, and the devil, when the Judge of the whole world shall pronounce them free from all sin, and command them to enter into his glorious rest!</p></blockquote>

of which justification he says these texts speak, Jm. 2:21, 24; Rev. 22:11; Mt. 11:37; 1 Kn. 8:32. This twofold justification he makes to differ toto coelo [by a whole heaven] from the Papists, whose first is founded upon the merit of congruity, the second upon the merit of condignity. But the discussing of this will be more proper in the other part, viz. of imputed righteousness. Augustine seems to hold justification [to be] a frequent and continued act, bk. 2, Contra Julian, ch. 8. When we are heard in that prayer (‘Forgive us our sins’) we need (says he) such a remission daily, what progress soever we have made in our second justification. He speaks also of a justification hujus vitae [of this life], which he calls the lesser; and another plenam and perfect, full and perfect, which belongs to the state of glory, Tract 4 on John, Book on the Spirit &amp; the Letter, last chapter. But the more exact handling of this will be in the place above-mentioned. It seems more consonant to Scripture if we say that justification is a state we were once put into which is not repeated over and over as often as sin is forgiven; neither can it admit of increase or decrease, so that a man should be more or less justified; for even David while he was in that state of suspension, was not less justified, though the effects of justification were less upon him. It is true, in some sense learned men say justification may increase, viz. extensive, not intensive, as they express it, by way of extension, when more sins are pardoned, not intensively in its own nature. Even as the soul of a man in its information of the body admits of no increase intensively, but it does extensively, the more the parts of the body grow, the further does its information extend. But of these things more in their proper place. Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’. Fourthly, although pardon of sin be completed at that great day, yet this is not to be understood as if God’s pardon of any sin were imperfect, and something of sin did still remain to be done away. No, those expressions of forgiveness of sin in the Scripture denote such a full and plenary pardon that a sin cannot be more remitted than it is. But because we commit new sins daily, and so need pardon daily, therefore it is that we are not completely pardoned till then. As also because the perfect pardon we have here shall then solemnly and publicly be declared to all the world. These things thus premised, I come to show the grounds or particulars wherein our pardon of sin is thus completed. And first, in our sense and feeling: for howsoever God pardon a sin perfectly, yet our faith which receives it is weak. This jewel is taken with a trembling and shaking hand. Hence it is that we have not full faith and confidence in our spirits. We may see this in David; though Nathan told him his sins were forgiven him, yet his faith was not so vigorous and powerful as wholly to apply this to his own soul, and therefore he had much anguish and trouble of heart afterwards. But now, at the last day, all these fears, diffidence and darkness will be quite removed out of our hearts. There shall be no more disturbance in our souls than there can be corruption in the highest heavens; we shall then have such a gourd as no worm can devour. Our souls shall not then know the meaning of sitting in darkness, and wanting God’s favour. There will then be no complaints, ‘Why has the Lord forsaken me?’ Well may God’s children be called upon to lift up their heads, when such a redemption draws nigh; and well may that day be called the times of refreshment, seeing the people of God are so often scorched with the fiery darts of Satan. Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished and not so much as any scars remain, the wound will be so fully healed. Although God does fully pardon sin, yet the effects of this are delayed; many chastisements and sad afflictions are to be undergone: howsoever, death itself, and the corruption in the grave must seize upon justified persons; now these are the fruit of sin, and howsoever the sting of these be taken away, yet they are not wholly conquered till that Last Day. Then therefore may we justly say, sin is pardoned, when there shall be no more grave, no more death, no more corruption, but all shall be swallowed up in immortality and glory. Thirdly, then, and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be. Here in this life, because the root of corruption abides in us, there are daily pullulant [sprouting] branches of sins, and so frequent guilt is contracted; whereby as we have daily sores, so we need daily plasters. It is with original corruption in us, as in that tree in Dan. 4:14-15; although the branches be cut off, yet the stump is still in the earth, and that sprouts out too fast by the temptations that are always by it. Hence it is that we always pray, ‘Forgive us our sins;’ and because of these failings the apostle, 2 Cor. 5:20, writes to, and exhorts the godly Corinthians, who were already reconciled to God, to be further reconciled to Him. But then this petition shall wholly cease; then there will be no serpent to sting us, nor will the eye of justifying faith to look upon the brazen serpent exalted be necessary any more. The Lord will not only wipe away the tear of worldly grief, but also of godly sorrow at that time. Then, and not till then, will it be true, that God sees no sin in his children. Then will the Church be without wrinkles, or any spot within her. In this respect it is, the Church of God prays so earnestly for the Bridegroom’s coming. For this it is they look for and hasten in their prayers that day. Fourthly, at that day will pardon of sin only be completed, if you consider the nature of justification. For what is that, but an overcoming the accusing adversary, and clearing of us against every charge? Now this is most eminently and fully done in those last assizes. The Syriac word to justify is also to conquer and overcome, because when a man is justified, he overcomes all those bills and indictments which were brought in against him; now this is manifestly done in the Day of Judgment, when God shall before men and angels acquit and absolve his people: and if the apostle say in this life, Rom. 6:7, of a godly man dead in Christ, he is justified from his sins, in respect of sanctification, that sin does not conquer him, but he sin, how much more will this be true at that day, when all the guilt and filth of sin shall be totally removed? Oh what a glorious conquest will that be over sin, hell, and the devil, when the Judge of the whole world shall pronounce them free from all sin, and command them to enter into his glorious rest!”

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures (London: Miller, 1651), pt. 1, Lecture 29, on Acts 3:19, pp. 256-58">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+observation+is+that+a+complete+and+full+absolution+from+all+sin+is+not+enjoyed+till+the+day+of+judgement.+The+believers+have+not+a+full+discharge+till+then%3A+we+are+in+this+life+continually+subject+to+new+sins%2C+and+so+to+new+guilt%2C+whereby+arise+new+fears%2C+so+that+the+soul+has+not+a+full+rest+from+all%2C+till+that+final+absolution+be+pronounced+at+the+Day+of+Judgment.+Before+we+show+the+grounds+whereby+it+may+appear+that+the+remission+of+our+sins+is+not+fully+completed+till+then%3A+we+must+lay+down+some+propositions+by+way+of+a+grand+work.+First%2C+The+Scripture+not+only+in+this+privilege+of+remission+of+our+sin%2C+but+in+others+also%2C+makes+the+complement+and+fullness+of+them+to+be+at+the+Day+of+Judgment.+Redemption+is+the+total+sum%2C+as+it+were%2C+of+all+our+mercies%2C+and+we+are+partakers+of+it+in+this+life%2C+Col.+1%3A14%3B+Rom.+3%3A24.+Yet+the+Scripture+calls+the+Day+of+Judgment%2C+when+we+shall+rise+out+of+our+graves+in+a+peculiar+and+eminent+manner%2C+the+day+of+redemption%2C+Eph.+1%3A7%3B+4%3A30%2C+because+at+that+day+will+be+the+utmost+and+last+effects+of+our+redemption.+Adoption%2C+that+also+is+a+privilege+we+receive+in+this+life%3B+yea+a+learned+man+%28Forbes+in+his+book+where+he+handles+the+order+of+God%E2%80%99s+graces%29+makes+adoption+%28as+I+take+it%29+to+be+the+first%2C+and+to+go+before+justification%3B+yet+the+apostle%2C+Rom.+8%3A23%2C+calls+the+last+day%2C+the+day+of+adoption.+Hence+1+Jn.+3.2%2C+the+apostle%2C+though+he+says%2C+%E2%80%98We+are+now+the+sons+of+God%2C%E2%80%99+yet+he+says+%E2%80%98it+doth+not+appear+what+we+shall+be%2C%E2%80%99+because+the+glory+God+at+the+Last+Day+will+put+upon+us+is+so+far+transcendent+and+superlative+to+what+now+we+are.+Thus+Mt.+19.28%2C+the+last+day+is+also+called+the+day+of+regeneration+unto+the+people+of+God%3B+yet+in+this+life+they+partake+of+that+grace%2C+but+because+then+is+the+full+perfection+and+manifestation+of+it%2C+therefore+the+Scripture+calls+it+the+day+of+regeneration.+Even+as+the+apostle%2C+Acts+13%3A33%2C+applies+that+passage+of+the+psalm+to+Christ%E2%80%99s+resurrection%2C+%E2%80%98This+day+have+I+begotten+thee%2C%E2%80%99+because+then+was+such+a+solemn+and+public+declaration+that+he+was+the+Son+of+God.+No+marvel+then%2C+if+the+Scripture+do+also+call+the+day+of+judgment+a+time+when+sins+shall+be+blotted+out%2C+because+then+is+the+public+absolution+of+the+godly%3B+and+according+to+philosophy+motions+receive+their+names+from+the+term+to+which+they+tend.+Secondly%2C+howsoever+justification+be+said+to+consist+in+pardon+of+sin%2C+yet+there+is+a+great+difference+between+the+one+and+the+other%3B+for+justification%2C+besides+the+pardon+of+sin%2C+does+connote+a+state+that+the+subject+is+put+into%2C+viz.+a+state+of+favour%2C+being+reconciled+with+God.+Hence+it+is%2C+that+this+state+cannot+be+reiterated+often%2C+no+more+than+a+wife+after+that+first+entrance+into+the+relation+is+frequently+made+a+wife.+In+this+sense%2C+the+Scripture+always+speaks+of+it%2C+as+connoting+a+state+or+condition+the+subject+is+put+into%2C+as+well+as+a+peculiar+privilege+vouchsafed+to+such.+It+is+true%2C+there+are+indeed+learned+men%2C+who+think+justification+may+be+reiterated%2C+as+you+heard%2C+Peter+Martyr+and+%5BMartin%5D+Bucer.+Others+call+it+a+continued+action%2C+as+conservation.+But+although+there+is+a+continuance+of+justification%2C+and+the+godly+are+preserved+in+that+estate%2C+yet+we+cannot+say+God+does+renew+justification+daily%2C+as+He+does+pardon+of+sin.+There+are+some+that+think+the+Scripture+gives+a+ground+for+a+second+justification%2C+or+the+continuing+and+increasing+of+it%2C+and+bring+those+places%2C+Tit.+3%3A5-7%3B+Rev.+22%3A11.+The+learned+and+excellent+interpreter+Ludovicus+de+Dieu%2C+in+ch.+8+of+the+Romans%2C+verse+4%2C+largely+pleads+for+a+twofold+justification%3B+the+first+he+makes+to+be+the+imputing+of+Christ%E2%80%99s+righteousness+to+us%2C+received+by+faith%2C+which+is+altogether+perfect%2C+and+is+the+cause+of+pardon+of+sins%3A+the+second+he+makes+an+effect+of+the+former%2C+whereby+through+the+grace+of+God+regenerating%2C+we+are+conformable+unto+that+law+in+part%2C+and+are+day+by+day+more+and+more+justified%2C+and+shall+be+fully+so+when+perfection+comes%3A+of+which+justification+he+says+these+texts+speak%2C+Jm.+2%3A21%2C+24%3B+Rev.+22%3A11%3B+Mt.+11%3A37%3B+1+Kn.+8%3A32.+This+twofold+justification+he+makes+to+differ+toto+coelo+%5Bby+a+whole+heaven%5D+from+the+Papists%2C+whose+first+is+founded+upon+the+merit+of+congruity%2C+the+second+upon+the+merit+of+condignity.+But+the+discussing+of+this+will+be+more+proper+in+the+other+part%2C+viz.+of+imputed+righteousness.+Augustine+seems+to+hold+justification+%5Bto+be%5D+a+frequent+and+continued+act%2C+bk.+2%2C+Contra+Julian%2C+ch.+8.+When+we+are+heard+in+that+prayer+%28%E2%80%98Forgive+us+our+sins%E2%80%99%29+we+need+%28says+he%29+such+a+remission+daily%2C+what+progress+soever+we+have+made+in+our+second+justification.+He+speaks+also+of+a+justification+hujus+vitae+%5Bof+this+life%5D%2C+which+he+calls+the+lesser%3B+and+another+plenam+and+perfect%2C+full+and+perfect%2C+which+belongs+to+the+state+of+glory%2C+Tract+4+on+John%2C+Book+on+the+Spirit+%26+the+Letter%2C+last+chapter.+But+the+more+exact+handling+of+this+will+be+in+the+place+above-mentioned.+It+seems+more+consonant+to+Scripture+if+we+say+that+justification+is+a+state+we+were+once+put+into+which+is+not+repeated+over+and+over+as+often+as+sin+is+forgiven%3B+neither+can+it+admit+of+increase+or+decrease%2C+so+that+a+man+should+be+more+or+less+justified%3B+for+even+David+while+he+was+in+that+state+of+suspension%2C+was+not+less+justified%2C+though+the+effects+of+justification+were+less+upon+him.+It+is+true%2C+in+some+sense+learned+men+say+justification+may+increase%2C+viz.+extensive%2C+not+intensive%2C+as+they+express+it%2C+by+way+of+extension%2C+when+more+sins+are+pardoned%2C+not+intensively+in+its+own+nature.+Even+as+the+soul+of+a+man+in+its+information+of+the+body+admits+of+no+increase+intensively%2C+but+it+does+extensively%2C+the+more+the+parts+of+the+body+grow%2C+the+further+does+its+information+extend.+But+of+these+things+more+in+their+proper+place.+Thirdly%2C+howsoever+an+absolution+shall+be+completed+at+the+Day+of+Judgment%2C+yet+our+justification+shall+not+abide+in+such+a+way+as+it+is+in+this+life.+Now+our+justification+is+by+pardon+of+sin%2C+and+a+righteousness+without+us+imputed+to+us%2C+which+is+instrumentally+applied+by+faith%3B+but+this+way+shall+then+cease%2C+for+having+perfect+righteousness+inherent+in+ourselves%2C+we+shall+need+no+covering.+It+is+true%2C+the+glory+and+honour+of+all+this+will+redound+upon+Christ%2C+and+He+shall+not+be+the+less+glorified+because+He+has+then+brought+us+to+the+full+end+of+all+his+sufferings.+I+know+some+may+doubt+whether+any+righteousness+but+that+which+is+infinite+can+please+God%2C+and+therefore%2C+as+some+think%2C+the+angels+were+accepted+of+God+through+Christ%2C+though+perfect%3B+so+it+may+be+of+the+saints+in+heaven.+But+I+see+no+ground+for+this.+This+seems+to+be+undoubted%2C+that+the+way+of+justification+by+faith+in+Christ+arises+because+of+our+imperfection+and+sinfulness+remaining+in+us%2C+and+therefore+is+justificatio+viae%2C+not+patriae%E2%80%94%E2%80%99a+justification%E2%80%99+of+us+%E2%80%98in+our+way%2C%E2%80%99+not+when+we+come+to+%E2%80%98our+home%E2%80%99.+Fourthly%2C+although+pardon+of+sin+be+completed+at+that+great+day%2C+yet+this+is+not+to+be+understood+as+if+God%E2%80%99s+pardon+of+any+sin+were+imperfect%2C+and+something+of+sin+did+still+remain+to+be+done+away.+No%2C+those+expressions+of+forgiveness+of+sin+in+the+Scripture+denote+such+a+full+and+plenary+pardon+that+a+sin+cannot+be+more+remitted+than+it+is.+But+because+we+commit+new+sins+daily%2C+and+so+need+pardon+daily%2C+therefore+it+is+that+we+are+not+completely+pardoned+till+then.+As+also+because+the+perfect+pardon+we+have+here+shall+then+solemnly+and+publicly+be+declared+to+all+the+world.+These+things+thus+premised%2C+I+come+to+show+the+grounds+or+particulars+wherein+our+pardon+of+sin+is+thus+completed.+And+first%2C+in+our+sense+and+feeling%3A+for+howsoever+God+pardon+a+sin+perfectly%2C+yet+our+faith+which+receives+it+is+weak.+This+jewel+is+taken+with+a+trembling+and+shaking+hand.+Hence+it+is+that+we+have+not+full+faith+and+confidence+in+our+spirits.+We+may+see+this+in+David%3B+though+Nathan+told+him+his+sins+were+forgiven+him%2C+yet+his+faith+was+not+so+vigorous+and+powerful+as+wholly+to+apply+this+to+his+own+soul%2C+and+therefore+he+had+much+anguish+and+trouble+of+heart+afterwards.+But+now%2C+at+the+last+day%2C+all+these+fears%2C+diffidence+and+darkness+will+be+quite+removed+out+of+our+hearts.+There+shall+be+no+more+disturbance+in+our+souls+than+there+can+be+corruption+in+the+highest+heavens%3B+we+shall+then+have+such+a+gourd+as+no+worm+can+devour.+Our+souls+shall+not+then+know+the+meaning+of+sitting+in+darkness%2C+and+wanting+God%E2%80%99s+favour.+There+will+then+be+no+complaints%2C+%E2%80%98Why+has+the+Lord+forsaken+me%3F%E2%80%99+Well+may+God%E2%80%99s+children+be+called+upon+to+lift+up+their+heads%2C+when+such+a+redemption+draws+nigh%3B+and+well+may+that+day+be+called+the+times+of+refreshment%2C+seeing+the+people+of+God+are+so+often+scorched+with+the+fiery+darts+of+Satan.+Secondly%2C+pardon+of+sin+will+at+that+day+be+perfected.+Because+all+the+effects+of+pardon+will+then+be+accomplished+and+not+so+much+as+any+scars+remain%2C+the+wound+will+be+so+fully+healed.+Although+God+does+fully+pardon+sin%2C+yet+the+effects+of+this+are+delayed%3B+many+chastisements+and+sad+afflictions+are+to+be+undergone%3A+howsoever%2C+death+itself%2C+and+the+corruption+in+the+grave+must+seize+upon+justified+persons%3B+now+these+are+the+fruit+of+sin%2C+and+howsoever+the+sting+of+these+be+taken+away%2C+yet+they+are+not+wholly+conquered+till+that+Last+Day.+Then+therefore+may+we+justly+say%2C+sin+is+pardoned%2C+when+there+shall+be+no+more+grave%2C+no+more+death%2C+no+more+corruption%2C+but+all+shall+be+swallowed+up+in+immortality+and+glory.+Thirdly%2C+then%2C+and+not+till+then+may+we+say+remission+of+sins+will+be+completed%2C+because+then+shall+no+more+iteration+of+pardon+be.+Here+in+this+life%2C+because+the+root+of+corruption+abides+in+us%2C+there+are+daily+pullulant+%5Bsprouting%5D+branches+of+sins%2C+and+so+frequent+guilt+is+contracted%3B+whereby+as+we+have+daily+sores%2C+so+we+need+daily+plasters.+It+is+with+original+corruption+in+us%2C+as+in+that+tree+in+Dan.+4%3A14-15%3B+although+the+branches+be+cut+off%2C+yet+the+stump+is+still+in+the+earth%2C+and+that+sprouts+out+too+fast+by+the+temptations+that+are+always+by+it.+Hence+it+is+that+we+always+pray%2C+%E2%80%98Forgive+us+our+sins%3B%E2%80%99+and+because+of+these+failings+the+apostle%2C+2+Cor.+5%3A20%2C+writes+to%2C+and+exhorts+the+godly+Corinthians%2C+who+were+already+reconciled+to+God%2C+to+be+further+reconciled+to+Him.+But+then+this+petition+shall+wholly+cease%3B+then+there+will+be+no+serpent+to+sting+us%2C+nor+will+the+eye+of+justifying+faith+to+look+upon+the+brazen+serpent+exalted+be+necessary+any+more.+The+Lord+will+not+only+wipe+away+the+tear+of+worldly+grief%2C+but+also+of+godly+sorrow+at+that+time.+Then%2C+and+not+till+then%2C+will+it+be+true%2C+that+God+sees+no+sin+in+his+children.+Then+will+the+Church+be+without+wrinkles%2C+or+any+spot+within+her.+In+this+respect+it+is%2C+the+Church+of+God+prays+so+earnestly+for+the+Bridegroom%E2%80%99s+coming.+For+this+it+is+they+look+for+and+hasten+in+their+prayers+that+day.+Fourthly%2C+at+that+day+will+pardon+of+sin+only+be+completed%2C+if+you+consider+the+nature+of+justification.+For+what+is+that%2C+but+an+overcoming+the+accusing+adversary%2C+and+clearing+of+us+against+every+charge%3F+Now+this+is+most+eminently+and+fully+done+in+those+last+assizes.+The+Syriac+word+to+justify+is+also+to+conquer+and+overcome%2C+because+when+a+man+is+justified%2C+he+overcomes+all+those+bills+and+indictments+which+were+brought+in+against+him%3B+now+this+is+manifestly+done+in+the+Day+of+Judgment%2C+when+God+shall+before+men+and+angels+acquit+and+absolve+his+people%3A+and+if+the+apostle+say+in+this+life%2C+Rom.+6%3A7%2C+of+a+godly+man+dead+in+Christ%2C+he+is+justified+from+his+sins%2C+in+respect+of+sanctification%2C+that+sin+does+not+conquer+him%2C+but+he+sin%2C+how+much+more+will+this+be+true+at+that+day%2C+when+all+the+guilt+and+filth+of+sin+shall+be+totally+removed%3F+Oh+what+a+glorious+conquest+will+that+be+over+sin%2C+hell%2C+and+the+devil%2C+when+the+Judge+of+the+whole+world+shall+pronounce+them+free+from+all+sin%2C+and+command+them+to+enter+into+his+glorious+rest%21%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures+%28London%3A+Miller%2C+1651%29%2C+pt.+1%2C+Lecture+29%2C+on+Acts+3%3A19%2C+pp.+256-58&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2afbcaad5c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2afbcaad5c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=The%20observation%20is%20that%20a%20complete,to%20enter%20into%20his%20glorious%20rest&amp;text=The%20observation%20is%20that%20a%20complete%20and%20full&amp;text=command%20them%20to%20enter%20into%20his%20glorious%20rest" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. How many ways does God justify? Four ways especially: (1) By way of Constitution. (2) Estimation. (3) Sentence, and (4) Execution. 1. Constitutively, by his Gospel-grant, or the New Covenant in the blood of Christ. The Covenant of grace is God’s pardoning act, and instrument by which we know whom, and upon what Terms God will pardon and justify; namely, all such as repent and believe the Gospel. We are constituted just and righteous, and exempted from the curse and penalties of the law. We may know the true way of justification by its opposition to the false or pretended way, Acts 13:38-39: ‘Through this man is preached unto you the forgiveness of sins; and by Him all that believe are justified from all those things from which they could not be justified by the law of Moses.’ The Jews expected to be justified by the law of Moses; but we are justified by the law of Christ, that is, this constitutes our right; and herein justification and sanctification differ: God sanctifies by his Spirit, but justifies by the sentence of his word, or promise of the Gospel. Our right immediately results thence, as by an act of indemnity we are freed from all the penalties which otherwise we might incur without any further act of the magistrate. We are constituted righteous by his deed of gift in the Gospel, but made holy by his Spirit; but if any quarrel at this term, and say that God by the New Covenant does declare who are justifiable, but does not justify, I answer further, we are justified: 2. By way of Estimation, whereby God does determine our right, accept or deem, and account them righteous, who fulfil the terms of the Gospel, and actually convey to them the fruits of Christ’s death: This is spoken of, 1 Cor. 6:11, ‘And such were some of you: but ye are washed, but ye are sanctified, but ye are justified;’ once vile sinners, now washed, sanctified and justified: as soon as they believe, they are put into a state of acceptation [Greek], that is, justifying, He continues to justify them unto the death, and He keeps them in that estate wherein they have exemption from the punishment of sin and a right to eternal life. 3. By way of Sentence. This is in part done here, when God interprets our righteousness and sincerity, Job 33:23-24: ‘If there be a messenger with him, an interpreter, one among a thousand, to show unto man his uprightness; then he is gracious unto him, and says, Deliver him from going down to the pit; I have found a ransom.’ And does by the Spirit of adoption assure us more and more of the pardon of our sins: but more solemnly at the Last Day, when the Judge does, sitting upon the throne, pronounce and declare us righteous before all the world, and as those who are accepted unto life, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord.’ Then the sentence is solemnly pronounced by the Judge sitting on the throne; and we are justified before God, men and angels. There are two parts of judgment, to condemn, and to absolve or justify: Mt. 12:36-37: ‘But I say unto you that for every idle word that a man shall speak, he shall give account thereof at the Day of Judgment; for by thy words thou shalt be justified, and by thy words thou shalt be condemned;’ then every man’s doom [verdict] shall be pronounced. 4. By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness. 3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christ’s blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate is by good works, or new obedience. I say, our first actual pardon, justification and right to life is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17, and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience. Let us consider them severally: 1. The first moving cause that inclined God to shew us mercy, in our undone and lost estate, was meerly his grace… 2. We are justified by the blood of Christ… 3. We are justified by faith, Acts 13:39, ‘And by him all that believe are justified from all things from which ye could not be justified by the law of Moses’: certainly none are justified in a state of impenitency and unbelief; ’tis not enough to look to the first moving cause, the grace of God, or the impetration of it by the blood of Christ, but how it is applied to ourselves and what right we have. For the righteousness of Christ is none of ours, till we do repent and believe: let us see how our title does arise, when we thankfully, seriously and broken-heartedly accept Christ as our Lord and Savior, then we are found in Him not having our own righteousness. 4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’ But yet a little more must be said to reconcile the two apostles. Paul says, ‘A man is justified by faith, without the deeds of the law,’ Rom. 3:28, and James says, ch. 2:24, ‘Ye see then how by works a man is justified, and not by faith only.’ There is a twofold charge commenced against us, [1] as sinners, and breakers of the Law; [2] as hypocrites and unsound believers. To the first we have nothing but the merits of Christ to plead; to the second, a fruitful obedience; or else, Paul in the opposition between works and faith, means by works, legal observances; by faith true Christianity [inclusive of it working]. The Jews boasted of their legal observances, to the rejection of the faith of Christ; and James by faith, [meant] a dead faith; and by works, [he meant] Christian duties, or acts of obedience to God; not external observances of the law of man.</p></blockquote>

fruits+of+Christ%E2%80%99s+death%3A+This+is+spoken+of%2C+1+Cor.+6%3A11%2C+%E2%80%98And+such+were+some+of+you%3A+but+ye+are+washed%2C+but+ye+are+sanctified%2C+but+ye+are+justified%3B%E2%80%99+once+vile+sinners%2C+now+washed%2C+sanctified+and+justified%3A+as+soon+as+they+believe%2C+they+are+put+into+a+state+of+acceptation+%5BGreek%5D%2C+that+is%2C+justifying%2C+He+continues+to+justify+them+unto+the+death%2C+and+He+keeps+them+in+that+estate+wherein+they+have+exemption+from+the+punishment+of+sin+and+a+right+to+eternal+life.+3.+By+way+of+Sentence.+This+is+in+part+done+here%2C+when+God+interprets+our+righteousness+and+sincerity%2C+Job+33%3A23-24%3A+%E2%80%98If+there+be+a+messenger+with+him%2C+an+interpreter%2C+one+among+a+thousand%2C+to+show+unto+man+his+uprightness%3B+then+he+is+gracious+unto+him%2C+and+says%2C+Deliver+him+from+going+down+to+the+pit%3B+I+have+found+a+ransom.%E2%80%99+And+does+by+the+Spirit+of+adoption+assure+us+more+and+more+of+the+pardon+of+our+sins%3A+but+more+solemnly+at+the+Last+Day%2C+when+the+Judge+does%2C+sitting+upon+the+throne%2C+pronounce+and+declare+us+righteous+before+all+the+world%2C+and+as+those+who+are+accepted+unto+life%2C+Acts+3%3A19%2C+%E2%80%98That+your+sins+may+be+blotted+out%2C+when+the+times+of+refreshing+shall+come+from+the+presence+of+the+Lord.%E2%80%99+Then+the+sentence+is+solemnly+pronounced+by+the+Judge+sitting+on+the+throne%3B+and+we+are+justified+before+God%2C+men+and+angels.+There+are+two+parts+of+judgment%2C+to+condemn%2C+and+to+absolve+or+justify%3A+Mt.+12%3A36-37%3A+%E2%80%98But+I+say+unto+you+that+for+every+idle+word+that+a+man+shall+speak%2C+he+shall+give+account+thereof+at+the+Day+of+Judgment%3B+for+by+thy+words+thou+shalt+be+justified%2C+and+by+thy+words+thou+shalt+be+condemned%3B%E2%80%99+then+every+man%E2%80%99s+doom+%5Bverdict%5D+shall+be+pronounced.+4.+By+way+of+Execution%2C+when+the+sentence+is+executed.+This+is+in+part+done+here%2C+as+God+takes+off+the+penalties+and+fruits+of+sin%2C+either+in+the+way+of+his+internal+or+external+government%2C+and+gives+us+many+blessings%2C+as+the+pledge+of+his+love%2C+and+above+all%2C+the+gift+of+the+Holy+Spirit%2C+whereby+He+sanctifies+us+more+thoroughly%2C+and+works+in+us+that+which+is+pleasing+in+his+sight%3A+This+He+gives+as+the+God+of+peace%2C+as+reconciled+to+us+in+Christ%2C+Heb.+13%3A20-21%3A+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+Covenant%2C+make+you+perfect+in+every+good+work%2C+to+do+his+will%2C+working+in+you+that+which+is+pleasing+in+his+sight%2C+through+Jesus+Christ.%E2%80%99+1+Thess.+5%3A23%3A+%E2%80%98And+the+very+God+of+peace+sanctify+you+wholly%3A+and+I+pray+God+your+whole+spirit%2C+and+soul%2C+and+body%2C+be+preserved+blameless+unto+the+coming+of+our+Lord+Jesus+Christ%3B%E2%80%99+Faithful+is+he+that+calls+you%2C+who+will+do+it%3A+but+more+fully+at+the+Last+Day%2C+when+we+enter+into+everlasting+glory%3B+and+the+wicked+are+turned+into+Hell+with+the+Devil+and+his+angels%2C+Mt.+25%3A46%2C+%E2%80%98And+these+shall+go+into+everlasting+punishment%3B+but+the+righteous+into+life+eternal%E2%80%99%3A+then+is+the+full+and+final+execution%2C+a+perfect+freedom+from+all+misery%2C+and+a+possession+of+all+happiness.+3.+How+it+can+stand+with+the+wisdom%2C+justice+and+holiness+of+God+to+justify+a+sinner%3F+%E2%80%98Tis+a+great+crime+to+take+the+unrighteous+to+be+righteous%3B+and+to+pronounce+the+wicked+justified%2C+seems+to+be+against+the+Word+of+God%2C+Prov.+24%3A24%2C+%E2%80%98He+that+saith+unto+the+wicked%2C+%E2%80%98Thou+art+righteous%2C%E2%80%99+him+shall+the+people+curse%3B+nations+shall+abhor+him.%E2%80%99+Prov.+17%3A15%2C+%E2%80%98He+that+justifieth+the+wicked%2C+and+he+that+condemneth+the+just%2C+even+they+both+are+an+abomination+unto+the+Lord.%E2%80%99+Now+what+is+an+abomination+unto+the+Lord+is+surely+contrary+to+his+nature%2C+Ex.+34%3A7%2C+%E2%80%98He+will+by+no+means+clear+the+guilty.%E2%80%99+Answer%3A+%E2%80%A6+3.+Effectual+calling%2C+or+the+conversion+of+man%2C+reconciles+it+with+his+holiness%3B+for+a+sinner%2C+as+a+sinner%2C+is+not+justified%2C+but+a+penitent+believer+%5Bis%5D%3A+%E2%80%99tis+true+%E2%80%99tis+said%2C+%E2%80%98God+justifieth+the+ungodly%2C%E2%80%99+Rom.+4%3A5%3A+those+that+were+once+so%2C+but+not+those+that+continue+so%3B+certainly+He+sanctifies+before+he+justifies%2C+Acts+26%3A18%3A+%E2%80%98To+open+their+eyes%2C+and+turn+them+from+darkness+to+light%2C+and+from+the+power+of+Satan+to+God%2C+that+they+may+receive+forgiveness+of+sins%2C+and+inheritance+among+them+that+are+sanctified%2C+by+faith+that+is+in+Me%3B%E2%80%99+and+in+many+other+places.+No+man+is+freed+from+the+guilt+of+sin%2C+which+renders+us+obnoxious+to+God%E2%80%99s+wrath%2C+who+is+not+freed+from+the+filth+of+sin%2C+which+taints+our+faculties%3B+for+Christ+is+made+to+us+both+righteousness+and+sanctification%2C+1+Cor.+1%3A30.+By+losing+God%E2%80%99s+image%2C+we+lost+his+favor%3B+and+in+the+order+wherein+we+lost+it%2C+we+recover+it.+God+regenerates+that+He+may+pardon+and+justify%2C+and+restores+first+our+holiness+and+then+our+happiness%3A+%E2%80%99tis+not+consistent+with+God%E2%80%99s+holiness+to+give+us+pardon+and+let+us+alone+in+our+sins.+A+man+would+not+put+a+toad+in+his+bosom.+But+more+fully+to+give+you+a+prospect+into+this+matter%2C+let+us+take+notice+of+the+several+things+which+are+mentioned+in+Scripture%2C+as+belonging+to+our+justification%3A+as+for+instance%3A+Sometimes+we+are+said+to+be+justified+by+grace%2C+as+Rom.+3%3A24%2C+%E2%80%98Being+justified+freely+by+his+grace%E2%80%99%3A+sometimes+by+the+blood+of+Christ%2C+as+Rom.+5%3A9%2C+%E2%80%98Being+justified+by+his+blood%2C+we+shall+be+saved+from+wrath+through+Him%E2%80%99%3A+sometimes+by+faith%2C+as+Rom.+5%3A1%2C+%E2%80%98Being+justified+by+faith%2C+we+have+peace+with+God+through+our+Lord+Jesus+Christ%E2%80%99%3A+sometimes+by+works%2C+James+2%3A24%2C+%E2%80%98Ye+see+then+how+that+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+All+these+things+concur+to+our+justification+and+do+not+contradict%2C+but+imply+one+another%3A+The+first+moving+cause+of+all+is+grace%3B+the+meritorious+cause%2C+is+Christ%E2%80%99s+blood%3A+the+means+of+applying%2C+or+the+condition+on+our+part+upon+which+we+are+capable+at+first+of+receiving+so+great+a+privilege%2C+is+faith%3A+and+the+means+of+continuing+in+our+justified+estate+is+by+good+works%2C+or+new+obedience.+I+say%2C+our+first+actual+pardon%2C+justification+and+right+to+life+is+given+upon+condition+of+our+first+faith+and+repentance%3B+but+this+estate+is+continued+to+us+both+by+faith%2C+Rom.+1%3A17%2C+and+new+obedience%3B+these+fairly+accord.+The+grace+of+God+will+do+nothing+without+the+intervention+of+Christ%E2%80%99s+merits%3B+and+Christ%E2%80%99s+merits+do+not+profit+us+%E2%80%99till+it+be+applied+by+faith%3B+and+sound+believers+will+live+in+a+course+of+new+obedience.+Let+us+consider+them+severally%3A+1.+The+first+moving+cause+that+inclined+God+to+shew+us+mercy%2C+in+our+undone+and+lost+estate%2C+was+meerly+his+grace%E2%80%A6+2.+We+are+justified+by+the+blood+of+Christ%E2%80%A6+3.+We+are+justified+by+faith%2C+Acts+13%3A39%2C+%E2%80%98And+by+him+all+that+believe+are+justified+from+all+things+from+which+ye+could+not+be+justified+by+the+law+of+Moses%E2%80%99%3A+certainly+none+are+justified+in+a+state+of+impenitency+and+unbelief%3B+%E2%80%99tis+not+enough+to+look+to+the+first+moving+cause%2C+the+grace+of+God%2C+or+the+impetration+of+it+by+the+blood+of+Christ%2C+but+how+it+is+applied+to+ourselves+and+what+right+we+have.+For+the+righteousness+of+Christ+is+none+of+ours%2C+till+we+do+repent+and+believe%3A+let+us+see+how+our+title+does+arise%2C+when+we+thankfully%2C+seriously+and+broken-heartedly+accept+Christ+as+our+Lord+and+Savior%2C+then+we+are+found+in+Him+not+having+our+own+righteousness.+4.+We+are+justified+by+works%2C+and+not+by+faith+only%3B+by+which+are+meant+the+fruits+of+sanctification%3A+for+true+faith+and+true+holiness+will+show+itself+by+good+works%3B+faith+gives+us+the+first+right%2C+but+works+continue+it%2C+for+otherwise+a+course+of+sin+would+put+us+into+a+state+of+damnation+again%3A+therefore+at+the+Last+Judgment+these+are+considered%2C+Rev.+20%3A12%2C+%E2%80%98And+the+dead+were+judged+out+of+those+things+which+were+written+in+the+books%2C+according+to+their+works.%E2%80%99+Mt.+25%3A35-36%3A+%E2%80%98For+I+was+an+hungry%2C+and+ye+gave+me+meat%3B+I+was+thirsty%2C+and+ye+gave+me+drink%3B+I+was+a+stranger%2C+and+ye+took+me+in%3B+naked%2C+and+ye+cloathed+me%3B+I+was+sick%2C+and+ye+visited+me%3B+I+was+in+prison%2C+and+ye+came+unto+me.%E2%80%99+Faith+is+our+consent%2C+but+obedience+verifies+it%2C+or+is+our+performance+of+what+we+consented+unto%3B+the+one+as+covenant-making%2C+the+other+as+covenant-keeping%3B+we+are+admitted+by+covenant-making%2C+but+continued+in+our+privileges+by+covenant-keeping%2C+Ps.+25%3A10%2C+%E2%80%98All+the+paths+of+the+Lord+are+mercy+and+truth+unto+such+as+keep+his+Covenant.%E2%80%99+But+yet+a+little+more+must+be+said+to+reconcile+the+two+apostles.+Paul+says%2C+%E2%80%98A+man+is+justified+by+faith%2C+without+the+deeds+of+the+law%2C%E2%80%99+Rom.+3%3A28%2C+and+James+says%2C+ch.+2%3A24%2C+%E2%80%98Ye+see+then+how+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+There+is+a+twofold+charge+commenced+against+us%2C+%5B1%5D+as+sinners%2C+and+breakers+of+the+Law%3B+%5B2%5D+as+hypocrites+and+unsound+believers.+To+the+first+we+have+nothing+but+the+merits+of+Christ+to+plead%3B+to+the+second%2C+a+fruitful+obedience%3B+or+else%2C+Paul+in+the+opposition+between+works+and+faith%2C+means+by+works%2C+legal+observances%3B+by+faith+true+Christianity+%5Binclusive+of+it+working%5D.+The+Jews+boasted+of+their+legal+observances%2C+to+the+rejection+of+the+faith+of+Christ%3B+and+James+by+faith%2C+%5Bmeant%5D+a+dead+faith%3B+and+by+works%2C+%5Bhe+meant%5D+Christian+duties%2C+or+acts+of+obedience+to+God%3B+not+external+observances+of+the+law+of+man.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29+%7C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+pp.+333-36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8ef50a25e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8ef50a25e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=2.%20How%20many%20ways%20does%20God,observances%20of%20the%20law%20of%20man&amp;text=2.%20How%20many%20ways%20does%20God%20justify%3F%20Four&amp;text=not%20external%20observances%20of%20the%20law%20of%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

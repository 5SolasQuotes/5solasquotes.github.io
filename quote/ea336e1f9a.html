<main class="wrap"><figure class="quote" id="q-ea336e1f9a" data-kw="pass by wrath for sin">
<blockquote><p>The rest of mankind, God was pleased, according to the unsearchable counsel of his own will, whereby he extendeth or withholdeth mercy as he pleaseth, for the glory of his sovereign power over his creatures, to pass by and to ordain them to dishonor and wrath for their sin, to the praise of his glorious justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Points of Calvinism</cite>, ch. on Election (citing WCF 3.7)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/condemnation.html">Condemnation</a> › <a href="../topics/reprobation/condemnation/damnation-for-sin.html">Damnation for sin</a></span><span class="t"><a href="../topics/reprobation/preterition.html">Preterition</a></span></div>

</figure><figure class="quote" id="q-643aef881b" data-kw="preceptive will gospel offer">
<blockquote><p>Conditional promises and threatenings do not favor conditional decrees because they do not pertain to the decreeing will, but to the preceptive will and are appendages to the divine commands, added to stimulate and excite men. … Hence such promises and threats show only the necessary connection of the condition with the thing conditioned, but involve no futurition of the thing.</p></blockquote>

</figure><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin Hardening Justice Depravity">
<blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-f7866d59a5" data-kw="believe and be saved offer">
<blockquote><p>In the same sense, I properly infer that all sinners would be saved if they would believe—not from any conditional decree, but from this most certain general truth which God has sanctioned by his absolute decree (viz., that faith is the infallible means of salvation). For as he has appointed faith as the only way of bringing men to salvation, hence arises the truth of this hypothetical proposition—if a sinner believes he will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.11</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0640bfcb7e" data-kw="">
<blockquote><p>Therefore we, being justified by faith, do good works, through which, as 2 Peter 1:10 says, our call and election are confirmed and made more certain day by day. But because we have only the first fruits of the Spirit and do not yet have the tithes, and because remnants of sin remain us, we do not keep the Law perfectly. But this is not imputed to us who believe in Christ—in Christ, who was promised to Abraham and has blessed us. For meanwhile we are cherished and fed, for the sake of Christ, in the lap of the forbearance of God. We are that wounded man who fell among robbers; whose wounds the Samaritan bound up, pouring on oil and wine; whom he set on his own beast and brought to an inn and took care of; and whom he entrusted to the innkeeper upon departing, with the words: “Take care of him” (Luke 10:30–35). Thus we are cherished meanwhile as in an inn, until the Lord reaches out His hand a second time, as Isaiah says, to deliver us (Is. 10:10–11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a38e42fe8" data-kw="">
<blockquote><p>Assertion 4. Nothing keeps us from calling good works an inferior cause of the actual possession of eternal life. Thus says our Calvin Institutes, book 3, ch. 14, section 21. ‘In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, p. 531 of ’10. Whether good works are necessary as causes of justification, and therefore also of salvation?’ in Ch. 12, ‘On the Justification of Sinners’ in Examination of Arminianism (Utrecht, 1668)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-f19f85dc6a" data-kw="">
<blockquote><p>It is asked whether a reward is promised to works as signs of faith. We judge that those say too much who think it is promised to works as a meritorious cause; nor do we think they say enough who suppose the promise is made only to them as signs of faith. For there are many passages of Scripture by which it is plainly established that our works, in the matter of salvation, are regarded as a cause without which not, or as a preceding condition, which has the reward of eternal life inseparably connected with it (Mt. 25:34; Rev. 7:14, etc.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam. | Thesis 10, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

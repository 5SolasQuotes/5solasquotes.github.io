<main class="wrap"><figure class="quote" id="q-b84e2eb5b6" data-kw="">
<blockquote><p>For since so many highly approved writings of this sort have been published by theologians (the abundance of which often confuses the studious, uncertain to whom they ought most especially to devote themselves), I hardly seem to have been able to avoid the mark of foolhardiness and imprudence. Meanwhile I (who am unprepared from all these things which require of such a work that it ought to be executed with excellence. …

For since each of the oldest things is most true, no description of better stamp can be given especially in sacred argument than that something has less novelty. Old is best here and that which goes back to earliest antiquity. It was discovered through much sad experience that they always dangerously go astray who spurn the well-known and well-worn paths in order to cut new ones which lead off as much as possible into pathless heights and precipices.

I admit that we ought not to despise the diligence of those who recently have done justice to their brilliant gifts from God powerfully displaying a special genius for acumen honorably taken up with examination of the Scriptures and in bringing the truth to light. And it would be sheer ingratitude against God, the author of such gifts, to willfully defraud them of their due praise or to refuse to profit from them. …

Let other books, then, be commended by their novelty. I do not want this statement to justify mine. I have avoided it most diligently lest it should contain anything new, a stranger from the word of God and from the public forms received in our churches, and nothing is built up there that is not confirmed by the vote of our most proven theologians of highest reputation.</p></blockquote>

<blockquote><p>If we apply to the case of ecclesiastical holidays those general principles, which more than once we have already seen so distinctly to set limits to the exercise of Church power in other matters, we shall find that such holidays have no Scriptural warrant, and that the assumption of power on the part of the Church in their appointment is unlawful. …

Scripture, as the rule for the exercise of Church power, forbids the appointment of ecclesiastical holidays. Under the Gospel dispensation, and within the New Testament, it cannot be pretended that there is any countenance to be found for the binding obligation of any sacred day except the weekly Sabbath. During Old Testament times, indeed, it was different; and typical days, as well as typical ordinances and typical persons, are to be found in the Jewish Church. But such days were abrogated, in so far as they had any authoritative force to command the obedience of Christians, when the ancient economy was abrogated.

Nor can it be alleged that there is anything in the New Testament beyond a bare permission to the Jewish converts to use such days, and that granted only in accommodation to their weak consciences, and for no more than a time. They were matters of permission, not of commandment, and in this character suited only to the transition interval between the legal abrogation of the Jewish economy and its practical disuse. But while the former use of holidays in the Old Testament Church cannot be pleaded in their favour as making them lawful or binding at the present day, there are at least three passages of Scripture that may be referred to as very emphatically discountenancing such ecclesiastical appointments.

1st, The very terms of the grand Sabbatical law, as announced in the fourth commandment, seem very emphatically to mark out the Sabbath itself as the only day statedly to be separated from other days for the peculiar service of God, and withdrawn, in the ordinary practice of the Church, from common and secular avocations. This is not obscurely intimated in the very language instituting the ordinance: “Six days shalt thou labour and do all thy work, but the seventh day is the Sabbath of the Lord thy God.” The boundary line drawn around that portion of time given to man for his secular and necessary avocations is here as sharply and distinctly marked as the boundary line drawn around the portion of time appropriated to God.

And it seems to be very decisively indicated, that the seventh part of the week, and neither more nor less, was to be secluded from the rest and appointed for religious worship, as the general and ordinary law for the division of man’s time; and that the remainder, consisting of six-sevenths, as the customary and common rule, was to be reserved entire for the ordinary and needful work of man in this life. Ecclesiastical holidays traverse and permanently encroach upon this grand principle laid down in the fourth commandment; and they must therefore be held to be clearly discountenanced by it.

2d, The Apostle Paul very distinctly includes holidays among the number of the things belonging to the bondage of a former dispensation, not to be considered binding upon those who had entered into the freedom of the Gospel. In his Epistle to the Galatians, much of which is directed to the object of vindicating the liberty wherewith Christ has made his people free through the Gospel, he rebukes the Church of Galatia for the importance they attached to the requirements of the legal dispensation, and among these to the observance of holidays. “Ye observe,” says he, “days and months, and times and years. I am afraid of you, lest I have bestowed upon you labour in vain.”

And in the context it is not difficult to gather the twofold ground on which the apostle condemned such observances. First of all, he grounds his condemnation of ecclesiastical days on the fact that, in attaching importance to them, and regarding them as ordinary parts of the service due to God, the Galatians, like “children, were in bondage under the elements (στοιχεια) of the world;” in other words, he stigmatizes these appointments of days and seasons as rudimentary observances suited to the infancy of the Church, but only fetters to it now, when it ought to have arrived at spiritual manhood. And again, he characterizes them as “the weak and beggarly elements (or rudiments) whereunto the Galatians desired again to be in bondage.” They were the empty and outward appointments of a carnal and wornout dispensation.

3d, In the Epistle to the Colossians the same apostle comes forth with a no less emphatic condemnation of Church holidays. Referring to the marvellous fulness of those privileges which in Christ and with Him belong to every believer, the apostle condemns the value put on the observance or non-observance of mere outward ceremonies. “Let no man judge you,” says Paul, “in meat or in drink, or in respect of an holiday, or of the new moon, or of the Sabbath days.” And here, too, he assigns a twofold reason for the warning and admonition. Such things were but types, under a former economy, of the very blessings which Christians now enjoyed through the Gospel; and these blessings themselves being now bestowed, the mere typical representations of them were done away; “which are a shadow of things to come, but the body (or substance) is of Christ.”

And still further, such ordinances, whatever authority they once had, were now but human appointments, from which it was the very object of the Gospel to emancipate them. “Wherefore, if ye be dead with Christ from the rudiments of the world, why, as though living in the world, are ye subject to ordinances, (touch not, taste not, etc.), after the commandments and doctrines of men?” Judging by such statements as these, we seem to be inevitably shut up to the inference, that Scripture, as the rule for the use and limitation of Church power, forbids its exercise in the way of appointing ecclesiastical holidays.</p></blockquote>

nancing+such+ecclesiastical+appointments.%0A%0A1st%2C+The+very+terms+of+the+grand+Sabbatical+law%2C+as+announced+in+the+fourth+commandment%2C+seem+very+emphatically+to+mark+out+the+Sabbath+itself+as+the+only+day+statedly+to+be+separated+from+other+days+for+the+peculiar+service+of+God%2C+and+withdrawn%2C+in+the+ordinary+practice+of+the+Church%2C+from+common+and+secular+avocations.+This+is+not+obscurely+intimated+in+the+very+language+instituting+the+ordinance%3A+%E2%80%9CSix+days+shalt+thou+labour+and+do+all+thy+work%2C+but+the+seventh+day+is+the+Sabbath+of+the+Lord+thy+God.%E2%80%9D+The+boundary+line+drawn+around+that+portion+of+time+given+to+man+for+his+secular+and+necessary+avocations+is+here+as+sharply+and+distinctly+marked+as+the+boundary+line+drawn+around+the+portion+of+time+appropriated+to+God.%0A%0AAnd+it+seems+to+be+very+decisively+indicated%2C+that+the+seventh+part+of+the+week%2C+and+neither+more+nor+less%2C+was+to+be+secluded+from+the+rest+and+appointed+for+religious+worship%2C+as+the+general+and+ordinary+law+for+the+division+of+man%E2%80%99s+time%3B+and+that+the+remainder%2C+consisting+of+six-sevenths%2C+as+the+customary+and+common+rule%2C+was+to+be+reserved+entire+for+the+ordinary+and+needful+work+of+man+in+this+life.+Ecclesiastical+holidays+traverse+and+permanently+encroach+upon+this+grand+principle+laid+down+in+the+fourth+commandment%3B+and+they+must+therefore+be+held+to+be+clearly+discountenanced+by+it.%0A%0A2d%2C+The+Apostle+Paul+very+distinctly+includes+holidays+among+the+number+of+the+things+belonging+to+the+bondage+of+a+former+dispensation%2C+not+to+be+considered+binding+upon+those+who+had+entered+into+the+freedom+of+the+Gospel.+In+his+Epistle+to+the+Galatians%2C+much+of+which+is+directed+to+the+object+of+vindicating+the+liberty+wherewith+Christ+has+made+his+people+free+through+the+Gospel%2C+he+rebukes+the+Church+of+Galatia+for+the+importance+they+attached+to+the+requirements+of+the+legal+dispensation%2C+and+among+these+to+the+observance+of+holiday y+%28or+substance%29+is+of+Christ.%E2%80%9D%0A%0AAnd+still+further%2C+such+ordinances%2C+whatever+authority+they+once+had%2C+were+now+but+human+appointments%2C+from+which+it+was+the+very+object+of+the+Gospel+to+emancipate+them.+%E2%80%9CWherefore%2C+if+ye+be+dead+with+Christ+from+the+rudiments+of+the+world%2C+why%2C+as+though+living+in+the+world%2C+are+ye+subject+to+ordinances%2C+%28touch+not%2C+taste+not%2C+etc.%29%2C+after+the+commandments+and+doctrines+of+men%3F%E2%80%9D+Judging+by+such+statements+as+these%2C+we+seem+to+be+inevitably+shut+up+to+the+inference%2C+that+Scripture%2C+as+the+rule+for+the+use+and+limitation+of+Church+power%2C+forbids+its+exercise+in+the+way+of+appointing+ecclesiastical+holidays.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%3A+A+Treatise+on+the+Nature%2C+Powers%2C+Ordinances%2C+Discipline%2C+and+Government+of+the+Christian+Church%2C+ed.+D.+Douglas+Bannerman+%282+vols%2C+Edinburgh%3A+T+%26+T+Clark%2C+1868%29%2C+1%3A+412-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe12ad74823.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e12ad74823.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/29/james-bannerman-on-ecclesiastical-holy-days/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>(2) If they allege that we read often in the Old Testament that God appeared to men, I respond, He appeared either without any human form, manifesting his extraordinary presence only by some extraordinary sign, or, if He was present in some form, it was not his own but one that He had assumed. He appeared not in his own form but in a vision, the way Jesus appeared to Stephen, standing at the right hand of God (Acts 7:56), and to Paul (Acts 9:10, 12), the same way that Peter saw a vessel descending from heaven filled with animals (Acts 10:11-12; 11:5-6).</p></blockquote>

<blockquote><p>Also whatever is a profession in fact, of a false religion by ceremonies indifferent, and yet proper to a false religion, is a denying of the true religion; but the using of these ceremonies, used by Papists and Jews is such; Therefore… The proposition [above] is Scripture, Gal. 2:14, Peter lived after the manner of the Jews in using the religious materials of the Jews, though he had no Jewish intention or opinion; yea, Acts 10, he disputes against that: So circumcision, Gal. 6:14-15, is put for the Jewish Church. Now altars, organs, Jewish ephods, or surplice, Mass-clothes, and Romish crossing, bowing to altars, images, are badges of Jewish and Popish religion:</p></blockquote>

</figure><figure class="quote" id="q-777bd5c2e9" data-kw="">
<blockquote><p>He [God] so sanctified this Sabbath worship that he ordered those who had violated it to be cut off from the people and stoned (Ex. 31:14-15; and 35:2). And this deservedly, for we live by faith in God (cf. Hab. 2:4). But this matter has need of much serious restoration because Satan and our flesh never cease to weaken it. Since now our God in his singular charity toward us sanctified only one of seven days for the grounding of our faith and hence of our eternal life, and blessed that day that religious services held on it might effectively work toward our salvation, whoever would not be eager to sanctify that day to glorify his Lord God and the attainment of his own salvation (especially since God has conceded six days for our business and labors in order to sustain our present life for his glory) would surely show himself as a lost despiser of so admirable a blessing of God on us and entirely unworthy of living among the people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The Library of Christian Classics: Melanchthon and Bucer (Philadelphia, 1969), pp 250-51.</span></figcaption>

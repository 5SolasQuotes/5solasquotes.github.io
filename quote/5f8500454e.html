<main class="wrap"><figure class="quote" id="q-5f8500454e" data-kw="">
<blockquote><p>The donation of Ananias and Sapphira was made to God for the use of the poor, it lay not now in their power nor in the Churches to revoke and reverse that grant, wherein God became now to be interessed. We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth Book of Moses, Called Numbers (London, 1618)</cite>, pp. 704-705</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60cd93e374" data-kw="">
<blockquote><p>O Cyaraxe, tò te genos Epainô, kai tén paida, kai dôra; boulomai de, ephê sun tê toû patros gnómê, kai tes metros tanta sunainesai,” (Xenoph., Cyrop., book 8) which is englished in this manner: “Uncle Cyaraxis, I commend the stock and the maid, and the portion; howbeit” (saith he) “by the counsel of my father and mother I will assent unto you:” as if he had said, without their advice I can do nothing. All histories, philosophers and poets in a manner, are full of the practice of this duty (Terent in phormion). And no marvel, for this is agreeable to the common principle in nature, “Whatsoeuer ye would that other men should do unto you, do ye even so to them,” Mt. 7:12. Sampson saw a maid in Timnah that liked him well, notwithstanding he spake not one word to her, but came back to his parents, and desired them to make the marriage for him. They were the first whom he acquainted with his purpose: not as in our days, wherein commonly the parents are the last. Judg. 14:2, “Get her to me, for she pleaseth me well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth Book of Moses, Called Numbers (London, 1618) | This was observed of those that otherwise led no sanctified life, Gen. 21:21, yea of the very heathen themselves. I will produce one testimony among many others, and that is of king Cyrus after he had conquered Babylon, and come home in triumph, his uncle Cyaraxis offered him his daughter unto wife: he thanked his uncle, and praised the maid, and liked the dowry, but for giving consent to marriage, he made him this answer, which I would it were observed and followed of all Christians:</cite>, pp. 1,167-8</span></figcaption>

</figure><figure class="quote" id="q-c7d77a0489" data-kw="">
<blockquote><p>That power is given by the Presbyteries’ act of ordination, by order of nature, before the people’s formal act of election: As the husband who in a lapidaries shop chooses a gold ring for his wife, and puts it on her finger, presupposes it was a gold ring before his choosing thereof, neither does his choosing thereof make it a gold ring, but only makes it his wife’s gold ring by application to her: Just so, peoples election appropriates such a man who is already a pastor to such a charge, but does not make the pastor a pastor, but chooses him only to be their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea (1642), ch. 17</cite>, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>The fifth argument taken of the end [design] of baptism, to wit, because that they which are baptized, are baptized for dead, that is to say, that they may have a remedy against death because that baptism is a token of regeneration. They that are baptized [are baptized] to this end and purpose, that death may be put out in them, or, to rise again from the death, whereof baptism is a seal.</p></blockquote>

</figure><figure class="quote" id="q-246d713917" data-kw="">
<blockquote><p>Then the minister continues, saying: Be mindful that God our savior wills all people to come to the knowledge of the truth through the only mediator, Jesus Christ, who handed himself over as a ransom for many. God also wills for us to join in many prayers, that we should arrive at the unity of faith and knowledge of the Son of God, our redeemer. Therefore we ask the Lord to grant faith to this little one, that the external baptism should take place internally through the Holy Spirit in [by means of?] the salvific water. Therefore, pray in this way: Almighty, eternal God, who through the flood, in accordance with your severe but just judgment, condemned the unbelieving world and saved, on the grounds of your immense mercy, faithful Noah’s eight; you who submerged hardened Pharaoh with all his people in the Red Sea, but then led your people Israel across with dry feet, a prefiguring of baptism — We beseech you through your immense mercy that you would deign to look mercifully upon your servant, [name], and kindle in his heart the light of faith, so as to be grafted into your Son, buried together with him in death, and also raised into a new life, in which he would eagerly follow your son in bearing his cross daily and cling to him in true faith, firm hope, and ardent love, so that for your sake, he could boldly despise this life, which is nothing other than death, and on the last day present himself fearlessly at the universal judgment of your Son. Through our Lord Jesus Christ, your Son, who lives and reigns with you in the unity of the Holy Spirit, God throughout all ages. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-lavater.html">Ludwig Lavater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rites &amp; Institutions of the Zurich Church</cite>, (1559)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

6d713917.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/246d713917.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Then%20the%20minister%20continues%2C%20saying%3A%20Be,Spirit%2C%20God%20throughout%20all%20ages.%20Amen&amp;text=Then%20the%20minister%20continues%2C%20saying%3A%20Be%20mindful%20that&amp;text=the%20Holy%20Spirit%2C%20God%20throughout%20all%20ages.%20Amen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8511263fc1" data-kw="">
<blockquote><p>Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world.

2. Note that the holiness of the child received from one of the parents believing is more than the sanctification of the wife by her believing husband, because such a wife is not taken into Covenant with her husband, but the child is; and therefore the apostle says not that such as is the sanctification of the wife, such is the holiness of the child: But thus, Such as is the holiness of the believing party, such is the child’s holiness in respect of Church-membership; and so the faith of the believing husband is the cause of both these effects, viz. That his coupling with his wife is not impure, and also that his children are holy: And this latter [is] an evidence of the former. And thus the holiness of the child is a sign of the mother’s sanctification to holy cohabitation, and an effect of the father’s faith by virtue of God’s Covenant. To have said, ‘That their children were lawful’, was no more than to have said, ‘That their marriage was lawful’, which was not the question; But to say, that the children of their lawful marriage were holy, this did infer not only the lawfulness of their marriage but the sanctified use: As Mr Baily has well observed, Of Anabaptism, p. 138.

3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for our Public Ministery &amp; Infant-Baptism, written Some Years Ago</cite>, … (London, 1652), pp. 42-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

ild+received+from+one+of+the+parents+believing+is+more+than+the+sanctification+of+the+wife+by+her+believing+husband%2C+because+such+a+wife+is+not+taken+into+Covenant+with+her+husband%2C+but+the+child+is%3B+and+therefore+the+apostle+says+not+that+such+as+is+the+sanctification+of+the+wife%2C+such+is+the+holiness+of+the+child%3A+But+thus%2C+Such+as+is+the+holiness+of+the+believing+party%2C+such+is+the+child%E2%80%99s+holiness+in+respect+of+Church-membership%3B+and+so+the+faith+of+the+believing+husband+is+the+cause+of+both+these+effects%2C+viz.+That+his+coupling+with+his+wife+is+not+impure%2C+and+also+that+his+children+are+holy%3A+And+this+latter+%5Bis%5D+an+evidence+of+the+former.+And+thus+the+holiness+of+the+child+is+a+sign+of+the+mother%E2%80%99s+sanctification+to+holy+cohabitation%2C+and+an+effect+of+the+father%E2%80%99s+faith+by+virtue+of+God%E2%80%99s+Covenant.+To+have+said%2C+%E2%80%98That+their+children+were+lawful%E2%80%99%2C+was+no+more+than+to+have+said%2C+%E2%80%98That+their+marriage+was+lawful%E2%80%99%2C+which+was+not+the+question%3B+But+to+say%2C+that+the+children+of+their+lawful+marriage+were+holy%2C+this+did+infer+not+only+the+lawfulness+of+their+marriage+but+the+sanctified+use%3A+As+Mr+Baily+has+well+observed%2C+Of+Anabaptism%2C+p.+138.+3.+Lastly%2C+If+by+holy%2C+be+only+meant+a+civil+holiness%2C+then+on+the+contray%2C+by+%E2%80%98unclean%E2%80%99%2C+must+be+meant+a+civil+uncleanness.+But+when+Paul+says+%28else+were+your+children+unclean%29+his+intent+is+not+to+make+them+all+as+an+unclean+birth+and+impure+offspring%2C+which+were+born+at+Corinth+of+unbelieving+parents%2C+but+to+show+that+they+are+not+comprehended+within+God%E2%80%99s+Covenant%3A+And+so+when+he+says+%E2%80%98but+now+are+they+holy%E2%80%99%2C+he+notes+some+preeminence+of+the+children+of+Christians+above+the+heathens%E2%80%99+children%3A+Though+in+civil+respects%2C+in+respect+of+a+lawful+birth%2C+both+sorts+of+children+were+equal%2C+yet+that+civil+holiness+being+common+to+both%2C+there+is+a+preeminence+of+the+Christian%E2%80%99s+child+above+the+heathen%E2%80%99s.+The+child+of+an+infidel+at+Corinth+is+today+unclean+and+the+next+day+holy+in+case+his+parents+turn+Christians%3B+And+what%E2%80%99s+the+reason+of+this+so+sudden+alteration%3F+It+must+needs+be+in+regard+of+the+Covenant+into+which+the+party+now+believing+is+taken+with+his+children%2C+his+unbelieving+neighbor+with+his+children+still+remaining+unclean%3A+Hence+I+conclude+with+Calvin%2C+in+location%2C+Seeing+our+children+are+exempted+from+the+common+condition+of+lost+mankind%2C+and+admitted+into+God%E2%80%99s+Church+and+family%2C+Cur+eos+a+signo+arceamus%3F+upon+what+reason+can+we+drive+them+from+the+sign+of+their+admittance%3F%E2%80%9D%0A%0A%E2%80%94+William+Lyford%2C+An+Apology+for+our+Public+Ministery+%26+Infant-Baptism%2C+written+Some+Years+Ago%2C+%E2%80%A6+%28London%2C+1652%29%2C+pp.+42-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8511263fc1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8511263fc1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Objection%20%5Bfrom%20a%20baptist%5D%3A%20The%20sanctification,from%20the%20sign%20of%20their%20admittance&amp;text=Objection%20%5Bfrom%20a%20baptist%5D%3A%20The%20sanctification%20of%20the&amp;text=drive%20them%20from%20the%20sign%20of%20their%20admittance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>

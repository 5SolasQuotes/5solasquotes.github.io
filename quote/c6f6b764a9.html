<blockquote><p>As touching matrimonial benediction… through divine institution, it has a necessary use, as we have said. And though the Dr. to make it appear that a pastor’s performing of the same is a thing indifferent, alleges that in Scripture there is nothing commanded thereanent. Yet plain it is from Scripture itself that matrimonial benediction ought to be given by a pastor, for God has commanded his ministers to bless his people (Num. 6), which by just analogy belongs to the ministers of the Gospel; neither is there any ground for making herein a difference betwixt them and the ministers of the Law, but we must conceive the commandment to t•…e both alike to the blessing of God’s people. Unto which ministerial duty of blessing, because no such limits can be set as may exclude matrimonial blessing, therefore they are bound to the performance of it also. And if further we consider that the duty of blessing was performed by the minister of the Lord, even before the law of Moses (Heb. 6:7), we are yet more confirmed to think that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty, belonging to the Lord’s ministers forever. Wherefore, notwithstanding of any abuse of matrimonial benediction among Papists, yet forasmuch as it has a necessary use in the Church and may not (as the controverted ceremonies may) be well spared…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, pp. 24-5</span></figcaption>

<blockquote><p>Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 4th Decade, Case 1, ‘Whether the Marriage of a Son or Daughter without or against the Parents’ Consent may be Accounted Lawful?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 293-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>Epiphanius writes (Heresies, 61), ‘There were a sect, a branch of the old Cathari [12th-14th centuries, southern Europe], or Puritans, (as he says) which called themselves Apostolici, propter exactum disciplinae studium, etc., for an extraordinary desire they had above other men to have discipline and all things to the exact pattern of the apostles’ days;’ which is itself an imagination. For, it were cacozelia, an apish imitation, to retain all in use then, seeing diverse things even then were but temporaria. For beside their canon in matters of knowledge (Gal. 6:16), they had their dogmata or decreta, not of equal importance; as was that of eating ‘things strangled, and blood’ (Acts 15:20), which no man now thinks himself bound to abstain from. And besides their epitaxes, commandments in matter of practice (1 Cor. 7:10), they had their diataxes, injunctions, not of equal regard with the former. Such were their agapae, love-feasts after the sacrament (Jude 12): and their celebrating the sacrament after supper (1 Cor. 11:20-12) [in the evening, as the word in Greek for ‘supper’, δεῖπνον, in the Lord’s ‘Supper’, intimates]; which no Church at this day does imitate. Therefore, to press all that was in that time is an imagination. And, as to press all so of these things that remain, to press all alike, or think an equal necessity of them, which was a parcel of the imagination of the Donatists. For, some things the apostles peremptorily commanded (1 Cor. 7:10); Some things they had no commandment for, but only gave counsel (1 Cor. 7:25); Some things they commanded and taught (1 Tim. 4:11); somethings they taught and exhorted (1 Tim. 6:2); whereof each was to be esteemed in his own value and worthiness; Neither to dispense with the commandment, nor to make a matter of necessity of the counsel. Both which have not a little harmed the Church. Lastly, to these matters of counsel, which for the most part are things indifferent, they also fall upon two imaginations. 1. Some say: omnia mihi licent [‘all is lawful to me’] (1 Cor. 10:23), and so [if] it be not condemned as unlawful, make no bones of it, which tends to all profaneness. [2.] Others say, ‘Touch not, taste not, handle not’ (Col. 2:21), which speak of things indifferent as merely unlawful, which imagination ends in superstition. A mean [middle] way would be holden between them both, that neither ‘a snare be cast’ (1 Cor. 7:35) on men’s consciences by turning non expedit [not expedient] into non licet [not permitted], nor our ‘liberty’ in Christ (Gal. 5:13) [to] be made an occasion to the flesh by casting non expedit out of doors. For the Spirit of Christ is the spirit of ingenuity, which will freely submit itself to that which is expedient, even in things of their own nature lawful. The not observing whereof, with good heed and discretion, has in old time filled the world with many a superstitious imagination and in our days has healed the imagination and superstition and hypocrisy with another of riot and licentious liberty as bad as the former, yea a great deal worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 96 Sermons, One of the Sermons upon the 2nd Commandment, on Acts 2:42, pp. 29-30 Andrewes was a reformed Anglican.</span></figcaption>

<blockquote><p>There are many more cases, such as where on fears poison or murder… But in such cases the authorities and sensible people can be of help… a spouse must run the risk of poison or murder, especially where it is undertaken secretly. Open undertakings can be prevented and deterred by the authorities or friends.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-087cf1b950" data-kw="">
<blockquote><p>Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words… With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, Of Divine Worship, in Three Parts in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Parkhurst, 1684), pt. 3, section 6</span></figcaption>

</figure><figure class="quote" id="q-5302f036bd" data-kw="">
<blockquote><p>We observe comely circumstances in the celebration of the sacrament, but we justly condemn those who have added such things unto which they have fancied mysteries, and proper significations, and that of those effects which appertain unto the water of baptism: As though the work should be twice or thrice done, and that either nothing, or that was not sufficient which was done by divine appointment, unless human rashness should have added supply.</p></blockquote>

</figure><figure class="quote" id="q-567618cbef" data-kw="">
<blockquote><p>1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission.

2. I consider four acts of the soul that may convey external adoration:

1. One of the mind, a consideration of the excellency of what we adore;

2. A will to submit to this excellency;

3. The judgments diting this to be honest to submit;

4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements.

3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change:

1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring.

2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace.

3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping.

4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might:

1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling.

2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum, or The Divine Right of Church Government (London, 1646)</cite>, The Divine Right of Church Government, (London, 1646), ch. 1, question 5, section 1, pp. 145-47</span></figcaption>

f%20the%20knee%2C%20physically,institution%20from%20the%20instinct%20of%20nature&amp;text=1.%20Bowing%20of%20the%20knee%2C%20physically%20or%20civilly&amp;text=kneeling%20has%20institution%20from%20the%20instinct%20of%20nature" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

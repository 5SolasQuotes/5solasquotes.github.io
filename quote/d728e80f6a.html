<blockquote><p>The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). Hence he brings forward the justification of Abraham by faith as an</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0039051eb" data-kw="old new">
<blockquote><p>However, we readily grant that the Old Testament and the Mosaic covenant taken strictly and absolutely as to the legal relation (schesin) differ in entire substance from the New. Hence the law and Moses are opposed to grace and to Christ (Jn. 1:17) and by Paul the letter and the Spirit, the ministration of condemnation and of righteousness (2 Cor. 3:6, 7). So we maintain that taken broadly and with the other evangelical relation (schesei) (clothed, namely, with its pedagogical circumstances), it did not differ as to substance, but only as to manner of dispensation.</p></blockquote>

</figure><figure class="quote" id="q-4e78a94b75" data-kw="david">
<blockquote><p>Any “good and joyful tidings” whatsoever are called by the Greeks euangelion and by the Hebrews khshrh tvbhh. Yet that is eminently (kat’ exochēn) ascribed in Scripture to the news (the most pleasing of all) concerning the happy advent of Christ to the world, the covenant of grace made in him and the salvation obtained through him. It is not, however, used always with the same meaning. Sometimes it denotes (broadly and in general) the gratuitous covenant made in Christ. In this sense, Paul speaking of the ancient people, says, “They have not all obeyed the gospel” (Rom. 10:16); and it is said, “The gospel was preached to them that are dead” (1 Pet. 4:6). Sometimes it is put strictly and in particular either for the promise and the doctrine concerning Christ about to come (in which sense, Paul says, “The gospel was preached before unto Abraham when the promises were given to him,” Gal. 3:8); or more properly for the doctrine of Christ manifested and the fulfillment of all the promises (in which sense it is everywhere used in the New Testament for the doctrine of the mission of Christ</p></blockquote>

</figure><figure class="quote" id="q-9f4eeb7fe6" data-kw="noah">
<blockquote><p>The Remonstrants in the declaration of their opinion about this set forth their opinion thus: “Christ by the merit of his death thus far reconciled God, the Father, to the whole human race, that the Father on account of that merit, without injury to his own justice and truth, could and willed to enter into and sanction a new covenant of grace with sinners and men exposed to damnation” (cf. Acta Synodi Nationalis … Dordrechti (1620), Pt. I, pp. 115–16, on Article 2, “Concerning the Death of Christ”). Now this new covenant, they maintain, was so made with the whole human race that no nation and no individual ought to be said to be excluded from it. “The nations living under the Old Testament, although the covenant was not revealed to them in the same manner as to the Jews, ought not forthwith to be considered as having been absolutely excluded from the covenant, who in some way at least are called that they may seek God. Yea, to them, equally with the Jews, the spiritual gifts of the covenant were exposed, if they would only fulfil the conditions—that they would turn themselves to the</p></blockquote>

<blockquote><p>The new covenant is also taken in a twofold manner either broadly, inasmuch as it stands for the covenant of grace in general made with sinners, which existed under the Old Testament as well before Christ appeared as under the New after he had been manifested; or strictly, for the covenant of grace promulgated after the manifestation of Christ in the flesh, which should continue to the end of the world.</p></blockquote>

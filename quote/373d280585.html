<main class="wrap"><figure class="quote" id="q-373d280585" data-kw="">
<blockquote><p>Some of the passages show the quality or condition required of those who are promised eternal life (Heb. 10:36, etc.). Other passages show the mark and way of faith whereby one reaches eternal life (as in Mt. 25:35; James 1:25 and 2:14). And other places point out the fruit and effect of the salvation that has begun and that consists in the forgiveness of sins (as in Lk. 7:47, etc.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. Dolf te Velde, Synopsis of a Purer Theology (1625; Brill, 2015), vol. 2, Disputation 34, ‘On Good Works’, sect. 26, p. 357</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Some of the passages show the quality or condition required of those who are promised eternal life (Heb. 10:36, etc.). Other passages show the mark and way of faith whereby one reaches eternal life (as in Mt. 25:35; James 1:25 and 2:14). And other places point out the fruit and effect of the salvation that has begun and that consists in the forgiveness of sins (as in Lk. 7:47, etc.).”

<blockquote><p>But of course good works are necessary as the God-appointed road, on which by grace we are to attain to the possession of eternal life. This naturally can hold not for those elect who die at an age of minority or at the beginning of their rebirth, but only for those who have time and opportunity for good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-9b5e0d91da" data-kw="">
<blockquote><p>Very many passages of Holy Scriptures (of which some are adduced by Bellarmine; but almost numberless others might be added to them, Heb. 10:36; 1 Tim. 2:15; Phil. 2:12… 2 Cor. 7:10 &amp; 4:17… Rom. 8:13,17 &amp; 10:10; Mt. 25:34-35… and in verse 21 of the same chapter according to the vulgate translation… James 1:25 &amp; 2:14; Gal. 6:8… Rev. 7:14-15… most clearly demonstrate that in adult persons good works have to salvation not merely the relation ‘of order’ (as besides others, Paraeus frigidly answers)… but also a causal relation, such as is the relation of a cause efficient or aiding, after its own manner and place, to its effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 309 of Book 4, ‘Of the Justice of Works’, ch. 1, ‘Of the Necessity of Good Works to Salvation, and the Coincident Questions…’ in A Fair &amp; Calm Consideration of the Modern Controversy Concerning Justification, as it is Explained in the Five Books of Cardinal Bellarmine in Modest &amp; Pacifying Considerations of Controversies, vol. 1 (Oxford, 1850)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Very many passages of Holy Scriptures (of which some are adduced by Bellarmine; but almost numberless others might be added to them, Heb. 10:36; 1 Tim. 2:15; Phil. 2:12… 2 Cor. 7:10 &amp; 4:17… Rom. 8:13,17 &amp; 10:10; Mt. 25:34-35… and in verse 21 of the same chapter according to the vulgate translation… James 1:25 &amp; 2:14; Gal. 6:8… Rev. 7:14-15… most clearly demonstrate that in adult persons good works have to salvation not merely the relation ‘of order’ (as besides others, Paraeus frigidly answers)… but also a causal relation, such as is the relation of a cause efficient or aiding, after its own manner and place, to its effect.”

ce%2C%20to%20its%20effect&amp;text=Very%20many%20passages%20of%20Holy%20Scriptures%20%28of%20which&amp;text=its%20own%20manner%20and%20place%2C%20to%20its%20effect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a5de6d2b83" data-kw="">
<blockquote><p>Moreover, when Scripture intimates that the good works of believers are causes why the Lord does them good, we must still understand the meaning so as to hold unshaken what has previously been said—viz. that the efficient cause of our salvation is placed in the love of God the Father; the material cause in the obedience of the Son; the instrumental cause in the illumination of the Spirit, that is, in faith; and the final cause in the praise of the divine goodness. In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works. What precedes in the order of administration is called the cause of what follows. For this reason, he sometimes makes eternal life a consequent of works; not because it is to be ascribed to them, but because those whom he has elected he justifies, that he may at length glorify (Rom. 8:30); he makes the prior grace to be a kind of cause, because it is a kind of step to that which follows. But whenever the true cause is to be assigned, he enjoins us not to take refuge in works, but to keep our thoughts entirely fixed on the mercy of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite>, Book 3, ch. 14, section 21 tr. Beveridge</span></figcaption>

<blockquote><p>2. We are mere patients in the causes of blessedness; but in respect of conditions we are not so: for as we said of faith, we may also say of good works: God enables to them, but man works them, and walks in the way of them to blessedness: not that our works are causes, but conditions without which blessedness is not attained. See Mt. 25:35.

3. This assertion [previously objected] bewrays great ignorance of the proper and present use of sanctification, and the duties of it; which they conceive as legally urged to help the believer in his title and right to the blessed inheritance purchased in heaven: whereas only Christ’s righteousness and merits give right and title unto heaven; but yet the grace of sanctification gives us an aptitude and fitness unto it: for, ‘without holiness none shall see God,’ Heb. 12:14, and, no unclean thing shall enter into the gates of that City. (Rev. 21:27) Yea it is proceeding in sanctification to the measure and stature of Christ that fits us to the vision and fruition of the glorious presence of God, and for the full possession of that heavenly inheritance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regula Vitæ: the Rule of the Law under the Gospel</cite>, … (London: Dawman, 1631), ch. 4, 3rd Error, pp. 72-73 Taylor (1576–1632) was a partially conforming English minister, sympathetic with the puritans.</span></figcaption>

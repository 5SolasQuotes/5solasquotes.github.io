<main class="wrap"><figure class="quote" id="q-d5c1cb892f" data-kw="">
<blockquote><p>In Origen’s homily on Numbers 28-29, he expressed his view of how Christians were to observe the Sabbath:

Now the second feast, after the feast of the perpetual sacrifice, is recorded to be the sacrifice of the sabbath, and it is necessary that every saint and just person celebrate the feast of the Sabbath as well Well, what is the feast of the Sabbath, if not that feast of which the apostle says: “So a sabbath,” that is, the observance of the sabbath, “will be left for the people of God” [Hebrews 4:9] Therefore, leaving behind the Judaic observances of the sabbath, let us see what sort of observation of the sabbath there ought to be for the Christian. On the day of the sabbath, no worldly activity is supposed to be carried out. Thus if you cease doing secular works and carry out nothing worldly, but make room for spiritual works, if you come together at church, give ear to the divine readings and discussions, think about heavenly things, show concern for the future hope, keep the coming judgment before your eyes, do not look to present and visible things, but to the invisible and future things, this is how the Christian observes the sabbath.

But even the Jews should have observed these things. After all, even among them, if there was a craftsman, a builder or any other such worker, he takes it easy on the sabbath day. But the reader of the divine law, on the other hand, and the teacher, does not leave off from his work, and yet they are not defiling the sabbath; for this is what the Lord says to them: “Or have you not read that the priests in the temple violate the sabbath and are without an offense?” [Mark 12:5] Therefore, the one who has ceased from the works of the world and makes room for spiritual actions is the one who carries out the sacrifice of the sabbath and celebrates the feast day of the sabbaths.

He “carries no burdens on the road”; [Nehemiah 13:19] for every sin is a burden, as the prophet says: “They have weighed down on me like a heavy burden.” [Psalm 38:4] He “kindles no fire,” [Exodus 35:3] namely, that fire of which it is said: “Go in the light of your fire and in the flame which you have kindled.” [Isaiah 50:11] On the sabbath each one stays in his own place and does not go forth from it. Well, what is the “place” of the spiritual soul? Its place is justice, truth, wisdom, sanctification, and everything that Christ is; this is the “place” of the soul. It is not proper for the soul to go forth from this place, so that it may keep the true sabbaths and accomplish the feast day with the sacrifices of the Sabbath, as the Lord also said: “He who stays in me, I too [will stay] in him.” [John 15:5]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/origen-of-alexandria.html">Origen of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on Numbers</cite>, trans. Thomas P. Scheck, ed. Christopher A. Hall, Ancient Christian Texts (Downers Grove IL: IVP Academic, 2009), 23.4.1-2, pp 142-43.</span></figcaption>

<blockquote><p>Let us then drive away from our ears and minds those who say that we ought to accept the determination of our own free will and not pray God to help us not to sin. By such darkness as this even the Pharisee was not blinded; for although he erred in thinking that he needed no addition to his righteousness, and supposed himself to be saturated with abundance of it, he nevertheless gave thanks to God that he was not “like other men, unjust, extortioners, adulterers, or even as the publican; for he fasted twice in the week, he gave tithes of all that he possessed.”

He wished, indeed, for no addition to his own righteousness; but yet, by giving thanks to God, he confessed that all he had he had received from Him. Notwithstanding, he was not approved, both because he asked for no further food of righteousness, as if he were already filled, and because he arrogantly preferred himself to the publican, who was hungering and thirsting after righteousness.

What, then, is to be said of those who, whilst acknowledging that they have no righteousness, or no fulness thereof, yet imagine that it is to be had from themselves alone, not to be besought from their Creator, in whom is its store and its fountain? And yet this is not a question about prayers alone, as if the energy of our will also should not be strenuously added. God is said to be “our Helper;” but nobody can be helped who does not make some effort of his own accord.

For God does not work our salvation in us as if he were working in insensate stones, or in creatures in whom nature has placed neither reason nor will. Why, however, He helps one man, but not another; or why one man so much, and another so much; or why one man in one way, and another in another,—He reserves to Himself according to the method of His own most secret justice, and to the excellency of His power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.6 in NPNF1, 5: 46.</span></figcaption>

</figure><figure class="quote" id="q-fea30d9bc7" data-kw="">
<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on Jn., 17:1</span></figcaption>

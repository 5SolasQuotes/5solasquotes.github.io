<blockquote><p>Thesis 6. The end is that rational creatures testify their subjection and gratitude to God the Creator, Lord and Benefactor. Thesis 7. These are the causes of divine worship. Two adjuncts above all are sincerity and promptitude. God indeed wills Himself to be worshipped by a soul sincere, not hypocritical, prompt and willing, not unwilling and forced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, (Hanau, 1634; 2nd ed., Amsterdam, 1657), bk. 2, ‘Of the Worship of God’ | 1. ‘Of the Causes, Adjuncts &amp; Distribution of Divine Worship’, theses 3-7, pp. 652-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76b56e04c0" data-kw="">
<blockquote><p>There are three fundamental principles held by non-conformists (and those especially of them which are called presbyterians) wherein they differ from others: 1. That the Scriptures of the Old and New Testament are a perfect Rule for Christians, directing them not only what to believe in the things of God, but also what to do in all matters relating to the Worship of God, and the government of the Church; so as in these things they may not either believe or do what is not there expressly, or by immediate consequence revealed. In civil matters they believe the Scripture to be only a general rule, or rather as to them, to contain some general rules only, by which all men’s actions are to be directed; but in sacred things, they believe the Scriptures to be a particular rule… Thus they differ from Papists, who will not allow the Scriptures to be a perfect rule as to matters of faith; and from those, who although they allow them in matters of faith a perfect rule, yet deny them to be so in the matters of worship, or government of the Church; and as to the first, say that the Scriptures are only a perfect rule as to acts of worship, not as to means, and modes, or religious rites used in, and about the worship of God; but that these may be directed by superiours for spiritual edification; or who say, that the Scripture has only directed that the Church should be governed, but has left to superiours to determine by what officers, acts and rules that government should be exercised: So as the first and main question is, Whether the Scriptures be a perfect and sufficient rule for Christians in matters of worship, and Church government, as well as matters of faith? which those called presbyterians believe it is; because they find sufficient directions in it for the decent and orderly performance of all acts of worship, without any human supplements; and such Church-officers directed by it, such acts of jurisdiction and censures prescribed in it, as are sufficient to preserve the unity, peace and purity of the Church; which are the great ends of that government.</p></blockquote>

<blockquote><p>1. There is that in God’s worship which is no part of his worship. 2. There is a secondary worship subservient to God’s institutions which men may make laws about.</p></blockquote>

</figure><figure class="quote" id="q-9c6e5cd948" data-kw="">
<blockquote><p>There is a lot of psychological distress involved in even talking about it. I don’t care for the overuse of words like ‘trauma,’ but it really has felt traumatic, and we weren’t suffering the worst of it by any means. Our family has been shunned by the pastor because he didn’t believe we voted for him to be installed [as the pastor], although we did; you don’t realize how much damage it does to have your spiritual leader refuse to even speak to you, because it starts to seem normal. I was also reprimanded when one of the elders found out that I asked a question about the church’s unconventional sacramental practices to someone outside the church. There have been sustained, vicious attacks on family members by the session [of elders]. There is consistent abuse of Matthew 18 to stifle any publicly voiced criticisms of actions by the session. There is a lack of transparency: for example, the session refuses to release a comprehensive budget to the congregation, and makes major purchases without a congregational vote. Church discipline has no established procedure, and excommunication is done behind closed doors, without a public trial or public testimony by witnesses. Excommunications are also based on manufactured sins; the current excommunication, for example, is based on the charge of “living in darkness.” The pastor has literally pronounced eternal damnation over people who have criticized him in public. The session has even gone after people who left the church and are no longer members, going so far as to contact people’s ex-spouses to attempt to find incriminating information about them to convey to the non-member’s new pastor. They also routinely spread around information that was given in confidence for counseling purposes. Everyone we’ve told who is not in the church is appalled; in retrospect we wonder why it took so long for us to leave, but it really is painful. It was hard to leave for a number of reasons. First, we had a lot of specific doctrinal agreements with that church, that most other churches don’t share. Along with that came like-minded friends who we really did not want to give up. Things got incrementally worse over a long time, and quite often the leadership had semi-plausible explanations for their actions which were not easy to disprove. The worst of it was not targeted at us, and we thought we could just keep our heads down and avoid interacting with the session. We wished we could more vocally confront them, but the people being abused asked that we not get involved, so we didn’t feel that we could. Over time the cognitive dissonance grew worse, and it seemed to us the Holy Spirit had entirely withdrawn from the church. The church moving to a new building that was much farther away gave us a ready excuse to go elsewhere that couldn’t be argued with. Then the final decision was made for us when the pastor purported to damn our relative; that’s a bell that can’t really be unrung, and we couldn’t commune in good faith after that. We are members of the congregation. We are hoping the elders will just leave us alone, but they have harassed people who have left before, so we are trying to get under the shelter of another church quickly. We did a complete communication blackout. We blocked all of the communication outlets from all of the elders, so we won’t have to even see anything they might send which could tempt us to reply. Articles on spiritual abuse do capture very well the experience of being in the situation, the damage it does and the psychological consequences of getting out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cultish.html">Anonymous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Testimony of a Lawyer, with family</cite>, Pennsylvania, USA</span></figcaption>

<blockquote><p>5. Divine worship is internal only or external also. Internal worship is merely spiritual, and performed only within the temple of man’s heart, of which none are witnesses but God and a man’s own conscience. All the inward motions of the heart directed unto God are parts of this worship, as faith, hope, confidence, love, fear and joy in God, etc. which are all of them diverse acts and parts of inward worship, in everyone of which God is honored. All which spring from the apprehension of our own wants, and God’s infinite excellency and goodness towards us… 6. External worship is an expressing and setting forth of the internal by outward signs and rites: by which as by certain outward bodily shadows and colors the spiritual and inward worship of God is made visible and sensible to others.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a06c5a511" data-kw="">
<blockquote><p>9. In Christ, the person must be distinguished from the enhypostatic adjunct. Person is only the divine nature. For one should not think that the person of Christ is a kind of conflation of human and divine nature – as if the person was composed out of parts. But because the divine nature, which assumed the human nature into the divine personality, is alone person, human nature is an enhypostatic adjunct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy (1644), ch. 11, ‘On the Person &amp; Office of Christ’</cite>, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

— Johannes Maccovius, Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy (1644), ch. 11, ‘On the Person &amp; Office of Christ’, p. 205">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C9.+In+Christ%2C+the+person+must+be+distinguished+from+the+enhypostatic+adjunct.+Person+is+only+the+divine+nature.+For+one+should+not+think+that+the+person+of+Christ+is+a+kind+of+conflation+of+human+and+divine+nature+%E2%80%93+as+if+the+person+was+composed+out+of+parts.+But+because+the+divine+nature%2C+which+assumed+the+human+nature+into+the+divine+personality%2C+is+alone+person%2C+human+nature+is+an+enhypostatic+adjunct.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+Scholastic+Discourse%3A+The+Distinctions+%26+Rules+of+Theology+%26+Philosophy+%281644%29%2C+ch.+11%2C+%E2%80%98On+the+Person+%26+Office+of+Christ%E2%80%99%2C+p.+205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a06c5a511.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a06c5a511.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=9.%20In%20Christ%2C%20the%20person%20must,human%20nature%20is%20an%20enhypostatic%20adjunct&amp;text=9.%20In%20Christ%2C%20the%20person%20must%20be%20distinguished&amp;text=alone%20person%2C%20human%20nature%20is%20an%20enhypostatic%20adjunct" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-52239e55d2" data-kw="">
<blockquote><p>I affirm that such things as be proper to the Godhead may be attributed to man, though not to the manhood. Wherefore this proposition is true: This man is God, or this: The eternal Word of the Father is man… Wherefore, whether He be called man, He is yet notwithstanding understood to be God, or whether He be called God, He is like wise understood to be man. But when we speak of the natures themselves, to wit, either the manhood or the Godhead, by these abstracted names there is nothing else signified or meant but the several natures in and by themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper… (London, 1588), ‘The First Homily… 1574’</cite>, pp. 36-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-de9c7888de" data-kw="">
<blockquote><p>By the Understanding, Will, and Affection, the Soul doth (as it were) enter into God, and God into the Soul; whence followeth (as it were) a mutual in-being of one in another, and an intimate vital union between God and the Soul. Either the vision, fruition, and love of God, is Blessednesse, or there is no Blessednesse; God is not God, Heaven is not Heaven; the Creature, according to the best, namely, the Gospel-dispensation of God, is capable of no more, needs no more, can have no more; God in Christ doth no more for Man, man needs no more from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, London, 1654, ch. 15, p. 335</span></figcaption>

</figure><figure class="quote" id="q-b39dc87ab2" data-kw="">
<blockquote><p>Developing from Girolama Zanchi’s exegetical labors through Ephesians, Spiritual Marriage draws readers into the rich theological of doctrine of union with Christ. Following the lead of the apostle Paul, Zanchi demonstrates how our earthly marriages fulfill their truest purpose by drawing our attention toward the spiritual marriage between Christ and His Church. By paying attention to the Genesis account of Adam’s marriage to Eve, to pertinent Old Testament laws, and to the teachings of Jesus and His apostles, we begin to understand something of that higher and heavenly union.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Marriage between Christ &amp; His Church &amp; Every One of the Faithful (RHB, 2021) 152</cite>, pp. ToC</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

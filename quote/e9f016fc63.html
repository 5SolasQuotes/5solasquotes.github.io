<main class="wrap"><figure class="quote" id="q-e9f016fc63" data-kw="">
<blockquote><p>As for the vails wherewith the apostle would have women covered while as they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1), they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign for that comely and orderly distinction of men and women, which civil decency required in all their meetings: wherefore that distinction of habits [garments], which they used for decency and comeliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness, still to retain in their holy assemblies. And further the apostle shows that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman, verses 3, 8, 9 (for covering was then a sign of subjection), and by the long hair which nature gives to a woman, verse 15, where he would have the artificial covering to be fashioned in imitation of the natural. What need we [argue] any more? Let us see nature’s institution or the apostles’ recommendation for the controverted [English-Popish] ceremonies (as we have seen them for women’s vails) and we yield the argument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘The 5th Argument… taken from the mystical &amp; significant nature of them’, pp. 90-91</span></figcaption>

<blockquote><p>Three things about the worship of God are to be considered:

1. The kinds of it…

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>

<blockquote><p>The trifling objection of the abuse of this psalm [psalm 121], by the woman’s usual coming in a vail is easily answered, by affirming that the Church, as she does not forbid, so neither does she command any such habit, but leaves it as an indifferent thing; and if the woman, who has an arbitrary power in this concernment, think fit to come forth vailed, that is, better armed against the cold, her act cannot constitute a ceremony of the Church, and so the Church not chargeable with the abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hamon-l-estrange.html">Hamon L’Estrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Alliance of Divine Offices, exhibiting all the Liturgies of the Church of England since the Reformation as also the late Scotch Service-Book</cite>, [1637], with all their Respective Variations: and upon them all Annotations, Vindicating the Book of Common-Prayer from the Main Objections of its Adversaries… (London, 1659), Annotations upon ch. 11, p. 317</span></figcaption>

lank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. …The apostle tells us there must be nudatio capitis, our heads must be uncovered. The wearing of a cap, pileo donari, among the Romans, was peculiar to free men only, and an hieroglyphic of honor, for once if a man cepisset pileum, he was free, and when he laid aside his cap, he was said deponere magnificentiam, to lay aside his honor and privilege whereby he was distinguished from a servant. So then, as servants are to be uncovered in their master’s service, so are we to be in God’s: and therefore Saint Paul (in the place before cited) tells us that it is a shame for a man to have his head covered at that time. … But in this point corruption is crept into our Church. Instead of humbling ourselves by prostration and kneeling, we are pleased to sit at our ease, and that in a proud manner: instead of the depositio magnificentiae, et nudatio capitis, kneeling and uncovering our heads, we sit, and with our heads covered too; this is not to enquire, at least not to imitate, the days of old… This sedentary prayer and proud fashion of covering the head cannot be warranted by any text in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large</cite>, … (d. 1626; London, 1650), 2nd Commandment, ch. 7, pp. 215, 217</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. …The apostle tells us there must be nudatio capitis, our heads must be uncovered. The wearing of a cap, pileo donari, among the Romans, was peculiar to free men only, and an hieroglyphic of honor, for once if a man cepisset pileum, he was free, and when he laid aside his cap, he was said deponere magnificentiam, to lay aside his honor and privilege whereby he was distinguished from a servant. So then, as servants are to be uncovered in their master’s service, so are we to be in God’s: and therefore Saint Paul (in the place before cited) tells us that it is a shame for a man to have his head covered at that time. … But in this point corruption is crept into our Church. Instead of humbling ourselves by prostration and kneeling, we are pleased to sit at our ease, and that in a proud manner: instead of the depositio magnificentiae, et nudatio capitis, kneeling and uncovering our heads, we sit, and with our heads covered too; this is not to enquire, at least not to imitate, the days of old… This sedentary prayer and proud fashion of covering the head cannot be warranted by any text in Scripture.”

— Lancelot Andrewes, The Pattern of Catechistical Doctrine at Large, or a Learned &amp; Pious Exposition of the Ten Commandments… (d. 1626; London, 1650), 2nd Commandment, ch. 7, pp. 215, 217">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+%E2%80%A6The+apostle+tells+us+there+must+be+nudatio+capitis%2C+our+heads+must+be+uncovered.+The+wearing+of+a+cap%2C+pileo+donari%2C+among+the+Romans%2C+was+peculiar+to+free+men+only%2C+and+an+hieroglyphic+of+honor%2C+for+once+if+a+man+cepisset+pileum%2C+he+was+free%2C+and+when+he+laid+aside+his+cap%2C+he+was+said+deponere+magnificentiam%2C+to+lay+aside+his+honor+and+privilege+whereby+he+was+distinguished+from+a+servant.+So+then%2C+as+servants+are+to+be+uncovered+in+their+master%E2%80%99s+service%2C+so+are+we+to+be+in+God%E2%80%99s%3A+and+therefore+Saint+Paul+%28in+the+place+before+cited%29+tells+us+that+it+is+a+shame+for+a+man+to+have+his+head+covered+at+that+time.+%E2%80%A6+But+in+this+point+corruption+is+crept+into+our+Church.+Instead+of+humbling+ourselves+by+prostration+and+kneeling%2C+we+are+pleased+to+sit+at+our+ease%2C+and+that+in+a+proud+manner%3A+instead+of+the+depositio+magnificentiae%2C+et+nudatio+capitis%2C+kneeling+and+uncovering+our+heads%2C+we+sit%2C+and+with+our+heads+covered+too%3B+this+is+not+to+enquire%2C+at+least+not+to+imitate%2C+the+days+of+old%E2%80%A6+This+sedentary+prayer+and+proud+fashion+of+covering+the+head+cannot+be+warranted+by+any+text+in+Scripture.%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+The+Pattern+of+Catechistical+Doctrine+at+Large%2C+or+a+Learned+%26+Pious+Exposition+of+the+Ten+Commandments%E2%80%A6+%28d.+1626%3B+London%2C+1650%29%2C+2nd+Commandment%2C+ch.+7%2C+pp.+215%2C+217&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa989aad450.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a989aad450.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=The%20apostle%20tells%20us%20there%20must,warranted%20by%20any%20text%20in%20Scripture&amp;text=The%20apostle%20tells%20us%20there%20must%20be%20nudatio&amp;text=cannot%20be%20warranted%20by%20any%20text%20in%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-3fa18d27c5" data-kw="">
<blockquote><p>The first [way] argues that the existence, even for an instant, of composites of act and potency presupposes the simultaneous existence of that which is pure act; the second argues that the existence, even for an instant, of composites of essence and existence presupposes the simultaneous existence of that which is being or existence itself; the third argues that the existence, even for an instant, of composites of form and matter presupposes the simultaneous existence of an absolutely necessary being; the fourth argues that the existence, even for an instant, of things which are many and come in degrees of perfection presupposes the simultaneous existence of something one and absolutely perfect; and the fifth argues that the existence, even for an instant, of finality or directedness toward an end presupposes the simultaneous existence of a supreme ordering intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 5, ‘Existential Inertia &amp; the Five Ways’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-32d4291ae7" data-kw="">
<blockquote><p>[Thomas, Summa, pt. 1, quest. 25, art. 2:] Reply to second objection. ‘Even if it were to produce no effect, the power of God would not be ineffectual: because a thing is ineffectual which is ordained to an end to which it does not attain. But the power of God is not ordered toward its effect as toward an end; rather it is the end of the effect produced but it.’ St. Thomas in this reply observes that ‘the power of a univocal agent is wholly manifested in its effect. The generative power of man is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect,’ just as the power of the sun is not wholly manifested, for instance, in the ripening of the fruits of the earth. But God evidently is not a univocal agent. ‘Hence his effect is always less than his power.’ Nevertheless His infinite power is manifested in the mode of producing things, inasmuch as He produces something out of nothing, or from no presupposed subject. Analogically we say that men of great genius are superior to the works they produce; but it is, nevertheless, in the way they produce these works that their superiority is seen. On the contrary, men of ordinary ability are, so to speak, univocal agents, and the whole of their power is manifested in the effect produced. They could not do more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The One God: a Commentary on the First Part of St. Thomas’ Theological Summa</cite>, (Herder Book Co., 1943), ch. 25, p. 721</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>The philosophers, among whom was Aristotle, because being devoid of revelation, they could not reach to the first man, thought of an infinite subordination of men, and at the same time, of the eternity of the world. Democritus is reported to have stated that men crawled forth from the earth like maggots. Epicurus said that man was a composite of the fortuitous confluence of atoms, and in addition that they arose from the earth like fungi, and are daily animated by the certain position of the stars. Paracelsus [d. 1541], besides the human posterity of Adam, numbered four other non-Adamic races of men, and assigned them to each of the elements…</p></blockquote>

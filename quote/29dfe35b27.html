<main class="wrap"><figure class="quote" id="q-29dfe35b27" data-kw="">
<blockquote><p>Question: Is it lawful to drink wine, or other strong drink, or to eat delicates and dainties on the Sabbath or no? Answer: If men have these things provided, and ready at hand of their own, or in the house where they are on the Sabbath, they may use them on the Sabbath; so as they use them moderately, and for the better enabling of them to perform holy duties both in public and private. Eccl. 10:17, Solomon would haue princes to eat in time, and for strength, and not for drunkenness. Much more then other men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind touching Matters Moral which Himself Uttered in Ten Words, or Ten Commandments… (London: 1625)</cite>, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>§20. For private duties, both personal and domestic, they are either antecedent or consequent to the solemn public worship, as usually for time it is celebrated amongst us. These consisting in the known religious exercises of prayer, reading the Scripture, meditation, family instructions from the advantage of the public ordinances, they are to be recommended unto every one’s conscience, ability, and opportunity, as they shall find strength and assistance for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitation XL, ‘The Practical Observance of the Lord’s Day’ in Commentary on Hebrews (d. 1683), vol. 1 (of 4)</cite>, p. 750</span></figcaption>

<blockquote><p>…that we remember especially to put all things in practice which we have learned out of the Word, and that we begin upon that very day to do all duties of love unto men, and that we show mercy vnto them then especially. Whereunto that we might be made the more fit, the whole worship of God, and the Sabbath itself is ordained, in so much that the Lord would have every whit of it to cease even upon the Sabbath, rather than mercy should not be showed to the full, or any duty of it neglected to our brethren, when both of them cannot be done together, as we have seen it before more at large.</p></blockquote>

</figure><figure class="quote" id="q-db1e438acd" data-kw="">
<blockquote><p>9. The strong, violent and firm persuasions of conscience in single persons, or in some communities of men, is not a sufficient indication of a moral law. The weak brother of whom St. Paul speaks durst not eat flesh, but thought it an impiety next to unpardonable, but he was abused: and there are at this day some persons, some thousands of persons against whose conscience it is to dress meat upon the Lord’s Day, or to use an innocent permitted recreation: Now when such an opinion makes a sect, and this sect gets firm confidents and zealous defenders, in a little time it will dwell upon the conscience as if it were a native there, whereas it is but a pitiful inmate and ought to be turned out of doors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience… (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook.</cite>, pp. 370-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

tml&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db1e438acd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=9.%20The%20strong%2C%20violent%20and%20firm,to%20be%20turned%20out%20of%20doors." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-378a173592" data-kw="">
<blockquote><p>If the smelter in a foundry takes several days to reach its proper temperature, then it cannot be shut down every Lord’s day without shutting down the whole steel industry. Thus, at least a minimal crew is needed to keep the operation running through Sunday. But the benefits of steel for mankind (e.g., safer cars and buildings, the need for steel for the military) render it a necessity (wooden sailing ships would not have fared well against Japanese destroyers in the battles of the Pacific). Another example would be certain types of shipping. An oil tanker could not reach Japan from a port in Alaska in less than a week and thus would be in transit on the Sabbath (the shipping of oil is a necessity, since energy is needed for large populations to heat buildings and for generating electricity). God does not require people to deforest the countryside or freeze to death in order to keep the Sabbath. Power and electric utilities and telephone companies must maintain service on the Lord’s day. Hospitals, churches, homes, retirement communities and nursing homes need heat and electricity to preserve life and minister to the sick… The percentage of people working on the Lord’s day should be very small compared to those who work on a given week day. The vast majority of economic activities on the Sabbath in America are totally unnecessary and sinful (e.g., shopping malls, sporting events, restaurants, movie complexes, newspapers, retail outlets). Those industries which require sabbath labor should rotate staff…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath &amp; Modern Industrial Civilization: A Critique of Gary North’s ‘The Economics of Sabbath Keeping” (1999) 6 pp.</cite>, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

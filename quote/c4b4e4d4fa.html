<main class="wrap"><figure class="quote" id="q-c4b4e4d4fa" data-kw="">
<blockquote><p>XXIII. The subject for whom Paul prays [in Col. 1:3] is the Colossians. He says that he prays for them, that is, he requests from God all necessary goods and commends their salvation to Him… For just as the living offer prayers for the holy living, so they are commanded by God… XXXIV. From this, we learn that not only for ourselves but also out of a sense of affection and mutual embrace, as members of one mystical body, we should pray to God for others. However, we should pray for the living, not the deceased. Just as Paul did not pray for the deceased Colossians but for the living ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e7af8bda4" data-kw="">
<blockquote><p>Fenner’s style is fervent and emphatic. Fittingly, repetition and parallel construction, which lend themselves well to this sort of address, are frequent and noticeable. In addition, Fenner makes abundant use of examples and illustrations to make certain complicated points clear and memorable for his audience. These illustrations, which derive from sources as diverse as (for example) Aesop’s tales, Scriptural narratives, the church fathers, and the natural world, are in addition to his main prose narrative exhortation. Further, he employs specific Scripture passages from which he draws his doctrine and practice, and makes frequent use of lists.” – Amy Gant ‘The Second Sermon of the Use &amp; Benefit of Divine Meditation’ (1665) Bridge, William ‘The Sweetness &amp; Profitableness of Divine Meditation Buy (1667) 19 pp. p. 124 of volume three of his works, a sermon on Ps. 104:34, “My meditation of him shall be sweet: I will be glad in the Lord</p></blockquote>

</figure><figure class="quote" id="q-6c904d3d89" data-kw="">
<blockquote><p>We prefer public prayers made by the congregation in the church before private prayers, not because of the place, but in respect of the congregation, whose prayers jointly altogether are more fervent and effectual than the prayer of one man… Argument 1. The promise of our Savior is general, ‘Wheresoever two or three are gathered together, I am in the midst amongst them,’ Mt. 18:20.</p></blockquote>

</figure><figure class="quote" id="q-f3f8afa285" data-kw="">
<blockquote><p>Oh, all you who know and delight in this King, observe all this. Let it wound your heart; let your soul bleed; and for sorrow let your eyes cry rivers of tears by reason of the fact that this glorious King of His Church is thus despised and scorned. Pray continually for Him (Ps. 72:15) and to Him, that He would reveal Himself to His Church as King before the eyes of the entire world. ‘Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that dwellest between the cherubims, shine forth. Before Ephraim and Benjamin and Manasseh stir up thy strength, and come and save us’ (Ps. 80:1-2).</p></blockquote>

<blockquote><p>We tell you prayers and praises are natural worship, considered merely as such: likewise there are indifferent occasional acts attending natural worship; as suppose, lifting up the hands or eyes to God in prayer, or in an usual ejaculation, or holy meditation.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9751d48fc" data-kw="">
<blockquote><p>If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [Aberdeen] Doctors); this is the doctrine of the Jesuits, Suarez, Thomas, Sanchez and Gregory de Valentia [all Romanists]… when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be… against God’s commandment, and know that human authority commands the contrary, and am persuaded it is indifferent, and a positive commandment of men, if the Church’s determination be here to sway my conscience, to practice is to me blind obedience, for human authority as it is such, gives no light.” Divine Right of Church Government (1646), Dispute Touching Scandal, Question 4, p. 43 When you seek reasons for what is going on and the only answers you get are of the kind, “The elders have determined…”, “This was the counsel of the presbytery,” “The principal clerk believes…” this is all directing you to trust persons without it being established in God-given reason. Take a cue from common life: persons that insist on you trusting them are the last persons you should trust. Trustworthy persons freely give their reasons precisely because they understand them as the grounds of the rightness of the action. Persons always (silently) trying to gain your confidence, are manipulators. . Unanimity The church leadership is geared towards being unanimous in their decisions and actions in order to give a united front (notice the disparity here with the people). They may do things unanimously or not at all. With time, of course, this puts pressure on all the elders to agree, even in situations that aren’t so cut and dry. And if they all do, you should too. “Look, all the elders are unanimous on this.” This is especially compelling under the (pressurized) lingo and mantra of Church unity, which really fits well with cultic characteristics. Cults thrive on the principle that the leadership’s will is God’s will, just like under the Papacy. In presbyterianism that may fly under the flag of a misinterpreting and mishandling of Mt. 18:18, “Whatsoever ye shall bind on earth shall be bound in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cultic-characteristics.html">Cultic Characteristics</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Smaller, Celebrity or Personality Culture &amp; Implicit Faith | If you observe in the congregation not just a rational trust in your pastor and elders, but an implicit faith by many in much or most of what they say or do, especially when there is contrary evidence, you are not in a safe position. But elders should be honored and revered, and therefore if there is uncertainty, their determination settles the matter, right? Samuel Rutherford:</cite></span></figcaption>

</figure><figure class="quote" id="q-50c5c02faf" data-kw="">
<blockquote><p>That the [Anglican] Ceremonies are a great hinderance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about… departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple… Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pt. 2, ch. 4, ‘That the Ceremonies are Inexpedient Because they Hinder Edification’ in The English-Popish Ceremonies... (1637), pp. 19-22</cite>, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-26f022a668" data-kw="">
<blockquote><p>…but it [instituted worship] concerns those outward ways and means whereby God has appointed that faith, and love, and fear of Him to be exercised and expressed unto his glory. And this kind of worship, though it depend not upon the nature of God, but upon his free and arbitrary disposal, and so was of old liable unto alterations, yet God did ever strictly require in the several states and conditions that his Church has gone through in the world. And this is that, which most commonly in the Scripture is called by the name of the worship of God; as that whereby all the acceptable actings of the souls of men towards him are expressed, and the only way of owning and acknowledging Him in the world, as also of entertaining a visible intercourse with Him. This therefore He calls for, and requires indispensibly of all that draw nigh to Him, and that because He is the Lord our God, Rev. 14:6-7; Mt. 4:10; Dt. 10:12-13. For his observance hereof does He so approve of Abraham, Gen. 18:19, and sets it down as an everlasting Law unto all others that in a holy observation thereof He will be sanctified in all that draw nigh unto Him, Lev. 10:1-3. His commands also concerning it are multiplyed in the Scripture, with the approbation of all those that attend unto them. We may not think to find acceptance with God or to inherit the promises, if supposing ourselves to adhere unto Him in worship internal and natural, we neglect that which is external and of his free appointment: for besides, that we renounce thereby our inward dependance on Him also in not observing his commands, as Adam did in transgressing an institution, we become wholly useless unto all the ends of his glory in the world, which is not the way to come to an enjoyment of Him. Neither do we only express and profess our inward moral, natural worship of God hereby, by which means it becomes the principal way and instrument of faith and trust exerting themselves in our obedience, but also it is a most effectual help and assistance unto the principle of that natural worship, strengthening the habit of it, and exciting it unto all suitable actings, unto its increase and growth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God… (London: 1667) | Question 1</cite>, pp. 2-4</span></figcaption>

<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-addf886a5b" data-kw="">
<blockquote><p>I will make your cause better than you have made it, but not by making other men’s worse, but by opening the reconciling truth.

I. I shall tell you in what sense God’s will and decrees may and must be said to have an extrinsic cause, without change in God. (Predestinatio nihil ponit in praedestinato inquit [Predestination places nothing in the one who is predestined]; Aquinas, pt. 1, q. 23, art. 2)

      1. Know therefore that God’s essence is his will, but not as essence. To say that God is God, and that God wills this or that, are not terms of the same signification.

      2. God’s will is his essence denominated from some amiable good as the object; and so there is ever quid respectivum [in that respect] in the notion of will.

      3. As God wills Himself, the act being perfectly immanent, his will is called Himself much more properly than his will of things extrinsic (which is ever either effectively, or at least objectively transient), because it is God that wills, and that is willed or loved (which made many ancients say that this was the Third Person in the Trinity).

      4. But as God wills things ad extra [to things outside Himself], though it is his essence that so wills them, yet it is unfit to say simply that this will is God; e.g. that to will Peter’s salvation is God, because the name ‘will’ here includes the thing willed.

      5. And therefore when we speak of God’s will in the universal notion, as abstracted from all particular objects and acts, it is less inconvenient to say simply that this will is God than when we speak of his will in act ad extra. By this time you may see that though God’s will, as his essence, has no cause, yet his will as denominated extrinsically from the object may have some kind of cause, that is objective, which is quasi materia actus [the matter of the act, as it were], and the terminus sine quo non [end-without-which-nothing] (Alvarez himself says that by a ’cause’ he means also any objective condition or reason of the act); that is, God’s will is not denominated a complacency in Christ existent or in Peter regenerate, or his understanding a seeing that the world was good before any of these things did exist. (This is all that Ruiz’s reasons prove, Of the Will of God, disp. 115, sect. 4, p. 102, who says that there is more than extrinsic denomination; et relatio rationis quam realis formalitas [and a relation of reason rather than a real formality]. But he does but show by his quodammodo [in some way], that he knows not what to say.) So that by extrinsic denomination, without any change in God, He may and should be said de novo [of new] to know things to be existent, to be past, to will things as existent with complacency or will them with displicency: But not to will the futurity of men’s damnation de novo; but yet his will of the futurity of men’s damnation has several degrees of the objective cause, from whence it is denominated: As in esse cognito [known being], the person who is the object is in order of nature first a man, a subject, and then a sinner, and a despiser of mercy, and then a damnable sinner. And so these are indeed conditions in the object, or causae sine quibus non [causes without which nothing], or objective material-constituent causes, not in themselves, but the foresight of them, not of God’s will as his essence, nor of his will as a will, but of his will as extrinsically denominated: a decree to damn Judas, e.g. because no otherwise is Judas an object capable of giving such an extrinsic denomination to God’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, pp. 8-9</span></figcaption>

<blockquote><p>O you who are the framer of the lands and sky, who bid time to go forth from eternity, and, remaining stable, give all things to be moved; whom no external causes compelled to fashion the work of fluctuating matter, but the form of the highest good, inherent and without envy. You draw all things from a supernal example, yourself most beautiful, bearing a beautiful world in your mind, and forming it in a similar image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin | For just as an artisan acting outside himself looks at some exemplar, according to which he operates, and which he expresses in his work, conformably to that which is read in Ex. 25:40; Heb. 8:5, “Look that you make them after their pattern, which was showed you in the mount”: so God, beholding his own essence, the exemplar and fount of all perfections, and beholding the ideas or reasons of all things, expresses them as He pleases; which Boethius, On the Consolation of Philosophy, 3, metro 9, elegantly explains, saying:</span></figcaption>

<blockquote><p>But this negative will in God is nothing other than that act of the will by which, most perfectly willing himself, he is averse to everything adverse to him and to his glory, which is the only end of all things… He does this so thoroughly, that by most perfectly willing his own goodness, he is also most perfectly averse to whatever is adverse to him… Thus, God’s negative will is occupied with what is evil in its own nature, not only because it is adverse to the norm of acting set before it by God, but also [insofar as it has not been decreed] because it could not be directed by the power of the creatures to a truly good end… Even if an evil does not exist, or never will, God is still adverse to it, as it is inimical to his nature, since he would abolish and destroy it if it existed, just as he loves a good that will never exist, because, as it is congruent to his own goodness, if it existed he would conserve it, cherish it, and so forth.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-817228e1be" data-kw="">
<blockquote><p>Why then does James say that it was fulfilled? Even because he intended to shew what sort of faith that was which justified Abraham; that is, that it was not idle or evanescent, but rendered him obedient to God, as also we find in Heb 11:8. The conclusion, which is immediately added, as it depends on this, has no other meaning. Man is not justified by faith alone, that is, by a bare and empty knowledge of God; he is justified by works, that is, his righteousness is known and proved by its fruits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, James 2:23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/romans-and-james-reconciled.html">Romans and James reconciled</a></span><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/justified-before-god-and-before-men.html">Justified before God and before men</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec3c2e364e" data-kw="">
<blockquote><p>This is the same as though he had said, that we do not attain salvation by a frigid and bare knowledge of God, which all confess to be most true; for salvation comes to us by faith for this reason, because it joins us to God. And this comes not in any other way than by being united to the body of Christ, so that, living through his Spirit, we are also governed by him. There is no such thing as this in the dead image of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, James 2:14</span></figcaption>

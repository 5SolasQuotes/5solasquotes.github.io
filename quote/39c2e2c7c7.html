<main class="wrap"><figure class="quote" id="q-39c2e2c7c7" data-kw="">
<blockquote><p>I. Faith taken theologically in general is the assent which we give to God speaking, when we are certainly persuaded that something is true, moved to that by Divine Authority. And by this faith is distinguished from opinion, which is a timid and uncertain assent. Likewise from knowledge, which is indeed a certain assent; but one which rests on demonstration or some evident argument, not truly on anyone’s testimony. Finally, from human faith, which acquiesces in the authority of men.

II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Faith’, pp. 125, 131</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4fedbc9a0" data-kw="">
<blockquote><p>It will be said by such a believer that my change of view was too rationalistic, too cerebral, too bloodless, too focused on a theoretical knowledge of the God of the philosophers rather than a personal response to the God of Abraham, Isaac, and Jacob. But the dichotomy is a false one, and the implied conception of the relationship between faith and reason not only foolish but heterodox. As to the heterodoxy and foolishness of fideism, and the correct understanding of the relationship of faith and reason, I have addressed that set of issues elsewhere. As to the ‘heart versus head’ stuff, it seems to me to rest on an erroneous bifurcation of human nature. Man is a unity, his rationality and animality, intellect and passions, theoretical and moral lives all ultimately oriented toward the same end… …that does not mean that the will does not have a role to play. But that is true wherever reason leads us to a conclusion we might not like, not merely in matters of religion. And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>

</figure><figure class="quote" id="q-62bc35a5e2" data-kw="">
<blockquote><p>VIII. Third, the object of the justifying action:… (2) men (1 Tim. 2:5), not just any, but: … (d) called to receive the Redeemer and the conditions of redemption (Rom. 8:30; 1 Pt. 2:9–10); (e) regenerated and made alive (Eph. 2:5), illuminated in mind (Eph. 1:17–19), renewed in heart or will (Ezek. 36:26), so that they are able to submit to calling, and receive the Redeemer offered to them, and the terms of redemption; (f) converted (Jer. 31:18–19), so that through the power received in regeneration, they by faith actually receive God and the Mediator (Phil. 3:12), and turn themselves from their sins to righteousness (Jer. 31:19); (g) united with Christ, so that they possess, in none other than Christ, a righteousness not their own, but Christ’s, that which is through faith (Phil. 3:9; 1 Cor. 1:30; Acts 4:12). From these things can at the same time be perceived the order and procedure of God whereby he is accustomed to provide the justification of the miserable sinner. IX… whereby he calls the elect to receive the Redeemer given to them (2 Tim. 1:9), whereby he grants faith to them, by means of which they receive him (Phil. 1:29) and are united with him (Phil. 3:9), the same grace, I say, whereby he reckons and pronounces them righteous in Christ.</p></blockquote>

<blockquote><p>Faith thus receiving and resting on Christ and his righteousness, is the alone instrument of justification; yet it is not alone in the person justified, but is ever accompanied with all other saving graces, and is no dead faith, but worketh by love.</p></blockquote>

<blockquote><p>Justification is therefore defined as: A gracious action of God, by His mercy toward the Elect, without any work or merit of their own, on account of the satisfaction of Christ, apprehended by true faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d76ea58305" data-kw="">
<blockquote><p>…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, … upon… Deuteronomy... (London: Middleton, 1583), 143rd Sermon, p. 883</span></figcaption>

</figure><figure class="quote" id="q-e8a82d4739" data-kw="">
<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>

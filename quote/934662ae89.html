<main class="wrap"><figure class="quote" id="q-934662ae89" data-kw="">
<blockquote><p>Seventhly, that a community or whole society is more to beloved than any member of it, because the conjunction of a part with the whole is greater than with another party; and therefore, that a prince whose life and safety is necessary or most profitable for the common good, is more to beloved then any or divers of the common people, nay more then our selves in temporal things. 2 Sam. 21.17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The marrow of sacred divinity, drawn out of the holy scriptures, and the interpreters thereof</cite>, (London, 1643), p. 303.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-794391bb4a" data-kw="">
<blockquote><p>France discarded the Bible. The Almighty withdrew his restraining hand, and permitted a nation to try the experiment of living without religion. Human passions broke loose from moral responsibility, and flowed in torrents of pollution and blood. The world stood aghast, and trembled at the spectacle, and the result stands out in bold relief upon the records of that ill-fated kingdom. Let us mark it well, and remember the fearful denunciation of Jehovah: “Ye shall not commit any of these abominations, that the land spew not you out also, when ye defile it, as it spewed out the nations which were before you.”

The whole tribe of libertines are so many vultures upon the body politic. Religion, patriotism, domestic peace, and public tranquillity, are strangers to their bosoms. There is nothing lovely, nothing valuable on earth with which they are not at war. Beauty, health, reputation. The marriage covenant—that strong defence and glory of society and all the tender sympathies and relations of social life, wither and die under their blighting touch. One house of abandonment in a community, is worse than the cholera. The noxious miasma perpetually issuing from it, poisons all the fountains and streams of life. It is impossible to estimate its baneful influence upon private and public morals.

If the fire consumes your dwelling or merchandize, it is a loss which industry and economy will restore. If the pestilence removes our friends to another world, it permits them to leave behind a good name. If the pirate seizes upon his victim, he either kills or sends him adrift upon the high seas. If the robber or assassin enters a shop or family, they can at the most only take a little property, or the lives of a few individuals; and when the deed is committed, public indignation stands ready to burst upon them, and to hand them over to justice.

But the libertine—more horrible than the pestilence, the pirate, the robber, or the boa-constrictor—rushes from his ambush, throws his deadly coils around his victim, not to give repose in death, but to bury alive in the grave of infamy. In what a fearful condition must be that town or city, where such demons in human shape collect and roam at large! Where is safety or happiness in the midst of such prowling wolves, and, especially, when the public mind is overawed by their number and reputed respectability, and no voice dares utter a complaint—no Putnam dares enter the den?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clark-aiken.html">Samuel Clark Aiken</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moral Reform. A Sermon Delivered at Utica, on Sabbath Evening, February 16, 1834</cite>, (Utica NY: R. B. Shepard, 1834), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-96abc30f3e" data-kw="">
<blockquote><p>Assertion 2: All the goods of the subjects belong not to the king. I presuppose that the division of goods does not necessarily flow from the law of nature [which is more fundamental than the positive laws of society and kings], for God made man, before the Fall, lord of the creatures indefinitely [Gen. 1:26-30]; but what goods be Peter’s, and not Paul’s, we know not [from nature’s law]. But supposing man’s sin, though the light of the sun and air be common to all, and religious places [such as buildings for public worship] be proper to none [as they were provided in his day out of the public funds, by and for all], yet it is morally impossible that there should not be a distinction of meum et tuum, ‘mine and thine’; and the Decalogue forbidding theft, and coveting the wife of another man (yet is she the wife of Peter, not of Thomas, by free election, not by an act of nature’s law) does evidence to us, that the division of things is so far forth (men now being in the state of sin) of the law of nature, that it has evident ground in the law of nations [which is more specific and positive, being built upon the law of nature, but less fundamental than it]; and thus far natural, that the heat that I have from my own coat and cloak, and the nourishment from my own meat are physically incommunicable to any. But I hasten to prove the proposition: If I have leave to permit that, in time of necessity [which is more fundamental than positive, societal laws], all things are common by God’s law [as at Creation], [then] a man travelling might eat grapes in his neighbor’s vineyard, though he was not licensed to carry any [a]way. I doubt if David, wanting [lacking] money, was necessitated to pay money for the showbread, or for Goliath’s sword, supposing these to be the very goods of private men and ordinarily to be bought and sold. Nature’s law in extremity, for self-preservation, has rather a prerogative royal above all laws of nations and all civil laws than any moral king. In this meaning:

1. Any one man is obliged to give all he has for the good of the commonwealth, and so far the good of the king, inasfar as he is head and father of the commonwealth.

2. All things are the king’s, in regard of his public power to defend all men and their goods from unjust violence.

3. All are the king’s, in regard of his act of conservation of goods, for the use of the just owner.

4. All are the king’s in regard of a legal limitation, in case of a damage offered to the commonwealth. Justice requires confiscation of goods for a fault; but confiscated goods are to help the interested commonwealth, and the king, not as a man (to bestow them on his children) but as a king. To this we may refer these called bona caduca et inventa [goods fallen and found], things lost by shipwreck or any other providences…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, question 16, p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

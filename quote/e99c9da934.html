<blockquote><p>Q133 Therefore, explain fully this sanctification of ours in Christ. A133 Something is said to be sanctified which is segregated from common pollution, so that it is most pure, and wholly consecrated to God the greatest adversary of all filth. Therefore, in this way our nature is sanctified in Christ from the very moment of conception, and so He sanctifies us. Furthermore it happens in two ways. First, as I have said, we are reckoned righteous by the imputed righteousness of Christ fully before God, not in ourselves, but in Him to whom we are united through faith. So also I say that our persons, by the imputation of His perfect holiness and integrity, are reckoned holy and whole and thus acceptable to the Father, not in ourselves, but in Christ. Finally, the force and energy of this most pure holiness which is in the flesh of Christ, I say it flows also into us by the working of the Holy Spirit in us, so that we become holy in ourselves, that is, segregated from the defilements of this world, and we serve God in spirit and body; which benefit in the scriptures is often termed sanctification, regeneration, illumination, new man, new creature, and spirituality. Q134 Therefore, you say that this latter sanctification is not something outside of us, and is not ours by imputation alone, but is a new endowment truly ingrafted and clinging in us, by the mere grace of the heavenly Father, and by the power of the Holy Spirit, diffused in us. A134 I say so. Q135 Therefore, to what end is the other sanctification of our nature which is imputed to us? A135 Because this sanctification which is inherent in us is unfinished in us, as is apparent by the perpetual warfare between the flesh and the spirit in us, even in the best men. Therefore, in order that our persons might be acceptable to God, and consequently so that which comes forth from us might please Him (for the life of the saints is as a kind of continual offering up of oneself,* to which the apostle exhorted us), another sanctification must intervene; clearly, another which is most full and whole in Christ, in whom our most kind Father, looking, might acquiesce, He who is a perpetual enemy to all uncleanness, and is the most just and merciful. Q136 But why does He not completely sanctify us immediately? A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit. The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.37 37. Semi-Pelagianism was revived in the 16th Century by the Jesuit theologian Luis Molina, and emphasized man’s free will in obtaining his own salvation.</p></blockquote>

<blockquote><p>3. Though we must not conceive of God as of a human or corporeal shape, yet we cannot think of God without some reflection upon our own being. We cannot conceive Him to be an intelligent being, but we must make some comparison between him and our own understanding nature, to come to a knowledge of him. Since we are enclosed in bodies, we apprehend nothing but what comes in by sense, and what we in some sort measure by sensible objects. And in the consideration of those things, which we desire to abstract from sense, we are fain to make use of the assistances of sense and visible things: And therefore when we frame the highest notion, there will be some similitude of some corporeal thing in our fancy; and though we would spiritualize our thoughts, and aim at a more abstracted and raised understanding, yet there will be some dregs of matter sticking to our conceptions; yet we still judge by argument and reasoning, what the thing is we think of under those material images. A corporeal image will follow us, as the shadow does the body: While we are in the body, and surrounded with fleshly matter, we cannot think of things without some help from corporeal representations: Something of sense will interpose itself in our purest conceptions of spiritual things; for the faculties which serve for contemplation, are either corporeal, as the sense and fancy, or so allied to them that nothing passes into them but by the organs of the body; so that there is a natural inclination to figure nothing but under a corporeal notion, till by an attentive application of the mind and reason to the object thought upon, we separate that which is bodily from that which is spiritual, and by degrees ascend to that true notion of that we think upon, and would have a due conception of in our mind. Therefore God tempers the declaration of Himself to our weakness, and the condition of our natures. He condescends to our littleness and narrowness, when he declares himself by the similitude of bodily members. As the light of the sun is tempered, and diffuses itself to our sense through the air and vapors, that our weak eyes may not be too much dazzled with it: Without it we could not know or judge of the sun, because we could have no use of our sense, which we must have before we can judge of it in our understanding: So we are not able to conceive of spiritual beings in the purity of their own nature, without such a temperament, and such shadows to usher them into our minds. And therefore we find the Spirit of God accommodates himself to our contracted and teddered capacities, and uses such expressions of God, as are suited to us in this state of flesh wherein we are: And therefore because we cannot apprehend God in the simplicity of his own Being, and his undivided essence, he draws the representations of Himself from several Creatures and several actions of those creatures: As sometimes he is said to be angry, to walk, to sit, to fly; not that we should rest in such conceptions of Him, but take our rise from this foundation, and such perfections in the creatures, to mount up to a knowledge of God’s nature by those several steps, and conceive of him by those divided excellencies, because we cannot conceive of him in the purity of his own essence. We cannot possibly think or speak of God, unless we transfer the names of created perfections to Him; yet we are to conceive of them in a higher manner when we apply them to the Divine Nature, than when we consider them in the several creatures formally, exceeding those perfections and excellencies which are in the creature, and in a more excellent manner: as one says, “Though we cannot comprehend God without the help of such resemblances, yet we may without making an image of Him; so that inability of ours excuses those apprehensions of Him from any way offending against his Divine Nature.” These are not notions so much suited to the nature of God as the weakness of man: They are helps to our meditations, but ought not to be formal conceptions of Him. We may assist ourselves in our apprehensions of Him, by considering the subtilty and spirituality of air; and considering the members of a body, without thinking him to be air, or to have any corporeal member. Our reason tells us, that whatsoever is a body, is limited and bounded; and the notion of infiniteness and bodiliness, cannot agree and consist together: And therefore what is offered by our fancy should be purified by our reason.</p></blockquote>

ion+of+that+we+think+upon%2C+and+would+have+a+due+conception+of+in+our+mind.+Therefore+God+tempers+the+declaration+of+Himself+to+our+weakness%2C+and+the+condition+of+our+natures.+He+condescends+to+our+littleness+and+narrowness%2C+when+he+declares+himself+by+the+similitude+of+bodily+members.+As+the+light+of+the+sun+is+tempered%2C+and+diffuses+itself+to+our+sense+through+the+air+and+vapors%2C+that+our+weak+eyes+may+not+be+too+much+dazzled+with+it%3A+Without+it+we+could+not+know+or+judge+of+the+sun%2C+because+we+could+have+no+use+of+our+sense%2C+which+we+must+have+before+we+can+judge+of+it+in+our+understanding%3A+So+we+are+not+able+to+conceive+of+spiritual+beings+in+the+purity+of+their+own+nature%2C+without+such+a+temperament%2C+and+such+shadows+to+usher+them+into+our+minds.+And+therefore+we+find+the+Spirit+of+God+accommodates+himself+to+our+contracted+and+teddered+capacities%2C+and+uses+such+expressions+of+God%2C+as+are+suited+to+us+in+this+state+of+flesh+wherein+we+are%3A+And+therefore+because+we+cannot+apprehend+God+in+the+simplicity+of+his+own+Being%2C+and+his+undivided+essence%2C+he+draws+the+representations+of+Himself+from+several+Creatures+and+several+actions+of+those+creatures%3A+As+sometimes+he+is+said+to+be+angry%2C+to+walk%2C+to+sit%2C+to+fly%3B+not+that+we+should+rest+in+such+conceptions+of+Him%2C+but+take+our+rise+from+this+foundation%2C+and+such+perfections+in+the+creatures%2C+to+mount+up+to+a+knowledge+of+God%E2%80%99s+nature+by+those+several+steps%2C+and+conceive+of+him+by+those+divided+excellencies%2C+because+we+cannot+conceive+of+him+in+the+purity+of+his+own+essence.+We+cannot+possibly+think+or+speak+of+God%2C+unless+we+transfer+the+names+of+created+perfections+to+Him%3B+yet+we+are+to+conceive+of+them+in+a+higher+manner+when+we+apply+them+to+the+Divine+Nature%2C+than+when+we+consider+them+in+the+several+creatures+formally%2C+exceeding+those+perfections+and+excellencies+which+are+in+the+creature%2C+and+in+a+more+excellent+manner%3A+as+one+says%2C+%E2%80%9CThough+we+cannot+comprehend+God+without+the+help+of+such+resemblances%2C+yet+we+may+without+making+an+image+of+Him%3B+so+that+inability+of+ours+excuses+those+apprehensions+of+Him+from+any+way+offending+against+his+Divine+Nature.%E2%80%9D+These+are+not+notions+so+much+suited+to+the+nature+of+God+as+the+weakness+of+man%3A+They+are+helps+to+our+meditations%2C+but+ought+not+to+be+formal+conceptions+of+Him.+We+may+assist+ourselves+in+our+apprehensions+of+Him%2C+by+considering+the+subtilty+and+spirituality+of+air%3B+and+considering+the+members+of+a+body%2C+without+thinking+him+to+be+air%2C+or+to+have+any+corporeal+member.+Our+reason+tells+us%2C+that+whatsoever+is+a+body%2C+is+limited+and+bounded%3B+and+the+notion+of+infiniteness+and+bodiliness%2C+cannot+agree+and+consist+together%3A+And+therefore+what+is+offered+by+our+fancy+should+be+purified+by+our+reason.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+Several+Discourses+upon+the+Existence+%26+Attributes+of+God+%28London%3A+1682%29%2C+%E2%80%9CDiscourse+on+God%E2%80%99s+being+a+Spirit%E2%80%9D%2C+pp.+125-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fea53d8095e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ea53d8095e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perfect-being-theology/#:~:text=3.%20Though%20we%20must%20not%20conceive,should%20be%20purified%20by%20our%20reason&amp;text=3.%20Though%20we%20must%20not%20conceive%20of%20God&amp;text=our%20fancy%20should%20be%20purified%20by%20our%20reason" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness">
<blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 6.5</span></figcaption>

</figure><figure class="quote" id="q-9bf5ec5c6f" data-kw="">
<blockquote><p>§I. Sacred Scripture, of both the Old and the New Testament, exhorts and obliges man under the Covenant of Grace to perfection. In the Old Testament, God Himself addresses Abraham: Gen. 17:1, ‘Walk before Me, and be perfect;’… §II. ‘In the New Testament, Christ commands in Mt. 5:48, ‘Be ye therefore perfect, τέλειοι, even as your Father which is in heaven is perfect.’ Paul in 1 Cor. 2:6 says, ‘we speak wisdom among them that are perfect, τελείοις. Phil. 3:15, the same apostle stimulates himself and other Christians to perfection, ‘Let us therefore, as many as be perfect, τέλειοι, be thus minded.’ Col. 1:28, he professes that he and the other apostles announce Christ, so that we may present every man perfect, τέλειον, in Christ Jesus. Col. 3:14, he calls charity σύνδεσμον τῆς τελειότητος, the bond or chain of perfection. Col. 4:12, it is said of Epaphras that he is always striving in prayers for the Colossians, that they may stand perfect, τέλειοι, and complete, πεπληρωμένοι, in all the will of God… Heb. 5:14, the apostle says that strong meat belongs to them that are of full age (perfect), τελείων. §III. Examples of perfect men also occur in the sacred writings… Concerning Noah, God Himself testifies that he was a just and perfect man before him in his generations, Gen. 6:9, and walked with God without ceasing. Concerning Job, God Himself, addressing Satan, gives this sentence in chap. 1 &amp; 2, ‘Hast thou considered my servant Job, that there is none like him in the earth, תםָּ שׁאיִ , a perfect and an upright man, one that feareth God, and escheweth evil.’… §IV. Therefore, the term for Christian ‘perfection’ exists, which we can use without suspicion of heterodoxy, even if others, namely the Novatians and Pelagians, have abused it… Certainly, in the age of Justin Martyr [2nd century A.D.], the name of the perfect was so customary that in his Dialogue with Trypho he himself interprets to become perfect as to become a Christian. … §VI… Perfection is twofold: Legal and Evangelical. Legal is either absolute, or in a certain respect… §VII. Evangelical perfection, on the contrary, consists in the recognition of our misery, both corporal and spiritual, and the necessity of fleeing to the grace of God in Jesus Christ our propitiator, and in a sincere and ἀνυπόκριτος, that is, undisguised and serious and constant endeavor to serve and obey God, through the grace of the Holy Spirit, to be obtained from Him for that purpose by ardent prayers, according to all the commands of the Law, and according to all the faculties of the soul and body, and to grow and advance daily more and more in faith, charity, hope, and other Christian virtues, and to implore pardon for errors and lapses for the sake of the Mediator. §VIII. The former [legal] perfection is rightly called one of degrees, full, and absolute and consummate in all its parts. The latter [evangelical] is called a perfection of parts, inchoate, and in one word, sincerity. And it is such, either absolutely without respect to others who are more imperfect; or comparatively with respect to others who are more imperfect and less mature.</p></blockquote>

fies+that+he+was+a+just+and+perfect+man+before+him+in+his+generations%2C+Gen.+6%3A9%2C+and+walked+with+God+without+ceasing.+Concerning+Job%2C+God+Himself%2C+addressing+Satan%2C+gives+this+sentence+in+chap.+1+%26+2%2C+%E2%80%98Hast+thou+considered+my+servant+Job%2C+that+there+is+none+like+him+in+the+earth%2C+%D7%AA%D7%9D%D6%B8%D6%BC+%D7%A9%D7%81%D7%90%D7%99%D6%B4+%2C+a+perfect+and+an+upright+man%2C+one+that+feareth+God%2C+and+escheweth+evil.%E2%80%99%E2%80%A6+%C2%A7IV.+Therefore%2C+the+term+for+Christian+%E2%80%98perfection%E2%80%99+exists%2C+which+we+can+use+without+suspicion+of+heterodoxy%2C+even+if+others%2C+namely+the+Novatians+and+Pelagians%2C+have+abused+it%E2%80%A6+Certainly%2C+in+the+age+of+Justin+Martyr+%5B2nd+century+A.D.%5D%2C+the+name+of+the+perfect+was+so+customary+that+in+his+Dialogue+with+Trypho+he+himself+interprets+to+become+perfect+as+to+become+a+Christian.+%E2%80%A6+%C2%A7VI%E2%80%A6+Perfection+is+twofold%3A+Legal+and+Evangelical.+Legal+is+either+absolute%2C+or+in+a+certain+respect%E2%80%A6+%C2%A7VII.+Evangelical+perfection%2C+on+the+contrary%2C+consists+in+the+recognition+of+our+misery%2C+both+corporal+and+spiritual%2C+and+the+necessity+of+fleeing+to+the+grace+of+God+in+Jesus+Christ+our+propitiator%2C+and+in+a+sincere+and+%E1%BC%80%CE%BD%CF%85%CF%80%CF%8C%CE%BA%CF%81%CE%B9%CF%84%CE%BF%CF%82%2C+that+is%2C+undisguised+and+serious+and+constant+endeavor+to+serve+and+obey+God%2C+through+the+grace+of+the+Holy+Spirit%2C+to+be+obtained+from+Him+for+that+purpose+by+ardent+prayers%2C+according+to+all+the+commands+of+the+Law%2C+and+according+to+all+the+faculties+of+the+soul+and+body%2C+and+to+grow+and+advance+daily+more+and+more+in+faith%2C+charity%2C+hope%2C+and+other+Christian+virtues%2C+and+to+implore+pardon+for+errors+and+lapses+for+the+sake+of+the+Mediator.+%C2%A7VIII.+The+former+%5Blegal%5D+perfection+is+rightly+called+one+of+degrees%2C+full%2C+and+absolute+and+consummate+in+all+its+parts.+The+latter+%5Bevangelical%5D+is+called+a+perfection+of+parts%2C+inchoate%2C+and+in+one+word%2C+sincerity.+And+it+is+such%2C+either+absolutely+without+respect+to+others+who+are+more+imperfect%3B+or+comparatively+with+respect+to+others+who+are+more+imperfect+and+less+mature.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Inaugural+Historical-Theological+Disputation+on+Christian+Perfection%E2%80%99+%28Frankfurt%3A+Coepsel%2C+1698%29+34+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9bf5ec5c6f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9bf5ec5c6f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perfectionism/#:~:text=I.%20Sacred%20Scripture%2C%20of%20both%20the,are%20more%20imperfect%20and%20less%20mature&amp;text=I.%20Sacred%20Scripture%2C%20of%20both%20the%20Old%20and&amp;text=others%20who%20are%20more%20imperfect%20and%20less%20mature" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a0d64276a6" data-kw="">
<blockquote><p>Christ, therefore, justifies no man without also sanctifying him. These blessings are conjoined by a perpetual and inseparable tie. Those whom he enlightens by his wisdom he redeems; whom he redeems he justifies; whom he justifies he sanctifies.</p></blockquote>

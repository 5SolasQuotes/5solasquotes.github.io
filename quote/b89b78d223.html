<main class="wrap"><figure class="quote" id="q-b89b78d223" data-kw="">
<blockquote><p>The Law of Nature cannot direct us unto a supernatural end, as is acknowledged not only by our divines (Junius, De Politia Mosaica, ch. 1; Paraeus, Commentary on Rom. 1:19), but by Aquinas also (1a, 2a, q. 91, article 4). It only teaches us to seek and to do bonum, velut finem naturae, ‘such a good as is an end proportioned to Nature’ (Junius). All those precepts of the Law of Nature which we have spoken of, could never lead men to a supernatural good (Junius). It is only the Divine Law, revealed from God, which informs the minds of men with such notions as are supra naturam [above nature], and which may guide them ad finem supernaturalem [to a supernatural end].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (1637), pt. 3, ch. 9, ‘That the Lawfulness of the Ceremonies Cannot be Warranted by the Law of Nature’, p. 200</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45d4a14433" data-kw="">
<blockquote><p>24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments.

26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. …

29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter.

30. Universal calling to salvation neither was, nor is, nor will be.

31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

</figure><figure class="quote" id="q-245033b259" data-kw="">
<blockquote><p>…this very ignorance of God being connected in such people with the most extreme barbarity, is a pretty strong evidence that the knowledge of Him is natural to the mind. Some have been met with among these savage nations who could not reckon farther than the number ten; could any one hence deny that arithmetical ideas are not natural to mankind?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

— Jean-Alphonse Turretin, Dissertations on Natural Theology tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, p. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6this+very+ignorance+of+God+being+connected+in+such+people+with+the+most+extreme+barbarity%2C+is+a+pretty+strong+evidence+that+the+knowledge+of+Him+is+natural+to+the+mind.+Some+have+been+met+with+among+these+savage+nations+who+could+not+reckon+farther+than+the+number+ten%3B+could+any+one+hence+deny+that+arithmetical+ideas+are+not+natural+to+mankind%3F%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+Dissertations+on+Natural+Theology+tr.+William+Crawford+%28d.+1737%3B+Belfast%3A+Magee%2C+1777%29%2C+Theses+concerning+Natural+Theology+in+General%2C+p.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F245033b259.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/245033b259.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-theology/#:~:text=this%20very%20ignorance%20of%20God%20being,ideas%20are%20not%20natural%20to%20mankind&amp;text=this%20very%20ignorance%20of%20God%20being%20connected%20in&amp;text=that%20arithmetical%20ideas%20are%20not%20natural%20to%20mankind" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-740f6cf934" data-kw="">
<blockquote><p>But man is capable of knowing God from such creatures in three ways, as Denis says in The Divine Names. He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists. Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things. Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him. Men had such knowledge through the light of reason bestowed on them: ‘many say: O, that we might see some good! Lift up the light of your countenance upon us, O Lord’ (Ps 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Romans, ch. 1, bk. 6, sect. 115</span></figcaption>

</figure><figure class="quote" id="q-8394b46f2c" data-kw="insufficient">
<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.4</span></figcaption>

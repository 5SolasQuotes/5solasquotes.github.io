<main class="wrap"><figure class="quote" id="q-ee80ccc32f" data-kw="">
<blockquote><p>Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59</cite>, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7eca285d24" data-kw="">
<blockquote><p>All adult women would have had long hair, the only exceptions being women who habitually wore wigs, slaves who had had their own hair cut off to provide the hair for such wigs and possibly some priestesses, as well as women who had been ill… Women would not have appeared in public with short hair from choice. The hair was always worn pinned up, unless the woman wanted to show distress by not taking care of her appearance, such as at funerals.</p></blockquote>

</figure><figure class="quote" id="q-66a913b15c" data-kw="">
<blockquote><p>In the field, or in the bed, clothed with gown or cloak, when we pray or preach, are mere accidents and circumstances of praying and preaching, and we grant them to be variable and indifferent; howbeit, they admit of regulation-moral, and so are not simply indifferent; for to pray in the fields and streets, to be seen of men, is vain glory. But I hope they are not indifferent in your [Forbes’] meaning, as are surplice, holy-days, etc. For you will not say the Church may make laws that no prayers be but in the fields, no preaching except the preacher be clothed with a cloak. … 3. Place or habit does not constitute praying and preaching in their specific nature; that were a wonder, for their objects do constitute their nature, and their objects are God and God’s Word;</p></blockquote>

<blockquote><p>Argument 8. Common sense and nature itself, or natural inclination (so he calls settled custom, and agreeable to nature, in respect to what is comely) dictates that it is unseemly for a woman to pray uncovered, or that a man should wear long hair, and the contrary is decent: Therefore you observe no decorum when you behave yourselves otherwise.</p></blockquote>

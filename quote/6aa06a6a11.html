<main class="wrap"><figure class="quote" id="q-6aa06a6a11" data-kw="">
<blockquote><p>As suppose a Conspiracy be laid dark and deep, of which the dark night, some few dark souls and the powers of darkness are only conscious; secrecy is the life of the design, and the death of that person against whom the design is laid: Now it’s the glory of God first to bring to light, and then to bring to nought such a contrivance; and tho he has various ways to discover the hidden things of darkness, yet sometimes he uses this: He puts the conscience of one or more of the Conspirators upon the rack, and torture, and forces him to delate himself and his brethren in iniquity:

God keeps a key to every man’s heart and conscience, and when he pleases can open it, and reveal all that hell that is within. Thus the holy God put the conscience of the Arch-Traitor Judas upon the rack, Mat. 27.4. and forced him to cry out, I have sinned in betraying innocent blood. God never so far forsakes the most desperate wretch, but he keeps his hold, and can take faster hold of his conscience, and where he has no interest in the heart, yet there he maintains some authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vincent-alsop.html">Vincent Alsop</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God in the mount: A sermon upon the wonderful deliverance of His Majesty from assassination. The nation from invasion</cite>, (London: J. Barnes, 1696), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85240cd66f" data-kw="">
<blockquote><p>But there are churches which also, to a large extent, take worldly expediency as their rule; for in some churches, almost any person will be taken into membership, if he can but pay his way. Members of Secret Societies – such as Freemasons, Orangemen, Good Templars, &amp;c. – are quite welcome, although the whole spirit of the Bible is in direct antagonism to all Secret Societies.

The fundamental principle of that popular order, Freemasons, is in flat opposition to the law of love, as laid down by Christ in the New Testament. Freemasons love and do good to Freemasons; but Christ teaches that we should love and do good to all men. The good Samaritan was good and kind to the man who fell among thieves, although the man was not a Freemason; and neither the man nor the Samaritan knew anything at all about grips, signs, or secret pass-words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-9c67a990d8" data-kw="">
<blockquote><p>The requiring subscription to the 39 Articles is a great imposition: I believe them all myself, but as there are some which might be expressed more unexceptionably, so I think it a better way to let such matters continue to be still the standard of doctrine and to censure those who teach any contrary tenets, than to oblige all who serve in the Church to subscribe them. The greater part subscribe without ever examining them, and others do it because they must do it, though they can hardly satisfy their consciences about some things in them. Churches and societies are much better secured by laws than by subscriptions: it is a more reasonable as well as a more easy mode of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-burnet.html">Gilbert Burnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of his own Time</cite>, … new ed. (London: Orr, 1850), vol. 2, Conclusion, p. 904 Burnet (1643–1715) was a Scottish philosopher and historian, and Bishop of Salisbury.</span></figcaption>

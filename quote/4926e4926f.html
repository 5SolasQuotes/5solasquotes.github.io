<main class="wrap"><figure class="quote" id="q-4926e4926f" data-kw="">
<blockquote><p>Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-546eb0fd3d" data-kw="Merit">
<blockquote><p>There now can be no merit in man with God by works whatsoever, either of congruity or of condignity. (1) They are not undue, but due; for whatever we are and can do, all this we owe to God, whose debtors we are on this account called (Lk. 17:10; Rom. 8:12). (2) Not one is ours, but all are gifts of grace and fruits of the Spirit (Jam. 1:17; Phil. 2:13; 2 Cor. 3:5). (3) They are not perfect, but alloyed as yet by various impurities (Rom. 7:18; Gal. 5:17, 18; Is. 64:6). (4) They are not equal to future glory because there is no proportion between the finite and temporary and the infinite and eternal (Rom. 8:18; 2 Cor. 4:17). (5) The reward promised to them is purely gratuitous and undue and so to be expected not from the internal merit of the work and its intrinsic worth, but only from the most free estimation of it by the one who crowns it (Rom. 6:23; 4:4; 11:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.7</span></figcaption>

</figure><figure class="quote" id="q-96e9c4f20c" data-kw="">
<blockquote><p>That objection of Durandus would have force if God rendered the reward to good works out of commutative justice; but since God has decreed to give rewards to those who work well out of distributive justice, it is not necessary that we properly give him anything. For neither do those who run for the prize give anything to the king, and yet the king is bound to give the prize to him who has outstripped the rest in the race. Let it stand, therefore, that the good works of the just merit eternal life out of justice, and so ex condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-1d3367e33f" data-kw="">
<blockquote><p>Just as we say there is a certain merit ex congruo, so we shall say there is a certain reward ex congruo, which is owed rather of grace than of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-eca3f1de29" data-kw="">
<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

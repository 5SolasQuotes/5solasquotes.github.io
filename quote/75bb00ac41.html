</figure><figure class="quote" id="q-c81ef37003" data-kw="">
<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae. 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646) | Appendix, ‘An Introduction to the Doctrine of Scandal’, Question 4</cite>, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

"_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c81ef37003.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-guilt-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=6.%20If%20matters%20in%20their%20expediency,upon%20the%20wicked%20will%20of%20men." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d0cd79814c" data-kw="">
<blockquote><p>[4.] Calvin treating of Church-power, says well, ‘Non est igitur ecclesiae potestas in•…inita, sed subjecta verbo Domini, &amp; in eo quasi inclusa.’ (Institutes, bk. 4, ch. 8, sect. 4) That all Church-judicatories, whether congregational-elderships, or presbyteries or synods, whether provincial or national, or ecumenic, being constituted of men that are weak, frail and ignorant in part, are in their determinations fallible and subject to error, Isa. 40:6-8; Rom. 3:4; 1 Cor. 13:9,12. 5. That insofar as any of these do actually err and decline from the truth, they do insofar act without power and authority from Jesus Christ: They can do nothing (of themselves, they may do, but not by His commission and warrant) against the truth, but for the truth, 2 Cor. 13:8. The power which He has given them being to edification, and not to destruction, 2 Cor. 13:12. 6. Sad experience, almost in every generation, does teach us that Church-guides and Church-judicatories do oftentimes decline from the straight-ways of the Lord, and decree unrighteous decrees, and write grievous things which they have prescribed, Isa. 9:15-16; Jer. 8:8-9; Mal. 2:8-9; Jer. 2:8. And that whilst they are boasting of the authority given to them of God, and of their skill in the Law, and professing to walk according thereto, they are perverting the precious truths of God, and persecuting these who cleave thereunto, Jer. 18:18; Isa. 66:5; Jn. 7:48-49. 7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2. And that it is therefore both the duty and privilege of every Church-member, and of every inferior Church-judicatory, to examine by the judgement of discretion every thing which the Church-authority joins, whether it be agreeable or repugnant to the rules of the Word; and if after a diligent and impartial search, it be found repugnant, they are not to bring their consciences in bondage thereto; neither is the allowing and exercising of the judgement of discretion by inferiors, the setting them as judges over their superiors, or making them transgress the line, or limits of that due subordination and submission appointed unto them of God. Protestant divines in their writings, de judice controverstarum [on the judge of controversies] have fully answered this, and showed us that it does not make a private man or an inferior, judge of the sentences and decrees of his superiors, but only of his own actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (Edinburgh, 1658)</cite>, pp. 96-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

ne</a></div>

<blockquote><p>91. For the national synod ought to declare, and that with [the] greatest reverence, to the Magistrate the grounds of their sentence, and the reasons of their proceedings when he demands or enquires into the same, and desires to be satisfied: but if the Magistrate nevertheless do dissent, or cannot by contrary reasons (which may be brought, if he please) move the synod to alter their judgement, yet may he require and procure that the matter be again debated and canvassed in another national synod…</p></blockquote>

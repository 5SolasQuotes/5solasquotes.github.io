<main class="wrap"><figure class="quote" id="q-8be829877d" data-kw="">
<blockquote><p>[T]he Heathen Nations had lost the knowledge of the way of Salvation: something in Religion was handed down to them by tradition: and something particularly that had a reference unto Jesus Christ; especially Sacrifices: but the knowledge of the respect they had to him was quite worn out among them, and the light of nature is utterly deficient in this particular: that light is sufficient to discover to us that God is provoked with us, that knowledge flows from our understanding of the nature of God, and the experience which we have of our own sinfulness:

[B]ut the way of reconciliation does exceed the discovery of reason, the light of nature does not teach us that there is any way of reconciliation; much less does it teach us what it is: the light of nature may discover to us that many pretended ways of acceptance are delusions; for it is contrary unto reason to imagine that God will take up with such things: but to determine what is the way, is clearly beyond the most raised understanding of man without divine revelation, upon a supposition that there was a possibility of any other way of acceptance for sinners besides this by Jesus Christ (and I know no ground from Scripture to say that God was confined to this way; that he was necessitated if he would save sinful man, to take this course in order to his Salvation). It will unavoidably follow that the light of nature will leave man short of this knowledge: how can the light of nature reach the free determination of the Will of God?

[B]ut besides this the knowledge of the way of our acceptance with God through Christ does necessarily suppose the knowledge of those two great mysteries; that of the holy Trinity, and that of the Incarnation of the Son God, which do utterly surpass all the dictates of the light of nature: Flesh and blood reveals not those things, but the Father that is in Heaven, Mat. 16.17. hence the Gentiles were utterly mistaken as to this way of reconciliation; and as Paul speaks, became vain in their imaginations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied</cite>, (Boston MA: Samuel Phillips, 1687), pp 2-3.</span></figcaption>

<blockquote><p>1. Vos is very insightful and helpful for developing a Reformed natural theology.

2. Vos’s natural-theological method and underlying cognitive theory differ substantively from both that of Thomas Aquinas and even most Reformed scholastics (Voetius, Turretin, Maastricht, Charnock…). Associating Vos with Thomism (as Fesko seems to do in his Introduction) is inaccurate and amateurish.

3. Vos’s and Van Til’s accounts are fundamentally aligned. A main difference between Vos and Van Til is that Van Til makes the implanted knowledge of God a condition for the possibility of not only (i) the acquired knowledge of God but also (ii) knowledge of creatures—which Vos may not even disagree with. Non-Thomist elements in Vos’s natural theology—which also distinguish him from many Reformed scholastics:

1. Innate knowledge of God. The innate knowledge of God (i) involves a “thick” concept of God as absolute being (not a general concept of a highest being), (ii) is produced in all people by the Holy Spirit’s illumination, and (iii) is the principle of knowledge of God acquired through experience and inference.

2. Ontological argument. An adjusted form of the ontological argument is sound. It consists merely in drawing attention to the innate knowledge of God—not in deducing God’s existence from a concept of God’s essence (p. 52, n. 113; p. 56, n. 127).

3. Cosmological arguments. Arguments which simply prove that an uncaused cause exists are weak: They don’t prove that the cause must be an absolute being (p. 55, n. 124). The innate knowledge of God (as an absolute being) grounds our knowledge that every (non-absolute) effect requires a cause (p. 55, n. 127). Vos thinks that innate knowledge of God is a condition for the possibility of acquired knowledge of God, and he takes himself to be following Calvin here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Natural Theology</cite>, ed. J.V. Fesko, trans. Albert Gootjes</span></figcaption>

<blockquote><p>The reasons are: (1) the Scriptures frequently enjoin this judgment (Mt. 7:15; 16:6; Col. 2:8; 1 Thess. 5:21; Heb. 5:14); (2) the examples of the saints confirm it, as the Bereans (Acts 17:11) and the Corinthians (1 Cor. 10:15); (3) the design of Scripture teaches it (which is the perfection of the man of God in the knowledge of the truth and the conviction of gainsayers [2* Tim. 3:16; Tit. 1:9], which cannot be accomplished without it); (4) the use of reason is a strong proof because as the knowledge of the affirmation and negation of propositions and the doctrine of contradiction belong to it, so also must such a judgment. And unless we allow this, the widest door will be thrown open to all kinds of heretics and fanatics for introducing their fictions and monstrous opinions and we can never use any true contradiction. Sources of explanation.</p></blockquote>

<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>

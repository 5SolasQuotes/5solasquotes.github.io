<main class="wrap"><figure class="quote" id="q-4e5bae2cca" data-kw="">
<blockquote><p>For the power of faith, or rather of God in the Word and in the Sacraments from Whom we have faith, is such that it rises to Heaven; it does not make the body of Christ descend and return from Heaven, for He shall remain there until He comes to judge the living and the dead, as Scripture testifies (Acts 3:21); and faith does not wish, nor can wish to contradict this.

But this power is such that faith rises to Heaven in founding itself upon the promises of God; there, in all truth, it unites and, so to speak, incorporates to Christ those in whose heart it dwells. This is the reason why, in the liturgy which the early Church observed, this phrase was in use: “Lift up your hearts!” This was to exhort the believers not to linger over and cleave to the external signs, but rather to use them as ladders, to climb up to Christ who is in Heaven.</p></blockquote>

<blockquote><p>The Lord’s Supper is the other Sacrament of the New Testament; in which Christians that are of age, receive spiritually Christ’s body and blood sealed to them in the reception of Bread and Wine according to Christ’s institution. The Rules …

III. The outward matter thereof, or Signs, are Bread and Wine.

IV. The Supper is lame, without both Signs; and to rob the people of the Cup, is Sacrilege.

V. The inward matter is Christ, with all his satisfaction and merit.

VI. As it is Jewish superstition, to use unleavened Bread; so the Popish Penny-Wafers are superstitious relics.</p></blockquote>

</figure><figure class="quote" id="q-e2136d535e" data-kw="">
<blockquote><p>[I]f you are very despondent and leaning towards melancholy, and you proceed to partake of the Lord’s Supper, see to it that you do not dwell on the disturbing and unsettling thoughts regarding your sins and failures. To you who are in a state of despondency, we say that we do not wish to apply this rule categorically, as if they who partake of the Lord’s Supper should refrain from reflecting upon their sins.

On the contrary! We believe that if someone comes to the Lord’s Table in a somewhat sluggish and dull heart to be broken so that the balm of grace may be all the more effective (Matt. 12:20). Nevertheless, concerning you who are of a melancholy and weak disposition, we believe that now, namely, the time of preparation for the Lord’s Supper, is not the time to prune and carve even more, but rather that you should solely pursue the healing and refreshing of your soul.

The reason why you so frequently leave the Lord’s Table without fruit and joy is because you have been wrongly engaged, having focused more on your sins and abominations than on the grace of Jesus Christ. Such a melancholy reflections will so oppress you and engulf your heart that the sunshine of God’s comfort cannot penetrate. The best way for you and all that are of a similar disposition is but to cast your souls, as wounded and broken as they may be, before the cross of Christ, longing and craving for the sweet efficacy of His healing blood. Do so before you inflict new wounds in your soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), p. 31.</span></figcaption>

</figure><figure class="quote" id="q-6bd547e403" data-kw="">
<blockquote><p>And have this in your eye in all religious exercises, that by them you may be made more serious; and that the impressions of other holy exercises may be the deeper, and take the faster hold, let me advise young people that are sober-minded, to come betimes to the ordinance of the Lord’s supper. Let me press it upon them, not only as a duty they owe to Christ, but as that which will be of great advantage to themselves to strengthen their resolutions, with purpose of heart to cleave to the Lord.

Those who keep off from it, it is either because they know they are not sober-minded, or because they are not determined to continue so; but none of you will own either of those reasons. Delay not therefore by that most sacred solemn bond, to join your selves to the Lord in a perpetual covenant, never to be forgotten.</p></blockquote>

med Covenanter</a></div>
</figure><figure class="quote" id="q-e88d72a565" data-kw="">
<blockquote><p>4. Q. By what names is it usually known?

A. It is usually called the Lord’s Supper, the Eucharist, or the Communion.

5. Q. Why is it called the Lord’s Supper?

A. Because it was instituted by Christ immediately after he had eaten the Paschal Supper with his disciples, and is to be regarded by Christians as a feast in honour of their Lord.

6. Q. Why is it called the Eucharist?

A. Because it is an occasion of special and solemn thanksgiving to God for his goodness in giving up his own Son to death for our salvation—the term Eucharist being derived from a word which signifies thanksgiving.

7. Q. Why is it called the Communion?

A. Either because it is a communion with Christ the Saviour, or because it is a communion with one another as disciples of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-thomson.html">Andrew Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism for the Instruction of Communicants in the Nature and Uses of the Sacrament of our Lord’s Supper, and in the Doctrines and Duties connected with that Ordinance</cite>, (Edinburgh: William Ritchie, [1807]), p. 1.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-41b50b3756" data-kw="">
<blockquote><p>…ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean la Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 71-75 of Ch. 10, ‘Of Ecclesiastical Ordinances’ in The Christian Casuist: or, a Treatise of Conscience (London: 1705) La Placette (1629-1718) was a French Huguenot minister:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646) | Question 5</cite>, p. 59</span></figcaption>

</figure><figure class="quote" id="q-ef0d9d52f8" data-kw="">
<blockquote><p>We acknowledge not what Navarrus and Gregory say, that excommunication, whether just or unjust, is to be feared, for the curse causlessly does not fall. The sentence is either given out: [1.] a jure, vel ab homine, by the Law, or the persons. Secondly, it is either just or unjust. Thirdly, and that three ways: exanimo, [out of] good or ill zeal; secondly, ex causa, [out of] a just or unjust cause; thirdly, ex ordine [out of order], when order of law is kept. An unjust sentence is either valid or null. That which is invalid is either invalid through defect of the good mind of the excommunicators, and this is not essential to the excommunication’s validity. That which is invalid this way only, ligat, ‘it binds’ in foro exteriore [in the external court]. But that which is unjust through want [lack] of a just cause, it only binds from external communion; but because God’s ordinances are to be measured from their own nature, and the general intention of the catholic Church, and not from abuses and particular intentions of such excommunicators: therefore they do not exclude from the general Church-desires. The fourth Council of Carthage, as also Gerson says, an unjust sentence neminem gravare debet, ‘should affright no man’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1, ‘Of the Addition of Members to the Church’</cite>, pp. 279-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

t-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=We%20acknowledge%20not%20what%20Navarrus%20and,gravare%20debet%2C%20%E2%80%98should%20affright%20no%20man&amp;text=We%20acknowledge%20not%20what%20Navarrus%20and%20Gregory%20say&amp;text=sentence%20neminem%20gravare%20debet%2C%20%E2%80%98should%20affright%20no%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9f507a876f" data-kw="">
<blockquote><p>Nor is the right of examination founded in this—that we ought to believe ourselves wiser and more sagacious than entire synods and the whole true church; but in this—that since the privilege of infallibility has been granted by God to no church or pastor, nor are we certain whether they who compose ecclesiastical assemblies are members of the true church and faithful servants of God, who are partakers of the Holy Spirit and follow his guidance; nay, it can happen (and it has too often happened) that such assemblies have erred in their decisions. Hence no other means is left for the believer to know the legitimate authority of these assemblies and the decisions made by them with the certainty of faith, than a comparison and examination of them with the word of God, which he not only permits as possible and lawful, but commands as just and necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.34</span></figcaption>

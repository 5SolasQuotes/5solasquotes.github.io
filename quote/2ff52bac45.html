<main class="wrap"><figure class="quote" id="q-2ff52bac45" data-kw="Trinity fundamental Socinians">
<blockquote><p>The mystery of the Trinity is a fundamental article, necessary to the faith of all believers, so that not only the denial, but even the ignorance of it cannot consist with salvation. This the adversaries deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.24.6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6fcdad7bf1" data-kw="against Arian">
<blockquote><p>The Scriptures teach so frequently and so explicitly that the Son is God and eternal that to argue otherwise is to willfully ignore the clear light of evidence. Notable is Psalm 45, where, according to the Apostle in Hebrews 1, the Psalmist addresses Christ: &quot;Your throne, O God, is forever and ever; the scepter of your kingdom is a scepter of uprightness. You have loved righteousness and hated wickedness; therefore, God, your God, has anointed you with the oil of gladness beyond your companions.&quot; And in Isaiah 9:6, the Son is called &quot;Mighty God, Everlasting Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XIV</span></figcaption>

<blockquote><p>In the one divine essence are there three distinct persons: the Father, Son and Holy Spirit? We affirm against the Socinians.</p></blockquote>

</figure><figure class="quote" id="q-4e4c463168" data-kw="Sabellius Arius Socinus">
<blockquote><p>Thus Sabellius did not deny that they were three—the Father, the Son and the Holy Spirit—because Scripture says this; but he made one person of those three, calling them by various names by reason of diverse operation. Arius did not deny that Christ was God, but he understood him to be a factitious and dependent God. Socinus confesses Christ to be the Son of God, but with respect to office and power, not with respect to nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.20</span></figcaption>

</figure><figure class="quote" id="q-c30b609950" data-kw="Sabellius modalism">
<blockquote><p>Next Sabellius arose, who counted the names of Father, Son, and Holy Spirit, as almost nonentities; maintaining that they were not used to mark out some distinction, but that they were different attributes of God, like many others of a similar kind. When the matter was debated, he acknowledged his belief that the Father was God, the Son God, the Spirit God; but then he had the evasion ready, that he had said nothing more than if he had called God powerful, and just, and wise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.4</span></figcaption>

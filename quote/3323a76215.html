<main class="wrap"><figure class="quote" id="q-3323a76215" data-kw="">
<blockquote><p>Now all the question is, what Apostasy means the Apostle of? I am not ignorant how a great number of the old Latin fathers in the Church, understands this Apostasy to be meant of the defection of many Nations from the Empire of Rome. It is true indeed the Nations of the world fell away from the Roman Empire: But how well and rightly they understood this Apostasy of that falling away from the Roman Empire God knows. And it is a wonder that so many learned and quick spirited men should have erred together in this point so long: Indeed it is likely that when one of them fell in this error all the rest followed on in troups without further discretion or judgement. But I leave them.

What Apostasy is this then that the Apostle means of here? I shall tell you. It is an universal defection, not from an Emperor or earthly King, but from the King of Heaven Jesus Christ, and from his faith. This agrees with the course of this text and with that which follows immediately of the Antichrist the head of this Apostasy. This agrees with the speaking of this same Apostle in sundry other places. In the 1. Tim. chap. 4. verse 1. he foretells of this universal defection from the faith. The words are, The spirit speaks evidently that in the latter days some shall depart from the faith, and shall give heed to spirits of error and doctrine of devils, forbidding to marry, and commanding to abstain from meats which the Lord his ordained to be received with thanksgiving of them which believe.

There the sum of this defection whereof he speaks in this place. Look also the 2, Tim. chap. 3. vers. 1. 2. 3. In the latter days there shall be troublesome times, men shall be lovers of themselves, lovers of pleasures and not of God, corrupt in mind, reprobates concerning the faith: There the Apostasy from the faith. In that same Epistle chap. 4. verse 3. The time shall come when men shall not suffer to hear the sound doctrine, but according to their own lusts shall gather together heaps of teachers: to wit, orders of Monks, Friars, and heaps of Jesuits, and the rest of that profane and devilish rabble, that the devil by his spirit has thrust in on the people of God, and they shall avert their eyes from the truth and turn them to lies. Peter in his 2. Epistle chap. 2 verse 1. says, There shall be among you false teachers who shall bring in damnable heresies, and many shall follow them to their perdition. They shall goes to destruction with their Heresies, and many shall go after them.

And before them Christ himself foretold of this defection 18. chap. of Like verse 8, When, says he, the Son of man shall come, think ye he shall find faith on the earth? No, there be an universal defection. Then this universal defection is nothing else, but this Apostasy and defection from the faith of Christ that shall be before Christ’s coming in the world. Now ye see then this is a prophecy of the thing to come. Is this Prophecy fulfilled yet or not? Is it come to pass? Is that universal defection of the world from the church, from the faith of Christ come, or shall we look for it?

There is the question. I tell you, it is come, I cry it out, it is come, and come long since, and very long since; It holds on and shall hold on. Mahomet began it, when he drew away not only the people from the faith of Jesus, but also drew away the very name of Christianity, so as there durst not one avow himself to be a Christian. The Oriental Churches so well planted by the Apostles of Christ, whereof this Church of Thessalonica was one, may bear witness hereof. Who followed on? (Mahomet ended it not then) The Popes, that beast of Rome followed on.

As Mahomet played with the Oriental Churches: So the Papists played with the Wester and Occidental Churches. The Pope has drawn away this occidental Church of Christ in Europe, not indeed from the name and outward profession of Christ, for all are called Christians, but he has drawn them from the faith of Christ, without the which there can be no salvation. So this Apostasy prophesied so long before is come now to pass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), Part II, pp 56-57.</span></figcaption>

<blockquote><p>The papers on the other side blame Mr. Hamilton and his party as discouraging the men, and doing nothing but clamouring against those who were sent to the duke, and such as were for an accommodation; they allege, Mr. Hamilton, and these who were warmest, were soonest out of the field… but [the covenanters] were never able to make their horses face the cannon; and, in the wheeling, or taking up their ground, they fell foul upon some of their own men formed near them, and put them in some disorder: and those nearest them, seeing this, took it to be a flight, and the whole army fell into confusion, and fled; and one who was present there writes to me, Mr Hamilton was among the foremost, “leaving the world to debate whether he acted most like a traitor, coward, or fool.</p></blockquote>

</figure><figure class="quote" id="q-5d63c12f3b" data-kw="">
<blockquote><p>My Brethren and I, that have had Occasion here to confer about you, see a Beauty in the Providence of your being in Communion with the English Church; otherwise such great Confluences from among them, had not attended your Ministry, nor consequently received the Benefit, or reaped the Advantage by it, which so many of them have done.

And tho’ infinite Wisdom has made and may yet make this an alluring Bait to draw them forth; yet as England’s Reformation at first (from Popery and its superstitious and ceremonial Services) however great and glorious, was far from being to full as that of some other Protestant Churches, particularly that of Scotland; so we would fain hope, that, when a new and general Reformation shall be set on Foot, some more at least of the Rags of that Romish Church will be dropp’d, such as (abstracting at present from the Subject of Church-Government) many useless Rites and Customs relating to Worship, that have no scriptural Foundation.

This is what some of the most pious and eminent Divines of your Communion, have wished to see reformed, knowing that many of these were retained at first, only under a View of Reforming gradually, and from some prudential Considerations; and knowing also that the continued Retaining of these Things, which the reforming Fathers designed gradually to cast off, has been more stumbling to the Friends, than ever it was gaining to the Enemies of the Reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter from the Reverend Mr. Ralph Erskine to the Reverend Mr. Geo. Whitefield</cite>, (Philadelphia: B. Franklin, 1741), pp 5-6.</span></figcaption>

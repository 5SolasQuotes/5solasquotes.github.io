<main class="wrap"><figure class="quote" id="q-3476ba8153" data-kw="">
<blockquote><p>Though God by his grace must change the perverse disposition of men’s wills before they will make a gracious choice, yet it is most certain that the teachings, commands, exhortations and reproofs of God are directed to the will of man: And that the promises and threatnings, mercies and judgements are used to move and change the will: And that in the tenor of his laws and covenants, Christ has set life and death before men and put their happiness in their own choice; and that no man shall have better or worse than he made choice of: that is, none shall be either happy or miserable but as they did choose or refuse the causes of happiness or misery. And the reason of this is, because natural-free-will was part of the natural-image of God on Adam; and it is as natural to a man to be a free-agent as to be reasonable. And God will govern man as man agreeably to his nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 15, pp. 109-10</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8609c1b4f4" data-kw="">
<blockquote><p>The inability of sinful man is not… to be reckoned among those things which are absolutely impossible (adynata)… nor simplynatural (as that is natural from which we are called neither good nor bad; while this inability is certainly vicious and culpable); or as natural is contradistinguished from voluntary (as in a stone or brute there is a natural inability to speak). Our inability is in the highest degree voluntary; or as that is called natural which arises from a defect of natural faculty or power (such as the inability to see in the blind, to walk in the paralytic, to rise in the dead). Our inability does not exclude, but always supposes in man a natural power to understand and will… For although the phrase can in some measure be tolerated when understood of the natural power of willing (never taken away from us in whatever state we may be; as that by which we are distinguished from the brutes), still it cannot be admitted when we speak of the moral disposition of the will to good; not only to willing, but to willing well. Concerning this alone we dispute with our opponents…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, sections 39-40 of Question 4, ‘Whether the free will in a state of sin is so a servant of and enslaved by sin that it can do nothing but sin…’ in Institutes (P&amp;R), vol. 1, 10th Topic, pp. 681-83</span></figcaption>

<blockquote><p>§IX. As for what regards the definition of free will; the scholastics, at least the later ones, both the Thomists and the Scotists; also the Greeks, Lutherans, and Remonstrants, and not a few of the Reformed, define free will as the power or faculty by which, with all things requisite for acting being posited, the will can act or not act, this or that, and act otherwise. Some of the Reformed, however, define free will by rational preference, by which man does what he pleases, with a preceding judgment of reason. [e.g. Turretin] But many other of the Reformed—Francis Junius, Gerhard Johann Voss, Davenant, Johann and Louis Crocius, Louis le Blanc, William Ames, Robert Baron, Johann Strangius, Richard Baxter, D. Elias Grebenitz, D. Phil. Buchius, Dn. D. Samuel Strimesius, Pierre Jurieu—out of love for truth, antiquity and ecclesiastical peace, have preferred to retain that old and accustomed definition of free will; because it, in itself, and viewed without the abuse of the Pelagians and Semi-Pelagians, contains nothing evil or inconvenient. Following their moderation, we (with the principle always being saved, from whence free will receives or has its powers, and the mode of operation of divine grace) define free will thus: Free will is the active faculty of the will, by which the will, with all things requisite for acting being posited, can act or not act, this or that, and act otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707) 25 pp. Latin, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-5c96b5d161" data-kw="">
<blockquote><p>…yet this necessity of sinning, incident to all that are brought forth into the world, in massa peccati et perditionis, in the mass of original sin and perdition, is not such either in their, or our opinion, as whereby they cannot but sin; although they would abstain from it; though this be obtruded upon us as it was upon Remigius: whereupon he pleads for himself, and such as were of his mind in the doctrine of predestination after this manner, p 53: Nemo it a sentit aut dicit quod Dei praedestinatio aliquem invitum faciat peccare, ut jam non propriae voluntatis perversitate sed Divinae praedestinationis necessitate peccare videatur. ‘No man’ (says he) ‘does so think or speak as if God’s predestination made a man to sin against his will, in such sort as he should seeme to sin, not through the perverseness of his own will, but by the necessity of divine predestination.’ So say we; neither is this impotency of doing good, anywhere else, but in the corruption of the will, it being a moral impotency according to that of Saint Augustine, Libertas sine gratia non est libertas sed contumacia; ‘Liberty without grace, is not liberty, but wilfullness,’ and Remigius, Histor: Gottescal, p. 29, Ex quibus (says he) speaking of reprobates: Nemo potest salvari, non propter violentiam aliquam Divinae potestatis, sed propter indomabilem et perseverantem nequitiam suae iniquitatis. ‘Not one of them can be saved, not because of any violence of divine power, but by reason of the untameable and persevering naughtiness of their own iniquity.’ and p. 144: De reprobis nullum salvari ullatenus existimavi, non quia non possunt homines de bono ad malum commutari et de malis ac pravis boni ac recti fieri, sed quia in meliùs mutare noluerunt, et in pessimis operibus usque ad fiaē perseverare voluerunt. ‘None of the reprobates do we judge to be saved, not because they could not be changed from evil to good, and of evil and depraved become good and right, but because they would not be changed into better and would to the end persevere in wicked works.’ So then they could be changed but would not: But in what respect is it said they could be changed? was it in respect of the freedom of their wills without grace? Nothing less; see his own words, p. 34: Si dixisset generaliter, nemo hominum sine Dei gratia libero bene uti potest arbitrio, esset catholicus: ‘Had he said generally that no man can rightly use his free will, without the grace of God, he had been a catholic.’ But all the question is about the manner how this grace does work (to wit) whether God gives men grace to believe and repent if they will, and leaves to them to perform the act of faith and repentance; or whether God works the very act of faith and repentance, not to dispute of this point out of God’s Word, which clearly teaches that God works in us the will and the deed, according to his good pleasure, Phil. 3:13. And that he makes us perfect to every good work, working in us that which is pleasing in his sight through Jesus Christ. (Heb. 13:21) Let us take notice of the discourse between Hincmarus and Remigius on this argument that till the love of God comes, man is dead, his will is dead to that which is good. Now love is only given to the believers, posse charitatem habere naturae est hominum, charitatem autem habere gratiae est fidelium. (Of the Predestination of the Saints, ch. 5) For thus writes Hincmarus, p. 3.113: Bonum quod agimus et Dei est et nostrum, Dei per praevenientem gratiam, nostrum per subsequentē liberam voluntatem. ‘The good that we do is both God’s work and ours; of God by grace preventing, ours by free will following.’ To this Remigius answers and first he says Hincmarus discourses after such a manner as if a good work were partly God’s work and partly ours; and again as if the beginning of a good work were God’s, but the effect thereof of man’s free will; although as he (Hincmarus) does endeavor to temper this speech of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…yet this necessity of sinning, incident to all that are brought forth into the world, in massa peccati et perditionis, in the mass of original sin and perdition, is not such either in their, or our opinion, as whereby they cannot but sin; although they would abstain from it; though this be obtruded upon us as it was upon Remigius: whereupon he pleads for himself, and such as were of his mind in the doctrine of predestination after this manner, p 53: Nemo it a sentit aut dicit quod Dei praedestinatio aliquem invitum faciat peccare, ut jam non propriae voluntatis perversitate sed Divinae praedestinationis necessitate peccare videatur. ‘No man’ (says he) ‘does so think or speak as if God’s predestination made a man to sin against his will, in such sort as he should seeme to sin, not through the perverseness of his own will, but by the necessity of divine predestination.’ So say we; neither is this impotency of doing good, anywhere else, but in the corruption of the will, it being a moral impotency according to that of Saint Augustine, Libertas sine gratia non est libertas sed contumacia; ‘Liberty without grace, is not liberty, but wilfullness,’ and Remigius, Histor: Gottescal, p. 29, Ex quibus (says he) speaking of reprobates: Nemo potest salvari, non propter violentiam aliquam Divinae potestatis, sed propter indomabilem et perseverantem nequitiam suae iniquitatis. ‘Not one of them can be saved, not because of any violence of divine power, but by reason of the untameable and persevering naughtiness of their own iniquity.’ and p. 144: De reprobis nullum salvari ullatenus existimavi, non quia non possunt homines de bono ad malum commutari et de malis ac pravis boni ac recti fieri, sed quia in meliùs mutare noluerunt, et in pessimis operibus usque ad fiaē perseverare voluerunt. ‘None of the reprobates do we judge to be saved, not because they could not be changed from evil to good, and of evil and depraved become good and right, but because they would not be changed into better and would to the end persevere in wicked works.’ So then they could be changed but would not: But in what respect is it said they could be changed? was it in respect of the freedom of their wills without grace? Nothing less; see his own words, p. 34: Si dixisset generaliter, nemo hominum sine Dei gratia libero bene uti potest arbitrio, esset catholicus: ‘Had he said generally that no man can rightly use his free will, without the grace of God, he had been a catholic.’ But all the question is about the manner how this grace does work (to wit) whether God gives men grace to believe and repent if they will, and leaves to them to perform the act of faith and repentance; or whether God works the very act of faith and repentance, not to dispute of this point out of God’s Word, which clearly teaches that God works in us the will and the deed, according to his good pleasure, Phil. 3:13. And that he makes us perfect to every good work, working in us that which is pleasing in his sight through Jesus Christ. (Heb. 13:21) Let us take notice of the discourse between Hincmarus and Remigius on this argument that till the love of God comes, man is dead, his will is dead to that which is good. Now love is only given to the believers, posse charitatem habere naturae est hominum, charitatem autem habere gratiae est fidelium. (Of the Predestination of the Saints, ch. 5) For thus writes Hincmarus, p. 3.113: Bonum quod agimus et Dei est et nostrum, Dei per praevenientem gratiam, nostrum per subsequentē liberam voluntatem. ‘The good that we do is both God’s work and ours; of God by grace preventing, ours by free will following.’ To this Remigius answers and first he says Hincmarus discourses after such a manner as if a good work were partly God’s work and partly ours; and again as if the beginning of a good work were God’s, but the effect thereof of man’s free will; although as he (Hincmarus) does endeavor to temper this speech of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;”

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653) | Book 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, pp. 14-15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6yet+this+necessity+of+sinning%2C+incident+to+all+that+are+brought+forth+into+the+world%2C+in+massa+peccati+et+perditionis%2C+in+the+mass+of+original+sin+and+perdition%2C+is+not+such+either+in+their%2C+or+our+opinion%2C+as+whereby+they+cannot+but+sin%3B+although+they+would+abstain+from+it%3B+though+this+be+obtruded+upon+us+as+it+was+upon+Remigius%3A+whereupon+he+pleads+for+himself%2C+and+such+as+were+of+his+mind+in+the+doctrine+of+predestination+after+this+manner%2C+p+53%3A+Nemo+it+a+sentit+aut+dicit+quod+Dei+praedestinatio+aliquem+invitum+faciat+peccare%2C+ut+jam+non+propriae+voluntatis+perversitate+sed+Divinae+praedestinationis+necessitate+peccare+videatur.+%E2%80%98No+man%E2%80%99+%28says+he%29+%E2%80%98does+so+think+or+speak+as+if+God%E2%80%99s+predestination+made+a+man+to+sin+against+his+will%2C+in+such+sort+as+he+should+seeme+to+sin%2C+not+through+the+perverseness+of+his+own+will%2C+but+by+the+necessity+of+divine+predestination.%E2%80%99+So+say+we%3B+neither+is+this+impotency+of+doing+good%2C+anywhere+else%2C+but+in+the+corruption+of+the+will%2C+it+being+a+moral+impotency+according+to+that+of+Saint+Augustine%2C+Libertas+sine+gratia+non+est+libertas+sed+contumacia%3B+%E2%80%98Liberty+without+grace%2C+is+not+liberty%2C+but+wilfullness%2C%E2%80%99+and+Remigius%2C+Histor%3A+Gottescal%2C+p.+29%2C+Ex+quibus+%28says+he%29+speaking+of+reprobates%3A+Nemo+potest+salvari%2C+non+propter+violentiam+aliquam+Divinae+potestatis%2C+sed+propter+indomabilem+et+perseverantem+nequitiam+suae+iniquitatis.+%E2%80%98Not+one+of+them+can+be+saved%2C+not+because+of+any+violence+of+divine+power%2C+but+by+reason+of+the+untameable+and+persevering+naughtiness+of+their+own+iniquity.%E2%80%99+and+p.+144%3A+De+reprobis+nullum+salvari+ullatenus+existimavi%2C+non+quia+non+possunt+homines+de+bono+ad+malum+commutari+et+de+malis+ac+pravis+boni+ac+recti+fieri%2C+sed+quia+in+meli%C3%B9s+mutare+noluerunt%2C+et+in+pessimis+operibus+usque+ad+fiae%CC%84+perseverare+voluerunt.+%E2%80%98None+of+the+reprobates+do+we+judge+to+be+saved%2C+not+because+they+could+not+be+changed+from+evil+to+good%2C+and+of+evil+and+depraved+become+good+and+right%2C+but+because+they+would+not+be+changed+into+better+and+would+to+the+end+persevere+in+wicked+works.%E2%80%99+So+then+they+could+be+changed+but+would+not%3A+But+in+what+respect+is+it+said+they+could+be+changed%3F+was+it+in+respect+of+the+freedom+of+their+wills+without+grace%3F+Nothing+less%3B+see+his+own+words%2C+p.+34%3A+Si+dixisset+generaliter%2C+nemo+hominum+sine+Dei+gratia+libero+bene+uti+potest+arbitrio%2C+esset+catholicus%3A+%E2%80%98Had+he+said+generally+that+no+man+can+rightly+use+his+free+will%2C+without+the+grace+of+God%2C+he+had+been+a+catholic.%E2%80%99+But+all+the+question+is+about+the+manner+how+this+grace+does+work+%28to+wit%29+whether+God+gives+men+grace+to+believe+and+repent+if+they+will%2C+and+leaves+to+them+to+perform+the+act+of+faith+and+repentance%3B+or+whether+God+works+the+very+act+of+faith+and+repentance%2C+not+to+dispute+of+this+point+out+of+God%E2%80%99s+Word%2C+which+clearly+teaches+that+God+works+in+us+the+will+and+the+deed%2C+according+to+his+good+pleasure%2C+Phil.+3%3A13.+And+that+he+makes+us+perfect+to+every+good+work%2C+working+in+us+that+which+is+pleasing+in+his+sight+through+Jesus+Christ.+%28Heb.+13%3A21%29+Let+us+take+notice+of+the+discourse+between+Hincmarus+and+Remigius+on+this+argument+that+till+the+love+of+God+comes%2C+man+is+dead%2C+his+will+is+dead+to+that+which+is+good.+Now+love+is+only+given+to+the+believers%2C+posse+charitatem+habere+naturae+est+hominum%2C+charitatem+autem+habere+gratiae+est+fidelium.+%28Of+the+Predestination+of+the+Saints%2C+ch.+5%29+For+thus+writes+Hincmarus%2C+p.+3.113%3A+Bonum+quod+agimus+et+Dei+est+et+nostrum%2C+Dei+per+praevenientem+gratiam%2C+nostrum+per+subsequente%CC%84+liberam+voluntatem.+%E2%80%98The+good+that+we+do+is+both+God%E2%80%99s+work+and+ours%3B+of+God+by+grace+preventing%2C+ours+by+free+will+following.%E2%80%99+To+this+Remigius+answers+and+first+he+says+Hincmarus+discourses+after+such+a+manner+as+if+a+good+work+were+partly+God%E2%80%99s+work+and+partly+ours%3B+and+again+as+if+the+beginning+of+a+good+work+were+God%E2%80%99s%2C+but+the+effect+thereof+of+man%E2%80%99s+free+will%3B+although+as+he+%28Hincmarus%29+does+endeavor+to+temper+this+speech+of+his%2C+by+the+addition+of+grace%2C+not+by+the+fulness+of+it%3B+gratiae+adjunctione+non+etiam+plenitudine%2C+%E2%80%98by+the+adjunction+of+grace%2C+not+also+by+the+fulness+of+it.%E2%80%99+So+he+should+have+done%2C+says+Remigius%2C+cum+vere+totum+sit+Dei%3B+seeing+indeed+the+whole+is+God%E2%80%99s+work%3B+As+the+truth+itself+says%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+the+apostle%2C+%E2%80%98What+hast+thou+that+that+thou+hast+not+received%3F%E2%80%99+Whence+the+blessed+and+glorious+martyr+Cyprian+has+so+defined+it%2C+saying+we+must+glory+in+nothing%2C+seeing+nothing+is+ours%2C+and+concludes+thus%3A+Bonum+itaque+nostrum+totum+Dei+est%2C+quia+totum+est+ex+Deo%3B+et+nihil+boni+nostri%2C+nostrum+est%2C+quia+nihil+boni+nostri+est+ex+nobis.+%E2%80%98Therefore+our+good+works+are+wholly+God%E2%80%99s%2C+and+no+good+of+ours+is+ours%2C+because+it+is+not+of+us.%E2%80%99+And+to+reconcile+this+seeming+contradiction%2C+in+calling+it+our+good%2C+yet+denying+it+to+be+from+us%2C+he+concludes+thus%3A+omne+bonum+nostrum%2C+et+totum+Dei+est%2C+donando%3B+et+totum+nostrum+est%2C+accipiendo.+%E2%80%98Every+good+thing+of+ours+is+wholy+God%E2%80%99s+in+as+much+as+He+gives+it%2C+and+it+becomes+ours+full+and+whole%2C+for+as+much+as+we+receive+it.%27%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29+%7C+Book+2%2C+An+Examination+of+Certain+Passages+inserted+into+Mr.+Hord%E2%80%99s+Discourse%2C+Answer+to+the+Additions%2C+pp.+14-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5c96b5d161.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5c96b5d161.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=yet%20this%20necessity%20of%20sinning%2C%20incident,as%20much%20as%20we%20receive%20it&amp;text=yet%20this%20necessity%20of%20sinning%2C%20incident%20to%20all&amp;text=whole%2C%20for%20as%20much%20as%20we%20receive%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2) To evince to you the greatness and horridness of that sin [of not delighting in God]. Suffer yourselves therefore to be reasoned with to this purpose; and consider, first, that you have somewhat of delectation in your natures, that is, you have the power naturally inherent in you of taking delight in one thing or other… Therefore herein an act is not enjoined you which is incompetent to your natures, or simply impossible to you… …Yea, when you look into your disaffected hearts and find that you not only do not delight in God, but you cannot, and not for the want of the natural power, but a right inclination, should you not with astonishment bethink yourselves, every one for himself, ‘What is this that has befallen me? I am convinced this is the best good, every way most worthy of my highest delight and love, and yet my heart savors it not!&#x27;</p></blockquote>

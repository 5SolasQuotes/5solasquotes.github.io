<blockquote><p>It is hard to resist the conclusion that the inspired writers meant to convey the idea that the legislation at Sinai might be resolved into several codes. We believe that there were three, all differing in their predestined term of endurance. The ceremonial law is universally admitted to have fulfilled its function when Christ made his atoning sacrifice. The ordinary civil and criminal code of the Jews required to be adapted, like the corresponding laws in other countries, to the exact state of intellectual and moral development which the Hebrew nation had reached at the time of its promulgation, and necessarily became, in some particulars, antiquated whenever they rose above that position.

It is only in regard to the moral law, as summed up in the decalogue, that any dispute exists. It in several respects stood on a different footing from the remaining parts of the Mosaic law. While the other precepts were given to the people through the instrumentality of Moses, it was proclaimed from the top of Sinai by the voice of Jehovah himself, amid lightning, and thunder, and tempest, and every accompaniment fitted to inspire awe. While the other precepts were committed to whatever materials were then used for writing on, skins of animals perhaps, and were preserved, no one knows where, the decalogue was traced by the finger of God on two tables of stone, cut doubtless from the enduring granite of the mountain peak, and then laid up in the ark of the covenant in the holiest part of the tabernacle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-hunter.html">Robert Hunter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Literature of the Sabbath Question in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>9. The prime Positive Law of God is the Judicial Law, which God by the ministry of Moses, prescribed to the people of Israel, wherein the Lord was pleased to be the particular Lawgiver and Judge of that people, whom He had chosen from among all nations for a peculiar people to Himself, and to whose inclinations it is befitted. There are not a few who esteem the Judicial Law obliging unto all nations, mainly, because it does not appear in the Gospel, to be abolished as the Ceremonial Laws are, and because of its excellency beyond the laws of heathens, or other men, who might not only err in expediency, rendering their laws unprofitable, but also might make them unjust and inconsistent with the immutable moral Law of Nature; which reasons do sufficiently infer, that in the constitution of human laws, chief respect ought to be had to the Judicial Laws of God, and they assumed where the inclination of the people and their condition do not render them inconvenient. But that these laws were accommodat[ed] unto the Jews proper temper, is evident in the law concerning the bill of divorcement [Dt. 24:1-4], which bears, to be permitted for the hardness of their hearts; which was natural and peculiar to them, of jealousy and bitterness against their wives, therefore the Lord not only appointed trial, neither natural, necessary, nor accustomed elsewhere, by those tokens of virginity, for evidencing the wife’s unfaithfulness in not giving a polluted woman for a chaste [Dt. 22:14-20], but also the extraordinary and miraculous trial, by the water of jealousy [Num. 5:12-31], and therefore Christ did expressly abrogate that law [Mt. 5:31-32] and show us that Moses did not command to divorce, but for the hardness of their hearts only permitted it, and did command that when the husband would put away his wife, he should give her a bill of divorce, but it does not follow that the Judicial Law is in itself a Law to all nations, or that the Lord purposed it so to her, but on the contrair, it appears that his purpose was only to deliver it, for a peculiar Law to Israel, when He says, ‘What nation is so great that has statutes and judgments so righteous, as is all this Law, which I set before you this day,’ Dt. 4:8. And again ‘He shows his Word unto Jacob, his statutes and judgments to Israel, He has not dealt so with every nation, and as for his Judgments, they have not known them.’ Ps. 147:19 And therefore the same Law was not to Israelites and to strangers, even to proselytes; as appears in the matter of usury and bondage, which were allowed to strangers, but the former simply forbidden, and the latter limited as to Israelites: Neither is there any necessity of an express abolition of this Law in the Gospel, seeing it was not given to all nations; and it does yet bind the Jews so far as it does not build upon the Ceremonial Law: And therefore that part of the Judicial Law, which is founded upon, or conducible to the Moral Law may be well received by other nations, to whose inclination the same expediences will agree as most of the criminal laws are…</p></blockquote>

<blockquote><p>In this extract from The two sons of oil, Samuel B. Wylie explains how the civil government is to extend care and protection to the church. His application of Matthew 25:42, 45 to the state is a significant blow against Libertarian Theology, and suggests that the concept of the state not intervening in relief for the afflicted is an ungodly idea (but this is an aside):

The civil magistrate ought to defend and protect the Church of Christ. Isa. 49:23: “Kings shall be thy nursing fathers, and their queens thy nursing mothers,” &amp;c. Does not this imply protection? The metaphors selected by the Spirit of God, involve the highest possible care and tenderness. I know it has been objected by some, that the tender care and concern here intended is not official, but merely personal, as an individual member of the church. The reason assigned is, that the epithet involving concern is not confined to kings, but is common to all their queens: and this must be acknowledged to be unofficial. Sure none are exempted from being concerned about the interests of religion. The irrelevancy of the objection will appear, by attending to an observation formerly made, viz. that the commands of God are obligatory upon every one, in his respective station and department of life. Queens are bound to exercise all the influence, which in the providence of God is conferred upon them, in promoting the religion of Jesus. Kings, or civil magistrates, in like manner, are indispensably bound to exercise all the power which they possess in their stations, to promote the same desirable end. Whatever quantity of this power is kept back, is so much unliquidated debt due to the Messiah, by the express command of that God whom magistrates represent. Ps. 2:12: “Kiss ye the Son lest he be angry.” When Christ’s mystical body needs this power, and the magistrate withholds the benefit of it, does he not run the risk of being charged by Jesus at the last day, as we read, Matt. 25:42, 45 “I was an hungered, and ye gave me no meat; I was thirsty, and ye gave me no drink, &amp;c. Inasmuch as ye did it not unto one of the least of these my brethren, ye did it not to me.”

This same idea of protection, tenderness, and care, as a blessing to be expected in New Testament times, is held out, Isa. 60:10,16: “Kings shall minister unto thee,” and “thou shalt suck the breasts of kings.” All these passages evidently intimate, that the civil power shall be exercised in administering officially to the church, every comfort which may be expected to result from the union of magistratical authority and paternal care; such as defending her from her enemies, and securing to her all her privileges.

Moreover, when in 1 Tim. 2:2, we are commanded to pray for magistrates, the end proposed is, that the church and people of God, under the wing of their protection, “may lead quiet and peaceable lives in all godliness and honesty.” Either indifference, therefore, on the part of the state, toward the church, or an equal protection to her enemies, is notoriously incompatible with the ideas obviously contained in these sacred passages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 19-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

nd+of+that+God+whom+magistrates+represent.+Ps.+2%3A12%3A+%E2%80%9CKiss+ye+the+Son+lest+he+be+angry.%E2%80%9D+When+Christ%E2%80%99s+mystical+body+needs+this+power%2C+and+the+magistrate+withholds+the+benefit+of+it%2C+does+he+not+run+the+risk+of+being+charged+by+Jesus+at+the+last+day%2C+as+we+read%2C+Matt.+25%3A42%2C+45+%E2%80%9CI+was+an+hungered%2C+and+ye+gave+me+no+meat%3B+I+was+thirsty%2C+and+ye+gave+me+no+drink%2C+%26c.+Inasmuch+as+ye+did+it+not+unto+one+of+the+least+of+these+my+brethren%2C+ye+did+it+not+to+me.%E2%80%9D%0A%0AThis+same+idea+of+protection%2C+tenderness%2C+and+care%2C+as+a+blessing+to+be+expected+in+New+Testament+times%2C+is+held+out%2C+Isa.+60%3A10%2C16%3A+%E2%80%9CKings+shall+minister+unto+thee%2C%E2%80%9D+and+%E2%80%9Cthou+shalt+suck+the+breasts+of+kings.%E2%80%9D+All+these+passages+evidently+intimate%2C+that+the+civil+power+shall+be+exercised+in+administering+officially+to+the+church%2C+every+comfort+which+may+be+expected+to+result+from+the+union+of+magistratical+authority+and+paternal+care%3B+such+as+defending+her+from+her+enemies%2C+and+securing+to+her+all+her+privileges.%0A%0AMoreover%2C+when+in+1+Tim.+2%3A2%2C+we+are+commanded+to+pray+for+magistrates%2C+the+end+proposed+is%2C+that+the+church+and+people+of+God%2C+under+the+wing+of+their+protection%2C+%E2%80%9Cmay+lead+quiet+and+peaceable+lives+in+all+godliness+and+honesty.%E2%80%9D+Either+indifference%2C+therefore%2C+on+the+part+of+the+state%2C+toward+the+church%2C+or+an+equal+protection+to+her+enemies%2C+is+notoriously+incompatible+with+the+ideas+obviously+contained+in+these+sacred+passages.%E2%80%9D%0A%0A%E2%80%94+S.+B.+Wylie%2C+The+two+sons+of+oil%3B+or%2C+the+faithful+witness+for+magistracy+and+ministry+upon+a+scriptural+basis%2C+%281803%3B+York+PA%2C+2002%29%2C+pp+19-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3641a8235e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3641a8235e.html">Permalink</a><a class="src" href="https:/ <blockquote><p>Dr. Begg’s ministry in Paisley began under most trying circumstances, as much so as any with which a young minister ever had to contend. In 1832 there was a fearful outbreak of cholera, which visited many parts of the country, carried off many of all classes, and produced terror in the hearts of multitudes who escaped its actual attack. Probably on account of overcrowding and the want of sanitary arrangements, Paisley was one of the places which suffered most severely. The greater portion of the victims were of the destitute, enfeebled, and dissipated classes. But not all. The mansions of the higher classes were not exempt from the visitation. The strong and the fair were among the victims. The virtuous and the pious did not escape. In all faces were traces of deepest sorrow, mingled with the expression of anxiety and alarm. And there was more than simple sorrow, comfortless weeping for the dead because they were not. A strange madness took hold of the minds of the most ignorant portion of the people, and in some cases extended even to some of whom better things might have been expected. The medical men, who battled with the fell disease with all the courage and energy which are nobly characteristic of their profession, were regarded as its abettors. Every case which baffled their skill was regarded as a murder perpetrated by them. This strange and wicked delusion was, unhappily, not confined to Paisley, but it seems to have found there a peculiarly congenial soil.</p></blockquote>

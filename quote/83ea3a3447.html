<blockquote><p>11. Forasmuch as that religious adoration given by the Church of Rome to their pretended consecrated Host, has in its public service, and whenever it is carried in procession unto the sick for its sole foundation, this false supposition, that it is by the priest’s consecration properly made the self-same body which was taken out of the womb of the blessed Virgin by the Eternal Son of God, and united unto his Divine Person, unto which belongs, both before and since his incarnation, the empire of glory and religious worship, most strictly and properly so called, and not unto his humanity separated from it: That the Church of Rome neither renders to, nor requires for its consecrated host any other adoration than that of latria; and the professors of our religion are in this point of another faith, believing this host after consecration to be that very self-same insensible and inanimate matter which it was before, and cannot, if they will follow the dictates of their own consciences, and the prime fundamental verities of Christianity, ascribe divine adoration unto a thing which by nature is not God, nor transfer the glory of the Eternal God from Him unto the basest of creatures. This synod therefore does adjure all of them, by that profession they make of serving the Lord in purity and sincerity, and by that irreparable prejudice they do the truth by their rash and inconsiderate oppugning of it; and to their own consciences, which are shamefully betrayed by them; and to their countrymen of the Romish Communion, whom they confirm in their superstitions; and to the weaker Christians among ourselves, whom by such a vile example, utterly unbecoming that worthy Name that is called upbri them, they learn to prevaricate in religion, that they would once again return unto themselves, and mourn bitterly in the Presence of the Great God, and of our Savior Jesus Christ, for that by this sin of theirs they have profaned his glory. And the Synod ordains, that when as the host shall be carried in procession, or to the sick by those of the Romish Church, every one do withdraw himself from the sight of it, that so no scandal may be given unto their neighbors. And whereas some, who do not step out of the way, do feed themselves with this frivolous imagination, that they may tarry and see it, though they do not, as those of the Romish Church, let out their thoughts to a religious adoration of the host; yet if their bodily presence be voluntary at it, it is a kind of approbation of it. And whereas some, out of a sordid, servile spirit, do comply with the received custom in taking off their hats when as the host passes by, which, say they, is not for its sake, or any reverence to it, but only out of respect and honor to the curate or vicar who carries it, or of the persons which accompany it; this is sinful, because they do not conform themselves to their intention whom they pretend to gratify; and they yield only a civil salutation, where the Romish Church ordains religious worship to be paid and performed, bestowing it on another object besides that proposed by her; which acts of theirs are directly contrary to the received maxims of civility among all men, in that they honor, though not as the Church of Rome professes to do, the Lord of Glory, but in his Presence, and to his contempt, a priest, who says he is called to serve Him, and this in that very proper act of worship, yielded by him as he pretends unto his God. Besides, this is contrary to all Christian sincerity, which requires our actious to be true copies and transcripts of our hearts, and not fallacious feignings of that which is not only not in our intentions, but is formally contrary to them, which is a most mischievous trick and abuse put upon those who see and converse with them. Yea lastly, this is contrary to those glorious patterns and examples of the primitive and ancient Christians, who being in no wise able to brook such disguises, did repute and esteem them most sacrilegious impieties, and would rather expose themselves to many deaths, than to swerve from the least tittle of that fidelity and allegiance they had sworn unto God in their baptism. Wherefore this synod ordains that such offenders be strictly and carefully admonished not to persist in this their hypocrisy; for with whatsoever glosses and fine pretexts they may color it over, it is an open mockage and scorn both of God and Man, a grievous scandal unto their brethren, and a mortal wound unto their own consciences. And in case they shall obstinately abide in their impious resolution, then all consistories are enjoined to pursue and prosecute them with all Church-censures, as being persons utterly unworthy of communion with the saints of God. And that none may pretend ignorance of this act, let it be read and notified publicly in all places and congregations where it may be judged needful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 28, of Charenton, 1644-1645, ch. 14, 10. Article of General Matters, pp. 474-75</span></figcaption>

</figure><figure class="quote" id="q-e88490c0b8" data-kw="">
<blockquote><p>When one asked him concerning marriage, whether it were good to marry; seeing sometimes, when concupiscence pricked him, he was moved to it, and some other time when he felt no such thing, he thought he might abstain from it: He answered, many come hastily into that calling, not vying the means of trying their estate thoroughly before; as namely, whether they by prayer, fasting, and avoiding all occasions of concupiscence, have the gift of chastity or no? Many use some of the means, and not all: many use all the means, but a small time: therefore it is good to use first the means, not part of them, but all of them: not for a while, but long. If so be that all these things will not prevail, attend upon the Lord’s ordinance, and wait when the Lord shall give just occasion of using that estate, to his glory and our comfort.</p></blockquote>

</figure><figure class="quote" id="q-25d85261d2" data-kw="Infallible rule">
<blockquote><p>Although infallibility is not given by God to the church, it cannot on this account be said that God was wanting in things necessary to her, because it is not necessary to have a supreme and infallible tribunal among men upon whose decrees and responses our faith should be suspended, since it is sufficient for her to have an infallible rule of faith and practice in the Scriptures, which as long as she observes, she will not wander from the right track.</p></blockquote>

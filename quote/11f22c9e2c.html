<main class="wrap"><figure class="quote" id="q-11f22c9e2c" data-kw="">
<blockquote><p>By her original constitution the Church was formed for conquest, and, like every other army when she becomes inactive, she must become demoralized. Active operations for extending her dominion, instead of impairing her internal energies, are the only means of increasing her efficiency. A pure church, properly accomplishing all local objects, and yet destitute of a missionary spirit that is of an active, zealous and diffusive character, is a contradiction.

No such church ever long existed, and from the very nature of things, cannot possibly exist. Internal spirituality, living piety, and sound doctrine, cannot coexist in churches, or individuals, with the absence of a missionary spirit. The form of godliness may be manifested, but the power is wanting. The external lineaments of faith may be assumed, but withdraw the mask and you behold only a dead corpse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-smyth.html">Thomas Smyth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Her Duty and Her Danger: A Sermon Preached for the Board of Foreign Missions, of the Presbyterian Church, on Sabbath Evening, May 1, 1853, in the Church on Fifth Avenue and Nineteenth Street, New York: And also in the Central Church, Philadelphia, on Sabbath Evening, May 22, 1853 (New York</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0ae01f86f" data-kw="">
<blockquote><p>There is a fire that comes from the altar, which has right terrible effects. Contention and strife about spiritual things amongst Churchmen, and flowing from them to others, is a very sad judgment, and has very terrible effects; it most mars the beauty of the Church; it obstructs the spiritual growth of God’s people, and burns up all their spiritual life. Lord save us from this judgment, and make all his servants and people warry of kindling it, and make us more earnest in prayer that God would quench what of it is begun.</p></blockquote>

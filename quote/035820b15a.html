<main class="wrap"><figure class="quote" id="q-035820b15a" data-kw="">
<blockquote><p>III. This assurance is strengthened by Christian experience. That Christian assurance is of different degrees of strength, and admits of increase, is plain from the language of Scripture respecting it. There is an “assurance,” and a “full assurance,” yea, “all riches of the full assurance.” Those who plead that assurance is a simple idea, incapable of increase or diminution, not only contradict the Scripture, and the experience of the saints, but the common feelings of mankind, as expressed in all languages.

The degree of assurance is greater in some than in others, and greater in the same individual at one time than at another. The hopes of the Christian are sometimes very lively and strong at the time of his conversion, and become afterwards fainter and more unsteady. Hence the apostle exhorts the believing Hebrews to “hold fast the beginning of their confidence and the rejoicing of their hope unto the end,” and warns them against “casting away their confidence.” But, generally speaking, this assurance is progressive, and is enjoyed by the Christian in the highest degree at the end of his course, when it has been confirmed by long experience.

By Christian experience, I refer here immediately to the proofs which the believer has derived from his own experience of the grace, power, and faithfulness of God in Christ. These are manifold, and always increasing. Every instance in which a Christian has been enabled to perform a duty, to surmount a difficulty, to resist a temptation, to mortify a corruption, or support an affliction, tends to increase his assurance.

In this sense the apostle says, “We glory in tribulations also; knowing that tribulation worketh patience; and patience, experience; and experience, hope; and hope maketh not ashamed, because the love of God is shed abroad in our hearts by the Holy Ghost.” He had mentioned before as one of the fruits of justification, that believers “rejoiced in hope of the glory of God.”

But, it might be asked, did not the heavy affliction which they suffered, damp their hope? No, says he; on the contrary, it is confirmed by the consolations poured into their hearts, by which they are “strengthened unto all patience and long-suffering with joyfulness.” In a similar strain, he desires the Philippians to take encouragement from the firm and undaunted manner in which they had adhered to Christianity. It is to you, he says, “a token of salvation, and that of God; for unto you it is given in the behalf of Christ, not only to believe on him, but also to suffer for his sake.</p></blockquote>

</figure><figure class="quote" id="q-3b3366f077" data-kw="">
<blockquote><p>This special Faith the Papists abhor, and scorn; and yet cannot deny, but that true Christians ought to labour for assurance, namely the assurance, not of faith but of hope.

They must have a kind of hope, that their sins be remitted, and that they shall be saved, but they may not believe the remission of their sins, or eternal life, as belonging to themselves. Howbeit all their assurance is merely conjectural and uncertain: Neither can they have any sound assurance of hope, unless first they had assurance of Faith.</p></blockquote>

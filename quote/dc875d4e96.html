<blockquote><p>The meanest and poorest of her members must not be overlooked; and no child should be suffered to grow up untaught, either in relation to Divine things, or to the acquirements which are requisite to fit him for the business of human life. […] Expense should be cheerfully borne rather than that one child should be allowed to grow up uneducated.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95d4f7e253" data-kw="">
<blockquote><p>At a soiree to the Revd Dr Samuel B. Wylie held at Belfast in October 1845, the Revd Isaac Nelson of Donegall Street Presbyterian Church spoke of his admiration for Dr Wylie. Dr Wylie then addressed the gathering, which was chaired by Counsellor James Gibson, on the steps that Covenanters in America had taken against the abomination of chattel slavery:

The CHAIRMAN then called upon the Rev. Isaac Nelson, to address the meeting on union among christians of all denominations, for the suppression of slavery as a system repugnant to liberty, and the spirit of the Gospel. Mr. Nelson responded to the sentiment in an eloquent and energetic speech, in which he denounced slavery as hateful in the sight of God, and disgraceful to humanity. – He hoped the mantle of Dr. Wylie, and men like him, who had contended for the liberty of their fellow-man, would fall upon others, who would never cease their efforts until the foul stain of slavery would be not only banished from churches, but from every nation under heaven. (Hear, hear, and cheers.) All sections of the church would unite to free the slave, indeed, on that subject of slavery, and the conclusion to which he had come was, that no slaveholder should be allowed to sit down at the Lord’s table, or be recognised as a member of the Christian Church. He did not take his opinions from any man, and, were he to stand alone in the Church to which he had the honour to belong, he would maintain his opinion that slave-holding was a sin, and that the slave-holder should be excluded from the church. (Cheers.)

THE CHAIRMAN then introduced Dr. Wylie to the meeting, and he gave a detailed account of what he had done himself and of what had been done in his day for the abolition of slavery in America, as regarded the Reformed Presbyterian Church, the end of which was that all slaveholders were banished from her communion. For many years that church had maintained the high and holy stand she had taken, though in some places her members had suffered much on account of their opposition to slavery. The Covenanting Church in America would as soon allow a sheep-stealer to sit down at the table of the Lord, as they would a slave-holder. (This statement was received with the most enthusiastic applause.) Dr. Wylie then congratulated the various churches in this country on the stand which they had taken in opposition to slavery […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belfast-commerical-chronicle.html">Belfast Commerical Chronicle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commerical Chronicle</cite>, 27 Oct. 1845</span></figcaption>

</figure><figure class="quote" id="q-235c0b49d0" data-kw="">
<blockquote><p>I have no hesitation in affirming that since the day when the spirit of good King George III. of blessed memory, departed, the point of a Popish wedge has been introduced into our entire social system – impelled by a hidden force it has gradually, steadily, without one failure, penetrated, on, and on, and on, forcing itself into our national institutions – often imperceptibly – unless, as from time to time, we are aroused from our fatal slumbers by the crushing of some of our ancient barriers, and then we slumber again, and the operation proceeds – and when will it end? never! until it has effaced every vestige of Protestantism from our legislature, our statutes and our laws!

Compare our present constitution with that which existed when those events occurred for which we are still, with similar inconsistency, called as on this day, to give thanks! Then our houses of Parliament consisted only of men professing Protestantism – like a pure, primitive rock, of original formation the rock of truth! But now our legislative is composite, and still in a transition state: there may sit, side by side, the Jew and the Christian – the Papist, the Jesuit and the Protestant – the Unitarian, the scoffer, and the member of the Church of England – and this is the composition of the body which legislates on our laws and our religion! What can we expect from a body so constituted? What but that which we have received – the sample and the earnest of more!

A feeble barrier yet lingers around the throne itself – but how long this illiberal exclusion shall be permitted to our monarch or how soon such a legislature may invite our beloved Protestant Queen to cancel her Coronation oath, none can tell! I should think that the illustrious blood of the Protestant house of Orange would rather freeze in the veins of Victoria, than she would put her hand to such an instrument! But see how the mystery of iniquity has worked and prevailed in our state and nation! How soon it may become ascendant and dominant none can tell! And if it were so, who would guarantee the continuance of Victoria’s beneficent sway? nought can shake the Protestant throne, but the successful intrigues, and wily schemes of the “mystery of iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-close.html">Francis Close</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Mystery of Iniquity:” Being the Substance of a Sermon Preached in the Parish Church, Cheltenham, on November 5th, 1845</cite>, (3rd edn, London: Hatchard and Son, 1845), pp 17-18.</span></figcaption>

</figure><figure class="quote" id="q-8cf24e815d" data-kw="">
<blockquote><p>By SYNECDOCHE, 1. More universal terms are put for such as are more restricted: as ALL, for many; for all kinds; for the greater or better part, Matth. iii. 5. and xix. 28; the world, for the Roman empire, the Gentiles, the wicked, the Antichristians, Luke ii. 1. 1 John ii. 2. and v. 18. Rev. xiii. 8; every creature, for men, Mark xvi. 15; or the plural number for the singular, as children, for child, Gen. xxi. 7. 2. More restricted terms are put for such as are more extensive: as, one for all of the kind, Psal. i. 1; yesterday, for time past, Heb. xiii. 8; a limited number, as thrice, seven, or ten times, for frequently, 2 Cor. xii. 8. Psal. cxix. 164; a thousand, five thousand, for an uncertain number, Is. xxx. 17. 3.

A whole person, thing, place, or time, is put for an adjunct or part of it. So Christ is said to die; to be buried; when only his body died, and was buried, John xix. 42. and ii. 13; world is put for Canaan, Rom. iv. 13; north for Chaldea, Jer. i. 13. for ever, for a long time, Dan. ii. 4. 4. A part of a person, thing, place, or time, is put for the whole of it. So souls denote human persons, Acts ii. 41; resurrection is put for Christ’s whole appearance in our nature, Acts i. 22; hour for a period of time, John iv. 23.</p></blockquote>

— John Brown of Haddington, A brief view of the figures: and explication of the metaphors, contained in scripture, (Edinburgh: Gavin Alston, 1782), pp 6-7.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+SYNECDOCHE%2C+1.+More+universal+terms+are+put+for+such+as+are+more+restricted%3A+as+ALL%2C+for+many%3B+for+all+kinds%3B+for+the+greater+or+better+part%2C+Matth.+iii.+5.+and+xix.+28%3B+the+world%2C+for+the+Roman+empire%2C+the+Gentiles%2C+the+wicked%2C+the+Antichristians%2C+Luke+ii.+1.+1+John+ii.+2.+and+v.+18.+Rev.+xiii.+8%3B+every+creature%2C+for+men%2C+Mark+xvi.+15%3B+or+the+plural+number+for+the+singular%2C+as+children%2C+for+child%2C+Gen.+xxi.+7.+2.+More+restricted+terms+are+put+for+such+as+are+more+extensive%3A+as%2C+one+for+all+of+the+kind%2C+Psal.+i.+1%3B+yesterday%2C+for+time+past%2C+Heb.+xiii.+8%3B+a+limited+number%2C+as+thrice%2C+seven%2C+or+ten+times%2C+for+frequently%2C+2+Cor.+xii.+8.+Psal.+cxix.+164%3B+a+thousand%2C+five+thousand%2C+for+an+uncertain+number%2C+Is.+xxx.+17.+3.%0A%0AA+whole+person%2C+thing%2C+place%2C+or+time%2C+is+put+for+an+adjunct+or+part+of+it.+So+Christ+is+said+to+die%3B+to+be+buried%3B+when+only+his+body+died%2C+and+was+buried%2C+John+xix.+42.+and+ii.+13%3B+world+is+put+for+Canaan%2C+Rom.+iv.+13%3B+north+for+Chaldea%2C+Jer.+i.+13.+for+ever%2C+for+a+long+time%2C+Dan.+ii.+4.+4.+A+part+of+a+person%2C+thing%2C+place%2C+or+time%2C+is+put+for+the+whole+of+it.+So+souls+denote+human+persons%2C+Acts+ii.+41%3B+resurrection+is+put+for+Christ%E2%80%99s+whole+appearance+in+our+nature%2C+Acts+i.+22%3B+hour+for+a+period+of+time%2C+John+iv.+23.%E2%80%9D%0A%0A%E2%80%94+John+Brown+of+Haddington%2C+A+brief+view+of+the+figures%3A+and+explication+of+the+metaphors%2C+contained+in+scripture%2C+%28Edinburgh%3A+Gavin+Alston%2C+1782%29%2C+pp+6-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cf24e815d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8cf24e815d.html">Perma <blockquote><p>Even now, at this very moment, we are not selves having and using bodies. We are bodies—we are rational, sentient, organic bodies. Modern thought has rejected this truth. But the fact remains that the human person is a certain, special kind of body… Human biological processes are not possessions and instruments of the person; they are parts of the life of the person… The human soul, which is the person’s intellectual principle, is united to the body as form. As form of the body, the soul is not merely a moving principle of the body. Nor is the soul an agent of which the body is instrument. Rather, the soul is an intrinsic principle of the human person. The soul makes the person be the body he or she is. Nor is there any other form which makes the body be body than the soul by which the person has the capacities of intellect and free choice. Each person has his or her own soul; substantial unity excludes many individuals having the same soul. Since the soul and the body are not distinct entities, no link is needed to unite soul and body. The human soul, as formal part of the body, makes the entire human body be a person; the entire soul is present in every part of the body. All of these points are explained by St. Thomas in a compact, synthetic treatise (S. t., I, qu. 78)… Classical modern philosophy substitued a radical dualism for the substantial unity of man. In Descartes, man is a thinking subject—cogito ergo sum—and the body is consigned to the objective world. In Hume, man is a momentarily unified consciousness—personal identity is continuity by memory over time—and the body is merely one set for phenomena among others… If the person really is not his body, then the destruction of the life of the body is not directly and in itself an attack on a value intrinsic to the human person… If the person really is not his or her own body, then the use of the sexual organs in a manner which does not respect their proper biological teleology is not directly and in itself the perversion of a good of the human person… A manufactured individual will be a person; he or she will deserve our respect as one sharing in personal dignity… But such an individual also will be a product. The producer is on a different level, inescapably superior, from the level of the product. The producer always can say to his product: “I produced you, I can destroy you; I am lord of your life, I am lord of your death”. If human beings are to share in the same personal dignity, they must be begotten, not made. Only in being begotten does an offspring share the same nature and the same personal dignity as his or her parents.</p></blockquote>

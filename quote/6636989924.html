<main class="wrap"><figure class="quote" id="q-6636989924" data-kw="">
<blockquote><p>The purpose of all the Catholic commentators I have been able to read on the divine books of both testaments, who have written before me on the trinity which God is, has been to teach that according to the scriptures Father and Son and Holy Spirit in the inseparable equality of one substance present a divine unity; and therefore there are not three gods but one God; although indeed the Father has begotten the Son, and therefore he who is the Father is not the Son; and the Son is begotten by the Father, and therefore he who is the Son is not the Father; and the Holy Spirit is neither the Father nor the Son, but only the Spirit of the Father and of the Son, himself coequal to the Father and the Son, and belonging to the threefold unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, trans. Edmund Hill, ed. J. E. Rotelle (420; New York: New City Press, 1991), 1.2.7, p. 69.</span></figcaption>

<blockquote><p>Of the Trinity.

How many Persons be there in that one Essence of God?

Three, and those both in number, and in very deed distinguished, the Father, Son, and the holy Ghost: which have their subsisting in one divine essence: whereupon it comes to passe, that there be not many Gods, but one God, and the same eternal, infinite, and omnipotent, who is named Jehovah in the Scriptures: and is said to be most simple by reason of essence, and three by reason of Persons.

By what testimonies of Scripture do you prove the Trinity?

Genes. 1.1. God or Elohim created the heaven and the earth. In which place the verb being of the singular number doth signify the most simple essence of God: and the substantive Elohim being the plural number, doth note out the three Persons. Also in the creation of man, God as it were taking counsel with his eternal wisdom, that is, the Son and the holy Ghost, saith thus: vers. 26. Let vs make man after our image. Where he saith, Let us make, because of the number of the persons, and after our image, because of the unity of the essence. Gen. 19.24. The Lord rained from the Lord brimstone and fire upon Sodom and Gomorrah: in which place the person sending the rain, and the person from whom it was sent, (that is the Son) is distinguished from the Father.

Have you any more pregnant proofs out of the new Testament?

1. In the baptism of Christ, Math. 3.16. and Joh. 1.32. the voice of the Father is heard from heaven, This is my beloved Son: in the same place there stands the Son by the river Jordan, the holy Ghost descends in the form of a Dove and sits on Christ.

2. Again, in the transfiguration, there is the Son, and the voice of God the Father is heard from heaven, and Christ is shadowed with a cloud which doth signify the holy Ghost. And further Mat. 28.19. Baptize all nations in the name of the Father, of the Son, and of the holy Ghost: he saith not in names, but in the name, to shew the unity of the three Persons. 2. Cor. 13.13. The grace of our Lord Jesus Christ, and the love of God, and the communion of the holy Ghost be with you all.

Seeing the Scripture doth not use the name of the Trinity, doth the Church well to retain the same?

Yea, no doubt: for the thing it self is found in the Scriptures two manner of ways:

Now sith that the sense of it and the very thing it self is found in the Scriptures, the Church hath liberty to use such words as may familiarly express the thing it self. Moreover, we call the three Persons in God, the Trinity, not because the Scripture calls them so, but because the Scripture saith nothing against it. Yet this word three, whereof this word Trinity is derived, is expressly set down, 1. Joh. 5.7. There be three that bear witness, &amp;c. Whence we argue, that as from one comes Unity, so from three comes Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), pp 7-8.</span></figcaption>

/29/guillaume-bucanus-on-the-trinity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-42428f32bf" data-kw="">
<blockquote><p>From this [popish] bondage we were delivered at the Reformation; but though the Fathers of Protestantism escaped the worst errors of the Church of Rome, they were tempted into an imitation of the exclusive spirit of Popery. Luther himself, when he refused to give the right hand of Christian fellowship to the Fathers of the Swiss Church, upon a point which he had not at first regarded as essential, laid the foundaton of the division between the Lutheran and the Reformed Churches.

The example has been followed in breaking down Churches into minor subdivisions throughout Europe and in the New World; and a want of zeal for external as well as internal unity has hitherto been the weakness and the reproach of Protestantism. It has exhibited itself both in the active and passive forms above referred to; the former being chiefly manifest in powerful communities (especially, though not exclusively, in connection with the State), in laying down conditions of communion upon topics which they own to be indifferent, but which are viewed as sinful by others who are thus thrust forth in segregation.

While the passive form has naturally been resorted to by smaller and less influential sects, in erecting, as they have sometimes silently done, partitions of proud or sullen seclusion. And in this way the Reformed Churches, not only in different countries, but even in the same land, present themselves to the eye, rather as separate and independent kingdoms, than as constituting merely different cantons and dependencies of one confederate commonwealth, the united members of one compact body politic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-welsh.html">David Welsh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Limits and Extent of the Right of Private Judgment: Being the Substance of a Sermon, Preached in the Church of St Giles on Thursday, the 18th day of May, 1843</cite>, (Edinburgh: John Johnstone, 1843), pp 24-25.</span></figcaption>

</figure><figure class="quote" id="q-e47aa5d60f" data-kw="">
<blockquote><p>We say that the Godhead is absolutely of itself. And hence also we hold that the Son, regarded as God, and without reference to person, is also of himself; though we also say that, regarded as Son, he is of the Father. Thus his essence is without beginning, while his person has its beginning in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>

<blockquote><p>In the one only and most simple essence of God there are three distinct persons so distinguished from each other by incommunicable properties or modes of subsisting that one cannot be the other—although by an inexpressible circum-insession (emperichōrēsin) they always remain and exist in each other mutually.</p></blockquote>

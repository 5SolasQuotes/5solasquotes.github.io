<main class="wrap"><figure class="quote" id="q-d843d1572b" data-kw="">
<blockquote><p>The believer commits his soul to Christ under the thorough persuasion that he is unable to keep it himself. No man will intrust that which is precious in his eyes to another, so long as he deems it perfectly safe in his own hands. Every man is the natural guardian of his own soul; and had he not lost the ability of preserving it which he originally possessed, he would never have been required or exhorted to commit it to any other. It was this inability on our part which rendered the interposition of a Mediator and Redeemer necessary.

“When we were without strength, Christ died for the ungodly; and what the law could not do in that it was weak through the flesh, God” accomplished by “sending his own Son in the likeness of sinful flesh.” What is it that keeps so many at a distance from the Saviour whom God hath provided, and prevents them from intrusting him with their eternal interests? Want of a thorough and practical belief of the Scripture doctrine of man’s fallen state, and its fatal consequences, legally in exposing him to the judicial displeasure of Heaven, and spiritually in indisposing him to all that is morally good and acceptable in the sight of God. “They being ignorant of God’s righteousness, and going about to establish their own righteousness, have not submitted themselves to the righteousness of God.”

Arminianism is the offspring of ignorance and pride; ignorance of the extent of our misery, and a proud aversion to be indebted to another for that which we are utterly unable to do for ourselves. It existed as an operating principle long before it entered into a body of divinity. It is much older than the individual who in the seventeenth century gave it a name among Protestants. It is the doctrine of Popery, rendered more seductive by its refinement from superstition; it is the old error of Judaism somewhat Christianized; it is the natural religion of fallen man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Soul Committed to Christ in Sermons</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7cd0d7428e" data-kw="">
<blockquote><p>Now for to seek the Original of this evil any further back then the time of Arminius Professor at Leyden, were to disguise the fact. Some others before him it may be have had the same scruples, and the same troubles in their consciences upon those high points of Predestination and the Dependences of it; But the Church hath still continued in her peace and quiet; in such sort that the fountain and spring of the alteration which since his time some have endeavoured to introduce into the true and ancient Doctrine which you have always professed, and is received and authorized by the common consent of all the reformed Churches (howsoever some particular men have had an opinion a part touching the said points) ought to be attributed to Arminius and to none other. …

Contraria inter se posita magis elucescunt, we see then, before the time of Arminius what was the estate of these Provinces: union in the Church and Estate; good correspondence between the Magistrates; Christian love and charity among the people; the Sovereign Courts of Justice respected; the soldiers (the servants of your Lordships) in peace with all the world except your Enemies; all cheerfulness, all rejoicing, all acknowledgement of the blessing of GOD, which hath appeared miraculously in the defence of his cause, in the sight and notice of all the world in your prosperity; whereat the Enemies of this estate, have remained dismayed and amazed, and the friends of it greatly comforted.

For the present now that every one sees so clearly quantum dimiss a petitis praestant, let the Remonstrant take in good part the Remonstrance that followeth, and let him (if he please) serve himself thereof, Mature redeat repetatque relicta. But if the Doctrine of Arminius be so far spread and multiplied as there be no more time to give back, but that it behoveth to passe further to a decision, which of the two opinions is more conform and agreeing to the truth of the Word of God; or at the least what sort of Christian toleration may be permitted without scandal in the Church, who shall be a competent Judge in this matter?

To carry this authority to the temporal Magistrate, giving to Caesar that which belongs to Caesar, were to lean and incline too much of that side, and to take from God that which is God’s.

Wherefore to proceed with due regard as well towards them to whom God hath given authority over our bodies, as of those that have the cure and charge of our souls, that which in such occurrences is always practised, and whereunto within Christendom at all times men have had recourse. It is a National Synod; I say National, because the evil being passed from Province to Province, a Provincial Synod is not sufficient, but only for so much as it serveth for a preparative to the National Synod. This is the Remedy which is found good by the greatest part of the Provinces, and that which is recommended to you by the King my Master.

As for the Provinces, I will not play the busybody in aliena Republica, therein to Judge how much every Province in particular ought in such occasions to yield to the public. But whilst in this business men stand to dispute the right of Sovereignty of every Province apart, let them not forget the Oath by which they are consolidated and closed up into one body which is the Union of Utrecht grounded upon Religion.

And although they seek to evade and escape by shew of one Article which is, That every Province hath its power a part in matter of Religion, This ought to be understood soundly for the maintenance of the pure &amp; sincere Religion, and not for the authorisation and allowance of new and strange opinions; And principally in this Province where we are at this present, in the contemplation whereof it is to be presumed that Article was inserted for the better upholding of the Reformed Religion in his purity without being exposed to the will and pleasure of the other Provinces which at that time were not reduced to such an Union of the Church as they enjoy at this present.</p></blockquote>

<blockquote><p>Who would have thought that our church would ever have given entertainment to these Belgic semi-Pelagians, who have cast dirt upon the faces and raked up the ashes of all those great and pious souls whom God magnified, in using as his instruments to reform his church; to the least of which the whole troop of Arminians shall never make themselves equal, though they swell till they break?

What benefit did ever come to this church by attempting to prove that the chief part in the several degrees of our salvation is to be ascribed unto ourselves, rather than God? — which is the head and sum of all the controversies between them and us. And must not the introducing and fomenting of a doctrine so opposite to that truth our church hath quietly enjoyed ever since the first Reformation necessarily bring along with it schisms and dissensions, so long as any remain who love the truth, or esteem the gospel above preferment?

Neither let any deceive your wisdoms, by affirming that they are differences of an inferior nature that are at this day agitated between the Arminians and the orthodox divines of the reformed church. Be pleased but to cast an eye on the following instances, and you will find them hewing at the very root of Christianity. Consider seriously their denying of that fundamental article of original sin. Is this but a small escape in theology? — why, what need of the gospel, what need of Christ himself, if our nature be not guilty, depraved, corrupted? Neither are many of the rest of less importance. Surely these are not things “in quibus possimus dissentire salvâ pace ac charitate,” as Austin [Augustine] speaks, — “about which we may differ without loss of peace or charity.” One church cannot wrap in her communion Austin and Pelagius, Calvin and Arminius.

I have here only given you a taste, whereby you may judge of the rest of their fruit, — “mors in olla, mors in olla;” their doctrine of the final apostasy of the elect, of true believers, of a wavering hesitancy concerning our present grace and future glory, with divers others, I have wholly omitted: those I have produced are enough to make their abettors incapable of our church-communion. The sacred bond of peace compasseth only the unity of that Spirit; which leadeth into all truth.

We must not offer the right hand of fellowship, but rather proclaim ἱερὸν πόλεμον, “a holy war,” to such enemies of God’s providence, Christ’s merit, and the powerful operation of the Holy Spirit. Neither let any object, that all the Arminians do not openly profess all these errors I have recounted. Let ours, then, show wherein they differ from their masters. We see their own confessions; we know their arts, βάθη καὶ μεθοδείας τοῦ Σατανᾶ, — “the depths and crafts of Satan;” we know the several ways they have to introduce and insinuate their heterodoxies into the minds of men.

With some they appear only to dislike our doctrine of reprobation; with others, to claim an allowable liberty of the will: but yet, for the most part, — like the serpent, wherever she gets in her head, she will wriggle in her whole body, sting and all, — give but the least admission, and the whole poison must be swallowed. What was the intention of the maintainers of these strange assertions amongst us I know not, — whether the efficacy of error prevailed really with them or no, or whether it were the better to comply with Popery, and thereby to draw us back again unto Egypt; — but this I have heard, that it was affirmed on knowledge, in a former parliament, that the introduction of Arminianism amongst us was the issue of a Spanish consultation.

It is a strange story that learned Zanchius tells us, how, upon the death of the Cardinal of Lorraine there was found in his study a note of the names of divers German doctors and ministers, being Lutherans, to whom was paid an annual pension, by the assignment of the cardinal, that they might take pains to oppose the Calvinists; and so, by cherishing dissension, reduce the people again to Popery.

If there be any such amongst us, who, upon such poor inconsiderable motives, would be won to betray the gospel of Christ, God grant them repentance before it be too late! However, upon what grounds, with what intentions, for what ends soever, these tares have been sowed amongst us by envious men, the hope of all the piously learned in the kingdom is, that, by your effectual care and diligence, some means may be found to root them out.</p></blockquote>

<blockquote><p>For the answering of this, we must make a double distinction: one of errors, the other of persons that err. Of errors, some are destroyers of the Faith, some only weakeners of it: A destroyer is that which overturns any fundamental point of religion, which is of that nature, that if it be denied, religion itself is overturned, as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like; And the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that the holding whereof does not overturn any point in the foundation of salvation, as the error of freewill and sundry such like. This distinction is made by the Holy Ghost, who says expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last Judgment, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the Word are as gold and silver laid thereupon. Secondly, persons erring, are of two sorts: Some err of weakness, being carried away by others, or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions. This being said, we now come to the point: If any man or Church shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold that images are still to be retained in the church, that there is an universal election of all men, etc.; for these and such like opinions may be maintained, the foundation of salvation unrazed. This which I say is flatly avouched by Paul. ‘If any man’ (says he): ‘build on this foundation gold, silver, precious stones, timber, hay, or stubble, his work shall be made manifest by the fire, etc. and if any man’s work burn, he shall loose, but yet he shall be safe himself.’ And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the Church. A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls, the house yet stands, though deformed. He pulls up the foundation, the house itself falls and ceases to be a house. Now religion which we profess is like a house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing. Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party errs of weakness or malice: If of weakness, the party is to be esteemed as a member of the catholic Church. And thus Paul writes unto the Church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works. But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul shows by the example of Jannes and Jambres. And as Jannes and Jambres, says he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith. Yet withal, this caveat must ever be remembered, that we rather condemn the error than the person that errs, because God’s mercy is like a bottomless sea, whereby He works what He will and when He will in the hearts of miserable sinners.</p></blockquote>

tained%2C+the+foundation+of+salvation+unrazed.+This+which+I+say+is+flatly+avouched+by+Paul.+%E2%80%98If+any+man%E2%80%99+%28says+he%29%3A+%E2%80%98build+on+this+foundation+gold%2C+silver%2C+precious+stones%2C+timber%2C+hay%2C+or+stubble%2C+his+work+shall+be+made+manifest+by+the+fire%2C+etc.+and+if+any+man%E2%80%99s+work+burn%2C+he+shall+loose%2C+but+yet+he+shall+be+safe+himself.%E2%80%99+And+therefore+the+hay+and+stubble+of+men%E2%80%99s+errors+that+are+beside+the+foundation%2C+on+which+they+are+laid%2C+do+not+debar+them+from+being+Christians+or+members+of+the+Church.+A+man+breaks+down+the+windows+of+his+house%3B+the+house+stands%3A+he+breaks+down+the+roof+or+the+walls%2C+the+house+yet+stands%2C+though+deformed.+He+pulls+up+the+foundation%2C+the+house+itself+falls+and+ceases+to+be+a+house.+Now+religion+which+we+profess+is+like+a+house+or+building%3A+and+some+points+thereof+are+like+windows%2C+doors%2C+walls%2C+roofs%2C+and+some+are+the+very+foundation%3A+and+the+former+may+be+battered%2C+the+foundation+standing.+Again%2C+if+the+error+be+directly+or+by+necessary+consequent%2C+even+in+common+sense+against+the+foundation%2C+consideration+must+be+had+whether+the+Church+or+party+errs+of+weakness+or+malice%3A+If+of+weakness%2C+the+party+is+to+be+esteemed+as+a+member+of+the+catholic+Church.+And+thus+Paul+writes+unto+the+Church+of+Galatia%2C+as+to+a+church+of+God%2C+though+by+false+teachers+it+had+been+turned+away+to+another+Gospel%2C+and+embraced+the+fundamental+error+of+justification+by+works.+But+when+any+man+or+church+shall+hold+fundamental+errors+in+obstinacy+or+affected+ignorance%2C+we+are+not+then+bound+to+repute+them+any+longer+as+churches+or+Christians%2C+but+as+such+to+whom+condemnation+belongs%2C+as+Paul+shows+by+the+example+of+Jannes+and+Jambres.+And+as+Jannes+and+Jambres%2C+says+he%2C+withstood+Moses%2C+so+do+these+also+resist+the+truth%2C+men+of+corrupt+minds%2C+reprobate+concerning+the+faith.+Yet+withal%2C+this+caveat+must+ever+be+remembered%2C+that+we+rather+condemn+the+error+than+the+person+that+errs%2C+because+God%E2%80%99s+mercy+is+like+a+bottomless+sea%2C+whereby+He+works+what+He+will+and+when+He+will+in+the+hearts+of+miserable+sinners.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+of+the+Creed%2C+on+the+Church+in+A+Golden+Chain%2C+%28Cambridge%2C+1600%29%2C+pp.+493-94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fada79be336.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ada79be336.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/arminianism/#:~:text=For%20the%20answering%20of%20this%2C%20we,in%20the%20hearts%20of%20miserable%20sinners&amp;text=For%20the%20answering%20of%20this%2C%20we%20must%20make&amp;text=He%20will%20in%20the%20hearts%20of%20miserable%20sinners" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

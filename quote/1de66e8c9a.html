<main class="wrap"><figure class="quote" id="q-1de66e8c9a" data-kw="">
<blockquote><p>If all the people may lawfully join themselves with that Church which has the ablest teacher, then almost all the world must go to a few men and leave the rest. Then Barnabas may be forsaken, if Paul be the chief speaker… And God has more means than ministerial abilities to increase men’s graces: He that keeps in God’s order under a meaner [less excellent], honest minister, is like to be a more humble, thriving Christian than he that will break that order under pretense of edification. The Lord knows that I speak against my own visible carnal interests in all this… 10. Christians should not first ask, ‘Where may I have the best minister, or company, or purest Ordinances? or where may I receive most good?’ But they must first ask, ‘Where lies my duty? and where may I do most good?’ For God’s work must be done before our own. And the saving of souls and propagation of the Gospel must be preferred before our comforts. Yea let me tell you my observation: The comfort that Christians have in a suffering, self-denying course of doing good is a surer and more stable comfort than that which is drawn from the special advantages of ordinances. That man that lives among a company of poor ignorant souls, and will set himself night and day resolvedly and unweariedly to teach them, persuade them and win them to Christ, till he have bettered the imperfect church where he is, shall usually be a man of solid settled peace. When he that says, ‘These are carnal, heathens, wicked; This is a weak ministry; I will go join myself to such an excellent minister and Church, and let them alone,’ this man will likely be soon sadded with his new comforts, and weary of his precious ordinances, and be as ready to vilify them and turn to some other till in this disorder he have run himself out of breath, if not out of all appearance of grace.</p></blockquote>

</figure><figure class="quote" id="q-1d66026f83" data-kw="">
<blockquote><p>He contains the holiness of all creatures put together and infinitely more. As all the wisdom, excellency and power of the creatures, if compared with the wisdom, excellency and power of God, is but folly, vileness and weakness; so the highest created purity, if set in parallel with God, is but impurity and uncleaness. Rev. 15:4, ‘Thou only art Holy:’ ‘Tis like the light of a glow-worm to that of the Sun; ‘The heavens are not pure in his sight, and his angels He charged with folly,’ Job 4:18; 15:15. Though God has crowned the angels with an unspotted sanctity and placed them in a habitation of glory, yet as illustrious as they are, they have an unworthiness in their own nature to appear before the throne of so holy a God; Their holiness grows dim and pale in his presence. ‘Tis but a weak shadow of that divine purity, whose light is so glorious that it makes them cover their faces out of weakness to behold it, and cover their feet out of shame in themselves [Isa. 6]. They are not ‘pure in his sight’ because though they love God (which is a principle of holiness) as much as they can, yet not so much as He deserves: They love Him with the intensest degree, according to their power, but not with the intensest degree, according to his own amiableness: For they cannot infinitely love God, unless they were as infinite as God, and had an understanding of his perfections equal with Himself, and as immense as his own knowledge. God having an infinite knowledge of Himself, can only have an infinite love to Himself, and consequently an infinite holiness without any defect; because He loves Himself according to the vastness of his own amiableness, which no finite being can. Therefore, though the angels be exempt from corruption and soil, they cannot enter into comparison with the purity of God, without acknowledgment of a dimness in themselves. Besides, ‘He charges them with folly,’ and ‘puts no trust in them,’ because they have the power of sinning, though not the act of sinning: They have a possible folly in their own nature to be charged with. Holiness is a quality separable from them, but it is inseparable from God. Had they not at first a mutability in their nature, none of them could have sinned, there had been no devils; but because some of them sinned, the rest might have sinned: And though the standing angels shall never be changed, yet they are still changeable in their own nature, and their standing is due to grace, not to nature; and though they shall be forever preserved, yet they are not, nor ever can be immutable by nature, for then they should stand upon the same bottom with God Himself; but they are supported by grace against that changeableness of nature which is essential to a creature: The Creator ‘only hath immortality,’ that is, immutability (1 Tim. 3:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God (London, 1682), ‘On the Holiness of God’</cite>, p. 500</span></figcaption>

</figure><figure class="quote" id="q-e4fbc8bf29" data-kw="">
<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>

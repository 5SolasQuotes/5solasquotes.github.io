<main class="wrap"><figure class="quote" id="q-7483adceaf" data-kw="">
<blockquote><p>As we expect our Lord shortly to come, and to put down the blasphemous usurpers who have arrogated his prerogatives, and oppressed his faithful subjects, we should everywhere loudly and boldly proclaim, as did the remnant of Scotland’s martyred children, “Let King Jesus reign.” We should seek to bring the King back; and claim that not only in his Church, his blood-bought inheritance, but throughout the nations, and in every department of the State, He should be acknowledged as supreme – his sceptre submitted to, and his laws obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The judgment of the papacy: and the reign of righteousness</cite>, (1851) in Works doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), i, 359.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bf40a721c" data-kw="">
<blockquote><p>Some had thought that your Love and Charity extended a little to[o] far beyond the Scripture-Rule in some Instances, such as Journal last p. 59. when you say, “The Quakers’ Notions about walking and being led by the Spirit, you think are right and good;” unless they be Quakers of another Stamp than the rest, whose dangerous Tenets are inconsistent with the right Notion of walking and being led by the Spirit, while, beside other Things, they deny Justification by the imputed Righteousness of CHRIST, or his active and passive Obedience received by Faith, to be the only Ground of Justification before GOD; and while thus they cannot receive CHRIST JESUS, they consequently cannot walk in him, nor be led by his Spirit, who is the Spirit of Truth, testifying of CHRIST, according to the Revelation made of him in the Word, which they contradict. Whatever Duties of Love you perform toward these Men, yet I’ll never believe you mean or intend to justify their Principles and delusive Notions, nor think well of them, till once the LORD convince and convert them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter from the Reverend Mr. Ralph Erskine to the Reverend Mr. Geo. Whitefield</cite>, (Philadelphia: B. Franklin, 1741), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-78e3553ba9" data-kw="">
<blockquote><p>2. The second precept is a rule of our whole worship of God, that we worship not God with any kind of worship besides that wherewith he commanded Himself to be worshipped: wherefore it commands the true and forbids all the fained and false worship of God, especially idols and images made to represent and worship God: also negligence of magistrates, whereby images or other instruments, which either do or may easily serve to idolatry, are tolerated in places subject to their authority, much more the worship of them; also hypocricy and prophaness.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-565d55bcc7" data-kw="">
<blockquote><p>FAITH, as it stands described and recommended in the Bible, is a firm and assured confidence in God, founded in the belief of the testimony he has given us in the history of the Bible; where we have his true character, instructed by sensible documents, his works and ways with men; particularly in the provision he has made, and the comprehensive promise and grant he hath given, of eternal life. This is rendered credible by the perfection, the faithfulness, and power, of the promiser; but especially by the pledge he has given of his wonderful grace and love to man in Jesus Christ, who is the foundation and surety of the promise.

This security is recommended, as a good ground of confidence, by the Spirit and power of God, and all the fullness of life being lodged in his hand; and as they appear to have been lodged there for this very purpose, that he might convey the promised blessing, spirit and life to us, this finishes the assurance. Hence it is obvious, that faith, or trust and confidence in God, must begin at Jesus Christ, the fare, and the only sure, foundation on which it can stand. And where faith in Christ is, there naturally and necessarily our faith and hope in God follow upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 170-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“FAITH, as it stands described and recommended in the Bible, is a firm and assured confidence in God, founded in the belief of the testimony he has given us in the history of the Bible; where we have his true character, instructed by sensible documents, his works and ways with men; particularly in the provision he has made, and the comprehensive promise and grant he hath given, of eternal life. This is rendered credible by the perfection, the faithfulness, and power, of the promiser; but especially by the pledge he has given of his wonderful grace and love to man in Jesus Christ, who is the foundation and surety of the promise.

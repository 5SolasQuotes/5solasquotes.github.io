<blockquote><p>God, by way of an agreement [pacto], willed our salvation by a simple love [affectu] and that salvation is pleasing to him, so that unless sins hinder it, he effectually wills it… therefore because of this mixed [implicitae] will under a condition, we say that God has a conditional will, or as they say, willingness [velleitatem].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | “Davenant also often distinguishes between conditional and absolute decrees with respect to the voluntas simplicis complacentiae. Absolute decrees properly fall under God’s voluntas beneplaciti, whereas God’s voluntas simplicis complacentiae is often expressed conditionally in Scripture. Thus, when Scripture says God wills the salvation of all, it is on the condition of believing in Christ— an act “so agreeable unto Gods will that wheresoever it is found it shall be rewarded.” Consider, for example, God’s voluntas simplicis complacentiae by which God is said to desire or will the salvation of all. This will can be understood as an effectual will (virtually, in itself) with a condition. That is, it is a mixed conditional, as opposed to a mere conditional. As the sixteenth-century Jesuit Gabriel Vásquez explains</cite>, pp. 151-52</span></figcaption>

</figure><figure class="quote" id="q-576d817df9" data-kw="">
<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>

</figure><figure class="quote" id="q-1dd8554531" data-kw="">
<blockquote><p>The necessity and contingency of things is not to be attributed to God’s decree, but to the working of his power; contingency is when He uses his resistible power; if He works irresistibly then follows necessity: what is contingent to the second cause is infallible to God’s prescience, but necessary to the work of his omnipotency: his decree is a remote cause, which without his power works not. Christ’s death was contingent to the Jews that crucified Him; infallible to God’s prescience, who foresaw that the Jews would kill Him; but necessary in regard of his decree, working by his power in presenting that bitter cup unto Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination &amp; its Adjuncts... (London: 1646), sect. 25</cite>, pp. 24-25</span></figcaption>

<blockquote><p>The bestowment of common grace upon the non-elect shows that non-election does not exclude from the kingdom of heaven by Divine efficiency, because common grace is not only an invitation to believe and repent, but an actual help towards it; and a help that is nullified solely by the resistance of the non-elect, and not by anything in the nature of common grace, or by any preventive action of God. The fault of the failure of common grace to save the sinner, is chargeable to the sinner alone; and he has no right to plead a fault of his own as the reason why he is entitled to special grace. It is absurd for him to contend that God has no right to refuse him regenerating grace, because he has defeated the Divine mercy in common grace. The true way out of the difficulty for the sinner is, not to demand regenerating grace as a debt by denying that God has the right to withhold it, but to confess the sinful abuse and frustration of common grace, and to cry with the leper: ‘Lord, if thou wilt, thou canst make me clean.&#x27;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The bestowment of common grace upon the non-elect shows that non-election does not exclude from the kingdom of heaven by Divine efficiency, because common grace is not only an invitation to believe and repent, but an actual help towards it; and a help that is nullified solely by the resistance of the non-elect, and not by anything in the nature of common grace, or by any preventive action of God. The fault of the failure of common grace to save the sinner, is chargeable to the sinner alone; and he has no right to plead a fault of his own as the reason why he is entitled to special grace. It is absurd for him to contend that God has no right to refuse him regenerating grace, because he has defeated the Divine mercy in common grace. The true way out of the difficulty for the sinner is, not to demand regenerating grace as a debt by denying that God has the right to withhold it, but to confess the sinful abuse and frustration of common grace, and to cry with the leper: ‘Lord, if thou wilt, thou canst make me clean.&#x27;”

<main class="wrap"><figure class="quote" id="q-ce6f22c7a1" data-kw="">
<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinaris et operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving. … 11. The question, if such a pastor be called lawfully, is a question of fact, not a question of law; [it is] as this [case]: if such an one be baptized and there be an invincible ignorance in a question of fact which excuses. And therefore we may hear a gifted pastor taken and supposed by the Church to have the Church’s calling, though indeed he received no calling from the Church at his entry. … 3. We are nowhere forbidden in God’s Word to hear teachers sent and called, but only wolves in sheep skins, void of all calling, and intruders: for pastors may be antichristian in the manner of the entry, as Caiaphas… 3. Yea, and brook an antichristian calling, as prelates do and have done in Britain, and yet their ministry be valid. For that the calling of a minister be valid and his ministerial acts not null, it is sufficient that the governing Church give him a calling, either by themselves, their express call, their silence, or tacit consent, or their approbation communicating with him in his ministry, or by these to whom the Church resigned her power, or by these who stand in place of the Church, though prelates invade the place of the Church: yet: [1.] because first they themselves be pastors and have power to teach and baptize as pastors called of Christ. Mt. 18:19. 2. Because they stand for the Church, the Church approving or someway by silence consenting (as in the case of Caiaphas’s entry to the priesthood) thereunto. These who are baptized of them are not rebaptized, and these who are ordained pastors by them are not reordained, but have a calling to the ministry and do validly confer a calling upon others. Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized, not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>

</figure><figure class="quote" id="q-e23ee680bb" data-kw="">
<blockquote><p>So may we say, can any man forbid bread and wine, that these should not receive the Lord’s Supper, which have received the Holy Ghost; and have in some degree all spiritual qualifications requisite in communicants. They have the word of promise, which is the greater; who can inhibit the sign which is the less? They are Mr. Geree his words for the baptism of infants. They are faederati, therefore they must be signati. It is Mr. Marshal’s argument upon the same subject; and mutatis mutandis applyable to our purpose. Perhaps you will say, you would willingly give believers their right, but prophane and scandalous persons will also intrude [into the Supper] who have no right: What if they do? If you have no power or authority from Christ to keep them back by yourself; If you have used the utmost of your power to erect an eldership in the congregation; if you have used your power of order to the utmost for keeping them back by exhortation, if you mourn for their intrusion, wherein are you to be blamed? Because they do wrong, will you do no right? And shall the saints be debarred their dues, because these wretches without your allowance, sieze upon what is undue, that unto which they have no right?</p></blockquote>

<blockquote><p>…administration of the Lord’s Supper is a more important and necessary duty than exclusion [from it], etc. or any other part of the exercise of discipline; for it is more properly and immediately the worship of God than the exercise of discipline, as may be seen in the place before quoted out of Ames, bk. 2, [Marrow of] Theology, ch. 13, n. 17-18. God is more worshipped by the administration of the sacraments than by Church censures; the sacraments are a principal worship of God; Church censures and the exercise of discipline less principal. Now it is improbable that a less principal worship of God should be a necessary antecedent to a principal worship. There is says Rada: duplex ordo naturae; alius ordo essentialis dependendentiae; alius est ordo essentialis eminentiae et perfectionis; qualis est inter excedens, &amp; excessum. Now exclusion (and we may say the like of all other acts of discipline) is not before the Lord’s Supper in regard of the order, either of essential dependency, or of essential eminency and perfection. The Lord’s Supper has not an essential dependency upon exclusion, or any other acts of discipline: and it is in ratione cultus of more essential eminency and perfection; as being more immediatly and properly the worship of God.</p></blockquote>

<blockquote><p>Thirdly, I demand of you [Independent divines at Westminster], how you could so nakedly propound the apostolical directions, patterns and examples of the primitive Churches to walk by (excepting mere circumstances and the rules of the law of nature) and not except withal extraordinary and miraculous, personal and particular, occasional and accidental, temporary and local patterns and examples. I own the Scripture for the rule, rightly understanding it, and in matters of discipline and Church-order, profess to walk by it, desiring to be tied to the Scripture patterns, particularly to the patterns of examples and precepts recorded in the New Testament (provided this be understood in essentials and fundamentals of order, in matters of perpetual use, and of a common reason to all times and places); only I add that in some things, where in matter of order and external government there may be no such clear directions either by precept or example, there general rules of the Word, with deductions out of Scripture examples, and from precepts by way of analogy, with rules of common prudence be taken in too. Now the interpretation of this rule (as I have laid it down) being rejected, and the rule simply taken up without such limitations, will produce a wild and strange discipline and Church-order, to practise all things recorded in the Acts of the apostles and epistles, without distinction and difference of those times, persons, places and ours: and on the other hand to practise nothing but what has a clear example or precept is strange too, and in so doing, reasonable men cannot become a Church society, nor exercise Church communion. And however in matters of external government and administration of holy things in the visible Church some pretend to this, to practise whatever they find recorded in the Scriptures, and to practise nothing whatsoever they find not there, yet none of the Independents, no not the highest form of them, the Anabaptists, nor the highest sort of Anabaptists (who were called Apostolici from their pretending to imitate the Apostles in all things) ever yet have or do practise all patterns and examples recorded in the New Testament, or are contented with them alone, but practise somewhat over and above not particularly recorded in Scripture. I could lay downe a catalogue of many particulars specified in the Acts of the apostles and epistles, not practised in your churches, nor in any churches of the Independent way, as also of many things practised by you (which we never read of in the Scriptures), so that all the Independents are in many things according to the first pattern both defective and excessive. But I referre the full handling of this to a tractate I intend concerning the Scriptures, How far the Scriptures are a rule for all matters of Church government and order in the visible Church… This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practises and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 (vv. 13 &amp; 17) speaks of it. Schlusselburgius (de Secta Anabaptist.) writes also that there is a sort of Anabaptists called Apostolici, so named because they professed to imitate the apostles in all things: they washed one anothers feet, they held all things ought to be common, they travelled up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, ‘what you have heard in the ear, preach upon the house top.’ Now how far the want of these limitations and distinctions in this your first rule has led some of you into errors and strange practices and may lead you further, as into annointing the sick with oil, baptizing in rivers, etc. I leave you to consider of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, (London: G.M., 1644), pp. 75-77</span></figcaption>

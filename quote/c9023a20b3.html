<main class="wrap"><figure class="quote" id="q-c9023a20b3" data-kw="">
<blockquote><p>Beloved, Satan being fallen from light to darkness, from felicity to misery, from heaven to hell, from an angel to a devil, is so full of malice and envy that he will leave no means unattempted, whereby he may make all others eternally miserable with himself; he being shut out of heaven, and shut up “under the chains of darkness until the judgment of the great day” (Jude 6), makes use of all his power and skill to bring all the sons of men into the same condition and condemnation with himself.

Satan has cast such sinful seed into our souls, that now he can no sooner tempt, but we are ready to assent; he can no sooner have a plot upon us, but he makes a conquest of us. If he does but show men a little of the beauty and finery of the world, how ready are they to fall down and worship him!

Whatever sin the heart of man is most prone to, that the devil will help forward. If David is proud of his people, Satan will provoke him to number them, that he may be yet prouder (2 Sam. xxiv). If Peter is slavishly fearful, Satan will put him upon rebuking and denying of Christ, to save his own skin (Matt. xvi. 22; xxvi. 69-75). If Ahab’s prophets are given to flatter, the devil will immediately become a lying spirit in the mouths of four hundred of them, and they shall flatter Ahab to his ruin (2 Kings xxii). If Judas will be a traitor, Satan will quickly enter into his heart, and make him sell his master for money, which some heathen would never have done (John xiii. 2). If Ananias will lie for advantage, Satan will fill his heart that he may lie, with a witness, to the Holy Spirit (Acts v. 3).

Satan loves to sail with the wind, and to suit men’s temptations to their conditions and inclinations. If they be in prosperity, he will tempt them to deny God (Proverbs xxx. 9); if they be in adversity, he will tempt them to distrust God; if their knowledge be weak, he will tempt them to have low thoughts of God; if their conscience be tender, he will tempt to scrupulosity; if large, to carnal security; if bold-spirited, he will tempt to presumption; if timorous, to desperation; if flexible, to inconstancy; if stiff, to impenitency.

From the power, malice and skill of Satan, doth proceed all the soul-killing plots, devices, stratagems and machinations, which are in the world. Several devices he has to draw souls to sin, and several plots he has to keep souls from all holy and heavenly services, and several stratagems he has to keep souls in a mourning, staggering, doubting and questioning condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies against Satan’s Devices</cite>, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 3-4.</span></figcaption>

<blockquote><p>55. Nor can it [unregenerate choice] apprehend offered grace, unless it first receives through regeneration the faculty of apprehending.

56. In receiving this faculty of apprehending grace and assenting to the promise, it conducts itself merely passively, because then the choice is only the subject in which God works, in which he imprints new qualities and inclinations (Ezk. 11:19; 36:26; Eccl. 17:14; Job 33:3-6; Jn. 1:13).

57. But in the very apprehension of grace, or the act of apprehending, it conducts itself both passively and actively; for the choice acts, but having been acted upon by the Holy Spirit (Ezk. 36:27).

58. For one thing is δύναμις, the faculty of apprehending; another is ἐνέργεια, the act of apprehending or the apprehension itself.

59. After the choice has been regenerated, it indeed wills and does good, and perseveres in it, but only insofar as God effects and confirms these things in it (Phil. 1:6, 2:13; 1 Cor. 4:7; Jn. 15:5; 1 Cor. 12:3, 1:8).</p></blockquote>

<blockquote><p>For if we give not entrance to Christ, all this will be a further aggravation of our damnation. How will this justify the sentence upon us hereafter, when Christ shall set us on the left hand (Mt. 25) and say: ‘Depart from Me [Mt. 7], for I invited you to come to Me, I knocked at the door of your hearts, and you would give Me no entrance. ‘Depart from us,’ said you; Therefore now depart you from Me.’ What do profane persons in the Church, but bid Christ depart from them, especially in the motions of his Spirit; they entertain Him in the outward room, the brain; they know a little of Christ, but in the heart, the secret room, He must not come there to rule. Is it not equal that He should bid us (Mt. 23:41), ‘Depart ye cursed I know you not? You would not give entrance to Me, I will not now to you.’ As to the foolish virgins He speaks and, Prov. 1:28, wisdom knocks and has no entrance, therefore in times of danger, they call upon her, but she rejoices at their destruction; Where God magnifies his mercy in this kind in sweet allurements and inviting by judgments, mercies, ministry and Spirit, He will magnify his judgment after. Those that have neglected Heaven with the prerogatives, and advantages in this kind, they shall be cast into Hell. ‘Woe to thee Chorazin,’ etc. as you know in the Gospel (Mt. 11:21). This is one thing that may humble us of this place and nation, that Christ has no further entrance, nor better entertainment after so long knocking? For the entertaining of his Word is the welcoming of Himself, as it is, Col. 3:16, ‘Let the word of God dwell plentifully in you,’ and ‘Let Christ dwell in your hearts by faith.’ Eph. 3:17. Compare those places, Let the Word dwell plenteously in you by wisdom, and let Christ dwell in your hearts by faith. For then does Christ dwell in the heart when the truth dwells in us. Therefore what entertainment we give to his truth, we give to Himself. Now what means of knocking has He not used among us a long time? For works of all sorts, He has drawn us by the cords of a man, by all kind of favors. For mercies, How many deliverances have we had (No nation the like; we are a miracle of the Christian world) from foreign invasion and domestical conspiracies at home? How many mercies do we enjoy? Abundance together with long peace, and plenty. Besides, if this would not do, God has added corrections with all these, in every element, in every manner, infection in the air, judgments in inundations; we have had rumors of wars, etc. threatenings, shakings of the rod only, but such as might have awaked us; And then He has knocked at our hearts by the example of other nations. By what He has done to them, He has showed us what He might justly have done to us; we are no better then they.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For if we give not entrance to Christ, all this will be a further aggravation of our damnation. How will this justify the sentence upon us hereafter, when Christ shall set us on the left hand (Mt. 25) and say: ‘Depart from Me [Mt. 7], for I invited you to come to Me, I knocked at the door of your hearts, and you would give Me no entrance. ‘Depart from us,’ said you; Therefore now depart you from Me.’ What do profane persons in the Church, but bid Christ depart from them, especially in the motions of his Spirit; they entertain Him in the outward room, the brain; they know a little of Christ, but in the heart, the secret room, He must not come there to rule. Is it not equal that He should bid us (Mt. 23:41), ‘Depart ye cursed I know you not? You would not give entrance to Me, I will not now to you.’ As to the foolish virgins He speaks and, Prov. 1:28, wisdom knocks and has no entrance, therefore in times of danger, they call upon her, but she rejoices at their destruction; Where God magnifies his mercy in this kind in sweet allurements and inviting by judgments, mercies, ministry and Spirit, He will magnify his judgment after. Those that have neglected Heaven with the prerogatives, and advantages in this kind, they shall be cast into Hell. ‘Woe to thee Chorazin,’ etc. as you know in the Gospel (Mt. 11:21). This is one thing that may humble us of this place and nation, that Christ has no further entrance, nor better entertainment after so long knocking? For the entertaining of his Word is the welcoming of Himself, as it is, Col. 3:16, ‘Let the word of God dwell plentifully in you,’ and ‘Let Christ dwell in your hearts by faith.’ Eph. 3:17. Compare those places, Let the Word dwell plenteously in you by wisdom, and let Christ dwell in your hearts by faith. For then does Christ dwell in the heart when the truth dwells in us. Therefore what entertainment we give to his truth, we give to Himself. Now what means of knocking has He not used among us a long time? For works of all sorts, He has drawn us by the cords of a man, by all kind of favors. For mercies, How many deliverances have we had (No nation the like; we are a miracle of the Christian world) from foreign invasion and domestical conspiracies at home? How many mercies do we enjoy? Abundance together with long peace, and plenty. Besides, if this would not do, God has added corrections with all these, in every element, in every manner, infection in the air, judgments in inundations; we have had rumors of wars, etc. threatenings, shakings of the rod only, but such as might have awaked us; And then He has knocked at our hearts by the example of other nations. By what He has done to them, He has showed us what He might justly have done to us; we are no better then they.”

— Richard Sibbes, Bowels Opened, (London: G.M., 1639) | 5th Sermon, pp. 153-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+if+we+give+not+entrance+to+Christ%2C+all+this+will+be+a+further+aggravation+of+our+damnation.+How+will+this+justify+the+sentence+upon+us+hereafter%2C+when+Christ+shall+set+us+on+the+left+hand+%28Mt.+25%29+and+say%3A+%E2%80%98Depart+from+Me+%5BMt.+7%5D%2C+for+I+invited+you+to+come+to+Me%2C+I+knocked+at+the+door+of+your+hearts%2C+and+you+would+give+Me+no+entrance.+%E2%80%98Depart+from+us%2C%E2%80%99+said+you%3B+Therefore+now+depart+you+from+Me.%E2%80%99+What+do+profane+persons+in+the+Church%2C+but+bid+Christ+depart+from+them%2C+especially+in+the+motions+of+his+Spirit%3B+they+entertain+Him+in+the+outward+room%2C+the+brain%3B+they+know+a+little+of+Christ%2C+but+in+the+heart%2C+the+secret+room%2C+He+must+not+come+there+to+rule.+Is+it+not+equal+that+He+should+bid+us+%28Mt.+23%3A41%29%2C+%E2%80%98Depart+ye+cursed+I+know+you+not%3F+You+would+not+give+entrance+to+Me%2C+I+will+not+now+to+you.%E2%80%99+As+to+the+foolish+virgins+He+speaks+and%2C+Prov.+1%3A28%2C+wisdom+knocks+and+has+no+entrance%2C+therefore+in+times+of+danger%2C+they+call+upon+her%2C+but+she+rejoices+at+their+destruction%3B+Where+God+magnifies+his+mercy+in+this+kind+in+sweet+allurements+and+inviting+by+judgments%2C+mercies%2C+ministry+and+Spirit%2C+He+will+magnify+his+judgment+after.+Those+that+have+neglected+Heaven+with+the+prerogatives%2C+and+advantages+in+this+kind%2C+they+shall+be+cast+into+Hell.+%E2%80%98Woe+to+thee+Chorazin%2C%E2%80%99+etc.+as+you+know+in+the+Gospel+%28Mt.+11%3A21%29.+This+is+one+thing+that+may+humble+us+of+this+place+and+nation%2C+that+Christ+has+no+further+entrance%2C+nor+better+entertainment+after+so+long+knocking%3F+For+the+entertaining+of+his+Word+is+the+welcoming+of+Himself%2C+as+it+is%2C+Col.+3%3A16%2C+%E2%80%98Let+the+word+of+God+dwell+plentifully+in+you%2C%E2%80%99+and+%E2%80%98Let+Christ+dwell+in+your+hearts+by+faith.%E2%80%99+Eph.+3%3A17.+Compare+those+places%2C+Let+the+Word+dwell+plenteously+in+you+by+wisdom%2C+and+let+Christ+dwell+in+your+hearts+by+faith.+For+then+does+Christ+dwell+in+the+heart+when+the+truth+dwells+in+us.+Therefore+what+entertainment+we+give+to+his+truth%2C+we+give+to+Himself.+Now+what+means+of+knocking+has+He+not+used+among+us+a+long+time%3F+For+works+of+all+sorts%2C+He+has+drawn+us+by+the+cords+of+a+man%2C+by+all+kind+of+favors.+For+mercies%2C+How+many+deliverances+have+we+had+%28No+nation+the+like%3B+we+are+a+miracle+of+the+Christian+world%29+from+foreign+invasion+and+domestical+conspiracies+at+home%3F+How+many+mercies+do+we+enjoy%3F+Abundance+together+with+long+peace%2C+and+plenty.+Besides%2C+if+this+would+not+do%2C+God+has+added+corrections+with+all+these%2C+in+every+element%2C+in+every+manner%2C+infection+in+the+air%2C+judgments+in+inundations%3B+we+have+had+rumors+of+wars%2C+etc.+threatenings%2C+shakings+of+the+rod+only%2C+but+such+as+might+have+awaked+us%3B+And+then+He+has+knocked+at+our+hearts+by+the+example+of+other+nations.+By+what+He+has+done+to+them%2C+He+has+showed+us+what+He+might+justly+have+done+to+us%3B+we+are+no+better+then+they.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+Bowels+Opened%2C+%28London%3A+G.M.%2C+1639%29+%7C+5th+Sermon%2C+pp.+153-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F12412e837b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/12412e837b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=For%20if%20we%20give%20not%20entrance,we%20are%20no%20better%20then%20they&amp;text=For%20if%20we%20give%20not%20entrance%20to%20Christ&amp;text=to%20us%3B%20we%20are%20no%20better%20then%20they" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

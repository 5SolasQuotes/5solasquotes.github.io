<blockquote><p>because they had not freedom to retract their Protestation, and profess their sorrow for it, two sinful terms of ministerial communion have been imposed:

1. That no minister of this Church should testify from the pulpit against acts of Assembly, and proceedings of Church judicatories, even though they were such as had a direct tendency to undermine our constitution.

2. That no minister or member of this Church should protest, for their own exoneration, against acts, sentences, or decisions of the supreme judicatory, even though they should nearly affect the public cause of God and restrain ministerial freedom and faithfulness in testifying against the sins and defections of a backsliding Church.</p></blockquote>

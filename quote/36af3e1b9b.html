<main class="wrap"><figure class="quote" id="q-36af3e1b9b" data-kw="">
<blockquote><p>Good works proceed from saving faith; faith that does not bear fruit is not saving faith (see James 2:19). James 2:24 is talking about works as fruit and evidence of saving faith, not meritorious works that save us. In fact, James reminds us what kind of perfection is required in order for our works to merit salvation: “For whoever keeps the whole law but fails in one point has become guilty of all of it.” (James 2:10) Thus, if you want to boast in your works, or even in your work of faith, James reminds us that you must keep every point of the law, since even one miss justifies our condemnation for the entire law (see Gal. 5:3-4). And there is only one man who kept the law perfectly, the man Christ Jesus (Heb. 4:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Are Good Works Enough?</cite>, May 19. 2022</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da668ac3be" data-kw="">
<blockquote><p>The formal cause, they say, is the justice of God; not that justice, whereby he himself is just; but that which he communicateth unto us, whereby we truly both are counted just, and also are so indeed. By which words they understand the renewing of a man now regenerate, and his new forming by grace and the holy Ghost. The which things, that they are done in a man already justified, we deny not: but that justification consisteth therein, we cannot grant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, Part 3, ch. 4: Of Justification, § 46</span></figcaption>

</figure><figure class="quote" id="q-28f4208cc7" data-kw="">
<blockquote><p>§IV. For first, whereas justification before God is but one, wherein the Lord by imputation of Christ’s righteousness to a believing sinner does absolve him from his sins and also accepts of him as righteous in Christ, not only in the first moment of justification, wherein being a sinner in himself he was first constituted righteous in Christ: but also in the continuance of justification, wherein the believer being still a sinner in himself, is continued in the favor of God by the merits and intercession of Christ: and though a sinner in himself, yet believing in Him that justifies a sinner, is made the righteousness of God in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 3, ‘Bellarmine’s answers… refuted’, p. 451</span></figcaption>

</figure><figure class="quote" id="q-70d3190d07" data-kw="">
<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>

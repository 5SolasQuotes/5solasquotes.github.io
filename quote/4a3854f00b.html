<main class="wrap"><figure class="quote" id="q-4a3854f00b" data-kw="">
<blockquote><p>That which pertains to the seventh day is expedient for the human being, tied up with various occupations, that God should choose one day for him in which he should exercise himself more greatly in prayer, and take delight in God more than on other days. We know Sabbath observation is perpetual among Christians, in order that they should abstain from sins and wickedness that offend God. But the time for working is fixed. God blessed the seventh day and without doubt set it apart for us, and he admonished us that if we would sanctify it to the Lord, then we would not be deprived of its blessing. It is true rest from external works, so that we might rejoice and take delight in the Lord. For all things have been made on our account, and, lest anyone should think that we Judaize, even the Sabbath was established for humankind.

We know what liberty of conscience is, but at the same time we should pay attention to the weakness of the people. If only the whole multitude would keep the Sabbath perpetually and no one would refuse. But since of course this is never achieved, we at least request that those whose concern it is would grant a certain day to the weak people, which they might consecrate to God. Not that we would intend other days for foolishness and those things which are opposed to God, but we seek that one day that we might reserve specially for God, and faith requires this. And if we do not do this we show that there is little of faith in us. Do we think that God cannot feed us unless we work every day? Some sin greatly in this matter, for they allow no rest or time off for servants or beasts of burden, as if God were not able to support them unless they work all the time. Paul in Hebrews 3 and 4 sweetly alludes to the Sabbath day and why it ought to be observed with the greatest diligence, and he says that we will be able to enter into that rest, and so on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Genesis</cite>, trans. Mickey Mattox, Reformation Texts with Translation, no. 13 (1531; Milwaukee WI: Marquette University Press, 2013), pp 113, 115.</span></figcaption>

<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>

<blockquote><p>1. What it is that is the formal reason of it, — that which renders him a meet object of the church’s worship, and the church’s worship to be truly divine or religious. 2. What is the principal motive prevailing with us to give him this glory and honour. For the first, it is no other but the divine nature. The natural and essential excellencies of the Deity are the formal reason and proper object of all divine worship.

We worship the Lord Christ, who is God and man. He is so in one person; and his person who is God and man is the object of that worship. But the formal reason and object of it is the divine nature in that person. Give me leave to say, God himself could not command the Lord Christ to be worshipped with divine religious adoration were he not God by nature, for the thing itself implieth a contradiction. Religious worship is nothing but an assignation of that honour which is due to divine excellencies; namely, to trust, believe, fear, obey, love, and submit unto infinite holiness, goodness, righteousness, power, in the first cause, last end, and sovereign Lord of all.

Now, to assign glory proper to divine excellencies, and which receiveth its nature from its object, where divine excellencies are not, is openly contradictory. Besides, God hath said, “I am the LORD: that is my name: and my glory will I not give to another,” Isa. xlii. 8. He that hath not the name of God, (that is, his nature,) shall not, nor can have this glory, which is to be the object of the worship mentioned. And there are scarcely more gross idolaters in the world than those who profess to worship Christ and to believe in him, in a word, to give him all the glory that is due to God, and yet deny him so to be.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. What it is that is the formal reason of it, — that which renders him a meet object of the church’s worship, and the church’s worship to be truly divine or religious. 2. What is the principal motive prevailing with us to give him this glory and honour. For the first, it is no other but the divine nature. The natural and essential excellencies of the Deity are the formal reason and proper object of all divine worship.

We worship the Lord Christ, who is God and man. He is so in one person; and his person who is God and man is the object of that worship. But the formal reason and object of it is the divine nature in that person. Give me leave to say, God himself could not command the Lord Christ to be worshipped with divine religious adoration were he not God by nature, for the thing itself implieth a contradiction. Religious worship is nothing but an assignation of that honour which is due to divine excellencies; namely, to trust, believe, fear, obey, love, and submit unto infinite holiness, goodness, righteousness, power, in the first cause, last end, and sovereign Lord of all.

Now, to assign glory proper to divine excellencies, and which receiveth its nature from its object, where divine excellencies are not, is openly contradictory. Besides, God hath said, “I am the LORD: that is my name: and my glory will I not give to another,” Isa. xlii. 8. He that hath not the name of God, (that is, his nature,) shall not, nor can have this glory, which is to be the object of the worship mentioned. And there are scarcely more gross idolaters in the world than those who profess to worship Christ and to believe in him, in a word, to give him all the glory that is due to God, and yet deny him so to be.”

— John Owen, An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 549-50.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+What+it+is+that+is+the+formal+reason+of+it%2C+%E2%80%94+that+which+renders+him+a+meet+object+of+the+church%E2%80%99s+worship%2C+and+the+church%E2%80%99s+worship+to+be+truly+divine+or+religious.+2.+What+is+the+principal+motive+prevailing+with+us+to+give+him+this+glory+and+honour.+For+the+first%2C+it+is+no+other+but+the+divine+nature.+The+natural+and+essential+excellencies+of+the+Deity+are+the+formal+reason+and+proper+object+of+all+divine+worship.%0A%0AWe+worship+the+Lord+Christ%2C+who+is+God+and+man.+He+is+so+in+one+person%3B+and+his+person+who+is+God+and+man+is+the+object+of+that+worship.+But+the+formal+reason+and+object+of+it+is+the+divine+nature+in+that+person.+Give+me+leave+to+say%2C+God+himself+could+not+command+the+Lord+Christ+to+be+worshipped+with+divine+religious+adoration+were+he+not+God+by+nature%2C+for+the+thing+itself+implieth+a+contradiction.+Religious+worship+is+nothing+but+an+assignation+of+that+honour+which+is+due+to+divine+excellencies%3B+namely%2C+to+trust%2C+believe%2C+fear%2C+obey%2C+love%2C+and+submit+unto+infinite+holiness%2C+goodness%2C+righteousness%2C+power%2C+in+the+first+cause%2C+last+end%2C+and+sovereign+Lord+of+all.%0A%0ANow%2C+to+assign+glory+proper+to+divine+excellencies%2C+and+which+receiveth+its+nature+from+its+object%2C+where+divine+excellencies+are+not%2C+is+openly+contradictory.+Besides%2C+God+hath+said%2C+%E2%80%9CI+am+the+LORD%3A+that+is+my+name%3A+and+my+glory+will+I+not+give+to+another%2C%E2%80%9D+Isa.+xlii.+8.+He+that+hath+not+the+name+of+God%2C+%28that+is%2C+his+nature%2C%29+shall+not%2C+nor+can+have+this+glory%2C+which+is+to+be+the+object+of+the+worship+mentioned.+And+there+are+scarcely+more+gross+idolaters+in+the+world+than+those+who+profess+to+worship+Christ+and+to+believe+in+him%2C+in+a+word%2C+to+give+him+all+the+glory+that+is+due+to+God%2C+and+yet+deny+him+so+to+be.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews.+With+Preliminary+Exercitations%2C+ed.+W.+H.+Goold+%281674%3B+7+vols%2C+Edinburgh%3A+Johnston+and+Hunter%2C+1854%29%2C+3%3A+549-50.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd702871534.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d702871534.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/14/john-owen-on-worshipping-christ-the-god-man/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The scope, end and sum of this [2nd] Commandment is to order us in the solemn worship of God, called Heb. 9:1, ‘Ordinances of divine service,’ and usually termed ‘religious exercises.’ For the constituting of a solemn worship of God three things are required:

1. That it be done with immediate reference to God, and that Himself or something in his stead be made the object thereof, and so therein we draw near to Him, and He to us.

2. That it tend in the doer’s intention directly and of itself to the honoring of God and pleasing Him, and getting of grace from him, by exercising of some or all the virtues required in the First Commandment.

3. That there be a separating of ourselves from all other businesses to be wholly and altogether employed about such acts in which the difference between common and solemn worship does seem to stand. Worship consists in three things:

1. There must be a right knowledge and high apprehension of God, the person to be worshipped.

2. A reflexion of this knowledge.

3. An abasement of the creature under the reflexion of this knowledge, Rev. 5: Christ is represented as sitting on a throne. The people of God are there brought in as compassing Him about, they have high apprehensions of the person of Christ, his glory and holiness.

2. They reflect these excellencies.

3. They abase themselves, fall on their faces, vers. ult. Every religious exercise or ordinance of divine service has usually divers particular acts, that be as parts of the whole, and in the orderly uniting of which the whole is accomplished. And whatsoever is done in any such exercise of religion, for the end and purpose of pleasing God and getting grace from him with respect of conscience to Him (as esteeming that He must and will have it so, or else the service shall not be well-pleasing and acceptable to Him) this is a part of worship, or of divine service. For example: a man brought an ox or a ram, a lamb or such like thing, and presented it to the priest, he did offer it unto God, and that directly with intention of exercising obedience and faith to God. Likewise this offering was to be made by a certain person in a certain place, at a certain time, with certain garments and rites: So all those observations became parts of this worship; for in these also the intention of the doer was directly carried to God, hoping and purposing by them to please God and exercise faith and obedience, and other graces, as well and as much as by the very offering itself, and accounting the service not to be acceptable to God without them.</p></blockquote>

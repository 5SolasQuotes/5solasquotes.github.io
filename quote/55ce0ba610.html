<main class="wrap"><figure class="quote" id="q-55ce0ba610" data-kw="">
<blockquote><p>In the first place, that the righteousness by which we are justified before God is not of works, is not only asserted, but proved. The apostle’s first argument on this point is derived from the consideration, that the law demands a perfect righteousness. If the law was satisfied by an imperfect obedience, or by a routine of external duties, or by any service which men are competent to render, then indeed justification would be by works. But since it demands perfect obedience, justification by works is, for sinners, absolutely impossible. It is thus the apostle reasons, ‘As many as are of the works of the law are under the curse: for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them’ (Gal. 3:10). As the law pronounces its curse upon every man who continues not to do all that it commands, and as no man can pretend to this perfect obedience, it follows that all who look to the law for justification must be condemned. To the same effect, in a following verse, he says, ‘The law is not of faith: but, The man that doeth them shall live in them.’ That is, the law is not satisfied by any single grace, or imperfect obedience. It knows, and can know no other ground of justification than complete compliance with its demands. Hence, in the same chapter, Paul says, ‘If there had been a law given which could have given life, verily righteousness should have been by the law.’ Could the law pronounce righteous, and thus give a title to the promised life to those who had broken its commands, there would have been no necessity of any other provision for the salvation of men; but as the law cannot thus lower its demands, justification by the law is impossible. The same truth is taught in a different form, when it is said, ‘If righteousness come by the law, then Christ is dead in vain’ (Gal. 2:21). There would have been no necessity for the death of Christ, if it had been possible to satisfy the law by the imperfect obedience which we can render. Paul therefore warns all those who look to works for justification, that they are debtors to do the whole law (Gal. 5:3). It knows no compromise; it cannot demand less than what is right, and perfect obedience is right , and therefore its only language is as before, ‘Cursed is every one that continueth not in all things which are written in the book of the law to do them’ (Gal. 3:10); and, ‘The man which doeth those things shall live by them’ (Rom. 10:5). Every man, therefore, who expects justification by works, must see to it, not that he is better than other men, or that he is very exact and does many things, or that he fasts twice in the week, and gives tithes of all he possesses, but that he is SINLESS.</p></blockquote>

<blockquote><p>§VI. Thirdly, when we say it [justification] is an action of God imputing to a believing sinner, etc. we consider it not as a sudden and momentary action which is of no continuance, as if all our sins both past, present and to come are remitted in an instant, but as an act of God continued from our vocation [calling], wherein the grace of faith is begotten in us, to our glorification, which is the end of our faith. For as this action of God is called the justification of a sinner, so while we continue sinners, we have still need to be justified. And as we always have sin in this life, so that it may not be imputed, we have need, that Christ’s righteousness should be imputed unto us; and that as we sin daily, so Christ our advocate should continually make intercession for us: that notwithstanding our manifold slips, whereinto through human frailty we fall, and notwithstanding those manifold infirmities and corruptions which remain in us as the relics of original sin, we may be continued in the grace and favor of God by the continued imputation of Christ’s righteousness obtained by his continual intercession for us. For therefore does he continue his intercession for us that our justification may be continued to us, and that as we sin daily, so we may daily seek and obtain pardon. But if justification should so be wrought once and at once, as that after that act wrought in an instance, we should no more be justified, nor no more need remission of sin, then must we erroneously conceive that the sins which after the first moment of our justification we do commit, are actually remitted before they be committed; whereas God forgives only sins past, Rom. 3:25. So shall we not only set open a gap to all licentiousness (for who will so fear to commit sin as he ought, or when he has committed it so sue for the pardon thereof who is persuaded beforehand that it is already remitted), but also shall open the mouths of our adversaries, who will be ready to say, that we Protestants ought not to pray for remission of sin, because in our opinion (as they say) we need it not: but to this calumniation of the Papist I have elsewhere answered. §. VII. If it be said that it is a received opinion among many that justificatio simul et semel sit, that ‘justification is wrought at once, and but once,’ I answer that that assertion is not to be admitted without distinction, nor without good caution. The distinction is this, that there is a justification of a sinner before God in foro coelesti, which properly is called justification, and is that which here I have defined: and there is a justification whereby a man already justified before God is justified in foro conscientiae, in the court of his own conscience: which is not properly justification itself, but the assurance of it. To this latter that assertion of but once and at once cannot in any good sense be applied. For neither is the full assurance of our justification attained at once, but by degrees, wherein we are to labor and to give diligence to make, as our election and calling, so also our justification more and more sure unto us. Neither is it given but once. For by committing of any crime or any grievous sin, by spiritual desertions, by the forcible temptations of Satan, this act of spiritual faith, which we call assurance, may be interrupted or lost for a time; and yet by repentance, by prayer and practice of piety it may be recovered again, and therefore not given but once. To the former indeed it may be applied in both parts, but with a twofold caution: first, in respect of simul, at once, if it be understood as excluding degrees, and not continuance. Namely, that we are not justified by degrees, and as it were by little and little, as though our justification were not perfect at the first. For no sooner does a man truly believe in Christ, but the righteousness of Christ is imputed to him, and in and by that righteousness he stands righteous before God, as well at the first, as at the last; that righteousness of Christ by which he is justified, whether first or last, being most perfect. Therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men: howsoever the assurance of justification, and the work of sanctification, whereby we are to be renewed in the inner man day by day have degrees, according to the degrees of our faith, and according to the measure of grace received. Secondly, when it is said that we are justified before God semel, but once, that also may be admitted, if by once be meant one continual act. For as we are regenerated but once, because ut semel nascimur, ita semel renascimur, [‘as we have been born once, so we have been reborn once,’] so faith, which is wrought in our regeneration is given but once. For that which saint Jude says, verse 3, of faith once given, is no less true of the habit [abiding principle] than of the doctrine of faith; which habit, being once had, is never utterly lost. For all they who have true faith, are born of God, 1 Jn. 5:1; Jn. 1:12-13. And those who are once born of God are never unborn again; but being made sons by faith, as all the faithful are, Gal. 3:26, they are also made heirs of God and coheirs with Christ, Rom. 8:17. As faith therefore is never utterly lost, no more is justification. For so long as we have faith, so long we are justified. But the habit of faith we never lose, though perhaps some act of faith may sometimes be interrupted. Therefore our justification is but one continued act, and in that sense we are justified but once. §VIII. Now whereas we have defined and defended according to the Scriptures that justification is an action of God, and such an action as is without us and a continued act: hence we may conclude against the Papists: First, that neither their first, nor second justification is that justification which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“§VI. Thirdly, when we say it [justification] is an action of God imputing to a believing sinner, etc. we consider it not as a sudden and momentary action which is of no continuance, as if all our sins both past, present and to come are remitted in an instant, but as an act of God continued from our vocation [calling], wherein the grace of faith is begotten in us, to our glorification, which is the end of our faith. For as this action of God is called the justification of a sinner, so while we continue sinners, we have still need to be justified. And as we always have sin in this life, so that it may not be imputed, we have need, that Christ’s righteousness should be imputed unto us; and that as we sin daily, so Christ our advocate should continually make intercession for us: that notwithstanding our manifold slips, whereinto through human frailty we fall, and notwithstanding those manifold infirmities and corruptions which remain in us as the relics of original sin, we may be continued in the grace and favor of God by the continued imputation of Christ’s righteousness obtained by his continual intercession for us. For therefore does he continue his intercession for us that our justification may be continued to us, and that as we sin daily, so we may daily seek and obtain pardon. But if justification should so be wrought once and at once, as that after that act wrought in an instance, we should no more be justified, nor no more need remission of sin, then must we erroneously conceive that the sins which after the first moment of our justification we do commit, are actually remitted before they be committed; whereas God forgives only sins past, Rom. 3:25. So shall we not only set open a gap to all licentiousness (for who will so fear to commit sin as he ought, or when he has committed it so sue for the pardon thereof who is persuaded beforehand that it is already remitted), but also shall open the mouths of our adversaries, who will be ready to say, that we Protestants ought not to pray for remission of sin, because in our opinion (as they say) we need it not: but to this calumniation of the Papist I have elsewhere answered. §. VII. If it be said that it is a received opinion among many that justificatio simul et semel sit, that ‘justification is wrought at once, and but once,’ I answer that that assertion is not to be admitted without distinction, nor without good caution. The distinction is this, that there is a justification of a sinner before God in foro coelesti, which properly is called justification, and is that which here I have defined: and there is a justification whereby a man already justified before God is justified in foro conscientiae, in the court of his own conscience: which is not properly justification itself, but the assurance of it. To this latter that assertion of but once and at once cannot in any good sense be applied. For neither is the full assurance of our justification attained at once, but by degrees, wherein we are to labor and to give diligence to make, as our election and calling, so also our justification more and more sure unto us. Neither is it given but once. For by committing of any crime or any grievous sin, by spiritual desertions, by the forcible temptations of Satan, this act of spiritual faith, which we call assurance, may be interrupted or lost for a time; and yet by repentance, by prayer and practice of piety it may be recovered again, and therefore not given but once. To the former indeed it may be applied in both parts, but with a twofold caution: first, in respect of simul, at once, if it be understood as excluding degrees, and not continuance. Namely, that we are not justified by degrees, and as it were by little and little, as though our justification were not perfect at the first. For no sooner does a man truly believe in Christ, but the righteousness of Christ is imputed to him, and in and by that righteousness he stands righteous before God, as well at the first, as at the last; that righteousness of Christ by which he is justified, whether first or last, being most perfect. Therefore the righteousness of justification cannot be increased, neither does our justification before God admit degrees, either in one and the same person, or yet in diverse men: howsoever the assurance of justification, and the work of sanctification, whereby we are to be renewed in the inner man day by day have degrees, according to the degrees of our faith, and according to the measure of grace received. Secondly, when it is said that we are justified before God semel, but once, that also may be admitted, if by once be meant one continual act. For as we are regenerated but once, because ut semel nascimur, ita semel renascimur, [‘as we have been born once, so we have been reborn once,’] so faith, which is wrought in our regeneration is given but once. For that which saint Jude says, verse 3, of faith once given, is no less true of the habit [abiding principle] than of the doctrine of faith; which habit, being once had, is never utterly lost. For all they who have true faith, are born of God, 1 Jn. 5:1; Jn. 1:12-13. And those who are once born of God are never unborn again; but being made sons by faith, as all the faithful are, Gal. 3:26, they are also made heirs of God and coheirs with Christ, Rom. 8:17. As faith therefore is never utterly lost, no more is justification. For so long as we have faith, so long we are justified. But the habit of faith we never lose, though perhaps some act of faith may sometimes be interrupted. Therefore our justification is but one continued act, and in that sense we are justified but once. §VIII. Now whereas we have defined and defended according to the Scriptures that justification is an action of God, and such an action as is without us and a continued act: hence we may conclude against the Papists: First, that neither their first, nor second justification is that justification which is taught in the Scriptures… Not, that we deny, that inherent righteousness is by practice of good works increased; but that we hold that justification is not our own act, neither that we are justified by any righteousness inherent in ourselves, or performed by ourselves, nor that the righteousness of justification (which is indeed the righteousness of Christ) can be increased, and therefore no degrees of justification. … Thirdly, they do not hold justification to be one continued act from our vocation to our glorification, but such an act as may not only be interrupted oftentimes and lost for a time, as they say it is, by every mortal sin and again be renewed so oft as they go to shrift; but also that it may totally and finally be lost. Which error I have confuted at large in my treatise of Perseverance.”

— George Downame, A Treatise of Justification (London: 1633), ch. 1, pp. 5-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7VI.+Thirdly%2C+when+we+say+it+%5Bjustification%5D+is+an+action+of+God+imputing+to+a+believing+sinner%2C+etc.+we+consider+it+not+as+a+sudden+and+momentary+action+which+is+of+no+continuance%2C+as+if+all+our+sins+both+past%2C+present+and+to+come+are+remitted+in+an+instant%2C+but+as+an+act+of+God+continued+from+our+vocation+%5Bcalling%5D%2C+wherein+the+grace+of+faith+is+begotten+in+us%2C+to+our+glorification%2C+which+is+the+end+of+our+faith.+For+as+this+action+of+God+is+called+the+justification+of+a+sinner%2C+so+while+we+continue+sinners%2C+we+have+still+need+to+be+justified.+And+as+we+always+have+sin+in+this+life%2C+so+that+it+may+not+be+imputed%2C+we+have+need%2C+that+Christ%E2%80%99s+righteousness+should+be+imputed+unto+us%3B+and+that+as+we+sin+daily%2C+so+Christ+our+advocate+should+continually+make+intercession+for+us%3A+that+notwithstanding+our+manifold+slips%2C+whereinto+through+human+frailty+we+fall%2C+and+notwithstanding+those+manifold+infirmities+and+corruptions+which+remain+in+us+as+the+relics+of+original+sin%2C+we+may+be+continued+in+the+grace+and+favor+of+God+by+the+continued+imputation+of+Christ%E2%80%99s+righteousness+obtained+by+his+continual+intercession+for+us.+For+therefore+does+he+continue+his+intercession+for+us+that+our+justification+may+be+continued+to+us%2C+and+that+as+we+sin+daily%2C+so+we+may+daily+seek+and+obtain+pardon.+But+if+justification+should+so+be+wrought+once+and+at+once%2C+as+that+after+that+act+wrought+in+an+instance%2C+we+should+no+more+be+justified%2C+nor+no+more+need+remission+of+sin%2C+then+must+we+erroneously+conceive+that+the+sins+which+after+the+first+moment+of+our+justification+we+do+commit%2C+are+actually+remitted+before+they+be+committed%3B+whereas+God+forgives+only+sins+past%2C+Rom.+3%3A25.+So+shall+we+not+only+set+open+a+gap+to+all+licentiousness+%28for+who+will+so+fear+to+commit+sin+as+he+ought%2C+or+when+he+has+committed+it+so+sue+for+the+pardon+thereof+who+is+persuaded+beforehand+that+it+is+already+remitted%29%2C+but+also+shall+open+the+mouths+of+our+adversaries%2C+who+will+be+ready+to+say%2C+that+we+Protestants+ought+not+to+pray+for+remission+of+sin%2C+because+in+our+opinion+%28as+they+say%29+we+need+it+not%3A+but+to+this+calumniation+of+the+Papist+I+have+elsewhere+answered.+%C2%A7.+VII.+If+it+be+said+that+it+is+a+received+opinion+among+many+that+justificatio+simul+et+semel+sit%2C+that+%E2%80%98justification+is+wrought+at+once%2C+and+but+once%2C%E2%80%99+I+answer+that+that+assertion+is+not+to+be+admitted+without+distinction%2C+nor+without+good+caution.+The+distinction+is+this%2C+that+there+is+a+justification+of+a+sinner+before+God+in+foro+coelesti%2C+which+properly+is+called+justification%2C+and+is+that+which+here+I+have+defined%3A+and+there+is+a+justification+whereby+a+man+already+justified+before+God+is+justified+in+foro+conscientiae%2C+in+the+court+of+his+own+conscience%3A+which+is+not+properly+justification+itself%2C+but+the+assurance+of+it.+To+this+latter+that+assertion+of+but+once+and+at+once+cannot+in+any+good+sense+be+applied.+For+neither+is+the+full+assurance+of+our+justification+attained+at+once%2C+but+by+degrees%2C+wherein+we+are+to+labor+and+to+give+diligence+to+make%2C+as+our+election+and+calling%2C+so+also+our+justification+more+and+more+sure+unto+us.+Neither+is+it+given+but+once.+For+by+committing+of+any+crime+or+any+grievous+sin%2C+by+spiritual+desertions%2C+by+the+forcible+temptations+of+Satan%2C+this+act+of+spiritual+faith%2C+which+we+call+assurance%2C+may+be+interrupted+or+lost+for+a+time%3B+and+yet+by+repentance%2C+by+prayer+and+practice+of+piety+it+may+be+recovered+again%2C+and+therefore+not+given+but+once.+To+the+former+indeed+it+may+be+applied+in+both+parts%2C+but+with+a+twofold+caution%3A+first%2C+in+respect+of+simul%2C+at+once%2C+if+it+be+understood+as+excluding+degrees%2C+and+not+continuance.+Namely%2C+that+we+are+not+justified+by+degrees%2C+and+as+it+were+by+little+and+little%2C+as+though+our+justification+were+not+perfect+at+the+first.+For+no+sooner+does+a+man+truly+believe+in+Christ%2C+but+the+righteousness+of+Christ+is+imputed+to+him%2C+and+in+and+by+that+righteousness+he+stands+righteous+before+God%2C+as+well+at+the+first%2C+as+at+the+last%3B+that+righteousness+of+Christ+by+which+he+is+justified%2C+whether+first+or+last%2C+being+most+perfect.+Therefore+the+righteousness+of+justification+cannot+be+increased%2C+neither+does+our+justification+before+God+admit+degrees%2C+either+in+one+and+the+same+person%2C+or+yet+in+diverse+men%3A+howsoever+the+assurance+of+justification%2C+and+the+work+of+sanctification%2C+whereby+we+are+to+be+renewed+in+the+inner+man+day+by+day+have+degrees%2C+according+to+the+degrees+of+our+faith%2C+and+according+to+the+measure+of+grace+received.+Secondly%2C+when+it+is+said+that+we+are+justified+before+God+semel%2C+but+once%2C+that+also+may+be+admitted%2C+if+by+once+be+meant+one+continual+act.+For+as+we+are+regenerated+but+once%2C+because+ut+semel+nascimur%2C+ita+semel+renascimur%2C+%5B%E2%80%98as+we+have+been+born+once%2C+so+we+have+been+reborn+once%2C%E2%80%99%5D+so+faith%2C+which+is+wrought+in+our+regeneration+is+given+but+once.+For+that+which+saint+Jude+says%2C+verse+3%2C+of+faith+once+given%2C+is+no+less+true+of+the+habit+%5Babiding+principle%5D+than+of+the+doctrine+of+faith%3B+which+habit%2C+being+once+had%2C+is+never+utterly+lost.+For+all+they+who+have+true+faith%2C+are+born+of+God%2C+1+Jn.+5%3A1%3B+Jn.+1%3A12-13.+And+those+who+are+once+born+of+God+are+never+unborn+again%3B+but+being+made+sons+by+faith%2C+as+all+the+faithful+are%2C+Gal.+3%3A26%2C+they+are+also+made+heirs+of+God+and+coheirs+with+Christ%2C+Rom.+8%3A17.+As+faith+therefore+is+never+utterly+lost%2C+no+more+is+justification.+For+so+long+as+we+have+faith%2C+so+long+we+are+justified.+But+the+habit+of+faith+we+never+lose%2C+though+perhaps+some+act+of+faith+may+sometimes+be+interrupted.+Therefore+our+justification+is+but+one+continued+act%2C+and+in+that+sense+we+are+justified+but+once.+%C2%A7VIII.+Now+whereas+we+have+defined+and+defended+according+to+the+Scriptures+that+justification+is+an+action+of+God%2C+and+such+an+action+as+is+without+us+and+a+continued+act%3A+hence+we+may+conclude+against+the+Papists%3A+First%2C+that+neither+their+first%2C+nor+second+justification+is+that+justification+which+is+taught+in+the+Scriptures%E2%80%A6+Not%2C+that+we+deny%2C+that+inherent+righteousness+is+by+practice+of+good+works+increased%3B+but+that+we+hold+that+justification+is+not+our+own+act%2C+neither+that+we+are+justified+by+any+righteousness+inherent+in+ourselves%2C+or+performed+by+ourselves%2C+nor+that+the+righteousness+of+justification+%28which+is+indeed+the+righteousness+of+Christ%29+can+be+increased%2C+and+therefore+no+degrees+of+justification.+%E2%80%A6+Thirdly%2C+they+do+not+hold+justification+to+be+one+continued+act+from+our+vocation+to+our+glorification%2C+but+such+an+act+as+may+not+only+be+interrupted+oftentimes+and+lost+for+a+time%2C+as+they+say+it+is%2C+by+every+mortal+sin+and+again+be+renewed+so+oft+as+they+go+to+shrift%3B+but+also+that+it+may+totally+and+finally+be+lost.+Which+error+I+have+confuted+at+large+in+my+treatise+of+Perseverance.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+A+Treatise+of+Justification+%28London%3A+1633%29%2C+ch.+1%2C+pp.+5-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F87e306e19e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/87e306e19e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=VI.%20Thirdly%2C%20when%20we%20say%20it,large%20in%20my%20treatise%20of%20Perseverance&amp;text=VI.%20Thirdly%2C%20when%20we%20say%20it%20%5Bjustification%5D%20is&amp;text=confuted%20at%20large%20in%20my%20treatise%20of%20Perseverance" rel="noopener" target="_blank">Read it online · Reformed Books Onl

<main class="wrap"><figure class="quote" id="q-5f5b1e2a9e" data-kw="">
<blockquote><p>[407] Although vicarious atonement as the acquisition of salvation in its totality cannot therefore be expanded to include all persons individually, this is not to say that it has no significance for those who are lost. Between the church and the world there is, at this point, not just separation and contrast. It is not the case that Christ has acquired everything for the former and nothing for the latter. … And also his work has value for all, even for those who have not believed and will never believe in Him. For though it is true that Christ did not, strictly speaking, acquire the natural life by his suffering and death, yet the human race was spared on account of the fact that Christ would come to save it. Christ is not the head of all human beings, not the prophet, priest, and king of everyone, for He is the head of the church and has been anointed king over Zion. Yet all human beings owe a great deal to Christ. The light shines in the darkness and illumines every person coming into the world. The world was made through him and remains so, though it did not recognize him. Also as the Christ, He gives to unbelievers many benefits: the call of the gospel, the warning to repent, historical faith, a virtuous life, a variety of gifts and powers, offices and ministries within the church, such as, for example, even the office of an apostle in the case of Judas. “Without Jesus Christ the world would not exist, for it would necessarily either be destroyed or be a hell” (Pascal). Even hanging from the cross, He still prays for forgiveness for the appalling sin being committed by the Jews at that very moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 3:470-75</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac655f2f74" data-kw="">
<blockquote><p>It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>

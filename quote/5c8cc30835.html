<blockquote><p>2. What common error exists concerning the nature of God’s covenants with man?

It is very commonly, but wrongly, stated that God’s covenants with man are of the nature of compacts, agreements or bargains mutually entered into by God and man. There is indeed an element of truth in this idea, for man (through his representatives, Adam and Christ) is a party to the covenants, and must agree to the terms laid down by God. But the idea that a covenant is a compact or agreement tends to lead people to think of God and man as more or less equal parties who mutually NEGOTIATED AND ESTABLISHED the covenant relationship. Such is a serious error.

In every covenant of God with man, the initiative is always taken by God; it is God who lays down all the requirements; man’s part is simply to accept what God provides and obey what God requires. Note, for example, God’s words to Noah: “And I, behold, I establish my covenant with you, and with your seed after you, . . . ” (Gen. 9:9), and to Abraham: “And I will make my covenant between me and thee. . . ” (Gen. 17:2); again, “And I will establish my covenant between me and thee and thy seed after thee in generations, for an everlasting covenant, to be a God unto thee and to thy seed after thee” (Gen. 17:7). God constituted the covenant relationship; Abraham’s part was to believe and obey. The covenant was not negotiated between God and man, it was made by God and sovereignly imposed on man.

3. Why must the covenant relationship be constituted by God rather than by man?

Because of the essential difference between Creator and creature. God and man are not on a plane of equality with each other. God is never dependent on man for anything, but man is always and at every point wholly dependent on God for everything. God is infinite; man is finite. God is eternal; man is subject to time. God is sovereign; man is subject to God’s authority and power. (In this lesson we are not considering human sinfulness, which by Adam’s fall added a new factor to the distance between God and man; we are now considering only the idea of a covenant between God and man; that is, we are considering the situation that existed even before mankind fell into sin).

Because of God’s infinite greatness and man’s total subordination to and dependence on God, the covenant relationship could only be constituted by God, not by man nor by God and man mutually negotiating it. If man is to be in a religious relationship to God, that relationship must be established by God; man could never lift himself up to the plane of religious communion with God.</p></blockquote>

<blockquote><p>5. Now, if we choose to investigate whether it is right to administer baptism to infants, shall we not say that a man is talking nonsense or indeed raving who would halt with the mere element of water and outward observance, but cannot bear to turn his mind to the spiritual mystery? If any account of this is made, it will be evident that baptism is properly administered to infants as something owed to them. For in early times the Lord did not deign to have them circumcised without making them participants in all those things which were then signified by circumcision [cf. Gen. 17:12]. Otherwise, he would have mocked his people with mere trickery if he had nursed them on meaningless symbols, which is a dreadful thing even to hear of. For he expressly declares that the circumcision of a tiny infant will be in lieu of a seal to certify the promise of the covenant. But if the covenant still remains firm and steadfast, it applies no less today to the children of Christians than under the Old Testament it pertained to the infants of the Jews. Yet if they are participants in the thing signified, why shall they be debarred from the sign? If they grasp the truth, why shall they be driven away from the figure? Notwithstanding, the outward sign so cleaves to the word in the sacrament that it cannot be separated from it; yet if the sign is considered separately from the word, which, I ask you, shall we esteem more? Obviously, since we see that the sign serves the word, we shall say that it is under the word, and shall relegate it to a lower place. Therefore, since the word “baptism” is applied to infants, why shall the sign, which is an appendix of the word, be denied to them? This one reason, if no others were at hand, would be quite enough to refute all those who would speak in opposition. The objection that there was a stated day for circumcision is sheer evasion. We admit that we are not now bound to certain days like the Jews; but since the Lord, without fixing the day, yet declares that he is pleased to receive infants into his covenant with a solemn rite, what more do we require?

6. Yet Scripture opens to us a still surer knowledge of the truth. Indeed, it is most evident that the covenant which the Lord once made with Abraham [cf. Gen. 17:14] is no less in force today for Christians than it was of old for the Jewish people, and that this word relates no less to Christians than it then related to the Jews. Unless perhaps we think that Christ by his coming lessened or curtailed the grace of the Father—but this is nothing but execrable blasphemy! Accordingly, the children of the Jews also, because they had been made heirs of his covenant and distinguished from the children of the impious, were called a holy seed [Ezra 9:2; Isa. 6:13]. For this same reason, the children of Christians are considered holy; and even though born with only one believing parent, by the apostle’s testimony they differ from the unclean seed of idolators [1 Cor. 7:14]. Now seeing that the Lord, immediately after making the covenant with Abraham, commanded it to be sealed infants by an outward sacrament [Gen. 17:12], what excuse will Christians give for not testifying and sealing it in their children today? And let no one object against me that the Lord did not command that his covenant be confirmed by any other symbol than circumcision, which has long since been abolished. There is a ready answer that for the time of the Old Testament he instituted circumcision to confirm his covenant, but that after circumcision was abolished, the same reason for confirming his covenant (which we have in common with the Jews) still holds good. Consequently, we must always diligently consider what is common to both, and what they have apart from us. The covenant is common, and the reason for confirming it is common. Only the manner of confirmation is different—what was circumcision for them was replaced for us by baptism. Otherwise, if the testimony by which the Jews were assured of the salvation of their posterity is taken away from us, Christ’s coming would have the effect of making God’s grace more obscure and less attested for us than it had previously been for the Jews. Now, this cannot be said without grievously slandering Christ, through whom the Father’s infinite goodness was more clearly and liberally poured out upon the earth and declared to men than ever before. And if so, we must admit that at least it should not be concealed with more malign intent, nor revealed with weaker testimony than under the dim shadows of the law.</p></blockquote>

</figure><figure class="quote" id="q-fe1fdb3209" data-kw="">
<blockquote><p>That all mankind being, by reason of sin, in a lost and helpless state, and exposed to everlasting misery, God our heavenly Father, so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life; That Christ Jesus was this Son of God, who most willingly undertook the work of our redemption, came from heaven to earth on this most benevolent errand, assumed human nature into a personal union with his own divine nature, and thus became God and man, the fit mediator between the parties to be reconciled in the great concern of man’s salvation:

That the Redeemer, having taken the sinner’s place as his substitute and surety, perfectly obeyed and honoured the law which man had disobeyed and dishonoured, satisfied divine justice completely, by enduring the full penalty of the law, in a whole life of humiliation and suffering, and especially by a death of unspeakable agony and infamy—denominated the cursed death of the cross—and which, as a principal part of his work, is, for that reason, often put for the whole: That the Redeemer, after being laid in a tomb, rose from the dead on the third day, ascended to heaven, and to the right hand of the Father, there to appear forever as the intercessor and advocate of his people:

That thence he sent down the Holy Spirit, to instruct his apostles fully in the nature of his kingdom; to enable them, without study, to speak various languages; to confer on them the power of working miracles; and to complete, without error, the canon of sacred scripture; and also, in every age, to make a saving application of the Redeemer’s work to the human heart, renewing it unto holiness, and implanting and cherishing in it all the Christian graces:

That for the sake of what Christ has done, God can now be just and the justifier of him that believeth in Jesus, even though he be the chief of sinners; and that in the preaching of the gospel, he invites and commands every sinner who hears it, to come and receive a complete salvation, through this precious and all sufficient Saviour:

That accordingly, whenever a sinner, under the influence of the blessed Spirit becomes sensible of his guilt and misery, and on the free offer of Christ and his benefits in the gospel, actually commits his soul by faith to the Saviour, as his sole reliance, he is pardoned and justified, and shall never come into condemnation — That by faith he is united to Christ and made one with him; the righteousness of Christ is imputed to him, or reckoned as his; the work of sanctification, by which he is prepared for heaven, is commenced in his soul; and .the grace of evangelical repentance, with every other grace, being there begun, shall be cherished and carried on, in a course of sincere but imperfect obedience to all the commands of God; till at death, he shall become perfect in holiness, and rise to the enjoyment of all the bliss of heaven:

That thus it shall be with all who accept the gospel offer; while ail who hear and do not accept it, shall be consigned to hopeless misery: That there shall be a resurrection of the dead, both of the just and the unjust, when the soul and body of every individual shall be reunited; and when, before the assembled universe, the Redeemer shall award to his friends eternal life, in his kingdom of glory, and to his enemies eternal punishment, with the devil and his angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ashbel-green.html">Ashbel Green</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ crucified, the characteristick of Apostolick preaching: a sermon delivered in the First Presbyterian Church of Philadelphia, at the opening of the General Assembly of the Presbyterian Church in the United States, May 19, 1825</cite>, (Philadelphia: Clark &amp; Raser, 1825), pp 6-8.</span></figcaption>

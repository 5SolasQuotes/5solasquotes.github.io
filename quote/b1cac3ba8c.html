<main class="wrap"><figure class="quote" id="q-b1cac3ba8c" data-kw="">
<blockquote><p>And they have built the high places of Tophet, which is in the Valley of the Son of Hinnom, to burn their sons and their daughters in the fire, which I did not command, nor did it come into My heart. (Jeremiah 7:31)

We hence perceive that there is no end of sinning, when men give themselves up to their own inventions; for God surrenders those to Satan, that they may be led by the spirit of giddiness and of madness and of stupidity. Let us therefore learn ever to regard what God approves: and let this be the very beginning of our inquiry, whenever we undertake anything, whether God commands it; and this course ought especially to be observed with regard to his worship; for, as it has been already stated, religion is especially founded on faith, and faith is based on the word of God: and hence it is here added —

Which I commanded them not, and which never came to my mind This reason ought to be carefully noticed, for God here cuts off from men every occasion for making evasions, since he condemns by this one phrase, “I have not commanded them,” whatever the Jews devised. There is then no other argument needed to condemn superstitions, than that they are not commanded by God: for when men allow themselves to worship God according to their own fancies, and attend not to his commands, they pervert true religion.

And if this principle was adopted by the Papists, all those fictitious modes of worship, in which they absurdly exercise themselves, would fall to the ground. It is indeed a horrible thing for the Papists to seek to discharge their duties towards God by performing their own superstitions. There is an immense number of them, as it is well known, and as it manifestly appears. Were they to admit this principle, that we cannot rightly worship God except by obeying his word, they would be delivered from their deep abyss of error. The Prophet’s words then are very important, when he says, that God had commanded no such thing, and that it never came to his mind; as though he had said, that men assume too much wisdom, when they devise what he never required, nay, what he never knew.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the book of the prophet Jeremiah and the Lamentations</cite>, trans. and ed. John Owen (Geneva, 1589) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), ix, 413-14.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dec94a267" data-kw="">
<blockquote><p>The charge and duty of Ministers is chiefly to preach the Gospel, and to announce and teach the Word of God to their people. They are therefore to be exhorted to forbear, and abstain from all manner of teaching that is either strange, or unfit, and not convenient or meet for edification, and to apply and conform themselves to the simplicity and ordinary stile of the Spirit of God, being most careful to bring and insert nothing into their preachings or Sermons that may cause the least prejudice to the honour &amp; authority of the holy Scripture; never preaching without taking for the Subject of their whole discourse a Text out of the holy Scripture, which they are to follow usually and punctually, exposing thereof as much as they shall be able, abstaining from all unnecessary amplifications, from all long, extravagant and not occasioned digressions, from a heap and number of common places and passages of the Scripture that are not needful, and from a vain recital or narration of divers, several fruit less expositions: not often, but very temperately and advisedly alleging the writings of the ancient Doctors; and less yet of prophane Authors and Histories: not handling their doctrine in a Scholastical manner, nor with mingling and mincing in of languages: In a word, they are to shun all that may serve for, or give the least suspicion or shew of ostentation. All which things that they may the better be observed, all Consistories, Colloquies, or Assemblies, and Synods, are to be very careful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ecclesiastical discipline of the reformed churches in France, or, The order whereby they are governed. Faithfully transcribed into English out of a French copy (London: Nicholas Bourne, 1642), 1.11, pp 4-5.</cite></span></figcaption>

</figure><figure class="quote" id="q-44afb1d0a7" data-kw="">
<blockquote><p>Yet there was in those rites some manner of difference, not only between the first Passover celebrated in Egypt and the subsequent ones, but also between the primary Passover, which was ordinarily eaten in the month of Nisan on the fourteenth day, and the secondary one, which was celebrated in the second month on the fourteenth day, for the sake of those who were either unclean or absent in the prior month, because in the latter, the communicants were not bound to such an exact purging of all leaven, and also they conducted this feast for not but one day [instead of seven].</p></blockquote>

<main class="wrap"><figure class="quote" id="q-01179f2d0a" data-kw="">
<blockquote><p>That God may, and sometimes doth afflict, yet not in reference to sin. Thus God doth exercise Job, who though he was not without sin, yet God seemeth not to do it for sin: Therefore such calamities were rather exercises of his graces, then correctives of his sins: they were to him, what a storm, or a tempest is to a skilful Pilate, what a valiant adversary is to a stout Champion; and to this purpose is that answer of our Saviour, when the question was, Whether the parents, or the blind man himself had sinned, that he should be born blind? (speaking according to the opinion of some Philosophers, that was now also received among the Jews (as learned men think) viz. That there was a prexistency of the souls before they were united to their bodies) our Saviour returneth this answer, Neither hath this man sinned (because he had no being before his birth) nor his parents (viz. some grievous sin, for which God would punish the child) but only that the works of God may be made manifest. This also must be granted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

ss-affliction-is-not-always-on-account-of-sin-in-the-afflicted/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-feaede9d94" data-kw="">
<blockquote><p>A holy, a prudent silence under affliction doth not exclude and shut out a sense and feeling of our afflictions. Ps. xxxix. 9, though he ‘was dumb, and laid his hand upon his mouth,’ yet he was very sensible of his affliction: verses 10, 11, ‘Remove thy stroke away from me, I am consumed by the blow of thine hand. When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man is vanity.’ He is sensible of his pain as well as of his sin; and having prayed off his sin in the former verses, he labours here to pray off his pain. Diseases, aches, sicknesses, pains, they are all the daughters of sin, and he that is not sensible of them as the births and products of sin, doth but add to his sin and provoke the Lord to add to his sufferings, Isa. xxvi. 9-11.

No man shall ever be charged by God for feeling his burden, if he neither fret nor faint under it. Grace doth not destroy nature, but rather perfect it. Grace is of a noble offspring; it neither turneth men into stocks nor to stoics. The more grace, the more sensible of the tokens, frowns, blows, and lashes of a displeased Father. Though Calvin, under his greatest pains, was never heard to mutter nor murmur, yet he was heard often to say, ‘How long, Lord, how long?’ A religious commander being shot in battle, when the wound was searched, and the bullet cut out, some standing by, pitying his pain, he replied, Though I groan, yet I bless God I do not grumble. God allows his people to groan, though not to grumble. It is a God-provoking sin to be stupid and senseless under the afflicting hand of God. God will heat that man’s furnace of affliction sevenfold hotter, who is in the furnace but feels it not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 306-07.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>3d. Case. Whether may God carry it strangely, as if he were an Enemy to a New Creature, that should seem to be his darling?

Answ. Thou art a Stranger to Scripture, and the Experiences of all God’s Children, if thou think God must always be dandling this New Creature on his Knee, or giving it the Kisses of his Mouth; no, no, he hath reserved these Sweat-meats for the upper Table in Heaven: there’s great reason thou should have his Frowns, as well as Smiles, to humble thy Heart, exercise thy Graces, discover the necessity of Christ, the desirableness of Heaven: God can and may, without any impediment to his Love, hide it for a season from his own dearest Child: David indeed called in question God’s Love and Faithfulness, when he hid his Face; but at last, he found that it was his Infirmity, and doubtless, lamented it as his Sin:

God hath given abundant Security in his Promises of his Love without present sense: you must not think much at him, if he do not come to visit you, and take you up in his Arms as oft as you would have him: Thou needest some purging Physick as well as Cordials: a Son may need a Frown, as well as a Smile from his Father: God is a free Agent, his Kisses are his own: but its well thou art so sensible of his Access and Recess, his Smiles and Frowns: it’s a sign of some Spiritual Life in thy Soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), 191-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>A Christian of uncommon excellence to human view sometimes experiences a great affliction, while one of less devoutness, apparently, is only slightly afflicted, or perhaps not at all. This difference is not caused by the degree of demerit in each instance, but by what the Divine eye sees to be required in each case in order to the best development of character.</p></blockquote>

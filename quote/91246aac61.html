<blockquote><p>As a ground of security that we shall inherit the promises, it is not enough that we can point to a time when we were numbered amongst the members of the visible church. The believer, it is true, draws encouragement from a review of the way by which God has led him, and may legitimately infer, that “He who hath begun a good work” in him “will perform it until the day of Christ.” Yet profession may be mistaken for conversion. However highly we may have been favoured with the means of grace—however regular our attendance on these means may have been—nay, however great may have been our seeming delight in the enjoyment of them, we may never, in reality, have laid hold of Christ.

He only that “endureth to the end shall be saved.” The Lord’s people will undoubtedly be so “kept by the power of God,” as to make it manifest, at the great day, that not one of them has been lost. Yet, during the entire period of their life on earth, they will be found “running with patience the race that is set before them; forgetting the things which are behind, and reaching forth unto those things which are before,” they will be ever “pressing towards the mark for the prize of the high calling of God in Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-doig.html">Thomas Doig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Certainty of the Fulfilment of God s Threatened Judgments and Promised Mercies’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-220fd0f8ce" data-kw="">
<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-7a0773e451" data-kw="">
<blockquote><p>For such is the loving-kindness of God; He never turns his face away from a sincere repentance … And after this again, Manasses, having exceeded all in fury and tyranny, and having subverted the legal form of worship, and shut up the temple, and caused the deceit of idolatry to flourish, and having become more ungodly than all who were before him, when he afterwards repented, was ranked amongst the friends of God. Now if, looking to the magnitude of his own iniquities, he had despaired of restoration and repentance, he would have missed all which he afterwards obtained: but as it was, looking to the boundlessness of God’s tender mercy instead of the enormity of his transgressions, and having broken in sunder the bonds of the devil, he rose up and contended with him, and finished the good course.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exhortation to Theodore after his fall</cite>, (c. 400), 1.6 in Nicene and Post-Nicene Fathers 1, 9: 95.</span></figcaption>

</figure><figure class="quote" id="q-1e62a02161" data-kw="">
<blockquote><p>The Westminster Shorter Catechism has a helpful, biblically-based definition of repentance: Q. 87. What is repentance unto life? A. Repentance unto life is a saving grace, whereby a sinner, out of a true sense of his sin, and apprehension of the mercy of God in Christ, does, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavor after, new obedience. The Heidelberg Catechism gives a good biblical definition of true faith: Question 21. What is true faith? Answer: True faith is not only a certain knowledge, whereby I hold for truth all that God has revealed to us in his word, but also an assured confidence, which the Holy Ghost works by the gospel in my heart; that not only to others, but to me also, remission of sin, everlasting righteousness and salvation, are freely given by God, merely of grace, only for the sake of Christ’s merits. Repentance is turning from sin to obedience. Internally, it is a hatred of sin and a motivation to live in gratitude and love by obeying God’s commands. Externally it is changed conduct. Saving faith is a gift of God in our hearts leading us to trust him alone for our forgiveness, righteousness, and salvation, only because of what Christ has done for us. So, which comes first—faith or repentance? The answer is faith precedes repentance; it is a fruit of saving faith—not the other way around. A person is reconciled to God (justified) by faith alone, not by faith plus works. Yet, faith without repentance is not saving faith. Let me explain by considering what the Bible teaches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Faith or Repentance—Which Comes First?</cite>, May 10, 2022</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

2a02161.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e62a02161.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/05/repentance-comes-from-faith/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>
<div class="actions"><button class="copy" data-copy="“However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.”

— Samuel Ward, ‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+such+%5Bgood%5D+works%2C+through+a+new+supervening+sin%2C+are+said+to+be+mortified%2C+when+they+are+impeded+from+their+own+proper+effect+and+operation.+For+as+a+living+thing+through+death+loses+the+operation+of+life%2C+so+things+are+said+by+analogy+to+be+mortified%2C+when+they+are+impeded+from+their+own+proper+effect+or+operation.+But+the+effect+of+good+works+which+emanate+from+faith+and+grace%2C+by+divine+ordinance+and+pact%2C+is+to+lead+to+eternal+life.+This+effect%2C+however%2C+is+cut+off+when+a+grave+sin+intervenes%2C+by+which%2C+as+I+might+say%2C+the+said+good+works+are+mortified%3B+and+they+are+deprived+of+their+own+proper+effect+and+operation+of+leading+to+life%2C+so+much+so+that+the+force+of+these%2C+while+the+guilt+of+that+sin+lasts%2C+is+suspended.+We+say%2C+however%2C+that+these+very+works%2C+mortified+by+grave+sin%2C+are+revived+by+penitence+and+recover+their+former+vigor+and+virtue+of+leading+to+life.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98Good+Works+Mortified+by+Sin+are+Revived+by+Penitence%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%2C+%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+189-94%2C+p.+192&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37c89f6727.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37c89f6727.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/repentance#:~:text=However%2C%20such%20%5Bgood%5D%20works%2C%20through%20a,and%20virtue%20of%20leading%20to%20life&amp;text=However%2C%20such%20%5Bgood%5D%20works%2C%20through%20a%20new%20supervening&amp;text=former%20vigor%20and%20virtue%20of%20leading%20to%20life" rel="noopener" target="

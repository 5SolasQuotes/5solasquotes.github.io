<main class="wrap"><figure class="quote" id="q-e8b377bc63" data-kw="">
<blockquote><p>We hold the case thus:—that the spirits are to be tried and proved by a twofold judgment. The one, internal; by which, through the Holy Spirit, or a peculiar gift of God, any one may illustrate, and to a certainty, judge of, and determine on, the doctrines and sentiments of all men, for himself and his own personal salvation concerning which it is said. (1 Cor. ii. 15.) &quot;The spiritual man judgeth all things, but he himself is judged of no man.&quot; This belongs to faith, and is necessary for every, even private, Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-0864231799" data-kw="">
<blockquote><p>Our fourteenth argument is as follows: If the scriptures do not interpret themselves or judge controversies, this is because they are either obscure or imperfect. But they are neither obscure nor imperfect, as we have already proved. Therefore they both interpret themselves and judge controversies.</p></blockquote>

</figure><figure class="quote" id="q-0793d49be3" data-kw="">
<blockquote><p>The question is whether the reading should be forbidden to anyone (which we deny). … (3) The Scriptures are the Testament of our heavenly father, and should a child be forbidden to read the will of his father? … Is it not sufficient that the reading of the Scriptures is allowed by the papists to some? For that ought not to be granted to some as a privilege which is enjoined upon all as a duty.</p></blockquote>

</figure><figure class="quote" id="q-721cb5dffe" data-kw="">
<blockquote><p>We believe that Holy Scripture has one true and authentic meaning, but this meaning can be twofold, either simple or composite. … That there is a single meaning to Scripture is evident (1) from the unity of truth, because truth is single (unicus) and simple (simplex), and for that reason does not admit of several meanings, which would make it uncertain and ambiguous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-61bb8eb5c6" data-kw="">
<blockquote><p>§5. But as in the concept of the divine intellect the ratio of the object was chiefly regarded, the same is now to be observed in the concept of the divine will, whose object is everything willed. It can, however, be divided into primary and secondary: the former is God Himself, or the divine essence; the latter, whatever is conceived to have been, to be, or to be about to be besides God. The former is called primary, because it is present to Him before His consciousness as the first and greatest good, independent of every other thing. The latter is called secondary, because all its goodness depends upon the goodness of God, and is exceedingly limited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-02908a3ee6" data-kw="">
<blockquote><p>First by ‘day’ we are here [in Gen. 1:14, ‘to separate the day from the night’] to understand not the space of the sun, moon, and stars compassing the earth, which is the space of 24 hours; for that ‘day’ consists of an evening and a morning, and comprehends in it one night; and some call it a natural, and some a civil, and some an astronomical day: but here by ‘day’ we are to understand the time while the sun, the greatest light, shines and gives light upon the face of the earth: And by ‘night’ the time while the moon and stars do only appear and give their dim light upon the earth, which some call an artificial and civil day and night, but others do more properly call it a natural day, and a natural night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 9, pp. 138-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

0night" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-02bf9e3817" data-kw="first day heaven earth light">
<blockquote><p>The works of the first day are reckoned as three (the heaven, the earth and light) according to the Mosaic account. God demonstrates his power in the production of all things ex nihilo by his word alone; his wisdom in their variety, order and use; his goodness in making all things very good. Thus he exercised an ordering and command which powerfully gave existence to things, and ordination which wisely directed all things and assigned to each its own use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1.3</span></figcaption>

<blockquote><p>Secondly, we must consider the certainty, and authority of this book. The Church as yet, never rejected or refused this book: but have accounted the same among those, which we call Canonical books of holy scripture, and which have Ecclesiastical, and heavenly testimonies.

Furthermore, we have our saviour Christ (as concerning this matter) a sufficient testimony and witnesses, as may appear by the xii Chapter of Mathew, where he alledgeth the example of Jonas for his resurrection, affirming, that the coming of Jonas out of the Whale’s belly, was a type of the same. Furthermore, Christ preferreth the Ninevites, before the Israelites, because the Ninevites repented at the one only sermon of Jonas, and the Israelites would not be converted unto the Lord by many sermons.

Wherefore, if ever any man did, or shall hereafter doubt of the authority, truth, and certainty of this book, Christ by his testimony, hath so confirmed the same, that though an Angel came from heaven teaching the contrary, he ought not to be believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>News from Ninive to England, brought by the prophet Jonas: which news in plainly published in the godly and learned exposition of Master John Brentius</cite>, trans. Thomas Tymme (London: Henry Denham, 1570), preface.</span></figcaption>

<blockquote><p>The will of God is this, that he alone should be the teacher. And I intend to be taught by him and not by men, that is, in respect of doctrine: for in respect of sin and disobedience I will be subject to all. For it is not for us to sit in judgment on Scripture and divine truth, but to let God do his work in and through it, for it is something which we can learn only of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Clarity and Certainty of the Word of God, p. 92</span></figcaption>

</figure><figure class="quote" id="q-494e09445d" data-kw="">
<blockquote><p>Liberty is the privilege to do what is right to be done — to teach what is known to be true. Liberty has its controlling laws. Great as is the human mind, and free as it undoubtedly is, it is not great enough, nor can it claim a freedom so irresponsible, to think or pronounce imperfect what God has declared to be “true and righteous altogether.” Belief in a defective Bible is no part of intellectual freedom. And in the oft-uttered and strongly-emphasized declaration that the Bible, freed from the errors of transcribers and translators, and as it came from God, is without error, no restraint is put on reverent scholarship.

It is not necessary to talk boastfully of “the faith that cannot be put into creeds,” or of “the word of God behind the Bible,” in order to assert one’s independence of mind. Scholarship, the profoundest, the loftiest, the widest, the ripest, causing all languages and literatures, all precepts and principles, all faiths and philosophies, to pay tribute to the Lord God of truth and righteousness, is welcome in the Theological Schools of our Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-a-brownson.html">Marcus A. Brownson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Charge in Robert Dick Wilson, The Lower Criticism of the Old Testament as a Preparation for the Higher Criticism. Inaugural Address of the Rev. Robert Dick Wilson, Ph.D., D.D., as Professor of Semitic Philology and Old Testament Criticism in the Theological Seminary of the Presbyterian Church Pr</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

— Marcus A. Brownson, The Charge in Robert Dick Wilson, The Lower Criticism of the Old Testament as a Preparation for the Higher Criticism. Inaugural Address of the Rev. Robert Dick Wilson, Ph.D., D.D., as Professor of Semitic Philology and Old Testament Criticism in the Theological Seminary of the Presbyterian Church Pr">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLiberty+is+the+privilege+to+do+what+is+right+to+be+done+%E2%80%94+to+teach+what+is+known+to+be+true.+Liberty+has+its+controlling+laws.+Great+as+is+the+human+mind%2C+and+free+as+it+undoubtedly+is%2C+it+is+not+great+enough%2C+nor+can+it+claim+a+freedom+so+irresponsible%2C+to+think+or+pronounce+imperfect+what+God+has+declared+to+be+%E2%80%9Ctrue+and+righteous+altogether.%E2%80%9D+Belief+in+a+defective+Bible+is+no+part+of+intellectual+freedom.+And+in+the+oft-uttered+and+strongly-emphasized+declaration+that+the+Bible%2C+freed+from+the+errors+of+transcribers+and+translators%2C+and+as+it+came+from+God%2C+is+without+error%2C+no+restraint+is+put+on+reverent+scholarship.%0A%0AIt+is+not+necessary+to+talk+boastfully+of+%E2%80%9Cthe+faith+that+cannot+be+put+into+creeds%2C%E2%80%9D+or+of+%E2%80%9Cthe+word+of+God+behind+the+Bible%2C%E2%80%9D+in+order+to+assert+one%E2%80%99s+independence+of+mind.+Scholarship%2C+the+profoundest%2C+the+loftiest%2C+the+widest%2C+the+ripest%2C+causing+all+languages+and+literatures%2C+all+precepts+and+principles%2C+all+faiths+and+philosophies%2C+to+pay+tribute+to+the+Lord+God+of+truth+and+righteousness%2C+is+welcome+in+the+Theological+Schools+of+our+Church.%E2%80%9D%0A%0A%E2%80%94+Marcus+A.+Brownson%2C+The+Charge+in+Robert+Dick+Wilson%2C+The+Lower+Criticism+of+the+Old+Testament+as+a+Preparation+for+the+Higher+Criticism.+Inaugural+Address+of+the+Rev.+Robert+Dick+Wilson%2C+Ph.D.%2C+D.D.%2C+as+Professor+of+Semitic+Philology+and+Old+Testament+Criticism+in+the+Theological+Seminary+of+the+Presbyterian+Church+Pr&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F494e09445d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/494e09445d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/22/marcus-a-brownson-on-scripture-and-true-intellectual-freedom/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-44b94d52cb" data-kw="">
<blockquote><p>Thirdly, I demand of you, how you could so nakedly propound the apostolical directions, patterns and examples of the primitive Churches to walk by (excepting mere circumstances and the rules of the law of nature) and not except withal extraordinary and miraculous, personal and particular, occasional and accidental, temporary and local patterns and examples. I own the Scripture for the rule, rightly understanding it, and in matters of discipline and Church-order profess to walk by it, desiring to be tied to the Scripture patterns, particularly to the patterns of examples and precepts recorded in the New Testament (provided this be understood in essentials and fundamentals of order, in matters of perpetual use, and of a common reason to all times and places); only I add that in some things, where in matter of order and external government there may be no such clear directions either by precept or example, there general rules of the Word, with deductions out of Scripture examples, and from precepts by way of analogy, with rules of common prudence be taken in too. Now the interpretation of this rule (as I have laid it down) being rejected, and the rule simply taken up without such limitations, will produce a wild and strange discipline and Church-order, to practice all things recorded in the Acts of the Apostles and epistles without distinction and difference of those times, persons, places, and ours: and on the other hand to practice nothing but what has a clear example, or precept is strange too, and in so doing, reasonable men cannot become a Church society, nor exercise Church communion. And however in matters of external government and administration of holy things in the visible Church some pretend to this, to practice whatever they find recorded in the Scriptures, and to practice nothing whatsoever they find not there, yet none of the Independents, no not the highest form of them, the Anabaptists, nor the highest sort of Anabaptists (who were called Apostolici [Apostles] from their pretending to imitate the apostles in all things) ever yet have or do practice all patterns and examples recorded in the New Testament, or are contented with them alone, but practice somewhat over and above not particularly recorded in Scripture. I could lay down a catalogue of many particulars specified in the Acts of the Apostles and epistles not practiced in your churches, nor in any churches of the Independent way, as also of many things practiced by you which we never read of in the Scriptures, so that all the Independents are in many things according to the first pattern both defective and excessive. But I refer the full handling of this to a Tractate I intend concerning the Scriptures [which appears to never have been published], How far the Scriptures are a rule for all matters of Church government and order in the visible Church. I add only one thing for the reader’s sake, that they be careful to understand this first principle of yours, not so nakedly as you lay it down in pages 8-11 [of the Independents’ Apology], because it has been, is, and may be a rock to split many on, and an ignis fatuus [elf-fire] to lead many into waters, instead of a sacred pillar of fire to guide to Heaven in a safe way. This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top. Now how far the want [lack] of these limitations and distinctions in this your first rule has led some of you into errors and strange practices and may lead you further, as into anointing the sick with oil, baptizing in rivers, etc. I leave you to consider of. But yet this first and great principle upon which you went and reared up your new Church way, how difficult and abstruse a rule, and how doubtful a groundwork do you make it, before you pass from it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), pp. 75-78</span></figcaption>

ge+too%2C+and+in+so+doing%2C+reasonable+men+cannot+become+a+Church+society%2C+nor+exercise+Church+communion.+And+however+in+matters+of+external+government+and+administration+of+holy+things+in+the+visible+Church+some+pretend+to+this%2C+to+practice+whatever+they+find+recorded+in+the+Scriptures%2C+and+to+practice+nothing+whatsoever+they+find+not+there%2C+yet+none+of+the+Independents%2C+no+not+the+highest+form+of+them%2C+the+Anabaptists%2C+nor+the+highest+sort+of+Anabaptists+%28who+were+called+Apostolici+%5BApostles%5D+from+their+pretending+to+imitate+the+apostles+in+all+things%29+ever+yet+have+or+do+practice+all+patterns+and+examples+recorded+in+the+New+Testament%2C+or+are+contented+with+them+alone%2C+but+practice+somewhat+over+and+above+not+particularly+recorded+in+Scripture.+I+could+lay+down+a+catalogue+of+many+particulars+specified+in+the+Acts+of+the+Apostles+and+epistles+not+practiced+in+your+churches%2C+nor+in+any+churches+of+the+Independent+way%2C+as+also+of+many+things+practiced+by+you+which+we+never+read+of+in+the+Scriptures%2C+so+that+all+the+Independents+are+in+many+things+according+to+the+first+pattern+both+defective+and+excessive.+But+I+refer+the+full+handling+of+this+to+a+Tractate+I+intend+concerning+the+Scriptures+%5Bwhich+appears+to+never+have+been+published%5D%2C+How+far+the+Scriptures+are+a+rule+for+all+matters+of+Church+government+and+order+in+the+visible+Church.+I+add+only+one+thing+for+the+reader%E2%80%99s+sake%2C+that+they+be+careful+to+understand+this+first+principle+of+yours%2C+not+so+nakedly+as+you+lay+it+down+in+pages+8-11+%5Bof+the+Independents%E2%80%99+Apology%5D%2C+because+it+has+been%2C+is%2C+and+may+be+a+rock+to+split+many+on%2C+and+an+ignis+fatuus+%5Belf-fire%5D+to+lead+many+into+waters%2C+instead+of+a+sacred+pillar+of+fire+to+guide+to+Heaven+in+a+safe+way.+This+foolish+imitation+of+the+apostles+in+all+things+in+matters+of+external+order%2C+has+been+and+is+the+great+foundation+of+evils+on+all+hands%2C+both+in+many+practices+and+points+of+Popery%2C+and+amongst+the+Anabaptists+%28as+I+could+demonstrate+in+particulars%29.+Learned+Danaeus+in+his+Commentaries+upon+1+Tim.+ch.+5+%5Bv.+13%5D+speakes+of+it.+Apostolici+inter+Anabaptist+as+Schlusselburgius+writes+also+%28On+the+Sect+of+the+Anabaptists%29%2C+that+there+is+a+sort+of+Anabaptists+called+Apostolici+%5BApostles%5D%2C+so+named+because+they+professed+to+imitate+the+apostles+in+all+things%3A+they+washed+one+another%E2%80%99s+feet%2C+they+held+all+things+ought+to+be+common%2C+they+travailed+up+and+down+without+staff%2C+shoes%2C+cloak%2C+money%2C+because+of+Christ%E2%80%99s+words%2C+they+went+up+to+the+tops+of+houses+to+preach%2C+because+Christ+had+said%2C+what+you+have+heard+in+the+ear%2C+preach+upon+the+house-top.+Now+how+far+the+want+%5Black%5D+of+these+limitations+and+distinctions+in+this+your+first+rule+has+led+some+of+you+into+errors+and+strange+practices+and+may+lead+you+further%2C+as+into+anointing+the+sick+with+oil%2C+baptizing+in+rivers%2C+etc.+I+leave+you+to+consider+of.+But+yet+this+first+and+great+principle+upon+which+you+went+and+reared+up+your+new+Church+way%2C+how+difficult+and+abstruse+a+rule%2C+and+how+doubtful+a+groundwork+do+you+make+it%2C+before+you+pass+from+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or%2C+A+Full+Answer+to+the+Apologetical+Narration+of+Mr.+Goodwin%2C+Mr.+Nye%2C+Mr.+Sympson%2C+Mr.+Burroughs%2C+Mr.+Bridge%2C+members+of+the+Assembly+of+Divines+wherein+is+Handled+Many+of+the+Controversies+of+These+Times%2C+%5Bthe+Independents%5D+Mr.+Goodwin%2C+Mr.+Nye%2C+Mr.+Sympson%2C+Mr.+Burroughs%2C+Mr.+Bridge%E2%80%A6+%28London%2C+1644%29%2C+pp.+75-78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44b94d52cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44b94d52cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-biblicism/#:~:text=Thirdly%2C%20I%20demand%20of%20you%2C%20how,it%2C%20before%20you%20pass%20from%20it&amp;t <blockquote><p>Yes, you say, but many of the fathers were saved and even became teachers without the languages. That is true. But how do you account for the fact that they so often erred in the Scriptures? How often does not St Augustine err in the Psalms and in his other expositions, and Hilary too – in fact, all those who have undertaken to expound Scripture without knowledge of the languages? Even though what they said about a subject at times was perfectly true, they were never quite sure whether it really was present there in the passage where by their interpretation they thought to find it.</p></blockquote>

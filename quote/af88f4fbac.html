</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18af1dae4c" data-kw="">
<blockquote><p>When as God has neither tied us to set forms, nor from them, save only as unsuitableness to any particular persons may make one less edifying than the other: And both free prayers and set forms, studied prayers and sudden prayers are all the work of man (as to man’s part): and therefore they must needs be imperfect and faulty as man is: And yet in both we may pray by the Spirit, even with the holy and fervent desires which the Spirit excites in us: And the Spirit may ordinarily be a Spirit of supplication in us and help our infirmities in the one way and in the other: And therefore, though I will not equal them (for I prefer some men’s free praying before any forms, and I prefer the Common prayers before some men’s free prayers), yet I may say that I will neither assent and consent to every word in the one, nor in the other, no not of any man that ever I heard: And yet I will not take it for unlawful to join with Church, or family, or person in the one or in the other: yea, upon long experience, if I had fully my own choice and liberty, I would use free prayer one part of the day (or one day) and a well composed form another part, because I see commodities by both, and such inconveniences of either way alone, as are, if possible to be avoided. But when the mind has received a prejudice against either way, by education, custom, or former distastes, no reason how clear soever will overcome it, till age and experience do mellow green and sour spirits and teach them to judge of things soberly and impartially, not as others judge of them, but as indeed they are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-86d4a47e9f" data-kw="">
<blockquote><p>By Scripture also, because Acts 8:1, we read of the ‘Church’ at Jerusalem, not the ‘churches’: Howbeit there were at that instant above eight thousand Christians at Jerusalem, and all these still in the city… This great number, neither did, nor could usually assemble into one place for the worship of God, but they met [in Greek] ‘house by house’, Acts 2:46. And whereas objection is made to the contrary from Acts 2:44 and 5:12 and 6:2. We have before answered [in pt. 2, ch. 3, p. 141-42] to the first of these places, for it is to be expounded by Acts 4:32, they were in one, that is, they were of one heart and of one soul… The last place proves no more but an extraordinary and occasional meeting, and it is also to be understood that they met turmatim [in squadrons] as four hundred thousand men did assemble together, Jud. 20:1…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, … (1641), p. 192-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>We see then how that the tithes which were contained in the law were especially for the people of Israel. And yet notwithstanding the tithes were very common amongst the Heathen, even for kings, princes and noblemen. We see likewise by profane histories, that they were also exacted, and that in some countries they exacted more than in other some… But be as be may, this word ‘Tithe’, or ‘Tenth’, has been a common and ordinary amongst all nations. And all Princes and great men as I have already said, sithens [since] the Gospel was received, have bestowed part of the tithes towards the maintenance of the Ministers of the word, as is very great reason, according to the saying of Saint Paul, “That they which ministered at the Altar in the old Testament were maintained, that they which at this day sacrifice unto God after a more excellent manner,” (1 Cor. 9:9-13) that is, which win souls unto Him, to make of them sacrifices unto his majesty, that they should also be as well provided for and maintained: and although God has not qualified how nor by what manner of revenue they should be maintained, yet is there a law for it. Now then, sith [since] God has been known through the preaching of the Gospel, a Christian order and law has been made for the giving and bestowing of one part of tithes [as opposed to other uses, such as giving to the poor, etc.]. And herein we may see the deceit of the Pope and of his shavelings [def: contemptuous epithet for a tonsured ecclesiastic, i.e. monk]: for, when they handle the law of tithes in their Canons, they take it as if it were transferred to them after that Jesus Christ had put an end unto the priesthood of Levi. All these are very leasings [lies], falsifying the holy scripture, and wickedly corrupting the same. For we see to the contrary, as has been before showed, that it is long ago sithence [since], that it was not known what the paying of tithes was by virtue of the law of Moses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Third Sermon of Melchisedech</cite>, pp. 64-68 on Gen. 14:20-24 in Sermons on Melchizedek &amp; Abraham, Justification, Faith &amp; Obedience (1592; rep. Old Paths Publications: 2000)</span></figcaption>

ses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.”

le+the+law+of+tithes+in+their+Canons%2C+they+take+it+as+if+it+were+transferred+to+them+after+that+Jesus+Christ+had+put+an+end+unto+the+priesthood+of+Levi.+All+these+are+very+leasings+%5Blies%5D%2C+falsifying+the+holy+scripture%2C+and+wickedly+corrupting+the+same.+For+we+see+to+the+contrary%2C+as+has+been+before+showed%2C+that+it+is+long+ago+sithence+%5Bsince%5D%2C+that+it+was+not+known+what+the+paying+of+tithes+was+by+virtue+of+the+law+of+Moses%2C+and+they+were+always+paid+either+to+the+Emperor%2C+or+to+some+other+particular+great+men.+But+now+sith+%5Bsince%5D+the+thing+has+been+so+ordained+%28so+therein+be+no+abuse%2C+and+to+make+men+believe+contrary+to+all+truth%2C+that+it+came+from+the+holy+scripture%3A+but+to+be+taken+for+a+politic+law%29.+Let+us+hold+that+rule+which+Saint+Paul+sets+down%3A+to+wit%2C+%E2%80%9CThat+we+must+not+%5Bmuzzle%5D+the+mouth+of+the+ox+when+he+travels+to+feed+us%E2%80%9D%3A+and+therefore+it+stands+with+a+far+greater+reason%2C+that+they+which+preach+the+doctrine+of+the+gospel%2C+ordained+in+so+excellent+an+estate%2C+should+not+be+abridged+and+deprived+of+their+maintenance%2C+but+be+very+well+waged.+Now+as+I+have+already+said%2C+when+tithes+and+such+like+are+bestowed+unto+a+good+use%3A+we+must+not+so+straightly+look+into+the+matter%2C+as+to+ask+the+cause+of+why+it+is+so%2C+as+many+fantastical+fellows+will%2C+who+at+this+day+could+be+contented+to+turn+the+whole+world+upside+down+saying%2C+O%2C+it+is+no+time+now+to+pay+tithes%2C+for+seeing+the+thing+has+been+so+long+abused%2C+it+is+no+reason+it+should+any+longer+continue.+Then+must+we+by+their+laying+scrape+out+all%3A+for+they+think+that+Christianity+consists+in+changing+the+color+of+the+sun+and+the+moon.+But+if+there+be+anything+that+is+to+be+amended%2C+as+I+have+said%2C+as+if+the+Papists+have+brought+in+any+false+opinion%2C+let+that+be+utterly+abolished.+But+in+the+meanwhile%2C+let+us+hold+unto+all+good+ordinance%3A+to+wit%2C+let+the+tithes+and+all+such+things+that+are+for+the+maintenance+of+the+poor%2C+and+the+Ministers%3A+let+these+things+be+reduced+to+their+lawful+use%2C+and+let+not+unsatiable+wide+gullets+devour+all.+Let+them+not+consume+them+upon+their+superfluities%2C+in+pomps%2C+drunkeness%2C+and+other+dissolutions%3A+but+let+them+know%2C+that+these+are+holy+goods%2C+which+ought+to+be+reserved+for+the+use+of+the+Church%2C+as+well+for+the+maintenance+of+the+poor+as+I+have+already+said%2C+as+also+for+the+feeding+of+those+which+serve+God+and+his+people.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%98The+Third+Sermon+of+Melchisedech%2C+wherein+is+treated+of+the+use+and+right+of+tithes%2C+and+also+of+an+oath%E2%80%99%2C+pp.+64-68+on+Gen.+14%3A20-24+in+Sermons+on+Melchizedek+%26+Abraham%2C+Justification%2C+Faith+%26+Obedience+%281592%3B+rep.+Old+Paths+Publications%3A+2000%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdc303688e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdc303688e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings#:~:text=We%20see%20then%20how%20that%20the,which%20serve%20God%20and%20his%20people&amp;text=We%20see%20then%20how%20that%20the%20tithes%20which&amp;text=of%20those%20which%20serve%20God%20and%20his%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

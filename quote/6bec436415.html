<main class="wrap"><figure class="quote" id="q-6bec436415" data-kw="">
<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d46ead5565" data-kw="">
<blockquote><p>When the world was lost by the one sin of Adam, the grace of Christ has not only abolished this sin and the death which it introduced, but also has at the same time taken away those endless sins… and brought as many as are of Christ into full justification; so that God has now not only forgiven them the sins both of Adam and of themselves, etc., but has at the same time given his Spirit of solid and perfect justice, to conform us to the image of the First-begotten. ‘Justification’ here occurs, which, as it is opposed to ‘condemnation,’ so it signifies properly that justification by which God absolves from all sins those that are Christ’s… and because he means a full justification, the perfect bestowal of justice is also contained in this justification; for it [justification] will then at length be consummated when along with sin, the last enemy, death, shall also have been destroyed, and the saints shall have been filled with every fruit of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 | On Rom. 5:16, Observation 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

n%20the%20world%20was%20lost%20by%20the%20one&amp;text=have%20been%20filled%20with%20every%20fruit%20of%20justice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bdfa54a8fa" data-kw="">
<blockquote><p>The apostle signifies the same thing by different words when he says, ‘Ye are washed, ye are sanctified, ye are justified:’ he has said, ‘ye are washed,’ on account of holy baptism; ‘ye are sanctified,’ on account of the Holy Ghost; but ‘ye are justified,’ on account of justifying faith, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On 1 Cor,. 6:11 in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“The apostle signifies the same thing by different words when he says, ‘Ye are washed, ye are sanctified, ye are justified:’ he has said, ‘ye are washed,’ on account of holy baptism; ‘ye are sanctified,’ on account of the Holy Ghost; but ‘ye are justified,’ on account of justifying faith, etc.”

— Heinrich Bullinger, On 1 Cor,. 6:11 in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, p. 155">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+apostle+signifies+the+same+thing+by+different+words+when+he+says%2C+%E2%80%98Ye+are+washed%2C+ye+are+sanctified%2C+ye+are+justified%3A%E2%80%99+he+has+said%2C+%E2%80%98ye+are+washed%2C%E2%80%99+on+account+of+holy+baptism%3B+%E2%80%98ye+are+sanctified%2C%E2%80%99+on+account+of+the+Holy+Ghost%3B+but+%E2%80%98ye+are+justified%2C%E2%80%99+on+account+of+justifying+faith%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+On+1+Cor%2C.+6%3A11+in+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3B+1658%3B+Oxford%3A+Parker%2C+1850%29%2C+vol.+1%2C+bk.+2%2C+ch.+4%2C+p.+155&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbdfa54a8fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bdfa54a8fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=The%20apostle%20signifies%20the%20same%20thing,on%20account%20of%20justifying%20faith%2C%20etc&amp;text=The%20apostle%20signifies%20the%20same%20thing%20by%20different&amp;text=are%20justified%2C%E2%80%99%20on%20account%20of%20justifying%20faith%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-36bbe3490e" data-kw="">
<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law, unless they should fall into such sins as should ipso facto, forfeit their justified estate, and transfer them from the Covenant of Grace, into the Covenant of Works, which we believe that God in his Faithfulness will preserve them from. And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. Still there abides the true nature of sin in every inconformity unto, or transgression of the Law in justified persons, which stands in need of daily actual pardon. For there is no man that lives and sins not, and if we say that we have no sin, we do but deceive our selves. None are more sensible of the guilt of sin, none are more troubled for it, none are more earnest in supplications for the pardon of it, than justified persons. For this is the effect of the sacrifice of Christ applied unto the souls of believers, as the apostle declares, Heb. 10:1-4, 10, 14, that it does take away conscience condemning the sinner for sin with respect unto the curse of the Law; but it does not take away conscience condemning sin in the sinner, which on all considerations of God and themselves, of the Law and the gospel, requires repentance on the part of the sinner, and actual pardon on the part of God. … …Now the first act of God in the imputation of righteousness cannot be repeated. And the actual pardon of sin after justification is an effect and consequent of that imputation of righteousness. If any man sin, there is a propitiation… Wherefore unto this actual pardon there is nothing required but the application of that righteousness which is the cause of it, and this is done by faith only. … What it is that, when a justified person is guilty of sin (as guilty he is more or less every day) and his conscience is pressed with a sense thereof, as that only thing which can endanger or intercept his justified estate, his favor with God, and title unto glory, he betakes himself unto, or ought so to do, for the continuance of his state, and pardon of his sins, what he pleads unto that purpose, and what is available thereunto…. And is it not of faith alone, which is that grace whereby they apply themselves unto the mercy or grace of God through the mediation of Christ? It is true that faith herein, works and acts itself in and by godly sorrow, repentance, humiliation, self-judging, and abhorrency, fervency in prayer and supplications with an humble waiting for an answer of peace from God, with engagements unto renewed obedience. But it is faith alone that makes applications unto grace in the blood of Christ for the continuation of our justified estate… The Scripture expressly does declare this to be the only way of the continuation of our justification, 1 Jn. 2:1-2, ‘These things write I unto you that you sin not. And if any man sin we have an advocate with the Father, Jesus Christ the Righteous; and he is the propitiation for our sins.’ It is required of those that are justified that they sin not; it is their duty not to sin; but yet it is not so required of them as that if in anything they fail of their duty they should immediately lose the privilege of their justification. Wherefore on a supposition of sin, if any man sin, (as there is no man that lives and sins not) what way is prescribed for such persons to take, what are they to apply themselves unto, that their sin may be pardoned, and their acceptance with God continued; that is, for the continuation of their justification? The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that He has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, He is the object of our faith in our absolute justification, and so He is as unto the continuation of it. So our whole progress in our justified estate in all the degrees of it is ascribed unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), ch. 5, pp. 202-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

stification. Wherefore on a supposition of sin, if any man sin, (as there is no man that lives and sins not) what way is prescribed for such persons to take, what are they to apply themselves unto, that their sin may be pardoned, and their acceptance with God continued; that is, for the continuation of their justification? The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that He has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, He is the object of our faith in our absolute justification, and so He is as unto the continuation of it. So our whole progress in our justified estate in all the degrees of it is ascribed unto faith alone.”

+sinner+for+sin+with+respect+unto+the+curse+of+the+Law%3B+but+it+does+not+take+away+conscience+condemning+sin+in+the+sinner%2C+which+on+all+considerations+of+God+and+themselves%2C+of+the+Law+and+the+gospel%2C+requires+repentance+on+the+part+of+the+sinner%2C+and+actual+pardon+on+the+part+of+God.+%E2%80%A6+%E2%80%A6Now+the+first+act+of+God+in+the+imputation+of+righteousness+cannot+be+repeated.+And+the+actual+pardon+of+sin+after+justification+is+an+effect+and+consequent+of+that+imputation+of+righteousness.+If+any+man+sin%2C+there+is+a+propitiation%E2%80%A6+Wherefore+unto+this+actual+pardon+there+is+nothing+required+but+the+application+of+that+righteousness+which+is+the+cause+of+it%2C+and+this+is+done+by+faith+only.+%E2%80%A6+What+it+is+that%2C+when+a+justified+person+is+guilty+of+sin+%28as+guilty+he+is+more+or+less+every+day%29+and+his+conscience+is+pressed+with+a+sense+thereof%2C+as+that+only+thing+which+can+endanger+or+intercept+his+justified+estate%2C+his+favor+with+God%2C+and+title+unto+glory%2C+he+betakes+himself+unto%2C+or+ought+so+to+do%2C+for+the+continuance+of+his+state%2C+and+pardon+of+his+sins%2C+what+he+pleads+unto+that+purpose%2C+and+what+is+available+thereunto%E2%80%A6.+And+is+it+not+of+faith+alone%2C+which+is+that+grace+whereby+they+apply+themselves+unto+the+mercy+or+grace+of+God+through+the+mediation+of+Christ%3F+It+is+true+that+faith+herein%2C+works+and+acts+itself+in+and+by+godly+sorrow%2C+repentance%2C+humiliation%2C+self-judging%2C+and+abhorrency%2C+fervency+in+prayer+and+supplications+with+an+humble+waiting+for+an+answer+of+peace+from+God%2C+with+engagements+unto+renewed+obedience.+But+it+is+faith+alone+that+makes+applications+unto+grace+in+the+blood+of+Christ+for+the+continuation+of+our+justified+estate%E2%80%A6+The+Scripture+expressly+does+declare+this+to+be+the+only+way+of+the+continuation+of+our+justification%2C+1+Jn.+2%3A1-2%2C+%E2%80%98These+things+write+I+unto+you+that+you+sin+not.+And+if+any+man+sin+we+have+an+advocate+with+the+Father%2C+Jesus+Christ+the+Righteous%3B+and+he+is+the+propitiation+for+our+sins.%E2%80%99+It+is+required+of+those+that+are+justified+that+they+sin+not%3B+it+is+their+duty+not+to+sin%3B+but+yet+it+is+not+so+required+of+them+as+that+if+in+anything+they+fail+of+their+duty+they+should+immediately+lose+the+privilege+of+their+justification.+Wherefore+on+a+supposition+of+sin%2C+if+any+man+sin%2C+%28as+there+is+no+man+that+lives+and+sins+not%29+what+way+is+prescribed+for+such+persons+to+take%2C+what+are+they+to+apply+themselves+unto%2C+that+their+sin+may+be+pardoned%2C+and+their+acceptance+with+God+continued%3B+that+is%2C+for+the+continuation+of+their+justification%3F+The+course+in+this+case+directed+unto+by+the+apostle+is+none+other+but+the+application+of+our+souls+by+faith+unto+the+Lord+Christ%2C+as+our+advocate+with+the+Father%2C+on+the+account+of+the+propitiation+that+He+has+made+for+our+sins.+Under+the+consideration+of+this+double+act+of+his+sacerdotal+office%2C+his+oblation+and+intercession%2C+He+is+the+object+of+our+faith+in+our+absolute+justification%2C+and+so+He+is+as+unto+the+continuation+of+it.+So+our+whole+progress+in+our+justified+estate+in+all+the+degrees+of+it+is+ascribed+unto+faith+alone.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Doctrine+of+Justification+by+Faith%E2%80%A6+%28London%3A+Boulter%2C+1677%29%2C+ch.+5%2C+pp.+202-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36bbe3490e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36bbe3490e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=Hence%20in%20the%20first%20justification%20of,it%20is%20ascribed%20unto%20faith%20alone&amp;text=Hence%20in%20the%20first%20justification%20of%20believing%20sinners&amp;text=degrees%20of%20it%20is%20ascribed%20unto%20faith%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d76a7c7f0e" data-kw="">
<blockquote><p>Aquinas tells us that, just as God sustains and moves a creature to act through the contingency of its nature, so too does he move the creature again in grace, analogically elevating the creature to attain an end beyond the scope of its original nature. (ST i- ii q. 109, aa. 1, 6, 9) By invoking the language of movement, Aquinas chooses to describe grace not only within the linguistic but also the causal categories that mark the analogical relationship between God and the world, where creation as really related to God participates in God in a way proportioned to its nature. (ST i q. 13, a. 7) And yet the participation indicated by grace is qualitatively different and much deeper than that of nature. Unlike a natural end, the end of those infused virtues that characterize the life of the baptized is not a natural similitude of divine goodness, but is in fact God himself. (ST i- ii q. 1) All natural creaturely perfections are said of both the creature and of God, analogically: that which is “good” or “true” in a given creature is necessarily said of God as well. God is goodness, and created “good things” are a kind of participated similitude of the divine goodness. (ST i qq. 6, 13) Grace represents a furthered participation, this time in Divine nature itself. Aquinas himself says clearly that “grace is nothing except a participated similitude of divine nature.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), pp. 231-32 Lynch is a Dominican and writes in the Thomist tradition.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>…as creation in God is but one simple act of his will… But He does will that the creatures in the space of six days should take their beginning, and that after the creation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-strong.html">William Strong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Worm that Dies Not, or Hell Torments… (d. 1654; London: 1672)</cite>, pp. 274-75</span></figcaption>

— William Strong, The Worm that Dies Not, or Hell Torments… (d. 1654; London: 1672), pp. 274-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6as+creation+in+God+is+but+one+simple+act+of+his+will%E2%80%A6+But+He+does+will+that+the+creatures+in+the+space+of+six+days+should+take+their+beginning%2C+and+that+after+the+creation%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Strong%2C+The+Worm+that+Dies+Not%2C+or+Hell+Torments%E2%80%A6+%28d.+1654%3B+London%3A+1672%29%2C+pp.+274-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa09ac5cfd3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a09ac5cfd3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=as%20creation%20in%20God%20is%20but,beginning%2C%20and%20that%20after%20the%20creation&amp;text=as%20creation%20in%20God%20is%20but%20one%20simple&amp;text=take%20their%20beginning%2C%20and%20that%20after%20the%20creation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9d5f0312cb" data-kw="">
<blockquote><p>The matter of creation was none. For in the beginning God created the heaven and the earth, Gen. 1:1, the sea and all things that are in them, Acts 4:24, when before these none of them existed. And the term ברא [bara], “created,” in its first and proper signification designates the production of a thing from nothing. Where “nothing” has no other notion than that of a terminus a quo [point from which], or mere negation. And it is rightly explained by ‘after nothing,’ when nothing had been before. For ‘from’ is a mark not of matter or of efficient, but only of terminus or order, which is between nothing and the thing, according to our mode of understanding. Whether, however, all things or most things were produced from nothing immediately is not undeservedly doubted. Certainly we read that the body of Adam was formed from the dust of the earth, that of Eve from the rib of the man, Gen. 2:7, 21. The terrestrial animals also and the birds are taught to have been produced from the earth, v. 19 of the same chapter—to say nothing now of others. Therefore they do rightly who, by reason of the matter, distinguish creation into first and second, or into immediate and mediate, of which the former is from nothing, the latter from matter, but undisposed matter. If ‘nothing’ is taken broadly, not only negatively as to matter but also privatively as to form, even the latter species of creation will not inconveniently be said to be from nothing. The Form of Creation is the first production of all things, not by successive but by momentary emanation from the first cause. Of this mode indeed a threefold manner is perceived in the πρωτοκτισίᾳ [prōtoktisia, first creation]: κτίσις, ποίησις, and πλάσις [ktisis, poiēsis, kai plasis], Gen. 2:4, 7. I. Κτίσις [Ktisis], creation, is the production of a thing from nothing simply, such as was that of first matter, of the supreme heaven, of the angels, and of human souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-f1d631ae1a" data-kw="">
<blockquote><p>To the eternal decree corresponds temporal execution. For since God neither changes His counsel nor can be hindered by anyone, whatever He decreed with Himself from eternity, He executes outside Himself in time. From the variety of this execution arises the distinction of God’s works. … Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“To the eternal decree corresponds temporal execution. For since God neither changes His counsel nor can be hindered by anyone, whatever He decreed with Himself from eternity, He executes outside Himself in time. From the variety of this execution arises the distinction of God’s works. … Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act.”

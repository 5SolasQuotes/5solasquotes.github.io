<blockquote><p>Good news from heaven! the Day-spring from on high hath visited this undone world! After a deluge of sin and misery, behold the bow in the cloud. The Lord God has made and established a new covenant, and this it is that has cast the first beam on the dark state of lost and fallen man, and has brought life and immortality to light. This covenant is the hope of sinners, the riches of saints, the magna charta of the city of God: the forfeited lease of eternity renewed; God’s deed of gift, wherein he has, on fair conditions, granted sinners their lives, and settled upon his saints an everlasting inheritance.

Hear, ye forlorn captives, who have sold yourselves to eternal bondage, spoiled yourselves of all your glory, sealed yourselves up under everlasting misery. You are dead in your sins, guilty before God, under wrath, under a curse, bound over to eternal vengeance. But behold, there is yet hope in Israel concerning this thing; the Lord God has had compassion upon you, has opened a way for you to escape out of all this misery and bondage.

Lift up the hands that hang down, strengthen the trembling knees: an ark, an ark has (rod prepared, in which is salvation from the flood; a covenant, a new covenant has he made and established, which, if you lay hold on it, will recover all you have lost, ransom you from death, redeem you from hell, and advance you to a more sure and blessed condition than your original state from which you have fallen. This is the hope of sinners; this is the heritage of the servants of the Lord.

Glorious tidings, good news indeed! But what is this covenant? Or what is there that is given and granted therein? Why, in sum, there is all that heaven and earth can afford, all that can be needed or desired; and this, by a firm and irrevocable deed, made over, and made sure to all who will sincerely embrace it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), pp 5-6.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b0305aaf0" data-kw="">
<blockquote><p>The first Direction and Institution of a Church was by Covenant; the Israelites made a Covenant with the LORD, and He with them, Deut. v. 2. and from that Time they were called a Church, Acts; vii. 38, there they promised, they would do all the LORD had said, and be obedient, Exod., xxiv. 3, 7.

There was another Covenant made with them, Deut. xxix. 12, &amp;c. this was a Covenant of Grace, as the other was of Works, ver. 10, 11, 12. The LORD entered into Covenant with them that Day, and with their Children: By a Covenant He takes them to be his People, and to be their God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same</cite>, (London: John Clark, 1722), p. 20.</span></figcaption>

</figure><figure class="quote" id="q-4e53e27cae" data-kw="">
<blockquote><p>In God it [‘mercy’] notes his readiness to do good to the miserable, notwithstanding sin. The motion comes from within, from his own breast and bowels. For our God is pitiful and of tender mercy, James 5:11, and the act of it is extended and reached out unto the creature in seasonable relief. For the throne of grace was erected for this purpose, Heb. 4:11. Two things there are in mercy: First, a propension and inclination to commiserate the afflicted. Secondly, a ready relief and succour of them according to our power, affectus and effectus. First, there is a compassion or a being affected with the misery of others. This properly cannot be in God, in whom as there is no passion, so strictly speaking there is no compassion; yet something analagous there is, a taking notice of our misery. Something like a pity arising in his heart upon the sight of it; which the Scripture frequently ascribes to God, and we can best understand as we consider the divine perfections shining forth in the human nature of Christ. Ex. 2:24, ‘He heard their groaning;’ and Isa. 63:4, ‘In all their afflictions He was afflicted.’ Judges 10:16, ‘His soul was grieved for the misery of Israel.’ Forms of speech taken from the manner of men, who use to be thus affected when they see a miserable object. God in his simple and perfect nature cannot be said either to joy or grieve: but He carries Himself as one thus affected. Or these expressions were laid in aforehand to suit with the divine perfections as manifested in Christ, who is touched with a feeling of our infirmities. Secondly, mercy notes the actual exhibition of help and relief to the miserable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm</cite>, … (London: T.P., 1681) | sermon 84, on Ps. 119:76, “Let, I pray thee, thy merciful kindness be for my comfort”, p. 512</span></figcaption>

</figure><figure class="quote" id="q-5c43cb88d6" data-kw="">
<blockquote><p>The gospel, however, is the offer of salvation upon the conditions of the covenant of grace. In this sense, the covenant of grace is formed with all mankind… If this, therefore, were all that is meant by those who make the parties to the covenant of grace, God and mankind in general and all mankind equally, there would be no objection to the doctrine.</p></blockquote>

<blockquote><p>§5. The covenant of God with man is different than those made by men among themselves. For men make covenants for mutual benefits; however, God makes covenant for His people. Indeed, the covenant of God is nothing other than the divine declaration of the way of receiving the love of God as well as the union and communion of becoming a partaker in Him. If man makes use of this way he is in the friendship of God, or, the Creator is his own, God is his own in a personal way (Gen. 17:7), and he is one spirit with God (1 Cor. 6:17), who is one with him (John 17:21); his is . . . (the intimate fellowship of God; Ps. 25:14, compared with Job 29:4, John 14:23.) The one who is outside of the covenant is. . . (without God, Eph. 2:12). This declaration, taken from Hebrews 8:6, can rightly be called…(divine legislation sanctioned in the promises), and when it is attached to the application of the Testament or the plan of the future inheritance, (we discuss this application below in §179 and §184). . . (the legislation of the Testament) or. . . (the Testament according to the force of the Covenant and Law) is described.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summary of the doctrine concerning the covenant or testament</cite>, … (1661).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“§5. The covenant of God with man is different than those made by men among themselves. For men make covenants for mutual benefits; however, God makes covenant for His people. Indeed, the covenant of God is nothing other than the divine declaration of the way of receiving the love of God as well as the union and communion of becoming a partaker in Him. If man makes use of this way he is in the friendship of God, or, the Creator is his own, God is his own in a personal way (Gen. 17:7), and he is one spirit with God (1 Cor. 6:17), who is one with him (John 17:21); his is . . . (the intimate fellowship of God; Ps. 25:14, compared with Job 29:4, John 14:23.) The one who is outside of the covenant is. . . (without God, Eph. 2:12). This declaration, taken from Hebrews 8:6, can rightly be called…(divine legislation sanctioned in the promises), and when it is attached to the application of the Testament or the plan of the future inheritance, (we discuss this application below in §179 and §184). . . (the legislation of the Testament) or. . . (the Testament according to the force of the Covenant and Law) is described.”

— Johannes Cocceius, Summary of the doctrine concerning the covenant or testament, … (1661).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A75.+The+covenant+of+God+with+man+is+different+than+those+made+by+men+among+themselves.+For+men+make+covenants+for+mutual+benefits%3B+however%2C+God+makes+covenant+for+His+people.+Indeed%2C+the+covenant+of+God+is+nothing+other+than+the+divine+declaration+of+the+way+of+receiving+the+love+of+God+as+well+as+the+union+and+communion+of+becoming+a+partaker+in+Him.+If+man+makes+use+of+this+way+he+is+in+the+friendship+of+God%2C+or%2C+the+Creator+is+his+own%2C+God+is+his+own+in+a+personal+way+%28Gen.+17%3A7%29%2C+and+he+is+one+spirit+with+God+%281+Cor.+6%3A17%29%2C+who+is+one+with+him+%28John+17%3A21%29%3B+his+is+.+.+.+%28the+intimate+fellowship+of+God%3B+Ps.+25%3A14%2C+compared+with+Job+29%3A4%2C+John+14%3A23.%29+The+one+who+is+outside+of+the+covenant+is.+.+.+%28without+God%2C+Eph.+2%3A12%29.+This+declaration%2C+taken+from+Hebrews+8%3A6%2C+can+rightly+be+called%E2%80%A6%28divine+legislation+sanctioned+in+the+promises%29%2C+and+when+it+is+attached+to+the+application+of+the+Testament+or+the+plan+of+the+future+inheritance%2C+%28we+discuss+this+application+below+in+%C2%A7179+and+%C2%A7184%29.+.+.+%28the+legislation+of+the+Testament%29+or.+.+.+%28the+Testament+according+to+the+force+of+the+Covenant+and+Law%29+is+described.%E2%80%9D%0A%0A%E2%80%94+Johannes+Cocceius%2C+Summary+of+the+doctrine+concerning+the+covenant+or+testament%2C+%E2%80%A6+%281661%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3d63b23ba5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3d63b23ba5.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/02/cocceius-on-the-definition-of-covenant/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57765b3c9f" data-kw="">
<blockquote><p>The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.</p></blockquote>
<figcaption>— <a href="../authors/samuel-e-waldron.html">Samuel E. Waldron</a>, <cite>A Modern Exposition of the 1689 Baptist Confession of Faith</cite>, ch. 1, p. 53</figcaption>
<div class="meta"><span class="t">Sufficiency</span><span class="t">Rome: The Rule of Faith</span></div>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption>— <a href="../authors/archibald-alexander.html">Archibald Alexander</a>, <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</figcaption>
<div class="meta"><span class="t">Canon</span><span class="t">Divine Authority</span><span class="t">Rome: The Rule of Faith</span></div>

</figure><figure class="quote" id="q-24b4e60934" data-kw="">
<blockquote><p>Is it not enough that you submit your opinion to the Scriptures? Do you submit it to the decrees of the church also? What can the church decree, that is not decreed in the Scriptures? If it can, where then remains the liberty and power of judging those who make the decrees?</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>The Bondage of the Will</cite>, Sect. 2, p. 8</figcaption>

</figure><figure class="quote" id="q-1898021635" data-kw="">
<blockquote><p>Our faith is built upon no worse a bottom than the infinite veracity of Him who is the truth itself, revealing himself to us in the Scripture of truth, and not on the sandy foundation of any human testimony:-- it leans upon God, not upon men; upon &quot;Thus saith the Lord,&quot; not, &quot;Thus saith the church.&quot;</p></blockquote>

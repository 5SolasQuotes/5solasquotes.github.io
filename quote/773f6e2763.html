<blockquote><p>God is said to have ceased from creating new creatures on the seventh day in that nothing has later been made that did not previously precede in some likeness in genus or species, or at least in seedlike principle or even as in obediential potency. Therefore I say that the world’s future renewal did pre-exist in the works of the six days in a kind of remote likeness, namely, in the glory or grace of the angels. It also preceded in obediential potency, which was then implanted in creation for the reception of such a renewal by God as agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences | distinction 48, quest. 2, The Renewal of the World, art. 1, Whether there is going to be a renewal of the world, Reply to obj. 3</cite>, bk. 4</span></figcaption>

<blockquote><p>Yet God tempers the severity of this spiritual slavery, first inwardly, by certain remaining shards of the divine image and original righteousness (James 3:9): first with respect to wisdom in the intellect, when he leaves to it certain principles of truth, through which man’s judgment, both theoretical and practical, is directed, the prior through the knowledge of what is speculatively true and false, for example, that God exists, and so forth, which we observed in all people who are not thoroughly demented (Rom. 1:19–21, 32; 2:14–15), but the latter through the knowledge of what is upright and fair, and what is unfair, for example, that God must be worshipped, that to each must be rendered his own, that to another must not be done what you do not want done to yourself (Rom. 2:15), from which things the natural conscience receives some force (Rom. 2:15). Then with respect to some inclination and propensity to good in the will, one that is indeed frail and dead, but yet not absolutely non-existent, and indeed such a one as that at least the appearances of virtues are approved and honored by all (2 Tim. 3:5). In addition to these things, with regard to both intellect and will, there is, internally, restraining grace, by which sin itself is not removed or diminished, but its action is curbed so that it would not burst its restraint, a grace also by which the more upright at least abhor more atrocious sins (1 Cor. 5:1); then externally, through certain political, ecclesiastical, economic, and academic remedies, by which in some measure the license of sin is restrained, and indeed there is added a stimulus to perform upright deeds.</p></blockquote>

<blockquote><p>…we can distinguish between natural passive potency and supernatural or obediential passive potency. A natural passive potency points to an outcome that can be realized given only a thing’s natural capacities, and can be actualized by some agent that is itself a mixture of active and passive potency. A supernatural or obediential potency points to an outcome that cannot be realized given only a thing’s natural capacities, and requires as an agent a purely actual divine cause. In human beings, potencies for eating, sleeping, walking, talking, thinking, willing, writing poems or doing science, and even coming to know the truths of natural theology and natural law are for the Scholastic all natural potencies; whereas the capacity to attain the Beatific Vision is an obediential potency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Metaphysics (Editiones Scholasticae, 2014), 1.1.3, ‘Divisions of act and potency’</cite>, p. 44</span></figcaption>

</figure><figure class="quote" id="q-78d4d20ff3" data-kw="">
<blockquote><p>203. He therefore that is so far disposed to any good act, and whose indisposition, or disposition to the contrary, is but such, as that in his present state, without any more help than he has, he can move his own will to the said act, and the difficulty is not so great but that such power sometime does overcome it, is said to have a moral power. But he that wants [lacks] not natural force or power, but only a right disposition of his will, and so far wants it, as that none in his case do ever change their own acts to good, without more help and power than he has, is said to be morally unable or impotent: and not only to want the habit. 204… Unbelievers want not that natural power or faculty, which can believe and repent if duly suscitated and disposed: But through an ill disposition and contrary course of action, and want of due excitation, that power will not act, without God’s special grace. Which ‘will not’ signifies: 1. the undisposedness, 2. the non-agency. And in strictest speech, the former is best expressed by, ‘The will is undisposed and averse to believe, etc.’ and the latter by ‘The will does not consent.’ But the first may be expressed by, ‘It cannot’ because it will not come to pass, though it is no such ‘cannot’ as is distinct from ‘will not,’ but the very same. And as ‘power’ is distinct fom ‘will’ and a man is said to be able to do that which ‘he can do if he will,’ so no doubt but he that will believe and repent, can do it, so far as he is willing. And this is it that [which] Augustine so much pleads for, when he would have us distinguish ‘cannot’ and ‘will not,’ and when he says that Posse credere est omnium; Credere autem fidelium. [To be able to believe is common to all; but actually to believe is the mark of the faithful.] … 213. A man may be able mediately to do that which he is not able immediately to do: I mean he that can write with a pen, or move things with an engine, and so act but as a partial, though principal cause, may not be able to write without a pen, nor to do the same alone as a total cause. 214. And a man may have power to do that mediately and hypothetically hereafter, which he cannot do immediately, that is, at the present time. He can learn to write, and after can write, who cannot write till he hath learned. Thus infants have a remote power of speaking, and infidels of believing.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“203. He therefore that is so far disposed to any good act, and whose indisposition, or disposition to the contrary, is but such, as that in his present state, without any more help than he has, he can move his own will to the said act, and the difficulty is not so great but that such power sometime does overcome it, is said to have a moral power. But he that wants [lacks] not natural force or power, but only a right disposition of his will, and so far wants it, as that none in his case do ever change their own acts to good, without more help and power than he has, is said to be morally unable or impotent: and not only to want the habit. 204… Unbelievers want not that natural power or faculty, which can believe and repent if duly suscitated and disposed: But through an ill disposition and contrary course of action, and want of due excitation, that power will not act, without God’s special grace. Which ‘will not’ signifies: 1. the undisposedness, 2. the non-agency. And in strictest speech, the former is best expressed by, ‘The will is undisposed and averse to believe, etc.’ and the latter by ‘The will does not consent.’ But the first may be expressed by, ‘It cannot’ because it will not come to pass, though it is no such ‘cannot’ as is distinct from ‘will not,’ but the very same. And as ‘power’ is distinct fom ‘will’ and a man is said to be able to do that which ‘he can do if he will,’ so no doubt but he that will believe and repent, can do it, so far as he is willing. And this is it that [which] Augustine so much pleads for, when he would have us distinguish ‘cannot’ and ‘will not,’ and when he says that Posse credere est omnium; Credere autem fidelium. [To be able to believe is common to all; but actually to believe is the mark of the faithful.] … 213. A man may be able mediately to do that which he is not able immediately to do: I mean he that can write with a pen, or move things with an engine, and so act but as — Richard Baxter, sect. 10, ‘Of Natural &amp; Moral Power as Foreseen’ in Catholic Theology (London: White, 1675), pp. 36-39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C203.+He+therefore+that+is+so+far+disposed+to+any+good+act%2C+and+whose+indisposition%2C+or+disposition+to+the+contrary%2C+is+but+such%2C+as+that+in+his+present+state%2C+without+any+more+help+than+he+has%2C+he+can+move+his+own+will+to+the+said+act%2C+and+the+difficulty+is+not+so+great+but+that+such+power+sometime+does+overcome+it%2C+is+said+to+have+a+moral+power.+But+he+that+wants+%5Blacks%5D+not+natural+force+or+power%2C+but+only+a+right+disposition+of+his+will%2C+and+so+far+wants+it%2C+as+that+none+in+his+case+do+ever+change+their+own+acts+to+good%2C+without+more+help+and+power+than+he+has%2C+is+said+to+be+morally+unable+or+impotent%3A+and+not+only+to+want+the+habit.+204%E2%80%A6+Unbelievers+want+not+that+natural+power+or+faculty%2C+which+can+believe+and+repent+if+duly+suscitated+and+disposed%3A+But+through+an+ill+disposition+and+contrary+course+of+action%2C+and+want+of+due+excitation%2C+that+power+will+not+act%2C+without+God%E2%80%99s+special+grace.+Which+%E2%80%98will+not%E2%80%99+signifies%3A+1.+the+undisposedness%2C+2.+the+non-agency.+And+in+strictest+speech%2C+the+former+is+best+expressed+by%2C+%E2%80%98The+will+is+undisposed+and+averse+to+believe%2C+etc.%E2%80%99+and+the+latter+by+%E2%80%98The+will+does+not+consent.%E2%80%99+But+the+first+may+be+expressed+by%2C+%E2%80%98It+cannot%E2%80%99+because+it+will+not+come+to+pass%2C+though+it+is+no+such+%E2%80%98cannot%E2%80%99+as+is+distinct+from+%E2%80%98will+not%2C%E2%80%99+but+the+very+same.+And+as+%E2%80%98power%E2%80%99+is+distinct+fom+%E2%80%98will%E2%80%99+and+a+man+is+said+to+be+able+to+do+that+which+%E2%80%98he+can+do+if+he+will%2C%E2%80%99+so+no+doubt+but+he+that+will+believe+and+repent%2C+can+do+it%2C+so+far+as+he+is+willing.+And+this+is+it+that+%5Bwhich%5D+Augustine+so+much+pleads+for%2C+when+he+would+have+us+distinguish+%E2%80%98cannot%E2%80%99+and+%E2%80%98will+not%2C%E2%80%99+and+when+he+says+that+Posse+credere+est+omnium%3B+Credere+autem+fidelium.+%5BTo+be+able+to+believe+is+common+to+all%3B+but+actually+to+believe+is+the+mark+of+the+faithful.%5D+%E2%80%A6+213.+A+man+may+be+able+mediately+to+do+that+which+he+is+not+able+immediately+to+do%3A+I+mean+he+that+can+write+with+a+pen%2C+or+move+things+with+an+engine%2C+and+so+act+but+as+a+partial%2C+though+principal+cause%2C+may+not+be+able+to+write+without+a+pen%2C+nor+to+do+the+same+alone+as+a+total+cause.+214.+And+a+man+may+have+power+to+do+that+mediately+and+hypothetically+hereafter%2C+which+he+cannot+do+immediately%2C+that+is%2C+at+the+present+time.+He+can+learn+to+write%2C+and+after+can+write%2C+who+cannot+write+till+he+hath+learned.+Thus+infants+have+a+remote+power+of+speaking%2C+and+infidels+of+believing.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+sect.+10%2C+%E2%80%98Of+Natural+%26+Moral+Power+as+Foreseen%E2%80%99+in+Catholic+Theology+%28London%3A+White%2C+1675%29%2C+pp.+36-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78d4d20ff3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78d4d20ff3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=203.%20He%20therefore%20that%20is%20so,of%20speaking%2C%20and%20infidels%20of%20believing&amp;text=203.%20He%20therefore%20that%20is%20so%20far%20disposed&amp;text=remote%20power%20of%20speaking%2C%20and%20infidels%20of%20believing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

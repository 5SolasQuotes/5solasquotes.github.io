<main class="wrap"><figure class="quote" id="q-b848d9e9e9" data-kw="">
<blockquote><p>Be much with God in religious duties. Secret praying, reading, and meditating, are great helps to piety. The bottom of a Christian’s building is underground, and out of the world’s sight. The greatest part of that trade which a saint drives with God is unseen, and his returns are unknown to the world. Christ giveth his sweetest kisses and dearest embraces to his spouse when she is alone. Jacob met with the blessing when he had parted with his company, and wrestled singly with the angel of the covenant. Bread eaten in secret, how sweet is it! When God meeteth thy soul in a morning or evening prayer, communion with his Majesty will be sweet to thee indeed.

Take heed of omission of duties in the closet. The Amalekite had not eaten in three days, who was nigh death. It is observed that the places under the line are not so hot as some places at a further distance, because, though they have the beams of the sun falling perpendicularly to cause a more intense heat, yet the nights there being longer than in some other parts, the days are not so hot. When the nights are long, the days are very cold; when there are long omissions of duties, godliness will cool.

Ah, didst thou but know what many a saint hath gained by that hidden calling, I am confident thou wouldst mind it, whatever thou didst omit. Remember how often and earnestly I have urged thee to this duty. It is thy privilege, that though thou canst not every day have the showers of public ordinances, yet mayest thou have the watering-pots of secret duties to make thy soul fruitful. Let no day pass without thy morning and evening sacrifices. Fasting is bad for some bodies; I am sure to fast from spiritual food is exceeding injurious to thy soul.

He that runneth into enormities (as a drunkard, or swearer, or adulterer, &amp;c.) he stabbeth his soul; he that omitteth daily duties, he starveth his soul. Now, what great difference is there between the death of the soul by stabbing and by starving? If thy soul die eternally, it will be little comfort to thee to plead that thou didst not drink, or swear, as others. Oh friend, let no day pass without secret duties; if thou risest in a morning, and followest thy calling all day, and liest down at night, and never desirest God’s company, or askest his blessing, I would know wherein thou dost God more service than the ox or ass? For shame, friend, do not thus play the beast any longer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 19-20.</span></figcaption>

<blockquote><p>Quest. 1. If it be not lawful to make the image of God the Father, yet may we not make an image of Christ, who took upon him the nature of man? Resp. No. Epiphanius seeing an image of Christ hanging in a church, broke it in pieces; ’tis Christ’s Godhead, united to his manhood, that makes him to be Christ; therefore to picture his manhood, when we cannot picture his Godhead, is a sin, because we make him to be but half Christ; we separate what God hath joined, we leave out that which is the chief thing, which makes him to be Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, (1692), 280. [spelling modernized]</span></figcaption>

<blockquote><p>We are told by hymnologers that there is no mention in such psalms of the “sweet name of Jesus.” But is there in the hymns in question? But what Christian minister what Christian elder, nay, what Christian child, who has had a godly father or mother, does not know who the Refuge of the believer is? Does any soul ever sing such a psalm without rejoicing in that name as “ointment poured forth,” as the way into this Refuge, and in the Holy Spirit, who, in God’s infinite grace, has guided him into it? It is very shallow piety indeed that needs all this to be put in words in a song of praise.

It is not the nature of truly lifting up of the soul to God in trust, and hope, and joy, to do it in the details of a doctrinal and theological discussion, whether in thanksgiving, in penitence, or prayer. So the psalms express the essence of them all. What Christian congregation in this land does not know the Redeemer, the name of Jesus, and the Holy Spirit? Did David not know it when he sang Psalm Ixxxviii. 1 — “Lord God, my Saviour,” (my Jesus) “day and night, Before thee cried have I,”- etc.

Nay, did Abraham not know it when he “saw his day afar off, and was glad”? Our Lord himself hath amply taught us, both personally, and by His inspired apostles, that they did; and are we not to know it when we sing Psalms il., xvi., xxii., xxiii., xlv., cx., cxviii., and many others?

To sing these psalms with our gospel light, is to enjoy the communion of saints from the beginning of the church on earth even until now — a communion in praise, at least, which sectarian hymns from their very nature completely destroy, and raise the spirit of controversy rather than kindle the lofty flame of pure devotion. Who does not know what is the child’s true hymn — “The Lord’s my Shepherd?” What child does not know who He was — the great and the good Shepherd, who giveth His life for the sheep, and who “carrieth the lambs in His bosom;” and who said, “Suffer the little children to come unto me”?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 135-36.</span></figcaption>

<blockquote><p>Q. 37: What is required touching singing of psalms in the church? That they be such as are parts of the Word of God, formed by the Holy Ghost into psalms or songs, which many may conveniently sing together, exhorting and admonishing themselves mutually with grace in their hearts (Matt. 26:30; Eph. 5:19; Col. 3:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, A Catechism of the Rev. John Robinson; Leiden. Being an Appendix to the Foundation of Christian Religion, Gathered into Six Principles, by Rev. William Perkins, p. 434. Robinson (c.1576-1625) was a Pilgrim and separatist minister, leader of the Congregationalist settlers who journeyed to Plymouth Colony, New England.</span></figcaption>

<blockquote><p>[B]ut we may say of the observation of holy days, as our Saviour in another case, from the beginning it was not so. The truth is, that holy days, Monkery, Nunnery, solitary life, Images, praying for the dead, prayer to Saints departed and Angels as Mediators, were brought in by the factors for Antichrist, yet with such specious pretences, and seeming devotion and holiness, that even many good men were strangely deceived by them, till it was too late to withstand them. But by those Christmas sports, carnal pleasures and delights, God hath in those few holy days been more dishonoured, the devil better served, evil men more hardened in their wickedness, and good men more grieved, and more souls sent head-long to hell, than on any other day, yea, than on all the rest of the year beside.</p></blockquote>

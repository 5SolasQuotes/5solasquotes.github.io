<blockquote><p>Question: What is a right and straight intention in serving God? Assertion 1. When the deliberation of a bended will concurs with the intention, it’s right; as when there is a heart-conclusion for God, Ps. 39:1, ‘I said I will take heed to my ways, that I offend not with my tongue.’ Ps. 31:14, ‘But I trusted in the Lord: I said, Thou art my God.’ Ps. 102:24, ‘I said, O my God, take me not away in the midst of my days.’ This was an intended prayer, Ps. 119:57, ‘I have said that I would keep thy words.’ Assertion 2. The saints are not so perfect in their intentions as God is their only end:

1. Because a piece of ourself is mixed with our end; there is some crook in our straightest line; an angle in our perfectest circle: when we run most swiftly, because of the indwelling of corruption we halt a little.

2. Self-denial is not perfect in this life. Assertion 3. It’s good when God is so preconceived in the intention, as the principal actions and motions both have being and denomination from their predominant element. Honey is honey, though not pure from wax. A believer is not a simple element, nor all grace and all sincerity. Now in bodies carried with a predominant element, the predominant is affirmed, the subordinate denied. 1 Cor. 15:10, ‘Yet not I, but the grace of God with me.’ 2 Cor. 4:5, ‘For we preach not ourselves, but Christ Jesus the Lord, and ourselves your servants for Christ’s sake.’ Where Christ is the predominant element, He is of weight to sway the whole soul in its motion. And it’s right-down sincerity (whatever Crispe [an Antinomian], with Papists say on the contrary) though it require some grains of allowance to make it pass. Assertion 4. Where self is the predominant, the intention is bastard and adulterate. Jehu says, ‘Come see my zeal for the Lord;’ but he only says it. He could have said, ‘Come see my zeal for myself.’ In the Jews’ zeal, Rom. 10:1, there’s a pound of self-righteousness for one-half grain of Christ and of free-grace; therefore it’s not the right zeal of God. Assertion 5. There be two characters of an intended end, which are also here:

1. All that the agent does, he refers to his end; for his end is his God. The wretch does all in reference to gold: that is his end; and Joab did all for court and honor; for the chief end is the man’s master and uses a lordship over him. Christ is so mighty through God that He darkens the scribes’ and pharisees’ light, because their end lies in the fat womb of the world and it is gain and glory; all they do is to make Christ out of the way. So when the believer sails all winds, rolls every stone, presses all means for Christ as his end and his weight, then stirs he to the right port. Christ’s love has a dominion over lord-will: One adamant will cut another; the sinner is a rock, Christ’s love an adamant. Christ’s love setting on the will’s intention burns the soul to the bone. Mary Magdalen cannot sleep (and its a ticklesome game where the heart is at the stake) and Christ she must have; apostles, angels, Christ Himself shall hear of it ere she want [lack] Him. And the rougher and harder the means be, when undertaken for Christ, Christ must be a stronger and more love-working end. When torment and burning quick [alive] are chosen for Christ, it’s like He is the end; for love overcomes a rough and dangerous journey: A sweet and desirable home is above a dirty and thorny way. Christ’s love is stronger than Hell. Our affections often take fire from difficulties, as absence of the Beloved kindles a new fire; stolen bread, because stolen, is sweeter, and not our nature only; but longing after Christ, nititur in vetitum, ‘inclines to that which is forbidden.’ What if Christ be longed for and loved more when absent than present?

2. The other character is that when the end is obtained, all operation for or about the means ceases, and the soul has a complacency in the fruition of the end. When the wretch’s chests are full, he has a heart-quietness in gold; Lk. 12, ‘Soul, take thine ease;’ but if the soul have an aching and a disquieting motion after gold is obtained, it is not because gold was not his end, but because he has not obtained it in such a large measure as he would, or because it’s but a sick and lame end and cannot satiate, but rather sharpen soul-thirst after such corruptible things. When Christ is obtained, the soul has sweet peace; He that drinks of the water of life thirsts no more, appetitu desiderii, ‘as longing with anxiety’ for this, as we do for earthly things which we want [lack]; though he have appetitum complacentiae, ‘a desire of complacency’ and a sweet self-quietness that his heritage pleases him well and his lines are fallen in pleasant parts, and rests on his portion and would not change it with ten thousand worlds. Men by this, who are fishing and hunting after some other thing than Christ, may know what is their end: when Christ and reformation come to their doors, they will have neither but cast out their lines for another prey: Men now fish and angle for gain in lieu of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 164-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

2. The other character is that when the end is obtained, all operation for or about the means ceases, and the soul has a complacency in the fruition of the end. When the wretch’s chests are full, he has a heart-quietness in gold; Lk. 12, ‘Soul, take thine ease;’ but if the soul have an aching and a disquieting motion after gold is obtained, it is not because gold was not his end, but because he has not obtained it in such a large measure as he would, or because it’s but a sick and lame end and cannot satiate, but rather sharpen soul-thirst after such corruptible things. When Christ is obtained, the soul has sweet peace; He that drinks of the water of life thirsts no more, appetitu desiderii, ‘as longing with anxiety’ for this, as we do for earthly things which we want [lack]; though he have appetitum complacentiae, ‘a desire of complacency’ and a sweet self-quietness that his heritage pleases him well and his lines are fallen in pleasant parts, and rests on his portion and would not change it with ten thousand worlds. Men by this, who are fishing and hunting after some other thing than Christ, may know what is their end: when Christ and reformation come to their doors, they will have neither but cast out their lines for another prey: Men now fish and angle for gain in lieu of godliness.”

it+require+some+grains+of+allowance+to+make+it+pass.+Assertion+4.+Where+self+is+the+predominant%2C+the+intention+is+bastard+and+adulterate.+Jehu+says%2C+%E2%80%98Come+see+my+zeal+for+the+Lord%3B%E2%80%99+but+he+only+says+it.+He+could+have+said%2C+%E2%80%98Come+see+my+zeal+for+myself.%E2%80%99+In+the+Jews%E2%80%99+zeal%2C+Rom.+10%3A1%2C+there%E2%80%99s+a+pound+of+self-righteousness+for+one-half+grain+of+Christ+and+of+free-grace%3B+therefore+it%E2%80%99s+not+the+right+zeal+of+God.+Assertion+5.+There+be+two+characters+of+an+intended+end%2C+which+are+also+here%3A+1.+All+that+the+agent+does%2C+he+refers+to+his+end%3B+for+his+end+is+his+God.+The+wretch+does+all+in+reference+to+gold%3A+that+is+his+end%3B+and+Joab+did+all+for+court+and+honor%3B+for+the+chief+end+is+the+man%E2%80%99s+master+and+uses+a+lordship+over+him.+Christ+is+so+mighty+through+God+that+He+darkens+the+scribes%E2%80%99+and+pharisees%E2%80%99+light%2C+because+their+end+lies+in+the+fat+womb+of+the+world+and+it+is+gain+and+glory%3B+all+they+do+is+to+make+Christ+out+of+the+way.+So+when+the+believer+sails+all+winds%2C+rolls+every+stone%2C+presses+all+means+for+Christ+as+his+end+and+his+weight%2C+then+stirs+he+to+the+right+port.+Christ%E2%80%99s+love+has+a+dominion+over+lord-will%3A+One+adamant+will+cut+another%3B+the+sinner+is+a+rock%2C+Christ%E2%80%99s+love+an+adamant.+Christ%E2%80%99s+love+setting+on+the+will%E2%80%99s+intention+burns+the+soul+to+the+bone.+Mary+Magdalen+cannot+sleep+%28and+its+a+ticklesome+game+where+the+heart+is+at+the+stake%29+and+Christ+she+must+have%3B+apostles%2C+angels%2C+Christ+Himself+shall+hear+of+it+ere+she+want+%5Black%5D+Him.+And+the+rougher+and+harder+the+means+be%2C+when+undertaken+for+Christ%2C+Christ+must+be+a+stronger+and+more+love-working+end.+When+torment+and+burning+quick+%5Balive%5D+are+chosen+for+Christ%2C+it%E2%80%99s+like+He+is+the+end%3B+for+love+overcomes+a+rough+and+dangerous+journey%3A+A+sweet+and+desirable+home+is+above+a+dirty+and+thorny+way.+Christ%E2%80%99s+love+is+stronger+than+Hell.+Our+affections+often+take+fire+from+difficulties%2C+as+absence+of+the+Beloved+kindles+a+new+fire%3B+stolen+bread%2C+because+stolen%2C+is+sweeter%2C+and+not+our+nature+only%3B+but+longing+after+Christ%2C+nititur+in+vetitum%2C+%E2%80%98inclines+to+that+which+is+forbidden.%E2%80%99+What+if+Christ+be+longed+for+and+loved+more+when+absent+than+present%3F+2.+The+other+character+is+that+when+the+end+is+obtained%2C+all+operation+for+or+about+the+means+ceases%2C+and+the+soul+has+a+complacency+in+the+fruition+of+the+end.+When+the+wretch%E2%80%99s+chests+are+full%2C+he+has+a+heart-quietness+in+gold%3B+Lk.+12%2C+%E2%80%98Soul%2C+take+thine+ease%3B%E2%80%99+but+if+the+soul+have+an+aching+and+a+disquieting+motion+after+gold+is+obtained%2C+it+is+not+because+gold+was+not+his+end%2C+but+because+he+has+not+obtained+it+in+such+a+large+measure+as+he+would%2C+or+because+it%E2%80%99s+but+a+sick+and+lame+end+and+cannot+satiate%2C+but+rather+sharpen+soul-thirst+after+such+corruptible+things.+When+Christ+is+obtained%2C+the+soul+has+sweet+peace%3B+He+that+drinks+of+the+water+of+life+thirsts+no+more%2C+appetitu+desiderii%2C+%E2%80%98as+longing+with+anxiety%E2%80%99+for+this%2C+as+we+do+for+earthly+things+which+we+want+%5Black%5D%3B+though+he+have+appetitum+complacentiae%2C+%E2%80%98a+desire+of+complacency%E2%80%99+and+a+sweet+self-quietness+that+his+heritage+pleases+him+well+and+his+lines+are+fallen+in+pleasant+parts%2C+and+rests+on+his+portion+and+would+not+change+it+with+ten+thousand+worlds.+Men+by+this%2C+who+are+fishing+and+hunting+after+some+other+thing+than+Christ%2C+may+know+what+is+their+end%3A+when+Christ+and+reformation+come+to+their+doors%2C+they+will+have+neither+but+cast+out+their+lines+for+another+prey%3A+Men+now+fish+and+angle+for+gain+in+lieu+of+godliness.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%28London%3A+1647%29%2C+pp.+164-66&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa510649580.html&a

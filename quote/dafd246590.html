<main class="wrap"><figure class="quote" id="q-dafd246590" data-kw="">
<blockquote><p>V. The law of nature is an ordinance and precept which reason, from common notions infused by God even after the fall, forms in the manner of a law with God Himself assisting; by which all and each are taught generally concerning good and evil to be avoided or done, and concerning the means to each.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’</cite>, (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5111f482c3" data-kw="">
<blockquote><p>The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, vol. 1, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-3dd5da3b7b" data-kw="">
<blockquote><p>…about a law there are these affections (if I may call them so): There is an interpretation, a dispensation, or relaxation; and these differ from an abrogation. For the former do suppose the law still standing in force, though mitigated; but Abrogation is then properly, when a Law is totally taken away. And this abrogation arises sometimes from the express constitution at first, which did limit and prescribe the time of the law’s continuance: sometimes by an express revoking and repealing of it by that authority which made it, sometimes by adding to that repeal an express law commanding the contrary. Now it may be easily proved that the Ceremonial and Judicial laws, they are abrogated by express repeal. The Judicial Law: 1 Pet. 2:13, where they are commanded to be subject to every ordination of man: and this was long foretold Gen. 49:10. The Lawgiver shall be taken from Judah. The Ceremonial Law that is also expressly repealed Acts 15 and in other places… In the second place, if we would speak exactly and properly, we cannot say, in any good sense, that the Moral Law is abrogated at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), pp. 211-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-21da6436c8" data-kw="">
<blockquote><p>This translation is a selection from Lessius’ treatment of contract law in his larger work On Justice and Right. By drawing on diverse sources ranging from Roman and canon law to moral philosophy, Lessius offers practical advice in commercial and financial matters. These chapters on sale, securities, and insurance engage perennial questions concerning the lawfulness of insider trading, the sale of toxic debt, and asymmetric information in insurance markets.</p></blockquote>

<blockquote><p>I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.</p></blockquote>

<blockquote><p>‘But for this cause came I to this hour.’ Here is the fifth article in this prayer: a sort of correction, in which Christ does resign his will, as man, to the will of God; as Mt. 26:39; Lk. 22:42. ‘Nevertheless, not my will, but thine be done.’ In this there is offered to us a question, Whether or no there be in this prayer any repugnancy in the human will of Christ to the will of God? For: 1. A correction of the human will seems to import a jarring and a discord; 2. Christ desired that, the contrary whereof He knew was from eternity decreed of God. 3. The Law of God is so spiritual, straight and holy that it requires not only a conformity to it, and our will, actions, words and purposes, but also in all our affections, desires, first-motions and inclinations of our heart, that no unperfect and half-formed lustings arise in us even before the complete consent of the will that may thwart or cross the known Law and command of God; and by this, ‘Thou shalt not lust,’ Rom. 7, and the duty of the highest love we owe to God, to love him with all the heart, soul, mind, and whole strength, Mt. 22:37; Mk. 12:33; Lk. 10:27. Some Arians and Arminians, John Geysteranus at the Synod of Dort, have said blasphemously that there was concupiscence and a will repugnant to God’s will in the second Adam, as in the first. But this they spoke against the consubstantiality and deity of the Son of God. To which we say: Assertion 1. Jesus Christ that holy thing, Lk. 1:35, was a fit high priest, holy, harmless, undefiled, separated from sinners, Heb. 7:26. Which of you (says Christ to the Jews) convinces me of sin, Jn. 8:46. There could not be a spot in this Lamb sacrificed for the sins of the world, no prick in this Rose, no cloud in this fair Sun, no blemish in this beautiful Well-beloved. Assertion 2. An absolute, resolved will or desire of heart to lust after that which God forbids in his Law must be a sinful jarring between the creature’s and the Creator’s will. Now, Christ‘s will was conditional and clearly submissive; it lay ever level with his Father’s holy will. Assertion 3. I shall not with some affirm that which in the general is true, a will contrary to God’s revealed command and will, called voluntas signi, which is our moral rule to oblige us, is a sin [see Assertion 4 below]; but a will contrary to God’s decree, called voluntas beneplaciti, which is not our rule obliging, except the Lord be pleased to impose it on us as a moral Law, is not a sin. Peter and the apostles, after they heard that prophecy of their denying of Christ and their being sinfully scandalized, and their forsaking of Christ when the Shepherd was smitten, were obliged to have a will contrary to that decree and to pray that they might not be led into temptation, but might have grace to confess their Savior before men and not flee, nor be scattered: Here is a resolute will of men lawfully contrary to the revealed decree of God, yet not sinful. But the Lord’s will that Christ should die for man, as it was a decree of the wise and most gracious Lord pitying lost man, so was it also a revealed commandment to Christ, that He should be willing to die and be obedient to the death, even the death of the cross, Phil. 2:8; yea, a rule of such humble obedience as we are obliged to follow, as is said, verse 5, ‘Let this mind be in you, which was also in Christ Jesus,’ etc. If the Lord’s will that Christ should die be nothing but his mere decree, it could not oblige us in the like case to be willing, as John says to lay down our life for the brethren. Yea, Jn. 10:18, Christ has a commandment of God and the revealed will of God to die for us: ‘No man takes it from Me, but I lay it down of myself: I have power to lay it down; I have power to take it again: this commandment have I received of my Father.’ Here is an express commandment given to Christ to die for sinners; and the Father loves Christ for obedience to this commandment. Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations. 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment, for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son, if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did God’s precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination natural in a father to preserve the life of the child.’ So the positive command of the Father that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die. 2. A martyr dying for the truth of Christ may have a natural and conditional desire and inclination to live, though his living be contrary to the Lord’s revealed will commanding him to seal the Gospel with his blood and to confess Christ before men. 3. If the brother, son, daughter, wife or friend that is as a man’s own soul, Dt. 13:6, blaspheme God, yea if father or mother do it, Dt. 33:8-9, yet is a father obliged to stone the son or daughter, the son being a magistrate or a Levite and priest, to judge according to law (the priests’ lips should preserve knowledge, Mal. 2:8) that his father or mother ought to be stoned to death; yet ought not father or son to lay aside that natural desire of being and life to son, father, brother which the law of nature in the Fifth Command does require, especially the desire being conditional, with submission to God’s will, as the desire of Christ is here; and the command to stone the blasphemer, that the father stone the son, the son the father, being positive, and though founded on the law of nature, that a man prefer his Lord Creator and God before son or father and mother, yet are they not precepts of the law of nature such as is the precept of nature that a man desire his own life and being, the father the life and being of the son. Assertion 5. The apparent opposition (for it is not real) is rather between Christ‘s sensitive and his sinless mere natural desire and affection, and his reasonable will, than his [human] will and the will of God: Nor can any say there is a fight or jarring between the conditional desire of Christ subjected in the same act of praying, to the Lord’s decree and the resolute and immutable will of God. The Law of God, because holy and spiritual, does require a conformity between all the inclinations and motions of our soul and the law of nature; but an absolute conformity between all our inclinations and every positive command of God, such as was the Lord’s command that Christ should die for sinners, is not required in the Law of God. If Adam submit his natural hunger or desire to eat of the forbidden tree, to God’s Law, and eat not, there is no sinful jarring between his will and God’s positive Law, ‘Thou shalt not eat of the tree of Knowledge of good and evil.’</p></blockquote>

<div class="actions"><button class="copy" data-copy="“‘But for this cause came I to this hour.’ Here is the fifth article in this prayer: a sort of correction, in which Christ does resign his will, as man, to the will of God; as Mt. 26:39; Lk. 22:42. ‘Nevertheless, not my will, but thine be done.’ In this there is offered to us a question, Whether or no there be in this prayer any repugnancy in the human will of Christ to the will of God? For: 1. A correction of the human will seems to import a jarring and a discord; 2. Christ desired that, the contrary whereof He knew was from eternity decreed of God. 3. The Law of God is so spiritual, straight and holy that it requires not only a conformity to it, and our will, actions, words and purposes, but also in all our affections, desires, first-motions and inclinations of our heart, that no unperfect and half-formed lustings arise in us even before the complete consent of the will that may thwart or cross the known Law and command of God; and by this, ‘Thou shalt not lust,’ Rom. 7, and the duty of the highest love we owe to God, to love him with all the heart, soul, mind, and whole strength, Mt. 22:37; Mk. 12:33; Lk. 10:27. Some Arians and Arminians, John Geysteranus at the Synod of Dort, have said blasphemously that there was concupiscence and a will repugnant to God’s will in the second Adam, as in the first. But this they spoke against the consubstantiality and deity of the Son of God. To which we say: Assertion 1. Jesus Christ that holy thing, Lk. 1:35, was a fit high priest, holy, harmless, undefiled, separated from sinners, Heb. 7:26. Which of you (says Christ to the Jews) convinces me of sin, Jn. 8:46. There could not be a spot in this Lamb sacrificed for the sins of the world, no prick in this Rose, no cloud in this fair Sun, no blemish in this beautiful Well-beloved. Assertion 2. An absolute, resolved will or desire of heart to lust after that which God forbids in his Law must be a sinful jarring between the creature’s and the Creator’s will. Now, Christ‘s will was conditional and clearly submissive; it lay ever level with his Father’s holy will. Assertion 3. I shall not with some affirm that which in the general is true, a will contrary to God’s revealed command and will, called voluntas signi, which is our moral rule to oblige us, is a sin [see Assertion 4 below]; but a will contrary to God’s decree, called voluntas beneplaciti, which is not our rule obliging, except the Lord be pleased to impose it on us as a moral Law, is not a sin. Peter and the apostles, after they heard that prophecy of their denying of Christ and their being sinfully scandalized, and their forsaking of Christ when the Shepherd was smitten, were obliged to have a will contrary to that decree and to pray that they might not be led into temptation, but might have grace to confess their Savior before men and not flee, nor be scattered: Here is a resolute will of men lawfully contrary to the revealed decree of God, yet not sinful. But the Lord’s will that Christ should die for man, as it was a decree of the wise and most gracious Lord pitying lost man, so was it also a revealed commandment to Christ, that He should be willing to die and be obedient to the death, even the death of the cross, Phil. 2:8; yea, a rule of such humble obedience as we are obliged to follow, as is said, verse 5, ‘Let this mind be in you, which was also in Christ Jesus,’ etc. If the Lord’s will that Christ should die be nothing but his mere decree, it could not oblige us in the like case to be willing, as John says to lay down our life for the brethren. Yea, Jn. 10:18, Christ has a commandment of God and the revealed will of God to die for us: ‘No man takes it from Me, but I lay it down of myself: I have power to lay it down; I have power to take it again: this commandment have I received of my Father.’ Here is an express commandment given to Christ to die for sinners; and the Father loves Christ for obedience to this commandment. Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations. 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment, for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son, if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did God’s precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination natural in a father to preserve the life of the child.’ So the positive command of the Father that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die. 2. A martyr dying for the truth of Christ may have a natural and conditional desire and inclination to live, though his living be contrary to the Lord’s revealed will commanding him to seal the Gospel with his blood and to confess Christ before men. 3. If the brother, son, daughter, wife or friend that is as a man’s own soul, Dt. 13:6, blaspheme God, yea if father or mother do it, Dt. 33:8-9, yet is a father obliged to stone the son or daughter, the son being a magistrate or a Levite and priest, to judge according to law (the priests’ lips should preserve knowledge, Mal. 2:8) that his father or mother ought to be stoned to death; yet ought not father or son to lay aside that natural desire of being and life to son, father, brother which the law of nature in the Fifth Command does require, especially the desire being conditional, with submission to God’s will, as the desire of Christ is here; and the command to stone the blasphemer, that the father stone the son, the son the father, being positive, and though founded on the law of nature, that a man prefer his Lord Creator and God before son or father and mother, yet are they not precepts of the law of nature such as is the precept of nature that a man desire his own life and being, the father the life and being of the son. Assertion 5. The apparent opposition (for it is not real) is rather between Christ‘s sensitive and his sinless mere natural desire and affection, and his reasonable will, than his [human] will and the will of God: Nor can any say there is a fight or jarring between the conditional desire of Christ subjected in the same act of praying, to the Lord’s decree and the resolute and immutable will of God. The Law of God, because holy and spiritual, does require a conformity between all the inclinations and motions of our soul and the law of nature; but an absolute conformity between all our inclinations and every positive command of God, such as was the Lord’s command that Christ should die for sinners, is not required in the Law of God. If Adam submit his natural hunger or desire to eat of the forbidden tree, to God’s Law, and eat not, there is no sinful jarring between his will and God’s positive Law, ‘Thou shalt not eat of the tree of Knowledge of good and evil.’”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself (London: 1647), pp. 138-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98But+for+this+cause+came+I+to+this+hour.%E2%80%99+Here+is+the+fifth+article+in+this+prayer%3A+a+sort+of+correction%2C+in+which+Christ+does+resign+his+will%2C+as+man%2C+to+the+will+of+God%3B+as+Mt.+26%3A39%3B+Lk.+22%3A42.+%E2%80%98Nevertheless%2C+not+my+will%2C+but+thine+be+done.%E2%80%99+In+this+there+is+offered+to+us+a+question%2C+Whether+or+no+there+be+in+this+prayer+any+repugnancy+in+the+human+will+of+Christ+to+the+will+of+God%3F+For%3A+1.+A+correction+of+the+human+will+seems+to+import+a+jarring+and+a+discord%3B+2.+Christ+desired+that%2C+the+contrary+whereof+He+knew+was+from+eternity+decreed+of+God.+3.+The+Law+of+God+is+so+spiritual%2C+straight+and+holy+that+it+requires+not+only+a+conformity+to+it%2C+and+our+will%2C+actions%2C+words+and+purposes%2C+but+also+in+all+our+affections%2C+desires%2C+first-motions+and+inclinations+of+our+heart%2C+that+no+unperfect+and+half-formed+lustings+arise+in+us+even+before+the+complete+consent+of+the+will+that+may+thwart+or+cross+the+known+Law+and+command+of+God%3B+and+by+this%2C+%E2%80%98Thou+shalt+not+lust%2C%E2%80%99+Rom.+7%2C+and+the+duty+of+the+highest+love+we+owe+to+God%2C+to+love+him+with+all+the+heart%2C+soul%2C+mind%2C+and+whole+strength%2C+Mt.+22%3A37%3B+Mk.+12%3A33%3B+Lk.+10%3A27.+Some+Arians+and+Arminians%2C+John+Geysteranus+at+the+Synod+of+Dort%2C+have+said+blasphemously+that+there+was+concupiscence+and+a+will+repugnant+to+God%E2%80%99s+will+in+the+second+Adam%2C+as+in+the+first.+But+this+they+spoke+against+the+consubstantiality+and+deity+of+the+Son+of+God.+To+which+we+say%3A+Assertion+1.+Jesus+Christ+that+holy+thing%2C+Lk.+1%3A35%2C+was+a+fit+high+priest%2C+holy%2C+harmless%2C+undefiled%2C+separated+from+sinners%2C+Heb.+7%3A26.+Which+of+you+%28says+Christ+to+the+Jews%29+convinces+me+of+sin%2C+Jn.+8%3A46.+There+could+not+be+a+spot+in+this+Lamb+sacrificed+for+the+sins+of+the+world%2C+no+prick+in+this+Rose%2C+no+cloud+in+this+fair+Sun%2C+no+blemish+in+this+beautiful+Well-beloved.+Assertion+2.+An+absolute%2C+resolved+will+or+desire+of+heart+to+lust+after+that+which+God+forbids+in+his+Law+must+be+a+sinful+jarring+between+the+creature%E2%80%99s+and+the+Creator%E2%80%99s+will.+Now%2C+Christ%E2%80%98s+will+was+conditional+and+clearly+submissive%3B+it+lay+ever+level+with+his+Father%E2%80%99s+holy+will.+Assertion+3.+I+shall+not+with+some+affirm+that+which+in+the+general+is+true%2C+a+will+contrary+to+God%E2%80%99s+revealed+command+and+will%2C+called+voluntas+signi%2C+which+is+our+moral+rule+to+oblige+us%2C+is+a+sin+%5Bsee+Assertion+4+below%5D%3B+but+a+will+contrary+to+God%E2%80%99s+decree%2C+called+voluntas+beneplaciti%2C+which+is+not+our+rule+obliging%2C+except+the+Lord+be+pleased+to+impose+it+on+us+as+a+moral+Law%2C+is+not+a+sin.+Peter+and+the+apostles%2C+after+they+heard+that+prophecy+of+their+denying+of+Christ+and+their+being+sinfully+scandalized%2C+and+their+forsaking+of+Christ+when+the+Shepherd+was+smitten%2C+were+obliged+to+have+a+will+contrary+to+that+decree+and+to+pray+that+they+might+not+be+led+into+temptation%2C+but+might+have+grace+to+confess+their+Savior+before+men+and+not+flee%2C+nor+be+scattered%3A+Here+is+a+resolute+will+of+men+lawfully+contrary+to+the+revealed+decree+of+God%2C+yet+not+sinful.+But+the+Lord%E2%80%99s+will+that+Christ+should+die+for+man%2C+as+it+was+a+decree+of+the+wise+and+most+gracious+Lord+pitying+lost+man%2C+so+was+it+also+a+revealed+commandment+to+Christ%2C+that+He+should+be+willing+to+die+and+be+obedient+to+the+death%2C+even+the+death+of+the+cross%2C+Phil.+2%3A8%3B+yea%2C+a+rule+of+such+humble+obedience+as+we+are+obliged+to+follow%2C+as+is+said%2C+verse+5%2C+%E2%80%98Let+this+mind+be+in+you%2C+which+was+also+in+Christ+Jesus%2C%E2%80%99+etc.+If+the+Lord%E2%80%99s+will+that+Christ+should+die+be+nothing+but+his+mere+decree%2C+it+could+not+oblige+us+in+the+like+case+to+be+willing%2C+as+John+says+to+lay+down+our+life+for+the+brethren.+Yea%2C+Jn.+10%3A18%2C+Christ+has+a+commandment+of+God+and+the+revealed+will+of+God+to+die+for+us%3A+%E2%80%98No+man+takes+it+from+Me%2C+but+I+lay+it+down+of+myself%3A+I+have+power+to+lay+it+down%3B+I+have+power+to+take+it+again%3A+this+commandment+have+I+received+of+my+Father.%E2%80%99+Here+is+an+express+commandment+given+to+Christ+to+die+for+sinners%3B+and+the+Father+loves+Christ+for+obedience+to+this+commandment.+Assertion+4.+A+conditional+and+a+submissive+desire%2C+though+not+agreeable+to+a+positive+law+and+commandment+of+God%2C+is+no+sin%2C+nor+does+the+Law+require+a+conformity+in+all+our+inclinations+and+the+first+motions+of+our+desires+to+every+command+of+God%2C+though+most+contrary+to+nature+and+our+natural+and+sinless+inclinations.+1.+If+God+command+Abraham+to+kill+his+only+begotten+son+and+offer+him+in+a+sacrifice+to+God%2C+which+was+a+mere+positive+commandment%2C+for+it%E2%80%99s+not+a+command+of+the+law+of+nature+%28nor+any+other+than+positive%29+for+the+father+to+kill+the+son%2C+if+yet+Abraham+retain+a+natural+inclination+and+love+commanded+also+in+the+law+of+nature+to+save+his+son%E2%80%99s+life+and+to+desire+that+he+may+live%2C+this+desire+and+inclination%2C+though+contradictory+to+a+positive+command+of+God%2C+is+no+sin%3B+because+the+Fifth+Command%2C+grounded+on+the+law+of+nature%2C+does+command+it.+Nor+did+God%E2%80%99s+precept+%28%E2%80%98Abraham%2C+kill+now+thy+son%2C+even+Isaac+thine+only+begotten+son%E2%80%99%29+ever+include+this%2C+%E2%80%98Abraham%2C+root+out+of+thine+heart+all+desire+and+inclination+natural+in+a+father+to+preserve+the+life+of+the+child.%E2%80%99+So+the+positive+command+of+the+Father+that+the+Son+of+God+should+lay+down+his+life+for+his+sheep%2C+did+never+root+out+of+the+sinless+nature+of+the+man-Christ+a+natural+desire+to+preserve+his+own+being+and+life%2C+especially+He+desiring+it+with+special+reservation+of+the+will+of+God+commanding+that+He+should+die.+2.+A+martyr+dying+for+the+truth+of+Christ+may+have+a+natural+and+conditional+desire+and+inclination+to+live%2C+though+his+living+be+contrary+to+the+Lord%E2%80%99s+revealed+will+commanding+him+to+seal+the+Gospel+with+his+blood+and+to+confess+Christ+before+men.+3.+If+the+brother%2C+son%2C+daughter%2C+wife+or+friend+that+is+as+a+man%E2%80%99s+own+soul%2C+Dt.+13%3A6%2C+blaspheme+God%2C+yea+if+father+or+mother+do+it%2C+Dt.+33%3A8-9%2C+yet+is+a+father+obliged+to+stone+the+son+or+daughter%2C+the+son+being+a+magistrate+or+a+Levite+and+priest%2C+to+judge+according+to+law+%28the+priests%E2%80%99+lips+should+preserve+knowledge%2C+Mal.+2%3A8%29+that+his+father+or+mother+ought+to+be+stoned+to+death%3B+yet+ought+not+father+or+son+to+lay+aside+that+natural+desire+of+being+and+life+to+son%2C+father%2C+brother+which+the+law+of+nature+in+the+Fifth+Command+does+require%2C+especially+the+desire+being+conditional%2C+with+submission+to+God%E2%80%99s+will%2C+as+the+desire+of+Christ+is+here%3B+and+the+command+to+stone+the+blasphemer%2C+that+the+father+stone+the+son%2C+the+son+the+father%2C+being+positive%2C+and+though+founded+on+the+law+of+nature%2C+that+a+man+prefer+his+Lord+Creator+and+God+before+son+or+father+and+mother%2C+yet+are+they+not+precepts+of+the+law+of+nature+such+as+is+the+precept+of+nature+that+a+man+desire+his+own+life+and+being%2C+the+father+the+life+and+being+of+the+son.+Assertion+5.+The+apparent+opposition+%28for+it+is+not+real%29+is+rather+between+Christ%E2%80%98s+sensitive+and+his+sinless+mere+natural+desire+and+affection%2C+and+his+reasonable+will%2C+than+his+%5Bhuman%5D+will+and+the+will+of+God%3A+Nor+can+any+say+there+is+a+fight+or+jarring+between+the+conditional+desire+of+Christ+subjected+in+the+same+act+of+praying%2C+to+the+Lord%E2%80%99s+decree+and+the+resolute+and+immutable+will+of+God.+The+Law+of+God%2C+because+holy+and+spiritual%2C+does+require+a+conformity+between+all+the+inclinations+and+motions+of+our+soul+and+the+law+of+nature%3B+but+an+absolute+conformity+between+all+our+inclinations+and+every+positive+command+of+God%2C+such+as+was+the+Lord%E2%80%99s+command+that+Christ+should+die+for+sinners%2C+is+not+required+in+the+Law+of+God.+If+Adam+submit+his+natural+hunger+or+desire+to+eat+of+the+forbidden+tree%2C+to+God%E2%80%99s+Law%2C+and+eat+not%2C+there+is+no+sinful+jarring+between+his+will+and+God%E2%80%99s+positive+Law%2C+%E2%80%98Thou+shalt+not+eat+of+the+tree+of+Knowledge+of+good+and+evil.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+138-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfce7c195b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cfce7c195b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=But%20for%20this%20cause%20came%20I,of%20Knowledge%20of%20good%20and%20evil&amp;text=But%20for%20this%20cause%20came%20I%20to%20this&amp;text=the%20tree%20of%20Knowledge%20of%20good%20and%20evil" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation. 8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>

<blockquote><p>Thus then the morality of our actions must not be measured by any decree concerning the futurition of events, but by some other rule, in which must concur God’s will and appointment, setting bounds unto us and designing our duty, and discovering what is well-pleasing and acceptable to God, honest and laudable in itself, and profitable and comfortable to us in the issue; and thus we have the Word of God for our direction and have his laws and testimonies to be our rule: Dt. 29:29; Isa. 8:20; Dt. 30:10-12; Dt. 5:29; Ps. 147:19; Rom, 12:2; 1 Thess. 4:2; 1 Pet. 4:2, etc. and we may take notice of these three things as necessarily requisite and concurring in that which is a warrant unto and rule of our actions and petitions: 1. The good-pleasure and decree of God, not concerning what shall come to pass, but concerning the quality and moral goodness of human actions, and which does limit and set bounds to reasonable creatures and prescribes unto them their duty; and this is the fountain and first spring (yea and by many judicious and sober divines is judged to be the supreme adequate and first rule) of moral rectitude. Hence we may conceive that God’s laws in Scripture are called ‘decrees,’ ‘statutes’ and ‘ordinances’. 2. From this decree and appointment, does (to our apprehension) flow divine approbation, complacency and delight in what is thus appointed to be our work and duty: hence that appointment is called the good, acceptable and perfect will of God, Rom. 12:2, and our actions when conform[ed] to that rule, are said to be well-pleasing in his sight, Heb. 13:2; yea the Lord does not only declare his love of his complacency, and delight in these when they are performed, but also He is said to will and desire (though not according to the Jesuitical and Arminian gloss)¹ those works while He is speaking to the rebellious and disobedient who have slighted his laws and casten all his statutes behind their backs: Eze. 18:23, 32; 33:11; Hos. 6:6; 1 Sam. 15:22; Isa. 61:8; Mt. 9:13; 2 Pet. 3:9, etc. ¹ Arminians, Socinians and Jesuits from thence would collect a frustratable and inefficacious will and desire in God, but this phrase does only import God’s serious approbation of the works of righteousness and detestation of the contrary. 3. There must be an intimation and promulgation of this decree and appointment, and a declaration of those things that would be well pleasing, and acceptable to God.</p></blockquote>

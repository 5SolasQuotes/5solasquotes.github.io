<main class="wrap"><figure class="quote" id="q-9e3b79cdfb" data-kw="">
<blockquote><p>They [difficulties in Scripture] are not to drive us from the holy ground where God shines in majesty in the flaming bush, but to teach us to put off our shoes at the holy ground; not to stand upon our own skill or wisdom, but to strike sail to the divine wisdom and mysteriousness that shines there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of… John Lightfoot… (d. 1675; London: Scot, 1684), Sermon on 2 Sam. 19:29</cite>, p. 1246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“They [difficulties in Scripture] are not to drive us from the holy ground where God shines in majesty in the flaming bush, but to teach us to put off our shoes at the holy ground; not to stand upon our own skill or wisdom, but to strike sail to the divine wisdom and mysteriousness that shines there.”

— John Lightfoot, The Works of… John Lightfoot… (d. 1675; London: Scot, 1684), Sermon on 2 Sam. 19:29, p. 1246">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+%5Bdifficulties+in+Scripture%5D+are+not+to+drive+us+from+the+holy+ground+where+God+shines+in+majesty+in+the+flaming+bush%2C+but+to+teach+us+to+put+off+our+shoes+at+the+holy+ground%3B+not+to+stand+upon+our+own+skill+or+wisdom%2C+but+to+strike+sail+to+the+divine+wisdom+and+mysteriousness+that+shines+there.%E2%80%9D%0A%0A%E2%80%94+John+Lightfoot%2C+The+Works+of%E2%80%A6+John+Lightfoot%E2%80%A6+%28d.+1675%3B+London%3A+Scot%2C+1684%29%2C+Sermon+on+2+Sam.+19%3A29%2C+p.+1246&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e3b79cdfb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9e3b79cdfb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=They%20%5Bdifficulties%20in%20Scripture%5D%20are%20not,wisdom%20and%20mysteriousness%20that%20shines%20there&amp;text=They%20%5Bdifficulties%20in%20Scripture%5D%20are%20not%20to%20drive&amp;text=the%20divine%20wisdom%20and%20mysteriousness%20that%20shines%20there" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0629595fba" data-kw="">
<blockquote><p>Q. Is it unlawful to make an image of the Trinity, or of any Person in the Godhead? It is utterly unlawful, and a great dishonor to figure the incorruptible God by the shape of a base and corruptible man or bird, or other creature. Dt. 4:15-18; Rom. 1:23; Acts 17:24, 29; Isa. 40:15, 18-19; Hab. 2:8. It abuses our understandings: the party thinks there is some good in an image, else he would not make it; and that’s a lie: He lies that shows me a toad and says it is the picture of an angel; so, etc. All the pictures of Christ in the flesh, as that on Christ on the cross and resurrection are lies, false in their representations and false in the conceit of any good by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Principle[s] of Faith &amp; Good Conscience Digested into a Catechetical Form… (Oxford: Hall, 1665), ch. 30</cite>, pp. 132-33</span></figcaption>

</figure><figure class="quote" id="q-22c09993bd" data-kw="">
<blockquote><p>…as Zanchius evidences by sundry instances, idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it than God allows or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [just as God in part] (bk. 1. de viti. ext. cult. oppos. cols. 504-5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies… (1637), pt. 3, ch. 4</cite>, p. 63</span></figcaption>

</figure><figure class="quote" id="q-99848ae32d" data-kw="">
<blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-e627d178b5" data-kw="">
<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren</cite>, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

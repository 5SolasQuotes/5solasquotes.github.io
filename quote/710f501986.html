<main class="wrap"><figure class="quote" id="q-710f501986" data-kw="">
<blockquote><p>IX. Wherefore this [original] sin is not something positive, that is, a certain subsisting thing created by God, nor is it simply nothing, nor a simple and pure privation, as death is the privation of life, or darkness is the privation of light; but it is that which is at the same time a defect and a destruction of a positive thing, namely of the work and divine order by which all our powers and inclinations ought to have been ruled, and therefore a vicious habit exciting and begetting internal and external motions, which, straying from the law of God, are displeasing to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), p. 4 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

<blockquote><p>First, the offering of occasions which can be procured only by the peculiar providence of God by the concourse of circumstances and the proposition of objects, fitted to move faculties constituted in this or that way (in which manner God does not infuse wickedness into the minds of men, but draws out into action the wickedness latent there).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.7.15</span></figcaption>

</figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 5.4</span></figcaption>

</figure><figure class="quote" id="q-6650e8cc1e" data-kw="">
<blockquote><p>Thesis XXI… yet properly the substance itself, or the nature, or the action of a rational creature is not sin, but is infected by sin. Sin, however, is the lawlessness (ἀνομία) itself, that is, the defect and privation of due righteousness in the action itself, or in the rational substance, according to the law of God. Therefore, the apostle rightly did not say that sin is an unjust thing, or an evil action, but ἀνομία, that is, that by which a nature or action is, and is called unjust. So that the nature and the action, which are good in themselves and of which God is the author, must be entirely distinguished from the iniquity, by which they are unjust, and of which God cannot be the author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 9 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-19caa75f31" data-kw="Author of sin">
<blockquote><p>Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

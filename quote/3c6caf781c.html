<main class="wrap"><figure class="quote" id="q-3c6caf781c" data-kw="">
<blockquote><p>Secondly, I think it is most certain that the soul is present immediately from the first conception, as soon as the seed of the father and mother is conjoined and retained in the uterus of the mother, and the body begins to be formed–and whoever asserts the contrary, whether he is a patron of traducianism or of the infusion of the soul, errs from the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | [Daniel?] Sennert [a Lutheran] in his Physical Hypomnemata, 4, chapter 3, section 3 says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

rrs%20from%20the%20truth&amp;text=Secondly%2C%20I%20think%20it%20is%20most%20certain%20that&amp;text=infusion%20of%20the%20soul%2C%20errs%20from%20the%20truth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2e7b1723a" data-kw="">
<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics, Person of Christ</cite>, section 12, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-bcb367c1ba" data-kw="">
<blockquote><p>Verse 16. ‘Thine eyes did see my substance yet being unperfect,’ etc.] That is, so soon as ever I was conceived, whilst I was yet an imperfect embryo: and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them; that is, all those members of my body, which in continuance of time grew to have their perfect shape, were as clearly seen by thee, even when as yet there was none of them that had their shape and proportion, as those things are seen by men…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Verse 16. ‘Thine eyes did see my substance yet being unperfect,’ etc.] That is, so soon as ever I was conceived, whilst I was yet an imperfect embryo: and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them; that is, all those members of my body, which in continuance of time grew to have their perfect shape, were as clearly seen by thee, even when as yet there was none of them that had their shape and proportion, as those things are seen by men…”

</figure><figure class="quote" id="q-c459073e43" data-kw="">
<blockquote><p>If by birth control is meant that married couples should use their common sense in spacing births–that with pure and unselfish motives they should strive not to beget children when their physical, financial and other circumstances do not warrant it–we whole heartedly agree that it is permissible. Indeed it is an offence against God, against their offspring and against themselves, if a couple continue to bring forth children when their circumstances do not justify it. When, however, birth control is practiced for selfish reasons and with false motives, it is to be strongly opposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/norval-geldenhuys.html">Norval Geldenhuys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 5, ‘Birth Control’ in The Intimate Life, or the Christian’s Sex-Life… (Eerdmans, 1957), pp. 48-88, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-7b3ddb0eda" data-kw="">
<blockquote><p>We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…”

— Pierre Du Moulin, An Untying of Grave Questions (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+therefore%2C+maintain+that+the+rational+soul+is+infused+by+God+into+the+embryo%2C+not+indeed+%CE%B8%CF%8D%CF%81%CE%B1%CE%B8%CE%B5%CE%BD+%E1%BC%90%CF%80%CE%B5%CE%B9%CF%83%CE%B9%CE%AD%CE%BD%CE%B1%CE%B9+%28entering+from+without%29%2C+as+Aristotle+wishes+in+book+2+of+On+the+Generation+of+Animals%2C+chapter+3%2C+but+is+formed+by+God+in+the+fetus+itself+and+the+rudiment+of+the+human+body.+Scripture+teaches+this.+For+in+Isa.+57%3A16+God+speaks+thus%3A+%E2%80%9CThe+spirit+from+my+face+shall+clothe+man%2C+and+I+make+the+souls.%E2%80%9D+And+in+Zech.+12%3A1%3A+%E2%80%9CThus+says+the+Lord%2C+who+stretches+out+the+heavens%2C+and+lays+the+foundation+of+the+earth%2C+and+forms+the+spirit+within+him.%E2%80%9D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+An+Untying+of+Grave+Questions+%28Leiden%3A+Elzevirana%2C+1632%29%2C+Treatise+5%2C+on+Original+Sin%2C+ch.+1%2C+%E2%80%98Whether+there+is+original+sin%2C+in+whom+it+exists%2C+and+whether+it+is+removed+by+Baptism.+Only+Christ+is+excepted+from+this+stain.+Not+even+the+Virgin+Mary+was+immune+from+it%E2%80%99+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b3ddb0eda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b3ddb0eda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=We%2C%20therefore%2C%20maintain%20that%20the%20rational,and%20forms%20the%20spirit%20within%20him&amp;text=We%2C%20therefore%2C%20maintain%20that%20the%20rational%20soul%20is&amp;text=the%20earth%2C%20and%20forms%20the%20spirit%20within%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

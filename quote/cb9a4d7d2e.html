<blockquote><p>Q90 Let us leave this matter, the delight of those on whom God will execute his just judgements. Now, come, tell me what is this corruption?

A90 Neither will nor intelligence is removed, as I have already said, because it would be necessary for the soul to then perish, or for the soul to cease existing, if these things were removed. But both of these faculties are so injured, that whereas the eye of understanding ought to have been very clear (even as it was before the Fall), especially in divine things and those things which pertain to a right conscience; partly it sees nothing at all, not even with the light of the Creator Himself set before it, as it is seen in the chief points of the true religion, which man’s reason not only loathes, but also fights as absurd and false for all men; partly, if it should see, it sees very dimly to the extent that those small traces of light (some measure of which is innate in every soul; some who have been intent on considering sublime things have perceived more things), having been left in man to the end so that man is without excuse, they will leave a man in the vestibule of truth, not to mention that, with the torch going before, he might come all the way to the very sanctuary of the truth.

And further, in regard to equity that can be observed between men, although the sharpness of the human mind is somewhat less dull in this, God so moderates His just judgement, so that the society of the human race from which he collects His church, might more easily be preserved. Otherwise, soon that society would have been annihilated, in accordance as the fall of man merits, if all discrimination of right and wrong, virtue and vice had been removed from the minds of men. The repugnancies, not only in the opinions of the vulgar, where there are as many opinions as there are heads, but also in the judgements of the most wise philosophers and lawyers, in which making them agree many recently have wearied themselves in vain, prove that still the blindness of men is very great, both in discussing general things, but especially in discussing hypothetical things.

Now I descend to the other faculty of the mind, which is the seat of the affections. Although it ought to be ruled by reason as by one that handles reins, how often does it snatch him away headlong? It is no marvel, then, when it sometimes snatches away even the soul itself. I omit the unruliness of all the natural affections, which evil reason, fighting against it, sees and condemns, but only the law of God utterly detects it. But to that darkness whereby the faculty of reason and will is overcast, still another worse evil is added, that reason feeds upon untruth, and wrestles willfully against the wisdom of God, even when convicted; and that the will is carried willfully to vice even against the reprehensions of reason, and is not able to flee or strive after anything rightly, since it has been completely enslaved to sin.

Q91 Are we but logs then?

A91 Not at all. For when I say that the reason and will of man are blind and perverse, I do not strip man of the faculty of reasoning or willing.

Q92 Therefore, you take away free will.

A92 If by free you mean spontaneous, I am far from doing that; to the contrary, I would say that the whole soul is carried to evil willingly and spontaneously. But if by free you mean that it has any ableness of itself to either, that is, to even be inclined to good, I deny this completely, relying on the nearly infinite testimonies of all of Scripture, and taught by perpetual experience. For you are not able to bring forth anyone among the number of men (except among the saints) who truly knows good, much less one who desires it.</p></blockquote>

<blockquote><p>Fifthly, God hath Sovereign Authority over all Kingdoms, Now is the Axe laid unto the Root of the Tree, this axe was the Roman State, this Tree was the Jewish State. God hath the Authority of all in his hand, he sets one Kingdom against another. Babylon must ruin Sion: Titus and Vespatian, are stirred up by God to cut down and destroy the Jewish Nation: God hath Sovereignty over all Kingdoms, Psal. 103. 19. and can imply them to execute his judgements. Senacherib was his axe, Esa 10. 15. to cut down Nations. God makes one Kingdom an Axe to hew down another, he makes one part of a State to hew down another part of the same.

The Jewish Common-wealth was now under the Roman Empire; it’s so in England at this day, hath not God mingled a perverse Spirit amongst us, Esa. 9. 21. Ephraim against Manasseh, Manasseh against Ephraim, and both against Judah; They sought each others’ destruction as we do at this day; a perverse Spirit was mingled among them and among us. Kingdoms depend upon God, Dan. 4. 32. 2 Chap. 21. and where there is the greatest dependency, there is the greatest Sovereignty. Now Kingdoms depend upon God, quoad omnia, for their beings, upholdings and blessings, and therefore he hath, jus utendi, he may do with his own what he list, he can and may dash one Family, one Towne, one Country, and one Kingdom against another, and that without control. Who shall say to him, what doest thou?

What should this beget in us, but to fear this God that hath Sovereign authority over all flesh, over all Kingdoms; let us fear this God, Jer. 10. 7. Who would not fear thee O King of Nations? for to thee doth it appertain: Shall God be the King of Nations, the King of all Kings and not be feared? to the doth it appertain, not to men to be feared but to thee doth it appertain: The great God must be feared. Ye that are petty Kings on the Earth, you that are Gods on the Earth, you must know that this God hath Sovereign Authority over Nations, Persons, lives, consciences, he is the everlasting King or King of eternity, Jer. 10. 10. He can, will, and must, dispose of you err long eternally in heaven or hell, Job 36. 8, 9, 10.

When Families and Kingdoms are in fetters under the afflicting hand of God, then He shews them the excessiveness of their sins, and commands them to return from iniquity. Did not God command them before? yes, but then they slighted God, being at ease and in prosperity, His commands were not regarded, but when God cast into straights, fetters and afflicts Families or Kingdoms, their ears are opened, they harken to Discipline? What they formerly contemned, is now precious, and they see Authority and Majesty in the command of God, Mic. 6. 9.

The King of Nations is wroth with this Kingdom, He hath it in fetters, let us hearken to His commands, and tremble at his Sovereignty. Psal. 99. 1. The Lord Reigneth let the Earth tremble; let all the Potentates and Inhabitants of it tremble and quake before him: It’s for our advantage to do it. Hab. 3. 16. when the Chaldeans were to come up and besiege Jerusalem, the Prophet apprehending it beforehand, quivered and quaked, and why was it? that he might rest in the day of trouble: that soul which trembleth when judgement is in the Cloud, when the Axe is at the root of the tree, shall have rest in the day of trouble: Isa. 66 2. To him will I look that is of a contrite Spirit, and trembleth at my word: God will look to him, that the flood shall not drown him, nor the Axe cut him down. Lot is saved when the fire consumed Sodom; God was to him a Sanctuary, he feared God and God was his defence, Esa. 8. 13, 14. When we have frames of Spirit suitable to the Authority and Majesty of the great God, that is Lord of Kingdoms, that raises and ruins them at his pleasure, then we sanctify God in our hearts, and he will be a Sanctuary unto us, and such a Sanctuary is needful for these times.</p></blockquote>

<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>

r" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-278e3fa2b6" data-kw="">
<blockquote><p>In context, Samuel Rutherford is discussing the question as to whether or not the reprobates have lost all right to the use of God’s creation as a result of Adam’s fall. In the midst of this, he raises a question concerning thieves being required to make restitution for goods that they have stolen, and he answers in the affirmative. Although I am not sure if this is enough to indicate a change in position from that which he took in his earlier work, A Free Disputation (where he argued that restitution for theft was not among the Mosaic laws of common equity), the reference to the case laws in Exodus 22 implies that the marrow of the laws concerning restitution are still binding:

[A] thief is obliged to restore stolen goods […] They who enjoy that which they may and ought by their own private power, restore, such as ill conquered goods. They sin in using that, true, Proverbs 3:27; Exodus 22:26, 27; Luke 19:8. It’s a sin to withhold the raiment though laid in pawned, which should cover the poor man’s skin in the night, and they have no right to enjoy that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 98-9.</span></figcaption>

<blockquote><p>LEV. 18:5. Ye shall therefore keep my statutes. Although Moses introduces this passage, where he exhorts the Israelites to cultivate chastity in respect to marriage, and not to fall into the incestuous pollutions of the Gentiles, yet, as it is a remarkable one, and contains general instruction, from whence Paul derives his definition of the righteousness of the Law, (Rom. 10:5,) it seems to me to come in very appropriately here, inasmuch as it sanctions and confirms the Law by the promise of reward. The hope of eternal life is, therefore, given to all who keep the Law; for those who expound the passage as referring to this earthly and transitory life are mistaken.1 The cause of this error was, because they feared that thus the righteousness of faith might be subverted, and salvation grounded on the merit of works. But Scripture does not therefore deny that men are justified by works, because the Law itself is imperfect, or does not give instructions for perfect righteousness; but because the promise is made of none effect by our corruption and sin. Paul, therefore, as I have just said, when he teaches that righteousness is to be sought for in the grace of Christ by faith, (Rom. 10:4,) proves his statement by this argument, that none is justified who has not fulfilled what the Law commands. Elsewhere also he reasons by contrast, where he contends that the Law does not accord with faith as regards the cause of justification, because the Law requires works for the attainment of salvation, whilst faith directs us to Christ, that we may be delivered from the curse of the Law. Foolishly, then, do some reject as an absurdity the statement, that if a man fulfils the Law he attains to righteousness; for the defect does not arise from the doctrine of the Law, but from the infirmity of men, as is plain from another testimony given by Paul. (Rom. 8:3.) We must observe, however, that salvation is not to be expected from the Law unless its precepts be in every respect complied with; for life is not promised to one who shall have done this thing, or that thing, but, by the plural word, full obedience is required of us. The pratings of the Popish theologians about partial righteousness are frivolous and silly, since God embraces at once all the commandments; and who is there that can boast of having thoroughly fulfilled them? If, then, none was ever clear of transgression, or ever will be, although God by no means deceives us, yet the promise becomes ineffectual, because we do not perform our part of the agreement.</p></blockquote>

<blockquote><p>9 Q. Could you give a more definitive explanation of what the gospel is? A. The gospel, or the good news that delights the heart of the poor condemned sinner, is a revelation of the fatherly and immutable will of God, in which He promised us, who are unworthy, that all our sins have been washed away and pardoned not just for the rest of our lives but, indeed, forever. He carries out this promise by giving His Son to die for us and by raising Him. Since Christ died not in His own sin but in ours (as if He Himself had committed it) and arose out of this same sin as a mighty victor (1 Cor. 15:17), it follows that there is not a single sin of ours for which He has not paid. If even one of all those sins that Christ took upon Himself had not been paid for, He would have had to remain the tomb and could not have risen. For where there is even one sin, there is also eternal death, as God Himself says in Deuteronomy 27. Also, “The wages of sin is death” (Rom. 6[:23]). Since, therefore, Christ arises out of all our sin as a victor in our flesh (which He assumed and forever retains), this is public testimony to us that we are considered as pure and righteous in the eyes of God as Christ Jesus was when He arose from the grave (Rom. 4; 1 Cor. 15:17). Along with that, God through Christ both promises us in the gospel and then actually gives us the Holy Spirit. The Spirit turns our hearts from sin and from the kingdom of the Devil to Himself, bears witness that we are children of God, initiates in us both joy in God and eternal life here below, and brings it to completion in us up in heaven. All of this God freely offers and gives to us in the gospel, without any regard to our past, present, or future merit or piety. He applies it to us by grace through faith, so that whoever boasts, boasts in the Lord (Jer. 9[:24]; 1 Cor. 1[:31]). It can also be described more briefly: the gospel is a revelation of the fatherly and immutable will of God, in which He promises all believers (1) that their sins have been pardoned from eternity and shall be forever forgotten, and (2) that He will freely give them the Holy Spirit and eternal life, without any past, present, or future merit of ours, because of the voluntary sacrifice of this most exalted person, Christ—truly God and truly human. This sacrifice was there before the face of God from eternity, then was promised, and now has been carried out and completed, retaining forever its efficacy for our full redemption (Eph. 1).</p></blockquote>

<blockquote><p>Now take both Laws, the Ceremonial Law and the Moral Law or the Decalog. Imagine that by the merit of congruity you have made so much progress that the Spirit has been granted to you and that you have love. Of course, all this would be a monstrosity and cannot be found anywhere in the nature of things. But imagine, I say, that, by doing what lies within you, you acquire grace, are righteous, and have the Spirit. On what basis? On the basis of the merit of congruity? Then you do not need Christ, but He has become useless to you and died to no purpose.</p></blockquote>

<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith.</p></blockquote>

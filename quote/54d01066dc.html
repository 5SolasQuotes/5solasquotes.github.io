<main class="wrap"><figure class="quote" id="q-54d01066dc" data-kw="">
<blockquote><p>Nomist.

Tell me what is that Law which this Faith doth not make void?

Evangelist.

You must know that there were three sorts of Laws delivered by God to Moses.

1. Ceremonial; which were temporary Ordinances and Rites really pointing to Christ, of whom they were figures and shadows; and by whose presence and death they were all fulfilled, terminated and abrogated; Christ was finis inter ficiens legis Ceremonialis; so that the law of Ceremonies was made void by the Doctrine of faith, and therefore this law cannot be here meant.

2. Judicial, which were peculiar Ordinances given by God to Moses, for the well-ordering of the Common-wealth of Israel.

This Law concerned the Jews not simply, as men, but as Jews; the National, personal, or particular binding right of this Law rested so in them, that it died with the decay of their Common-wealth: only the common equity or right hereof remaineth (i) as far as it was grounded on the Law of Nature, served directly to confirm any of the Ten Commandments, or to uphold the good of Family, Church, or Common-wealth, it is still in force, and of good use; but of this Law the Apostle in this Scripture makes no mention: Now if he speak not of the Law Ceremonial, nor of the Law Judicial, it followeth that we must understand him speaking of the Law—

3. Moral, and that not as it is a rule of Justification, but a rule of Service and Obedience; the whole compass of man’s duty respectively to be manifested, is principally contained in the Law Moral; which is no other then the revealed Copy of God’s will touching man’s duty, laid down in the ten Commandments: if we do cast our eyes upon the scope of the Apostle, it will be very evident that he speaketh of this Law; for he deals against such who sought to be justified and saved by the works of the Law, and not by faith in Jesus Christ; they went about to set up the Law of Works, and to destroy the Law of Faith.

Now Paul sheweth that no man’s conformity to the Moral Law could be matter of life and justification unto him in God’s sight; The Law, by sin, is become weak and unprofitable to the purpose of righteousness, it could not be a covenant of life unto man; now having excluded it from being a covenant of life to sinners, there were those who would have it to be disannulled from being a rule of life unto men, which the Apostle will not admit of, so that its plain that the vindication is of the Moral Law, that, as a rule of life is not made void unto Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sedgwick.html">John Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antinomianism Anatomized. Or, A Glass for the Lawless: Who deny the Ruling use of the Moral Law unto Christians under the Gospel</cite>, (London: Samuel Gellibrand, 1643), pp 7-8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99be844587" data-kw="">
<blockquote><p>Conquest, seeing it is an act of violence and God’s revenging justice for the sins of a people, cannot give in God’s court such a just title to the throne as the people are to submit their consciences unto, except God reveal his regulating will by some immediate voice from heaven, as he commanded Judah to submit to Nebuchadnezzar as to their king by the mouth of Jeremiah. Now this is not a rule to us; for then, if the Spanish king should invade this land, and, as Nebuchadnezzar did, deface the temple and instruments and means of God’s worship, and abolish the true worship of God, it should be unlawful to resist him, after he had once conquered the land: neither God’s Word, nor the law of nature could permit this. I suppose, even by grant of adversaries, now no act of violence done to a people, though in God’s court they have deserved it, can be a testimony to us of God’s regulating will; except it have some warrant from the law and testimony [Scripture], it is no rule to our conscience to acknowledge him a lawful magistrate whose sole law to the throne is an act of the bloody instrument of divine wrath, I mean the sword. That, therefore, Judah was to submit, according to God’s Word, to Nebuchadnezzar, whose conscience and best warranted calling to the kingdom of Judah was his bloody sword, even if we suppose Jeremiah had not commanded them to submit to the king of Babylon, I think cannot be said.</p></blockquote>

</figure><figure class="quote" id="q-c0a787b362" data-kw="">
<blockquote><p>If it be further demanded, whether in case that death follows, it be to be understood of any child, how little time soever the mother has gone with it? I answer with Simlerus that we must distinguish between a child formed and unformed, if the child were an embryo, not yet perfected, although it perished, the party, by whose stroke, was not to be put to death, but for such only as was come to perfection, so likewise Augustine and Jerome in Decretis, Causa 32, Question 2, Ch. Mosis, and the words of the text, ‘life for life’, seem to make for it, that a man’s life must not be paid but for one living and perfected, and the Septuagint make this plain by rendering, ‘not death’, [Hebrew], ‘not formed’.</p></blockquote>

<blockquote><p>The human nature of Christ being thus formed in the womb by a creating act of the Holy Spirit, was in the instant of its conception sanctified, and filled with grace according to the measure of its receptivity… And this work of sanctification, or the original infusion of all grace into the human nature of Christ, was the immediate work of the Holy Spirit; which was necessary unto Him: for let the natural faculties of the soul, the mind, will, and affections, be created pure, innocent, undefiled,— as they cannot be otherwise immediately created of God,— yet there is not enough to enable any rational creature to live to God; much less was it all that was in Jesus Christ.</p></blockquote>

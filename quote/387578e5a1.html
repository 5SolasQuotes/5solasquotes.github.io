</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-873da605b8" data-kw="">
<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments: 1. Christ only administered the Supper in the assembly of the disciples. 2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33). 3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections: 1. Christ performed it in private houses. Reply: But the Church gathered there. 2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments: 1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either. 2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread. 3. There is no example or institution of it in the Word of God. Objections: 1. It is the body of Christ. Reply: No. The body of Christ is not bread. 2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 17, ‘The Sacraments’</cite>, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments: 1. Christ only administered the Supper in the assembly of the disciples. 2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33). 3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections: 1. Christ performed it in private houses. Reply: But the Church gathered there. 2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments: 1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either. 2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread. 3. There is no example or institution of it in the Word of God. Objections: 1. It is the body of Christ. Reply: No. The body of Christ is not bread. 2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.”

— Leonard Rijssen, A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 17, ‘The Sacraments’, p. 238">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CControversy+11+%E2%80%93+Should+the+holy+Supper+for+convenience+be+celebrated+by+the+sick+in+private+dwellings%3F+We+deny+against+the+Lutherans.+Arguments%3A+1.+Christ+only+administered+the+Supper+in+the+assembly+of+the+disciples.+2.+Paul+wanted+us+to+gather+together+and+to+wait+on+one+another+%281+Cor.+11%3A33%29.+3.+The+Supper+seals+communion+of+many+with+Christ%2C+because+all+are+partakers+of+the+one+bread.+Objections%3A+1.+Christ+performed+it+in+private+houses.+Reply%3A+But+the+Church+gathered+there.+2.+The+sick+need+the+confirmation+of+their+faith.+Reply%3A+From+the+Word+of+God%2C+and+they+can+have+that+confirmation+from+a+Supper+they+have+taken+previously.+Controversy+12+%E2%80%93+Should+the+leftover+bread+and+wine+from+the+holy+Supper+be+kept+in+vases+or+containers+to+be+solemnly+carried+around+to+the+sick+and+for+other+similar+uses%3F+We+deny+against+the+Papists.+Arguments%3A+1.+The+water+of+baptism+cannot+be+carried+around+this+way%2C+for+many+were+baptized+in+a+river+%28Acts+8%3A38%29%3B+therefore%2C+the+bread+of+the+Supper+should+not+be+either.+2.+It+is+only+a+sacrament+when+it+is+used%2C+and+it+has+no+greater+sanctity+outside+of+that+use+than+any+other+bread.+3.+There+is+no+example+or+institution+of+it+in+the+Word+of+God.+Objections%3A+1.+It+is+the+body+of+Christ.+Reply%3A+No.+The+body+of+Christ+is+not+bread.+2.+It+is+the+cup+of+the+New+Testament.+Reply%3A+Insofar+as+it+is+a+sign+and+seal+of+it.%E2%80%9D%0A%0A%E2%80%94+Leonard+Rijssen%2C+A+Complete+Summary+of+Elenctic+Theology+%26+of+as+Much+Didactic+Theology+as+is+Necessary+trans.+J.+Wesley+White+MTh+thesis+%28Bern%2C+1676%3B+GPTS%2C+2009%29%2C+ch.+17%2C+%E2%80%98The+Sacraments%E2%80%99%2C+p.+238&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F873da605b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/873da605b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Controversy%2011%20%E2%80%93%20Should%20the%20holy,a%20sign%20and%20seal%20of%20it&amp;text=Controversy%2011%20%E2%80%93%20Should%20the%20holy%20Supper%20for&amp;text=it%20is%20a%20sign%20and%20seal%20of%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ae377637cb" data-kw="">
<blockquote><p>Neither can ye also of this matter, or of any my words gather that any part that remains after the receiving of the sacrament should be worshipped. For whatsoever strength the outward signs in the sacraments have, they have it of the Holy Ghost, of the Lord’s words, and of his institution and ordinance. Which things do no longer remain than while the use and receiving of the sacrament does continue. And the promise of God is applied to this sacrament whiles we eat and drink the sacrament. Wherefore that opinion and doctrine of reserving the sacrament was not catholic, nor universally used or received in the Christian congregations… We do not deny but that the leavings of the sacrament were sometimes reserved and kept: but it was done without any worshipping of it, and without any superstitious points of reverence. The leavings of this sacrament were delivered to children and to women to be carried to sick folk, as it is plain in the history of Eusebius and in Jerome, one of the doctors of the Church. And I would somewhat stagger to say the receiving of such leavings being done privately out of the holy company, and without the order and manner of receiving the communion instituted of Christ, was a right, a full and a perfect receiving of the communion or of the sacrament, which receiving of the sacrament among the sick folks I could yet nevertheless grant unto, so that the same do repeat the holy words of Christ and so ye some honest Christians do there among themselves put in use the ordinance of Christ in this behalf. For except more persons than one alone do receive the communion together: the due order and course of receiving this sacrament is not observed and kept. Christ’s words were to more than one, in this sort: Accipe, edite et bibite: that is to say, ‘Take ye, eat ye, and drink ye.’ There is bread broken into sundry pieces, which thing means that it should be dealed about and distributed to more than one. And they speak many things in their canon of the old mass, which unless a number do receive it together, are stark false and very lies. And besides this, it is called of learned men, coena, a supper, communio, a communion, and synaxis, a gathering or coming together: which names do nothing agree with a private action or doing of one person alone by himself. Neither do we in any place read in old writers of any private masses where one alone might receive the sacrament without the company of others. Honorius, bishop of Rome, was the first that made a decree that the sacrament of eucharistia should be reserved and kept and decreed further, that honor and reverence should be done to it, when it was carried abroad any whither. That if this thing had been done of others before his days, it had not belonged unto him to make a decree of any such thing. And to speak in a brief sum, we affirm and hold (as we have before said) that this sacrament has not his full strength and virtue and efficacy but whiles it is in doing and in executing, and whiles it is in receiving: which thing you see also to be done in all the other sacraments [such as the brazen serpent].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse or Treatise… concerning the Sacrament of the Lord’s Supper (London, 1550)</cite>, p. lxxi</span></figcaption>

<blockquote><p>This Covenant was first published and made known by lively voice: afterwards it was committed to writing, the tables thereof being the holy Scripture. It was made both by word and oath (Ps. 85:4, 35; Dt. 29:12, 14; Isa. 54:9; Heb. 6:17-18; Gen. 22:16; Lk. 1:72), to demonstrate the certainty and constancy thereof: and sealed by the sacraments, which on God’s part do confirm the promise made by Him: and on man’s part are bills obligatory or hand-writings, whereby they testify and bind themselves to the performance of their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, p. 23</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This Covenant was first published and made known by lively voice: afterwards it was committed to writing, the tables thereof being the holy Scripture. It was made both by word and oath (Ps. 85:4, 35; Dt. 29:12, 14; Isa. 54:9; Heb. 6:17-18; Gen. 22:16; Lk. 1:72), to demonstrate the certainty and constancy thereof: and sealed by the sacraments, which on God’s part do confirm the promise made by Him: and on man’s part are bills obligatory or hand-writings, whereby they testify and bind themselves to the performance of their duty.”

<blockquote><p>XI. Whether any other but a minister. lawfully called and ordained, may administer the sacraments, baptism and the Lord’s Supper? ([Margin Note:] Thus the Augsburg Confession says, ‘De ordine ecclesiastico docent ecclesiae nostrae, quod nemo in ecclesia debeat publice docere, aut sacramenta administrare, nisi rite vocatus, quae confessionis verba opposita sunt calumniis pontificiorum, qui dic•t omnia in ecclesiis nostris confuse et sine ordine geri et cuivis in ecclesia docendi potestatem apud nos concedi.’ [Johann] Gerhard, Common Places, ‘On the Ecclesiastical Minister’, ch. 3, sect. 1, ‘Res inter se perpetuo nexu conjunctae, pascere ecclesiam salutis doctrina, et sacramenta administraro.’ Calvin, Catechism of the Christian Religion. See Master [Richard] Baxter’s, Infant Church-Membership, part 2, errour 2 &amp; 3) It is held by the reformed Churches, and by the soundest protestant writers, that neither of these sacraments may be dispensed by any, but by a minister of the Word, lawfully ordained. 1. God has appointed the ministers of the Word, lawfully called and ordained, and no other to be stewards and dispensers of the mysteries of Christ, 1 Cor. 4:1; Tit. 1:5,7. 2. He has appointed them to be pastors or shepherds, to feed the flock of God, Jer. 3:15; Eph. 4:11; Acts 20:28; 1 Pet. 5:2; much of this feeding consists in the dispensation of the sacraments. 3. Christ gives a commission to the apostles to teach and baptize, and extends the same commission to all teaching ministers to the end of the world, Mt. 28:19,20; Eph. 4:11-13. Neither of the sacraments have efficacy, unless they be administred by him that is lawfully called thereunto, or a person made public and clothed with authority by ordination. This error in the matter of baptism is begot by another error of the absolute necessity of baptism. Mr. [Alexander] Henderson’s second paper to the king. The Scripture joins together the preaching of the Word and dispensations of the seals, both belonging to the officers who have received commission from Jesus Christ, Mt. 28:19; 1 Cor. 1. Mr. [John] Ball. Heb. 5:4, ‘No man takes this honour but he which is called, as was Aaron;’ which sentence does manifestly shut out all private persons from administration of baptism, seeing it is a singular honor in the Church of God. [Thomas] Cartwright, 2nd Reply [to John Whitgift], 11th Tractate. The example of Zipporah either was rash or singular, and also no way like women’s baptizing; circumcision was then commanded [to] the head of the family, baptism belongs only to ministers, Mt. 28; she circumcised her son when he was not in danger of death, as these [do that] baptize.</p></blockquote>

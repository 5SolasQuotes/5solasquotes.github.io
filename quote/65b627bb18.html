<main class="wrap"><figure class="quote" id="q-65b627bb18" data-kw="">
<blockquote><p>The seventh [day of creation] is the institution of the Sabbath on the seventh day of the world, on which day Christ was promised: and by the promise of Christ which was the greatest blessing given and revealed to the fathers in the old testament, that day came to be the most blessed day of the week, and was sanctified by God to be the weekly Sabbath, until by the full exhibition of Christ a perfect redeemer in his resurrection on the first day of the week, that first day became a more blessed day, and by Christ the Lord of the Sabbath, was sanctified, and had the honour of the weekly Sabbath transferred unto it, and is to be observed of Christians for their holy day of rest, until they come to the eternal rest in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference</cite>, (London: John Bartlet, 1641), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99c07b0501" data-kw="">
<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship in Guides to the Reformed Tradition</cite>, (John Knox Press, 1984), p. 153</span></figcaption>

</figure><figure class="quote" id="q-309a2c6419" data-kw="">
<blockquote><p>He that leaves sin, but does not endeavour to subdue it, will be content it should be confined, but not crucified; restrained, but not put to death; will have the fury and rage of it curbed, that it do not break out so openly, but will not starve it; kept under, not rooted out. He that will not avoid the occasions of sin, those that nourish it, have drawn him on to act sin formerly. He that truly repents of drunkenness will avoid that company which has tempted him to it. He that repents of uncleanness, will, as Job, make a covenant with his eyes. He that repents of profaneness in words, will set a watch before his mouth.

He that repents of Sabbath breaking, will so dispose of his affairs before, as he may have no occasion to profane it, to absent himself from the public worship. He that repents of wanderings in prayer, will be watchful against distractions, drive them away. He that turns not from occasions turns not from sin, and so is no true penitent. He that is not diligent in the use of mortifying duties to weaken sin, will not apply that word to his conscience which wounds his sin; casts off searching words, words of reproof and terror, as too sharp, painful corroding plasters for his sore; rather be exasperated against him that speaks them, as one that rails, is too strict.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Repentance in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

</figure><figure class="quote" id="q-8b4ec1842b" data-kw="">
<blockquote><p>The Anatomie of Abuses probably carried additional weight with a certain class, because in its attitude toward the drama it took in the first edition a liberal position. The preface of that edition was careful to explain that its author did not condemn all plays. ‘Who seeth not,’ it read, ‘that some kind of playes, tragedies and enterluds, in their own nature are not onely of great ancientie, but also very honest and very commendable exercyses,’ containing matter ‘both of doctrine, erudition, good example, and wholsome instruction; And may be vsed, in tyme and place conuenient, as conducible to example of life and reformation of maners.’ In thus commending ‘honest &amp; chast playes’ as a Godly recreation of the min,’ and as a ‘good example of life,’ Stubbes advanced close to Lodge’s position. Yet, strange to say, in all subsequent editions this explanatory preface was left out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-stubbes.html">Philip Stubbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Stubbes’ Outlook | Elbert N.S. Thompson, XX. The Controversy Between the Puritans &amp; the Stage in Yale Studies in English PhD diss. (NY: Henry Holt &amp; Co., 1903), pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>The Scribes &amp; Pharisees that came from Jerusalem, picked a quarrel against him, because his disciples did eat with unwashed hands, whereby they transgressed the tradition of the Elders: our saviour Christ in defence of his disciples, chargeth the Scribes &amp; Pharisees which were so zealous to maintain their own ceremonies, then they were careless to break the commandment of God.

And so it cometh to pass always, that they which are most earnest in upholding &amp; defending traditions &amp; ceremonies invented by man, are most forgetful in keeping the commandments of God. But this is the just judgment of God against those that invent a new worship of their own brain: That first they lose their labour, that so seek to please God: &amp; secondly that they are deprived of all right understanding, because they have presumed to be wiser then God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A comfortable sermon of faith, in temptations and afflictions Preached at S. Botolph’s without Aldersgate in London, the .xv. of February. 1573.</cite>, (London: John Awdeley, 1574), unpaginated.</span></figcaption>

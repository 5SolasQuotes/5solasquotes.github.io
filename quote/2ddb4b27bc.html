<main class="wrap"><figure class="quote" id="q-2ddb4b27bc" data-kw="">
<blockquote><p>…it may be said of Christ whilst He was here below that in the same sense or manner wherein He bore our sicknesses, Mt. 8:17 (who yet was never personally tainted with any disease) in the same sense or manner He may be said to have born our sins, namely thus: Christ when He came to an elect child of his that was sick, whom He healed, his manner was, first by a sympathy and pity to afflict Himself with their sickness, as if it had been his own: Thus at his raising of Lazarus it is said that He groaned in spirit, etc. and so by the merit of taking the disease upon Himself, through a fellow-feeling of it, He took it off from them, being for them afflicted, as if He Himself had been sick. And this seems to be the best interpretation that I have met with of that difficult place in Mt. 8:16-17 where it is said: ‘He healed all that were sick, that it might be fulfilled which was spoken by Isaiah the prophet, saying, Himself took our infirmities, [and bare our sicknesses.]’ Now in the like way or manner unto this, of bearing our sicknesses, He might beare our sins too…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Heart of Christ in Heaven to Sinners on Earth</cite>, section 3, p. 136</span></figcaption>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72f383c48f" data-kw="">
<blockquote><p>Natural self is to be denied as well as corrupt self, as appears by the example of Christ, who had no corrupt self to deny, and yet ’tis said, Rom. 15:3, ‘He pleased not Himself.’ Christ had an innocent natural will, by which He loved his natural life and peace; ‘Father let this cup pass.’ But He submitted it to God; ‘Not my will, but thine be done,’ Mt. 26:39. Therefore we also must not only deny self as corrupted by sin, but self as separate from God. How else shall we submit to God in these things wherein He may lay a restraint upon us, or put us to trial about them, whether we love them in order to Him, they being things which otherwise we may affect. And besides, to love any thing apart from God, and to seek it apart from God and rejoice in it apart from God, without any reference and respect to God, is to make the creature the last end, in which the action terminates, which is an invading of God’s prerogative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, ... (London: Robinson, 1684), Sermons on 2 Cor. 5, sermon 29, on 2 Cor. 5:15, p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-1195304235" data-kw="">
<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper</cite>, … (London, 1588), ‘The First Homily… 1574’, pp. 38-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

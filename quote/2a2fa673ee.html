<main class="wrap"><figure class="quote" id="q-2a2fa673ee" data-kw="">
<blockquote><p>In the time of Justin the Deacon some did carry that which was left of the Communion, at what time the Lord’s Supper was celebrated, to them which were absent by reason of their disease, from the public assembly or unto strangers, and outlandish bishops into their inn. And as Eusebius reports (Church History, Ch. 5, bk. 24), the bishop of Rome was wont to do so, but without superstition, and for no other end but for a token of concord and consent in doctrine and in the whole profession: but because we say that we must not so much enquire whether those fragments were sent, or but whether they were well sent. And that custom has degenerated into superstition, whereby at this day the host is carried to them alone which are about to die, and that for certain gain and advantage, as also in a vain persuasion of a certain necessary provision for their journey, that custom of carrying the Supper to the absent, is worthily taken away in our Churches. Cyprian in the administration of this sacrament, ‘We ought to do no other thing than that which Christ did.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucan.html">William Bucan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In what place is it to be administered?’ in Institutions of Christian Religion… (London, 1601), 48th Place, ‘Of the Supper of the Lord’, p. 931</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b02549668" data-kw="">
<blockquote><p>No baptism shall be administred but in Church assemblies or where there is a formed public Church. But where there is no public Church and the parents through infirmity are afraid to carry them unto public baptism in the congregation, ministers shall consult how far in prudence they ought to yield unto them. Yet nevertheless there shall be some face of a Church and both exhortation and prayer; but if there be no Church, and a congregation cannot be assembled, the minister shall not make any difficulty to baptize the infants of believing parents tendered to him, with exhortation and prayer.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics</cite>, ed. Bizer &amp; trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 26, ‘The Lord’s Supper’, pp. 635-36</span></figcaption>

</figure><figure class="quote" id="q-e301663091" data-kw="">
<blockquote><p>Neither Word nor sacraments, nor anything on the part of the Almighty can be intended in vain, though the end of the ordinance be not obtained. I should have expected some such divinity from the pen of Arminians and Socinians who make God to intend the salvation of all and every one in both the promises of the Gospel, precepts and sacraments, and yet He falls from this end: so you may read, in Arminius, Anti-Perkins, p. 60, that God is disappointed in his end, in both Law and Gospel, and God shooting beside his mark misses the salvation of many, say the Remonstrants at the Synod of Dort, p. 216, and in their confession, ch. 7, sect. 3; and because Socinus thought it hard thus to take from God wise intentions, he did no less than blasphemously deprive Him of his omniscience: So Socians, Contra Puccium, ch. 10, and in Theological Lectures, ch. 11, made all things that are contingently to come uncertain to God: But if you speak of intentio operis, non operantis [the end of the work, not of the worker], that the Supper, in its nature, is ordained…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 23, pp. 525-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

<main class="wrap"><figure class="quote" id="q-1b6bb4e4ba" data-kw="">
<blockquote><p>What do you call Persons in the Godhead?

Ans. Such as having one Essence or being equally common, are distinguished (not divided) one from another by some incommunicable property.

How cometh it to pass that there should be this diversity of Persons in the Godhead?

Ans. Though the Essence or being of the Godhead be the same, and most simply as hath been declared; yet the manner of this being is not the same, and hence ariseth the distinction of persons, in that beside the being which is common to all, and the self-same in all, they have every one some especial property which cannot be common to the rest.

Which are these persons, and what are these personal Properties?

Ans. The first Person in order is the Father, who begetteth the Son. The second is, the Son begotten of the Father. The third is, the Holy-Ghost, proceeding from the Father and the Son.

Doth the Godhead of the Father beget the God-head of the Son?

Ans. No, but the Person of the Father begetteth the Person of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Christian Religion Summarily set down according to the Word of God: together with A Brief Epitome of the Body of Divinity</cite>, (London: Geo. Badger, 1645), pp 55-57.</span></figcaption>

<blockquote><p>VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions.

VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.</p></blockquote>

<blockquote><p>But in all the things that God has made… there is nothing which can properly be likened to the nature of God: neither are there any words in the mouths of men that can properly be spoken of it: neither are there any similitudes of man’s inuention that can rightly and squarely agree with the divine essence. And St. Basil, disputing De Ousia &amp; Hypostasi, says: ‘It cannot be that the comparisons of examples should in all points be like to those things, to the use whereof the examples do serve. Thou mayest say that injury is done to the majesty of God if it be compared with mortal things. But for because the holy scripture does not a little condescend and attemper itselfe to our infirmity, I will put a similitude, although in very deed much unlike, which is usually taken and commonly used. Behold the sun and the beams that come from it, and then the heat that proceedes from them both. As the sun is the head-spring of the light and the heat: so is the Father the headspring of the Son, who is light of light. And as of the sun and the beams together the heat does come, so of the Father and the Son together the holy Ghost proceeds. But now, put case, or imagine that the sun were such, as never had beginning, nor ever shall have ending, and should not then I pray you, ye beams of this everlasting sun be everlasting too? and should not the heat, which proceeds of them both, be everlasting as well as they? Finally, should not the Son be one still in essence or substance, and three by reason of the three subsistences or persons? This parable of the sun did Tertullian use (contra Praxeam.), whose words, which do also contain other similitudes, I will not be grieved to recite unto you. ‘I wil not doubt’ (says he) ‘to call both the stalk of a root, the brook of a springhead, and a beam of the sun, by the name of a son: for every original is a parent and every thing that issues of that original is a son: much more then the Word of God may be called a Son, which even properly has the name of Son, and yet neither is the stalk separated from the root, nor the brook from the springhead, nor the beam from the sun, no more is the Word separated from God. Therefore according to the fashion of these examples I profess that I say there are two, God &amp; his Word, the Father and his Son. For the root and the stalk are two things, but joined in one. And the springhead and the brook are two kinds, but undivided. And the sun and the beams are two forms, but both cleaving the one to the other. Everything that comes of anything must needs be second to that out of which it comes, and yet it is not separated from that from which it proceeds. But where a second is, there are two, and where a third is there are three. For the third is the spirit of God and the Son: even as the third from the root is the fruit of the stalk, the third from the springhead is the river of the brook, and the third from the sun is the heat of the beam: yet none of these is alienated from the matrix [womb] of which they take the properties that they have. So the Trinity descending by annexed and linked degrees from the Father, does not make against the monarchy, and does defend the economical state, that is, the mystery of the dispensation. Understand everywhere that I profess this rule wherein I testify, that the Father, the Son and the Holy Ghost are unseparated one from another, and so thou shalt know how everything is spoken.’ And so forth. For all these are the words of Tertullian, who flourished in Africa not long after the age of the apostles.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But in all the things that God has made… there is nothing which can properly be likened to the nature of God: neither are there any words in the mouths of men that can properly be spoken of it: neither are there any similitudes of man’s inuention that can rightly and squarely agree with the divine essence. And St. Basil, disputing De Ousia &amp; Hypostasi, says: ‘It cannot be that the comparisons of examples should in all points be like to those things, to the use whereof the examples do serve. Thou mayest say that injury is done to the majesty of God if it be compared with mortal things. But for because the holy scripture does not a little condescend and attemper itselfe to our infirmity, I will put a similitude, although in very deed much unlike, which is usually taken and commonly used. Behold the sun and the beams that come from it, and then the heat that proceedes from them both. As the sun is the head-spring of the light and the heat: so is the Father the headspring of the Son, who is light of light. And as of the sun and the beams together the heat does come, so of the Father and the Son together the holy Ghost proceeds. But now, put case, or imagine that the sun were such, as never had beginning, nor ever shall have ending, and should not then I pray you, ye beams of this everlasting sun be everlasting too? and should not the heat, which proceeds of them both, be everlasting as well as they? Finally, should not the Son be one still in essence or substance, and three by reason of the three subsistences or persons? This parable of the sun did Tertullian use (contra Praxeam.), whose words, which do also contain other similitudes, I will not be grieved to recite unto you. ‘I wil not doubt’ (says he) ‘to call both the stalk of a root, the brook of a springhead, and a beam of the sun, by the name of a son: for every original is a parent and every thing that issues of that original is a son: much more then the W — Heinrich Bullinger, Fifty Godly &amp; Learned Sermons divided into Five Decades, … (London, 1577), 4th Decade, 3rd Sermon, ‘Of God, of the True Knowledge of God…’, pp. 630-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+in+all+the+things+that+God+has+made%E2%80%A6+there+is+nothing+which+can+properly+be+likened+to+the+nature+of+God%3A+neither+are+there+any+words+in+the+mouths+of+men+that+can+properly+be+spoken+of+it%3A+neither+are+there+any+similitudes+of+man%E2%80%99s+inuention+that+can+rightly+and+squarely+agree+with+the+divine+essence.+And+St.+Basil%2C+disputing+De+Ousia+%26+Hypostasi%2C+says%3A+%E2%80%98It+cannot+be+that+the+comparisons+of+examples+should+in+all+points+be+like+to+those+things%2C+to+the+use+whereof+the+examples+do+serve.+Thou+mayest+say+that+injury+is+done+to+the+majesty+of+God+if+it+be+compared+with+mortal+things.+But+for+because+the+holy+scripture+does+not+a+little+condescend+and+attemper+itselfe+to+our+infirmity%2C+I+will+put+a+similitude%2C+although+in+very+deed+much+unlike%2C+which+is+usually+taken+and+commonly+used.+Behold+the+sun+and+the+beams+that+come+from+it%2C+and+then+the+heat+that+proceedes+from+them+both.+As+the+sun+is+the+head-spring+of+the+light+and+the+heat%3A+so+is+the+Father+the+headspring+of+the+Son%2C+who+is+light+of+light.+And+as+of+the+sun+and+the+beams+together+the+heat+does+come%2C+so+of+the+Father+and+the+Son+together+the+holy+Ghost+proceeds.+But+now%2C+put+case%2C+or+imagine+that+the+sun+were+such%2C+as+never+had+beginning%2C+nor+ever+shall+have+ending%2C+and+should+not+then+I+pray+you%2C+ye+beams+of+this+everlasting+sun+be+everlasting+too%3F+and+should+not+the+heat%2C+which+proceeds+of+them+both%2C+be+everlasting+as+well+as+they%3F+Finally%2C+should+not+the+Son+be+one+still+in+essence+or+substance%2C+and+three+by+reason+of+the+three+subsistences+or+persons%3F+This+parable+of+the+sun+did+Tertullian+use+%28contra+Praxeam.%29%2C+whose+words%2C+which+do+also+contain+other+similitudes%2C+I+will+not+be+grieved+to+recite+unto+you.+%E2%80%98I+wil+not+doubt%E2%80%99+%28says+he%29+%E2%80%98to+call+both+the+stalk+of+a+root%2C+the+brook+of+a+springhead%2C+and+a+beam+of+the+sun%2C+by+the+name+of+a+son%3A+for+every+original+is+a+parent+and+every+thing+that+issues+of+that+original+is+a+son%3A+much+more+then+the+Word+of+God+may+be+called+a+Son%2C+which+even+properly+has+the+name+of+Son%2C+and+yet+neither+is+the+stalk+separated+from+the+root%2C+nor+the+brook+from+the+springhead%2C+nor+the+beam+from+the+sun%2C+no+more+is+the+Word+separated+from+God.+Therefore+according+to+the+fashion+of+these+examples+I+profess+that+I+say+there+are+two%2C+God+%26+his+Word%2C+the+Father+and+his+Son.+For+the+root+and+the+stalk+are+two+things%2C+but+joined+in+one.+And+the+springhead+and+the+brook+are+two+kinds%2C+but+undivided.+And+the+sun+and+the+beams+are+two+forms%2C+but+both+cleaving+the+one+to+the+other.+Everything+that+comes+of+anything+must+needs+be+second+to+that+out+of+which+it+comes%2C+and+yet+it+is+not+separated+from+that+from+which+it+proceeds.+But+where+a+second+is%2C+there+are+two%2C+and+where+a+third+is+there+are+three.+For+the+third+is+the+spirit+of+God+and+the+Son%3A+even+as+the+third+from+the+root+is+the+fruit+of+the+stalk%2C+the+third+from+the+springhead+is+the+river+of+the+brook%2C+and+the+third+from+the+sun+is+the+heat+of+the+beam%3A+yet+none+of+these+is+alienated+from+the+matrix+%5Bwomb%5D+of+which+they+take+the+properties+that+they+have.+So+the+Trinity+descending+by+annexed+and+linked+degrees+from+the+Father%2C+does+not+make+against+the+monarchy%2C+and+does+defend+the+economical+state%2C+that+is%2C+the+mystery+of+the+dispensation.+Understand+everywhere+that+I+profess+this+rule+wherein+I+testify%2C+that+the+Father%2C+the+Son+and+the+Holy+Ghost+are+unseparated+one+from+another%2C+and+so+thou+shalt+know+how+everything+is+spoken.%E2%80%99+And+so+forth.+For+all+these+are+the+words+of+Tertullian%2C+who+flourished+in+Africa+not+long+after+the+age+of+the+apostles.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+Godly+%26+Learned+Sermons+divided+into+Five+Decades%2C+%E2%80%A6+%28London%2C+1577%29%2C+4th+Decade%2C+3rd+Sermon%2C+%E2%80%98Of+God%2C+of+the+True+Knowledge+of+God%E2%80%A6%E2%80%99%2C+pp.+630-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6be95af5f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6be95af5f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=But%20in%20all%20the%20things%20that,after%20the%20age%20of%20the%20apostles&amp;text=But%20in%20all%20the%20things%20that%20God%20has&amp;text=not%20long%20after%20the%20age%20of%20the%20apostles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f824daeec8" data-kw="">
<blockquote><p>The will of God as to the peculiar actings on the Father in this matter [the eternal Trinitarian covenant] is the will of the Father, and the will of God with regard unto the peculiar acts of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son. And in this respect the covenant whereof we treat differs from a pure decree; for from these distinct actions of the will of God in the Father and the Son there does arise a new habitude or relation which is not natural or necessary unto them, but freely taken on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite></span></figcaption>

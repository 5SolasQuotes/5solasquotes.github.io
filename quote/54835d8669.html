<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ignatius-of-antioch.html">Ignatius of Antioch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle of Ignatius to the Philadelphians</cite>, ch. 8 in ANF 1.84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-37ce0cf823" data-kw="">
<blockquote><p>The most stringent and elaborate subscription probably ever enforced was that in the duchy of Brunswick, when duke Julius [1528-1589] required from all clergy, from all professors, from all: magistrates [in 1576-1577], a subscription to all and everything contained in the Confession of Augsburg [1530], in the Apology for the Confession [1531], in the Smalcaldic Articles [1537], in all the works of Luther, and in all the works of Chemnitz.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription</cite>, (Oxford: Henry &amp; Parker, 1863), p. 37, 1576-1577</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“The most stringent and elaborate subscription probably ever enforced was that in the duchy of Brunswick, when duke Julius [1528-1589] required from all clergy, from all professors, from all: magistrates [in 1576-1577], a subscription to all and everything contained in the Confession of Augsburg [1530], in the Apology for the Confession [1531], in the Smalcaldic Articles [1537], in all the works of Luther, and in all the works of Chemnitz.”

— Lutheranism, Arthur P. Stanley, A Letter to the Lord Bishop of London on the State of Subscription in the Church of England and in the University of Oxford (Oxford: Henry &amp; Parker, 1863), p. 37, 1576-1577">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+most+stringent+and+elaborate+subscription+probably+ever+enforced+was+that+in+the+duchy+of+Brunswick%2C+when+duke+Julius+%5B1528-1589%5D+required+from+all+clergy%2C+from+all+professors%2C+from+all%3A+magistrates+%5Bin+1576-1577%5D%2C+a+subscription+to+all+and+everything+contained+in+the+Confession+of+Augsburg+%5B1530%5D%2C+in+the+Apology+for+the+Confession+%5B1531%5D%2C+in+the+Smalcaldic+Articles+%5B1537%5D%2C+in+all+the+works+of+Luther%2C+and+in+all+the+works+of+Chemnitz.%E2%80%9D%0A%0A%E2%80%94+Lutheranism%2C+Arthur+P.+Stanley%2C+A+Letter+to+the+Lord+Bishop+of+London+on+the+State+of+Subscription+in+the+Church+of+England+and+in+the+University+of+Oxford+%28Oxford%3A+Henry+%26+Parker%2C+1863%29%2C+p.+37%2C+1576-1577&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37ce0cf823.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37ce0cf823.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=The%20most%20stringent%20and%20elaborate%20subscription,in%20all%20the%20works%20of%20Chemnitz&amp;text=The%20most%20stringent%20and%20elaborate%20subscription%20probably%20ever&amp;text=Luther%2C%20and%20in%20all%20the%20works%20of%20Chemnitz" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d4f17aad69" data-kw="">
<blockquote><p>…these questions were proponed to him that was to be elected. … Question. ‘Believe ye not, that the doctrine of the prophets and apostles, contained in the books of the New and Old Testament, is the only true and most absolute foundation of the universal church of Christ Jesus, in so much, that in the same Scripture are contained all things necessary to be believed for the salvation of mankind?’ Answer. ‘I verily believe the same; and do abhor and utterly refuse all doctrine alleged necessary to salvation, that is not expressedly contained in the same.’ Question. ‘Is not Christ Jesus, man of man according to the flesh, to wit, the son of David, the seed of Abraham, conceived of the Holy Ghost, born of the Virgin Mary his mother, the only Head and Mediator of his church?’ Answer. ‘He is, and without him there is neither salvation to man, nor life to angel.’ Question. ‘Is not the same Lord Jesus the only true God, the eternal Son of the eternal Father, in whom all that shall be saved were elected before the foundation of the world was laid?’ Answer. ‘I acknowledge and confess Him in the unity of his Godhead to be God above all things, blessed forever.’ Question. ‘Shall not they whom God, in his eternal counsel, has elected, be called to the knowledge of his Son, our Lord Jesus; and shall not they who of purpose are called, in this life, be justified; and where justification and free remission of sins is obtained in this life by free grace, shall not the glory of the Son of God follow in the general resurrection, when the Son of God shall appear in his glorious majesty?’ Answer. ‘This I acknowledge to be the doctrine of the apostles, and the most singular comfort of God’s children.’ Question. ‘Will ye not then contain yourself in all doctrine within the bounds of this foundation? Will ye not study to promove the same, as welll by your life as by your doctrine? Will ye not, according to the graces and utterance that God shall grant unto you, profess, instruct, and maintain the purity of the doctrine contained in the sacred Word of God; and to the uttermost of your power will ye not gainstand, and convince the gainsayers, and the teachers of men’s inventions?’ Answer. ‘That do I promise in the presence of God, and of his congregation, here assembled.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/book-of-common-order.html">Book of Common Order</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Common Order of the Church of Scotland, Commonly known as John Knox’s Liturgy</cite>, ed. G.W. Sprott (Blackwood &amp; Sons, 1901), pp. 21-23 For background on the significance of this form, see pp. xlvi-xlvii. | The Form &amp; Order of the Election of the Superintendent, which may Serve in Election of all other Ministers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

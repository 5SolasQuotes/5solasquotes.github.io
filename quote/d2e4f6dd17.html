<main class="wrap"><figure class="quote" id="q-d2e4f6dd17" data-kw="">
<blockquote><p>Another way we have of apprehending him, by way of negation, denying all the imperfections of the creatures, and removing them at an infinite distance from him; and truly, though this be an imperfection in knowledge, yet it is the greatest knowledge we can attain to, to know rather what he is not, than what he is.

He is not limited to any place, nor bounded with any measures and degrees of perfection, as creatures are; therefore we call him infinite: he is not comprehended within the limits of time, but comprehends all within himself; therefore he is eternal: he is not subject to changes and alterations; therefore called immutable: he is not compounded, as a result of divers parts; therefore he is most purely simple, and one: he is not like those things we see and hear, that fall under our senses; therefore we call him a Spirit, or a spiritual Being.

Now, in all these weak endeavours of man, to detain and fix his own spirit in the contemplation of God, if he cannot reach the understanding of what God is, yet certainly he will attain this great point of wisdom, — not to be ignorant of his own ignorance. And truly, my beloved, this is the thing I would have us to learn to know, that the admiration of God in silence is the best expression of him.

We would not search into these mysteries, to satisfy our curiosity, but rather compose our hearts to a continual silent wondering before him; for where our understandings are confounded, and our minds overwhelmed with the infiniteness of that glory, so that we can see nothing but our ignorance of all, this should certainly compose all to quiet admiration, for silence and wonder is the proper and natural posture of a soul that is at a stand, and can neither win [i.e. get] forward for inaccessible light, nor will retire backward, for that it apprehends already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 241-42.</span></figcaption>

</figure><figure class="quote" id="q-8e1dd6ba7a" data-kw="">
<blockquote><p>The Westminster divines worked on what might have been called “The Medium Catechism” before scrapping it and writing the Shorter and Larger Catechisms. The minutes of the Assembly give us some insight into what this catechism would have looked like had it been published:

Q. 6. What doe the Scriptures teach us to conceive of God?

A. God is a most glorious being, infinite in all perfections. …

Q. 15. What are we to believe concerning the holiness of God?

A. God is most perfectly holy, and neither causeth nor alloweth any to sin. …

Q. 19. Is God subject to any change or changeableness?

A. God is always the same unchangeably notwithstanding the changes in all others things.

Q. 20. What are we to believe concerning the truth of God?

A. God is most true in all his words, particularly in his promises and threatenings, and it is not possible for him to lie.

Q. 21. What are we to believe concerning the blessedness of God?

A. God is in himself most blessed, every way, and for ever, neither can any creature add to his happiness or take anything from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 708, 711, 15, 17 Sep. 1646, pp 283, 285.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

-perfections/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>(1) The natural life supposes generation; so does the spiritual, which is therefore expressed by ‘regeneration’, or by ‘being born again’, Jn. 3:3 and 1 Jn. 2:27. Now look, as in natural generation we are first begotten, and then born, so here there is an act qua regeneramur, ‘by which we are begotten again’, and qua renascimur, ‘by which we are born again’. There is an act of God, by which we are begotten again, viz. by the powerful influence of grace upon our hearts, accompanying in the Word, Jm. 1:18; and there is an act of God, by which we are born again, viz. when the new creature is formed in us, and begins to discover itself (“being born again, not of corruptible seed, but of incorruptible”). Effectual calling and sanctification are these two [respective] acts: by the one we are begotten, by the other born; the one may be called our passive, the other our active regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (d. 1677; London: Astwood, 1684), Sermons on 2 Cor. 5, Sermon 30, on 2 Cor. 5:15, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

<blockquote><p>Question 1: Whether law [jus], and the decree of law, or the command [jussio] of God, is God Himself? Affirmed with a distinction. Answer: Concerning the decree, as it is regarded on the part of God, or actively: affirmed; as it is regarded on the part of the decreed thing, or passively or terminatively: denied. Concerning law [jus], which in Greek [is] δικαίωμα [ordinance / righteous requirement], Rom. 1:32, insofar as it is equivalent to the power of God: affirmed. Not otherwise than as we have established that God’s blessedness, glory, majesty do not really differ from Himself. The word ‘command’ [jussio], insofar as it denotes the same thing which the words ‘mandate,’ ‘precept,’ or ‘order’ [signify], properly signifies the effect of the divine will, but not the will of God itself; consequently the command or thing-commanded of God is not God Himself: in the way that the law of God is not God Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669), pp. 48-136 tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66bdb9a034" data-kw="">
<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ... (d. 1629; London: Mabb, 1660), bk. 1, ch. 3, Concerning the Works of God &amp; the Decrees of God in General, The Rules, pp. 33-37</span></figcaption>

</figure><figure class="quote" id="q-538a3e473a" data-kw="">
<blockquote><p>In another way, they can be distinguished thus: The divine will, as will be clear below, wills something simply, and wills something conditionally or as much as is in itself; and in both ways it happens that it is signified. Therefore, the absolute will can be compared to something either by way of complacency or by way of displeasure. If by way of displeasure, that in no way happens: and thus it does not happen that this is signified or known by any exterior sign. If by way of complacency, either because that which happens pleases, and thus fulfillment; or because something from that pleases, and thus permission; and thus we have two signs. Again, the divine will can be signified as antecedent or conditional, and this in two ways: either by way of complacency, such that the opposite does not please, and thus command; or by way of displeasure, and thus prohibition; or by way of complacency, such that the opposite does not displease, and thus counsel. By way of displeasure, however, such that the opposite does not please, it is impossible to find [this]. And according to this, the number and sufficiency and the solution to the objections are clear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 45, art. 3, quest. 2, On the number and sufficiency of the signs of the divine will</span></figcaption>

</figure><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works</cite>, vol. 2, pp. 358-61</span></figcaption>

<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ .

1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following.

2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing.

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>

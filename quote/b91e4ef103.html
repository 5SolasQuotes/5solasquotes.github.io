<blockquote><p>§10.

I. The subject or matter [of a minister] is a man:

II. The necessary Disposition is:…

      3. That he be a Christian.

      4. That he have necessary abilities for the essentials of the office-work. And those are:

      1. The understanding at least of the essentials of religion and ministry.

      2. A will to perform the work of the ministry.

      3. Ability of utterance to do it, and all the necessary executive power.</p></blockquote>

<blockquote><p>O bear with your brethren’s differing from you and judge charitably of them, as to the most part at least. Construct it [a] want [lack] of light, not sinistrousness of intention or affection. ‘He that keeps a day, keeps it to the Lord; and he that keeps it not to the Lord, he keeps it not.’ [Rom. 14] In problematic questions not defined by the Church, allow others a latitude and continue your brotherly forbearance. If even with infidels and heretics the servant of the Lord must not strive, but be gentle, etc. (as 2 Tim. 2:24-25), how much less with sick and feverish brethren? If any man’s inconsiderate and opinionative zeal carry them unto any unbrotherly word or deed toward you, be not ye overcome of their evil, but overcome their evil with your good. Pack up their reproachings and say, ‘Father, forgive them, they know not what they are doing.’ Let not their vexing you fret you into a wearying of your work (Ps. 55:6-8), nor unto any disaffection or lessening of your respect unto them. Love them as brethren, notwithstanding all injuries (as Joseph did his), and honor their zeal in the Lord, and pray He may channel it right and set its bounds, for so it might do Him excellent service. Tolerate also good people’s infirmities; let none of their capricious humors (which these reeling times tempt them unto) diminish your tender care of them. Seek that which strays, heal the diseased, and by gentle dealing convince them that ye walk in the Spirit of Jesus, whom ye serve. Hard things (we confess) are cut out for you; but put on patience and holy resolution, stand your ground notwithstanding all batteries and do your work over the belly of all discouragements (Heb. 12:2-3). What though ye be the witnesses prophesying in sackcloth (Rev. 11:3); your crown will be the massier. Serve the Lord through good report and ill report, honor and dishonor; and make full proof of your ministry, which is thought so considerable by Satan, else he would not oppugne and oppose it so upon the right hand and the left. You are the eye-sore of the Prelates and their party, and the butt of those your brethren’s mistaken zeal. Be strong therefore in the Lord, etc. Our soul pities you, being as the speckled bird among the birds of the field, laid at upon all hands and grinded as betwixt two mill-stones, viz. the Prelatic party’s enmity upon the one hand and the fierceness of these malcontented friends upon the other (and who may stand before envy? (Prov. 27:4) But learn of your Master to endure contradiction and to be set for a sign to be spoken against, that the thoughts of many hearts may be revealed (Lk. 2:34-35). Endure the cross and despise the shame. Wounds in the house of friends as well as of foes must be born till He arise and plead your cause and bring forth your righteousness as the light, etc. This is the day of your trial, and these are the instruments chosen of the Lord for that end; acquit yourselves like men, like Christians, like ministers in it. Bear the indignation of the Lord patiently, because perhaps ye have sinned. If Shimei rail, he may be a good monitor, though a bad judge. Take your vexations as so many whetstones, to keep you in an holy edge, that ye blunt not in these up-sitting times, and as spurs in your sides to prick you up to diligence in duty; and so may you get meat out of the eater, etc. Stoop to your lot, there may be a blessing in it (2 Sam. 16:10-12). But bitter though your life and labor be, yet faint not, O faint not! but approve yourselves to God and man in your Master’s service; and by piety, painfulness and powerfulness in the Gospel, convince gain-sayers, stop the mouths of those that speak evil of you falsely, and preach home again all the respect and affection which these times of difference has derogated from you. What? have ye not the seal of your ministry (a witness of Gods approbation) upon the hearts of many? even of some who perhaps are now alienated from you, who once spake of a blessedness in your ministry, and received you as angels, though now in the hour of tentation, they are become as an enemy? Gal. 4:15-16. Though conversion of sinners be not so frequent (and yet some there is), yet has not God been evidently with you for confirmation and building up of the saints, and for conviction upon all, who, whether they be better of you or not, yet are forced to say, ‘God is in you and with you,’ and ‘A prophet has been among them?’ as Eze. 2:4-5. Now, may not these eminent divine assistances, successes and proofs of acceptance, abundantly compense all your tears, sufferings and sorrows? and answer the questioning of your being sent of God, being proofs of Christ speaking in you? Consider, the privilege of your liberty, and think, is not service to God and his people (which hereby ye get done) well worth the enduring much contradiction, obloquy and heart-breaking reproach? Remember also your brethren’s sufferings are sad at others’ hands, though none at yours; and let your sympathizing with them sweeten your own at their hands. And Oh! be stirred up to make good use of your liberty which costs you so dear. Let your people find through Gods help, that it has been their mercy that ever ye were sent among them; or whether they hear or forbear, that there has been a prophet among them. Keep in good terms with your Master, stand in his counsel, know the times, and tell what of the night, and what Israel ought to do; be faithful in all his house as servants and good stewards of the mysteries of God. Bear burden with your brethren in their tedious sufferings constantly. And pray for a blessing upon their preaching of the Gospel, albeit some of them would ruin yours: And whosoever of them may preach Christ out of contention, or fast for strife and debate, supposing to add affliction to your griefs and to detract from your esteem, yet rejoice ye that Christ is preached, and that sincerely by the most, Phil. 1:15-18.</p></blockquote>

ith+your+Master%2C+stand+in+his+counsel%2C+know+the+times%2C+and+tell+what+of+the+night%2C+and+what+Israel+ought+to+do%3B+be+faithful+in+all+his+house+as+servants+and+good+stewards+of+the+mysteries+of+God.+Bear+burden+with+your+brethren+in+their+tedious+sufferings+constantly.+And+pray+for+a+blessing+upon+their+preaching+of+the+Gospel%2C+albeit+some+of+them+would+ruin+yours%3A+And+whosoever+of+them+may+preach+Christ+out+of+contention%2C+or+fast+for+strife+and+debate%2C+supposing+to+add+affliction+to+your+griefs+and+to+detract+from+your+esteem%2C+yet+rejoice+ye+that+Christ+is+preached%2C+and+that+sincerely+by+the+most%2C+Phil.+1%3A15-18.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%2C+1681%29%2C+pp.+148-152&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F48449acda9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/48449acda9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=O%20bear%20with%20your%20brethren%E2%80%99s%20differing,sincerely%20by%20the%20most%2C%20Phil.%201%3A15%2D18&amp;text=O%20bear%20with%20your%20brethren%E2%80%99s%20differing%20from%20you&amp;text=and%20that%20sincerely%20by%20the%20most%2C%20Phil.%201%3A15%2D18" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Things about the foundation, circa-fundamentalia, are all things revealed in the Word of God, as all histories, miracles, chronologies, things about Orion, the Pleiades, the North Stars (Job 38:31-32), that Paul left his cloak at Troas. The knowledge of these is considered three ways:

1. As necessary, by necessity of a mean, necessitate medii, and the knowledge so is not necessary to salvation. Many are in glory (I doubt not) who lived in the visible church, and yet knew never that Sampson killed a lion. But the knowledge of all these is necessary, necessitate præcepti [by a necessity of precept], because all in the visible church are obliged to know these things; therefore the ignorance of these only, does not actually condemn, but virtually and by demerit leads to condemnation.

2. This knowledge is considered as commanded in the excellency thereof, and so error and bad opinions about these are sinfully ill, though [are] in the regenerate, by accident; such errors condemn not [to damnation] where the foundation is held.

3. The knowledge of these is considered as commended and enjoined to us with the submission of faith, for the authority of God the speaker, and the malicious opposing of these is a fundamental error, not formally, but by evident consequence. For though the matter of these errors is not fundamental, yet the malicious opposing of these is a fundamental error against this principle: Whatever God has said is true. But God says…</p></blockquote>

<blockquote><p>2. Whether a separation may be iustly made from our Church for some errors or corruptions of life. I know that diverse who were once among us, never of us, have put out their own lights, indeed excommunicated themselves. What’s their plea? That our assemblies are full of enormities. I answer: That the defects and corruptions of a Church must be distinguished: they are either in doctrine or in manners. For doctrine, some errors are Citra fundamentum, some Circa fundamentum, others Contra fundamentum. Errors beside the foundation trouble, errors about the foundation shake, errors against the foundation ouerturn all. So long then as no foundation is harmed, it is not lawful depart until the Church separates from Christ, we must not separate from it. In two cases there is warrant of separation: First, when the substance of God’s worship is quite corrupted. What agreement has the Temple of God with idols? (2 Cor. 6:16) When this is, verse 17, ‘Come out from among them, and be ye separate, says the Lord,’ When Jeroboam had set up idols in Israel, the priests and the Levites left their suburbs and possession and came to Judah and Jerusalem. (2 Chron. 11:14) Secondly, when the substance of doctrine is quite corrupted. If any man consent not to the words of our Lord Jesus Christ, and to the doctrine which is according to godliness, etc. (1 Tim. 6:3) ‘From such,’ verse 5, ‘withdraw thyself.’ Paul in the synagogue at Ephesus preached for the space of three months together. (Acts 19:9) But when diverse were hardened, and believed not, but spake evil of that way, he departed from them, and separated the disciples. In these two cases lawful, not else.</p></blockquote>

<blockquote><p>II. In dealing with adversaries, or others, about controverted truths, it were good for their conviction to make use of some known, uncontroverted principle, and thence deduce what they would have received; for where there is no agreement in any common notion or principle, there is no hope of getting truths received: therefore Paul, in debating this matter [Romans 7:1-3], doth wisely lay down, in the first place, what they received as truth, and did not doubt of saying, Know ye not; which is as much as if he had said, You know this, and cannot deny it, viz. That the law hath dominion over a man, as long as he liveth.

III. It is not the most gaining way, in dealing with adversaries of truth, to contemn their parts and abilities, and to speak of them in an undervaluing manner; but rather on the contrary, to acknowledge their parts and knowledge, and make use of that for their conviction, as the apostle doth here; he does not lightly them, but says, they knew the law.

IV. In all our attempts ot gain folks to the truth, we should still labour to gain their affection; and we should so carry ourselves, as they may be convinced of our love and tender respect towards them, and that we seek not to shame, or rub any affront on them, but intend, out of a friendly and brotherly manner, to gain them; for Paul doth insinuate himself thus upon these here, by stiling them brethren: thus he laboured to conciliate their favour.</p></blockquote>

III. It is not the most gaining way, in dealing with adversaries of truth, to contemn their parts and abilities, and to speak of them in an undervaluing manner; but rather on the contrary, to acknowledge their parts and knowledge, and make use of that for their conviction, as the apostle doth here; he does not lightly them, but says, they knew the law.

IV. In all our attempts ot gain folks to the truth, we should still labour to gain their affection; and we should so carry ourselves, as they may be convinced of our love and tender respect towards them, and that we seek not to shame, or rub any affront on them, but intend, out of a friendly and brotherly manner, to gain them; for Paul doth insinuate himself thus upon these here, by stiling them brethren: thus he laboured to conciliate their favour.”

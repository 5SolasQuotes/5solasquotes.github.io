<main class="wrap"><figure class="quote" id="q-78890db785" data-kw="">
<blockquote><p>The Scottish Covenanter, George Gillespie spoke of his veneration for the English Independents at the Westminster Assembly:

You have here some dissenting brethren to whom I owe great respect … a word of love and affection … I wish they prove to be as unwilling to divide from us, as we have been unwilling to divide from them. I wish that instead of toleration, there may be a mutual endeavour for a happy accommodation. … There is a certain measure of forbearance, but it is not so seasonable now to be talking of forbearance, but mutual endeavours for accommodation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 353, 3 Jan. 1645, p. 28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cafd78ed7" data-kw="">
<blockquote><p>George Whitefield is often thought of as the archetypal “evangelical Calvinist”, hence we find his picture on the spine of Banner of Truth books. Moreover, one denomination, which attempts to marry revivalism and Calvinism, even named their theological hall after him. However, it is worth keeping in mind that both the early Reformed Presbyterians and the early Seceders regarded his brand of revivalism as deeply injurious to the covenanted reformation, due to its latitudinarianism and physical manifestations. In other words, they released that evangelicalism and covenanting principles were wholly incompatible. Here is what the Associate Presbytery, when renewing the covenants in 1763, thought of Whitefield’s religious movement:

The sins and provocations of this land are further increased, by the kind of reception that many, both ministers and people, have given to Mr George Whitefield, a professed member and priest of the superstitious church of England, and by the great entertainment that has been given to Latitudinarian Tenets, as further propagated by him and others; whereby any particular form of church-government is denied to be of divine institution, and, under a pretence of catholic love, a scheme is laid for uniting parties of all denominations in church communion, in a way destructive of any testimony for the declarative glory of Immanuel, as Head and King of Zion, and for the covenanted reformation of this church and land: for which a righteous God hath justly chosen their delusions, and sent forth a spirit of delusion among them, in the present awful work upon the bodies and spirits of men. And, tho’ the Lord has been pleased, in his sovereign goodness, to preserve a remnant from being carried off by the above dangerous scheme and awful delusion; yet, while endeavouring to testify against the same before the world, we have not be suitably exercised thereanent before the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-seceders.html">Scottish Seceders</a></span><span class="wk"><span class="lbl">Work:</span> <cite>for renewing the National Covenant of Scotland, and the Solemn League and Covenant of the three kingdoms in a way and manner agreeable to our present situation and circumstances in this period</cite>, (Glasgow, 1763), pp 34-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-c384fd05e1" data-kw="">
<blockquote><p>It was the laubable practice in reforming times to condemn all steps of defection, and duly to censure such as were guilty of public backslidings. Accordingly, by the Assembly that met anno 1638, all the prelates, being ringleaders in the apostasy, were deposed, and some of them excommunicated: Also, in the said reforming period, they returned to the Lord by a particular acknowledgment and confession of the sins of the ministry and of the whole land. But the General Assembly that met in the year 1690 made no particular acknowledgement of the many heinous backslidings of the former period: But on the contrary when many lamentable steps of defection and apostasy were complained of in a Large Paper offered to the foresaid Assembly 1690 by Mr. Alexander Shields, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>…yet has there been too much mischief done by these acts, to wit… the barring of hopeful young-men from trials, in order to public preaching, and of able and godly expectants from being called and tried, in order to their entrance in the ministry, because they had no freedom in their consciences to take upon them the bonds required, which we have already set down: for, this act, as it has kept sundry congregations from calling expectants of that judgment, because there was no probable way how they could be tried or admitted to the ministry; So have sundry expectants, being called, been thereby barred from proceeding to their trials…; and sundry hopeful young-men have been necessitated to remove from the presbyteries and provinces wherein they do live, before they could be admitted to give any proof of their gifts for preaching…</p></blockquote>

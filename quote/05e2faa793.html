<blockquote><p>We likewise believe the article on the office of our Lord Jesus Christ as a fundamental article, namely that the only begotten Son of the Father became flesh through Mary (who remained always a virgin) is our sole Redeemer and Mediator…</p></blockquote>

</figure><figure class="quote" id="q-0602870132" data-kw="Mary Queen of Heaven Idolatry">
<blockquote><p>This saying of Christ openly and manifestly warns men to beware lest, by too superstitiously elevating the honor of the name of mother in the Virgin Mary, they transfer to her what belongs exclusively to God. … For Mary has been constituted the Queen of Heaven, the Hope, the Life, and the Salvation of the world; and, in short, their fury and madness proceeded so far that they stripped Christ of his spoils, and left him almost naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, John 2:4</span></figcaption>

</figure><figure class="quote" id="q-fa4cbd8681" data-kw="">
<blockquote><p>He turns, in September 1522, to a lyrical defense of the perpetual virginity of the mother of Christ… To deny that Mary remained ‘inviolata’ before, during and after the birth of her Son, was to doubt the omnipotence of God… and it was right and profitable [according to Zwingli] to repeat the angelic greeting – not prayer – ‘Hail Mary’… God esteemed Mary above all creatures, including the saints and angels – it was her purity, innocence and invincible faith that mankind must follow. Prayer, however, must be… to God alone… . p. 395 ‘Fidei expositio,’ [An Exposition of the Faith, 1536] the last pamphlet from his pen [d. 1531]… There is a special insistence upon the perpetual virginity of Mary….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-r-potter.html">G. R. Potter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zwingli (London: Cambridge Univ. Press, 1976). Also Zwingli, The Perpetual Virginity of Mary…, Sept. 17, 1522, pp. 88-89</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

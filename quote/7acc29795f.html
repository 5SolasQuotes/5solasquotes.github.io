<blockquote><p>HAVING finished (Right Worshipful,) the Translation of this Logical, and Theological Treatise; I thought good, both for the patronizing of the Book, and the Testimony of my duty, to offer the Dedication of the same unto your Worshipper: for the former cause, that as the Author himself, dedicated this Book at first to such persons, as were for authority able, and for Religion zealous to protect the same; so I the unworthy Translator of so worthy an Author, made bold to make choice of your Worship, being for authority in your place, no less eminent, and for zeal to Religion no worse affected, To the end it may be shielded by your Patronage, from the mouths of the malignant; not in regard of my labour herein, (which as it is but small, if either the quantity of the Book, or the Authors own Industry be considered; so it is not without imperfections, which notwithstanding, I hope the discreet, with favourable Connivence will pass over, considering the difficulty of Translation in this succinct and Logical kind of writing, and the penury of our English Language in the Terms of Art;) but in respect of the matter it self, which being so worthy, for Gods cause deserveth, and so profitable for the Churches sake, desireth your favourable countenance.

For the latter Cause, that as your Worship, is my best, and chiefest favourer, and that for the best and chiefest cause, the profession of godliness; so meet it were I should declare, whom first, and best I should remember in this the first fruit of my labour, and best token of my love: best I say, in regard of the matter, which is here contained, though least to be esteemed in respect of the manner, how it is by me delivered; which (though being offered in a homely style, as a golden Treasure in an earthen vessel, or a rich Pearl in a polluted hand) I trust your worship will not reject. And so I commend the same, such as it is, to your Worship, in your Christian favour to bee regarded, your self to the Lord in his continual mercy to bee protected, and all that I am, and have to your self, at your godly pleasure to be commanded,

JOHN GAWEN</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-022e16d744" data-kw="">
<blockquote><p>And this Covenant is the bond of a twofold union. First, it unites us of this Kingdom among our selves, and this Kingdom with the other two. Secondly, it makes a special union of all those, who shall take it holily and sincerely throughout the three Kingdoms, with the One-most God. Weak things bound together are strong, much more then, when strong are bound up with strong; most of all, when strong are bound up with Almighty. If in this Covenant we should only join weak to weak, we might be strong. But (blessed be God) we join strong (as creatures may be accounted strong) with strong.

The strong Kingdoms of England and Ireland, with the strong Kingdom of Scotland. A threefold cord twisted of three such strong Cords will not easily, if at all, be broken. They which single (blessed be God) have yet such strength, how strong may they be when conjoined? As the Apostle writes to his Romans (c. 6. 19.) I speak after the manner of men, because of the infirmity of our flesh: So I speak now after the manner of men, concerning the strength of our flesh (outward meanes) in these Kingdoms. For as the Apostle Peter speaks in like phrase, though to another occasion, (2 Pet. 3. 9. the Lord is not slack concerning his promise, as some men count slackness. So I may say, no man, no Kingdoms are strong to any purpose, as the Lord counts strength.

And therefore I reckon this the least part of our strength, that these three strong Kingdoms will be united by this Covenant; nay, if this were all the strength which this union were like to make, I should reckon this no strength at all; wherefore know that this covenant undoubtedly is and will be a bond of union between strong and Almighty: between three strong Nations, and an Almighty God. This Covenant engages more then Man, God also is engaged; engaged (through his free grace) in his power, wisdom faithfulness, to do as good and much good, though in and of our selves unworthy of the least, unworthy of my good.

All this considered, this Covenant will be our strength, our brethren of Scotland, have (in a plentiful experience) found it so already. This Covenant (through the blessing of God upon their counsels and endeavours) hath been their Sampson’s Lock, the thing (in fight) wherein their strength lieth. And why should not we hope, that it will be ours; if we can be wise, as they, to prevent or overcome the flattering enticements of those Delilah’s, who would lull us asleep in their laps, only for an opportunity to cut or shave it off? Then indeed (which God forbid) we should be but weak, like other men, yea weaker then our selves were before this Lock was grown, having but the strength of man; God utterly departing from us, for our falseness and unfaithfulness in this Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature, solemnity, grounds, property, and benefits, of a sacred covenant. Together with the duties of those who enter into such a covenant. Delivered in a sermon at Westminster, at the publique convention, (ordered by the Honourable House of Commons) for the taking of the Covenant, by all such, </cite>, (London: John Rothwell, 1643), pp 25-26.</span></figcaption>

<blockquote><p>Latin songs, as well as organs (first introduced into the churches by Pope Vitellianus about 665) are for the most part abolished in the churches of this land. Not that use of the Latin language or of music is rejected of itself and the youth are rightly allowed these in their place, as in the schools and at home in their houses. But it is more profitable and more edifying when in the public assemblies, the prayer, singing, and the whole of the service of worship is performed in a known and intelligible language so that the common man is able to retain something from it, and to say Amen. And this has the apostle Paul commanded the Corinthians in their assemblies (1 Cor. 14), who otherwise highly extols tongues and the variety of languages. So also the superfluous and unbeneficial costs expended on organs are much better directed to other necessary causes in the maintenance of churches and schools.</p></blockquote>

<blockquote><p>All things and rites which have been notriously abused to idolatry, if they be not such as either God or nature has made to be of a necessary use, should be utterly abolished and purged away from divine worship, in such sort that they may not be accounted nor used by us as sacred things or rites pertaining to the same.</p></blockquote>

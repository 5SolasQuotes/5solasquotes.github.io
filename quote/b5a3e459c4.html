<main class="wrap"><figure class="quote" id="q-b5a3e459c4" data-kw="">
<blockquote><p>Wilt thou not be ruled by the laws, unless thou see the king? wilt thou not fear the infection of the plague unless thou see it? Use thy reason for thy soul as well as for thy body…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 399</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“Wilt thou not be ruled by the laws, unless thou see the king? wilt thou not fear the infection of the plague unless thou see it? Use thy reason for thy soul as well as for thy body…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-097d771964" data-kw="">
<blockquote><p>Believe if ye will [as it is claimed by Romanists] that [Emperor] Constantine gave to the Popes of Rome freedom and immunity from the imperial laws… we teach no such kingly power given to Church-men, and judge this Donation [of Constantine] to be a forged lie, invented by Papists… 6. We do not teach that Church-men are loosed from the positive laws of emperors and kings. [The Romanist, Robert] Bellarmine says that the Magistrate can neither punish Church-men, nor convene them before the tribunal… And as he says, by divine law the Pope is eximed [exempt] from all laws of princes… And what they allege for Peter’s exemption from paying tribute, will exime all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they) by a divine positive law are eximed from the laws of Magistrates… Paul will have every soul subject to superior powers, and except the Roman clergy want [lack] souls, they must also be subject. Solomon punished [the priest] Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected Himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Ceasar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil, as many as are in danger of resisting the power, are to be subject, Rom. 13:4. 2. but Church-men are such, therefore they are subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, Appendix, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-1353bde1a1" data-kw="">
<blockquote><p>2. If they [Churches] decree things good, lawful and necessary, the prince has a power given him of God to ratify, confirm, and approve these by his civil sanction, but he has no power-ordinary to infringe, or evert what they have decreed.

3. And if the Church be altogether incorrigible and apostate, then we say as follows…</p></blockquote>

</figure><figure class="quote" id="q-e1d886b46f" data-kw="">
<blockquote><p>…green and raw deliverances are plagues of God, not mercies; the plague is nine times removed, but Pharaoh’s heart is neither softened nor humbled, the scum abideth in the bloody city, as the Lord complains, Eze. 24:6, ‘Therefore thus saith the Lord God, Woe to the bloody City, to the pot whose scum is therein, and whose scum is not gone out;’ the prophet in Chaldea heard that Jerusalem had been boiled with the sword of the Lord, but the scum of their idolatry and blood remained in them; whilst the wicked of these kingdoms, malignants, bloody Irish, rotten hearted men, such backsliders and perjured apostates, as are in Scotland, delivered to Satan and excommunicated, while these taste of the gall and wormwood of the wrath of God in this war, the hand of God cannot be removed, and therefore that must be taken notice of, Jer. 6:29, ‘The bellows are burnt, the lead is consumed of the fire, the founder melteth in vain: for the wicked are not plucked away;’ O that our Lord would boil out on the fire the scum of both kingdoms. The whoredoms of Popish Egypt, and the ceremonies, the inventions of men are not mourned for by the pastors of the Lord, sure, I am, not by most of the ministers in Scotland…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached before the Right Honorable House of Lords, in the Abbey Church at Westminster, Wednesday the 25th day of June</cite>, 1645. Being the day appointed for a solemn and public humiliation., p. 40-41</span></figcaption>

<blockquote><p>4. There are places of persecution where no liberty is granted for public assemblies: and places of peace, where Churches have much rest, and great liberty. In places of persecution bounden duties must rather be performed in private, than omitted. For matter of circumstance must give place to matters of substance: matters of conveniency to matters of necessity. Wherefore to leave extraordinary persons to their extraordinary warrant…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Sacrifice: or, a Commentary on the 116th Psalm</cite>, … (1632), Section 115, p. 258, on Ps. 116:19</span></figcaption>

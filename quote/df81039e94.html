<blockquote><p>Upon all these reasons I advise all that love their time, their souls, their God and happiness, to turn away from these nurseries of vice and to delight themselves in the Law and ordinances of their Savior, Ps. 1:2-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes] in A Christian Directory… (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, pp. 877-78 | 5. I think I never knew or heard of a lawful stage-play, comedy or tragedy in the age that I have lived in: And that those now commonly used, are not only sins, but heinous aggravated sins, for these reasons:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee65977391" data-kw="">
<blockquote><p>To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 74-75 Powel (baptised 1576–1611) was a Welsh Anglican minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-c270919e61" data-kw="">
<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by [Against] Dr. Owen’s Vindicator… (London: Parkhurst, 1684), section 2</cite>, p. 11</span></figcaption>

</figure><figure class="quote" id="q-36bca76b8d" data-kw="">
<blockquote><p>We require not of necessity an artificial table of timber: a bull-hide or a plot of ground may serve in time of necessity, and answers analogically to a standing table, as the plot of ground did whereabout the multitude sat in rows by fifties and fifties, Mark 6. Neither do we stand upon the fashion, whether it be long or round; but we require that the communicants always sit table-ways [like at a table], so that they may observe the form of a feast or banquet: For in that this holy action is called a ‘supper’, it is imported that it was celebrated in the form of a feast or banquet, as [Johannes] Piscator observes in his observations upon Mt. 26. We do not require all the forms used at common feasts, but these which Christ the institutor, and Master of the feast thought sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Re-Examination of Two of the Articles Abridged: to wit, of the Communicants’ Gesture in the Act of Receiving, Eating &amp; Drinking… ([Holland?] 1636), ‘Of the Communicants’ Gesture in the Act of Receiving’, p. 14 Calderwood was an arch-Scottish presbyterian minister and theologian, who was the major mouthpiece for them between 1618-1637.</cite></span></figcaption>

</figure><figure class="quote" id="q-e6788e1cfe" data-kw="">
<blockquote><p>Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Liturgies &amp; their Imposition (London, 1662), ch. 7</cite>, p. 42</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.”

— John Owen, A Discourse concerning Liturgies &amp; their Imposition (London, 1662), ch. 7, p. 42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCircumstances+are+either+such+as+follow+actions+as+actions%2C+or+such+as+are+arbitrarily+superadded+and+adjoined+by+command+unto+actions%2C+which+do+not+of+their+own+accord%2C+nor+naturally+nor+necessarily+attend+them.+Now+religious+actions+in+the+worship+of+God+are+actions+still.+Their+religious+relation+does+not+destroy+their+natural+being.+Those+circumstances+then+which+do+attend+such+actions+as+actions%2C+not+determined+by+divine+institution+may+be+ordered%2C+disposed+of%2C+and+regulated+by+the+prudence+of+men.+For+instance%2C+prayer+is+a+part+of+God%E2%80%99s+worship.+Public+prayer+is+so%2C+as+appointed+by+Him.+This+as+it+is+an+action+to+be+performed+by+man+cannot+be+done+without+the+assignment+of+time%2C+and+place%2C+and+sundry+other+things%2C+if+order+and+conveniency+be+attended.+These+are+circumstances+that+attend+all+actions+of+that+nature+to+be+performed+by+a+community%2C+whether+they+relate+to+the+worship+of+God+or+no.+These+men+may+according+as+they+see+good+regulate+and+change+as+there+is+occasion%3A+I+mean+they+may+do+so+who+are+acknowledged+to+have+power+in+such+things.+As+the+action+cannot+be+without+them%2C+so+their+regulation+is+arbitrary+if+they+come+not+under+some+divine+disposition+and+order%2C+as+that+of+time+in+general+does.+There+are+also+some+things+which+some+men+call+circumstances+also%2C+that+no+way+belong+of+themselves+to+the+actions+whereof+they+are+said+to+be+the+circumstances%2C+nor+do+attend+them%2C+but+are+imposed+on+them%2C+or+annexed+unto+them%2C+by+the+arbitrary+authority+of+those+who+take+upon+them+to+give+order+and+rules+in+such+cases.+Such+is+to+pray+before+an+image%2C+or+towards+the+East%2C+or+to+use+this+or+that+form+of+prayer+in+such+Gospel+administrations+and+no+other.+These+are+not+circumstances+attending+the+nature+of+the+thing+itself%2C+but+are+arbitrarily+superadded+to+the+things+that+they+are+appointed+to+accompany.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Discourse+concerning+Liturgies+%26+their+Imposition+%28London%2C+1662%29%2C+ch.+7%2C+p.+42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe6788e1cfe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e6788e1cfe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=Circumstances%20are%20either%20such%20as%20follow,that%20they%20are%20appointed%20to%20accompany." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-2711a800b3" data-kw="">
<blockquote><p>As we are all vitiated by sin, we cannot but be hateful to God, and that not from tyrannical cruelty, but the strictest justice. But if all whom the Lord predestines to death are naturally liable to sentence of death, of what injustice, pray, do they complain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/condemnation.html">Condemnation</a> › <a href="../topics/reprobation/condemnation/damnation-for-sin.html">Damnation for sin</a></span><span class="t"><a href="../topics/reprobation/reprobation-and-the-justice-of-god.html">Reprobation and the Justice of God</a> › <a href="../topics/reprobation/reprobation-and-the-justice-of-god/romans-9-objections-answered.html">Romans 9 objections answered</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9865f26ad" data-kw="">
<blockquote><p>Since all people have sinned in Adam and have come under the sentence of the curse and eternal death, God would have done no one an injustice if it had been his will to leave the entire ­human race in sin and under the curse, and to condemn them on account of their sin. As the apostle says: “The whole world is liable to the condemnation of God” (Rom. 3:19), “All have sinned and are deprived of the glory of God” (Rom. 3:23), and “The wages of sin is death” (Rom. 6:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/reprobation-and-the-justice-of-god.html">Reprobation and the Justice of God</a> › <a href="../topics/reprobation/reprobation-and-the-justice-of-god/romans-9-objections-answered.html">Romans 9 objections answered</a></span><span class="t"><a href="../topics/reprobation/condemnation.html">Condemnation</a> › <a href="../topics/reprobation/condemnation/damnation-for-sin.html">Damnation for sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Since all people have sinned in Adam and have come under the sentence of the curse and eternal death, God would have done no one an injustice if it had been his will to leave the entire ­human race in sin and under the curse, and to condemn them on account of their sin. As the apostle says: “The whole world is liable to the condemnation of God” (Rom. 3:19), “All have sinned and are deprived of the glory of God” (Rom. 3:23), and “The wages of sin is death” (Rom. 6:23).”

</figure><figure class="quote" id="q-4236adad7c" data-kw="">
<blockquote><p>Though their perdition depends on the predestination of God, the cause and matter of it is in themselves. The first man fell because the Lord deemed it meet that he should: why he deemed it meet, we know not. It is certain, however, that it was just, because he saw that his own glory would thereby be displayed. When you hear the glory of God mentioned, understand that his justice is included. For that which deserves praise must be just. Man therefore falls, divine providence so ordaining, but he falls by his own fault.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.8</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 3.23.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough%20their%20perdition%20depends%20on%20the%20predestination%20of%20God%2C%20the%20cause%20and%20matter%20of%20it%20is%20in%20themselves.%20The%20first%20man%20fell%20because%20the%20Lord%20deemed%20it%20meet%20that%20he%20should%3A%20why%20he%20deemed%20it%20meet%2C%20we%20know%20not.%20It%20is%20certain%2C%20however%2C%20that%20it%20was%20just%2C%20because%20he%20saw%20that%20his%20own%20glory%20would%20thereby%20be%20displayed.%20When%20you%20hear%20the%20glory%20of%20God%20mentioned%2C%20understand%20that%20his%20justice%20is%20included.%20For%20that%20which%20deserves%20praise%20must%20be%20just.%20Man%20therefore%20falls%2C%20divine%20providence%20so%20ordaining%2C%20but%20he%20falls%20by%20his%20own%20fault.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.23.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4236adad7c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4236adad7c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ea336e1f9a" data-kw="pass by wrath for sin">
<blockquote><p>The rest of mankind, God was pleased, according to the unsearchable counsel of his own will, whereby he extendeth or withholdeth mercy as he pleaseth, for the glory of his sovereign power over his creatures, to pass by and to ordain them to dishonor and wrath for their sin, to the praise of his glorious justice.</p></blockquote>

</figure><figure class="quote" id="q-5792bc7e9b" data-kw="preterition election">
<blockquote><p>Not only does election (opposed to it) necessarily prove reprobation (because the election of some cannot be said without the preterition of others) and the damnation of the wicked (which takes place in time) suppose it … but the Scripture so clearly establishes it that no one (but of blind audacity) … cannot even doubt it.</p></blockquote>

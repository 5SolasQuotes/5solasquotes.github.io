<blockquote><p>For all this so strong was the delusion, the blinded people did not open their eyes. Becold and Knipperdolling did daily preach new visions, Becold lying in a trance three days. When he awakened he appeared to be mute, but by writing tables he signi­fied it was the command of God to change yet further the Government of the city, he set down the names of twelve of his greatest confidents to be governors and princes over the twelve Tribes of Israel (MM): This was no sooner proposed then executed. So soon as the holy Prophet got his mouth opened, the first motion he makes, was that the preachers would consider if it were not the will of God for the increase of the holy seed, that every one of the saints should have more wives: at the first, the preachers opposed this abomination, but thereafter by threats and flatteries they were brought to yield. Becold began, and at one time married three, but at once he came to the number of fifteen together (NN). The great prophet’s example was follow­ed by many, and by all that would: many honest matrons were forced to marry with any of these villains who liked them. This unheard of wickedness did so embitter the spirits of the remain­der of ingenuous men, that they rose up in a conspiracy, and laid [Page 10] hold on Becold, Knipperdolling and the rest of their false prophets: but behold, the common people got up in a tumult, rescued the prophets, and killed forty nine of the most honest citizens for their assaying to put some end to their intolerable disorders (OO). Nothing more advances the affairs of tyrants, then a faint impru­dent and unsuccessful resistance: Becold by this unhappy attempt of his enemies having confirmed his authority, suborned one of the prophets to preach to the people, that it was the command of God to make Becold the king of the whole earth, promising that all the kings and potentates of the world should certainly be subdued by his sword, for he was the man that should rule all nations with a rod of iron (PP). Becold, at the hearing of these news, humbled himself to the ground, adored the truth of that prophecy, declared his information thereof by God ten days be­fore, but the matter concerning his own person he had hitherto been silent, yet all now being made public by the mouth of another prophet, he did submit himself to the will of God. No minute of time was delayed, the twelve princes were cashie­red, the Catholic monarch did choose his chancellor, treasu­rer, secretary, and other officers of state and court, a fair high throne was set up in the market-place, and covered all over with cloth of gold; Becold made for himself, being a tailor by his trade, very royal suits of most gorgeous apparel of the priests’ vestments, which he had robbed in the cathedral: a stately crown, scepter and sword were prepared for him, his courtiers were all put in most sumptuous raiment, no greater magnifi­cence was to be seen at any princes court in the world (QQ). Thus Becold attained the top of his ambition and lust, but the great skill was how to keep what was gotten: for this end twen­ty eight apostles were sent abroad to preach over the world obe­dience to the King of Munster the new Jerusalem; but here was the bad luck, all of them but one who returned with the tidings were killed in the places where first they offered to preach. In the meantime the town begun to be pinched with famine, one of the king’s wives being reported for a word of compassion upon the starving multitude, was brought forth to the marketplace, and by Becold’s own hand had her head struck off (RR). All the rest of his wives did sing a psalm to God for this so excellent an act of justice. The King himself led all fourteen in a dance [Page 11] through the streets of the town; it were long to recite all the acts of their villainous hypocrisy, at last the patience of God broke out upon them. One of the king’s secretaries undertook to bring into the town a supply of men and food, when he was gone. his way was straight to the enemy, he guided his treason so cunningly, that on a certain night he brought a party within the town, many were put to the edge of the sword, the king and the principal mis-leaders of the people were taken alive; the king was brought to acknowledge the most of his errors (SS), he offered upon con­dition of his life to make all the Anabaptists in Holland, Friesland, and England to be quiet and give over their way: but these vain promises were not trusted, and so after some cruel torture, he and Knipperdolling were killed, and hung up in a cage of iron up­on the highest pinnacle of the cathedral steeple (TT). That same very year 1535, Amsterdam in hazard to be a second Munster, the Anabaptists had a mighty design upon Amsterdam, and very narrowly did miss of their intention, to surprise that city, to be a seat of as glorious a kingdom as had been at Munster. But God assisted the citizens to prevent such a mischief, albeit not without great loss, for some hundreds were killed on both sides in these bloody uproars (VV). All this did not teach the Anabaptists wisdom. Still they did expect a new Jerusalem, and an earthly kingdom, their prophets filled the fancies of their people with this notion more than any other. One of their women at Apezell in Switzerland gave her self out for the Queen of the world and Messiah for all women, sending out her twelve she-Apostles for their conversion to her way (XX). I read also after the death of Becold of a second King in Utrecht, who was no less infamous for crimes than his predeces­sors, by open robberies he became rich, with his own hands he killed his poor wife that he might marry her daughter (YY). However the grievous absurdities of the Anabaptists both in their doctrine and practice, as also the evident judgments which God and man did pour upon them, and the very great industry which all the great and heroic divines of that happy time of Reformation did use to reclaim them, much retarded their pro­gress: yet it is marvelous to consider their incredible increase in many parts of Germany and elsewhere, til God of his mercy did divide them among themselves, and confound their languages: [Page 12] their divisions and subdivisions was that which most of all did weaken them and stop their course. After the taking of Munster one John Battenburg a bastard of a good family born at Leiden, made himself head of a strong party, and pretended a divine mission to propagate that earthly kingdom (ZZ), which by the fatal calamity of his townsman Becold, and his friends at Munster had been a little interrupted: between the followers of this Battenburg, and the remainder of the Monasterian Anabaptists arose the first discord. Their suffe­rings and disappointments made them more sober and wary then the zeal of Battenburg could approve of; for he professed that since the gospel preached by Becold had been rejected by the world, the time of mercy was now expired, and nothing but wrath remained: So that his commission from God was to kill all the world, only those who did yield to his way, and were rebaptized, he might admit to be slaves as Israel did the Gibeo­nites (AAA). Upon those grounds his followers where ever they dared be bold, did kill all whom they met with in the fields, did rob and steal what ever came to their hand, in country villages broke in upon sleeping people, pulled sundry out of their beds and drowned them in the first waters, or hanged them upon the first trees (BBB). They of Munster did not approve of all these pra­ctises, therefore they were condemned as cold, lukewarm hin­derers of the Kingdom of Christ (CCC). This discord lasted for several years, till the Monasterians expired, and the Battenbur­gicks were also rooted out as robbers and murderers by the sword of the Magistrate. The second division was greater, one Melchior Hoffman a skin­ner or glover in Suabland before the tragedy of Munster, The sect of the Hophmanists was a prime leader of the Anabaptists: In Strasburg about the year 1529 he seduced many, he leaned much upon Enthusiasms and dreams (DDD); he fancied that Strasburg was appointed of God to be the new Jerusalem; that himself and some others were quickly to get from heaven an extraordinary calling to an apostleship (EEE), that so from that town they might preach the gospel to all the world, which they were assured would in a short time be subdued to Christ by the power of the Spirit in their ministry without any outward force (FFF). The violent tu­mults of Munster, Hofman did not approve, these were the in­ventions [Page 13] of his scholar Mathie of Haarlem which he did always dislike (GGG), albeit whilst that doctrine of his scholar did pro­sper in Munster, he durst not much contradict it; but so soon as Munster was taken, and the chief authors of these violent te­nets were executed, he took then the boldness openly to cry down much of the way of the Monasterians, he preached for the office and power of the magistrate, and did chase away polyga­my (HHH); these were the grounds of the deadly feud betwixt Hoffman and Battenburg, and both their followers, which were many thousands of poor seduced souls. These of Hoffman’s party did not long agree among them­selves,Who were the Mennonites. one Menno the son of Simon a secular Priest (III) in West Friesland turning Anabaptist, began to criticize sundry things in Hoffman’s doctrine: he did reject all extraordinary and apostolic calling (KKK), also the dreams of the saints’ kingdom upon earth (LLL), and all enthusiasms (MMM), but in other things did follow the worst of the Anabaptists errors: denying the truth of Christ’s humanity, setting up Pelagianism in man’s free will, maintaining a perfect inherent righteousness without sin, and such like conceits (NNN). A Synod for union did divide them a­mongst them­selves more than ever. While the pestiferous vapor of this evil spirit was sensibly vanishing by domestic divisions, some of the wisest of the sect found ways to draw together the chief of all the four mentioned factions to a conference at Buckholt in West­phalia. A great synod of prime men from all countries where the Anabaptists lived did meet there; from the most places of lower Germany, from Friesland, from Saxony, from England also some did come (OOO). Great debates were among them, especially between the Battenburgicks and the Hoffmanites, the one defen­ding polygamy and their use of the sword against the world, the other opposing both. John Mathie of Middleburg a great do­ctor of the Anabaptists in England, was the chief champion of the Hoffmanites (PPP). Here it was where David George, a citizen of Delph, David Georgius labors for u­nion. did first become famous, this man had been a zealous opponent of pope­ry, he had openly in the streets upbraided both the priests and magistrates of Delph, in the very act of their idolatrous processi­on: for which bold zeal he was cast in prison, and had his tongue bored through, hardly escaping with his life (QQQ); these suf­ferings brought to him great respect among the Protestants at [Page 14] home, but thereafter turning Anabaptist he became the greatest and worst heretic to my mind that ever trod upon the earth. At the Synod of Buckholt he labored exceeding much to draw his brethren to concord; the Battenburgicks and Hoffmanites had so sharp debates about the magistrate, the earthly kingdom of the saints and polygamy, that hardly they could be kept from handy blows (RRR): David George did mediate between them, and drew it to this issue, that a mutual toleration being granted in the points controverted, in all other things they should hold one another for Brethren, and promote jointly the common cause of Anabaptism (SSS). This syncretism did not long stand, neither did David get thanks from either side for his mediation, for all did esteem him a colluder with both sides only for his own interests, driving a design of his own apart, differing from them all, which then was scarce visible above the ground, but quickly thereafter was apparent. A little after that synod all the parties did separate more then ever one from another as Antichristian and false believers (TTT), til the most of their sects did vanish: the Monasterians in a short time were drowned; of the Battenburgicks none does remain, except it be a handful in Moravia: for after the imprisonment and execution of their leader for his manifold robberies and murders, his followers were altogether broken. The Hoffmanites by the diligence of Bucer and Calvin at Strasburg being convinced received satisfaction and recanted their errors, joining themselves again to the Protestant Churches (VVV). The Georgians for a time did flourish, their leader David was a man very pragmatic, of a vehement and persuasive eloquence in the acts of devotion, for show singular, ardent and frequent in prayer (XXX), in fasting excessive, abstaining from all meat and drink sometimes four whole days and nights together (YYY): won­derfully confident of the absolute truth of his tenets, so marvel­ously bold that he did write and professed his hope by his letters and books to persuade the undeniable certainty of his dictates to the Emperor Charles the fifth, and to all the estates of the Empire (ZZZ), especially to the good Landgrave of Hesse, Phi­lip; yet his absurdi­ties were hor­rible. also to Melanchthon, to Bucer, to a Lasco, and many more: yet his tenets are so horribly absurd that Mohammad in his worst abo­minations was far below him, for he taught that in the godhead [Page 15] was no trinity of persons, but only three ways of manifestation, one in Moses, another in Jesus, a third in himself; that his person was as far above the person of Jesus, as Jesus was above Moses; that the writings of the prophets and apostles, that the doctrine of the law and gospel was all to be laid aside (AAAA) as childish and imperfect rudiments, to be dispelled as the twilight, by the beams of his far more perfect doctrine. One of the greatest perfections and singularities I mark in his doctrine is that which he much insists upon, the mortification of the flesh; to this he leads by a singular method, he looses the bands of matrimony, and all other natural and civil relations as things old and antiquated, which did oblige only during the time of Moses and of Jesus, but not under the clear light which his ministry had brought to the world; adulteries, fornications, incests, and most unspeakable villainies were so far from being any sins to him, that he did re­commend them to his most perfect scholars as acts of grace and mortification: he was given over to be possessed with so beastly a spirit in the justice of God for a recompense of his hypocrisy and blasphemous errors against the truth of God (BBBB). Notwithstanding of the unutterable absurdity of his way, yet this beast was confident that the whole world would submit to him, and in a short time would put into his hands without any violence all their power and wealth; and indeed at the beginning he got many families of good note to follow him with incredible zeal: for all of them were willing to dispose unto him their whole estates (CCCC), and were glad to seal his doctrine with their blood. In Delph when first they were put to a trial, seven and thirty most cheerfully did offer themselves to the executioner’s hands, some to be hanged, some drowned, some burnt (DDDD). Yet lest this zeal if too much tempted should at last succumb, the hypocritical heretic did alter one of his principles, and taught his scholars the lawfulness of dissimulation, permitting them for the safety of their life to deny and abjure what ever he had taught them, and giving them free liberty to join the public wor­ship with any of what ever religion among whom they li­ved (EEEE): by this means they got peace, and were no more any where persecuted. He himself retiring from Delph to Basel, his strange end did live there for several years until his death in great wealth and case (FFFF), as a fugitive for the true reformed religion; he [Page 16] did so perfectly dissemble, that he had the favor and good opi­nion both of the magistrates and ministers, without the least suspicion of any wickedness in him (GGGG); but three years after his death all his abominations were found out: and his di­ligence by letters, by secret conferences and messengers to propa­gate his evildoing way with his whole strength, whereupon his bones were dug up, and the remainder of his body burnt, as the relics of an inexpressibly wicked villain (HHHH). While all the other factions of the Anabaptists did decrease, the followers of the Priest Menno did much increase: they did reject the earthly kingdom and polygamy of the Monasterians and Battenburgicks, also the revelations and extraordinary calling of the Hoffmanites, with the most of the blasphemies of David George; against all these Menno did write with passion (IIII): But to the point of Anabaptism and separation from all other reformed Churches to independency, and to a number more of the Anabaptists tenets he did firmly adhere, alluring many thou­sands to his way, who continue to this day propagating their error to many Countries. The wickedness of that spirit which reigned in Menno, and yet rages in his followers, notwithstanding of all their profession of great piety, of singular modesty and extreme detestation of all the other sects of Anabaptists, is apparent in the manifold grievous heresies and gross schisms, whereinto they them­selves have of old broken out and persevere therein to this day. Who are pleased to read the late little accurate and learned Treatise of Clopenburgh, may perceive that the Mennonite dip­pers do oppose the truth of Christs human nature (KKKK), that they were masters to Vorstius in his denial of the omnipre­sence and simplicity of the divine essence and of the unchan­geableness of the divine decrees (LLLL): also that Armini­us was their scholar in all his errors concerning predestination, re­demption, grace, free will, and perseverance. Lastly, that Swenkfeld, Servetus, and Socinus did learn from them not only their Anabaptism, but their denial of the trinity, their abnegation of the godhead, both of the Son and of the Holy Ghost. (MMMM). The Mennonite schisms are no less palpable then their heresies, for however their harmony in the most of their errors be great [Page 17] enough, as in that confession of faith which in the year 1624. they set out in common it appears, wherein with many ambiguous and deceitful words they cover many of these tenets which in other writings they expressly maintain (NNNN), yet they are not able to cover their manifold schisms: for it has ever been their custom upon the smallest matters to fall into so vehement discords, as have made them excommunicate one another, and remain se­parations refusing communion one to another unto this day. Behold how small an occasion did bring them to no less then four irremediable fractions (OOOO): For a light cause four late separa­tions among them. one of the Mennonites at Franeker in a public roping did seem to use some cheating in buying of a house, preventing by some sleight of hand another man who before him had a mind to the bargain; this did so much displease some that they excommunicated the cheater; others defended the honesty of the man and did excommunicate them who for no cause as they conceived had put a censure upon him; hence two sects condemning one another to this day. To recon­cile both, a third party did arise, avowing that however the man in his bargain had used some piece of fraud, yet that it was not so gross as did deserve excommunication. In this accommodation these mid men proceeded so far, that they were excommunicated by both the dissenting parties, whereupon their passion was so stirred, that they did excommunicate them both also; and lest the number of their schisms should be too small, there arose a fourth party, who being displeased with the frequency of their brethren’s censures, did open the doors of their charity for all whom the rigor of others had excommunicated and cast out; by this over­lashing of their charity they did acquire from their companions the infamous title of Hamaxarii and Borboritae, as men who were content to take into their society cart loads full of polluted pro­fessors (PPPP). We will say no more of the Anabaptists over sea, their number in England till of late was not great; and the most of these were not English but Dutch strangers: for beside the hand of the state that ever lay heavy upon them, the labors of their children the separatists were always great for their reclaiming. Notwithstan­ding of all the contentions of the separatists among themselves, yet all of them did ever join to write sharp and large treatises [Page 18] against the Anabaptists; In this Ainsworth, Johnson, Robinson, Clifton did study who should be most zealous. Hence it was that the Anabaptists made little noise in Eng­land, till of late the Independents have corrupted and made worse the principles of the old separatists, proclaiming for errors a liberty both in church and state; under this shelter the Anabap­tists have lifted up their head, and increased their numbers, much above all other sects of the land. Their ways as yet are not well known, but a little time it seems will discover them, for their singular zeal to propagate their way will not permit them long to lurk: only the confession of faith which the other year seven of their congregations did put forth,Their late con­fession is nei­ther a full nor a clear declara­tion of their tenets and of late again a se­cond corrected edition have set out with a bold preface to both the Houses of Parliament may no more be taken for the measure of their faith, than that confession which their elder brethren in Holland did print not long ago in the name of all their compa­ny (QQQQ). For as the Dutch confession did dissemble a num­ber of the gross heresies which some of the very subscribers in their public writings both before and after did hold out, it is even so with the English, for Hobson, Richardson, and others of the sub­scribers have already printed several errors which in that con­fession do not appear. Moreover these seven congregations can­not prescribe, and are no ways leaders to a great number of Ana­baptist churches over all the land; however I shall set down so many of their tenets as for the time comes to my thoughts from some little acquaintance with a few of their writs that have fallen into my hands.</p></blockquote>

e to reclaim them, much retarded their pro­gress: yet it is marvelous to consider their incredible increase in many parts of Germany and elsewhere, til God of his mercy did divide them among themselves, and confound their languages: [Page 12] their divisions and subdivisions was that which most of all did weaken them and stop their course. After the taking of Munster one John Battenburg a bastard of a good family born at Leiden, made himself head of a strong party, and pretended a divine mission to propagate that earthly kingdom (ZZ), which by the fatal calamity of his townsman Becold, and his friends at Munster had been a little interrupted: between the followers of this Battenburg, and the remainder of the Monasterian Anabaptists arose the first discord. Their suffe­rings and disappointments made them more sober and wary then the zeal of Battenburg could approve of; for he professed that since the gospel preached by Becold had been rejected by the world, the time of mercy was now expired, and nothing but wrath remained: So that his commission from God was to kill all the world, only those who did yield to his way, and were rebaptized, he might admit to be slaves as Israel did the Gibeo­nites (AAA). Upon those grounds his followers where ever they dared be bold, did kill all whom they met with in the fields, did rob and steal what ever came to their hand, in country villages broke in upon sleeping people, pulled sundry out of their beds and drowned them in the first waters, or hanged them upon the first trees (BBB). They of Munster did not approve of all these pra­ctises, therefore they were condemned as cold, lukewarm hin­derers of the Kingdom of Christ (CCC). This discord lasted for several years, till the Monasterians expired, and the Battenbur­gicks were also rooted out as robbers and murderers by the sword of the Magistrate. The second division was greater, one Melchior Hoffman a skin­ner or glover in Suabland before the tragedy of Munster, The sect of the Hophmanists was a prime leader of the Anabaptists: In Strasburg about the year 1529 he seduced many, he leaned much upon Enthusiasms and dreams (DDD); he fancied that Strasburg was appointed of God to be the new Jerusalem; that himself and some others were quickly to get from heaven an extraordinary calling to an apostleship (EEE), that so from that town they might preach the gospel to all the world, which they were assured would in a short time be subdued to Christ by the power of the Spirit in their ministry without any outward force (FFF). The violent tu­mults of Munster, Hofman did not approve, these were the in­ventions [Page 13] of his scholar Mathie of Haarlem which he did always dislike (GGG), albeit whilst that doctrine of his scholar did pro­sper in Munster, he durst not much contradict it; but so soon as Munster was taken, and the chief authors of these violent te­nets were executed, he took then the boldness openly to cry down much of the way of the Monasterians, he preached for the office and power of the magistrate, and did chase away polyga­my (HHH); these were the grounds of the deadly feud betwixt Hoffman and Battenburg, and both their followers, which were many thousands of poor seduced souls. These of Hoffman’s party did not long agree among them­selves,Who were the Mennonites. one Menno the son of Simon a secular Priest (III) in West Friesland turning Anabaptist, began to criticize sundry things in Hoffman’s doctrine: he did reject all extraordinary and apostolic calling (KKK), also the dreams of the saints’ kingdom upon earth (LLL), and all enthusiasms (MMM), but in other things did follow the worst of the Anabaptists errors: denying the truth of Christ’s humanity, setting up Pelagianism in man’s free will, maintaining a perfect inherent righteousness without sin, and such like conceits (NNN). A Synod for union did divide them a­mongst them­selves more than ever. While the pestiferous vapor of this evil spirit was sensibly vanishing by domestic divisions, some of the wisest of the sect found ways to draw together the chief of all the four mentioned factions to a conference at Buckholt in West­phalia. A great synod of prime men from all countries where the Anabaptists lived did meet there; from the most places of lower Germany, from Friesland, from Saxony, from England also some did come (OOO). Great debates were among them, especially between the Battenburgicks and the Hoffmanites, the one defen­ding polygamy and their use of the sword against the world, the other opposing both. John Mathie of Middleburg a great do­ctor of the Anabaptists in England, was the chief champion of the Hoffmanites (PPP). Here it was where David George, a citizen of Delph, David Georgius labors for u­nion. did first become famous, this man had been a zealous opponent of pope­ry, he had openly in the streets upbraided both the priests and magistrates of Delph, in the very act of their idolatrous processi­on: for which bold zeal he was cast in prison, and had his tongue bored through, hardly escaping with his life (QQQ); these suf­ferings brought to him great respect among the Protestants at [Page 14] home, but thereafter turning Anabaptist he became the greatest and worst heretic to my mind that ever trod upon the earth. At the Synod of Buckholt he labored exceeding much to draw his brethren to concord; the Battenburgicks and Hoffmanites had so sharp debates about the magistrate, the earthly kingdom of the saints and polygamy, that hardly they could be kept from handy blows (RRR): David George did mediate between them, and drew it to this issue, that a mutual toleration being granted in the points controverted, in all other things they should hold one another for Brethren, and promote jointly the common cause of Anabaptism (SSS). This syncretism did not long stand, neither did David get thanks from either side for his mediation, for all did esteem him a colluder with both sides only for his own interests, driving a design of his own apart, differing from them all, which then was scarce visible above the ground, but quickly thereafter was apparent. A little after that synod all the parties did separate more then ever one from another as Antichristian and false believers (TTT), til the most of their sects did vanish: the Monasterians in a short time were drowned; of the Battenburgicks none does remain, except it be a handful in Moravia: for after the imprisonment and execution of their leader for his manifold robberies and murders, his followers were altogether broken. The Hoffmanites by the diligence of Bucer and Calvin at Strasburg being convinced received satisfaction and recanted their errors, joining themselves again to the Protestant Churches (VVV). The Georgians for a time did flourish, their leader David was a man very pragmatic, of a vehement and persuasive eloquence in the acts of devotion, for show singular, ardent and frequent in prayer (XXX), in fasting excessive, abstaining from all meat and drink sometimes four whole days and nights together (YYY): won­derfully confident of the absolute truth of his tenets, so marvel­ously bold that he did write and professed his hope by his letters and books to persuade the undeniable certainty of his dictates to the Emperor Charles the fifth, and to all the estates of the Empire (ZZZ), especially to the good Landgrave of Hesse, Phi­lip; yet his absurdi­ties were hor­rible. also to Melanchthon, to Bucer, to a Lasco, and many more: yet his tenets are so horribly absurd that Mohammad in his worst abo­minations was far below him, for he taught that in the godhead [Page 15] was no trinity of persons, but only three ways of manifestation, one in Moses, another in Jesus, a third in himself; that his person was as far above the person of Jesus, as Jesus was above Moses; that the writings of the prophets and apostles, that the doctrine of the law and gospel was all to be laid aside (AAAA) as childish and imperfect rudiments, to be dispelled as the twilight, by the beams of his far more perfect doctrine. One of the greatest perfections and singularities I mark in his doctrine is that which he much insists upon, the mortification of the flesh; to this he leads by a singular method, he looses the bands of matrimony, and all other natural and civil relations as things old and antiquated, which did oblige only during the time of Moses and of Jesus, but not under the clear light which his ministry had brought to the world; adulteries, fornications, incests, and most unspeakable villainies were so far from being any sins to him, that he did re­commend them to his most perfect scholars as acts of grace and mortification: he was given over to be possessed with so beastly a spirit in the justice of God for a recompense of his hypocrisy and blasphemous errors against the truth of God (BBBB). Notwithstanding of the unutterable absurdity of his way, yet this beast was confident that the whole world would submit to him, and in a short time would put into his hands without any violence all their power and wealth; and indeed at the beginning he got many families of good note to follow him with incredible zeal: for all of them were willing to dispose unto him their whole estates (CCCC), and were glad to seal his doctrine with their blood. In Delph when first they were put to a trial, seven and thirty most cheerfully did offer themselves to the executioner’s hands, some to be hanged, some drowned, some burnt (DDDD). Yet lest this zeal if too much tempted should at last succumb, the hypocritical heretic did alter one of his principles, and taught his scholars the lawfulness of dissimulation, permitting them for the safety of their life to deny and abjure what ever he had taught them, and giving them free liberty to join the public wor­ship with any of what ever religion among whom they li­ved (EEEE): by this means they got peace, and were no more any where persecuted. He himself retiring from Delph to Basel, his strange end did live there for several years until his death in great wealth and case (FFFF), as a fugitive for the true reformed religion; he [Page 16] did so perfectly dissemble, that he had the favor and good opi­nion both of the magistrates and ministers, without the least suspicion of any wickedness in him (GGGG); but three years after his death all his abominations were found out: and his di­ligence by letters, by secret conferences and messengers to propa­gate his evildoing way with his whole strength, whereupon his bones were dug up, and the remainder of his body burnt, as the relics of an inexpressibly wicked villain (HHHH). While all the other factions of the Anabaptists did decrease, the followers of the Priest Menno did much increase: they did reject the earthly kingdom and polygamy of the Monasterians and Battenburgicks, also the revelations and extraordinary calling of the Hoffmanites, with the most of the blasphemies of David George; against all these Menno did write with passion (IIII): But to the point of Anabaptism and separation from all other reformed Churches to independency, and to a number more of the Anabaptists tenets he did firmly adhere, alluring many thou­sands to his way, who continue to this day propagating their error to many Countries. The wickedness of that spirit which reigned in Menno, and yet rages in his followers, notwithstanding of all their profession of great piety, of singular modesty and extreme detestation of all the other sects of Anabaptists, is apparent in the manifold grievous heresies and gross schisms, whereinto they them­selves have of old broken out and persevere therein to this day. Who are pleased to read the late little accurate and learned Treatise of Clopenburgh, may perceive that the Mennonite dip­pers do oppose the truth of Christs human nature (KKKK), that they were masters to Vorstius in his denial of the omnipre­sence and simplicity of the divine essence and of the unchan­geableness of the divine decrees (LLLL): also that Armini­us was their scholar in all his errors concerning predestination, re­demption, grace, free will, and perseverance. Lastly, that Swenkfeld, Servetus, and Socinus did learn from them not only their Anabaptism, but their denial of the trinity, their abnegation of the godhead, both of the Son and of the Holy Ghost. (MMMM). The Mennonite schisms are no less palpable then their heresies, for however their harmony in the most of their errors be great [Page 17] enough, as in that confession of faith which in the year 1624. they set out in common it appears, wherein with many ambiguous and deceitful words they cover many of these tenets which in other writings they expressly maintain (NNNN), yet they are not able to cover their manifold schisms: for it has ever been their custom upon the smallest matters to fall into so vehement discords, as have made them excommunicate one another, and remain se­parations refusing communion one to another unto this day. Behold how small an occasion did bring them to no less then four irremediable fractions (OOOO): For a light cause four late separa­tions among them. one of the Mennonites at Franeker in a public roping did seem to use some cheating in buying of a house, preventing by some sleight of hand another man who before him had a mind to the bargain; this did so much displease some that they excommunicated the cheater; others defended the honesty of the man and did excommunicate them who for no cause as they conceived had put a censure upon him; hence two sects condemning one another to this day. To recon­cile both, a third party did arise, avowing that however the man in his bargain had used some piece of fraud, yet that it was not so gross as did deserve excommunication. In this accommodation these mid men proceeded so far, that they were excommunicated by both the dissenting parties, whereupon their passion was so stirred, that they did excommunicate them both also; and lest the number of their schisms should be too small, there arose a fourth party, who being displeased with the frequency of their brethren’s censures, did open the doors of their charity for all whom the rigor of others had excommunicated and cast out; by this over­lashing of their charity they did acquire from their companions the infamous title of Hamaxarii and Borboritae, as men who were content to take into their society cart loads full of polluted pro­fessors (PPPP). We will say no more of the Anabaptists over sea, their number in England till of late was not great; and the most of these were not English but Dutch strangers: for beside the hand of the state that ever lay heavy upon them, the labors of their children the separatists were always great for their reclaiming. Notwithstan­ding of all the contentions of the separatists among themselves, yet all of them did ever join to write sharp and large treatises [Page 18] against the Anabaptists; In this Ainsworth, Johnson, Robinson, Clifton did study who should be most zealous. Hence it was that the Anabaptists made little noise in Eng­land, till of late the Independents have corrupted and made worse the principles of the old separatists, proclaiming for errors a liberty both in church and state; under this shelter the Anabap­tists have lifted up their head, and increased their numbers, much above all other sects of the land. Their ways as yet are not well known, but a little time it seems will discover them, for their singular zeal to propagate their way will not permit them long to lurk: only the confession of faith which the other year seven of their congregations did put forth,Their late con­fession is nei­ther a full nor a clear declara­tion of their tenets and of late again a se­cond corrected edition have set out with a bold preface to both the Houses of Parliament may no more be taken for the measure of their faith, than that confession which their elder brethren in Holland did print not long ago in the name of all their compa­ny (QQQQ). For as the Dutch confession did dissemble a num­ber of the gross heresies which some of the very subscribers in their public writings both before and after did hold out, it is even so with the English, for Hobson, Richardson, and others of the sub­scribers have already printed several errors which in that con­fession do not appear. Moreover these seven congregations can­not prescribe, and are no ways leaders to a great number of Ana­baptist churches over all the land; however I shall set down so many of their tenets as for the time comes to my thoughts from some little acquaintance with a few of their writs that have fallen into my hands.”

— Robert Baillie, Anabaptism, The True Fountain of Independency, Brownisme, Antinomy, Familism, and the most of the other Errors Which For The Time Do Trouble the Church of England, Unsealed (London, 1647), 9–18. NB: For ease of reading and because archaic words spelling tend to make older writers seem unintelligent,">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+all+this+so+strong+was+the+delusion%2C+the+blinded+people+did+not+open+their+eyes.+Becold+and+Knipperdolling+did+daily+preach+new+visions%2C+Becold+lying+in+a+trance+three+days.+When+he+awakened+he+appeared+to+be+mute%2C+but+by+writing+tables+he+signi%C2%ADfied+it+was+the+command+of+God+to+change+yet+further+the+Government+of+the+city%2C+he+set+down+the+names+of+twelve+of+his+greatest+confidents+to+be+governors+and+princes+over+the+twelve+Tribes+of+Israel+%28MM%29%3A+This+was+no+sooner+proposed+then+executed.+So+soon+as+the+holy+Prophet+got+his+mouth+opened%2C+the+first+motion+he+makes%2C+was+that+the+preachers+would+consider+if+it+were+not+the+will+of+God+for+the+increase+of+the+holy+seed%2C+that+every+one+of+the+saints+should+have+more+wives%3A+at+the+first%2C+the+preachers+opposed+this+abomination%2C+but+thereafter+by+threats+and+flatteries+they+were+brought+to+yield.+Becold+began%2C+and+at+one+time+married+three%2C+but+at+once+he+came+to+the+number+of+fifteen+together+%28NN%29.+The+great+prophet%E2%80%99s+example+was+follow%C2%ADed+by+many%2C+and+by+all+that+would%3A+many+honest+matrons+were+forced+to+marry+with+any+of+these+villains+who+liked+them.+This+unheard+of+wickedness+did+so+embitter+the+spirits+of+the+remain%C2%ADder+of+ingenuous+men%2C+that+they+rose+up+in+a+conspiracy%2C+and+laid+%5BPage+10%5D+hold+on+Becold%2C+Knipperdolling+and+the+rest+of+their+false+prophets%3A+but+behold%2C+the+common+people+got+up+in+a+tumult%2C+rescued+the+prophets%2C+and+killed+forty+nine+of+the+most+honest+citizens+for+their+assaying+to+put+some+end+to+their+intolerable+disorders+%28OO%29.+Nothing+more+advances+the+affairs+of+tyrants%2C+then+a+faint+impru%C2%ADdent+and+unsuccessful+resistance%3A+Becold+by+this+unhappy+attempt+of+his+enemies+having+confirmed+his+authority%2C+suborned+one+of+the+prophets+to+preach+to+the+people%2C+that+it+was+the+command+of+God+to+make+Becold+the+king+of+the+whole+earth%2C+promising+that+all+the+kings+and+potentates+of+the+world+should+certainly+be+subdued+by+his+sword%2C+for+he+was+the+man+that+should+rule+all+nations+with+a+rod+of+iron+%28PP%29.+Becold%2C+at+the+hearing+of+these+news%2C+humbled+himself+to+the+ground%2C+adored+the+truth+of+that+prophecy%2C+declared+his+information+thereof+by+God+ten+days+be%C2%ADfore%2C+but+the+matter+concerning+his+own+person+he+had+hitherto+been+silent%2C+yet+all+now+being+made+public+by+the+mouth+of+another+prophet%2C+he+did+submit+himself+to+the+will+of+God.+No+minute+of+time+was+delayed%2C+the+twelve+princes+were+cashie%C2%ADred%2C+the+Catholic+monarch+did+choose+his+chancellor%2C+treasu%C2%ADrer%2C+secretary%2C+and+other+officers+of+state+and+court%2C+a+fair+high+throne+was+set+up+in+the+market-place%2C+and+covered+all+over+with+cloth+of+gold%3B+Becold+made+for+himself%2C+being+a+tailor+by+his+trade%2C+very+royal+suits+of+most+gorgeous+apparel+of+the+priests%E2%80%99+vestments%2C+which+he+had+robbed+in+the+cathedral%3A+a+stately+crown%2C+scepter+and+sword+were+prepared+for+him%2C+his+courtiers+were+all+put+in+most+sumptuous+raiment%2C+no+greater+magnifi%C2%ADcence+was+to+be+seen+at+any+princes+court+in+the+world+%28QQ%29.+Thus+Becold+attained+the+top+of+his+ambition+and+lust%2C+but+the+great+skill+was+how+to+keep+what+was+gotten%3A+for+this+end+twen%C2%ADty+eight+apostles+were+sent+abroad+to+preach+over+the+world+obe%C2%ADdience+to+the+King+of+Munster+the+new+Jerusalem%3B+but+here+was+the+bad+luck%2C+all+of+them+but+one+who+returned+with+the+tidings+were+killed+in+the+places+where+first+they+offered+to+preach.+In+the+meantime+the+town+begun+to+be+pinched+with+famine%2C+one+of+the+king%E2%80%99s+wives+being+reported+for+a+word+of+compassion+upon+the+starving+multitude%2C+was+brought+forth+to+the+marketplace%2C+and+by+Becold%E2%80%99s+own+hand+had+her+head+struck+off+%28RR%29.+All+the+rest+of+his+wives+did+sing+a+psalm+to+God+for+this+so+excellent+an+act+of+justice.+The+King+himself+led+all+fourteen+in+a+dance+%5BPage+11%5D+through+the+streets+of+the+town%3B+it+were+long+to+recite+all+the+acts+of+their+villainous+hypocrisy%2C+at+last+the+patience+of+God+broke+out+upon+them.+One+of+the+king%E2%80%99s+secretaries+undertook+to+bring+into+the+town+a+supply+of+men+and+food%2C+when+he+was+gone.+his+way+was+straight+to+the+enemy%2C+he+guided+his+treason+so+cunningly%2C+that+on+a+certain+night+he+brought+a+party+within+the+town%2C+many+were+put+to+the+edge+of+the+sword%2C+the+king+and+the+principal+mis-leaders+of+the+people+were+taken+alive%3B+the+king+was+brought+to+acknowledge+the+most+of+his+errors+%28SS%29%2C+he+offered+upon+con%C2%ADdition+of+his+life+to+make+all+the+Anabaptists+in+Holland%2C+Friesland%2C+and+England+to+be+quiet+and+give+over+their+way%3A+but+these+vain+promises+were+not+trusted%2C+and+so+after+some+cruel+torture%2C+he+and+Knipperdolling+were+killed%2C+and+hung+up+in+a+cage+of+iron+up%C2%ADon+the+highest+pinnacle+of+the+cathedral+steeple+%28TT%29.+That+same+very+year+1535%2C+Amsterdam+in+hazard+to+be+a+second+Munster%2C+the+Anabaptists+had+a+mighty+design+upon+Amsterdam%2C+and+very+narrowly+did+miss+of+their+intention%2C+to+surprise+that+city%2C+to+be+a+seat+of+as+glorious+a+kingdom+as+had+been+at+Munster.+But+God+assisted+the+citizens+to+prevent+such+a+mischief%2C+albeit+not+without+great+loss%2C+for+some+hundreds+were+killed+on+both+sides+in+these+bloody+uproars+%28VV%29.+All+this+did+not+teach+the+Anabaptists+wisdom.+Still+they+did+expect+a+new+Jerusalem%2C+and+an+earthly+kingdom%2C+their+prophets+filled+the+fancies+of+their+people+with+this+notion+more+than+any+other.+One+of+their+women+at+Apezell+in+Switzerland+gave+her+self+out+for+the+Queen+of+the+world+and+Messiah+for+all+women%2C+sending+out+her+twelve+she-Apostles+for+their+conversion+to+her+way+%28XX%29.+I+read+also+after+the+death+of+Becold+of+a+second+King+in+Utrecht%2C+who+was+no+less+infamous+for+crimes+than+his+predeces%C2%ADsors%2C+by+open+robberies+he+became+rich%2C+with+his+own+hands+he+killed+his+poor+wife+that+he+might+marry+her+daughter+%28YY%29.+However+the+grievous+absurdities+of+the+Anabaptists+both+in+their+doctrine+and+practice%2C+as+also+the+evident+judgments+which+God+and+man+did+pour+upon+them%2C+and+the+very+great+industry+which+all+the+great+and+heroic+divines+of+that+happy+time+of+Reformation+did+use+to+reclaim+them%2C+much+retarded+their+pro%C2%ADgress%3A+yet+it+is+marvelous+to+consider+their+incredible+increase+in+many+parts+of+Germany+and+elsewhere%2C+til+God+of+his+mercy+did+divide+them+among+themselves%2C+and+confound+their+languages%3A+%5BPage+12%5D+their+divisions+and+subdivisions+was+that+which+most+of+all+did+weaken+them+and+stop+their+course.+After+the+taking+of+Munster+one+John+Battenburg+a+bastard+of+a+good+family+born+at+Leiden%2C+made+himself+head+of+a+strong+party%2C+and+pretended+a+divine+mission+to+propagate+that+earthly+kingdom+%28ZZ%29%2C+which+by+the+fatal+calamity+of+his+townsman+Becold%2C+and+his+friends+at+Munster+had+been+a+little+interrupted%3A+between+the+followers+of+this+Battenburg%2C+and+the+remainder+of+the+Monasterian+Anabaptists+arose+the+first+discord.+Their+suffe%C2%ADrings+and+disappointments+made+them+more+sober+and+wary+then+the+zeal+of+Battenburg+could+approve+of%3B+for+he+professed+that+since+the+gospel+preached+by+Becold+had+been+rejected+by+the+world%2C+the+time+of+mercy+was+now+expired%2C+and+nothing+but+wrath+remained%3A+So+that+his+commission+from+God+was+to+kill+all+the+world%2C+only+those+who+did+yield+to+his+way%2C+and+were+rebaptized%2C+he+might+admit+to+be+slaves+as+Israel+did+the+Gibeo%C2%ADnites+%28AAA%29.+Upon+those+grounds+his+followers+where+ever+they+dared+be+bold%2C+did+kill+all+whom+they+met+with+in+the+fields%2C+did+rob+and+steal+what+ever+came+to+their+hand%2C+in+country+villages+broke+in+upon+sleeping+people%2C+pulled+sundry+out+of+their+beds+and+drowned+them+in+the+first+waters%2C+or+hanged+them+upon+the+first+trees+%28BBB%29.+They+of+Munster+did+not+approve+of+all+these+pra%C2%ADctises%2C+therefore+they+were+condemned+as+cold%2C+lukewarm+hin%C2%ADderers+of+the+Kingdom+of+Christ+%28CCC%29.+This+discord+lasted+for+several+years%2C+till+the+Monasterians+expired%2C+and+the+Battenbur%C2%ADgicks+were+also+rooted+out+as+robbers+and+murderers+by+the+sword+of+the+Magistrate.+The+second+division+was+greater%2C+one+Melchior+Hoffman+a+skin%C2%ADner+or+glover+in+Suabland+before+the+tragedy+of+Munster%2C+The+sect+of+the+Hophmanists+was+a+prime+leader+of+the+Anabaptists%3A+In+Strasburg+about+the+year+1529+he+seduced+many%2C+he+leaned+much+upon+Enthusiasms+and+dreams+%28DDD%29%3B+he+fancied+that+Strasburg+was+appointed+of+God+to+be+the+new+Jerusalem%3B+that+himself+and+some+others+were+quickly+to+get+from+heaven+an+extraordinary+calling+to+an+apostleship+%28EEE%29%2C+that+so+from+that+town+they+might+preach+the+gospel+to+all+the+world%2C+which+they+were+assured+would+in+a+short+time+be+subdued+to+Christ+by+the+power+of+the+Spirit+in+their+ministry+without+any+outward+force+%28FFF%29.+The+violent+tu%C2%ADmults+of+Munster%2C+Hofman+did+not+approve%2C+these+were+the+in%C2%ADventions+%5BPage+13%5D+of+his+scholar+Mathie+of+Haarlem+which+he+did+always+dislike+%28GGG%29%2C+albeit+whilst+that+doctrine+of+his+scholar+did+pro%C2%ADsper+in+Munster%2C+he+durst+not+much+contradict+it%3B+but+so+soon+as+Munster+was+taken%2C+and+the+chief+authors+of+these+violent+te%C2%ADnets+were+executed%2C+he+took+then+the+boldness+openly+to+cry+down+much+of+the+way+of+the+Monasterians%2C+he+preached+for+the+office+and+power+of+the+magistrate%2C+and+did+chase+away+polyga%C2%ADmy+%28HHH%29%3B+these+were+the+grounds+of+the+deadly+feud+betwixt+Hoffman+and+Battenburg%2C+and+both+their+followers%2C+which+were+many+thousands+of+poor+seduced+souls.+These+of+Hoffman%E2%80%99s+party+did+not+long+agree+among+them%C2%ADselves%2CWho+were+the+Mennonites.+one+Menno+the+son+of+Simon+a+secular+Priest+%28III%29+in+West+Friesland+turning+Anabaptist%2C+began+to+criticize+sundry+things+in+Hoffman%E2%80%99s+doctrine%3A+he+did+reject+all+extraordinary+and+apostolic+calling+%28KKK%29%2C+also+the+dreams+of+the+saints%E2%80%99+kingdom+upon+earth+%28LLL%29%2C+and+all+enthusiasms+%28MMM%29%2C+but+in+other+things+did+follow+the+worst+of+the+Anabaptists+errors%3A+denying+the+truth+of+Christ%E2%80%99s+humanity%2C+setting+up+Pelagianism+in+man%E2%80%99s+free+will%2C+maintaining+a+perfect+inherent+righteousness+without+sin%2C+and+such+like+conceits+%28NNN%29.+A+Synod+for+union+did+divide+them+a%C2%ADmongst+them%C2%ADselves+more+than+ever.+While+the+pestiferous+vapor+of+this+evil+spirit+was+sensibly+vanishing+by+domestic+divisions%2C+some+of+the+wisest+of+the+sect+found+ways+to+draw+together+the+chief+of+all+the+four+mentioned+factions+to+a+conference+at+Buckholt+in+West%C2%ADphalia.+A+great+synod+of+prime+men+from+all+countries+where+the+Anabaptists+lived+did+meet+there%3B+from+the+most+places+of+lower+Germany%2C+from+Friesland%2C+from+Saxony%2C+from+England+also+some+did+come+%28OOO%29.+Great+debates+were+among+them%2C+especially+between+the+Battenburgicks+and+the+Hoffmanites%2C+the+one+defen%C2%ADding+polygamy+and+their+use+of+the+sword+against+the+world%2C+the+other+opposing+both.+John+Mathie+of+Middleburg+a+great+do%C2%ADctor+of+the+Anabaptists+in+England%2C+was+the+chief+champion+of+the+Hoffmanites+%28PPP%29.+Here+it+was+where+David+George%2C+a+citizen+of+Delph%2C+David+Georgius+labors+for+u%C2%ADnion.+did+first+become+famous%2C+this+man+had+been+a+zealous+opponent+of+pope%C2%ADry%2C+he+had+openly+in+the+streets+upbraided+both+the+priests+and+magistrates+of+Delph%2C+in+the+very+act+of+their+idolatrous+processi%C2%ADon%3A+for+which+bold+zeal+he+was+cast+in+prison%2C+and+had+his+tongue+bored+through%2C+hardly+escaping+with+his+life+%28QQQ%29%3B+these+suf%C2%ADferings+brought+to+him+great+respect+among+the+Protestants+at+%5BPage+14%5D+home%2C+but+thereafter+turning+Anabaptist+he+became+the+greatest+and+worst+heretic+to+my+mind+that+ever+trod+upon+the+earth.+At+the+Synod+of+Buckholt+he+labored+exceeding+much+to+draw+his+brethren+to+concord%3B+the+Battenburgicks+and+Hoffmanites+had+so+sharp+debates+about+the+magistrate%2C+the+earthly+kingdom+of+the+saints+and+polygamy%2C+that+hardly+they+could+be+kept+from+handy+blows+%28RRR%29%3A+David+George+did+mediate+between+them%2C+and+drew+it+to+this+issue%2C+that+a+mutual+toleration+being+granted+in+the+points+controverted%2C+in+all+other+things+they+should+hold+one+another+for+Brethren%2C+and+promote+jointly+the+common+cause+of+Anabaptism+%28SSS%29.+This+syncretism+did+not+long+stand%2C+neither+did+David+get+thanks+from+either+side+for+his+mediation%2C+for+all+did+esteem+him+a+colluder+with+both+sides+only+for+his+own+interests%2C+driving+a+design+of+his+own+apart%2C+differing+from+them+all%2C+which+then+was+scarce+visible+above+the+ground%2C+but+quickly+thereafter+was+apparent.+A+little+after+that+synod+all+the+parties+did+separate+more+then+ever+one+from+another+as+Antichristian+and+false+believers+%28TTT%29%2C+til+the+most+of+their+sects+did+vanish%3A+the+Monasterians+in+a+short+time+were+drowned%3B+of+the+Battenburgicks+none+does+remain%2C+except+it+be+a+handful+in+Moravia%3A+for+after+the+imprisonment+and+execution+of+their+leader+for+his+manifold+robberies+and+murders%2C+his+followers+were+altogether+broken.+The+Hoffmanites+by+the+diligence+of+Bucer+and+Calvin+at+Strasburg+being+convinced+received+satisfaction+and+recanted+their+errors%2C+joining+themselves+again+to+the+Protestant+Churches+%28VVV%29.+The+Georgians+for+a+time+did+flourish%2C+their+leader+David+was+a+man+very+pragmatic%2C+of+a+vehement+and+persuasive+eloquence+in+the+acts+of+devotion%2C+for+show+singular%2C+ardent+and+frequent+in+prayer+%28XXX%29%2C+in+fasting+excessive%2C+abstaining+from+all+meat+and+drink+sometimes+four+whole+days+and+nights+together+%28YYY%29%3A+won%C2%ADderfully+confident+of+the+absolute+truth+of+his+tenets%2C+so+marvel%C2%ADously+bold+that+he+did+write+and+professed+his+hope+by+his+letters+and+books+to+persuade+the+undeniable+certainty+of+his+dictates+to+the+Emperor+Charles+the+fifth%2C+and+to+all+the+estates+of+the+Empire+%28ZZZ%29%2C+especially+to+the+good+Landgrave+of+Hesse%2C+Phi%C2%ADlip%3B+yet+his+absurdi%C2%ADties+were+hor%C2%ADrible.+also+to+Melanchthon%2C+to+Bucer%2C+to+a+Lasco%2C+and+many+more%3A+yet+his+tenets+are+so+horribly+absurd+that+Mohammad+in+his+worst+abo%C2%ADminations+was+far+below+him%2C+for+he+taught+that+in+the+godhead+%5BPage+15%5D+was+no+trinity+of+persons%2C+but+only+three+ways+of+manifestation%2C+one+in+Moses%2C+another+in+Jesus%2C+a+third+in+himself%3B+that+his+person+was+as+far+above+the+person+of+Jesus%2C+as+Jesus+was+above+Moses%3B+that+the+writings+of+the+prophets+and+apostles%2C+that+the+doctrine+of+the+law+and+gospel+was+all+to+be+laid+aside+%28AAAA%29+as+childish+and+imperfect+rudiments%2C+to+be+dispelled+as+the+twilight%2C+by+the+beams+of+his+far+more+perfect+doctrine.+One+of+the+greatest+perfections+and+singularities+I+mark+in+his+doctrine+is+that+which+he+much+insists+upon%2C+the+mortification+of+the+flesh%3B+to+this+he+leads+by+a+singular+method%2C+he+looses+the+bands+of+matrimony%2C+and+all+other+natural+and+civil+relations+as+things+old+and+antiquated%2C+which+did+oblige+only+during+the+time+of+Moses+and+of+Jesus%2C+but+not+under+the+clear+light+which+his+ministry+had+brought+to+the+world%3B+adulteries%2C+fornications%2C+incests%2C+and+most+unspeakable+villainies+were+so+far+from+being+any+sins+to+him%2C+that+he+did+re%C2%ADcommend+them+to+his+most+perfect+scholars+as+acts+of+grace+and+mortification%3A+he+was+given+over+to+be+possessed+with+so+beastly+a+spirit+in+the+justice+of+God+for+a+recompense+of+his+hypocrisy+and+blasphemous+errors+against+the+truth+of+God+%28BBBB%29.+Notwithstanding+of+the+unutterable+absurdity+of+his+way%2C+yet+this+beast+was+confident+that+the+whole+world+would+submit+to+him%2C+and+in+a+short+time+would+put+into+his+hands+without+any+violence+all+their+power+and+wealth%3B+and+indeed+at+the+beginning+he+got+many+families+of+good+note+to+follow+him+with+incredible+zeal%3A+for+all+of+them+were+willing+to+dispose+unto+him+their+whole+estates+%28CCCC%29%2C+and+were+glad+to+seal+his+doctrine+with+their+blood.+In+Delph+when+first+they+were+put+to+a+trial%2C+seven+and+thirty+most+cheerfully+did+offer+themselves+to+the+executioner%E2%80%99s+hands%2C+some+to+be+hanged%2C+some+drowned%2C+some+burnt+%28DDDD%29.+Yet+lest+this+zeal+if+too+much+tempted+should+at+last+succumb%2C+the+hypocritical+heretic+did+alter+one+of+his+principles%2C+and+taught+his+scholars+the+lawfulness+of+dissimulation%2C+permitting+them+for+the+safety+of+their+life+to+deny+and+abjure+what+ever+he+had+taught+them%2C+and+giving+them+free+liberty+to+join+the+public+wor%C2%ADship+with+any+of+what+ever+religion+among+whom+they+li%C2%ADved+%28EEEE%29%3A+by+this+means+they+got+peace%2C+and+were+no+more+any+where+persecuted.+He+himself+retiring+from+Delph+to+Basel%2C+his+strange+end+did+live+there+for+several+years+until+his+death+in+great+wealth+and+case+%28FFFF%29%2C+as+a+fugitive+for+the+true+reformed+religion%3B+he+%5BPage+16%5D+did+so+perfectly+dissemble%2C+that+he+had+the+favor+and+good+opi%C2%ADnion+both+of+the+magistrates+and+ministers%2C+without+the+least+suspicion+of+any+wickedness+in+him+%28GGGG%29%3B+but+three+years+after+his+death+all+his+abominations+were+found+out%3A+and+his+di%C2%ADligence+by+letters%2C+by+secret+conferences+and+messengers+to+propa%C2%ADgate+his+evildoing+way+with+his+whole+strength%2C+whereupon+his+bones+were+dug+up%2C+and+the+remainder+of+his+body+burnt%2C+as+the+relics+of+an+inexpressibly+wicked+villain+%28HHHH%29.+While+all+the+other+factions+of+the+Anabaptists+did+decrease%2C+the+followers+of+the+Priest+Menno+did+much+increase%3A+they+did+reject+the+earthly+kingdom+and+polygamy+of+the+Monasterians+and+Battenburgicks%2C+also+the+revelations+and+extraordinary+calling+of+the+Hoffmanites%2C+with+the+most+of+the+blasphemies+of+David+George%3B+against+all+these+Menno+did+write+with+passion+%28IIII%29%3A+But+to+the+point+of+Anabaptism+and+separation+from+all+other+reformed+Churches+to+independency%2C+and+to+a+number+more+of+the+Anabaptists+tenets+he+did+firmly+adhere%2C+alluring+many+thou%C2%ADsands+to+his+way%2C+who+continue+to+this+day+propagating+their+error+to+many+Countries.+The+wickedness+of+that+spirit+which+reigned+in+Menno%2C+and+yet+rages+in+his+followers%2C+notwithstanding+of+all+their+profession+of+great+piety%2C+of+singular+modesty+and+extreme+detestation+of+all+the+other+sects+of+Anabaptists%2C+is+apparent+in+the+manifold+grievous+heresies+and+gross+schisms%2C+whereinto+they+them%C2%ADselves+have+of+old+broken+out+and+persevere+therein+to+this+day.+Who+are+pleased+to+read+the+late+little+accurate+and+learned+Treatise+of+Clopenburgh%2C+may+perceive+that+the+Mennonite+dip%C2%ADpers+do+oppose+the+truth+of+Christs+human+nature+%28KKKK%29%2C+that+they+were+masters+to+Vorstius+in+his+denial+of+the+omnipre%C2%ADsence+and+simplicity+of+the+divine+essence+and+of+the+unchan%C2%ADgeableness+of+the+divine+decrees+%28LLLL%29%3A+also+that+Armini%C2%ADus+was+their+scholar+in+all+his+errors+concerning+predestination%2C+re%C2%ADdemption%2C+grace%2C+free+will%2C+and+perseverance.+Lastly%2C+that+Swenkfeld%2C+Servetus%2C+and+Socinus+did+learn+from+them+not+only+their+Anabaptism%2C+but+their+denial+of+the+trinity%2C+their+abnegation+of+the+godhead%2C+both+of+the+Son+and+of+the+Holy+Ghost.+%28MMMM%29.+The+Mennonite+schisms+are+no+less+palpable+then+their+heresies%2C+for+however+their+harmony+in+the+most+of+their+errors+be+great+%5BPage+17%5D+enough%2C+as+in+that+confession+of+faith+which+in+the+year+1624.+they+set+out+in+common+it+appears%2C+wherein+with+many+ambiguous+and+deceitful+words+they+cover+many+of+these+tenets+which+in+other+writings+they+expressly+maintain+%28NNNN%29%2C+yet+they+are+not+able+to+cover+their+manifold+schisms%3A+for+it+has+ever+been+their+custom+upon+the+smallest+matters+to+fall+into+so+vehement+discords%2C+as+have+made+them+excommunicate+one+another%2C+and+remain+se%C2%ADparations+refusing+communion+one+to+another+unto+this+day.+Behold+how+small+an+occasion+did+bring+them+to+no+less+then+four+irremediable+fractions+%28OOOO%29%3A+For+a+light+cause+four+late+separa%C2%ADtions+among+them.+one+of+the+Mennonites+at+Franeker+in+a+public+roping+did+seem+to+use+some+cheating+in+buying+of+a+house%2C+preventing+by+some+sleight+of+hand+another+man+who+before+him+had+a+mind+to+the+bargain%3B+this+did+so+much+displease+some+that+they+excommunicated+the+cheater%3B+others+defended+the+honesty+of+the+man+and+did+excommunicate+them+who+for+no+cause+as+they+conceived+had+put+a+censure+upon+him%3B+hence+two+sects+condemning+one+another+to+this+day.+To+recon%C2%ADcile+both%2C+a+third+party+did+arise%2C+avowing+that+however+the+man+in+his+bargain+had+used+some+piece+of+fraud%2C+yet+that+it+was+not+so+gross+as+did+deserve+excommunication.+In+this+accommodation+these+mid+men+proceeded+so+far%2C+that+they+were+excommunicated+by+both+the+dissenting+parties%2C+whereupon+their+passion+was+so+stirred%2C+that+they+did+excommunicate+them+both+also%3B+and+lest+the+number+of+their+schisms+should+be+too+small%2C+there+arose+a+fourth+party%2C+who+being+displeased+with+the+frequency+of+their+brethren%E2%80%99s+censures%2C+did+open+the+doors+of+their+charity+for+all+whom+the+rigor+of+others+had+excommunicated+and+cast+out%3B+by+this+over%C2%ADlashing+of+their+charity+they+did+acquire+from+their+companions+the+infamous+title+of+Hamaxarii+and+Borboritae%2C+as+men+who+were+content+to+take+into+their+society+cart+loads+full+of+polluted+pro%C2%ADfessors+%28PPPP%29.+We+will+say+no+more+of+the+Anabaptists+over+sea%2C+their+number+in+England+till+of+late+was+not+great%3B+and+the+most+of+these+were+not+English+but+Dutch+strangers%3A+for+beside+the+hand+of+the+state+that+ever+lay+heavy+upon+them%2C+the+labors+of+their+children+the+separatists+were+always+great+for+their+reclaiming.+Notwithstan%C2%ADding+of+all+the+contentions+of+the+separatists+among+themselves%2C+yet+all+of+them+did+ever+join+to+write+sharp+and+large+treatises+%5BPage+18%5D+against+the+Anabaptists%3B+In+this+Ainsworth%2C+Johnson%2C+Robinson%2C+Clifton+did+study+who+should+be+most+zealous.+Hence+it+was+that+the+Anabaptists+made+little+noise+in+Eng%C2%ADland%2C+till+of+late+the+Independents+have+corrupted+and+made+worse+the+principles+of+the+old+separatists%2C+proclaiming+for+errors+a+liberty+both+in+church+and+state%3B+under+this+shelter+the+Anabap%C2%ADtists+have+lifted+up+their+head%2C+and+increased+their+numbers%2C+much+above+all+other+sects+of+the+land.+Their+ways+as+yet+are+not+well+known%2C+but+a+little+time+it+seems+will+discover+them%2C+for+their+singular+zeal+to+propagate+their+way+will+not+permit+them+long+to+lurk%3A+only+the+confession+of+faith+which+the+other+year+seven+of+their+congregations+did+put+forth%2CTheir+late+con%C2%ADfession+is+nei%C2%ADther+a+full+nor+a+clear+declara%C2%ADtion+of+their+tenets+and+of+late+again+a+se%C2%ADcond+corrected+edition+have+set+out+with+a+bold+preface+to+both+the+Houses+of+Parliament+may+no+more+be+taken+for+the+measure+of+their+faith%2C+than+that+confession+which+their+elder+brethren+in+Holland+did+print+not+long+ago+in+the+name+of+all+their+compa%C2%ADny+%28QQQQ%29.+For+as+the+Dutch+confession+did+dissemble+a+num%C2%ADber+of+the+gross+heresies+which+some+of+the+very+subscribers+in+their+public+writings+both+before+and+after+did+hold+out%2C+it+is+even+so+with+the+English%2C+for+Hobson%2C+Richardson%2C+and+others+of+the+sub%C2%ADscribers+have+already+printed+several+errors+which+in+that+con%C2%ADfession+do+not+appear.+Moreover+these+seven+congregations+can%C2%ADnot+prescribe%2C+and+are+no+ways+leaders+to+a+great+number+of+Ana%C2%ADbaptist+churches+over+all+the+land%3B+however+I+shall+set+down+so+many+of+their+tenets+as+for+the+time+comes+to+my+thoughts+from+some+little+acquaintance+with+a+few+of+their+writs+that+have+fallen+into+my+hands.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed+%28London%2C+1647%29%2C+9%E2%80%9318.+NB%3A+For+ease+of+reading+and+because+archaic+words+spelling+tend+to+make+older+writers+seem+unintelligent%2C&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F088cb1ac2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/088cb1ac2b.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/05/baillie-versus-tombes-4-how-the-particular-baptists-appeared-to-early-presbyterians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bafd09315" data-kw="">
<blockquote><p>It is said [about the divine right of Church government] that, ‘All this is but a plea for a dominion of an higher nature, even over the consciences of men by censures.’ But why a dominion? Because a power of censures? Surely, if they were not spiritual censures, and such as have influence on the conscience, we should yield a domination were the business. But this power of censuring spiritually is as strong as authoritative in dispensing rebukes, threats, Gospel-charges and commands in the Word preached, as in censures; The power is ministerial only in the Word, not lordly; and why should it be deemed a dominion, and an arbitrary power in the one, and not in the other?</p></blockquote>

<blockquote><p>As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.”

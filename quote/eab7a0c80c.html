<main class="wrap"><figure class="quote" id="q-eab7a0c80c" data-kw="">
<blockquote><p>If you see a man walking abroad on the Lord’s day, censure him not till you know that he does it from profaneness or negligence: You know not but it may be necessary to his health, and he may improve it in holy meditation?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

</figure><figure class="quote" id="q-284985c76e" data-kw="">
<blockquote><p>But unto the place which the Lord your God shall choose out of all your tribes to put his name there, even unto his habitation shall ye seek, and thither thou shalt come: And thither ye shall bring your burnt offerings… And there ye shall eat before the Lord your God, and ye shall rejoice in all that ye put your hand unto, ye and your households, wherein the Lord thy God hath blessed thee… But thou must eat them before the Lord thy God in the place which the Lord thy God shall choose, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite that is within thy gates: and thou shalt rejoice before the Lord thy God in all that thou puttest thine hands unto.</p></blockquote>

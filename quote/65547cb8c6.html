<main class="wrap"><figure class="quote" id="q-65547cb8c6" data-kw="">
<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, … (London: Maxey, 1654), on vv. 17-19, pp. 569-70</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a3ebf2ba79" data-kw="">
<blockquote><p>Both Piscator of late, by evidence of Scripture, and Bradwardine long before, by demonstration of reason, have proved that no will in God is conditionate, quoad actum volentis [as to the act of the one willing]; all the conditions are found, quoad res volitas [with respect to the things willed]. And indeed, though the purposes of God are absolute, yet his promises are therefore conditionate, because they are conformed to the manner of God’s operation with man: For, as God works in all things agreeable to their natures, so in man He uses to work agreeable to his nature. And therefore, albeit his purpose be absolute to bring them to grace and glory, to faith, repentance and salvation; yet He allures them to faith and repentance by promises and threatnings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646) | 3rd Doubt, p. 63</span></figcaption>

</figure><figure class="quote" id="q-bb47c23da1" data-kw="">
<blockquote><p>First, ‘God’ (say they [Arminians]), ‘considering all mankind as fallen from that grace and favor in Adam where they were created, and excluded utterly from the attainment of salvation by virtue of the covenant of works which was at the first made with him, yet by his infinite goodness was inclined to desire the happiness of them all and every one, that they might be delivered from misery and be brought unto Himself, which inclination of his they call his universal love and antecedent will, whereby He would desirously have them all to be saved, out of which love He sends Christ.’ [Owen:] That God has any natural or necessary inclination by his goodness or any other property to do good to us or any of his creatures, we do deny: everything that concerns us is an act of his free will and good pleasure, and not a natural necessary act of his Deity, as shall be declared. Secondly, the ascribing an antecedent conditional will unto God, whose fulfilling and accomplishment should depend on any free contingent act or work of ours, is injurious to his wisdom, power and sovereignty, and cannot well be excused from blasphemy, and is contrary to Rom. 9:19, ‘Who hath resisted his will? I say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu, or the Death of Death in the Death of Christ</cite>, … (London: W.W., 1648), bk. 2, ch. 4, pp. 91-92</span></figcaption>

=First%2C%20%E2%80%98God%E2%80%99%20%28say%20they%20%5BArminians%5D%29%2C%20%E2%80%98considering,hath%20resisted%20his%20will%3F%20I%20say&amp;text=First%2C%20%E2%80%98God%E2%80%99%20%28say%20they%20%5BArminians%5D%29%2C%20%E2%80%98considering%20all%20mankind&amp;text=9%3A19%2C%20%E2%80%98Who%20hath%20resisted%20his%20will%3F%20I%20say" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. Voluntas essentialis and voluntas personalis. This is an admittedly rare distinction, given the Reformed orthodox unwillingness to speculate into the doctrine of the Trinity in a manner like that of the medieval doctors. This distinction parallels, of course, the basic distinction of properties of the Godhead into proprietates essentiales and proprietates personales. Thus, the voluntas essentialis is simply the will of God, understood as an essential property or as a faculty of the divine life. The ‘essential’ will of God can also be termed the voluntas realis, namely, will by which God discerns all things existent or nonexistent. The voluntas personalis, then, can only relate to the inward begetting and proceeding of the persons of the Trinity, understood as somehow belonging to the divine willing–as such, this language relates also to the concept of a necessary divine will, the voluntas necessaria. Thus, God the Father necessarily wills to beget God the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 2nd</cite>, ed. (Baker Academic, 2003), vol. 3, p. 453</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>5. Voluntatas absoluta and voluntas conditionata. The distinction between decretive and perceptive will, voluntas beneplaciti and voluntas signi, relates also to a distinction between absolute will and conditioned will (voluntas absoluta et voluntas conditionata). According to the former, God wills and determines that something should occur ‘without any condition’ in the object of God’s willing—but the latter, the conditional will, rests upon the fulfillment of a condition in or by the object of the divine will, for example, the will of God to save men upon condition of faith. Maccovius notes, against the Arminians, that the distinction is ‘utterly vain.’ Wendelin indicates that this distinction causes some difficulty, but makes perfectly good sense if it is understood solely in terms of the voluntas signi [will of sign, or revealed will]—granting that most of the divine precepts, promises, and condemnations are stated conditionally. The distinction is, however, extended improperly to the eternal decree, inasmuch as the decree cannot be ‘suspended on conditions’…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“5. Voluntatas absoluta and voluntas conditionata. The distinction between decretive and perceptive will, voluntas beneplaciti and voluntas signi, relates also to a distinction between absolute will and conditioned will (voluntas absoluta et voluntas conditionata). According to the former, God wills and determines that something should occur ‘without any condition’ in the object of God’s willing—but the latter, the conditional will, rests upon the fulfillment of a condition in or by the object of the divine will, for example, the will of God to save men upon condition of faith. Maccovius notes, against the Arminians, that the distinction is ‘utterly vain.’ Wendelin indicates that this distinction causes some difficulty, but makes perfectly good sense if it is understood solely in terms of the voluntas signi [will of sign, or revealed will]—granting that most of the divine precepts, promises, and condemnations are stated conditionally. The distinction is, however, extended improperly to the eternal decree, inasmuch as the decree cannot be ‘suspended on conditions’…”

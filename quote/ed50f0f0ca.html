<main class="wrap"><figure class="quote" id="q-ed50f0f0ca" data-kw="">
<blockquote><p>Objection: If Christ as God-man be Mediator, then the divine nature subsisting in the relation of the Son, received the Office of Mediator, and consequently something may be added to God, but nothing can be added to God because He is perfection itself? Answer: The divine nature received not the office as considered in itself, but in respect of its voluntary dispensation, as accepting of subsistence with the human nature, i.e. Christ received and sustained the Office of Mediatour, not as God alone, nor as man alone, but as God-man: the divine nature in respect of its voluntary dispensation: the human nature properly. To the divine nature there is not anything added, only a relation: but to the human nature there is added a real change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clarke.html">Samuel Clarke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla Theologiæ</cite>, (London, 1659), ch. 29, ‘Questions &amp; Cases of Conscience about Christ’, p. 294</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a2661285d" data-kw="">

</figure><figure class="quote" id="q-42d71c9918" data-kw="">
<blockquote><p>There can be no safety, no holiness, and no happiness to those who are out of Christ. No safety, because all such are under the condemnation of the law, verses 1-3; no holiness, because only such as are united to Christ have the Spirit of Christ, verse 9; and no happiness, because “to be carnally minded is death,” verse 6. Hence those who are in Christ, should be very humble, seeing they are nothing, and he is everything; very grateful, and very holy. And those who are out of Christ, should at once go to him, that they may attain safety, holiness, and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, rev. ed., 1886, ch. 8, Remarks</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-b39dc87ab2" data-kw="">
<blockquote><p>Developing from Girolama Zanchi’s exegetical labors through Ephesians, Spiritual Marriage draws readers into the rich theological of doctrine of union with Christ. Following the lead of the apostle Paul, Zanchi demonstrates how our earthly marriages fulfill their truest purpose by drawing our attention toward the spiritual marriage between Christ and His Church. By paying attention to the Genesis account of Adam’s marriage to Eve, to pertinent Old Testament laws, and to the teachings of Jesus and His apostles, we begin to understand something of that higher and heavenly union.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Marriage between Christ &amp; His Church &amp; Every One of the Faithful</cite>, (RHB, 2021) 152, pp. ToC</span></figcaption>

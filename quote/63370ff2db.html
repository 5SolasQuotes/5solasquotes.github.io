<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 1</span></figcaption>

</figure><figure class="quote" id="q-727be13c5c" data-kw="">
<blockquote><p>The supreme judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Scripture delivered by the Spirit, into which Scripture so delivered, our faith is finally resolved.</p></blockquote>

</figure><figure class="quote" id="q-d4bd5dd7bb" data-kw="">
<blockquote><p>The Bereans are praised for not rashly and hastily receiving whatever Paul taught them, but diligently examining his doctrine by scripture. Whence we draw two inferences: First, that all doctrine is to be judged by the scriptures. For, if the Bereans compared the preaching of an apostle with the rule of scripture, shall we embrace without any examination whatever the pope may please to maintain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Controversy 1, Q. 5, ch. 8 (p. 457)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

— William Whitaker, A Disputation on Holy Scripture, Controversy 1, Q. 5, ch. 8 (p. 457)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20Bereans%20are%20praised%20for%20not%20rashly%20and%20hastily%20receiving%20whatever%20Paul%20taught%20them%2C%20but%20diligently%20examining%20his%20doctrine%20by%20scripture.%20Whence%20we%20draw%20two%20inferences%3A%20First%2C%20that%20all%20doctrine%20is%20to%20be%20judged%20by%20the%20scriptures.%20For%2C%20if%20the%20Bereans%20compared%20the%20preaching%20of%20an%20apostle%20with%20the%20rule%20of%20scripture%2C%20shall%20we%20embrace%20without%20any%20examination%20whatever%20the%20pope%20may%20please%20to%20maintain%3F%E2%80%9D%0A%0A%E2%80%94%20William%20Whitaker%2C%20A%20Disputation%20on%20Holy%20Scripture%2C%20Controversy%201%2C%20Q.%205%2C%20ch.%208%20%28p.%20457%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd4bd5dd7bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d4bd5dd7bb.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-91f1d74d37" data-kw="">
<blockquote><p>For when some have taken up a private interpretation of any place of Scripture, if, before they have thoroughly imbibed and vented it, they do not submit their conception, although they seem to be greatly satisfied in it and full of it, unto the authority of the Scripture in the declaration of its own mind in other places, there is but small hope of their recovery. And this is that pride which is the source and original of heresy, -- namely, when men will prefer their seemingly wise and rational conceptions of the sense of particular places before the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1bccc4f92a" data-kw="">
<blockquote><p>The New Covenant is established in the Blood of Christ, and it doth contain two chief Blessings or Promises (namely) free pardon of Sin, and the writing of his Laws in our hearts, that is, the conditions of the New Covenant, which God requires of us; He promiseth to write them in our hearts; He doth not leave it to our frail wills, whether we will perform them or no; but he gives the Ability, and the Graces themselves, whereby we shall infallibly be led on unto Salvation; and for this purpose, Christ did not only die for us, but rose again, &amp; sits at the right hand of God, making intercession for us. Joh. 17.9. I pray not for the world, but for them which thou hast given me, for they are thine: &amp; again v. 24. Father I will, that they also whom thou hast given me, be with me, where I am: And so S. Peter teacheth, Acts 5.31. that God hath exalted Christ with his own right hand, to be a Prince and Saviour, to give repentance to Israel and remission of Sins. Christ doth not only provide a price for our souls, but gives gifts unto men, he draws all hearts unto him, and being made Head of the Church (which is his Body) he filleth all in all, Eph. 1.22. that so his Death, which is sufficient for all, may be effectually applied to the Justification and Reconciliation of the Elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ</cite>, (London: Richard Royston, 1655), p. 264.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96b8ef64dd" data-kw="">
<blockquote><p>Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense:

1. Because Christ assumed the nature which is common; it is not conceded that it was common to all, but it was the nature of Abraham, the father of the believing (Heb. 2:16). Hence, the devils are not at all made salvable by Christ, of course, as the angelic nature has not itself been united to his person.

2. Because Christ has expiated the common sin of Adam on the tree of the cross, though it is not conceded that it was as common, but as it was in the elect and the believing.

3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Reprobate are made Reconcilable by the Death of Christ?’</cite>, [Distinguish] in Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter, trans. T. Fentiman &amp; C. Johnson (RBO, 2019), pp. 90-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

uote/96b8ef64dd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=Hence%2C%20it%20is%20not%20allowed%20that,things%20cannot%20be%20said%20of%20devils&amp;text=Hence%2C%20it%20is%20not%20allowed%20that%20Christ%20has&amp;text=These%20previous%20things%20cannot%20be%20said%20of%20devils" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-40fa0fcaef" data-kw="">
<blockquote><p>It was the love of Christ which brought Him down from heaven, which veiled His divinity in a human soul and body, which put upon Him the form of a servant, which exposed Him to contempt, reproach, and many indignities. It was love which made Him subject to hunger, thirst, sorrow, and many human infirmities, which humbled Him unto death, even the painful and ignominious death of the cross.

And when out of love He had finished the work of redemption on earth, as to what was needful by way of satisfaction, it was His love which carried Him back to heaven where He was before, so that He might make application of what He had purchased; that there He might make intercession for those whom He had redeemed, and prepare a place for them, even glorious mansions with Himself in the house not made with hands, which is eternal in the heavens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Work Begun in the Day of Grace Performed Until the Day of Christ</cite>, ed. Don Kistler (1672; Morgan PA: Soli Deo Gloria, 1998), p. 115.</span></figcaption>

</figure><figure class="quote" id="q-799cf93f69" data-kw="">
<blockquote><p>If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.</p></blockquote>

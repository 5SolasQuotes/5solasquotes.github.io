<main class="wrap"><figure class="quote" id="q-a376e8e896" data-kw="">
<blockquote><p>…Tertullian wanted all females veiled from the time of puberty (1.1; 16.3). Some virgins, to the contrary, were attending the church gatherings unveiled, and some married women made only a token covering of the head (17.1, 4). Both sides, it seems, assumed that married women would be veiled in public. It is not clear whether Tertullian, who was under the influence of the Montanist movement on the basis of a revelation by the Paraclete (1.7) is an innovator or is trying to restore a practice being neglected or abandoned. His description of varied hairstyles (On the Apparel of Women 2.7) indicates not many women were in fact veiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/everett-ferguson.html">Everett Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Veils &amp; Virgins</cite>, 56, no. 4 (2014), pp. 223-43, p. 223</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4d2447d66c" data-kw="">
<blockquote><p>On the other side, narrow and temporary precepts and examples:

1. Are void of all these foresaid [universal and perpetual] characters;

2. They are about materials of temporary use;

3. Or they are but the ordering of such customs as were there before, and were proper to those countries;

4. And many speeches are plainly appropriated to the time and persons;

5. And many actions were manifestly occasional, without any intimation of reason or purpose of obliging others to imitation. … So the women’s veil and the custom of kissing each other as a token of love, and men’s not wearing long hair, were the customs of the country there ordered and improved by the apostles about sacred things, but not introduced into other countries that had no such custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, pp. 893-4</span></figcaption>

</figure><figure class="quote" id="q-95f09a7369" data-kw="">
<blockquote><p>Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 3, pp. 46-47</span></figcaption>

<blockquote><p>because of the angels. …and so it teaches us, that the good angels, who are ministering spirits for the good of God’s elect, at all times have a special minstration, or at least are more particularly present, in the assemblies of people for religious worship, observing the persons, carriage, and demeanor; the sense of which ought to awe all persons attending those services, from any indecent and unworthy behavior.</p></blockquote>

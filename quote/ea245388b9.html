</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9170246cd4" data-kw="">
<blockquote><p>...it is a dreadful sin to depart from the church for the purpose of establishing one which is better, for the church is one, being the body of Christ. To separate ourselves from the church is to separate from the people of Christ and thus from His body, thereby withdrawing from the confession of Christ and departing from the fellowship of the saints. If we indeed deem the church to be what she really is, we shall then cause schism in the body of Christ, grieve the godly, offend others, give cause for the blaspheming of God‟s Name, and cause the common church member to err. By maintaining that the church is no church, we thereby deny the church of Christ, and therefore are also guilty of the sins just mentioned. We thereby displease God, who will not leave this unavenged, regardless of how much we please and flatter ourselves. Such activity the apostle opposes when he refers to such individuals as being carnal in 1 Cor 3:1, 3. He warns against this when he writes, “Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and that there be no divisions among you” (1 Cor 1:10); “I hear that there be divisions among you” (1 Cor 11:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ng%20you%E2%80%9D%20%281%20Cor%2011%3A18" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f10d1f2232" data-kw="">
<blockquote><p>Moreover this Assembly entreats and exhortsall for God’s sake, and the glory of his great name, and their own salvation,and for the peace and welfare of the nation; yea, it adjures by all that is desirable or commendable, the whole body of our communion in general, and every faitful soul in particular, to divest themselves of all animosities whatsoever, and to lop off immediately all dissolutions and dissensions, lest they should be the causes of the dissipation of the Churches of God in this kingdom. And all pastors and elders of Churches are enjoined diligently to procure the reunion of the respective members of their flocks, and to lend one another their helping hand to effect so good a work, and mightily to insist upon it in their public sermons, and private exhortations and remonstrances; And in case they should meet with contempt, scorn and reproach in the discharge of this their duty, and that any one, through an obdurate perverseness, should show himself implacable and irreconcilable, this Assembly, according to that authority which the great God gives unto the ministers of his holy Word, denounces to them the dreadful judgments of God, and wishes they may be had in execration” (that is, detestation) “among and by all the faithful; yea, all the censures of the Churchshall be exerted against such refractory persons, and the utmost rigor of our discipline shall be inflicted and executed upon them, lest the good name of God should be blasphemed through our sins, and that we may not contract upon ourselves the guilt of the Church’s desolation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

squotes.github.io%2Fquote%2Ff10d1f2232.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f10d1f2232.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=Moreover%20this%20Assembly%20entreats%20and%20exhortsall,the%20guilt%20of%20the%20Church%E2%80%99s%20desolation&amp;text=Moreover%20this%20Assembly%20entreats%20and%20exhortsall%20for%20God%E2%80%99s&amp;text=upon%20ourselves%20the%20guilt%20of%20the%20Church%E2%80%99s%20desolation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-5fdcc71030" data-kw="">
<blockquote><p>We further confess and acknowledge, that such persons as are placed in authority are to be loved, honored, feared, and holden in most reverend estimation, because they are the lieutenants of God, in whose session God Himself does sit and judge. And further, we affirm that whosoever deny unto them their aid, counsel and comfort, while the princes vigilantly travail in the executing of their office, that the same men deny their help, support and counsel to God, who, by the presence of his lieutenant, craves it of them.</p></blockquote>

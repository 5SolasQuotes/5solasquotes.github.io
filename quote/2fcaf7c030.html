<blockquote><p>Yea there are among you now many things of a lower [superstitious] nature, which some dare scarce plainly say God commands or forbids, and yet they are censorious enough about them: As heretofore many were… That no prayer may be used… in our common mixed assemblies which have any expressions which all, both good and bad, may not fitly use as for themselves…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-561d6a751d" data-kw="">
<blockquote><p>In the sixth petition (which is, ‘And lead us not into temptation, but deliver us from evil’) acknowledging, that… we… are not only subject to be tempted, and forward to expose ourselves unto temptations,[l] but also of ourselves unable and unwilling to resist them, to recover out of them, and to improve them;[m] and worthy to be left under the power of them:[n] we pray, that God would so over-rule the world and all in it,[o] subdue the flesh,[p] and restrain Satan,[q] order all things,[r] bestow and bless all means of grace,[s] and quicken us to watchfulness in the use of them, that we and all his people may by his providence be kept from being tempted to sin;[t] or, if tempted, that by his Spirit we may be powerfully supported and enabled to stand in the hour of temptation;[v] or when fallen, raised again and recovered out of it,[w] and have a sanctified use and improvement thereof:[x] that our sanctification and salvation may be perfected,[y] Satan trodden under our feet,[z] and we fully freed from sin, temptation, and all evil, for ever.[a] [l] Matt. 26:69-72. Gal. 2:11-14. 2 Chron. 18:3 compared with 2 Chron. 19:2. [m] Rom. 7:23,24. 1 Chron. 21:1-4. 2 Chron. 16:7-10. [n] Ps. 81:11,12. [o] John 17:15. [p] Ps. 51:10. Ps. 119:133. [q] 2 Cor. 12:7,8. [r] 1 Cor. 10:12,13. [s] Heb. 13:20,21. [t] Matt. 26:41. Ps. 19:13. [v] Eph. 3:14-17. 1 Thess. 3:13. Jude 24. [w] Ps. 51:12. [x] 1 Pet. 5:8-10. [y] 2 Cor. 13:7,9. [z] Rom. 16:20. Zech. 3:2. Luke 22:31,32. [a] John 17:15. 1 Thess. 5:23.</p></blockquote>

%3A%2F%2F5solasquotes.github.io%2Fquote%2F561d6a751d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/561d6a751d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hyper-spirituality/#:~:text=In%20the%20sixth%20petition%20%28which%20is,a%5D%20John%2017%3A15.%201%20Thess.%205%3A23&amp;text=In%20the%20sixth%20petition%20%28which%20is%2C%20%E2%80%98And%20lead&amp;text=Luke%2022%3A31%2C32.%20%5Ba%5D%20John%2017%3A15.%201%20Thess.%205%3A23" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7950d85c51" data-kw="">
<blockquote><p>Jesus [in Mt. 18] is not addressing public sins or scandalous matters that the whole church would already be aware of. If that were the case, gross and explicit sins would then be drug into secrecy, to be resolved in secret. May it never be! And yet, sadly, it often is. The church frequently colludes to protect the group, and scandalous sin is quickly covered up and dealt with secretly… Jesus addresses public persons publicly. Recall his scathing condemnation of Herod (Luke 13:32), or his many public “woes” (i.e. “curses”) pronounced upon the pharisees (cf. Matt 23:13-39). We can almost hear the modern Christian retort: “Yes, Jesus, but did you confront all of them privately first?!… Matthew 18 is not speaking of abusers and oppressors. Jesus is speaking of “brothers”, not wolves. Would we ask Christ’s most tender and trodden upon lambs to go alone, and speak alone, with her predator before we can properly confront his sin?! Again, may it never be!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/keith-evans.html">Keith Evans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Many Odd Uses &amp; Abuses of Matthew 18’</cite>, (2023) 16 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

</figure><figure class="quote" id="q-a99625cdfe" data-kw="">
<blockquote><p>…righteousness and wisdom are the food of the hungry soul, the physick of the sick, and the spiritual heat and life of the mind. But then also, if in relation to those so necessary perfections, we exceed the bounds of sobriety and moderation, that food oppresses, that physick poisons, that heat inflames and enrages our souls. Without that necessary mixture of moderation, our righteousness degenerates into a furious zeal, superstition, and bigotry; and our wisdom into profaneness, presumption and undue curiosity… But the being over-much wicked relates to the duration of sin, and not to the degree of it; and forbids a long persistency and hardness in wickedness, and not only the more heinous and exorbitant acts of impiety. This exposition is sufficiently warranted by the Septuagint translation of this place; in which the word here rendered ‘foolish,’ is [Greek] and properly signifies ‘hard and obstinate’;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-maundrell.html">Henry Maundrell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached before the Honourable Company of Merchants Trading to the Levant-Seas</cite>, … Dec. 15 1695 (London: Brown, 1696) on Eccl. 7:16-17, pp. 7-8</span></figcaption>

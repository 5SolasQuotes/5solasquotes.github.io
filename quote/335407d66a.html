<main class="wrap"><figure class="quote" id="q-335407d66a" data-kw="">
<blockquote><p>You therefore are changed from that sect by which you are separated, although the sacraments which you have are holy, since they are the same in all. That is why we wish you to be won away from your false position, so that your cut-off branches may be again rooted. The sacraments, which you have not changed, are approved by us as you have them; so, when we wish to correct your aberration, we must guard against doing a sacrilegious wrong to those mysteries of Christ which have not been vitiated by your vice. For, Saul did not vitiate the anointing which he had received, when King David, the devout servant of God, did such honour to it.

We do not rebaptize you when we wish to restore you to the root, because we approve the form of the lopped-off branch, if it is not changed, which, however, even when intact, is anything but fruitful without a root. It is one question about the persecutions which you say you suffered even under our mildness and tolerance, when your adherents individually committed such gravely unlawful acts, but baptism is another question, since we do not look to see where it is, but where it is validly. Wherever it is, it is itself, but the one who receives it is not himself wherever he is.

Therefore, in schism, we detest the individual wickedness of men, but we honour the baptism of Christ everywhere; so, for example, if deserters from an army carry off with them the standards of their commander, if the standards have remained safe they are recovered whether the deserters have been condemned to punishment or won back by clemency.</p></blockquote>

</figure><figure class="quote" id="q-5c0ff4ccae" data-kw="">
<blockquote><p>The subject of baptism is the faithful people of God, without any distinction of nation, sex, or age. Indeed, infants of the covenanted must be baptized as equally as the infants of the covenanted were once circumcised because the promise made to Abraham and His seed, Christ having been revealed, was not diminished but enlarged through the mouth of Peter: “The promise is yours and your children’s” (Acts 2:39). In this argument St. Peter commanded each one (ἕκαστον) to be baptized (Acts 2:38). Indeed, the Israelites, who once were “near,” and the faithful from the Gentiles, who once were “far off” (Acts 2:39), are held with no distinction under the New Testament (Gal. 3:28). For the children of the faithful Gentile, notwithstanding infidelity of the other parent, are “holy” (1 Cor. 7:14). Therefore, since baptism as equally as circumcision seals that covenant for those who believe, into which their children have been received as holy, in the same right baptism is administered to these as circumcision once was to those. For Christ commanded “to make disciples and to baptize the nations,” with no distinction of age (Matt. 28:19). Therefore, those who are born in the lap of the church are fit at the age of infant to begin the institution and must be baptized as equally as their parents. Therefore, the apostles baptized whole “households” (1 Cor. 1:16). (XXII–XXVI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 24.9, trans. Casey Carmichael, Classic Reformed Theology (Reformation Heritage Books, 2019), 179.</span></figcaption>

</figure><figure class="quote" id="q-189774c05f" data-kw="">
<blockquote><p>3d. Plea. I am come of Religious Parents, that improved, pleaded the Covenant for me, trained me up in the Fear of God.

Answ. John Baptist anticipates this Plea, Mat. 3.9. Think not to say in your Hearts, We have Abraham to our Father, Matth. 8.12. The Children of the Kingdom may be cast into utter Darkness. Alas Parental Privileges without Parents Principles, signify nothing: Let our Lord Christ, who will be Judge, answer this vain Plea, John 8.33-44. This may aggravate your Sin, never save your Souls, without Personal Piety.

4th. Plea. I have made a credible Profession of my Faith, am Baptized, am admitted to the Lord’s Supper, join with God’s People.

Answ. So did Simon Magus believe, professed his Faith, was Baptized, Acts 8.13.20-23, deceived the purest Church on Earth, for he proved a rotten Hypocrite; so did Judas, so did he that wanted the Wedding Garment, Matth. 22.12. And how easy it is to cast a Mist before the Eyes of fallible men, daily experience testifies: See an Instance of some that partake of extraordinary Privileges, Ordinances, yet rejected, 1 Cor. 10.5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

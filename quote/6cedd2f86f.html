</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe280a08e1" data-kw="">
<blockquote><p>14. No man is saved or justified but by the proper merit of Christ’s perfect obedience; yea, and his habitual holiness and satisfactory sufferings, advanced in dignity by his divine perfection. 15. This merit, as related to us, supposes that Christ, as a sponsor, was the Second Adam, the Root of the justified, the reconciling Mediator, who obeyed perfectly with that intent that by his obedience we might be justified; and who suffered for our sins, in our room and stead; and so was in tantum [to that extent] our Vicarius poenae, as some phrase it, or substitute; and was made a curse for us, that we might be healed by his stripes; as He was obedient, that his righteousness might be the reason as a meritorious cause of our justification: which supposes the relation of an undertaking Redeemer, in our nature doing this, and in our stead so far forth, as that therefore perfect obedience should not be necessary to be performed by ourselves: And righteousness therefore is imputed to us, that is, we are truly reputed righteous, because we, as believing members of Christ, have right to impunity and life, as merited by his righteousness, and freely given to all penitent believers. And Christ’s own righteousness may be said so far to be imputed to us, as to be reckoned or reputed the meritorious cause of our right or justification, as aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</cite></span></figcaption>

</figure><figure class="quote" id="q-87fde816b6" data-kw="">
<blockquote><p>Behold what can be desired more to make commutations of parties in public contracts authentic in courts of justice than consent of all parties, the allowance of the judge and public record? And if this self-same commutation of pennance must be allowed of by those who are for justification by way of satisfaction only,¹ why should it seem incongruous in this other branch of justification, sc. by imputed righteousness? Surely, God would have the active as well as the passive obedience, as near the same, required by the Law, as might be, that He might dispense with as little of the Law as was possible. ¹ Bellarmine, Of Justification, bk. 2, ch. 7, sect. 4; Stapleton, etc. Their own argument will serve to prove the necessity of imputation of Christ’s active obedience to the Law for justification, because, ‘Nothing,’ say they, ‘can satisfy for sin (which is an infinite wrong to God) but that only which is infinite in value.’ By the same reason nothing can give us right and title to eternal life (which is an infinite reward) but that which is of infinite worth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mount Pisgah, or a Prospect of Heaven, being an Exposition on the Fourth Chapter of the First Epistle of St. Paul to the Thessalonians... (London: Milbourn, 1670), pt. 2, 2nd Use</cite>, p. 152 with margin note</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-70d3190d07" data-kw="">
<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB)</cite>, vol. 5, ch. 6, the Justification of those to be Redeemed</span></figcaption>

<blockquote><p>In the unity of the Godhead there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost: the Father is of none, neither begotten, nor proceeding; the Son is eternally begotten of the Father; the Holy Ghost eternally proceeding from the Father and the Son.</p></blockquote>

</figure><figure class="quote" id="q-12fc15a909" data-kw="hypostasis three persons">
<blockquote><p>The fair inference from the Apostle’s words is, that there is a proper subsistence (hypostasis) of the Father, which shines refulgent in the Son. From this, again it is easy to infer that there is a subsistence (hypostasis) of the Son which distinguishes him from the Father. The same holds in the case of the Holy Spirit; for we will immediately prove both that he is God, and that he has a separate subsistence from the Father. This, moreover, is not a distinction of essence, which it were impious to multiply.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>

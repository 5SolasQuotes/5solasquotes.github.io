<blockquote><p>I… John speaks of a ‘sin unto death’ (1 Jn. 5:16) for which we are not to pray, which can be no other than a sin against the Holy Spirit… XIII… And for this reason it is called a ‘sin unto death’ (1 Jn. 5:16, 17), not only because it deserves death in its own nature (for so all sins are unto death (which is the case with all the sins of reprobates), but because it is such as to be absolutely unpardonable in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1992), vol. 1, 9th Topic, ‘In what consists the formal reason of the sin against the Holy Spirit? Also why is it unpardonable?’, sections 1 &amp; 13, pp. 647 &amp; 650</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1992), vol. 1, 9th Topic, ‘In what consists the formal reason of the sin against the Holy Spirit? Also why is it unpardonable?’, sections 1 &amp; 13, pp. 647 &amp; 650">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI%E2%80%A6+John+speaks+of+a+%E2%80%98sin+unto+death%E2%80%99+%281+Jn.+5%3A16%29+for+which+we+are+not+to+pray%2C+which+can+be+no+other+than+a+sin+against+the+Holy+Spirit%E2%80%A6+XIII%E2%80%A6+And+for+this+reason+it+is+called+a+%E2%80%98sin+unto+death%E2%80%99+%281+Jn.+5%3A16%2C+17%29%2C+not+only+because+it+deserves+death+in+its+own+nature+%28for+so+all+sins+are+unto+death+%28which+is+the+case+with+all+the+sins+of+reprobates%29%2C+but+because+it+is+such+as+to+be+absolutely+unpardonable+in+itself.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+tr.+George+M.+Giger%2C+ed.+James+Dennison+Jr.+%281679%E2%80%931685%3B+P%26R%2C+1992%29%2C+vol.+1%2C+9th+Topic%2C+%E2%80%98In+what+consists+the+formal+reason+of+the+sin+against+the+Holy+Spirit%3F+Also+why+is+it+unpardonable%3F%E2%80%99%2C+sections+1+%26+13%2C+pp.+647+%26+650&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefef431fc6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efef431fc6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=John%20speaks%20of%20a%20%E2%80%98sin%20unto,to%20be%20absolutely%20unpardonable%20in%20itself&amp;text=John%20speaks%20of%20a%20%E2%80%98sin%20unto%20death%E2%80%99%20%281&amp;text=such%20as%20to%20be%20absolutely%20unpardonable%20in%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c3fded103" data-kw="">
<blockquote><p>Every presumptuous sin in the text [that] was cited in Moses, was a sin unto death, in the sense that the Jewish nation understood a sin unto death, viz. that brought to an immediate liableness to cutting off by divine vengeance. Now this was a sin of presumption, and despising the Word of God, as Moses explains what that presumptuous sinning is… But why does not this our apostle speak out, and say, ‘I say he should not pray for it,’ but says only, ‘I do not say that he should.’… He [John] takes care of the consciences of the people of God as well as he shows the two conditions of the sinner he speaks of. There were some that might be in a strait what to do in this case. They were commanded by their Lord and Master to pray for their enemies: these enemies of theirs were become so like their father the Devil that it might pose their consciences whether they should pray for them or no. Therefore this divine apostle uses a happy temper: that he will lay no charge on them, that are so pinched, to pray for them: nor indeed forbid those to pray for them that are more enlarged: for undoubtedly the indifferent expression of the apostle as I may call it, seems plainly to carry with it such a consideration…</p></blockquote>

<blockquote><p>(7.) In reference to God as the governor of the world and to his justice in the administration of his government, sins are distinguished into those which call for vengeance from God even in the present life, and into those which God in the exercise of his long-suffering bears, and which he does not punish except in the life to come. The former are so heinous in their character that He cannot extend towards them his forbearance in this world. And hence they are called clamant or crying sins because they as it were call alone for the infliction of the divine vengeance. Some of these are recorded in Scripture. The blood of Abel is represented as crying unto God from the ground, Gen. 4:10. So is th sin of Sodom and Gomorrah, Gen. 18:20-21; the oppression by the Egyptians of the children of Israel, Ex. 3:9; the covetousness of the Chaldeans, Hab. 2:11; and the fraud of those who kept back the hire of their laborers, James 5:4. Among these crying sins may be ranked also those which are committed insolently in the face of a well-known law, and which God will not forgive,Num. 15:30. To the same class belongs that sin which an apostle calls ‘a sin unto death,’ (1 Jn. 5:16). This seems to be plain from the context in which he does not desire us to pray for the forgiveness of such a sin in this life, seeing that God is wont to make a signal display of his vengeance against it even here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 30, sect. 7, p. 505</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><figure class="quote" id="q-97c83eb45a" data-kw="">
<blockquote><p>Between these two texts [at the beginning and ending of 1 Jn. 5], occur the words we wish to explain: ‘There is a sin unto death: I do not say that ye shall pray for it.’ Must not ‘the sin unto death,’ be that against which he wished to fortify the saints; I mean apostasy? What! you will say, is a man lost without remedy who has denied the truth; and is every one in the sad situation of those for whom the apostle prohibits prayer? God forbid, my brethren, that we should preach so strange a doctrine; and once more renew the Novatian severity! There are two kinds of apostates, and two kinds of apostasies: there is one kind of apostasy into which we fall by the fear of punishment, or on the blush of the moment, by the promises Satan makes to his proselytes. There is another, into which we fall by the enmity we have against the truth, by the detestable pleasure we take in opposing its force. It were cruel to account the first of these offenses, ‘a sin unto death;’ but the Spirit of God prompts us to attach this idea to the second. There are likewise two kinds of apostates. There is one class, who have made only small attainments in the knowledge of the truth; weak and imperfect Christians, unacquainted as yet with the joys and transports excited in the soul by a religion, which promises remission of sin, and everlasting felicity. There is another, on the contrary, to whom God has given superior knowledge, to whom He has communicated the gifts of miracles, and whom He has caused to experience the sweetness of his promise. It would be hard to reject the first; but the apostle had regard to the second. Those, according to St. John, who have committed the ‘sin unto death,’ are the persons who abjure Christianity, after the reception of all those gifts. In the primitive church, where some were honoured with the endowment of discerning spirits, there probably were brethren who could discern the latter apostates from the former. … Now, if you have been attentive to all the considerations we have just advanced: if you have understood the explanations we have given of the several texts, you may form a correct idea of the unpardonable sin. You may know what this crime was, at least, in the time of the primitive church. It was denying, hating and maliciously opposing the truth at the moment they were persuaded it proceeded from God. Two classes of men might commit this crime in the apostolic age. First, those who had never embraced Christianity; but opposed its progress in defiance of rational conviction, and the dictates of conscience. This was the sin of the Pharisees, who maliciously ascribed to the devil miracles, which they knew could have God alone for their author. Secondly, those who had embraced the gospel, who had been baptized, who had received the gift of miracles, and experienced all the graces enumerated in the text. This was the sin of those, who, after conversion, abjured the truth, and pronounced against Jesus Christ the anathemas which his enemies, and particularly the Jews, required of apostates. These St. Paul had in view, in the words of our text [Heb. 6:4 ff.], and in the tenth chapter of this epistle. Of this St. John also spake, when he said, ‘there is a sin unto death.’ Hence the sin described in these three passages, and the sin against the Holy Ghost, is the same in quality, if I may so speak, though diversified in circumstances: we have, consequently, comprised the whole under the vague appellation of unpardonable sin.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Between these two texts [at the beginning and ending of 1 Jn. 5], occur the words we wish to explain: ‘There is a sin unto death: I do not say that ye shall pray for it.’ Must not ‘the sin unto death,’ be that against which he wished to fortify the saints; I mean apostasy? What! you will say, is a man lost without remedy who has denied the truth; and is every one in the sad situation of those for whom the apostle prohibits prayer? God forbid, my brethren, that we should preach so strange a doctrine; and once more renew the Novatian severity! There are two kinds of apostates, and two kinds of apostasies: there is one kind of apostasy into which we fall by the fear of punishment, or on the blush of the moment, by the promises Satan makes to his proselytes. There is another, into which we fall by the enmity we have against the truth, by the detestable pleasure we take in opposing its force. It were cruel to account the first of these offenses, ‘a sin unto death;’ but the Spirit of God prompts us to attach this idea to the second. There are likewise two kinds of apostates. There is one class, who have made only small attainments in the knowledge of the truth; weak and imperfect Christians, unacquainted as yet with the joys and transports excited in the soul by a religion, which promises remission of sin, and everlasting felicity. There is another, on the contrary, to whom God has given superior knowledge, to whom He has communicated the gifts of miracles, and whom He has caused to experience the sweetness of his promise. It would be hard to reject the first; but the apostle had regard to the second. Those, according to St. John, who have committed the ‘sin unto death,’ are the persons who abjure Christianity, after the reception of all those gifts. In the primitive church, where some were honoured with the endowment of discerning spirits, there probably were brethren who could discern the latter apostates from the former. … Now, if you have been attentive to all the considerations we have just advanced: if you have understood the explanations we have given of the several texts, you may form a correct idea of the unpardonable sin. You may know what this crime was, at least, in the time of the primitive church. It was denying, hating and maliciously opposing the truth at the moment they were persuaded it proceeded from God. Two classes of men might commit this crime in the apostolic age. First, those who had never embraced Christianity; but opposed its progress in defiance of rational conviction, and the dictates of conscience. This was the sin of the Pharisees, who maliciously ascribed to the devil miracles, which they knew could have God alone for their author. Secondly, those who had embraced the gospel, who had been baptized, who had received the gift of miracles, and experienced all the graces enumerated in the text. This was the sin of those, who, after conversion, abjured the truth, and pronounced against Jesus Christ the anathemas which his enemies, and particularly the Jews, required of apostates. These St. Paul had in view, in the words of our text [Heb. 6:4 ff.], and in the tenth chapter of this epistle. Of this St. John also spake, when he said, ‘there is a sin unto death.’ Hence the sin described in these three passages, and the sin against the Holy Ghost, is the same in quality, if I may so speak, though diversified in circumstances: we have, consequently, comprised the whole under the vague appellation of unpardonable sin.”

— Jacques Saurin, Sermons of the Rev. James Saurin... tr. Robinson, Hunter &amp; Sutcliff, rev. Samuel Burder (NY: Harper, 1860), vol. 2, Sermon 89, ‘On the Nature of the Unpardonable Sin,’, pp. 329-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBetween+these+two+texts+%5Bat+the+beginning+and+ending+of+1+Jn.+5%5D%2C+occur+the+words+we+wish+to+explain%3A+%E2%80%98There+is+a+sin+unto+death%3A+I+do+not+say+that+ye+shall+pray+for+it.%E2%80%99+Must+not+%E2%80%98the+sin+unto+death%2C%E2%80%99+be+that+against+which+he+wished+to+fortify+the+saints%3B+I+mean+apostasy%3F+What%21+you+will+say%2C+is+a+man+lost+without+remedy+who+has+denied+the+truth%3B+and+is+every+one+in+the+sad+situation+of+those+for+whom+the+apostle+prohibits+prayer%3F+God+forbid%2C+my+brethren%2C+that+we+should+preach+so+strange+a+doctrine%3B+and+once+more+renew+the+Novatian+severity%21+There+are+two+kinds+of+apostates%2C+and+two+kinds+of+apostasies%3A+there+is+one+kind+of+apostasy+into+which+we+fall+by+the+fear+of+punishment%2C+or+on+the+blush+of+the+moment%2C+by+the+promises+Satan+makes+to+his+proselytes.+There+is+another%2C+into+which+we+fall+by+the+enmity+we+have+against+the+truth%2C+by+the+detestable+pleasure+we+take+in+opposing+its+force.+It+were+cruel+to+account+the+first+of+these+offenses%2C+%E2%80%98a+sin+unto+death%3B%E2%80%99+but+the+Spirit+of+God+prompts+us+to+attach+this+idea+to+the+second.+There+are+likewise+two+kinds+of+apostates.+There+is+one+class%2C+who+have+made+only+small+attainments+in+the+knowledge+of+the+truth%3B+weak+and+imperfect+Christians%2C+unacquainted+as+yet+with+the+joys+and+transports+excited+in+the+soul+by+a+religion%2C+which+promises+remission+of+sin%2C+and+everlasting+felicity.+There+is+another%2C+on+the+contrary%2C+to+whom+God+has+given+superior+knowledge%2C+to+whom+He+has+communicated+the+gifts+of+miracles%2C+and+whom+He+has+caused+to+experience+the+sweetness+of+his+promise.+It+would+be+hard+to+reject+the+first%3B+but+the+apostle+had+regard+to+the+second.+Those%2C+according+to+St.+John%2C+who+have+committed+the+%E2%80%98sin+unto+death%2C%E2%80%99+are+the+persons+who+abjure+Christianity%2C+after+the+reception+of+all+those+gifts.+In+the+primitive+church%2C+where+some+were+honoured+with+the+endowment+of+discerning+spirits%2C+there+probably+were+brethren+who+could+discern+the+latter+apostates+from+the+former.+%E2%80%A6+Now%2C+if+you+have+been+attentive+to+all+the+considerations+we+have+just+advanced%3A+if+you+have+understood+the+explanations+we+have+given+of+the+several+texts%2C+you+may+form+a+correct+idea+of+the+unpardonable+sin.+You+may+know+what+this+crime+was%2C+at+least%2C+in+the+time+of+the+primitive+church.+It+was+denying%2C+hating+and+maliciously+opposing+the+truth+at+the+moment+they+were+persuaded+it+proceeded+from+God.+Two+classes+of+men+might+commit+this+crime+in+the+apostolic+age.+First%2C+those+who+had+never+embraced+Christianity%3B+but+opposed+its+progress+in+defiance+of+rational+conviction%2C+and+the+dictates+of+conscience.+This+was+the+sin+of+the+Pharisees%2C+who+maliciously+ascribed+to+the+devil+miracles%2C+which+they+knew+could+have+God+alone+for+their+author.+Secondly%2C+those+who+had+embraced+the+gospel%2C+who+had+been+baptized%2C+who+had+received+the+gift+of+miracles%2C+and+experienced+all+the+graces+enumerated+in+the+text.+This+was+the+sin+of+those%2C+who%2C+after+conversion%2C+abjured+the+truth%2C+and+pronounced+against+Jesus+Christ+the+anathemas+which+his+enemies%2C+and+particularly+the+Jews%2C+required+of+apostates.+These+St.+Paul+had+in+view%2C+in+the+words+of+our+text+%5BHeb.+6%3A4+ff.%5D%2C+and+in+the+tenth+chapter+of+this+epistle.+Of+this+St.+John+also+spake%2C+when+he+said%2C+%E2%80%98there+is+a+sin+unto+death.%E2%80%99+Hence+the+sin+described+in+these+three+passages%2C+and+the+sin+against+the+Holy+Ghost%2C+is+the+same+in+quality%2C+if+I+may+so+speak%2C+though+diversified+in+circumstances%3A+we+have%2C+consequently%2C+comprised+the+whole+under+the+vague+appellation+of+unpardonable+sin.%E2%80%9D%0A%0A%E2%80%94+Jacques+Saurin%2C+Sermons+of+the+Rev.+James+Saurin...+tr.+Robinson%2C+Hunter+%26+Sutcliff%2C+rev.+Samuel+Burder+%28NY%3A+Harper%2C+1860%29%2C+vol.+2%2C+Sermon+89%2C+%E2%80%98On+the+Nature+of+the+Unpardonable+Sin%2C%E2%80%99%2C+pp.+329-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97c83eb45a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97c83eb45a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=Between%20these%20two%20texts%20%5Bat%20the,the%20vague%20appellation%20of%20unpardonable%20sin&amp;text=Between%20these%20two%20texts%20%5Bat%20the%20beginning%20and&amp;text=whole%20under%20the%20vague%20appellation%20of%20unpardonable%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1847491c61" data-kw="">
<blockquote><p>‘There is a sin unto death;’ which is not only deserving of death, as every other sin is, but which certainly and inevitably issues in death in all that commit it, without exception; and that is the sin against the Holy Ghost, which is neither forgiven in this world nor in that to come, and therefore must be unto death; it is a sinning wilfully, not in a practical, but doctrinal way, after a man has received the knowledge of the truth; it is a wilful denial of the truth of the Gospel, particularly that peace, pardon, righteousness, eternal life, and salvation, are by Jesus Christ, contrary to the light of his mind, and this joined with malice and obstinacy; so that there is no more or other sacrifice for such a sin; there is nothing but a fearful looking for of wrath and fury to fall on such opposers of the way of life; and as the presumptuous sinners under Moses’s law died without mercy, so must these despiteful ones under the Gospel; see Mt. 12:31. Some think there is an allusion to one of the kinds of excommunication among the Jews, called “shammatha”, the etymology of which, according to some Jewish writers, is שם מיתה, “there is death”. ‘I do not say that he shall pray for it;’ the apostle does not expressly forbid to pray for the forgiveness of this sin, yet what he says amounts unto it; he gives no encouragement to it, or any hopes of succeeding, but rather the reverse; and indeed where this sin is known, or can be known, it is not to be prayed for, because it is irremissible; but as it is a most difficult point to know when a man has sinned it, the apostle expresses himself with great caution.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0fc0df0efa" data-kw="">
<blockquote><p>…beauty, because this is also a judgment of things that can arouse the desiring faculty to attraction or aversion. Beauty has its own value alongside truth and goodness.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>This essay applies classical aesthetics to the contract doctrine of offer and acceptance. It argues that contract law can be understood, analyzed, and improved using three criteria of beauty: proportion, integrity, and clarity. Based on these criteria, this essay (1) argues that the traditional doctrine of offer and acceptance is beautiful, (2) argues that UCC [Uniform Commercial Code] §2-207 is ugly and fails to improve upon offer and acceptance, and (3) suggests improvements for UCC §2-207.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-k-ching.html">Kenneth K. Ching</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beauty &amp; Ugliness in Offer &amp; Acceptance’ in 60 Wayne Law Review 469</cite>, (2014) 24 pp.</span></figcaption>

</figure><figure class="quote" id="q-93c6663cc1" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible, on Mt</cite>, 5:44-45</span></figcaption>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

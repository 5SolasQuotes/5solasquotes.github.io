<main class="wrap"><figure class="quote" id="q-43ffeddcd5" data-kw="">
<blockquote><p>The flesh, that is, the humanity of Christ, is worshipped relatively, but worship is not directed to the flesh itself, but rather to the Deity of the Son, who hears the prayers and witnesses the groaning of our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586 ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017)</cite>, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-dd95c87f66" data-kw="">
<blockquote><p>When he brings in the first-begotten into the world, which was at the time of the incarnation, he says, ‘Let all the angels of God worship Him,’ Heb. 1:6. And upon his resurrection from the dead, ‘God has given Him a name which is above every name; that at the name of Jesus every knee should bow,’ that is, in a way of religious adoration, Phil. 2:9-10; and though Christ, as man, is not the object of such adoration, yet what He has done in the human nature, is a motive and argument why blessing and honor should be given to his Person, having both natures united in Him; ‘Worthy is the Lamb that was slain, to receive power, etc.’ Rev. 5:12-13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Doctrinal &amp; Practical Divinity (Baptist Standard Bearer)</cite>, p. 387</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-c5080ce246" data-kw="">
<blockquote><p>We do not adore a creature; by no means. For such errors belong to the heathen and the Arians; but we adore the Lord of the creature, the incarnate Word of God. For although the flesh itself by itself is a part of created things, still it has become the body of God. Nor do we pay adoration to this body as separately distinguished from the Word, nor, when about to adore the Word, do we separate the Word far from the flesh, but since we know, as it is said, ‘The Word was made flesh,’ we acknowledge Him as God even in the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius.html">Athanasius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 60, ‘To Adelphius’ against the Arians NPNF2, 4:575; PG 26.1074-76</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-a90d3322e6" data-kw="">
<blockquote><p>Attendance, as far as practicable upon the public duties of religion, contributes much to the profitable observance of the Sabbath at home. The language of Scripture would lead us to this. “Six days shall work be done; but the seventh day is the Sabbath of rest, and holy convocation; ye shall do no work therein; it is the Sabbath of the Lord in all your dwellings.” Lev. xxiii. 3. The Sabbath at home is well united with the holy convocation of the people of God, in the public ordinances of religion. If we consult the history of the Church, we shall find this to have been the opinion of the pious in every age. The Jewish nation, Christians in the time of the apostles, and the professing people of God in all countries since their day, have weekly assembled themselves together.

Public worship promotes the observance of the Sabbath at home, by affording that instruction which is necessary to the proper performance of our duty. Though comparatively little time is spent on the Sabbath, in teaching publicly the doctrines of religion, and the duties that flow from them, yet there will be found a very great difference in the views of those who regularly hear the gospel, and of such as never enter a worshipping assembly. This does not wholly arise from the public instructions of the Sabbath, —those who hear the gospel are constrained to search for themselves, and to use other means to learn the duty which God requires of man. Among other things, they will soon learn that the Sabbath is to be sanctified, by a holy resting all the day, and that if they mean to do what is right, they must perform this duty also.

But we may come to a knowledge of our duty, and yet have no inclination to do what is required. We need to be exhorted and encouraged. This is enjoined upon those who preach the gospel. They are commanded, not only to reprove and rebuke, but also to exhort; to help such as are discouraged, and to strengthen the feeble. And here, again, it will be found, that notwithstanding the multitude who hear the word preached, but observe not the Lord’s day as a holy rest, they, who in any community sanctify it, are those who on that day attend public worship. I much question if a family, neglectful of public worship, can be found, that sanctifies the Sabbath at home.

Again, the assembling of ourselves together, regularly on the Sabbath, greatly contributes to preserve that holy day from the danger of being profaned. All persons feel the confinement of the Sabbath. Nature seems to demand some recreation, both of body and mind. This is afforded us in public worship. The preparing of ourselves to assemble, — the ride, or walk, if we live near; —the variety in the exercises of the sanctuary, — the reading, singing, prayers, and sermons, are exceedingly refreshing to such as have a heart to enjoy them. They send us home better prepared for spending profitably the remainder of the day, than if all the time had been passed in our own dwellings. The remark of one who was deprived of preaching an entire day, we have probably all found true in our own experience, — That a Sabbath without public worship, when we have all the time to spend in duties at home, is no gain to the reading of the Scriptures. For want of variety in our duties, we become languid, and profit but little.

Attendance upon public worship is favourable to a profitable spending of the Sabbath at home, because it promotes religion generally. It is in the house of God that we are taught what we must do to be saved, and how we are acceptably to serve our Creator. Parents and children are taught their relative duties, and are dismissed with pressing exhortation not to defer the paying of their vows. It is in the worshipping assembly, that the affections are moved, and interested for the glory of God. Here it is, that our consciences most closely press us with the important question, What must I do to work the works of God? In the ministry of reconciliation, dispensed to the assemblies of the Sabbath, sin is pointed out and reproved; negligence in duty reprimanded; the honour of religion defended; the sanctification of the Lord’s day pleaded for; the feeble strengthened, and the wavering mind confirmed; — every Christian grace, in its order, becomes the subject of special consideration, and every duty, according to our station in life, is, with arguments to its immediate and constant performance, explained and pressed upon us.

Then, let every one, who would profitably observe the Sabbath at home, conscientiously and faithfully attend public worship. This will save him and his family from many temptations to profane the Lord’s day, and will afford him instruction, strength, and encouragement for the performance of his duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/silas-milton-andrews.html">Silas Milton Andrews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath at Home</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1840), pp 13-15.</span></figcaption>

<blockquote><p>2. To behave ourselves as those that do expect this help, not tempting God, not grieving the angels; We should take heed how we carry ourselves in regard of this honorable attendance; our sins and vanity offends them, as it does God… Angels are pure and holy creatures that still abode in the truth; pride, lust, and vanity is very offensive to them, especially impurities and undecencies in God’s worship, about which they have a special attendance; therefore the apostle bids the women to cover their heads because of the angels, 1 Cor. 11:10, their fashion being to come into the congregation with loose dishevelled locks, he minds them of the presence of the angels: We may use a like argument to women to cover their naked breasts, now their immodesty is grown so impudent as to out-face the ordinances of God.</p></blockquote>

<blockquote><p>The seventh [day of creation] is the institution of the Sabbath on the seventh day of the world, on which day Christ was promised: and by the promise of Christ which was the greatest blessing given and revealed to the fathers in the old testament, that day came to be the most blessed day of the week, and was sanctified by God to be the weekly Sabbath, until by the full exhibition of Christ a perfect redeemer in his resurrection on the first day of the week, that first day became a more blessed day, and by Christ the Lord of the Sabbath, was sanctified, and had the honour of the weekly Sabbath transferred unto it, and is to be observed of Christians for their holy day of rest, until they come to the eternal rest in heaven.</p></blockquote>

<blockquote><p>This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top.</p></blockquote>

ine.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=This%20foolish%20imitation%20of%20the%20apostles,the%20ear%2C%20preach%20upon%20the%20house%2Dtop&amp;text=This%20foolish%20imitation%20of%20the%20apostles%20in%20all&amp;text=heard%20in%20the%20ear%2C%20preach%20upon%20the%20house%2Dtop" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>V. Will worship, when God is worshiped with a naked and bare good intention, not warranted by the word of God. (Colossians 2:23) “Which things have indeed a shew o wisdom in will worship, and humility, and neglecting of the body; not in any honour to the satisfying of the flesh.” (1 Samuel 13:9–10) “And Saul said, bring hither a burnt offering to me, and peace offerings. And he offered the burnt offering. And it came to pass, that as soon as he had made an end offering the burnt offering, behold Samuel came.” and verse 13,”And Samuel said to Saul, Thou hast done foolishly: thou has not kept the commandment of the LORD thy God, which he commanded thee.” Hitherto we may add popish superstitions in sacrifices, meats, holydays, apparel, temporary and beadridden prayers, indulgences, austere life, whipping, ceremonies, gestures, gate, conversation, pilgrimage, building of altars, pictures, Churches, and all other of that rabble. To these may be added consort in music in divine service, feeding the ears, not edifying the mind. (1 Corinthians 14:15) “What is it then? I will pray with the spirit, and I will pray with the understanding also: I will sing with the spirit and I will sing with the understanding also..” Justin Martyr in his book of Christian Questions and Answers 107, It is not the custom of the Churches, to sing their meters with any such kind of instruments, etc. but their manner is to use plain song.</p></blockquote>

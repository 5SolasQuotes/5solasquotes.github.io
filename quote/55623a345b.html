<main class="wrap"><figure class="quote" id="q-55623a345b" data-kw="">
<blockquote><p>For because He executes some things by general and common operation in Nature, other things by particular and proper action in the Church, hence works are accustomed to be distinguished into those of Nature and of Grace. They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. Now the works of Nature are the works of Creation, Conservation, and Governance. For these proceed from God’s common action, Gen. 1 throughout; Mt. 5:45; Acts 17:24ff., are occupied in common nature, and constitute the common principles of natural things. Which is the cause why in order of explication they are premised to the works of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Samuel Rutherford on the Divine Origin of Possibility’ being ch. 8 in</cite>, ed. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology 1560-1775, pp. 142-3, 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

ass="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=In%20his%20%E2%80%98Metaphysical%20investigations%E2%80%99%20%5Bappended%20to,merely%20%E2%80%98in%20potency%E2%80%99%2C%20not%20actually%20existing&amp;text=In%20his%20%E2%80%98Metaphysical%20investigations%E2%80%99%20%5Bappended%20to%20his%20Treatise&amp;text=name%20suggests%2C%20merely%20%E2%80%98in%20potency%E2%80%99%2C%20not%20actually%20existing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d03fe8e670" data-kw="">
<blockquote><p>For even those things which God decided to come to pass contingently as the actions of man, must necessarily by the virtue of God’s decision come to pass, in such a manner as joined with a possibility of not coming to pass, otherwise it were impossible they should come to pass contingently.</p></blockquote>

</figure><figure class="quote" id="q-d00bd64bf3" data-kw="">
<blockquote><p>Although the human will [according to the Roman Catholic Thomist, Domingo Banez] necessarily follows the divine will to attain the good, it does not do so with an absolute necessity (called “necessity of the consequent”) but only with a hypothetical and relative necessity (called “necessity of the consequence”). For example, the fact that the sun shines is an absolute necessity, provoked by the very nature of the sun; however, here we speak of a certain conditional or hypothetical necessity, such as the one the proposition “Peter is seated” has, while Peter is effectively seated. It is not absolutely necessary for Peter to be seated, but, if he is seated, then it is necessary for him (with necessity of consequence) to be seated. Likewise, if God, with his efficacious grace, moves a man here and now to conversion, it is necessary that he performs his conversion, but he will do so freely, because he possesses the intrinsic capacity to do it or not. Moreover, God does not concur in the human act as a partial cause, as Molina thought, but as a principal total cause, while the created free will is also a total but subordinate cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kinds-of-necessity.html">David Torrijos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘De Auxiliis Controversy’, ‘Bañezianism’ in eds. Mário Santiago de Carvalho &amp; Simone Guidi, Conimbricenses.org Encyclopedia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<main class="wrap"><figure class="quote" id="q-eb80694733" data-kw="">
<blockquote><p>When one examines the Psalms of David with Hymns and Spiritual Songs, which was the end-product of this synodical action, one is immediately struck by the fact that the church was concerned with providing the texts of the psalms but not with preserving the Genevan tunes. All but a few of the psalms were presented in four-line stanzas in short metre, common metre, or long metre. In spite of this radical departure from the continental Reformed practice, the book retained settings of each of the 150 psalms and continued to do so in each succeeding psalter until 1869. In the edition of the hymnal published in that year the psalms had nearly disappeared among the 1007 hymns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/various.html">Various</a></span><span class="wk"><span class="lbl">Work:</span> <cite>We Used to Sing Only Psalms — What Happened? 1987 | [Norman] Kansfield comments:</cite></span></figcaption>

<blockquote><p>He [Baynes] subsequently discusses the difference of the words in terms of the manner of singing. He does say that a spiritual song might be one which is framed according to the Scripture (Baynes, [ed. London, 1658,] p. 505), but makes no suggestion that this is to be used in an ordinary public worship context. When he comes to “the sum of the verse,” he speaks of “singing both in private and publick, which this Scripture and Col. 3:16 do commend;” but where he speaks of the church service he confines his terms to “Psalms”—”and all things, Psalms, Prayers in the Church must be to edify” (p. 505). When he finally applies the passage he provides this maxim: “get the spirit of David to sing a Psalm of David” (p. 506).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Winzer, ‘Westminster and Worship Examined: a Review of Nick Needham’s Essay on the Westminster Confession of Faith’s Teaching Concerning the Regulative Principle, the Singing of Psalms, and the Use of Musical Instruments in the Public Worship of God’ from The Confessional Presbyterian #4 (2008)</cite>, p. 264</span></figcaption>

ubsequently%20discusses%20the%20difference,a%20Psalm%20of%20David%E2%80%9D%20%28p.%20506%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1a602939db" data-kw="">
<blockquote><p>Teaching and admonishing one another. This is one way wherein we are to be the means of each others’ instruction and one means whereby the Word of God, particularly that part of the Word that consists in psalms &amp; hymns and spiritual songs is to dwell in us richly in all wisdom. Singing of Psalms is a Great help to a spiritual understanding of the Psalms. The mind of the Holy Ghost in the Psalms is often times conveyed while the Psalm is a singing, and as it is a means of a spiritual understanding of that excellent part of the Word of God… What should be sung, viz. Psalms. What seems to be here intended, at least chiefly, is the Psalms and spiritual songs that are contained in the Word of God, for the apostle is speaking of the Word of God. Let the Word of God, says he, dwell in you richly in all wisdom, and then he mentions singing as a means, but then it must be singing some part of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon Notes on Col. 3:16 in Sermons, Series II, 1736 (WJE Online Vol. 51)</cite></span></figcaption>

<blockquote><p>It is universally conceded that the singing of the Psalms was an essential part of the Christian liturgy from the very beginning… … The introduction of uninspired hymns into the worship of the Church was a gradual process, and it was not until the fourth century that the practice became widespread… The paucity of extant hymns from the early centuries of the Church is rather striking and can only be explained as a result of the firm adherence of the Church as a whole to the inspired Psalms. Says [Phillip] Schaff [a standard Church historian]: ‘We have no complete religious song remaining from the period of persecution (i.e. from the first three centuries) except the song of Clement of Alexandria to the divine Logos–which, however, cannot be called a hymn and was probably never intended for public use; the ‘Morning Song’ and the ‘Evening Song’ in the Apostolic Constitutions [A.D. 380, which songs were for daily use, but were not in the public worship of the Church on the Lord’s Day], especially the former; and the so-called Gloria in Excelsis, which as an expression of the hymn of the heavenly hosts [the first versions of it only included Lk. 2:14, an inspired Bible song], still rings in all parts of the Christian world. Next in order comes Te Deum, in its original eastern form [having originated circa A.D. 387]. The Ter Sanctus [from Isa. 6:3, its later expanded form having originated circa 434-446] and several ancient liturgical prayers may also be regarded as poems. Excepting these hymns [most of which were responsive prayers based on inspired Bible songs and were of late origin] in rhythmic prose, the Greek church of the first six centuries produced nothing in this field which has had any permanent value or general use. It long adhered almost exclusively to the Psalms of David, who, as Chrysostom, says, was first, middle, and last in the assemblies of the Christians: and it had, in opposition to heretical predilections, even a decided aversion to the public use of uninspired songs.’¹ ¹ ‘The Greek and Latin Hymnology,’ British and Foreign Evangelical Review, no. 58, Oct., 1866, p. 680-1 …Extant accounts, for example, of searches made for the books of the Christians during times of persecution, make no mention of hymnals, whereas the canonical Scriptures, and especially copies of the Psalter, are frequently mentioned. Jerome mentions that he learned the psalms as a child and continued to sing them in his old age. … The evidence usually brought forward to establish the use of uninspired hymns in the worship of the early church is rather meager. The four earliest non-canonical witnesses to Christian worship practice are: [1.] 1 Clement (ca. A.D. 96); [2.] The Didache (ca. A.D. 80-100?); [3.] Ignatius’ Epistles, written en route to his martyrdom (ca. A.D. 108); and [4.] Pliny’s letter to Trajan (ca. A.D. 110) quoted by Eusebius. In chronological order the next liturgical text is that contained in Justin’s Apology (ca. A.D. 150-153). Of these Pliny’s letter is the only witness that bears in a direct way upon the question of the content of the hymns sung by early Christians and its interpretation is much debated. Ignatius in Ephesians IV describes the Christian worship service using a rather elaborate musical metaphor and supposed ‘hymnic’ passages have been ‘isolated’ in both the Didache and in the letters of Ignatius, but there is nothing in these sources that can with confidence be pointed to as a record of early Christian hymnody. Pliny’s letter thus becomes the only early witness of a positive nature to the hymnody of the early church… …he [Pliny, A.D. 111-112] says that the Christians were in the habit of meeting ‘before dawn on a stated day and singing alternately a hymn to Christ as to God.’ The meaning of the key term carmen (‘hymn’) in this clause has been much debated. On the basis of parallels with the Jewish Sabbath service, C.J. Kraemer and E.C. Ratcliff take it to refer to an Old Testament Psalm. J.B. Lightfoot remarks that the term carmen can be used of ‘any set form of words’ and does not have to presuppose a metrical composition at all. Along the same lines J. Stevenson renders the phrase in question as, ‘recite by turns a form of words.’ In support of this interpretation it is pointed out that the primary meaning of the verb used in the clause (dicere) is ‘to say’ or ‘to declare,’ not ‘to sing.’… The fact of the matter is that none of the current interpretations of Pliny’s letter requires that we see in it a reference to the singing of uninspired compositions, and there is nothing in the passage to preclude its being seen as a reference to the inspired Psalms… … The historical evidence that has come down to us [only some of which has been quoted above] thus presents a picture of widespread commitment to canonical psalmody, a commitment which only gradually deteriorated under the influence of heretical compositions… Attempts to marshal evidence from the post-Apostolic period to buttress attempts to show that uninspired hymns were common in the Apostolic church, are, and always will be, futile.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, pp. 154-67.</span></figcaption>

+in+this+field+which+has+had+any+permanent+value+or+general+use.+It+long+adhered+almost+exclusively+to+the+Psalms+of+David%2C+who%2C+as+Chrysostom%2C+says%2C+was+first%2C+middle%2C+and+last+in+the+assemblies+of+the+Christians%3A+and+it+had%2C+in+opposition+to+heretical+predilections%2C+even+a+decided+aversion+to+the+public+use+of+uninspired+songs.%E2%80%99%C2%B9+%C2%B9+%E2%80%98The+Greek+and+Latin+Hymnology%2C%E2%80%99+British+and+Foreign+Evangelical+Review%2C+no.+58%2C+Oct.%2C+1866%2C+p.+680-1+%E2%80%A6Extant+accounts%2C+for+example%2C+of+searches+made+for+the+books+of+the+Christians+during+times+of+persecution%2C+make+no+mention+of+hymnals%2C+whereas+the+canonical+Scriptures%2C+and+especially+copies+of+the+Psalter%2C+are+frequently+mentioned.+Jerome+mentions+that+he+learned+the+psalms+as+a+child+and+continued+to+sing+them+in+his+old+age.+%E2%80%A6+The+evidence+usually+brought+forward+to+establish+the+use+of+uninspired+hymns+in+the+worship+of+the+early+church+is+rather+meager.+The+four+earliest+non-canonical+witnesses+to+Christian+worship+practice+are%3A+%5B1.%5D+1+Clement+%28ca.+A.D.+96%29%3B+%5B2.%5D+The+Didache+%28ca.+A.D.+80-100%3F%29%3B+%5B3.%5D+Ignatius%E2%80%99+Epistles%2C+written+en+route+to+his+martyrdom+%28ca.+A.D.+108%29%3B+and+%5B4.%5D+Pliny%E2%80%99s+letter+to+Trajan+%28ca.+A.D.+110%29+quoted+by+Eusebius.+In+chronological+order+the+next+liturgical+text+is+that+contained+in+Justin%E2%80%99s+Apology+%28ca.+A.D.+150-153%29.+Of+these+Pliny%E2%80%99s+letter+is+the+only+witness+that+bears+in+a+direct+way+upon+the+question+of+the+content+of+the+hymns+sung+by+early+Christians+and+its+interpretation+is+much+debated.+Ignatius+in+Ephesians+IV+describes+the+Christian+worship+service+using+a+rather+elaborate+musical+metaphor+and+supposed+%E2%80%98hymnic%E2%80%99+passages+have+been+%E2%80%98isolated%E2%80%99+in+both+the+Didache+and+in+the+letters+of+Ignatius%2C+but+there+is+nothing+in+these+sources+that+can+with+confidence+be+pointed+to+as+a+record+of+early+Christian+hymnody.+Pliny%E2%80%99s+letter+thus+becomes+the+only+early+witness+of+a+positive+nature+to+the+hymnody+of+the+early+church%E2%80%A6+%E2%80%A6he+%5BPliny%2C+A.D.+111-112%5D+says+that+the+Christians+were+in+the+habit+of+meeting+%E2%80%98before+dawn+on+a+stated+day+and+singing+alternately+a+hymn+to+Christ+as+to+God.%E2%80%99+The+meaning+of+the+key+term+carmen+%28%E2%80%98hymn%E2%80%99%29+in+this+clause+has+been+much+debated.+On+the+basis+of+parallels+with+the+Jewish+Sabbath+service%2C+C.J.+Kraemer+and+E.C.+Ratcliff+take+it+to+refer+to+an+Old+Testament+Psalm.+J.B.+Lightfoot+remarks+that+the+term+carmen+can+be+used+of+%E2%80%98any+set+form+of+words%E2%80%99+and+does+not+have+to+presuppose+a+metrical+composition+at+all.+Along+the+same+lines+J.+Stevenson+renders+the+phrase+in+question+as%2C+%E2%80%98recite+by+turns+a+form+of+words.%E2%80%99+In+support+of+this+interpretation+it+is+pointed+out+that+the+primary+meaning+of+the+verb+used+in+the+clause+%28dicere%29+is+%E2%80%98to+say%E2%80%99+or+%E2%80%98to+declare%2C%E2%80%99+not+%E2%80%98to+sing.%E2%80%99%E2%80%A6+The+fact+of+the+matter+is+that+none+of+the+current+interpretations+of+Pliny%E2%80%99s+letter+requires+that+we+see+in+it+a+reference+to+the+singing+of+uninspired+compositions%2C+and+there+is+nothing+in+the+passage+to+preclude+its+being+seen+as+a+reference+to+the+inspired+Psalms%E2%80%A6+%E2%80%A6+The+historical+evidence+that+has+come+down+to+us+%5Bonly+some+of+which+has+been+quoted+above%5D+thus+presents+a+picture+of+widespread+commitment+to+canonical+psalmody%2C+a+commitment+which+only+gradually+deteriorated+under+the+influence+of+heretical+compositions%E2%80%A6+Attempts+to+marshal+evidence+from+the+post-Apostolic+period+to+buttress+attempts+to+show+that+uninspired+hymns+were+common+in+the+Apostolic+church%2C+are%2C+and+always+will+be%2C+futile.%E2%80%9D%0A%0A%E2%80%94+Michael+Bushell%2C+Songs+of+Zion%3A+A+Contemporary+Case+for+Exclusive+Psalmody%2C+pp.+154-67.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote% hepherd, and Sovereign.’ – Cyril J. Barber Owen, George Frederick – The Shepherd Psalm of Palestine (Eerdmans, 1958) 84 pp. ToC ‘Rich and rewarding, and vividly recreates the historic setting which gave rise to this psalm.’ – Cyril J. Barber Keller, Phillip – A Shepherd Looks at Psalm 23 (Billy Graham Evangelistic Association, 1970) 150 pp. ToC Popularly written, it has often been reprinted as a classic. Barclay, Ian – He is Everything to Me: an Exposition of Psalm 23 (Falcon Books: 1972) 90 pp. ToC Barclay (1907–1978) was a Scottish author, radio and television presenter, Church of Scotland minister, and Professor of Divinity and Biblical Criticism at the University of Glasgow. He was a popular Bible commentator. He has described himself as a “liberal evangelical”. Beeke, Joel – The Lord Shepherding his Sheep Buy (Evangelical Press, 1993) 304 pp. ToC . 2000’s Herrick, Greg – ‘An Exposition of Psalm 23’ (2004) at Bible.org Rose Publishing – Psalm 23: The Beloved Psalm Brought to Life for Today’s Readers (Rose Publishing, 2008) 16 pp. This pamphlet is a word-by-word study providing a meaning and an application for each phrase, as well as related Bible passages. Table Talk – Psalm 23 (Aug. 2018) Briggs, Richard S. – The Lord Is My Shepherd: Psalm 23 for the Life of the Church (Baker Academic, 2021) 224 pp. About Blurb: “Internationally recognized Old Testament scholar Richard Briggs helps readers understand the power and vision of Psalm 23. He offers a close word-by-word and phrase-by-phrase reading… showing how it can speak afresh to the life of the church today. Briggs explores the reception of Psalm 23 down through the ages, covers background issues, and examines the ways the psalm addresses practical issues such as stress, death, enemies, and hope.</p></blockquote>

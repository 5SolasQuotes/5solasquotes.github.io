<main class="wrap"><figure class="quote" id="q-1d70dc7ea4" data-kw="">
<blockquote><p>But what was this gospel which Jesus proclaimed. this gospel that is now to replace the gospel about Him which has been proclaimed by the Apostle Paul and the historic Church? Our only knowledge of it is obtained from the works of Jesus that are recorded in the New Testament. But those words as they stand make it abundantly plain that they gospel which Jesus proclaimed was also, at its very centre, a gospel about Him; it did far more than set forth a way of approach to God which Jesus Himself followed, for it presented Jesus as Himself the way which could be followed by sinful men. According to the New Testament our Lord even in the days of His flesh presented Himself not merely as Teacher and Example and Leader but also, and primarily, as Savior; He offered Himself to sinful men as One who alone could give them entrance into the Kingdom of God; everything in His teaching pointed forward to His redeeming work in His death and resurrection; the culmination of Jesus’ gospel was the Cross. The significance of redemption could not, indeed, be fully pointed out until redemption had actually been accomplished; and our Lord therefore pointed forward to the fuller revelation which was to be given through His apostles: but, although only by way of prophecy, yet clearly enough, He did, even when He was on earth, tell men what He had come into the world to do. “The Son of Man,” He said, “came not to be ministered unto, but to minister, and to give His life a ransom for many.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Is Faith?</cite>, (Grand Rapids: Eerdmans, 1946), 107–08.</span></figcaption>

ote/1d70dc7ea4.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/10/machen-according-to-christ-the-gospel-is-about-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-wendelin.html">Francis Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, bk. 1, ch. 19, pp. 395-96 in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 402</span></figcaption>

<blockquote><p>The learned and renowned [reformed] professors of Leiden answer [that] the end of synods is not by any means, good or bad, to remove controversies, but to bury them by the power of the Word. 2. Only external peace separated from truth should not be intended [by synods regarding controversies], but [external peace should be] conjoined with truth and peace of conscience.</p></blockquote>

</figure><figure class="quote" id="q-cfe85b8da3" data-kw="">
<blockquote><p>Therefore, whether they seem to abide within [the Church], or are openly outside [of it], whatsoever is flesh is flesh, and what is chaff is chaff, whether they persevere in remaining in their barrenness on the threshing-floor, or, when temptation befalls them, are carried out as it were by the blast of some wind. And even that man is always severed from the unity of the Church which is without spot or wrinkle, who associates with the congregation of the saints in carnal obstinacy. Yet we ought to despair of no man, whether he be one who shows himself to be of this nature within the pale of the Church, or whether he more openly opposes it from without. But the spiritual, or those who are steadily advancing with pious exertion towards this end, do not stray without the pale [of salvation]; since even when, by some perversity or necessity among men, they seem to be driven forth, they are more approved than if they had remained within [the Church], since they are in no degree roused to contend against the Church, but remain rooted in the strongest foundation of Christian charity on the solid rock of unity. For hereunto belongs what is said in the sacrifice of Abraham: “But the birds divided he not.” [Gen. 15]</p></blockquote>

</figure><figure class="quote" id="q-31d09e463d" data-kw="">
<blockquote><p>Now why should we once name or make mention of that third kind of traditions, which do either shake the foundations of the salvation by Christ, either overthrow the things that are built upon that foundation. Such as are the supremacy of the bishop of Rome, the praying to saints, prayer for the dead, the making and the worshipping of idols, the magistral and doctoral determinations (as they call them) of free will, of merit, of pardons and of such other filthiness, the which things seeing they could never be established so long as the authority of the heavenly doctrine stood unshaken in his full force, so are they over impudent which do think that these things may be established either by the false forged title of the Church or by the prescription and length of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the most renowned Prince Louis</cite>, [I] of Bourbon [d. 1569], Prince of Conde [in France]… in A Confession of Faith made by Common Consent of diverse Reformed Churches beyond the Seas: with an Exhortation to the Reformation of the Church. Perused &amp; allowed according to the Queen’s Majesty’s injunctions (London: Wykes, 1568)</span></figcaption>

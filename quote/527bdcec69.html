<main class="wrap"><figure class="quote" id="q-527bdcec69" data-kw="">
<blockquote><p>Lastly, as ’tis the greatest sin, so it makes men obnoxious to the saddest judgements of God, and severest punishments of the magistrate, when a man shall directly and purposely speak reproachfully of God, denying him in his attributes, or attributing that to Him which is inconsistent with his nature; this is called direct and immediate blasphemy, and if it be acted not out of infirmity of nature, the person not being distempered with sickness, melancholy, or madness; but out of malice, deliberation, and obstinacy; then the party is to die without mercy (Lev. 24:13-16). This was no judicial Law, peculiar only to the Jews, but it being of the Law of Nature, is an Universal Law for all Nations. He, whoever he be that shall directly and obstinately blaspheme the Name of the Lord; shall surely die. Hence wicked Jesabel, that she might stone Naboth to death, proclaims him a blasphemer (1 Kings 21:11, 14). This stoning endured till Christ’s time, as appears by their stoning of Steven (Acts 7). Now if every direct and obstinate blasphemers should be stoned to death in England, what showers of stones would there be in all parts of the land? And if Nebuchadnezzar, a heathen, by the light of Nature could make a decree, that who ever blasphemed the God of Heaven, or spake any thing amiss concerning Him, should be cut in pieces, and his house be made a Dung-hill (Dan. 3:29), how much more ought Christian Magistrates to make severe laws for the punishing of such high offenders; lest as their light and charge is greater, so they suffer double punishment. We see how careful magistrates are to punish thieves and murderers of men; and shall spiritual thieves, who rob God of his honor, deny his being, and since they cannot kill Him yet will smite Him with their tongue, be suffered to go unpunished? We see how tender great men are of their own names, honors, privileges, and lives; if any oppose them, he must die for it, and shall he that abuses and blasphemes the King of Kings, not die the death? Surely, as this is the greatest sin, so it should be punished with some eminent and remarkable punishment. This hellish sin defiles the land, and cannot be purged away, but by the death of the blasphemers. Impunity breeds blasphemy, and all manner of sin (Eccl. 8:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, (1658), pp. 64-65</span></figcaption>

<blockquote><p>1st Conclusion. The members of the visible-Church are not mere lictors [those who execute judicial decisions] and executioners of the sentences of the eldership:

1. Because they are to observe, warn, watch over the manners of their fellow members and to teach, exhort and admonish one another; and are guilty if they be deficient in that;

2. Because by the law of charity, as they are brethren under one head Christ, they are to warn and admonish their rulers.</p></blockquote>

</figure><figure class="quote" id="q-09a8066301" data-kw="">
<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects.

1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ.

2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction.

3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), pp. 12-14</span></figcaption>

<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>

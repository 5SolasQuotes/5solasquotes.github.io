<main class="wrap"><figure class="quote" id="q-76183e5ca3" data-kw="">
<blockquote><p>The worship of God, must be expressed with seemly, meet, and convenient gesture. The word translated ‘worship’, signifies doing of reverence with bowing of the body and knee: and therefore it is not an indifferent thing, but necessary, to use convenient gesture in God’s worship, that thereby the grace and humility of the heart may be expressed. The angels that stand before the throne of God, have two wings to cover their feet, and two to cover their faces: thereby testifying their reverence to God’s majesty; In this point also many come short: for as the common complaint is, the manner of many is to lie snorting and sleeping under men’s elbows at sermons, and in the time of prayer to sit unreverently with their heads covered. These things ought not to be: for God is Lord of body and soul, and ought to be worshipped with both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation… (d. 1602; London, 1606)</cite>, ch. 3, p. 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb9354003c" data-kw="">
<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-a376e8e896" data-kw="">
<blockquote><p>…Tertullian wanted all females veiled from the time of puberty (1.1; 16.3). Some virgins, to the contrary, were attending the church gatherings unveiled, and some married women made only a token covering of the head (17.1, 4). Both sides, it seems, assumed that married women would be veiled in public. It is not clear whether Tertullian, who was under the influence of the Montanist movement on the basis of a revelation by the Paraclete (1.7) is an innovator or is trying to restore a practice being neglected or abandoned. His description of varied hairstyles (On the Apparel of Women 2.7) indicates not many women were in fact veiled.</p></blockquote>

<blockquote><p>…suppose the 〈◊〉 of churches in a city meet at nine of the clock for God’s 〈◊〉, and in the country parishes adjoining, where many people live at a great distance from their churches, they meet at ten or half an hour after nine, nay in the same church at one and the same time [as they have feed animals, etc. and can’t leave sooner], whilst the Word of God is read or preached, those that sit in seats may have their heads uncovered, and those that stand in allies may keep on their hats the whole sermon〈◊〉, because the crowd or throng may render it inconvenient to keep them off. Now in both these instances there is not uniformity in the same circumstances, and yet there may be order observed, and confusion may very well, notwithstanding, be avoided in all the parts of God’s worship and service.</p></blockquote>

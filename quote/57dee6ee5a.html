<main class="wrap"><figure class="quote" id="q-57dee6ee5a" data-kw="">
<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-larkham.html">Thomas Larkham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Attributes of God Unfolded &amp; Applied... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England.</cite>, pp. 103-4</span></figcaption>

<blockquote><p>Objection: Again it is objected, the apostle Paul says in 1 Tim. 2:4 that God would have all men saved: How should it be then that any should perish, unless his will be changeable? Answer: Ambrose upon this place of the apostle expounds it thus: God will have all men to be saved, but so as they come to Him, He will have them saved; if they will salvation to themselves; and if this sense be admitted, there is no shadow of change in God, though many be not saved, because those many that are not saved, do not seek salvation… God will have all men saved, He wills the salvation even of the reprobate, as a thing in itself good and suitable to the disposition of a gracious God: but yet He does not determine or appoint it, and therefore though many perish, there is no change in God’s will: this place showing what God might approve of being done, not what He determined to do; He wills it by an antecedent will, as in itself considered; but not with a consequent will, and here is no change in God’s will;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Stock of Divine Knowledge, being a lively Description of the Divine Nature, or the Divine Essence, Attributes &amp; Trinity particularly explained and profitably applied… (London: T.H., 1641), ch. 13, pp. 133-34 Stock (c.1568-1626) was an English puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)</p></blockquote>

<blockquote><p>Thirdly, ceremonies called “sacred” are of two sorts, properly so called, or reductively. Properly sacred are all and only such as be of divine institution, which we call also simply necessary, necessitato praecepti [by the necessity of precept]. Reductively sacred are such as in their particular have no divine institution, but are applied in their use to those things which are divine, and these we call arbitrary or ambulatory ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-burges.html">John Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer Rejoined anent Ceremonies to William Ames</cite>, (1631), ‘The Second Point concerns the Sorts and Difference of Ceremonies’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e503c8d926" data-kw="">
<blockquote><p>That the ceremonies are a great hindrance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about. The heathenish priests labored, per varietatem ceremoniarum, rem in pretio retinere [for a variety of ceremonies, a thing of great value to be retained]. The use for which Papists appoint their ceremonies is, ut externam quandam Majestatem sensibus obijciant [that they may cast a certain external majesty before the senses]: And so are the ceremonies urged upon us thought to conciliate reverence and due regard to divine worship, and to stir up devotion. In the meanwhile it is not considered that mentes humanae mirifice capiuntur &amp; fascinantur, ceremoniarum splendore &amp; pompa [human hearts are wonderfully captivated and fascinated by the splendor and pomp of ceremonies]. Videmus siquidem, says Bucer, vulgus delectari actionibus scanicis, &amp; multis uti signis. Chemnitius marks of the cumulating of ceremonies in the ancient Church, that it drew to this, ut tandem in theatricum ferme apparatum ceremonia illa abierint [that so at last by ceremonies they may go wholly prepared to the theater]. Musculus reprehends bishops for departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple. The policy, then, which is most simple and single, and least lustered with the pomp and bravery of ceremonies, cannot but be most expedient for edification. The king’s daughter is most like herselfe when she is all glorious within (Ps. 45:13), not without, and the Kingdom of God appears best what it is, when it comes not with observation (Lk. 17:20-21): But superstition (says [John] Cameron, Popish Prejudices, ch. 10), the mother of ceremonies, is lavish and prodigal; spiritual whoredom as it is, it has this common with the bodily: both of them must have their paintings, their trinkets, their invenglements. Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external. In the second commandment are forbidden omnes Ritus, qui a spirituali Dei cultu discrepant (Calvin, Commentary Ex. 20:5). ‘The Kingdom of God is within you’, says Christ. (Lk. 17:21)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (Edinburgh, 1637), 2nd Part, ch. 4, ‘That the Ceremonies are Inexpedient Because they Hinder Edification’, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-72d522d913" data-kw="">
<blockquote><p>Concerning worshipping or honoring (which two terms are both one)… Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like… God has created us and made us unto his own likeness; and our Saviour Christ has bought us with his blood. And therefore are we God’s possession, of duty and right; and Christ’s servants only, to wait on his will and pleasure, and ought therefore to move neither hand nor foot, nor any other member, either heart or mind, otherwise than He has appointed. God is honoured in his own person, when we receive all things, both good and bad, at his hand; and love his law with all our hearts; and believe, hope, and long for all that He promises.</p></blockquote>

</figure><figure class="quote" id="q-f72a8a70fc" data-kw="">
<blockquote><p>The scope, end and sum of this [2nd] Commandment is to order us in the solemn worship of God, called Heb. 9:1, ‘Ordinances of divine service,’ and usually termed ‘religious exercises.’ For the constituting of a solemn worship of God three things are required:

1. That it be done with immediate reference to God, and that Himself or something in his stead be made the object thereof, and so therein we draw near to Him, and He to us.

2. That it tend in the doer’s intention directly and of itself to the honoring of God and pleasing Him, and getting of grace from him, by exercising of some or all the virtues required in the First Commandment.

3. That there be a separating of ourselves from all other businesses to be wholly and altogether employed about such acts in which the difference between common and solemn worship does seem to stand. Worship consists in three things:

1. There must be a right knowledge and high apprehension of God, the person to be worshipped.

2. A reflexion of this knowledge.

3. An abasement of the creature under the reflexion of this knowledge, Rev. 5: Christ is represented as sitting on a throne. The people of God are there brought in as compassing Him about, they have high apprehensions of the person of Christ, his glory and holiness.

2. They reflect these excellencies.

3. They abase themselves, fall on their faces, vers. ult. Every religious exercise or ordinance of divine service has usually divers particular acts, that be as parts of the whole, and in the orderly uniting of which the whole is accomplished. And whatsoever is done in any such exercise of religion, for the end and purpose of pleasing God and getting grace from him with respect of conscience to Him (as esteeming that He must and will have it so, or else the service shall not be well-pleasing and acceptable to Him) this is a part of worship, or of divine service. For example: a man brought an ox or a ram, a lamb or such like thing, and presented it to the priest, he did offer it unto God, and that directly with intention of exercising obedience and faith to God. Likewise this offering was to be made by a certain person in a certain place, at a certain time, with certain garments and rites: So all those observations became parts of this worship; for in these also the intention of the doer was directly carried to God, hoping and purposing by them to please God and exercise faith and obedience, and other graces, as well and as much as by the very offering itself, and accounting the service not to be acceptable to God without them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: Lee, 1654), bk. 9, ch. 3, ‘2nd Commandment,’ pp. 769-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

ming+that+He+must+and+will+have+it+so%2C+or+else+the+service+shall+not+be+well-pleasing+and+acceptable+to+Him%29+this+is+a+part+of+worship%2C+or+of+divine+service.+For+example%3A+a+man+brought+an+ox+or+a+ram%2C+a+lamb+or+such+like+thing%2C+and+presented+it+to+the+priest%2C+he+did+offer+it+unto+God%2C+and+that+directly+with+intention+of+exercising+obedience+and+faith+to+God.+Likewise+this+offering+was+to+be+made+by+a+certain+person+in+a+certain+place%2C+at+a+certain+time%2C+with+certain+garments+and+rites%3A+So+all+those+observations+became+parts+of+this+worship%3B+for+in+these+also+the+intention+of+the+doer+was+directly+carried+to+God%2C+hoping+and+purposing+by+them+to+please+God+and+exercise+faith+and+obedience%2C+and+other+graces%2C+as+well+and+as+much+as+by+the+very+offering+itself%2C+and+accounting+the+service+not+to+be+acceptable+to+God+without+them.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+System+or+Body+of+Divinity%2C+%E2%80%A6+%28London%3A+Lee%2C+1654%29%2C+bk.+9%2C+ch.+3%2C+%E2%80%982nd+Commandment%2C%E2%80%99+pp.+769-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff72a8a70fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f72a8a70fc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=The%20scope%2C%20end%20and%20sum%20of,be%20acceptable%20to%20God%20without%20them&amp;text=The%20scope%2C%20end%20and%20sum%20of%20this%20%5B2nd&amp;text=not%20to%20be%20acceptable%20to%20God%20without%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…there is also required, that we have Him outwardly in our bodies and external actions; and that is, when as with the outward man we serve and worship Him. The which also we owe unto God, seeing He has created and redeemed both our souls and bodies, that we should in both perform service unto Him…. the Lord require it with the other, and that with the sweet incense of the heart and mind, we offer our bodies also a living sacrifice, holy and acceptable unto Him [Rom. 12:1-2]… Our Sauior also requires, not only that we have in us the heat of spiritual graces, but that also that we cause their light to shine out before men, that they seeing our good works, may glorify our Father which is in heaven… Now this external honour is either in outward signs or actions… Of the other sort is the outward service of God, in calling upon Him, vowing unto Him, swearing by his Name, celebrating feasts to his honor, and all outward obedience to the Law, which, in respect of the person to whom they are to be performed, namely, God alone and no other, are all required in the First Commandment.</p></blockquote>

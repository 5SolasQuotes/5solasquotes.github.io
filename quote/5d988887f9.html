</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4154c0d8a" data-kw="">
<blockquote><p>Even now, at this very moment, we are not selves having and using bodies. We are bodies—we are rational, sentient, organic bodies. Modern thought has rejected this truth. But the fact remains that the human person is a certain, special kind of body… Human biological processes are not possessions and instruments of the person; they are parts of the life of the person… The human soul, which is the person’s intellectual principle, is united to the body as form. As form of the body, the soul is not merely a moving principle of the body. Nor is the soul an agent of which the body is instrument. Rather, the soul is an intrinsic principle of the human person. The soul makes the person be the body he or she is. Nor is there any other form which makes the body be body than the soul by which the person has the capacities of intellect and free choice. Each person has his or her own soul; substantial unity excludes many individuals having the same soul. Since the soul and the body are not distinct entities, no link is needed to unite soul and body. The human soul, as formal part of the body, makes the entire human body be a person; the entire soul is present in every part of the body. All of these points are explained by St. Thomas in a compact, synthetic treatise (S. t., I, qu. 78)… Classical modern philosophy substitued a radical dualism for the substantial unity of man. In Descartes, man is a thinking subject—cogito ergo sum—and the body is consigned to the objective world. In Hume, man is a momentarily unified consciousness—personal identity is continuity by memory over time—and the body is merely one set for phenomena among others… If the person really is not his body, then the destruction of the life of the body is not directly and in itself an attack on a value intrinsic to the human person… If the person really is not his or her own body, then the use of the sexual organs in a manner which does not respect their proper biological teleology is not directly and in itself the perversion of a good of the human person… A manufactured individual will be a person; he or she will deserve our respect as one sharing in personal dignity… But such an individual also will be a product. The producer is on a different level, inescapably superior, from the level of the product. The producer always can say to his product: “I produced you, I can destroy you; I am lord of your life, I am lord of your death”. If human beings are to share in the same personal dignity, they must be begotten, not made. Only in being begotten does an offspring share the same nature and the same personal dignity as his or her parents.</p></blockquote>

</figure><figure class="quote" id="q-61ab4fa8b4" data-kw="">
<blockquote><p>I know the most received opinion is that the soul is created by God, and so becomes defiled with sin by the union of it to the body; as when a man falls into the dirt and is soiled and bedaubed, or as water clean in itself receives filth from an unclean vessell into which it is put… For my own part [his traducianism was stated before this passage on the same page] I cannot conceive either how sin should first be in the body before the soul is united to it, or how the soul should receive infection from the body.</p></blockquote>

<blockquote><p>…our causuists… consider of the conception, either as it is before it receive life, or after that it is animated: Before it receive life, they are wont to determine, that howsoever it were no less than mortal sin, in a physician to prescribe a medicinal receit [prescription] to cause abortion, for the hiding of a sin, or any outward secular occasion, yet for the preservation of the life of the mother, in an extreme danger (I say, before animation) it might be lawful: But after life once received, it were an heinous sin to administer any such mortal remedy. The latter casuists are better advised; and justly hold that to give any such expelling or destructive medicine, with a direct intention to work an abortment (whether before or after animation) is utterly unlawful, and highly sinful: And with them I cannot but concur in opinion; For, after conception we know that naturally follows animation, there is only the time that makes the difference, which in this case is not so considerable as to take off a sin… …the Septuagint in their translation (as [Leonardus] Lessius well observes) have rendered that Mosaical law (in Ex. 21[:22-23]) concerning abortions, in these terms: ‘If a man strike a woman that is with child, and she make an abortion, if the child were formed, he shall give his life for the life of the child; if it were not formed, he shall be punished with a pecuniary mulct to her husband,’ applying that to the issue [the fetus] which the Vulgar Latin understands of the mother; and making the supposition to be of a formation and life, which the Latin more agreeably to the [Hebrew] original, makes to be ‘death’; and our English [KJV], with Castalion expresses by ‘mischief’: but whether the mischief be meant of the death of the mother or of the late-living issue, the Scripture has not declared: Cornelius à Lapide taking it expresly of the mother’s death, yet draws the judgement out, in an equal length to the death of the child, once animated; making no difference of the guilt; since the infant’s soul is of no less worth than her’s that beats him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, … (London, 1654), 2nd Decade, Case 3, ‘Whether may it be lawful, in case of extremity, to procure the abortion of the child for the preservation of the mother?’, pp. 90-91, 93-95. Hall was a godly Anglican bishop.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…our causuists… consider of the conception, either as it is before it receive life, or after that it is animated: Before it receive life, they are wont to determine, that howsoever it were no less than mortal sin, in a physician to prescribe a medicinal receit [prescription] to cause abortion, for the hiding of a sin, or any outward secular occasion, yet for the preservation of the life of the mother, in an extreme danger (I say, before animation) it might be lawful: But after life once received, it were an heinous sin to administer any such mortal remedy. The latter casuists are better advised; and justly hold that to give any such expelling or destructive medicine, with a direct intention to work an abortment (whether before or after animation) is utterly unlawful, and highly sinful: And with them I cannot but concur in opinion; For, after conception we know that naturally follows animation, there is only the time that makes the difference, which in this case is not so considerable as to take off a sin… …the Septuagint in their translation (as [Leonardus] Lessius well observes) have rendered that Mosaical law (in Ex. 21[:22-23]) concerning abortions, in these terms: ‘If a man strike a woman that is with child, and she make an abortion, if the child were formed, he shall give his life for the life of the child; if it were not formed, he shall be punished with a pecuniary mulct to her husband,’ applying that to the issue [the fetus] which the Vulgar Latin understands of the mother; and making the supposition to be of a formation and life, which the Latin more agreeably to the [Hebrew] original, makes to be ‘death’; and our English [KJV], with Castalion expresses by ‘mischief’: but whether the mischief be meant of the death of the mother or of the late-living issue, the Scripture has not declared: Cornelius à Lapide taking it expresly of the mother’s death, yet draws the judgement out, in an equal length to the de — Joseph Hall, Cases of Conscience Practically Resolved… (London, 1654), 2nd Decade, Case 3, ‘Whether may it be lawful, in case of extremity, to procure the abortion of the child for the preservation of the mother?’, pp. 90-91, 93-95. Hall was a godly Anglican bishop.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6our+causuists%E2%80%A6+consider+of+the+conception%2C+either+as+it+is+before+it+receive+life%2C+or+after+that+it+is+animated%3A+Before+it+receive+life%2C+they+are+wont+to+determine%2C+that+howsoever+it+were+no+less+than+mortal+sin%2C+in+a+physician+to+prescribe+a+medicinal+receit+%5Bprescription%5D+to+cause+abortion%2C+for+the+hiding+of+a+sin%2C+or+any+outward+secular+occasion%2C+yet+for+the+preservation+of+the+life+of+the+mother%2C+in+an+extreme+danger+%28I+say%2C+before+animation%29+it+might+be+lawful%3A+But+after+life+once+received%2C+it+were+an+heinous+sin+to+administer+any+such+mortal+remedy.+The+latter+casuists+are+better+advised%3B+and+justly+hold+that+to+give+any+such+expelling+or+destructive+medicine%2C+with+a+direct+intention+to+work+an+abortment+%28whether+before+or+after+animation%29+is+utterly+unlawful%2C+and+highly+sinful%3A+And+with+them+I+cannot+but+concur+in+opinion%3B+For%2C+after+conception+we+know+that+naturally+follows+animation%2C+there+is+only+the+time+that+makes+the+difference%2C+which+in+this+case+is+not+so+considerable+as+to+take+off+a+sin%E2%80%A6+%E2%80%A6the+Septuagint+in+their+translation+%28as+%5BLeonardus%5D+Lessius+well+observes%29+have+rendered+that+Mosaical+law+%28in+Ex.+21%5B%3A22-23%5D%29+concerning+abortions%2C+in+these+terms%3A+%E2%80%98If+a+man+strike+a+woman+that+is+with+child%2C+and+she+make+an+abortion%2C+if+the+child+were+formed%2C+he+shall+give+his+life+for+the+life+of+the+child%3B+if+it+were+not+formed%2C+he+shall+be+punished+with+a+pecuniary+mulct+to+her+husband%2C%E2%80%99+applying+that+to+the+issue+%5Bthe+fetus%5D+which+the+Vulgar+Latin+understands+of+the+mother%3B+and+making+the+supposition+to+be+of+a+formation+and+life%2C+which+the+Latin+more+agreeably+to+the+%5BHebrew%5D+original%2C+makes+to+be+%E2%80%98death%E2%80%99%3B+and+our+English+%5BKJV%5D%2C+with+Castalion+expresses+by+%E2%80%98mischief%E2%80%99%3A+but+whether+the+mischief+be+meant+of+the+death+of+the+mother+or+of+the+late-living+issue%2C+the+Scripture+has+not+declared%3A+Cornelius+%C3%A0+Lapide+taking+it+expresly+of+the+mother%E2%80%99s+death%2C+yet+draws+the+judgement+out%2C+in+an+equal+length+to+the+death+of+the+child%2C+once+animated%3B+making+no+difference+of+the+guilt%3B+since+the+infant%E2%80%99s+soul+is+of+no+less+worth+than+her%E2%80%99s+that+beats+him.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+Cases+of+Conscience+Practically+Resolved%E2%80%A6+%28London%2C+1654%29%2C+2nd+Decade%2C+Case+3%2C+%E2%80%98Whether+may+it+be+lawful%2C+in+case+of+extremity%2C+to+procure+the+abortion+of+the+child+for+the+preservation+of+the+mother%3F%E2%80%99%2C+pp.+90-91%2C+93-95.+Hall+was+a+godly+Anglican+bishop.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F180a781acb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/180a781acb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=consider%20of%20the%20conception%2C%20either%20as,worth%20than%20her%E2%80%99s%20that%20beats%20him&amp;text=consider%20of%20the%20conception%2C%20either%20as%20it%20is&amp;text=no%20less%20worth%20than%20her%E2%80%99s%20that%20beats%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thesis 3. The efficient [cause], or author, is God Himself. Indeed God is worshipped truly and per se by no thing except by which He Himself commands to be worshipped by.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac91a2d43e" data-kw="">
<blockquote><p>Eighthly, God under the New Testament has appointed all his worship in a plain, simple way, not to please the eye, or affect the heart, but only to draw out the spiritual exercise of the soul. Insomuch that it is the most difficult thing that can be: not to be offended at the simplicity of Gods worship now appointed; ‘I am afraid,’ says Paul, ‘as the serpent beguiled Eve, so your minds should be corrupted from the simplicity of the Gospel of Christ.’ [2 cor. 11:3] Paul was afraid of this: the Devil is to be feared more as a glittering subtle serpent than a raging roaring lion: and in nothing does his serpentine art appear more then in introducing worship that is pompous and ceremonious. As children love to play with babies; so do ignorant, carnal people with an external sensible worship. And the more spiritual any ordinance, or the administration of it is, the less glorious it is unto a corrupt heart; whereas a gracious heart [full of God’s grace] sees glorious majesty in spirituality. Christ’s presence in the temple, expounding, informing and reforming, made the second temple more glorious than the former, which did exceed in gold and other magnificence. As the painting of a precious jewel hinders the native and proper luster of it, so does human pomp added to the pure institutions of Christ take off from the innate beauty and glory of them. God indeed in the Old Testament appointed a solemn external worship, full of sensible glory and pomp, but it was because they were infants, and children had rather have a baby than a rich inheritance. Expect therefore in the worship of God, that which may exercise thy faith, heavenly-mindedness, and dependency upon God, which may make a divine impression and stamp upon thy soul, not that which may ravish thy eyes and thy ears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652) | section 3, sermon 27</cite>, p. 158</span></figcaption>

</figure><figure class="quote" id="q-47a0090ec4" data-kw="">
<blockquote><p>The word ‘worship’ in general signifies: 1. Anything done in honor to another; and so all our obedience to God is worship: It is to his glory that we must do all… 2. Any immediate act or expression of the honor and reverence of the heart… This worship, as within, is the secret act of the soul; as expressed, it is the act of the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation… (London: 1684), pt. 2</cite>, pp. 2-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-933beb0721" data-kw="">
<blockquote><p>But there are some so grossly ignorant of what prayer is that they make use of the Ten Commands, and Belief [the Apostles’ Creed] as a prayer: so void are they of the knowledge and spirit of God that they cannot discern betwixt God’s commands to themselves and their own requests to God, betwixt his speaking to men and their speaking to Him, between their professing of Him before men and praying and confessing to Him; all this is but forged imaginary worship, worship falsely so called which the Father seeks not and receives not.</p></blockquote>

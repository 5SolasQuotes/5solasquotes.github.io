<blockquote><p>III. Let then these things be premised. First. Reason signifies either that faculty of man where by he perceives, and judgeth, and distinguisheth truth from falsehood, or those maxims, aphorisms, or axioms, which are either self evident, or believed to be rightly drawn from evident principles. Secondly. Right reason, considered as a faculty, is that which being endued with sufficient light, conceives things, or judgeth concerning them, no otherwise than as they truly are; and is opposed to corrupt, erroneous, blind reason which frequently forms very wrong conceptions and judgements of things. Considered as an axiom, by right reason is meant most certain and evident principles, or inferences drawn there from by plain and evident consequence; and is opposed to rash assertions, spoken without any just examination, or test, of the things so affirmed. Thirdly. Reason is fully persuaded that it judgeth right, when the conceptions, or ideas, of things are clearly and distinctly perceived; nevertheless the often discovers herself to have been mistaken, whilst she thought that she perceived something clearly and distinctly, when at the same time she was in an error. Fourthly. In as far as reason denotes a faculty, it is the next efficient cause of perception and judgement; not the rule: but as it signifies evident and certain axioms it may so far have the nature of a rule that whatever is rejected for false is plainly repugnant to a position of manifest truth, or is not a just and legitimate inference. Fifthly. Faith here notes an assent given to some truth, not on account of the evidence of the thing,* but on account of the testimony of God; who, as he is the supreme truth, bears witness of himself. John 3:33. 1 John 5:9, 10. Sixthly. Those are called the mysteries of faith which no man was ever able to find out by his own reasoning powers, but are known by the revelation of God alone, and are opposed to that which may be known of God by the light of nature. Rom. 1:19. 1 Cor. 2:7. Eph. 3:3. Seventhly. That revelation is contained in the sacred books of the Old and New Testament, which evince their authenticity to the conscience of a serious enquirer, duly attending to the external and internal marks of their divinity; and, if any thing be there plainly taught, it is certainly a great crime to treat them with reproach, under any pretence whatever. IV. These things being premised; the Question is not, Whether the scripture may teach some mysteries contrary to right reason? Nor, whether reason may ever oppose itself to the doctrine of the scripture, under pretence of its own rectitude? Nor, whether investigating the sense of scripture, reason be of great use? For this would be an ambiguous statement of the subject. But, when we enquire into the meaning of the holy scriptures, the question is, Whether then the dictates of what is accounted right reason, must be first consulted, that it may in the first place determine, concerning the things themselves, whether they be worthy a divine revelation; or, whether we ought simply to attend to what the words, in all their circumstances, properly signify, so that what they are found to mean, may forthwith be received for true, without any farther test, or examination, of the things according to pretended axioms of reason? Or, (more briefly stated) whether it is better to explain the words of scripture so that they may agree with the axioms of reason, or to correct the axioms of reason to that sense which the words of scripture plainly speak? The Socinians contend for the former, and support it by their practice; and I wish they only did so: the Orthodox maintain the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on the Use and Abuse of Reason in Matters of Religion</cite>, trans. John Carter (Norwich: Crouse, Stevenson and Matchett, 1795), 4–7.</span></figcaption>

<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>

<blockquote><p>1. Theology is usually divided into the Theology of the Laity and the Theology of the Doctors, which they call argumentative and Scholastic. The former is a bare knowledge of the credibilia (as they call them) necessary for salvation. The latter is not a bare knowledge of the credibilia, but is the faculty by which we are able to explain, defend, and confirm the articles of faith, and to instruct others concerning their truth. 2. Argumentative or Scholastic Theology is said to exceed the Theology of the Laity in a twofold respect: first, because it extends itself to more credibilia; for learned men in spiritual matters understand more than the Laity and the simple. Secondly, because it is able to explain to others those things which are to be believed, and to defend and confirm them against Atheists, Jews, Mohammedans, and Pagans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Philosophy, the Handmaiden of Theology 2nd</cite>, ed. trans. AI (1621; Robinson &amp; Davis, 1658), 3rd Exercise, art. 7, p. 91 Latin</span></figcaption>

<blockquote><p>The extrinsic arguments or testimonies are: 1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions; 2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin, pp. 206-9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The extrinsic arguments or testimonies are: 1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions; 2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian.”

— Gisbertus Voetius, Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin, pp. 206-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+extrinsic+arguments+or+testimonies+are%3A+1.+Internal%2C+of+synteresis+and+conscience%2C+Rom.+2%2C+and+here+about+the+common+notions%3B+2.+External%2C+the+consensus+of+all+nations%2C+and+the+doctrine+of+all+sages.+But+with+all+reasons+having+been+subtracted+and+repeated+thoughts+more+often+recurring%2C+we+have+found+that+the+order+both+of+nature+and+of+our+better+knowledge+is+rather+to+be+observed+and+more+safely+served+in+this+way%2C+that+the+demonstration+from+effects+to+cause%2C+from+works+to+maker+and+governor%2C+be+put+first+as+preeminent+and+universal%2C+which+embraces+all+others+in+itself+since+indeed+all+others+depend+on+it+and+are+derived+from+it%2C+and+all+presuppose+it.+For+no+one+doubts+that+the+law+of+nature+and+of+implanted+common+notion%2C+and+hence+the+acknowledgment+and+profession+of+deity%2C+in+addition+miracles%2C+prophecies+and+political+order%2C+are+to+be+referred+to+the+works+of+God.+As+for+those+axioms+about+causes%2C+about+motion%2C+about+order%2C+those+complex+principles+would+not+exist+unless+those+things+from+which+induction+and+finally+complex+theses+and+principles+arise+had+been+observed+in+the+works+of+God+or+creatures%3B+there+would+not+be+observation+nor+induction+about+and+from+creatures+unless+there+were+creatures.+But+that+this+method+is+safest%2C+most+expeditious%2C+and+most+evident%2C+the+doctrine+and+example+of+the+Holy+Spirit+persuade+Christians%2C+Rom.+1%2C+Ps.+19%2C+Acts+17%2C+Isa.+40%2C+etc.+To+accuse+Him+of+ignorance+or+pseudography+is+atheism+lurking+under+the+cloak+of+a+Christian.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1+Latin%2C+pp.+206-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquo <blockquote><p>We come now to the principle of substance. It is thus formulated: ‘That which exists as the subject of existence is substance, and is distinct form its accidents or modes.’ Thus in everyday speech we call gold or silver a substance. This principle is derived from the principle of identity, because that which exists as subject of existence is one and the same beneath all its multiple phenomena, permanent or successive. The idea of substance is thus seen to be a mere determination of the idea of being. Inversely, being is now conceived explicitly as substantial. Hence the conclusion: The principle of substance is simply a determination of the principle of identity: accidents then find their raison d’etre in the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (n.p., 1946), ch. 4, ‘Intelligible Being &amp; First Principles’, p. 25</span></figcaption>

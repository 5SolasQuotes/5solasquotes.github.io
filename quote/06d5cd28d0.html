<main class="wrap"><figure class="quote" id="q-06d5cd28d0" data-kw="">
<blockquote><p>Why then will they [the Church of Rome] reprehend our singing? ‘Be ye’ (sayeth he) ‘fulfilled with the spirit, speaking amongst yourselves in Psalmes, Hymns and spiritual songs, singing and making melody unto the Lord in your hearts.’ You hear what the apostle of Christ willeth us to do. ‘My songs’ (sayth the prophet David) ‘will I make of thy name, O thou most highest.’ Whosoever therefore rebuketh us for singing of Psalms, the same doth withstand the Scriptures and holy Ghost. But if they themselves do allow their own singings, why then disallow they ours?… Yea, they themselves thus write: ‘Concerning the singing of Hymns, we have the example of our Savior, and of the apostles.’ Be not therefore any longer obstinate, the Psalms of David we sing, never go about to carp our singing. Many other things there be, which in us they do blame.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-evans.html">Lewis Evans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Castle of Christianity detecting the long erring estate, as well of the Roman Church, as of the Bishop of Rome</cite>, … (London, 1568), ‘A Plain Demonstration of the Erring Estate of the Roman Church’, pp. 49-50. Evans (fl. 1574). This book was dedicated to Queen Elizabeth.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, ‘The Causes &amp; Cures of Mental Errors’, p. 476</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

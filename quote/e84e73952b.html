<main class="wrap"><figure class="quote" id="q-e84e73952b" data-kw="">
<blockquote><p>There are various entities which, if they exist, would be candidates for necessary beings: God, propositions, relations, properties, states of affairs, possible worlds, and numbers, among others. Note that the first entity in this list is a concrete entity, while the rest are abstract entities. The main question we will address in this article is: Does God ground the existence of necessarily existing abstract objects?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-davidson.html">Matthew Davidson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God &amp; Other Necessary Beings’ 60 paragraphs and a bibliography in Stanford Encyclopedia of Philosophy online</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

<blockquote><p>This volume was inspired by Etienne Gilson’s query, made in the early 1950s, as to why medieval authors spoke of God’s being as infinite, a statement found neither in Judaeo-Christian scriptures nor in Greek philosophy… It concludes that infinity is predicated of God not only extrinsically, but also intrinsically: His very being is infinite – a predication resting on an Aristotelian theory of act/potency or on a Platonic version of participation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leo-sweeney.html">Leo Sweeney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Infinity in Greek &amp; Medieval Thought Ref</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-3e53347a13" data-kw="">
<blockquote><p>… Whether God is imaginable? It is denied. … Whether we know God immediately, whether in this life or in the future? It is denied. Whether we may know him through intelligible species? It is affirmed. Whether through proper species or indeed through species of creatures? It is distinguished. From whence are those species? It is explained. Whether the created intellect is able clearly and intuitively to see the essence of God? It is denied. Whether the created intellect is able to comprehend the essence of God? It is denied. Whether the essence of God is seen by any created intellect according to any created species? It is denied. … Whether the created intellect needs an intelligible species to see God? It is affirmed. Whether the created intellect needs the light of glory to see God? It is distinguished. Whether God is able to supply the activity of the light of glory? A curious question Whether above natural cognition in the present life another cognition of God may hold through grace? It is affirmed. Whether all beatific visions are equally perfect essentially? It is affirmed. Whether all beatific visions are equally perfect accidentally? It is denied. Whether it may prove that one vision is more perfect than another? It is explained and the question is curious. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(8) ‘Invisibility &amp; Incomprehensibility’ in Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 1, tract 2, I. ‘Of God’, 4. Attributes of God in Specific, 1st Kind Abbr.</span></figcaption>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: 1. Because to act voluntarily is the most noble and plainly absolute perfection of all perfections of which we have an idea, conceived with and under the ratio of the most perfect spontaneity [spontaneitas], whereby He acts spontaneously and according to His own good pleasure: for it is among all other perfections the highest, to be the most free lord of one’s own actions by a certain supreme αὐτεξουσία [self-determination], compelled by no external cause or brute necessity of nature to do anything. And accordingly that free will, or spontaneity, is pre-eminently comprehended in the idea of the supremely perfect being. … §9. According to this diversity of objects, the will of God is partly necessary, partly free. It is necessary because God, beholding Himself, takes delight in Himself in His sufficiency and absolute perfection: and it is called necessary because He has its object so intimately present to Himself in His nature that without this thought God cannot even be conceived. Free is the will of the decree, whereby He determines concerning possible things: and it is called free because it is occupied with things depending purely upon the judgment [arbitrium] of God. … §.13… 3. The will of God is also most free, inasmuch as it is determined by no cause outside God, and this on account of the independence of the divine essence. Nor does it stand in the way that we have a little before distinguished a certain necessary will from the free: since there we regard only the necessary existence of God, and that it effects that the will of God, inasmuch as it regards Himself, cannot be removed from the concept of the Deity. Otherwise, that very will of God by which He loves Himself is supremely free with the freedom of complacency and spontaneous approbation. Meanwhile it is inquired concerning the will of God tending toward creatures (which we have called free, because in them alone a possible existence can be conceived) whether God has willed and wills them with a freedom of indifference. We, if anyone by the indifference of God understands that the will of God in decreeing was not determined by the objects regarded in the decree, acknowledge that all things which are proposed to the decree as possible must in themselves be conceived as indifferent toward futurition, involving no necessity in their concept that they should be made, or compelling God to determine anything. If also by the indifference of the freedom of God anyone understands the sufficiency of God, whereby, being in need of nothing outside Himself, He did not need to seek the supply of any deficiency outside Himself, and therefore to deliberate concerning the production of creatures—in this respect also we acknowledge that God acted with a freedom of indifference. Which, however, is not to be extended so far as though, the will to manifest His glory being posited, His freedom was not determined by His own decency [decentia], which did not admit that He should will otherwise than what is consonant with His glory and virtues. But whether God was so indifferent to creation itself and the manifestation of His glory, considered antecedently to the decree, that He could decently also not create, or not will to manifest His glory, is a problem which is debated among learned men, worthy of further investigation. You may see here the celebrated Wittichius of blessed memory and the celebrated Roëllius disagreeing. 4. We also urge that the will or volition of the eternal God is eternal, because God is a pure act, by no means passing from not willing to willing—which itself also extends to the will of the decree: for unless it were eternal, a change would befall God, which is absurd; or at least a succession of thoughts and anterior and posterior acts, thoughts mutually following one another—which imperfections we have shown, under the heading on the eternity of God, must be removed from God. But if anyone objects that this opinion strips God of all indifference in willing, since the state of indifference must necessarily be conceived before the determination of things made by the decree: I reply: (a.) That indifference is still in question. (b.) Nor does the consequence proceed, since a priority of order suffices for the matter, and a priority of time is not precisely required. Indeed, the freedom of indifference suffices for us, insofar as it excludes determination by objects, or by a necessity of nature, or even by a demand of indigence—since the determination made must be conceived from the eternal good pleasure of God, willing to manifest His glory, and that in the most wise and prudent manner: without which decree we do not conceive that God existed even for a moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

mperfections we have shown, under the heading on the eternity of God, must be removed from God. But if anyone objects that this opinion strips God of all indifference in willing, since the state of indifference must necessarily be conceived before the determination of things made by the decree: I reply: (a.) That indifference is still in question. (b.) Nor does the consequence proceed, since a priority of order suffices for the matter, and a priority of time is not precisely required. Indeed, the freedom of indifference suffices for us, insofar as it excludes determination by objects, or by a necessity of nature, or even by a demand of indigence—since the determination made must be conceived from the eternal good pleasure of God, willing to manifest His glory, and that in the most wise and prudent manner: without which decree we do not conceive that God existed even for a moment.”

— Salomon Van Til, Compendium of Both Theologies, even Natural &amp; Revealed… (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A73.+That+this+will+or+volition+must+be+acknowledged+by+us+in+the+greatest+and+most+worthy+being+%28that+is%2C+God%29+is+established%3A+1.+Because+to+act+voluntarily+is+the+most+noble+and+plainly+absolute+perfection+of+all+perfections+of+which+we+have+an+idea%2C+conceived+with+and+under+the+ratio+of+the+most+perfect+spontaneity+%5Bspontaneitas%5D%2C+whereby+He+acts+spontaneously+and+according+to+His+own+good+pleasure%3A+for+it+is+among+all+other+perfections+the+highest%2C+to+be+the+most+free+lord+of+one%E2%80%99s+own+actions+by+a+certain+supreme+%CE%B1%E1%BD%90%CF%84%CE%B5%CE%BE%CE%BF%CF%85%CF%83%CE%AF%CE%B1+%5Bself-determination%5D%2C+compelled+by+no+external+cause+or+brute+necessity+of+nature+to+do+anything.+And+accordingly+that+free+will%2C+or+spontaneity%2C+is+pre-eminently+comprehended+in+the+idea+of+the+supremely+perfect+being.+%E2%80%A6+%C2%A79.+According+to+this+diversity+of+objects%2C+the+will+of+God+is+partly+necessary%2C+partly+free.+It+is+necessary+because+God%2C+beholding+Himself%2C+takes+delight+in+Himself+in+His+sufficiency+and+absolute+perfection%3A+and+it+is+called+necessary+because+He+has+its+object+so+intimately+present+to+Himself+in+His+nature+that+without+this+thought+God+cannot+even+be+conceived.+Free+is+the+will+of+the+decree%2C+whereby+He+determines+concerning+possible+things%3A+and+it+is+called+free+because+it+is+occupied+with+things+depending+purely+upon+the+judgment+%5Barbitrium%5D+of+God.+%E2%80%A6+%C2%A7.13%E2%80%A6+3.+The+will+of+God+is+also+most+free%2C+inasmuch+as+it+is+determined+by+no+cause+outside+God%2C+and+this+on+account+of+the+independence+of+the+divine+essence.+Nor+does+it+stand+in+the+way+that+we+have+a+little+before+distinguished+a+certain+necessary+will+from+the+free%3A+since+there+we+regard+only+the+necessary+existence+of+God%2C+and+that+it+effects+that+the+will+of+God%2C+inasmuch+as+it+regards+Himself%2C+cannot+be+removed+from+the+concept+of+the+Deity.+Otherwise%2C+that+very+will+of+God+by+which+He+loves+Himself+is+supremely+free+with+the+freedom+of+complacency+and+spontaneous+approbation.+Meanwhile+it+is+inquired+concerning+the+will+of+God+tending+toward+creatures+%28which+we+have+called+free%2C+because+in+them+alone+a+possible+existence+can+be+conceived%29+whether+God+has+willed+and+wills+them+with+a+freedom+of+indifference.+We%2C+if+anyone+by+the+indifference+of+God+understands+that+the+will+of+God+in+decreeing+was+not+determined+by+the+objects+regarded+in+the+decree%2C+acknowledge+that+all+things+which+are+proposed+to+the+decree+as+possible+must+in+themselves+be+conceived+as+indifferent+toward+futurition%2C+involving+no+necessity+in+their+concept+that+they+should+be+made%2C+or+compelling+God+to+determine+anything.+If+also+by+the+indifference+of+the+freedom+of+God+anyone+understands+the+sufficiency+of+God%2C+whereby%2C+being+in+need+of+nothing+outside+Himself%2C+He+did+not+need+to+seek+the+supply+of+any+deficiency+outside+Himself%2C+and+therefore+to+deliberate+concerning+the+production+of+creatures%E2%80%94in+this+respect+also+we+acknowledge+that+God+acted+with+a+freedom+of+indifference.+Which%2C+however%2C+is+not+to+be+extended+so+far+as+though%2C+the+will+to+manifest+His+glory+being+posited%2C+His+freedom+was+not+determined+by+His+own+decency+%5Bdecentia%5D%2C+which+did+not+admit+that+He+should+will+otherwise+than+what+is+consonant+with+His+glory+and+virtues.+But+whether+God+was+so+indifferent+to+creation+itself+and+the+manifestation+of+His+glory%2C+considered+antecedently+to+the+decree%2C+that+He+could+decently+also+not+create%2C+or+not+will+to+manifest+His+glory%2C+is+a+problem+which+is+debated+among+learned+men%2C+worthy+of+further+investigation.+You+may+see+here+the+celebrated+Wittichius+of+blessed+memory+and+the+celebrated+Ro%C3%ABllius+disagreeing.+4.+We+also+urge+that+the+will+or+volition+of+the+eternal+God+is+eternal%2C+because+God+is+a+pure+act%2C+by+no+means+passing+from+not+willing+to+willing%E2%80%94which+itself+also+extends+to+the+will+of+the+decree%3A+for+unless+it+were+eternal%2C+a+change+would+befall+God%2C+which+is+absurd%3B+or+at+least+a+succession+of+thoughts+and+anterior+and+posterior+acts%2C+thoughts+mutually+following+one+another%E2%80%94which+imperfections+we+have+shown%2C+under+the+heading+on+the+eternity+of+God%2C+must+be+removed+from+God.+But+if+anyone+objects+that+this+opinion+strips+God+of+all+indifference+in+willing%2C+since+the+state+of+indifference+must+necessarily+be+conceived+before+the+determination+of+things+made+by+the+decree%3A+I+reply%3A+%28a.%29+That+indifference+is+still+in+question.+%28b.%29+Nor+does+the+consequence+proceed%2C+since+a+priority+of+order+suffices+for+the+matter%2C+and+a+priority+of+time+is+not+precisely+required.+Indeed%2C+the+freedom+of+indifference+suffices+for+us%2C+insofar+as+it+excludes+determination+by+objects%2C+or+by+a+necessity+of+nature%2C+or+even+by+a+demand+of+indigence%E2%80%94since+the+determination+made+must+be+conceived+from+the+eternal+good+pleasure+of+God%2C+willing+to+manifest+His+glory%2C+and+that+in+the+most+wise+and+prudent+manner%3A+without+which+decree+we+do+not+conceive+that+God+existed+even+for+a+moment.%E2%80%9D%0A%0A%E2%80%94+Salomon+Van+Til%2C+Compendium+of+Both+Theologies%2C+even+Natural+%26+Revealed%E2%80%A6+%281703%3B+1719%29%2C+1.+Nature+of+God%2C+subsection+4%2C+%E2%80%98On+the+Will+of+God%E2%80%99+tr.+AI+by+Roman+Prestarri+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9cf5183ee9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9cf5183ee9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/god#:~:text=3.%20That%20this%20will%20or%20volition,God%20existed%20even%20for%20a%20moment&amp;text=3.%20That%20this%20will%20or%20volition%20must%20be&amp;text=conceive%20that%20God%20existed%20even%20for%20a%20moment" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26ebf9e579" data-kw="">
<blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>

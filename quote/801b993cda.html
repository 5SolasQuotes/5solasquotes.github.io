<main class="wrap"><figure class="quote" id="q-801b993cda" data-kw="">
<blockquote><p>[T]he bishop of Rome is Peter’s successor, not in teaching but in denying Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, 2:79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“[T]he bishop of Rome is Peter’s successor, not in teaching but in denying Christ.”

— William Perkins, The Works of William Perkins, 2:79. (HT: Inwoo Lee)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BT%5Dhe+bishop+of+Rome+is+Peter%E2%80%99s+successor%2C+not+in+teaching+but+in+denying+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+The+Works+of+William+Perkins%2C+2%3A79.+%28HT%3A+Inwoo+Lee%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F801b993cda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/801b993cda.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/02/perkins-the-bishop-of-rome-is-peters-successor-in-one-respect-only/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6220ca2321" data-kw="">
<blockquote><p>There is no hierarchy in the church of Christ (Luke 22:25–26; 2 Cor. 1:24; 1 Pet. 5:3). There is no such thing as a diocesan, cathedral, patriarchal, or metropolitan church, for in the New Testament all churches are equal and all have their own ἐπισκοποι; and believers are nowhere instructed to inquire into the legitimate succession of their ministers, but rather to examine the Scriptures and to remain in the teaching [handed down to them] (John 5:39; Acts 17:11; 1 Tim. 4:13–16; 2 Tim. 1:13–14; 3:14–17). Neither does legitimate succession guarantee purity of doctrine (John 8:39; Rom. 2:28; 9:6). [Such succession] would sooner make salvation dependent on certain specific persons and on impracticable, fallible, and often even impossible historical research.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §502</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is no hierarchy in the church of Christ (Luke 22:25–26; 2 Cor. 1:24; 1 Pet. 5:3). There is no such thing as a diocesan, cathedral, patriarchal, or metropolitan church, for in the New Testament all churches are equal and all have their own ἐπισκοποι; and believers are nowhere instructed to inquire into the legitimate succession of their ministers, but rather to examine the Scriptures and to remain in the teaching [handed down to them] (John 5:39; Acts 17:11; 1 Tim. 4:13–16; 2 Tim. 1:13–14; 3:14–17). Neither does legitimate succession guarantee purity of doctrine (John 8:39; Rom. 2:28; 9:6). [Such succession] would sooner make salvation dependent on certain specific persons and on impracticable, fallible, and often even impossible historical research.”

— Herman Bavinck, Reformed Dogmatics, vol. 4, §502">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%20is%20no%20hierarchy%20in%20the%20church%20of%20Christ%20%28Luke%2022%3A25%E2%80%9326%3B%202%20Cor.%201%3A24%3B%201%20Pet.%205%3A3%29.%20There%20is%20no%20such%20thing%20as%20a%20diocesan%2C%20cathedral%2C%20patriarchal%2C%20or%20metropolitan%20church%2C%20for%20in%20the%20New%20Testament%20all%20churches%20are%20equal%20and%20all%20have%20their%20own%20%E1%BC%90%CF%80%CE%B9%CF%83%CE%BA%CE%BF%CF%80%CE%BF%CE%B9%3B%20and%20believers%20are%20nowhere%20instructed%20to%20inquire%20into%20the%20legitimate%20succession%20of%20their%20ministers%2C%20but%20rather%20to%20examine%20the%20Scriptures%20and%20to%20remain%20in%20the%20teaching%20%5Bhanded%20down%20to%20them%5D%20%28John%205%3A39%3B%20Acts%2017%3A11%3B%201%20Tim.%204%3A13%E2%80%9316%3B%202%20Tim.%201%3A13%E2%80%9314%3B%203%3A14%E2%80%9317%29.%20Neither%20does%20legitimate%20succession%20guarantee%20purity%20of%20doctrine%20%28John%208%3A39%3B%20Rom.%202%3A28%3B%209%3A6%29.%20%5BSuch%20succession%5D%20would%20sooner%20make%20salvation%20dependent%20on%20certain%20specific%20persons%20and%20on%20impracticable%2C%20fallible%2C%20and%20often%20even%20impossible%20historical%20research.%E2%80%9D%0A%0A%E2%80%94%20Herman%20Bavinck%2C%20Reformed%20Dogmatics%2C%20vol.%204%2C%20%C2%A7502&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6220ca2321.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6220ca2321.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3a5b0c6743" data-kw="">
<blockquote><p>If God be Jehovah, the supreme Lord, then it condemns the blasphemous papists, who speak after this manner, &#x27;Our Lord God the Pope.&#x27; Is it a wonder the pope lifts his triple crown above the head of kings and emperors, when he usurps God&#x27;s title, &quot;shewing himself that he is God?&quot; 2 Thess. 2:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/names-of-god.html">Names of God</a> › <a href="../topics/existence-and-knowledge-of-god/names-of-god/jehovah.html">Jehovah</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“If God be Jehovah, the supreme Lord, then it condemns the blasphemous papists, who speak after this manner, &#x27;Our Lord God the Pope.&#x27; Is it a wonder the pope lifts his triple crown above the head of kings and emperors, when he usurps God&#x27;s title, &quot;shewing himself that he is God?&quot; 2 Thess. 2:4.”

— Thomas Watson, The Ten Commandments, p. 29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+God+be+Jehovah%2C+the+supreme+Lord%2C+then+it+condemns+the+blasphemous+papists%2C+who+speak+after+this+manner%2C+%27Our+Lord+God+the+Pope.%27+Is+it+a+wonder+the+pope+lifts+his+triple+crown+above+the+head+of+kings+and+emperors%2C+when+he+usurps+God%27s+title%2C+%22shewing+himself+that+he+is+God%3F%22+2+Thess.+2%3A4.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+p.+29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a5b0c6743.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a5b0c6743.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/the-pope-as-antichrist.html">The pope as Antichrist</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;”

— Martin Luther, Commentary on Galatians, p. 214">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Apostle%27s+attack+upon+the+false+apostles+was+not+unjustified.+Neither+are+our+attacks+upon+the+papacy.+When+we+call+the+Pope+the+Antichrist+and+his+minions+an+evil+brood%2C+we+do+not+slander+them.+We+merely+judge+them+by+the+touchstone+of+God%27s+Word+recorded+in+the+first+chapter+of+this+Epistle%3A+%22Though+we%2C+or+an+angel+from+heaven%2C+preach+any+other+gospel+unto+you+than+that+which+we+have+preached+unto+you%2C+let+him+be+accursed.%22%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+p.+214&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75fb9ddff4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75fb9ddff4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7f4a9b7ead" data-kw="Succession">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 5</span></figcaption>

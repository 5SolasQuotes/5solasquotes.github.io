<main class="wrap"><figure class="quote" id="q-c64ad2cf9a" data-kw="">
<blockquote><p>The word “Gospel” is Greek and signifies “joyous news,” because it proclaims the wholesome doctrine of life by divine promise and offers grace and forgiveness of sin. Therefore, works do not belong to the Gospel, for it is not Law; rather, only faith [belongs to the Gospel], for it is altogether a promise and an offer of divine grace. Whoever now believes the Gospel receives grace and the Holy Spirit. This causes the heart to rejoice and find delight in God, and [the heart] then keeps the Law voluntarily, gratuitously, without fear of punishment, without seeking reward, since the heart is perfectly satisfied with God’s grace, by which the Law has been fulfilled. But all these promises from the beginning of the world are founded on Christ; God promises no one this grace except in Christ and through Christ, who is the messenger of the divine promise to the whole world. For this reason He came and through the Gospel brought into all the world these promises, which before this had been proclaimed by the prophets. Therefore, there is nothing that anyone (like the Jews) should expect of the divine promises apart from Christ. Everything is drawn together and enclosed in Christ. Whoever does not hear Him hears no promises of God. For just as God acknowledges no law besides the Law of Moses and the writings of the prophets, so He makes no promises except through Christ alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Year in the Gospels with Martin Luther</cite>, (p. 64). Concordia Publishing. Kindle Edition.</span></figcaption>

<blockquote><p>. . . we must here observe the opposition between the law and the free promise of God in the justification of a sinner. “For if life come by the law, it comes not by the promise,” says Paul. And, “If they which are of the law are heirs, the promise is of none effect” (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 193.</span></figcaption>

<blockquote><p>to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.</p></blockquote>

<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

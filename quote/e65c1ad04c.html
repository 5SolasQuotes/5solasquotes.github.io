<blockquote><p>Again, that these same men admit in God a certain antecedent will of the salvation of all, he himself also acknowledges. From which it follows that, with much greater right, it is admitted in Christ. Moreover, this antecedent will does not pertain only to this: that God, abstracting from the fall of man, is said to desire the salvation of all, insofar as they are men; but, generally, the antecedent will of God is directed toward that which is right, that which is just, that which is good in itself. Thus, because it is right for man to be converted, to do penance, not to despise the goodness of God, not to reject his graces, to approach the Sacraments—God is considered to will all these things by an antecedent will, although, when the individual circumstances are considered, he has not decreed to confer upon each individual efficacious graces by which they certainly arrive at salvation, without which they certainly fall away from salvation. Therefore God does not desire, by an antecedent will, the salvation of all men merely on this account, that he made all rational creatures for blessedness; but also because, since he diffuses very many graces, both external and internal, among the reprobate, which it is unjust for them to abuse, and since he wills that an entrance into his Church should likewise be open to them, he is considered, by an antecedent will, to will that all arrive at salvation, because he would will that they not remain obstinate in wickedness, and that they make good use of the helps offered to them; although, on the other hand, by a will of justice, when all the circumstances are considered, he judged it better to leave them to their wickedness, and not to grant efficacious aids, by which alone the depravity of the human heart is overcome. Hence it is evident that God wills, by an antecedent will, the salvation both of the demons and of reprobate men; nevertheless, in a very different way in the case of men than in that of demons. For since he now offers no helps of grace to demons, nor wills that an entrance into the Church, or the aid of the sacraments, be open to them, consequently neither does he will them to make good use of his grace, which he now grants none to them. But, on the contrary, since men are still on the way, he must be thought, by an antecedent will, to desire for them conversion and a sincere return to himself and a good use of his graces, from which he by no means bars them—none of which he provides toward demons. That antecedent will, moreover, often seems to have been in Christ, as when he wept over Jerusalem and lamented its coming calamities in these words: “Luke says, ‘He wept over it, saying, If you also had known, and indeed in this your day, the things which are for your peace! But now they are hidden from your eyes, because days will come upon you, and your enemies will surround you with a rampart,’ etc.</p></blockquote>

</figure><figure class="quote" id="q-01d73992a9" data-kw="">
<blockquote><p>We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice – also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Backer Academic, 2004), 3:246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-2217e3fe57" data-kw="">
<blockquote><p>It was in itself of infinite value and sufficiency to have been made a price to have bought and purchased all and every man in the world. That it did formally become a price for any is solely to be ascribed to the purpose of God, intending their purchase and redemption by it. The intention of the offerer and accepter that it should be for such, some, or any, is that which gives the formality of a price unto it; this is external. But the value and fitness of it to be made a price arises from its own internal sufficiency. Hence may appear what is to be thought of… [the statement] “The blood of Christ was a sufficient price for the sins of all the world;” –which last expression is corrected by some, and thus asserted, “That the blood of Christ was sufficient to have been made a price for all;” which is most true, as was before declared: for its being a price for all or some does not arise from its own sufficiency, worth, or dignity, but from the intention of God and Christ using it to that purpose, as was declared; and, therefore, it is denied that the blood of Christ was a sufficient price and ransom for all and every one, not because it was not sufficient, but because it was not a ransom. And so it easily appears what is to be owned in the [Lombardian] distinction itself before expressed. If it intend no more but that the blood of our Savior was of sufficient value for the redemption of all and every one, and that Christ intended to lay down a price which should be sufficient [emphasis added; note this is consistent with being in the realm of hypothesis] for their redemption, it is acknowledged as most true.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It was in itself of infinite value and sufficiency to have been made a price to have bought and purchased all and every man in the world. That it did formally become a price for any is solely to be ascribed to the purpose of God, intending their purchase and redemption by it. The intention of the offerer and accepter that it should be for such, some, or any, is that which gives the formality of a price unto it; this is external. But the value and fitness of it to be made a price arises from its own internal sufficiency. Hence may appear what is to be thought of… [the statement] “The blood of Christ was a sufficient price for the sins of all the world;” –which last expression is corrected by some, and thus asserted, “That the blood of Christ was sufficient to have been made a price for all;” which is most true, as was before declared: for its being a price for all or some does not arise from its own sufficiency, worth, or dignity, but from the intention of God and Christ using it to that purpose, as was declared; and, therefore, it is denied that the blood of Christ was a sufficient price and ransom for all and every one, not because it was not sufficient, but because it was not a ransom. And so it easily appears what is to be owned in the [Lombardian] distinction itself before expressed. If it intend no more but that the blood of our Savior was of sufficient value for the redemption of all and every one, and that Christ intended to lay down a price which should be sufficient [emphasis added; note this is consistent with being in the realm of hypothesis] for their redemption, it is acknowledged as most true.”

ationale+in+this+way+%28note+his+hypothetical+and+contrary-to-fact+language%29%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2217e3fe57.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2217e3fe57.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=It%20was%20in%20itself%20of%20infinite,it%20is%20acknowledged%20as%20most%20true&amp;text=It%20was%20in%20itself%20of%20infinite%20value%20and&amp;text=their%20redemption%2C%20it%20is%20acknowledged%20as%20most%20true" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

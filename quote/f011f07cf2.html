<main class="wrap"><figure class="quote" id="q-f011f07cf2" data-kw="">
<blockquote><p>I am fully aware that it has been said that the support of the gospel by the individual members of the church under the New Testament is as much a positive institution as any of the ordinances of the gospel, and the ninth chapter of the first epistle to the Corinthians is referred to as proof. If this were so, Paul must have acted a very unkind and sinful part towards the Corinthians, when he labored among them without receiving any support, as he tells us. [2 Corinthians 11:9] Had it been so, Paul had no right to deprive the Corinthians of such a positive privilege. But the truth is, that while Paul had the right as he says of living by his ministry among them; for reasons of Christian expediency he foregoes his claim, but he did them no injury, which otherwise he must have done on the principle of the objection.

This passage establishes the principle that the minister of the gospel should be rewarded for his spiritual labors, by receiving of carnal things necessary for his external wants, but leaves undetermined by whom this shall be given, whether by individuals or the state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 292-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-fc2f003d25" data-kw="">
<blockquote><p>[A]ll ceremonies and observances instituted by the invention of man to form part of the worship of God are so many sacrileges against Him. For, in the same way as it belongs to Him alone to make the promise, so also to Him alone to choose the seal and to affix it to His promises (Gal 1:8, 9; 1 Cor 11:23-25).

That is why all those who have had the presumption to make new Sacraments or who have added to those which He has established in His Church by His written Word, or have subtracted from them, have falsified the seals of His majesty. As for ourselves, we are satisfied in our Churches with those which God has appointed by His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.33, p. 47.</span></figcaption>

</figure><figure class="quote" id="q-4467fa3875" data-kw="">
<blockquote><p>There was also presented to the Assembly, a new Paraphrase of the Psalms in English meter, which was well liked of and commended by some of the members of the Assembly; But because we conceived that the Psalm Book in all the three Kingdoms was a point of Uniformity much to be desired, we took the boldness (although we had no such express and particular commission) to oppose the present allowing thereof, till the Kirk of Scotland should be acquainted with it; and therefore have we now sent an essay thereof in some Psalms. …As we cannot but admire the good hand of God in the great things done here already, particularly; That the covenant (the foundation of the whole work) is taken, prelacy and the whole train thereof, is extirpated. The service book in many places is forsaken, plain and powerful preaching set up; as are most zealous of the belt of the Reformation; altars removed; the communion in some places given at the table with sitting; the great organs at Paul’s and Peter’s in Westminster taken down; images and many other monuments of idolatry defaced and abolished [spelling updated].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maitland-alex-henderson-samuel-rutherford-robert-baillie-george-gillespie.html">John Maitland, Alex Henderson, Samuel Rutherford, Robert Baillie, George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Letter from the Commissioners at London the General Assembly,” Worcester house, London, May 20</cite>, 1644. pp. 227–28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

 target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-d01a75c6aa" data-kw="">
<blockquote><p>The testimonies of Cyprian, Ambrose, Augustine, are easily answered, in a few words: They speak not of mystical rites, or significant ceremonies, but of some civil external usages gotten into worship; different in diverse places; as Socrates [the early Church, ecclesiastical historian] tells us of many, in his time, as in observation of Easter or Lent: in receiving the Lord’s Supper at evening or morning, standing or sitting, etc. Such an usage in Reformed Churches, is, that somewhere the ministers preach with heads covered, otherwhere, bare-headed, and many the like: In such things, those ancients advise to conform to the usages of the places where they come: but surely, would never have wise people to comply in things inexpediently sinful, in worship, in any place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-bagshaw.html">Edward Bagshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The XXIV Cases concerning things Indifferent in Religious Worship Considered</cite>, … (London, 1663), The Grand Case Considered, I. Touching Things Inexpedient, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

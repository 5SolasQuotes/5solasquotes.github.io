<main class="wrap"><figure class="quote" id="q-142cc5097c" data-kw="">
<blockquote><p>The mortality in our perish is not over yet, though I hoped my child had closed it: but just while I was writing this, I heard of the death of a mother of four small children… carried off at night by a sickness, so far as I could understand, not above two hours long long. Alas! we have provoked our God. By the awful voice of Providence continuing, I was led to Zech. 12:12, ‘And the land shall mourn, every family apart,’ etc., on which I dwelt from 11th March till 20th May; and for some time after, on Ps. 126:5, ‘They that sow in tears, shall reap in joy.’ Upon the former of these I pressed the duty of personal and family fasting, among other things. And this was not without fruit. I knew that some were engaged in these duties; particularly James Biggar’s family, on which the hand of the Lord lay long and heavy, and carried off several of them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Memorial Concerning Personal &amp; Family Fasting &amp; Humiliation on Zech. 12:12</cite>, (†1732) 50 pp. in Works, vol. 11, pp. 343-393 See especially p. 386 ff. | The occasion of this piece (Memoirs, p. 304):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf7bd7b3ab" data-kw="">
<blockquote><p>5. In edifying the family with Psalms and melody to the Lord, as it is, Col. 3:16. In these daily duties doth the sanctification of a family consist… and where this worship of God is not set up in families, there is nothing but a conspiracy of atheists, and a wicked brood bringing God’s judgments on themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Combat &amp; Conquest</cite>, ... ([Cambridge], 1618), on Mt. 4:5-6, p. 173-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

</figure><figure class="quote" id="q-1c292f4b99" data-kw="">
<blockquote><p>…but let the chief study, endeavor and delight of your souls be about that which God most delights into, let the substantials of religion have the first place in the soul; Pray more in secret, that He will be the life of your souls, you ought indeed to attend public ordinances, but above all, take heed to your conversation and walking at home, and in secret, prayer in your family is a more substantial worship than to sit and hear prayer in public, and prayer in secret is more substantial than that: The more retired and immediate a duty be, the more weighty it is, the more it cross thy corruptions; and evidence the stamp of God on thy affections, the more divine it is; And therefore to serve God in these, is to serve Him in truth. Practice has more of truth in it than a profession… Duties that have more opposition from our natures against them: and less fuel or oil to feed the flame of our self-love and corruption, have more truth in them;</p></blockquote>

</figure><figure class="quote" id="q-cfcf386ef9" data-kw="">
<blockquote><p>[D]ear brethren, if you look for a life to come, of necessity it is that you exercise yourselves in the book of the Lord your God. Let no day slip or want some comfort received from the mouth of God. Open your ears, and He will speak even pleasant things to your heart. Close not your eyes, but diligently let them behold what portion of substance is left to you within your Father’s testament. Let your tongues learn to praise the gracious goodness of him, whose mere mercy has called you from darkness to life. Neither yet may you do this so quietly that you admit no witness. No, brethren, you are ordained of God to rule your own houses in his true fear, and according to his word. Within your houses, I say, in some cases, you are bishops and kings; your wife, children, servants, and family are your bishopric and charge. Of you it shall be required how carefully and diligently you have instructed them in God’s true knowledge, how you have studied to plant virtue in them, and [to] repress vice. And therefore I say, you must make them partakers in reading, exhorting, and in making common prayers, which I would in every house were used once a day at least. But above all things, dear brethren, study to practice in life that which the Lord commands, and then be you assured that you shall never hear nor read the same without fruit. And this much for the exercises within your homes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A most wholesome counsel how to behave ourselves</cite>, 1577</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/family-and-private-worship.html">Family and Private Worship</a></span></div>

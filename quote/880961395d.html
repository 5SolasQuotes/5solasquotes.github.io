<main class="wrap"><figure class="quote" id="q-880961395d" data-kw="">
<blockquote><p>To the question, “If the Law does not justify, what is its purpose?” Paul, therefore, replies: “Although the Law does not justify, it is nevertheless extremely useful and necessary. In the first place, it acts as a civic restraint upon those who are unspiritual and uncivilized. In the second place, it produces in a man the knowledge of himself as a sinner, who is therefore subject to death and worthy of eternal wrath.” But what is the value of this effect, this humiliation, this wounding and crushing by the hammer? It has this value, that grace can have access to us. Therefore the Law is a minister and a preparation for grace. For God is the God of the humble, the miserable, the afflicted, the oppressed, the desperate, and of those who have been brought down to nothing at all. And it is the nature of God to exalt the humble, to feed the hungry, to enlighten the blind, to comfort the miserable and afflicted, to justify sinners, to give life to the dead, and to save those who are desperate and damned. For He is the almighty Creator, who makes everything out of nothing. In the performance of this, His natural and proper work, He does not allow Himself to be interfered with by that dangerous pest, the presumption of righteousness, which refuses to be sinful, impure, miserable, and damned but wants to be righteous and holy. Therefore God has to make use of that hammer of His, namely, the Law, to break, bruise, crush, and annihilate this beast with its false confidence, wisdom, righteousness, and power, so that it learns that it has been destroyed and damned by its evil. Then, when the conscience has been terrified this way by the Law, there is a place for the doctrine of the Gospel and of grace, which raises it up again and comforts it; it says that Christ did not come into the world to break the bruised reed or to quench the dimly burning wick (Is. 42:3) but to announce the Gospel to the poor, to bind up the brokenhearted, and to proclaim liberty to the captives (Is. 61:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 314–315.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-052ea44d12" data-kw="">
<blockquote><p>Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life, reason and order require that I should here begin to treat of both. The shortest transition, however, will be from faith to repentance; for repentance being properly understood it will better appear how a man is justified freely by faith alone, and yet that holiness of life, real holiness, as it is called, is inseparable from the free imputation of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.1</span></figcaption>

</figure><figure class="quote" id="q-0302ebf39b" data-kw="">
<blockquote><p>When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. When we say by faith only, this opposes all other graces of the same order, but not the merits of Christ or the efficacy of God’s grace; the apostle, Rom. 4, makes it all one to prove a man justified by grace, Christ and by faith. It is to be considered as alone in the act of justification, but not in the subject justified; therefore that is a reproach cast on Protestants to call them Solifidians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’, pp. 528-29</span></figcaption>

<blockquote><p>Question 36. But how are we justified by faith? Answer: Not because of the worthiness of our faith, as if God justifies us because of it, as the Remonstrants would have it, and [as if] faith is here reckoned as a virtue and a remarkable good work, and therefore as the meritorious cause of the same [i.e. of justification]. …Question 38. How should faith here then be understood? Answer: As a hand or instrument, whereby we grab and take hold of the righteousness of the Redeemer, hence the sayings ‘take hold of God’s strength’ Is. 27:5; ‘receiving Jesus’ Jn. 1:12; ‘receiving the gift of righteousness’ Rom 5:17 and Acts 26:18. Question 39. By which analogy do you clear this up? Answer: Of the beggar who would receive alms of the generosity of a rich man, to which he must stretch out the hand, in which case it [i.e. the hand] deserves nothing, but is only the means by which he receives the gift; or alternatively, of one who in the navigation of the sea capsizes and sees a plank, grabs hold of it, and hauls himself onto it, thereby to be spared.</p></blockquote>

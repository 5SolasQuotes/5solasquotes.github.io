</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3acdf84736" data-kw="">
<blockquote><p>The second note whereby we may discern a judicial law to be moral for his equity, is this: If it follow necessarily and immediately from the light, principles and conclusions of nature. For example, Dt. 22:5, ‘The man shall not put on the things that appertain to the woman, nor the woman the things that appertain to the man.’ This law is more than judicial: for it is a rule of common honesty: practiced in those countries, by the light of nature, where the written law was never known…. This I speak… to show how far judicial laws have morality in them and stand in force.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition, upon the Five First Chapters of the Epistle to the Galatians</cite>, (Cambridge, 1604), p. 234</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-640fec49e5" data-kw="">
<blockquote><p>If any say that I derogate much from the authority of the Church when I do nothing which she prescribes except I see it lawful and expedient, because I should do this much for the exhortation and admonition of a brother. Answer: 1. I give far more reverence to the direction of the Church than to the admonition of a brother, because that is ministerial, this fraternal: that comes from authority, this only from charity: that is public, this private: that is given by many, this by one: And finally, the Church has a calling to direct me in some things wherein a brother has not. 2. If it be still instanced that in the point of obedience, I do no more for the Church than for any brother because I am bound to do that which is made evident to be lawful and expedient, though a private Christian do but exhort me to it, or, whether I be exhorted to it or not. For answer to this I say that I will obey the directions of the Church in many things rather than the directions of a brother; for in two things which are in themselves indifferent, and none of them inexpedient, I will do that which the Church requires, though my brother should exhort me to the contrary. But always I hold me at this sure ground, that I am never bound in conscience to obey the ordinances of the Church except they be evidently lawful and expedient. This is that, sine quo non obligant [without which they do not bind], and also that which does chiefly bind, though it be not the only thing which binds. Now for making the matter more plain we must consider that the constitutions of the Church are either lawful or unlawful: if unlawful, they bind not at all: if lawful, they are either concerning things necessary as Acts 15:28, and then the necessity of the things do bind, whether the Church ordain them or not; or else concerning things indifferent, as when: the Church ordains that in great towns there shall be sermon on such a day of the week and public prayers every day at such an hour, here it is not the bare authority of the Church that binds, without respect to the lawfulness or expediency of the thing itself which is ordained (else we were bound to do everything which the Church ordains, were it never so unlawful, for quod competit alicui qua tali, competit omni tali. We behold the authority of the Church making laws, as well in unlawful ordinances as in lawful, not yet is it the lawfulness or expediency of the thing itself without respect to the ordinance of the Church (for possibly other times and diets were as lawful and expedient too for such exercises, as those ordained by the Church), but it is the authority of the Church prescribing a thing lawful or expedient. In such a case then neither does the authority of the Church bind except the thing be lawful and expedient, not does the lawfulness and expediency of the thing bind except the Church ordain it, but both these jointly do bind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637), pt. 1, ch. 4, pp. 10-11</span></figcaption>

</figure><figure class="quote" id="q-e33149f1c9" data-kw="">
<blockquote><p>Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

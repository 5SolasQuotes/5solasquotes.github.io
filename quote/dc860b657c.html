<main class="wrap"><figure class="quote" id="q-dc860b657c" data-kw="">
<blockquote><p>If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes, not to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

— John Calvin, Institutes of the Christian Religion, 4.2.12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%2C+then%2C+it+is+obvious+that+we+do+not+at+all+deny+that+churches+remain+under+his+tyranny%3B+churches%2C+however%2C+which+by+sacrilegious+impiety+he+has+profaned%2C+by+cruel+domination+has+oppressed%2C+by+evil+and+deadly+doctrines+like+poisoned+potions+has+corrupted+and+almost+slain%3B+churches+where+Christ+lies+half-buried%2C+the+gospel+is+suppressed%2C+piety+is+put+to+flight%2C+and+the+worship+of+God+almost+abolished%3B+where%2C+in+short%2C+all+things+are+in+such+disorder+as+to+present+the+appearance+of+Babylon+rather+than+the+holy+city+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.2.12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F373000dea1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/373000dea1.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-535aa9bb74" data-kw="">
<blockquote><p>Accordingly, he hesitates not to strip Christ in order that he may deck his Pope with the spoils. The Pope, he says, came a light into the world. Blasphemous mouth! will you apply to that fetid monster of yours sacred terms applicable to none but the Son of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Preface / Address to the Reader</span></figcaption>

</figure><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Pope Leo X</cite>, p. 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.”

— Martin Luther, Letter to Pope Leo X, p. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYour+see%2C+however%2C+which+is+called+the+Court+of+Rome%2C+and+which+neither+you+nor+any+man+can+deny+to+be+more+corrupt+than+any+Babylon+or+Sodom%2C+and+quite%2C+as+I+believe%2C+of+a+lost%2C+desperate%2C+and+hopeless+impiety%2C+this+I+have+verily+abominated%2C+and+have+felt+indignant+that+the+people+of+Christ+should+be+cheated+under+your+name+and+the+pretext+of+the+Church+of+Rome%3B+and+so+I+have+resisted%2C+and+will+resist%2C+as+long+as+the+spirit+of+faith+shall+live+in+me.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Letter+to+Pope+Leo+X%2C+p.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F669e01d933.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/669e01d933.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7</span></figcaption>

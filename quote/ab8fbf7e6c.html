<main class="wrap"><figure class="quote" id="q-ab8fbf7e6c" data-kw="">
<blockquote><p>By confused and involved expressions the heretics very frequently elude the truth and secure the ears of the unwary by the mere sound of common words, such as the titles Father and Son, which they do not truthfully utter to express a natural and genuine community of essence: for they are aware that God is called the Father of all creation, and remember that all the saints are named sons of God.

In like manner they declare that the relationship between the Father and the Son resembles that between the Father and the universe, so that the names Father and Son are rather titular than real. For the names are titular if the Persons have a distinct nature of a different essence, since no reality can be attached to the name of father unless it be based on the nature of his offspring. So the Father cannot be called Father of an alien substance unlike His own, for a perfect birth manifests no diversity between itself and the original substance.

Therefore we repudiate all the impious assertions that the Father is Father of a Son begotten of Himself and yet not of His own nature. We shall not call God Father for having a creature like Him in might and activity, but for begetting a nature of an essence not unlike or alien to Himself: for a natural birth does not admit of any dissimilarity with the Father’s nature.

Therefore those are anathema who assert that the Father is Father of a nature unlike Himself, so that something other than God is born of God, and who suppose that the essence of the Father degenerated in begetting the Son. For so far as in them lies they destroy the very birthless and changeless essence of the Father by daring to attribute to Him in the birth of His Only-begotten an alteration and degeneration of His natural essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 20 in Nicene and Post-Nicene Fathers 2, 9: 9.</span></figcaption>

</figure><figure class="quote" id="q-aba4ef230c" data-kw="">
<blockquote><p>But such reasoning [that there is only one divine person, not three], if it is approved, is really the heresy of Sabellius. For if we also affirm of the other person everything we affirm of one person, since the two persons are one thing, then Son and Word and begotten should be affirmed of the Father in the same way that these things are affirmed of the Son. And both Father and begetter and unbegotten should be affirmed of the Son in the same way that the Father is such. But if this is so, the Father does not differ from the Son, nor the Son from the Father. Therefore, there is one person, not two.

For although God will be Father and Son, we affirm two persons because we believe the Father and the Son to be distinct from one another. For a father is always the father of someone, and a son the son of someone, nor is a father ever the father of his very self, or a son the son of his very self; rather, a father is one person, and his son another person, and a son is likewise one person, and his father another person.

Therefore, if the Father in God is not one person, and the one of whom he is the Father another person, and if the Son is not one person, and the one of whom he is the Son another person, we falsely call God a Father or a Son. For there can be no Father in God if the one of whom the Father is supposed to be the Father is not distinct from the Father. And likewise, there can be no Son in God if the one of whom the Son is supposed to be the Son is not distinct from the Son. Therefore, there will be no grounds for us to affirm that there are two persons in God, which we affirm because God is Father, and God is Son, and the Father is ever one person, and the Son another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm-of-canterbury.html">Anselm of Canterbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incarnation of the Word</cite>, (c. 1090), 3 in Anselm of Canterbury: The Major Works, eds Brian Davies and Gillian Evans, Oxford World’s Classics (Oxford: Oxford University Press, 1998), p. 242.</span></figcaption>

</figure><figure class="quote" id="q-7a006bceb9" data-kw="">
<blockquote><p>Some hold that the name HOLY SPIRIT refers exclusively to His office in man’s salvation. But it is necessary to distinguish when truth and error are confusedly put together. The designation SPIRIT OF GOD is the distinctive name of the third person of the Godhead, denoting a divine subsistent, with intelligence and will, proceeding from another. The epithet HOLY, frequently conjoined with the term SPIRIT, gives us a nearer view of the Spirit’s SPECIAL WORK in connection with man’s salvation, and suggests an antithesis to every unholy spirit, whether human or Satanic. The procession of the Spirit is spoken of by our Lord in connection with a reference to the covenant of grace, and doubtless the reason is to show that the natural order in the Godhead is also the order in the execution of the covenant of grace.

Had we no other word of Scripture through which to think on this matter, the single title “THE SPIRIT of GOD” shows the relation of two Persons, the one proceeding from the other, just as the title “the Son of God” proves the eternal Sonship. He is called — (1) the Spirit of the Lord (Isa. 11.2); (2) the Spirit of God (Rom. 8.9); (3) the Spirit that proceedeth from the Father (John 15.26); (4) the Spirit of His Son (Gal. 4.6); and we should grievously err if we believed that these phrases have no significance. We ascribe no such procession to Him as is in any way associated with the idea of imperfection. We acknowledge, however, something fitly represented by the analogy of respiration, for it would be irreverence to imagine that there is no analogy in the terms employed.

The more the matter is discussed, the more is Scripture found to warrant the position that, in the scheme of grace, the acts of the Persons of the Trinity are found to be according to their order of subsistence in the Godhead, and are but the visible manifestation of that order in the divine essence. The Spirit could not be called the Spirit of the Father, or the Spirit of Him who raised up Christ from the dead (Rom. 8.11), unless He proceeded from the Father. He could not be called the Spirit of His Son (Gal. 4.6), or the Spirit of Christ (Rom. 8.9), because He replenished the humanity of Jesus.

Nor does it appear how the Spirit could be sent by Him except upon the footing of that procession by which He is the Spirit of the Son as well as the Spirit of the Father, and which is eternally continued without a past and without a future. The question is important in every respect, because it lies at the foundation of the MISSION OF THE COMFORTER. And as to its practical results, Church history informs us that it is in the last degree calamitous to ignore it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 105-06.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

— George Smeaton, The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882, (Edinburgh: T. &amp; T. Clark, 1882), pp 105-06.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+hold+that+the+name+HOLY+SPIRIT+refers+exclusively+to+His+office+in+man%E2%80%99s+salvation.+But+it+is+necessary+to+distinguish+when+truth+and+error+are+confusedly+put+together.+The+designation+SPIRIT+OF+GOD+is+the+distinctive+name+of+the+third+person+of+the+Godhead%2C+denoting+a+divine+subsistent%2C+with+intelligence+and+will%2C+proceeding+from+another.+The+epithet+HOLY%2C+frequently+conjoined+with+the+term+SPIRIT%2C+gives+us+a+nearer+view+of+the+Spirit%E2%80%99s+SPECIAL+WORK+in+connection+with+man%E2%80%99s+salvation%2C+and+suggests+an+antithesis+to+every+unholy+spirit%2C+whether+human+or+Satanic.+The+procession+of+the+Spirit+is+spoken+of+by+our+Lord+in+connection+with+a+reference+to+the+covenant+of+grace%2C+and+doubtless+the+reason+is+to+show+that+the+natural+order+in+the+Godhead+is+also+the+order+in+the+execution+of+the+covenant+of+grace.%0A%0AHad+we+no+other+word+of+Scripture+through+which+to+think+on+this+matter%2C+the+single+title+%E2%80%9CTHE+SPIRIT+of+GOD%E2%80%9D+shows+the+relation+of+two+Persons%2C+the+one+proceeding+from+the+other%2C+just+as+the+title+%E2%80%9Cthe+Son+of+God%E2%80%9D+proves+the+eternal+Sonship.+He+is+called+%E2%80%94+%281%29+the+Spirit+of+the+Lord+%28Isa.+11.2%29%3B+%282%29+the+Spirit+of+God+%28Rom.+8.9%29%3B+%283%29+the+Spirit+that+proceedeth+from+the+Father+%28John+15.26%29%3B+%284%29+the+Spirit+of+His+Son+%28Gal.+4.6%29%3B+and+we+should+grievously+err+if+we+believed+that+these+phrases+have+no+significance.+We+ascribe+no+such+procession+to+Him+as+is+in+any+way+associated+with+the+idea+of+imperfection.+We+acknowledge%2C+however%2C+something+fitly+represented+by+the+analogy+of+respiration%2C+for+it+would+be+irreverence+to+imagine+that+there+is+no+analogy+in+the+terms+employed.%0A%0AThe+more+the+matter+is+discu

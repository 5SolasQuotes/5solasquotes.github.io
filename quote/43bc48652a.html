<blockquote><p>The most usual word to signify, either the upright is Tham, or Thamim, which commonly is translated perfect, as Gen. 17.1. Deut. 18.13. Ps. 15.2.37.37.119.1. or uprightness, is Thom or thamim, which usually is translated perfection whereby not legal perfection is meant (which is absolute and complete, not only in respect of the parts, but also of degrees) but evangelical, according to the covenant of grace; which is nothing else (the Lord accepting in his children the will for the deed) but integrity or uprightness; and is so expounded Ps. 25.21. Jos. 24.14. Job. 1.1.; 2.3. Ps. 27.7. For very many in the scriptures have this perfection attributed to them, who notwithstanding had their imperfections. as Noah, Gen. 6.9. Job. 1.1.8.2.3. Jacob, Gen. 25.27. &amp;c. of Asa it is said 2. Chro. 15.17. that his heart was perfect all his days: and yet in the next Chapter there are recorded three foul sins, which he committed. 2. Chron. 16.7.10.12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 122-23.</span></figcaption>

<blockquote><p>§VIII. The external means are the Word (James 1:18, “Of his own will begat he us with the word of truth.” v. 21, “receive with meekness the engrafted word, which is able to save your souls.” 1 Pet. 1:23, “Being born again… by the word of God, which liveth.” Lk. 8:15; Gal. 3:2) and the sacraments (Jn. 3:5; Tit. 3:5; Gal. 3:27; Rom. 6:4; Lk. 22:20). The internal is faith (Gal. 5:6), hence in Acts 15:9, hearts are said to be purified by faith.</p></blockquote>

</figure><figure class="quote" id="q-e3cb1665bd" data-kw="">
<blockquote><p>Now yet this might stand, if as learned Mr. [William] Pemble and others assert, sanctification does, in order of nature, precede justification, and which to me seems not remote from truth, or prejudicial to the grace of justification at all, and withal consonant to right reason, for if (as all grant) justification be upon an act of faith on Christ for justification, and that not until then we are justified, as all do and must acknowledge that hold justification by faith, according to the Scriptures, and that an act of faith must proceed from a principle of faith habitually wrought, then necessarily sanctification, taking it for the principles of habitual sanctification, must be in order of nature afore justification; for the seed and principle of faith is a part, and a principal part, of regeneration or sanctification, as taken in that sense, for the working the principles of all grace, and so is agreeable to that order and chain, Rom. 8:29, where ‘called’ is put before being ‘justified,’ as predestination is put before being called, understanding calling, of the working [of] the principles of regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Man’s Restoration by Grace</cite>, ch. 5 in Works (Edinburgh: James Nichol, 1861), p. 537</span></figcaption>

<blockquote><p>3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, pp. 334-35</span></figcaption>

ed by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.”

+God+regenerates+that+He+may+pardon+and+justify%2C+and+restores+first+our+holiness+and+then+our+happiness%3A+%E2%80%99tis+not+consistent+with+God%E2%80%99s+holiness+to+give+us+pardon+and+let+us+alone+in+our+sins.+A+man+would+not+put+a+toad+in+his+bosom.+But+more+fully+to+give+you+a+prospect+into+this+matter%2C+let+us+take+notice+of+the+several+things+which+are+mentioned+in+Scripture%2C+as+belonging+to+our+justification%3A+as+for+instance%3A+Sometimes+we+are+said+to+be+justified+by+grace%2C+as+Rom.+3%3A24%2C+%E2%80%98Being+justified+freely+by+his+grace%E2%80%99%3A+sometimes+by+the+blood+of+Christ%2C+as+Rom.+5%3A9%2C+%E2%80%98Being+justified+by+his+blood%2C+we+shall+be+saved+from+wrath+through+Him%E2%80%99%3A+sometimes+by+faith%2C+as+Rom.+5%3A1%2C+%E2%80%98Being+justified+by+faith%2C+we+have+peace+with+God+through+our+Lord+Jesus+Christ%E2%80%99%3A+sometimes+by+works%2C+James+2%3A24%2C+%E2%80%98Ye+see+then+how+that+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+All+these+things+concur+to+our+justification+and+do+not+contradict%2C+but+imply+one+another%3A+The+first+moving+cause+of+all+is+grace%3B+the+meritorious+cause%2C+is+Christs+blood%3A+the+means+of+applying%2C+or+the+condition+on+our+part+upon+which+we+are+capable+at+first+of+receiving+so+great+a+privilege%2C+is+faith%3A+and+the+means+of+continuing+in+our+justified+estate%2C+is+by+good+works%2C+or+new+obedience.+I+say%2C+our+first+actual+pardon%2C+justification%2C+and+right+to+life%2C+is+given+upon+condition+of+our+first+faith+and+repentance%3B+but+this+estate+is+continued+to+us+both+by+faith%2C+Rom.+1%3A17+and+new+obedience%3B+these+fairly+accord.+The+grace+of+God+will+do+nothing+without+the+intervention+of+Christ%E2%80%99s+merits%3B+and+Christ%E2%80%99s+merits+do+not+profit+us+%E2%80%99till+it+be+applied+by+faith%3B+and+sound+believers+will+live+in+a+course+of+new+obedience.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton%2C+%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+pp.+334-35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa17830e4cd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a17830e4cd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=3.%20How%20it%20can%20stand%20with,in%20a%20course%20of%20new%20obedience&amp;text=3.%20How%20it%20can%20stand%20with%20the%20wisdom&amp;text=will%20live%20in%20a%20course%20of%20new%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XVIII. Baptism indeed promises us the submersion of our Pharaoh and the mortification of sin, yet not so that it is no more or does not trouble us, but only that it does not overcome us, on account of Christ who, by His blood, prevents its power from condemning, and by his Spirit, restrains it from dominating. This is not so that men may sleep securely in their sins, but only that they may not waver and lose heart, who are tickled and pricked by their flesh.</p></blockquote>

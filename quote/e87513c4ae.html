<main class="wrap"><figure class="quote" id="q-e87513c4ae" data-kw="">
<blockquote><p>III. The Church of Rome can be regarded under a twofold view (schesi): either as it is Christian, with regard to the profession of Christianity and of gospel truth which it retains; or papal, with regard to subjection to the pope, and corruptions and capital errors (in faith as well as in morals) which she has mingled with and built upon those truths besides and contrary to the Word of God. We can speak of it in different ways. In the former respect, we do not deny that there is some truth in it; but in the latter (under which it is regarded here) we deny that it can be called Christian and apostolic, but Antichristian and apostate. In this sense, we confess that it can still improperly and relatively be called a Christian church in a threefold respect. First, with respect to the people of God or the elect still remaining in it, who are ordered to come out of her, even at the time of the destruction of Babylon (Rev. 18:4). (2) With respect to external form or certain ruins of a scattered church, in which its traces are seen to this day, both with respect to the Word of God and the preaching of it (which, although corrupted, still remain in her); and with respect to the administration of the sacraments and especially of baptism, which is still preserved entire in her as to substance. (3) With respect to Christian and evangelical truths concerning the one and triune God, Christ the God-man (theanthropo) Mediator, his incarnation, death and resurrection and other heads of doctrine by which she is distinguished from assemblies of pagans and infidels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Q. 14, ‘Can the Church of Rome of Today be Called a True Church of Christ? We Deny Against the Romanists.’, pp. 121-37, p. 121</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

<blockquote><p>3. The most judicious and best approved amongst us do hold that as baptism, so ordination even in Rome is so far forth valid, that upon separation from them, and joining with us, there needs neither new baptism nor a new ordination… The more rigid of them [Brownists], who deny that which he grants, as [John] Robinson and [Henry] Ainsworth, yet acknowledge that in Rome there are some true ordinances, as baptism for instance: And in granting the administration of baptism with those of Rome to be valid, and yet denying the Church to be true, they must needs reject your consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lazarus-seaman.html">Lazarus Seaman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Diatribe Proved to be Paradiatribe</cite>, ... (London: T.R., 1647), ‘Answer to the Tract bearing title, The Judgment of the Reformed Churches’, p. 51 Seaman (d. 1675) was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

0consequence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c0b41dd003" data-kw="">
<blockquote><p>…at least we yield to them [Romanism] that they have baptism, that they have the substance of Christian religion… First concerning baptism, they confess that we have it, and that it may be amongst heretics: Antiquity believed it, and we believe it with antiquity. They reiterate [perform again] not the baptism administred by us, we reiterate not the baptism administered by them… The true circumcision was in the Church of the ten tribes, it was not for all that the true Church: [but] an heretical Church shall have baptism, and yet for all that not cease to be a false Church; not in respect of the baptism, but of her heresy: not in regard of that which is pure in her and of the Lord’s institution, but in regard of her rebellion against the Lord and her own impurity. That they haue baptism then we grant, but so we say have all heretics, so the ten tribes after their apostasy received circumcision; this exception then is frivolous when they pretend that we confess that they have the baptism, and craftily dissemble that which we add, that they have adulterated and depraved it as much as in them lies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of those Plausible Appearances which seem most to commend the Romish Church, and to Prejudice the Reformed</cite>, … (Oxford, 1626), ch. 37, ‘In what sense we yield that the Church of Rome has the substance of true religion, and how she ceases not for all that to be a false Chuch’, pp. 146-47</span></figcaption>

<blockquote><p>Mr. Hooker: ‘It shall follow that the Church of Rome is a true Church, for all the members of that Church have true baptism, which is the formal cause of a true Church: but that is false, that that Church is a true Church.’ [Rutherford’s] Answer: [1.] The conclusion of the connex proposition is nothing against me, who deny Baptism to be the formal cause of Membership. 2. Such a Baptism that is valid, as touching the substance of the seal, as is in Rome: such a Church according to the metaphysic entity and being of a Church, is Rome a Ministerial Church, teaching necessary fundamentals, though darkening and contradicting all; but it is not morally a true Church, but leprous and unclean. See what Junius, Whitaker, Calvin and Rivetus say hereupon: Mr. Hooker is far from their sound expressions…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, ch. 21, pp. 119-120</span></figcaption>

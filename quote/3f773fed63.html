<main class="wrap"><figure class="quote" id="q-3f773fed63" data-kw="">
<blockquote><p>So there be two sort of things in God’s worship: things either [1] merely moral, or [2] merely natural. And here also we consider things circumstantial, as time, place, etc. And circumstances are either [1.] merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship, as are common and unseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof… …as as they are in themselves mere physical acts, kneeling, sitting, standing… time, place, family, country… 1. All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep; or civil, to declaim an oration before the people; or religious, to preach or pray, must be done… in some time, in some place, for they are not actions eternal, and so must be done in time and place… and they are inseparable adjuncts of all these actions because neither actions natural, civil, nor religious, can be performed, but by some persons… in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common, inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse… 3. There be some mixed circumstances, as these same physical circumstances, clothed with their own seasonable conveniences; so time for worship, and due and convenient time is required… a place is required for private worship, and a fit place, such as is not the market-street for private praying; the inconveniency of the circumstance may vitiate [impair the quality or efficiency of] the worship. I did say that Christ Jesus has set down in the Word a perfect platform of Church-Government, in all morals; I say in all morals, because the Word does not teach us any thing of circumstances, physical as physical… And therefore there is no greater reason to put us to prove all the natural and unseparable circumstances of worship, such as time and place, without which it is impossible any action at all can be performed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, pp. 2-4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2380f3e7e6" data-kw="">
<blockquote><p>All this is sealed up to us in the last word, Amen; which may signify, either so be it, so let it be, or so is shall be. The word Amen sometimes is taken nominally: Rev. 3:14, ‘Thus saith the Amen, the faithful and true Witness, the beginning of the creation of God.’ Sometimes it is taken adverbially, and so it signifies verily, and truly; and so either it may express a great asseveration, or an affectionate desire. Sometimes it expresses a great and vehement asseveration: John 6:47, ‘Amen, amen, verily, verily, I say unto you.’ In other places it is put for an affectionate desire: Jer. 28:6. When the false prophets prophesied peace, and Jeremiah pronounced war, ‘Amen! the Lord do so; the Lord perform thy words which thou hast prophesied.’ Amen, it is not an asseveration, as confirming the truth of their prophecy, but expressing his own hearty wish and desire, if God saw it good. Two things are required in prayer—a fervent desire and faith. A fervent desire; therefore it is said, James 5:16, ‘The effectual fervent prayer of a righteous man availeth much.’ And then faith: James 1:6, ‘But let him ask in faith, nothing wavering.’ What is that faith required in prayer? A persuasion that those things we ask regularly according to God’s will, that God will grant them for Christ’s sake. Now both these [things, fervent desire and faith,] Amen signifies: our hearty desire that it may be so; and our faith, that is, our acquiescency in the mercy and power and wisdom of God concerning the event. Christ would have us bind up this prayer, and conclude it thus: Amen, so let it be, so it shall be. Observe hence, That it is good to conclude holy exercises with some vigor and warmth. Natural motion is swifter in the end and close: so should our spiritual affections, as we draw to a conclusion, put forth the efficacy of faith and holy desires, and recollect, as it were, all the foregoing affections; that we may go out of the presence of God with a sweet savor and relish, and a renewed confidence in his mercy and power. Again, this Amen relates to all the foregoing petitions, not to one only. Many, when they hear, ‘Lord, give us this day our daily bread,’ will say, ‘Amen;’ but when they come to the petition, ‘Thy will be done on earth, as it is in heaven,’ they are cold there, and have not hearty desires and earnest affections. Many beg pardon of sin; but to be kept from evil, to bridle and restrain their souls from sin, they do not say amen to that. Many would have defense, maintenance, and victory over their enemies; but not with respect to God’s glory. They forget that petition, ‘Hallowed by thy name;’ but this should be subordinated to his glory. Nay, we must say Amen to all the clauses of this prayer. Many say, ‘Lord forgive us our debts,’ but do not like that, ‘as we forgive our debtors:’ they are loth to forgive their enemies, but carry a rancorous mind to them which have done them wrong. But now we must say Amen to all that is specified in this prayer. Then, Mark this Amen, it is put in the close of the doxology. Observe, hence, There must be a hearty Amen to our praises as well as our prayers, that we may show zeal for God’s glory, as well as affection to our profit. Your Allelujahs should sound as loud as your supplications; and not only say Amen when you come with prayers and requests, things you stand in need of, but Amen when you are praising of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Lord’s Prayer, ‘For ever. Amen.’, in his Works, vol. 1</cite>, pp. 253-4</span></figcaption>

<blockquote><p>Prayer is to be made for things lawful… The reading of the Scriptures, preaching, and hearing the Word of God, singing of psalms; as also the administration of baptism and the Lord’s Supper, are all parts of religious worship of God, to be performed in obedience unto God with understanding, faith, reverence, and godly fear. Solemn humiliations, with fastings and thanksgivings upon special occasions, are in their several times and seasons to be used in a holy and religious manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/congregationalists.html">Congregationalists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Savoy Declaration of Faith &amp; Order, 22.4-5 (1658)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Prayer is to be made for things lawful… The reading of the Scriptures, preaching, and hearing the Word of God, singing of psalms; as also the administration of baptism and the Lord’s Supper, are all parts of religious worship of God, to be performed in obedience unto God with understanding, faith, reverence, and godly fear. Solemn humiliations, with fastings and thanksgivings upon special occasions, are in their several times and seasons to be used in a holy and religious manner.”

</figure><figure class="quote" id="q-c8c613f9fd" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker [a congregationalist]: ‘It is not warrantable that one not in office (says Mr. Rutherford), but a private Christian, should pray, exhort, preside in the framing of a Church and in ordaining of pastors. [Rutherford’s] Answer: The practice of the Church of Scotland will say to this, we allow not public prophesying of unofficed men.’ (Margin Note: Some chief and ordinary church-prophesying and church-praying is given to the unofficed church, as to the only kindly subject by Mr. Hooker: Mr. H., Survey, part 1, ch. 8, p. 52.) [Rutherford’s] Answer: 1. Here is ordinary prophesying, such as that of the apostle Peter at the calling of Matthias (Acts 1[:15-22]) and public Church-prophesying and praying, such as is by the prophets or presbytery of the Church of Antioch, Acts 13[:3]. when Paul and Barnabas were called to be apostles to the gentiles…</p></blockquote>

</figure><figure class="quote" id="q-8227d2ef9f" data-kw="">
<blockquote><p>To join to the public confession some notable promise which may raise sinners to the hope of pardon and reconciliation, there is none among us who does not acknowledge it to be most useful. And indeed from the beginning I wished to introduce this practice; but when certain persons feared that offence might arise from the novelty, I was too ready to yield. Thus the matter was let go. Yet now it would not be seasonable to make any change in this respect; because, before the confession has been finished, a great part of the people begin to rise. Hence we the more earnestly desire, while it is still in your power, that your people be accustomed to both.</p></blockquote>

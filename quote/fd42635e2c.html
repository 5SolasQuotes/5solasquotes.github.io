<main class="wrap"><figure class="quote" id="q-fd42635e2c" data-kw="">
<blockquote><p>It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolize the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal Chronicles attribute its introduction to Pope Vitalian. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore they do wrong that mumble foolishly before God the canonical hours as if superstitious chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13). But to say seven times “glory to God” means that we worship God constantly in Spirit and in truth because seven times means many times — without end (Matt 18; Luke 17; Jerome, Augustine, and Hillary on these passages).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-reformed-churches.html">Hungarian Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hungarian Confessio Catholica</cite>, (1562) in Reformed Confessions of the 16th and 17th Centuries in English Translation, ed. James T. Dennison, Jr., 4 vol. (Grand Rapids: Reformation Heritage Books), 2.565–66.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>

<blockquote><p>6. The Word is God’s mean to work supernatural effects, to convert the soul, Ps. 19:7, to work faith, Jn. 20:3, to edify, Acts 20:32, to save, Rom. 1:16. The obedience to God’s Word, brings peace, Ps. 119:165, comfort, v. 50; Gen. 49:18; Isa. 38:3. But ceremonies, being apt to stir up the dull mind, must be apt to remove natural dullness, which is a supernatural effect, and so to bring, peace, joy, comfort: Organs are now holden by the same right, that they were in Moses’ Law, then they must stir up supernatural joy: There must be peace and comfort in practicing them. Hear how this sounds: ‘This is my comfort, O Lord, in my affliction, that thy surplice, organs, and holy-days have quickened my dull heart.’ Now what comfort [is there], except comfort in the Scriptures? Rom. 15:4. Ceremonies be innocent of all Scriptures [have nothing of the Scriptures in them]. What joy (a proper fruit of the Kingdom of Heaven, Rom. 14:17) can be in sapless ceremonies? Yea, observe: 1. Who truly converted from Popery, who [is] inwardly humbled in soul, does not abhor ceremonies by the instinct of the new birth? 2. What slave of hell and profane person call not for ceremonies? 3. Who has peace in dying that ceremonies were their joy? 7. All lawful ordinances may by prayer be recommended to God for a blessed success as all the means of salvation, Ps. 119:18; Mt. 26:26; Acts 4:29-30. 2. We may thank God for a blessed success, which they have by the working of the spirit of Grace, 2 Cor. 2:24; 1 Cor. 1:4-5; 2 Thess. 1:2-3; Eph. 1:3. 3. We are to have heat of zeal against profaning of Word, sacraments, prayer, or other ordinances of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 132</span></figcaption>

</figure><figure class="quote" id="q-3e726a8c53" data-kw="">
<blockquote><p>It is somewhat remarkable that in our [Scottish] Reformation documents there is no reference to instrumental music. While many Roman practices are condemned in the first Book of Discipline and the Confession of Faith, nothing whatever is said against the use of organs or other instruments of music in the worship of God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sean-p-m-mcdonald.html">Sean P.M. McDonald</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”I will not hear the melody of thy viols’: Opposition to Instrumental Music in Historic Presbyterian &amp; Puritan Worship’ M.A. thesis</cite>, (Liberty University, 2026) 138 pp. Covers Geneva, England, Scotland and the Netherlands, 1500’s to c. 1800, and touches upon Germany. | McDonald, from the second quote above, also appears to interpret silence in foundational Church documents as being against musical instruments. McMillan (p. 94), as quoted by McDonald (p. 33, fn. 74) relates:</span></figcaption>

<blockquote><p>QUESTION CLIV. What are the outward means whereby Christ communicates to us the benefits of his mediation? ANSWER. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation. …It is farther objected that those arguments which have been taken from the practice of the Old Testament church, to prove singing an ordinance, may, with equal justice, be alleged to prove the use of instrumental music in religious worship; since we very often read of their praising God with ‘the sound of the trumpet, psaltery, harp, organ,’ and other musical instruments. This is the principal argument brought for the use of musical instruments by those who defend it and conclude it an help to devotion. But, though we often read of music being used in singing the praises of God under the Old Testament; yet if what has been said concerning its being a type of that spiritual joy which attends our praising God for the privilege of that redemption which Christ has purchased, the objection will appear to have no weight, the type being now abolished, together with the ceremonial law. Besides, though we read of the use of music in the temple-service, yet it does not sufficiently appear that it was ever used in the Jewish synagogues; the mode of worship observed in which more resembled that which is at present performed by us in our public assemblies. But what may sufficiently determine this matter, is that we have no precept nor precedent for it in the New Testament, either from the practice of Christ, or his apostles. Some, indeed, allege that the absence of any such precept or precedent overthrows the ordinance of singing, and pretend that this ought to be no more used by us than the harp, organ, or other musical instruments. But it might as well be objected that, because incense, which was used under the ceremonial law, together with prayer in the temple,n is not now to be offered by us, prayer ought to be laid aside; which is, as all own, a duty founded on the moral law. …Again, when the psalmist makes use of those phrases which are adapted to the ceremonial law, as when he speaks of ‘binding the sacrifice with cords, even unto the horns of the altar,’ or of ‘offering bullocks upon it;’z the language cannot be taken in a literal sense, when applied to the gospel-state. And when we are exhorted to ‘praise God with the psaltery,’ &amp;c., we are to express those acts of faith which are agreeable to the gospel-dispensation. The general rule, indeed, which is applicable to all psalms of a similar nature, is that with the same frame of spirit with which we read them, we ought to sing them.</p></blockquote>

<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments:

1. Christ only administered the Supper in the assembly of the disciples.

2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33).

3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections:

1. Christ performed it in private houses. Reply: But the Church gathered there.

2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments:

1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either.

2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread.

3. There is no example or institution of it in the Word of God. Objections:

1. It is the body of Christ. Reply: No. The body of Christ is not bread.

2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>

quotes.github.io%2Fquote%2F873da605b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/873da605b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Controversy%2011%20%E2%80%93%20Should%20the%20holy,a%20sign%20and%20seal%20of%20it&amp;text=Controversy%2011%20%E2%80%93%20Should%20the%20holy%20Supper%20for&amp;text=it%20is%20a%20sign%20and%20seal%20of%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e301663091" data-kw="">
<blockquote><p>Neither Word nor sacraments, nor anything on the part of the Almighty can be intended in vain, though the end of the ordinance be not obtained. I should have expected some such divinity from the pen of Arminians and Socinians who make God to intend the salvation of all and every one in both the promises of the Gospel, precepts and sacraments, and yet He falls from this end: so you may read, in Arminius, Anti-Perkins, p. 60, that God is disappointed in his end, in both Law and Gospel, and God shooting beside his mark misses the salvation of many, say the Remonstrants at the Synod of Dort, p. 216, and in their confession, ch. 7, sect. 3; and because Socinus thought it hard thus to take from God wise intentions, he did no less than blasphemously deprive Him of his omniscience: So Socians, Contra Puccium, ch. 10, and in Theological Lectures, ch. 11, made all things that are contingently to come uncertain to God: But if you speak of intentio operis, non operantis [the end of the work, not of the worker], that the Supper, in its nature, is ordained…</p></blockquote>

opener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cc25ddb50f" data-kw="">
<blockquote><p>Herein now we disprove the papistical doctrine which allows of private masses and teaches that the priest offers up the body and blood of our Lord for the standers by; and that by the mass he applies the merit of redemption unto them that with devotion come to that sacrifice. For as there is no one word of the Lord extant that commands the priests to sacrifice or privately to apply the supper for others, or that promises anything unto them that stand by and look on it (for He says, “Do this; eat ye and drink ye all in the remembrance of me;” He says not, ‘Look upon the priests only while they be eating and drinking for you’)… … Concerning the place where the supper is to be celebrated, I find no contention has been amongst the most ancient ministers of the Church. It is read how that our Lord Jesus used the hall of a certain private man’s house. And also the apostle Paul both preached and brake bread at Troas in a certain dining-place (Acts 20)… At this present there seems no place to be more worthy or more commodious to celebrate the holy supper in, than that which is appointed for doctrine and prayer. For so have we learned of St. Paul, 1 Cor. ch. 11. Howbeit, if tyrannical power will not suffer us to have a church, what shall let us but that we may reverently celebrate the supper in honest private houses?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, (Parker Society, 1852), 5th Decade, Sermon 9, ‘Of the Lord’s Holy Supper’, pp. 417-8</span></figcaption>

</figure><figure class="quote" id="q-7b062d5e40" data-kw="">
<blockquote><p>From baptism, you [Gilbert Burnet] pass to plead for the private administration of the Communion to persons on death-bed, and this you think the seasonableness of its use and the propriety of its ends to such a case do abundantly persuade: To which I answer:

1. That though at no time faith and love need more to be quickened, the death of Christ more to be remembered, nor communion with the Church to be declared, than in the approach of the last pangs, it will not thence follow that therefore the Communion may then be privately administrat[ed]: for, since not the seasonableness of the fruits, but the warrant and rule given unto us is first to be heeded in the going about of holy administrations; nay, since that without this regard duly adhibit the blessing and fruits are but in vain expected, it is evident that barely from the exigence of the fruits to conclude, in any case, the lawfulness of the celebration, is preposterous religion and worse reason: Now 2. That the rule set down to us in this sacrament does reprobate this your observance is evident not only from that connection that there is and ought to be observed betwixt the word and Sacraments: But, 1. From our Lord’s own pattern in the institution, keeping this solemnity with the company of his disciples, making as it were a little Christian Church:

2. Because the apostle in his regulation of this sacrament, according and with respect to his Master’s pattern, does suppose the Church’s coming together into one place, and consequently the ordinary Church assemblies, as a necessary requisite in the free and peaceable times of the Church:

3. Because the very mystery of the Lord’s Supper, representing the union of believers with and their communion in Jesus Christ their Head and the name that it has thence obtained, 1 Cor. 10:16-17, is not well consistent with this private administration: ‘Tis true, the authors of your [Perth] Articles, not being able to decline the convincing evidence of this reason, do, among other preparations, require that there be three or four, free of lawful impediments, present with the sick person to communicate with him; but as such a packed conventicle, beside other inconveniences, has no just resemblance of the Church her ordinary assemblies, much less can communicating with hand-wealed companions be a sign of that free, equable and comprehensive communion signified by this sacrament; so, it is manifest, that the forementioned requisite is only a colorable evasion, manifestly acknowledging the force of our argument, andin fraudem Legis, salvis verbis sententiam ejus circumveniens: But 3. This your private Communion is to be reprobate because, as the decumbent’s faith, love, and other graces in that hour of his need are only best excited by the means at that time allowed and competent, and the sanctified remembrance and improvement of other privileges and ordinances formerly enjoyed, so, it is certain, that this observance has not only been abused by the Papists unto the abomination of their private mass, but is also rejected by the Reformed Churches, not Lutheran, as found to be inductive of vain superstition wherever it is used; and for this I need not go far in search of confirmations, for you yourself in telling us that your practice was very early in the Church, subjoin that Justin Martyr says they sent of the Eucharist to them that were absent, and that the story of Serapion shows how necessary Christians then thought it to be guarded by this holyviaticum[journey], which two instances, whether true or false, being generally held to be an excess, both inclining to and introductive of vain superstition, and therefore, reckoned among the first Naevi [novelties] appearing in the face of the primitive Church, and now generally disused by all the Churches of Christ, as they are by you adduced, do to evidently demonstrate how much both your spirit and customs do bend to a relapse in these evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam?] 1671), 5th Dialogue, pp. 292-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

introductive of vain superstition, and therefore, reckoned among the first Naevi [novelties] appearing in the face of the primitive Church, and now generally disused by all the Churches of Christ, as they are by you adduced, do to evidently demonstrate how much both your spirit and customs do bend to a relapse in these evils.”

— Robert MacWard, The True Non-Conformist, … ([Amsterdam?] 1671), 5th Dialogue, pp. 292-94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+baptism%2C+you+%5BGilbert+Burnet%5D+pass+to+plead+for+the+private+administration+of+the+Communion+to+persons+on+death-bed%2C+and+this+you+think+the+seasonableness+of+its+use+and+the+propriety+of+its+ends+to+such+a+case+do+abundantly+persuade%3A+To+which+I+answer%3A+1.+That+though+at+no+time+faith+and+love+need+more+to+be+quickened%2C+the+death+of+Christ+more+to+be+remembered%2C+nor+communion+with+the+Church+to+be+declared%2C+than+in+the+approach+of+the+last+pangs%2C+it+will+not+thence+follow+that+therefore+the+Communion+may+then+be+privately+administrat%5Bed%5D%3A+for%2C+since+not+the+seasonableness+of+the+fruits%2C+but+the+warrant+and+rule+given+unto+us+is+first+to+be+heeded+in+the+going+about+of+holy+administrations%3B+nay%2C+since+that+without+this+regard+duly+adhibit+the+blessing+and+fruits+are+but+in+vain+expected%2C+it+is+evident+that+barely+from+the+exigence+of+the+fruits+to+conclude%2C+in+any+case%2C+the+lawfulness+of+the+celebration%2C+is+preposterous+religion+and+worse+reason%3A+Now+2.+That+the+rule+set+down+to+us+in+this+sacrament+does+reprobate+this+your+observance+is+evident+not+only+from+that+connection+that+there+is+and+ought+to+be+observed+betwixt+the+word+and+Sacraments%3A+But%2C+1.+From+our+Lord%E2%80%99s+own+pattern+in+the+institution%2C+keeping+this+solemnity+with+the+company+of+his+disciples%2C+making+as+it+were+a+little+Christian+Church%3A+2.+Because+the+apostle+in+his+regulation+of+this+sacrament%2C+according+and+with+respect+to+his+Master%E2%80%99s+pattern%2C+does+suppose+the+Church%E2%80%99s+coming+together+into+one+place%2C+and+consequently+the+ordinary+Church+assemblies%2C+as+a+necessary+requisite+in+the+free+and+peaceable+times+of+the+Church%3A+3.+Because+the+very+mystery+of+the+Lord%E2%80%99s+Supper%2C+representing+the+union+of+believers+with+and+their+communion+in+Jesus+Christ+their+Head+and+the+name+that+it+has+thence+obtained%2C+1+Cor.+10%3A16-17%2C+is+not+well+consistent+with+this+private+administration%3A+%E2%80%98Tis+true%2C+the+authors+of+your+%5BPerth%5D+Articles%2C+not+being+able+to+decline+the+convincing+evidence+of+this+reason%2C+do%2C+among+other+preparations%2C+require+that+there+be+three+or+four%2C+free+of+lawful+impediments%2C+present+with+the+sick+person+to+communicate+with+him%3B+but+as+such+a+packed+conventicle%2C+beside+other+inconveniences%2C+has+no+just+resemblance+of+the+Church+her+ordinary+assemblies%2C+much+less+can+communicating+with+hand-wealed+companions+be+a+sign+of+that+free%2C+equable+and+comprehensive+communion+signified+by+this+sacrament%3B+so%2C+it+is+manifest%2C+that+the+forementioned+requisite+is+only+a+colorable+evasion%2C+manifestly+acknowledging+the+force+of+our+argument%2C+andin+fraudem+Legis%2C+salvis+verbis+sententiam+ejus+circumveniens%3A+But+3.+This+your+private+Communion+is+to+be+reprobate+because%2C+as+the+decumbent%E2%80%99s+faith%2C+love%2C+and+other+graces+in+that+hour+of+his+need+are+only+best+excited+by+the+means+at+that+time+allowed+and+competent%2C+and+the+sanctified+remembrance+and+improvement+of+other+privileges+and+ordinances+formerly+enjoyed%2C+so%2C+it+is+certain%2C+that+this+observance+has+not+only+been+abused+by+the+Papists+unto+the+abomination+of+their+private+mass%2C+but+is+also+rejected+by+the+Reformed+Churches%2C+not+Lutheran%2C+as+found+to+be+inductive+of+vain+superstition+wherever+it+is+used%3B+and+for+this+I+need+not+go+far+in+search+of+confirmations%2C+for+you+yourself+in+telling+us+that+your+practice+was+very+early+in+the+Church%2C+subjoin+that+Justin+Martyr+says+they+sent+of+the+Eucharist+to+them+that+were+absent%2C+and+that+the+story+of+Serapion+shows+how+necessary+Christians+then+thought+it+to+be+guarded+by+this+holyviaticum%5Bjourney%5D%2C+which+two+instances%2C+whether+true+or+false%2C+being+generally+held+to+be+an+excess%2C+both+inclining+to+and+introductive+of+vain+superstition%2C+and+therefore%2C+reckoned+among+the+first+Naevi+%5Bnovelties%5D+appearing+in+the+face+of+the+primitive+Church%2C+and+now+generally+disused+by+all+the+Churches+of+Christ%2C+as+they+are+by+you+adduced%2C+do+to+evidently+demonstrate+how+much+both+your+spirit+and+customs+do+bend+to+a+relapse+in+these+evils.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%2C+%E2%80%A6+%28%5BAmsterdam%3F%5D+1671%29%2C+5th+Dialogue%2C+pp.+292-94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b062d5e40.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b062d5e40.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=From%20baptism%2C%20you%20%5BGilbert%20Burnet%5D%20pass,to%20a%20relapse%20in%20these%20evils&amp;text=From%20baptism%2C%20you%20%5BGilbert%20Burnet%5D%20pass%20to%20plead&amp;text=do%20bend%20to%20a%20relapse%20in%20these%20evils" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

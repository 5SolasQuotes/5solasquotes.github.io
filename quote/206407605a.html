<blockquote><p>It cannot be necessary for the Author to disclaim hostility to the English Church. Differing as he does decidedly from that Establishment on some important points of ecclesiastical polity, he regards it with affectionate veneration as a Church of Christ. One object, indeed, of the following pages, is to show that, as a Body, the Church of England is not chargeable with holding the doctrines of the Oxford School.

They are not sanctioned by her Articles. They are opposed to the spirit of her Reformers. And although they have been advocated by some of her private Doctors since the beginning of the seventeenth century, the Church is not responsible for them otherwise than by tolerating their promulgation within her pale.

But should they now unfortunately acquire the ascendency, I am persuaded that every faithful minister of Christ in Scotland will respond to the words of the Genevese Reformer [John Calvin], when, contemplating such a disastrous result, he exclaims, — “Ah! we too, the Christians of the Continent, and of the whole world, shall clothe us in mourning, if this empire be brought low. We love her for the sake of Christ Jesus,—for His sake we pray for her. But if the apostacy already begun shall work itself out, we shall have nothing left for her but wailing, and sighs, and tears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the “Tracts for the Times.”</cite>, (Edinburgh: John Johnstone, 1843), iv.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed1b322854" data-kw="">
<blockquote><p>What an effect would be produced on an unbelieving world if a better spirit were more prevalent; if Churches, though distinguished by trivial peculiarities, regarded each other with brotherly affection; if one form of polity, admitting of fraternal correspondence, were embraced by all true Christians; and if the soldiers of the cross presented the appearance of one great army, all trained in the discipline of integrity and truth, all animated by the same spirit, and all displaying a united front to the common foe!

Now the Church is split up into countless sections; her divisions are fitted to make a most unfavourable impression on all who are without; her visible appearance, instead of being an inviting, and instructive, and edifying spectacle, is rather fitted to discourage, to puzzle, and to repel. She is now as a house divided against itself; her most valiant men of war, instead of bearing down with all their might on the enemy, often turn their arms against each other; and thus her energies are frequently expended in the strife of internal discord. No wonder, under these circumstances, that Christianity, in relation to the world lying in wickedness, has been so little aggressive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Framework of the Church. A Treatise on Church Government</cite>, (Edinburgh: T &amp; T Clark, 1890), pp 28-29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

v>
</figure><figure class="quote" id="q-8f8b9a4f73" data-kw="">
<blockquote><p>England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession [1530], the former, known specifically as the Reformed, have always tried to reconcile with those [Lutherans] of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups.

II. Although these latter ones have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues.

III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book Northern Olive Branch, and George Calixtus, professor of theology at the University of Helmstedt, in his book Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows,’, pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>But tell me now your opinion of another matter, and that is concerning liberty of conscience, and toleration of heretics and sectaries, for which there are so many books written of late… This question about the toleration of those whose way is different from the common rule which shall be established, must be both stated and resolved, cum grano salis [with a grain of salt]. We must remember to distinguish persons from corporations or Churches, and both these from errors. Again, to distinguish persons, whether godly and gracious, or loose and libertine, whether moderate and peaceable, or factious and turbulent; whether such as have deserved well of the public, or such as have done either no service or a disservice. To distinguish corporation, whether the question be of such only as have a present existence, or of all who shall join to such a way afterward. To distinguish errors, whether practical or doctrinal only, whether fundamental, or circa-fundamental, or neither of the two. To distinguish toleration, whether absolute, or hypothetical and conditional, whether anywhere, or in some few certain places only, whether indefinite and general, or limited and bounded, and if bounded, how far and how much: Whether such toleration as may stand with the Solemn League and Covenant, or such as is inconsistent therewith; whether such as is profitable for the public peace, or such as is apparently destructive thereto.</p></blockquote>

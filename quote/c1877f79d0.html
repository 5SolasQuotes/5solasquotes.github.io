<blockquote><p>2. They resisted the Holy Ghost striving with them by their own consciences, and would not comply with the convictions and dictates of them. God’s Spirit strove with them as with the old world, but in vain; they resisted Him, took part with their corruptions against their convictions, and rebelled against the light. There is that in our sinful hearts that always resists the Holy Ghost, a flesh that lusts against the Spirit, and wars against his motions; but in the hearts of God’s elect, when the fullness of time comes, this resistance is overcome and overpowered, and after a struggle the throne of Christ is set up in the soul, and every thought that had exalted itself against it is brought into captivity to it, 2 Co. 10:4, 2 Co. 10:5. That grace therefore which effects this change might more fitly be called victorious grace than irresistible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts, on 7:51, “…ye do always resist the Holy Ghost…”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df7761f9a2" data-kw="">
<blockquote><p>The bestowment of common grace upon the non-elect shows that non-election does not exclude from the kingdom of heaven by Divine efficiency, because common grace is not only an invitation to believe and repent, but an actual help towards it; and a help that is nullified solely by the resistance of the non-elect, and not by anything in the nature of common grace, or by any preventive action of God. The fault of the failure of common grace to save the sinner, is chargeable to the sinner alone; and he has no right to plead a fault of his own as the reason why he is entitled to special grace. It is absurd for him to contend that God has no right to refuse him regenerating grace, because he has defeated the Divine mercy in common grace. The true way out of the difficulty for the sinner is, not to demand regenerating grace as a debt by denying that God has the right to withhold it, but to confess the sinful abuse and frustration of common grace, and to cry with the leper: ‘Lord, if thou wilt, thou canst make me clean.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (NY: 1893)</cite>, ch. 5, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

<blockquote><p>Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:12; Works, vol. 22, p. 207</span></figcaption>

</figure><figure class="quote" id="q-f0bc1b9847" data-kw="irresistible vs resistible">
<blockquote><p>Whether efficacious grace operates only by a certain moral suasion which man is able either to receive or to reject. Or whether it operates by an invincible and omnipotent suasion which the will of man cannot resist. The former we deny; the latter we affirm against the Romanists and Arminians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.6.1b</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a> › <a href="../topics/effectual-calling/efficacious-grace/irresistible-grace.html">Irresistible grace</a></span><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a> › <a href="../topics/effectual-calling/efficacious-grace/resistible-and-irresistible.html">Resistible and irresistible</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether efficacious grace operates only by a certain moral suasion which man is able either to receive or to reject. Or whether it operates by an invincible and omnipotent suasion which the will of man cannot resist. The former we deny; the latter we affirm against the Romanists and Arminians.”

— Francis Turretin, Institutes of Elenctic Theology, 15.6.1b">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether%20efficacious%20grace%20operates%20only%20by%20a%20certain%20moral%20suasion%20which%20man%20is%20able%20either%20to%20receive%20or%20to%20reject.%20Or%20whether%20it%20operates%20by%20an%20invincible%20and%20omnipotent%20suasion%20which%20the%20will%20of%20man%20cannot%20resist.%20The%20former%20we%20deny%3B%20the%20latter%20we%20affirm%20against%20the%20Romanists%20and%20Arminians.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2015.6.1b&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0bc1b9847.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f0bc1b9847.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-f8f1587284" data-kw="">
<blockquote><p>9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life. 10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish. 11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Mt. 19:23–26, compared with Eph. 1:19; Prov. 21:1; Rom. 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life. 10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish. 11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Mt. 19:23–26, compared with Eph. 1:19; Prov. 21:1; Rom. 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.”

%3B+Rom.+11%3A23.+Hence+omnipotent+facility+and+easy+omnipotence+are+attributed+to+God+regenerating.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29%2C+p.+447+ff.+tr.+AI+by+Roman+Prestarri+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff8f1587284.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f8f1587284.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=9.%20That%20it%20is%20infallible%20by,omnipotence%20are%20attributed%20to%20God%20regenerating&amp;text=9.%20That%20it%20is%20infallible%20by%20reason%20of&amp;text=and%20easy%20omnipotence%20are%20attributed%20to%20God%20regenerating" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

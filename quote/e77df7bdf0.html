<main class="wrap"><figure class="quote" id="q-e77df7bdf0" data-kw="">
<blockquote><p>Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz: 1. If a prince abandon. 2. If he alienate. 3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers… (London, 1650), ch. 4</cite>, pp. 47-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rouse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lawfulness of Obeying the Present Government… (London, 1649) Rouse was a Westminster divine.</cite>, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-8aef366b20" data-kw="">
<blockquote><p>Assertion 1 — Patient suffering of wicked men and violent resisting are not incompatible, but they may well stand together; so this [following] consequence is the basis of the [opponent’s] argument, and it is just nothing: to wit, servants are to suffer unjustly wounds and buffeting of their wicked masters, and they are to bear it patiently; therefore, servants are in conscience obliged to non-resistance. Now, Scripture makes this clear: 1. The Church of God is to bear with all patience the indignation of the Lord, because she has sinned, and to suffer of wicked enemies which were to be trodden as mire in the streets (Mic. 7:9-12); but withal, they were not obliged to non-resistance and not to fight against these enemies, yea, they were obliged to fight against them also. If these were Babylon, Judah might have resisted and fought if God had not given a special commandment of a positive law, that they should not fight; if these were the Assyrians and other enemies, or rather both, the people were to resist by fighting, and yet to endure patiently the indignation of the Lord. David did bear most patiently the wrong that his own son Absalom, and Ahitophel, and the people inflicted on him, in pursuing him to take his life and the kingdom from him, as is clear by his gracious expressions (2 Sam. 15:25-26; 16:10-12; Ps. 3:1-3); yea, he prays for a blessing on the people that conspired against him (Ps. 3:8); yet did he lawfully resist Absalom and the conspirators, and sent out Joab and a huge army in open battle against them (2 Sam. 18:1-4, etc.) and fought against them. And were not the people of God patient to endure the violence done to them in the wilderness by Og, king of Bashan; Sihon, king of Heshbon; by the Amorites, Moabites, etc.? I think God’s law ties all men, especially his people, to as patient a suffering in wars (Dt. 8:16). God then trying and humbling his people, as the servant is to endure patiently unjustly inflicted buffets (1 Pet. 2:18); and yet God’s people at God’s command did resist these kings and people, and did fight and kill them, and possess their land, as the history is clear. See the like Josh. 11:18-19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, pp. 152-53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>A tyrant without title, who is an invader, every private man may and ought to destroy, for he is not a prince but a private person.</p></blockquote>

</figure><figure class="quote" id="q-ece79072f1" data-kw="">
<blockquote><p>When our Saviour Christ (who being such an extraordinary Person, might have warrant to do what would have been presumption in any other) was appealed to in a cause that appertained to the civil magistrate’s decision, He refused to deal in it with these words, ‘Who made me a judge or a divider over you?’ according to which words of Him who was the truth, he that may rule must be placed in that office by some body and may not undertake it of himself: no man may take this honor to himself or be his own advancer to the throne; but he must be installed by another: and what other creature, besides the nation itself can challenge a power to appoint over it its rulers is not to me imaginable. Angels are not of this economy, do not intermeddle in this business, and for other people, or foreign states, they are but in an equality, and have no partnership in this matter; they have no more to do to impose governors over their neighbors than they have reciprocally over them… A calling from the people who are to be subject, being so necessary and essential to a humanly constituted magistracy, it is easy to discern what is usurpation, viz: that which is opposite to it, or privative thereof, which is a snatching hold of the scepter and wresting it out of the hands of those who are to dispose of it or have it committed to them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC</cite>, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“When our Saviour Christ (who being such an extraordinary Person, might have warrant to do what would have been presumption in any other) was appealed to in a cause that appertained to the civil magistrate’s decision, He refused to deal in it with these words, ‘Who made me a judge or a divider over you?’ according to which words of Him who was the truth, he that may rule must be placed in that office by some body and may not undertake it of himself: no man may take this honor to himself or be his own advancer to the throne; but he must be installed by another: and what other creature, besides the nation itself can challenge a power to appoint over it its rulers is not to me imaginable. Angels are not of this economy, do not intermeddle in this business, and for other people, or foreign states, they are but in an equality, and have no partnership in this matter; they have no more to do to impose governors over their neighbors than they have reciprocally over them… A calling from the people who are to be subject, being so necessary and essential to a humanly constituted magistracy, it is easy to discern what is usurpation, viz: that which is opposite to it, or privative thereof, which is a snatching hold of the scepter and wresting it out of the hands of those who are to dispose of it or have it committed to them…”

— Edward Gee, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, p. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+our+Saviour+Christ+%28who+being+such+an+extraordinary+Person%2C+might+have+warrant+to+do+what+would+have+been+presumption+in+any+other%29+was+appealed+to+in+a+cause+that+appertained+to+the+civil+magistrate%E2%80%99s+decision%2C+He+refused+to+deal+in+it+with+these+words%2C+%E2%80%98Who+made+me+a+judge+or+a+divider+over+you%3F%E2%80%99+according+to+which+words+of+Him+who+was+the+truth%2C+he+that+may+rule+must+be+placed+in+that+office+by+some+body+and+may+not+undertake+it+of+himself%3A+no+man+may+take+this+honor+to+himself+or+be+his+own+advancer+to+the+throne%3B+but+he+must+be+installed+by+another%3A+and+what+other+creature%2C+besides+the+nation+itself+can+challenge+a+power+to+appoint+over+it+its+rulers+is+not+to+me+imaginable.+Angels+are+not+of+this+economy%2C+do+not+intermeddle+in+this+business%2C+and+for+other+people%2C+or+foreign+states%2C+they+are+but+in+an+equality%2C+and+have+no+partnership+in+this+matter%3B+they+have+no+more+to+do+to+impose+governors+over+their+neighbors+than+they+have+reciprocally+over+them%E2%80%A6+A+calling+from+the+people+who+are+to+be+subject%2C+being+so+necessary+and+essential+to+a+humanly+constituted+magistracy%2C+it+is+easy+to+discern+what+is+usurpation%2C+viz%3A+that+which+is+opposite+to+it%2C+or+privative+thereof%2C+which+is+a+snatching+hold+of+the+scepter+and+wresting+it+out+of+the+hands+of+those+who+are+to+dispose+of+it+or+have+it+committed+to+them%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%E2%80%A6+%28London%2C+1650%29+88+pp.+ToC%2C+p.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fece79072f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ece79072f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=When%20our%20Saviour%20Christ%20%28who%20being,or%20have%20it%20committed%20to%20them&amp;text=When%20our%20Saviour%20Christ%20%28who%20being%20such%20an&amp;text=of%20it%20or%20have%20it%20committed%20to%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-93c99b2fc5" data-kw="">
<blockquote><p>When men may unite without personal guilt or accession to the defects or guilt of others, there may and ought to be union, even though there be failings and defects of several kinds in a Church; because men are to reckon not for other men’s carriages, but their own: And no such Church-state is to be expected as is free of defects. Beside, can it warrand a man to abstain from his duty because others do not theirs, while as there is no sinful impediment lying in the way of his access thereto?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75aa907c5f" data-kw="">
<blockquote><p>V. When I can have better, caeteris paribus [other things being equal], without greater hurt than good, I prefer it; and only use occasional local communion with the [Anglican] liturgy-churches, as I would do with strangers were I in foreign lands. VI. Where I can have no better without more hurt than good, I communicate constantly and only with the parish-church where I live, as to local-communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’</cite>, pp. 225-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a4d4e363f2" data-kw="">
<blockquote><p>There are some diseases that are called opprobria medicorum, ‘the disgraces of physicians’, because they know not what to say or do to them; or if they do anything it is to little purpose. If there be any soul-disease that be opprobrium theologorum, the disgrace of divines, it is this: of contention and division. How little has all that they have studied and endeavored to do prevailed with the hearts of men? What shall we do? Shall we but join in this one thing, to sit down together, and mourn one over another, one for another, till we have dissolved our hearts into tears, and see if we can thus get them to run one into another? Oh that it might be, what sorrow soever it costs us!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum (1653) | ch. 31, ‘The Cure of our Divisions’, with 14 Joining Principles</cite>, pp. 252-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>§13. He that does not nullify or unchurch a church, may lawfully remove from one church to another and make choice of the best and purest, or that which is most suited to his own edification, if he be a free-man. §14. But in case of such choice or personal removal, the interest of the whole church, or of religion in common, must be first taken into consideration by him that would rightly judge of the lawfulness of the fact.</p></blockquote>

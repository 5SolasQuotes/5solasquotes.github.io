<blockquote><p>To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.</p></blockquote>

</figure><figure class="quote" id="q-c3b56251fc" data-kw="">
<blockquote><p>Reply Obj. 2: The end, insofar as it pre-exists in the intention, pertains to the will, as stated above (A1, ad1). And it is thus that it gives the species to the human or moral act. Reply Obj. 3: One and the same act, insofar as it proceeds once from the agent, is ordained to but one proximate end, from which it has its species: but it can be ordained to several remote ends, of which one is the end of the other. It is possible, however, that an act which is one in respect of its natural species, be ordained to several ends of the will: thus this act to kill a man, which is but one act in respect of its natural species, can be ordained, as to an end, to the safeguarding of justice, and to the satisfying of anger: the result being that there would be several acts in different species of morality: since in one way there will be an act of virtue, in another, an act of vice. For a movement does not receive its species from that which is its terminus accidentally, but only from that which is its per se terminus. Now moral ends are accidental to a natural thing, and conversely the relation to a natural end is accidental to morality. Consequently there is no reason why acts which are the same considered in their natural species, should not be diverse, considered in their moral species, and conversely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 of 2, quest. 100</cite>, quest. 1, art. 3, ‘Whether human acts are specified by their end? [Yes]’</span></figcaption>

<blockquote><p>XXV. Though we think not that men may [morally] command us to destroy our neighbors’ souls by scandal, yet when disobedience to a ruler’s law is likely to do more hurt than the scandal taken at it comes to, we are for avoiding the greater hurt.</p></blockquote>

</figure><figure class="quote" id="q-5345e00844" data-kw="">
<blockquote><p>It is divine law, jure divino, both by nature and Scripture, for the stronger to relinquish rights and privileges for the here and now to help the weaker, for the greater good (Ps. 40:6–8; Mt. 5:38–48; Mk. 15:3–5; Jn. 10:15–17; 1 Cor. 6:4–8; 9:4–23; Eph. 5:25–26; Phil. 2:6–9; 1 Pet. 2:19–25; WLC 99.5), especially when called by Christ to do so (Mt. 28:18–20; Acts 9:15–16). Ought not the stronger and more excellent parts of the body, rather than ignoring or forsaking the weaker and less comely parts, unite with, serve and benefit them, covering them over with greater honor, as we ourselves do and God does (1 Cor. 12:23–24), “that there should be no schism in the body”? (1 Cor. 12:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

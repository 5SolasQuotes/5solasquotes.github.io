<main class="wrap"><figure class="quote" id="q-1084390271" data-kw="">
<blockquote><p>We are now enjoined in our Church-assemblies to wear such apparel as is comely, decent, and fit for our estate and condition; I will (saith the Apostle, speaking of the behaviour of all God’s people in the public assemblies, 1 Tim. 2. 9.) in like manner also that women adorn themselves in modest apparel, with shamefastness and sobriety; and yet is that no Ecclesiastical ceremony, no matter of religion, but a thing merely civil.

Secondly, We must understand, that in these civil things, that might be decent and fit in one Country, (and consequently commanded of God) which in another Country is utterly undecent, and consequently forbidden. It was a great sin among the Corinthians for a woman to come into the congregation with her head uncovered; that is, without a veil to cover her whole head, 1 Cor. 11. 5. In our congregations (because it is undecent) it were a sin for a woman to come so attired. In which respect, though we have oft in the New Testament mention of fasts both public and private; of sackcloth used in them, we have no mention at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of fasting and prayer, and humiliation for sin. Delivered in sundry sermons at the fast appointed by publique authority, in the year 1625</cite>, (London: Edward Brewster, 1633), pp 50-51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>Paul… his traditions were the Gospel of Christ and honest manners and living, and such a good order as becomes the doctrine of Christ. As that a woman obey her husband, have her head covered, keep silence, and go womanly and christianly apparelled: that children and servants be in subjection: and that the young obey their elders, that no man eat but he that labours and works, and that men make an earnest thing of God’s Word, and of his holy Sacraments: and to watch, fast, and pray, and such like, as the Scripture commands. Which things he that would break were no christian man… There were also certain customs alway which were not commanded in pain of hell or everlasting damnation, as to watch all night, and to kiss one another: which as soon as the people abused, then they brake them. For which cause the bishops might break many things now in like manner. Paul also in many things which God had made free, gave pure and faithful counsel without tangling of any man’s conscience, and without all manner commanding under pain of cursing, pain of excommunication, pain of heresy, pain of burning, pain of deadly sin, pain of hell, and pain of damnation. As thou mayst see. 1 Cor. 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together</cite>, The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together… (d. 1536; London, 1573), pp. 128-29</span></figcaption>

<blockquote><p>6. …Some [apostolic traditions] are concerning the rites and the good order of the Church; as that touching the blood of things that were strangled, the covering of women’s heads, that men should not be covered in the time of prayer, and such like. 7. Those things, which are concerning the substance of doctrine [e.g. Lord’s Supper], are to be perpetually observed in the Church: but as for the things which appertain to outward rites, they in consideration of diverse circumstances, as of time, place and person, may be changed: yet so, as regard be always had (which must be generally observed in all indifferent things) unto that which makes most for the glory of God and the edification of the Church.</p></blockquote>

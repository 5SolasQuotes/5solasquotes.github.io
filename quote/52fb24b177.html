</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d06f8999c0" data-kw="">
<blockquote><p>For faith, termed special mercy, naturally precedes justification in a repentant sinner, as seen in the tax collector who first pleads for mercy through faith; ‘God, be merciful to me a sinner,’ meaning, he trusts he will receive forgiveness of sins. This faith also accompanies justification; during the act of justification, he trusts that his sins are forgiven. Furthermore, it follows justification; for, justified, he descends to his house with the same confidence that his sins have been forgiven. Hence, he later infers that the special object of justifying faith is the promise of the Gospel about the future, present, and past, to each one, to me, to you, to him, believing in the Son, through faith in His blood, sins will be, are being, and have been forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXVII. Similar views are seen in Paraeus. He states:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

%20mercy%2C%20naturally,are%20being%2C%20and%20have%20been%20forgiven&amp;text=For%20faith%2C%20termed%20special%20mercy%2C%20naturally%20precedes%20justification&amp;text=will%20be%2C%20are%20being%2C%20and%20have%20been%20forgiven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e5ff02224" data-kw="">
<blockquote><p>When we use the word faith strictly and properly we mean that for certain reasons apprehended by us we are satisfied as to the reality, reliability or truth of a certain event, object or person… When it has respect to a person we mean that we credit him as trustworthy in respect of that character which is under consideration… … To sum up, faith is trust. Trust presupposes an object. An object evokes our trust when there is an antecedent judgment of the mind that the object is trustworthy. This judgment is formed by the evaluation of evidence as sufficient. It is a state of mind induced by considerations objective to ourselves though always apprehended by our minds. … In this case it is useless or futile to try to ground this conviction [that the Scripture is the Word of God] upon rational argumentation based upon evidence extraneous to the sum total of the data with which the Christian revelation confronts us. It might seem that such argumentation is necessary in order to avoid the charge of arguing in a circle. But it will become apparent how impossible it is to produce by evidence extraneous to the Scripture the faith which has as its object the Scripture itself. The Reformers were aware of the fallacy attaching to argumentation on the basis of extrinsic evidence, and so they laid down the principle that Scripture is autopistic, that is, self-authenticating, and this means that the evidence validating the faith of Scripture as the Word of God is the Scripture itself. This is to say that it contains within itself the evidence of its divine origin, character, and authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Faith’ in Collected Writings</cite>, 2.235-6, 237, 241</span></figcaption>

</figure><figure class="quote" id="q-05656507d3" data-kw="">
<blockquote><p>We, indeed, acknowledge with Paul, that the only faith which justifies is that which works by love (Gal. 3:6); but love does not give it its justifying power. Nay, its only means of justifying consists in its bringing us into communication with the righteousness of Christ.</p></blockquote>

</figure><figure class="quote" id="q-51637e0443" data-kw="">
<blockquote><p>We affirm on the other side [from the Papists], that the testimony of the Spirit of God in the Word itself–witnessing it to be of God, by that stamp and impress, or, which comes to the same, by those notes and marks of divinity, which everywhere appear in it–is the immediate and principal, and a sufficient, reason of our believing it to be the Word of God, and the medium [which] the Spirit, working inwardly in our hearts, moves as the efficient of our faith, so the Scripture itself, in its own intrinsical beauty, luster, power and excellency, is that which moves us, in the way of an object or medium, to yield our assent to its being of God. By this the Spirit of God; and, by an internal application of this to our minds, induceth us to assent to its so being…. This they [the Papists] deny; and this we shall first, though more briefly prove…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 612-3 of ‘The Testimony of the Church is not the Only, nor the Chief Reason of our Believing the Scripture to be the Word of God’ in Puritan Sermons, 5.606-648 &amp; in Works, 8.495-543</span></figcaption>

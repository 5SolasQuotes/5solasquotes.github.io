<blockquote><p>The former will [of command] is called by the [Medieval] Scholastics, on the authority, it is thought, of Hugh of St. Victor, voluntas signi, whether because it is signified by some sign, like a word, precept, interdict, etc.; or because it signifies God’s will as the effect and adjunct of it…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c81dac9740" data-kw="">
<blockquote><p>§ 53. But how comes it to pass then, that these blessed means of grace, these conveyances of the Spirit are so often ineffectual? Many men do daily pray, often hear and read the Word of God, have been engraffed into the body of Christ by baptism, and many times receive the blessed eucharist, and yet little or no news do they hear of the Spirit, very little stirrings of the heart, few good motions do they feel within, they are never the better, nor a whit the more enriched, either with spiritual gifts or graces for the use of these means: The cause whereof is the hardness of man’s heart, which receives not the impressions of the Spirit; the corruption of man’s nature, which quenches the sacred fires of piety and charity, before they be well enkindled in the soul; the exorbitant and unruly lusts of the flesh, and of the world, which resist the good motions, lustings, and strivings of the Spirit of God. Intus existens prohibet alienum; when the fruits of the flesh have overgrown the soul, there’s no room for the fruits of the Spirit to take rooting there: These two kinds of fruits cannot grow both in one heart, but the one will choak, overgrow, and destroy the other. To this outward means of grace then, and of the Spirit, the inward qualifications, the infitting of the soul to receive the impressions of the Spirit must be added…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel… with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman.</cite>, pp. 152-53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-b26fb3dc36" data-kw="">
<blockquote><p>From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.</p></blockquote>

</figure><figure class="quote" id="q-0c2f5df2d3" data-kw="">
<blockquote><p>If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, p. 44</span></figcaption>

<blockquote><p>4. Antecedent and consequent wills are such as cannot agree to God as they [Arminians] understand them. For his antecedent will they make to be such whereby He wills and earnestly desires the salvation of all men: the consequent will, that whereby He wills the damnation of some, namely such as persist in unbelief; and the salvation of others; namely such as persevere in the faith; now these cannot agree with the nature of God; for: 1. For this antecedent will has sometimes an end and the consequent will always a beginning; the absolute or peremptory decree of damnation, never taking place till the antecedent or conditional will touching salvation be expired: and so likewise the peremptory decree of salvation, not taking place till the ceasing of the other. Now the acts of God’s will are immanent acts, therefore eternal like Himself. Objection: But God foresees who will persevere in believing, and upon this foresight grounds his purpose. Answer: Then upon this foresight, He only purposes to will their salvation when they do believe and persevere; but He does not actually will it, that is, will it with his consequent and peremptory will, till they do believe; which cannot stand with the eternity of his will. 2. This antecedent will they make rather to be a velleietas, than a volitio, rather ‘a wishing’ and desiring, than ‘a willing,’ which cannot agree to God; who is totus actus, all act, yea actus purissimus et perfectissimus, the most pure and perfect act: therefore no imperfect wishes and desires belong to Him. (Si Deus non potest, est impotens, si potest sed non efficit quia non licet, tum Deus vellet aliquid quod non liceret [If God cannot, He is impotent; if He can, but does not effect it because it is not permitted, then God would will something which is not permitted]. Dr. Twisse) 3. If God by his antecedent will does seriously and heartily desire the salvation of all men, when some of these come to be damned, then this desire either still continues in Him or not: If it does not continue, then his will is changeable, but he says of Himself, ‘I am the Lord, I change not,’ Mal. 3:6. Besides, they make this antecedent will whereby He wills the salvation of all to flow from his nature; and being natural to him, it must be unchangeable as his nature is: If it does continue, then God continues earnestly to desire the salvation of wicked men when they are damned; so never has his desire accomplished, which cannot stand with perfect felicity: yea if it does continue, then God does seriously will their salvation and damnation at one time, and so wills a flat contradiction: or else when He damns men, He does not will to damn them; and so his actions are not guided by his will. 4. If he does will their salvation, why does He not work it, for He is in heaven, and does whatsoever He will? ‘He works all things according to the pleasure of his will,’ Eph. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-whitfield.html">Thomas Whitfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrines of the Arminians &amp; Pelagians truly stated and clearly answered... (London, 1651), ‘An Examination and Confutation of the Arminian erroneous tenets concerning Election’</cite>, pp. 34-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“4. Antecedent and consequent wills are such as cannot agree to God as they [Arminians] understand them. For his antecedent will they make to be such whereby He wills and earnestly desires the salvation of all men: the consequent will, that whereby He wills the damnation of some, namely such as persist in unbelief; and the salvation of others; namely such as persevere in the faith; now these cannot agree with the nature of God; for: 1. For this antecedent will has sometimes an end and the consequent will always a beginning; the absolute or peremptory decree of damnation, never taking place till the antecedent or conditional will touching salvation be expired: and so likewise the peremptory decree of salvation, not taking place till the ceasing of the other. Now the acts of God’s will are immanent acts, therefore eternal like Himself. Objection: But God foresees who will persevere in believing, and upon this foresight grounds his purpose. Answer: Then upon this foresight, He only purposes to will their salvation when they do believe and persevere; but He does not actually will it, that is, will it with his consequent and peremptory will, till they do believe; which cannot stand with the eternity of his will. 2. This antecedent will they make rather to be a velleietas, than a volitio, rather ‘a wishing’ and desiring, than ‘a willing,’ which cannot agree to God; who is totus actus, all act, yea actus purissimus et perfectissimus, the most pure and perfect act: therefore no imperfect wishes and desires belong to Him. (Si Deus non potest, est impotens, si potest sed non efficit quia non licet, tum Deus vellet aliquid quod non liceret [If God cannot, He is impotent; if He can, but does not effect it because it is not permitted, then God would will something which is not permitted]. Dr. Twisse) 3. If God by his antecedent will does seriously and heartily desire the salvation of all men, when some of these come to be damned, then this desire either still continues in Him or not: If it does not continue, then his will is changeable, but he says of Himself, ‘I am the Lord, I change not,’ Mal. 3:6. Besides, they make this antecedent will whereby He wills the salvation of all to flow from his nature; and being natural to him, it must be unchangeable as his nature is: If it does continue, then God continues earnestly to desire the salvation of wicked men when they are damned; so never has his desire accomplished, which cannot stand with perfect felicity: yea if it does continue, then God does seriously will their salvation and damnation at one time, and so wills a flat contradiction: or else when He damns men, He does not will to damn them; and so his actions are not guided by his will. 4. If he does will their salvation, why does He not work it, for He is in heaven, and does whatsoever He will? ‘He works all things according to the pleasure of his will,’ Eph. 1:11.”

— Thomas Whitfield, The Doctrines of the Arminians &amp; Pelagians truly stated and clearly answered... (London, 1651), ‘An Examination and Confutation of the Arminian erroneous tenets concerning Election’, pp. 34-35">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Antecedent+and+consequent+wills+are+such+as+cannot+agree+to+God+as+they+%5BArminians%5D+understand+them.+For+his+antecedent+will+they+make+to+be+such+whereby+He+wills+and+earnestly+desires+the+salvation+of+all+men%3A+the+consequent+will%2C+that+whereby+He+wills+the+damnation+of+some%2C+namely+such+as+persist+in+unbelief%3B+and+the+salvation+of+others%3B+namely+such+as+persevere+in+the+faith%3B+now+these+cannot+agree+with+the+nature+of+God%3B+for%3A+1.+For+this+antecedent+will+has+sometimes+an+end+and+the+consequent+will+always+a+beginning%3B+the+absolute+or+peremptory+decree+of+damnation%2C+never+taking+place+till+the+antecedent+or+conditional+will+touching+salvation+be+expired%3A+and+so+likewise+the+peremptory+decree+of+salvation%2C+not+taking+place+till+the+ceasing+of+the+other.+Now+the+acts+of+God%E2%80%99s+will+are+immanent+acts%2C+therefore+eternal+like+Himself.+Objection%3A+But+God+foresees+who+will+persevere+in+believing%2C+and+upon+this+foresight+grounds+his+purpose.+Answer%3A+Then+upon+this+foresight%2C+He+only+purposes+to+will+their+salvation+when+they+do+believe+and+persevere%3B+but+He+does+not+actually+will+it%2C+that+is%2C+will+it+with+his+consequent+and+peremptory+will%2C+till+they+do+believe%3B+which+cannot+stand+with+the+eternity+of+his+will.+2.+This+antecedent+will+they+make+rather+to+be+a+velleietas%2C+than+a+volitio%2C+rather+%E2%80%98a+wishing%E2%80%99+and+desiring%2C+than+%E2%80%98a+willing%2C%E2%80%99+which+cannot+agree+to+God%3B+who+is+totus+actus%2C+all+act%2C+yea+actus+purissimus+et+perfectissimus%2C+the+most+pure+and+perfect+act%3A+therefore+no+imperfect+wishes+and+desires+belong+to+Him.+%28Si+Deus+non+potest%2C+est+impotens%2C+si+potest+sed+non+efficit+quia+non+licet%2C+tum+Deus+vellet+aliquid+quod+non+liceret+%5BIf+God+cannot%2C+He+is+impotent%3B+if+He+can%2C+but+does+not+effect+it+because+it+is+not+permitted%2C+then+God+would+will+something+which+is+not+permitted%5D.+Dr.+Twisse%29+3.+If+God+by+his+antecedent+will+does+seriously+and+heartily+desire+the+salvation+of+all+men%2C+when+some+of+these+come+to+be+damned%2C+then+this+desire+either+still+continues+in+Him+or+not%3A+If+it+does+not+continue%2C+then+his+will+is+changeable%2C+but+he+says+of+Himself%2C+%E2%80%98I+am+the+Lord%2C+I+change+not%2C%E2%80%99+Mal.+3%3A6.+Besides%2C+they+make+this+antecedent+will+whereby+He+wills+the+salvation+of+all+to+flow+from+his+nature%3B+and+being+natural+to+him%2C+it+must+be+unchangeable+as+his+nature+is%3A+If+it+does+continue%2C+then+God+continues+earnestly+to+desire+the+salvation+of+wicked+men+when+they+are+damned%3B+so+never+has+his+desire+accomplished%2C+which+cannot+stand+with+perfect+felicity%3A+yea+if+it+does+continue%2C+then+God+does+seriously+will+their+salvation+and+damnation+at+one+time%2C+and+so+wills+a+flat+contradiction%3A+or+else+when+He+damns+men%2C+He+does+not+will+to+damn+them%3B+and+so+his+actions+are+not+guided+by+his+will.+4.+If+he+does+will+their+salvation%2C+why+does+He+not+work+it%2C+for+He+is+in+heaven%2C+and+does+whatsoever+He+will%3F+%E2%80%98He+works+all+things+according+to+the+pleasure+of+his+will%2C%E2%80%99+Eph.+1%3A11.%E2%80%9D%0A%0A%E2%80%94+Thomas+Whitfield%2C+The+Doctrines+of+the+Arminians+%26+Pelagians+truly+stated+and+clearly+answered...+%28London%2C+1651%29%2C+%E2%80%98An+Examination+and+Confutation+of+the+Arminian+erroneous+tenets+concerning+Election%E2%80%99%2C+pp.+34-35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9b5f464f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9b5f464f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=4.%20Antecedent

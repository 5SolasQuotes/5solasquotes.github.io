<main class="wrap"><figure class="quote" id="q-ff3b590af3" data-kw="">
<blockquote><p>THE main drift of the blessed apostle, the Holy Ghost’s penman, in this excellent epistle, is to set forth the pre-eminence of our Lord Jesus Christ, first, in his divine person, far above all angels, who are bid worship him, even when dwelling in man’s nature. If the god-head of our Lord Jesus Christ be hid from the readers of this epistle, it must be a special power of the God of this world on their unbelieving minds, 2 Cor. 4:3, 4. Will blinded men forbear to call the Son God, when the Father speaks so? chap. 1:8. Thy throne, O God, is for ever and ever. Then the apostle speaks of his incarnation, chap. 2:11, &amp;c. And therewith speaks of his priesthood, chap. 3. The apostle compares Christ with, and prefers him above Moses, chap. 2.; then above Aaron as a priest, chap. 7.; and compares him with Melchizedek, an eminent type of Christ.

By this epistle we may know what Paul’s reasonings with the Jews were, Acts 9:22 and 17:2, 3 and what is the right way of dealing with the Jews at this day. Till Christ’s divine person, and righteousness, and priesthood, have more room in the religion of the Gentiles, Christianity is not like to leaven the Jews. This doctrine of Christ’s priesthood, and of the sacrifice of himself he offered in that office, the apostle doth often intermix, with suitable exhortations from it; as in the context, ver. 14. Seeing then that we have a great high priest, (all the Old Testament high-priests were but types and shadows of him, and were but little high-priests), that is passed into the heavens, (no high-priest but Christ went farther than the holy of holies, for the people’s advantaged), Jesus the Son of God, let us hold fast our profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 11-12.</span></figcaption>

</figure><figure class="quote" id="q-f0aa3c32a4" data-kw="">
<blockquote><p>The Jews in their time provoked justly the vengeance of God, for that partly they abused his holy temple with the detestable idolatry of the heathen, and superstitious vanities of their own inventions, contrary to God’s commandment; partly they resorted unto it as hypocrites, spotted, imbrued, and foully defiled with all kind of wickedness and sinful life; partly many of them passed little upon the holy temple, and forced not whether they came thither or no.

And have not the Christians of late days, and even in our days also, in like manner provoked the displeasure and indignation of Almighty God, partly, because they have profaned and defiled their churches with heathenish and Jewish abuses, with images and idols, with numbers of altars too superstitiously and intolerably abused, with gross abusing and filthy corrupting of the Lord’s holy Supper, the blessed Sacrament of his Body and Blood, with an infinite number of toys and trifles of their own devices, to make a goodly outward shew, and to deface the homely, simple, and sincere religion of Christ Jesus? Partly, they resort to the church like hypocrites, full of all iniquity and sinful life, having a vain and a dangerous fancy and persuasion, that if they come to the church, besprinkle them with holy water, hear a mass, and be blessed with the chalice, though they understand not one word of the whole service, nor feel one motion of repentance in their hearts, all is well, all is sure.

Fie upon such mocking and blaspheming of God’s holy ordinance. Churches were made for another purpose, that is, to resort thither and to serve God truly, there to learn his blessed will, there to call upon his mighty Name, there to use the holy Sacraments, there to travail how to be in charity with thy neighbour, there to have thy poor and needy neighbour in remembrance, from thence to depart better and more godly than thou earnest thither.

Finally, God’s vengeance hath been and is daily provoked, because much wicked people pass nothing to resort to the church, either for that they are so sore blinded, that they understand nothing of God and godliness, and care not with devilish example to offend their neighbours; or else for that they see the church altogether scoured of such gay gazing sights as their gross fantasy was greatly delighted with, because they see the false religion abandoned and the true restored, which seemeth an unsavoury thing to their unsavoury taste; as may appear by this, that a woman said to her neighbour, Alas, gossip, what shall we now do at church, since all the saints are taken away, since all the goodly sights we were wont to have are gone, since we cannot hear the like piping, singing, chanting, and playing upon the organs, that we could before?

But, dearly beloved, we ought greatly to rejoice and give God thanks, that our churches are delivered of all those things which displeased God so sore, and filthily defiled his holy house and his place of prayer; for the which he hath justly destroyed many nations; according to the saying of St. Paul, If any man defile the temple of God, God will him destroy. And this ought we greatly to praise God for, that such superstitious and idolatrous manners as were utterly naught and defaced God’s glory are utterly abolished, as they most justly deserved, and yet those things that either God was honoured with or his people edified are decently retained, and in our churches comely practised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Homily on the Place and Time of Prayer. Second Part in Thomas Cranmer and John Jewell, The Two Books of Homilies Appointed to be Read in Churches</cite></span></figcaption>

there+to+call+upon+his+mighty+Name%2C+there+to+use+the+holy+Sacraments%2C+there+to+travail+how+to+be+in+charity+with+thy+neighbour%2C+there+to+have+thy+poor+and+needy+neighbour+in+remembrance%2C+from+thence+to+depart+better+and+more+godly+than+thou+earnest+thither.%0A%0AFinally%2C+God%E2%80%99s+vengeance+hath+been+and+is+daily+provoked%2C+because+much+wicked+people+pass+nothing+to+resort+to+the+church%2C+either+for+that+they+are+so+sore+blinded%2C+that+they+understand+nothing+of+God+and+godliness%2C+and+care+not+with+devilish+example+to+offend+their+neighbours%3B+or+else+for+that+they+see+the+church+altogether+scoured+of+such+gay+gazing+sights+as+their+gross+fantasy+was+greatly+delighted+with%2C+because+they+see+the+false+religion+abandoned+and+the+true+restored%2C+which+seemeth+an+unsavoury+thing+to+their+unsavoury+taste%3B+as+may+appear+by+this%2C+that+a+woman+said+to+her+neighbour%2C+Alas%2C+gossip%2C+what+shall+we+now+do+at+church%2C+since+all+the+saints+are+taken+away%2C+since+all+the+goodly+sights+we+were+wont+to+have+are+gone%2C+since+we+cannot+hear+the+like+piping%2C+singing%2C+chanting%2C+and+playing+upon+the+organs%2C+that+we+could+before%3F%0A%0ABut%2C+dearly+beloved%2C+we+ought+greatly+to+rejoice+and+give+God+thanks%2C+that+our+churches+are+delivered+of+all+those+things+which+displeased+God+so+sore%2C+and+filthily+defiled+his+holy+house+and+his+place+of+prayer%3B+for+the+which+he+hath+justly+destroyed+many+nations%3B+according+to+the+saying+of+St.+Paul%2C+If+any+man+defile+the+temple+of+God%2C+God+will+him+destroy.+And+this+ought+we+greatly+to+praise+God+for%2C+that+such+superstitious+and+idolatrous+manners+as+were+utterly+naught+and+defaced+God%E2%80%99s+glory+are+utterly+abolished%2C+as+they+most+justly+deserved%2C+and+yet+those+things+that+either+God+was+honoured+with+or+his+people+edified+are+decently+retained%2C+and+in+our+churches+comely+practised.%E2%80%9D%0A%0A%E2%80%94+John+Jewell%2C+An+Homily+on+the+Place+and+Time+of+Prayer.+Second+Part+in+Thom

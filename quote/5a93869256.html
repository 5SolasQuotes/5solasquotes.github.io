<blockquote><p>XXII. The subject in which it [original sin] resides is not only the lower faculties, namely of sensing and appetition, nor only the superior faculties, namely of understanding and willing, but the whole man, both soul and body, with all their powers. Besides experience, these passages testify: Gen. 6:5; Jer. 17:9; 1 Cor. 2:14; Eph. 4:17-18; Rom. 6:12-13, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), pp. 6-7 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>

<blockquote><p>…the Fall causes a damage or loss of moral and spiritual freedom (man can no longer do the good or love God); the natural freedom, by which man’s will can choose between opposites without being necessitated towards one of both, remains after the Fall. This natural freedom is essential to man, in the sense that without this freedom he would no longer be man as a rational and responsible creature. The Reformed authors treated in this volume [Zanchius, Junius, Gomarus, Voetius, Turretin, de Moore] take pains to combine the permanence of essential freedom (presupposing contingency in reality) with the disastrous slavery of sin by which man’s will s bound (accounting for the factual impossibility of doing the good, since we can only do the good by loving and obeying God). …human freedom does not go unqualified: man does not act out of nature, or contrary to the (ultimate) judgment of his intellect, or outside of God’s providence. Still, these forms of necessity obtain in terms of the necessity of the consequence by which the outcome (the consequent) is not made necessary in itself.</p></blockquote>

ary%20in%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-781ab26b65" data-kw="">
<blockquote><p>§XXIII. The opposite of liberty is necessity; yet not just any. Not: (1) the Necessity of Servitude, which is the state of man after the Lapse, in which man is subject to the yoke of sin and the misery flowing from it; whence the will of men has become a servant of sin, from Jn. 8:34; 2 Pet. 2:19; Rom. 7:14, without the destruction of natural liberty, which a servant exercises just as freely in things pertaining to his own sphere as a master does in those that pertain to his sphere; since, notwithstanding the servitude of sin, free will has remained immune from the necessity of this or that crime, and is free in animal, economic, civil, and moral matters of the natural order. … Nor (3) the Necessity of Dependence on God in becoming and being, and in operating; as that which is common to all creatures, not only the irrational, but also the rational; since, this dependence being saved, the mode of dependence is and remains various or diverse for the variety of creatures and agents: for intellectual creatures and free agents do not depend on God in the manner of stupid brutes, much less in the manner of statues or of turning metal plates, but as intellectual and free agents, which, being endowed with an internal active principle, exercise and determine their own acts under divine providence and grace, and are thence capable of a gratuitous reward or a just punishment.</p></blockquote>

es.github.io%2Fquote%2F781ab26b65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/781ab26b65.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=XXIII.%20The%20opposite%20of%20liberty%20is,gratuitous%20reward%20or%20a%20just%20punishment&amp;text=XXIII.%20The%20opposite%20of%20liberty%20is%20necessity%3B%20yet&amp;text=of%20a%20gratuitous%20reward%20or%20a%20just%20punishment" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-418b349beb" data-kw="">
<blockquote><p>One of the most difficult questions which the seeker after souls has to meet arises out of the doctrine of Inability. “What, then, must I do to be saved?” He cannot be put off, and he ought not to be put off, with a mere “You can do nothing.” This is not the Scripture answer… Such a response [by the seeker] may doubtless be nothing more than a theoretical difficulty raised by the sinner as an excuse for not obeying the command of God. In such a case it is enough, in reply to it, to point out that at bottom it is a cavil. The command to believe is explicit. And the object of faith is most winningly presented to the mind and heart. Our obvious duty is to believe: and if we do not do so the responsibility rests upon us. That we cannot do so is the result and index of our sinfulness. Inability is a sinful condition of the will, and the sole reason why a man cannot believe is that he is so exceedingly sinful that such a one as he cannot use his will for believing. He cannot will to do it because he loves sin too much. For such a “cannot” he is certainly responsible. … 1. Something may be done toward removing the difficulty by pointing out the nature of the puzzle into which the mind has fallen. The puzzle is a logical one, and concerns doctrine, not action; and it must not be permitted to stand as an obstacle to action. Regeneration is not a fact of experience [not self-consciously experienced], but an inference from experience; and inability is not a ground of quiescence [not acting], but an inference from quiescence [not acting]. It passes away in regeneration; and no one can know that it is gone save by the change in activity. We reason back from our experience and call in the doctrine of inability to explain our actual conduct, and that of regeneration to explain the gulf between our conduct of yesterday and today. But that gulf is revealed in consciousness only by action. No man can know, then, whether he is unable save [except] by striving to act. We may point out, therefore, that the doctrine of inability does not affirm that we cannot believe, but only that we cannot believe in our own strength within us by which we may attain to belief. But this is far from asserting that on making the effort we shall find it impossible to believe. We may believe, in God’s strength…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Inability &amp; the Demand of Faith’ in Selected Shorter Writings</cite>, ed. John Meeter, vol. 2, pp. 725-26</span></figcaption>

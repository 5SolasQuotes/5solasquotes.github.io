<main class="wrap"><figure class="quote" id="q-62bc35a5e2" data-kw="">
<blockquote><p>VIII. Third, the object of the justifying action:… (2) men (1 Tim. 2:5), not just any, but: … (d) called to receive the Redeemer and the conditions of redemption (Rom. 8:30; 1 Pt. 2:9–10); (e) regenerated and made alive (Eph. 2:5), illuminated in mind (Eph. 1:17–19), renewed in heart or will (Ezek. 36:26), so that they are able to submit to calling, and receive the Redeemer offered to them, and the terms of redemption; (f) converted (Jer. 31:18–19), so that through the power received in regeneration, they by faith actually receive God and the Mediator (Phil. 3:12), and turn themselves from their sins to righteousness (Jer. 31:19); (g) united with Christ, so that they possess, in none other than Christ, a righteousness not their own, but Christ’s, that which is through faith (Phil. 3:9; 1 Cor. 1:30; Acts 4:12). From these things can at the same time be perceived the order and procedure of God whereby he is accustomed to provide the justification of the miserable sinner. IX… whereby he calls the elect to receive the Redeemer given to them (2 Tim. 1:9), whereby he grants faith to them, by means of which they receive him (Phil. 1:29) and are united with him (Phil. 3:9), the same grace, I say, whereby he reckons and pronounces them righteous in Christ.</p></blockquote>

e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62bc35a5e2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=VIII.%20Third%2C%20the%20object%20of%20the,and%20pronounces%20them%20righteous%20in%20Christ&amp;text=VIII.%20Third%2C%20the%20object%20of%20the%20justifying%20action&amp;text=he%20reckons%20and%20pronounces%20them%20righteous%20in%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1a44850229" data-kw="">
<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Key of Saving Knowledge, Opening out of the Holy Scriptures the Right Way &amp; Straight Passage to Eternal Life</cite>, … (London: Badger, 1641), pp. 79-82</span></figcaption>

</figure><figure class="quote" id="q-43175d6add" data-kw="Faith alone">
<blockquote><p>By that alone are we justified by which the righteousness of Christ is applied to us, who satisfied the law for us. Now this is done by faith alone; nor does it belong to love or to hope. Not to hope, which does not apprehend, but expects the thing promised. Not to love, which is concerned with the fulfillment of a command, not with the apprehension of a promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.9</span></figcaption>

</figure><figure class="quote" id="q-b4fd6cf121" data-kw="">
<blockquote><p>May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology</cite>, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878), pp. 438–39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-e492c301ae" data-kw="">
<blockquote><p>[Papists:] The Lord says not [in Mt. 15:28; Mk. 7:29], ‘Thy daughter is saved by thy faith,’ as if it were by a means or instrument only of attaining that benefit, as you [Protestants] say, but [rather] for this saying as [it was] a meritorious cause. Answer:

1. Confession is taken for faith itself.

2. Faith is here taken in an objective sense, as it signifies Christ apprehended by faith, to whose only merit this benefit is to be ascribed: but by the means of faith; which God requires as an intermediate conditon on our part to this, that any benefit from his bountiful hand may be obtained, etc. [3] Unless that solution please better, which taking the name of ‘faith’ properly, says, that by that speech is not signified a cause, but a condition only, because all things are promised to him that believes; whence it is no wonder if when God gives any benefit to the faithful, He is said to give it for faith, which He necessarily requires in the receiver: Not that he deserves it by believing, but because God has promised it to none but to the believer; and that of mere grace in the Mediator Jesus Christ, in whom all the promises are yea and Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, ch. 2, verse 8, p. 273 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 409</span></figcaption>

1. Confession is taken for faith itself.

2. Faith is here taken in an objective sense, as it signifies Christ apprehended by faith, to whose only merit this benefit is to be ascribed: but by the means of faith; which God requires as an intermediate conditon on our part to this, that any benefit from his bountiful hand may be obtained, etc. [3] Unless that solution please better, which taking the name of ‘faith’ properly, says, that by that speech is not signified a cause, but a condition only, because all things are promised to him that believes; whence it is no wonder if when God gives any benefit to the faithful, He is said to give it for faith, which He necessarily requires in the receiver: Not that he deserves it by believing, but because God has promised it to none but to the believer; and that of mere grace in the Mediator Jesus Christ, in whom all the promises are yea and Amen.”

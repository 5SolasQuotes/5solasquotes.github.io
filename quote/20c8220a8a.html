<main class="wrap"><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit.

2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life.

2. This rendering up is not till the end, then shall the end be.

3. It is when all rule and authority shall be put down, v. 27; this is not in this life.

4. It is when the last enemy shall be subdued, v. 26.

5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’, pp. 287-88</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0db1f5df1" data-kw="">
<blockquote><p>22. The Spirit is not given to ordinary Christians (though it be to prophets) to bring them from God new doctrines, or laws; nor to make any supplements to the Gospel already revealed, as if it was not sufficient in its kind; nor yet to reveal the matter of Christ’s Gospel immediately to the intellect or phantasy within by way of inspiration, visions or intuitions without an external Word or revelation; nor yet to cause them to work miracles themselves. But He is given to enable, dispose and help us to understand, believe, love and practice the doctrine and Law already, by the same Spirit given to the Church, by sanctifying our power, our reason, and our wills, by holy life and light, and love… Illuminating and sanctifying is not making us prophets or apostles, nor equal to them, as not being called to their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Puritans</cite>, Manton, Bates, Case, Baxter, Fairclough, et al. | The Judgment of Non-Conformists of the Interest of Reason in Matters of Religion in which it is Proved against Make-Baits that both Conformists &amp; Non-Conformists, &amp; All Parties of true Protestants are herein really agreed, though unskilful speakers differ in words (London: 1676), p. 12 This was signed by 15 non-conformist English puritans.</span></figcaption>

</figure><figure class="quote" id="q-4f9f5bf5fb" data-kw="">
<blockquote><p>Moreover, God permits: (1) sometimes in express terms (Col. 2:16, 20–21; Gen. 2:16–17; Lev. 11:2–4), when he removes these or those things from among things prohibited; (2) sometimes only by nowhere prohibiting (cf. Rom. 14:14; Acts 10:15); (3) sometimes also in terms of commanding (Deut. 23:20; Gen. 1:28), just as in the same terms of commanding he sometimes expressly prohibits (Num. 22:20; John 13:27).</p></blockquote>

<blockquote><p>But the disciples, being dispersed through the provinces, everywhere laid the foundations of the Church, themselves also in the name of their divine Master doing many and almost incredible miracles; for at His departure He had endowed them with power and strength, by which the system of their new announcement might be founded and confirmed.</p></blockquote>

</figure><figure class="quote" id="q-d2c06fc13a" data-kw="">
<blockquote><p>The extraordinary gifts of the Spirit, such as the gift of tongues, of miracles, of prophecy, etc., are called extraordinary, because cause they are such as are not given in the ordinary course of God’s providence. They are not bestowed in the way of God’s ordinary providential dealing with his children, but only on extraordinary occasions, as they were bestowed on the prophets and apostles to enable them to reveal the mind and will of God before the canon of Scripture was complete, and so on the primitive Church, in order to the founding and establishing of it in the world. But since the canon of the Scripture has been completed, and the Christian Church fully founded and established, these extraordinary gifts have ceased.</p></blockquote>

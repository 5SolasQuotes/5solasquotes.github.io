<blockquote><p>Thirdly, Deut. 18. 18. to 22. I will raise them up a Prophet from among their brethren like unto thee, and I will put my words into his mouth, and he shall speak unto them all that I shall command him &amp;c. But the Prophet which shall presume to speak a word in my name, which I have not commanded him to speak; or that shall speak in the name of other gods, even that Prophet SHALL DIE: he hath spoken presumptuously, thou shalt not be afraid of him.

From whence I infer: First, that false Prophets who presume to preach any dangerous Errors, or Heresies contrary to the Word of God, to draw men unto Error, Heresy, or False-Worship, are by the express Command of God to be put to death by the civil Magistrate, as well as such prophets who speak in the name of other gods: For this phrase SHALL DIE, here, is not intended of a NATURAL DEATH COMMON TO ALL MEN; for then it were no special Punishment, threatened unto, and to be inflicted upon such; but a PENAL DEATH judicially inflicted by men, as is clear by comparing it with Deut, 13. 5. c. 17. 5. Zech. 13. 3. &amp; Jer. 26. 8. 11. 16. 23. Exod. 21. 12. 14. Num. 35. 30.

Secondly, this precept relates principally to false Teachers, and Prophets under the Gospel, and is not confined only to the times of the Law, since the next Verses preceding, to which it is subjoined, relate only to Christ himself and his Prophesying in the Flesh, as is evident by comparing them with Joh. 1. 45. Act. 3. 22. &amp; 7. 37. and because it is seconded by Zech. [1]3. 2, 3 &amp;c. which relates only to the times of the Gospel (as I shall prove anon) under which False Prophets are to be put to death as well as under the Law. These three Precepts we find seconded with exemplary Executions approved and commanded by God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The sword of Christian magistracy supported, or, A vindication of the Christian magistrate’s authority under the Gospel, to punish idolatry, apostacy, heresy, blasphemy, and obstinate schism, with corporal, and in some cases with capital punishments</cite>, (London: John Bellamy, 1653), pp 6-7.</span></figcaption>

<blockquote><p>If the thing be indifferent, I confess no man is to be compelled to it against his conscience, for this hath been the tyranny of Papists and Prelates, to compel men against their conscience to certain rites which themselves acknowledged to be merely indifferent, setting aside obedience to authority in such things, which (say they) is not indifferent. But if the word of God either directly or by necessary consequence, make the thing necessary, and such as we cannot leave undone without sin and breach of duty; if there be such an obligation from the word, then may a man be compelled to it, though against his conscience.</p></blockquote>

</figure><figure class="quote" id="q-29c455e099" data-kw="">
<blockquote><p>Again, for worldly wealth men can toil and moil all the week long; and yet are they not weary; they think not the whole week long enough neither: But for the heavenly gain, for the spiritual thrift, we have but one day of seven, and we think that too much too: we think the day all too long, the labour all lost, and the whole time cast away, that we employ and spend to this purpose. We say as the same Jews at another time said, When will the new Moon be past; and the Sabbath once over? that we may return again unto our worldly affairs. Yea many among us have not the patience to tarry so long, but spend a great part of the Sabbath, that is God’s Market or Mart-day, for the getting of this spiritual gain, either about their worldly affairs, or their bodily delights.

The Sabbath day, I say, is God’s Market-day. And those that seek to take away the Sabbaths, attempt to put down God’s Markets, and so do the Devil good service, whatsoever their intent be. As frequenting of Markets maketh a rich man; so keeping of Sabbaths maketh a rich Christian. And as we count him a bad husband, that followeth game on the Market day: so may we as well count him a spiritual unthrift, that spendeth the Sabbath in that sort.

But may some say, when we have been at Church, and heard the Sermon and Service, is not Gods Market-day then done?

I answer: If the Sabbath be a day, then is it not so soon done. God’s Market lasteth all day long. Yea, grant the principal, because the public, of it be past: yet as Market-folks returning from Market will be talking of their Markets, as they go by the way, and bee casting up of their penny-worths, when they come home, reckon what they have taken, and what they have laid out, and how much they have gotten: So should we, after we have heard the Word publicly, confer privately of it with others; at least meditate on it by our selves, and be sure to take an account of our selves, how we have profited that day by the Word that hath been spoken unto us, and by other religious exercises that have been used of us. And as the Market-man counteth that but an evil Market-day, that he hath not gained somewhat on more or less: So may we well account it an evil Sabbath to us, whereon we have not profited somewhat, whereon we have not either increased our knowledge, or been bettered in affection; whereon we have not been further either informed in judgement, or reformed in practice, whereon we have added no whit at all to our talent.

To wind up all in a word. If we hold Godliness to be, as the Apostle here saith it is, a matter of Gain, and of great Gain, that which maketh Gain to be Gain, and without which Gain it selfe is no Gain indeed; that it bringeth all good with it to him that hath it; and that it never leaveth him, but abideth with him, and sticketh by him for ever: Oh let us labour then to get of it, and to grow more and more in it; let us endeavour to outgo one another in godliness; let us call our selves to a reckoning how we thrive or pare in it; let us not put it away for such trifles and toys as the world or the Devil shall tender unto us to bereave us of so precious a pearl; especially let us have a care of frequenting God’s Markets, of observing God’s Sabbaths, the principal means of increasing this spiritual wealth in us. So shall it come to pass that we shall have God to be our portion; we shall be heirs of his Kingdom, and coheirs with his Christ; we shall have all the good things both of this life, and the next assured unto us here, and the full fruition of them forever hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gain of Godliness in Certain sermons, first preached, and after published at several times, by M. Thomas Gataker B. of D. and pastor at Rotherhith. And now gathered together into one volume: the several texts and titles whereof are set down in the leafe following</cite></span></figcaption>

+his+Christ%3B+we+shall+have+all+the+good+things+both+of+this+life%2C+and+the+next+assured+unto+us+here%2C+and+the+full+fruition+of+them+forever+hereafter.%E2%80%9D%0A%0A%E2%80%94+Thomas+Gataker%2C+The+Gain+of+Godliness+in+Certain+sermons%2C+first+preached%2C+and+after+published+at+several+times%2C+by+M.+Thomas+Gataker+B.+of+D.+and+pastor+at+Rotherhith.+And+now+gathered+together+into+one+volume%3A+the+several+texts+and+titles+whereof+are+set+down+in+the+leafe+following&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29c455e099.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29c455e099.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/01/28/thomas-gataker-on-the-great-gain-of-observing-gods-market-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Zanchi: In things indifferent something is to be yielded to the weaker, and that for a time; namely, until they be taught the truth. For if after that the truth is sufficiently and clearly laide abroad unto them so as being convicted they have nothing more what they may object and yet will notwithstanding stick in doubt; sure their infirmity is not to be nourished by their dissembling with them or winking at them. For this is rather strong obstinacy then weakness; Of Redemption, ch. 17, fol. 493. Beza in a case of [the threat of] deprivation [of one’s office as minister] advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire:) We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires:) they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.</p></blockquote>

<blockquote><p>§7. Of Bowing at the Name of Jesus It is rationally supposed that in this act, not the name, but the Person so named is made the object of adoration; the name pronounced is only the occasion of the present adoration of the Person. Nothing in reason or Scripture does evince that it is simply evil to adore Christ by incurvation of the body or other reverent gesture upon occasion of the pronouncing of the name “Jesus.</p></blockquote>

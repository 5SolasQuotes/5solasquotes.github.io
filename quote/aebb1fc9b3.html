<main class="wrap"><figure class="quote" id="q-aebb1fc9b3" data-kw="">
<blockquote><p>Let no one seize my statements as an excuse for saying that it is lawful for images or pictures to be venerated, since at times God and Christ seem effectively to declare themselves to us there. For we have clear instruction not to make ourselves images to worship. But regarding scriptural words and sacraments, nothing prevents our worship in hearing or receiving them, because they are instituted by the word, will and command of God, so that we may be called to divine service, which consists of worship. Nor should you gather from this that the elements of the Eucharist are to be worshipped. For whatever strength the symbols have is from the Holy Spirit, the words of the Lord and his institution, which are nothing without the use of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), §51, p. 87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aba9d7468c" data-kw="">
<blockquote><p>In this sort may Christians honor the cross: for who makes any question but in our wars against the Jews or Mahumetists, we may bear our ensigns or arms crossed, for public testifying to the infidels that we are Christians, and our adversaries are miscreants and void of faith. So may the cross be engrave[n] on money to show that it is the coin or stamp of a Christian prince. So may the cross be placed on the gates of cities, castles or houses, to deliver apparently that the inhabitants in such places do make profession of Christianity. So was it long since ordained that the instruments of contracts or bargaining made by public notaries should be sealed and signed with the cross, as it is read in lib. de Cod. And in such like politic considerations, we reject not the use of the material cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise on the Virtue of the Cross &amp; the True Manner How to Honour It</cite>, (London, 1599), ‘How the Cross Ought to be Honored’, no page number. de La Faye (1540-1615) served with Theodore Beza in Geneva as a reformed professor of philosophy and theology.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“In this sort may Christians honor the cross: for who makes any question but in our wars against the Jews or Mahumetists, we may bear our ensigns or arms crossed, for public testifying to the infidels that we are Christians, and our adversaries are miscreants and void of faith. So may the cross be engrave[n] on money to show that it is the coin or stamp of a Christian prince. So may the cross be placed on the gates of cities, castles or houses, to deliver apparently that the inhabitants in such places do make profession of Christianity. So was it long since ordained that the instruments of contracts or bargaining made by public notaries should be sealed and signed with the cross, as it is read in lib. de Cod. And in such like politic considerations, we reject not the use of the material cross.”

</figure><figure class="quote" id="q-7054c58739" data-kw="">
<blockquote><p>…there is, in fact, a wide range of attitudes toward icons that have defied every attempt at schematic classification. Thus, the mere presence of icons is, by itself, never a proof of icon worship: the place of the icon, its character as a relic, the (holy) persons it represents, or even the name it was given, are always points to consider.</p></blockquote>

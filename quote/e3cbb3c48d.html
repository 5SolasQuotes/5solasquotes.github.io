<blockquote><p>IV. As to the people’s case, it needs no other answer:

      1. No member may remove without cause:

      2. Nor abruptly and uncharitably to the church’s dissatisfaction, when he may avoid it. But 3. He may remove upon many just causes (private or public) whether the church and pastors consent or not, so the manner be as becomes a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (1673), pt. 3, Christian Ecclesiastics, Question 104, ‘Is a pastor obliged to his flock for life? Or is it lawful so to oblige himself? And may he remove without their consent? And so also of a church-member, the same questions are put.’ Baxter was a congregationalist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39a12a85b5" data-kw="">
<blockquote><p>We see not how letters of recommendation, most lawful as we judge, and necessary, can resign ministerial power, a liberty bought with Christ’s blood (as you say) to any other church, for we think all the visible Churches are one catholic visible Church and should have a visible communion, and so that there is no resignation of ministerial power in these letters, but they are declaratory of the Christian behavior of the dismissed Christian. We ask if dimissory letters be authoritative and done by the church as the church, and how can a church usurp authority (by your way) over a sister church to recommend a sojourner to a church-state and church liberties and seals of the Covenant? one church has no authority over another. If these letters be merely private and merely declaratory, to manifest and declare the sojourner’s Christian behavior, only then he had power and right without these letters or any act of resignation, or giving away ministerial power, to be a Church-member of the visible Church to the which he goes. Therefore, he was a member of the visible Church to which he goes before the dimissory letters were written; and the letters do resign no right but only notify and declare the sojourner’s preexistent right, and so there is a visible Church and a visible communion of all congregations on earth, and must be an external power and authority in all for synods. Let our [congregationalist] brethren see to this. [Margin note:] It is true, none should remove from one congregation to another without God go before them, nor can they change countries without God’s warranting direction, Gen 12:1; 46:4, but that such removal is a matter of Church-discipline, and must be done by a ministerial power, is unwarranted by any word of God.

3. [In congregationalism] The person to remove must be dismissed and loosed by the consent of the whole congregation (if conveniency permit) else he is not exonered of his church-oath made to that congregation; What if conveniency do not permit? then is he loosed from an oath without consent of the Church, which did by oath receive him. I thinkejusdem potestatis est(as the law says) ligare et solvere, ‘that’ Church ‘power which binds must loose.’

4. If the [man-drawn-up] church-covenant be an everlasting covenant, as Jer. 50:5 [which the congregationalists proof-texted], tying the man to the membership of that particular congregation forever, I see not how the church can use [letters of transfer like] indulgences and Pope-like dispensations against the oath of God, to break it upon light and frivolous reasons [such as moving, etc.]; for if God punish covenant breaking, so also should the church, and can by no indulgence be accessory to the breach of God’s oath; there is too great a smell of Popery, Arminianism, and Socinianism in this way in my weak judgement. But if the man be not sworn a member of that particular church by his oath, he is sworn a member of the visible Church universal, which our brethren cannot well say. Neither is any covenant called an everlasting covenant in the Scripture but the Covenant of Grace, Jer. 31:33; 32:40; Isa. 54:9-10, and that is made with the invisible catholic Church of believers, as is the Covenant [in] Jer. 50:5, and not a Covenant with one visible congregation; and what warrant has the Church to dispense with the breach of such an everlasting Covenant?

5. The testimony of other churches, if it be a warrant to you, in faith, to receive into the church such a one as a saint and a temple of the Holy Spirit, how should it not also be a warrant to you to cast out and excommunicate also?

6. The person coming from another Church, if of approven piety, is received, by lifting up of the hands, or silence of the church, as you say:

1. Have we a warrant from God’s Word for such a new inchurching?

2. Why is he not received by a church oath? as a minister transplanted to another church must have ordination and election of new [according to congregationalists], for to you there is alike reason.

3. If there be no need of a new church oath to make him a member of that visible congregation, seeing now he is loosed from the former, you insinuate his former church-oath did make him a member of a visible church, and so he that is a visible member in a church, is a visible member of all, and so there must be a visible Church-catholic, if there be a catholic visible membership in any one member, and so you destroy what you build.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 6, section 1, pp. 328-30</span></figcaption>

<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].”

— John Bairdie, Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London: Cockerill, 1681), p. 173">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBe+not+easily+tempted+to+cast+at+your+ministers+of+whose+heart-honesty+you+have+had+sufficient+demonstration.+If+once+Satan+get+you+to+begin+a+little+to+spurn+at+them%2C+he+will+not+cease+tempting+and+providence+may+justly+let+snares+be+rained+on+you%2C+occasions+of+stumbling+be+afforded+you%2C+till+ye+turn+quite+off+and+become+wild.+Notorious+it+is+that+people%E2%80%99s+idolizing%2C+inamoredness+with+some%2C+and+rooted+prejudice+at+others+upon+partialities+and+by-respects+are+both+a+cause%2C+foment+and+consequent+of+woeful+divisions%2C+1+Cor.+1%3A11-12+and+3%3A3-4.+O+esteem+your+pastors+highly+in+love+for+their+work%E2%80%99s+sake+and+let+not+every+petty+difference+cast+you+and+them+out%3A+Keep+not+distance+with+them%2C+but+go+and+lovingly+confer+with+them+anent+what+ye+and+they+differ+in%3A+And+if+ye+get+not+satisfaction%2C+recommend+the+matter+to+God%2C+but+let+love+and+peace+stand+entire+notwithstanding.+What+is+Satan%E2%80%99s+great+engine%2C+and+consequently+his+design+for+marring+your+good+of+ministers%3B+but+by+stating+prejudices+in+your+minds+at+them%3F+Shut+your+ears+and+hearts+then+to+all+charms+that+would+suggest+ill+thoughts+of+your+honest+ministers.+Receive+not+lightly+ill+reports+of+them%2C+spread+perhaps+industriously+to+make+them+odious+%28Jer.+20%3A10%29+to+alienate+you+from+them%2C+as+Gal.+4%3A15-16.+Be+not+then+too+credulous%2C+try+e%E2%80%99re+ye+trust%2C+and+admit+no+bad+impressions+of+them+before+ye+have+found+that+truly+they+deserve+%5Bthem%5D.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%3A+Cockeri <blockquote><p>In conclusion, the five membership vows used by the PCA were added to the Directory for Worship of the Book of Church Order by the PCUS in response to the growth of parachurch-interdenominational ministries in the late nineteenth and early twentieth centuries. This has been shown in particular with the addition of vow four that requires a member to support the church. The case was not developed in this brief article, but it is believed that the four vows adopted in 1894 were intended to distinguish church membership in the PCUS as a shepherded, historic, confessional, and evangelistic church from the parachurch, revivalism, and interdenominational churches.</p></blockquote>

<blockquote><p>…yet it [Ps. 95:6] commends not kneeling except in a certain kind of worship only. And as for kneeling in the general nature of it, it is not of divine institution, but in itself indifferent, even as sitting, standing, etc. all which gestures are then only made good, or evil, when in actu exercito [having been being exercised in the act] they are actuated and individualized by particular circumstances.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8e8486529" data-kw="">
<blockquote><p>The Dr. holds him upon kneeling in receiving the sacramental elements, and denies that it is scandalous or any way inductive to spiritual ruin. But (if he will) he may consider that the ruder sort who can not distinguish betwixt worshipping the bread and worshipping before the bread, nor discern how to make Christ the passive object of that worship and the bread the active, and how to worship Christ in the bread, and make the worship relative from the bread to Christ; are by his example induced to bread-worship, when they perceive bowing down before the consecrated bread in the very same form and fashion wherein Papists are seen to worship it, but can not conceive the nice distinctions which he and his companions use to purge their kneeling in that act from idolatry. As for others who have more knowledge, they are also induced to ruin, being animated by his example to do that which their consciences do condemn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 9; p. 44</span></figcaption>

<blockquote><p>As for adoring of the ark and footstool of God: 1. Joan Gisenius, a Lutheran says, The Jews had precept and promise to worship God before the ark; we have no command to tie external adoration to any place or creature. 2. Didoclavius [David Calderwood] says, It is lawful to adore God before the ark, and the symbols of his immediate presence, because God is there to receive his own worship Himself, by an immediate indwelling presence: For says Mr. [John] Weames, He appeared in glory above the ark, betwixt the cherubims, and it was a type of Christ who dwelt in our flesh; but it is not lawful to worship Him before the symbols of his grace [the sacraments]. 3. The ark was a type in the act of teaching, we grant; but that it was in the act of adoring God who was immediately present, and a symbol vice-gerent of God, we read not. There is no need of mediate signs where God is immediately present and adored as He was in the ark; they were to fix both senses and thoughts immediately upon God. 4. They were to worship, not the ark, but the precept is, et incurvate vos scabello, Worship toward the ark. Arias Montanus turns it, ‘Worship to the ark’: The Greek fathers of the second Nicene Council, ignorant of the Hebrew Tongue, would have the Lord commanding to adore his footstool; whereas the particle [Hebrew] is a note of the dative case, and often it signifies motion to a thing, or at a place, [Hebrew] ad dextram, and does not absolutely signify the accusative case. Musculus, ‘ad Scabellum‘, he makes it the ark of the testament. Calvin, the Temple. Junius makes it well to signify the measure of bowing, bow to the footstool, or ground, or pavement of the Temple where the Lord’s feet are, as he sat on the cherubims, 1 Chron. 28:1. For there is no ground for adoring the ark, but the words are to be read, ‘Exalt the Lord our God, and bow yourselves’, (to wit, to Jehovah, who shows Himself, or dwells at his footstool), that is, betwixt the cherubims, 2 Sam. 6:1. For the word [Hebrew] at his footstool, is not constructed with the verb, [Hebrew] incurvate vos: Jesuits and Formalists devised that construction, but it is to be constructed with the word, which is to be repeated from the former part of the verse, Bow yourselves to Jehovah who dwelleth in the ark, or in the Temple: A familiar elipsis to the Hebrews, Ps. 5:8. I will bow myself (to the Jehovah dwelling) in the temple of thy holiness, as we are taught, ‘Our Father which art in Heaven’: So [Greek or Hebrew] and it is a description of God from the place where He dwelt, and exhibited his presence to his rude people. 4. It is ignorance in Burges to prove God may be adored in the elements, because they are as excellent symbols of God’s presence as the ark: for created excellency is no ground of adoring the elements, except it be a Godhead, and uncreated excellency: We condemn Pope Anastasius, who directs reverend bowing at the hearing of the Gospel, and not of the Epistles, as if the Gospel were holier than the Epistles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Ch. 1; pp. 171-2</span></figcaption>

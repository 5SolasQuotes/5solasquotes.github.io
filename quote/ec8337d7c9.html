<main class="wrap"><figure class="quote" id="q-ec8337d7c9" data-kw="">
<blockquote><p>We further say that good works justify us in St. James’s sense, Jm. 2:14. There is a double justification:

1. A justification of a man from sin in the sight of God.

2. Of a Christian from hypocrisy in the sight of both God and man; the first way a man is justified only by the blood of Christ; the second way by good works; for we must know a man’s conscience has two burdens.

1. My sins are great and liable to damnation; how shall I be acquit of that? From this our own works cannot justify us; it is done only by the blood of Christ.

2. I: But the blood of Christ cleanses only true Christians that are in Christ and have true grace; but you are an hypocrite; how shall I now be quit from the imputation of hypocrisy? In that I am justified by my works, let it appear to myself and others that I have lived in all uprightness, 2 Cor. 1:12; so that justification from hypocrisy before God and man is from the witness of my upright and unblameable life, so that I am justified from a double accusation: from the one by one way, from the other by another way. I am a sinner, that I cannot deny; my best works are sinful; therefore from that I am justified only by the blood of Christ. But Christ’s blood belongs not to you; you are an hypocrite; now how shall I know the sincerity of faith but from the fruits, which is an holy and righteous life, so that if I walk so, I justify myself from that imputation. How does Hezekiah help himself when God spake bitter things? ‘Remember how I have walked before Thee with an upright heart,’ 2 Jn. 3; Isa. 53:11. How do I know that I know Him? Why if I keep his commandments; therefore we say that an holy life is an evident sign of our fellowship with God: it glorifies God; it stops slanders and brings on others; and besides all this, a godly life will justify us from hypocrisy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John</cite>, … upon the First Epistle General of John (d. 1652; London: 1658), on 1 Jn. 1:7, “Doctrine: To walk in the light is a certain mark of true fellowship with God”, p. 31</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94faf9202e" data-kw="">
<blockquote><p>Justification by faith is an answer to the greatest personal question ever asked by a human soul: “How shall I be right with God? How do I stand in God’s sight? With what favor does he look upon me?” There are those, I admit, who never raise that question. There are those who are concerned with the question of their standing before men but never with the question of their standing before God. There are those who are interested in what “people say” but not in the question of what God says. Such men, however, are not those who move the world. They are apt to go with the current. They are apt to do as others do. They are not the heroes who change the destinies of the race. The beginning of true nobility comes when a man ceases to be interested in the judgment of men and becomes interested in the judgment of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God Transcendent</cite></span></figcaption>

</figure><figure class="quote" id="q-ce0092075d" data-kw="">
<blockquote><p>Objection. In the same way as Abraham was justified, so also are we justified, as children of Abraham. But Abraham was not justified by faith alone, but also by works, as the apostle James testifies (Jm. 2:21). Response. A person is said to be justified either before himself and in his conscience, or before God. Abraham was not justified before himself and in his conscience by faith alone, but also by works—I grant it. He was not justified by faith alone before God—I deny it. I explain: a godly person sometimes doubts whether he is among those who are justified; that is, he acknowledges indeed that he must be justified by true faith, but doubts whether his faith is true. This, however, he discovers and recognizes from the warmth of faith, namely charity. James does not treat of that justification which is before the tribunal of God, but of that by which we are justified in our own conscience, when our righteousness is made evident to us. Therefore, we are justified—that is, our righteousness is made manifest to us—not only by faith but also by good works, insofar as they are evidences of sincere faith; but we are not thus justified before God, who regards faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, … (d. 1625; Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V, pp. 364-65, trans. ChatGPT-5</span></figcaption>

<blockquote><p>…in my judgment the usual solution of this appearing difficulty… in the discourse of St. James, ch. 2, v. 14 to the end, has not been in the least impeached, nor has had any new difficulty put upon it in some late discourses to that purpose… …It is taken for granted on all hands that there is no real repugnancy or contradiction between what is delivered by these two apostles… …It is taken also for granted on all other occasions that when there is an appearance of repugnancy or contradiction in any places of Scripture, if some or any of them do treat directly, designedly and largely about the matter concerning which there is a seeming repugnancy or contradiction, and others, or any other speak of the same things only obiter, occasionally, transiently, in order unto other ends, the truth is to be learned, stated and fixed from the former places… According unto this rule, it is unquestionable that the doctrine of justification before God is to be learned from the writings of the apostle Paul, and from them is light to be taken into all other places of Scripture where it is occasionally mentioned… For it must be acknowledged that he wrote of this subject of our justification before God on purpose to declare it for its own sake, and its use in the Church, and that he does it fully, largely and frequently in a constant harmony of expressions… As unto what is delivered by the apostle James, so far as our justification is included therein, things are quite otherwise. He does not undertake to declare the doctrine of our justification before God, but having another design in hand as we shall see…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…in my judgment the usual solution of this appearing difficulty… in the discourse of St. James, ch. 2, v. 14 to the end, has not been in the least impeached, nor has had any new difficulty put upon it in some late discourses to that purpose… …It is taken for granted on all hands that there is no real repugnancy or contradiction between what is delivered by these two apostles… …It is taken also for granted on all other occasions that when there is an appearance of repugnancy or contradiction in any places of Scripture, if some or any of them do treat directly, designedly and largely about the matter concerning which there is a seeming repugnancy or contradiction, and others, or any other speak of the same things only obiter, occasionally, transiently, in order unto other ends, the truth is to be learned, stated and fixed from the former places… According unto this rule, it is unquestionable that the doctrine of justification before God is to be learned from the writings of the apostle Paul, and from them is light to be taken into all other places of Scripture where it is occasionally mentioned… For it must be acknowledged that he wrote of this subject of our justification before God on purpose to declare it for its own sake, and its use in the Church, and that he does it fully, largely and frequently in a constant harmony of expressions… As unto what is delivered by the apostle James, so far as our justification is included therein, things are quite otherwise. He does not undertake to declare the doctrine of our justification before God, but having another design in hand as we shall see…”

— John Owen, ch. 20, ‘The Doctrine of the Apostle James concerning Faith &amp; Works, its Agreement with that of St. Paul’ in The Doctrine of Justification by Faith in Works (†1683; Johnstone &amp; Hunter, 1850), 5.384-400, pp. 384-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6in+my+judgment+the+usual+solution+of+this+appearing+difficulty%E2%80%A6+in+the+discourse+of+St.+James%2C+ch.+2%2C+v.+14+to+the+end%2C+has+not+been+in+the+least+impeached%2C+nor+has+had+any+new+difficulty+put+upon+it+in+some+late+discourses+to+that+purpose%E2%80%A6+%E2%80%A6It+is+taken+for+granted+on+all+hands+that+there+is+no+real+repugnancy+or+contradiction+between+what+is+delivered+by+these+two+apostles%E2%80%A6+%E2%80%A6It+is+taken+also+for+granted+on+all+other+occasions+that+when+there+is+an+appearance+of+repugnancy+or+contradiction+in+any+places+of+Scripture%2C+if+some+or+any+of+them+do+treat+directly%2C+designedly+and+largely+about+the+matter+concerning+which+there+is+a+seeming+repugnancy+or+contradiction%2C+and+others%2C+or+any+other+speak+of+the+same+things+only+obiter%2C+occasionally%2C+transiently%2C+in+order+unto+other+ends%2C+the+truth+is+to+be+learned%2C+stated+and+fixed+from+the+former+places%E2%80%A6+According+unto+this+rule%2C+it+is+unquestionable+that+the+doctrine+of+justification+before+God+is+to+be+learned+from+the+writings+of+the+apostle+Paul%2C+and+from+them+is+light+to+be+taken+into+all+other+places+of+Scripture+where+it+is+occasionally+mentioned%E2%80%A6+For+it+must+be+acknowledged+that+he+wrote+of+this+subject+of+our+justification+before+God+on+purpose+to+declare+it+for+its+own+sake%2C+and+its+use+in+the+Church%2C+and+that+he+does+it+fully%2C+largely+and+frequently+in+a+constant+harmony+of+expressions%E2%80%A6+As+unto+what+is+delivered+by+the+apostle+James%2C+so+far+as+our+justification+is+included+therein%2C+things+are+quite+otherwise.+He+does+not+undertake+to+declare+the+doctrine+of+our+justification+before+God%2C+but+having+another+design+in+hand+as+we+shall+see%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+ch.+20%2C+%E2%80%98The+Doctrine+of+the+Apostle+James+concerning+Faith+%26+Works%2C+its+Agreement+with+that+of+St.+Paul%E2%80%99+in+The+Doctrine+of+Justification+by+Faith+in+Works+%28%E2%80%A01683%3B+Johnstone+%26+Hunter%2C+1850%29%2C+5.384-400%2C+pp.+384-86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8e78e51003.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8e78e51003.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=in%20my%20judgment%20the%20usual%20solution,in%20hand%20as%20we%20shall%20see&amp;text=in%20my%20judgment%20the%20usual%20solution%20of%20this&amp;text=another%20design%20in%20hand%20as%20we%20shall%20see" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

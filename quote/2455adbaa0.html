<main class="wrap"><figure class="quote" id="q-2455adbaa0" data-kw="Apocrypha">
<blockquote><p>The books commonly called Apocrypha, not being of divine inspiration, are no part of the canon or rule of the Scripture, and, therefore, are of no authority to the church of God, nor to be any otherwise approved or made use of than other human writings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

</figure><figure class="quote" id="q-4e6e6fd000" data-kw="apocrypha">
<blockquote><p>The Apocryphal books are so called not because the authors are unknown (for there are some canonical books whose authors are unknown and some apocryphal books whose authors are known); not because they could be read only in private and not in public (for some of them may be read even in public), but either because they were removed from the crypt (apo tēs kryptēs) (that sacred place in which the holy writings were laid up) as Epiphanius and Augustine think; or because their authority was hidden and suspected, and consequently their use also was secret since the church did not apply to them to confirm the authority of ecclesiastical doctrines (as Jerome says, ‘Praefatio in libros Salomonis’ from “Hieronymi Prologus Galeatus” in Biblia Sacra Vulgata Editionis Sixti V … et Celementis VIII [1865], p. lii); or, what is more probable, because they are of an uncertain and obscure origin (as Augustine says, CG 15.23* [FC 14:474]). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.1</span></figcaption>

</figure><figure class="quote" id="q-5c8360b1f1" data-kw="nt canon">
<blockquote><p>(3) From the providence of God perpetually keeping watch for the safety of the church (which cannot be conceived to have allowed her to suffer so great a loss). Otherwise what would become of the wisdom and goodness and power of God if he had willed that such a precious treasure should be shown to his church and then taken away; and that the body of Scripture should exist at this day mutilated and defective? (4) From the duty of the church which is religiously to preserve the oracles of God committed to her and to search them diligently. That she has not been careless to her charge is evident even from this—that neither Christ nor his apostles ever charged the Jews with this crime. This sacrilege they (who did not omit lesser things) would not have passed over in silence, if they had been really guilty. Yea, Paul commends this privilege of the Jews because unto them were committed the oracles of God (logia tou Theou, Rom. 3:2; 9:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.7</span></figcaption>

</figure><figure class="quote" id="q-2c33b914f5" data-kw="jewish canon">
<blockquote><p>The reasons are various. (1) The Jewish church, to which the oracles of God were committed (Rom. 3:2), never considered them as canonical, but held the same canon with us (as is admitted by Josephus, Against Apion 1.39–41 [Loeb, 1:178–79], Becanus, Manuale controversiarum 1.1 [1750], pp. 11–12) and Stapelton, “De Principiis fidei doctrinalibus controversia,” Cont. 5.7* in Opera [1620], 1:322–23). This they could not have done without the most grievous sin (and it was never charged upon them either by Christ or his apostles) if these books no less than the others had been committed to them. Nor should the canon of the Jews be distinguished here from that of Christians because Christians neither can nor ought to receive other books of the Old Testament as canonical than those which they received from the Jews, their book-servants “who carry the books of us students” (as Augustine calls them, “On Psalm 40 [41]” [NPNF1, 8:132; PL 36.463]). (2) They are never quoted as canonical by Christ and the apostles like the others. And Christ, by dividing all the books of the Old Testament into three classes (the law, the Psalms and the prophets, Lk. 24:44), clearly approves of the canon of the Jews and excludes from it those books which are not embraced in these classes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.3</span></figcaption>

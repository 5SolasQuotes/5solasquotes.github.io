<main class="wrap"><figure class="quote" id="q-65c224cc84" data-kw="">
<blockquote><p>Fifthly, walk humbly and dependently; rejoice, but be not secure. Trust to God in Covenant, not to your Covenant. Make not your Covenant, your Christ; no, not for this Temporal Salvation. As a Horse trusted to, is a vain thing to save a man, Psal. 32. so likewise is a Covenant trusted to; neither can it deliver a Nation by its great strength: though indeed the strength of it bee greater, then the strength of many Horses. In vain is salvation hoped for from this Hill, or from a multitude of Mountains heaped up and joined in one by the bond of this Covenant. Surely in the Lord our God, our God, in Covenant, is the Salvation of ENGLAND.

We cannot trust too much in GOD, nor too little in the Creature; There is nothing breaks the staff of our help but our leaning upon it. If we trust in our Covenant, we have not made it with God, but we have made it a God; And every God of man’s making, is an Idol, and so nothing in the World: you see, pride in, or trust to this Covenant will, make it an Idol, and then in doing all this, we have done nothing, For an Idol is nothing in the World. 1 Cor. 8. 4.) And of nothing comes nothing. By over-looking to the means, we lose all; And by all our travail shall bring forth nothing but wind It will not work any deliverance in the Land. Wherefore, rest not in the thing Done, but yet, up and be doing which is the last point, and my last motion about your walking in Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature, solemnity, grounds, property, and benefits, of a sacred covenant. Together with the duties of those who enter into such a covenant. Delivered in a sermon at Westminster, at the publique convention, (ordered by the Honourable House of Commons) for the taking of the Covenant, by all such, </cite>, (London: John Rothwell, 1643), p. 40.</span></figcaption>

</figure><figure class="quote" id="q-694a38d2af" data-kw="">
<blockquote><p>And concerning particulars, their [the Jews] Sabbath the Church hath changed into our Lord’s day, that is, as the one did continually bring to mind the former World finished by Creation; so the other might keep us in perpetual remembrance of a far better World, begun by him which came to restore all things, to make both Heaven and Earth new. For which cause they honored the last day, we the first, in every seven, throughout the year, …

The Moral Law requiring therefore a seventh part throughout the age of the whole World, to be that way employed, although with us the day be changed, in regard of a new Revolution begun by our Saviour Christ; yet the same proportion of time continueth which was before, because in reference to the benefit of Creation, and now much more of Renovation thereunto added by him which was Prince of the World to come; we are bound to accompt [account] the Sanctification of one day in seven, a duty which God’s Immutable Law doth exact for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>the Laws of Ecclesiastical Polity</cite>, Book 5.70 in The Works of Mr. Richard Hooker (that learned and judicious divine), in eight books of ecclesiastical polity completed out of his own manuscripts, never before published. With an account of his life and death (London: Andrew Crook, 1666), pp 273, 274.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21 Westminster divine, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

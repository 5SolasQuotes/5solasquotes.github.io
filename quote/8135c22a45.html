<main class="wrap"><figure class="quote" id="q-8135c22a45" data-kw="">
<blockquote><p>This intercession consists of various acts. (1) The appearing of Christ for us by which he places himself before God the father as the only satisfier for our sins, representing the blood once shall (i.e., The merit of his death) and asking that at the side of it he would pardon our sins and bestow upon us all blessings necessary to salvation, until he has conducted us into the possession of full felicity: “Father, I will that they also whom thou hast given me, be with me where I am; that they may behold my glory” (Jn. 17:24). Hence the lamb is seen standing in heaven, as if it had been slain (hos esphagmenos, Rev. 5:6) because his blood is ever fresh and living (i.e., of eternal virtue and efficacy). (2) Our defense and protection against the thunderbolts of the law and the accusations of Satan, pleading our cause at the tribunal of God. (3) His suretyship for us by which as he demands grace from the Father and the gifts of the Spirit necessary to our perseverance, so in turn in our name he promises to God obedience and fidelity. (4) The offering of our persons and the sanctification of our prayers and of our entire worship, inasmuch as he presents all our prayers to God as spiritual sacrifices, perfumed with the most fragrant odor of his own sacrifice, so that in and through him they may be pleasing and acceptable to God. (1 Pet. 2:5). Hence he is represented as an angel with a burning censer (Rev 8:3) to whom is given much incense, that he should offer it with the prayers of saints. Elsewhere he is called an altar upon which all our sacrifices must be placed and on which alone the rational worship we render to God can be pleasing to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.15.14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-685533d1c4" data-kw="necessity satisfaction debt">
<blockquote><p>The satisfaction here discussed is not taken widely for a simple and indiscriminate reparation of injury (as when one purges and excuses himself to him who has suffered injury). Rather it is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>

<blockquote><p>III. …But what can man do for this? His demerit is infinite (by the previous thesis). But the moral value of human actions is only finite, for the act cannot exceed the dignity of its principle. Moreover, in personal offenses, such as this one, there ought to be order and proportion between the one making satisfaction and the one to whom it is made, but this is far less between God and man than between a king and the vilest slave. IV. …Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here. Hence fall:

1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…</p></blockquote>

<blockquote><p>God, by his absolute power, could have saved man without a mediator: He is omnipotent, and could have done what He pleased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ch. 3</span></figcaption>

<blockquote><p>Carl Trueman’s study of the thought of John Owen both analyzes Owen’s own change of position and sets Owen’s doctrinal argumentation into the context of a centuries-long doctrinal conversation and debate over the necessity of the atonement, noting the position of Aquinas [holding to consequent necessity], the shift in argumentation brought about by Scotus’ voluntarism, and the apparent reflection of the Scotist view in Calvin’s own thought. Owen’s earlier approach followed out this more or less Scotistic approach and found confirming echoes in the thought of William Twisse and Samuel Rutherford. In his later approach, Owen saw the primary threat to orthodoxy as arising not from the Arminians but from the Socinians and, accordingly refocused his argument from a more intellectualist perspective and rooted the necessity of the atonement in God’s vindicatory justice. This shift in Owen’s formulation and the fact that it involved significant debate with and departure from the views of such significant Reformed thinkers as Calvin, Musculus, Twisse, and Rutherford and actually, as Trueman notes, put Owen into the company of Pareus, Piscator, Lubbertus, Cameron, and Maccovius, very clearly illustrates the diversity of the Reformed tradition, the presence of significant debates within the confessional tradition… Owen’s mature views placed him, on this particular issue, consciously in the camp of Piscator, Cameron, and Amyraut.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b35a022fe6" data-kw="">
<blockquote><p>…for if prayer was a worship enjoined to Adam before the Fall, no less than public worship of praising for the workmanship of creation, Gen. 2:2-3, it may be said, if Adam was to suit any thing in prayer to God, then especially was he to pray that he might not sin, and might not be led into temptation, but might stand in obedience, and so might have influences to determine his will to stand and continue therein, and this the law of nature seems to say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Influences of the Life of Grace… (London, 1659), ch. 1</cite>, pp. 2-3</span></figcaption>

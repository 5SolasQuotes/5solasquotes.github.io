<main class="wrap"><figure class="quote" id="q-eab71e3b1a" data-kw="">
<blockquote><p>Now for the good election of magistrates, the Lord himself declareth whom and what kind of men he will have to be chosen, in these very words: “Look over all the people, consider them diligently, and choose from among them men of courage, such as fear God, speakers of truth, and haters of covetousness, and make them rulers over thousands, rulers of hundreds, rulers of fifties, and rulers of tens, to judge the people at all seasons.” [Exodus 18:21] Four things the Lord requireth in a good governor. First, that he be a man of courage, of strength or force, that is, which hath ability to do the thing whereunto he is appointed. That ability consisteth in mind rather than in body. For it is required, that he be not a fool, but wise and skilful in that which he hath to do […]

In the second place that is set down, which indeed is the first; let him fear God, let him be religious, and not superstitious. No idolater preserveth the commonweal, but rather destroyeth it; and a wicked man defendeth not truth and true religion, but persecuteth and driveth them out of his jurisdiction. Let this magistrate of ours therefore be of the right religion, sound in faith, believing the word of God, and knowing that God is present among men and doth repay to whom he list according to their deserts. And for that cause Justinian, the emperor, in Novellis Constitutionib. 109, doth freely confess that all his help is of God; and that therefore it is convenient, that the making of all laws should depend upon him alone. […] And where the princes are God’s friends, and have often conference with God, there is hope that those commonwealths shall prosper and flourish. But, on the other side, there must needs be feared an unhappy end of that commonweal, where the enemies of God have the pre-eminence. Thirdly, there is required of him, which must be chosen and called to be magistrate, that he be true in word and deed, so that he be not found to be an hypocrite, a liar, a deceiver, a turncoat, nor one which out of one mouth doth blow both hot and cold; but faithful, simple, a plain dealer, and blameless. […]

Covetousness and greedy desire of bribes are the very plagues that choke good magistrates. By covetous men and takers of bribes law, judgment, liberty, justice, and the country itself, is set to sale and sold to the devil for money. And now, though in this place the Lord hath named only the most pestilent mischief of all other, yet there is no doubt but that he doth inclusively debar all other vices and evils of that sort, commanding them to be strange and far off from the good magistrate and godly governor. Those vices are pride, envy, anger, dicing, surfeiting, drunkenness, whoredom, adultery, and whatsoever else is like to these.

This place is made more manifest by conferring it with other places in the law of God. Moses, in Deuteronomy, saith to the people: “Bring men of wisdom, of understanding, and of an honest life, according to your tribes.” [Deuteronomy 1:13] Three things here again doth the wise man, Moses, require in them that are to be appointed magistrates in his commonweal. First, saith he, let them be wise. But the beginning of wisdom is the fear of the Lord. Let them therefore be ordained as magistrates, that are friends to God and true religion; let them be wise, and not foolish idiots. Secondarily, they must be men of understanding; that is, men of experience, who by long and continual exercise in handling of matters are able at the first brunt to deal in all cases according to the law. Lastly, they must be men of honest report, whose life and sound conversation are by their deeds perfectly tried and sufficiently witnessed of unto the people: and finally, they must be such as bear authority, and not be despised as rascal and vile knaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 319-21.</span></figcaption>

<blockquote><p>As for such who not only withdraw from this Church [of Scotland] but also have disowned the [Scottish] civil government always since this late happy [Glorious] Revolution [of 1689], and yet take the name of presbyterians to themselves [such as the United Societies and later Reformed Presbyterians], it is to be feared some of them may be under some bad Influence of Jacobites [those loyal to the previous king, James II and the House of the Stuarts], or else to be so weak as not to discern the absurdity of such a practice: And it is more remarkable that since King William came to the throne, these people have neither had minister nor preacher under the name of a presbyterian to countenance them in their sinful courses. And, in the year 1688 and 1689 we were so far from giving any countenance to such courses that we encouraged the publishing the Prince of Orange’s Declaration at Glasgow before it was published in any other place of the kingdom; we prayed publicly for success to his enterprise even before his landing in England; we swore (in the National Covenant renewed at Lesmahagow, March 3, 1689) that we would stand to the defense of his Highness, his person and authority when lawfully chosen and established as king or supreme magistrate over us. The people we preached to, in consequence of this, went to Edinburgh with others and guarded the Convention of Estates, anno 1689, and mustered in one day 1,140 men as a regiment under the command of the right honorable, the late Earl of Angus, to fight for religion and liberty under the authority of King William of glorious memory. All which make it evident that our former testimony against tyranny was from no disloyal principle to magistracy; and consequently that these people never had any encouragement to live as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lining.html">Thomas Lining</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Epistle to the Reader’</cite>, p. vii in Alexander Shields, An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was Settled anno 1689 &amp; 1690… 2nd ed. (1706; Edinburgh: William Gray, 1747) Lining was one of the last three Cameronian ministers, all of whom joined the 1690 Church of Scotland.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As for such who not only withdraw from this Church [of Scotland] but also have disowned the [Scottish] civil government always since this late happy [Glorious] Revolution [of 1689], and yet take the name of presbyterians to themselves [such as the United Societies and later Reformed Presbyterians], it is to be feared some of them may be under some bad Influence of Jacobites [those loyal to the previous king, James II and the House of the Stuarts], or else to be so weak as not to discern the absurdity of such a practice: And it is more remarkable that since King William came to the throne, these people have neither had minister nor preacher under the name of a presbyterian to countenance them in their sinful courses. And, in the year 1688 and 1689 we were so far from giving any countenance to such courses that we encouraged the publishing the Prince of Orange’s Declaration at Glasgow before it was published in any other place of the kingdom; we prayed publicly for success to his enterprise even before his landing in England; we swore (in the National Covenant renewed at Lesmahagow, March 3, 1689) that we would stand to the defense of his Highness, his person and authority when lawfully chosen and established as king or supreme magistrate over us. The people we preached to, in consequence of this, went to Edinburgh with others and guarded the Convention of Estates, anno 1689, and mustered in one day 1,140 men as a regiment under the command of the right honorable, the late Earl of Angus, to fight for religion and liberty under the authority of King William of glorious memory. All which make it evident that our former testimony against tyranny was from no disloyal principle to magistracy; and consequently that these people never had any encouragement to live as they do.”

— Thomas Lining, ‘Epistle to the Reader’, p. vii in Alexander Shields, An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was Settled anno 1689 &amp; 1690… 2nd ed. (1706; Edinburgh: William Gray, 1747) Lining was one of the last three Cameronian ministers, all of whom joined the 1690 Church of Scotland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+such+who+not+only+withdraw+from+this+Church+%5Bof+Scotland%5D+but+also+have+disowned+the+%5BScottish%5D+civil+government+always+since+this+late+happy+%5BGlorious%5D+Revolution+%5Bof+1689%5D%2C+and+yet+take+the+name+of+presbyterians+to+themselves+%5Bsuch+as+the+United+Societies+and+later+Reformed+Presbyterians%5D%2C+it+is+to+be+feared+some+of+them+may+be+under+some+bad+Influence+of+Jacobites+%5Bthose+loyal+to+the+previous+king%2C+James+II+and+the+House+of+the+Stuarts%5D%2C+or+else+to+be+so+weak+as+not+to+discern+the+absurdity+of+such+a+practice%3A+And+it+is+more+remarkable+that+since+King+William+came+to+the+throne%2C+these+people+have+neither+had+minister+nor+preacher+under+the+name+of+a+presbyterian+to+countenance+them+in+their+sinful+courses.+And%2C+in+the+year+1688+and+1689+we+were+so+far+from+giving+any+countenance+to+such+courses+that+we+encouraged+the+publishing+the+Prince+of+Orange%E2%80%99s+Declaration+at+Glasgow+before+it+was+published+in+any+other+place+of+the+kingdom%3B+we+prayed+publicly+for+success+to+his+enterprise+even+before+his+landing+in+England%3B+we+swore+%28in+the+National+Covenant+renewed+at+Lesmahagow%2C+March+3%2C+1689%29+that+we+would+stand+to+the+defense+of+his+Highness%2C+his+person+and+authority+when+lawfully+chosen+and+established+as+king+or+supreme+magistrate+over+us.+The+people+we+preached+to%2C+in+consequence+of+this%2C+went+to+Edinburgh+with+others+and+guarded+the+Convention+of+Estates%2C+anno+1689%2C+and+mustered+in+one+day+1%2C140+men+as+a+regiment+under+the+command+of+the+ <blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>

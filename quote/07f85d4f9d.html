<main class="wrap"><figure class="quote" id="q-07f85d4f9d" data-kw="">
<blockquote><p>…before [in 1 Tim. 2] there is an exhortation to pray ‘for all men,’ verse 1, which, although the Arminians make an argument that ‘all men’ is meant of all persons and not only of all sorts, both in that verse and verses 4 &amp; 6, because say they we ought to pray for all men universally pro singulis generum, and not only for all sorts; yet tis indeed an argument for the contrary. For to pray for all men without exception of any person is not commanded, but we find the contrary commanded. Jeremiah was forbidden to pray or make intercession for the obstinate, incorrigible Jews, Jer. 7:16; 11:14; 14:11. God would not have Samuel to mourn for Saul after he was rejected of the Lord, 1 Sam. 16:1, and we ought not to pray for such as sin unto death, i.e. the sin of blasphemy against the Holy Ghost, 1 Jn. 5:16. Paul is so far from praying for Alexander the coppersmith that he imprecates the vengeance of God upon him, 2 Tim. 4:14. We may not pray for the Pope who is the great Antichrist and son of perdition; neither may we pray for, but against Babylon [Romanism], especially after the people of God are out of her. We are bidden pray for our enemies, but not for the malicious incorrigible enemies of Christ. Wherefore when the apostle bids us pray for ‘all men,’ his meaning is that we should exclude no degree nor kind of men, great or small, Jew or Gentile, bound or free, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (d.1648; Ediburgh: Lithgow, 1649), ch. 22, ‘Of the true, real and safe grounds of encouragement to believe in Jesus Christ’, pp. 280-81</span></figcaption>

<blockquote><p>IV. We say it is a universal apostasy from true Christianity or of the truth of the gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency. V… it be committed against the knowledge of the truth not only legal, but especially gospel; not only theoretical and historical (for whoever sins against knowledge would sin against the Holy Spirit), but practical and convictive (although not persuasive). Conviction is when anyone knows the truth of the gospel, but is also convinced in his own mind of its goodness, so that he cannot even mutter against it (although he may wish to)… IX. Second, to constitute this sin is required a total defection from the truth and its wicked rejection and denial; not from fear simply and the weakness of the flesh… that denial of the truth should proceed from pure wickedness and petulance (arising from deadly hatred and obstinate contempt of it)… XI. The third mark is not only the denial of the recognized truth, but also a pertinacious opposition to it. For as they persecute it with the deepest hatred, it is no wonder that they endeavor with all their might to overturn it… This is evident in the Pharisees… XII. Finally, the fourth mark is stubbornness of mind and perseverance in wickedness even unto the end… XIII. And hence the unpardonableness of that sin, which is its inseparable adjunct… XV… it rises from the very nature of the sin, which is such that it excludes the very condition requisite to pardon (viz., repentance…</p></blockquote>

<blockquote><p>The faithless are the enemies of God and some of them the enemies of our Church and country, and some enemies to ourselves; and shall we pray for such? Although now they be the enemies of God, yet hereafter they may become friends and be reconciled unto Him: whereof our prayer may be a means: And therefore howsoever we are to pray against their wicked practices, we are to pray for their persons, that they of enemies may become friends; of infidels, faithful; of heretics and schismatics, sound Christians; of wicked and profane, religious and holy: ‘for this is good and acceptable in the sight of God our Savior, who wills that all men should be saved and come unto the knowledge of the truth.’ (1 Tim. 2:4) Examples of them who have prayed for the wicked are very many in the Word of God: As of Abraham, for the Sodomites, Gen. 18, Moses, for the rebellious Israelites, Ex. 32, yea, for Pharaoh and the Egyptians; Samuel, for Saul, the man of God for Jerdboam, 1 Kn. 13. But why seek [????] examples? We have a commandment to pray for such as have sinned not unto death, and a promise to procure mercy for them, 1 Jn. 5:16, and a complaint of God when this is not performed, Eze. 22:30. Prayers made for the wicked are many times without fruit. If they be without fruit, though they be to them idle, yet not to thee: Thy prayer shall return into thine own bosom, Ps. 35:13, according to that, Mt. 10:13, ‘When ye come into an house, salute it, or wish peace unto it: if the house be worthy, let your peace come upon it; but if it be not worthy, let your peace return to you.’ As for those that be our enemies, though the Schoolmen teach that we are not, or at least need not, specially to pray for them, yet our Savior Christ has commanded us to love our enemies, to bless them that curse us and to pray for them who despitefully use us and persecute us. So Jer. 29:7; Rom. 12:14. And this was practiced by our Savior, Lk. 13:34, by Stephen, Acts 7:60.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The faithless are the enemies of God and some of them the enemies of our Church and country, and some enemies to ourselves; and shall we pray for such? Although now they be the enemies of God, yet hereafter they may become friends and be reconciled unto Him: whereof our prayer may be a means: And therefore howsoever we are to pray against their wicked practices, we are to pray for their persons, that they of enemies may become friends; of infidels, faithful; of heretics and schismatics, sound Christians; of wicked and profane, religious and holy: ‘for this is good and acceptable in the sight of God our Savior, who wills that all men should be saved and come unto the knowledge of the truth.’ (1 Tim. 2:4) Examples of them who have prayed for the wicked are very many in the Word of God: As of Abraham, for the Sodomites, Gen. 18, Moses, for the rebellious Israelites, Ex. 32, yea, for Pharaoh and the Egyptians; Samuel, for Saul, the man of God for Jerdboam, 1 Kn. 13. But why seek [????] examples? We have a commandment to pray for such as have sinned not unto death, and a promise to procure mercy for them, 1 Jn. 5:16, and a complaint of God when this is not performed, Eze. 22:30. Prayers made for the wicked are many times without fruit. If they be without fruit, though they be to them idle, yet not to thee: Thy prayer shall return into thine own bosom, Ps. 35:13, according to that, Mt. 10:13, ‘When ye come into an house, salute it, or wish peace unto it: if the house be worthy, let your peace come upon it; but if it be not worthy, let your peace return to you.’ As for those that be our enemies, though the Schoolmen teach that we are not, or at least need not, specially to pray for them, yet our Savior Christ has commanded us to love our enemies, to bless them that curse us and to pray for them who despitefully use us and persecute us. So Jer. 29:7; Rom. 12:14. And this was practiced by our Savior, Lk. 13:34, by Stephen — George Downame, A Godly &amp; Learned Treatise of Prayer... (Cambridge: 1640), ch. 32, ‘Distinctions of Prayer in regard of the Object,’, pp. 186-87">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+faithless+are+the+enemies+of+God+and+some+of+them+the+enemies+of+our+Church+and+country%2C+and+some+enemies+to+ourselves%3B+and+shall+we+pray+for+such%3F+Although+now+they+be+the+enemies+of+God%2C+yet+hereafter+they+may+become+friends+and+be+reconciled+unto+Him%3A+whereof+our+prayer+may+be+a+means%3A+And+therefore+howsoever+we+are+to+pray+against+their+wicked+practices%2C+we+are+to+pray+for+their+persons%2C+that+they+of+enemies+may+become+friends%3B+of+infidels%2C+faithful%3B+of+heretics+and+schismatics%2C+sound+Christians%3B+of+wicked+and+profane%2C+religious+and+holy%3A+%E2%80%98for+this+is+good+and+acceptable+in+the+sight+of+God+our+Savior%2C+who+wills+that+all+men+should+be+saved+and+come+unto+the+knowledge+of+the+truth.%E2%80%99+%281+Tim.+2%3A4%29+Examples+of+them+who+have+prayed+for+the+wicked+are+very+many+in+the+Word+of+God%3A+As+of+Abraham%2C+for+the+Sodomites%2C+Gen.+18%2C+Moses%2C+for+the+rebellious+Israelites%2C+Ex.+32%2C+yea%2C+for+Pharaoh+and+the+Egyptians%3B+Samuel%2C+for+Saul%2C+the+man+of+God+for+Jerdboam%2C+1+Kn.+13.+But+why+seek+%5B%3F%3F%3F%3F%5D+examples%3F+We+have+a+commandment+to+pray+for+such+as+have+sinned+not+unto+death%2C+and+a+promise+to+procure+mercy+for+them%2C+1+Jn.+5%3A16%2C+and+a+complaint+of+God+when+this+is+not+performed%2C+Eze.+22%3A30.+Prayers+made+for+the+wicked+are+many+times+without+fruit.+If+they+be+without+fruit%2C+though+they+be+to+them+idle%2C+yet+not+to+thee%3A+Thy+prayer+shall+return+into+thine+own+bosom%2C+Ps.+35%3A13%2C+according+to+that%2C+Mt.+10%3A13%2C+%E2%80%98When+ye+come+into+an+house%2C+salute+it%2C+or+wish+peace+unto+it%3A+if+the+house+be+worthy%2C+let+your+peace+come+upon+it%3B+but+if+it+be+not+worthy%2C+let+your+peace+return+to+you.%E2%80%99+As+for+those+that+be+our+enemies%2C+thou <blockquote><p>The reasons are: (1) “The wages of sin is death” (Rom. 6:23) and “the soul that sinneth, it shall die” (Ezk. 18:20). These deal not with any sin in particular, but with sin in general. Thus either venial sin is not sin or it deserves death and so is not venial. Second, the terrible formula of the law proves this: “Cursed be he that confirmeth not all the words of this law to do them” (Dt. 27:26; Gal. 3:10). If every deviation from the law deserves a curse and every sin is illegality, no sin can be granted (even the smallest) which does not bring upon it the curse.</p></blockquote>

<blockquote><p>‘the first day’ …This first day consisting of twenty four hours had (as some think) for the first half of it the precedent [preceeding] darkness, and for the other the light newly created: the night they take to be meant by evening, a part of it, and the day by the morning which is part of it also: and according to this the Sabbath (being as large a day as any of the rest, and so containing twenty four hours) is measured from even to even, Lev. 23:32; the Romans and other Western nations reckon the twenty four hours from mid-night to mid-night; the Egyptians contrariwise from mid-day to mid-day. Yet it may be with good probability thought that at the first (according to the Chaldean account, which is quite contrary to that of the Jews’ forecited, measuring the day from sunrising to sunrising) the day natural began with the light: for even is the declining light of the foregoing day; and the morning may as well be called the end of the night past, as the beginning of the day following: and so diverse of the learned by the evening understand the day, as the end thereof; and by morning the night, at which time it is at an end: for denominations are many times taken from the end, because thereby the thing is made complete: so the whole week is called by the name Sabbath, Lev. 23:15 &amp; Mt. 18:12, because with it the week is wholly made up and fully finished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the books of the Old &amp; New Testament</cite>, (London: Legatt, 1645), On Genesis | on Gen., 1:5</span></figcaption>

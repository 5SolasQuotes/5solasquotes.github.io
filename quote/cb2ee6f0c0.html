<main class="wrap"><figure class="quote" id="q-cb2ee6f0c0" data-kw="">
<blockquote><p>Q. 2. How doth it appear that there is a God? A. The very light of nature in man, and the works of God, declare plainly that there is a God;[c] but his word and Spirit only do sufficiently and effectually reveal Him unto men for their salvation.[d] [c] Rom. 1:19,20. Ps. 19:1-3. Acts 17:28. [d] 1 Cor. 2:9. 2 Tim. 3:15-17. Isa. 59:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7250e55d25" data-kw="">
<blockquote><p>19. Not meddling with ministers subscribing, declaring, swearing, nor with the discipline, by-offices, baptizing as by our sort of godfathers’ covenanting without the parents, crossing and undue application of words at burial and such like, I know nothing in the common [Anglican] Lord’s-Day worship [1661] spoken in the name of the Church which a godly Christian may not join in with the exercise of the spirit of prayer with faith and comfort,¹ if prejudice and false apprehensions of it affright him not or put not his soul out of relish with it. (As on the other side: prejudice distastes many too much with the faulty methods and words of many men’s extemporate prayers.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Anglican Liturgy: Tolerable</span></figcaption>

</figure><figure class="quote" id="q-44dd3dab1e" data-kw="">
<blockquote><p>21. It is great self-condemnation in them that cannot bear to be censured, nor scarce be contradicted, yet thus to censure almost all the Church.

22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some.

23. So great is God’s mercy to this land in yet giving many godly able ministers to the public churches that it is sinful ingratitude to overlook or deny it, though many others be never so bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Character Faults</span></figcaption>

</figure><figure class="quote" id="q-79cbcf5e8e" data-kw="">
<blockquote><p>The non-conformist, non-separatist, puritan minister authors of this book: …were examples of holiness, so in this, that they have ever, not only forborne, but steadfastly opposed to their great reproach, damage and danger many ways, the corruptions in our [Anglican] Church government, worship and liturgy, and have been lights and leaders to these latter times therein, yet always in a peaceable and regular way, as not on the one side to subject themselves to suspicious inventions, so on the other, not sinfully to separate from the communion and true worship of churches, accounting it more agreeable to all rules of piety, charity and Christian prudence to tolerate for the time what they could not mend rather than to rent and tear all in pieces to an utter ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Publisher, William Rathband, to the Reader” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; 1644; RBO, 2025), p.</span></figcaption>

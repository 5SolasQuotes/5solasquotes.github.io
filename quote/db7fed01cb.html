<blockquote><p>TO WHAT USE BAPTISM WAS USED.

First, to be a sure seal and an evident testimony unto us that God the Father for his Son Jesus Christ’s sake hath freely forgiven us all our sins, received us into his favour, and given us the Holy Ghost; by whom we are born anew, not of mortal, but of immortal seed; by whom also we are made the sons and heirs of God, and through faith reckoned pure and holy in his godly sight. …

Secondly, to put us in remembrance that, forasmuch as we are become the soldiers of Christ, we ought, so long as we live, valiantly to fight against the devil, the world, and the flesh, to mortify all unclean lusts, to die unto sin, and to rise again new men, bearing the image of Christ, and fashioning our conversation and manners after his example, that we may learn the Lord our God in such holiness and righteousness as is allowed before him all the days of our life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), p. 508.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

ed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-78c624f8d1" data-kw="">
<blockquote><p>Our Lord’s welcome to children, pronounced in the days of his flesh, implies their membership, “Suffer the little children to come unto me, … for of such is the kingdom of God.” [Mark 10:14] The “kingdom of God” here evidently means the visible Church; and the Saviour expressly declares that infants belong to the Church, and are numbered with his disciples. When it is said “of such,” &amp;c., it cannot merely mean that persons of a childlike disposition compose the kingdom of God, for this would assign no proper reason why infants should be brought to Christ, nor for our Lord’s being displeased with the disciples for seeking to hinder their approach.

If infants are thus declared by our Lord to belong to his Church, then there is certainly no proper reason why they may not be formally and solemnly declared such by baptism. Besides, it cannot be affirmed that they may not have been baptized on this occasion. Our Lord baptized not, but his disciples; and by laying his hands on them, and blessing them, He as solemnly received them as they could have been by the external rite which denotes the conveyance of spiritual blessings. In his discourse to Nicodemus, our Lord declares that none enter his kingdom but such as are born of water, &amp;c.; and the expression being generally understood to contain an allusion to baptism by water, they are excluded from the kingdom of God. Devoid of membership in the Church here, they are cut off from the hopes of eternal salvation – a conclusion this from which, although avowed by some Baptist writers, the pious mind recoils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A practical treatise on Christian baptism</cite>, (1853) in Works: doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), iii, 73-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-1946aa0d79" data-kw="">
<blockquote><p>But if anyone either on the testimony of the church, or parents, or witnesses, or of others cannot be sure about the baptism that he had received in infancy, or if it happened that he was moistened by no other baptism than that of the midwives or private individuals, we are of the opinion that such a man may be baptized without any scruple. For the baptism applied by the last-mentioned people is not baptism at all, and the baptism of the first mentioned people is worthless, as the Council of Carthage [AD 418] has rightly decided (5.3): ‘Concerning infants it has been decided that whenever no very certain witnesses are found who testify without a doubt that they were baptized, and whenever they themselves are not, on account of their age, in a position to give an answer about the sacraments that were given to them, they should be baptized without any scruple, lest that doubt should cause them to be bereft of the cleansing of the sacraments.’ For as Leo [AD 400-461] rightly added, ‘what is not known to have been done cannot be said to have been repeated.’ And consequently we should not approve of a conditional baptism that the papal teachers are used to observing in such cases, according to this formula: ‘If you have not been baptized, then I baptize you.’ For a baptism of this kind lacks any precedent in Scripture and changes the form for baptism that Christ had taught, and it also leaves the one who has been baptized in doubt as to which baptism is the real one–which goes against the purpose of baptism that does not make the promises of God ambiguous but establishes and seals them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (1625; Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 55-56, pp. 169-71</span></figcaption>

</figure><figure class="quote" id="q-29e4908f08" data-kw="">
<blockquote><p>…we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise, why is a confession of faith required of adults before thy are baptized? We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them. …We count as nonsense his assertion that children are holy–that is, in the outward company of the church–before their baptism. For the opposite is true: those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain and Simple Treatise on the Lord’s Supper</cite>, (1559, RHB, 2016), p. 146-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

suppose%20that%20our,company%20of%20the%20church%20through%20baptism&amp;text=we%20do%20not%20suppose%20that%20our%20salvation%20depends&amp;text=the%20outward%20company%20of%20the%20church%20through%20baptism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For we do not see it necessary to posit, or even possible to posit, actual faith in those infants (which some conjecture, others strongly assert), unless it is solidly proved from Scripture. For that extraordinary and miraculous motion of John the Baptist, Lk. 1:44, seems to contribute nothing to this matter. Since from a miracle no consequence is valid to the ordinary force, causality, disposition, act, or effect of any thing.</p></blockquote>

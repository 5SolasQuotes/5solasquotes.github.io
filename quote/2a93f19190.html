</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b2bfcd600" data-kw="">
<blockquote><p>It is a radical [root] principle of our system ‘that a larger part of the Church, or a representation of it, should govern a smaller, or determine matters of controversy which arise therein.’… This is of the essence of Presbyterianism. It is involved in the declaration that the Church is to be governed not only by congregational and presbyterial, but also by synodical assemblies; and more expressly in the declaration that synods have authority ‘to redress whatever has been done by presbyteries contrary to order.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, a. ‘Appeals in Cases Not Judicial’, pp. 479-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-84cb6de44d" data-kw="">
<blockquote><p>For as we must give obedience to the Scriptures, whether they speak as we would have them, or whether they speak not as we would have them: so in a reformed Church where a private man does dwell, if any thing be commanded by authority, either agreeing or not agreeing to our affections, yet if the same be agreeable to the Word of God, we must yield obedience unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London: 1618), on Num. 26:57-61, p. 1,118</span></figcaption>

</figure><figure class="quote" id="q-eab22231a6" data-kw="">
<blockquote><p>The protesters [against mandated subscription] were led by Jonathan Dickinson (1688–1747)… Dickinson shows that he is well acquatined with the debates elsewhere [such as in Ireland]… Notably Dickinson sees it [presbyterianism] not as divinely mandated, but the best of many imperfect options. While acknowledging the usefulness of confessions…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

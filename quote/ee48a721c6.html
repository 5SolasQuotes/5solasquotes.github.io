<main class="wrap"><figure class="quote" id="q-ee48a721c6" data-kw="unity">
<blockquote><p>From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.5</span></figcaption>

<blockquote><p>(4) The nature of the things, for since they were still future and prophecies before their fulfillment are wont to be somewhat obscure (at least as to the manner of fulfillment), it is not to be wondered at that at first they were set forth more obscurely and then more clearly, the nearer the time of fulfillment approached. Thus the light increased more and more. There was a progress in revelation: prophet handed on to prophet, and he received the lamp of the gospel by which the church might be illuminated, adding a new measure of light. The same promises are repeated and illustrated. The more the time of fulfillment presses on, the clearer and fuller they become. Before the law given by Moses, the promise was somewhat obscure; from the giving of the law until the times of the prophets less obscure; from the times of the prophets until John the Baptist, clearer; after the preaching of John clear; after the coming of Christ most clear. Thus from the beginning, the Messiah was promised only as the seed of the woman (Gen. 3:15); afterwards as the son of Abraham (Gen. 12:2); to spring fr</p></blockquote>

<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>

<blockquote><p>Third, if the covenant be viewed in relation to the first sanction in Christ, it has no previous condition, but rests upon the grace of God and the merit of Christ alone. But if it is considered in relation to its acceptance and application to the believer, it has faith as a condition (uniting man to Christ and so bringing him into the fellowship of the covenant). If, however, in relation to its consummation with faith (obedience and the desire of holiness), it has the relation of condition and means because without them no one shall see God. Source of explanation.</p></blockquote>

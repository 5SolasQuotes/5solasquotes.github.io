<main class="wrap"><figure class="quote" id="q-6c5e800952" data-kw="">
<blockquote><p>Let all our divisions be with the enemy; among ourselves let the bond of brotherly union continue and increase. All that are for God, and the welfare of the kingdoms in the three nations, are united together by the covenant and band of God [the Solemn League and Covenant]. All ages shall call them cursed, who for imaginable advantage, private or public, shall labour to put asunder what God has conjoined. The greatest advantages cannot make up the loss which unavoidably will follow upon such a breach […] that man is greatest, who with the greatest sedulity employs himself to cast water on every beginning, on every least appearance of any division which Satan may be working in the Parliament, in the Assembly, in the city, in the army, and, above all, between these covenanted nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Errors &amp; induration are the great sins &amp; the great judgments of the time. Preached in a sermon before the Right Honourable House of Peers, in the Abbey-Church at Westminster, July 30, 1645, the day of the Monthly Fast in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-7593d8dc08" data-kw="">
<blockquote><p>Though I differ from my reverend Brethren who have taken the oaths, yet I look upon myself as obliged to receive their testimony concerning the principles they adhere to; and few of them I know do approve the incorporating Union, and far less do any of them approve Erastian prelacy, supremacy and the English-Popish ceremonies. I owe them the charity or justice to believe that they sincerely disown these evils. Touching strainings for extracting perjury, scandal, error, heresy, and other such abominable crimes, from the different sentiments and practices of ministers, who otherwise are one in principle; such measures, I say, tend natively to confound all Christian societies, and are, amongst the inventions of Satan, mostly reserved till these last and perilous days, wherein our lot is fallen. No sound divine, nor any other fair antagonist (for what I know did ever charge his adversary with controverted consequences, as his direct and received opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

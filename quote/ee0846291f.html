<main class="wrap"><figure class="quote" id="q-ee0846291f" data-kw="">
<blockquote><p>He studies not the Scripture as he should, which studies not providence as he should; we should compare Gods promises and providences together. What we hear of him in his Word, with what we see in his Works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, London, 1654, bk. 3, ch. 9, “Of God’s Providence,” p. 301</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f87d7ae16e" data-kw="Permission Author of sin">
<blockquote><p>As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/permission-of-sin.html">Permission of sin</a></span></div>

</figure><figure class="quote" id="q-8a099d7ada" data-kw="Sovereignty Free Will">
<blockquote><p>God brings about every man&#x27;s lot, and all the parts of it. He sits at the helm of human affairs, and turns them about in whatever way he lists. &quot;Whatever the Lord pleased, that He did in heaven and in earth, in the seas and all deep places.&quot; There is not anything whatever befalls us without his overruling hand. The same providence that brought us out of the womb, brings us to, and fixes us in the condition and place allotted for us, by him who &quot;has determined the times and the bounds of our habitation.&quot; It overrules the smallest and most casual things about us, such as &quot;hairs of our head being all numbered;&quot; a &quot;lot cast into the lap.&quot; Yea, the free acts of our will, by which we choose for ourselves: for even &quot;the king&#x27;s heart is in the hand of the Lord, as rivers of water.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, head II (the crook is of God&#x27;s making)</span></figcaption>

</figure><figure class="quote" id="q-2ebb74f215" data-kw="Sovereignty">
<blockquote><p>Nothing befalls you, good or evil, but there is a providence of the infinite eternal first Being in that thing; and therein is God&#x27;s infiniteness, that it reaches to the least things, to the least worm that is under your feet.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (universality of providence)</span></figcaption>

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e2f2c4ad9c" data-kw="">
<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified.

2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite>, (1644), ch. 13, ‘On Justification’, p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf516bf9b6" data-kw="">
<blockquote><p>In the text [of Rom. 3:23-26] we have the eight following things:

1. The persons justified – (i) Sinners; (ii) Such sinners of all sorts that shall believe, whether Jews or Gentiles.

2. The justifier, or efficient cause – God.

3. The impulsive cause – grace.

4. The means effecting, or material cause – the redemption of Christ.

5. The formal cause – the remission of sins.

6. The instrumental cause – faith.

7. The time of declaring – the present time.

8. The end – that God may appear just.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification Open &amp; Applied’, on Rom. 3:23-26 appended to The Gospel Mystery of Sanctification</cite>, … (London: Parkhurst, 1692) 31 pp.</span></figcaption>

</figure><figure class="quote" id="q-0302ebf39b" data-kw="">
<blockquote><p>When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. When we say by faith only, this opposes all other graces of the same order, but not the merits of Christ or the efficacy of God’s grace; the apostle, Rom. 4, makes it all one to prove a man justified by grace, Christ and by faith. It is to be considered as alone in the act of justification, but not in the subject justified; therefore that is a reproach cast on Protestants to call them Solifidians.</p></blockquote>

</figure><figure class="quote" id="q-0b03df12ae" data-kw="">
<blockquote><p>23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted.

24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (Baker, 1997), ch. 27, ‘Justification’, p. 163</span></figcaption>

</figure><figure class="quote" id="q-2e9a0f1074" data-kw="">
<blockquote><p>We constantly want to justify ourselves before God, to be good enough without Christ. But God does not want us to trust in our goodness. He does not want us to make up for our past sins through present obedience. He does not want us to think that we are good enough to go to heaven by comparing ourselves to the Hitlers and Stalins of the world. Comparisons are useless when it comes to establishing righteousness before God. God crucified His one and only Son for our justification, and He wants us to trust in Him alone. When it comes to being justified, faith plus anything else is quicksand. The only ground for right standing before God is Christ Jesus grabbed ahold of by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-harvey.html">Jay Harvey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Don’t Call it a Comeback</cite>, p. 101</span></figcaption>

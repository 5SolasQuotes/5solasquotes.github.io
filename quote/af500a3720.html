<blockquote><p>But there are certain things to which even natural reason can attain, for instance, that God is, that God is one, and others like these, which even the philosophers, being guided by the light of natural reason, proved demonstratively about God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

— Thomas Aquinas, Summa Contra Gentiles, bk. 1, ch. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+there+are+certain+things+to+which+even+natural+reason+can+attain%2C+for+instance%2C+that+God+is%2C+that+God+is+one%2C+and+others+like+these%2C+which+even+the+philosophers%2C+being+guided+by+the+light+of+natural+reason%2C+proved+demonstratively+about+God.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa+Contra+Gentiles%2C+bk.+1%2C+ch.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf500a3720.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af500a3720.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=But%20there%20are%20certain%20things%20to,natural%20reason%2C%20proved%20demonstratively%20about%20God&amp;text=But%20there%20are%20certain%20things%20to%20which%20even&amp;text=light%20of%20natural%20reason%2C%20proved%20demonstratively%20about%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c121588950" data-kw="">
<blockquote><p>In his Proslogion, Anselm switches to Boethius’ axiom [from Augustine’s], and suggests filling out the concept of God by many arguments of this form: (10) Nothing greater than God is conceivable. (11) If God is not F, something greater than God is conceivable. (12) So God is F.” – Leftow, ‘3. Perfect-being theology’ Anselm: “…this very fool, when he hears of this being of which I speak–a being than which nothing greater can be conceived–understands what he hears, and what he understands is in his understanding; although he does not understand it to exist. For it is one thing for an object to be in the understanding, and another to understand that the object exists… And assuredly that, than which nothing greater can be conceived, cannot exist in the understanding alone. For, suppose it exists in the understanding alone: then it can be conceived to exist in reality; which is greater. Therefore, if that, than which nothing greater can be conceived, exists in the understanding alone, the very being, than which nothing greater can be conceived, is one, than which a greater can be conceived. But obviously this is impossible. Hence, there is no doubt that there exists a being, than which nothing greater can be conceived, and it exists both in the understanding and in reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), pp. 1-34, ch. 2, pp. 7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

<blockquote><p>[God] Must be infinitely perfect. Since man knows he is an imperfect being, he must suppose the perfections he wants [lacks] are seated in some other being, which has limited him, and upon which he depends. Whatsover we conceive of excellency or perfection must be in God; for we can conceive no perfection but what God has given us a power to conceive. And He that gave us power to conceive a transcendent perfection above whatsoever we saw or heard of, has much more in Himself, or else He could not give us such a conception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, (Edinburgh: Nichol, 1864), p. 151</span></figcaption>

</figure><figure class="quote" id="q-2a8ade0fe4" data-kw="">
<blockquote><p>And it assuredly exists so truly, that it cannot be conceived not to exist. For it is possible to conceive of a being which cannot be conceived not to exist; and this is greater than one which can be conceived not to exist… There is, then, so truly a being than which nothing greater can be conceived to exist, that it cannot even be conceived not to exist; and this being thou art, O Lord, our God… For, if a mind could conceive of a being better than thee, the creature would rise about the Creator; and this is most absurd. And, indeed, whatever else there is, except thee alone, can be conceived not to exist. To thee alone, therefore, it belongs to exist more truly than all other beings, and hence in a higher degree than all others. For, whatever else exists does not exist so truly, and hence in a less degree it belongs to it to exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), pp. 1-34, ch. 3, pp. 8-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

it%20to%20exist" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26a3d50a53" data-kw="">
<blockquote><p>Conviction [of atheists] involves assertion and confutation. Here only the method or titles and classes of arguments of the former are to be indicated. Leaving all others aside, I will exhibit here only those of [Marin] Mersenne [d. 1648, a Romanist] (who embraces all): One is that all creatures in some way affirm the existence of deity;

2. That all men have that thought;

3. Because it is necessary that something be from itself;

4. From the eternity of truth;

5. From the best entity and goodness;

6. From the axiom ‘Whatever has the power of moving has it from another’;

7. From the grades of beings;

8. Because God is the light manifesting the rest, and it is known through itself that God exists;

9. Because a creature is a being produced by another from nothing;

10. From the beauty of each creature;

11. From the immutable natural law;

12. From our appetite [desire for something greater, best and satisfying];

13. From the concord of dissonant things;

14. From the government of things;

15. From metaphysical science, its object, etc.;

16. From arithmetic and algebra, namely from the monad, the principle of number, and other admirable things of numbers;

17. From geometry, namely from the abstruse and admirable things of figures and dimensions;

18. From music, where he discusses the harmony of the macrocosm and microcosm and the comparison of mundane music with human;

19. From astrology, namely from the ordered revolution of the stars, especially the swiftness of the diurnal motion from east to west;

20. From mechanics, especially the crane which lifts the greatest weight by the least force;

21. From any sciences and arts;

22. From other inferior sciences;

23. From all species of divinations;

24. From the six determinations of things which are indeterminate by their own nature–they are of (1) quantity, (2) disposition and parts, (3) duration, (4) figure, (5) multitude of individuals and species, (6) intension of grades, and existence;

25. From moral matters;

26. From all artifacts and from the stars;

27. From the collection of all beings;

28. From geography and hydrography;

29. From poverty, from the diversity of faces, voice, writing, states, gaits;

30. From the end to which all things tend;

31. From this, that an object ought to be assigned which can terminate and satiate our love;

32. From various absurdities and disadvantages and from the advantages which follow from the opposite or varying opinion;

33. From optics;

34. From gnomonics [using dials];

35. From architecture;

36. From nautical science. And this is a most diffuse assertion. Its confutation occupied in the solution and attack of atheistic exceptions, twenty-six in number, I do not exhibit here because the reason of the theses does not bear refuting them. Let Mersenne himself be consulted, p. 234, and Valesius, Mornay, and others cited above in part 1. You have the marrow of them in Mornay and those who defend the Providence of God. In the course and repetition of the common topics which we complete in this Academy about every year and a half, we have hitherto set forth those classes of arguments to our students and to the best of our ability deduced and defended them. The arguments [against atheists] are either intrinsic or extrinsic. The former are more as if a priori [from first things] or more a posteriori [from things following]. The former are drawn from certain principles and axioms of the light of nature:

1. There is not given an infinite regress in causes;

2. Nothing is from itself, or nothing is the cause of itself;

3. Whatever is moved is moved by another, and so finally one must come to an unmoved mover;

4. In order there is something first. The latter arguments are drawn:

1. From the adornment, perfection, order, actions, powers of the creatures or universe, Ps. 8 &amp; 19; Isa. 40; Rom. 1;

2. From the intellectual nature of angels, devils and their appearances, operations, ἐνεργήματα;

3. From man, the microcosm, considered both in his nature and essential, integral parts, etc., and in the symbiotic, economic, political, ecclesiastical, scholastic order, with the changes and rewards and punishments in this life: Ps. 8 collated with Isa. 40 and the Ecclesiastes of Solomon;

4. From miracles and prophecies, Isa. 64. The extrinsic arguments or testimonies are:

1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions;

2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian. But if anyone having been advised persists in playing the fool and involving himself and the truth in mere begging of the question or obscure or uncertain consequences, such as [Descartes’s] ‘I think, therefore I am’, and ‘That of which the idea is in me, that very thing, etc.’–skepticism having first been inducted and all natural, innate and acquired knowledge having been erased or sequestered by doubt, and also all principles and demonstrations hitherto customary to all of Christendom, and indeed agreeably to the Scriptures, having been denied and snatched away, certainly to those proud betrayers or corrupters of the cause it must be suggested what Tertullian said, “Evidently the truth was waiting to be liberated by the Valentinians and Marcionites.” To the same men and their favorers all students and masters of all sciences, especially of theology, could say, “Render the legions. For easy is the descent to Avernus, but to retrace one’s steps, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1, pp. 206-9 Latin</span></figcaption>

24. From the six determinations of things which are indeterminate by their own nature–they are of (1) quantity, (2) disposition and parts, (3) duration, (4) figure, (5) multitude of individuals and species, (6) intension of grades, and existence;

25. From moral matters;

26. From all artifacts and from the stars;

27. From the collection of all beings;

28. From geography and hydrography;

29. From poverty, from the diversity of faces, voice, writing, states, gaits;

30. From the end to which all things tend;

31. From this, that an object ought to be assigned which can terminate and satiate our love;

32. From various absurdities and disadvantages and from the advantages which follow from the opposite or varying opinion;

33. From optics;

34. From gnomonics [using dials];

35. From architecture;

36. From nautical science. And this is a most diffuse assertion. Its confutation occupied in the solution and attack of atheistic exceptions, twenty-six in number, I do not exhibit here because the reason of the theses does not bear refuting them. Let Mersenne himself be consulted, p. 234, and Valesius, Mornay, and others cited above in part 1. You have the marrow of them in Mornay and those who defend the Providence of God. In the course and repetition of the common topics which we complete in this Academy about every year and a half, we have hitherto set forth those classes of arguments to our students and to the best of our ability deduced and defended them. The arguments [against atheists] are either intrinsic or extrinsic. The former are more as if a priori [from first things] or more a posteriori [from things following]. The former are drawn from certain principles and axioms of the light of nature:

1. There is not given an infinite regress in causes;

2. Nothing is from itself, or nothing is the cause of itself;

3. Whatever is moved is moved by another, and so finally one must come to an unmoved mover;

4. In order there is something first. The latter arguments are drawn:

1. From the adornment, perfection, order, actions, powers of the creatures or universe, Ps. 8 &amp; 19; Isa. 40; Rom. 1;

2. From the intellectual nature of angels, devils and their appearances, operations, ἐνεργήματα;

3. From man, the microcosm, considered both in his nature and essential, integral parts, etc., and in the symbiotic, economic, political, ecclesiastical, scholastic order, with the changes and rewards and punishments in this life: Ps. 8 collated with Isa. 40 and the Ecclesiastes of Solomon;

4. From miracles and prophecies, Isa. 64. The extrinsic arguments or testimonies are:

1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions;

2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian. But if anyone having been advised persists in playing the fool and involving himself and the truth in mere begging of the question or obscure or uncertain consequences, such as [Descartes’s] ‘I think, therefore I am’, and ‘That of which the idea is in me, that very thing, etc.’–skepticism having first been inducted and all natural, innate and acquired knowledge having been erased or sequestered by doubt, and also all principles and demonstrations hitherto customary to all of Christendom, and indeed agreeably to the Scriptures, having been denied and snatched away, certainly to those proud betrayers or corrupters of the cause it must be suggested what Tertullian said, “Evidently the truth was waiting to be liberated by the Valentinians and Marcionites.” To the same men and their favorers all students and masters of all sciences, especially of theology, could say, “Render the legions. For easy is the descent to Avernus, but to retrace one’s steps, etc.”

— Gisbertus Voetius, Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1, pp. 206-9 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConviction+%5Bof+atheists%5D+involves+assertion+and+confutation.+Here+only+the+method+or+titles+and+classes+of+arguments+of+the+former+are+to+be+indicated.+Leaving+all+others+aside%2C+I+will+exhibit+here+only+those+of+%5BMarin%5D+Mersenne+%5Bd.+1648%2C+a+Romanist%5D+%28who+embraces+all%29%3A+One+is+that+all+creatures+in+some+way+affirm+the+existence+of+deity%3B+2.+That+all+men+have+that+thought%3B+3.+Because+it+is+necessary+that+something+be+from+itself%3B+4.+From+the+eternity+of+truth%3B+5.+From+the+best+entity+and+goodness%3B+6.+From+the+axiom+%E2%80%98Whatever+has+the+power+of+moving+has+it+from+another%E2%80%99%3B+7.+From+the+grades+of+beings%3B+8.+Because+God+is+the+light+manifesting+the+rest%2C+and+it+is+known+through+itself+that+God+exists%3B+9.+Because+a+creature+is+a+being+produced+by+another+from+nothing%3B+10.+From+the+beauty+of+each+creature%3B+11.+From+the+immutable+natural+law%3B+12.+From+our+appetite+%5Bdesire+for+something+greater%2C+best+and+satisfying%5D%3B+13.+From+the+concord+of+dissonant+things%3B+14.+From+the+government+of+things%3B+15.+From+metaphysical+science%2C+its+object%2C+etc.%3B+16.+From+arithmetic+and+algebra%2C+namely+from+the+monad%2C+the+principle+of+number%2C+and+other+admirable+things+of+numbers%3B+17.+From+geometry%2C+namely+from+the+abstruse+and+admirable+things+of+figures+and+dimensions%3B+18.+From+music%2C+where+he+discusses+the+harmony+of+the+macrocosm+and+microcosm+and+the+comparison+of+mundane+music+with+human%3B+19.+From+astrology%2C+namely+from+the+ordered+revolution+of+the+stars%2C+especially+the+swiftness+of+the+diurnal+motion+from+east+to+west%3B+20.+From+mechanics%2C+especially+the+crane+which+lifts+the+greatest+weight+by+the+least+force%3B+21.+From+any+sciences+and+arts%3B+22.+From+other+inferior+sciences%3B+23.+From+all+species+of+divinations%3B+24.+From+the+six+determinations+of+things+which+are+indeterminate+by+their+own+nature%E2%80%93they+are+of+%281%29+quantity%2C+%282%29+disposition+and+parts%2C+%283%29+duration%2C+%284%29+figure%2C+%285%29+multitude+of+individuals+and+species%2C+%286%29+intension+of+grades%2C+and+existence%3B+25.+From+moral+matters%3B+26.+From+all+artifacts+and+from+the+stars%3B+27.+From+the+collection+of+all+beings%3B+28.+From+geography+and+hydrography%3B+29.+From+poverty%2C+from+the+diversity+of+faces%2C+voice%2C+writing%2C+states%2C+gaits%3B+30.+From+the+end+to+which+all+things+tend%3B+31.+From+this%2C+that+an+object+ought+to+be+assigned+which+can+terminate+and+satiate+our+love%3B+32.+From+various+absurdities+and+disadvantages+and+from+the+advantages+which+follow+from+the+opposite+or+varying+opinion%3B+33.+From+optics%3B+34.+From+gnomonics+%5Busing+dials%5D%3B+35.+From+architecture%3B+36.+From+nautical+science.+And+this+is+a+most+diffuse+assertion.+Its+confutation+occupied+in+the+solution+and+attack+of+atheistic+exceptions%2C+twenty-six+in+number%2C+I+do+not+exhibit+here+because+the+reason+of+the+theses+does+not+bear+refuting+them.+Let+Mersenne+himself+be+consulted%2C+p.+234%2C+and+Valesius%2C+Mornay%2C+and+others+cited+above+in+part+1.+You+have+the+marrow+of+them+in+Mornay+and+those+who+defend+the+Providence+of+God.+In+the+course+and+repetition+of+the+common+topics+which+we+complete+in+this+Academy+about+every+year+and+a+half%2C+we+have+hitherto+set+forth+those+classes+of+arguments+to+our+students+and+to+the+best+of+our+ability+deduced+and+defended+them.+The+arguments+%5Bagainst+atheists%5D+are+either+intrinsic+or+extrinsic.+The+former+are+more+as+if+a+priori+%5Bfrom+first+things%5D+or+more+a+posteriori+%5Bfrom+things+following%5D.+The+former+are+drawn+from+certain+principles+and+axioms+of+the+light+of+nature%3A+1.+There+is+not+given+an+infinite+regress+in+causes%3B+2.+Nothing+is+from+itself%2C+or+nothing+is+the+cause+of+itself%3B+3.+Whatever+is+moved+is+moved+by+another%2C+and+so+finally+one+must+come+to+an+unmoved+mover%3B+4.+In+order+there+is+something+first.+The+latter+arguments+are+drawn%3A+1.+From+the+adornment%2C+perfection%2C+order%2C+actions%2C+powers+of+the+creatures+or+universe%2C+Ps.+8+%26+19%3B+Isa.+40%3B+Rom.+1%3B+2.+From+the+intellectual+nature+of+angels%2C+devils+and+their+appearances%2C+operations%2C+%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%AE%CE%BC%CE%B1%CF%84%CE%B1%3B+3.+From+man%2C+the+microcosm%2C+considered+both+in+his+nature+and+essential%2C+integral+parts%2C+etc.%2C+and+in+the+symbiotic%2C+economic%2C+political%2C+ecclesiastical%2C+scholastic+order%2C+with+the+changes+and+rewards+and+punishments+in+this+life%3A+Ps.+8+collated+with+Isa.+40+and+the+Ecclesiastes+of+Solomon%3B+4.+From+miracles+and+prophecies%2C+Isa.+64.+The+extrinsic+arguments+or+testimonies+are%3A+1.+Internal%2C+of+synteresis+and+conscience%2C+Rom.+2%2C+and+here+about+the+common+notions%3B+2.+External%2C+the+consensus+of+all+nations%2C+and+the+doctrine+of+all+sages.+But+with+all+reasons+having+been+subtracted+and+repeated+thoughts+more+often+recurring%2C+we+have+found+that+the+order+both+of+nature+and+of+our+better+knowledge+is+rather+to+be+observed+and+more+safely+served+in+this+way%2C+that+the+demonstration+from+effects+to+cause%2C+from+works+to+maker+and+governor%2C+be+put+first+as+preeminent+and+universal%2C+which+embraces+all+others+in+itself+since+indeed+all+others+depend+on+it+and+are+derived+from+it%2C+and+all+presuppose+it.+For+no+one+doubts+that+the+law+of+nature+and+of+implanted+common+notion%2C+and+hence+the+acknowledgment+and+profession+of+deity%2C+in+addition+miracles%2C+prophecies+and+political+order%2C+are+to+be+referred+to+the+works+of+God.+As+for+those+axioms+about+causes%2C+about+motion%2C+about+order%2C+those+complex+principles+would+not+exist+unless+those+things+from+which+induction+and+finally+complex+theses+and+principles+arise+had+been+observed+in+the+works+of+God+or+creatures%3B+there+would+not+be+observation+nor+induction+about+and+from+creatures+unless+there+were+creatures.+But+that+this+method+is+safest%2C+most+expeditious%2C+and+most+evident%2C+the+doctrine+and+example+of+the+Holy+Spirit+persuade+Christians%2C+Rom.+1%2C+Ps.+19%2C+Acts+17%2C+Isa.+40%2C+etc.+To+accuse+Him+of+ignorance+or+pseudography+is+atheism+lurking+under+the+cloak+of+a+Christian.+But+if+anyone+having+been+advised+persists+in+playing+the+fool+and+involving+himself+and+the+truth+in+mere+begging+of+the+question+or+obscure+or+uncertain+consequences%2C+such+as+%5BDescartes%E2%80%99s%5D+%E2%80%98I+think%2C+therefore+I+am%E2%80%99%2C+and+%E2%80%98That+of+which+the+idea+is+in+me%2C+that+very+thing%2C+etc.%E2%80%99%E2%80%93skepticism+having+first+been+inducted+and+all+natural%2C+innate+and+acquired+knowledge+having+been+erased+or+sequestered+by+doubt%2C+and+also+all+principles+and+demonstrations+hitherto+customary+to+all+of+Christendom%2C+and+indeed+agreeably+to+the+Scriptures%2C+having+been+denied+and+snatched+away%2C+certainly+to+those+proud+betrayers+or+corrupters+of+the+cause+it+must+be+suggested+what+Tertullian+said%2C+%E2%80%9CEvidently+the+truth+was+waiting+to+be+liberated+by+the+Valentinians+and+Marcionites.%E2%80%9D+To+the+same+men+and+their+favorers+all+students+and+masters+of+all+sciences%2C+especially+of+theology%2C+could+say%2C+%E2%80%9CRender+the+legions.+For+easy+is+the+descent+to+Avernus%2C+but+to+retrace+one%E2%80%99s+steps%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1%2C+pp.+206-9+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26a3d50a53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26a3d50a53.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Conviction%20%5Bof%20atheists%5D%20involves%20assertion%20and,but%20to%20retrace%20one%E2

<main class="wrap"><figure class="quote" id="q-4738b8d808" data-kw="">
<blockquote><p>For as children ought to have the consent of their careful parents, and not to dare to bestow themselves without their advice, which practice we see in the very gentiles, as appeareth in Euripides, where Hermione answereth Orestes, desiring of her a promise of marriage (Eurip., in Andromacha): ‘Sponsaliorum meorum pater meus curam habebit, non est meum statuere hoc;’ That is: ‘It lyeth not in my hand at all myself for to contract: Unto my father’s care and power, I must refer that act:&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth Book of Moses, Called Numbers (London, 1618)</cite>, p. 1,257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-c50ef5a04d" data-kw="">
<blockquote><p>Further, if parents should be unwilling to allow the honorable vows of their children and proceed to abuse their power over them, they must be admonished and persuaded by a warning, prayers, and the urging first of relatives and friends, and secondly of the presbyters of the church. But if harsh parents should ignore all these, then the magistrates must interpose their authority, lest anyone by the wickedness of his parents be either kept from marriage longer than is fair or driven to a less acceptable marriage, provided that those who have such inhuman parents are not seeking to be joined with corrupt men of little honor and piety. There was a provision concerning such things even in Roman laws (Digest XXIII, 2, 19, 21, 22; Code V, 4, 12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 18, ‘Marriages should not be held valid which are contracted without the consent of those who have power over the ones who make the contract, or without suitable advisors’</cite>, pp. 323-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

%20V%2C%204%2C%2012&amp;text=Further%2C%20if%20parents%20should%20be%20unwilling%20to%20allow&amp;text=2%2C%2019%2C%2021%2C%2022%3B%20Code%20V%2C%204%2C%2012" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e2b34c605" data-kw="">
<blockquote><p>Question 18: What if a woman have a husband that will not suffer her to read the Scriptures, nor go to God’s worship, public or private, or that so beats or abuses her, as that it cannot be expected that human nature should be in such a case kept fit for any holy action: or if a man have a wife that will scold at him when he is praying or instructing his family, and make it impossible to him to serve God with freedom, or peace and comfort? Answer: The woman must (at necessary seasons, though not when she would) both read the Scriptures and worship God, and suffer patiently what is inflicted on her: Martyrdom may be as comfortably suffered from a husband as from a prince. But yet if neither her own love and duty, and patience, nor friends’ persuasion, nor the magistrate’s justice can free her from such inhumane cruelty, as quite disables her for her duty to God and man, I see not but she may depart from such a tyrant. But the man has more means to restrain his wife from beating him, or doing such intollerable things: either by the magistrate, or by denying her what else she might have, or by his own violent restraining her, as belongs to a conjugal ruler, and as circumstances shall direct a prudent man. But yet in case that unsuitableness or sin be so great, that after long trial, there is no likelihood of any other cohabitation but what will tend to their spiritual hurt and calamity, it is their lesser sin to live asunder by mutual consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’</cite>, p. 539</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-899ec16a4d" data-kw="">
<blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen.</cite>, 9:4</span></figcaption>

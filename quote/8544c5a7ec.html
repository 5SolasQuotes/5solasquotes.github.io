<main class="wrap"><figure class="quote" id="q-8544c5a7ec" data-kw="">
<blockquote><p>For those are anathematized who say that there are three Gods: because according to God’s true nature His substance does not admit a number of applications of the title, except as it is given to individual men and angels in recognition of their merit, though the substance of their nature and that of God is different. In that sense there are consequently many gods. Furthermore in the nature of God, God is one, yet in such a way that the Son also is God, because in Him there is not a different nature: and since He is God of God, both must be God, and since there is no difference of kind between them there is no distinction in their essence.

A number of titular Gods is rejected; because there is no diversity in the quality of the divine nature. Since therefore he is anathema who says there are many Gods and he is anathema who denies that the Son is God; it is fully shewn that the fact that each has one and the same name arises from the real character of the similar substance in each: since in confessing the Unborn God the Father, and the Only-begotten God the Son, with no dissimilarity of essence between them, each is called God, yet God must be believed and be declared to be one. …

Yet to prevent the declaration of one God seeming to affirm that God is a solitary monad without offspring of His own, it immediately condemns the rash suggestion that because God is one, therefore God the Father is one and solitary, having in Himself the name of Father and of Son: since in the Father who begets and the Son who comes to birth one God must be declared to exist on account of the substance of their nature being similar in each.

The faith of the saints knows nothing of the Son being incapable of birth: because the nature of the Son only draws its existence from birth. But the nature of the birth is in Him so perfect that He who was born of the substance of God is born also of His purpose and will. For from His will and purpose, not from the process of a corporeal nature, springs the absolute perfection of the essence of God born from the essence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 36-37 in Nicene and Post-Nicene Fathers 2, 9: 14.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8823651c54" data-kw="">
<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 13th Topic, Question 6, section 4, p. 311</span></figcaption>

</figure><figure class="quote" id="q-ffeea9e3e5" data-kw="undivided external works">
<blockquote><p>Although the external works are undivided and equally common to the single persons (both on the part of the principle and on the part of the accomplishment), yet they are distinguished by order and by terms. For the order of operating follows the order of subsisting. As therefore the Father is from himself, so he works from himself; as the Son is from the Father, so he works from the Father; as the Holy Spirit is from both, so he works from both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.27</span></figcaption>

</figure><figure class="quote" id="q-7f5f5d1455" data-kw="">
<blockquote><p>How can the Father send the Son, considering they are both one? Answer. In the doctrine touching the Trinity, nature and person must be distinguished. Nature is a substance common to many, as the Godhead. A person is that which subsists of itself and has a proper manner of subsisting, as the Father begetting, the Son begotten, the Holy Ghost proceeding. Now the Father and the Son are one indeed for nature or Godhead, but they are not one for person. Nay thus they are really distinct. The Father is not the Son, nor the Son the Father. And thus does the Father send the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 246.</span></figcaption>

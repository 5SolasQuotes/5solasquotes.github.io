<main class="wrap"><figure class="quote" id="q-6516df25c5" data-kw="">
<blockquote><p>IV. 3rdly, The suretiship and satisfaction of Christ, have also been an occasion of much good, even to the reprobate. For it is owing to the death of Christ that the Gospel is preached to every creature, that gross idolatry is abolished in many parts of the world, that wicked impiety is much restrained by the discipline of the word of God, that they obtain at times many and excellent though not saving gifts of the Holy Spirit, that ‘they have escaped the pollutions of the world through the knowledge of the Lord and Savior Jesus Christ, 2 Pet. 2:20. And who can in short enumerate all those things which they enjoy, not through accident only, and beside the intention of God, and of Christ, but by the appointment of God? Not indeed with a design and purpose of saving them according to the testament; but from a view to make known His long-suffering towards the vessels of wrath, that is, those who are to perish, who dwell among those who are to be saved. For nothing falls out by accident, with respect to the intention of God; every thing being according to His determinate counsel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants (1677), vol. 1, bk. 2, ch. 9, section 4</cite>, pp. 259-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

0according%20to%20His%20determinate%20counsel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-892ba504ee" data-kw="">
<blockquote><p>The second sort of divines (Contra-Remonstrants) [that is, those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The following quote may have had an influence on the thought of the Assembly, per the editorial comment immediately above. According to Mitchell and Struthers, Ball’s work “was held in high esteem by the Puritans, and recommended by Reynolds, as well as Calamy and several other members of the Westminster Assembly.” From Ball’s Treatise of the Covenant of Grace (1645)</cite>, pp. 205-6.</span></figcaption>

</figure><figure class="quote" id="q-c9f458036e" data-kw="">
<blockquote><p>And, in the third place, this external calling is not without results. In general it can be said of it that God achieves His purpose by means of it… Among the heathen there is great difference between the ways in which they react to the calling of nature. Socrates and Plato are not to be named in one breath with Caligula and Nero. And so it is by no means the same thing whether the gospel is mocked and blasphemed, on the one hand, or accepted with an historical or temporary belief, on the other. True, between these two kinds of faith and a saving faith of the heart there is an essential difference. But that is not to equate them with total unbelief. On the contrary, they are fruits of God’s common grace and they carry with them many temporal blessings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Reasonable Faith: A Survey of Christian Doctrine trans. Henry Zylstra (Eerdmans, 1956), ch. 20, ‘The Christian Calling,’</cite>, pp. 415-20</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e41421122a" data-kw="">
<blockquote><p>XXII. Nor does the law contain any implicit condition of repentance, as if the meaning of its penalties were this: “Whoever breaks the law shall die—unless he repents.” For if that were the case, then by repenting, the sinner would have satisfied the law and could demand acquittal not as grace, but as right, and the judge would be bound by law to justify him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’ (1634)</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd558758bf" data-kw="">
<blockquote><p>In man’s conversion to God we urge not the necessity of anything that is unnecessary. We stand not on certain modes, methods and circumstances, in which it may be brought about, wherein the wisdom of God proceeds variously towards several persons, according to the different circumstances of their condition. As for instance, we assert not a general necessity of this or that measure of humiliation, much less of a dismal despairing horror (as some have said of us); we press conviction and humiliation no farther than to make a sinner restless till he come to Christ, and find rest to his soul in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Account Given of the Principles &amp; Practices of Several Nonconformists… (London: Parkhurst, 1682)</cite>, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-fdb174bc7d" data-kw="">
<blockquote><p>V. Restoration or restitution, in the case of a lapse, or of prolonged custom in some sin, or of spiritual relapse—which can be called a kind of second regeneration and specifically a renovation (Galatians 4:19; 2 Corinthians 2:7–8). Problem I. Whether in such a case the habits were diminished, or rather only the acts impeded? Eighteen years ago we inclined to the affirmative of the latter, and we wiped away the cavils of the Remonstrant darkener against this our assertion in the Thersites Heautontimorumenos [Thersites the Self-Tormentor]. Nor did any of the most distinguished theologians who attested in letters sent to me that they had read that writing see anything heterodox in it. Problem II. Whether the habit is restored through infusion or apposition of a degree or augmentation, which happens at once and simultaneously through the practice of renewed faith and repentance; or rather gradually and successively through frequent and repeated actions? [No answer is given in the English]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-37c89f6727" data-kw="">
<blockquote><p>However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94</cite>, p. 192</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

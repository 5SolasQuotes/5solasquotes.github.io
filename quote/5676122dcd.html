<main class="wrap"><figure class="quote" id="q-5676122dcd" data-kw="">
<blockquote><p>In affirming that the church discipline of the Scottish Reformation is that which principally distinguishes it from the Reformation achieved in other countries, I would not be understood to mean that our fathers alone of all the Reformers taught that Christ has given commandment and authority to the church, to watch carefully over the deportment of her members, admonishing and if necessary casting out those who wantonly violate the law of God.

This was no peculiarity of theirs; nor were they singular even when they taught that the duty and the responsibility connected with the exercise of discipline belong to the church exclusively, and he quite beyond the province of the civil magistrate. These principles (and it is well to remember the fact) are embodied in the public Confessions of nearly all the reformed churches; they are to be found in the Augsburg Confession and other symbolical books of the Lutheran church, in the Gallican and second Helvetic Confessions also, as well as in the documents of the Scottish Reformation.

The distinguishing and honourable peculiarity of our fathers was this, that they not only united their solemn testimony to that of their foreign brethren regarding the law of Christ on the subject of church discipline, but inculcated that law with an energy, and reduced it to practice with a fidelity and persistency unparalleled elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-binnie.html">William Binnie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church Discipline of the Scottish Reformation in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

<blockquote><p>David Scott argues that the establishment principle implies state maintained education and vice-versa. If you accept the validity of one, then you must accept the validity of the other. His point about Voluntaryism being linked to free-market capitalism is interesting and it is a connection that I have made myself. It is hoped that subsequent posts of extracts from the writings of objective historians will serve to further confirm Scott’s thesis:

Those opposed to a public provision for the maintenance of religious ordinances, have generally, if not unanimously, conceded the duty of a government to provide for the education of children by the establishment of common schools. So far, there is no ground of difference. But I confess an inability to reconcile the admission of the duty of the magistrate to provide a system of common school education at the public expense, and yet bitterly oppose a similar provision for the support of religion. If the former is right, the latter cannot be wrong.

Religion and education are so intrinsically connected in principle and aim, that they cannot consistently be distinguished in regard to the obligation of the government. It is right to do both; but inconsistent to admit the obligation in the one case, and deny it in the other. The public mind is, however, evidently undergoing a change on this subject, but I fear for the worse. As far as Romanists are concerned, opposition to the common school system is well understood by intelligent Protestants. But many of the latter seem disposed to put the education of the children and youth of the community on the same footing with that of religion. In fact their aim is to bring the one, as they had done the other, under the application of the voluntary or free trade system. Their consistency is portentous to the welfare of the commonwealth! The movement is backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The public support of religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>

<blockquote><p>But if once the government of Christ were set up among us, we know not what would impede it by the sword of God alone [i.e. the Word of God], without any secular violence, to banish out of the land those spirits of error, in all meekness, humility and love, by the force of truth convincing and satisfying the minds of the seduced. Episcopal courts were never fitted for the reclaiming of minds. Their prisons, their fines, their pillories, their nose-slitting, ear-croppings and cheek-burnings did but hold down the flame to break out in season with the greater rage. But the reformed presbytery does proceed in a spiritual method eminently fitted for the gaining of hearts; they go on with the offending party with all respect: they deal with him in all gentleness from weeks to months, from months sometimes to years, before they come near to any censure.</p></blockquote>

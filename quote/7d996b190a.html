<main class="wrap"><figure class="quote" id="q-7d996b190a" data-kw="">
<blockquote><p>The incarnation of Christ was once done and is not to be done again; but remission of sin is so done as that it is continually to be done for us, and the ultimate complete effect of it will then only be when sin shall be quite taken away, so that a total and full remission will be only at the Day of Judgment, as appears, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come:’ Not but that every sin here forgiven is fully and perfectly forgiven, but because we renew sin daily, therefore there is need of a daily pardon: Away therefore with all such opinions as shall either plead such an inherent righteousness in the Pelagian way, or such an imputed righteousness in the Antinomian way that will overthrow this petition [in the Lord’s prayer] for forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, 14.4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db3512187e" data-kw="">
<blockquote><p>To speak of complete, perfect justification of the law before God, such as that which angels have and men who are saved will have in eternity, is to speak of justification as conformity with God, which is as much to say, with God’s law; for God is thus as He gives Himself to be known in the law. This perfect justification in eternity means God Himself is in the saved [seligen]. As St. Paul says, “God will be all in all” [cf. 1 Cor. 15:28; 12:6; Col. 3:11], that is, God Himself is in the saved, and makes them like Himself, so that they are entirely pure, without sin. As John says, ‘We will be like Him’ [1 Jn. 3:2]. St. Paul speaks about this complete and perfect justification in Gal. 5:5, ‘For through the Spirit, by faith, we wait for the hope of righteousness.’ Although in this mortal life believers have a spark, the gospel nevertheless preaches to us the justification of Christ, of the Mediator between God and us, and says that the Mediator’s entire obedience, from his Incarnation until the Resurrection, is the true justification which is pleasing to God, and is the merit for us. God forgives us our sins, and accepted us, in that He imputes righteousness to us for the sake of the Son, although we are still weak and sinful. We must, however, accept this imputed righteousness with faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Melanchthon on Christian Doctrine, Loci Communes</cite>, 1555 trans. Clyde L. Manschreck (NY: Oxford Univ. Press, 1965), Locus 13, Of the Word, p. 161</span></figcaption>

<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae</cite>, On Theodore Beza</span></figcaption>

<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>

<blockquote><p>The late patrons of Anabaptism among us would make the world believe that this Sect had for its Author the famous Berengarius, and for its fomenters four hundred years ago, the old prede­cessors of Protestants, commonly called Albi­genses: but who will be pleased to consult the fountain of this allegation shall find Berengarius absolved from this crime by that very mouth whence alone the slander did proceed. Bishop Guitmund lays on the back of Deacon Beren­garius the load of so many contumelies as he is able to invent, only for his boldness to oppose the common Doctrine of that time, the corporal presence of Christs body in the bread of the Sacrament: among other things he challenges him for the deny­ing baptism to infants, but if any should require a proof this heavy charge, Guitmund professes that none can be given, avow­ing that Berengarius did never bring any such Doctrine in pub­lic, knowing that no Scripture could be alleged for it, and that no creature would take such an absurdity from his hand (A); Ju­stice therefore does require that Berengarius be freed of that crime, since his very adversary confesses that it was never made appear by any known profession; for crimes that appear not are reputed by just men as not existing (M. Tombes, Ex­amin. p. 20, 21). Concerning the Albigenses, the man that lays the slander of Anabaptism upon them is Petrus Cluniacensis, but how unjustly I offer to be considered not only from this general very true and confessed ground, that the Popish Writers of that time do charge these honest and pious men of Albi with many both errors and crimes, whereof all equitable men believe them to have been most innocent; but also from three particular observations: First, they are not challenged by Cluniacensis as direct and express deniers of paedobaptism, but for their affirming the impossibi­lity of infants believing, and of their impossible salvation with­out faith, he alleges upon them by way of consequence, that they did also maintain the Baptism of infants to be unprofitable and null (B). The learned know how much uses to be said against the burdening of men with all the consequents of their tenets, espe­cially when the party rejects them, and the things themselves have no necessary dependence. Secondly, the antecedent where­upon this consequent is builded, we much doubt if ever it came in the thoughts of the Albigenses. That these gracious and ortho­dox men should have been so absurd as to damn absolutely all infants dying in their infancy, which never any of the grossest heretics to this day did affirm; we must be pardoned to deny our belief to ten witnesses of much better faith then the Abbot of Cluny. Thirdly, that which Cassander avows in that same place helps to evidence the slander of Cluniacensis: the Waldenses were the children and immediate successors of the Albigenses, many of their writs yet extant shew how rigid and punctual observers the children were of their Fathers ways: now it is Cassander’s remark verified by the writs and known practice to this day of all the Waldenses that they have been constant paedo­baptists (C). He must therefore be a man of greater authority then any Friar or Monk of these dark times, who shall be able to persuade that their Fathers the Albigenses were against infants baptism. Wherefore notwithstanding of all which is misalleged from Cassander we may safely with all Protestant Writers affirm that the first known Fathers of Anabaptism were Nicholas Stock and Thomas Muntzer, who in the year 1522 began to sow the tares of that sect in Saxony with too great success. Neither Me­lancthon nor Ca­rolostadius did ever favor an­tipaedobaptism. What some allege of Melancthon and Carolostadius their favor towards these men, of Melancthon it is most false as many of his writs declare (D), unless it be understood of his good and extraordinary meek na­ture, whereby he was ever inclined to pity the worst of men so long as there was any hope by loving dealing to do them good. Carolostadius indeed was a rash hot headed man, and at the beginning did give too much countenance to the Anabaptists, albeit not in the point of Antipaedobaptism (E), so far as we can find; but wherein soever he favored these fanatic men, he did quick­ly repent and made his public retractions to the satisfaction of Luther’ss own mind (F). M. Tombs by all his diligence to search for ancient and renow­ned friends to his Clients the Anabaptists, does but raise dust to darken the air about himself: all who will be at the pains to consider these very testimonies which he alleges, shall find that no Divine of good fame did ever join with that sect: for the spirit that did reign therein was so evidently malignant, that a small measure of discretion did ever serve to discover and avoid him.</p></blockquote>

<blockquote><p>2. I grant the whole, and yet nothing is concluded against us. For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644) | pt. 1, p. 299</span></figcaption>

<blockquote><p>…the instrumental cause of the administration of the Lord’s Supper, viz. the ministers of the Gospel, and the power which they have as ministers to administer the Lord’s Supper. It is called by divines potestas ordinis [the power of order] or potestas muneris specialis [the power of a special office]: and by the London divines in their Divine-Right of Church-Government, is defined to be a Church-power more special and particular to the office of some Church-governors only, as the power of preaching the Gospel, and which they as ministers may execute virtute officii [by virtue of the office]: and it is distinguished from the power of jurisdiction which is more general and common to the office of all Church-governors, as the power of censures, wherein ruling-elders may act with ministers… …That which belongs to ministers as ministers, belongs to all ministers, and always, in all states and conditions of the Church, as well in an un-presbyterated as a presbyterated Church. For a quatenus ad de omni valet argumentum: and the universality required in a proposition, that is, de omni, is universalitas posterioristica, as well as prioristica; temporis, as well as subjecti; Indeed this universality of time, this always is not to be understood, as in natural attributions, for that which is absolutely such in a mathematical latitude, but is to be taken (as usually it is) when it is applied to matters moral, for frequency or usualness… For first every power is for its act, and therefore power in a minister of administring the Lord’s Supper is not to lie idle and unactive; but to be exercised and actuated as often as there is a fit occasion and opportunity; unless there be some such impediment, as I spake of but now, etc. ‘[Greek] Hoc est frustra, quod sua natura in alterius gratiam est comparatum, quando non perficit id, cujus gratia est, &amp; natura comparatum est.’ (Aristotle, bk. 2, Physics, text 62. ‘Now if that may be said in vain which does not reach that end unto which it was appointed, much more may that be said so which is never used or applied for the compassing of that end.’ Secondly, The edification of the Church of Christ is, as the London divines say well, that eminent scope and end why Christ gave Church Government, and all other ordinances of the New Testament to the Church, 2 Cor. 10:8; 2 Cor. 13:10. The power then both of Order and Jurisdiction are both to be employed to the edification of the Church. The power of jurisdiction the minister cannot exercise singly by himself, without other Church officers. The power of order he may: For he alone is the seat and receptacle thereof. …Now a minister ought to exercise and employ for the edification of the Church all the power and authority that he may lawfully exercise. For, not to employ it, were with the slothful servant in the parable to hide his talent in the earth.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the instrumental cause of the administration of the Lord’s Supper, viz. the ministers of the Gospel, and the power which they have as ministers to administer the Lord’s Supper. It is called by divines potestas ordinis [the power of order] or potestas muneris specialis [the power of a special office]: and by the London divines in their Divine-Right of Church-Government, is defined to be a Church-power more special and particular to the office of some Church-governors only, as the power of preaching the Gospel, and which they as ministers may execute virtute officii [by virtue of the office]: and it is distinguished from the power of jurisdiction which is more general and common to the office of all Church-governors, as the power of censures, wherein ruling-elders may act with ministers… …That which belongs to ministers as ministers, belongs to all ministers, and always, in all states and conditions of the Church, as well in an un-presbyterated as a presbyterated Church. For a quatenus ad de omni valet argumentum: and the universality required in a proposition, that is, de omni, is universalitas posterioristica, as well as prioristica; temporis, as well as subjecti; Indeed this universality of time, this always is not to be understood, as in natural attributions, for that which is absolutely such in a mathematical latitude, but is to be taken (as usually it is) when it is applied to matters moral, for frequency or usualness… For first every power is for its act, and therefore power in a minister of administring the Lord’s Supper is not to lie idle and unactive; but to be exercised and actuated as often as there is a fit occasion and opportunity; unless there be some such impediment, as I spake of but now, etc. ‘[Greek] Hoc est frustra, quod sua natura in alterius gratiam est comparatum, quando non perficit id, cujus gratia est, &amp; natura comparatum est.’ (Aristotle, bk. 2, Physics, text 62. ‘Now if that may be said in vain which does not reach that end unto which it was appointed, much more may that be said so which is never used or applied for the compassing of that end.’ Secondly, The edification of the Church of Christ is, as the London divines say well, that eminent scope and end why Christ gave Church Government, and all other ordinances of the New Testament to the Church, 2 Cor. 10:8; 2 Cor. 13:10. The power then both of Order and Jurisdiction are both to be employed to the edification of the Church. The power of jurisdiction the minister cannot exercise singly by himself, without other Church officers. The power of order he may: For he alone is the seat and receptacle thereof. …Now a minister ought to exercise and employ for the edification of the Church all the power and authority that he may lawfully exercise. For, not to employ it, were with the slothful servant in the parable to hide his talent in the earth.”

<blockquote><p>…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>

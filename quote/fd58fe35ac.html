<main class="wrap"><figure class="quote" id="q-fd58fe35ac" data-kw="">
<blockquote><p>What are you heretics saying? His judgments are inscrutable, his ways are unsearchable, his peace surpasses all understanding, his gift is indescribable, what God has prepared for those who love him has not entered into the heart of man, his greatness has no bound, his understanding is infinite. Are all these incomprehensible while only God himself can be comprehended? What excessive madness would it be to say that?

Stop the heretic; do not let him get away. Tell me. What does Paul say? “Our knowledge is imperfect.” The heretic answers that Paul is not talking about God’s essence but about his governance of the universe. Very good, then. If he is talking about the governance of the universe, our victory is all the more complete. For if his governance of the universe is incomprehensible, then all the more so is God himself beyond our powers of comprehension. …

Did you see how great is the holy dread in heaven and how great the arrogant presumption here below? The angels in heaven give him glory; these heretics on earth carry on meddlesome investigations. In heaven they honour and praise him; on earth we find curious busybodies. In heaven they veil their eyes; on earth the busybodies are obstinate and shamelessly try to hold their eyes fixed on his ineffable glory. Who would not groan, who would not weep for them because of this ultimate madness and folly of theirs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incomprehensible Nature of God</cite>, (c. 386-98), trans. Paul W. Harkins, The Fathers of the Church: A New Translation, Volume 72 (Washington D.C.: Catholic University Press, 1982), 1.30-31, 36, pp 64, 66.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>
<div class="actions"><button class="copy" data-copy="“What are you heretics saying? His judgments are inscrutable, his ways are unsearchable, his peace surpasses all understanding, his gift is indescribable, what God has prepared for those who love him has not entered into the heart of man, his greatness has no bound, his understanding is infinite. Are all these incomprehensible while only God himself can be comprehended? What excessive madness would it be to say that?

Stop the heretic; do not let him get away. Tell me. What does Paul say? “Our knowledge is imperfect.” The heretic answers that Paul is not talking about God’s essence but about his governance of the universe. Very good, then. If he is talking about the governance of the universe, our victory is all the more complete. For if his governance of the universe is incomprehensible, then all the more so is God himself beyond our powers of comprehension. …

Did you see how great is the holy dread in heaven and how great the arrogant presumption here below? The angels in heaven give him glory; these heretics on earth carry on meddlesome investigations. In heaven they honour and praise him; on earth we find curious busybodies. In heaven they veil their eyes; on earth the busybodies are obstinate and shamelessly try to hold their eyes fixed on his ineffable glory. Who would not groan, who would not weep for them because of this ultimate madness and folly of theirs?”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c563cf8a32" data-kw="">
<blockquote><p>But if any one alleges that the human mind which is finite cannot possibly comprehend divine things which are infinite, we must here properly distinguish–For if by the word ‘comprehend’ be meant to comprehend perfectly, we are quite agreed. For we are entirely of the opinion that a perfect and adequate knowledge of divine matters is quite inconsistent with the imperfection of the human understanding. But if by ‘comprehending’ be understood a clear and convincing knowledge, to a certain degree, the greatness of the objects in such enquiries is by no means inconsistent with this kind of knowledge. For what can the mind conceive greater than eternity? when we attempt to have a full and adequate conception of it, our understanding is quite aborbed by the idea: and yet that there is such a thing as eternity is one of the clearest and most evident truths, as we shall demonstrate in its proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-e84e73952b" data-kw="">
<blockquote><p>There are various entities which, if they exist, would be candidates for necessary beings: God, propositions, relations, properties, states of affairs, possible worlds, and numbers, among others. Note that the first entity in this list is a concrete entity, while the rest are abstract entities. The main question we will address in this article is: Does God ground the existence of necessarily existing abstract objects?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-davidson.html">Matthew Davidson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God &amp; Other Necessary Beings’ 60 paragraphs and a bibliography in Stanford Encyclopedia of Philosophy online</cite></span></figcaption>

<blockquote><p>But, on account of the impossibility of a fully adequate comprehension of God, nevertheless all conception of God is not to be denied to man, as if finite man is in no way able to form a concept of the infinite, as [Thomas] Hobbes [d. 1679] maintains, against whom Cocquius¹ disputes concerning this matter, in his Anatome Hobbesianismi, locus VI, chapter XII, pages 114-118… ¹ Gisbertus Cocquius (1630-1708) of Utrecht was a Reformed thinker and doctor of philosophy; he opposed Hobbes. Compare also Heidanus² in his Consideratien, etc., pages 134-138, upon occasion of this thesis, proscribed by the curators of the Academy of Leiden, that ‘Men have an adequate idea of God.’ ² Abraham Heidanus (1597-1678) was a Dutch Reformed minister and Cocceian theologian. He served as professor of theology at Leiden from 1648 to 1676, but he was ultimately dismissed for his Cartesianism.</p></blockquote>

</figure><figure class="quote" id="q-da8941acdb" data-kw="">
<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seems not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God, as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, p. 9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d25cabd6a1" data-kw="">
<blockquote><p>[a divine will resident] in the antecedent causes from which an effect follows, but not necessarily; so that God antecedently wills that all people be saved, insofar as He gives to all the natural capacity to be saved and in no way impedes the sufficiency of the means; and God wills consequently that which He wills not in the causes but in Himself, namely, that believers be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitationes apologeticae, II.iii.1, p. 323 as translated in Richard Muller, Post-Reformation Reformed Dogmatics 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, 6. Voluntas antecedens and voluntas consequens</cite>, p. 466</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“[a divine will resident] in the antecedent causes from which an effect follows, but not necessarily; so that God antecedently wills that all people be saved, insofar as He gives to all the natural capacity to be saved and in no way impedes the sufficiency of the means; and God wills consequently that which He wills not in the causes but in Himself, namely, that believers be saved.”

— Samuel Rutherford, Exercitationes apologeticae, II.iii.1, p. 323 as translated in Richard Muller, Post-Reformation Reformed Dogmatics 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, 6. Voluntas antecedens and voluntas consequens, p. 466">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5Ba+divine+will+resident%5D+in+the+antecedent+causes+from+which+an+effect+follows%2C+but+not+necessarily%3B+so+that+God+antecedently+wills+that+all+people+be+saved%2C+insofar+as+He+gives+to+all+the+natural+capacity+to+be+saved+and+in+no+way+impedes+the+sufficiency+of+the+means%3B+and+God+wills+consequently+that+which+He+wills+not+in+the+causes+but+in+Himself%2C+namely%2C+that+believers+be+saved.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Exercitationes+apologeticae%2C+II.iii.1%2C+p.+323+as+translated+in+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+2nd+ed.+%28Baker+Books%2C+2003%29%2C+vol.+3%2C+ch.+5.4%2C+E.+The+Ad+Intra%E2%80%93Ad+Extra+Distinctions%2C+6.+Voluntas+antecedens+and+voluntas+consequens%2C+p.+466&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd25cabd6a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d25cabd6a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=a%20divine%20will%20resident%5D%20in%20the,Himself%2C%20namely%2C%20that%20believers%20be%20saved&amp;text=a%20divine%20will%20resident%5D%20in%20the%20antecedent%20causes&amp;text=but%20in%20Himself%2C%20namely%2C%20that%20believers%20be%20saved" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cbb708b33" data-kw="">
<blockquote><p>They all happen and are according to the decree, but they are not caused by it, and therefore rational agents may act freely notwithstanding the preordination of God. For the decree does not so affect the actions of men, as to lay any force upon the actors. It is not denied that there is a necessity of the certain futurition of the acts and events, so that they shall infallibly and inevitably come to pass; but there is not on the things themselves or the actors a necessity, whereby the persons are forced to do what they do, and ot do it unwillingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Veritas Redux: Evangelical Truths Restored: Namely, Those Concerning God’s Eternal Decrees, The Liberty of Man’s Will, Grace &amp; Conversion, The Extent &amp; Efficacy of Christ’s Redemption, &amp; Perseverance in Grace</cite>, p. 266</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“They all happen and are according to the decree, but they are not caused by it, and therefore rational agents may act freely notwithstanding the preordination of God. For the decree does not so affect the actions of men, as to lay any force upon the actors. It is not denied that there is a necessity of the certain futurition of the acts and events, so that they shall infallibly and inevitably come to pass; but there is not on the things themselves or the actors a necessity, whereby the persons are forced to do what they do, and ot do it unwillingly.”

— John Edwards, Veritas Redux: Evangelical Truths Restored: Namely, Those Concerning God’s Eternal Decrees, The Liberty of Man’s Will, Grace &amp; Conversion, The Extent &amp; Efficacy of Christ’s Redemption, &amp; Perseverance in Grace, p. 266">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+all+happen+and+are+according+to+the+decree%2C+but+they+are+not+caused+by+it%2C+and+therefore+rational+agents+may+act+freely+notwithstanding+the+preordination+of+God.+For+the+decree+does+not+so+affect+the+actions+of+men%2C+as+to+lay+any+force+upon+the+actors.+It+is+not+denied+that+there+is+a+necessity+of+the+certain+futurition+of+the+acts+and+events%2C+so+that+they+shall+infallibly+and+inevitably+come+to+pass%3B+but+there+is+not+on+the+things+themselves+or+the+actors+a+necessity%2C+whereby+the+persons+are+forced+to+do+what+they+do%2C+and+ot+do+it+unwillingly.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Veritas+Redux%3A+Evangelical+Truths+Restored%3A+Namely%2C+Those+Concerning+God%E2%80%99s+Eternal+Decrees%2C+The+Liberty+of+Man%E2%80%99s+Will%2C+Grace+%26+Conversion%2C+The+Extent+%26+Efficacy+of+Christ%E2%80%99s+Redemption%2C+%26+Perseverance+in+Grace%2C+p.+266&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cbb708b33.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8cbb708b33.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=They%20all%20happen%20and%20are%20according,do%2C%20and%20ot%20do%20it%20unwillingly&amp;text=They%20all%20happen%20and%20are%20according%20to%20the&amp;text=what%20they%20do%2C%20and%20ot%20do%20it%20unwillingly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ddacbd6460" data-kw="">
<blockquote><p>Free will, in the sense of those [errorists] who maintain it, is [said to be] a power in the will to incline either way, when that which is supernatural and saving is offered as its object; a power and freedom in the will to choose or refuse, to yield or resist, to embrace or reject, as it list. So that this with them is twofold: … 2. To choose, or embrace. The will, they [errorists] say, can incline to that which is spiritually and supernaturally good. They speak not of a capacity, which is not denied, but of an active power. A natural man, by the power of his will, as he can reject Christ, so he can embrace Him; as he can resist converting grace, so he can yield to it as he will; the will can incline itself to this as well as to the other. This is a true representation of their opinion in the other branch of it. Against which we say…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Man’s Insufficiency to do Anything of Himself’, on John 15:5, in The Works of David Clarkson, vol. 2</cite>, p. 128-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-1c4789c66d" data-kw="">
<blockquote><p>Impotence of the sinner does not excuse him in sinning, since it is not involuntary and merely physical, arising from a defect of natural power, but voluntary and moral, arising from a depraved nature.</p></blockquote>

</figure><figure class="quote" id="q-857b72c045" data-kw="">
<blockquote><p>…the conceptual order outstrips the order of things conceptualized. And it is this outstripping that entails the possibility of willing otherwise. Because the intellect is not necessitated to conceptualizing things one way rather than another, the will is not necessitated to being moved to one end rather than another. But neither is choice random or arbitrary. For choice is always for a reason, even if the reason is not necessitated. And to act for a reason is precisely not to act randomly or arbitrarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortality of Souls: a Treatise on Human Nature (Editiones Scholastica, 2024), ch. 4, ‘The Will’ Feser is an Anyltical Thomist, writing in the Thomist tradition. What is said below is consistent with divine, physical predetermination.</cite>, p. 146</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>[T]he kingdom of grace is still restricted, in that measure in this our mortal life even they who seem to be somewhat nigh unto perfection are under necessity of confessing: “In many things we offend all,” and “If we say that we have no sin, we deceive ourselves, and the truth is not in us.” Wherefore it is that they pray without ceasing, saying: “Thy kingdom come.” But this will not be consummated even in them, until not only doth not sin reign in their mortal body, but there neither is nor can be any sin at all in the body then immortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Grace and Free Will</cite>, trans. Watkin W. Williams (1128; London: SPCK, 1920), p. 23.</span></figcaption>

<blockquote><p>Positive attributes are such which so ascribe some perfection to God, as not inferring any respect unto the creature’s existing or in present being; by these, our understanding is helped in our meditation of God by way of eminency. The more principal of them are in number six:

1. Holiness.

2. Wisdom.

3. Will.

4. Liberty.

5. Omnipotency.

6. Perfection. To which, or some of which, the rest of like nature may conveniently be referred. … God comprehending his own essence, sees all things, because all possibilities, futuritions and beings, that is, all things that might have been, shall be or actually be, are eminently contained in the divine essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, p. 16</span></figcaption>

<blockquote><p>…in a man regenerate, there are two contrary qualities inherent in every faculty:

1. Grace, in a rectified holy inclination to goodness, infused into it.

2. Corruption in a vitious quality disposing it to evil. These two qualities abide in the regenerate, and oppose one another… let us proceed to declare what is a regenerate man’s resistance that he makes against the working of grace in hindering the performance of any good work: which you shall perceive by these two conclusions:

1. A man regenerate so far forth as he is Spiritual, never resists the work of grace, but is constantly most willing and forward to the performance of all holy actions. …

2. That a man regenerate, so far forth as he is carnal, does always resist the work of grace, being unwilling and backward to perform any holy action. … To conclude this point, there is in every regenerate man a possibility or power of resistence always remaining so long as any corruption abides in him, which will perpetually make some opposition more or less in the performance of every good work. But for the prevailing act of resistency whereby such good works might be quite hindered, we affirm that by the power of assisting grace effectually aiding the regenerate faculties, that act is taken away. The flesh may strive, but the Spirit does overcome… a victory indeed certain in regard of the event, but with some uncertainty in the combat, wherein Israel is sometime put unto the worst. For you are to note that albeit in the general as touching those main and principal acts of beleeving, repenting, persevering in obedience, etc. grace does work so effectually with man’s regenerate will that corruption cannot hinder it in the exercise of those acts: nevertheless, in many particular actions after his first conversion in the continued practice of sanctification, he may obey the enticings of his corrupt concupiscence, against the motions of the Spirit of grace. For many times in sundry particulars of Christian practice God is pleased to deny that effectual assistance which at other times He affords, and then He leaves us unto our own strength, for experiment to try what is in us, for humiliation in discovery of our weakness unto us, for exercise of Christian watchfulness in making diligent use of all gracious helps, and the like good purposes. … But these desertions are not perpetual: corruption may for a time let [prevent] the exercise of some particular graces, but in all and always it shall never hinder: God who has given unto a regenerate man a power to believe by the changing of his will through the infusion of a constant inclination to all spiritual good, will also cause the act of believing infallibly to ensue, by the assistance of cooperating grace, so powerfully strengthening the regenerate will, and so effectually restraining the rebellious motions of corruption that the will shall not choose but do that which above all things in the world it most desires to do, namely, believe and obey the Gospel.</p></blockquote>

<blockquote><p>3. How it can stand with the wisdom, justice and holiness of God to justify a sinner? ‘Tis a great crime to take the unrighteous to be righteous; and to pronounce the wicked justified, seems to be against the Word of God, Prov. 24:24, ‘He that saith unto the wicked, ‘Thou art righteous,’ him shall the people curse; nations shall abhor him.’ Prov. 17:15, ‘He that justifieth the wicked, and he that condemneth the just, even they both are an abomination unto the Lord.’ Now what is an abomination unto the Lord is surely contrary to his nature, Ex. 34:7, ‘He will by no means clear the guilty.’ Answer: … 3. Effectual calling, or the conversion of man, reconciles it with his holiness; for a sinner, as a sinner, is not justified, but a penitent believer [is]: ’tis true ’tis said, ‘God justifieth the ungodly,’ Rom. 4:5: those that were once so, but not those that continue so; certainly He sanctifies before he justifies, Acts 26:18: ‘To open their eyes, and turn them from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and inheritance among them that are sanctified, by faith that is in Me;’ and in many other places. No man is freed from the guilt of sin, which renders us obnoxious to God’s wrath, who is not freed from the filth of sin, which taints our faculties; for Christ is made to us both righteousness and sanctification, 1 Cor. 1:30. By losing God’s image, we lost his favor; and in the order wherein we lost it, we recover it. God regenerates that He may pardon and justify, and restores first our holiness and then our happiness: ’tis not consistent with God’s holiness to give us pardon and let us alone in our sins. A man would not put a toad in his bosom. But more fully to give you a prospect into this matter, let us take notice of the several things which are mentioned in Scripture, as belonging to our justification: as for instance: Sometimes we are said to be justified by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, pp. 334-35</span></figcaption>

ed by grace, as Rom. 3:24, ‘Being justified freely by his grace’: sometimes by the blood of Christ, as Rom. 5:9, ‘Being justified by his blood, we shall be saved from wrath through Him’: sometimes by faith, as Rom. 5:1, ‘Being justified by faith, we have peace with God through our Lord Jesus Christ’: sometimes by works, James 2:24, ‘Ye see then how that by works a man is justified, and not by faith only.’ All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christs blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.”

— Thomas Manton, A Second Volume of Sermons preached by the late reverend and learned Thomas Manton, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, pp. 334-35">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+How+it+can+stand+with+the+wisdom%2C+justice+and+holiness+of+God+to+justify+a+sinner%3F+%E2%80%98Tis+a+great+crime+to+take+the+unrighteous+to+be+righteous%3B+and+to+pronounce+the+wicked+justified%2C+seems+to+be+against+the+Word+of+God%2C+Prov.+24%3A24%2C+%E2%80%98He+that+saith+unto+the+wicked%2C+%E2%80%98Thou+art+righteous%2C%E2%80%99+him+shall+the+people+curse%3B+nations+shall+abhor+him.%E2%80%99+Prov.+17%3A15%2C+%E2%80%98He+that+justifieth+the+wicked%2C+and+he+that+condemneth+the+just%2C+even+they+both+are+an+abomination+unto+the+Lord.%E2%80%99+Now+what+is+an+abomination+unto+the+Lord+is+surely+contrary+to+his+nature%2C+Ex.+34%3A7%2C+%E2%80%98He+will+by+no+means+clear+the+guilty.%E2%80%99+Answer%3A+%E2%80%A6+3.+Effectual+calling%2C+or+the+conversion+of+man%2C+reconciles+it+with+his+holiness%3B+for+a+sinner%2C+as+a+sinner%2C+is+not+justified%2C+but+a+penitent+believer+%5Bis%5D%3A+%E2%80%99tis+true+%E2%80%99tis+said%2C+%E2%80%98God+justifieth+the+ungodly%2C%E2%80%99+Rom.+4%3A5%3A+those+that+were+once+so%2C+but+not+those+that+continue+so%3B+certainly+He+sanctifies+before+he+justifies%2C+Acts+26%3A18%3A+%E2%80%98To+open+their+eyes%2C+and+turn+them+from+darkness+to+light%2C+and+from+the+power+of+Satan+to+God%2C+that+they+may+receive+forgiveness+of+sins%2C+and+inheritance+among+them+that+are+sanctified%2C+by+faith+that+is+in+Me%3B%E2%80%99+and+in+many+other+places.+No+man+is+freed+from+the+guilt+of+sin%2C+which+renders+us+obnoxious+to+God%E2%80%99s+wrath%2C+who+is+not+freed+from+the+filth+of+sin%2C+which+taints+our+faculties%3B+for+Christ+is+made+to+us+both+righteousness+and+sanctification%2C+1+Cor.+1%3A30.+By+losing+God%E2%80%99s+image%2C+we+lost+his+favor%3B+and+in+the+order+wherein+we+lost+it%2C+we+recover+it.+God+regenerates+that+He+may+pardon+and+justify%2C+and+restores+first+our+holiness+and+then+our+happiness%3A+%E2%80%99tis+not+consistent+with+God%E2%80%99s+holiness+to+give+us+pardon+and+let+us+alone+in+our+sins.+A+man+would+not+put+a+toad+in+his+bosom.+But+more+fully+to+give+you+a+prospect+into+this+matter%2C+let+us+take+notice+of+the+several+things+which+are+mentioned+in+Scripture%2C+as+belonging+to+our+justification%3A+as+for+instance%3A+Sometimes+we+are+said+to+be+justified+by+grace%2C+as+Rom.+3%3A24%2C+%E2%80%98Being+justified+freely+by+his+grace%E2%80%99%3A+sometimes+by+the+blood+of+Christ%2C+as+Rom.+5%3A9%2C+%E2%80%98Being+justified+by+his+blood%2C+we+shall+be+saved+from+wrath+through+Him%E2%80%99%3A+sometimes+by+faith%2C+as+Rom.+5%3A1%2C+%E2%80%98Being+justified+by+faith%2C+we+have+peace+with+God+through+our+Lord+Jesus+Christ%E2%80%99%3A+sometimes+by+works%2C+James+2%3A24%2C+%E2%80%98Ye+see+then+how+that+by+works+a+man+is+justified%2C+and+not+by+faith+only.%E2%80%99+All+these+things+concur+to+our+justification+and+do+not+contradict%2C+but+imply+one+another%3A+The+first+moving+cause+of+all+is+grace%3B+the+meritorious+cause%2C+is+Christs+blood%3A+the+means+of+applying%2C+or+the+condition+on+our+part+upon+which+we+are+capable+at+first+of+receiving+so+great+a+privilege%2C+is+faith%3A+and+the+means+of+continuing+in+our+justified+estate%2C+is+by+good+works%2C+or+new+obedience.+I+say%2C+our+first+actual+pardon%2C+justification%2C+and+right+to+life%2C+is+given+upon+condition+of+our+first+faith+and+repentance%3B+but+this+estate+is+continued+to+us+both+by+faith%2C+Rom.+1%3A17+and+new+obedience%3B+these+fairly+accord.+The+grace+of+God+will+do+nothing+without+the+intervention+of+Christ%E2%80%99s+merits%3B+and+Christ%E2%80%99s+merits+do+not+profit+us+%E2%80%99till+it+be+applied+by+faith%3B+and+sound+believers+will+live+in+a+course+of+new+obedience.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton%2C+%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+pp.+334-35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa17830e4cd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a17830e4cd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=3.%20How%20it%20can%20stand%20with,in%20a%20course%20of%20new%20obedience&amp;text=3.%20How%20it%20can%20stand%20with%20the%20wisdom&amp;text=will%20live%20in%20a%20course%20of%20new%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God is omnipotent, or God can do all things. That, things which imply a contradiction: as namely, for the same thing to be, and not to be; and impossibilities, as namely, for a man not to be a reasonable creature, and the like: fall not under the compass of omnipotency, is not from any defect (it is indeed from the perfection) of power in God; but from the impossibility of the things… So likewise that God cannot sin, lie, or deny Himself, is not from defect, but from the eminency of his power and absolute perfection, whence He is uncapable of being touched with any imperfection. … Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. Eminential continency and virtual continency (that is, for one thing to be contained in another eminently, as the excellency of the creature is in the Creator; or virtually, as all things saleable are in money, Eccl. 10:9) are not the same: the first is proper to the Creator, the second is found in the creature. The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>

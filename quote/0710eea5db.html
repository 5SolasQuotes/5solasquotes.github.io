<main class="wrap"><figure class="quote" id="q-0710eea5db" data-kw="">
<blockquote><p>It is not a question whether divine and apostolic traditions, that is, all teachings which were handed down by Christ or the apostles, are to be accepted; everyone readily grants this. The question is whether any such traditions are given except in Scripture. Therefore, until our adversaries can show by an unquestionable proof that their unwritten traditions truly rest on Christ and the apostles, which will never be done, we shall reject them as human work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/apostolic-tradition.html">Apostolic tradition</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/unwritten-traditions.html">Unwritten traditions</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1057e41071" data-kw="">
<blockquote><p>All things which are necessary to salvation are contained in the Scriptures, and also all those things which are necessarily required to the instruction and edification of the Church. … Hence the Scripture is not a partial, but a perfect rule of Faith, and manners: neither is here any thing that is constantly and every where necessary to be observed in the Church of God, which depends either upon any tradition, or upon any authority whatsoever and is not contained in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology</cite>, Book I, ch. XXXIV, theses 15–16</span></figcaption>

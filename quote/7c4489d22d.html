<main class="wrap"><figure class="quote" id="q-7c4489d22d" data-kw="">
<blockquote><p>For remission of sins does not only deliver from pain, to wit, eternal death; but also brings glory or eternal life. The reason of which thing is this, that remission of sins, wherein man’s justification consists, is remission of all sins: and therefore not only of sins of committing, but also of sins of omitting: whereby it comes that he to whom God forgives sins, is so accounted of, as if he had not only committed nothing which God has forbidden in his law: but also, omitted nothing of that which he has commanded: and therefore, as if he had perfectly fulfilled the law of God. Now where the perfect fulfilling of the law is, there also is life, according to that, ‘The man that doeth these things shall live in them.’ Moreover, the example of civil judgment which Bellarmine brings, proves not his assumption: because that absolution is unlike to the absolution of God. For this is universal, to wit from all sins against the law of God: but that is particular or special; to wit, from some certain crime or crimes, against the politic laws. Notwithstanding, the civil judge gives unto him whom he has quitted from certain crimes those rewards which he has promised to the innocent, namely, preservation in life and defence; although he give him no new and singular rewards which he has promised only to certain virtuous exploits. And so God gives eternal life as a reward to those unto whom He has promised it, to wit, unto those that keep his law: such as He accounts all those whose sins He has forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Profitable Treatise of Man’s Justification. Two Books. Opposed to the Sophisms of Robert Bellarmine, Jesuit</cite>, (London, 1599) 128 pp. ToC, bk. 2, ch. 4, pp. 106-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a56619ff23" data-kw="">
<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, (Cambridge: Greene, 1612), on chapter 3, v. 7, p. 666 Taylor (1576-1632) was partially conforming English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-6b0386e2f3" data-kw="">
<blockquote><p>XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?</p></blockquote>

</figure><figure class="quote" id="q-7c764db3f2" data-kw="">
<blockquote><p>For if they only wanted” (he says of ours) “the merits of Christ to be imputed to us, because they were given to us, and we can offer them to God the Father for our sins, because Christ took upon Himself the burden of satisfying for us, and reconciling us to God the Father; their opinion would be right.</p></blockquote>

</figure><figure class="quote" id="q-f6cbf50387" data-kw="Justification">
<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>

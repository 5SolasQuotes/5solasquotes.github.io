<blockquote><p>[God] himself took on him the burden of our iniquities, he gave his own Son as a ransom for us, the Holy One for transgressors, the blameless one for the wicked, the righteous one for the unrighteous, the incorruptible one for the corruptible, the immortal one for them that are mortal. For what other thing was capable of covering our sins than his righteousness? By what other one was it possible that we, the wicked and ungodly, could be justified, than by the only Son of God? O sweet exchange! O unsearchable operation! O benefits surpassing all expectation! — that the wickedness of many should be hid in a single Righteous One, and that the righteousness of one should justify many transgressors!’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/epistle-to-diognetus.html">Epistle to Diognetus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 9 (HT: Jack Miller)</span></figcaption>

<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

<blockquote><p>Question 36. But how are we justified by faith? Answer: Not because of the worthiness of our faith, as if God justifies us because of it, as the Remonstrants would have it, and [as if] faith is here reckoned as a virtue and a remarkable good work, and therefore as the meritorious cause of the same [i.e. of justification]. …Question 38. How should faith here then be understood? Answer: As a hand or instrument, whereby we grab and take hold of the righteousness of the Redeemer, hence the sayings ‘take hold of God’s strength’ Is. 27:5; ‘receiving Jesus’ Jn. 1:12; ‘receiving the gift of righteousness’ Rom 5:17 and Acts 26:18. Question 39. By which analogy do you clear this up? Answer: Of the beggar who would receive alms of the generosity of a rich man, to which he must stretch out the hand, in which case it [i.e. the hand] deserves nothing, but is only the means by which he receives the gift; or alternatively, of one who in the navigation of the sea capsizes and sees a plank, grabs hold of it, and hauls himself onto it, thereby to be spared.</p></blockquote>

<blockquote><p>Despite its many weaknesses, this earlier work remains a landmark of scholarship in the field… At that time, the only serious attempt to document this development was Ritschl’s Die christliche Lehre von der Rechtfertigung und Versohnung (1870). The value of that work was rather reduced by the moralist assumptions Ritschl brought to his task, and by his decision to limit his analysis from the eleventh to the nineteenth century, focusing particularly on German-language Protestant contributions to the discussion. The vast scholarly undertakings which have given the modern period the magnificent critical editions denied to Ritschl (such as the Weimar Luther edition) have also cast new light on the theology of the medieval period, calling into question many of Ritschl’s conclusions. One of the more troubling aspects of my investigation was the realisation that most of Ritschl’s conclusions, particularly his very unsatisfactory account of Luther’s theological formation, could no longer be sustained.” – McGrath, Iustitia Dei, 3rd ed., Preface, vii, ix-x McGrath, Alister – Iustitia Dei: A History of the Christian Doctrine of Justification 3rd ed. rev. (Cambridge Univ. Press, 2005) 2nd ed.: ToC 1, 2 Kang, Paul C. – Justification: the Imputation of Christ’s Righteousness from Reformation Theology to the American Great Awakening &amp; the Korean Revivals Pre (2006) 160 pp. ToC . On the Early &amp; Medieval Church Book Estrada, Erik – Faith Alone: Debates About Justification Before the Reformation Pre (Fortress Press, 2026) 466 pp. ToC Blurb: “…contrary to the historical outlook of a good number of Catholic and Protestant historians and theologians, there were indeed conflicts within the Great Church (ca. 100-700 CE) over the question ‘After baptism, is faith alone enough to save the orthodox Christian?&#x27;</p></blockquote>

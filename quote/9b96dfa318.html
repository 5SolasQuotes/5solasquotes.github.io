<blockquote><p>Objection: 1. But Christ says, “Swear not at all;” and James says, “Nor by any other oath…”. Therefore Christians are not allowed to swear [oaths] under any form. Answer: There is here a fallacy of composition; for when Christ says, swear not at all, we are not to refer this language to the oath itself, but to the various forms of rash [oath] swearing which the Pharisees imagined lawful. It is, therefore, as if he would say, “Swear not falsely or rashly at all, whether it be in a direct or indirect way.” So when the Apostle James says, “Nor by any other oath,” we must understand him also as referring to such oaths as are rash and false, of which kind he furnishes some specimens, and forbids all of a similar character. If this be not the proper interpretation of these passages, Christ himself has violated his own precept which he here lays down, saying, “Let your communication be yes, yes or no, no;” for he frequently in his discourses used this most emphatic form of expression, “Truly, truly I say to you.” And James would in this case condemn Paul, who called God for a record upon his soul. And the Holy Spirit would contradict himself by condemning all oaths by James, and commending them by another Apostle as a remedy useful and necessary to the preservation of society, for the purpose of putting an end to strife and controversies, from which human life, in this state of frailty and imperfection, cannot be free. Objection 2: But such oaths as were permitted, together with the examples which are found in the Scriptures, have respect to public oaths—such as were exacted or given in the name of the public and for the public good. Therefore at least private oaths, or such as pass between private individuals, are entirely prohibited. Answer. 1: We deny the antecedent; because there is not only no such restriction as that which is here maintained, specified in the instances recorded in the Scriptures, where the saints make oath to God, but it is impossible to interpret them in this way, as a careful examination of the passages themselves will prove. 2: There are many oaths recorded in the Scriptures, the private character of which cannot be doubted, such as that of Jacob and Laban, that of Boaz, Abdiah, Abigail, and David. (Gen. 31:53. Ruth 3:13. etc.) 3. The same thing may be proven from the design of the oath, which is a confirmation of fidelity and truth among men, and the putting an end to strife. These things now have respect to Christians also as private individuals; and hence the oath itself by which we establish truth and fidelity, likewise has respect to them.</p></blockquote>

<blockquote><p>§35. Question 28: May one person disoblige another of a promise made to him? Answer: Yes, if it be no more than a promise to that person: because a man may give away his right. But if it be moreover a vow to God, or you intend to oblige yourself in point of veracity under the guilt of a lie if you do otherwise, these alter the case and no person can herein disoblige you. §36. Question 29. But what if the contract be bound by an oath, may another then release me? Answer: Yes, if that oath did only tie you to perform your promise and were no vow to God which made him a party by dedicating anything to Him: For then the oath being but subservient to the promise, he that discharges you from the promise, discharges you also from the oath which bound you honestly to keep it. §37. Question 30: Am I bound by a promise when the cause or reason of it proves a mistake? Answer: If by the cause you mean only the extrinsic reasons which moved you to it, you may be obliged nevertheless for finding your mistake: Only so far as the other was the culpable cause (as is aforesaid) he is bound to satisfy you: But if by the cause you mean the formal reason, which constitutes the contract, then the mistake may in some cases nullify it (of which enough before). §38. Question 31. What if a following accident make it more to my hurt than could be foreseen? Answer: In some contracts it is supposed or expressed that men do undertake to run the hazard: and then they must stand obliged. But in some contracts, it is rationally supposed that the parties intend to be free if so great an alteration should fall out. But to give instances of both these cases would be too long a work. §39. Question 32: What if something unexpectedly fall out which makes it injurious to a third person? I sure cannot be obliged to injure another. Answer: If the case be the latter mentioned in the foregoing answer, you may be thus free: But if it be the former (you being supposed to run the hazard and secure the other party against all others) then either you were indeed authorized to make this bargain or not: If not, the third person may secure his right against the other. But if you were, then you must make satisfaction as you can to the third person. Yet, if you made a covenant without authority, you are obliged to save the other harmless, unless he knew your power to be doubtful and did resolve to run the hazard. §40. Question 33: What if somewhat fall out which makes the performance to be a sin? Answer: You must not do it: But you must make the other satisfaction for all the loss which you were the cause of unless he undertook to stand to the hazard of this also (explicitly or implicitly). §41. Question 34: Am I obliged if the other break covenant with me? Answer: There are covenants which make relations (as between husband and wife, pastor and flock, rulers and subjects), and covenants which convey title to commodities, of which only I am here to speak. And in these there are some conditions which are essential to the covenant: If the other first break these conditions, you are disobliged. But there are other conditions which are not essential, but only necessary to some following benefit: whose non-performance will only forfeit that particular benefit: and there are conditions which are only undertaken subsequent duties, trusted on the honesty of the performer: And in these a failing does not disoblige you. These latter are but improperly called conditions. §42. Question 35: May I contract to perform a thing which I foresee is like to become impossible or sinful before the time of performance come, though it be not so at present. Answer: With all persons you must deal truly; and with just contractors, openly: But with thieves and murderers, and persecutors, you are not always bound to deal openly. This being premised, either your covenant is absolutely, ‘This I will do, be it lawful or not, possible or impossible’: and such a covenant is sin and folly. Or it is conditional, ‘This I will do, if it continue lawful or possible.’ This condition (or rather exception) is still implied where it is not expressed, unless the contrary be expressed: Therefore such a covenant is lawful with a robber with whom you are not bound to deal openly: because it is but the concealing from him the event which you foresee. As e.g. you have intelligence that a ship is lost at sea, or is like to be shortly taken by pirates, which the robber expects shortly to come safe into the harbor: You may promise him to deliver up yourself his prisoner when that ship comes home. Or you know a person to be mortally sick and will die before the next week: you may oblige yourself to marry or serve that person two months hence: For it is implied if he or she be then alive. But with equal contractors, this is unlawful, with whom you are obliged not only to verity, but to justice, as in the following cases will be further manifested.</p></blockquote>

3A+With+all+persons+you+must+deal+truly%3B+and+with+just+contractors%2C+openly%3A+But+with+thieves+and+murderers%2C+and+persecutors%2C+you+are+not+always+bound+to+deal+openly.+This+being+premised%2C+either+your+covenant+is+absolutely%2C+%E2%80%98This+I+will+do%2C+be+it+lawful+or+not%2C+possible+or+impossible%E2%80%99%3A+and+such+a+covenant+is+sin+and+folly.+Or+it+is+conditional%2C+%E2%80%98This+I+will+do%2C+if+it+continue+lawful+or+possible.%E2%80%99+This+condition+%28or+rather+exception%29+is+still+implied+where+it+is+not+expressed%2C+unless+the+contrary+be+expressed%3A+Therefore+such+a+covenant+is+lawful+with+a+robber+with+whom+you+are+not+bound+to+deal+openly%3A+because+it+is+but+the+concealing+from+him+the+event+which+you+foresee.+As+e.g.+you+have+intelligence+that+a+ship+is+lost+at+sea%2C+or+is+like+to+be+shortly+taken+by+pirates%2C+which+the+robber+expects+shortly+to+come+safe+into+the+harbor%3A+You+may+promise+him+to+deliver+up+yourself+his+prisoner+when+that+ship+comes+home.+Or+you+know+a+person+to+be+mortally+sick+and+will+die+before+the+next+week%3A+you+may+oblige+yourself+to+marry+or+serve+that+person+two+months+hence%3A+For+it+is+implied+if+he+or+she+be+then+alive.+But+with+equal+contractors%2C+this+is+unlawful%2C+with+whom+you+are+obliged+not+only+to+verity%2C+but+to+justice%2C+as+in+the+following+cases+will+be+further+manifested.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%2C+1673%29+%7C+pt.+4%2C+ch.+19%2C+title+2%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F459b617b88.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/459b617b88.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=35.%20Question%2028%3A%20May%20one%20person,following%20cases%20will%20be%20further%20manifested&amp;text=35.%20Question%2028%3A%20May%20one%20person%20disoblige%20another&amp;text=in%20the%20following%20cases%20will%20be%20further%20manifested" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-38f6f0c33e" data-kw="">
<blockquote><p>The third kind of plays are mixed, which stand partly of hazard, and partly of wit, and in which hazard begins the game, and skill gets the victory: and that which defective by reason of hazard, is corrected by wit. To this kind are referred some games at the cards and tables. Now the common opinion of learned Divines is, that as they are not to be commended, so they are not simply to be condemned, and if they be used, they must be used very sparingly. Yet there be others that hold these mixed games to be unlawful, and judge the very dealing of the cards to be a lot, because it is a mere casual action. But (as I take it) the bare dealing of the cards is no more a lot, than the dealing of an alms, when the Prince’s almner puts his hand into his pocket, and gives, for example, to one man six pence, to another twelve pence, to another two pence, what comes forth without any choice. Now this casual distribution is not a lot, but only a casual action. And in a lot there must be two things. The first is, a casual act: the second, the applying of the foresaid act, to the determination of some particular and uncertain event. Now the dealing of the cards is a casual act; but the determination of the uncertain victory is not from the dealing of the cards in mixed games, but from the wit and skill, at least from the will of the players. But in things that are of the nature of a lot, the wit and will and a man has no stroke at all. Nevertheless, though the dealing of the cards and mixed games be no lots; yet it is far safer and better to abstain from them, than to use them, and where they are abolished, they are not to be restored again, because in common experience, many abuses and inconveniences attend upon them: and things unnecessary, when they are much abused, because they are abused, they must not be used, but rather removed, as the brazen serpent was, 2 Kings 18:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Cambridge, 1606), bk. 3, ch. 4, section 4, Question 2, ‘What kinds of recreations and sports are lawful and convenient, and what be unlawful and inconvenient?’, pp. 591-92 Perkins (1558–1602) was a leading English puritan.</span></figcaption>

<blockquote><p>VI. If at the first it were lawful, and afterward become impossible and unlawful. For such oaths God Himself may be said to reverse. Thus if a man bind himself by oath to live in single life without marriage, and after finds that God-has not given him the gift of continency; in this case, his oath becomes impossible to be kept, and therefore, being reversed by God and becoming unlawful, it may be broken without impiety.</p></blockquote>

<blockquote><p>While we would most earnestly inculcate upon you the most conscientious diligence and the most unremitting perseverance in the prosecution of your studies, on the ground of the extent of the field you have to traverse, we would at the same time recommend to you to devote to your professional studies only six days of the week, and to devote the Lord’s day to exercises bearing upon objects common to you with ordinary private Christians, and connected with your own personal growth in righteousness and holiness.

It is true that most of the books which you may be called upon to peruse, and of the subjects to which you may need to direct your attention in the prosecution of your professional studies, may be such as might lawfully or without sin occupy your time and thoughts on the Lord’s day. It is true also that part of your professional studies consists, as we have endeavoured to explain, in applying divine truth to the promotion of your own spiritual nourishment; and that while this is incumbent upon all Christians, it is by special obligations and additional motives incumbent upon students of theology.

It may also be reasonably expected, considering the motives by which you profess to be animated, and the objects you profess to aim at, that the whole prosecution of your studies shall be pervaded by a spirit of prayer, by a sense of your responsibility to and dependence upon God, and by a paramount regard to his glory. But while all this is true, and should not be forgotten or neglected, it is also true that the Lord’s day ought to be devoted more immediately and peculiarly to the promotion of the divine life in your souls.

Your professional studies, directed to the attainment of theological knowledge, ought to be regarded very much as your ordinary lawful occupation, to be diligently prosecuted in the fear of God during the six days on which we are authorised to labour and do all our work, while the seventh should be reserved entirely for Him, who on that day rested from all his works, and should be devoted to exercises and occupations bearing upon the proper relation of men to their common Creator and Redeemer, and the objects which, in virtue of this common relation, they are bound to aim at and to secure.

Your professional studies may rightly occupy the principal share of your time and attention for six days in the week, just like the ordinary lawful secular business of other men; but on the Lord’s day you ought to be chiefly influenced by the consideration, not so much that you are students of theology preparing for the work of the ministry, that you may be made instrumental in promoting the salvation of others, but rather that you are, in common with many of the poorest, humblest, and most illiterate of the human race, believers in the Lord Jesus Christ, who are bound to work out your own salvation with fear and trembling, and to become progressively more meet for the inheritance of the saints in light.

One temptation to which you are exposed, and against which you are called upon to guard, is that of studying the word of God and investigating theological subjects in a merely professional spirit, as if it were a merely intellectual exercise, as if your only object was to increase your knowledge, and thereby to prepare for a creditable examination and a creditable discharge of the ordinary business of the profession you have chosen.

There is a danger in this way of your being led into an irreverent and careless way of thinking and speaking of divine things, and losing sight of the great practical purpose for which all the doctrines of God’s word were revealed. And hence the importance of your sometimes, as it were, throwing off your merely professional character as students of theology, and directing your attention to the word of God and divine things simply as men who are bound to attend to their own personal salvation, to their own spiritual nourishment; and the proper time for securing this object by these means is peculiarly the Lord’s Day.

On these grounds, derived from a regard to your own duty and welfare, requiring that this be attempted some time, and from the objects and end of the Lord’s Day, plainly requiring that it be done then, you should feel it to be incumbent upon you to engage in the public services of the sanctuary, not as critics who have come to learn something that may be useful in your profession, but as hearers of the word, who are anxious to have divine truth more deeply impressed upon your own hearts, and as members of congregations who are called upon to unite in offering up supplications for what you collectively and individually need, and to devote the remainder of the day to the practical and devotional, rather than the critical reading of the word of God, to self-examination, and meditation upon unseen and eternal realities, and to the perusal of works of a practical and devotional character.

That you may enjoy the full benefit of the Lord’s day as a Sabbath, a day of rest, your intellectual powers should not be kept at their full stretch, or occupied with intricate and perplexing speculations. That you may enjoy the full benefit of it as a day set apart for spiritual ends, you must spend it in the public and private exercises of God’s worship, and you must engage in these exercises with a sincere desire to get from them those spiritual blessings which they are intended to convey to all. Thus, and thus only, will you spend the Lord’s Day in accordance with God’s will, and in the way best fitted to promote all the objects you ought to aim at. Thus will you secure that blessing which alone maketh rich and maketh wise.</p></blockquote>

<blockquote><p>The wisdom of God is truly infinite. He seeth “the end from the beginning, and from ancient times the things that are not yet done.” — (Isa. xlvi. 10.) He unerringly adapts all agencies, whether material or mental, to their work, and overrules them to the accomplishment of his eternal purposes at the time and in the way he had foreseen and appointed.

Consequently the means which he employs for attaining any proposed end can never fail. His dispensations always fulfil their mission. His institutions unfailingly effect the precise purposes for which they were established; though we may not be able in all cases to discern what these purposes were, nor how they have been accomplished. Nay more: divine ordinances do not merely fulfil their special and primary objects, but, while realizing these, they are designed and calculated to promote many other beneficial ends.

The highest effort of human wisdom is to devise means which may, with certainty, accomplish some single purpose; and all experience testifies how seldom this measure of success is attained. But such are the inexhaustible resources of divine wisdom, that His appointed means. His institutions, never fail to confer almost countless blessings on those who reverently observe them; so that, amid this multiplicity of attendant blessings, it is often difficult to distinguish between those which were primarily, and those which were indirectly, designed to be bestowed.

Thus it is with the Sabbath. Tried by this test, it approves itself to be truly a divine ordinance. It has not only answered the special purposes of heavenly wisdom and love to man in its appointment; it has at the same time been attended with so many other beneficent results, that one often feels at a loss to determine which of these are the special blessings its divine Founder intended it primarily to confer, and which are the supplementary ones that follow in their train.

How numerous, varied, and precious are the objects which the Sabbath, from the day of its institution, was designed to accomplish! Under the PATRIARCHAL dispensation it was a mute but eloquent witness for the existence of God, his unity, his creative power, his sovereignty over his creatures, and their responsibility to him. Under the MOSAIC economy, the Sabbath bore continued testimony not only to these truths, but also to the providential and moral government of God in its preservation and re-enactment, and his supreme light to the homage and worship of his people; it bore testimony to his beneficent regard for their temporal and eternal welfare; it taught them to look, through its hallowed use, for blessings on themselves and their nation; and it indicated a future period which would be pregnant with richer blessings and ennobled with a purer worship.

Under the Christian dispensation, while all these fundamental truths are still emphatically inculcated by the Sabbath, it has moreover become a memorial of redeeming love — a witness for the completion of that “better covenant” which was ratified by the resurrection of its Surety — a remembrance of Him “who died for our sins, and rose again for our justification” — an attestation to the deity of Him who had “power to lay down his life, and power to take it again” on this day — and a manifestation of His kingly prerogatives when he proclaimed himself to be the “Lord of the Sabbath.”

It has become a source of still more precious blessings to the people of God, refreshing, edifying, sanctifying them; a season for meditating on past sin and present infirmity, and for rejoicing in a finished salvation and a purchased inheritance. And it still continues to be a type of that heavenly “Sabbath that remaineth to the people of God,” and one of the most efficient means of preparing them for its enjoyment.

These are some of the primary and special ends which the Lord of the Sabbath had in view when he instituted it, and which it has never failed to answer. But, true to its divine origin, a long train of attendant blessings, corporeal and mental, intellectual and moral, personal and domestic, social and national, temporal and eternal, flow from its sanctified observance.</p></blockquote>

— James Seaton Reid, Indirect Influence of the Sabbath on the General Prosperity of Nations; and Especially on their Intelligence, Trade and Commerce, Social Order and Liberties in The Christian Sabbath, Considered in its Various Aspects by Ministers of Different Denominations. With Preface by the Hon. and Rev. Baptist ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+wisdom+of+God+is+truly+infinite.+He+seeth+%E2%80%9Cthe+end+from+the+beginning%2C+and+from+ancient+times+the+things+that+are+not+yet+done.%E2%80%9D+%E2%80%94+%28Isa.+xlvi.+10.%29+He+unerringly+adapts+all+agencies%2C+whether+material+or+mental%2C+to+their+work%2C+and+overrules+them+to+the+accomplishment+of+his+eternal+purposes+at+the+time+and+in+the+way+he+had+foreseen+and+appointed.%0A%0AConsequently+the+means+which+he+employs+for+attaining+any+proposed+end+can+never+fail.+His+dispensations+always+fulfil+their+mission.+His+institutions+unfailingly+effect+the+precise+purposes+for+which+they+were+established%3B+though+we+may+not+be+able+in+all+cases+to+discern+what+these+purposes+were%2C+nor+how+they+have+been+accomplished.+Nay+more%3A+divine+ordinances+do+not+merely+fulfil+their+special+and+primary+objects%2C+but%2C+while+realizing+these%2C+they+are+designed+and+calculated+to+promote+many+other+beneficial+ends.%0A%0AThe+highest+effort+of+human+wisdom+is+to+devise+means+which+may%2C+with+certainty%2C+accomplish+some+single+purpose%3B+and+all+experience+testifies+how+seldom+this+measure+of+success+is+attained.+But+such+are+the+inexhaustible+resources+of+divine+wisdom%2C+that+His+appointed+means.+His+institutions%2C+never+fail+to+confer+almost+countless+blessings+on+those+who+reverently+observe+them%3B+so+that%2C+amid+this+multiplicity+of+attendant+blessings%2C+it+is+often+difficult+to+distinguish+between+those+which+were+primarily%2C+and+those+which+were+indirectly%2C+designed+to+be+bestowed.%0A%0AThus+it+is+with+the+Sabbath.+Tried+by+this+test%2C+it+approves+itself+to+be+truly+a+divine+ordinance.+It+has+not+only+answered+the+special+purposes+of+heavenly+wisdom+and+love+to+man+in+its+appointment%3B+it+has+at+the+same+time+been+attended+with+so+many+other+beneficent+results%2C+that+one+often+feels+at+a+loss+to+determine+which+of+these+are+the+special+blessings+its+divine+Founder+intended+it+primarily+to+confer%2C+and+which+are+the+supplementary+ones+that+follow+in+their+train.%0A%0AHow+numerous%2C+varied%2C+and+precious+are+the+objects+which+the+Sabbath%2C+from+the+day+of+its+institution%2C+was+designed+to+accomplish%21+Under+the+PATRIARCHAL+dispensation+it+was+a+mute+but+eloquent+witness+for+the+existence+of+God%2C+his+unity%2C+his+creative+power%2C+his+sovereignty+over+his+creatures%2C+and+their+responsibility+to+him.+Under+the+MOSAIC+economy%2C+the+Sabbath+bore+continued+testimony+not+only+to+these+truths%2C+but+also+to+the+providential+and+moral+government+of+God+in+its+preservation+and+re-enactment%2C+and+his+supreme+light+to+the+homage+and+worship+of+his+people%3B+it+bore+testimony+to+his+beneficent+regard+for+their+temporal+and+eternal+welfare%3B+it+taught+them+to+look%2C+through+its+hallowed+use%2C+for+blessings+on+themselves+and+their+nation%3B+and+it+indicated+a+future+period+which+would+be+pregnant+with+richer+blessings+and+ennobled+with+a+purer+worship.%0A%0AUnder+the+Christian+dispensation%2C+while+all+these+fundamental+truths+are+still+emphatically+inculcated+by+the+Sabbath%2C+it+has+moreover+become+a+memorial+of+redeeming+love+%E2%80%94+a+witness+for+the+completion+of+that+%E2%80%9Cbetter+covenant%E2%80%9D+which+was+ratified+by+the+resurrection+of+its+Surety+%E2%80%94+a+remembrance+of+Him+%E2%80%9Cwho+died+for+our+sins%2C+and+rose+again+for+our+justification%E2%80%9D+%E2%80%94+an+attestation+to+the+deity+of+Him+who+had+%E2%80%9Cpower+to+lay+down+his+life%2C+and+power+to+take+it+again%E2%80%9D+on+this+day+%E2%80%94+and+a+manifestation+of+His+kingly+prerogatives+when+he+proclaimed+himself+to+be+the+%E2%80%9CLord+of+the+Sabbath.%E2%80%9D%0A%0AIt+has+become+a+source+of+still+more+precious+blessings+to+the+people+of+God%2C+refreshing%2C+edifying%2C+sanctifying+them%3B+a+season+for+meditating+on+past+sin+and+present+infirmity%2C+and+for+rejoicing+in+a+finished+salvation+and+a+purchased+inheritance.+And+it+still+continues+to+be+a+type+of+that+heavenly+%E2%80%9CSabbath+that+remaineth+to+the+people+of+God%2C%E2%80%9D+and+one+of+the+most+efficient+means+of+preparing+them+for+its+enjoyment.%0A%0AThese+are+some+of+the+primary+and+special+ends+which+the+Lord+of+the+Sabbath+had+in+view+when+he+instituted+it%2C+and+which+it+has+never+failed+to+answer.+But%2C+true+to+its+divine+origin%2C+a+long+train+of+attendant+blessings%2C+corporeal+and+mental%2C+intellectual+and+moral%2C+personal+and+domestic%2C+social+and+national%2C+temporal+and+eternal%2C+flow+from+its+sanctified+observance.%E2%80%9D%0A%0A%E2%80%94+James+Seaton+Reid%2C+Indirect+Influence+of+the+Sabbath+on+the+General+Prosperity+of+Nations%3B+and+Especially+on+their+Intelligence%2C+Trade+and+Commerce%2C+Social+Order+and+Liberties+in+The+Christian+Sabbath%2C+Considered+in+its+Various+Aspects+by+Ministers+of+Different+Denominations.+With+Preface+by+the+Hon.+and+Rev.+Baptist+&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F08d6be3524.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/08d6be3524.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/01/23/james-seaton-reid-on-the-wisdom-of-god-and-the-institution-of-the-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The heart is the thing He chiefly calls for, expects, and eyes in all our performances… When we pray unto Him, praise Him, sing Psalms (2 Chron. 7:14; Isa. 26:9; Ps. 9:1; Col. 3:16; 1 Chron. 30:19), let’s do it with the heart. When we read or hear his Word, receive the Sacrament, or celebrate any other ordinance; let’s do it with the heart.</p></blockquote>

</figure><figure class="quote" id="q-3801e70079" data-kw="">
<blockquote><p>Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude</cite>, verse 19 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 24</span></figcaption>

%20who%20will%20forbear,and%20imperfections%20of%20worshippers%20and%20worship&amp;text=Must%20not%20he%20who%20will%20forbear%20communion%20with&amp;text=all%20mixtures%20and%20imperfections%20of%20worshippers%20and%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-897cf9c1de" data-kw="">
<blockquote><p>I must confess that I can see no way to prevent the growing effects of our fatal distempers, except God so bless the Government by law established, with that spirit of Discretion, of Moderation, of Equity, and of Lowliness in all things which it doth act, that none shall be able to find any just grievance at it.

And to this effect, the less the Classical Presbyteries shall resemble the Civil Courts of Judicature, or the Bishop’s Courts in former time, the more they will be suitable to the end for which they are instituted, which is, to entertain Brotherly conferences and consultations about spiritual matters for mutual assistance and support in the ways of God; and not at all to intermeddle with the Congregations in any of their particular affairs, which are not voluntarily brought unto them as a Case wherein their Judgement is sought unto; for no particular Church, by its subordination to a Classis, is to be deprived of any right which it hath within it self, but is rather thereby to be maintained therein.

The Maxims then of spiritual Communion to be observed in the Classical Presbyteries, that all misconstructions of their ways which occasion jealousies and clamours, may be prevented, ought to be published, to wipe away the fears which ensuare us into distractions against the duties of Love. And it will be necessary not only to publish those Maxims for this end; but three other things more must be satisfactorily, and from the grounds of Scripture cleared, if ever the Government shall prosper, to settle us in Peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t</cite>, (London: John Bellamy, 1647), preface to the reader.</span></figcaption>

</figure><figure class="quote" id="q-2b6558c35a" data-kw="">
<blockquote><p>When writing in opposition to the British government’s proposed scheme of National Education in Ireland, The Orthodox Presbyterian periodical, which Henry Cooke (among others) edited, reminded its readers that governments should establish the true religion and refuse to patronise false religion:

We are of that old fashioned school who maintain, that Governments may and should patronize and support true religion, and religious education, and neither must nor should patronize and support a false and unscriptural system. Moreover we do maintain, that when Governments, upon any pretence whatsoever, patronize or establish an unscriptural system, those Governments become partners in the sin, and will be made, if they repent not, “partakers of the plague,” which God will pour out upon every system of error and sin.

Still farther do we assert our conviction, that the people who stupidly or negligently acquiesce in the sins of the Government will, at the bar of providence and judgment, stand chargeable with the guilt. We therefore call upon the people, by respectful, honest, and bold petition, so to express their opinions, that should the Parliament proceed to establish Popery, and re-marry the nation to the long divorced errors and plagues of Rome, the people may stand unconnected with the guilt of the deed.</p></blockquote>

</figure><figure class="quote" id="q-0d46314e2f" data-kw="">
<blockquote><p>The Jewish subordinations, being no temple ordnances, nor typical or ceremonial, do in the moral equity of them concern us as well as them; at least we may with much more reason urge an argument, a pari ratione [from the reason of parity], from subordinations in the Jewish Church to prove a subordination still; then our brethren can argue from thence against it: For the grounds of that subordination being from moral equity; and the ends and necessity of it being the same, now as then (viz. revolving difficult cases, ordering matters of common concernment, reforming offences in inferior societies, receiving appeals, redressing of injuries and neglect in mal-administration, etc.) the same reason still remains, that for the same ends and purposes, there should be subordinations now in the Chrisitan Church that was then in the Jewish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons presented by the Dissenting Brethren against certain propositions concerning presbyterial government</cite>, … Together with the answer of the Assembly of Divines to those reasons of Dissent (London, T.R., 1648), p. 147</span></figcaption>

</figure><figure class="quote" id="q-5499325dd5" data-kw="">
<blockquote><p>When the light of the Gospel from the Lamp of Luther did begin to shine in all the corners of Germany high and low, the aforementioned unhappy men Stock and Müntzer, did begin also to breath out a pestiferous vapor for to overcloud that Golden candlestick. Satan and Antichrist his child got no so powerful assistance against the Spirit of God in Luther from the Emperor Charles, although the far greatest prince who these five hundred years did sway the imperial scepter, nor from all the Bishops of Germany, though the most potent clergy that is or ever has been in Christendom, as from these two obscure and ignorant creatures: for so strong and perverse a Devil did enter into them, as did put them into a very fair way not only to have extingui­shed the candle of Reformation so soon as ever it began to shine, but also to have turned the remainder of light that was in all Christendom into palpable darkness (G). The spirit of Mohammad was no more hellish in setting afoot most gross errors, and countenancing abominable lusts; nor was it any thing so much hellish in making an open trade of bloodshed, robbery, confusion and Catholic oppression through the whole earth, as the spirit of Anabaptism. This great and severe sentence will be made good enough in the following narrative by such abundance of satisfa­ctory testimonies, as may convince the greatest favorers of these men among us. At the beginning the Anabaptists put on the visor of a great deal more then ordinary piety, zeal, and honesty: in prayer and meditation they were very frequent and long, their discourses were only of matters Divine, the errors and superstitions of the time were to them abominations; for life and conversation, they seemed to be composed of all virtue; in their apparel poor and base; in their behavior and speech exceeding humble and grave; for charity towards all in want, singularly liberal (H). The er­rors they had, seemed to be very harmless and innocent; they urged not only a reformation of corruptions, but the building of a church wholly new; they pressed that what ever had been in popery might all be cast away; that new churches might be ga­thered consisting only of saints. Besides the Scripture, they pro­fessed new revelations; they required all their followers to re­nounce their former baptism, and of new to be baptized; they spoke much of patient suffering the crosse, of the unlawfulness to resist injuries, or to punish by the sword any crime; they cried down all wars, yea all magistracy, all judicatories as unjust; they preached much for the liberty of the people, and against the grievous burdens wherewith the great ones did load the backs of the poor commons; they cried up an equality among all the sons of Adam, that none might lord it over his brethren; also that all goods ought to be common among Christians, that none might want, and none be tempted with superfluity. So long as they kept themselves within these bounds, ortho­dox preachers were content to deal with them lovingly by con­ferences and disputations, to keep the sword of the magistrate off them (l), and none was a more diligent solicitor of their indem­nity then Luther with all the princes of his acquaintance (K). But behold the fruits of this indulgence, Stock and Müntzer are encouraged thereby to go on, in the space of three years they did disperse their cockle and tares over all Germany, the people eve­ry where fell in passionate love with their doctrine (L): the masters beholding the unexpected number and zeal of their dis­ciples, without further delay did bring out all their mysteries, and what before they had delivered in corners, and in the night time to handfuls of people apart, being then confident of their strength, they brought it out to the world before the sun, and boldly did begin to put all their speculations in practice. They declared that they were prophets sent by God to teach the world the way to heaven, that after fasting and prayer they were inspired with revelations no less sure then Scripture, which all were to believe and follow under the pain of damnation: that Luther and all the orthodox preachers were false prophets, worse then the Pope and his clergy; that all princes and magi­strates must needs lay down their charges, and become equal with the meanest; that all rich persons behoved to give in their wealth, that all goods might be equally distributed; that the time of the Saints reign upon earth was come; that whosoever refu­sed to enter into their society, to be re-baptized and to become members of their Churches, were without all pity to be killed. That God had revealed all this to them, and much more of this kind; that he had given them a commission to execute presently this his will. Hereupon they did arm and began very nimbly to rob and kill all about them as cursed Canaanites. This leaven did quickly run along many provinces: many thousands, especially of the gentry were massacred and their houses burnt over their heads before they could get themselves in a posture of de­fense. (M) Luther perceiving the horrible and unexpected malignity of that Devil who led this people, began at last to bestirre himself, and to show to the world the abominations of that way which before he had too much neglected; he did then exhort all magistrates and people to defend the gospel, their lives and goods against these wicked hypocrites (N). Incontinent the princes and cities did arm and every where run upon these enraged furies, they recompensed their ways upon their own heads, killing them where ever they could be found. In Suabland, Lor­raine, and Francony, there were in one Summer slain at least 50,000 yeomen (O), and as some authors relate it, a hundred thou­sand (P), yea some report 150,000. (Q), who corrupted with the seditious principles of their false Teachers, made insurrection every where against the magistrate. At that same time Müntzer gathered together 8,000 of the common people in Thuringia, against whom the gracious Princes Johann Frederick Elector Saxony, and Philip of Hesse ddi march: Müntzer persuaded his followers of a most certain victory, assuring that he would inter­cept in his cloak all the bullets of the enemies’ cannon; but when it came to action the vanity of his promises did appear, 5,000 of that misled multitude were killed on the place, the rest fled, Müntzer was taken prisoner, and having confessed his error did suffer death, but in a faithless, faint, and discouraged way (R).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“When the light of the Gospel from the Lamp of Luther did begin to shine in all the corners of Germany high and low, the aforementioned unhappy men Stock and Müntzer, did begin also to breath out a pestiferous vapor for to overcloud that Golden candlestick. Satan and Antichrist his child got no so powerful assistance against the Spirit of God in Luther from the Emperor Charles, although the far greatest prince who these five hundred years did sway the imperial scepter, nor from all the Bishops of Germany, though the most potent clergy that is or ever has been in Christendom, as from these two obscure and ignorant creatures: for so strong and perverse a Devil did enter into them, as did put them into a very fair way not only to have extingui­shed the candle of Reformation so soon as ever it began to shine, but also to have turned the remainder of light that was in all Christendom into palpable darkness (G). The spirit of Mohammad was no more hellish in setting afoot most gross errors, and countenancing abominable lusts; nor was it any thing so much hellish in making an open trade of bloodshed, robbery, confusion and Catholic oppression through the whole earth, as the spirit of Anabaptism. This great and severe sentence will be made good enough in the following narrative by such abundance of satisfa­ctory testimonies, as may convince the greatest favorers of these men among us. At the beginning the Anabaptists put on the visor of a great deal more then ordinary piety, zeal, and honesty: in prayer and meditation they were very frequent and long, their discourses were only of matters Divine, the errors and superstitions of the time were to them abominations; for life and conversation, they seemed to be composed of all virtue; in their apparel poor and base; in their behavior and speech exceeding humble and grave; for charity towards all in want, singularly liberal (H). The er­rors they had, seemed to be very harmless and innocent; they urged not only a reformation of corruptions, but the building of a church wholly new; they pressed that what ever had been in popery might all be cast away; that new churches might be ga­thered consisting only of saints. Besides the Scripture, they pro­fessed new revelations; they required all their followers to re­nounce their former baptism, and of new to be baptized; they spoke much of patient suffering the crosse, of the unlawfulness to resist injuries, or to punish by the sword any crime; they cried down all wars, yea all magistracy, all judicatories as unjust; they preached much for the liberty of the people, and against the grievous burdens wherewith the great ones did load the backs of the poor commons; they cried up an equality among all the sons of Adam, that none might lord it over his brethren; also that all goods ought to be common among Christians, that none might want, and none be tempted with superfluity. So long as they kept themselves within these bounds, ortho­dox preachers were content to deal with them lovingly by con­ferences and disputations, to keep the sword of the magistrate off them (l), and none was a more diligent solicitor of their indem­nity then Luther with all the princes of his acquaintance (K). But behold the fruits of this indulgence, Stock and Müntzer are encouraged thereby to go on, in the space of three years they did disperse their cockle and tares over all Germany, the people eve­ry where fell in passionate love with their doctrine (L): the masters beholding the unexpected number and zeal of their dis­ciples, without further delay did bring out all their mysteries, and what before they had delivered in corners, and in the night time to handfuls of people apart, being then confident of their strength, they brought it out to the world before the sun, and boldly did begin to put all their speculations in practice. They declared that they were prophets sent by God to teach the world the way to heaven, that after fasting and prayer they were inspired with revelations no less sure then Scripture, which all were to believe and follow under the pain of damnation: that Luther and all the orthodox preachers were false prophets, worse then the Pope and his clergy; that all princes and magi­strates must needs lay down their charges, and become equal with the meanest; that all rich persons behoved to give in their wealth, that all goods might be equally distributed; that the time of the Saints reign upon earth was come; that whosoever refu­sed to enter into their society, to be re-baptized and to become members of their Churches, were without all pity to be killed. That God had revealed all this to them, and much more of this kind; that he had given them a commission to execute presently this his will. Hereupon they did arm and began very nimbly to rob and kill all about them as cursed Canaanites. This leaven did quickly run along many provinces: many thousands, especially of the gentry were massacred and their houses burnt over their heads before they could get themselves in a posture of de­fense. (M) Luther perceiving the horrible and unexpected malignity of that Devil who led this people, began at last to bestirre himself, and to show to the world the abominations of that way which before he had too much neglected; he did then exhort all magistrates and people to defend the gospel, their lives and goods against these wicked hypocrites (N). Incontinent the princes and cities did arm and every where run upon these enraged furies, they recompensed their ways upon their own heads, killing them where ever they could be found. In Suabland, Lor­raine, and Francony, there were in one Summer slain at least 50,000 yeomen (O), and as some authors relate it, a hundred thou­sand (P), yea some report 150,000. (Q), who corrupted with the seditious principles of their false Teachers, made insurrection every where against the magistrate. At that same time Müntzer gathered together 8,000 of the common people in Thuringia, against whom the gracious Princes Johann Frederick Elector Saxony, and Philip of Hesse ddi march: Müntzer persuaded his followers of a most certain victory, assuring that he would inter­cept in his cloak all the bullets of the enemies’ cannon; but when it came to action the vanity of his promises did appear, 5,000 of that misled multitude were killed on the place, the rest fled, Müntzer was taken prisoner, and having confessed his error did suffer death, but in a faithless, faint, and discouraged way (R).”

— Robert Baillie, Anabaptism, The True Fountain of Independency, Brownisme, Antinomy, Familism, and the most of the other Errors Which For The Time Do Trouble the Church of England, Unsealed, (London, 1647), 3–6. NB: For ease of reading and because archaic spelling tend to make older writers seem unintelligent, the sp">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+the+light+of+the+Gospel+from+the+Lamp+of+Luther+did+begin+to+shine+in+all+the+corners+of+Germany+high+and+low%2C+the+aforementioned+unhappy+men+Stock+and+M%C3%BCntzer%2C+did+begin+also+to+breath+out+a+pestiferous+vapor+for+to+overcloud+that+Golden+candlestick.+Satan+and+Antichrist+his+child+got+no+so+powerful+assistance+against+the+Spirit+of+God+in+Luther+from+the+Emperor+Charles%2C+although+the+far+greatest+prince+who+these+five+hundred+years+did+sway+the+imperial+scepter%2C+nor+from+all+the+Bishops+of+Germany%2C+though+the+most+potent+clergy+that+is+or+ever+has+been+in+Christendom%2C+as+from+these+two+obscure+and+ignorant+creatures%3A+for+so+strong+and+perverse+a+Devil+did+enter+into+them%2C+as+did+put+them+into+a+very+fair+way+not+only+to+have+extingui%C2%ADshed+the+candle+of+Reformation+so+soon+as+ever+it+began+to+shine%2C+but+also+to+have+turned+the+remainder+of+light+that+was+in+all+Christendom+into+palpable+darkness+%28G%29.+The+spirit+of+Mohammad+was+no+more+hellish+in+setting+afoot+most+gross+errors%2C+and+countenancing+abominable+lusts%3B+nor+was+it+any+thing+so+much+hellish+in+making+an+open+trade+of+bloodshed%2C+robbery%2C+confusion+and+Catholic+oppression+through+the+whole+earth%2C+as+the+spirit+of+Anabaptism.+This+great+and+severe+sentence+will+be+made+good+enough+in+the+following+narrative+by+such+abundance+of+satisfa%C2%ADctory+testimonies%2C+as+may+convince+the+greatest+favorers+of+these+men+among+us.+At+the+beginning+the+Anabaptists+put+on+the+visor+of+a+great+deal+more+then+ordinary+piety%2C+zeal%2C+and+honesty%3A+in+prayer+and+meditation+they+were+very+frequent+and+long%2C+their+discourses+were+only+of+matters+Divine%2C+the+errors+and+superstitions+of+the+time+were+to+them+abominations%3B+for+life+and+conversation%2C+they+seemed+to+be+composed+of+all+virtue%3B+in+their+apparel+poor+and+base%3B+in+their+behavior+and+speech+exceeding+humble+and+grave%3B+for+charity+towards+all+in+want%2C+singularly+liberal+%28H%29.+The+er%C2%ADrors+they+had%2C+seemed+to+be+very+harmless+and+innocent%3B+they+urged+not+only+a+reformation+of+corruptions%2C+but+the+building+of+a+church+wholly+new%3B+they+pressed+that+what+ever+had+been+in+popery+might+all+be+cast+away%3B+that+new+churches+might+be+ga%C2%ADthered+consisting+only+of+saints.+Besides+the+Scripture%2C+they+pro%C2%ADfessed+new+revelations%3B+they+required+all+their+followers+to+re%C2%ADnounce+their+former+baptism%2C+and+of+new+to+be+baptized%3B+they+spoke+much+of+patient+suffering+the+crosse%2C+of+the+unlawfulness+to+resist+injuries%2C+or+to+punish+by+the+sword+any+crime%3B+they+cried+down+all+wars%2C+yea+all+magistracy%2C+all+judicatories+as+unjust%3B+they+preached+much+for+the+liberty+of+the+people%2C+and+against+the+grievous+burdens+wherewith+the+great+ones+did+load+the+backs+of+the+poor+commons%3B+they+cried+up+an+equality+among+all+the+sons+of+Adam%2C+that+none+might+lord+it+over+his+brethren%3B+also+that+all+goods+ought+to+be+common+among+Christians%2C+that+none+might+want%2C+and+none+be+tempted+with+superfluity.+So+long+as+they+kept+themselves+within+these+bounds%2C+ortho%C2%ADdox+preachers+were+content+to+deal+with+them+lovingly+by+con%C2%ADferences+and+disputations%2C+to+keep+the+sword+of+the+magistrate+off+them+%28l%29%2C+and+none+was+a+more+diligent+solicitor+of+their+indem%C2%ADnity+then+Luther+with+all+the+princes+of+his+acquaintance+%28K%29.+But+behold+the+fruits+of+this+indulgence%2C+Stock+and+M%C3%BCntzer+are+encouraged+thereby+to+go+on%2C+in+the+space+of+three+years+they+did+disperse+their+cockle+and+tares+over+all+Germany%2C+the+people+eve%C2%ADry+where+fell+in+passionate+love+with+their+doctrine+%28L%29%3A+the+masters+beholding+the+unexpected+number+and+zeal+of+their+dis%C2%ADciples%2C+without+further+delay+did+bring+out+all+their+mysteries%2C+and+what+before+they+had+delivered+in+corners%2C+and+in+the+night+time+to+handfuls+of+people+apart%2C+being+then+confident+of+their+strength%2C+they+brought+it+out+to+the+world+before+the+sun%2C+and+boldly+did+begin+to+put+all+their+speculations+in+practice.+They+declared+that+they+were+prophets+sent+by+God+to+teach+the+world+the+way+to+heaven%2C+that+after+fasting+and+prayer+they+were+inspired+with+revelations+no+less+sure+then+Scripture%2C+which+all+were+to+believe+and+follow+under+the+pain+of+damnation%3A+that+Luther+and+all+the+orthodox+preachers+were+false+prophets%2C+worse+then+the+Pope+and+his+clergy%3B+that+all+princes+and+magi%C2%ADstrates+must+needs+lay+down+their+charges%2C+and+become+equal+with+the+meanest%3B+that+all+rich+persons+behoved+to+give+in+their+wealth%2C+that+all+goods+might+be+equally+distributed%3B+that+the+time+of+the+Saints+reign+upon+earth+was+come%3B+that+whosoever+refu%C2%ADsed+to+enter+into+their+society%2C+to+be+re-baptized+and+to+become+members+of+their+Churches%2C+were+without+all+pity+to+be+killed.+That+God+had+revealed+all+this+to+them%2C+and+much+more+of+this+kind%3B+that+he+had+given+them+a+commission+to+execute+presently+this+his+will.+Hereupon+they+did+arm+and+began+very+nimbly+to+rob+and+kill+all+about+them+as+cursed+Canaanites.+This+leaven+did+quickly+run+along+many+provinces%3A+many+thousands%2C+especially+of+the+gentry+were+massacred+and+their+houses+burnt+over+their+heads+before+they+could+get+themselves+in+a+posture+of+de%C2%ADfense.+%28M%29+Luther+perceiving+the+horrible+and+unexpected+malignity+of+that+Devil+who+led+this+people%2C+began+at+last+to+bestirre+himself%2C+and+to+show+to+the+world+the+abominations+of+that+way+which+before+he+had+too+much+neglected%3B+he+did+then+exhort+all+magistrates+and+people+to+defend+the+gospel%2C+their+lives+and+goods+against+these+wicked+hypocrites+%28N%29.+Incontinent+the+princes+and+cities+did+arm+and+every+where+run+upon+these+enraged+furies%2C+they+recompensed+their+ways+upon+their+own+heads%2C+killing+them+where+ever+they+could+be+found.+In+Suabland%2C+Lor%C2%ADraine%2C+and+Francony%2C+there+were+in+one+Summer+slain+at+least+50%2C000+yeomen+%28O%29%2C+and+as+some+authors+relate+it%2C+a+hundred+thou%C2%ADsand+%28P%29%2C+yea+some+report+150%2C000.+%28Q%29%2C+who+corrupted+with+the+seditious+principles+of+their+false+Teachers%2C+made+insurrection+every+where+against+the+magistrate.+At+that+same+time+M%C3%BCntzer+gathered+together+8%2C000+of+the+common+people+in+Thuringia%2C+against+whom+the+gracious+Princes+Johann+Frederick+Elector+Saxony%2C+and+Philip+of+Hesse+ddi+march%3A+M%C3%BCntzer+persuaded+his+followers+of+a+most+certain+victory%2C+assuring+that+he+would+inter%C2%ADcept+in+his+cloak+all+the+bullets+of+the+enemies%E2%80%99+cannon%3B+but+when+it+came+to+action+the+vanity+of+his+promises+did+appear%2C+5%2C000+of+that+misled+multitude+were+killed+on+the+place%2C+the+rest+fled%2C+M%C3%BCntzer+was+taken+prisoner%2C+and+having+confessed+his+error+did+suffer+death%2C+but+in+a+faithless%2C+faint%2C+and+discouraged+way+%28R%29.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed%2C+%28London%2C+1647%29%2C+3%E2%80%936.+NB%3A+For+ease+of+reading+and+because+archaic+spelling+tend+to+make+older+writers+seem+unintelligent%2C+the+sp&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5499325dd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5499325dd5.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/05/baillie-versus-tombes-2-how-the-particular-baptists-appeared-to-early-presbyterians/" rel="noopener" target="_blank">Rea

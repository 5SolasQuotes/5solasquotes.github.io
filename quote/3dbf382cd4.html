<main class="wrap"><figure class="quote" id="q-3dbf382cd4" data-kw="">
<blockquote><p>Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (London [1649]), ch. 11, ‘Of the Obliging Power of Conscience’, p. 135 &amp; passim</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-427ad26475" data-kw="">
<blockquote><p>Controversy I: Is there implicit faith? Orthodox Position: Implicit faith, that is, intricate and not explicit, exists in two ways: 1. Regarding knowledge, when the things necessary for salvation are not sufficiently understood distinctly, as seen in the disciples of Christ, who imagined a worldly kingdom. Similarly, today, in many of the elect, there is a multitude of ignorance forgiven because they know the foundation of salvation. 2. Regarding the apprehension of Christ and His benefits, when at the time of first conversion and temptation, faith wavers (Isaiah 42:3; Matthew 5:6). Here, the desire to believe is accompanied by infinite sighs, which God approves (Romans 8:26). Position of Bellarmine: Implicit faith is that in which one agrees with the Church and professes to believe what the Church and its pastors believe. The Church is the pillar of truth, and the pastors who agree with the Roman Pope cannot err. Censure: Knowledge is of the essence of faith (Isaiah 53:11; John 17:3). Furthermore, the Church is called the pillar of truth not by inspiring authority but by the ministry of preserving and witnessing. Finally, there is a fallacy of begging the question involved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)</cite></span></figcaption>

</figure><figure class="quote" id="q-73b14e759d" data-kw="">
<blockquote><p>For men to give blind obedience unto the commands of superiors, though it pretend to humility and devout submission of mind, yet it is not real humility, but a prostituting of our souls and consciences to the wills of men; So this humility or submissive disposition, which was their second pretence, has but a shew of wisdom in it, and is not real.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Philippians &amp; Colossians (Edinburgh: Higgins, 1656), Col. 2, verse 23, ‘Which things have indeed a show of wisdom in will-worship and humility, and neglecting of the body, not in any honor to the satisfying of the flesh’</cite>, p. 205</span></figcaption>

— James Fergusson, A Brief Exposition of the Epistles of Paul to the Philippians &amp; Colossians (Edinburgh: Higgins, 1656), Col. 2, verse 23, ‘Which things have indeed a show of wisdom in will-worship and humility, and neglecting of the body, not in any honor to the satisfying of the flesh’, p. 205">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+men+to+give+blind+obedience+unto+the+commands+of+superiors%2C+though+it+pretend+to+humility+and+devout+submission+of+mind%2C+yet+it+is+not+real+humility%2C+but+a+prostituting+of+our+souls+and+consciences+to+the+wills+of+men%3B+So+this+humility+or+submissive+disposition%2C+which+was+their+second+pretence%2C+has+but+a+shew+of+wisdom+in+it%2C+and+is+not+real.%E2%80%9D%0A%0A%E2%80%94+James+Fergusson%2C+A+Brief+Exposition+of+the+Epistles+of+Paul+to+the+Philippians+%26+Colossians+%28Edinburgh%3A+Higgins%2C+1656%29%2C+Col.+2%2C+verse+23%2C+%E2%80%98Which+things+have+indeed+a+show+of+wisdom+in+will-worship+and+humility%2C+and+neglecting+of+the+body%2C+not+in+any+honor+to+the+satisfying+of+the+flesh%E2%80%99%2C+p.+205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F73b14e759d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/73b14e759d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-implicit-faith-obedience/#:~:text=For%20men%20to%20give%20blind%20obedience,in%20it%2C%20and%20is%20not%20real&amp;text=For%20men%20to%20give%20blind%20obedience%20unto%20the&amp;text=of%20wisdom%20in%20it%2C%20and%20is%20not%20real" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3c5bf74804" data-kw="">
<blockquote><p>And having first corrupted [Church] government from the primitive simplicity, and made princes their lictors [jailors and executioners] (as [Hugo] Grotius speaks in that excellent epistle newly translated by Mr. Barksdale), they next corrupt doctrine and worship consequently. For tyrants must have their wills in everything: and numerous and needless laws and canons must be made to show their power and fulfil their wills, that they may be lawgivers and a rule to all the world. And when they have made a seeming necessity of doing things unnecessary, then to plead the necessity which they have made, is the sum of all their arguments. And they that are against strict and precise adhering to the Scriptures, or observance of God’s own commands, are yet so strict for obedience to their proud imperious wills that they persuade themselves and others that without it there can be no order, no unity, no peace, but rebellion and confusion: And so they cry up obedience, obedience, that their idol wills may be bowed to by all without control; And when they are mere usurpers, and use no power given them by God, they yet get the advantage of making all odious that obey them not in the least and greatest matters, by the names of schism, unruliness or such like. O say the Papal usurpers, ‘The Church must be obeyed, or there will be no order: Disobedience in small matters is no small sin,’ when they have set up an idol-power against Christ; as if to disobey Him, whose laws they make void by their traditions and usurpations were a lesser fault. And when they have departed as far from the Christian simplicity in doctrine, government and worship, as their voluminous councils and decretals, and missals differ from the ancient simple Christianity, and have made as many snares and engines to divide and tear the Church of Christ as there are noxious (that I say not needless) laws, canons, and decrees imposed as necessary to peace and concord, then no men’s mouths are more opened against schism, when they have unavoidably caused it, yea are the greatest schismatics; And no men call so loud for unity and concord, as they that have first made it a thing impossible. … … 2. Have they not room enough to show their power, and work enough to do in seeing to the execution of Christ’s own universal laws and preserving mere order and decency in undetermined circumstances, that all may be done to edification? 3. Does not every needless oath and subscription by which they would tie men faster to themselves in controvertible cases, plainly tend to undermine themselves and keep up still a conscientious party against them? For while men have nothing to do but live quietly under a government, they will be glad of peace: But when they are put to subscribe, declare, covenant and swear that all this is good or lawful, or that they will never be against it, it sets men unavoidably on the deepest studies of the case, and so all the people are set on trying and judging of that, which else they would never have meddled with: For what honest man will say, swear or promise he knows not what? Even as some crafty rebels would undermine princes by drawing them to put the controverted parts of their prerogative into the subjects’ oaths, that so they may make all the people students and judges of the cause, and unavoidably make factions and dissenters, that else would have lived quietly if they might: so do the Papal clergy ruin themselves by such over-doing impositions. I remember Lampridius tells us that Alexander Severus (that great enemy of injustice) was so severe that he would have made a law to regulate men’s apparel: But Ulpian changed his mind by telling him that many laws cause divisions and make occasions of disobedience. They cry out, ‘There will be no order if ministers and people be left to their own discretion in such and such circumstantials;’ but do they dream of perfect concord on earth? and that men of such various interests, tempers, educations, converse and degrees of knowledge should not differ in a word or gesture? Our English rulers make no laws what gesture shall be used in singing Psalms, or in hearing sermons, and there is no division or great disorder in them: But if on pretence of nearer concord, they should tie all to one gesture, this or that, we should presently find it an engine of division. And O how many such engines have the Papal clergy made and used long! and to what purpose? To silence faithful ministers, to torment faithful Christians in the inquisitions, to brand the best men with the names of heretics and schismatics, to gratify all profaneness and malignity, to quench brotherly love, and to tear the Church into pieces; and no experience will make them wiser.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.</cite></span></figcaption>

— Richard Baxter, Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+having+first+corrupted+%5BChurch%5D+government+from+the+primitive+simplicity%2C+and+made+princes+their+lictors+%5Bjailors+and+executioners%5D+%28as+%5BHugo%5D+Grotius+speaks+in+that+excellent+epistle+newly+translated+by+Mr.+Barksdale%29%2C+they+next+corrupt+doctrine+and+worship+consequently.+For+tyrants+must+have+their+wills+in+everything%3A+and+numerous+and+needless+laws+and+canons+must+be+made+to+show+their+power+and+fulfil+their+wills%2C+that+they+may+be+lawgivers+and+a+rule+to+all+the+world.+And+when+they+have+made+a+seeming+necessity+of+doing+things+unnecessary%2C+then+to+plead+the+necessity+which+they+have+made%2C+is+the+sum+of+all+their+arguments.+And+they+that+are+against+strict+and+precise+adhering+to+the+Scriptures%2C+or+observance+of+God%E2%80%99s+own+commands%2C+are+yet+so+strict+for+obedience+to+their+proud+imperious+wills+that+they+persuade+themselves+and+others+that+without+it+there+can+be+no+order%2C+no+unity%2C+no+peace%2C+but+rebellion+and+confusion%3A+And+so+they+cry+up+obedience%2C+obedience%2C+that+their+idol+wills+may+be+bowed+to+by+all+without+control%3B+And+when+they+are+mere+usurpers%2C+and+use+no+power+given+them+by+God%2C+they+yet+get+the+advantage+of+making+all+odious+that+obey+them+not+in+the+least+and+greatest+matters%2C+by+the+names+of+schism%2C+unruliness+or+such+like.+O+say+the+Papal+usurpers%2C+%E2%80%98The+Church+must+be+obeyed%2C+or+there+will+be+no+order%3A+Disobedience+in+small+matters+is+no+small+sin%2C%E2%80%99+when+they+have+set+up+an+idol-power+against+Christ%3B+as+if+to+disobey+Him%2C+whose+laws+they+make+void+by+their+traditions+and+usurpations+were+a+lesser+fault.+And+when+they+have+departed+as+far+from+the+Christian+simplicity+in+doctrine%2C+government+and+worship%2C+as+their+voluminous+councils+and+decretals%2C+and+missals+differ+from+the+ancient+simple+Christianity%2C+and+have+made+as+many+snares+and+engines+to+divide+and+tear+the+Church+of+Christ+as+there+are+noxious+%28that+I+say+not+needless%29+laws%2C+canons%2C+and+decrees+imposed+as+necessary+to+peace+and+concord%2C+then+no+men%E2%80%99s+mouths+are+more+opened+against+schism%2C+when+they+have+unavoidably+caused+it%2C+yea+are+the+greatest+schismatics%3B+And+no+men+call+so+loud+for+unity+and+concord%2C+as+they+that+have+first+made+it+a+thing+impossible.+%E2%80%A6+%E2%80%A6+2.+Have+they+not+room+enough+to+show+their+power%2C+and+work+enough+to+do+in+seeing+to+the+execution+of+Christ%E2%80%99s+own+universal+laws+and+preserving+mere+order+and+decency+in+undetermined+circumstances%2C+that+all+may+be+done+to+edification%3F+3.+Does+not+every+needless+oath+and+subscription+by+which+they+would+tie+men+faster+to+themselves+in+controvertible+cases%2C+plainly+tend+to+undermine+themselves+and+keep+up+still+a+conscientious+party+against+them%3F+For+while+men+have+nothing+to+do+but+live+quietly+under+a+government%2C+they+will+be+glad+of+peace%3A+But+when+they+are+put+to+subscribe%2C+declare%2C+covenant+and+swear+that+all+this+is+good+or+lawful%2C+or+that+they+will+never+be+against+it%2C+it+sets+men+unavoidably+on+the+deepest+studies+of+the+case%2C+and+so+all+the+people+are+set+on+trying+and+judging+of+that%2C+which+else+they+would+never+have+meddled+with%3A+For+what+honest+man+will+say%2C+swear+or+promise+he+knows+not+what%3F+Even+as+some+crafty+rebels+would+undermine+princes+by+drawing+them+to+put+the+controverted+parts+of+their+prerogative+into+the+subjects%E2%80%99+oaths%2C+that+so+they+may+make+all+the+people+students+and+judges+of+the+cause%2C+and+unavoidably+make+factions+and+dissenters%2C+that+else+would+have+lived+quietly+if+they+might%3A+so+do+the+Papal+clergy+ruin+themselves+by+such+over-doing+impositions.+I+remember+Lampridius+tells+us+that+Alexander+Severus+%28that+great+enemy+of+injustice%29+was+so+severe+that+he+would+have+made+a+law+to+regulate+men%E2%80%99s+apparel%3A+But+Ulpian+changed+his+mind+by+telling+him+that+many+laws+cause+divisions+and+make+occasions+of+disobedience.+They+cry+out%2C+%E2%80%98There+will+be+no+order+if+ministers+and+people+be+left+to+their+own+discretion+in+such+and+such+circumstantials%3B%E2%80%99+but+do+they+dream+of+perfect+concord+on+earth%3F+and+that+men+of+such+various+interests%2C+tempers%2C+educations%2C+converse+and+degrees+of+knowledge+should+not+differ+in+a+word+or+gesture%3F+Our+English+rulers+make+no+laws+what+gesture+shall+be+used+in+singing+Psalms%2C+or+in+hearing+sermons%2C+and+there+is+no+division+or+great+disorder+in+them%3A+But+if+on+pretence+of+nearer+concord%2C+they+should+tie+all+to+one+gesture%2C+this+or+that%2C+we+should+presently+find+it+an+engine+of+division.+And+O+how+many+such+engines+have+the+Papal+clergy+made+and+used+long%21+and+to+what+purpose%3F+To+silence+faithful+ministers%2C+to+torment+faithful+Christians+in+the+inquisitions%2C+to+brand+the+best+men+with+the+names+of+heretics+and+schismatics%2C+to+gratify+all+profaneness+and+malignity%2C+to+quench+brotherly+love%2C+and+to+tear+the+Church+into+pieces%3B+and+no+experience+will+make+them+wiser.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology%2C+Plain%2C+Pure%2C+Peaceable...+%28London%3A+White%2C+1675%29%2C+Preface%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c5bf74804.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c5bf74804.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-implicit-faith-obedience/#:~:text=And%20having%20first%20corrupted%20%5BChurch%5D%20government,no%20experience%20will%20make%20them%20wiser&amp;text=And%20having%20first%20corrupted%20%5BChurch%5D%20government%20from%20the&amp;text=pieces%3B%20and%20no%20experience%20will%20make%20them%20wiser" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

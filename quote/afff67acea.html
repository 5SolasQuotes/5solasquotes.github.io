<blockquote><p>Then Thirdly, In the third Article of our Solemn League and Covenant, we are bound to stand fast in the Defence, and to maintain the Liberties of the Church, and Privileges of the Kingdom, as We are Men and Christians. We have observed this, that some will plead on this Article of the Covenant for owning a Popish King: But O! is there not an express Condition and Qualification there, that we shall own no Magistrates over us, but in subordination to the Law of GOD, and those who will give us security for our Religion and Liberty: And have we not the Laws of GOD against Tyranny, and also the Laws of the Land, which we are bound to maintain every Soul of us; and now we do subscribe ourselves Breakers of it, when we own a Papist. Now have we performed this? Ay, ay, it may be some Ministers and Professors will say they have; but if we have done it, then what meaneth the bleating of the sheep, and lowing of the oxen? What meaneth the lowing of the Bulls of Bashan? What meant the Wicked walking on every side? And what means the Bloodshed?

All these things do Witness against us, if We have keeped this Article in refusing to set up Magistrates over us without security given for our Religion and Liberty: Neither was it Required of him, now when he is set up, and hath Arrogate to himself an absolute power; by virtue whereof he hath stopped and disabled all our Penal statutes made against Idolaters: and is intending to [Rob] us of all Privileges and Liberties, as we are Men and Christians. And if we have maintained and Defended our Privileges as we are Men and Christians, then what meaneth the great Oppression both of Bodies and Consciences in the Land? What meaneth the [Crushing] of many poor people under heavy Burdens and great Bondage. Nay, we are obliged to cut off Idolaters: The Idolater should be put to Death, according to the Law of GOD; and those Penal statutes in the Old Testament are not abrogated yet, for they are Moral.

Fourthly, In the Fourth Article of the solemn League and Covenant, we are bound to bring the Malignant Enemies of GOD to Condign punishment. By the Law of GOD Idolaters should die the Death; and Murderers should Die the Death; that the Land should not be defiled with Blood: Well have we done this? ay, ay, Ministers and Professors will say they have done it: But if we have performed this, then what meaneth the bleating of the sheep, and lowing of the Oxen? if we have Endeavoured to bring the Enemies of GOD to condign Punishment: Then what means the setting them up in places of Power and Trust, and instead of bringing Idolaters and Murderers to punishment, We have set them up Confederate with them, and taken Protection from them, and instead of bringing them to punishment, we have maintained them:

For what’s your Cess but a Grassing of Antichrist’s Bulls to push and destroy the LORDs people. The Devil has so many Oxen to Feed, and he Requires you to Feed them, that they may tread down the Work of GOD: and where is there any that stands up and justifies themselves? O is that a keeping of the Covenant, to maintain its Destroyers? And is that a bringing of these Enemies, Idolaters and Murderers to punishment, to Feed them, and Confederate with them? O ye have made thereby an unhappy Conjunction.</p></blockquote>

<blockquote><p>Nomist.

Tell me what is that Law which this Faith doth not make void?

Evangelist.

You must know that there were three sorts of Laws delivered by God to Moses.

1. Ceremonial; which were temporary Ordinances and Rites really pointing to Christ, of whom they were figures and shadows; and by whose presence and death they were all fulfilled, terminated and abrogated; Christ was finis inter ficiens legis Ceremonialis; so that the law of Ceremonies was made void by the Doctrine of faith, and therefore this law cannot be here meant.

2. Judicial, which were peculiar Ordinances given by God to Moses, for the well-ordering of the Common-wealth of Israel.

This Law concerned the Jews not simply, as men, but as Jews; the National, personal, or particular binding right of this Law rested so in them, that it died with the decay of their Common-wealth: only the common equity or right hereof remaineth (i) as far as it was grounded on the Law of Nature, served directly to confirm any of the Ten Commandments, or to uphold the good of Family, Church, or Common-wealth, it is still in force, and of good use; but of this Law the Apostle in this Scripture makes no mention: Now if he speak not of the Law Ceremonial, nor of the Law Judicial, it followeth that we must understand him speaking of the Law—

3. Moral, and that not as it is a rule of Justification, but a rule of Service and Obedience; the whole compass of man’s duty respectively to be manifested, is principally contained in the Law Moral; which is no other then the revealed Copy of God’s will touching man’s duty, laid down in the ten Commandments: if we do cast our eyes upon the scope of the Apostle, it will be very evident that he speaketh of this Law; for he deals against such who sought to be justified and saved by the works of the Law, and not by faith in Jesus Christ; they went about to set up the Law of Works, and to destroy the Law of Faith.

Now Paul sheweth that no man’s conformity to the Moral Law could be matter of life and justification unto him in God’s sight; The Law, by sin, is become weak and unprofitable to the purpose of righteousness, it could not be a covenant of life unto man; now having excluded it from being a covenant of life to sinners, there were those who would have it to be disannulled from being a rule of life unto men, which the Apostle will not admit of, so that its plain that the vindication is of the Moral Law, that, as a rule of life is not made void unto Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sedgwick.html">John Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antinomianism Anatomized. Or, A Glass for the Lawless: Who deny the Ruling use of the Moral Law unto Christians under the Gospel</cite>, (London: Samuel Gellibrand, 1643), pp 7-8.</span></figcaption>

<blockquote><p>§29 The Decalogue has been prescribed for all people to the extent that it agrees with and explains the common law of nature for all peoples. It has also been renewed and confirmed by Christ our king. Jerome Zanchius says that this is the common judgement of theologians (De Redemptione, I, 10, 1 [actually thesis 1 of the second section (“De legibus humanis“) of Chapter 10].)… §30 Proper law (lex propia) is the law that is drawn up and established by the magistrate on the basis of common law (lex communis) and according to the nature, utility, condition, and other special circumstances of his country. It indicates the peculiar way, means, and manner by which this natural equity among men can be upheld, observed, and cultivated in any given commonwealth. Therefore, proper law (jus proprium) is nothing other than the practice of this common natural law (jus naturale) as adapted to a particular polity. It indicates how individual citizens of a given commonwealth are able to seek and attain this natural equity. Whence it is called the servant and handmaiden of common law (jus commune), and a teacher leading us to the observance of common law. §31 Proper law is established for two principal reasons, as Zanchius says [De Redemptione, I, 11, 1]. The first reason is that not all men have sufficient natural capacity that they are able to draw from these general principles of common law the particular conclusions and laws suitable to the nature and condition of an activity and its circumstances. The second reason is that natural law is not so completely written on the hearts of men that it is sufficiently efficacious in restraining men from evil and impelling them to good… In this sense, it is said that “law is set forth not for the just, but the unjust.” (1 Tim. 1:9) §32 There are two parts of this [proper] law. The first is its agreement with common law, and the second is its difference, as Francis Junius observes (De Politicae Mosis Observatione) and the jurists teach (In commentaries on the Digest I, 1, 4)… Its agreement (convenientia) with common law is in those matters common to each law, namely, in the starting point from which analogical deductions are made, in the subject under consideration, and in the purpose… The purpose of each [common and proper law] is justice and piety, or sanctity, and the same equity and common good in human society. Its difference (discrepantia) from common law arises from the fact that, in accommodation to particular and special circumstances, it departs somewhat from common law, adding or subtracting something from it. Proper law differs for two reasons, each of which provides a necessity for adding or subtracting something from common law. And so mutability, or the possibility and necessity of just changes, is introduced… Since the nature and condition of these circumstances may be diverse, inconstant, and changeable, it is not possible for proper law to acknowledge one and the same disposition of common law for everything and in everything, as Junius and Zanchius, together with the jurists, say. Therefore, this law is rightly said to be mutable or subject to change with respect to circumstances and its consequent difference from common law. But it is altogether immutable with respect to its agreement with common law. So the jurists assert together with Junius, Zanchius, Martyr, and Bucer. Thus common or moral law concludes from its principles that evildoers ought to be punished, but proposes nothing concerning the punishment. Proper law determines specifically that adulterers, murderers, and the like are to be punished by death, unless the punishment should be mitigated because of further circumstances. Various punishments, for example, exist in the Mosaic Law for these crimes… For this reason, the moral precepts of the Decalogue, having no certain, special, and fixed punishment attached to them, are general. The forensic and political law then makes specific determinations, which it relates to the circumstances of any act. §34 This proper law is one thing among the Jews, another among the Romans, another among the Germans today, and still another among other peoples… §35 Jewish proper law is twofold. It is in part ceremonial, and in part forensic or judicial… §37 The forensic [judicial] law was the means by which the Jews were informed and instructed to observe and obey both Tables, or the common law, for the cultivation of human society among them in their polity, according to the circumstances of things, persons, place, and time… §40 It should be observed that often one and the same law of the Jews could be said in varying respects to be moral (or common), ceremonial, and forensic, and to this extent mixed. What is moral in such a law is perpetual; what is judicial can be changed by the change of circumstances… … Ch. 22, §3 From these things it follows that the magistrate is obligated in the administration of the commonwealth to the proper law of Moses so far as moral equity or common law are expressed therein. This is to say, he is required to conform to everything therein that is in harmony with common law. But he is by no means required to conform in those things in which the proper law of Moses, in order to be accommodated to the polity of the Jews, differs from common law. §4 For if the magistrate should establish as absolutely necessary these proper Jewish laws, which by their nature are either changeable or obsolete, he would destroy christian liberty, which has been given for edification to him and to others, and would entangle himself and others in the yoke of slavery. Thereby he would make a necessity of something free, and impede consciences by a grievous and dangerous snare. He would obtrude mortal laws, which were promulgated in former times only for the Jewish people and are by their nature subject to change for a variety of reasons, as if they were immortal. And unless proper laws are changed with the changing circumstances because of which they broadly exist, they become wicked and attain neither to the equity of the Second Table of the Decalogue nor the piety of the First. Thus they cease to contain the common foundation of right reason. Accordingly, the magistrate who makes the proper law of Moses compulsory in his commonwealth sins grievously. For those particular circumstances and considerations because of which the Jewish proper law was promulgated should bear no weight in his commonwealth…</p></blockquote>

<blockquote><p>THE occasion of these words [Luke 13:5] of our Lord and Saviour Jesus Christ, was because there were certain that shewed him of the Galileans, whose blood Pilate had mingled with their own Sacrifices: That is, murdered them as they were sacrificing: and so their blood was mingled with the blood of the beasts which were sacrificed. Those men therefore, though that these Galileans were greater sinners then all other Galileans, because they had suffered such things. And that those xviii. also, upon whom the Tower in Siloam fell and slew them, were sinners above all men, that dwelt in Jerusalem. Wherein they did utter a secret corruption naturally engendered in all men, that is very sharply to see into the sins of others, &amp; severely to censure them: but in the meane while to flatter themselves, &amp; to be blindfold in seeing their own sins.

For these men thought, because the like judgments did not fall upon them, therefore they were safe enough, they were not so great sinners but rather highly in the favour of GOD. According as many do falsely suppose, that those are always the worst sort of people whom God doth most strike, and press with his punishing hand, having forgotten that God doth not keep an ordinary rate here below, to punish every man as he is worst, or to favour and cocker him as he is best, but only taketh some examples as he thinketh good, for the instruction and advertisement of all others, and to be as it were looking glasses, wherein every man may see his own face, yea, and his own cause handled, &amp; that God is a severe revenger of sin, that all men may learn by the example of some, to tremble &amp; beware, least peradventure they be worthily constrained to keep their own turns, and to know what they have deserved.</p></blockquote>

in%2C+that+all+men+may+learn+by+the+example+of+some%2C+to+tremble+%26+beware%2C+least+peradventure+they+be+worthily+constrained+to+keep+their+own+turns%2C+and+to+know+what+they+have+deserved.%E2%80%9D%0A%0A%E2%80%94+Arthur+Dent%2C+A+sermon+of+repentance.+A+very+godly+and+profitable+Sermon%2C+preached+at+Lee+in+Essex%2C+by+Arthur+Dent%2C+Minister+of+God%E2%80%99s+word.+And+published+at+the+request+of+sundry+Godly+and+well+disposed+persons.+1581.+the+7.+of+March%2C+%28London%3A+John+Harison%2C+1582%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ebece8f7c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ebece8f7c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/21/arthur-dent-on-evil-judging-and-self-flattery/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

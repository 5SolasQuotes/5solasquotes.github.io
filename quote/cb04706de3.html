<blockquote><p>This is the commandment which is contradicted by many, and is assaulted with highly elevated shields. If many would have had it in their power, it would have long been forgotten and rejected. As is true for all other commandments, it is still read to the congregation on every sabbath day as a rule of life, in spite of all who regret this.

The words of this commandment contain: 1) a short exhortation; 2) a declaration; and 3) incentives for observance.

First of all there is a short exhortation: ― “Remember the sabbath day, to keep it holy” (Exod 20:8).

At the very outset a nota bene is placed; that is, a word of great emphasis, which ought to make a deep impression upon our hearts. ― “Remember,” that is, see to it that you do not contradict, reject, or forget this commandment. Remember it prior to the arrival of that day in order that you may order your affairs in such a manner that nothing will hinder you; prepare yourself for this day ahead of time. Be exhorted and be warned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 139.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-355accd44f" data-kw="">
<blockquote><p>If a sinner, being justified, has all things at once that are necessary for salvation? And if personal holiness, and progress in holy obedience, is not necessary to a justified persons’s possession of glory, in case of his continuing in life after his justification? …[F]or though the believer’s progress in holy obedience, by reason of the many stops interruptions, and assaults he frequently meets with from Satan, the world, and in-dwelling corruption, is far from being alike at all times, yet ‘the path of the just,’ though he frequently fall, will be ‘as the shining light, that shineth more and more unto the perfect day.’ Though he may, at time ‘become weary and faint in his mind,’ yet he shall he, by waiting on the Lord, ‘renew his strength, and mount up as with eagles’ wings,’ &amp;c. But still the believer has all this in and from Christ: for whence can our progress in holiness come, but from the supply of his Spirit? Our walking in holy obedience, and every good motion of ours, must be in him, and from him, who is the Way and the Life, who is our head of influences, and the fountain of our strength, and who ‘works in us both to will and to do.’ ‘Abide in me,’ says he ‘and I in you. For without me ye can do nothing. If a man abide not in me, he is cast forth as a branch, and is withered.’ But if the meaning of the query be, of such a necessity of holy obedience, in order to the possession of glory, as imports any kind of causality, we dare not answer in the affirmative; for we cannot look on personal holiness, or good works, as properly federal and conditional means of obtaining the possession of heaven, though we own they are necessary to make us meet for it. These answers, contained in this and the preceding pages, (viz. of the manuscript given in,) are subscribed at Edinburgh, March 12th, 1722, by us, James Hog, Carnock. Thomas Boston, Etterick. John Williamson, Inveresk. James Kid, Queensferry. Gabriel Wilson, Maxton. Ebenezer Erskine, Portmoack. Ralph Erskine, Dunfermline. James Wardlaw, Dunfermline. Henry Davidson, Galashiels. James Bathgate, Orwel. William Hunter, Lillieslead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, ed. Thomas Boston (Scotland, UK: Christian Focus Publications, repr. 2009), 358, 376.</span></figcaption>

</figure><figure class="quote" id="q-04365c1711" data-kw="">
<blockquote><p>Ob. But then Servants and Youth shall have no time of liberty to refresh themselves; visit their friends, and mend their apparel.

A. 1 The Sabbath or Lord’s day is a day of rest from servile labour appointed by the Lord himself, yet may not be spent any part of it in carnal delights, but wholly in religious exercises. 2 Other time I read of none in the Scripture. 3 I am well contented, there should be sometime allowed by the State for that end, and if not, sure I am, Masters and Governors of families ought to allow some convenient time to their servants for such occasions, and do freely do so my self.</p></blockquote>

<blockquote><p>We have in our congregation a large Catechism which contains a fuller explanation of the main documents (hoofstucken) of nearly the whole of religion. Every Sunday afternoon this is required by memory of the older children in order, and this is then explained with Scripture evidence by the pastor from the pulpit in the presence of the whole congregation, after he has explain his text of Scripture for about a half hour. In this way not only the children but also the whole congregation are exercised, taught, and confirmed in the special main documents of the Christian religion.</p></blockquote>

<blockquote><p>§19. Question 12. If another man deceive me into a promise or covenant against my good, am I bound to perform it when I have discovered the deceit? Answer: Yes, 1. in case that the law of the land or other reasons for the public good require it; 2. Or in case that you were faulty by negligence, heedlessness, or otherwise guilty of your own deceit, in any considerable and avoidable degree. Otherwise, in that measure that he deceived you, and in those respects you are not obliged. §20. Question 13. If the contracting parties do neither of them understand the other, is it a covenant: or if it be, whose sense must carry it? Answer: If they understand not each other in the essentials of the contract, it is no contract, in point of conscience: except where the laws, for the public safety, do annex the obligation to the bare external act. But if they understand not one another in some circumstances, and be equally culpable or innocent, they must come to a new agreement in those particulars: But if one party only be guilty of the misunderstanding, he must bear the loss if the other insist on it. … §22. Question 15. If I say I will give such or such a one this or that, am I bound thereby to do it? Answer: It is one thing to express your present mind and resolution without giving away the liberty of changing it: And it’s another thing to intend the obliging of yourself to do the thing mentioned, and that obligation is either intended to man or to God only; and that is either in point of rendition and use, or in point of veracity, or the performance of that moral duty of speaking truth. If you meant no more in saying, ‘I will do it,’ or ‘I will give it,’ but that this is your present will and purpose and resolution, yea, though it add the confident persuasion that your will shall not change, yet this no further obliges you than you are obliged to continue in that will: And a man’s confident resolutions may lawfully be changed upon sufficient cause. But if you intended to alienate the title to another, or to give him present right, or to oblige yourself for the future to him by that promise; or to oblige yourself to God to do it by way of peremptory assertion, as one that will be guilty of a lie if you perform it not; or if you dedicate the thing to God by those words as a vow, then you are obliged to do accordingly (supposing nothing else to prohibit it).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§19. Question 12. If another man deceive me into a promise or covenant against my good, am I bound to perform it when I have discovered the deceit? Answer: Yes, 1. in case that the law of the land or other reasons for the public good require it; 2. Or in case that you were faulty by negligence, heedlessness, or otherwise guilty of your own deceit, in any considerable and avoidable degree. Otherwise, in that measure that he deceived you, and in those respects you are not obliged. §20. Question 13. If the contracting parties do neither of them understand the other, is it a covenant: or if it be, whose sense must carry it? Answer: If they understand not each other in the essentials of the contract, it is no contract, in point of conscience: except where the laws, for the public safety, do annex the obligation to the bare external act. But if they understand not one another in some circumstances, and be equally culpable or innocent, they must come to a new agreement in those particulars: But if one party only be guilty of the misunderstanding, he must bear the loss if the other insist on it. … §22. Question 15. If I say I will give such or such a one this or that, am I bound thereby to do it? Answer: It is one thing to express your present mind and resolution without giving away the liberty of changing it: And it’s another thing to intend the obliging of yourself to do the thing mentioned, and that obligation is either intended to man or to God only; and that is either in point of rendition and use, or in point of veracity, or the performance of that moral duty of speaking truth. If you meant no more in saying, ‘I will do it,’ or ‘I will give it,’ but that this is your present will and purpose and resolution, yea, though it add the confident persuasion that your will shall not change, yet this no further obliges you than you are obliged to continue in that will: And a man’s confident resolutions may lawfully be changed upon sufficient cause. But if you intended to alienate the title to another, or to give him present right, or to oblige yourself for the future to him by that promise; or to oblige yourself to God to do it by way of peremptory assertion, as one that will be guilty of a lie if you perform it not; or if you dedicate the thing to God by those words as a vow, then you are obliged to do accordingly (supposing nothing else to prohibit it).”

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 117">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A719.+Question+12.+If+another+man+deceive+me+into+a+promise+or+covenant+against+my+good%2C+am+I+bound+to+perform+it+when+I+have+discovered+the+deceit%3F+Answer%3A+Yes%2C+1.+in+case+that+the+law+of+the+land+or+other+reasons+for+the+public+good+require+it%3B+2.+Or+in+case+that+you+were+faulty+by+negligence%2C+heedlessness%2C+or+otherwise+guilty+of+your+own+deceit%2C+in+any+considerable+and+avoidable+degree.+Otherwise%2C+in+that+measure+that+he+deceived+you%2C+and+in+those+respects+you+are+not+obliged.+%C2%A720.+Question+13.+If+the+contracting+parties+do+neither+of+them+understand+the+other%2C+is+it+a+covenant%3A+or+if+it+be%2C+whose+sense+must+carry+it%3F+Answer%3A+If+they+understand+not+each+other+in+the+essentials+of+the+contract%2C+it+is+no+contract%2C+in+point+of+conscience%3A+except+where+the+laws%2C+for+the+public+safety%2C+do+annex+the+obligation+to+the+bare+external+act.+But+if+they+understand+not+one+another+in+some+circumstances%2C+and+be+equally+culpable+or+innocent%2C+they+must+come+to+a+new+agreement+in+those+particulars%3A+But+if+one+party+only+be+guilty+of+the+misunderstanding%2C+he+must+bear+the+loss+if+the+other+insist+on+it.+%E2%80%A6+%C2%A722.+Question+15.+If+I+say+I+will+give+such+or+such+a+one+this+or+that%2C+am+I+bound+thereby+to+do+it%3F+Answer%3A+It+is+one+thing+to+express+your+present+mind+and+resolution+without+giving+away+the+liberty+of+changing+it%3A+And+it%E2%80%99s+another+thing+to+intend+the+obliging+of+yourself+to+do+the+thing+mentioned%2C+and+that+obligation+is+either+intended+to+man+or+to+God+only%3B+and+that+is+either+in+point+of+rendition+and+use%2C+or+in+point+of+veracity%2C+or+the+performance+of+that+moral+duty+of+speaking+truth.+If+you+meant+no+more+in+saying%2C+%E2%80%98I+will+do+it%2C%E2%80%99+or+%E2%80%98I+will+give+it%2C%E2%80%99+but+that+this+is+your+present+will+and+purpose+and+resolution%2C+yea%2C+though+it+add+the+confident+persuasion+that+your+will+shall+not+change%2C+yet+this+no+further+obliges+you+than+you+are+obliged+to+continue+in+that+will%3A+And+a+man%E2%80%99s+confident+resolutions+may+lawfully+be+changed+upon+sufficient+cause.+But+if+you+intended+to+alienate+the+title+to+another%2C+or+to+give+him+present+right%2C+or+to+oblige+yourself+for+the+future+to+him+by+that+promise%3B+or+to+oblige+yourself+to+God+to+do+it+by+way+of+peremptory+assertion%2C+as+one+that+will+be+guilty+of+a+lie+if+you+perform+it+not%3B+or+if+you+dedicate+the+thing+to+God+by+those+words+as+a+vow%2C+then+you+are+obliged+to+do+accordingly+%28supposing+nothing+else+to+prohibit+it%29.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%28London%2C+1673%29+%7C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+117&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd635f46709.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d635f46709.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=19.%20Question%2012.%20If%20another%20man,supposing%20nothing%20else%20to%20prohibit%20it&amp;text=19.%20Question%2012.%20If%20another%20man%20deceive%20me&amp;text=do%20accordingly%20%28supposing%20nothing%20else%20to%20prohibit%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-d28781669c" data-kw="">
<blockquote><p>2nd Proposition. There may be different sentiments without separation. And hence the apostle exhorts all to “forbear one another in love” (Eph. 4:1-6), and to “walk by the same rule whereunto we have already attained.” [Phil. 3:15-16] If the sentiments of all were the same, there had not been need for any such exhortation. As long as we see but in part, as we think others should allow us to differ from them, we ought to forbear such as differ from us, I mean in things not fundamental.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession</cite>, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 2, In which sundry propositions anent separation are laid down</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Wherever Christ comes He brings division, not only between man and Himself, but between man and man, and between church and church; of which disturbance Christ is no more the cause than medicine is of trouble in a diseased body. Harmful agents are the real cause, for the purpose of medicine is to bring health.</p></blockquote>

</figure><figure class="quote" id="q-97f57827ec" data-kw="">
<blockquote><p>Beware also of spending your time and spirits in debates and vain janglings one with another, to be temptations one to another, raising your own and others passions and corruptions instead of holy conference that might minister grace to the hearers. Mind well the apostle’s caveats in 1 Tim. 1:4-7; 5:13; 6:3-5; 2 Tim. 2:16-17; 1 Thess. 4:11. Is it not observable that the greatest sticklers in differences, the greatest disputers and contenders are usually the most distempered and barren hearted? like the mountains of Gilboa, high and hot indeed, but dry and unfruitful; warm, but withered; the unkindly, foolish, heat of division and debate, eating out the life, sap and native heat of real religion, which evanishes then into airy notions and litigious strivings, whereof no edification comes. O let not religion fly up from your hearts to your heads and evaporate into airy foams and forms and turn vapid and insipid. Be sure by questions and disputes as well the power of religion is enervated as the majesty of it infringed. The many disputes about religion commonly overthrows the practice of it, which consists not in discourses, but in doing. It is easy for a formal, moth-eaten Christian to hold up in the one, while he cannot bear up in the other, as Seneca observed anent moral virtue, Omnes disputare malunt, quam vivere, more prone are people to debate about the things of God, than to practice what is uncontroverted. If heaven could be obtained, and God pleased with jangling and debates, a profane sophister should sooner have the one and do the other than a holy Christian who knows that it is not talking of, but walking in the ways of God’s commandments that is most acceptable in his sight. But to say no more, listen to the apostle’s oracle in 1 Cor. 11:16, ‘If any man seem to be contentious, we have no such custom, nor the Churches of God.’ Love perverse disputings who will (which ever corrupts the mind), flee ye them as death, 1 Tim. 6:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 165-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-536663c18e" data-kw="">
<blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. Joel Beeke, tr. Todd Rester (Reformation Heritage Books), vol. 5, bk. 7, ch. 1, §35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

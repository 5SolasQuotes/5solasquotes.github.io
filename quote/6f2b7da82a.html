<main class="wrap"><figure class="quote" id="q-6f2b7da82a" data-kw="">
<blockquote><p>Now, my friend, the question is not, whether you have any sin, or the whole body of sin within you; but, whether you have a principle of grace, lusting against it, and acting in opposition to it. I say, a principle of grace, for I believe that persons unrenewed may experience the strivings, and the powerful workings of the Spirit of God. But the real Christian has a holy principle implanted in every faculty of the soul, in opposition to the body of sin, called by the apostle, “the law of the mind,” — “his mind,” — “the spirit,” — “the divine nature,” — “the new creature,” — “the new man.” Now this is the knot, I apprehend, you want to be untied, and the difficulty which perplexes you. You want to have solved, the difference between the workings of this principle against sin, and the workings of natural conscience enlightened, and of every thing else which an unrenewed man may experience.

Consider attentively the following observations: 1. Conscience unrenewed condemns sin and the sinner; but grace mortifies sin and saves the sinner. 2. Conscience is partial and blind, condemning only some sins; but grace is universal in its aim, at least, and endeavour in mortifying every sin and the whole body of sin. 3. Conscience acts only at intervals, and is temporary; but grace is permanent and lasting. 4. Conscience may condemn with real hatred any one sin as sin; but grace hates it altogether and irreconcilably; therefore nothing will satisfy it less than the total destruction of sin.

5. There is an impotency in the workings of the natural conscience, and it is soon discouraged; but grace deals much with Christ and his gospel, finds strength to help in time of need, and is unwearied as well as courageous, in its lusting and warring against sin. The language of grace is evermore, “In the Lord have I righteousness and strength.” It will not therefore yield or give over until it has obtained a complete victory and deliverance. 6. There is nothing of true genuine humility in the workings of natural conscience; but it is peevish, and murmuring, and at variance with God, His law, and His Providence: but grace is supple, rolls in the dust, and is sweetly humble, and falls in, as it were naturally, with God and His ways, with His law, Gospel, and Providence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Difference between Conscience and Grace in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>

<blockquote><p>77. It is certain that we must attempt nothing in all our actions whereof we are not certain that it pleases God: whatsoever is done otherwise, does make us guilty before God. The apostle says, ‘Blessed is he that condemneth not himself in that which he alloweth.’ Whereupon it comes to pass that he that judges and condemns anything, and yet admits it, or puts it in practice, he is damned [condemned], because he does it not of faith.

78. Conscience has that virtue and power that if some work being of it own nature indifferent, if the conscience be good, it makes the work also to be good: and contrariwise, if the conscience be evil, it makes the work also evil.

79. But yet nevertheless it cannot be that any work, being evil in its own nature, may by our conscience be made good. For whatsoever conscience thou hast, yet when thou doest forswear thyself, or when thou committest adultery, thou doest grievously sin. Wherefore the force of conscience has power only in things indifferent, and also in those actions, which of their own nature are good.

80. And amongst these things, somewhat may seem to be against a man’s conscience, or unlawful two ways. First, uncertainly and doubtfully, without full assent, persuasion or resolution; namely, when a man doubts or is uncertain, whether something be lawful, or not. Secondly, determinately and absolutely with a resolved persuasion, to wit, when a man is certainly persuaded that something is simply lawful, albeit by error of conscience, or upon false and erroneous grounds.

81. If anything appears to be unlawful unto a man uncertainly and doubtfully, he is to abstain from doing of it of himself, so long as he is at his owne free choice and liberty, till his doubts be removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, … (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, p. 86 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics… If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them.</p></blockquote>

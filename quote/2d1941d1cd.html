</figure><figure class="quote" id="q-34326e8cff" data-kw="">
<blockquote><p>God’s reconciliation to us must precede our reconciliation to him. This, as remarked above, is the great doctrine of the Bible. So long as we are under the wrath and curse of God, due to us for sin, we are aliens and enemies, cut off from his favor and fellowship, which are the life of the soul. Therefore until God’s wrath and curse are removed, there is no possibility of holiness and love. It is vain to attempt to secure the favor of God by being holy; we must enjoy his favor before we can be holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:18</span></figcaption>

</figure><figure class="quote" id="q-abd7a1051c" data-kw="resurrection own power">
<blockquote><p>The first degree of Christ’s exaltation is put in his resurrection. For the Socinians, as they say Christ was a mere man, so they maintain that Christ did not raise himself by his own power, but was raised by God’s power. But the orthodox ascribe the cause of the resurrection to Christ himself no less than to the Father. Since the power of the Father and the Son is the same, they think that by the same the Father raised Christ and Christ raised himself. Did Christ rise by his own power? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.17.1–2</span></figcaption>

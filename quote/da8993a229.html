<main class="wrap"><figure class="quote" id="q-da8993a229" data-kw="">
<blockquote><p>One of the main reasons that the Dutch church in this country [of America] returned to its independent status [from the national Dutch Church] in 1857 was dissatisfaction with the status of that church’s psalmody. Consequently, when the Christian Reformed Church was formed in 1857, it reaffirmed its commitment to the Psalms. Until its revision in 1932, Article 69 of the Church Order of the Christian Reformed Church read: In the churches only the 150 Psalms of David, the Ten Commandments, the Lord’s Prayer, the Twelve Articles of Faith, the Songs of Mary, Zacharias, and Simoen, the Morning and Evening Hymns, and the hymn of Prayer before the Sermon, shall be sung.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afcb3af2fb" data-kw="">
<blockquote><p>Moreover, who can deny ye there is much &amp; great virtue in David’s Harp… Again must not David’s songs be of great excellency, seeing that ye Son of God came down from the glorious throne of his heavenly Father to accomplish and fulfill them? Doth not Paul also say, ‘Be ye filled with the Spirit, speaking among yourselves in Psalms, Hymns, &amp; spiritual songs, singing and making melody in your hearts to ye Lord, ever giving thanks for all things in the name of our Lord Jesus Christ?’ Certes [assuredly] the psalmody of David may well be called ye treasure house of the holy Scripture. For it contain the whatsoever is necessary for a christian to know: There is nothing in the law, no thing in the Prophets, nothing in ye preaching of Christ and of his apostles, yt this noble minstrel, King &amp; Prophet doth not decantate and sing with most goodly &amp; manifest words. He singeth all the works and wonderous miracles of God from the beginning of the world, until the redemption of mankind by Christ. He singeth Christ’s incarnation, preaching, working of miracles, passion, death, resurrection, ascension, glory, the blessing of all nations, the conversion of the Gentiles with all other mysteries that pertain to our health… To be short, he singeth whatsoever is expedient for a Christian’s knowledge. So that even this one book alone of David’s songs had been sufficient truly to instruct a man in the righteousness of God… O the wonderful and marvelous strength of David’s harp. O the great and exceeding virtue of David’s songs… Would God that all men of honor would nourish such minstrels in their houses, as David’s, and that might sing unto them both at dinner and supper, yea and at all other times these most sweet and delectable songs of David… Would God also that all fathers and mothers, all masters and mastresses, would bring up their children and servants in the singing of these most godly songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s harp full of most delectable armony, newly stringed and set in tune by Theodore Basille</cite>, (London, 1542), ‘To the right honorable Sir. George Broke, Lord Cobham’, no page numbers. Theodore Basille was a pseudonym for Thomas Becon (1512-1567), the English reformer.</span></figcaption>

</figure><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, ‘The Causes &amp; Cures of Mental Errors’, p. 476</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-4f75f98945" data-kw="">
<blockquote><p>He would have us cheerful, he commandeth us to rejoice evermore; and, is any merry, ‘let him sing’ (James 5:13), but one of the songs of ‘Sion’ [Ps. 137:3]: only let no corrupt communication proceed out of your mouths; but that which is good to the use of edifying, that it may minister grace to the hearers. Sing Psalms, Hymns, &amp; spiritual Songs, singing with a grace in your hearts to the Lord (Col. 3:16). To such songs the spirit of grace commeth flying: the bees come to aromatical and sweet things, the swine will to the mire: to obscene and meritricious songs and discourses, the devil’s swarm, let them only use and love them, who love their company.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover</cite>, (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ., p. 38-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>

<blockquote><p>4. Let it be remembered that those things we call morally good, [are those] which agree to right reason: those morally evill, which disagree from right reason: and those indifferent, which include nothing belonging to the order of reason, and so are neither consonant unto nor dissonant from the same. [The following shows that no rational action, and hence thing commanded, is simply indifferent, but must be good or bad to some degree, and hence to be done or not done; and if it is bad in any degree, it cannot be absolutely required.]

5. When we speak of the indifferency of an individual action, it may be conceived two ways, either absolute et sine respectu ad aliud [absolute and without respect to another], or, comparate et cum respectu ad aliud [comparatively and with respect to another]. In the free-will offrings, if so be a man offered according as God had blessed and prospered his estate, it was indifferent to offer either a bullock or a sheep, or a goat; but if he choosed to offer any of them, his action of offering could not be indifferent, but either good or evil. When we speak of the indifferency of an action comparate [comparatively], the sense is only this, that it is neither better not worse than another action, and that there is no reason to make us choose to do it more than another thing. But when we speak of the indifferency of an action, considered absolutely and by itself, the simple meaning is whether it be either good or evil, and whether the doing of the same must needs be either sin or evil doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 4, ch. 3, p. 8</span></figcaption>

</figure><figure class="quote" id="q-ccff3f6b3e" data-kw="">
<blockquote><p>Though Saul’s destroying of the Amalekites in that cause was moral, in regard ‘they lay in wait for Israel, when they came out of Egypt,’ and so of perpetual obligation, yet the destroying of them, 1 Sam. 15, is temporary and obliges not us:

1. Because that generation were their sons, not those same persons that oppressed Israel when they came out of Egypt, and we may not punish the sons for the sins of their fathers with death; therefore God’s positive command to Saul, and the reason, ‘I remember what Amalek did’ (in Moses his time) ‘therefore kill them,’ does not oblige us, except we had the like command.

2. Because the slaying of man, woman, infant and suckling, ox and sheep, was temporary and cannot have a perpetually obligatory ground in the Law of nature or natural justice obliging us.

3. Where there is an injury done to God against the Law of nature and against our brethren in drawing them from serving the true God, and a punishment commanded by God to be inflicted once; that punishment, or the like in substance and nature, must ever be such as obliges us in the like cases; The learned professors in Leiden say, ‘They can see no reason but they must oblige under the New Testament.’ I confess when the fault is ceremonial, though the punishment be real, as the cutting off of an infant not circumcised [Gen. 17:14], and some punishments inflicted on the leper, it is not reason the Law should oblige us in the New Testament, either as touching the punishment or the degree. Because these punishments for typical faults are ordained to teach rather than to be punishments, and the Magistrate by no light of nature could make laws against unbaptized infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), p. 299</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-1881f9940b" data-kw="">
<blockquote><p>It is queried whether a magistrate is authorized to impose capital punishment on the exceedingly shameful and murderers? Some Remonstrants [Arminians] deny… but others openly assert… We all affirm to authorize, and the contrary sentiments we condemn and reject as errors: 1. For Gen. 9:6, “Whoso sheds man’s blood, by man shall his blood be shed.” Ex. 21:14, “But if a man come presumptuously upon his neighbor, to slay him with guile; thou shalt take him from mine altar, that he may die.” Num. 35:31, “Moreover ye shall take no satisfaction for the life of a murderer, which is guilty of death: but he shall be surely put to death.” which is not a judicial law and temporary, but is clearly effected out of the Law of Nature, which innocent blood cannot be expiated as in the Ceremonial or Judicial Law [Dt. 21:1-9]. But it says ‘never’: Num. 35:33, “So ye shall not pollute the land wherein ye are: for blood it defileth the land: and the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed it.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-70c5ed81b1" data-kw="Comfort Wisdom">
<blockquote><p>What greater comfort is there than this, that there is one presides in the world who is so wise he cannot be mistaken, so faithful he cannot deceive, so pitiful he cannot neglect his people, and so powerful that he can make stones even to be turned into bread if he please!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Use of comfort</span></figcaption>

<blockquote><p>Our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!</p></blockquote>

</figure><figure class="quote" id="q-4e54975829" data-kw="">
<blockquote><p>Thus you see, what sweet Communion a soul may have with God in the way of his Providences. O that you would thus walk with him! How much of Heaven might be found on Earth this way! And certainly, it will never repent the Lord he hath done you good, when his mercies produce such effects upon your hearts: he will say of every savour thus improved, It was well bestowed, and will rejoyce over you to do you good for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Conduct, or the Mystery of Providence</cite>, London, 1678, p. 167</span></figcaption>

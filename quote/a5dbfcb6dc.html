<blockquote><p>Now we know that God (according to his promise to Abraham) hath an holy seed out of all Nations, which is the Catholic and Universal Church: if then the Church be Catholic and Universal, let our love and peace be also Catholic and Universal. And to this end our affections must be enlarged, and made capable of the whole world; for he that will love a Catholic Church with a Catholic love, must not have a narrow love contracted and confined to the measure of one City, Kingdom, or nation; but extended and enlarged to the measure of all Cities, Kingdoms, and Nations, even of the whole world.

It that which is to be loved be universal, the affection which loveth must not be partial: For if the love be but to a part, when it should be to the whole, this is not that Catholic love which belongs to the Catholic Church; and whatsoever title such men may take to themselves, they are not true, but counterfeit Catholics; for they have not that Catholic spirit of love which is in the true Catholic Church, and by which the Catholic Church doth love itself with a Catholic love. But such men by likelihood have a private spirit, by which they love a private part and faction, and are short of that universal spirit which loveth the universal Church with an universal love: for there is a private spirit of love as well as of faith; and it is that kind of spirit which Saint James mentioneth, a spirit that lusteth after envy, after Sects and divisions. But let us never rest until we get that Catholic spirit by which we may embrace the Catholic Church with a Catholic love; and then we may be assured we are not titular, but true and real Catholics.

Hereby we know that we are of the truth (saith Saint John) and we shall assure our hearts before God: And, We know that we have passed from death to life, because we love the brethren; even the brethren without exception and reservation: and he that dwelleth in this general and undeserved love, God, who is love, dwelleth in him, and he in God; And we know that we dwell in him and he in us, because he hath given us his spirit, even the spirit of this Catholic and Universal love. Let no man therefore say of another, He is of such a Nation with which my Nation is at enmity; or of such a Church which professeth some differences with the Church in which I live, and therefore I will by no means have love and peace with him; but remember, that in every Nation, he that feareth God and worketh righteousness is accepted of God: and therefore doe thou enquire, whether this spirit of fear and holiness be in him, which those that have are accepted of God: if he be accepted of God, take heed he be not rejected of thee: It were a madness in thee for God’s sake to hate one whom God loves, and for Christ’s sake to hate a member of Christ.

Indeed, if he be of a Church infected with errors, thou must be wary of him, that he infect thee not with those errors; but be also wary of not hating the Spirit of Christ in a member of Christ: It is an Apostolical, and so an undeniable Inference, If ye have put on the New-man, in which is neither Greek nor Jew, Circumcision nor Uncircumcision, Barbarian, Scythian, bond nor free, but Christ is all in all; Put on therefore (there is a binding force in this therefore) as the elect of God, holy and beloved, bowels of mercy, kindness, &amp;c. And above all these things, put on charity, which is the bond of perfectness; and let the peace of God rule in your hearts, to which ye are called in one body.

Let us then have love and peace with a believing Muscovite, Grecian, Aethiopian, Indian, if he be of that one body wherein Christ is all in all, and by the unity whereof we are called to love and peace; yea, from this universal peace and love may not be excluded any remnant according to the election of grace, pertaining to the body of Christ, though sojourning in the tents and territories of Rome: we may not hate the seven thousand that doe not bow their knees to Baal, though dispersed among seven millions of Idolaters; we may not hate Israel, though in bondage under Pharaoh.

But to the true Israel, even to the pure in heart, and those who in Christ Jesus are new creatures, and walk according to this rule, peace, and the prayers of peace, the true fruits of love doe belong, the divine Apostle being herein our guide and example. And while thus we enjoy and embrace this universal love with the universal body of Christ, great is our safety; for hereby we know and may assure our hearts, that we belong to that universal body, which alone loveth it selfe with this universal love. That is the truly Catholic Church, which indued with this Catholic love; that is a living Church, which is a loving Church: We therefore embracing and exercising this Catholic love, are of the Church truly Catholic; even of that Church, which being a Church of love, is also a Church of life.</p></blockquote>

<blockquote><p>All the difference of religion, which is at this day between the Church of Rome and the Protestants, lies in some certain points which the Church of Rome maintains as important, and necessary articles of the Christian faith: whereas the Protestants, on the contrary, neither believe nor will receive them as such. For as for those matters which the Protestants believe, which they conceive to be the fundamentals of religion, they are evidently and undeniably such, that even their enemies admit and receive them as well as they: inasmuch as they are both clearly delivered in the Scriptures, and expressly admitted by the ancient councils and Fathers ; and are indeed unanimously received by the greatest part of Christians in all ages, and in different parts of the world. But now their adversaries add to these many other points, which they press and command men to believe as necessary; and such as, without believing in, there is no possible hope of salvation. As for example: that the Pope of Rome is the head and supreme monarch of the whole Christian Church throughout the world, that he, or at least the Church which he acknowledges a true one, cannot possibly err in matters of faith… which their adversaries plainly protest that they cannot with a safe conscience believe. These points are the ground of the whole difference between them; the one party pretending that they have been believed and received by the Church of Christ in all ages as revealed by him; and the other maintaining the contrary.</p></blockquote>

</figure><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>

</figure><figure class="quote" id="q-e64b53ec7e" data-kw="">
<blockquote><p>In two ways Almighty God wounds those whom he is concerned to restore to health. Sometimes he whips them outwardly on the flesh in order to cure the poison of sins. Sometimes, even if the outward blows seem to have stopped, he inflicts wounds inwardly because he strikes the hardness of our mind with desire for him. Yet by striking he heals because, when we have been pierced by the spear of fear of him, he recalls us to an upright frame of mind. For our hearts are sickly when stricken with no love for God, when unmindful of the woefulness of our pilgrimage, when apathetic with hardly any feeling at all toward the weakness of our neighbour. But they are wounded that they may be healed because God strikes unfeeling minds with the darts of love for him and soon makes them full of feeling through the burning heat of charity.

Hence here the Bride says: I have been wounded by love. For the soul that is sickly and in the state of this exile lies prostrate in blind security has neither seen God nor sought to see him. But when she is struck by the darts of his love, she is ‘wounded’ in her innermost recesses with tender devotion, burns with desire for contemplation, and marvellously is restored to life through her wound, though once she lay dead in health. She yearns, she pants, and she desires to see him whom she fled.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5b1de0105b" data-kw="">
<blockquote><p>Is holy consolation, of such inestimable value to the spiritual seed of Christ, that He, in the immensity of his love, came down from the realms of light, to purchase it for them? Believers may learn from this, what infinite obligations they are under, to their incarnate Redeemer. Christian, thy dear Saviour hath, at the infinite expense of his own unparalleled obedience, anguish, and death, purchased and secured everlasting consolation for thee. He was troubled in spirit, that thou mightest be comforted: He was encompassed with the sorrows of eternal death, that thou mightst enter into the joys of everlasting life: He was arrayed in the spirit of heaviness, that thou mightest be clothed with “the garment of praise:” He, who was, from eternity, the delight of his Father, “rejoicing always before Him,” endured for thee, the hiding of his countenance, and the sense of his infinite wrath, that thou mightst, to eternity, joy in God through him.

Hath he not done and suffered enough, to shew thee, that he is willing to enrich thee with consolation, that he careth for thy comfort, and that he giveth thee sufficient cause to be always of good comfort? Were it not, that there is something in thy heart, which requires the discipline of his covenant; he taketh such pleasure in comforting thee, that thou couldst, at no time, be disconsolate. Thou art therefore infinitely bound, to love Him ardently and supremely, to glory in his cross, and to delight in doing his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 71-72.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ff7788dc1" data-kw="">
<blockquote><p>And then further, Let the consideration of this be of comfort to thee (when thou hast committed sin against God, if thou be’st such a one as hath been spoken of) in remembering the Covenant that God hath made with thee, and bless God for the Covenant that he hath made with thee in Christ, and the difference that God hath made between thee and others in this thing; magnify his free grace in the Covenant of grace, for from thence is it that thy spot shall not be a deadly spot; and God will not deal with thee as with the wicked: certainly this is not from the nature of thy sin, for that may be as heinous as the sins of the other, but that that makes the difference is the free-grace of God in Christ.

O blessed be God for the Covenant of grace that hath made the difference. I remember I have read of Luther, he indeed saith when he was a Monk, though he were Conscientious then, yet then whensoever he committed any sin against God, his Conscience did so fly in his face, that he thought he was rejected utterly of God, till God made him know that Covenant of his grace in Christ; and then he thought he heard such a voice speaking to him, Oh Martin, do not despair, for thou shalt, as long as thou livest here in the flesh, sin against God; only do thou lustily oppose thy sin, and resist thy sin, and then know, that thou art not under the Law, but under grace: It is from hence that there is this difference, therefore bless God that ever he reveal’d this Covenant of grace to thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gate</cite>, (London, 1668), pp 107-08.</span></figcaption>

</figure><figure class="quote" id="q-9250e3080a" data-kw="">
<blockquote><p>We are told, then, that because the kingdom of God is near we must be converted and believe the gospel. We have already explained, though rather briefly, what is meant by ‘the kingdom of God.’ It means that God has chosen to reveal Himself to men from whom He was formerly estranged, and who were more or less cut off from Him. We have all been banished from the heavenly life by Adam’s sin and fall. God therefore sends his only Son and, as it were, with outstretched arms asks us to turn back to Him, for He is willing to receive us. Although we have strayed and are lost because of our demerits, He still wills to show us mercy. Because the kingdom of God is near, our Lord Jesus Christ urges men to repentance and faith. Notice first of all that nothing should move or inflame us to yield to God more than his offer of infinite grace and goodness. When Paul, for example, seeks to pierce men’s stony hearts and to soften their hardness and obduracy, he appeals to ‘the bowels of God’s mercy’ (Phil. 2:1). In speaking thus, he is really saying: ‘Will you now continue in our madness? Must you be worse than the devils? And when God comes to you, displaying his mercy and opening his heart to welcome you as his own children—when he gives you his own Son, will you be so unfeeling as not to be softened or inflamed by love for his grace? Will you not allow Him to lead you, and will you not delight in the goodness He shows you?’ It is in just this way that Jesus Christ urges men to repentance and faith. But on what does he base his appeal? On the fact that God wishes to draw near to those from whom He was once estranged. God, therefore, in receiving us in mercy, sets his goodness before us without waiting for us to seek Him out; he forestalls us with such exceptional grace that we cannot grasp even a hundredth part of it. Since He is so kindly disposed toward us, we should be rightly and deeply touched, to the very core of thought and feeling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Gospel of God</cite>, (Mt. 4:12, 17; Mk. 1:14–15; Lk. 3:19–20; 4:14–15)” in In the Power of the Spirit: Sermons on Matthew, Mark &amp; Luke, tr. Robert White (Banner of Truth, 2024), pp. 154–55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>2. And he beseeches them, per miserationes, by the mercifulness of God, rather than per misericordiam Dei, the mercy of God: for this shows only the merciful inclination of God in Himself, the other betokens his actual compassion extended to others; [Francis] Tolet.</p></blockquote>

<blockquote><p>The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8).</p></blockquote>

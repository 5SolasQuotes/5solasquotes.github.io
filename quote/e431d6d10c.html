<main class="wrap"><figure class="quote" id="q-e431d6d10c" data-kw="">
<blockquote><p>For eschatology, God needs not only to be the Potter sovereign with reference to the clay, but he needs to be a Potter who can produce his own clay with reference to its tractableness. Moreover, a God who is unable to do this or is uncertain of accomplishing this does not by nature fits into the role of a producer or guide of a truly eschatological process. He cannot know from the outset whether he will be successful or not. It is at this point that predestination and eschatology are one at their root.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Eschatology of the Old Testament</cite>, ed. James T. Dennison Jr. (Phillipsburg NJ: P&amp;R, 2001), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e262339eb" data-kw="">
<blockquote><p>4. The text continues: ‘And these are the signs that will accompany those who believe: in my name they will cast out demons, they will speak new tongues, they will take snakes in their hands, and if they drink any deadly beverage, it will not will do them any harm. They will lay hands on the sick, and they will be healed.’ [Mk. 16:17] That, my brethren, you do not do; does that mean you do not believe? No, of course! These signs were necessary at the beginning of the Church. Faith, in order to grow, had to be nourished. We, too, when planting trees, pour water on them until we have found that they have resumed; but once their roots are fixed in the ground, we stop watering them. Hence Paul’s words: ‘Languages ​​are a sign, not for believers, but for unbelievers.’ (1 Cor 14:22)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 29 on the Gospels, on the Ascension, May 24</cite>, 591</span></figcaption>

</figure><figure class="quote" id="q-1e22842c9d" data-kw="">
<blockquote><p>But, alas! what need is there of miracles, such as healing sick bodies and restoring sight to blind eyes, when we see greater miracles done every day by the power of God’s Word? Do not the spiritually blind now see?… And if we have the thing already which such miracles were only intended to introduce, why should we tempt God in requiring further signs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-whitefield.html">John Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Arnold A. Dallimore, George Whitefield: the Life &amp; Times</cite>, … (Banner of Truth, 1970), vol. 1, pp. 348-49</span></figcaption>

</figure><figure class="quote" id="q-6c528061e3" data-kw="">

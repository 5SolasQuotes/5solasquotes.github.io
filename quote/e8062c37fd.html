<blockquote><p>Out of this depravity of the Graeco-Roman world came a licentious madness of uncontrolled and superfluous incentives to lust. The entire structuring of nature was disarranged and destroyed by the depravity and wicked perversions of men who had only the uncontrolled vice of unrelenting desire. These destroy the natural order of things.</p></blockquote>

<blockquote><p>3. The goodness or badness of a human action may be considered two ways, viz. either in actu signato [in the signified act] and quo ad speciem [as to the species], or in actu exercito [in the exercised act] and quo ad individuum [as to the individual thing]. For an action is said to be specificated by its object and individuated by its circumstances. So that when an action is good or evill in respect of the object of it, then it is called good or evil quo ad speciem. When it is good or evil in respect of the circumstances of it, then it is said to be good or evil quo ad individuum. … 6. Every thing which is indifferent in the nature of it is not by-and-by indifferent in the use of it. But the use of a thing-indifferent ought evermore to be either choosed or refused, followed or forsaken, according to these three rules delivered to us in God’s Word: 1. the rule of piety, 2. the rule of charity, 3. the rule of purity. … We may not for the commandment of men transgress the rule of piety by doing any thing which is not for God’s glory and ordered according to his will; neither ought any of us to obey men except for the Lord’s sake and as the servants of Christ, doing the will of God, which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ and as if Christ commanded it]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity, but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly, may we obey men so as to break the law of purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information… … 2. As for those actions which proceed from the deliberation of reason, howbeit many of them be indifferent quo ad speciem, yet none of them is, nor can be indifferent quo ad individuum. The reason of this difference and distinction is because every action has its species or kind from the object; and a human moral action has its species or kind from the object referred to the original of human actions, which is reason. Whereupon it comes that if the object of the action include something that agrees to the order of reason, it shall be a good action according to it’s kind: for example, to give alms to an indigent man. But if it include something that is repugnant to the order of reason, it shall be an evil action according to its kind, as to steal or take away another man’s goods. Now sometimes it happens that the object of an action does not include something that belongs to the order of reason, as to lift a straw from the ground, to go to the field etc. such actions are indifferent, according to their kind. But we must pronounce far otherwise of them, when we speak of them quo ad individuum, because as they are individuated by their circumstances, so in their individual being they have their goodness or badness from the same circumstances, as has been showed. So that no such action as is deliberated upon can be indifferent quo ad individuum; because oportet [it is needful] says Thomas, quod quilibet individualis actus habeat aliquam circumstantiam, per quam trahetur ad bonum, vel malum, ad minus ex parte intentionis finis [every individual act has some circumstance, through which it is drawn to the good or bad, to a lesser degree, from the part of the intention of the end].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ([1637]), pt. 4, ch. 3, pp. 7-8 &amp; 11-12</span></figcaption>

<blockquote><p>The human nature of Christ being thus formed in the womb by a creating act of the Holy Spirit, was in the instant of its conception sanctified, and filled with grace according to the measure of its receptivity… And this work of sanctification, or the original infusion of all grace into the human nature of Christ, was the immediate work of the Holy Spirit; which was necessary unto Him: for let the natural faculties of the soul, the mind, will, and affections, be created pure, innocent, undefiled,— as they cannot be otherwise immediately created of God,— yet there is not enough to enable any rational creature to live to God; much less was it all that was in Jesus Christ.</p></blockquote>

<blockquote><p>The law of nature is the rule of good and evil, inscribed by God on man’s conscience, even at his creation, and therefore binding upon him by divine authority. That such a law was connate with, and as it were implanted in the man, appears from the reliques, which, like the ruins of some noble building, are still extant in every man; namely, from those common notions, by which the heathens themselves distinguished right from wrong, and by which “they were a law to themselves, which shews the work of the law written in their hearts, their conscience bearing witness,” Rom. ii. 14, 15. From which we gather, that all these things were complete in man, when newly formed after the image of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The law of nature is the rule of good and evil, inscribed by God on man’s conscience, even at his creation, and therefore binding upon him by divine authority. That such a law was connate with, and as it were implanted in the man, appears from the reliques, which, like the ruins of some noble building, are still extant in every man; namely, from those common notions, by which the heathens themselves distinguished right from wrong, and by which “they were a law to themselves, which shews the work of the law written in their hearts, their conscience bearing witness,” Rom. ii. 14, 15. From which we gather, that all these things were complete in man, when newly formed after the image of God.”

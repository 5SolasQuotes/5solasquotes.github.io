<blockquote><p>Question [to a Muslim convert]

Having acknowledged that eternal Salvation is not to be found but in the Christian Religion, and the Christians being divided into many Religions, why did not you address your self to the Church of Rome?

Answer

By reason of the Images to which they kneel, and because they do adore a piece of bread, saying that it is God himself.

Consideration.

The Mahometans have good reason to abhor Idols. They reproach the Christians with them, as also with the worshipping of the Virgin Mary, and other Saints. This Scandal which is so general, is the cause why not only the Mahometans but the Jews also do detest Christianity. O how many Souls hath this Doctrine hindered from coming to Christ? Satan hath found also another way from dissuading not only them, but the Pagans also from being Christians; for they would enjoin them to believe that what they do behold to be but a little piece of bread, is the living and the eternal God. Even common sense rejecteth this abomination.</p></blockquote>

<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>

</figure><figure class="quote" id="q-9676dfb93d" data-kw="">
<blockquote><p>That the Distinctive Principles may be maintained without compromise, the Reformed Presbyterian Church believes in and practices Close Communion. Both reason and revelation are in accord with this stand. Apart from Close Communion the discipline of the Church cannot be maintained. Common sense teaches that it is a glaring inconsistency to testify against anti-Christian doctrines and practices and at the same time admit to the highest privileges of the Church those who adhere to said doctrines and practices. For example, if a member of a Reformed Presbyterian congregation were to join an oath-bound secret society, it would be the duty of the Session to discipline him, and if he refused to retract, to exclude him from the Lord’s Table. The Lord’s Supper is the highest and holiest privilege which the Church has to offer. Would it be consistent for the Church to permit a non-member who belonged to an oath-bound secret society to partake of the Communion while at the same time it prohibited one of its own members on the ground that he belonged to the same society? The Communion is of value to the Church only to the extent to which her members are bound together by the common faith and a common life with one another and with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-tweed.html">J. B. Tweed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The communicants’ class</cite>, (2nd edn, Newton, 1960), p. 41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

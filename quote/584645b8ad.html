<blockquote><p>We come now to the principle of substance. It is thus formulated: ‘That which exists as the subject of existence is substance, and is distinct form its accidents or modes.’ Thus in everyday speech we call gold or silver a substance. This principle is derived from the principle of identity, because that which exists as subject of existence is one and the same beneath all its multiple phenomena, permanent or successive. The idea of substance is thus seen to be a mere determination of the idea of being. Inversely, being is now conceived explicitly as substantial. Hence the conclusion: The principle of substance is simply a determination of the principle of identity: accidents then find their raison d’etre in the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (n.p., 1946), ch. 4, ‘Intelligible Being &amp; First Principles’, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50f44e86d0" data-kw="">
<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>

</figure><figure class="quote" id="q-595686e025" data-kw="">
<blockquote><p>Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>In summary, then, the thrust of the Fifth Way [of Aquinas] is this: (1) Irreducible teleology is immanent to the natural order; (2) But such teleology is unintelligible unless there is an intellect outside the natural order; so (3) There is an intellect outside the natural order. The argument differs from [William] Paley [early-1700’s] style design arguments and the arguments of ID [Intelligent Design] theorists in ways other than those already mentioned. For example, since the entities comprising the natural world have the final causes they have as long as they exist, the intellect in question has to exist as long as the natural world itself does, so as continually to direct things to their ends. The deistic notion that God might have “designed” the world and then left it to run independently is ruled out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, p. 47</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In summary, then, the thrust of the Fifth Way [of Aquinas] is this: (1) Irreducible teleology is immanent to the natural order; (2) But such teleology is unintelligible unless there is an intellect outside the natural order; so (3) There is an intellect outside the natural order. The argument differs from [William] Paley [early-1700’s] style design arguments and the arguments of ID [Intelligent Design] theorists in ways other than those already mentioned. For example, since the entities comprising the natural world have the final causes they have as long as they exist, the intellect in question has to exist as long as the natural world itself does, so as continually to direct things to their ends. The deistic notion that God might have “designed” the world and then left it to run independently is ruled out.”

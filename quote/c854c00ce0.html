<main class="wrap"><figure class="quote" id="q-c854c00ce0" data-kw="">
<blockquote><p>As concerning the time which Almighty God hath appointed his people to assemble together solemnly, it doth appear by the Fourth Commandment of God. Remember, saith God, that thou keep holy the Sabbath day. Upon the which day, as is plain in the Acts of the Apostles, the people accustomably resorted together, and heard diligently the Law and the Prophets read among them.

And, albeit this Commandment of God doth not bind Christian people so straitly to observe and keep the utter ceremonies of the Sabbath day as it was given unto the Jews, as touching the forbearing of work and labour in time of great necessity, and as touching the precise keeping of the seventh day after the manner of the Jews; (for we keep now the first day, which is our Sunday, and make that our Sabbath, that is, our day of rest, in the honour of our Saviour Christ, who as upon that day rose from death, conquering the same most triumphantly;) yet, notwithstanding, whatsoever is found in the Commandment appertaining to the law of nature, as a thing most godly, most just, and needful for the setting forth of God’s glory, it ought to be retained and kept of all good Christian people. And therefore by this Commandment we ought to have a time, as one day in a week, wherein we ought to rest, yea, from our lawful and needful works.

For, like as it appeareth by this Commandment, that no man in the six days ought to be slothful or idle, but diligently to labour in that state wherein God hath set him, even so God hath given express charge to all men, that upon the Sabbath day, which is now our Sunday, they should cease from all weekly and workday labour; to the intent that, like as God himself wrought six days, and rested the seventh, and blessed and sanctified it, and consecrated it to quietness and rest from labour, even so God’s obedient people should use the Sunday holily, and rest from their common and daily business, and also give themselves wholly to heavenly exercises of God’s true religion and service. So that God doth not only command the observation of this holy day, but also by his own example doth stir and provoke us to diligent keeping of the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Homily on the Place and Time of Prayer in Thomas Cranmer and John Jewell, The Two Books of Homilies Appointed to be Read in Churches</cite></span></figcaption>

<blockquote><p>20. That is a most empty distinction which some people make to excuse their additions to worship: “Only corrupting and not conserving additions are forbidden.” For every addition as well as every subtraction is a departure from the observance and keeping of the commandments of God, and a corruption of them, Deut. 12:32.

21. Of the same nature is the evasion which is made when it is said that only the addition of essentials is forbidden, not accidentals. Although there are some “accidents” or adjuncts in worship, there is no worship which may simply be called accidental, because all worship has in it its own essence. Furthermore, as the least commandments of God even to jots and tittles are to be observed religiously, Matt: 18, 19, so additions that seem very small are for the same reason rejected. Last, Moses seals even those laws of place and manner of divine worship, of abstinence from blood, and the like (which are certainly accidentally to worship), with the caution not to add or take away from them, Deut. 12:32.

22. This worship is called obedience for a special reason, because in it we do that which seems right in the eyes of the Lord, although something else might seem more right in our own eyes, Deut. 12:35, 28.

23. Opposed to instituted worship is will-worship which is devised by men and is unlawful, Matt. 15:9; Col. 2:23.

24. The sin committed in will-worship is generally called superstition.

25. Superstition occurs when improper worship is given to God.

26. In superstition God is always the object and in some way the end, but the worship itself is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 2.13.20–26</span></figcaption>

<blockquote><p>V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations</cite>, (1645) on 1 Cor. 11 Featley wrote the comments on Paul’s epistles, and was an episcopalian, Westminster divine. This work was often known as The Westminster Annotations as 6 of the 11 contributors were Westminster divines.</span></figcaption>

<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.”

— John Dod, Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20 | (London, 1610), 4th Sermon, pp. 125-28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+like+manner+is+Rahab+commended+as+one+that+by+reason+of+her+faith+and+works+perished+not+with+them+which+obeyed+not%2C+when+she+had+received+the+spies+peaceably.+Yet+if+we+look+into+the+story%2C+we+shall+easily+discern+a+great+deal+of+infirmity+in+that+very+work+of+love+and+mercy%2C+by+which+she+got+the+testimony+of+such+a+notable+faith%3A+for+she+bewrayed+much+unbelief+in+making+a+lie+to+preserve+the+spies+in+safety%E2%80%A6+So+the+angel+%28as+is+recorded+in+the+Gospel%29+rebuked+those+good+and+faithful+women%2C+for+that+they+sought+the+living+among+the+dead%3A+yet%E2%80%A6+He+is+risen+again%2C+as+He+foretold+you+that+He+would%3A+yet+herein+does+your+uprightness+appear%2C+that+you+hold+out+still+in+the+love+and+profession+of+Christ%2C+even+now%2C+when+He+is+in+such+disgrace+and+dislike%E2%80%A6+Thus+we+may+perceive+how+favourable+the+Lord+is+towards+his+children+that+offend+not+upon+set+purpose+and+presumptuously%3A+but+through+Satan%E2%80%99s+instigation+or+through+human+frailty%E2%80%A6+This+makes+for+the+confutation+of+their+error%3A+1.+That+think+they+have+no+calling+to+come+to+the+sacrament+because+they+see+more+and+greater+faults+in+themselves+than+they+can+espie%2C+or+then%2C+indeed%2C+there+are+in+many+other+Christians%E2%80%A6+They+find+so+much+hypocrisy%2C+so+much+pride%2C+so+much+vain-glory+and+self-love%E2%80%A6+that+they%E2%80%A6+begin+to+fear+that+God+will+in+no+sort+accept+of+them%2C+if+they+should+come+unto+the+table+of+his+Son%E2%80%A6+and+therefore+%5Bthese+things%5D+should+by+no+means+keep+them+from+the+holy+sacrament%E2%80%A6+Further%2C+%5B2.%5D+those+that+by+reason+of+their+infirmities+will+forgoe+that+ordinance+do+greatly+dishonor+God+and+lay+an+hard+imputation+upon+Him%2C+as+who+should+say+that+He+were+such+an+extreme+and+rigorous+Judge+as+will+accept+of+none+but+of+those+that+have+attained+to+a+great+measure+of+perfection.+Besides%2C+%5B3.%5D%E2%80%A6+they+have+a+calling+to+partake+of+the+sacrament%2C+as+appears+in+this+text%E2%80%A6+all+such+as+prepared+their+whole+hearts+%28that+is%2C+did+their+best+endeauour+with+a+true+and+sincere+heart%29+to+seek+the+Lord.%E2%80%9D%0A%0A%E2%80%94+John+Dod%2C+Ten+Sermons%2C+Tending+Chiefly+to+the+Fitting+of+Men+for+the+Worthy+Receiving+of+the+Lord%E2%80%99s+Supper%2C+%281634%29%2C+The+Fourth+Sermon+of+the+Lord%E2%80%99s+Supper%2C+on+2+Chron.+30%3A18-20+%7C+%28London%2C+1610%29%2C+4th+Sermon%2C+pp.+125-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ae1b34237.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ae1b34237.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=In%20like%20manner%20is%20Rahab%20commended,sincere%20heart%29%20to%20seek%20the%20Lord&amp;text=In%20like%20manner%20is%20Rahab%20commended%20as%20one&amp;text=true%20and%20sincere%20heart%29%20to%20seek%20the%20Lord" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Jewish way under the law of praising the Lord was upon the timbrel, the harp, psaltery, and ten-stringed instruments, and other instruments of music that belonged to ceremonial worship that is now abolished. Christ, who is the end of the law, has torn or taken away the ceremonies of the law, and there is no warrant now to make use of the organs, as they do in the Popish Church, and in the Prelatical Church of England, and even among them that are more reformed, those over in Holland. Oh, but we have a great advantage in being free of these! But there are some in the other extreme, that are for no music at all, but we are to sing and praise vocally, and with the heart too. This reproves Quakers, who make a mock at singing of psalms. But we will let them see a fine ancient warrant for vocal music. “And be not drunk with wine… speaking to yourselves in psalms, hymns, and spiritual songs, making melody in your hearts to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Lecture 2’ on Ps. 92</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-6e938bb4fd" data-kw="">
<blockquote><p>To the older ministers, however, these events were a cause for dismay… Particular indignation was directed against Hamilton, who was widely regarded as an interloper and troublemaker. Typical was an outburst by Williamson, who inveighed against ‘laymen, ignorant, idle men’, who had ‘taken upon them to meddle in the matter of church government without a call’. The clerk to the Dunscore meeting happened to meet Hamilton in the street and told him that he ‘had been a black sight to that country’ and that he ‘had set all on a fire’. Hamilton, true to character, rejoined that he was ‘satisfied to hear of any such effect, for they stood much in need of fire to thaw their frozen spirits’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 126-27</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6366c5f2fd" data-kw="">
<blockquote><p>The disaffected among the people, particularly the young, were increasingly drawn to his [Cameron’s] side. ‘Everywhere now’, noted Hamilton with satisfaction, ‘it is the young ones that are carrying on the work.’ To the older ministers, however, these events were a cause for dismay… Warnings were issued about his teaching, and counter-meetings were held in places where he was to preach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 126-27</span></figcaption>

</figure><figure class="quote" id="q-8ce7ded970" data-kw="">
<blockquote><p>The committee of the Assembly of Westminster, in their Reply to the Independents, said, If the Church impose anything that is sinful, we must forbear to comply, yet without separation, as was the practice of the puritans in the late times. As to the charge of schism, they admit that difference in judgment, in some particular points, is not schism; nor does an inconformity to some things enjoined deserve that name. But our [Independent] Brethren desire further to set up separate communions, which is a manifest rupture of our societies into others; and is therefore a schism in the Body. This is a setting up altar against altar, allowing our churches, as Independents do, to be true churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

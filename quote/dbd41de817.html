<main class="wrap"><figure class="quote" id="q-dbd41de817" data-kw="">
<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology, Secondary Attributes of God, pt</cite>, 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1dd8554531" data-kw="">
<blockquote><p>The necessity and contingency of things is not to be attributed to God’s decree, but to the working of his power; contingency is when He uses his resistible power; if He works irresistibly then follows necessity: what is contingent to the second cause is infallible to God’s prescience, but necessary to the work of his omnipotency: his decree is a remote cause, which without his power works not. Christ’s death was contingent to the Jews that crucified Him; infallible to God’s prescience, who foresaw that the Jews would kill Him; but necessary in regard of his decree, working by his power in presenting that bitter cup unto Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination &amp; its Adjuncts</cite>, ... (London: 1646), sect. 25, pp. 24-25</span></figcaption>

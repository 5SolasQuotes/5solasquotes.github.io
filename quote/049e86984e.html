<main class="wrap"><figure class="quote" id="q-049e86984e" data-kw="">
<blockquote><p>for a sinner, as a sinner, is not justified, but a penitent believer [is]… I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance… The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, p. 335</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afc14a999a" data-kw="">
<blockquote><p>It is asked further: But since through faith the righteousness of Christ belongs to him who has been effectually called, cannot one be at least denominated righteous according to that righteousness which belongs to him through faith? I would not, indeed, completely deny that one who has been effectually called is already righteous through faith. But I would not admit that he can be called and named righteous, because the Judge’s sentence—which sentence evidently arises from some further grace—has not yet been delivered and pronounced concerning him. For it is entirely of grace that God pronounces righteous those who are already (in accordance with effectual calling) righteous through faith, and imputes to them another’s righteousness as if it were their own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’ trans. Aaron Clay Denlinger &amp; Noah Phillips MAJT 27 (d. 1599; 2016)</cite>, p. 103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-b2f7a3f3a4" data-kw="">
<blockquote><p>Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical... (1685), on Rev. 3, verse 20</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-66582792bd" data-kw="">
<blockquote><p>The second head is the will of God, who will have us justified with the alone condition of faith. The Adversary [Bellarmine] answers that it contradicts the Scripture, which lays down also the condition of repentance. Answer: 1. Repentance is the condition of faith and of the person justified, but not properly of justification. 2. It is one thing to treat of the condition of justification, but another thing of the cause and instrument thereof: for a condition notes a consequent, or effect: but a cause, the antecedent or efficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity 2nd ed. (London, 1610), bk. 2, Justification, Confuting Part, 3rd Argument</cite>, p. 251</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-a4ee6cd852" data-kw="">
<blockquote><p>Faith sanctifies not as a cause, but as a part of infused grace: and such a part as goes not alone, but accompanied with all other graces of love, fear, zeal, hope, repentance, etc., inasmuch as man’s regeneration is not the infusion of one, but of the habit of all graces. Again, tis not the virtue of faith that justifies us; The grace of justification is from God; He works it: but tis our faith applies it and makes it ours. The act of justification is God’s mere work; but our faith only brings us the benefit and assurance of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith… (Oxford, 1625) | section 2, ch. 3</cite>, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<main class="wrap"><figure class="quote" id="q-36168780f1" data-kw="">
<blockquote><p>[Genesis 6] Verses 5-8 give the most terrible picture of human degradation, to which only Romans 1 compares; and the strongest anthropomorphic expression is used, ‘and it repented the Lord’, to describe God’s reaction to this almost utter perversion of His creative purpose. While it is the moral effects of sin which are summarily described in these few terrible words, it is to be noted that the physical effects may have been and probably were equally marked. Sin brutalizes!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/o-t-allis.html">O.T. Allis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God Spake by Moses: an Exposition of the Penteteuch (Presbyterian &amp; Reformed, 1951)</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>
<div class="actions"><button class="copy" data-copy="“[Genesis 6] Verses 5-8 give the most terrible picture of human degradation, to which only Romans 1 compares; and the strongest anthropomorphic expression is used, ‘and it repented the Lord’, to describe God’s reaction to this almost utter perversion of His creative purpose. While it is the moral effects of sin which are summarily described in these few terrible words, it is to be noted that the physical effects may have been and probably were equally marked. Sin brutalizes!”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c54d9e9900" data-kw="">
<blockquote><p>As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God, vol. 2 (Robert Carter, 1853), Discourse 11, ‘On the Holiness of God’</cite>, pp. 115-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>
<div class="actions"><button class="copy" data-copy="“As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…”

ne</a></div>
</figure><figure class="quote" id="q-973f800a2f" data-kw="">
<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions</cite>, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-b7df78fc1c" data-kw="">
<blockquote><p>Helm (1990) urged the coining of an entirely new term, ‘theomotions’, to express divine affect in contradistinction to human varieties [Helm, ‘The Impossibility of Divine Passibility’ in ed. N.M. de S. Cameron, The Power &amp; Weakness of God (Edinburgh: Rutherford House, 1990), pp. 119-140]. And Scrutton (2005) suggested that differentiating ‘passions’ from ‘affections’, a la Augustine and Aquinas, would move the conversation forward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-mount.html">Thomas Mount</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Existential Dimensions of the Contemporary Impassibility Debate: a Pastoral Approach to the Question of Divine Suffering within the Context of Conservative Evangelicalism PhD thesis (South African Theological Seminary, 2015), 6.2.1 Provide definitional clarity</cite>, p. 338</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-f55f6f4391" data-kw="">
<blockquote><p>Properly, in the sense by him [Mr. Biddle] pointed to, anger, wrath, etc., are not in God… If He be properly and literally angry and furious, and wrathful, He is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. 4. Mr. Biddle [a Socinian] has given us a rule in his preface, that when any thing is ascribed to God in one place which is denied of Him in another, then it is not properly ascribed to Him. Now, God says expressly that ‘fury’ or anger ‘is not in Him,’ Isa. 27:4; and therefore it is not properly ascribed to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, pp. 111-12, 114-5</cite>, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

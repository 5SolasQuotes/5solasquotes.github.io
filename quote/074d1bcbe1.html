<main class="wrap"><figure class="quote" id="q-074d1bcbe1" data-kw="">
<blockquote><p>It will be admitted that the civil magistrate may warrantably legislate on subjects connected with the advancement of the arts and the sciences. Does this suppose him to be accurately acquainted with all these? Or would it be sustained as a sufficient excuse for his not interfering in such matters that he is not an artisan or a philosopher? We apprehend not;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Messiah the Prince</cite>, … (London: T. Nelson, 1881), p. 288</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e57d95fbe" data-kw="">
<blockquote><p>…a Puritan was a man supremely concerned about conscience… The concern which was really supreme in the minds and hearts of the people called Puritans was a concern about God—a concern to know Him truly, and serve Him rightly, and so to glorify Him and to enjoy Him. But, just because this was so, they were in fact very deeply concerned about conscience, for they held that conscience was the mental organ in men through which God brought His Word to bear on them. Nothing, therefore, in their estimation, was more important for any man than that his conscience should be enlightened, instructed, purged, and kept clean. To them, there could be no real spiritual understanding, or any genuine godliness, except as men exposed and enslaved their consciences to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-i-packer.html">J. I. Packer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Puritan Conscience’ in Puritan Papers</cite>, Vol. Two: 1960-1962 (P&amp;R, 2001), pp. 237-257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-ea8cc5f65b" data-kw="">
<blockquote><p>It is not unlawful of itself to sell poison, or give a knife to another, or to bid another to do it [sell the goods]; but if it were foreseen that they will be used to poison or kill the buyer, it is unlawful; and I think the [civil] Law would make him believe it that were guilty. It is not of itself unlawful to light a candle, or set fire on a straw; but if it may be foreknown that by another’s negligence or willfulness [that] it is like[ly] to set fire on the city, or give fire to a train or store of gun-powder that is under the Parliament House, when the King and Parliament are there, I crave the Bishop’s [his opponent’s] pardon for believing that it were sinful to do it, or command it;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bishop of Worcester’s Letter to a Friend for Vindication of Himself from Mr. Baxter’s Calumny</cite>, As quoted in George Morley, (London, 1662) no page numbers.</span></figcaption>

</figure><figure class="quote" id="q-550c0670fc" data-kw="">
<blockquote><p>The magistrate ought also to take care of the maintenance of the ministry, schools, poor, and of good works for necessary uses, that religion and learning may not want [lack] their necessary adminicles [helps]. Finally, he ought to take care that all churches be provided with an able, orthodox and godly ministry, and schools with learned and well-qualified teachers, such as shall be best approved by those to whom it belongs to examine and judge of their qualifications and parts…</p></blockquote>

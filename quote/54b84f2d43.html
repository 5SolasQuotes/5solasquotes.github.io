<main class="wrap"><figure class="quote" id="q-54b84f2d43" data-kw="">
<blockquote><p>It would spirit our faith, when we shall see his blood confirming an everlasting covenant, wherein God promises to be gracious. All the promises centred in the cross, received their life from his death, and are from thence reflected on us. Where can faith find a vigour but in the royalties of mercy, displayed in the satisfaction of justice? Where can it find a life, but in the views of its proper object?

When we behold a Christ crucified, how can we distrust God, that hath in that, as a plain tablet, writ this language, that he will spare nothing for us, since he hath not spared the best he had. What greater assurance can he give? Where is there anything in heaven or earth that can be a greater pledge of his affection?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of Christ Crucified</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 505.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c414af0a0e" data-kw="">
<blockquote><p>After correcting those with too low a view of assurance, Thomas McCrie corrected those who thought that subjective assurance was essential to faith:

Others go to an opposite extreme. They maintain that every true Christian always enjoys an absolute and unwavering certainty as to his final happiness—that he is a true believer and in a state of salvation; and they dwell on the assurance of faith to the neglect of the evidence which arises from Christian experience and growth in holiness. This is apt to cherish a spirit of presumption on the one hand, and to throw persons into a state of despondency on the other.

There are various degrees of assurance, and in some genuine believers it may be scarcely perceptible. He who is the author and finisher of our faith was careful not to break the bruised reed, or quench the smoking flax. While he rebuked the unbelief and unreasonable doubts of his disciples, he never called in question the reality of their faith. He received the man who said, “Lord, I believe, help thou mine unbelief.” While he said to Peter, “O thou of little faith, wherefore didst thou doubt?” he took him by the hand and lifted him out of the water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assurance in Sermons</cite></span></figcaption>

</figure><figure class="quote" id="q-5225b0e28a" data-kw="against conjectural certainty">
<blockquote><p>Our controversy here is with the same adversaries who oppose perseverance. The Romanists teach that the believer has no certainty save a conjectural certainty of his own faith; nor can any believer be certain that he believes in Christ with a true and not a hypocritical, with a living and not a dead faith, since all can variously both be deceived and deceive themselves (and often do).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.17.2</span></figcaption>

</figure><figure class="quote" id="q-32d1da2e3c" data-kw="">
<blockquote><p>There is much spurious humility among many of the dear saints of God. It is thought by some, that to be always doubting one&#x27;s pardon and acceptance, is the evidence of a lowly spirit. It is, allow us to say, the mark of the very opposite of a lowly and humble mind. That is true humility that credits the testimony of God, — that believes because he has spoken it, — that rests in the blood, and righteousness, and all-sufficiency of Jesus, because he has declared that &quot;whoever believes in him shall be saved.&quot; This is genuine lowliness, — the blessed product of the Eternal Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, pp. 74–75</span></figcaption>

</figure><figure class="quote" id="q-98297db55d" data-kw="">
<blockquote><p>But is it not really selfish to pay so much attention to personal assurance? There are some well-meaning Christians who, in spite of themselves, are inclined to think that the charge is true, and are therefore rather hesitant to speak about this assurance. But the objection is really absurd. The underlying assumption would seem to be that all attention to self with a view to its welfare, is selfish. It is a patent fact, however, that the Modernist himself does not believe that, for then he would also have to consider eating and drinking, hygienic measures, physical exercise, the cultivation of moral purity, etc., as thoroughly selfish, and yet these are the very things that are stressed by the social gospel. It is certainly no more selfish to cultivate spiritual, than it is to promote physical well-being. …

But seeking personal assurance is not in itself an evidence of selfishness. We may be seeking our spiritual well-being in this respect, in order that we may be more able to help others, to promote the cause of God, to reveal the glory of his grace, and to magnify Him for the riches of the inheritance which He has prepared for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assurance of Faith</cite>, (1928; Monergism Books, Kindle Edition, 2018), Kindle Locations 73-83.</span></figcaption>

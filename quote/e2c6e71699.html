<blockquote><p>But, ‘The fool saith in his heart there is no God.’ He secretly whispers in contradiction to nature, reason, conscience, authorities, there is no supreme invisible power to whom he is accountable.</p></blockquote>

</figure><figure class="quote" id="q-d675c99e57" data-kw="">
<blockquote><p>Many other arguments for the existence of God have been worked out in the course of time, among which the following come to mind: Aristotle’s argument from motion (Physics 8.5), St. Augustine’s proof from truth (On Free Choice 2.12-15), the famous argument of St. Anselm, the triple way of St. Bonaventure (Disputed Question on the Mystery of the Trinity q.1 a.1), the five ways of St. Thomas, the very fine demonstration of Scotus, Ockham’s proof from conservation (see Boehner, ‘Zu Ockhams Beweis der Existenz Gottes’, Franz. Stud. 32, 1950, 50ff), and the argument of Peter Auriol (see Schmücker, ‘Propositio per se nota, Gottesbeweis und ihr Verhältnis nach Petrus Aureoli, Franz. Forsch., Heft 8, Werl i., Westf., 1941).</p></blockquote>

</figure><figure class="quote" id="q-976da217e1" data-kw="atheism speculative practical">
<blockquote><p>While we admit there are many practical atheists, we deny that there are any speculative. A speculative atheist is either direct and express or indirect and interpretative. The direct is one who shakes off all knowledge and sense of deity; but such, properly speaking, there are none, because the sense of deity can never be wholly erased from the mind of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.2.2–3</span></figcaption>

</figure><figure class="quote" id="q-ebdb026542" data-kw="">
<blockquote><p>But if besides the testimonies of conscience which appear in very many, although they cannot appear in individuals, whence there is no need to dispute about the conscience of individuals–if, I say, besides these we also want to seek other testimonies, by which God is never destitute, and through which He can be found by groping, soon they will occur so infinitely that he who does not apprehend Him from any of them will have degenerated from man into a beast, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | “11th Problem: Whether the most excellent, most expeditious, most sufficient and only rule of proving the deity against atheists and among men, whoever they may at last be, provided that they are not devoid of judgment and a sane mind, is from the revelations made in the Old and New Testaments. | I respond: | And later, p. 188:</cite>, pp. 70-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

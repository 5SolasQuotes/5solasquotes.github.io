<main class="wrap"><figure class="quote" id="q-5e9b967c80" data-kw="">
<blockquote><p>…we conceive that God has given to some one single pastor, and far more to a synod of pastors and doctors a power to rebuke, teach, exhort with all authority, 2 Tim. 4:1-2, to charge, Tit. 2:15, them before the Lord, 1 Tim. 6:17, to lay on burdens and decrees, Acts 15:28; 16:4, and that all that hear them believe and receive as true what they speak in the Name of the Lord, according to that, ‘he that heareth you heareth Me; he that despiseth you, despiseth Me.’ [Lk. 10:16] He that will not hear an ambassador as an ambassador speaking from his master and prince, refuses to hear the prince that sent him; yet we say not that they are to be heard without controversy as they [Libertines] object, that is, peremptorily, absolutely as if their word were the very oracle of God, but they are to be heard, but not but after trying and searching, and not but conditionally, insofar as they carry the mind of God along with them, so that there may be an appeal to the Scripture and place left for examining and trying of their doctrine whether it be so or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, pp. 39-40</span></figcaption>

<blockquote><p>3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already. 4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.</p></blockquote>

<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 6-7</span></figcaption>

<blockquote><p>But they differ, in that the pastor labors in the word of exhortation, that is, by the gift of wisdom applies the word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labors in the word of doctrine, that is, without such applications as the pastor uses; by simple teaching he preserves the truth and sound interpretation of the Scriptures, against all heresy and error. The ruling elder doth neither of these, but labors in the government and policy of the church only. The Apostle has distinguished these three sorts of elders, 1 Tim. 5.17, “Let elders that rule well be counted worthy of double honor, especially they who labor in the word and doctrine.” Where, as [Theodore] Beza notes, he distinguished the word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7,8, he distinguishes teaching from exhortation; and 1 Cor. 12:8, puts “the word of wisdom,” and “the word of knowledge,” for two different things. Now, besides those elders which labor in the word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the word nor doctrine, but in ruling well. Hence it appears how truly the Book of Policy, ch. 2, says, That there are four ordinary, perpetual, and necessary offices in the church, the office of the pastor, the doctor, the elder, and the deacon; and that no other office, which is not one of these four, ought to be received, or suffered in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, ch. 2:</span></figcaption>

<blockquote><p>2. And as to the last edition of the Covenant of Grace by Christ [in the New Testament]: 1. The tenor of it extends to all; as is visible Mt. 28:19; Mk. 16:16; Jn. 3:16. 2. And Christ has made it the office of his ministers by his commission to promulgate and offer it to all. 3. And whereas providence concurs not to the universal execution, we must all confess, that Christ came not to put the world into a worse condition than He found them in. If He did any no good by his incarnation, He would do them no harm. Therefore they that never hear the Gospel, are still under the first edition of the Covenant made with Adam and Noah, so far as it is unaltered. I add that word [“so far as it is unaltered”], because, that so far as the promise was to give salvation by the Messiah hereafter to be incarnate, none is now bound to expect his future incarnation, because it is past. But the same benefits that were due to believers before Christs incarnation, are due since upon the true performance of so much of the condition as is still in force, and not repealed. … 4. And also, that more was required then, to be known particularly by the Jews that had the Scripture and tradition to acquaint them with the Messiah to come, than of the rest of the world, that had not those distinct discoveries, nor Abraham’s promises made known unto them: And how much Gen. 3:15 might cause them to understand, we may conjecture by the words. At least this much was required of all, that they believe that their sin deserves punishment and misery, and yet that God of his abundant mercy, by his wisdom securing his truth and justice, will pardon sin and grant salvation to all that truly believe and trust in that his wisdom and mercy, and repent of their sins, and unfeignedly give up themselves to God as their merciful Redeemer. Thus far we are agreed about the grace of the Covenant.</p></blockquote>

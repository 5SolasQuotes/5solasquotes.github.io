<main class="wrap"><figure class="quote" id="q-acfb5649fc" data-kw="">
<blockquote><p>V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations</cite>, (1645) on 1 Cor. 11 Featley wrote the comments on Paul’s epistles, and was an episcopalian, Westminster divine. This work was often known as The Westminster Annotations as 6 of the 11 contributors were Westminster divines.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3dcf8eb3d7" data-kw="">
<blockquote><p>We may… try to conceive the landscape, and the parish features generally, as the new incumbent [John Macmillan of Balmaghie] saw them in 1701… The dress of the people was on a par with their homes and fare. A Galloway man wore constantly, even in church, his broad blue bonnet, made in Kilmarnock… Young girls at home wore no head-covering, but snooded their locks with a piece of string or ribbon. At fair or church, they wore white linen mutches [linen caps], slightly plaited above the brow. The farmers’ wives covered their heads with coarse white linen toys [linen or wool headdresses that hang down over the shoulders] when they went a-visiting.¹ ¹ For all the above, I have drawn on Nicholson’s History, II. 332-339.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-m-reid.html">Henry M. Reid</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cameronian Apostle: being Some Account of John Macmillan of Balmaghie</cite>, (London: Gardner, 1896), pp. 50, 52</span></figcaption>

</figure><figure class="quote" id="q-e8be4d83c8" data-kw="">
<blockquote><p>I will quote thirty-two examples of κεφαλή used to mean “authority over” or “ruler” in Greek writings outside the New Testament (seventeen are from Greek translations of the Old Testament and fifteen are from other literature).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale</cite>, (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59, p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I will quote thirty-two examples of κεφαλή used to mean “authority over” or “ruler” in Greek writings outside the New Testament (seventeen are from Greek translations of the Old Testament and fifteen are from other literature).”

</figure><figure class="quote" id="q-aabf01b0f3" data-kw="">
<blockquote><p>Assertion Two. Yet in other things there ought to be great respect had to offense, and men ought to be swayed accordingly in their practice, as the former reasons clear. As (1), if the matter is of light concernment in itself, as how men’s gestures are in their walking (suppose in walking softly, or quickly, with cloak or without) men ought to do, or abstain, as may prevent the construction of pride, lightness, etc., or give occasion to others in any of these. Of such sort was womens’ praying with their heads uncovered amongst the Corinthians, it being then taken for an evil sign. Yet if it is necessary, there is nothing little, as Moses will not leave a hoof (Ex. 10)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, (Edinburgh, 1659), pt. 1, ch. 6, pp. 25-26</span></figcaption>

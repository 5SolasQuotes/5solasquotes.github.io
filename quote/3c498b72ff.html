<main class="wrap"><figure class="quote" id="q-3c498b72ff" data-kw="">
<blockquote><p>Grant, Almighty God, that as thou dost train us up with so much diligence and assiduous care, and regard us as dear and precious like an hereditary vine, – O grant, that we may not bring forth wild grapes, and that our fruit may not be bitter and unpleasant to thee, but that we may strive so to form our whole life in obedience to thy law, that all our actions and thoughts may be pleasant and sweet fruits to thee. And as there is ever some sin mixed up with our works, even when we desire to serve thee sincerely and from the heart, grant that all stains in our works may be so cleansed and washed away by the sacrifice of thy Son, that they may be to thee sacrifices of sweet odour, through the same, even Christ Jesus, who has so reconciled us to thee, as to obtain pardon even for our works. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prayers of John Calvin</cite>, (from his Commentary on Hosea)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01cb76a8c2" data-kw="">
<blockquote><p>Q. 75. What is sanctification? A. Sanctification is a work of God’s grace, whereby they whom God hath, before the foundation of the world, chosen to be holy, are in time, through the powerful operation of his Spirit[b] applying the death and resurrection of Christ unto them,[c] renewed in their whole man after the image of God;[d] having the seeds of repentance unto life, and all other saving graces, put into their hearts,[e] and those graces so stirred up, increased, and strengthened,[f] as that they more and more die unto sin, and rise unto newness of life.[g] [b] Eph. 1:4. 1 Cor. 6:11. 2 Thess. 2:13. [c] Rom. 6:4-6. [d] Eph. 4:23,24. [e] Acts 11:18. 1 John 3:9. [f] Jude 20. Heb. 6:11,12. Eph. 3:16-19. Col. 1:10,11. [g] Rom. 6:4,6,14. Gal. 5:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-a155569413" data-kw="">
<blockquote><p>When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.</p></blockquote>

</figure><figure class="quote" id="q-315e5be683" data-kw="">
<blockquote><p>…Which comes to pass thus:

1. By habitual grace infused, the sanctified will is constantly determined to embrace all spiritual good.

2. By assisting grace the will is stirred up, provoked, allured and inclined to obedience, through the proposal of the promises and the heavenly suggestions of the Holy Spirit.

3. By the same assisting grace all contrary motions of concupiscence are subdued and kept under. So that nothing can hinder obedience to follow; because by grace the will is made willing to obey and by grace all impediments in obeying are taken away: now when all lets are removed, what can let a willing mind to do that which it desires?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), p. 155</span></figcaption>

</figure><figure class="quote" id="q-e3cb1665bd" data-kw="">
<blockquote><p>Now yet this might stand, if as learned Mr. [William] Pemble and others assert, sanctification does, in order of nature, precede justification, and which to me seems not remote from truth, or prejudicial to the grace of justification at all, and withal consonant to right reason, for if (as all grant) justification be upon an act of faith on Christ for justification, and that not until then we are justified, as all do and must acknowledge that hold justification by faith, according to the Scriptures, and that an act of faith must proceed from a principle of faith habitually wrought, then necessarily sanctification, taking it for the principles of habitual sanctification, must be in order of nature afore justification; for the seed and principle of faith is a part, and a principal part, of regeneration or sanctification, as taken in that sense, for the working the principles of all grace, and so is agreeable to that order and chain, Rom. 8:29, where ‘called’ is put before being ‘justified,’ as predestination is put before being called, understanding calling, of the working [of] the principles of regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Man’s Restoration by Grace</cite>, ch. 5 in Works (Edinburgh: James Nichol, 1861), p. 537</span></figcaption>

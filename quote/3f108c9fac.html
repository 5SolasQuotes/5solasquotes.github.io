<main class="wrap"><figure class="quote" id="q-3f108c9fac" data-kw="">
<blockquote><p>That we really feed in the Holy Supper on the flesh and blood of Christ, no otherwise than as bread and wine are the aliments of our bodies, we freely confess. If a clearer explanation is asked, we say, that the substance of Christ’s flesh and blood is our spiritual life, and that it is communicated to us under the symbols of bread and wine; for Christ, in instituting the mystery of The Supper, promised nothing falsely, nor mocked us with a vain shew, but represented by external signs what he has really given us.

Now the question rests on the mode of communication; and hence the conflict arises, because we refuse to subscribe to their fancy respecting a local presence. We say, that though Christ is in heaven, yet through the hidden and incomprehensible power of his Spirit, this favor comes to us that His flesh becomes life to us, so that we become flesh of his flesh and bones of his bones. (Ephesians 5:30.) By them, on the contrary, it is maintained, that except Christ comes down on earth, there is no participation.

That they may, however, get rid of the absurdity of a local presence, it has been found necessary to fabricate the strange notion of ubiquity; which, if we think it not possible to reconcile to the principles of faith, we must beg them at least to pardon our ignorance. Here we follow not our own understanding; but according to the knowledge given us from above, we cannot comprehend that it is at all agreeable to Scripture to say that the body of Christ is everywhere. Both Christ himself and His Apostles clearly shew that the immensity of God does not belong to the flesh; a personal union is what they teach; and no one, except Eutyches, has hitherto taught, that the two natures became so blended, that when Christ became man, the attributes of Deity were communicated to his human nature.

I am not indeed disposed to raise an odium against them by means of a man who has been condemned; they are yet to be reminded to think more attentively, and to consider how contention leads astray even good, learned, and acute men, when they are led away only by a desire to defend their own cause. Doubtless the best and the shortest way of confronting Nestorius at the Council of Ephesus would have been to say, that personal union communicates to two natures what is peculiar to each: to adduce this no one thought of doing on account of its absolute absurdity. I therefore greatly wonder that they who oppose us do not consider into what labyrinth they plunge themselves.

For if the infinity of God appertains to the flesh of Christ, because God was manifested in the flesh, with equal reason His Divinity may be said to have grieved and to have been thirsty, and to have been subject to death, and, in short, to have died; for they cannot escape, as it is a similar mode of reasoning. Christ, while yet a mortal, declared that He knew not when the day of judgment would be. Does He not in these words clearly and distinctly ascribe something to His human nature which could not justly be ascribed to His Divinity? What they bring forward as to the communication of properties, it is unreasonable, and what I may say without offending them, they mistake in a matter that is very simple and plain; for to ascribe what is peculiar to Deity to the Son of man, and again to attribute to Deity what belongs only to humanity, is very improper and rash.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Book of the Prophet Jeremiah and the Lamentations</cite>, trans. and ed. John Owen (Geneva, 1589) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker Books, 1993), ix, pp xvii-xviii.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, pp. 566-67</span></figcaption>

<blockquote><p>5. The abuse of kneeling in the idolatrous action of elevation proceeds not from the nature of the action, but from the opinion of the agent, or rather from his will (for principium actionum humanarum [the principle of human actions], is not opinion, but will choosing that which opinion conceits to be chosen, or voluntas praeeunte luce intellectus). It is the will of the agent only which both makes the action of elevation to be idolatrous, and likewise kneeling in this action to receive the contagion of idolatry. For the elevation of the bread materialiter [materially], is not idolatrous (more than the lifting up of the bread among us by elders or deacons, when in taking it off the table, or setting it on, they lift it above the heads of the communicants), but formaliter [formally] only, as it is elevated with a will and intention to place it in state of worship. So likewise kneeling to the bread, materialiter [materially], is not idolatry (else a man were a idolater who should be against his will thrust down and holden by violence kneeling on his knees when the bread is elevated), but formaliter [formally], as it proceeds from a will and intention in men to give to the bread-elevated a state in that worship, and out of that respect to kneel before it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, p. 28</span></figcaption>

<blockquote><p>The intoxication of the spirit of the mind by the venom of error, is as much contrary to the divine nature and will, is as much hateful to the Spirit of light and truth, and as evidently damnable, as the corruption of the will, and inferior affections, or any member of the body with whatsoever vice, or more bodily transgression. […] Whence it necessarily follows, that it is more, at least no less unlawful for a Christian state to give any liberty or toleration to error, than to set up in every city and parish of their dominions, bordellos for uncleanness [houses of prostitution], stages for plays [1], and lists for duels. That a liberty for errors is no less hateful to God, no less hurtful to men, than a freedom without any punishment, without any discouragement, for all men, when and wheresoever they pleased, to kill, to steal, to rob, to commit adultery, or to do any of these mischiefs, which are most repugnant to the civil law, and destructive of human society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Errors &amp; induration are the great sins &amp; the great judgments of the time. Preached in a sermon before the Right Honourable House of Peers, in the Abbey-Church at Westminster, July 30, 1645, the day of the Monthly Fast in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“The intoxication of the spirit of the mind by the venom of error, is as much contrary to the divine nature and will, is as much hateful to the Spirit of light and truth, and as evidently damnable, as the corruption of the will, and inferior affections, or any member of the body with whatsoever vice, or more bodily transgression. […] Whence it necessarily follows, that it is more, at least no less unlawful for a Christian state to give any liberty or toleration to error, than to set up in every city and parish of their dominions, bordellos for uncleanness [houses of prostitution], stages for plays [1], and lists for duels. That a liberty for errors is no less hateful to God, no less hurtful to men, than a freedom without any punishment, without any discouragement, for all men, when and wheresoever they pleased, to kill, to steal, to rob, to commit adultery, or to do any of these mischiefs, which are most repugnant to the civil law, and destructive of human society.”

— Robert Baillie, Errors &amp; induration are the great sins &amp; the great judgments of the time. Preached in a sermon before the Right Honourable House of Peers, in the Abbey-Church at Westminster, July 30, 1645, the day of the Monthly Fast in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+intoxication+of+the+spirit+of+the+mind+by+the+venom+of+error%2C+is+as+much+contrary+to+the+divine+nature+and+will%2C+is+as+much+hateful+to+the+Spirit+of+light+and+truth%2C+and+as+evidently+damnable%2C+as+the+corruption+of+the+will%2C+and+inferior+affections%2C+or+any+member+of+the+body+with+whatsoever+vice%2C+or+more+bodily+transgression.+%5B%E2%80%A6%5D+Whence+it+necessarily+follows%2C+that+it+is+more%2C+at+least+no+less+unlawful+for+a+Christian+state+to+give+any+liberty+or+toleration+to+error%2C+than+to+set+up+in+every+city+and+parish+of+their+dominions%2C+bordellos+for+uncleanness+%5Bhouses+of+prostitution%5D%2C+stages+for+plays+%5B1%5D%2C+and+lists+for+duels.+That+a+liberty+for+errors+is+no+less+hateful+to+God%2C+no+less+hurtful+to+men%2C+than+a+freedom+without+any+punishment%2C+without+any+discouragement%2C+for+all+men%2C+when+and+wheresoever+they+pleased%2C+to+kill%2C+to+steal%2C+to+rob%2C+to+commit+adultery%2C+or+to+do+any+of+these+mischiefs%2C+which+are+most+repugnant+to+the+civil+law%2C+and+destructive+of+human+society.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Errors+%26+induration+are+the+great+sins+%26+the+great+judgments+of+the+time.+Preached+in+a+sermon+before+the+Right+Honourable+House+of+Peers%2C+in+the+Abbey-Church+at+Westminster%2C+July+30%2C+1645%2C+the+day+of+the+Monthly+Fast+in+Chris+Coldwell+%28ed.%29%2C+Sermons+preached+before+the+English+Houses+of+Parliament+&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8928f9c8e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8928f9c8e3.html">Perma <blockquote><p>I conclude, then, that it is wicked and despotic to deny both kinds to the laity, and that this is not within the power of any angel, much less of any pope or council. Nor does the Council of Constance﻿﻿ give me pause, for if its authority is valid, why not that of the Council of Basel as well, which decreed to the contrary that the Bohemians should be permitted to receive the sacrament in both kinds?</p></blockquote>

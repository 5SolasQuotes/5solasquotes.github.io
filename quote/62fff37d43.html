<blockquote><p>53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will. 54. There are five signs included in that old verse: He instructs, forbids, permits, counsels, and fuliflls. Because counseling coincides with instruction, it would have been better to have substituted: He promises.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e482cde2d" data-kw="">
<blockquote><p>O Jerusalem, Jerusalem! thou that kills the prophets and stones them which are sent unto thee, how often would I have gathered thy children together, even as a hen gathers her chickens under her wings, and ye would not.</p></blockquote>

</figure><figure class="quote" id="q-617cfcd054" data-kw="">
<blockquote><p>But though He wills all creatures as means and for his own sake, He wills some more than others to the degree they are more direct and suitable means for his glorification. God is a Father to all his creatures, but He is that especially to his children. His affection for everything He created is not as deep as his affection for his church, and that in turn is not as great as his love for Christ, the Son of his good pleasure. We speak of a general, a special, and a very special providence; in the same way we make as many distinctions in the will of God (as it relates to his creatures) as there are creatures. For the free will of God is as richly variegated as that whole world is. Hence, it must not be conceived as an indifferent power, a blind force, but as a rich and powerful divine energy, the wellspring of the abundant life that creation spreads out before our eyes. In that world, however, there is one thing that creates a special difficulty for the doctrine of the will of God, and that is the fact of evil, both evil as guilt and evil as punishment, in an ethical as well as a physical sense. Though evil is ever so much under God’s control, it cannot in the same sense and in the same way be the object of his will as the good. Hence, with a view to these two very different, in fact diametrically opposed, objects we must again make a distinction in that will of God, as Scripture itself shows. There is a big difference between the will of God that prescribes what we must do (Matt. 7:21; 12:50; John 4:34; 7:17; Rom. 12:2), and the will of God that tells us what He does and will do (Ps. 115:3; Dan. 4:17, 25,32,35; Rom. 9:18-19; Eph. 1:5,9,11; Rev. 4:11). The petition that God’s will may be done (Matt. 6:10) is very different in tenor from the childlike and resigned prayer: “Your will be done” (Matt. 26:42; Acts 21:14). Over and over in history we see the will of God assert itself in two ways. God commands Abraham to sacrifice his son, yet he does not let it happen (Gen. 22). He wants Pharaoh to let his people Israel go, yet hardens his heart so that he does not do it (Exod. 4:21). He has the prophet tell Hezekiah that he will die; still He adds fifteen years to his life (Isa. 38:1,5). He prohibits us from condemning the innocent, yet Jesus is delivered up according to the definite plan and foreknowledge of God (Acts 2:23; 3:18; 4:28). God does not will sin; He is far from iniquity. He forbids it and punishes it severely, yet it exists and is subject to his rule (Ex. 4:21; Josh. 11:20; 1 Sam. 2:25; 2 Sam. 16:10; Acts 2:23; 4:28; Rom. 1:24,26; 2 Thess. 2:11; etc.). He wills the salvation of all (Eze. 18:23,32; 33:11; 1 Tim. 2:4; 2 Pet. 3:9), yet has mercy on whom He wills and hardens whom He wills (Rom. 9:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Backer Academic, 2004), 2:241</span></figcaption>

<blockquote><p>2. Infidelity, that is occasioned and confirmed by prosperity in sin renders the gospel ineffectual to the salvation of men. The Word preached did not profit the Jews, not being mixed with faith in them that heard it. (Heb. 4:2)</p></blockquote>

<blockquote><p>XIX. Although God may be said to will the salvation of all by the will of sign [the revealed will] and to nill it by the beneplacit will [of decree], yet there is no contradiction here. Besides the fact that the universal proposition is to be understood not so much of the singulars of the genera as of the genera of the singulars, the former will relates to the mere approbation of God and the command of duty, while the latter is concerned with its futurition and fulfillment. The former denotes what is pleasing to God and what He has determined to enjoin upon man for the obtainment of salvation, but the latter what God Himself has decreed to do. But these two are not at variance: to will (i.e., to command man to believe) and to nill (i.e., to decree not to give him faith in order that he may believe)… XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, p. 224</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XIX. Although God may be said to will the salvation of all by the will of sign [the revealed will] and to nill it by the beneplacit will [of decree], yet there is no contradiction here. Besides the fact that the universal proposition is to be understood not so much of the singulars of the genera as of the genera of the singulars, the former will relates to the mere approbation of God and the command of duty, while the latter is concerned with its futurition and fulfillment. The former denotes what is pleasing to God and what He has determined to enjoin upon man for the obtainment of salvation, but the latter what God Himself has decreed to do. But these two are not at variance: to will (i.e., to command man to believe) and to nill (i.e., to decree not to give him faith in order that he may believe)… XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).”

— Francis Turretin, Institutes of Elenctic Theology, ed. Dennison, p. 224">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXIX.+Although+God+may+be+said+to+will+the+salvation+of+all+by+the+will+of+sign+%5Bthe+revealed+will%5D+and+to+nill+it+by+the+beneplacit+will+%5Bof+decree%5D%2C+yet+there+is+no+contradiction+here.+Besides+the+fact+that+the+universal+proposition+is+to+be+understood+not+so+much+of+the+singulars+of+the+genera+as+of+the+genera+of+the+singulars%2C+the+former+will+relates+to+the+mere+approbation+of+God+and+the+command+of+duty%2C+while+the+latter+is+concerned+with+its+futurition+and+fulfillment.+The+former+denotes+what+is+pleasing+to+God+and+what+He+has+determined+to+enjoin+upon+man+for+the+obtainment+of+salvation%2C+but+the+latter+what+God+Himself+has+decreed+to+do.+But+these+two+are+not+at+variance%3A+to+will+%28i.e.%2C+to+command+man+to+believe%29+and+to+nill+%28i.e.%2C+to+decree+not+to+give+him+faith+in+order+that+he+may+believe%29%E2%80%A6+XX.+The+will+of+sign+which+is+set+forth+as+extrinsic+ought+to+correspond+with+some+internal+will+in+God+that+it+may+not+be+false+and+deceptive%3B+but+that+internal+will+is+not+the+decree+concerning+the+gift+of+salvation+to+this+or+that+one%2C+but+the+decree+concerning+the+command+of+faith+and+promise+of+salvation+if+the+man+does+believe+%28which+is+founded+both+upon+the+connection+established+by+God+between+faith+and+salvation+and+the+internal+disposition+of+God+by+which%2C+as+He+loves+Himself%2C+He+cannot+but+love+his+image+wherever+He+sees+it+shining+and+is+so+much+pleased+with+the+faith+and+repentance+of+the+creature+as+to+grant+it+salvation%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+Dennison%2C+p.+224&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43e1577e97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/43e1577e97.html">Permalink</a><a class="src" href="https://reformedbooksonlin

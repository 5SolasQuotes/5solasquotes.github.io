<main class="wrap"><figure class="quote" id="q-c6632f6dbf" data-kw="">
<blockquote><p>Matters of faith I reduce to three: 1. Fundamental points. 2. Supra–fundamentalia, superstructions built upon fundamentals. 3. Circa-fundamentalia, things about matters of faith. For præter fundamentalia, things indifferent and beside the foundation in matters of religion, and moral carriage, I acknowledge none. Fundamentals are the vital and noble parts or the soul of divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-distinctions.html">Rutherford’s Distinctions</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries</cite>, … (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 3 Distinctions about Matters of Faith</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>(2) Because the apostle is so far from commanding separation from the Church of Corinth that he praises their meetings, 1 Cor. 5:4, 1 Cor. 11:20; 14:23. This notwithstanding the many gross scandals which were among them, 1 Cor. 1:11-13; 1 Cor. 5:1-2; 15:12-13. (3) Because the apostle calls the Galatians “the Church of Christ,” “brethren,” and “the children of God,” who were yet in some measure removed from God to another Gospel. Nay, says Paul, “O foolish,” (or senseless) “Galatians, who has bewitched you,” (that is, so blinded the eyes of your understanding, that you cannot see the right truth, as the jugglers bewitch the outward eyes, that men think they see that which they see not) “that you should not obey the truth;” Gal. 3:1. And yet since it was a constituted true Church, it was his judgment there should be no separation from it, notwithstanding all the foresaid faults. (4) Because the Church of Ephesus was a true Church, though they made defection from their first love. So was the Church of Pergamus, though there were in it who held the doctrine of Balaam. So was the Church of Thyatira, notwithstanding that they suffered Jezebel, who called herself a prophetess, and taught the servants of Christ to commit fornication, and to eat things sacrificed to idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error: a Commentary on the Westminster Confession of Faith</cite>, ... (d. 1663; Edinburgh: Reid, 1684), ch. 26, ‘Communion of the Saints’, question 1, pp. 258-59</span></figcaption>

<blockquote><p>[Margin note:] Which be the principal points of the catholic Faith or religion? Now, because I see some [persons] (not yielding unto these things which we have spoken in general concerning the fundamental or principal points of our religion) again to demand what those should be: I answer: That these articles are to be called grounds or principles, which being laid, the whole building remains: and which being overthrown, all things builded thereupon fall to the ground. And all these things we profess to have been described with great shortness and plainness out of the Word of God in the Creed which they call the Apostles’. Which thing ought to be added to the Ten Commandments and the Lord’s prayer, of the which, that, to wit, the Ten Commandments do very compendiously set out the order of Christian life: and this, that is, the Lord’s Prayer, does very briefly also set out, right invocation and prayer. This (I say) is that fundamental, true and perpetual mark of the catholic Church, which shall never be blotted out unto the world’s end: but which nevertheless ought to be expounded out of the writings of the prophets and apostles, from whence it is taken, that all men may understand it and keep it as much as in them lies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the True &amp; Visible Marks of the catholic Church</cite>, … (London: 1582), n.p.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2a7b099aba" data-kw="">
<blockquote><p>It is a very erroneous opinion to think, that we are justified, or do obtain remission of sins, by being assured, and much more by being fully assured of the forgiveness of our sins: or that we are to believe, that they are forgiven, to the end that they may be forgiven.

For justification and remission of sins is promised only to those that believe by a justifying faith, (I speak of those who are adulti, and are come to the years of discretion, not of infants, who are justified sometimes, before they actually believe) therefore a man must have justifying faith before he hath remission of sins, (for by faith we obtain remission of sins and by faith we are justified: and therefore have we believed in Christ, that we might be justified by the faith of Christ) A man’s sins must be forgiven, before he can be assured that they be forgiven &amp; it is absurd to imagine that the assurance that our sins be forgiven goeth before the forgiveness of them.

For if a man must believe or be assured of the forgiveness of sins before they be forgiven, then he is bound to believe that which is false. And lastly a man must ascend by divers degrees of assurance growing or proceeding from faith to faith before he can attain to full assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 94-95.</span></figcaption>

</figure><figure class="quote" id="q-32d1da2e3c" data-kw="">
<blockquote><p>There is much spurious humility among many of the dear saints of God. It is thought by some, that to be always doubting one&#x27;s pardon and acceptance, is the evidence of a lowly spirit. It is, allow us to say, the mark of the very opposite of a lowly and humble mind. That is true humility that credits the testimony of God, — that believes because he has spoken it, — that rests in the blood, and righteousness, and all-sufficiency of Jesus, because he has declared that &quot;whoever believes in him shall be saved.&quot; This is genuine lowliness, — the blessed product of the Eternal Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, pp. 74–75</span></figcaption>

</figure><figure class="quote" id="q-fb95a44548" data-kw="">
<blockquote><p>Although temporary believers and other unregenerate men, may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God and in a state of salvation, which hope of theirs shall perish; yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavouring to walk in all good conscience before him, may in this life be certainly assured that they are in the state of grace, and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.</p></blockquote>

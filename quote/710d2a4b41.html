<main class="wrap"><figure class="quote" id="q-710d2a4b41" data-kw="">
<blockquote><p>1… in [you, Edward Bagshaw] saying I deny the Scripture to be a perfect rule, when I still say, ‘It is a perfect rule so far as it is a rule’! 2. If you intend sense and truth, your argument must run thus: ‘He that says the Scripture is not a particular rule, commanding the thing in particular, but only a general rule, for the meter and tunes of psalms, for the dividing of itself into chapters and verses, for the hour and place of meetings, for the choice of a text to preach on, and words and method of sermon and prayer, for the naming or determining the person that shall be a pastor, for the form of pulpits, tables, cups, etc. yea, for the making of a clock, or watch, or hour-glass, to measure the time by, or for building the house to preach in, etc. He that says these are not determined of particularly in Scripture, but only under the general rule of doing all things to God’s glory, to edification, decently and in order, etc. this man does deny Scripture to be a perfect rule, and labors to overthrow the foundation of faith and practice, and proving what he says by the ill consequences that else will follow, will in the end be found in perfect folly and madness, reproved by God and found a liar: But such a one is R.B. Therefore, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London: Simmons, 1671), section 74, pp. 160-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

<blockquote><p>Therefore Divine Faith cannot be reduced or resolved into the authority of the Church, or into other simple external arguments which are wont to be called Motives by persuading and inducing things preparing to Faith; but it is to be resolved into the Scripture it self, and that authority which it hath imprinted upon it from the author God, as into the first and proper cause which causeth the thing to be believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, Book II, ch. V (Of Faith), thesis 29</span></figcaption>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

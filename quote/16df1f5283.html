</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-521b1ca99a" data-kw="">
<blockquote><p>2. Paul’s traditions which he delivered, were either concerning matters of doctrine and faith, which are perpetual, and they be all expressed in the Scriptures, or else of ceremonies which are mutable by authority of the church, according to time, places, and persons, observing the general rules prescribed by the Apostle, that all things be done in order and comeliness, and to edification. … 16. Paul saith, the apostles and church have no such custom to be contentious. Chrysostom, homily 27, in Epistle X. Cor. for matters of external order, yet does he give reasons for that order of covering women’s heads. By whose example the preachers are likewise to endeavour to satisfy by reason both men and women, that hurnbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. For so the apostle does not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confutation of the Rhemish Testament</cite>, … (1582; NY: 1834), on 1 Cor. 11:2, 16, p. 202 Fulke (1538–1589)</span></figcaption>

</figure><figure class="quote" id="q-6b90131019" data-kw="">
<blockquote><p>Hence Augustine says: ‘In all cases in which sacred Scripture has defined nothing definite, the customs of the people of God and the edicts of superiors must be regarded as the law.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, v. 16:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

— Thomas Aquinas, 1 Cor. 11 in Commentary on 1 Corinthians | on v. 16:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+Augustine+says%3A+%E2%80%98In+all+cases+in+which+sacred+Scripture+has+defined+nothing+definite%2C+the+customs+of+the+people+of+God+and+the+edicts+of+superiors+must+be+regarded+as+the+law.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+1+Cor.+11+in+Commentary+on+1+Corinthians+%7C+on+v.+16%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b90131019.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6b90131019.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=Hence%20Augustine%20says%3A%20%E2%80%98In%20all%20cases,must%20be%20regarded%20as%20the%20law&amp;text=Hence%20Augustine%20says%3A%20%E2%80%98In%20all%20cases%20in%20which&amp;text=of%20superiors%20must%20be%20regarded%20as%20the%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-53ba2a652c" data-kw="">
<blockquote><p>The custom in these parts [in France] is, to put off the hat, when in public acts the king is named: Moreover the Protestants [Anglicans] in England do ordain that men put off their hats at sermons when they hear the name of Jesus. In like manner all countries haue their customs: that which is ridiculous and superstitious in one place, is held and esteemed comely and religious in another. The most expedient way would be, instead of calling one another idolaters and heretics, to exhort one another charitably to do all to edification, to avoid the appearance of evil and excess, and not to scandalize the infidels and unbelievers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/morton-eudes.html">Morton Eudes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Traditions, or a Treatise of the Belief of the Christians of Asia, Europa &amp; Africa in the Principal Controversies of our Time</cite>, … (London, 1609), Question 42, Annotation Eudes was a Romanist., p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-31c09df0bd" data-kw="">
<blockquote><p>How can we deprive the Church of this liberty that it may not signify some thing by her actions and rites, the same being done, without placing any worship of God therein, modestly and in few things, so as the people of Christ be not burthened with ceremonies, and that better things be not letted [prevented]. But you will say [with respect to a white vestment], let them [ministers] show themselves to be angels, let them not signify it. I hear what you say. But the self same might have been answered unto Paul when he decreed unto the Corinthians that the woman should have her head covered, and the man uncovered, for he only urges a reason of the signification. For any man of the Church of Corinth might have answered: let the man show himself to be head of the woman, and let the woman in her deeds and life show herself to be subject unto the man, let them not contend to show this by signs. But the apostle saw this also to be a profitable thing, that we should not only live well, but that also we should by words and tokens be admonished of our duty. But and if hereby there be given an occasion of error unto the weak, let them be warned how they should believe these indifferent things, let them be taught by sermons that they judge not the worshipping of God to consist herein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, (d. 1562; London, 1583) | Theological Epistles, Epistle to John Hooper, pp. 119-20</span></figcaption>

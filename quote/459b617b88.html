<blockquote><p>§35. Question 28: May one person disoblige another of a promise made to him? Answer: Yes, if it be no more than a promise to that person: because a man may give away his right. But if it be moreover a vow to God, or you intend to oblige yourself in point of veracity under the guilt of a lie if you do otherwise, these alter the case and no person can herein disoblige you. §36. Question 29. But what if the contract be bound by an oath, may another then release me? Answer: Yes, if that oath did only tie you to perform your promise and were no vow to God which made him a party by dedicating anything to Him: For then the oath being but subservient to the promise, he that discharges you from the promise, discharges you also from the oath which bound you honestly to keep it. §37. Question 30: Am I bound by a promise when the cause or reason of it proves a mistake? Answer: If by the cause you mean only the extrinsic reasons which moved you to it, you may be obliged nevertheless for finding your mistake: Only so far as the other was the culpable cause (as is aforesaid) he is bound to satisfy you: But if by the cause you mean the formal reason, which constitutes the contract, then the mistake may in some cases nullify it (of which enough before). §38. Question 31. What if a following accident make it more to my hurt than could be foreseen? Answer: In some contracts it is supposed or expressed that men do undertake to run the hazard: and then they must stand obliged. But in some contracts, it is rationally supposed that the parties intend to be free if so great an alteration should fall out. But to give instances of both these cases would be too long a work. §39. Question 32: What if something unexpectedly fall out which makes it injurious to a third person? I sure cannot be obliged to injure another. Answer: If the case be the latter mentioned in the foregoing answer, you may be thus free: But if it be the former (you being supposed to run the hazard and secure the other party against all others) then either you were indeed authorized to make this bargain or not: If not, the third person may secure his right against the other. But if you were, then you must make satisfaction as you can to the third person. Yet, if you made a covenant without authority, you are obliged to save the other harmless, unless he knew your power to be doubtful and did resolve to run the hazard. §40. Question 33: What if somewhat fall out which makes the performance to be a sin? Answer: You must not do it: But you must make the other satisfaction for all the loss which you were the cause of unless he undertook to stand to the hazard of this also (explicitly or implicitly). §41. Question 34: Am I obliged if the other break covenant with me? Answer: There are covenants which make relations (as between husband and wife, pastor and flock, rulers and subjects), and covenants which convey title to commodities, of which only I am here to speak. And in these there are some conditions which are essential to the covenant: If the other first break these conditions, you are disobliged. But there are other conditions which are not essential, but only necessary to some following benefit: whose non-performance will only forfeit that particular benefit: and there are conditions which are only undertaken subsequent duties, trusted on the honesty of the performer: And in these a failing does not disoblige you. These latter are but improperly called conditions. §42. Question 35: May I contract to perform a thing which I foresee is like to become impossible or sinful before the time of performance come, though it be not so at present. Answer: With all persons you must deal truly; and with just contractors, openly: But with thieves and murderers, and persecutors, you are not always bound to deal openly. This being premised, either your covenant is absolutely, ‘This I will do, be it lawful or not, possible or impossible’: and such a covenant is sin and folly. Or it is conditional, ‘This I will do, if it continue lawful or possible.’ This condition (or rather exception) is still implied where it is not expressed, unless the contrary be expressed: Therefore such a covenant is lawful with a robber with whom you are not bound to deal openly: because it is but the concealing from him the event which you foresee. As e.g. you have intelligence that a ship is lost at sea, or is like to be shortly taken by pirates, which the robber expects shortly to come safe into the harbor: You may promise him to deliver up yourself his prisoner when that ship comes home. Or you know a person to be mortally sick and will die before the next week: you may oblige yourself to marry or serve that person two months hence: For it is implied if he or she be then alive. But with equal contractors, this is unlawful, with whom you are obliged not only to verity, but to justice, as in the following cases will be further manifested.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4d6caafe5" data-kw="">
<blockquote><p>Did the [Solemn League and] Covenant or our Profession [of Christianity] ever bind us to take the [Anglican] Liturgy, to be worse than it is, or the parish churches to be [considered] no churches, or their communion utterly unlawful? Or did it bind us to prefer a desertion of all public communion before it? No, it did not; but if it had, it had been sinful, and to be repented of. But, 1. We were bound by God’s word (and no covenant, or practices bind us to any more than Scripture binds us to) to avoid all that is sin. 2. And when we have our choice to prefer the best; he that does either turn to sin, or prefer a less good, when it is so, before a greater, goes back; but he that prefers no public worship before the parish worship goes back indeed and breaks the Covenant, by profaneness and schism. God’s Word is a clearer and surer test of our duty and controversies than any human covenants. When ministers were changed [in] 1647, many places got out [of the church] some tolerable weak ministers to get in abler men in [the churches in] great towns. When the bishops returned, their abler ministers being dead or ejected, they took the old ones again. Did these go back from Covenant Reformation or duty when they could have no better? Had not those been the revolters [to the Covenant] that would rather have had none?</p></blockquote>

<blockquote><p>…wager: ‘Tis called contractus sponsionis, a contract of promising, and is commonly used when there is some contest about the truth of a proposition, concerning something that is or is not in being already, or will or will not be hereafter, both parties agreeing that he who holds the truth shall have a reward and the other that asserted the falsehood shall be mulcted [fined]. The thing in itself is not absolutely unlawful or unjust, and may sometimes be of use to repress a foolish confidence. Also, where the engagement is only on one hand, whereby a man obliges himself to do a thing under a penalty; for here it may be of use, to stir up a laudable industry, provided such obligation, wager, or agreement be not to any matter that is sinful (as who shall drink most, who shall play a lascivious prank or offer an injurious abuse, etc.) provided also that it be not to the notable loss or hazard of any man, unless it does conduce to a greater public good (which cautions are seldom observed in common wagers), for in such cases the wager becomes sinful and is to be altogether avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-morton.html">Charles Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gaming-Humor Considered &amp; Reproved, or the Passion-Pleasure &amp; Exposing Money to Hazard by Play, Lot or Wager Examined</cite>, … (London: Cockerill, 1684), pp. 25-26 Morton (1627-1698) was an English, puritan, nonconformist minister.</span></figcaption>

<blockquote><p>I beseech you consider, that if when an oath whose institution by God is to be the end of all strife [Heb. 6:16], shall have a natural tendency to the maintaining of strife, division and contention, to be the occasion of wars and commotions in the land of our nativity, to administer matter and occasion of jealousy in our superiors, that while we judge ourselves bound in conscience by an oath that we have taken to endeavour to alter and change the government, whether he will or no, there can be no safety.</p></blockquote>

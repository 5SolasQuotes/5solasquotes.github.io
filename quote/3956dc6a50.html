<blockquote><p>Oliver Cromwell appointed a solemn dispute before him, whether the Jews (for money) should have a toleration, and when that good man Dr. Thomas Goodwin, and some other godly Independents had spoken much for it, Matthew Newcomen (that holy man) [a presbyterian] so opened the wickedness of turning loose a cursed generation to tempt a nation to infidelity, that is already too much inclined thereto, as turned the scales and put an end to that deliberation.</p></blockquote>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<blockquote><p>On occasion of this question it is asked whether those who come to the Faith from the Jews are to be received quickly or not, and similarly it can be asked concerning pagans. And it seems that not: a. from the fact that it is said in dist. 4, On Consecration, Jews, where it is said that for eight months they should enter within the catechumens of the church this threshold, and, if they are known to come with pure faith, only then should they merit the grace of baptism; the same is found there, Lest, which God forbid, where it is said that abstinence for forty days is enjoined. In both places therefore a great space of time is given for probation and for the work of penance to be carried out. But the contrary seems true:

1. From the fact that it is said, Acts 2:38, where Peter speaks to the Jews, saying: ‘Repent, and let each one of you be baptized.’ Since therefore they were baptized quickly, by his example it does not seem that reception into the Faith, or the sacrament of Faith, which is Baptism, should be deferred so long.

2. Likewise it is found, Acts 10:47-48, where it is said by Peter: ‘Can anyone forbid water, so that those who have received the Holy Spirit should not be baptized? And he commanded them to be baptized in the name of Jesus Christ.’ Acts 8:36-38. From these things therefore it seems that so great a delay is not fitting. [Solution]: To which it must be said that things were otherwise in the primitive Church in part and otherwise in the progress of the Church. For in the primitive Church there was the gift of the Holy Spirit, which was also shown in a visible sign in believers; there were also other signs manifesting faith in them; on account of which it was not necessary to defer the sacrament of Faith. But in the progress of the Church, where there were no such signs showing or powerfully proving faith, and hypocrisy of heart was hidden or could be hidden, a delay of time was necessary, so that there might be a testing of faith and catechesis, through which there would be enabling for baptism. And therefore according to the different times a different term was appointed according to earlier and later, so that it might be clear concerning the enabling for faith and that the ease of returning to vomit might be removed in the judgment of a discerning prelate, according as more or less it shall seem expedient. But such a term is left to the judgment of a discerning prelate, according as more or less it shall seem expedient.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“On occasion of this question it is asked whether those who come to the Faith from the Jews are to be received quickly or not, and similarly it can be asked concerning pagans. And it seems that not: a. from the fact that it is said in dist. 4, On Consecration, Jews, where it is said that for eight months they should enter within the catechumens of the church this threshold, and, if they are known to come with pure faith, only then should they merit the grace of baptism; the same is found there, Lest, which God forbid, where it is said that abstinence for forty days is enjoined. In both places therefore a great space of time is given for probation and for the work of penance to be carried out. But the contrary seems true:

1. From the fact that it is said, Acts 2:38, where Peter speaks to the Jews, saying: ‘Repent, and let each one of you be baptized.’ Since therefore they were baptized quickly, by his example it does not seem that reception into the Faith, or the sacrament of Faith, which is Baptism, should be deferred so long.

2. Likewise it is found, Acts 10:47-48, where it is said by Peter: ‘Can anyone forbid water, so that those who have received the Holy Spirit should not be baptized? And he commanded them to be baptized in the name of Jesus Christ.’ Acts 8:36-38. From these things therefore it seems that so great a delay is not fitting. [Solution]: To which it must be said that things were otherwise in the primitive Church in part and otherwise in the progress of the Church. For in the primitive Church there was the gift of the Holy Spirit, which was also shown in a visible sign in believers; there were also other signs manifesting faith in them; on account of which it was not necessary to defer the sacrament of Faith. But in the progress of the Church, where there were no such signs showing or powerfully proving faith, and hypocrisy of heart was hidden or could be hidden, a delay of time was necessary, so that there might be a testing of faith and catechesis, through which there would be enabling for baptism. And therefore according to the different times a different term was appointed according to earlier and later, so that it might be clear concerning the enabling for faith and that the ease of returning to vomit might be removed in the judgment of a discerning prelate, according as more or less it shall seem expedient. But such a term is left to the judgment of a discerning prelate, according as more or less it shall seem expedient.”

— Alexander of Hales, Sum of Universal Theology, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 5, ‘Whether those coming to the Faith are to be Quickly Received?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+occasion+of+this+question+it+is+asked+whether+those+who+come+to+the+Faith+from+the+Jews+are+to+be+received+quickly+or+not%2C+and+similarly+it+can+be+asked+concerning+pagans.+And+it+seems+that+not%3A+a.+from+the+fact+that+it+is+said+in+dist.+4%2C+On+Consecration%2C+Jews%2C+where+it+is+said+that+for+eight+months+they+should+enter+within+the+catechumens+of+the+church+this+threshold%2C+and%2C+if+they+are+known+to+come+with+pure+faith%2C+only+then+should+they+merit+the+grace+of+baptism%3B+the+same+is+found+there%2C+Lest%2C+which+God+forbid%2C+where+it+is+said+that+abstinence+for+forty+days+is+enjoined.+In+both+places+therefore+a+great+space+of+time+is+given+for+probation+and+for+the+work+of+penance+to+be+carried+out.+But+the+contrary+seems+true%3A+1.+From+the+fact+that+it+is+said%2C+Acts+2%3A38%2C+where+Peter+speaks+to+the+Jews%2C+saying%3A+%E2%80%98Repent%2C+and+let+each+one+of+you+be+baptized.%E2%80%99+Since+therefore+they+were+baptized+quickly%2C+by+his+example+it+does+not+seem+that+reception+into+the+Faith%2C+or+the+sacrament+of+Faith%2C+which+is+Baptism%2C+should+be+deferred+so+long.+2.+Likewise+it+is+found%2C+Acts+10%3A47-48%2C+where+it+is+said+by+Peter%3A+%E2%80%98Can+anyone+forbid+water%2C+so+that+those+who+have+received+the+Holy+Spirit+should+not+be+baptized%3F+And+he+commanded+them+to+be+baptized+in+the+name+of+Jesus+Christ.%E2%80%99+Acts+8%3A36-38.+From+these+things+therefore+it+seems+that+so+great+a+delay+is+not+fitting.+%5BSolution%5D%3A+To+which+it+must+be+said+that+things+were+otherwise+in+the+primitive+Church+in+part+and+otherwise+in+the+progress+of+the+Church.+For+in+the+primitive+Church+there+was+the+gift+of+the+Holy+Spirit%2C+which+was+also+shown+in+a+visible+sign+in+believers%3B+there+were+also+other+signs+manifesting+faith+in+them%3B+on+account+of+which+it+was+not+necessary+to+defer+the+sacrament+of+Faith.+But+in+the+progress+of+the+Church%2C+where+there+were+no+such+signs+showing+or+powerfully+proving+faith%2C+and+hypocrisy+of+heart+was+hidden+or+could+be+hidden%2C+a+delay+of+time+was+necessary%2C+so+that+there+might+be+a+testing+of+faith+and+catechesis%2C+through+which+there+would+be+enabling+for+baptism.+And+therefore+according+to+the+different+times+a+different+term+was+appointed+according+to+earlier+and+later%2C+so+that+it+might+be+clear+concerning+the+enabling+for+faith+and+that+the+ease+of+returning+to+vomit+might+be+removed+in+the+judgment+of+a+discerning+prelate%2C+according+as+more+or+less+it+shall+seem+expedient.+But+such+a+term+is+left+to+the+judgment+of+a+discerning+prelate%2C+according+as+more+or+less+it+shall+seem+expedient.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+1+%7C+ch.+5%2C+%E2%80%98Whether+those+coming+to+the+Faith+are+to+be+Quickly+Received%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb846f7892.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db846f7892.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=On%20occasion%20of%20this%20question%20it,or%20less%20it%20shall%20seem%20expedient&amp;text=On%20occasion%20of%20this%20question%20it%20is%20asked&amp;text=as%20more%20or%20less%20it%20shall%20seem%20expedient" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
